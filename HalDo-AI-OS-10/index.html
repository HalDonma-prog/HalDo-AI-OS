<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HalDo AI OS Professional 10.0</title>


    <link rel="stylesheet" href="css/main.css">


    <link rel="manifest" href="manifest.json">


    <meta name="theme-color" content="#2563eb">

</head>


<body>


<header class="top-bar">


    <div class="logo">
        🤖 HalDo AI OS
    </div>


    <div class="version">
        Professional 10.0
    </div>


</header>




<main class="home">


    <section class="welcome">


        <div class="logo-large">
            🤖
        </div>


        <h1>
            HalDo AI OS
        </h1>


        <h2>
            Professional 10.0
        </h2>


        <p>
            Das intelligente Betriebssystem der Zukunft.
        </p>



        <div class="system-card">


            <h3>
                System Status
            </h3>


            <p>
                🟢 Core System: Bereit
            </p>


            <p>
                🧠 HalDo AI Engine: Vorbereitet
            </p>


            <p>
                ⚡ PWA System: Aktiv
            </p>


        </div>




        <button onclick="openSystem()">

            🚀 System starten

        </button>



    </section>


</main>




<footer>


    <p>
        HalDo AI OS Professional 10.0
    </p>


</footer>





<script src="js/core/system.js"></script>


<script src="js/core/navigation.js"></script>




<script>


if ("serviceWorker" in navigator) {


    window.addEventListener(
        "load",
        function(){


            navigator.serviceWorker.register(
                "service-worker.js"
            )
            .then(function(){


                console.log(
                    "✅ HalDo AI OS Service Worker gestartet"
                );


            })
            .catch(function(error){


                console.log(
                    "❌ Service Worker Fehler:",
                    error
                );


            });


        }
    );


}


</script>




</body>


</html>
