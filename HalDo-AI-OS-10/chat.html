<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HalDo AI Chat</title>

    <link rel="stylesheet" href="css/main.css">

</head>


<body>


<header class="header">

    <div class="logo">
        🤖 HalDo AI Chat
    </div>

</header>



<main class="container">


    <h1>
        💬 HalDo AI Assistant
    </h1>


    <p>
        Foundation Build 001 – AI Chat Grundlage
    </p>



    <div id="chatBox" class="status-box">

        👋 Hallo! Ich bin HalDo AI.
        Wie kann ich helfen?

    </div>



    <input 
        id="userInput"
        type="text"
        placeholder="Nachricht eingeben..."
    >



    <button onclick="sendMessage()">

        🚀 Senden

    </button>



    <button onclick="goHome()">

        🏠 Startseite

    </button>



</main>




<script src="js/core/events.js"></script>

<script src="js/core/storage.js"></script>

<script src="js/core/router.js"></script>

<script src="js/core/system.js"></script>

<script src="js/core/navigation.js"></script>

<script src="js/app.js"></script>



<script>


function sendMessage(){


    const input = document.getElementById(
        "userInput"
    );


    const chat = document.getElementById(
        "chatBox"
    );


    if(input.value.trim() !== ""){


        chat.innerHTML +=
        "<br><br>👤 Du: " 
        + input.value
        +
        "<br>🤖 HalDo AI: Ich bin bereit für meine nächste Entwicklungsstufe.";


        input.value = "";


    }


}




function goHome(){


    window.location.href =
    "index.html";


}



</script>



</body>

</html>
