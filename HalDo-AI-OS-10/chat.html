<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>

<!-- Design System -->

<link rel="stylesheet" href="css/main.css">

</head>



<body>


<div class="os-container">



<header class="system-header">


<img
src="assets/logo.png"
alt="HalDo AI Logo"
class="logo"
>


<h1>

🤖 HalDo AI Chat

</h1>


<p>

Intelligente Kommunikation 16.0

</p>


</header>








<main id="app">



<section class="chat-box">



<h2>

HalDo AI Assistent

</h2>







<div 
id="chat-messages"
>


<div class="message ai">

🤖 Hallo! Ich bin HalDo AI.
<br>
Wie kann ich dir helfen?

</div>



</div>







<div class="chat-input">


<input

id="chat-input"

type="text"

placeholder="Nachricht eingeben..."

>




<button onclick="sendMessage()">

Senden

</button>



</div>







<div class="menu">



<button onclick="openPage('index.html')">

🏠 Startseite

</button>

</button>

</button>




</div>





</section>



</main>







<footer>


<p>

HalDo AI OS Professional 16.0

</p>


</footer>






</div>
