<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
HalDo Mail Center
</title>


<link rel="stylesheet"
href="mail.css">

</head>


<body>


<h1>
📧 HalDo Mail Center
</h1>



<div class="card">


<h2>
Neue Nachricht
</h2>

</button>


</div>



<div id="result">

</div>



<button onclick="back()">

⬅️ Zurück

</button>



<script src="mail.js"></script>


</body>


</html>
