<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
HalDo AI OS Einstellungen
</title>


<link rel="stylesheet" href="../../css/main.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/settings.css">


</head>



<body>


<div class="app-container">



<header class="app-header">


<h1>
⚙️ HalDo AI OS Einstellungen
</h1>


<p>
Personalisiere dein KI-System
</p>


</header>







<section class="settings-grid">



<div class="card">


<h2>
🌍 Sprache
</h2>


<select id="language-select">


<option value="de">
Deutsch
</option>


<option value="en">
English
</option>


<option value="tr">
Türkçe
</option>


<option value="ku">
Kurdî
</option>


<option value="ezd">
Ezdîkî
</option>


<option value="ar">
العربية
</option>


</select>



</div>







<div class="card">


<h2>
🎨 Design
</h2>


<button onclick="changeTheme('dark')">

🌙 Dark Mode

</button>


<button onclick="changeTheme('light')">

☀️ Light Mode

</button>



</div>







<div class="card">


<h2>
🔊 Stimme
</h2>


<button onclick="enableVoice()">

Aktivieren

</button>


<button onclick="disableVoice()">

Deaktivieren

</button>



</div>







<div class="card">


<h2>
🤖 KI Optionen
</h2>


<label>


<input type="checkbox" checked>

AI Antworten


</label>


<br>


<label>


<input type="checkbox" checked>

AI Memory


</label>



</div>




</section>







<nav class="app-menu">



<button onclick="location.href='../dashboard/index.html'">

📊 Dashboard

</button>




<button onclick="location.href='../chat/index.html'">

🤖 Chat

</button>




<button onclick="location.href='../../index.html'">

🏠 Start

</button>



</nav>







</div>






<script src="../../core/storage.js"></script>

<script src="../../core/language.js"></script>

<script src="../../js/settings.js"></script>



</body>


</html>
