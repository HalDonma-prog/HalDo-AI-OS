<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
HalDo AI OS Einstellungen
</title>


<link rel="stylesheet" href="settings.css">


</head>


<body>


<header>


<h1>
⚙️ Einstellungen
</h1>


<p>
HalDo AI OS Professional Ultimate 16.0
</p>


</header>



<main>


<section class="setting-card">


<h2>
👤 Benutzer
</h2>


<p>
Profil und persönliche Einstellungen
</p>


<button onclick="openProfile()">

Öffnen

</button>


</section>



<section class="setting-card">


<h2>
🌍 Sprache
</h2>


<select id="language">

<option value="de">

Deutsch

</option>


<option value="tr">

Türkçe

</option>


<option value="en">

English

</option>


</select>



<button onclick="saveLanguage()">

Speichern

</button>


</section>



<section class="setting-card">


<h2>
🎨 Design
</h2>


<button onclick="toggleTheme()">

Theme ändern

</button>


</section>



<section class="setting-card">


<h2>
🔐 Sicherheit
</h2>


<p>
Schutz und Berechtigungen
</p>


<button onclick="securityInfo()">

Prüfen

</button>


</section>



<section class="setting-card">


<h2>
🔄 Updates
</h2>


<button onclick="checkUpdates()">

Nach Updates suchen

</button>


</section>



</main>



<script src="../../core/storage.js"></script>

<script src="../../shared/js/navigation.js"></script>

<script src="settings.js"></script>


</body>

</html>
