<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
HalDo Health Center
</title>


<link rel="stylesheet"
href="health.css">


</head>


<body>


<h1>
❤️ Health Center
</h1>


<div class="card">


<h2>
🩺 Blutdruck
</h2>


<input 
id="blood"
placeholder="z.B. 120/80"
>


<button onclick="saveBlood()">
Speichern
</button>


<p id="bloodResult"></p>


</div>



<div class="card">


<h2>
🍬 Diabetes Notiz
</h2>


<textarea
id="diabetes"
placeholder="Werte oder Notizen">
</textarea>


<button onclick="saveDiabetes()">
Speichern
</button>


</div>



<div class="card">


<h2>
💊 Medikamente
</h2>


<textarea
id="medicine"
placeholder="Medikamente">
</textarea>


<button onclick="saveMedicine()">
Speichern
</button>


</div>



<div class="card">


<h2>
🏃 Sport & Bewegung
</h2>


<textarea
id="sport"
placeholder="Training / Schritte">
</textarea>


<button onclick="saveSport()">
Speichern
</button>


</div>



<button onclick="back()">

⬅️ Zurück

</button>



<script src="health.js"></script>


</body>

</html>
