<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HalDo AI Chat</title>

    <link rel="stylesheet" href="chat.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">

        🤖 HalDo AI

    </div>

    <ul class="menu">

        <li><a href="index.html">Start</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="#">Chat</a></li>

    </ul>

</nav>

<header class="hero">

    <h1>HalDo AI Chat</h1>

    <p>

        Willkommen im intelligenten Chat von HalDo AI.

    </p>

</header>

<main>

<section class="chat-window">

    <div id="messages">

        <div class="message ai">

            👋 Hallo!
            Ich bin HalDo AI.
            Wie kann ich dir helfen?

        </div>

    </div>

    <div class="chat-input">

        <input
            type="text"
            id="userInput"
            placeholder="Schreibe deine Nachricht...">

        <button id="sendButton">

            Senden

        </button>

    </div>

</section>
