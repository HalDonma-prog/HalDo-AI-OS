<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#050914"
>

<title>HalDo AI OS 18 — AI Chat</title>


<style>

/* =====================================================
   HALDO AI OS 18
   AI CHAT
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    color: #fff;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(0,126,255,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 80%,
            rgba(125,55,255,.12),
            transparent 30%
        ),
        #050914;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    overflow: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

.background {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}

.orb {

    position: absolute;

    width: 240px;
    height: 240px;

    border-radius: 50%;

    filter: blur(90px);

    opacity: .13;
}

.orb.one {

    top: -130px;
    left: -100px;

    background: #087cff;
}

.orb.two {

    right: -120px;
    bottom: 5%;

    background: #793dff;
}


/* =====================================================
   APP
===================================================== */

.app {

    position: relative;

    z-index: 1;

    width: min(950px,100%);

    height: 100vh;

    margin: auto;

    display: flex;

    flex-direction: column;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        8px 12px;

    background:
        rgba(5,9,20,.90);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);
}

.brand {

    display: flex;

    align-items: center;

    gap: 9px;
}

.logo {

    width: 43px;
    height: 43px;

    object-fit: contain;

    animation:
        logoRotate 10s linear infinite,
        logoGlow 2.4s ease-in-out infinite;
}

@keyframes logoRotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes logoGlow {

    0%,
    100% {

        filter:
            drop-shadow(
                0 0 5px
                rgba(255,255,255,.5)
            )
            drop-shadow(
                0 0 12px
                rgba(0,126,255,.5)
            );

    }

    50% {

        filter:
            drop-shadow(
                0 0 10px
                rgba(255,255,255,1)
            )
            drop-shadow(
                0 0 25px
                rgba(0,150,255,.9)
            );

    }
}

.brand-name strong {

    display: block;

    font-size: 14px;
}

.brand-name span {

    display: block;

    margin-top: 2px;

    color: #73829a;

    font-size: 8px;

    letter-spacing: .6px;
}

.header-actions {

    display: flex;

    gap: 6px;
}

.header-button {

    width: 35px;
    height: 35px;

    border-radius: 11px;

    color: #9bb0c9;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

    cursor: pointer;
}


/* =====================================================
   STATUS
===================================================== */

.status-bar {

    flex-shrink: 0;

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        7px 14px;

    color: #75849c;

    font-size: 8px;

    background:
        rgba(255,255,255,.018);

    border-bottom:
        1px solid
        rgba(255,255,255,.05);
}

.status-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #00e7a2;

    box-shadow:
        0 0 10px
        rgba(0,231,162,.9);

    animation:
        pulse 1.8s infinite;
}

@keyframes pulse {

    0%,
    100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }
}


/* =====================================================
   CHAT
===================================================== */

.chat {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        16px 12px 15px;

    scroll-behavior: smooth;

    scrollbar-width: thin;
}

.chat::-webkit-scrollbar {

    width: 4px;
}

.chat::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,.12);

    border-radius: 10px;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    max-width: 600px;

    margin:
        15px auto 25px;

    padding:
        21px;

    text-align: center;

    border-radius: 23px;

    background:
        linear-gradient(
            145deg,
            rgba(0,126,255,.08),
            rgba(120,55,255,.06)
        );

    border:
        1px solid
        rgba(255,255,255,.07);
}

.welcome-logo {

    width: 72px;
    height: 72px;

    object-fit: contain;

    animation:
        logoRotate 13s linear infinite,
        logoGlow 2.4s ease-in-out infinite;
}

.welcome h1 {

    margin-top: 10px;

    font-size: 21px;
}

.welcome p {

    margin-top: 7px;

    color: #77879f;

    font-size: 9px;

    line-height: 1.6;
}


/* =====================================================
   QUICK ACTIONS
===================================================== */

.quick-actions {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 7px;

    margin-top: 15px;
}

.quick {

    min-height: 42px;

    padding: 8px;

    border-radius: 12px;

    color: #91b9dc;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.07);

    font-size: 8px;

    cursor: pointer;
}


/* =====================================================
   MESSAGE
===================================================== */

.message-row {

    display: flex;

    margin:
        8px 0;
}

.message-row.user {

    justify-content: flex-end;
}

.message {

    max-width:
        min(78%,620px);

    padding:
        10px 12px;

    border-radius: 16px;

    font-size: 9px;

    line-height: 1.6;

    word-break: break-word;
}

.message.ai {

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.065);

    border-bottom-left-radius: 5px;
}

.message.user {

    background:
        rgba(0,126,255,.14);

    border:
        1px solid
        rgba(0,126,255,.18);

    border-bottom-right-radius: 5px;
}

.message-meta {

    margin-bottom: 4px;

    color: #68809d;

    font-size: 7px;
}


/* =====================================================
   TYPING
===================================================== */

.typing {

    display: none;

    width: fit-content;

    margin:
        7px 0;

    padding:
        10px 12px;

    border-radius: 15px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.06);
}

.typing.show {

    display: flex;

    gap: 4px;
}

.typing span {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #80a9cc;

    animation:
        typing 1.1s infinite;
}

.typing span:nth-child(2) {

    animation-delay: .15s;
}

.typing span:nth-child(3) {

    animation-delay: .30s;
}

@keyframes typing {

    0%,
    60%,
    100% {
        opacity: .25;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-3px);
    }
}


/* =====================================================
   INPUT AREA
===================================================== */

.input-zone {

    flex-shrink: 0;

    padding:
        8px 10px
        calc(8px + env(safe-area-inset-bottom));

    background:
        rgba(5,9,20,.94);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);
}

.input-tools {

    display: flex;

    gap: 5px;

    margin-bottom: 6px;

    overflow-x: auto;

    scrollbar-width: none;
}

.input-tools::-webkit-scrollbar {

    display: none;
}

.tool {

    flex-shrink: 0;

    min-height: 28px;

    padding:
        0 9px;

    border-radius: 10px;

    color: #7187a1;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.06);

    font-size: 7px;

    cursor: pointer;
}

.input-row {

    display: flex;

    align-items: flex-end;

    gap: 6px;
}

.text-wrap {

    flex: 1;

    position: relative;
}

#messageInput {

    width: 100%;

    min-height: 44px;

    max-height: 130px;

    resize: none;

    overflow-y: auto;

    padding:
        12px 42px 12px 12px;

    border-radius: 15px;

    outline: none;

    color: #e6f1ff;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.08);

    font-size: 10px;

    line-height: 1.4;
}

#messageInput::placeholder {

    color: #63738b;
}

.keyboard-button {

    position: absolute;

    right: 7px;
    bottom: 7px;

    width: 30px;
    height: 30px;

    border-radius: 9px;

    color: #8bc9f4;

    background:
        rgba(0,126,255,.08);

    border:
        1px solid
        rgba(0,126,255,.12);

    cursor: pointer;
}

.send {

    flex-shrink: 0;

    width: 45px;
    height: 45px;

    border-radius: 14px;

    color: #eaf7ff;

    background:
        rgba(0,126,255,.16);

    border:
        1px solid
        rgba(0,126,255,.20);

    cursor: pointer;

    font-size: 16px;
}

.send:active {

    transform: scale(.94);
}


/* =====================================================
   EZIDI KEYBOARD
===================================================== */

.keyboard-panel {

    position: fixed;

    z-index: 200;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        12px 10px
        calc(12px + env(safe-area-inset-bottom));

    background:
        rgba(7,12,25,.98);

    border-top:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 -15px 45px
        rgba(0,0,0,.42);

    transform:
        translateY(110%);

    transition:
        transform .22s ease;
}

.keyboard-panel.open {

    transform:
        translateY(0);
}

.keyboard-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 9px;
}

.keyboard-head strong {

    font-size: 10px;
}

.keyboard-head span {

    color: #687991;

    font-size: 7px;
}

.keyboard-close {

    width: 30px;
    height: 30px;

    border-radius: 9px;

    color: #9ab0c8;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.07);
}

.keyboard-grid {

    display: grid;

    grid-template-columns:
        repeat(8,1fr);

    gap: 5px;
}

.key {

    min-height: 38px;

    border-radius: 10px;

    color: #c8e6ff;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

    font-size: 13px;

    cursor: pointer;
}

.key:active {

    transform: scale(.94);

    background:
        rgba(0,126,255,.14);
}


/* =====================================================
   MODAL
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 300;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding: 10px;

    background:
        rgba(0,0,0,.52);

    backdrop-filter:
        blur(7px);

    -webkit-backdrop-filter:
        blur(7px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition: .2s ease;
}

.overlay.open {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.panel {

    width:
        min(580px,100%);

    padding: 17px;

    border-radius:
        22px 22px 16px 16px;

    background:
        #0a1222;

    border:
        1px solid
        rgba(255,255,255,.09);
}

.panel-head {

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.panel-head strong {

    font-size: 12px;
}

.panel-close {

    width: 32px;
    height: 32px;

    border-radius: 10px;

    color: #9eb1c7;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.07);
}

.panel-content {

    margin-top: 14px;

    color: #8190a7;

    font-size: 9px;

    line-height: 1.7;
}


/* =====================================================
   TOAST
===================================================== */

.toast {

    position: fixed;

    z-index: 500;

    left: 50%;

    bottom: 75px;

    padding:
        9px 13px;

    border-radius: 12px;

    color: #dcecff;

    background:
        rgba(18,28,47,.96);

    border:
        1px solid
        rgba(255,255,255,.09);

    font-size: 8px;

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%,10px);

    transition: .2s ease;
}

.toast.show {

    opacity: 1;

    transform:
        translate(-50%,0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (min-width:700px) {

    .quick-actions {

        grid-template-columns:
            repeat(4,1fr);

    }

    .keyboard-grid {

        grid-template-columns:
            repeat(12,1fr);

    }

}

</style>

</head>


<body>

<script>

/* =====================================================
   HALDO AI CHAT CORE
===================================================== */

const STORAGE_KEY =
    "haldo_ai_chat_os18";


const input =
    document.getElementById(
        "messageInput"
    );


const messages =
    document.getElementById(
        "messages"
    );


const chat =
    document.getElementById(
        "chat"
    );


const typing =
    document.getElementById(
        "typing"
    );


const welcome =
    document.getElementById(
        "welcome"
    );


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadChat();

        resizeInput();

        input.focus();

    }
);


/* =====================================================
   INPUT
===================================================== */

input.addEventListener(
    "input",
    resizeInput
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
            &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


function resizeInput() {

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            130
        ) + "px";

}


/* =====================================================
   SEND
===================================================== */

function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {

        showToast(
            "Bitte zuerst eine Nachricht eingeben."
        );

        return;

    }


    addMessage(
        "user",
        text
    );


    input.value = "";

    resizeInput();


    hideWelcome();


    saveChat();


    showTyping();


    setTimeout(
        function() {

            hideTyping();

            addMessage(
                "ai",
                createLocalResponse(
                    text
                )
            );

            saveChat();

        },
        650
    );

}


/* =====================================================
   QUICK MESSAGE
===================================================== */

function quickMessage(
    text
) {

    input.value =
        text;

    resizeInput();

    sendMessage();

}


/* =====================================================
   INSERT
===================================================== */

function insertText(
    text
) {

    input.focus();


    const start =
        input.selectionStart;

    const end =
        input.selectionEnd;


    input.value =
        input.value.substring(
            0,
            start
        )
        +
        text
        +
        input.value.substring(
            end
        );


    input.selectionStart =
        input.selectionEnd =
            start +
            text.length;


    resizeInput();

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
    type,
    text
) {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row " +
        (
            type === "user"
                ? "user"
                : ""
        );


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message " +
        (
            type === "user"
                ? "user"
                : "ai"
        );


    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "message-meta";


    meta.textContent =
        type === "user"
            ? "DU"
            : "HALDO AI";


    const content =
        document.createElement(
            "div"
        );


    content.textContent =
        text;


    bubble.appendChild(
        meta
    );

    bubble.appendChild(
        content
    );

    row.appendChild(
        bubble
    );

    messages.appendChild(
        row
    );


    scrollBottom();

}


/* =====================================================

function createLocalResponse(

) {

    const lower =

        lower.includes("hallo")

        lower.includes("hi")
        ||
        lower.includes("hey")
    ) {

            "Hallo Bruder! 💙❤️🚀 " +

/* =====================================================
   WELCOME
===================================================== */

function hideWelcome() {

    welcome.style.display =
        "none";

}


/* =====================================================
   TYPING
===================================================== */

function showTyping() {

    typing.classList.add(
        "show"
    );

    scrollBottom();

}


function hideTyping() {

    typing.classList.remove(
        "show"
    );

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom() {

    requestAnimationFrame(
        function() {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* =====================================================
   SAVE
===================================================== */

function saveChat() {

    const data = [];


    document
        .querySelectorAll(
            ".message-row"
        )
        .forEach(
            function(row) {

                const bubble =
                    row.querySelector(
                        ".message"
                    );

                const content =
                    bubble.lastElementChild;


                data.push({

                    type:
                        bubble.classList.contains(
                            "user"
                        )
                            ? "user"
                            : "ai",

                    text:
                        content.textContent

                });

            }
        );


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                data
            )
        );

    } catch {

        showToast(
            "Chat konnte nicht gespeichert werden."
        );

    }

}


/* =====================================================
   LOAD
===================================================== */

function loadChat() {

    let data = [];


    try {

        data =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_KEY
                ) || "[]"
            );

    } catch {

        data = [];

    }


    if (
        !Array.isArray(data)
        ||
        data.length === 0
    ) {

        return;

    }


    hideWelcome();


    data.forEach(
        function(item) {

            if (
                item &&
                (
                    item.type === "user"
                    ||
                    item.type === "ai"
                )
            ) {

                addMessage(
                    item.type,
                    String(
                        item.text || ""
                    )
                );

            }

        }
    );

}


/* =====================================================
   CLEAR
===================================================== */

function clearChat() {

    if (
        !confirm(
            "Den gesamten HalDo AI Chat löschen?"
        )
    ) {

        return;

    }


    messages.innerHTML =
        "";


    localStorage.removeItem(
        STORAGE_KEY
    );


    welcome.style.display =
        "";


    showToast(
        "Chat wurde gelöscht."
    );

}

    );

function keyInsert(

) {

/* =====================================================
   PANEL
===================================================== */

const overlay =
    document.getElementById(
        "overlay"
    );


const panelTitle =
    document.getElementById(
        "panelTitle"
    );


const panelContent =
    document.getElementById(
        "panelContent"
    );


function openPanel(
    title,
    content
) {

    panelTitle.textContent =
        title;

    panelContent.textContent =
        content;

    overlay.classList.add(
        "open"
    );

}


function closePanel() {

    overlay.classList.remove(
        "open"
    );

}


function closePanelOutside(
    event
) {

    if (
        event.target === overlay
    ) {

        closePanel();

    }

}


/* =====================================================
   HOME
===================================================== */

function openHome() {

    window.location.href =
        "index.html";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
    text
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            keyboardPanel.classList.remove(
                "open"
            );

            closePanel();

        }

    }
);
