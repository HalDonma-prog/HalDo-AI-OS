<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
HalDo AI OS - KI Chat
</title>


<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/responsive.css">


</head>


<body>


<div class="os-container">


<header class="system-header">


<img
src="assets/logo.png"
alt="HalDo AI Logo"
class="logo"
>


<h1>
🤖 HalDo AI Chat
</h1>


<p>
Intelligenter Assistent von HalDo AI OS 16.0
</p>


</header>




<main id="app">


<section class="chat-panel">


<h2>
KI Chat
</h2>




<div
id="chat-area"
class="chat-area"
>


<p>
👋 Hallo! Ich bin HalDo AI. Wie kann ich helfen?
</p>


</div>





<div class="chat-input">


<input
id="chat-input"
type="text"
placeholder="Nachricht eingeben..."
>



<button onclick="sendChatMessage()">

Senden

</button>


</div>





<button onclick="goHome()">

⬅️ Zurück

</button>



</section>


</main>



<footer>

HalDo AI OS Professional 16.0

</footer>



</div>





<!-- Core -->

<script src="core/config.js"></script>
<script src="core/logger.js"></script>
<script src="core/events.js"></script>
<script src="core/storage.js"></script>
<script src="core/kernel.js"></script>
<script src="core/router.js"></script>
<script src="core/system.js"></script>


<!-- Application -->

<script src="js/navigation.js"></script>
<script src="js/modules.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>


<script>

function sendChatMessage(){


const input =

document.getElementById(
"chat-input"
);


if(input.value.trim()){


HalDoChat.send(

input.value

);


input.value = "";


}


}


</script>


</body>

</html>
