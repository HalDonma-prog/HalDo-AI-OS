<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070914"
    >

    <title>
        HalDo AI OS 20 — Dashboard
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(100,120,255,.16),
                    transparent 40%
                ),
                #050711;
            color: #ffffff;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =================================================
           DASHBOARD
           ================================================= */

        .dashboard {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: 68px 1fr 58px;
        }


        /* =================================================
           TOP BAR
           ================================================= */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 20px;
            border-bottom:
                1px solid
                rgba(255,255,255,.08);
            background:
                rgba(8,10,24,.72);
            backdrop-filter:
                blur(20px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            font-weight: 900;
            font-size: 20px;
            background:
                radial-gradient(
                    circle,
                    rgba(180,200,255,.9),
                    rgba(70,80,170,.55)
                );
            box-shadow:
                0 0 25px
                rgba(110,140,255,.3);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-text strong {
            display: block;
            font-size: 15px;
        }

        .brand-text small {
            display: block;
            margin-top: 2px;
            opacity: .52;
            font-size: 11px;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
            opacity: .72;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #7dffb2;
            box-shadow:
                0 0 12px
                rgba(125,255,178,.7);
        }


        /* =================================================
           MAIN
           ================================================= */

        .main {
            min-height: 0;
            overflow: auto;
            padding: 22px;
        }

        .content {
            width: min(
                1200px,
                100%
            );
            margin: 0 auto;
        }


        /* =================================================
           WELCOME
           ================================================= */

        .welcome {
            padding: 24px;
            margin-bottom: 18px;
            border:
                1px solid
                rgba(255,255,255,.08);
            border-radius: 24px;
            background:
                linear-gradient(
                    135deg,
                    rgba(120,140,255,.10),
                    rgba(255,255,255,.025)
                );
        }

        .welcome h1 {
            margin: 0;
            font-size:
                clamp(
                    25px,
                    5vw,
                    40px
                );
            letter-spacing: -.035em;
        }

        .welcome p {
            margin:
                9px 0 0;
            opacity: .55;
            line-height: 1.5;
        }


        /* =================================================
           QUICK ACTIONS
           ================================================= */

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin:
                22px 2px 12px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 17px;
        }

        .section-title small {
            opacity: .45;
        }

        .apps {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        170px,
                        1fr
                    )
                );
            gap: 13px;
        }

        .app-button {
            appearance: none;
            width: 100%;
            min-height: 145px;
            padding: 17px;
            border:
                1px solid
                rgba(255,255,255,.08);
            border-radius: 19px;
            background:
                rgba(255,255,255,.035);
            color: inherit;
            text-align: left;
            transition:
                transform .18s ease,
                background .18s ease,
                border-color .18s ease;
        }

        .app-button:hover {
            transform:
                translateY(-2px);
            background:
                rgba(255,255,255,.075);
            border-color:
                rgba(255,255,255,.16);
        }

        .app-icon {
            display: block;
            font-size: 31px;
            margin-bottom: 12px;
        }

        .app-button strong {
            display: block;
            font-size: 14px;
        }

        .app-button small {
            display: block;
            margin-top: 5px;
            opacity: .48;
            line-height: 1.35;
        }


        /* =================================================
           SYSTEM CARDS
           ================================================= */

        .system-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    3,
                    minmax(
                        0,
                        1fr
                    )
                );
            gap: 13px;
        }

        .system-card {
            padding: 17px;
            border:
                1px solid
                rgba(255,255,255,.08);
            border-radius: 18px;
            background:
                rgba(255,255,255,.03);
        }

        .system-card small {
            display: block;
            opacity: .45;
            margin-bottom: 7px;
        }

        .system-card strong {
            font-size: 18px;
        }


        /* =================================================
           AI PANEL
           ================================================= */

        .ai-panel {
            margin-top: 18px;
            padding: 18px;
            border:
                1px solid
                rgba(255,255,255,.08);
            border-radius: 20px;
            background:
                rgba(255,255,255,.03);
        }

        .ai-panel h2 {
            margin:
                0 0 12px;
            font-size: 17px;
        }

        .ai-form {
            display: flex;
            gap: 9px;
        }

        .ai-form input {
            flex: 1;
            min-width: 0;
            padding:
                12px 14px;
            border:
                1px solid
                rgba(255,255,255,.1);
            border-radius: 13px;
            outline: none;
            background:
                rgba(0,0,0,.16);
            color: inherit;
        }

        .ai-form button {
            padding:
                12px 17px;
            border: 0;
            border-radius: 13px;
            background:
                rgba(120,140,255,.25);
            color: inherit;
        }

        .ai-output {
            min-height: 20px;
            margin-top: 13px;
            opacity: .62;
            line-height: 1.5;
            white-space: pre-wrap;
        }


        /* =================================================
           BOTTOM BAR
           ================================================= */

        .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 18px;
            border-top:
                1px solid
                rgba(255,255,255,.08);
            background:
                rgba(8,10,24,.72);
            backdrop-filter:
                blur(20px);
        }

        .bottom-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bottom button {
            border:
                1px solid
                rgba(255,255,255,.08);
            background:
                rgba(255,255,255,.035);
            color: inherit;
            padding:
                8px 12px;
            border-radius: 10px;
        }

        .version {
            opacity: .38;
            font-size: 11px;
        }


        /* =================================================
           MOBILE
           ================================================= */

        @media (
            max-width: 700px
        ) {

            .dashboard {
                grid-template-rows:
                    62px 1fr 55px;
            }

            .main {
                padding: 14px;
            }

            .topbar {
                padding:
                    0 14px;
            }

            .system-grid {
                grid-template-columns:
                    1fr;
            }

            .apps {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0,1fr)
                    );
            }

            .app-button {
                min-height: 125px;
            }

            .ai-form {
                flex-direction:
                    column;
            }

        }

    </style>
</head>

<body>

<div
    class="dashboard"
    id="haldo-dashboard"
>

    <!-- ===============================================
         TOP BAR
         =============================================== -->

    <header
        class="topbar"
    >

        <div
            class="brand"
        >

            <div
                class="brand-logo"
                aria-hidden="true"
            >
                H
            </div>

            <div
                class="brand-text"
            >

                <strong>
                    HalDo AI OS
                </strong>

                <small>
                    Professional Ultimate Foundation
                </small>

            </div>

        </div>

        <div
            class="system-status"
        >

            <span
                class="status-dot"
                id="status-dot"
            ></span>

            <span
                id="status-text"
            >
                System wird geprüft …
            </span>

        </div>

    </header>


    <!-- ===============================================
         MAIN
         =============================================== -->

    <main
        class="main"
    >

        <div
            class="content"
        >

            <section
                class="welcome"
            >

                <h1
                    id="welcome-title"
                >
                    Willkommen bei HalDo AI OS
                </h1>

                <p
                    id="welcome-subtitle"
                >
                    Dein intelligenter digitaler
                    Arbeitsplatz.
                </p>

            </section>


            <!-- =========================================
                 APPS
                 ========================================= -->

            <div
                class="section-title"
            >

                <h2>
                    Deine Apps
                </h2>

                <small
                    id="app-count"
                >
                    0 Apps
                </small>

            </div>

            <section
                class="apps"
                id="app-grid"
            ></section>


            <!-- =========================================
                 SYSTEM
                 ========================================= -->

            <div
                class="section-title"
            >

                <h2>
                    System
                </h2>

                <small>
                    HalDo AI OS 20
                </small>

            </div>

            <section
                class="system-grid"
            >

                <article
                    class="system-card"
                >

                    <small>
                        Version
                    </small>

                    <strong>
                        20.0.0
                    </strong>

                </article>

                <article
                    class="system-card"
                >

                    <small>
                        Netzwerk
                    </small>

                    <strong
                        id="network-status"
                    >
                        –
                    </strong>

                </article>

                <article
                    class="system-card"
                >

                    <small>
                        Boot
                    </small>

                    <strong
                        id="boot-status"
                    >
                        –
                    </strong>

                </article>

            </section>


            <!-- =========================================
                 AI
                 ========================================= -->

            <section
                class="ai-panel"
            >

                <h2>
                    HalDo AI
                </h2>

                <form
                    class="ai-form"
                    id="ai-form"
                >

                    <input
                        id="ai-input"
                        type="text"
                        autocomplete="off"
                        placeholder="Frag HalDo AI …"
                    >

                    <button
                        type="submit"
                    >
                        Senden
                    </button>

                </form>

                <div
                    class="ai-output"
                    id="ai-output"
                >
                    HalDo AI ist bereit.
                </div>

            </section>

        </div>

    </main>


    <!-- ===============================================
         BOTTOM BAR
         =============================================== -->

    <footer
        class="bottom"
    >

        <div
            class="bottom-left"
        >

            <button
                type="button"
                id="launcher-button"
            >
                ☰ Launcher
            </button>

            <button
                type="button"
                id="settings-button"
            >
                ⚙ Einstellungen
            </button>

        </div>

        <div
            class="version"
        >
            HalDo AI OS 20
        </div>

    </footer>

</div>


<script>
"use strict";

(function () {

    /*
     * =====================================================
     * HALDO DASHBOARD
     *
     * Diese Datei erzeugt KEINEN neuen Kernel.
     * Sie benutzt die bestehende HalDo-Laufzeit.
     * =====================================================
     */

    const H =
        window.HalDo;

    const $ =
        selector =>
            document.querySelector(
                selector
            );


    /* =====================================================
       DOM
       ===================================================== */

    const appGrid =
        $("#app-grid");

    const appCount =
        $("#app-count");

    const statusText =
        $("#status-text");

    const statusDot =
        $("#status-dot");

    const networkStatus =
        $("#network-status");

    const bootStatus =
        $("#boot-status");

    const aiForm =
        $("#ai-form");

    const aiInput =
        $("#ai-input");

    const aiOutput =
        $("#ai-output");


    /* =====================================================
       SAFE HELPERS
       ===================================================== */

    function emit(
        event,
        detail
    ) {

        try {

            if (
                H &&
                typeof H.emit ===
                "function"
            ) {

                H.emit(
                    event,
                    detail
                );

            }

        } catch (error) {}

    }


    function getApps() {

        try {

            if (
                H?.appRegistry &&
                typeof H.appRegistry.list ===
                "function"
            ) {

                const apps =
                    H.appRegistry.list({
                        enabledOnly:
                            true
                    });

                if (
                    Array.isArray(
                        apps
                    )
                ) {

                    return apps;

                }

            }

        } catch (error) {

            console.warn(
                "HalDo App Registry:",
                error
            );

        }

        return [];

    }


    /* =====================================================
       APP ICON
       ===================================================== */

    function getIcon(
        app
    ) {

        return (
            app.icon ||
            app.emoji ||
            "◈"
        );

    }


    /* =====================================================
       APP ID
       ===================================================== */

    function getId(
        app
    ) {

        return (
            app.id ||
            app.appId ||
            app.name
        );

    }


    /* =====================================================
       OPEN APP
       ===================================================== */

    async function openApp(
        app
    ) {

        const id =
            getId(
                app
            );

        if (!id) {
            return;
        }

        try {

            if (
                H &&
                typeof H.openApp ===
                "function"
            ) {

                await H.openApp(
                    id
                );

                emit(
                    "dashboard:app-open",
                    {
                        id
                    }
                );

                return;

            }

            if (
                H?.appManager &&
                typeof H.appManager.open ===
                "function"
            ) {

                await H.appManager.open(
                    id
                );

                return;

            }

            if (
                H?.router &&
                typeof H.router.navigate ===
                "function"
            ) {

                await H.router.navigate(
                    id
                );

                return;

            }

            /*
             * Letzter sicherer Fallback:
             * Wenn die App selbst eine URL besitzt,
             * kann sie direkt geöffnet werden.
             */

            if (
                app.url
            ) {

                window.location.href =
                    app.url;

            }

        } catch (error) {

            console.error(
                "HalDo App konnte nicht geöffnet werden:",
                error
            );

            aiOutput.textContent =
                "Die App konnte momentan nicht geöffnet werden.";

        }

    }


    /* =====================================================
       RENDER APPS
       ===================================================== */

    function renderApps() {

        const apps =
            getApps();

        appGrid.innerHTML =
            "";

        /*
         * Wenn Registry vorhanden ist,
         * zeigen wir ausschließlich registrierte Apps.
         */

        for (
            const app of apps
        ) {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "app-button";

            button.innerHTML = `

                <span
                    class="app-icon"
                >
                    ${escapeHTML(
                        getIcon(app)
                    )}
                </span>

                <strong>
                    ${escapeHTML(
                        app.name ||
                        app.title ||
                        getId(app)
                    )}
                </strong>

                <small>
                    ${escapeHTML(
                        app.description ||
                        "HalDo System App"
                    )}
                </small>

            `;

            button.addEventListener(
                "click",
                () => {

                    openApp(
                        app
                    );

                }
            );

            appGrid.appendChild(
                button
            );

        }

        appCount.textContent =
            `${apps.length} ${
                apps.length === 1
                    ? "App"
                    : "Apps"
            }`;


        /*
         * Falls Registry leer ist,
         * zeigen wir einen klaren Zustand
         * statt erfundene Apps zu behaupten.
         */

        if (
            apps.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.style.opacity =
                ".55";

            empty.style.padding =
                "20px";

            empty.textContent =
                "Noch keine Apps registriert.";

            appGrid.appendChild(
                empty
            );

        }

    }


    /* =====================================================
       HTML ESCAPE
       ===================================================== */

    function escapeHTML(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =====================================================
       SYSTEM STATUS
       ===================================================== */

    function updateStatus() {

        const online =
            navigator.onLine;

        networkStatus.textContent =
            online
                ? "Online"
                : "Offline";


        if (
            H?.boot
        ) {

            const stage =
                H.boot.stage ||
                "unknown";

            bootStatus.textContent =
                H.boot.finished
                    ? "Bereit"
                    : stage;

            if (
                H.boot.finished
            ) {

                statusText.textContent =
                    "System bereit";

                statusDot.style.background =
                    "#7dffb2";

            } else {

                statusText.textContent =
                    "System wird gestartet";

                statusDot.style.background =
                    "#ffd27d";

            }

        } else {

            bootStatus.textContent =
                "Dashboard";

            statusText.textContent =
                "HalDo verbunden";

        }

    }


    /* =====================================================
       AI
       ===================================================== */

    async function askAI(
        text
    ) {

        if (!text.trim()) {
            return;
        }

        aiOutput.textContent =
            "HalDo AI verarbeitet …";


        try {

            /*
             * Bestehende AI API bevorzugen.
             */

            if (
                H?.ai &&
                typeof H.ai.ask ===
                "function"
            ) {

                const result =
                    await H.ai.ask(
                        text
                    );

                aiOutput.textContent =
                    typeof result ===
                    "string"
                        ? result
                        : (
                            result?.text ||
                            result?.response ||
                            JSON.stringify(
                                result
                            )
                        );

                return;

            }


            if (
                H?.ai &&
                typeof H.ai.process ===
                "function"
            ) {

                const result =
                    await H.ai.process(
                        text
                    );

                aiOutput.textContent =
                    typeof result ===
                    "string"
                        ? result
                        : (
                            result?.text ||
                            result?.response ||
                            "HalDo AI hat die Anfrage verarbeitet."
                        );

                return;

            }


            if (
                H?.aiCore &&
                typeof H.aiCore.process ===
                "function"
            ) {

                const result =
                    await H.aiCore.process(
                        text
                    );

                aiOutput.textContent =
                    typeof result ===
                    "string"
                        ? result
                        : JSON.stringify(
                            result
                        );

                return;

            }


            aiOutput.textContent =
                "HalDo AI Runtime ist noch nicht mit einer aktiven Antwort-Engine verbunden.";

        } catch (error) {

            console.error(
                "HalDo AI:",
                error
            );

            aiOutput.textContent =
                "HalDo AI konnte die Anfrage nicht verarbeiten.";

        }

    }


    /* =====================================================
       AI FORM
       ===================================================== */

    aiForm.addEventListener(
        "submit",
        event => {

            event.preventDefault();

            const text =
                aiInput.value.trim();

            if (!text) {
                return;
            }

            askAI(
                text
            );

            aiInput.value =
                "";

        }
    );


    /* =====================================================
       LAUNCHER
       ===================================================== */

    $("#launcher-button")
        .addEventListener(
            "click",
            () => {

                try {

                    if (
                        H?.launcher &&
                        typeof H.launcher.open ===
                        "function"
                    ) {

                        H.launcher.open();

                        return;

                    }

                    if (
                        H?.launcher &&
                        typeof H.launcher.show ===
                        "function"
                    ) {

                        H.launcher.show();

                        return;

                    }

                    if (
                        H?.openApp
                    ) {

                        H.openApp(
                            "launcher"
                        );

                    }

                } catch (error) {

                    console.error(
                        error
                    );

                }

            }
        );


    /* =====================================================
       SETTINGS
       ===================================================== */

    $("#settings-button")
        .addEventListener(
            "click",
            () => {

                try {

                    if (
                        H?.openApp
                    ) {

                        H.openApp(
                            "settings"
                        );

                    }

                } catch (error) {

                    console.error(
                        error
                    );

                }

            }
        );


    /* =====================================================
       HALDO EVENTS
       ===================================================== */

    if (
        H &&
        typeof H.on ===
        "function"
    ) {

        H.on(
            "system:ready",
            () => {

                updateStatus();

                renderApps();

                statusText.textContent =
                    "System bereit";

            }
        );


        H.on(
            "apps:ready",
            () => {

                renderApps();

            }
        );


        H.on(
            "app:registered",
            () => {

                renderApps();

            }
        );


        H.on(
            "app:unregistered",
            () => {

                renderApps();

            }
        );


        H.on(
            "network:online",
            () => {

                networkStatus.textContent =
                    "Online";

            }
        );


        H.on(
            "network:offline",
            () => {

                networkStatus.textContent =
                    "Offline";

            }
        );

    }


    /* =====================================================
       WINDOW EVENTS
       ===================================================== */

    window.addEventListener(
        "online",
        updateStatus
    );

    window.addEventListener(
        "offline",
        updateStatus
    );


    /* =====================================================
       INITIALIZATION
       ===================================================== */

    function initialize() {

        updateStatus();

        renderApps();

        /*
         * Wenn das Dashboard direkt geöffnet wurde,
         * ohne dass system:ready noch ausgelöst wurde,
         * prüfen wir den aktuellen Zustand.
         */

        if (
            H?.boot?.finished
        ) {

            statusText.textContent =
                "System bereit";

            statusDot.style.background =
                "#7dffb2";

        }

    }


    initialize();


})();
</script>

</body>
</html>
