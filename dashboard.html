<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#030712"
>

<meta
    name="description"
    content="HalDo AI OS 20 Dashboard"
>

<title>HalDo AI OS 20</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    color: #eef9ff;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(38, 91, 145, .28),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(105, 47, 160, .16),
            transparent 35%
        ),
        #02050b;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* =========================================================
   COSMIC BACKGROUND
   ========================================================= */

.haldo-world {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.haldo-world::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
        radial-gradient(
            circle,
            rgba(125, 220, 255, .08) 0 1px,
            transparent 2px
        );
    background-size: 55px 55px;
    animation: starDrift 100s linear infinite;
}

.haldo-world::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.48) 100%
        );
}

@keyframes starDrift {

    from {
        transform: translate3d(0,0,0);
    }

    to {
        transform: translate3d(-55px,-55px,0);
    }
}

/* =========================================================
   APPLICATION SHELL
   ========================================================= */

.haldo-dashboard {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        76px
        minmax(0,1fr);

    grid-template-rows:
        72px
        minmax(0,1fr);
}

/* =========================================================
   TOP BAR
   ========================================================= */

.haldo-topbar {

    grid-column: 1 / -1;

    display: flex;
    align-items: center;

    padding:
        0 18px;

    gap: 16px;

    border-bottom:
        1px solid
        rgba(150,220,255,.10);

    background:
        rgba(3,8,16,.68);

    backdrop-filter:
        blur(24px);

}

.haldo-brand {

    display: flex;
    align-items: center;
    gap: 10px;

    min-width: 180px;
}

.haldo-logo {

    width: 42px;
    height: 42px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #7de3ff 30%,
            #357aff 70%,
            #162c75
        );

    box-shadow:
        0 0 22px
        rgba(85,200,255,.55);

    color: white;

    font-weight: 900;
    font-size: 12px;
}

.haldo-brand-text strong {
    display: block;
    font-size: 15px;
}

.haldo-brand-text span {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    color: #7893a6;
}

.haldo-search {

    flex: 1;

    max-width: 720px;

    margin: auto;

    position: relative;
}

.haldo-search input {

    width: 100%;

    height: 42px;

    padding:
        0 45px 0 16px;

    border:
        1px solid
        rgba(130,215,255,.13);

    border-radius: 14px;

    outline: none;

    background:
        rgba(255,255,255,.045);

    color: white;

    font-size: 14px;

    transition:
        .2s ease;
}

.haldo-search input:focus {

    border-color:
        rgba(110,220,255,.45);

    box-shadow:
        0 0 0 3px
        rgba(80,180,255,.08);

}

.haldo-search-icon {

    position: absolute;

    right: 15px;
    top: 50%;

    transform:
        translateY(-50%);

    color: #7fa8bd;
}

.haldo-top-actions {

    display: flex;
    align-items: center;
    gap: 8px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.haldo-button {

    border: 0;

    color: #eafaff;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(150,220,255,.10);

    border-radius: 12px;

    min-width: 42px;
    min-height: 42px;

    cursor: pointer;

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;

}

.haldo-button:hover {

    transform:
        translateY(-1px);

    background:
        rgba(100,200,255,.12);

    border-color:
        rgba(120,220,255,.28);

}

.haldo-button:active {

    transform:
        scale(.96);

}

/* =========================================================
   SIDEBAR
   ========================================================= */

.haldo-sidebar {

    grid-row: 2;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 14px 10px;

    border-right:
        1px solid
        rgba(150,220,255,.08);

    background:
        rgba(2,7,14,.58);

    backdrop-filter:
        blur(22px);

}

.haldo-nav {

    display: grid;
    gap: 8px;
    width: 100%;
}

.haldo-nav button {

    width: 100%;
    height: 48px;

    border: 0;

    border-radius: 14px;

    background:
        transparent;

    color: #7f9aaa;

    cursor: pointer;

    font-size: 20px;

    transition:
        .18s ease;

}

.haldo-nav button:hover {

    background:
        rgba(110,210,255,.08);

    color: #dff7ff;

}

.haldo-nav button.active {

    background:
        linear-gradient(
            135deg,
            rgba(80,185,255,.20),
            rgba(100,95,255,.14)
        );

    color: #fff;

    box-shadow:
        inset 0 0 0 1px
        rgba(120,220,255,.13);

}

/* =========================================================
   MAIN
   ========================================================= */

.haldo-main {

    min-width: 0;
    min-height: 0;

    overflow:
        auto;

    padding:
        24px;

    scrollbar-width:
        thin;

}

.haldo-view {

    width: 100%;
    max-width: 1500px;

    margin:
        0 auto;

}

/* =========================================================
   HERO
   ========================================================= */

.haldo-hero {

    position: relative;

    min-height: 290px;

    display: grid;

    grid-template-columns:
        minmax(0,1.2fr)
        minmax(260px,.8fr);

    gap: 20px;

    padding: 28px;

    overflow: hidden;

    border:
        1px solid
        rgba(120,220,255,.12);

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(20,60,95,.34),
            rgba(30,20,70,.20)
        );

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.28);

}

.haldo-hero::before {

    content: "";

    position: absolute;

    width: 320px;
    height: 320px;

    right: -80px;
    top: -120px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,209,87,.48),
            rgba(255,122,36,.13) 45%,
            transparent 70%
        );

    filter:
        blur(12px);

    animation:
        sunBreath 5s ease-in-out infinite;

}

@keyframes sunBreath {

    0%,100% {
        transform: scale(.95);
        opacity: .72;
    }

    50% {
        transform: scale(1.08);
        opacity: 1;
    }

}

.haldo-hero-content {

    position: relative;
    z-index: 2;

    align-self: center;

}

.haldo-kicker {

    color: #80dcff;

    text-transform: uppercase;

    letter-spacing:
        .18em;

    font-size: 11px;

}

.haldo-hero h1 {

    margin:
        9px 0 10px;

    font-size:
        clamp(30px,4vw,58px);

    line-height:
        .98;

}

.haldo-hero p {

    max-width: 680px;

    color: #9eb5c4;

    line-height: 1.65;

}

.haldo-hero-actions {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 20px;

}

.haldo-primary {

    border: 0;

    border-radius: 13px;

    padding:
        12px 18px;

    cursor: pointer;

    color: #03101a;

    background:
        linear-gradient(
            135deg,
            #b9f2ff,
            #5ecbff
        );

    font-weight: 750;

    box-shadow:
        0 8px 28px
        rgba(80,190,255,.25);

}

.haldo-secondary {

    border:
        1px solid
        rgba(140,220,255,.16);

    border-radius: 13px;

    padding:
        11px 17px;

    cursor: pointer;

    color: #dff7ff;

    background:
        rgba(255,255,255,.045);

}

/* =========================================================
   COSMIC PREVIEW
   ========================================================= */

.haldo-cosmic-card {

    position: relative;

    min-height: 235px;

    overflow: hidden;

    border-radius: 24px;

    background:
        radial-gradient(
            circle at center,
            rgba(255,188,62,.17),
            transparent 18%
        ),
        radial-gradient(
            circle at center,
            rgba(65,130,255,.16),
            transparent 60%
        ),
        #030812;

}

.haldo-mini-sun {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 65px;
    height: 65px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fffbd2,
            #ffd85b 30%,
            #ff9b28 65%,
            #ff5c1b
        );

    box-shadow:
        0 0 25px #ffc34d,
        0 0 65px rgba(255,150,40,.5);

    animation:
        miniSun 3.5s ease-in-out infinite;

}

@keyframes miniSun {

    50% {
        box-shadow:
            0 0 40px #ffc34d,
            0 0 95px rgba(255,150,40,.65);
    }

}

/* =========================================================
   SECTION
   ========================================================= */

.haldo-section {

    margin-top: 24px;

}

.haldo-section-header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        13px;

}

.haldo-section-header h2 {

    margin: 0;

    font-size: 19px;

}

.haldo-section-header span {

    color:
        #718b9b;

    font-size:
        12px;

}

/* =========================================================
   APP GRID
   ========================================================= */

.haldo-app-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(150px,1fr)
        );

    gap: 12px;

}

.haldo-app-card {

    min-height: 145px;

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;

    padding: 17px;

    border:
        1px solid
        rgba(140,220,255,.09);

    border-radius: 20px;

    background:
        rgba(255,255,255,.035);

    color: inherit;

    cursor: pointer;

    text-align:
        left;

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;

}

.haldo-app-card:hover {

    transform:
        translateY(-4px);

    background:
        rgba(100,200,255,.075);

    border-color:
        rgba(130,220,255,.22);

}

.haldo-app-icon {

    width: 46px;
    height: 46px;

    display: grid;

    place-items:
        center;

    border-radius: 15px;

    background:
        rgba(110,205,255,.10);

    font-size:
        23px;

}

.haldo-app-card strong {

    display:
        block;

    font-size:
        14px;

}

.haldo-app-card small {

    display:
        block;

    margin-top:
        5px;

    color:
        #6f8797;

    font-size:
        11px;

}

/* =========================================================
   STATUS CARDS
   ========================================================= */

.haldo-status-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px,1fr)
        );

    gap: 12px;

}

.haldo-status {

    padding:
        17px;

    border:
        1px solid
        rgba(140,220,255,.09);

    border-radius:
        18px;

    background:
        rgba(255,255,255,.035);

}

.haldo-status-title {

    color:
        #7894a5;

    font-size:
        11px;

    text-transform:
        uppercase;

    letter-spacing:
        .08em;

}

.haldo-status-value {

    margin-top:
        8px;

    font-size:
        18px;

    font-weight:
        700;

}

/* =========================================================
   AI PANEL
   ========================================================= */

.haldo-ai-panel {

    display:
        grid;

    grid-template-columns:
        1fr auto;

    gap:
        10px;

    padding:
        15px;

    border:
        1px solid
        rgba(130,220,255,.11);

    border-radius:
        20px;

    background:
        rgba(255,255,255,.035);

}

.haldo-ai-panel textarea {

    width: 100%;

    min-height:
        48px;

    max-height:
        150px;

    resize:
        vertical;

    border:
        0;

    outline:
        none;

    background:
        transparent;

    color:
        white;

    font:
        inherit;

    line-height:
        1.5;

}

/* =========================================================
   QUICK ACTIONS
   ========================================================= */

.haldo-quick {

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(160px,1fr)
        );

    gap:
        10px;

}

.haldo-quick button {

    padding:
        14px;

    border:
        1px solid
        rgba(130,220,255,.09);

    border-radius:
        15px;

    background:
        rgba(255,255,255,.035);

    color:
        #dcecf3;

    cursor:
        pointer;

    text-align:
        left;

}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (
    max-width:900px
) {

    .haldo-dashboard {

        grid-template-columns:
            1fr;

        grid-template-rows:
            64px
            minmax(0,1fr)
            65px;

    }

    .haldo-topbar {

        grid-column:
            1;

    }

    .haldo-brand-text {

        display:
            none;

    }

    .haldo-sidebar {

        grid-row:
            3;

        border-right:
            0;

        border-top:
            1px solid
            rgba(150,220,255,.08);

        padding:
            7px;

        justify-content:
            center;

    }

    .haldo-nav {

        display:
            flex;

        justify-content:
            space-around;

    }

    .haldo-nav button {

        width:
            52px;

    }

    .haldo-main {

        grid-row:
            2;

        padding:
            15px;

    }

    .haldo-hero {

        grid-template-columns:
            1fr;

    }

    .haldo-cosmic-card {

        min-height:
            160px;

    }

}

@media (
    max-width:580px
) {

    .haldo-top-actions
    .optional-action {

        display:
            none;

    }

    .haldo-search {

        max-width:
            none;

    }

    .haldo-main {

        padding:
            10px;

    }

    .haldo-hero {

        padding:
            20px;

        border-radius:
            22px;

    }

    .haldo-app-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

    }

}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (
    prefers-reduced-motion: reduce
) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;

    }

}

</style>
</head>

                </div>

            </section>

            <!-- =================================================

            <section class="haldo-section">

                    <h2>

                    </h2>

                    <span>

                    </span>

                </div>

                <div class="haldo-ai-panel">

            <section class="haldo-section">

                <div class="haldo-section-header">

                 APPLICATIONS
                 ================================================= -->

                        Deine Apps

            </section>

            <!-- =================================================
                 SYSTEM STATUS
                 ================================================= -->

            <section class="haldo-section">

                <div class="haldo-section-header">

                    <h2>
                        HalDo System
                    </h2>

                </div>

                <div
                    class="haldo-status-grid"
                    id="systemStatus"
                ></div>

            </section>

        </div>

    </main>

</div>

        },

            icon:"⚙",

        },

        {

        },

        {

            name:"Stimme",
            icon:"◉",

        },

        {
            id:"ai-memory",
            name:"AI Memory",
            icon:"🧠",
            description:"HalDo Erinnerungen"
        },

        {
            id:"ai-tools",
            name:"AI Tools",
            icon:"✧",
            description:"KI-Werkzeuge"
        },

        {
            id:"automation",
            name:"Automation",
            icon:"⚡",
            description:"Automatisierungen"
        },

        {
            id:"security",
            name:"Sicherheit",
            icon:"◈",
            description:"Sicherheit und Rechte"
        },

        {
            id:"help",
            name:"Hilfe",
            icon:"?",
            description:"HalDo Hilfe"
        },

        {
            id:"cosmic",
            name:"Cosmic World",
            icon:"✦",
            description:"Lebendige HalDo Welt"
        }

    ];

    const $ =
        selector =>
            document.querySelector(
                selector
            );

    const runtime =
        window.HalDo || {};

    /* =========================================================
       OPEN APP
       ========================================================= */

    function openApp(
        appId
    ) {

        if (
            runtime.router &&
            typeof runtime.router.open ===
            "function"
        ) {

            return runtime.router.open(
                appId
            );

        }

        /*
         * Fallback:
         * If the central runtime has not yet
         * loaded, report it instead of silently
         * pretending the app opened.
         */

        const response =
            $("#aiResponse");

        if (
            response
        ) {

            response.textContent =
                "Die HalDo Runtime ist noch nicht vollständig geladen.";

        }

    }

    /* =========================================================
       APP GRID
       ========================================================= */

    function renderApps(
        filter = ""
    ) {

        const grid =
            $("#appGrid");

        if (
            !grid
        ) {
            return;
        }

        const query =
            filter
                .trim()
                .toLocaleLowerCase(
                    "de-DE"
                );

        const apps =
            appCatalog.filter(
                app =>
                    !query ||
                    app.name
                        .toLocaleLowerCase(
                            "de-DE"
                        )
                        .includes(
                            query
                        ) ||
                    app.description
                        .toLocaleLowerCase(
                            "de-DE"
                        )
                        .includes(
                            query
                        ) ||
                    app.id
                        .toLocaleLowerCase(
                            "de-DE"
                        )
                        .includes(
                            query
                        )
            );

        grid.innerHTML =
            apps
                .map(
                    app => `

                        <button
                            class="haldo-app-card"
                            data-app-id="${escapeHtml(
                                app.id
                            )}"
                            type="button"
                        >

                            <span
                                class="haldo-app-icon"
                            >
                                ${escapeHtml(
                                    app.icon
                                )}
                            </span>

                            <span>

                                <strong>
                                    ${escapeHtml(
                                        app.name
                                    )}
                                </strong>

                                <small>
                                    ${escapeHtml(
                                        app.description
                                    )}
                                </small>

                            </span>

                        </button>

                    `
                )
                .join("");

        grid
            .querySelectorAll(
                "[data-app-id]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () =>
                            openApp(
                                button.dataset.appId
                            )
                    );

                }
            );

        $("#appCount").textContent =
            `${apps.length} Apps`;

    }

    /* =========================================================
       ESCAPE
       ========================================================= */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }

    /* =========================================================
       SYSTEM STATUS
       ========================================================= */

    function renderStatus() {

        const container =
            $("#systemStatus");

        if (
            !container
        ) {
            return;
        }

        const checks = [

            [
                "Kernel",
                Boolean(
                    runtime.kernel ||
                    runtime.Kernel
                )
            ],

            [
                "System",
                Boolean(
                    runtime.system
                )
            ],

            [
                "Event Bus",
                Boolean(
                    runtime.on &&
                    runtime.emit
                )
            ],

            [
                "Storage",
                Boolean(
                    runtime.appData
                )
            ],

            [
                "Registry",
                Boolean(
                    runtime.registry
                )
            ],

            [
                "Router",
                Boolean(
                    runtime.router
                )
            ],

            [
                "Window Manager",
                Boolean(
                    runtime.windowManager
                )
            ],

            [
                "AI",
                Boolean(
                    runtime.ai
                )
            ]

        ];

        container.innerHTML =
            checks
                .map(
                    ([name,online]) => `

                        <div class="haldo-status">

                            <div class="haldo-status-title">
                                ${escapeHtml(
                                    name
                                )}
                            </div>

                            <div
                                class="haldo-status-value"
                            >
                                ${online
                                    ? "● Verbunden"
                                    : "○ Noch nicht verbunden"
                                }
                            </div>

                        </div>

                    `
                )
                .join("");

    }

    /* =========================================================
       AI
       ========================================================= */

    async function askAI() {

        const input =
            $("#aiInput");

        const output =
            $("#aiResponse");

        if (
            !input ||
            !output
        ) {
            return;
        }

        const text =
            input.value.trim();

        if (
            !text
        ) {
            return;
        }

        output.textContent =
            "HalDo AI arbeitet …";

        try {

            let result = null;

            if (
                runtime.ai?.engine?.respond
            ) {

                result =
                    await runtime.ai.engine.respond(
                        text,
                        {
                            source:
                                "dashboard"
                        }
                    );

            }
            else if (
                runtime.aiEngine?.respond
            ) {

                result =
                    await runtime.aiEngine.respond(
                        text
                    );

            }
            else if (
                runtime.aiCore?.respond
            ) {

                result =
                    await runtime.aiCore.respond(
                        text
                    );

            }

            if (
                result
            ) {

                output.textContent =
                    typeof result ===
                    "string"
                        ? result
                        : result.text ||
                          result.message ||
                          JSON.stringify(
                              result
                          );

                return;

            }

            output.textContent =
                "Die HalDo AI Engine ist noch nicht mit einem echten Modell verbunden.";

        }
        catch (
            error
        ) {

            output.textContent =
                "HalDo AI konnte die Anfrage nicht verarbeiten: " +
                (
                    error.message ||
                    "Unbekannter Fehler."
                );

        }

    }

    /* =========================================================
       EVENTS
       ========================================================= */

    $("#openAi")
        ?.addEventListener(
            "click",
            () =>
                openApp(
                    "chat"
                )
        );

    $("#chatButton")
        ?.addEventListener(
            "click",
            () =>
                openApp(
                    "chat"
                )
        );

    $("#openApps")
        ?.addEventListener(
            "click",
            () => {

                $("#applicationsSection")
                    ?.scrollIntoView({
                        behavior:
                            "smooth"
                    });

            }
        );

    $("#aiSend")
        ?.addEventListener(
            "click",
            askAI
        );

    $("#aiInput")
        ?.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    askAI();

                }

            }
        );

    $("#dashboardSearch")
        ?.addEventListener(
            "input",
            event =>
                renderApps(
                    event.target.value
                )
        );

    document
        .querySelectorAll(
            "[data-open-app]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () =>
                        openApp(
                            button.dataset
                                .openApp
                        )
                );

            }
        );

    document
        .querySelectorAll(
            "[data-view]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                "[data-view]"
                            )
                            .forEach(
                                item =>
                                    item.classList
                                        .remove(
                                            "active"
                                        )
                            );

                        button.classList
                            .add(
                                "active"
                            );

                        const view =
                            button.dataset.view;

                        if (
                            view ===
                            "apps"
                        ) {

                            $("#applicationsSection")
                                ?.scrollIntoView({
                                    behavior:
                                        "smooth"
                                });

                        }

                        if (
                            view ===
                            "settings"
                        ) {

                            openApp(
                                "settings"
                            );

                        }

                        if (
                            view ===
                            "files"
                        ) {

                            openApp(
                                "files"
                            );

                        }

                    }
                );

            }
        );

    /* =========================================================
       NOTIFICATIONS
       ========================================================= */

    $("#notificationButton")
        ?.addEventListener(
            "click",
            () => {

                if (
                    runtime.notifications
                ) {

                    const list =
                        runtime.notifications
                            .items || [];

                    if (
                        list.length
                    ) {

                        alert(
                            list
                                .slice(0,10)
                                .map(
                                    item =>
                                        `${item.title}: ${item.message}`
                                )
                                .join(
                                    "\n\n"
                                )
                        );

                    }
                    else {

                        alert(
                            "Keine neuen Benachrichtigungen."
                        );

                    }

                }
                else {

                    alert(
                        "Das Benachrichtigungssystem ist noch nicht geladen."
                    );

                }

            }
        );

    /* =========================================================
       RUNTIME EVENTS
       ========================================================= */

    if (
        typeof runtime.on ===
        "function"
    ) {

        runtime.on(
            "system:ready",
            renderStatus
        );

        runtime.on(
            "app:registered",
            () =>
                renderApps(
                    $("#dashboardSearch")
                        ?.value || ""
                )
        );

        runtime.on(
            "app:opened",
            renderStatus
        );

        runtime.on(
            "system:error",
            renderStatus
        );

    }

    /* =========================================================
       INITIALIZE
       ========================================================= */

    renderApps();

    renderStatus();

    window.HalDoDashboard =
    {

        openApp,

        renderApps,

        renderStatus,

        askAI,

        apps:
            appCatalog

    };

})();

</script>
