<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
HalDo AI Core 18
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="screen">


<img

src="assets/logo/logo.svg"

class="logo"

alt="HalDo AI Logo">



<h1>
🤖 HalDo AI Core
</h1>



<p>
Professional Ultimate Foundation
</p>



<div class="ai-status">


🟢 AI System:

<span id="ai-status">

Bereit

</span>


</div>





<div class="language-box">


<h3>
🌍 Sprache
</h3>


<select id="language-select">

<option value="de">

Deutsch

</option>


<option value="en">

English

</option>


<option value="ku">

Kurdî (Kurmancî)

</option>


<option value="ez">

Êzîkî

</option>


<option value="tr">

Türkçe

</option>


<option value="ar">

العربية

</option>


</select>


</div>







<div class="ai-box">


<div id="chat-output">


🤖 Hallo! Ich bin HalDo AI.

<br>

Wie kann ich dir helfen?


</div>





<input

id="user-input"

type="text"

placeholder="Nachricht schreiben...">





<button onclick="sendMessage()">

💬 Senden

</button>





<button onclick="speakLast()">

🔊 Vorlesen

</button>





<button onclick="startVoice()">

🎤 Mikrofon

</button>



</div>







<button onclick="goBack()">

⬅️ Zurück

</button>



</section>







<script src="js/ai-core.js"></script>

<script src="js/ai-engine.js"></script>

<script src="js/ai-language.js"></script>

<script src="js/ai-voice.js"></script>

<script src="js/ai-chat.js"></script>

<script src="js/language-manager.js"></script>






<script>



let lastAnswer = "";





function sendMessage(){



const input =

document.getElementById(
"user-input"
);



const output =

document.getElementById(
"chat-output"
);



let message =
input.value;



if(!message)

return;




let answer =

HalDoChat.send(
message
);



lastAnswer = answer;




output.innerHTML +=


"<br><br>👤 Du: "

+

message

+

"<br>🤖 HalDo: "

+

answer;




input.value = "";



}








function speakLast(){


if(lastAnswer){


HalDoVoice.speak(
lastAnswer
);


}



}








function startVoice(){



alert(

"🎤 Mikrofon-System wird vorbereitet"

);



}








document

.getElementById(
"language-select"
)

.addEventListener(

"change",

function(){


HalDoLanguageManager.change(

this.value

);



});








function goBack(){


window.location.href =
"index.html";


}



</script>



</body>

</html>
