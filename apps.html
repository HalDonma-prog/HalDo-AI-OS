        /* ==============================================================
           APPS.HTML – KOMPLETTE APP-WELT
           ============================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #e8eef5;
            --text-secondary: #8899bb;
            --text-muted: #556688;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.04);
            --accent-1: #00d4ff;
            --accent-2: #7b2ffc;
            --radius: 12px;
            --radius-sm: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .app-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-header .back-btn {
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.7rem;
            transition: all var(--transition);
            text-decoration: none;
        }
        .app-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        .app-header .stats {
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        /* ===== KATEGORIEN ===== */
        .category-section {
            margin-bottom: 20px;
        }
        .category-title {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding-left: 4px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        /* ===== APP-GRID ===== */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }
        .app-card {
            background: var(--bg-card);
            padding: 12px 6px;
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid transparent;
            text-decoration: none;
            color: var(--text-primary);
        }
        .app-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-light);
            transform: translateY(-3px);
        }
        .app-card:active {
            transform: scale(0.95);
        }
        .app-card .icon {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 4px;
        }
        .app-card .name {
            font-size: 0.45rem;
            color: var(--text-secondary);
            line-height: 1.2;
            word-break: break-word;
        }
        .app-card .badge {
            font-size: 0.35rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 1px 6px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 2px;
        }

        /* ===== SUCHLEISTE ===== */
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.7rem;
            outline: none;
            min-width: 120px;
            transition: border-color var(--transition);
        }
        .search-bar input:focus {
            border-color: var(--accent-1);
        }
        .search-bar input::placeholder {
            color: var(--text-muted);
        }
        .search-bar .filter-btn {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.6rem;
            transition: all var(--transition);
        }
        .search-bar .filter-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        .search-bar .filter-btn.active {
            background: var(--accent-1);
            color: #fff;
            border-color: var(--accent-1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            body {
                padding: 10px;
            }
            .app-grid {
                grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
                gap: 6px;
            }
            .app-card .icon {
                font-size: 1.3rem;
            }
            .app-card .name {
                font-size: 0.4rem;
            }
            .app-header h1 {
                font-size: 1rem;
            }
        }

        @media (max-width: 380px) {
            .app-grid {
                grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
                gap: 4px;
            }
            .app-card {
                padding: 8px 4px;
            }
            .app-card .icon {
                font-size: 1.1rem;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== KEINE ERGEBNISSE ===== */
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .no-results .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>

            { id: 'marketing-center', title: 'Marketing', icon: '📢', category: 'business',
                description: 'Marketing' },
            { id: 'sales-center', title: 'Vertrieb', icon: '📈', category: 'business', description: 'Vertrieb' },
            { id: 'hr-center', title: 'HR Center', icon: '👔', category: 'business',
                description: 'Personalwesen' },
            { id: 'meeting-center', title: 'Meetings', icon: '🤝', category: 'business',
                description: 'Besprechungen' },
            { id: 'analytics-center', title: 'Analysen', icon: '📊', category: 'business',
                description: 'Daten analysieren' }
        ];

        // ============================================================
        //  KATEGORIEN
        // ============================================================
        var CATEGORIES = {
            'all': 'Alle',
            'core': '⚡ Core',
            'productivity': '📊 Produktivität',
            'learning': '📚 Lernen',
            'entertainment': '🎮 Unterhaltung',
            'system': '🔧 System',
            'communication': '💬 Kommunikation',
            'creative': '🎨 Kreativ',
            'tools': '🔨 Werkzeuge',
            'media': '🎬 Medien',
            'office': '📄 Office',
            'language': '🌍 Sprache',
            'knowledge': '🧠 Wissen',
            'business': '💼 Business'
        };

        // ============================================================
        //  RENDER-FUNKTION
        // ============================================================
        function renderApps(filter, search) {
            filter = filter || 'all';
            search = (search || '').toLowerCase();

            var container = document.getElementById('app-container');
            container.innerHTML = '';

            var filteredApps = ALL_APPS.filter(function(app) {
                var matchesCategory = filter === 'all' || app.category === filter;
                var matchesSearch = !search || app.title.toLowerCase().includes(search) ||
                    app.description.toLowerCase().includes(search) ||
                    app.id.toLowerCase().includes(search);
                return matchesCategory && matchesSearch;
            });

            // Nach Kategorie gruppieren
            var grouped = {};
            filteredApps.forEach(function(app) {
                var cat = app.category;
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(app);
            });

            // Aktualisiere Anzahl
            document.getElementById('app-count').textContent = filteredApps.length + ' Apps';

            if (filteredApps.length === 0) {
                container.innerHTML =
                    '<div class="no-results"><span class="icon">🔍</span>Keine Apps gefunden<br /><span style="font-size:0.6rem;color:#556688;">Versuche einen anderen Suchbegriff</span></div>';
                return;
            }

            // Kategorien sortieren
            var catOrder = Object.keys(CATEGORIES);
            var sortedCats = Object.keys(grouped).sort(function(a, b) {
                return catOrder.indexOf(a) - catOrder.indexOf(b);
            });

            sortedCats.forEach(function(cat) {
                var apps = grouped[cat];
                var section = document.createElement('div');
                section.className = 'category-section';

                var title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = CATEGORIES[cat] || cat;
                section.appendChild(title);

                var grid = document.createElement('div');
                grid.className = 'app-grid';

                apps.forEach(function(app) {
                    var card = document.createElement('div');
                    card.className = 'app-card';
                    card.innerHTML =
                        '<span class="icon">' + app.icon + '</span>' +
                        '<span class="name">' + app.title + '</span>' +
                        '<span class="badge">' + (CATEGORIES[app.category] || app.category) + '</span>';
                    card.title = app.description;
                    card.addEventListener('click', function() {
                        // App in der Haupt-App öffnen (wenn index.html geladen)
                        if (window.parent && window.parent.HalDo) {
                            window.parent.HalDo.launchApp(app.id);
                        } else {
                            // Fallback: Nachricht
                            alert('App "' + app.title + '" wird geöffnet.\n' + app
                            .description);
                        }
                    });
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // ============================================================
        //  SUCH- UND FILTER-FUNKTION
        // ============================================================
        var currentFilter = 'all';
        var currentSearch = '';

        document.getElementById('search-input').addEventListener('input', function() {
            currentSearch = this.value;
            renderApps(currentFilter, currentSearch);
        });

        document.querySelectorAll('.filter-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderApps(currentFilter, currentSearch);
            });
        });

        // ============================================================
        //  INIT
        // ============================================================
        renderApps('all', '');
        console.log('📱 ' + ALL_APPS.length + ' Apps geladen');
        console.log('📊 ' + Object.keys(CATEGORIES).length + ' Kategorien');

        // ============================================================
        //  GLOBALE FUNKTION FÜR PARENT
        // ============================================================
        window.launchAppFromApps = function(appId) {
            if (window.parent && window.parent.HalDo) {
                window.parent.HalDo.launchApp(appId);
            }
        };
    </script>

</body>
</html>
