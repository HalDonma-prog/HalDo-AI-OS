<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050914">

    <title>HalDo AI OS 18 — Apps</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:

                radial-gradient(
                    circle at 50% 0%,
                    rgba(0,126,255,.20),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 100% 75%,
                    rgba(120,55,255,.11),
                    transparent 30%
                ),

                #050914;

            overflow-x: hidden;
        }

        button {
            font: inherit;
            border: 0;
        }

        /* =====================================================
           BACKGROUND
           ===================================================== */

        .orb {

            position: fixed;

            width: 190px;
            height: 190px;

            border-radius: 50%;

            filter: blur(75px);

            opacity: .17;

            pointer-events: none;

            z-index: 0;
        }

        .orb.one {

            top: -80px;
            left: -90px;

            background: #087cff;
        }

        .orb.two {

            right: -90px;
            bottom: 15%;

            background: #773dff;
        }

        /* =====================================================
           APP CONTAINER
           ===================================================== */

        .app {

            position: relative;

            z-index: 1;

            width: min(950px, 100%);

            min-height: 100vh;

            margin: auto;

            padding-bottom: 125px;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .header {

            position: sticky;

            top: 0;

            z-index: 50;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 9px 13px;

            background:
                rgba(5,9,20,.90);

            border-bottom:
                1px solid
                rgba(255,255,255,.08);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);
        }

        .brand {

            display: flex;

            align-items: center;

            gap: 9px;
        }

        .logo {

            width: 43px;
            height: 43px;

            object-fit: contain;

            animation:
                logoRotate 9s linear infinite,
                logoGlow 2.5s ease-in-out infinite;
        }

        @keyframes logoRotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        @keyframes logoGlow {

            0%,
            100% {

                filter:

                    drop-shadow(
                        0 0 3px
                        rgba(255,255,255,.5)
                    )

                    drop-shadow(
                        0 0 10px
                        rgba(0,130,255,.5)
                    );
            }

            50% {

                filter:

                    drop-shadow(
                        0 0 8px
                        rgba(255,255,255,.95)
                    )

                    drop-shadow(
                        0 0 22px
                        rgba(0,150,255,1)
                    );
            }

        }

        .brand-text strong {

            display: block;

            font-size: 14px;
        }

        .brand-text span {

            display: block;

            margin-top: 2px;

            color: #71809a;

            font-size: 8px;

            letter-spacing: .7px;
        }

        .back-button {

            padding:
                9px 13px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid
                rgba(255,255,255,.08);

            color: #9dccff;

            cursor: pointer;
        }

        .back-button:active {

            transform:
                scale(.94);
        }

        /* =====================================================
           HERO
           ===================================================== */

        .hero {

            padding:
                27px 15px 18px;
        }

        .badge {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding:
                6px 10px;

            border-radius: 20px;

            background:
                rgba(0,126,255,.08);

            border:
                1px solid
                rgba(0,126,255,.13);

            color: #75c4ff;

            font-size: 8px;

            letter-spacing: .7px;
        }

        .dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #00ffad;

            box-shadow:
                0 0 9px
                rgba(0,255,173,.8);
        }

        .hero h1 {

            margin-top: 12px;

            font-size: 27px;

            font-weight: 800;
        }

        .hero p {

            margin-top: 7px;

            color: #75839c;

            font-size: 10px;

            line-height: 1.55;
        }

        /* =====================================================
           SEARCH
           ===================================================== */

        .search-wrap {

            padding:
                0 15px 15px;
        }

        .search-box {

            display: flex;

            align-items: center;

            gap: 9px;

            padding:
                11px 13px;

            border-radius: 16px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.08);
        }

        .search-icon {

            color: #667892;

            font-size: 15px;
        }

        .search-box input {

            width: 100%;

            border: 0;

            outline: 0;

            background: transparent;

            color: #fff;

            font-size: 10px;
        }

        .search-box input::placeholder {

            color: #59687e;
        }

        /* =====================================================
           CATEGORIES
           ===================================================== */

        .category-bar {

            display: flex;

            gap: 7px;

            padding:
                0 15px 17px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {

            display: none;
        }

        .category {

            flex-shrink: 0;

            padding:
                8px 11px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.07);

            color: #71809a;

            font-size: 8px;

            cursor: pointer;
        }

        .category.active {

            color: #8dd0ff;

            background:
                rgba(0,126,255,.10);

            border-color:
                rgba(0,126,255,.17);
        }

        /* =====================================================
           SECTION
           ===================================================== */

        .section {

            padding:
                0 15px 18px;
        }

        .section-title {

            margin-bottom: 9px;

            color: #8190a8;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: .8px;

            text-transform: uppercase;
        }

        /* =====================================================
           APP GRID
           ===================================================== */

        .app-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 9px;
        }

        .app-card {

            position: relative;

            min-height: 145px;

            display: flex;

            flex-direction: column;

            align-items: flex-start;

            justify-content: space-between;

            padding: 14px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.07);

            overflow: hidden;

            cursor: pointer;

            transition:
                transform .18s ease,
                border-color .18s ease,
                background .18s ease;
        }

        .app-card::after {

            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            right: -50px;
            bottom: -50px;

            border-radius: 50%;

            background:
                rgba(0,126,255,.08);

            filter: blur(10px);

            pointer-events: none;
        }

        .app-card:active {

            transform:
                scale(.965);
        }

        .app-card:hover {

            border-color:
                rgba(0,126,255,.22);

            background:
                rgba(255,255,255,.06);
        }

        .app-icon {

            width: 49px;
            height: 49px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                rgba(0,126,255,.10);

            border:
                1px solid
                rgba(0,126,255,.10);

            font-size: 22px;
        }

        .app-info {

            width: 100%;

            margin-top: 13px;
        }

        .app-name {

            display: block;

            font-size: 11px;

            font-weight: 700;
        }

        .app-description {

            display: block;

            margin-top: 5px;

            color: #71809a;

            font-size: 8px;

            line-height: 1.45;
        }

        .app-footer {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 8px;

            margin-top: 12px;
        }

        .app-status {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            color: #60dfb0;

            font-size: 7px;
        }

        .status-dot {

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #00e99d;
        }

        .open-arrow {

            color: #5e9dce;

            font-size: 12px;
        }

        /* =====================================================
           FEATURED
           ===================================================== */

        .featured {

            padding: 16px;

            border-radius: 21px;

            background:

                linear-gradient(
                    135deg,
                    rgba(0,126,255,.12),
                    rgba(120,55,255,.08)
                );

            border:
                1px solid
                rgba(0,126,255,.14);
        }

        .featured-head {

            display: flex;

            align-items: center;

            gap: 11px;
        }

        .featured-logo {

            width: 47px;
            height: 47px;

            object-fit: contain;

            animation:
                logoGlow 2.5s ease-in-out infinite;
        }

        .featured-info {

            flex: 1;
        }

        .featured-info strong {

            display: block;

            font-size: 12px;
        }

        .featured-info span {

            display: block;

            margin-top: 4px;

            color: #71809a;

            font-size: 8px;
        }

        .featured-button {

            width: 100%;

            margin-top: 13px;

            min-height: 44px;

            border-radius: 13px;

            color: #9ad8ff;

            background:
                rgba(0,126,255,.11);

            border:
                1px solid
                rgba(0,126,255,.16);

            cursor: pointer;
        }

        .featured-button:active {

            transform:
                scale(.98);
        }

        /* =====================================================
           EMPTY
           ===================================================== */

        .empty {

            grid-column:
                1 / -1;

            padding:
                30px 20px;

            text-align: center;

            border-radius: 19px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.06);
        }

        .empty-icon {

            font-size: 27px;

            opacity: .65;
        }

        .empty strong {

            display: block;

            margin-top: 9px;

            font-size: 11px;
        }

        .empty p {

            margin-top: 5px;

            color: #66748c;

            font-size: 8px;

            line-height: 1.5;
        }

        /* =====================================================
           BOTTOM NAV
           ===================================================== */

        .bottom-nav {

            position: fixed;

            z-index: 100;

            left: 10px;
            right: 10px;
            bottom: 10px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 5px;

            padding: 7px;

            border-radius: 21px;

            background:
                rgba(7,12,25,.93);

            border:
                1px solid
                rgba(255,255,255,.09);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                0 15px 45px
                rgba(0,0,0,.42);
        }

        .nav-item {

            min-height: 45px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 2px;

            border-radius: 14px;

            background: transparent;

            color: #687791;

            cursor: pointer;
        }

        .nav-item.active {

            color: #7cc8ff;

            background:
                rgba(0,126,255,.11);
        }

        .nav-icon {

            font-size: 17px;
        }

        .nav-label {

            font-size: 8px;
        }

        /* =====================================================
           TOAST
           ===================================================== */

        .toast {

            position: fixed;

            z-index: 300;

            left: 50%;

            bottom: 82px;

            max-width:
                calc(100% - 30px);

            padding:
                10px 14px;

            border-radius: 14px;

            background:
                rgba(18,28,47,.96);

            border:
                1px solid
                rgba(255,255,255,.10);

            color: #dceaff;

            font-size: 9px;

            opacity: 0;

            pointer-events: none;

            transform:
                translate(-50%, 10px);

            transition: .22s ease;
        }

        .toast.show {

            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 380px) {

            .app-grid {

                grid-template-columns:
                    1fr;
            }

        }

        @media (min-width: 700px) {

            .app-grid {

                grid-template-columns:
                    repeat(3, 1fr);
            }

            .bottom-nav {

                width: 480px;

                left: 50%;
                right: auto;

                transform:
                    translateX(-50%);
            }

        }

    </style>

</head>


<body>

    <div class="orb one"></div>
    <div class="orb two"></div>


    <main class="app">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">

            <div class="brand">

                <img
                    class="logo"
                    src="assets/logo/logo.png"
                    alt="HalDo AI Logo"
                >

                <div class="brand-text">

                    <strong>
                        HalDo AI
                    </strong>

                    <span>
                        OS 18 • APP CENTER
                    </span>

                </div>

            </div>


            <button
                class="back-button"
                onclick="goBack()"
            >
                ← Zurück
            </button>

        </header>


        <!-- =================================================
             HERO
        ================================================== -->

        <section class="hero">

            <div class="badge">

                <span class="dot"></span>

                HALDO APPLICATION CENTER

            </div>


            <h1>
                Apps
            </h1>


            <p>
                Deine HalDo Anwendungen an einem zentralen Ort.
                Nur bereits vorhandene und verbundene Module
                werden als direkt öffnbar angezeigt.
            </p>

        </section>


        <!-- =================================================
             SEARCH
        ================================================== -->

        <div class="search-wrap">

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    id="appSearch"
                    type="search"
                    autocomplete="off"
                    placeholder="Apps durchsuchen …"
                >

            </div>

        </div>


        <!-- =================================================
             CATEGORIES
        ================================================== -->

        <div
            class="category-bar"
            id="categoryBar"
        >

            <button
                class="category active"
                data-category="all"
            >
                Alle
            </button>

            <button
                class="category"
                data-category="ai"
            >
                AI
            </button>

            <button
                class="category"
                data-category="system"
            >
                System
            </button>

            <button
                class="category"
                data-category="tools"
            >
                Tools
            </button>

            <button
                class="category"
                data-category="personal"
            >
                Persönlich
            </button>

        </div>


        <!-- =================================================
             FEATURED
        ================================================== -->

        <section class="section">

            <div class="section-title">
                Empfohlen
            </div>


            <div class="featured">

                <div class="featured-head">

                    <img
                        class="featured-logo"
                        src="assets/logo/logo.png"
                        alt="HalDo AI"
                    >

                    <div class="featured-info">

                        <strong>
                            HalDo AI
                        </strong>

                        <span>
                            Zentrale AI-Eingabe und Chat
                        </span>

                    </div>

                </div>


                <button
                    class="featured-button"
                    onclick="openExisting('chat.html')"
                >
                    HalDo AI öffnen →
                </button>

            </div>

        </section>


        <!-- =================================================
             INSTALLED APPS
        ================================================== -->

        <section class="section">

            <div class="section-title">
                Verfügbare Apps
            </div>


            <div
                class="app-grid"
                id="appGrid"
            ></div>

        </section>


    </main>


    <!-- =====================================================
         BOTTOM NAV
    ====================================================== -->

    <nav class="bottom-nav">


        <button
            class="nav-item"
            onclick="goHome()"
        >

            <span class="nav-icon">
                ⌂
            </span>

            <span class="nav-label">
                Home
            </span>

        </button>


        <button
            class="nav-item"
            onclick="openExisting('chat.html')"
        >

            <span class="nav-icon">
                ✦
            </span>

            <span class="nav-label">
                AI
            </span>

        </button>


        <button
            class="nav-item active"
            onclick="window.scrollTo({
                top: 0,
                behavior: 'smooth'
            })"
        >

            <span class="nav-icon">
                ◈
            </span>

            <span class="nav-label">
                Apps
            </span>

        </button>


        <button
            class="nav-item"
            onclick="openExisting('settings.html')"
        >

            <span class="nav-icon">
                ⚙
            </span>

            <span class="nav-label">
                Setup
            </span>

        </button>


    </nav>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        class="toast"
        id="toast"
    ></div>


    <script>

        /* =====================================================
           HALDO APP CENTER
        ===================================================== */

        /*
         * WICHTIG:
         *
         * Jede hier eingetragene Seite entspricht einer
         * bereits vorgesehenen Datei.
         *
         * Wir verwenden KEINE erfundenen URLs.
         *
         * Neue Apps kommen erst hier hinein, wenn ihre
         * echte Datei gebaut wurde.
         */


        const HALDO_APPS = [

            {
                id: "chat",

                name: "HalDo AI",

                description:
                    "AI-Chat und zentrale Eingabe",

                icon: "✦",

                category: "ai",

                page: "chat.html",

                status: "ONLINE"
            },


            {
                id: "dashboard",

                name: "Dashboard",

                description:
                    "Zentrale Übersicht von HalDo AI",

                icon: "▦",

                category: "system",

                page: "dashboard.html",

                status: "READY"
            },


            {
                id: "keyboard",

                name: "Ezidi Keyboard",

                description:
                    "HalDo Tastatur mit eigenen Zeichen",

                icon: "⌨",

                category: "tools",

                page: "keyboard.html",

                status: "READY"
            },


            {
                id: "notifications",

                name: "Benachrichtigungen",

                description:
                    "HalDo Meldungen und Systemalerts",

                icon: "🔔",

                category: "system",

                page: "notifications.html",

                status: "READY"
            },


            {
                id: "storage",

                name: "Speicher",

                description:
                    "Lokale HalDo Daten verwalten",

                icon: "◫",

                category: "system",

                page: "storage.html",

                status: "READY"
            },


            {
                id: "system",

                name: "Systemzentrale",

                description:
                    "Core, Module und Systemstatus",

                icon: "⚙",

                category: "system",

                page: "system.html",

                status: "ONLINE"
            },


            {
                id: "settings",

                name: "Einstellungen",

                description:
                    "HalDo AI OS Einstellungen",

                icon: "☷",

                category: "personal",

                page: "settings.html",

                status: "READY"
            },


            {
                id: "apps",

                name: "App Center",

                description:
                    "Alle HalDo Anwendungen",

                icon: "◈",

                category: "tools",

                page: "apps.html",

                status: "ONLINE"
            }

        ];


        let currentCategory =
            "all";


        let currentSearch =
            "";


        /* =====================================================
           NAVIGATION
        ===================================================== */

        function goHome() {

            window.location.href =
                "index.html";

        }


        function goBack() {

            if (
                document.referrer &&
                document.referrer.includes(
                    window.location.hostname
                )
            ) {

                history.back();

            } else {

                goHome();

            }

        }


        /*
         * Direkter Link nur für bekannte vorhandene Seiten.
         */

        function openExisting(page) {

            const exists =
                HALDO_APPS.some(
                    function(app) {

                        return app.page === page;

                    }
                );


            /*
             * Die Sonderfälle der bereits vorhandenen
             * Hauptnavigation erlauben wir ebenfalls.
             */

            const allowed =
                exists ||
                page === "index.html";


            if (!allowed) {

                showToast(
                    "Diese App ist noch nicht installiert."
                );

                return;

            }


            window.location.href =
                page;

        }


        /* =====================================================
           TOAST
        ===================================================== */

        let toastTimer;


        function showToast(message) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;


            toast.classList.add(
                "show"
            );


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(
                    function() {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    2200
                );

        }


        /* =====================================================
           ESCAPE
        ===================================================== */

        function escapeHTML(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           FILTER
        ===================================================== */

        function getFilteredApps() {

            return HALDO_APPS.filter(
                function(app) {

                    const categoryMatch =
                        currentCategory ===
                        "all" ||
                        app.category ===
                        currentCategory;


                    const searchText =
                        currentSearch
                            .trim()
                            .toLowerCase();


                    const searchMatch =
                        !searchText ||

                        app.name
                            .toLowerCase()
                            .includes(
                                searchText
                            ) ||

                        app.description
                            .toLowerCase()
                            .includes(
                                searchText
                            );


                    return (
                        categoryMatch &&
                        searchMatch
                    );

                }
            );

        }


        /* =====================================================
           RENDER
        ===================================================== */

        function renderApps() {

            const grid =
                document.getElementById(
                    "appGrid"
                );


            const apps =
                getFilteredApps();


            grid.innerHTML = "";


            if (
                apps.length === 0
            ) {

                grid.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            ⌕
                        </div>

                        <strong>
                            Keine App gefunden
                        </strong>

                        <p>
                            Versuche einen anderen Suchbegriff
                            oder wähle eine andere Kategorie.
                        </p>

                    </div>

                `;

                return;

            }


            apps.forEach(
                function(app) {

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "app-card";


                    card.setAttribute(
                        "data-app-id",
                        app.id
                    );


                    card.innerHTML = `

                        <div class="app-icon">
                            ${escapeHTML(
                                app.icon
                            )}
                        </div>

                        <div class="app-info">

                            <strong class="app-name">
                                ${escapeHTML(
                                    app.name
                                )}
                            </strong>

                            <span class="app-description">
                                ${escapeHTML(
                                    app.description
                                )}
                            </span>

                        </div>

                        <div class="app-footer">

                            <span class="app-status">

                                <span class="status-dot"></span>

                                ${escapeHTML(
                                    app.status
                                )}

                            </span>

                            <span class="open-arrow">
                                →
                            </span>

                        </div>

                    `;


                    card.addEventListener(
                        "click",
                        function() {

                            openExisting(
                                app.page
                            );

                        }
                    );


                    grid.appendChild(
                        card
                    );

                }
            );

        }


        /* =====================================================
           CATEGORY EVENTS
        ===================================================== */

        document
            .querySelectorAll(
                ".category"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            document
                                .querySelectorAll(
                                    ".category"
                                )
                                .forEach(
                                    function(item) {

                                        item.classList.remove(
                                            "active"
                                        );

                                    }
                                );


                            button.classList.add(
                                "active"
                            );


                            currentCategory =
                                button.dataset.category;


                            renderApps();

                        }
                    );

                }
            );


        /* =====================================================
           SEARCH
        ===================================================== */

        document
            .getElementById(
                "appSearch"
            )
            .addEventListener(
                "input",
                function(event) {

                    currentSearch =
                        event.target.value;


                    renderApps();

                }
            );


        /* =====================================================
           START
        ===================================================== */

        renderApps();

    </script>

</body>

</html>
