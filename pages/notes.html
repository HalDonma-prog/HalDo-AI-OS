<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
HalDo Notes
</title>


<link rel="stylesheet" href="../assets/css/style.css">

</head>



<body>



<section class="welcome-card">


<h2>
📝 HalDo Notizen
</h2>


<p>
Dein persönlicher Produktivitätsbereich.
</p>




<div class="module">


<h3>
Neue Notiz
</h3>



<textarea
id="noteText"
placeholder="Notiz schreiben..."
></textarea>




<button onclick="saveNote()">

💾 Speichern

</button>



<p id="noteStatus">

</p>


</div>



</section>







<script>


function saveNote(){


const text =
document.getElementById(
"noteText"
).value;



localStorage.setItem(
"haldo_note",
text
);



document.getElementById(
"noteStatus"
).innerHTML =
"✅ Notiz gespeichert";


}



</script>



</body>

</html>
