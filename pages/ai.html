<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
HalDo AI Assistant
</title>


<link rel="stylesheet" href="../assets/css/style.css">

</head>



<body>



<section class="welcome-card">


<h2>
🤖 HalDo AI Assistant
</h2>


<p>
Dein intelligenter Begleiter in HalDo AI OS Professional.
</p>




<div class="module">


<h3>
AI Core
</h3>


<p>
🟢 Bereit für Erweiterung
</p>



<input
id="aiInput"
type="text"
placeholder="Nachricht schreiben..."
>



<button onclick="sendAIMessage()">

Senden

</button>



<p id="aiResponse">

</p>


</div>



</section>






<script>


function sendAIMessage(){


const input =
document.getElementById("aiInput");


const output =
document.getElementById("aiResponse");



if(input.value.trim()===""){


output.innerHTML =
"✏️ Bitte Nachricht eingeben.";


return;


}



output.innerHTML =
"🤖 HalDo AI: Nachricht empfangen.";



input.value="";


}


</script>



</body>

</html>
