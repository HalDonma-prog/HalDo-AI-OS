<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
HalDo AI OS 18 – System Status
</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<section class="screen">


<img
    src="assets/logo/logo.svg"
    class="logo"
    alt="HalDo AI OS Logo"
>


<h1>
📡 HalDo AI OS 18
</h1>


<p>
System Status
</p>


<div class="settings-card">

<h2>
🟢 System
</h2>

<p id="overall-status">
System wird geprüft...
</p>

<p id="module-count">
Module werden geprüft...
</p>

</div>


<div class="settings-card">

<h2>
🧩 Module
</h2>

<div id="module-list">
Wird geladen...
</div>

</div>


<div class="settings-card">

<h2>
🤖 AI
</h2>

<p id="ai-status">
Wird geprüft...
</p>

</div>


<div class="settings-card">

<h2>
🌍 Sprache
</h2>

<select
    id="language-select"
></select>

</div>


<br>


<button
    onclick="refreshStatus()"
>

🔄 Status aktualisieren

</button>


<br><br>


<button
    onclick="goBack()"
>

⬅️ Zurück

</button>


</section>


<script src="js/boot.js"></script>

<script src="js/kernel.js"></script>

<script src="js/system.js"></script>

<script src="js/ai-core.js"></script>

<script src="js/ai-engine.js"></script>

<script src="js/ai-chat.js"></script>

<script src="js/ai-speech.js"></script>

<script src="js/ai-voice.js"></script>

<script src="js/ai-memory.js"></script>

<script src="js/ai-commands.js"></script>

<script src="js/language-system.js"></script>

<script src="js/system-status.js"></script>


<script>

function refreshStatus() {

    if (
        window.HalDoSystemStatus
    ) {

        HalDoSystemStatus.refresh();

    }

    updateStatus();

}


function updateStatus() {

    if (
        !window.HalDoSystemStatus
    ) {

        return;

    }


    const status =
        HalDoSystemStatus.getStatus();


    const overall =
        document.getElementById(
            "overall-status"
        );


    const count =
        document.getElementById(
            "module-count"
        );


    if (
        status.state ===
        "online"
    ) {

        overall.textContent =
            "🟢 HalDo AI OS ist vollständig online.";

    }
    else if (
        status.state ===
        "partial"
    ) {

        overall.textContent =
            "🟡 HalDo AI OS ist teilweise geladen.";

    }
    else {

        overall.textContent =
            "🔴 HalDo AI OS ist offline.";

    }


    count.textContent =
        "🧩 "
        +
        status.loaded
        +
        " / "
        +
        status.total
        +
        " Kernmodule geladen.";


    const list =
        document.getElementById(
            "module-list"
        );


    list.innerHTML = "";


    Object.entries(
        status.modules
    ).forEach(
        function ([name, loaded]) {


            const row =
                document.createElement(
                    "p"
                );


            row.textContent =
                (
                    loaded
                    ? "🟢 "
                    : "🔴 "
                )
                +
                name;


            list.appendChild(
                row
            );

        }
    );


    const ai =
        document.getElementById(
            "ai-status"
        );


    if (
        window.HalDoAI
    ) {

        ai.textContent =
            "🟢 AI Engine: "
            +
            (
                HalDoAI.status
                ||
                "bereit"
            );

    }
    else {

        ai.textContent =
            "🔴 AI Engine nicht geladen.";

    }

}


function loadLanguages() {

    const select =
        document.getElementById(
            "language-select"
        );


    if (
        !window.HalDoLanguageSystem
    ) {

        return;

    }


    HalDoLanguageSystem
        .getLanguages()
        .forEach(
            function (language) {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    language.id;


                option.textContent =
                    language.native;


                select.appendChild(
                    option
                );

            }
        );


    select.value =
        HalDoLanguageSystem.current;


    select.addEventListener(
        "change",
        function () {

            HalDoLanguageSystem
                .setLanguage(
                    this.value
                );

        }
    );

}


function goBack() {

    window.location.href =
        "index.html";

}


window.addEventListener(
    "DOMContentLoaded",
    function () {

        setTimeout(
            function () {

                refreshStatus();

                loadLanguages();

            },
            500
        );

    }
);

</script>

</body>

</html>
