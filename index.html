<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HalDo AI OS v22.1.1</title>

    <style>
        /* =========================================================
           HALDO AI OS v22.1.1 — KOMPLETTE STYLES
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ffd54b;
            --primary-dark: #ff9f1c;
            --bg: #02030a;
            --surface: rgba(10,14,30,0.92);
            --border: rgba(255,255,255,.08);
            --text: #ffffff;
            --radius: 16px;
            --shadow: 0 20px 60px rgba(0,0,0,.5);
            --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea, select { font: inherit; }
        button { border: 0; outline: none; cursor: pointer; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }

        /* =========================================================
           MASTER DISPLAY
           ========================================================= */

        #haldo-os {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, rgba(35,73,150,.16), transparent 30%),
                        radial-gradient(circle at 20% 20%, rgba(70,110,255,.08), transparent 30%),
                        radial-gradient(circle at 80% 80%, rgba(150,70,255,.07), transparent 32%),
                        var(--bg);
        }

        .haldo-cosmic-world {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(circle at center, rgba(15,30,75,.28), transparent 42%);
        }

        .haldo-space {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.025), transparent 52%);
        }

        /* =========================================================
           STARS
           ========================================================= */

        .haldo-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .haldo-star {
            position: absolute;
            display: block;
            border-radius: 50%;
            background: rgba(255,255,255,.95);
            box-shadow: 0 0 5px rgba(255,255,255,.9);
            animation: haldo-star-twinkle 4s ease-in-out infinite;
        }

        @keyframes haldo-star-twinkle {
            0%, 100% { opacity: .25; transform: scale(.75); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* =========================================================
           COSMIC CENTER
           ========================================================= */

        .haldo-cosmic-center {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(88vw, 900px);
            height: min(88vw, 900px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* =========================================================
           ORBIT SYSTEM
           ========================================================= */

        .haldo-orbit-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .haldo-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(120,175,255,.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(70,150,255,.05);
            animation: haldo-orbit-pulse 7s ease-in-out infinite;
        }

        @keyframes haldo-orbit-pulse {
            0%, 100% { opacity: .45; }
            50% { opacity: .85; }
        }

        .haldo-planet {
            position: absolute;
            left: 50%;
            top: -7px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            background: radial-gradient(circle at 30% 25%, #ffffff, #8fc8ff 28%, #3263bd 62%, #0d1c43 100%);
            box-shadow: 0 0 10px rgba(80,170,255,.8);
            animation: haldo-planet-glow 3s ease-in-out infinite;
        }

        @keyframes haldo-planet-glow {
            0%, 100% { box-shadow: 0 0 8px rgba(80,170,255,.55); }
            50% { box-shadow: 0 0 18px rgba(120,200,255,.95); }
        }

        .haldo-planet-earth {
            background: radial-gradient(circle at 35% 30%, #dff8ff, #4ca9ff 20%, #1267bd 48%, #06325e 70%, #020a18 100%);
            box-shadow: 0 0 14px rgba(50,160,255,.95);
        }

        .haldo-moon-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(255,255,255,.12);
            border-radius: 50%;
            animation: haldo-moon-orbit 4s linear infinite;
        }

        .haldo-moon {
            position: absolute;
            left: 50%;
            top: -3px;
            width: 6px;
            height: 6px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #aeb8c7 55%, #525a68 100%);
            box-shadow: 0 0 7px rgba(255,255,255,.7);
        }

        @keyframes haldo-moon-orbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* =========================================================
           LEBENDIGES HALDO AI (SUN-ZENTRUM)
           ========================================================= */

        .haldo-sun-container {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(220px, 28vw, 360px);
            height: clamp(220px, 28vw, 360px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
            cursor: pointer;
        }

        .haldo-sun-core {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 25px rgba(255,220,70,.95), 0 0 70px rgba(255,165,40,.72), 0 0 130px rgba(255,100,20,.38);
            animation: haldo-sun-breathe 4s ease-in-out infinite;
        }

        @keyframes haldo-sun-breathe {
            0%, 100% { transform: scale(.98); }
            50% { transform: scale(1.035); }
        }

        .haldo-solar-rays {
            position: absolute;
            inset: -42%;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(255,246,180,.0) 0deg, rgba(255,246,180,.0) .75deg, rgba(255,224,94,.72) 1deg, rgba(255,160,35,.12) 2deg, rgba(255,246,180,.0) 3deg, rgba(255,246,180,.0) 5deg);
            filter: blur(1px);
            animation: haldo-solar-rays 26s linear infinite;
            pointer-events: none;
        }

        @keyframes haldo-solar-rays {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .haldo-solar-aura {
            position: absolute;
            inset: -25%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,240,130,.28), rgba(255,174,35,.13) 38%, rgba(255,100,30,.05) 58%, transparent 72%);
            filter: blur(18px);
            animation: haldo-solar-breathe 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes haldo-solar-breathe {
            0%, 100% { transform: scale(.94); opacity: .72; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* =========================================================
           LIVING HALDO AI — MENSCHLICHE PRÄSENZ
           ========================================================= */

        .haldo-living-avatar {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 58%;
            height: 58%;
            transform: translate(-50%, -50%);
            z-index: 30;
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .haldo-living-avatar .avatar-aura {
            position: absolute;
            inset: -12%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.25), rgba(255,220,100,.15) 35%, rgba(100,190,255,.08) 55%, transparent 75%);
            filter: blur(10px);
            animation: haldo-avatar-aura 3.5s ease-in-out infinite;
        }

        @keyframes haldo-avatar-aura {
            0%, 100% { opacity: .5; transform: scale(.92); }
            50% { opacity: 1; transform: scale(1.08); }
        }

        .haldo-living-avatar img {
            position: relative;
            z-index: 4;
            width: 82%;
            height: 82%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            filter: drop-shadow(0 0 8px rgba(255,255,255,.85)) drop-shadow(0 0 22px rgba(255,205,70,.72));
            border-radius: 50%;
            transition: all .3s ease;
        }

        /* =========================================================
           AVATAR ZUSTÄNDE (LEBENDIG)
           ========================================================= */

        .haldo-living-avatar[data-state="idle"] img {
            animation: haldo-avatar-idle 4.8s ease-in-out infinite;
        }

        .haldo-living-avatar[data-state="listening"] img {
            animation: haldo-avatar-listening 1.6s ease-in-out infinite;
        }

        .haldo-living-avatar[data-state="thinking"] img {
            animation: haldo-avatar-thinking 2.2s ease-in-out infinite;
        }

        .haldo-living-avatar[data-state="speaking"] img {
            animation: haldo-avatar-speaking .6s ease-in-out infinite;
        }

        .haldo-living-avatar[data-state="happy"] img {
            animation: haldo-avatar-happy .7s ease-out 1;
        }

        .haldo-living-avatar[data-state="pointing"] img {
            animation: haldo-avatar-pointing 1.2s ease-in-out infinite;
        }

        .haldo-living-avatar[data-state="wave"] img {
            animation: haldo-avatar-wave .8s ease-out 1;
        }

        @keyframes haldo-avatar-idle {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(-2px) scale(1.01) rotate(0.3deg); }
            50% { transform: translateY(0) scale(1.015) rotate(0deg); }
            75% { transform: translateY(1px) scale(1.005) rotate(-0.3deg); }
        }

        @keyframes haldo-avatar-listening {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes haldo-avatar-thinking {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }

        @keyframes haldo-avatar-speaking {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.045); }
        }

        @keyframes haldo-avatar-happy {
            0% { transform: scale(.92); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes haldo-avatar-pointing {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(6px) rotate(2deg); }
        }

        @keyframes haldo-avatar-wave {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            50% { transform: rotate(8deg); }
            75% { transform: rotate(-3deg); }
            100% { transform: rotate(0deg); }
        }

        /* HÄNDE */
        .haldo-living-avatar .hand {
            position: absolute;
            width: 18%;
            height: 18%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.4), rgba(255,200,100,.15) 50%, transparent 70%);
            filter: blur(1px);
            opacity: .5;
            animation: haldo-hand-move 3.8s ease-in-out infinite;
        }

        .haldo-living-avatar .hand-left {
            left: -4%;
            top: 35%;
            animation-delay: 0s;
        }

        .haldo-living-avatar .hand-right {
            right: -4%;
            top: 35%;
            animation-delay: 1.9s;
        }

        @keyframes haldo-hand-move {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(0, -6px) scale(1.08); }
        }

        /* MUND (LIP-SYNC) */
        .haldo-living-avatar .mouth {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 22%;
            height: 6%;
            border-radius: 50%;
            background: rgba(255,200,150,.3);
            border: 1px solid rgba(255,255,255,.1);
            transition: all .1s ease;
        }

        .haldo-living-avatar[data-state="speaking"] .mouth {
            animation: haldo-mouth-speak .3s ease-in-out infinite alternate;
        }

        @keyframes haldo-mouth-speak {
            0% { height: 4%; transform: translateX(-50%) scaleY(0.8); }
            100% { height: 12%; transform: translateX(-50%) scaleY(1.2); }
        }

        /* AUGEN */
        .haldo-living-avatar .eyes {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 12%;
            display: flex;
            justify-content: space-between;
        }

        .haldo-living-avatar .eye {
            width: 30%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,.15);
            border: 1px solid rgba(255,255,255,.08);
            position: relative;
        }

        .haldo-living-avatar .eye::after {
            content: '';
            position: absolute;
            width: 35%;
            height: 35%;
            border-radius: 50%;
            background: rgba(255,220,100,.6);
            top: 30%;
            left: 30%;
            transition: all .3s ease;
        }

        .haldo-living-avatar[data-state="listening"] .eye::after {
            animation: haldo-eye-listen 1.2s ease-in-out infinite;
        }

        .haldo-living-avatar[data-state="thinking"] .eye::after {
            animation: haldo-eye-think 1.8s ease-in-out infinite;
        }

        @keyframes haldo-eye-listen {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        @keyframes haldo-eye-think {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(3px, -2px); }
        }

        /* =========================================================
           MENÜ BUTTONS
           ========================================================= */

        .haldo-menu-button {
            position: fixed;
            z-index: 9500;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(8,12,30,0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all .25s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,.3);
        }

        .haldo-menu-button:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,.12);
            border-color: rgba(255,200,80,.3);
        }

        .haldo-menu-button img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-menu-button.system { top: 16px; left: 16px; }
        .haldo-menu-button.apps { bottom: 16px; left: 50%; transform: translateX(-50%); }
        .haldo-menu-button.apps:hover { transform: translateX(-50%) scale(1.05); }

        /* =========================================================
           MENÜ PANELS
           ========================================================= */

        .haldo-menu-panel {
            position: fixed;
            z-index: 9600;
            width: min(420px, calc(100vw - 24px));
            max-height: min(75vh, calc(100dvh - 100px));
            overflow-y: auto;
            padding: 16px;
            border-radius: 20px;
            background: var(--surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(.96);
            transition: all .3s ease;
            color: #fff;
        }

        .haldo-menu-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .haldo-menu-panel.system-panel { top: 72px; left: 16px; }
        .haldo-menu-panel.apps-panel { bottom: 76px; left: 50%; transform: translateX(-50%) translateY(12px) scale(.96); }
        .haldo-menu-panel.apps-panel.open { transform: translateX(-50%) translateY(0) scale(1); }

        .haldo-menu-panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .haldo-menu-panel-header img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-menu-panel-header .title { font-size: 16px; font-weight: 700; flex: 1; }

        .haldo-menu-panel-header .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,.06);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .haldo-menu-panel-header .close-btn:hover { background: rgba(255,80,80,.2); }

        .haldo-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.04);
            color: rgba(255,255,255,.85);
            cursor: pointer;
            transition: all .2s ease;
            margin-bottom: 6px;
        }

        .haldo-menu-item:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,200,80,.15);
            transform: translateX(3px);
        }

        .haldo-menu-item .icon { font-size: 20px; width: 32px; text-align: center; }
        .haldo-menu-item .info { flex: 1; min-width: 0; }
        .haldo-menu-item .info .name { font-size: 13px; font-weight: 600; }
        .haldo-menu-item .info .desc { font-size: 10px; opacity: .5; margin-top: 2px; }

        /* =========================================================
           AI CHAT WINDOW — PROFESSIONELL
           ========================================================= */

        .haldo-ai-chat-window {
            position: fixed;
            z-index: 9000;
            width: min(560px, calc(100vw - 24px));
            height: min(640px, calc(100vh - 40px));
            right: 18px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 24px;
            background: var(--surface);
            backdrop-filter: blur(28px);
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(18px) scale(.97);
            transition: opacity .25s ease, transform .25s ease, visibility .25s;
            color: #fff;
        }

        .haldo-ai-chat-window.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .haldo-ai-chat-window.minimized { height: 60px; min-height: 60px; }
        .haldo-ai-chat-window.minimized .haldo-chat-body,
        .haldo-ai-chat-window.minimized .haldo-chat-footer { display: none; }

        .haldo-chat-header {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px 8px 18px;
            cursor: grab;
            user-select: none;
            border-bottom: 1px solid var(--border);
        }

        .haldo-chat-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .haldo-chat-title img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-chat-subtitle { font-size: 11px; opacity: .55; margin-top: 2px; }

        .haldo-chat-controls { display: flex; gap: 4px; }

        .haldo-chat-control {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 9px;
            background: rgba(255,255,255,.07);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        .haldo-chat-control:hover { background: rgba(255,255,255,.14); }

        .haldo-chat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

        .haldo-chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .haldo-chat-message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            word-break: break-word;
            animation: haldoMessageIn .25s ease-out;
        }

        .haldo-chat-message-user {
            align-self: flex-end;
            background: rgba(255,255,255,.12);
            border-bottom-right-radius: 4px;
        }

        .haldo-chat-message-ai {
            align-self: flex-start;
            background: rgba(255,220,140,.10);
            border: 1px solid rgba(255,255,255,.07);
            border-bottom-left-radius: 4px;
        }

        .haldo-chat-typing {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 0 16px 8px;
        }

        .haldo-chat-typing.active { display: flex; }

        .haldo-chat-typing span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: .35;
            animation: haldoTypingDot 1s ease-in-out infinite;
        }

        .haldo-chat-typing span:nth-child(2) { animation-delay: .12s; }
        .haldo-chat-typing span:nth-child(3) { animation-delay: .24s; }

        @keyframes haldoTypingDot {
            0%, 100% { transform: translateY(0); opacity: .3; }
            50% { transform: translateY(-4px); opacity: .9; }
        }

        @keyframes haldoMessageIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .haldo-chat-footer {
            padding: 10px 12px 14px;
            border-top: 1px solid var(--border);
        }

        .haldo-chat-input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .haldo-chat-input {
            flex: 1;
            min-height: 44px;
            max-height: 150px;
            resize: none;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            padding: 11px 14px;
            background: rgba(255,255,255,.06);
            color: #fff;
            font: inherit;
            outline: none;
            line-height: 1.4;
        }

    <script>
        "use strict";

        // =========================================================
        // VERSION
        // =========================================================

        window.HALDO_VERSION = "22.1.1";
        window.HALDO_BUILD = "PROFESSIONAL";
        window.HALDO_RELEASE = "2026-08-28";

        console.log("🚀 HalDo AI OS v" + window.HALDO_VERSION + " wird geladen...");

        // =========================================================
        // 1. STARS GENERATOR
        // =========================================================

        function generateStars() {
            const stars = document.getElementById("haldo-stars");
            if (!stars) return;
            stars.innerHTML = "";
            for (let i = 0; i < 250; i++) {
                const star = document.createElement("span");
                star.className = "haldo-star";
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = size + "px";
                star.style.height = size + "px";
                star.style.left = Math.random() * 100 + "%";
                star.style.top = Math.random() * 100 + "%";
                star.style.animationDuration = (2 + Math.random() * 4) + "s";
                star.style.animationDelay = (Math.random() * 4) + "s";
                stars.appendChild(star);
            }
        }

        // =========================================================
        // 2. TIME DISPLAY
        // =========================================================

        function updateTimeDisplay() {
            const el = document.getElementById("haldo-time-display");
            if (el) el.textContent = new Date().toLocaleTimeString();
        }

        // =========================================================
        // 3. EVENT BUS
        // =========================================================

        window.HalDo = window.HalDo || {};
        window.HalDo.events = window.HalDo.events || new EventTarget();

        window.HalDo.emit = function(name, detail = {}) {
            window.HalDo.events.dispatchEvent(new CustomEvent(name, { detail }));
        };

        window.HalDo.on = function(name, callback) {
            if (typeof callback !== "function") return;
            window.HalDo.events.addEventListener(name, callback);
        };

        // =========================================================
        // 4. STORAGE
        // =========================================================

        window.HalDo.Storage = {
            prefix: "haldo_",

            get(key, defaultValue = null) {
                try {
                    const value = localStorage.getItem(this.prefix + key);
                    if (value === null) return defaultValue;
                    try { return JSON.parse(value); } catch(e) { return value; }
                } catch(e) { return defaultValue; }
            },

            set(key, value) {
                try {
                    localStorage.setItem(this.prefix + key, JSON.stringify(value));
                    return true;
                } catch(e) { return false; }
            },

            remove(key) {
                try {
                    localStorage.removeItem(this.prefix + key);
                    return true;
                } catch(e) { return false; }
            },

            getAll() {
                const result = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try {
                            result[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k));
                        } catch(e) {
                            result[k.replace(this.prefix, '')] = localStorage.getItem(k);
                        }
                    });
                } catch(e) {}
                return result;
            }
        };

        // =========================================================
        // 5. AI CORE (ZENTRALE INTELLIGENZ — PROFESSIONELL)
        // =========================================================

        window.HalDo.AICore = {
            initialized: false,
            context: [],
            professionalMode: true,

            init() {
                if (this.initialized) return this;
                this.initialized = true;
                console.log("🧠 AI Core (Professional) initialisiert");
                return this;
            },

            async ask(text, options = {}) {
                this.init();
                const clean = String(text || "").trim();
                if (!clean) return "Bitte sag mir, was ich für dich tun kann. 💙";

                const lower = clean.toLowerCase();

                // === APP ÖFFNEN ===
                if (lower.includes("öffne") || lower.includes("open") || lower.includes("starte") || lower.includes("zeige")) {
                    const match = lower.match(/(?:öffne|open|starte|zeige)\s+(.+)/);
                    if (match) {
                        const appName = match[1].trim();
                        const app = window.HalDo.AppRegistry?.getAll().find(a =>
                            (a.name && a.name.toLowerCase().includes(appName)) ||
                            (a.id && a.id.toLowerCase().includes(appName))
                        );
                        if (app) {
                            window.HalDo.AppManager?.open(app.id);
                            this.reactAvatar('happy');
                            setTimeout(() => this.reactAvatar('idle'), 800);
                            return `Ich öffne "${app.name || app.id}" für dich. 💙`;
                        }
                        const similar = window.HalDo.AppRegistry?.getAll().find(a =>
                            (a.name && a.name.toLowerCase().includes(appName.split(' ')[0])) ||
                            (a.id && a.id.toLowerCase().includes(appName.split(' ')[0]))
                        );
                        if (similar) {
                            window.HalDo.AppManager?.open(similar.id);
                            this.reactAvatar('happy');
                            setTimeout(() => this.reactAvatar('idle'), 800);
                            return `Ich öffne "${similar.name || similar.id}" für dich. 💙`;
                        }
                        return `Ich konnte "${appName}" nicht finden. Verfügbare Apps: ${window.HalDo.AppRegistry?.getAll().map(a => a.name || a.id).join(', ') || 'Keine'}`;
                    }
                }

                // === APP SCHLIESSEN ===
                if (lower.includes("schließe") || lower.includes("close") || lower.includes("beende")) {
                    const match = lower.match(/(?:schließe|close|beende)\s+(.+)/);
                    if (match) {
                        const appName = match[1].trim();
                        const app = window.HalDo.AppRegistry?.getAll().find(a =>
                            (a.name && a.name.toLowerCase().includes(appName)) ||
                            (a.id && a.id.toLowerCase().includes(appName))
                        );
                        if (app && window.HalDo.AppManager?.activeApps.has(app.id)) {
                            window.HalDo.AppManager?.close(app.id);
                            return `Ich schließe "${app.name || app.id}". 💙`;
                        }
                        return `Die App "${appName}" ist nicht geöffnet.`;
                    }
                }

                // === HILFE ===
                if (lower.includes("hilfe") || lower.includes("help") || lower.includes("was kannst du") || lower.includes("fähigkeiten")) {
                    return `💙 Ich bin HalDo AI (Professional) und kann dir helfen mit:\n\n` +
                           `📱 Apps öffnen und schließen (z.B. "Öffne Rechner")\n` +
                           `🗣️ Fragen beantworten und erklären\n` +
                           `✍️ Texte schreiben, korrigieren und verbessern\n` +
                           `🌍 Übersetzen in viele Sprachen\n` +
                           `🎙️ Spracheingabe und Sprachausgabe\n` +
                           `📊 Systemstatus abfragen\n` +
                           `🧮 Rechnen und Mathematik\n` +
                           `😂 Witze erzählen\n` +
                           `📅 Termine und Erinnerungen\n\n` +
                           `💡 Sag einfach was du brauchst!`;
                }

                // === STATUS ===
                if (lower.includes("status") || lower.includes("system") || lower.includes("info") || lower.includes("über")) {
                    const apps = window.HalDo.AppRegistry?.getAll().length || 0;
                    const installed = window.HalDo.AppRegistry?.installed.size || 0;
                    return `📊 Systemstatus (Professional):\n` +
                           `• Version: ${window.HALDO_VERSION} ${window.HALDO_BUILD}\n` +
                           `• Apps: ${apps} registriert, ${installed} installiert\n` +
                           `• AI Core: ✅ Aktiv (Professional-Modus)\n` +
                           `• Voice: ${window.HalDo.Chat?.recognition ? '✅' : '⚠️'}\n` +
                           `• Uptime: ${Math.floor((Date.now() - window._haldoStartTime) / 1000)}s\n` +
                           `• Speicher: ${Object.keys(window.HalDo.Storage.getAll()).length} Einträge`;
                }

                // === ZEIT ===
                if (lower.includes("zeit") || lower.includes("uhr") || lower.includes("wie spät") || lower.includes("uhrzeit")) {
                    return `🕐 Es ist ${new Date().toLocaleTimeString()}`;
                }

                if (lower.includes("datum") || lower.includes("welcher tag") || lower.includes("heute") || lower.includes("wochentag")) {
                    return `📅 Heute ist ${new Date().toLocaleDateString('de-DE', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    })}`;
                }

                // === WETTER ===
                if (lower.includes("wetter")) {
                    const conditions = ['☀️ Sonnig', '⛅ Bewölkt', '🌤️ Leicht bewölkt', '🌧️ Regen', '❄️ Schnee', '🌥️ Teils bewölkt', '🌈 Sonnig mit Regenbogen'];
                    return `🌤️ Wetter heute (simuliert):\n${conditions[Math.floor(Math.random() * conditions.length)]}\n🌡️ ${Math.floor(Math.random()*15+15)}°C\n💨 Wind: ${Math.floor(Math.random()*20+5)} km/h\n💧 Luftfeuchtigkeit: ${Math.floor(Math.random()*40+40)}%`;
                }

                // === RECHNEN ===
                if (lower.includes("rechne") || lower.includes("berechnen") || lower.includes("plus") || lower.includes("minus") ||
                    lower.includes("mal") || lower.includes("geteilt") || lower.includes("durch")) {
                    try {
                        const math = lower.replace(/rechne|berechnen|ist|gleich|ergibt/g, '')
                            .replace(/plus/g, '+').replace(/minus/g, '-')
                            .replace(/mal|×/g, '*').replace(/geteilt|durch|÷/g, '/')
                            .replace(/[^0-9+\-*/().]/g, '').trim();
                        if (math && /[0-9]/.test(math)) {
                            const result = Function('"use strict"; return (' + math + ')')();
                            return `🧮 ${math} = ${result}`;
                        }
                    } catch(e) {}
                }

                // === WITZ ===
                if (lower.includes("witz") || lower.includes("lachen") || lower.includes("spaß") || lower.includes("humor")) {
                    const jokes = [
                        "Warum können Geister so gut programmieren? Weil sie keinen Speicher haben! 👻",
                        "Was sagt ein Programmierer, wenn er seine Wohnung verlässt? 'Ich geh mal den Stack leeren!' 😄",
                        "Warum ist ein Computer so schlau? Weil er so viele Bits hat! 💻",
                        "Wie nennt man einen faulen Programmierer? Einen Lazy-Loader! 😴",
                        "Was macht ein Informatiker im Sommer? Er sucht den Byte im Schatten! ☀️",
                        "Warum hat der Computer einen kalten Kaffee? Weil er den Code nicht runterbekam! ☕",
                        "Was sagt die Festplatte zum RAM? 'Hast du auch mal was gespeichert?' 😂"
                    ];
                    this.reactAvatar('happy');
                    setTimeout(() => this.reactAvatar('idle'), 800);
                    return `😂 ${jokes[Math.floor(Math.random() * jokes.length)]}`;
                }

                // === ÊZÎDÎ ===
                if (lower.includes("silav") || lower.includes("rojbaş") || lower.includes("salam") || lower.includes("êzîdî")) {
                    return "Silav! Ez HalDo AI me. 💙❤️ Tu dixwazî çi bikin?\n\n" +
                           "Ez dikarim alîkariya te bikim bi:\n" +
                           "• Vekirina sepanan\n" +
                           "• Bersivdana pirsan\n" +
                           "• Wergerandin\n" +
                           "• Nivîsandin\n\n" +
                           "Tu çi dixwazî?";
                }

                // === TEXT KORRIGIEREN ===
                if (lower.includes("korrigiere") || lower.includes("verbessere") || lower.includes("rechtschreibung") ||
                    lower.includes("grammatik") || lower.includes("text korrigieren")) {
                    const match = lower.match(/(?:korrigiere|verbessere|text korrigieren)\s+(.+)/);
                    if (match) {
                        const text = match[1].trim();
                        return this.correctText(text);
                    }
                    return "Bitte gib den Text an, den ich korrigieren soll. z.B. 'Korrigiere: Ich habe ein Apfel.'";
                }

                // === ZUSAMMENFASSEN ===
                if (lower.includes("fasse zusammen") || lower.includes("zusammenfassen") || lower.includes("summary")) {
                    const match = lower.match(/(?:fasse zusammen|zusammenfassen|summary)\s+(.+)/);
                    if (match) {
                        const text = match[1].trim();
                        return this.summarizeText(text);
                    }
                    return "Bitte gib den Text an, den ich zusammenfassen soll. z.B. 'Fasse zusammen: ...'";
                }

                // === ÜBERSETZEN ===
                if (lower.includes("übersetze") || lower.includes("translate") || lower.includes("übersetzung")) {
                    const match = lower.match(/(?:übersetze|translate)\s+(.+?)\s+(?:auf|to|in)\s+(\w+)/);
                    if (match) {
                        const text = match[1].trim();
                        const targetLang = match[2].trim();
                        const translation = this.translate(text, targetLang);
                        return `🌍 Übersetzung (${targetLang}):\n"${translation}"`;
                    }
                    return "🌍 Sag mir: 'Übersetze [Text] auf [Sprache]'";
                }

                // === STANDARD ===
                this.reactAvatar('thinking');
                setTimeout(() => this.reactAvatar('idle'), 1000);
                return this.professionalResponse(text);
            },

            // =========================================================
            // PROFESSIONELLE ANTWORTEN
            // =========================================================

            // =========================================================
            // TEXT KORRIGIEREN
            // =========================================================

            correctText(text) {
                // Simulierte Korrektur
                const corrections = {
                    'Apfel': 'Äpfel',
                    'apfel': 'Äpfel',
                    'hause': 'Hause',
                    'Hause': 'Haus',
                    'gehen': 'gehen',
                    'komme': 'komme',
                    'ich habe': 'Ich habe',
                    'ich bin': 'Ich bin',
                    'sie sind': 'Sie sind',
                    'sie haben': 'Sie haben'
                };

                let corrected = text;
                for (const [wrong, right] of Object.entries(corrections)) {
                    corrected = corrected.replace(new RegExp(wrong, 'g'), right);
                }

                // Grammatik-Hinweise
                const suggestions = [];
                if (text.includes('  ')) suggestions.push('• Doppelte Leerzeichen entfernen');
                if (text.toLowerCase() !== text && text.toLowerCase() === text) suggestions.push('• Großschreibung am Satzanfang prüfen');
                if (text.split('.').length > 2) suggestions.push('• Satzzeichen prüfen (Punkt am Satzende)');

                let result = `📝 Korrigierter Text:\n"${corrected}"\n\n`;
                if (suggestions.length > 0) {
                    result += `💡 Vorschläge:\n${suggestions.join('\n')}`;
                } else {
                    result += '✅ Der Text sieht grammatikalisch korrekt aus.';
                }
                return result;
            },

            // =========================================================
            // ZUSAMMENFASSUNG
            // =========================================================

            summarizeText(text) {
                const words = text.split(' ');
                if (words.length <= 20) {
                    return `📄 Zusammenfassung:\n"${text}"\n\n💡 Der Text ist bereits kurz und prägnant.`;
                }

                // Einfache Zusammenfassung
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
                const summary = sentences.slice(0, Math.min(3, sentences.length)).join('. ') + '.';

                return `📄 Zusammenfassung:\n"${summary}"\n\n` +
                       `📊 Statistik:\n• Wörter: ${words.length}\n• Sätze: ${sentences.length}\n• Zeichen: ${text.length}`;
            },

            // =========================================================
            // ÜBERSETZUNG
            // =========================================================

            translate(text, targetLang) {
                const translations = {
                    'hallo': { 'en': 'hello', 'ku': 'silav', 'ar': 'مرحباً', 'tr': 'merhaba', 'fr': 'bonjour', 'es': 'hola', 'it': 'ciao', 'ru': 'привет' },
                    'welt': { 'en': 'world', 'ku': 'cîhan', 'ar': 'العالم', 'tr': 'dünya', 'fr': 'monde', 'es': 'mundo', 'it': 'mondo', 'ru': 'мир' },
                    'danke': { 'en': 'thank you', 'ku': 'spas', 'ar': 'شكراً', 'tr': 'teşekkürler', 'fr': 'merci', 'es': 'gracias', 'it': 'grazie', 'ru': 'спасибо' },
                    'guten morgen': { 'en': 'good morning', 'ku': 'roja baş', 'ar': 'صباح الخير', 'tr': 'günaydın', 'fr': 'bonjour', 'es': 'buenos días', 'it': 'buongiorno', 'ru': 'доброе утро' },
                    'gute nacht': { 'en': 'good night', 'ku': 'şev baş', 'ar': 'تصبح على خير', 'tr': 'iyi geceler', 'fr': 'bonne nuit', 'es': 'buenas noches', 'it': 'buonanotte', 'ru': 'спокойной ночи' }
                };

                const lower = text.toLowerCase().trim();
                const target = targetLang.toLowerCase();

                if (translations[lower] && translations[lower][target]) {
                    return translations[lower][target];
                }

                for (const [key, value] of Object.entries(translations)) {
                    if (lower.includes(key) && value[target]) {
                        return text.replace(new RegExp(key, 'gi'), value[target]);
                    }
                }

                return `[Übersetzung auf ${targetLang}] ${text}`;
            },

            // =========================================================
            // AVATAR REAKTION
            // =========================================================

            reactAvatar(state) {
                const avatar = document.getElementById('haldo-living-avatar');
                if (avatar) avatar.dataset.state = state;
                window.HalDo.emit("avatar:state", { state });
            }

        // =========================================================

        window.HalDo.AppRegistry = {
            apps: new Map(),
            installed: new Set(),

            register(app) {
                if (!app || !app.id) return false;
                if (this.apps.has(app.id)) return false;
                this.apps.set(app.id, {
                    ...app,
                    registeredAt: Date.now(),
                    status: 'registered'
                });
                console.log(`✅ App "${app.name || app.id}" registriert`);
                return true;
            },

            get(id) { return this.apps.get(id) || null; },
            getAll() { return Array.from(this.apps.values()); },

            install(id) {
                const app = this.get(id);
                if (!app) return false;
                if (this.installed.has(id)) return true;
                app.status = 'installed';
                this.installed.add(id);
                window.HalDo.Storage.set('app_installed_' + id, true);
                console.log(`📦 App "${app.name || id}" installiert`);
                return true;
            },

            isInstalled(id) {
                return this.installed.has(id) || window.HalDo.Storage.get('app_installed_' + id, false);
            },

            loadInstalled() {
                this.getAll().forEach(app => {
                    if (window.HalDo.Storage.get('app_installed_' + app.id, false)) {
                        app.status = 'installed';
                        this.installed.add(app.id);
                    }
                });
            },

            getInstalled() {
                return this.getAll().filter(app => this.installed.has(app.id));
            }

                if (this.activeApps.has(appId)) {
                    this.focus(appId);
                    return this.activeApps.get(appId);

                const instance = {
                    appId: appId,
                    app: app,

                            renderNotes();
                        });
                    }

                    renderNotes();
                }
            },

            close(appId) {
                const instance = this.activeApps.get(appId);
                if (!instance) return false;
                if (instance.window) instance.window.remove();
                this.activeApps.delete(appId);
                window.HalDo.emit("app:closed", { appId });
                return true;
            },

            focus(appId) {
                const instance = this.activeApps.get(appId);
                if (!instance) return false;
                if (instance.window) instance.window.style.zIndex = "99999";
                return true;
            },

            getActiveApps() {
                return Array.from(this.activeApps.values());
            }
        };

        // =========================================================
        // 7. MENÜ CONTROLLER
        // =========================================================

        window.HalDo.Menu = {
            init() {
                const systemBtn = document.getElementById("haldo-system-menu-btn");
                const appsBtn = document.getElementById("haldo-apps-menu-btn");
                const systemPanel = document.getElementById("haldo-system-panel");
                const appsPanel = document.getElementById("haldo-apps-panel");

                if (systemBtn) {
                    systemBtn.addEventListener("click", () => {
                        systemPanel.classList.toggle("open");
                        appsPanel.classList.remove("open");
                    });
                }

                if (appsBtn) {
                    appsBtn.addEventListener("click", () => {
                        appsPanel.classList.toggle("open");
                        systemPanel.classList.remove("open");
                    });
                }

                document.getElementById("haldo-system-close")?.addEventListener("click", () => {
                    systemPanel.classList.remove("open");
                });

                document.getElementById("haldo-apps-close")?.addEventListener("click", () => {
                    appsPanel.classList.remove("open");
                });

                document.addEventListener("click", (e) => {
                    if (!e.target.closest(".haldo-menu-panel") && !e.target.closest(".haldo-menu-button")) {
                        systemPanel.classList.remove("open");
                        appsPanel.classList.remove("open");
                    }
                });

                this.renderSystemMenu();
                this.renderAppsMenu();
            },

            renderSystemMenu() {
                const list = document.getElementById("haldo-system-list");
                if (!list) return;

                const items = [
                    { id: 'settings', icon: '⚙️', name: 'Einstellungen', desc: 'System & Geräte' },
                    { id: 'updates', icon: '↻', name: 'Updates', desc: 'Systemupdates & Versionen' },
                    { id: 'storage', icon: '💾', name: 'Speicher', desc: 'Daten & Speicher' },
                    { id: 'security', icon: '🛡️', name: 'Sicherheit', desc: 'Datenschutz' },
                    { id: 'backup', icon: '◫', name: 'Backup', desc: 'Sichern & Wiederherstellen' },
                    { id: 'diagnostics', icon: '⌁', name: 'Diagnose', desc: 'Systemstatus & Fehler' }
                ];

                list.innerHTML = items.map(item => `
                    <div class="haldo-menu-item" data-app="${item.id}">
                        <span class="icon">${item.icon}</span>
                        <div class="info">
                            <div class="name">${item.name}</div>
                            <div class="desc">${item.desc}</div>
                        </div>
                    </div>
                `).join('');

                list.querySelectorAll('[data-app]').forEach(el => {
                    el.addEventListener('click', () => {
                        const app = el.dataset.app;
                        document.getElementById("haldo-system-panel").classList.remove("open");
                        document.getElementById("haldo-apps-panel").classList.remove("open");
                        window.HalDo.AppManager.open(app);
                    });
                });
            },

            renderAppsMenu() {
                const list = document.getElementById("haldo-apps-list");
                if (!list) return;

                const apps = window.HalDo.AppRegistry.getAll();

                // Sortieren nach Name
                apps.sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));

                list.innerHTML = apps.map(app => `
                    <div class="haldo-menu-item" data-app="${app.id}">
                        <span class="icon">${app.icon || '📱'}</span>
                        <div class="info">
                            <div class="name">${app.name || app.id}</div>
                            <div class="desc">${app.description || app.category || 'App'}</div>
                        </div>
                        <span class="badge">${app.status === 'installed' ? '✅' : ''}</span>
                    </div>
                `).join('');

                list.querySelectorAll('[data-app]').forEach(el => {
                    el.addEventListener('click', () => {
                        const app = el.dataset.app;
                        document.getElementById("haldo-system-panel").classList.remove("open");
                        document.getElementById("haldo-apps-panel").classList.remove("open");
                        window.HalDo.AppManager.open(app);
                    });
                });
            }
        };

        // =========================================================
        // 8. CHAT CONTROLLER — PROFESSIONELL
        // =========================================================

        window.HalDo.Chat = {
            init() {
                this.window = document.getElementById("haldo-chat-window");
                this.messages = document.getElementById("haldo-chat-messages");
                this.input = document.getElementById("haldo-chat-input");
                this.sendBtn = document.getElementById("haldo-chat-send");
                this.voiceBtn = document.getElementById("haldo-chat-voice");
                this.status = document.getElementById("haldo-chat-status");
                this.typing = document.getElementById("haldo-chat-typing");
                this.history = window.HalDo.Storage.get('chat_history', []);
                this._sending = false;

                if (!this.window) return;

                document.getElementById("haldo-chat-close").addEventListener("click", () => this.close());
                document.getElementById("haldo-chat-minimize").addEventListener("click", () => this.toggleMinimize());
                this.sendBtn.addEventListener("click", () => this.send());
                this.voiceBtn.addEventListener("click", () => this.toggleVoice());

                this.input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        this.send();
                    }
                });

                this.input.addEventListener("input", () => {
                    this.input.style.height = "auto";
                    this.input.style.height = Math.min(this.input.scrollHeight, 150) + "px";
                });

                // History laden
                this.history.forEach(msg => this.renderMessage(msg.role, msg.content));
                if (this.history.length === 0) {
                    this.renderMessage("ai", "Guten Tag! Ich bin HalDo AI im Professional-Modus. 💙❤️ Wie kann ich Ihnen behilflich sein?");
                }

                // AI Core initialisieren
                window.HalDo.AICore.init();

                // Voice
                this.setupVoice();

                // Sun click
                document.getElementById("haldo-sun-container")?.addEventListener("click", () => {
                    this.open();
                    window.HalDo.AICore.reactAvatar('happy');
                    setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 800);
                });

                // Avatar klick
                document.getElementById("haldo-living-avatar")?.addEventListener("click", () => {
                    this.open();
                    window.HalDo.AICore.reactAvatar('happy');
                    setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 800);
                });
            },

            open() {
                this.window.classList.add("open");
                this.window.removeAttribute("aria-hidden");
                setTimeout(() => this.input.focus(), 100);
                window.HalDo.AICore.reactAvatar('happy');
                setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 800);
            },

            close() {
                this.window.classList.remove("open");
                this.window.setAttribute("aria-hidden", "true");
            },

            toggleMinimize() {
                this.window.classList.toggle("minimized");
            },

            renderMessage(role, content) {
                const div = document.createElement("div");
                div.className = `haldo-chat-message ${role === "user" ? "haldo-chat-message-user" : "haldo-chat-message-ai"}`;
                div.textContent = content;
                this.messages.appendChild(div);
                this.messages.scrollTop = this.messages.scrollHeight;
            },

            setStatus(text) {
                this.status.textContent = text;
            },

            showTyping() {
                this.typing.classList.add("active");
                this.setStatus("HalDo AI denkt …");
                window.HalDo.AICore.reactAvatar('thinking');
            },

            hideTyping() {
                this.typing.classList.remove("active");
                this.setStatus("Bereit");
                window.HalDo.AICore.reactAvatar('idle');
            },

            async send() {
                const text = this.input.value.trim();
                if (!text || this._sending) return;

                this.input.value = "";
                this.input.style.height = "auto";
                this.renderMessage("user", text);
                this.history.push({ role: "user", content: text });
                window.HalDo.Storage.set('chat_history', this.history.slice(-200));

                this._sending = true;
                this.showTyping();

                try {
                    const response = await window.HalDo.AICore.ask(text);
                    this.hideTyping();
                    this.renderMessage("ai", response);
                    this.history.push({ role: "ai", content: response });
                    window.HalDo.Storage.set('chat_history', this.history.slice(-200));

                    // Avatar speaking
                    window.HalDo.AICore.reactAvatar('speaking');
                    setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 1000);

                    // Speak
                    this.speak(response);

                } catch(e) {
                    this.hideTyping();
                    this.renderMessage("ai", "Entschuldigung, ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.");
                    console.error(e);
                }

                this._sending = false;
            },

            speak(text) {
                if (!window.speechSynthesis) return;
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = "de-DE";
                    utterance.rate = 0.92;
                    utterance.pitch = 1.0;
                    utterance.volume = 0.85;
                    utterance.onstart = () => window.HalDo.AICore.reactAvatar('speaking');
                    utterance.onend = () => window.HalDo.AICore.reactAvatar('idle');
                    utterance.onerror = () => window.HalDo.AICore.reactAvatar('idle');
                    window.speechSynthesis.speak(utterance);
                } catch(e) {}
            },

            setupVoice() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) return;

                this.recognition = new Recognition();
                this.recognition.lang = "de-DE";
                this.recognition.continuous = false;
                this.recognition.interimResults = true;

                this.recognition.onstart = () => {
                    this.voiceBtn.classList.add("listening");
                    this.setStatus("Ich höre zu …");
                    window.HalDo.AICore.reactAvatar('listening');
                };

                this.recognition.onresult = (event) => {
                    let final = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    }
                    if (final) {
                        this.input.value = final;
                        this.stopVoice();
                        setTimeout(() => this.send(), 100);
                    }
                };

                this.recognition.onerror = () => {
                    this.stopVoice();
                    this.setStatus("Bereit");
                };

                this.recognition.onend = () => {
                    this.voiceBtn.classList.remove("listening");
                    if (this.status.textContent === "Ich höre zu …") {
                        this.setStatus("Bereit");
                    }
                    window.HalDo.AICore.reactAvatar('idle');
                };
            },

            toggleVoice() {
                if (this.recognition?.listening) {
                    this.stopVoice();
                } else {
                    this.startVoice();
                }
            },

            startVoice() {
                if (!this.recognition) return;
                try { this.recognition.start(); } catch(e) {}
            },

            stopVoice() {
                try { this.recognition?.stop(); } catch(e) {}
                this.voiceBtn.classList.remove("listening");
                window.HalDo.AICore.reactAvatar('idle');
                this.setStatus("Bereit");
            }
        };
