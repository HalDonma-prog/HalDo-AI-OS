<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HalDo AI OS 22</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#02050d;
    color:#fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}
button,input,textarea{
    font:inherit;
}
button{
    cursor:pointer;
}
#haldo-os{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 48%,
            rgba(255,185,55,.10),
            transparent 22%),
        radial-gradient(circle at 20% 20%,
            rgba(70,120,255,.12),
            transparent 35%),
        radial-gradient(circle at 80% 80%,
            rgba(130,40,255,.10),
            transparent 35%),
        #02050d;
}
/* =========================================================
   GALAXY
========================================================= */
#galaxy{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at center,
            rgba(255,210,100,.08),
            transparent 28%);
}
.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 7px currentColor;
    opacity:.65;
    animation:starPulse 3s ease-in-out infinite;
}
.star.past{
    width:3px;
    height:3px;
    opacity:1;
    box-shadow:
        0 0 8px currentColor,
        0 0 18px currentColor;
}
@keyframes starPulse{
    0%,100%{transform:scale(.7);opacity:.45}
    50%{transform:scale(1.5);opacity:1}
}
/* =========================================================
   ORBITS
========================================================= */
.orbit{
    position:absolute;
    left:50%;
    top:50%;
    border:1px solid rgba(255,255,255,.10);
    border-radius:50%;
    transform:
        translate(-50%,-50%)
        rotateX(62deg);
    pointer-events:none;
}
.planet-track{
    position:absolute;
    inset:0;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}
.planet{
    position:absolute;
    left:50%;
    top:0;
    transform:translate(-50%,-50%);
    border-radius:50%;
    box-shadow:
        0 0 12px currentColor,
        0 0 30px currentColor,
        inset -8px -8px 12px rgba(0,0,0,.35);
}
.planet::after{
    content:"";
    position:absolute;
    inset:-20%;
    border-radius:50%;
    background:currentColor;
    opacity:.10;
    filter:blur(10px);
}
.planet.ring::before{
    content:"";
    position:absolute;
    left:-45%;
    top:40%;
    width:190%;
    height:25%;
    border:2px solid currentColor;
    border-radius:50%;
    transform:rotate(-18deg);
    opacity:.7;
}
/* =========================================================
   SUN / HALDO AI
========================================================= */
#sun{
    position:absolute;
    left:50%;
    top:50%;
    width:min(19vw,190px);
    height:min(19vw,190px);
    min-width:105px;
    min-height:105px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    z-index:20;
    display:grid;
    place-items:center;
    cursor:pointer;
    background:
        radial-gradient(circle at 35% 30%,
            #fffbd2 0%,
            #fff3a0 18%,
            #ffd54d 42%,
            #ff9d00 70%,
            #ff5b00 100%);
    box-shadow:
        0 0 30px #ffd34d,
        0 0 70px #ffad20,
        0 0 140px rgba(255,170,20,.65),
        0 0 240px rgba(255,120,0,.25);
    animation:
        sunBreath 4s ease-in-out infinite,
        sunRotate 20s linear infinite;
}
#sun::before{
    content:"";
    position:absolute;
    inset:-55%;
    border-radius:50%;
    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255,220,100,.28) 0deg 5deg,
            transparent 5deg 15deg
        );
    filter:blur(5px);
    animation:sunRays 18s linear infinite;
}
#sun::after{
    content:"";
    position:absolute;
    inset:-15%;
    border-radius:50%;
    border:2px solid rgba(255,240,170,.25);
    box-shadow:0 0 40px rgba(255,220,100,.5);
}
@keyframes sunBreath{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.07)}
}
@keyframes sunRotate{
    to{filter:hue-rotate(8deg)}
}
@keyframes sunRays{
    to{transform:rotate(360deg)}
}
#sun-logo{
    position:relative;
    z-index:3;
    width:62%;
    height:62%;
    object-fit:contain;
    border-radius:50%;
    filter:
        drop-shadow(0 0 12px rgba(255,255,255,.75))
        drop-shadow(0 0 30px rgba(255,220,100,.7));
    animation:livingLogo 3.8s ease-in-out infinite;
}
@keyframes livingLogo{
    0%,100%{
        transform:scale(1) rotate(-1deg);
    }
    50%{
        transform:scale(1.04) rotate(1deg);
    }
}
/* =========================================================
   TOP BAR
========================================================= */
#topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:64px;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:
        env(safe-area-inset-top)
        14px 0 14px;
    background:
        linear-gradient(
            180deg,
            rgba(2,5,13,.82),
            rgba(2,5,13,.25),
            transparent
        );
    backdrop-filter:blur(10px);
}
#brand{
    display:flex;
    align-items:center;
    gap:10px;
}
#brand img{
    width:34px;
    height:34px;
    object-fit:contain;
}
#brand strong{
    font-size:14px;
    letter-spacing:.05em;
}
#menu-button{
    width:46px;
    height:46px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:23px;
    backdrop-filter:blur(16px);
}
/* =========================================================
   MENU
========================================================= */
#menu{
    position:absolute;
    top:70px;
    right:12px;
    bottom:12px;
    width:min(380px,calc(100vw - 24px));
    z-index:2000;
    display:none;
    flex-direction:column;
    border:1px solid rgba(255,255,255,.13);
    border-radius:22px;
    background:
        linear-gradient(
            145deg,
            rgba(8,17,35,.97),
            rgba(2,7,18,.98)
        );
    box-shadow:0 30px 100px rgba(0,0,0,.65);
    backdrop-filter:blur(28px);
    overflow:hidden;
}
#menu.open{
    display:flex;
    animation:menuIn .18s ease;
}
@keyframes menuIn{
    from{
        opacity:0;
        transform:translateX(25px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}
#menu-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px;
    border-bottom:1px solid rgba(255,255,255,.08);
}
#menu-head strong{
    font-size:17px;
}
#menu-close{
    border:0;
    background:rgba(255,255,255,.07);
    color:#fff;
    border-radius:10px;
    width:38px;
    height:38px;
    font-size:20px;
}
#app-list{
    flex:1;
    overflow:auto;
    padding:10px;
}
.app-button{
    width:100%;
    min-height:48px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:5px;
    padding:9px 12px;
    border:1px solid transparent;
    border-radius:13px;
    background:transparent;
    color:rgba(255,255,255,.88);
    text-align:left;
}
.app-button:hover{
    background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.10);
}
.app-button .icon{
    width:30px;
    text-align:center;
    font-size:19px;
}
/* =========================================================
   START SCREEN
========================================================= */
#start-screen{
    position:absolute;
    inset:0;
    z-index:1500;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    background:
        radial-gradient(
            circle at center,
            rgba(255,184,50,.09),
            rgba(2,5,13,.95) 45%
        );
}
#start-screen.hidden{
    display:none;
}
#start-logo{
    width:min(180px,42vw);
    filter:
        drop-shadow(0 0 20px rgba(255,220,120,.7))
        drop-shadow(0 0 60px rgba(255,170,30,.35));
    animation:livingLogo 4s ease-in-out infinite;
}
#start-screen h1{
    margin:0;
    font-size:clamp(22px,5vw,40px);
}
#start-screen p{
    margin:0;
    color:rgba(255,255,255,.55);
}
#start-button{
    min-width:220px;
    min-height:52px;
    padding:0 24px;
    border:1px solid rgba(130,255,180,.45);
    border-radius:16px;
    background:
        linear-gradient(
            135deg,
            rgba(40,220,120,.35),
            rgba(20,150,90,.18)
        );
    color:#baffd8;
    box-shadow:0 0 30px rgba(50,255,150,.18);
    font-weight:750;
    letter-spacing:.04em;
}
/* =========================================================
   WINDOW SYSTEM
========================================================= */
#window-layer{
    position:absolute;
    inset:0;
    z-index:500;
    pointer-events:none;
}
.haldo-window{
    position:absolute;
    width:min(720px,calc(100vw - 28px));
    height:min(520px,calc(100vh - 110px));
    min-width:280px;
    min-height:220px;
    display:flex;
    flex-direction:column;
    pointer-events:auto;
    border:
        1px solid
        rgba(255,255,255,.14);
    border-radius:18px;
    background:
        linear-gradient(
            145deg,
            rgba(8,20,42,.97),
            rgba(2,8,20,.98)
        );
    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        0 0 50px rgba(90,150,255,.08);
    overflow:hidden;
}
.haldo-window.active{
    border-color:rgba(150,210,255,.28);
    box-shadow:
        0 35px 100px rgba(0,0,0,.65),
        0 0 60px rgba(100,180,255,.15);
}
.window-header{
    height:48px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8px 0 14px;
    background:rgba(255,255,255,.045);
    border-bottom:1px solid rgba(255,255,255,.08);
    user-select:none;
}
.window-title{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}
.window-title strong{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.window-actions{
    display:flex;
    gap:4px;
}
.window-actions button{
    width:34px;
    height:34px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#fff;
    font-size:17px;
}
.window-actions button:hover{
    background:rgba(255,255,255,.10);
}
.window-actions .close:hover{
    background:rgba(255,70,90,.30);
}
.window-body{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:16px;
}
/* =========================================================
   AI WINDOW
========================================================= */
.ai-window{
    width:min(780px,calc(100vw - 24px));
    height:min(650px,calc(100vh - 90px));
}
.ai-chat{
    height:100%;
    display:flex;
    flex-direction:column;
}
.ai-messages{
    flex:1;
    overflow:auto;
    padding:8px;
}
.ai-message{
    max-width:85%;
    margin:8px 0;
    padding:11px 14px;
    border-radius:15px;
    line-height:1.5;
    white-space:pre-wrap;
}
.ai-message.user{
    margin-left:auto;
    background:
        linear-gradient(
            135deg,
            rgba(70,140,255,.32),
            rgba(60,80,190,.20)
        );
}
.ai-message.assistant{
    background:rgba(255,255,255,.065);
}
.ai-input{
    display:flex;
    gap:8px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.08);
}
.ai-input textarea{
    flex:1;
    min-height:46px;
    max-height:130px;
    resize:none;
    border:1px solid rgba(255,255,255,.12);
    border-radius:13px;
    padding:12px;
    background:rgba(0,0,0,.20);
    color:#fff;
    outline:none;
}
.ai-input button{
    width:50px;
    border:0;
    border-radius:13px;
    background:#3ddc84;
    color:#021008;
    font-weight:800;
}
/* =========================================================
   APP CONTENT
========================================================= */
.app-panel{
    display:flex;
    flex-direction:column;
    gap:14px;
}
.app-card{
    padding:15px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:15px;
    background:rgba(255,255,255,.045);
}
.app-card h3{
    margin:0 0 7px;
}
.app-card p{
    margin:0;
    color:rgba(255,255,255,.55);
    line-height:1.5;
}
.app-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.app-actions button{
    min-height:38px;
    padding:0 14px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    background:rgba(255,255,255,.06);
    color:#fff;
}
/* =========================================================
   RESPONSIVE
========================================================= */
@media(max-width:700px){
    #topbar{
        height:58px;
    }
    #menu{
        top:62px;
        right:7px;
        left:7px;
        bottom:7px;
        width:auto;
        border-radius:18px;
    }
    .haldo-window{
        left:7px !important;
        top:62px !important;
        width:calc(100vw - 14px) !important;
        height:calc(100vh - 70px) !important;
        min-width:0;
        border-radius:15px;
    }
    #sun{
        width:125px;
        height:125px;
    }
}
</style>

<body>
<div id="haldo-os">
<div id="galaxy"></div>
<div id="topbar">
    <div id="brand">
        <img
            id="brand-logo"
            src="assets/logo/logo.png"
            alt="HalDo">
        <strong>HALDO AI OS 22</strong>
    </div>
    <button
        id="menu-button"
        aria-label="Menü">☰</button>
</div>
<div id="sun">
    <img
        id="sun-logo"
        src="assets/logo/logo.png"
        alt="Living HalDo AI">
</div>
<div id="start-screen">
    <img
        id="start-logo"
        src="assets/logo/logo.png"
        alt="HalDo AI">
    <h1>HalDo AI OS 22</h1>
    <p>Bereit für HalDo AI</p>
    <button id="start-button">
        🟢 START HALDO AI
    </button>
</div>
<aside id="menu">
    <div id="menu-head">
        <strong>HalDo AI OS 22</strong>
        <button id="menu-close">×</button>
    </div>
    <div id="app-list"></div>
</aside>
<div id="window-layer"></div>
</div>
<script>
"use strict";
/* =========================================================
   GLOBAL HALDO CORE
========================================================= */
window.HalDo = window.HalDo || {};
const HD = window.HalDo;
HD.version = "22.0.0";
HD.events = HD.events || {
    map:new Map(),
    on(name,fn){
        if(!this.map.has(name)){
            this.map.set(name,new Set());
        }
        this.map.get(name).add(fn);
        return ()=>{
            this.map.get(name)?.delete(fn);
        };
    },
    emit(name,data){
        this.map.get(name)?.forEach(fn=>{
            try{
                fn(data);
            }catch(error){
                console.error(
                    "HalDo Event Error:",
                    name,
                    error
                );
            }
        });
        window.dispatchEvent(
            new CustomEvent(
                "haldo:"+name,
                {detail:data}
            )
        );
    }
};
/* =========================================================
   STORAGE
========================================================= */
HD.storage = HD.storage || {
    prefix:"haldo-os22:",
    get(key,fallback=null){
        try{
            const value =
                localStorage.getItem(
                    this.prefix+key
                );
            return value === null
                ? fallback
                : JSON.parse(value);
        }catch{
            return fallback;
        }
    },
    set(key,value){
        try{
            localStorage.setItem(
                this.prefix+key,
                JSON.stringify(value)
            );
            return true;
        }catch{
            return false;
        }
    },
    remove(key){
        localStorage.removeItem(
            this.prefix+key
        );
    }
};
HD.appState = HD.appState || {
    get(id){
        return HD.storage.get(
            "app:"+id,
            {}
        );
    },
    save(id,state){
        return HD.storage.set(
            "app:"+id,
            state || {}
        );
    }
};
/* =========================================================
   RUNTIME
========================================================= */
HD.runtime = HD.runtime || {
    components:new Map(),
    register(name,value){
        this.components.set(
            name,
            value
        );
        HD.events.emit(
            "runtime:registered",
            {
                name,
                value
            }
        );
        return value;
    },
    get(name){
        return this.components.get(name);
    }
};
/* =========================================================
   COMPLETE APP LIST
========================================================= */
const HALDO_APPS = [
["ai","🤖","HalDo AI"],
["chat","💬","Chat"],
["voice","🎙️","Voice"],
["mail","📧","HalDo Mail"],
["browser","🌐","HalDo Browser"],
["translator","🌍","Übersetzer"],
["dictionary","📖","Wörterbuch"],
["languages","🗣️","Sprachen"],
["ezidi-keyboard","⌨️","Êzîdî-Tastatur"],
["traffic","🚗","Verkehr"],
["traffic-warning","⚠️","Verkehrswarnungen"],
["maps","🗺️","Karten"],
["navigation","🧭","Navigation"],
["driving-school","🚘","Fahrschule"],
["license-learning","🚦","Führerschein / Verkehrslernen"],
["health","🏥","Gesundheit"],
["medicine","💊","Medikamente / Erinnerungen"],
["learning","🧠","Lernen"],
["university","🎓","Universität"],
["school","🏫","Schule"],
["training","🧑‍🏫","Ausbildung"],
["library","📚","Bibliothek"],
["notes","📝","Notizen"],
["calendar","📅","Kalender"],
["reminders","⏰","Erinnerungen"],
["weather","🌦️","Wetter"],
["nature","🌱","Natur / Wiesen"],
["environment","🌳","Umwelt"],
["science","🔬","Wissenschaft"],
["code","💻","Code / Entwicklung"],
["files","📁","Dateien"],
["documents","🗂️","Dokumente"],
["communication","📧","Kommunikation"],
["notifications","🔔","Benachrichtigungen"],
["settings","⚙️","Einstellungen"],
["security","🔐","Sicherheit"],
["user","👤","Benutzer"],
["storage","💾","Speicher"],
["network","🌐","Netzwerk"],
["updates","🔄","Updates"],
["system-status","📊","Systemstatus"],
["system-tools","🛠️","Systemtools"],
["bluetooth","🔵","Bluetooth"],
["vehicle","🚘","Fahrzeug / Android Auto"],
["music","🎵","HalDo Music Studio"],
["audio","🎙️","HalDo Audio Studio"],
["video","🎬","HalDo Video Studio"],
["creative","🖼️","HalDo Creative Studio"],
["design","🎨","HalDo Design Studio"]
];
/* =========================================================
   APP MANAGER
========================================================= */
HD.appManager = {
    instances:new Map(),
    open(id){
        if(
            id === "ai" ||
            id === "chat"
        ){
            return HD.windowManager.openAI();
        }
        let instance =
            this.instances.get(id);
        if(!instance){
            const manifest =
                HALDO_APPS.find(
                    app=>app[0]===id
                );
            if(!manifest){
                return null;
            }
            instance = {
                id,
                icon:manifest[1],
                name:manifest[2],
                state:HD.appState.get(id,{})
            };
            this.instances.set(
                id,
                instance
            );
        }
        HD.windowManager.openApp(
            instance
        );
        HD.events.emit(
            "app:opened",
            {app:instance}
        );
        return instance;
    },
    close(id){
        HD.windowManager.close(id);
        HD.events.emit(
            "app:closed",
            {appId:id}
        );
    }
};
HD.runtime.register(
    "app-manager",
    HD.appManager
);
/* =========================================================
   WINDOW MANAGER
========================================================= */
HD.windowManager = {
    windows:new Map(),
    z:100,
    openAI(){
        const existing =
            this.windows.get("ai");
        if(existing){
            this.focus("ai");
            return existing;
        }
        return this.createAI();
    },
    openApp(app){
        const existing =
            this.windows.get(app.id);
        if(existing){
            this.focus(app.id);
            return existing;
        }
        return this.createApp(app);
    },
    createAI(){
        const window =
            this.baseWindow(
                "ai",
                "☀️",
                "HalDo AI",
                true
            );
        const messages =
            document.createElement("div");
        messages.className =
            "ai-messages";
        const input =
            document.createElement("div");
        input.className =
            "ai-input";
        const textarea =
            document.createElement("textarea");
        textarea.placeholder =
            "Schreibe HalDo AI...";
        const send =
            document.createElement("button");
        send.textContent =
            "➤";
        input.append(
            textarea,
            send
        );
        const chat =
            document.createElement("div");
        chat.className =
            "ai-chat";
        chat.append(
            messages,
            input
        );
        window.body.appendChild(chat);
        const addMessage =
            (role,text)=>{
                const item =
                    document.createElement("div");
                item.className =
                    "ai-message "+role;
                item.textContent =
                    text;
                messages.appendChild(item);
                messages.scrollTop =
                    messages.scrollHeight;
            };
        addMessage(
            "assistant",
            "Hallo ❤️💙 Ich bin HalDo AI. Wie kann ich dir helfen?"
        );
        const respond =
            async()=>{
                const text =
                    textarea.value.trim();
                if(!text)return;
                textarea.value="";
                addMessage(
                    "user",
                    text
                );
                HD.events.emit(
                    "ai:message",
                    {text}
                );
                /*
                 * Vorhandene AI-Module automatisch nutzen,
                 * falls sie im Projekt geladen sind.
                 */
                let answer = null;
                try{
                    const candidates = [
                        HD.ai?.respond,
                        HD.ai?.chat,
                        HD.aiCore?.respond,
                        HD.aiCore?.chat,
                        HD.aiEngine?.respond,
                        HD.aiEngine?.chat
                    ].filter(
                        fn=>typeof fn==="function"
                    );
                    if(candidates.length){
                        answer =
                            await candidates[0](
                                text
                            );
                    }
                }catch(error){
                    console.error(
                        "HalDo AI:",
                        error
                    );
                }
                if(
                    answer === undefined ||
                    answer === null ||
                    answer === ""
                ){
                    answer =
                        this.localAI(
                            text
                        );
                }
                addMessage(
                    "assistant",
                    String(answer)
                );
            };
        send.addEventListener(
            "click",
            respond
        );
        textarea.addEventListener(
            "keydown",
            event=>{
                if(
                    event.key==="Enter" &&
                    !event.shiftKey
                ){
                    event.preventDefault();
                    respond();
                }
            }
        );
        this.focus("ai");
        return window;
    },
    localAI(text){
        const t =
            text.toLowerCase();
        if(
            /hallo|hi|hey|guten morgen|guten abend/
                .test(t)
        ){
            return "Hallo ❤️💙 Schön, dass du da bist. Ich bin HalDo AI und höre dir zu.";
        }
        if(
            /wer bist du|was bist du/.test(t)
        ){
            return "Ich bin HalDo AI im HalDo AI OS 22. Ich kann dich bei Informationen, Schreiben, Lernen, Organisation, Sprache und deinen HalDo-Apps unterstützen.";
        }
        if(
            /hilfe|helfen/.test(t)
        ){
            return "Natürlich. Sag mir einfach, was du machen möchtest. Du kannst mir Fragen stellen, Texte geben, etwas schreiben lassen oder eine HalDo-App öffnen.";
        }
        if(
            /zeit|uhr/.test(t)
        ){
            return "Die aktuelle Systemzeit ist "+
                new Date().toLocaleTimeString(
                    "de-DE"
                )+".";
        }
        return "Ich habe deine Nachricht erhalten. Die Verbindung zu den vorhandenen HalDo-AI-Modulen wird automatisch verwendet, sobald deren AI-Service geladen ist.";
    },
    createApp(app){
        const window =
            this.baseWindow(
                app.id,
                app.icon,
                app.name
            );
        const panel =
            document.createElement("div");
        panel.className =
            "app-panel";
        const card =
            document.createElement("div");
        card.className =
            "app-card";
        const h =
            document.createElement("h3");
        h.textContent =
            app.name;
        const p =
            document.createElement("p");
        p.textContent =
            "HalDo "+app.name+
            " ist mit dem gemeinsamen OS-Fundament verbunden.";
        card.append(h,p);
        const actions =
            document.createElement("div");
        actions.className =
            "app-actions";
        [
            "Öffnen",
            "Speichern",
            "AI",
            "Einstellungen"
        ].forEach(label=>{
            const button =
                document.createElement("button");
            button.textContent =
                label;
            button.addEventListener(
                "click",
                ()=>{
                    HD.events.emit(
                        "app:action",
                        {
                            appId:app.id,
                            action:label
                        }
                    );
                    if(label==="Speichern"){
                        HD.appState.save(
                            app.id,
                            {
                                updatedAt:
                                    Date.now()
                            }
                        );
                    }
                    if(label==="AI"){
                        this.openAI();
                    }
                }
            );
            actions.appendChild(button);
        });
        card.appendChild(actions);
        panel.appendChild(card);
        window.body.appendChild(panel);
        this.focus(app.id);
        return window;
    },
    baseWindow(
        id,
        icon,
        title,
        ai=false
    ){
        const element =
            document.createElement("section");
        element.className =
            "haldo-window"+
            (ai ? " ai-window" : "");
        element.dataset.id =
            id;
        element.style.left =
            Math.max(
                12,
                70 +
                (this.windows.size*18)
            )+"px";
        element.style.top =
            Math.max(
                70,
                80 +
                (this.windows.size*18)
            )+"px";
        const header =
            document.createElement("header");
        header.className =
            "window-header";
        const titleElement =
            document.createElement("div");
        titleElement.className =
            "window-title";
        titleElement.innerHTML =
            "<span>"+
            icon+
            "</span>";
        const strong =
            document.createElement("strong");
        strong.textContent =
            title;
        titleElement.appendChild(
            strong
        );
        const actions =
            document.createElement("div");
        actions.className =
            "window-actions";
        const minimize =
            document.createElement("button");
        minimize.textContent =
            "−";
        const close =
            document.createElement("button");
        close.textContent =
            "×";
        close.className =
            "close";
        actions.append(
            minimize,
            close
        );
        header.append(
            titleElement,
            actions
        );
        const body =
            document.createElement("div");
        body.className =
            "window-body";
        element.append(
            header,
            body
        );
        document
            .getElementById("window-layer")
            .appendChild(element);
        const record = {
            id,
            element,
            body,
            header
        };
        this.windows.set(
            id,
            record
        );
        header.addEventListener(
            "pointerdown",
            ()=>this.focus(id)
        );
        element.addEventListener(
            "pointerdown",
            ()=>this.focus(id)
        );
        /*
         * EIN KLICK = SCHLIESSEN
         */
        close.addEventListener(
            "click",
            event=>{
                event.preventDefault();
                event.stopPropagation();
                this.close(id);
            }
        );
        minimize.addEventListener(
            "click",
            event=>{
                event.preventDefault();
                event.stopPropagation();
                element.style.display =
                    "none";
            }
        );
        return record;
    },
    focus(id){
        const record =
            this.windows.get(id);
        if(!record)return;
        this.z++;
        record.element.style.zIndex =
            String(this.z);
        this.windows.forEach(
            item=>{
                item.element.classList.remove(
                    "active"
                );
            }
        );
        record.element.classList.add(
            "active"
        );
    },
    close(id){
        const record =
            this.windows.get(id);
        if(!record)return;
        record.element.remove();
        this.windows.delete(id);
        HD.events.emit(
            "window:closed",
            {id}
        );
    }
};

/* =========================================================
   365 YEAR STARS
========================================================= */
const now =
    new Date();
const dayOfYear =
    Math.floor(
        (
            now -
            new Date(
                now.getFullYear(),
                0,
                0
            )
        ) /
        86400000
    );
for(
    let i=0;
    i<365;
    i++
){
    const star =
        document.createElement("span");
    star.className =
        "star";
    if(i < dayOfYear){
        star.classList.add(
            "past"
        );
    }
    const angle =
        (i/365)*Math.PI*2;
    const radius =
        28 +
        Math.random()*20;
    const x =
        50 +
        Math.cos(angle)*
        radius;
    const y =
        50 +
        Math.sin(angle)*
        radius;
    star.style.left =
        x+"%";
    star.style.top =
        y+"%";
    const hue =
        (i*7)%360;
    star.style.color =
        "hsl("+hue+" 90% 75%)";
    star.style.animationDelay =
        (Math.random()*3)+"s";
    galaxy.appendChild(
        star
    );
}

/* =========================================================
   AUTOMATIC CONNECTION TO EXISTING HALDO MODULES
========================================================= */
function connectExistingModules(){
    const aliases = {
        system:[
            "system"
        ],
        kernel:[
            "kernel"
        ],
        ai:[
            "ai",
            "aiCore",
            "aiEngine"
        ],
        voice:[
            "voice",
            "aiVoice",
            "aiSpeech"
        ],
        router:[
            "router",
            "appRouter"
        ],
        storage:[
            "storage",
            "storageManager"
        ],
        windowManager:[
            "windowManager"
        ],
        appManager:[
            "appManager"
        ],
        appRegistry:[
            "appRegistry"
        ]
    };
    Object.entries(
        aliases
    ).forEach(
        ([service,names])=>{
            names.some(
                name=>{
                    if(
                        HD[name]
                    ){
                        HD.runtime.register(
                            service,
                            HD[name]
                        );
                        return true;
                    }
                    return false;
                }
            );
        }
    );
}
