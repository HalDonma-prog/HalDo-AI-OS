<script>

    "use strict";


    HD.events =
        HD.events ||
        {};


    HD.events.listeners =
        HD.events.listeners ||
        {};


    HD.events.history =
        HD.events.history ||
        [];


    HD.events.maxHistory =
        500;


    HD.events.on =
        function(
            event,
            callback,
            options = {}
        ) {

            if (
                typeof event !==
                "string"
            ) {

                return function(){};

            }


            if (
                typeof callback !==
                "function"
            ) {

                return function(){};

            }


            if (
                !Array.isArray(
                    this.listeners[event]
                )
            ) {

                this.listeners[event] =
                    [];

            }


            const listener = {

                callback,

                once:
                    options.once === true,

                priority:
                    Number(
                        options.priority ||
                        0
                    )

            };


            this.listeners[event]
                .push(
                    listener
                );


            this.listeners[event]
                .sort(
                    (
                        a,
                        b
                    ) =>
                        b.priority -
                        a.priority
                );


            return function unsubscribe() {

                HD.events.off(
                    event,
                    callback
                );

            };

        };


    HD.events.once =
        function(
            event,
            callback,
            options = {}
        ) {

            return this.on(
                event,
                callback,
                {
                    ...options,
                    once:
                        true
                }
            );

        };


    HD.events.off =
        function(
            event,
            callback
        ) {

            const list =
                this.listeners[event];


            if (
                !Array.isArray(
                    list
                )
            ) {

                return;

            }


            this.listeners[event] =
                list.filter(
                    listener =>
                        listener.callback !==
                        callback
                );

        };


    HD.events.emit =
        function(
            event,
            data = {}
        ) {

            if (
                typeof event !==
                "string"
            ) {

                return false;

            }


            const record = {

                event,

                data,

                time:
                    Date.now()

            };


            this.history.push(
                record
            );


            if (
                this.history.length >
                this.maxHistory
            ) {

                this.history.shift();

            }


            const list =
                this.listeners[event];


            if (
                !Array.isArray(
                    list
                )
            ) {

                return true;

            }


            list
                .slice()
                .forEach(
                    listener => {

                        try {

                            listener.callback(
                                data
                            );

                        }

                        catch (
                            error
                        ) {

                            HD.errors.report(
                                error,
                                "EventBus:" +
                                event
                            );

                        }


                        if (
                            listener.once
                        ) {

                            this.off(
                                event,
                                listener.callback
                            );

                        }

                    }
                );


            return true;

        };


    HD.events.clear =
        function(
            event = null
        ) {

            if (
                event === null
            ) {

                this.listeners =
                    {};

                return;

            }


            delete this.listeners[
                event
            ];

        };


    HD.events.getHistory =
        function(
            event = null
        ) {

            if (
                !event
            ) {

                return [
                    ...this.history
                ];

            }


            return this.history.filter(
                item =>
                    item.event ===
                    event
            );

        };


    /*
     * Globale Kurzformen.
     */

    HD.on =
        function(
            event,
            callback,
            options
        ) {

            return HD.events.on(
                event,
                callback,
                options
            );

        };


    HD.once =
        function(
            event,
            callback,
            options
        ) {

            return HD.events.once(
                event,
                callback,
                options
            );

        };


    HD.off =
        function(
            event,
            callback
        ) {

            return HD.events.off(
                event,
                callback
            );

        };


    HD.emit =
        function(
            event,
            data
        ) {

            return HD.events.emit(
                event,
                data
            );

        };

</script>

<script>

    HD.runtime =
        HD.runtime ||
        {};


    HD.runtime.initialized =
        false;


    HD.runtime.modules =
        HD.runtime.modules ||
        new Map();


    HD.runtime.dependencies =
        HD.runtime.dependencies ||
        new Map();


    HD.runtime.startOrder =
        HD.runtime.startOrder ||
        [];


    HD.runtime.register =
        function(
            name,
            module,
            options = {}
        ) {

            if (
                !name ||
                !module
            ) {

                return false;

            }


            const entry = {

                name,

                module,

                initialized:
                    false,

                started:
                    false,

                priority:
                    Number(
                        options.priority ||
                        0
                    ),

                dependencies:
                    Array.isArray(
                        options.dependencies
                    )
                        ? [
                            ...options.dependencies
                        ]
                        : []

            };


            this.modules.set(
                name,
                entry
            );


            this.dependencies.set(
                name,
                entry.dependencies
            );


            HD.emit(
                "runtime:module-registered",
                {

                    name,

                    module,

                    dependencies:
                        entry.dependencies

                }
            );


            return true;

        };


    HD.runtime.has =
        function(
            name
        ) {

            return this.modules.has(
                name
            );

        };


    HD.runtime.get =
        function(
            name
        ) {

            const entry =
                this.modules.get(
                    name
                );


            return entry
                ? entry.module
                : undefined;

        };


    HD.runtime.getEntry =
        function(
            name
        ) {

            return this.modules.get(
                name
            );

        };


    HD.runtime.unregister =
        function(
            name
        ) {

            if (
                !this.modules.has(
                    name
                )
            ) {

                return false;

            }


            this.modules.delete(
                name
            );


            this.dependencies.delete(
                name
            );


            HD.emit(
                "runtime:module-unregistered",
                {
                    name
                }
            );


            return true;

        };


    HD.runtime.list =
        function()
        {

            return Array.from(
                this.modules.values()
            );

        };


    HD.runtime.resolveOrder =
        function()
        {

            const visited =
                new Set();


            const visiting =
                new Set();


            const result =
                [];


            const visit =
                function(
                    name
                ) {

                    if (
                        visited.has(
                            name
                        )
                    ) {

                        return;

                    }


                    if (
                        visiting.has(
                            name
                        )
                    ) {

                        throw new Error(
                            "Runtime dependency cycle: " +
                            name
                        );

                    }


                    visiting.add(
                        name
                    );


                    const dependencies =
                        HD.runtime.dependencies
                            .get(
                                name
                            ) ||
                        [];


                    dependencies.forEach(
                        dependency => {

                            if (
                                HD.runtime.has(
                                    dependency
                                )
                            ) {

                                visit(
                                    dependency
                                );

                            }

                        }
                    );


                    visiting.delete(
                        name
                    );


                    visited.add(
                        name
                    );


                    result.push(
                        name
                    );

                };


            const modules =
                HD.runtime
                    .list()
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            a.priority -
                            b.priority
                    );


            modules.forEach(
                entry => {

                    visit(
                        entry.name
                    );

                }
            );


            this.startOrder =
                result;


            return [
                ...result
            ];

        };


    HD.runtime.initialize =
        async function()
        {

            if (
                this.initialized
            ) {

                return true;

            }


            const order =
                this.resolveOrder();


            for (
                const name of
                order
            ) {

                const entry =
                    this.modules.get(
                        name
                    );


                if (
                    !entry
                ) {

                    continue;

                }


                const module =
                    entry.module;


                try {

                    if (
                        typeof module.initialize ===
                        "function"
                    ) {

                        await module.initialize(
                            HD
                        );

                    }


                    entry.initialized =
                        true;


                    HD.emit(
                        "runtime:module-initialized",
                        {
                            name
                        }
                    );

                }

                catch (
                    error
                ) {

                    HD.errors.report(
                        error,
                        "Runtime.initialize:" +
                        name
                    );

                }

            }


            this.initialized =
                true;


            HD.emit(
                "runtime:initialized"
            );


            return true;

        };


    HD.runtime.start =
        async function()
        {

            const order =
                this.startOrder.length
                    ? this.startOrder
                    : this.resolveOrder();


            for (
                const name of
                order
            ) {

                const entry =
                    this.modules.get(
                        name
                    );


                if (
                    !entry ||
                    entry.started
                ) {

                    continue;

                }


                const module =
                    entry.module;


                try {

                    if (
                        typeof module.start ===
                        "function"
                    ) {

                        await module.start(
                            HD
                        );

                    }


                    entry.started =

                    HD.emit(
                        "runtime:module-started",
                        {
                            name
                        }
                    );

                }

                catch (
                    error
                ) {

                    HD.errors.report(
                        error,
                        "Runtime.start:" +

                    );

                }

            }


            HD.emit(

<script>

    HD.moduleManager = {

        modules:
            new Map(),

        states:
            new Map(),


        register:
            function(
                name,
                module,
                options = {}
            ) {

                if (
                    !name ||
                    !module
                ) {

                    return false;

                }


                this.modules.set(
                    name,
                    {

                        name,

                        module,

                        options

                    }
                );


                this.states.set(
                    name,
                    "registered"
                );


                HD.runtime.register(
                    name,
                    module,
                    options
                );


                HD.emit(
                    "module:registered",
                    {
                        name
                    }
                );


                return true;

            },


        get:
            function(
                name
            ) {

                const entry =
                    this.modules.get(
                        name
                    );


                return entry
                    ? entry.module
                    : null;

            },


        has:
            function(
                name
            ) {

                return this.modules.has(
                    name
                );

            },


        state:
            function(
                name
            ) {

                return this.states.get(
                    name
                ) ||
                "unknown";

            },


        setState:
            function(
                name,
                state
            ) {

                this.states.set(
                    name,
                    state
                );


                HD.emit(
                    "module:state",
                    {

                        name,

                        state

                    }
                );

            },


        unregister:
            function(

            ) {

                const removed =
                    this.modules.delete(
                        name
                    );


                this.states.delete(
                    name
                );


                HD.runtime.unregister(
                    name
                );


                if (
                    removed
                ) {

                    HD.emit(
                        "module:unregistered",
                        {
                            name
                        }
                    );

                }


                return removed;

            },


        list:
            function()

                    this.modules.keys()
                );

            }

    };

        }

<script>

    HD.systemLoader = {

        loaded:
            false,

        components:
            [],

        queue:
            [],


        add:
            function(
                name,
                loader,
                options = {}
            ) {

                if (
                    typeof loader !==
                    "function"
                ) {

                    return false;

                }


                this.queue.push({

                    name,

                    loader,

                    priority:
                        Number(
                            options.priority ||
                            0
                        ),

                    required:
                        options.required !==
                        false

                });


                this.queue.sort(
                    (
                        a,
                        b
                    ) =>
                        a.priority -
                        b.priority
                );


                return true;

            },


        load:
            async function()
            {

                if (
                    this.loaded
                ) {

                    return true;

                }


                for (
                    const item
                    of this.queue
                ) {

                    try {

                        await item.loader(
                            HD
                        );


                        this.components.push(
                            item.name
                        );


                        HD.emit(
                            "loader:component-loaded",
                            {
                                name:
                                    item.name
                            }
                        );

                    }

                    catch (
                        error
                    ) {

                        HD.errors.report(
                            error,
                            "SystemLoader:" +
                            item.name
                        );


                        if (
                            item.required
                        ) {

                            throw error;

                        }

                    }

                }


                this.loaded =
                    true;


                HD.emit(
                    "loader:complete",
                    {

                        components:
                            [
                                ...this.components
                            ]

                    }
                );


                return true;

            }

    };


    HD.runtime.register(
        "system-loader",
        HD.systemLoader,
        {
            priority:
                20
        }
    );

</script>

<script>

    HD.storage =
        HD.storage ||
        {};


    HD.storage.prefix =
        HD.constants.storagePrefix;


    HD.storage.memory =
        HD.storage.memory ||
        new Map();


    HD.storage.available =
        function()
        {

            try {

                const testKey =
                    this.prefix +
                    "__test__";


                localStorage.setItem(
                    testKey,
                    "1"
                );


                localStorage.removeItem(
                    testKey
                );


                return true;

            }

            catch (
                error
            ) {

                return false;

            }

        };


    HD.storage.key =
        function(
            key
        ) {

            return (
                this.prefix +
                String(key)
            );

        };


    HD.storage.serialize =
        function(
            value
        ) {

            try {

                return JSON.stringify(
                    value
                );

            }

            catch (
                error
            ) {

                HD.errors.report(
                    error,
                    "Storage.serialize"
                );


                return null;

            }

        };


    HD.storage.deserialize =
        function(
            value,
            fallback = null
        ) {

            try {

                return JSON.parse(
                    value
                );

            }

            catch (
                error
            ) {

                return fallback;

            }

        };


    HD.storage.set =
        function(
            key,
            value
        ) {

            const storageKey =
                this.key(
                    key
                );


            this.memory.set(
                storageKey,
                value
            );


            try {

                const serialized =
                    this.serialize(
                        value
                    );


                if (
                    serialized !==
                    null
                ) {

                    localStorage.setItem(
                        storageKey,
                        serialized
                    );

                }

            }

            catch (
                error
            ) {

                HD.errors.report(
                    error,
                    "Storage.set"
                );

            }


            HD.emit(
                "storage:set",
                {

                    key,

                    value

                }
            );


            return true;

        };


    HD.storage.get =
        function(
            key,
            fallback = null
        ) {

            const storageKey =
                this.key(
                    key
                );


            if (
                this.memory.has(
                    storageKey
                )
            ) {

                return this.memory.get(
                    storageKey
                );

            }


            try {

                const stored =
                    localStorage.getItem(
                        storageKey
                    );


                if (
                    stored ===
                    null
                ) {

                    return fallback;

                }


                const parsed =
                    this.deserialize(
                        stored,
                        fallback
                    );


                this.memory.set(
                    storageKey,
                    parsed
                );


                return parsed;

            }

            catch (
                error
            ) {

                return fallback;

            }

        };


    HD.storage.has =
        function(
            key
        ) {

            const storageKey =
                this.key(
                    key
                );


            if (
                this.memory.has(
                    storageKey
                )
            ) {

                return true;

            }


            try {

                return (
                    localStorage.getItem(
                        storageKey
                    ) !== null
                );

            }

            catch (
                error
            ) {

                return false;

            }

        };


    HD.storage.remove =
        function(
            key
        ) {

            const storageKey =
                this.key(
                    key
                );


            this.memory.delete(
                storageKey
            );


            try {

                localStorage.removeItem(
                    storageKey
                );

            }

            catch (
                error
            ) {}


            HD.emit(
                "storage:remove",
                {
                    key
                }
            );


            return true;

        };


    HD.storage.clear =
        function()
        {

            const prefix =
                this.prefix;


            this.memory.clear();


            try {

                const keys =
                    [];


                for (
                    let index = 0;
                    index <
                    localStorage.length;
                    index++
                ) {

                    const key =
                        localStorage.key(
                            index
                        );


                    if (
                        key &&
                        key.startsWith(
                            prefix
                        )
                    ) {

                        keys.push(
                            key
                        );

                    }

                }


                keys.forEach(
                    key => {

                        localStorage.removeItem(
                            key
                        );

                    }
                );

            }

            catch (
                error
            ) {

                HD.errors.report(
                    error,
                    "Storage.clear"
                );

            }


            HD.emit(
                "storage:clear"
            );


            return true;

        };


    HD.storage.keys =
        function()
        {

            const result =
                [];


            try {

                for (
                    let index = 0;
                    index <
                    localStorage.length;
                    index++
                ) {

                    const key =
                        localStorage.key(
                            index
                        );


                    if (
                        key &&
                        key.startsWith(
                            this.prefix
                        )
                    ) {

                        result.push(
                            key.slice(
                                this.prefix.length
                            )
                        );

                    }

                }

            }

            catch (
                error
            ) {}


            return result;

        };


    HD.storage.snapshot =
        function()
        {

            const snapshot =
                {};


            this.keys()
                .forEach(
                    key => {

                        snapshot[key] =
                            this.get(
                                key
                            );

                    }
                );


            return snapshot;

        };


    HD.services.register(
        "storage",
        HD.storage
    );


    HD.runtime.register(
        "storage",
        HD.storage,
        {

            priority:
                40,

            dependencies:
                [
                    "services"
                ]

        }
    );


    HD.storage.available();

</script>

                        orbit
                    );


                    const planet =
                        document.createElement(
                            "div"
                        );


                    planet.className =
                        "haldo-planet";


                    if (
                        definition.id ===
                        "earth"
                    ) {

                        planet.classList.add(
                            "haldo-planet-earth"
                        );

                    }


                    planet.style.width =
                        definition.size +
                        "px";


                    planet.style.height =
                        definition.size +
                        "px";


                    planet.style.background =
                        planet.style.background ||
                        definition.color;


                    planet.style.color =
                        definition.color;


                    container.appendChild(
                        planet
                    );


                    if (
                        definition.rings
                    ) {

                        const rings =
                            document.createElement(
                                "div"
                            );


                        rings.className =
                            "haldo-saturn-rings";


                        planet.appendChild(
                            rings
                        );

                    }


                    const data = {

                        ...definition,

                        orbitElement:
                            orbit,

                        planetElement:
                            planet,

                        radius:
                            diameter / 2,

                        angle:
                            definition.phase

                    };


                    /*
                     * Erde erhält einen Mond.
                     */

                    if (
                        definition.moon
                    ) {

                        const moon =
                            document.createElement(
                                "div"
                            );


                        moon.className =
                            "haldo-moon";


                        planet.appendChild(
                            moon
                        );


                        data.moonElement =
                            moon;


                        data.moonAngle =
                            0;

                    }


                    this.engine.orbitElements
                        .push(
                            orbit
                        );


                    this.engine.planetElements
                        .push(
                            planet
                        );


                    this.engine.planets
                        .push(
                            data
                        );

                }
            );

        };


    /* ========================================================
       PLANET POSITION UPDATE
       ======================================================== */

    HD3.cosmic.updatePlanets =
        function(
            delta
        ) {

            const centerX =
                this.engine.centerX;


            const centerY =
                this.engine.centerY;


            const speedSetting =
                HD3.getSetting(
                    "planets.speed",
                    "normal"
                );


            let multiplier =
                1;


            if (
                speedSetting ===
                "slow"
            ) {

                multiplier =
                    0.45;

            }

            else if (
                speedSetting ===
                "fast"
            ) {

                multiplier =
                    2;

            }


            this.engine.planets.forEach(
                planet => {

                    planet.angle +=
                        delta *
                        0.00025 *
                        planet.speed *
                        planet.direction *
                        multiplier;


                    const x =
                        centerX +
                        Math.cos(
                            planet.angle
                        ) *
                        planet.radius;


                    const y =
                        centerY +
                        Math.sin(
                            planet.angle
                        ) *
                        planet.radius *
                        0.62;


                    planet.planetElement.style.left =
                        x + "px";


                    planet.planetElement.style.top =
                        y + "px";


                    if (
                        planet.moonElement
                    ) {

                        planet.moonAngle +=
                            delta *
                            0.0018;


                        planet.moonElement.style.left =
                            (
                                50 +
                                Math.cos(
                                    planet.moonAngle
                                ) *
                                100
                            ) + "%";


                        planet.moonElement.style.top =
                            (
                                50 +
                                Math.sin(
                                    planet.moonAngle
                                ) *
                                70
                            ) + "%";

                    }

                }
            );

        };


    /* ========================================================
       STAR ANIMATION
       ======================================================== */

    HD3.cosmic.updateStars =
        function(
            time
        ) {

            const animationEnabled =
                HD3.getSetting(
                    "interface.animations",
                    true
                );


            if (
                !animationEnabled
            ) {

                return;

            }


            this.engine.stars.forEach(
                (
                    star,
                    index
                ) => {

                    const wave =
                        Math.sin(
                            time *
                            0.0012 +
                            index *
                            0.73
                        );


                    const base =
                        star.brightness;


                    star.element.style.opacity =
                        Math.max(
                            0.12,
                            Math.min(
                                1,
                                base +
                                wave *
                                0.12
                            )
                        );

                }
            );

        };


    /* ========================================================
       COSMIC ANIMATION LOOP
       ======================================================== */

    HD3.cosmic.animate =
        function(
            time
        ) {

            if (
                !this.engine.running
            ) {

                return;

            }


            const delta =
                this.engine.lastTime
                    ? time -
                      this.engine.lastTime
                    : 16;


            this.engine.lastTime =
                time;


            this.updateStars(
                time
            );


            this.updatePlanets(
                delta
            );


            this.engine.frame =
                requestAnimationFrame(
                    this.animate.bind(
                        this
                    )
                );

        };


    /* ========================================================
       START COSMIC WORLD
       ======================================================== */

    HD3.cosmic.start =
        function() {

            if (
                this.engine.running
            ) {

                return;

            }


            this.updateCenter();


            this.injectStyles();


            this.createStars();


            this.createOrbits();


            this.engine.initialized =
                true;


            this.engine.running =
                true;


            this.engine.lastTime =
                0;


            this.engine.frame =
                requestAnimationFrame(
                    this.animate.bind(
                        this
                    )
                );


            HD3.world.applySettings();


            HD3.emit(
                "cosmic:started"
            );

        };


    /* ========================================================
       STOP COSMIC WORLD
       ======================================================== */

    HD3.cosmic.stop =
        function() {

            this.engine.running =
                false;


            if (
                this.engine.frame
            ) {

                cancelAnimationFrame(
                    this.engine.frame
                );

            }


            this.engine.frame =
                null;


            HD3.emit(
                "cosmic:stopped"
            );

        };


    /* ========================================================
       REFRESH COSMIC WORLD
       ======================================================== */

    HD3.cosmic.refresh =
        function() {

            this.updateCenter();


            this.createStars();


            this.createOrbits();


            HD3.world.updateCalendar();


            HD3.world.applySettings();


            HD3.emit(
                "cosmic:refreshed"
            );

        };


    /* ========================================================
       SETTINGS CONNECTION
       ======================================================== */

    HD3.on(
        "world:settingsChanged",
        function() {

            if (
                !HD3.cosmic.engine.initialized
            ) {

                return;

            }


            HD3.cosmic.refresh();

        }
    );


    HD3.on(
        "world:calendarChanged",
        function() {

            if (
                !HD3.cosmic.engine.initialized
            ) {

                return;

            }


            HD3.cosmic.createStars();

        }
    );


    window.addEventListener(
        "resize",
        function() {

            if (
                HD3.cosmic.engine.initialized
            ) {

                HD3.cosmic.refresh();

            }

        }
    );


    /* ========================================================
       DOM READY CONNECTION
       ======================================================== */

    HD3.on(
        "foundation:ready",
        function() {

            HD3.cosmic.start();

        }
    );


    /*
     * Wenn foundation:ready bereits ausgelöst wurde,
     * direkt nach DOM-Bereitschaft starten.
     */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                HD3.cosmic.start();

            },
            {
                once:
                    true
            }
        );

    }

    else {

        HD3.cosmic.start();

    }


    HD3.emit(
        "cosmic:foundationReady"
    );

</script>

                window.innerHeight;

                    8,
                    (

                left + "px";


            element.style.top =
                top + "px";

            this.state.zIndex +=

            record.element.style.zIndex =
                String(

    HD4.windows.enableDrag =
        function(
            record

            if (
                !record ||
                !record.header

                return;

            }


            let dragging =
                false;


            let startX =
                0;


            let startY =
                0;


            let startLeft =
                0;


            let startTop =
                0;


            const pointerDown =
                event => {

                    if (
                        event.target.closest(
                            ".haldo-window-action"
                        )
                    ) {

                        return;

                    }


                    dragging =
                        true;


                    this.focus(
                        record.id

                    startX =
                        event.clientX;


                    startY =
                        event.clientY;


                    startLeft =
                        parseFloat(
                            record.element
                                .style
                                .left

                    startTop =
                        parseFloat(
                            record.element
                                .style
                                .top
                        ) || 0;


                    record.header
                        .setPointerCapture?.(
                            event.pointerId
                        );

                };

                event => {

                    if (
                        !dragging
                    ) {

                        return;

                    const deltaX =
                        event.clientX -
                        startX;


                    const deltaY =
                        event.clientY -
                        startY;


                    const maxLeft =
                        Math.max(
                            8,
                            window.innerWidth -
                            record.element
                                .offsetWidth -
                            8
                        );


                    const maxTop =
                        Math.max(
                            8,
                            window.innerHeight -
                            record.element
                                .offsetHeight -
                            8
                        );


                    const left =
                        Math.max(
                            8,
                            Math.min(
                                maxLeft,
                                startLeft +
                                deltaX
                            )
                        );


                    const top =
                        Math.max(
                            8,
                            Math.min(
                                maxTop,
                                startTop +
                                deltaY
                            )
                        );


                    record.element.style.left =
                        left + "px";


                    record.element.style.top =
                        top + "px";

                };


            const pointerUp =
                event => {

                    dragging =
                        false;


                    try {

                        record.header
                            .releasePointerCapture?.(
                                event.pointerId
                            );

                    }

                    catch {}

                };


            record.header.addEventListener(
                "pointerdown",
                pointerDown
            );


            record.header.addEventListener(
                "pointermove",
                pointerMove
            );


            record.header.addEventListener(
                "pointerup",
                pointerUp
            );


            record.header.addEventListener(
                "pointercancel",
                pointerUp
            );

                            Math.min(

                                    startX
                                )

                    const height =

                            Math.min(

                                (

                                    startY
                                )
                            )
                        );


                    record.element.style.width =
                        width + "px";


                    record.element.style.height =
                        height + "px";

                };


            const pointerUp =
                event => {

                    resizing =
                        false;


                    try {

                        record.resizeHandle
                            .releasePointerCapture?.(
                                event.pointerId
                            );

                    catch {}

                };


            record.resizeHandle
                .addEventListener(
                    "pointerdown",
                    pointerDown
                );


            record.resizeHandle
                .addEventListener(
                    "pointermove",
                    pointerMove
                );


            record.resizeHandle
                .addEventListener(
                    "pointerup",
                    pointerUp
                );


            record.resizeHandle
                .addEventListener(
                    "pointercancel",
                    pointerUp
                );

        };


    /* ========================================================
       CREATE WINDOW
       ======================================================== */

    HD4.windows.open =
        function(
            options = {}
        ) {

            this.injectStyles();


            const appId =
                options.appId ||
                "app";


            const title =
                options.title ||
                appId;


            const width =
                Math.min(
                    window.innerWidth -
                    16,
                    Math.max(
                        this.defaults.minWidth,
                        Number(
                            options.width ||
                            this.defaults.width
                        )
                    )
                );


            const height =
                Math.min(
                    window.innerHeight -
                    16,
                    Math.max(
                        this.defaults.minHeight,
                        Number(
                            options.height ||
                            this.defaults.height
                        )
                    )
                );


            const id =
                this.createId(
                    appId
                );


            const element =
                document.createElement(
                    "section"
                );


            element.className =
                "haldo-window";


            element.id =
                id;


            element.dataset.appId =
                appId;


            element.style.width =
                width + "px";


            element.style.height =
                height + "px";


            element.style.zIndex =
                ++this.state.zIndex;


            const header =
                document.createElement(
                    "header"
                );


            header.className =
                "haldo-window-header";


            const titleElement =
                document.createElement(
                    "div"
                );


            titleElement.className =
                "haldo-window-title";


            titleElement.textContent =
                title;


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "haldo-window-actions";


            const minimize =
                document.createElement(
                    "button"
                );


            minimize.type =
                "button";


            minimize.className =
                "haldo-window-action";


            minimize.textContent =
                "−";


            minimize.setAttribute(
                "aria-label",
                "Minimieren"
            );


            const close =
                document.createElement(
                    "button"
                );


            close.type =
                "button";


            close.className =
                "haldo-window-action";


            close.textContent =
                "×";


            close.setAttribute(
                "aria-label",
                "Schließen"
            );


            actions.appendChild(
                minimize
            );


            actions.appendChild(
                close
            );


            header.appendChild(
                titleElement
            );


            header.appendChild(
                actions
            );


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "haldo-window-content";


            if (
                options.content instanceof
                HTMLElement
            ) {

                content.appendChild(
                    options.content
                );

            }

            else if (
                typeof options.content ===
                "string"
            ) {

                content.innerHTML =
                    options.content;

            }


            const resizeHandle =
                document.createElement(
                    "div"
                );


            resizeHandle.className =
                "haldo-window-resize-handle";


            element.appendChild(
                header
            );


            element.appendChild(
                content
            );


            element.appendChild(
                resizeHandle
            );


            const root =
                document.getElementById(
                    "haldo-window-root"
                );


            if (
                !root
            ) {

                console.error(
                    "[HalDo] Window root missing"
                );


                return null;

            }


            root.appendChild(
                element
            );


            const record = {

                id,

                appId,

                title,

                element,

                header,

                content,

                resizeHandle,

                minimized:
                    false,

                closed:
                    false

            };


            this.state.windows.set(
                id,
                record
            );


            this.center(
                element
            );


            this.enableDrag(
                record
            );


            this.enableResize(
                record
            );


            element.addEventListener(
                "pointerdown",
                () => {

                    this.focus(
                        id
                    );

                }
            );


            minimize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    this.minimize(
                        id
                    );

                }
            );


            close.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    this.close(
                        id
                    );

                }
            );


            this.state.activeWindowId =
                id;


            HD4.emit(
                "window:opened",
                record
            );


            return record;

        };


    /* ========================================================
       MINIMIZE
       ======================================================== */

    HD4.windows.minimize =
        function(
            windowId
        ) {

            const record =
                this.state.windows.get(
                    windowId
                );


            if (
                !record
            ) {

                return false;

            }


            record.minimized =
                !record.minimized;


            record.element.style.display =
                record.minimized
                    ? "none"
                    : "";


            if (
                !record.minimized
            ) {

                this.focus(
                    windowId
                );

            }


            HD4.emit(
                "window:minimized",
                record
            );


            return true;

        };


    /* ========================================================
       CLOSE
       ======================================================== */

    HD4.windows.close =
        function(
            windowId
        ) {

            const record =
                this.state.windows.get(
                    windowId
                );


            if (
                !record ||
                record.closed
            ) {

                return false;

            }


            record.closed =
                true;


            record.element.classList.add(
                "is-closing"
            );


            setTimeout(
                () => {

                    record.element.remove();


                    this.state.windows.delete(
                        windowId
                    );


                    if (
                        this.state
                            .activeWindowId ===
                        windowId
                    ) {

                        this.state
                            .activeWindowId =
                            null;

                    }


                    HD4.emit(
                        "window:closed",
                        record
                    );

                },
                150
            );


            return true;

       CLOSE APP WINDOWS
       ======================================================== */

        ) {

                        );

                    }

                }
            );

    /* ========================================================
       RESPONSIVE WINDOW REPOSITION
       ======================================================== */

    HD4.windows.reflow =
        function() {

            this.state.windows.forEach(
                record => {

                    if (
                        record.closed
                    ) {

                        return;

                    }


                    if (
                        window.innerWidth <=
                        700
                    ) {

                        record.element.style.left =
                            "8px";


                        record.element.style.top =
                            "8px";


                        record.element.style.width =
                            "calc(100vw - 16px)";


                        record.element.style.height =
                            "calc(100dvh - 16px)";

                    }

                    else {

                        this.center(
                            record.element
                        );

                    }

                }
            );

        };


    window.addEventListener(
        "resize",
        function() {

            HD4.windows.reflow();

        }
    );


    /* ========================================================
       INITIALIZE
       ======================================================== */

    HD4.windows.initialized =
        true;


    HD4.windows.state.initialized =
        true;


    HD4.emit(
        "windows:ready"
    );

HD6.windows.escapeHTML =
function(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

};

HD6.windows.bindWindowEvents =
function(record) {

    const element =
        record.element;

    element.addEventListener(

        () => {

            this.focus(record.id);

        }
    );


    element
        .querySelector(

        )
        .addEventListener(
            "click",

                this.close(record.id);

        );


    element
        .querySelector(

        )
        .addEventListener(

        .querySelector(

        )
        .addEventListener(

};


/* =========================================================
   FOCUS WINDOW
   ========================================================= */

HD6.windows.focus =
function(id) {

    const record =
        this.state.windows.get(id);

    if (!record) {
        return null;
    }


    this.state.zIndex++;

    record.element.style.zIndex =
        String(this.state.zIndex);

    this.state.activeWindowId =
        id;


    this.state.windows.forEach(
        item => {

            item.element.classList.toggle(
                "active",
                item.id === id
            );

        }
    );


    if (
        record.minimized
    ) {

        record.minimized =
            false;

        record.element.classList.remove(
            "minimized"
        );

    }


    HD6.emit(
        "window:focused",
        record
    );


    return record;

};


/* =========================================================
   CLOSE WINDOW
   ========================================================= */

HD6.windows.close =
function(id) {

    const record =
        this.state.windows.get(id);

    if (!record) {
        return false;
    }


    const element =
        record.element;


    element.classList.remove(
        "haldo-window-visible"
    );


    setTimeout(
        () => {

            if (
                element.parentNode
            ) {

                element.parentNode.removeChild(
                    element
                );

            }

        },
        180
    );


    this.state.windows.delete(id);


    if (
        this.state.activeWindowId === id
    ) {

        this.state.activeWindowId =
            null;

    }


    HD6.emit(
        "window:closed",
        record
    );


    return true;

};


/* =========================================================
   MINIMIZE WINDOW

HD6.windows.minimize =
function(id) {

        this.state.windows.get(id);

    if (!record) {
        return false;
    }


    record.minimized =
        true;

    record.element.classList.add(
        "minimized"
    );


    if (
        this.state.activeWindowId === id
    ) {

        this.state.activeWindowId =
            null;

    }


    HD6.emit(
        "window:minimized",
        record
    );


    return true;

};


/* =========================================================
   MAXIMIZE / RESTORE
   ========================================================= */

HD6.windows.maximize =
function(id) {

    const record =
        this.state.windows.get(id);

    if (!record) {
        return false;
    }


    if (
        record.maximized
    ) {

        this.restore(id);

        return true;

    }


    record.previous = {

        left:
            record.element.offsetLeft,

        top:
            record.element.offsetTop,

        width:
            record.element.offsetWidth,

        height:
            record.element.offsetHeight

    };


    record.maximized =
        true;

    record.element.classList.add(
        "maximized"
    );


    this.focus(id);


    HD6.emit(
        "window:maximized",
        record
    );


    return true;

};


/* =========================================================
   RESTORE WINDOW
   ========================================================= */

HD6.windows.restore =
function(id) {

    const record =
        this.state.windows.get(id);

    if (!record) {
        return false;
    }


    record.maximized =
        false;

    record.element.classList.remove(
        "maximized"
    );


    if (
        record.previous
    ) {

        record.element.style.left =
            record.previous.left + "px";

        record.element.style.top =
            record.previous.top + "px";

        record.element.style.width =
            record.previous.width + "px";

        record.element.style.height =
            record.previous.height + "px";

    }


    this.focus(id);


    HD6.emit(
        "window:restored",
        record
    );


    return true;

};


/* =========================================================
   DRAG SYSTEM
   ========================================================= */

HD6.windows.bindDrag =
function(record) {

    const header =
        record.element.querySelector(
            "[data-window-drag]"
        );

    if (!header) {
        return;
    }


    let dragging =
        false;

    let startX =
        0;

    let startY =
        0;

    let startLeft =
        0;

    let startTop =
        0;


    const move =
        event => {

            if (!dragging) {
                return;
            }


            const dx =
                event.clientX -
                startX;

            const dy =
                event.clientY -
                startY;


            let left =
                startLeft + dx;

            let top =
                startTop + dy;


            const maxLeft =
                Math.max(
                    0,
                    window.innerWidth -
                    record.element.offsetWidth
                );

            const maxTop =
                Math.max(
                    0,
                    window.innerHeight -
                    60
                );


            left =
                Math.max(
                    0,
                    Math.min(
                        left,
                        maxLeft
                    )
                );

            top =
                Math.max(
                    0,
                    Math.min(
                        top,
                        maxTop
                    )
                );


            record.element.style.left =
                left + "px";

            record.element.style.top =
                top + "px";

        };


    const stop =
        () => {

            if (!dragging) {
                return;
            }

            dragging =
                false;

            document.removeEventListener(
                "mousemove",
                move
            );

            document.removeEventListener(
                "mouseup",
                stop
            );

        };


    header.addEventListener(
        "mousedown",
        event => {

            if (
                event.target.closest(
                    ".haldo-window-controls"
                )
            ) {
                return;
            }


            if (
                record.maximized
            ) {
                return;
            }


            dragging =
                true;

            startX =
                event.clientX;

            startY =
                event.clientY;

            startLeft =
                record.element.offsetLeft;

            startTop =
                record.element.offsetTop;


            this.focus(record.id);


            document.addEventListener(
                "mousemove",
                move
            );

            document.addEventListener(
                "mouseup",
                stop
            );

        }
    );

};


/* =========================================================
   RESIZE SYSTEM
   ========================================================= */

HD6.windows.bindResize =
function(record) {

    const handle =
        record.element.querySelector(
            "[data-window-resize]"
        );

    if (!handle) {
        return;
    }


    let resizing =
        false;

    let startX =
        0;

    let startY =
        0;

    let startWidth =
        0;

    let startHeight =
        0;


    const move =
        event => {

            if (!resizing) {
                return;
            }


            const width =
                Math.max(
                    280,
                    startWidth +
                    (
                        event.clientX -
                        startX
                    )
                );


            const height =
                Math.max(
                    180,
                    startHeight +
                    (
                        event.clientY -
                        startY
                    )
                );


            record.element.style.width =
                Math.min(
                    width,
                    window.innerWidth - 16
                ) + "px";


            record.element.style.height =
                Math.min(
                    height,
                    window.innerHeight - 16
                ) + "px";

        };


    const stop =
        () => {

            if (!resizing) {
                return;
            }

            resizing =
                false;

            document.removeEventListener(
                "mousemove",
                move
            );

            document.removeEventListener(
                "mouseup",
                stop
            );

        };


    handle.addEventListener(
        "mousedown",
        event => {

            event.preventDefault();

            event.stopPropagation();


            if (
                record.maximized
            ) {
                return;
            }


            resizing =
                true;

            startX =
                event.clientX;

            startY =
                event.clientY;

            startWidth =
                record.element.offsetWidth;

            startHeight =
                record.element.offsetHeight;


            this.focus(record.id);


            document.addEventListener(
                "mousemove",
                move
            );

            document.addEventListener(
                "mouseup",
                stop
            );

        }
    );

};


/* =========================================================
   SET CONTENT
   ========================================================= */

HD6.windows.setContent =
function(id, content) {

    const record =
        this.state.windows.get(id);

    if (!record) {
        return false;
    }


    const container =
        record.content;


    if (
        content instanceof Node
    ) {

        container.replaceChildren(
            content
        );

    }

    else {

        container.innerHTML =
            String(
                content ?? ""
            );

    }


    HD6.emit(
        "window:contentChanged",
        {

            window:
                record,

            content

        "aria-hidden",
        "false"
    );


    this.setStatus(
        "bereit"
    );


    requestAnimationFrame(
        () => {

            if (
                this.state.input
            ) {

                this.state.input.focus();

            }

            this.scrollToBottom();

        }
    );


    HD7.emit(
        "ai:opened"
    );


    return true;

};


/* =========================================================
   CLOSE
   ========================================================= */

HD7.aiChat.close =
function() {

    if (
        !this.state.root
    ) {

        return false;

    }


    this.state.open =
        false;


    this.state.root.classList.remove(
        "open"
    );


    this.state.root.setAttribute(
        "aria-hidden",
        "true"
    );


    HD7.emit(
        "ai:closed"
    );


    return true;

};

   TOGGLE
   ========================================================= */

HD7.aiChat.toggle =
function() {

    if (
        this.state.open
    ) {

        return this.close();

    }

    return this.open();

};

   AUTO RESIZE
   ========================================================= */

HD7.aiChat.autoResize =
function() {

    if (
        !this.state.input
    ) {

        return;

    }


    this.state.input.style.height =
        "auto";


    this.state.input.style.height =
        Math.min(
            this.state.input.scrollHeight,
            140
        ) + "px";

};

   STATUS
   ========================================================= */

HD7.aiChat.setStatus =
function(text) {

    if (
        this.state.status
    ) {

        this.state.status.textContent =
            String(text || "bereit");

    }

};


/* =========================================================
   ADD MESSAGE
   ========================================================= */

HD7.aiChat.addMessage =
function(role, text) {

    const cleanText =
        String(text ?? "");


    this.state.messages.push({

        role,

        text:
            cleanText,

        timestamp:
            Date.now()

    });


    const empty =
        this.state.root?.querySelector(
            "[data-ai-empty]"
        );


    if (
        empty
    ) {

        empty.remove();

    }


    const row =
        document.createElement("div");


    row.className =
        "haldo-ai-message " +
        (
            role === "user"
                ? "user"
                : "assistant"
        );


    if (
        role === "user"
    ) {

        row.innerHTML = `

            <div
                class="haldo-ai-message-bubble"
            >
                ${this.escape(cleanText)}
            </div>

        `;

    }

    else {

        row.innerHTML = `

            <div
                class="haldo-ai-message-avatar"
            >

                <img
                    src="logo.png"
                    alt="HalDo"
                >

            </div>


            <div
                class="haldo-ai-message-bubble"
            >
                ${this.escape(cleanText)}
            </div>

        `;

    }


    this.state.messagesElement.appendChild(
        row
    );


    this.scrollToBottom();


    HD7.emit(
        "ai:message",
        {

            role,

            text:
                cleanText

        }
    );


    return row;

};

   SCROLL
   ========================================================= */

HD7.aiChat.scrollToBottom =
function() {

    if (
        !this.state.messagesElement

    `;


    this.state.messagesElement.appendChild(

    );


    this.state.typingElement =

    if (

/* =========================================================
   AI ENGINE CONNECTION
   ========================================================= */

HD7.aiChat.generateResponse =
async function(message) {

    const candidates = [

        HD7.ai?.chat,

        HD7.ai?.respond,

        HD7.ai?.ask,

        HD7.aiCore?.chat,

        HD7.aiCore?.respond,

        HD7.aiEngine?.generate,

        HD7.aiEngine?.respond

    ];


    for (
        const candidate of candidates
    ) {

        if (
            typeof candidate !==
            "function"
        ) {

            continue;

        }


        try {

            const owner =
                HD7.ai ||
                HD7.aiCore ||
                HD7.aiEngine ||
                HD7;


            const result =
                await candidate.call(
                    owner,
                    message
                );


            if (
                typeof result === "string" &&
                result.trim()
            ) {

                return result;

            }


            if (
                result &&
                typeof result.text ===
                "string" &&
                result.text.trim()
            ) {

                return result.text;

            }

        }

        catch(error) {

            console.warn(
                "[HalDo AI] Engine connection failed:",
                error
            );

        }

    }


    return this.localResponse(
        message
    );

};


/* =========================================================
   SEND MESSAGE
   ========================================================= */

HD7.aiChat.send =
async function() {

    if (
        this.state.processing
    ) {

        return;

    }


    if (
        !this.state.input
    ) {

        this.create();

    }


    const message =
        String(
            this.state.input.value || ""
        ).trim();


    if (!message) {

        return;

    }


    this.state.input.value =
        "";

    this.autoResize();


    this.addMessage(
        "user",
        message
    );


    this.state.processing =
        true;


    if (
        this.state.sendButton
    ) {

        this.state.sendButton.disabled =
            true;

    }


    this.setStatus(
        "denkt …"
    );


    this.showTyping();


    try {

        const response =
            await this.generateResponse(
                message
            );


        this.hideTyping();


        this.addMessage(
            "assistant",
            response
        );


        this.setStatus(
            "bereit"
        );

    }

    catch(error) {

        this.hideTyping();


        console.error(
            "[HalDo AI] Chat error:",
            error
        );


        this.addMessage(
            "assistant",
            "Beim Verarbeiten der Nachricht ist ein Fehler aufgetreten."
        );


        this.setStatus(
            "Fehler"
        );


        HD7.emit(
            "ai:error",
            error
        );

    }

    finally {

        this.state.processing =
            false;


        if (
            this.state.sendButton
        ) {

            this.state.sendButton.disabled =
                false;

        }


        if (
            this.state.input &&
            this.state.open
        ) {

            this.state.input.focus();

        }

    }

};

HD7.aiChat.clear =

    this.state.messages =

HD7.aiChat.startVoice =
function() {

    const voiceCandidates = [

        HD7.aiVoice?.start,

        HD7.voice?.start,

        HD7.aiSpeech?.start,

        HD7.speech?.start

    ];


    for (

    ) {

        try {

            );

            );

document.addEventListener(

            if (

    /* ========================================================

    HD8.world.drawSun =

            if (
                !this.state.settings.sun
            ) {

                return;

            }


            const ctx =
                this.state.context;


            const width =
                this.state.width;


            const height =
                this.state.height;


            const centerX =
                width *
                .5;


            const centerY =

                .47;

                Math.min(

                    height

                .105;

                centerY,

                ctx.translate(
                    centerX,
                    centerY

                ctx.rotate(
                    time *
                    .00004

                for (
                    let index = 0;
                    index < rayCount;
                    index += 1
                ) {

                    const angle =
                        (
                            index /
                            rayCount
                        ) *
                        Math.PI *
                        2;


                    const inner =

                        1.12;


                    const outer =
                        radius *
                        (
                            1.35 +
                            .08 *
                            Math.sin(

                                .001 +

                        outer,

                    ctx.strokeStyle =

                    ctx.lineWidth =

                    ctx.stroke();

                ctx.restore();

                    radius *
                    .30,

                    centerY -
                    radius *
                    .35,

                    radius *
                    .08,

                    centerY,

            sunGradient.addColorStop(

            sunGradient.addColorStop(

                "#ff9e2c"
            );


            ctx.fillStyle =

            ctx.beginPath();


            ctx.arc(

                centerY,
                radius,
                0,
                Math.PI *
                2
            );


            ctx.fill();

        };


    /* ========================================================

    HD8.world.drawOrbits =
        function(

            centerY,
            baseRadius
        ) {

            if (

            ) {

                        .58,

                        2

            );

                !this.state.settings.planets
            ) {

                .5;

                .47;

                Math.max(

                    height
                ) *
                .52;

            );


            this.state.planets.forEach(
                (

                        planet.speed *

                            .rotationSpeed *
                        16;


                    const orbitRadius =
