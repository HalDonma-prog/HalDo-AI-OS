<!DOCTYPE html>
<html lang="de">

<head>

    <!-- =====================================================
         HalDo AI OS 18
         Professional Ultimate Foundation
         ===================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#05070d"
    >

    <meta
        name="description"
        content="HalDo AI OS 18 – Professional Ultimate Foundation"
    >

    <meta
        name="application-name"
        content="HalDo AI OS 18"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI"
    >

    <title>
        HalDo AI OS 18
    </title>


    <!-- =====================================================
         ICON / FAVICON
         ===================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="assets/logo/logo.png"
    >


    <!-- =====================================================
         STYLES
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/system.css"
    >

    <link
        rel="stylesheet"
        href="css/launcher.css"
    >

    <link
        rel="stylesheet"
        href="css/app-router.css"
    >

    <link
        rel="stylesheet"
        href="css/logo-animation.css"
    >


    <!-- =====================================================
         OPTIONAL PWA
         ===================================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>

    <!-- =====================================================
         SYSTEM BOOT
         ===================================================== -->

    <div
        id="haldo-boot"
        class="haldo-boot"
        aria-live="polite"
    >

        <div
            class="haldo-boot-logo"
        >

            <div
                class="haldo-logo-aura"
                aria-hidden="true"
            ></div>

            <div
                class="haldo-logo-orbit"
                aria-hidden="true"
            ></div>

            <img
                src="assets/logo/logo.png"
                alt="HalDo AI"
                class="haldo-logo-image"
            >

        </div>


        <div
            class="haldo-boot-text"
        >

            <div
                class="haldo-boot-title"
            >
                HalDo AI
            </div>

            <div
                id="haldo-boot-status"
                class="haldo-boot-status"
            >
                HalDo AI OS startet…
            </div>

        </div>


        <div
            class="haldo-boot-progress"
            aria-hidden="true"
        >

            <div
                id="haldo-boot-progress-bar"
                class="haldo-boot-progress-bar"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         MAIN SYSTEM
         ===================================================== -->

    <div
        id="haldo-system"
        class="haldo-system"
        hidden
    >


        <!-- =================================================
             TOP BAR
             ================================================= -->

        <header
            id="haldo-topbar"
            class="haldo-topbar"
        >

            <button
                id="haldo-menu-button"
                class="haldo-topbar-button"
                type="button"
                aria-label="HalDo AI Menü öffnen"
                aria-expanded="false"
            >

                <span>
                    ☰
                </span>

            </button>


            <div
                class="haldo-topbar-brand"
            >

                <img
                    src="assets/logo/logo.png"
                    alt="HalDo AI"
                    class="haldo-topbar-logo"
                >

                <span>
                    HalDo AI
                </span>

            </div>


            <button
                id="haldo-settings-button"
                class="haldo-topbar-button"
                type="button"
                aria-label="Einstellungen öffnen"
            >

                <span>
                    ⚙
                </span>

            </button>

        </header>


        <!-- =================================================
             MAIN AREA
             ================================================= -->

        <main
            id="haldo-main"
            class="haldo-main"
        >


            <!-- =============================================
                 HOME / WELCOME
                 ============================================= -->

            <section
                id="haldo-home"
                class="haldo-home"
            >

                <div
                    class="haldo-welcome-logo"
                >

                    <div
                        class="haldo-logo-aura"
                        aria-hidden="true"
                    ></div>

                    <div
                        class="haldo-logo-orbit"
                        aria-hidden="true"
                    ></div>

                    <img
                        src="assets/logo/logo.png"
                        alt="HalDo AI"
                        class="haldo-logo-image"
                    >

                </div>


                <div
                    class="haldo-welcome-content"
                >

                    <p
                        class="haldo-welcome-small"
                    >
                        Willkommen bei
                    </p>

                    <h1>
                        HalDo AI OS 18
                    </h1>

                    <p
                        class="haldo-welcome-description"
                    >
                        Professional Ultimate Foundation
                    </p>

                </div>


                <!-- =========================================
                     QUICK ACTIONS
                     ========================================= -->

                <div
                    class="haldo-quick-actions"
                >

                    <button
                        type="button"
                        class="haldo-quick-action"
                        data-open-app="ai-chat"
                    >

                        <span>
                            💬
                        </span>

                        <strong>
                            AI Chat
                        </strong>

                        <small>
                            Mit HalDo AI sprechen
                        </small>

                    </button>


                    <button
                        type="button"
                        class="haldo-quick-action"
                        data-open-app="ai-voice"
                    >

                        <span>
                            🎙️
                        </span>

                        <strong>
                            AI Voice
                        </strong>

                        <small>
                            Sprachfunktionen
                        </small>

                    </button>


                    <button
                        type="button"
                        class="haldo-quick-action"
                        data-open-app="settings"
                    >

                        <span>
                            ⚙
                        </span>

                        <strong>
                            Einstellungen
                        </strong>

                        <small>
                            System konfigurieren
                        </small>

                    </button>

                </div>

            </section>


            <!-- =============================================
                 APP LAUNCHER
                 ============================================= -->

            <section
                id="haldo-launcher"
                class="haldo-launcher"
                aria-label="HalDo AI Apps"
            >


                <!-- =========================================
                     LAUNCHER HEADER
                     ========================================= -->

                <div
                    class="haldo-launcher-header"
                >

                    <div>

                        <p
                            class="haldo-section-label"
                        >
                            HALDO AI OS
                        </p>

                        <h2>
                            Apps
                        </h2>

                    </div>


                    <div
                        class="haldo-launcher-status"
                    >

                        <span
                            class="haldo-status-dot"
                        ></span>

                        <span>
                            System bereit
                        </span>

                    </div>

                </div>


                <!-- =========================================
                     SEARCH
                     ========================================= -->

                <div
                    class="haldo-search-container"
                >

                    <label
                        for="haldo-app-search"
                        class="sr-only"
                    >
                        Apps suchen
                    </label>

                    <span
                        class="haldo-search-icon"
                        aria-hidden="true"
                    >
                        ⌕
                    </span>

                    <input
                        id="haldo-app-search"
                        class="haldo-app-search"
                        type="search"
                        autocomplete="off"
                        placeholder="Apps suchen…"
                        aria-label="Apps suchen"
                    >

                </div>


                <!-- =========================================
                     CATEGORIES
                     ========================================= -->

                <nav
                    id="haldo-category-list"
                    class="haldo-category-list"
                    aria-label="App Kategorien"
                >

                    <!-- Wird vom Launcher erzeugt -->

                </nav>


                <!-- =========================================
                     APP GRID
                     ========================================= -->

                <div
                    id="haldo-app-grid"
                    class="haldo-app-grid"
                    aria-live="polite"
                >

                    <!-- Wird von launcher.js erzeugt -->

                </div>


                <!-- =========================================
                     EMPTY STATE
                     ========================================= -->

                <div
                    id="haldo-launcher-empty"
                    class="haldo-launcher-empty"
                    hidden
                >

                    <div>
                        ⌕
                    </div>

                    <h3>
                        Keine App gefunden
                    </h3>

                    <p>
                        Versuche einen anderen Suchbegriff.
                    </p>

                </div>

            </section>


            <!-- =============================================
                 APP ROUTER ROOT
                 ============================================= -->

            <main
                id="haldo-app-root"
                class="haldo-app-root"
                data-haldo-app-root
                hidden
                aria-live="polite"
            ></main>


        </main>


        <!-- =================================================
             BOTTOM NAVIGATION
             ================================================= -->

        <nav
            id="haldo-bottom-nav"
            class="haldo-bottom-nav"
            aria-label="Hauptnavigation"
        >

            <button
                type="button"
                class="haldo-bottom-nav-button active"
                data-navigation="home"
            >

                <span>
                    ⌂
                </span>

                <small>
                    Start
                </small>

            </button>


            <button
                type="button"
                class="haldo-bottom-nav-button"
                data-navigation="apps"
            >

                <span>
                    ◈
                </span>

                <small>
                    Apps
                </small>

            </button>


            <button
                type="button"
                class="haldo-bottom-nav-button"
                data-navigation="ai-chat"
            >

                <span>
                    ✦
                </span>

                <small>
                    HalDo AI
                </small>

            </button>


            <button
                type="button"
                class="haldo-bottom-nav-button"
                data-navigation="settings"
            >

                <span>
                    ⚙
                </span>

                <small>
                    System
                </small>

            </button>

        </nav>


        <!-- =================================================
             MENU OVERLAY
             ================================================= -->

        <div
            id="haldo-menu-overlay"
            class="haldo-menu-overlay"
            hidden
        >

            <aside
                id="haldo-main-menu"
                class="haldo-main-menu"
                aria-label="HalDo AI Hauptmenü"
            >

                <div
                    class="haldo-menu-brand"
                >

                    <div
                        class="haldo-menu-logo"
                    >

                        <img
                            src="assets/logo/logo.png"
                            alt="HalDo AI"
                        >

                    </div>

                    <div>

                        <strong>
                            HalDo AI
                        </strong>

                        <small>
                            OS 18
                        </small>

                    </div>

                </div>


                <nav
                    class="haldo-menu-navigation"
                >

                    <button
                        type="button"
                        data-navigation="home"
                    >
                        <span>⌂</span>
                        Startseite
                    </button>


                    <button
                        type="button"
                        data-navigation="apps"
                    >
                        <span>◈</span>
                        Alle Apps
                    </button>


                    <button
                        type="button"
                        data-navigation="ai-chat"
                    >
                        <span>✦</span>
                        HalDo AI
                    </button>


                    <button
                        type="button"
                        data-navigation="settings"
                    >
                        <span>⚙</span>
                        Einstellungen
                    </button>

                </nav>


                <div
                    class="haldo-menu-footer"
                >

                    <small>
                        HalDo AI OS 18
                    </small>

                    <small>
                        Professional Ultimate Foundation
                    </small>

                </div>

            </aside>

        </div>


        <!-- =================================================
             GLOBAL NOTIFICATION
             ================================================= -->

        <div
            id="haldo-notification-area"
            class="haldo-notification-area"
            aria-live="polite"
            aria-atomic="true"
        ></div>


    </div>


    <!-- =====================================================
         NOSCRIPT
         ===================================================== -->

    <noscript>

        <div
            style="
                padding:2rem;
                font-family:sans-serif;
                text-align:center;
            "
        >

            <h1>
                HalDo AI OS benötigt JavaScript
            </h1>

            <p>
                Bitte aktiviere JavaScript in deinem Browser,
                damit HalDo AI OS gestartet werden kann.
            </p>

        </div>

    </noscript>


    <!-- =====================================================
         JAVASCRIPT
         -----------------------------------------------------
         REIHENFOLGE NICHT ÄNDERN
         ===================================================== -->

    <script
        src="js/kernel.js"
        defer
    ></script>

    <script
        src="js/system.js"
        defer
    ></script>

    <script
        src="js/app-manager.js"
        defer
    ></script>

    <script
        src="js/app-router.js"
        defer
    ></script>

    <script
        src="js/launcher.js"
        defer
    ></script>

    <script
        src="js/logo-animation.js"
        defer
    ></script>

    <script
        src="js/navigation.js"
        defer
    ></script>

    <script
        src="js/main.js"
        defer
    ></script>


</body>

</html>
