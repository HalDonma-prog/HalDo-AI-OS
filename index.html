<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="HalDo AI OS 24.6 – Cosmic Intelligent Operating System" />
    <title>HalDo AI OS 24.6</title>

    <!-- Three.js für Cosmic World -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           HALDO AI OS 24.6 – ULTIMATE DESIGN
           ============================================================ */

        :root {
            --primary: #6C3CE1;
            --primary-dark: #4A1FA6;
            --primary-light: #8B5CF6;
            --secondary: #00D4FF;
            --accent: #FF6B9D;
            --gold: #FFD700;
            --success: #00FF88;
            --warning: #FFB800;
            --danger: #FF3B30;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(20px);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.4);
            --bg-primary: #0a0a1a;
            --taskbar-height: 56px;
            --menu-top-height: 48px;
            --font-primary: 'Inter', sans-serif;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-primary);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        /* ===== BOOT SCREEN ===== */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #boot-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .boot-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px;
        }
        .boot-logo {
            width: 120px;
            height: 120px;
            border-radius: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bootPulse 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
        }
        #boot-logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }
        @keyframes bootPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 100px rgba(108, 60, 225, 0.5);
            }
        }
        .boot-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .boot-subtitle {
            font-size: 13px;
            font-weight: 300;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: -6px;
        }
        .boot-ring {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top: 3px solid var(--primary-light);
            border-right: 3px solid var(--secondary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .boot-status {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 1px;
            min-height: 24px;
        }
        .boot-progress {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }
        .boot-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .boot-version {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: var(--bg-primary);
            display: none;
        }
        #cosmic-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #cosmic-canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== TOP MENU ===== */
        #top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--menu-top-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 90;
            gap: 8px;
        }
        .menu-left {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            flex: 1;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
        }
        .menu-left::-webkit-scrollbar {
            height: 0;
        }
        .menu-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .menu-item {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
            flex-shrink: 0;
            border: none;
            background: transparent;
            font-family: var(--font-primary);
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .menu-item.active {
            background: var(--primary);
            color: white;
        }
        .menu-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .menu-right .menu-item {
            font-size: 12px;
            padding: 4px 10px;
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--taskbar-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.3);
            gap: 4px;
        }
        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        #taskbar-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 8px;
            cursor: pointer;
            transition: transform var(--transition-fast);
        }
        #taskbar-logo:hover {
            transform: scale(1.08);
        }
        #taskbar-time {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 60px;
        }
        .taskbar-center {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            padding: 0 8px;
            -webkit-overflow-scrolling: touch;
        }
        .taskbar-center::-webkit-scrollbar {
            height: 0;
        }
        .taskbar-app-btn {
            padding: 4px 12px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .taskbar-app-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
        }
        .taskbar-app-btn.active {
            background: rgba(108, 60, 225, 0.25);
            border-color: var(--primary);
            color: var(--text-primary);
        }
        .taskbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .taskbar-right .tb-icon {
            font-size: 16px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: all var(--transition-fast);
            line-height: 1;
            background: none;
            border: none;
            font-family: var(--font-primary);
        }
        .taskbar-right .tb-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        #taskbar-status {
            color: var(--success) !important;
            font-size: 10px !important;
        }

        /* ===== WINDOWS ===== */
        #window-container {
            position: fixed;
            top: var(--menu-top-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--menu-top-height) - var(--taskbar-height));
            z-index: 10;
            pointer-events: none;
            padding: 12px;
        }
        .window {
            position: absolute;
            min-width: 320px;
            min-height: 240px;
            max-width: 94vw;
            max-height: 88vh;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            pointer-events: all;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowOpen 0.25s ease;
            transition: all 0.15s ease;
        }
        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .window.minimized {
            transform: scale(0.8) translateY(40px);
            opacity: 0;
            pointer-events: none;
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
            max-width: 100vw;
            max-height: 100vh;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--glass-border);
            cursor: grab;
            flex-shrink: 0;
            min-height: 40px;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .window-title .icon {
            font-size: 18px;
        }
        .window-controls {
            display: flex;
            gap: 6px;
        }
        .window-controls button {
            width: 13px;
            height: 13px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all var(--transition-fast);
            padding: 0;
            font-size: 8px;
            line-height: 13px;
            text-align: center;
            color: transparent;
        }
        .window-controls .btn-close {
            background: #FF5F57;
        }
        .window-controls .btn-close:hover {
            background: #FF3B30;
            transform: scale(1.15);
        }
        .window-controls .btn-minimize {
            background: #FFBD2E;
        }
        .window-controls .btn-minimize:hover {
            background: #FFA500;
            transform: scale(1.15);
        }
        .window-controls .btn-maximize {
            background: #28C840;
        }
        .window-controls .btn-maximize:hover {
            background: #00A020;
            transform: scale(1.15);
        }
        .window-body {
            flex: 1;
            padding: 16px;
            overflow: auto;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }
        .window-body h2 {
            color: var(--text-primary);
            margin-bottom: 12px;
            font-weight: 700;
        }

        /* ===== AI FLOATING BUTTON ===== */
        .floating-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 30px rgba(108, 60, 225, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            transition: all var(--transition-normal);
            border: none;
            outline: none;
        }
        .floating-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 40px rgba(108, 60, 225, 0.6);
        }
        .floating-btn:active {
            transform: scale(0.94);
        }
        .floating-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        /* ===== FORM ELEMENTS ===== */
        .haldo-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-primary);
            font-size: 14px;
            outline: none;
            transition: all var(--transition-fast);
        }
        .haldo-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }
        .haldo-input::placeholder {
            color: var(--text-muted);
        }
        .haldo-btn {
            padding: 8px 20px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .haldo-btn:hover {
            background: var(--primary-light);
            transform: scale(1.02);
        }
        .haldo-btn:active {
            transform: scale(0.96);
        }
        .haldo-btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
        }
        .haldo-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            :root {
                --taskbar-height: 48px;
                --menu-top-height: 42px;
            }
            .boot-title {
                font-size: 24px;
            }
            .boot-logo {
                width: 80px;
                height: 80px;
            }
            #boot-logo-img {
                width: 50px;
                height: 50px;
            }
            .boot-progress {
                width: 200px;
            }
            #top-menu {
                padding: 0 8px;
                height: var(--menu-top-height);
            }
            .menu-logo {
                width: 26px;
                height: 26px;
            }
            .menu-item {
                font-size: 11px;
                padding: 4px 10px;
            }
            .menu-right .menu-item {
                font-size: 10px;
                padding: 3px 8px;
            }
            #taskbar {
                padding: 0 6px;
                height: var(--taskbar-height);
            }
            #taskbar-logo {
                width: 24px;
                height: 24px;
            }
            #taskbar-time {
                font-size: 11px;
                min-width: 45px;
            }
            .taskbar-app-btn {
                font-size: 10px;
                padding: 2px 8px;
                height: 26px;
            }
            .taskbar-right .tb-icon {
                font-size: 14px;
                padding: 2px 4px;
            }
            #window-container {
                padding: 8px;
                top: var(--menu-top-height);
                height: calc(100% - var(--menu-top-height) - var(--taskbar-height));
            }
            .window {
                min-width: 85vw;
                min-height: 40vh;
                max-width: 96vw;
                max-height: 85vh;
            }
            .window-header {
                padding: 6px 10px;
                min-height: 34px;
            }
            .window-title {
                font-size: 12px;
            }
            .window-title .icon {
                font-size: 16px;
            }
            .window-controls button {
                width: 11px;
                height: 11px;
                line-height: 11px;
                font-size: 7px;
            }
            .window-body {
                padding: 12px;
                font-size: 13px;
            }
            .floating-btn {
                width: 44px;
                height: 44px;
                bottom: 62px;
                right: 12px;
            }
            .floating-logo {
                width: 24px;
                height: 24px;
            }
            .haldo-input {
                font-size: 13px;
                padding: 8px 12px;
            }
            .haldo-btn {
                font-size: 13px;
                padding: 6px 16px;
            }
        }

        @media (max-width: 480px) {
            .menu-left {
                gap: 4px;
            }
            .menu-item {
                font-size: 10px;
                padding: 3px 8px;
            }
            .window {
                min-width: 92vw;
                min-height: 50vh;
            }
            .window-body {
                padding: 10px;
                font-size: 12px;
            }
            .boot-title {
                font-size: 20px;
            }
            .boot-subtitle {
                font-size: 10px;
                letter-spacing: 2px;
            }
        }

        @media (min-width: 1200px) {
            #window-container {
                padding: 20px;
            }
            .window {
                min-width: 500px;
                min-height: 350px;
            }
        }

        /* ===== THEMES ===== */
        [data-theme="light"] {
            --bg-primary: #f0f0f5;
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(0, 0, 0, 0.08);
        }
        [data-theme="cosmic"] {
            --bg-primary: #050510;
            --text-primary: #ffffff;
            --glass-bg: rgba(108, 60, 225, 0.12);
            --glass-border: rgba(108, 60, 225, 0.2);
            --primary: #8B5CF6;
            --secondary: #00D4FF;
        }
    </style>
</head>

<body>

    <!-- ===== BOOT SCREEN ===== -->
    <div id="boot-screen">
        <div class="boot-container">
            <div class="boot-logo">
                <img src="assets/images/logo.png" alt="HalDo OS" id="boot-logo-img" />
            </div>
            <h1 class="boot-title">HalDo AI OS</h1>
            <p class="boot-subtitle">cosmic intelligent operating system</p>
            <div class="boot-loader">
                <div class="boot-ring"></div>
            </div>
            <p class="boot-status" id="boot-status">wird initialisiert…</p>
            <div class="boot-progress">
                <div class="boot-progress-bar" id="boot-progress-bar"></div>
            </div>
            <p class="boot-version">v24.6</p>
        </div>
    </div>

    <!-- ===== DESKTOP ===== -->
    <div id="desktop">

        <!-- Cosmic Canvas -->
        <div id="cosmic-canvas-container"></div>

        <!-- ===== TOP MENU ===== -->
        <div id="top-menu">
            <div class="menu-left" id="menu-left">
                <img src="assets/images/logo.png" alt="HalDo" class="menu-logo" id="menu-logo" />
                <button class="menu-item active" data-menu="apps">📱 Apps</button>
                <button class="menu-item" data-menu="ai">🧠 AI</button>
                <button class="menu-item" data-menu="system">⚙️ System</button>
                <button class="menu-item" data-menu="tools">🔧 Tools</button>
                <button class="menu-item" data-menu="media">🎬 Medien</button>
                <button class="menu-item" data-menu="communication">📡 Kommunikation</button>
                <button class="menu-item" data-menu="office">📊 Office</button>
                <button class="menu-item" data-menu="settings">⚙️ Einstellungen</button>
            </div>
            <div class="menu-right">
                <button class="menu-item" id="menu-theme">🌙</button>
                <button class="menu-item" id="menu-voice">👩</button>
                <button class="menu-item" id="menu-lang">DE</button>
            </div>
        </div>

        <!-- ===== WINDOW CONTAINER ===== -->
        <div id="window-container"></div>

        <!-- ===== AI FLOATING BUTTON ===== -->
        <div id="ai-floating-btn" class="floating-btn">
            <img src="assets/images/logo.png" alt="AI" class="floating-logo" />
        </div>

        <!-- ===== TASKBAR ===== -->
        <div id="taskbar">
            <div class="taskbar-left">
                <img src="assets/images/logo.png" alt="HalDo" id="taskbar-logo" />
                <span id="taskbar-time">00:00</span>
            </div>
            <div class="taskbar-center" id="taskbar-apps"></div>
            <div class="taskbar-right">
                <button class="tb-icon" id="tb-notifications" title="Benachrichtigungen">🔔</button>
                <button class="tb-icon" id="tb-status" title="Systemstatus">●</button>
            </div>
        </div>

    </div>

    <!-- ============================================================
    JAVASCRIPT – DAS KOMPLETTE SYSTEM
    ============================================================ -->

    <script>
        // ============================================================
        //  1. STORAGE SYSTEM
        // ============================================================
        const Storage = {
            prefix: 'haldo_',
            get(key, fallback = null) {
                try { const d = localStorage.getItem(this.prefix + key); return d ? JSON.parse(d) : fallback; } catch {
                    return fallback; }
            },
            set(key, value) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); return true; } catch { return false; }
            },
            remove(key) { localStorage.removeItem(this.prefix + key); return true; },
            clear() {
                Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
                return true;
            }
        };
        window.Storage = Storage;

        // ============================================================
        //  2. EVENT BUS
        // ============================================================
        class EventBus {
            constructor() { this.events = {};
                this.onceEvents = {};
                this.debug = false; }
            on(event, callback, context = null) {
                if (!this.events[event]) this.events[event] = [];
                this.events[event].push({ callback, context });
                return this;
            }
            once(event, callback, context = null) {
                if (!this.onceEvents[event]) this.onceEvents[event] = [];
                this.onceEvents[event].push({ callback, context });
                return this;
            }
            emit(event, data = null) {
                if (this.debug) console.log(`📤 Event: ${event}`, data);
                if (this.events[event]) {
                    this.events[event].forEach(sub => {
                        try { sub.callback.call(sub.context || null, data); } catch (e) { console.error(e); }
                    });
                }
                if (this.onceEvents[event]) {
                    const subs = this.onceEvents[event];
                    this.onceEvents[event] = [];
                    subs.forEach(sub => {
                        try { sub.callback.call(sub.context || null, data); } catch (e) { console.error(e); }
                    });
                }
                return this;
            }
            off(event, callback) {
                if (this.events[event]) {
                    this.events[event] = this.events[event].filter(s => s.callback !== callback);
                }
                return this;
            }
        }
        const eventBus = new EventBus();
        window.EventBus = eventBus;

        // ============================================================
        //  3. KERNEL
        // ============================================================
        const Kernel = {
            version: '24.6',
            name: 'HalDo AI OS',
            state: { initialized: false, uptime: 0 },
            init() {
                console.log(`🔧 ${this.name} ${this.version} – Kernel initialisiert`);
                this.state.initialized = true;
                this.state.uptime = Date.now();
                EventBus.emit('kernel:ready');
                return this;
            },
            getUptime() { return Math.floor((Date.now() - this.state.uptime) / 1000); },
            reboot() { location.reload(); },
            shutdown() { if (window.close) window.close(); }

        window.Kernel = Kernel;

        // ============================================================
        //  4. BOOT SYSTEM
        // ============================================================
        const Boot = {
            status: 'idle',
            progress: 0,
            totalSteps: 6,
            statusEl: null,
            progressBar: null,

            init() {
                this.statusEl = document.getElementById('boot-status');
                this.progressBar = document.getElementById('boot-progress-bar');
                return this;
            },

            async start() {
                if (this.status === 'booting') return;
                this.status = 'booting';
                this.progress = 0;

                const steps = [
                    { label: 'Kernel wird geladen…', fn: () => Kernel.init() },
                    { label: 'Speicher wird initialisiert…', fn: () => Storage.set('boot_test', true) },
                    { label: 'Cosmic World wird aufgebaut…', fn: () => CosmicWorld.init() },
                    { label: 'Apps werden geladen…', fn: () => AppManager.init() },
                    { label: 'System wird vorbereitet…', fn: () => this.prepareSystem() },
                    { label: 'System bereit! 🚀', fn: () => this.finish() }
                ];

                for (const step of steps) {
                    this.updateStatus(step.label);
                    this.updateProgress((steps.indexOf(step) + 1) / steps.length * 100);
                    try { await step.fn(); } catch (e) { console.warn('⚠️ Schritt fehlgeschlagen:', e); }
                    await this.sleep(150);
                }
                this.status = 'ready';
                this.hideBootScreen();
            },

            prepareSystem() {
                // Top-Menu Events
                document.querySelectorAll('.menu-item[data-menu]').forEach(el => {
                    el.addEventListener('click', () => {
                        document.querySelectorAll('.menu-item[data-menu]').forEach(e => e.classList.remove(
                        'active'));
                        el.classList.add('active');
                        AppManager.openCategory(el.dataset.menu);
                    });
                });

                // Theme toggle
                document.getElementById('menu-theme')?.addEventListener('click', () => {
                    const themes = ['dark', 'light', 'cosmic'];
                    const current = document.documentElement.getAttribute('data-theme') || 'dark';
                    const next = themes[(themes.indexOf(current) + 1) % themes.length];
                    document.documentElement.setAttribute('data-theme', next);
                    document.getElementById('menu-theme').textContent = next === 'dark' ? '🌙' : next === 'light' ?
                        '☀️' : '🌌';
                });

                // Voice toggle (Demo)
                document.getElementById('menu-voice')?.addEventListener('click', () => {
                    const voices = ['👩', '👨', '🧑', '👧', '👦'];
                    const current = document.getElementById('menu-voice').textContent;
                    const idx = voices.indexOf(current);
                    document.getElementById('menu-voice').textContent = voices[(idx + 1) % voices.length];
                });

                // Language toggle (Demo)
                document.getElementById('menu-lang')?.addEventListener('click', () => {
                    const langs = ['DE', 'EN', 'KU', 'TR', 'AR'];
                    const current = document.getElementById('menu-lang').textContent;
                    const idx = langs.indexOf(current);
                    document.getElementById('menu-lang').textContent = langs[(idx + 1) % langs.length];
                });

                // Taskbar clicks
                document.getElementById('taskbar-logo')?.addEventListener('click', () => AppManager.openApp(
                'app-center'));
                document.getElementById('tb-notifications')?.addEventListener('click', () => alert(
                    '🔔 Keine neuen Benachrichtigungen'));
                document.getElementById('tb-status')?.addEventListener('click', () => alert(
                    `✅ System läuft\nVersion: ${Kernel.version}\nUptime: ${Kernel.getUptime()}s`));

                // AI Floating Button
                document.getElementById('ai-floating-btn')?.addEventListener('click', () => AppManager.openApp(
                'haldo-ai'));

                // Clock
                updateClock();
                setInterval(updateClock, 10000);

                return true;
            },

            updateStatus(text) { if (this.statusEl) this.statusEl.textContent = text; },
            updateProgress(value) { this.progress = Math.min(value, 100); if (this.progressBar) this.progressBar.style
                    .width = this.progress + '%'; },
            hideBootScreen() {
                document.getElementById('boot-screen').classList.add('hidden');
                setTimeout(() => { document.getElementById('boot-screen').style.display = 'none'; }, 800);
                document.getElementById('desktop').style.display = 'block';
                document.querySelector('.floating-btn').style.display = 'flex';
            },
            sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        };

        const CosmicWorld = {

            init() {

                    const script = document.createElement('script');

            loadLogo() {

            setupScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0a1a);

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 18, 45);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                this.container.appendChild(this.renderer.domElement);

                // Lighting
                this.scene.add(new THREE.AmbientLight(0x222244, 0.6));
                const sunLight = new THREE.PointLight(0xffaa33, 2.8, 150);
                sunLight.position.set(0, 0, 0);

                const dirLight = new THREE.DirectionalLight(0x4466ff, 0.3);
                dirLight.position.set(10, 20, 10);
                this.scene.add(dirLight);

                this.createSun();
                this.createPlanets();
                this.createStars(365);
                this.createNebula();
                this.clock = new THREE.Clock();
            },

            createSun() {
                const geo = new THREE.SphereGeometry(3.2, 64, 64);
                const mat = this.logoTexture ? new THREE.MeshStandardMaterial({
                    map: this.logoTexture,
                    emissive: 0xff6600,
                    emissiveIntensity: 0.3,
                    roughness: 0.2,
                    metalness: 0.0
                }) : new THREE.MeshStandardMaterial({
                    color: 0xff8800,
                    emissive: 0xff4400,
                    emissiveIntensity: 1.0,
                    roughness: 0.2,
                    metalness: 0.0
                });
                this.sunMesh = new THREE.Mesh(geo, mat);
                this.sunMesh.position.set(0, 0, 0);
                this.sunMesh.userData.isSun = true;
                this.scene.add(this.sunMesh);

                // Glow
                const glow = new THREE.Mesh(
                    new THREE.SphereGeometry(3.8, 32, 32),
                    new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.2,
                        blending: THREE.AdditiveBlending })
                );
                glow.position.set(0, 0, 0);
                this.scene.add(glow);
                this.sunGlow = glow;

                // Outer Corona
                const outer = new THREE.Mesh(
                    new THREE.SphereGeometry(5.0, 32, 32),
                    new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.07,
                        blending: THREE.AdditiveBlending })
                );
                outer.position.set(0, 0, 0);
                this.scene.add(outer);
                this.outerGlow = outer;
            },

            createPlanets() {
                const planets = [
                    { name: 'Merkur', size: 0.3, distance: 4.8, color: 0xaaaaaa, speed: 0.04, type: 'second' },
                    { name: 'Venus', size: 0.5, distance: 6.8, color: 0xffcc88, speed: 0.025, type: 'minute' },
                    { name: 'Erde', size: 0.55, distance: 9.0, color: 0x4488ff, speed: 0.018, type: 'hour',
                    hasMoon: true },
                    { name: 'Mars', size: 0.45, distance: 11.5, color: 0xff4422, speed: 0.014 },
                    { name: 'Jupiter', size: 1.3, distance: 14.5, color: 0xddbb88, speed: 0.009 },
                    { name: 'Saturn', size: 1.1, distance: 18.0, color: 0xeeddbb, speed: 0.007 },
                    { name: 'Uranus', size: 0.8, distance: 21.5, color: 0x88ddff, speed: 0.005 },
                    { name: 'Neptun', size: 0.75, distance: 25.0, color: 0x3366ff, speed: 0.004 },
                    { name: 'Pluto', size: 0.2, distance: 28.5, color: 0xccbbaa, speed: 0.003 },
                    { name: 'HalDo-1', size: 0.4, distance: 32.0, color: 0x8B5CF6, speed: 0.0025 },
                    { name: 'HalDo-2', size: 0.35, distance: 35.5, color: 0x00D4FF, speed: 0.002 },
                    { name: 'HalDo-3', size: 0.3, distance: 39.0, color: 0xFF6B9D, speed: 0.0015 }
                ];

                this.planetData = [];
                planets.forEach((data, idx) => {
                    const geo = new THREE.SphereGeometry(data.size, 32, 32);
                    const mat = new THREE.MeshStandardMaterial({
                        color: data.color,
                        roughness: 0.5,
                        metalness: 0.1,
                        emissive: data.color,
                        emissiveIntensity: 0.05
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    const angle = (idx / planets.length) * Math.PI * 2 + Math.random() * 0.2;
                    mesh.position.x = Math.cos(angle) * data.distance;
                    mesh.position.z = Math.sin(angle) * data.distance;
                    mesh.userData = { distance: data.distance, speed: data.speed, angle: angle, name: data.name,
                        type: data.type || 'normal' };
                    this.scene.add(mesh);

                    // Orbit
                    const pts = [];
                    for (let i = 0; i <= 80; i++) {
                        const t = (i / 80) * Math.PI * 2;
                        pts.push(new THREE.Vector3(Math.cos(t) * data.distance, 0, Math.sin(t) * data.distance));
                    }
                    const orbit = new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints(pts),
                        new THREE.LineBasicMaterial({ color: data.color, transparent: true, opacity: 0.12 })
                    );
                    this.scene.add(orbit);

                    // Erde + Mond
                    if (data.hasMoon) {
                        const moon = new THREE.Mesh(
                            new THREE.SphereGeometry(0.15, 16, 16),
                            new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9 })
                        );
                        moon.userData = { angle: 0, speed: 0.06, distance: 1.2 };
                        mesh.add(moon);
                        this.moon = moon;
                    }

                    this.planetData.push({ mesh, distance: data.distance, speed: data.speed, angle: angle,
                        name: data.name, type: data.type || 'normal' });
                });
            },

            createStars(count = 365) {
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);
                const col = new Float32Array(count * 3);
                for (let i = 0; i < count; i++) {
                    const r = 40 + Math.random() * 180,
                        t = Math.random() * Math.PI * 2,
                        p = Math.acos(2 * Math.random() - 1);
                    pos[i * 3] = r * Math.sin(p) * Math.cos(t);
                    pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
                    pos[i * 3 + 2] = r * Math.cos(p);
                    const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.25, 0.3, 0.6 + Math.random() * 0.4);
                    col[i * 3] = c.r;
                    col[i * 3 + 1] = c.g;
                    col[i * 3 + 2] = c.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                this.starField = new THREE.Points(geo, new THREE.PointsMaterial({
                    size: 0.3,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.95,
                    blending: THREE.AdditiveBlending
                }));
                this.scene.add(this.starField);
            },

            createNebula() {
                const count = 2000;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);
                const col = new Float32Array(count * 3);
                for (let i = 0; i < count; i++) {
                    const r = 20 + Math.random() * 80,
                        t = Math.random() * Math.PI * 2,
                        p = Math.acos(2 * Math.random() - 1);
                    pos[i * 3] = r * Math.sin(p) * Math.cos(t);
                    pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t) * 0.3;
                    pos[i * 3 + 2] = r * Math.cos(p);
                    const c = new THREE.Color().setHSL(0.65 + Math.random() * 0.25, 0.5, 0.15 + Math.random() * 0.2);
                    col[i * 3] = c.r;
                    col[i * 3 + 1] = c.g;
                    col[i * 3 + 2] = c.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                const neb = new THREE.Points(geo, new THREE.PointsMaterial({
                    size: 0.6,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.08,
                    blending: THREE.AdditiveBlending
                }));
                this.scene.add(neb);
                this.nebula = neb;
            },

            animate() {
                this.animationId = requestAnimationFrame(() => this.animate());
                if (!this.scene || !this.camera || !this.renderer) return;
                const time = this.clock ? this.clock.getElapsedTime() : Date.now() * 0.001;

                // Sun
                if (this.sunMesh) {
                    this.sunMesh.rotation.y += 0.002;
                    if (this.sunGlow) {
                        const p = 1 + Math.sin(time * 0.6) * 0.04;
                        this.sunGlow.scale.set(p, p, p);
                        this.sunGlow.material.opacity = 0.2 + Math.sin(time * 0.5) * 0.04;
                    }
                    if (this.outerGlow) {
                        const p2 = 1 + Math.sin(time * 0.3 + 1) * 0.05;
                        this.outerGlow.scale.set(p2, p2, p2);
                    }
                }

                // Planets
                if (this.planetData) {
                    this.planetData.forEach(data => {
                        let sf = 1;
                        if (data.type === 'second') sf = 2.0;
                        else if (data.type === 'minute') sf = 1.0;
                        else if (data.type === 'hour') sf = 0.5;
                        data.angle += data.speed * sf * 0.5;
                        data.mesh.position.x = Math.cos(data.angle) * data.distance;
                        data.mesh.position.z = Math.sin(data.angle) * data.distance;
                        data.mesh.rotation.y += 0.015;

                        if (data.name === 'Erde' && this.moon) {
                            const md = this.moon.userData;
                            md.angle += md.speed;
                            this.moon.position.x = Math.cos(md.angle) * md.distance;
                            this.moon.position.z = Math.sin(md.angle) * md.distance;
                        }
                    });
                }

                // Stars flicker
                if (this.starField) {
                    const sz = this.starField.geometry.attributes.size;
                    if (sz) {
                        for (let i = 0; i < sz.count; i++) {
                            sz.array[i] = 0.15 + (0.3 + Math.sin(time * (0.5 + i * 0.01)) * 0.3) * 0.4;
                        }
                        sz.needsUpdate = true;
                    }
                }

                // Camera
                if (this.camera) {
                    const a = time * 0.012;
                    this.camera.position.x = Math.sin(a) * 7;
                    this.camera.position.z = 42 + Math.sin(a * 0.7) * 4;
                    this.camera.position.y = 16 + Math.sin(a * 0.5) * 2;
                    this.camera.lookAt(0, 0, 0);
                }

                this.renderer.render(this.scene, this.camera);
            },

            onSunClick(e) {
                if (!this.scene || !this.camera) return;
                const rect = this.container.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width * 2 - 1;
                const y = -(e.clientY - rect.top) / rect.height * 2 + 1;
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(x, y), this.camera);
                const hits = ray.intersectObjects(this.scene.children, true);
                let hitSun = false;
                for (let h of hits) {
                    let obj = h.object;
                    while (obj) {
                        if (obj.userData && obj.userData.isSun) { hitSun = true; break; }
                        obj = obj.parent;
                    }
                    if (hitSun) break;
                }
                if (hitSun) { console.log('☀️ Sonne geklickt!');
                    AppManager.openApp('haldo-ai'); }
            },

            onResize() {
                if (!this.camera || !this.renderer) return;
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        };

            init() {
                console.log('📱 App Manager wird initialisiert...');
                this.apps = this.appDefinitions;
                this.installedApps = Storage.get('installed_apps', []);
                if (this.installedApps.length === 0) {
                    this.installedApps = this.apps.map(a => a.id);
                    Storage.set('installed_apps', this.installedApps);
                }
                this.renderDesktopIcons();
                this.isReady = true;
                console.log(`✅ ${this.installedApps.length} Apps installiert`);
                return this;
            },

            openApp(appId) {
                const app = this.apps.find(a => a.id === appId);
                if (!app) { alert('App nicht gefunden'); return false; }
                if (!this.installedApps.includes(appId)) {
                    this.installApp(appId);
                }

                // Spezialfälle
                if (appId === 'cosmic-world') {
                    if (!CosmicWorld.isReady) CosmicWorld.init();
                    else alert('🌌 Cosmic World läuft bereits!');
                    return true;
                }

                if (appId === 'haldo-ai' || appId === 'ai-chat') {
                    this.openAIChat(app);
                    return true;
                }

                if (appId === 'settings') {
                    this.openSettings(app);
                    return true;
                }

                // Standard App öffnen
                this.openGenericWindow(app);
                return true;
            },

            openGenericWindow(app) {
                const content = this.getAppContent(app.id);
                const win = this.createWindow(app.name, app.icon, content);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            createWindow(title, icon, content, width = 520, height = 420) {
                const win = document.createElement('div');
                win.className = 'window';
                const w = Math.min(width, window.innerWidth - 60);
                const h = Math.min(height, window.innerHeight - 140);
                win.style.cssText =
                `left:${40+Math.random()*40}px;top:${20+Math.random()*40}px;width:${w}px;height:${h}px;z-index:${Date.now()%1000+100};`;

                win.innerHTML = `
                    <div class="window-header">
                        <div class="window-title">
                            <span class="icon">${icon}</span>
                            <span>${title}</span>
                        </div>
                        <div class="window-controls">
                            <button class="btn-minimize" onclick="this.closest('.window').classList.toggle('minimized')">−</button>
                            <button class="btn-maximize" onclick="this.closest('.window').classList.toggle('maximized')">⛶</button>
                            <button class="btn-close" onclick="this.closest('.window').remove(); AppManager.updateTaskbar();">✕</button>
                        </div>
                    </div>
                    <div class="window-body">${content}</div>
                `;

                // Drag
                const header = win.querySelector('.window-header');
                let drag = false,
                    sx, sy, ox, oy;
                header.addEventListener('mousedown', (e) => {
                    if (win.classList.contains('maximized')) return;
                    drag = true;
                    const r = win.getBoundingClientRect();
                    sx = e.clientX;
                    sy = e.clientY;
                    ox = r.left;
                    oy = r.top;
                    win.style.cursor = 'grabbing';
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    win.style.left = (ox + e.clientX - sx) + 'px';
                    win.style.top = (oy + e.clientY - sy) + 'px';
                });
                document.addEventListener('mouseup', () => { if (drag) { drag = false;
                        win.style.cursor = ''; } });

                return win;
            },

            getAppContent(appId) {
                const app = this.apps.find(a => a.id === appId);
                if (!app) return '<p>App nicht gefunden</p>';

                switch (appId) {

                        return this.getNotesUI();
                    case 'calculator':
                        return this.getCalculatorUI();
                    case 'calendar':
                        return this.getCalendarUI();
                    case 'weather':

                            ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(b => `
                                <button onclick="AppManager.calcInput('${b}')" style="padding:12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-primary);font-size:18px;cursor:pointer;transition:all var(--transition-fast);">${b}</button>

            calcInput(value) {
                const d = document.getElementById('calc-display');
                if (!d) return;
                if (value === '=') {
                    try { d.textContent = eval(d.textContent.replace('×', '*').replace('÷', '/')); } catch { d.textContent =
                            'Error'; }
                } else if (value === 'C') { d.textContent = '0'; } else if (value === '⌫') { d.textContent = d.textContent
                        .length > 1 ? d.textContent.slice(0, -1) : '0'; } else {
                    if (d.textContent === '0' && value !== '.') d.textContent = value;
                    else d.textContent += value;
                }
            },

            runCommand() {
                const input = document.getElementById('terminal-input');
                const output = document.getElementById('terminal-output');
                if (!input || !output) return;
                const cmd = input.value.trim();
                if (!cmd) return;
                output.textContent += `\n$ ${cmd}`;
                input.value = '';

                // Einfache Commands
                const responses = {
                    help: 'Verfügbare Befehle: help, version, apps, clear, echo <text>, date, uptime',
                    version: `HalDo AI OS ${Kernel.version}`,
                    apps: `Installierte Apps: ${AppManager.installedApps.length}`,
                    clear: '> Terminal gelöscht',
                    date: new Date().toLocaleString(),
                    uptime: `${Kernel.getUptime()}s`,
                    echo: (args) => args.join(' ')
                };

                const parts = cmd.split(' ');
                const command = parts[0].toLowerCase();
                if (command === 'clear') {
                    output.textContent = '> Terminal gelöscht';
                } else if (command === 'echo') {
                    output.textContent += `\n> ${parts.slice(1).join(' ')}`;
                } else if (responses[command]) {
                    const result = typeof responses[command] === 'function' ? responses[command](parts.slice(1)) :
                        responses[command];
                    output.textContent += `\n> ${result}`;
                } else {
                    output.textContent += `\n> Unbekannter Befehl: ${cmd}`;
                }
                output.scrollTop = output.scrollHeight;
            },

                            </div>
                        `;

                    case 'ai':
                        const apiKey = Storage.get('groq_api_key', '');
                        content = `
                            <h2 style="color:var(--text-primary);">🧠 AI & Memory</h2>
                            <div style="margin-top:12px;">
                                <div style="margin:12px 0;">
                                    <label style="display:block;color:var(--text-secondary);margin-bottom:4px;">🔑 Groq API Key</label>

                            </div>
                        `;
                        break;
                    case 'display':
                        content = `
                            <h2 style="color:var(--text-primary);">🖥️ Display</h2>
                            <div style="margin-top:12px;">
                                <div style="margin:12px 0;"><label style="display:block;color:var(--text-secondary);margin-bottom:4px;">Auflösung</label><select class="haldo-input"><option>Full HD (1920x1080)</option><option>4K (3840x2160)</option><option>8K (7680x4320)</option></select></div>
                                <div style="margin:12px 0;"><label style="display:block;color:var(--text-secondary);margin-bottom:4px;">Helligkeit</label><input type="range" min="0" max="100" value="80" style="width:100%;accent-color:var(--primary);"></div>
                            </div>
                        `;
                        break;
                    case 'language':
                        content = `
                            <h2 style="color:var(--text-primary);">🌍 Sprache</h2>
                            <div style="margin-top:12px;">
                                <div style="margin:12px 0;"><label style="display:block;color:var(--text-secondary);margin-bottom:4px;">Systemsprache</label><select class="haldo-input"><option>🇩🇪 Deutsch</option><option>🇬🇧 English</option><option>🏴 Kurmancî</option><option>🇹🇷 Türkçe</option><option>🇸🇦 العربية</option><option>🇫🇷 Français</option><option>🇪🇸 Español</option></select></div>
                                <div style="margin:12px 0;"><label style="display:block;color:var(--text-secondary);margin-bottom:4px;">Tastaturlayout</label><select class="haldo-input"><option>QWERTZ</option><option>QWERTY</option><option>Êzîdî</option></select></div>
                            </div>
                        `;
                        break;
                    case 'themes':
                        content = `
                            <h2 style="color:var(--text-primary);">🎨 Themes</h2>
                            <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;">
                                <div onclick="document.documentElement.setAttribute('data-theme','dark')" style="padding:16px;background:var(--glass-bg);border-radius:12px;cursor:pointer;border:2px solid ${document.documentElement.getAttribute('data-theme')==='dark'?'var(--primary)':'var(--glass-border)'};flex:1;min-width:80px;text-align:center;">🌙 Dark</div>
                                <div onclick="document.documentElement.setAttribute('data-theme','light')" style="padding:16px;background:var(--glass-bg);border-radius:12px;cursor:pointer;border:2px solid ${document.documentElement.getAttribute('data-theme')==='light'?'var(--primary)':'var(--glass-border)'};flex:1;min-width:80px;text-align:center;">☀️ Light</div>
                                <div onclick="document.documentElement.setAttribute('data-theme','cosmic')" style="padding:16px;background:var(--glass-bg);border-radius:12px;cursor:pointer;border:2px solid ${document.documentElement.getAttribute('data-theme')==='cosmic'?'var(--primary)':'var(--glass-border)'};flex:1;min-width:80px;text-align:center;">🌌 Cosmic</div>
                            </div>
                        `;
                        break;
                    case 'voice':
                        content = `
                            <h2 style="color:var(--text-primary);">🎤 Voice</h2>
                            <div style="margin-top:12px;">
                                <div style="margin:12px 0;"><label style="display:block;color:var(--text-secondary);margin-bottom:4px;">Stimme</label><select class="haldo-input"><option>👩 Deutsch – weiblich</option><option>👨 Deutsch – männlich</option><option>👧 Deutsch – jung</option><option>🇬🇧 English – female</option><option>🇬🇧 English – male</option></select></div>
                                <div style="margin:12px 0;"><label style="display:block;color:var(--text-secondary);margin-bottom:4px;">Geschwindigkeit</label><input type="range" min="0.5" max="2" step="0.1" value="1" style="width:100%;accent-color:var(--primary);"></div>
                                <button class="haldo-btn" onclick="alert('🎤 Voice Test: Hallo, ich bin HalDo!')">🔊 Test</button>
                            </div>
                        `;
                        break;
                    case 'system':
                        content = `
                            <h2 style="color:var(--text-primary);">📊 System</h2>
                            <div style="margin-top:12px;">
                                <p style="color:var(--text-secondary);"><strong>Version:</strong> ${Kernel.version}</p>
                                <p style="color:var(--text-secondary);"><strong>Uptime:</strong> ${Kernel.getUptime()}s</p>
                                <p style="color:var(--text-secondary);"><strong>Apps:</strong> ${this.installedApps.length}</p>
                                <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
                                    <button onclick="Kernel.reboot()" class="haldo-btn haldo-btn-secondary">🔄 Neustart</button>
                                    <button onclick="Storage.clear();alert('Cache geleert!');" class="haldo-btn haldo-btn-secondary">🗑️ Cache leeren</button>
                                    <button onclick="AppManager.installAll()" class="haldo-btn">📱 Alle Apps installieren</button>
                                </div>
                            </div>
                        `;
                        break;
                }
                container.innerHTML = content;
            },

            saveAIKey() {
                const input = document.getElementById('ai-key-input');
                if (!input) return;
                const key = input.value.trim();
                if (key) { Storage.set('groq_api_key', key);
                    alert('✅ API Key gespeichert!'); } else { alert('⚠️ Bitte einen gültigen Key eingeben.'); }
            },

            // ===== AI CHAT =====
            openAIChat(app) {
                const content = `
                    <div style="display:flex;flex-direction:column;height:100%;padding:0;">
                        <div id="ai-chat-messages" style="flex:1;overflow-y:auto;padding:12px;margin-bottom:8px;">
                            <div style="text-align:center;color:var(--text-muted);padding:20px;">
                                💙 Hallo! Ich bin <strong style="color:var(--text-primary);">HalDo</strong>, deine intelligente KI-Assistentin.<br>
                                Stelle mir eine Frage, oder sag mir, was du möchtest.
                            </div>
                        </div>
                        <div style="display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--glass-border);">
                            <input id="ai-chat-input" class="haldo-input" placeholder="Nachricht an HalDo..." style="flex:1;" onkeydown="if(event.key==='Enter')AppManager.sendAIMessage()">
                            <button onclick="AppManager.sendAIMessage()" class="haldo-btn">📤</button>
                            <button onclick="AppManager.toggleVoiceInput()" class="haldo-btn haldo-btn-secondary" id="ai-voice-btn" style="font-size:16px;">🎤</button>
                        </div>
                    </div>
                `;
                const win = this.createWindow(app.name, app.icon, content, 560, 480);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            sendAIMessage() {
                const input = document.getElementById('ai-chat-input');
                const messages = document.getElementById('ai-chat-messages');
                if (!input || !messages || !input.value.trim()) return;

                const text = input.value.trim();
                input.value = '';

                // User-Nachricht
                const userMsg = document.createElement('div');
                userMsg.style.cssText =
                    'text-align:right;margin:6px 0;padding:10px 16px;background:var(--primary);border-radius:12px;color:white;max-width:85%;margin-left:auto;border-bottom-right-radius:4px;';
                userMsg.textContent = '🧑 ' + text;
                messages.appendChild(userMsg);

                // Lade-Indikator
                const loading = document.createElement('div');
                loading.style.cssText =
                    'text-align:left;margin:6px 0;padding:10px 16px;background:var(--glass-bg);border-radius:12px;color:var(--text-secondary);max-width:85%;border-bottom-left-radius:4px;';
                loading.textContent = '💭 HalDo denkt...';
                messages.appendChild(loading);
                messages.scrollTop = messages.scrollHeight;

                const apiKey = Storage.get('groq_api_key', '');
                if (!apiKey) {
                    loading.textContent = '⚠️ Bitte trage deinen Groq API Key in den Settings ein! (AI & Memory)';
                    return;
                }

                fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: 'mixtral-8x7b-32768',
                            messages: [
                                { role: 'system', content: 'Du bist HalDo, eine freundliche, intelligente KI-Assistentin. Du sprichst wie ein Mensch, bist einfühlsam, hilfsbereit und professionell. Antworte immer in der Sprache des Benutzers.' },
                                { role: 'user', content: text }
                            ],
                            temperature: 0.7,
                            max_tokens: 600
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        loading.remove();
                        const reply = data.choices?.[0]?.message?.content || 'Entschuldigung, ich habe keine Antwort.';
                        const aiMsg = document.createElement('div');
                        aiMsg.style.cssText =
                            'text-align:left;margin:6px 0;padding:10px 16px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;color:var(--text-primary);max-width:85%;border-bottom-left-radius:4px;';
                        aiMsg.textContent = '💙 ' + reply;
                        messages.appendChild(aiMsg);
                        messages.scrollTop = messages.scrollHeight;

                        // Memory
                        const memory = Storage.get('ai_memory', []);
                        memory.push({ user: text, assistant: reply, time: Date.now() });
                        if (memory.length > 50) memory.shift();
                        Storage.set('ai_memory', memory);

                        // Voice Ausgabe
                        if ('speechSynthesis' in window) {
                            const utter = new SpeechSynthesisUtterance(reply);
                            utter.lang = 'de-DE';
                            window.speechSynthesis.speak(utter);
                        }
                    })
                    .catch(err => {
                        loading.textContent = '❌ Fehler: ' + err.message;
                    });
            },

            toggleVoiceInput() {
                const btn = document.getElementById('ai-voice-btn');
                if (!btn) return;
                if ('webkitSpeechRecognition' in window) {
                    const rec = new webkitSpeechRecognition();
                    rec.lang = 'de-DE';
                    rec.onstart = () => { btn.textContent = '⏹️';
                        btn.style.color = 'var(--success)'; };
                    rec.onend = () => { btn.textContent = '🎤';
                        btn.style.color = ''; };
                    rec.onresult = (e) => {
                        const text = e.results[0][0].transcript;
                        const input = document.getElementById('ai-chat-input');
                        if (input) { input.value = text;
                            AppManager.sendAIMessage(); }
                    };
                    rec.start();
                } else {
                    alert('🎤 Speech Recognition wird von deinem Browser nicht unterstützt.');
                }
            },

            // ===== KATEGORIEN =====
            openCategory(category) {
                const apps = this.apps.filter(a => a.category === category);
                if (apps.length === 0) {
                    alert(`📱 Keine Apps in Kategorie "${category}"`);
                    return;
                }
                const content = `
                    <div>
                        <h2 style="color:var(--text-primary);">📱 ${category.charAt(0).toUpperCase()+category.slice(1)}</h2>
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px;">
                            ${apps.map(app => `
                                <div onclick="AppManager.openApp('${app.id}')" style="padding:16px;background:var(--glass-bg);border-radius:12px;text-align:center;border:1px solid var(--glass-border);cursor:pointer;transition:all var(--transition-fast);">
                                    <div style="font-size:32px;">${app.icon}</div>
                                    <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${app.name}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                const win = this.createWindow(`${category}`, '📱', content, 500, 400);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            // ===== INSTALLATION =====
            installApp(appId) {
                if (this.installedApps.includes(appId)) return false;
                this.installedApps.push(appId);
                Storage.set('installed_apps', this.installedApps);
                this.renderDesktopIcons();
                return true;
            },

            installAll() {
                this.apps.forEach(a => {
                    if (!this.installedApps.includes(a.id)) {
                        this.installedApps.push(a.id);
                    }
                });
                Storage.set('installed_apps', this.installedApps);
                this.renderDesktopIcons();
                alert(`✅ ${this.installedApps.length} Apps installiert!`);
            },

            // ===== DESKTOP ICONS =====
            renderDesktopIcons() {
                const container = document.getElementById('desktop-icons');
                if (!container) return;
                const apps = this.apps.filter(a => this.installedApps.includes(a.id));
                container.innerHTML = apps.map(app => `
                    <div class="desktop-icon" onclick="AppManager.openApp('${app.id}')" title="${app.desc || app.name}">
                        <div class="icon-img">${app.icon}</div>
                        <div class="icon-label">${app.name}</div>
                    </div>
                `).join('');
            },

            // ===== TASKBAR =====
            updateTaskbar() {
                const container = document.getElementById('taskbar-apps');
                if (!container) return;
                const windows = document.querySelectorAll('#window-container .window');
                container.innerHTML = '';
                windows.forEach(win => {
                    const title = win.querySelector('.window-title span:last-child')?.textContent || 'App';
                    const btn = document.createElement('button');
                    btn.className = 'taskbar-app-btn';
                    btn.textContent = title;
                    btn.onclick = () => {
                        win.classList.toggle('minimized');
                        this.updateTaskbar();
                    };
                    container.appendChild(btn);
                });
            }
        };
        window.AppManager = AppManager;

        // ============================================================
        //  7. UHR
        // ============================================================
        function updateClock() {
            const el = document.getElementById('taskbar-time');
            if (el) {
                el.textContent = new Date().toLocaleTimeString('de', { hour: '2-digit', minute: '2-digit' });
            }
        }

        // ============================================================
        //  8. MAIN START
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 HalDo AI OS 24.6 startet...');
            Boot.init();
            setTimeout(() => Boot.start(), 400);
        });

        // Globale Fehlerbehandlung
        window.onerror = (msg, url, line) => {
            console.error('❌ Fehler:', msg, url, line);
        };

        console.log('💙❤️🚀 HalDo AI OS 24.6 – Cosmic Intelligent Operating System');
    </script>

</body>
</html>
