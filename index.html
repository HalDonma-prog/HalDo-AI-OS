<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
HalDo AI OS 18
</title>


<link rel="stylesheet"
href="style.css">


<link rel="manifest"
href="manifest.json">


<meta name="theme-color"
content="#090D18">


</head>



<body>



<!-- START SYSTEM -->

<section id="startup-screen"
class="boot-screen">


<img id="system-logo"

src="assets/logo/logo.svg"

class="logo"


alt="HalDo AI OS Logo">


<h1>
HalDo AI OS 18
</h1>


<p id="startup-message">

🟡 System startet...

</p>


</section>





<!-- WILLKOMMEN -->

<section id="welcome-screen"

class="boot-screen"

style="display:none;">



<h1>

Willkommen bei

<br>

HalDo AI OS 18

</h1>



<p>

Professional Ultimate Foundation

</p>



<button
onclick="openDesktop()">

🚀 Hauptmenü öffnen

</button>



</section>







<!-- HAUPTMENÜ -->

<section id="desktop"

style="display:none;">



<header class="header">


<img

src="assets/logo/logo.svg"

class="logo"


alt="Logo">


<h1>

HalDo AI OS 18

</h1>


</header>






<main class="main-menu">


<h2>

Hauptmenü

</h2>



<div class="menu-grid">



<button onclick="openPage('dashboard.html')">

📊 Dashboard

</button>



<button onclick="openPage('ai-core.html')">

🤖 AI Core

</button>




<button onclick="openPage('modules.html')">

🧩 Module

</button>




<button onclick="openPage('apps.html')">

📱 Apps

</button>




<button onclick="openPage('settings.html')">

⚙️ Einstellungen

</button>




<button onclick="openPage('status.html')">

📡 System Status

</button>



</div>


</main>



</section>







<script src="js/boot.js"></script>

<script src="js/startup.js"></script>



<script>


function openDesktop(){


document.getElementById(
"welcome-screen"
).style.display="none";



document.getElementById(
"desktop"
).style.display="block";


}





function openPage(page){


window.location.href =
page;


}



</script>



</body>

</html>
