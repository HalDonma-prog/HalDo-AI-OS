<script>
"use strict";

window.HalDo = window.HalDo || {};

const HD9 = window.HalDo;


/* =========================================================
   HALDO AI CHAT STATE
   ========================================================= */

HD9.ai =
    HD9.ai ||
    {};

HD9.ai.sessions =
    HD9.ai.sessions ||
    new Map();


HD9.ai.activeSession =
    HD9.ai.activeSession ||
    "main";


HD9.ai.storageKey =
    "haldo-os22-ai-conversation";


/* =========================================================
   LOAD CONVERSATION
   ========================================================= */

HD9.ai.load =
    function() {

        try {

            const raw =
                localStorage.getItem(
                    this.storageKey
                );


            if (!raw) {

                return [];

            }


            const data =
                JSON.parse(
                    raw
                );


            return Array.isArray(
                data
            )
                ? data
                : [];

        }

        catch (error) {

            console.warn(
                "HalDo AI Verlauf konnte nicht geladen werden:",
                error
            );

            return [];

        }

    };


/* =========================================================
   SAVE CONVERSATION
   ========================================================= */

HD9.ai.save =
    function(
        messages
    ) {

        try {

            localStorage.setItem(
                this.storageKey,
                JSON.stringify(
                    messages
                )
            );


            return true;

        }

        catch (error) {

            console.warn(
                "HalDo AI Verlauf konnte nicht gespeichert werden:",
                error
            );


            return false;

        }

    };


/* =========================================================
   GET SESSION
   ========================================================= */

HD9.ai.getSession =
    function(
        id = this.activeSession
    ) {

        const sessionId =
            String(id);


        if (
            !this.sessions.has(
                sessionId
            )
        ) {

            this.sessions.set(
                sessionId,
                {

                    id:
                        sessionId,

                    title:
                        "HalDo AI",

                    messages:
                        this.load(),

                    createdAt:
                        Date.now(),

                    updatedAt:
                        Date.now()

                }
            );

        }


        return this.sessions.get(
            sessionId
        );

    };


/* =========================================================
   NEW MESSAGE
   ========================================================= */

HD9.ai.addMessage =
    function(
        role,
        text,
        meta = {}
    ) {

        const session =
            this.getSession();


        const message =
            {

                id:
                    "msg-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2, 8),

                role:
                    role,

                text:
                    String(
                        text ?? ""
                    ),

                timestamp:
                    Date.now(),

                meta:
                    meta

            };


        session.messages.push(
            message
        );


        session.updatedAt =
            Date.now();


        this.save(
            session.messages
        );


        HD9.emit?.(
            "ai:message",
            message
        );


        return message;

    };


/* =========================================================
   REMOVE ALL MESSAGES
   ========================================================= */

HD9.ai.clear =
    function() {

        const session =
            this.getSession();


        session.messages =
            [];


        session.updatedAt =
            Date.now();


        this.save(
            []
        );


        HD9.emit?.(
            "ai:cleared"
        );

    };


/* =========================================================
   SIMPLE LOCAL AI FALLBACK
   ========================================================= */

HD9.ai.localResponse =
    function(
        input
    ) {

        const text =
            String(
                input || ""
            )
            .trim();


        if (!text) {

            return "Ich bin hier. Schreib mir einfach, was du wissen oder machen möchtest.";

        }


        const lower =
            text.toLowerCase();


        if (
            /^(hallo|hi|hey|guten morgen|guten abend|guten tag)\b/
                .test(
                    lower
                )
        ) {

            return "Hallo! 💙❤️ Ich bin HalDo AI. Schön, dass du da bist. Was möchtest du heute gemeinsam machen?";

        }


        if (
            lower.includes(
                "wer bist du"
            )
        ) {

            return "Ich bin HalDo AI – die zentrale intelligente Assistenz von HalDo AI OS 22. Ich kann dich bei Gesprächen, Schreiben, Lernen, Übersetzen, Organisation, Technik und vielen weiteren Aufgaben unterstützen.";

        }


        if (
            lower.includes(
                "danke"
            )
        ) {

            return "Sehr gerne. 💙❤️";

        }


        if (
            lower.includes(
                "zeit"
            )
        ) {

            return (
                "Die aktuelle Gerätezeit ist " +
                new Date()
                    .toLocaleTimeString(
                        "de-DE"
                    ) +
                "."
            );

        }


        if (
            lower.includes(
                "datum"
            )
        ) {

            return (
                "Heute ist " +
                new Date()
                    .toLocaleDateString(
                        "de-DE",
                        {
                            weekday:
                                "long",

                            year:
                                "numeric",

                            month:
                                "long",

                            day:
                                "numeric"

                        }
                    ) +
                "."
            );

        }


        if (
            lower.includes(
                "hilfe"
            ) ||
            lower.includes(
                "was kannst du"
            )
        ) {

            return "Ich kann dir beim Schreiben, Erklären, Lernen, Planen, Übersetzen, Organisieren, Programmieren und bei der Nutzung von HalDo AI OS helfen. Meine vorhandenen AI-Module werden bevorzugt verwendet; wenn kein externes AI-Modul verfügbar ist, arbeite ich mit dem lokalen Antwortsystem weiter.";

        }


        if (
            lower.includes(
                "haldo"
            )
        ) {

            return "Ja, ich bin da. 💙❤️🚀 Wir bauen HalDo AI OS 22 Schritt für Schritt zu einem verbundenen und funktionsfähigen System aus.";

        }


        return (
            "Ich habe deine Nachricht verstanden: „" +
            text +
            "“\n\n" +
            "Ich bin bereit, darauf weiter einzugehen. "
            +
            "Wenn ein vollständiges HalDo-AI-Modul verfügbar ist, wird dieses für die eigentliche intelligente Verarbeitung verwendet."
        );

    };


/* =========================================================
   CONNECT TO EXISTING AI CORE
   ========================================================= */

HD9.ai.generate =
    async function(
        input,
        context = {}
    ) {

        const text =
            String(
                input || ""
            )
            .trim();


        if (!text) {

            return "";

        }


        /*
         * Bestehende HalDo-AI-Systeme zuerst verwenden.
         */

        const candidates = [

            HD9.aiCore,

            HD9.aiEngine,

            window.HalDoAICore,

            window.HalDoAI,

            window.HalDoAIEngine

        ];


        for (
            const engine
            of candidates
        ) {

            if (!engine) {
                continue;
            }


            try {

                if (
                    typeof engine.respond ===
                    "function"
                ) {

                    const result =
                        await engine.respond(
                            text,
                            context
                        );


                    if (
                        result !==
                        undefined &&
                        result !==
                        null &&
                        String(result).trim()
                    ) {

                        return String(
                            result
                        );

                    }

                }


                if (
                    typeof engine.generate ===
                    "function"
                ) {

                    const result =
                        await engine.generate(
                            text,
                            context
                        );


                    if (
                        result !==
                        undefined &&
                        result !==
                        null &&
                        String(result).trim()
                    ) {

                        return String(
                            result
                        );

                    }

                }


                if (
                    typeof engine.chat ===
                    "function"
                ) {

                    const result =
                        await engine.chat(
                            text,
                            context
                        );


                    if (
                        result !==
                        undefined &&
                        result !==
                        null &&
                        String(result).trim()
                    ) {

                        return String(
                            result
                        );

                    }

                }

            }

            catch (error) {

                console.warn(
                    "HalDo AI Engine Fehler:",
                    error
                );

            }

        }


        /*
         * Fallback:
         * Das Fenster bleibt immer funktionsfähig,
         * auch wenn noch kein externer AI-Dienst
         * verbunden ist.
         */

        return this.localResponse(
            text
        );

    };


/* =========================================================
   SEND MESSAGE
   ========================================================= */

HD9.ai.send =
    async function(
        input,
        ui = {}
    ) {

        const text =
            String(
                input || ""
            )
            .trim();


        if (!text) {

            return null;

        }


        const userMessage =
            this.addMessage(
                "user",
                text
            );


        if (
            typeof ui.render ===
            "function"
        ) {

            ui.render();

        }


        const typingMessage =
            this.addMessage(
                "assistant",
                "HalDo AI schreibt …",
                {
                    typing:
                        true
                }
            );


        if (
            typeof ui.render ===
            "function"
        ) {

            ui.render();

        }


        try {

            const response =
                await this.generate(
                    text,
                    {
                        messages:
                            this.getSession()
                                .messages
                                .slice(
                                    -20
                                ),

                        userMessage:
                            userMessage

                    }
                );


            const session =
                this.getSession();


            const index =
                session.messages.findIndex(
                    message =>
                        message.id ===
                        typingMessage.id
                );


            if (
                index !==
                -1
            ) {

                session.messages[
                    index
                ] =
                    {

                        ...typingMessage,

                        text:
                            response ||
                            "Ich konnte darauf gerade keine Antwort erzeugen.",

                        meta:
                            {

                                typing:
                                    false

                            }

                    };

            }


            session.updatedAt =
                Date.now();


            this.save(
                session.messages
            );


            HD9.emit?.(
                "ai:response",
                {
                    input:
                        text,

                    response:
                        response
                }
            );


        }

        catch (error) {

            console.error(
                "HalDo AI Fehler:",
                error
            );


            const session =
                this.getSession();


            const index =
                session.messages.findIndex(
                    message =>
                        message.id ===
                        typingMessage.id
                );


            if (
                index !==
                -1
            ) {

                session.messages[
                    index
                ] =
                    {

                        ...typingMessage,

                        text:
                            "Entschuldigung, beim Antworten ist ein Fehler aufgetreten.",

                        meta:
                            {

                                error:
                                    true

                            }

                    };

            }


            this.save(
                session.messages
            );


            HD9.emit?.(
                "ai:error",
                error
            );

        }


        if (
            typeof ui.render ===
            "function"
        ) {

            ui.render();

        }


        return userMessage;

    };


/* =========================================================
   HALDO AI APP DEFINITION
   ========================================================= */

HD9.createAIApp =
    function() {

        return HD8.createApp({

            id:
                "haldo-ai",

            name:
                "HalDo AI",

            icon:
                "☀️",

            category:
                "AI",

            description:
                "Lebendige HalDo AI – Gespräch, Schreiben, Antworten und intelligente Assistenz.",

            version:
                "22.0.0",

            capabilities:
                [

                    "Chat",

                    "Schreiben",

                    "Fragen beantworten",

                    "Erklären",

                    "Lernen",

                    "Übersetzen",

                    "Planen",

                    "Ideen entwickeln",

                    "Code",

                    "Voice",

                    "AI-Verlauf"

                ],

            render:
                function(
                    container,
                    windowInstance
                ) {

                    const app =
                        new HD8.App({
                            id:
                                "haldo-ai",

                            name:
                                "HalDo AI",

                            icon:
                                "☀️",

                            category:
                                "AI",

                            description:
                                "Lebendige HalDo AI",

                            capabilities:
                                [

                                    "Chat",

                                    "Schreiben",

                                    "Antworten",

                                    "Voice",

                                    "Lernen",

                                    "Übersetzen",

                                    "Planen"

                                ]

                        });


                    app.init(
                        container,
                        windowInstance
                    );


                    HD9.renderAI(
                        container,
                        app
                    );

                }

        });

    };


/* =========================================================
   RENDER AI
   ========================================================= */

HD9.renderAI =
    function(
        container,
        app
    ) {

        const session =
            HD9.ai.getSession();


        container.innerHTML = `

            <div
                class="hd-ai-app"
            >

                <header
                    class="hd-ai-header"
                >

                    <div
                        class="hd-ai-avatar"
                        data-ai-avatar
                    >
                        <div
                            class="hd-ai-avatar-glow"
                        ></div>

                        <div
                            class="hd-ai-avatar-core"
                        >
                            ☀
                        </div>

                    </div>


                    <div
                        class="hd-ai-header-text"
                    >

                        <strong>
                            HalDo AI
                        </strong>

                        <span>
                            Ich bin da und höre dir zu.
                        </span>

                    </div>


                    <button
                        type="button"
                        class="hd-ai-clear"
                        data-ai-clear
                        title="Chat löschen"
                    >
                        🗑
                    </button>

                </header>


                <main
                    class="hd-ai-messages"
                    data-ai-messages
                    aria-live="polite"
                ></main>


                <div
                    class="hd-ai-status"
                    data-ai-status
                >
                    Bereit
                </div>


                <form
                    class="hd-ai-input-area"
                    data-ai-form
                >

                    <button
                        type="button"
                        class="hd-ai-tool-button"
                        data-ai-voice
                        title="Voice"
                    >
                        🎙️
                    </button>


                    <textarea
                        class="hd-ai-input"
                        data-ai-input
                        rows="1"
                        autocomplete="off"
                        placeholder="Schreib mit HalDo AI …"
                    ></textarea>


                    <button
                        type="submit"
                        class="hd-ai-send"
                        title="Senden"
                    >
                        ➤
                    </button>

                </form>

            </div>

        `;


        const messages =
            container.querySelector(
                "[data-ai-messages]"
            );


        const input =
            container.querySelector(
                "[data-ai-input]"
            );


        const form =
            container.querySelector(
                "[data-ai-form]"
            );


        const status =
            container.querySelector(
                "[data-ai-status]"
            );


        const clear =
            container.querySelector(
                "[data-ai-clear]"
            );


        const voice =
            container.querySelector(
                "[data-ai-voice]"
            );


        const renderMessages =
            () => {

                const current =
                    HD9.ai.getSession();


                messages.innerHTML =
                    "";


                if (
                    current.messages.length ===
                    0
                ) {

                    const welcome =
                        document.createElement(
                            "div"
                        );


                    welcome.className =
                        "hd-ai-welcome";


                    welcome.innerHTML = `

                        <div
                            class="hd-ai-welcome-sun"
                        >
                            ☀
                        </div>

                        <h3>
                            Willkommen bei HalDo AI
                        </h3>

                        <p>
                            Schreib mir einfach.
                            Wir können uns unterhalten,
                            Texte schreiben, Fragen klären,
                            lernen, planen und vieles mehr.
                        </p>

                    `;


                    messages.appendChild(
                        welcome
                    );

                    return;

                }


                current.messages.forEach(
                    message => {

                        const row =
                            document.createElement(
                                "article"
                            );


                        row.className =
                            "hd-ai-message " +
                            (
                                message.role ===
                                "user"
                                    ? "user"
                                    : "assistant"
                            );


                        const bubble =
                            document.createElement(
                                "div"
                            );


                        bubble.className =
                            "hd-ai-bubble";


                        bubble.textContent =
                            message.text;


                        row.appendChild(
                            bubble
                        );


                        messages.appendChild(
                            row
                        );

                    }
                );


                requestAnimationFrame(
                    () => {

                        messages.scrollTop =
                            messages.scrollHeight;

                    }
                );

            };


        renderMessages();


        const resizeInput =
            () => {

                input.style.height =
                    "auto";


                input.style.height =
                    Math.min(
                        input.scrollHeight,
                        130
                    ) +
                    "px";

            };


        input.addEventListener(
            "input",
            resizeInput
        );


        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();


                    form.requestSubmit();

                }

            }
        );


        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const text =
                    input.value.trim();


                if (!text) {

                    return;

                }


                input.value =
                    "";

                resizeInput();


                status.textContent =
                    "HalDo AI denkt …";


                await HD9.ai.send(
                    text,
                    {
                        render:
                            renderMessages
                    }
                );


                status.textContent =
                    "Bereit";


                input.focus();

            }
        );


        clear.addEventListener(
            "click",
            () => {

                if (
                    !confirm(
                        "Diesen HalDo-AI-Verlauf löschen?"
                    )
                ) {

                    return;

                }


                HD9.ai.clear();

                renderMessages();

                status.textContent =
                    "Verlauf gelöscht.";

            }
        );


        voice.addEventListener(
            "click",
            () => {

                HD9.startVoiceInput(
                    input,
                    status
                );

            }
        );


        HD9.emit?.(
            "ai:ui-ready",
            {
                container,
                app
            }
        );


        setTimeout(
            () => {

                input.focus();

            },
            50
        );

    };


/* =========================================================
   VOICE INPUT
   ========================================================= */

HD9.startVoiceInput =
    function(
        input,
        status
    ) {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            if (status) {

                status.textContent =
                    "Voice-Eingabe wird von diesem Browser nicht unterstützt.";

            }


            return false;

        }


        const recognition =
            new SpeechRecognition();


        recognition.lang =
            document.documentElement.lang ||
            "de-DE";


        recognition.interimResults =
            false;


        recognition.continuous =
            false;


        recognition.onstart =
            () => {

                if (status) {

                    status.textContent =
                        "HalDo AI hört zu …";

                }

            };


        recognition.onresult =
            event => {

                const transcript =
                    event.results?.[0]?.[0]?.transcript ||
                    "";


                input.value =
                    transcript;


                input.dispatchEvent(
                    new Event(
                        "input"
                    )
                );


                if (status) {

                    status.textContent =
                        "Sprache erkannt.";

                }

            };


        recognition.onerror =
            error => {

                console.warn(
                    "Voice Fehler:",
                    error
                );


                if (status) {

                    status.textContent =
                        "Voice konnte nicht gestartet werden.";

                }

            };


        recognition.onend =
            () => {

                setTimeout(
                    () => {

                        if (status) {

                            status.textContent =
                                "Bereit";

                        }

                    },
                    1200
                );

            };


        try {

            recognition.start();

            return true;

        }

        catch (error) {

            console.warn(
                "Voice Start Fehler:",
                error
            );

            return false;

        }

    };


/* =========================================================
   VOICE OUTPUT
   ========================================================= */

HD9.speak =
    function(
        text,
        options = {}
    ) {

        if (
            !("speechSynthesis" in window)
        ) {

            return false;

        }


        const utterance =
            new SpeechSynthesisUtterance(
                String(
                    text || ""
                )
            );


        utterance.lang =
            options.lang ||
            document.documentElement.lang ||
            "de-DE";


        utterance.rate =
            Number(
                options.rate ??
                .96
            );


        utterance.pitch =
            Number(
                options.pitch ??
                1
            );


        utterance.volume =
            Number(
                options.volume ??
                1
            );


        window.speechSynthesis.cancel();


        window.speechSynthesis.speak(
            utterance
        );


        HD9.emit?.(
            "ai:speaking",
            {
                text
            }
        );


        return true;

    };


/* =========================================================
   CREATE AI APP
   ========================================================= */

try {

    HD9.createAIApp();

}

catch (error) {

    console.error(
        "HalDo AI App konnte nicht registriert werden:",
        error
    );

}

</script>

HD10.getAppsByCategory =
    function(
        category
    ) {

        const target =
            String(
                category ||
                ""
            )
            .toLowerCase();


        return this.getAppCatalogList()
            .filter(
                app =>
                    String(
                        app.category
                    )
                    .toLowerCase() ===
                    target
            );

    };


/* =========================================================
   APP COUNT
   ========================================================= */

HD10.appCount =
    function() {

        return HD10.appCatalog.size;

    };


/* =========================================================
   APP SYSTEM BRIDGE
   ========================================================= */

HD10.mountCatalogApp =
    function(
        id,
        container,
        windowInstance
    ) {

        const definition =
            HD10.getCatalogApp(
                id
            );


        if (!definition) {

            throw new Error(
                "Unbekannte HalDo-App: " +
                id
            );

        }


        /*
         * HalDo AI hat seine eigene spezialisierte UI
         * aus TEIL 9.
         */

        if (
            definition.id ===
            "haldo-ai" &&
            typeof HD9.renderAI ===
            "function"
        ) {

            const app =
                new HD8.App(
                    definition
                );


            app.init(
                container,
                windowInstance
            );


            HD9.renderAI(
                container,
                app
            );


            return app;

        }


        /*
         * Alle anderen Apps benutzen dieselbe
         * gemeinsame App Foundation.
         */

        const app =
            new HD8.App(
                definition
            );


        app.init(
            container,
            windowInstance
        );


        app.render();


        return app;

    };


/* =========================================================
   APP SYSTEM REGISTRATION BRIDGE
   ========================================================= */

HD10.registerAllIntoAppSystem =
    function() {

        const manager =
            HD10.appManager ||
            HD10.apps ||
            window.HalDoAppManager;


        /*
         * Wenn bereits ein App Manager existiert,
         * werden die Definitionen dort ergänzt.
         */

        if (
            manager &&
            typeof manager.register ===
            "function"
        ) {

            HD10.getAppCatalogList()
                .forEach(
                    definition => {

                        try {

                            manager.register(
                                definition
                            );

                        }

                        catch (error) {

                            console.warn(
                                "App bereits vorhanden oder Registrierung nicht möglich:",
                                definition.id,
                                error
                            );

                        }

                    }
                );

        }


        /*
         * Keine zweite konkurrierende Registry
         * erzeugen. Der Katalog bleibt lediglich
         * die gemeinsame Definitionsquelle.
         */

        return HD10.appCount();

    };


/* =========================================================
   SYSTEM EVENT
   ========================================================= */

if (
    typeof HD10.emit ===
    "function"
) {

    HD10.emit(
        "apps:catalog-ready",
        {

            count:
                HD10.appCount(),

            apps:
                HD10.getAppCatalogList()
                    .map(
                        app =>
                            app.id
                    )

        }
    );

}


/* =========================================================
   START REGISTRATION
   ========================================================= */

try {

    HD10.registerAllIntoAppSystem();

}

catch (error) {

    console.error(
        "HalDo App Catalog Fehler:",
        error
    );

}

    {

        windows: new Map(),

        activeWindow: null,

        sequence: 1000,

        initialized: false

    };


/* =========================================================
   SAFE ID
   ========================================================= */

HD11.safeId =
    function(value) {

        return String(value || "")
            .toLowerCase()
            .replace(
                /[^a-z0-9äöüß_-]/gi,
                "-"
            )
            .replace(
                /-+/g,
                "-"
            )
            .replace(
                /^-|-$|/g,
                ""
            );

    };


/* =========================================================
   ESCAPE HTML
   ========================================================= */

HD11.escapeHTML =
    function(value) {

        return String(
            value === undefined ||
            value === null
                ? ""
                : value
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    };


/* =========================================================
   APP STORAGE
   ========================================================= */

HD11.appStorage =
    function(appId) {

        const prefix =
            "haldo-os22-app-";

        return {

            key:
                prefix +
                HD11.safeId(
                    appId
                ),

            read(defaultValue = {}) {

                try {

                    const raw =
                        localStorage.getItem(
                            this.key
                        );

                    if (!raw) {

                        return defaultValue;

                    }

                    return JSON.parse(
                        raw
                    );

                }

                catch (error) {

                    console.warn(
                        "HalDo App Storage konnte nicht gelesen werden:",
                        error
                    );

                    return defaultValue;

                }

            },

            write(value) {

                try {

                    localStorage.setItem(
                        this.key,
                        JSON.stringify(
                            value
                        )
                    );

                    return true;

                }

                catch (error) {

                    console.warn(
                        "HalDo App Storage konnte nicht gespeichert werden:",
                        error
                    );

                    return false;

                }

            }

        };

    };

   FIND APP DEFINITION

HD11.findAppDefinition =
    function(appId) {

            return window.HALDO_APP_DEFINITIONS

        return null;

/* =========================================================

HD11.openAppWindow =
    function(
        appId,
        options = {}
    ) {

        const definition =
            HD11.findAppDefinition(
                appId
            );


        if (!definition) {

            console.warn(
                "HalDo App nicht gefunden:",
                appId
            );

            return null;

        }


        HD11.injectStyles();


        const container =
            HD11.getAppContainer();


        const existing =
            HD11.AppWindowEngine.windows.get(
                definition.id
            );


        if (existing) {

            HD11.focusWindow(
                existing.element
            );

            return existing;

        }


        const windowElement =
            document.createElement(
                "section"
            );


        windowElement.className =
            "haldo-app-window";


        windowElement.dataset.appId =
            definition.id;


        windowElement.setAttribute(
            "role",
            "dialog"
        );


        windowElement.setAttribute(
            "aria-label",
            definition.name
        );


        HD11.AppWindowEngine.sequence +=
            1;


        windowElement.style.zIndex =
            String(
                HD11.AppWindowEngine.sequence
            );


        const instance = {

            id:
                definition.id,

            definition,

            element:
                windowElement,

            currentPage:
                "home",

            minimized:
                false,

            maximized:
                false,

            state:
                HD11.appStorage(
                    definition.id
                ).read(
                    definition.state ||
                    {}
                ),

            storage:
                HD11.appStorage(
                    definition.id
                ),

            destroy:
                () =>
                    HD11.closeAppWindow(
                        definition.id
                    )

        };


        windowElement.innerHTML =
            HD11.createWindowHTML(
                instance
            );


        container.appendChild(
            windowElement
        );


        HD11.AppWindowEngine.windows.set(
            definition.id,
            instance
        );


        HD11.bindWindowEvents(
            instance
        );


        HD11.renderAppContent(
            instance
        );


        requestAnimationFrame(
            () => {

                windowElement.classList.add(
                    "haldo-window-visible"
                );

            }
        );


        HD11.focusWindow(
            windowElement
        );


        return instance;

    };


/* =========================================================
   WINDOW HTML
   ========================================================= */

HD11.createWindowHTML =
    function(instance) {

        const app =
            instance.definition;


        return `

            <div class="haldo-app-titlebar">

                <div class="haldo-app-title">

                    <span class="haldo-app-icon">
                        ${HD11.escapeHTML(app.icon)}
                    </span>

                <div class="haldo-app-controls">

                    <button
                        class="haldo-window-button haldo-window-minimize"
                        type="button"

                    >−</button>

                        class="haldo-window-button haldo-window-maximize"
                        type="button"
                        title="Vergrößern"
                        aria-label="Vergrößern"
                    >□</button>

                    <button
                        class="haldo-window-button haldo-window-close"
                        type="button"
                        title="Schließen"
                        aria-label="Schließen"
                    >×</button>

                </div>

            </div>

            <div class="haldo-app-body">

                <nav
                    class="haldo-app-sidebar"
                    aria-label="App-Navigation"
                >

                    <button
                        class="haldo-app-nav-button active"

                        type="button"
                    >
                        Übersicht
                    </button>

                    <button
                        class="haldo-app-nav-button"

                    >
                        Funktionen
                    </button>

                    <button
                        class="haldo-app-nav-button"

                    </button>

                </nav>

                <main
                    class="haldo-app-content"
                ></main>

            </div>

        `;

    };


/* =========================================================
   WINDOW EVENTS
   ========================================================= */

HD11.bindWindowEvents =
    function(instance) {

        const element =
            instance.element;


        /*
         * WICHTIG:
         * Das X wird mit EINEM Klick geschlossen.
         */

        const closeButton =
            element.querySelector(
                ".haldo-window-close"
            );


        if (closeButton) {

            closeButton.addEventListener(
                "click",
                event => {

                    event.preventDefault();
                    event.stopPropagation();

                    HD11.closeAppWindow(
                        instance.id
                    );

                }
            );

        }


        const minimizeButton =
            element.querySelector(
                ".haldo-window-minimize"
            );


        if (minimizeButton) {

            minimizeButton.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    HD11.toggleMinimize(
                        instance
                    );

                }
            );

        }


        const maximizeButton =
            element.querySelector(
                ".haldo-window-maximize"
            );


        if (maximizeButton) {

            maximizeButton.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    HD11.toggleMaximize(
                        instance
                    );

                }
            );

        }


        element.addEventListener(
            "pointerdown",
            () => {

                HD11.focusWindow(
                    element
                );

            }
        );


        element
            .querySelectorAll(
                ".haldo-app-nav-button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            HD11.showAppPage(
                                instance,
                                button.dataset.page
                            );

                        }
                    );

                }
            );

    };


/* =========================================================
   FOCUS WINDOW
   ========================================================= */

HD11.focusWindow =
    function(element) {

        if (!element) {

            return;

        }


        HD11.AppWindowEngine.sequence +=
            1;


        element.style.zIndex =
            String(
                HD11.AppWindowEngine.sequence
            );


        HD11.AppWindowEngine.activeWindow =
            element;

    };


/* =========================================================
   CLOSE WINDOW
   ========================================================= */

HD11.closeAppWindow =
    function(appId) {

        const instance =
            HD11.AppWindowEngine.windows.get(
                String(appId)
            );


        if (!instance) {

            return false;

        }


        const element =
            instance.element;


        if (element) {

            element.classList.remove(
                "haldo-window-visible"
            );


            setTimeout(
                () => {

                    if (
                        element &&
                        element.parentNode
                    ) {

                        element.parentNode.removeChild(
                            element
                        );

                    }

                },
                190
            );

        }


        HD11.AppWindowEngine.windows.delete(
            String(appId)
        );


        if (
            HD11.AppWindowEngine.activeWindow ===
            element
        ) {

            HD11.AppWindowEngine.activeWindow =
                null;

        }


        return true;

    };


/* =========================================================
   MINIMIZE
   ========================================================= */

HD11.toggleMinimize =
    function(instance) {

        if (!instance) {

            return;

        }


        instance.minimized =
            !instance.minimized;


        instance.element.classList.toggle(
            "haldo-window-minimized",
            instance.minimized
        );

    };


/* =========================================================
   MAXIMIZE
   ========================================================= */

HD11.toggleMaximize =
    function(instance) {

        if (!instance) {

            return;

        }


        instance.maximized =
            !instance.maximized;


        instance.element.classList.toggle(
            "haldo-window-maximized",
            instance.maximized

/* =========================================================

HD11.bindContentEvents =
    function(instance) {

        const element =
            instance.element;


        element
            .querySelectorAll(
                "[data-action]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        event => {

                            event.preventDefault();

                            HD11.executeAppAction(
                                instance,
                                button.dataset.action
                            );

                        }
                    );

                }
            );

    };


/* =========================================================
   APP ACTIONS
   ========================================================= */

HD11.executeAppAction =
    function(
        instance,
        action
    ) {

        const status =
            instance.element.querySelector(
                '[data-role="status"]'
            );


        const setStatus =
            message => {

                if (status) {

                    status.textContent =
                        message;

                }

            };


        switch (
            String(action)
        ) {

            case "save":

                instance.storage.write(
                    instance.state
                );

                setStatus(
                    "✓ App-Daten wurden gespeichert."
                );

                break;


            case "save-settings": {

                const input =
                    instance.element.querySelector(
                        '[data-setting="customTitle"]'
                    );


                if (input) {

                    instance.state.customTitle =
                        input.value;

                }


                instance.storage.write(
                    instance.state
                );


                setStatus(
                    "✓ Einstellungen gespeichert."
                );

                break;

            }


            case "reset-settings":

                instance.state = {};

                instance.storage.write(
                    {}
                );

                HD11.renderAppContent(
                    instance
                );

                break;


            case "voice":

                if (
                    "speechSynthesis" in
                    window
                ) {

                    const utterance =
                        new SpeechSynthesisUtterance(
                            instance.definition.name +
                            " ist bereit."
                        );


                    utterance.lang =
                        document.documentElement
                            .lang ||
                        "de-DE";


                    window.speechSynthesis.speak(
                        utterance
                    );


                    setStatus(
                        "🎙️ Sprachausgabe gestartet."
                    );

                }

                else {

                    setStatus(
                        "Voice wird auf diesem Gerät nicht unterstützt."
                    );

                }

                break;


            case "ai":

                HD11.openAIFromApp(
                    instance
                );

                break;


            default:

                setStatus(
                    "Funktion '" +
                    action +
                    "' wurde ausgelöst."
                );

        }

    };


/* =========================================================
   OPEN HALDO AI FROM APP
   ========================================================= */

HD11.openAIFromApp =
    function(instance) {

        /*
         * Zuerst vorhandenen AI-Öffner benutzen.
         */

        if (
            typeof HD11.openAppWindow ===
            "function"
        ) {

            const aiWindow =
                HD11.openAppWindow(
                    "haldo-ai"
                );


            if (aiWindow) {

                aiWindow.state.contextApp =
                    instance.definition.name;

                aiWindow.storage.write(
                    aiWindow.state
                );

                return aiWindow;

            }

        }


        /*
         * Fallback auf bereits vorhandene
         * zentrale HalDo-AI-Schnittstellen.
         */

        if (
            typeof window.openHalDoAI ===
            "function"
        ) {

            return window.openHalDoAI();

        }


        if (
            typeof window.HalDoOpenAI ===
            "function"
        ) {

            return window.HalDoOpenAI();

        }


        return null;

    };


/* =========================================================
   OPEN ANY APP
   ========================================================= */

HD11.openApp =
    function(appId) {

        return HD11.openAppWindow(
            appId
        );

    };


/* =========================================================
   CLOSE ALL APPS
   ========================================================= */

HD11.closeAllApps =
    function() {

        Array.from(
            HD11.AppWindowEngine.windows.keys()
        )
        .forEach(
            appId => {

                HD11.closeAppWindow(
                    appId
                );

            }
        );

    };


/* =========================================================
   WINDOW COUNT
   ========================================================= */

HD11.getOpenWindowCount =
    function() {

        return HD11.AppWindowEngine
            .windows.size;

    };


/* =========================================================
   INITIALIZE
   ========================================================= */

HD11.initAppWindowEngine =
    function() {

        if (
            HD11.AppWindowEngine.initialized
        ) {

            return;

        }


        HD11.injectStyles();


        HD11.getAppContainer();


        HD11.AppWindowEngine.initialized =
            true;


        console.info(
            "HalDo App Window Engine bereit."
        );


        if (
            typeof HD11.emit ===
            "function"
        ) {

            HD11.emit(
                "app-window-engine:ready"
            );

        }

    };


/* =========================================================
   DOM READY
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            HD11.initAppWindowEngine();

        },
        {
            once: true
        }
    );

}

else {

    HD11.initAppWindowEngine();

}

</script>

<script>
"use strict";

window.HalDo = window.HalDo || {};

   HALDO AI STATE
   ========================================================= */

HD12.ai =
    HD12.ai ||
    {};

HD12.ai.chat =
    HD12.ai.chat ||
    {

        initialized: false,

        messages: [],

        speaking: false,

        listening: false,

        context: {},

        storageKey:
            "haldo-os22-ai-conversation",

        maxMessages:
            200

    };


/* =========================================================
   STORAGE
   ========================================================= */

HD12.ai.load =
    function() {

        try {

            const raw =
                localStorage.getItem(
                    HD12.ai.chat.storageKey
                );


            if (!raw) {

                HD12.ai.chat.messages = [];

                return;

            }


            const data =
                JSON.parse(raw);


            if (
                Array.isArray(data)
            ) {

                HD12.ai.chat.messages =
                    data.slice(
                        -HD12.ai.chat.maxMessages
                    );

            }

        }

        catch (error) {

            console.warn(
                "HalDo AI Verlauf konnte nicht geladen werden:",
                error
            );

            HD12.ai.chat.messages =
                [];

        }

    };


/* =========================================================
   SAVE
   ========================================================= */

HD12.ai.save =
    function() {

        try {

            localStorage.setItem(
                HD12.ai.chat.storageKey,
                JSON.stringify(
                    HD12.ai.chat.messages
                )
            );

            return true;

        }

        catch (error) {

            console.warn(
                "HalDo AI Verlauf konnte nicht gespeichert werden:",
                error
            );

            return false;

        }

    };


/* =========================================================

    function(
        role,

        const message = {

            id:

                    .toString(36)
                    .slice(2),

            role:
                role === "user"

                    : "assistant",

            text:
                String(text || ""),

            timestamp:
                Date.now()

        };


        HD12.ai.chat.messages.push(
            message
        );


        if (
            HD12.ai.chat.messages.length >
            HD12.ai.chat.maxMessages
        ) {

            HD12.ai.chat.messages =
                HD12.ai.chat.messages.slice(
                    -HD12.ai.chat.maxMessages
                );

        }


        HD12.ai.save();


        return message;

    };

   ESCAPE
   ========================================================= */

HD12.ai.escape =
    function(value) {

        if (
            typeof HD12.escapeHTML ===
            "function"
        ) {

            return HD12.escapeHTML(
                value
            );

        }


        return String(
            value || ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )

        );
