        HD.clamp =

                min,

            ) {

                return Math.min(

                );

        HD.safeString =
            function(value) {

                return String(
                    value ?? ""
                );

            };


        HD.escapeHTML =
            function(value) {

                return HD.safeString(
                    value
                )
                    .replace(
                        /&/g,
                        "&amp;"
                    )
                    .replace(
                        /</g,
                        "&lt;"
                    )
                    .replace(
                        />/g,
                        "&gt;"
                    )
                    .replace(
                        /"/g,
                        "&quot;"
                    )
                    .replace(
                        /'/g,
                        "&#039;"
                    );

            };


        /*
         * ========================================================
         * GLOBAL EVENT SYSTEM
         * ========================================================
         */

        if (
            !HD.events ||
            typeof HD.events.emit !== "function"
        ) {

            const listeners =
                new Map();


            HD.events = {

                listeners,

                on(
                    event,
                    callback
                ) {

                    if (
                        typeof callback !==
                        "function"
                    ) {

                        return () => {};

                    }


                    if (
                        !listeners.has(
                            event
                        )
                    ) {

                        listeners.set(
                            event,
                            new Set()
                        );

                    }


                    listeners
                        .get(event)
                        .add(callback);


                    return () => {

                        listeners
                            .get(event)
                            ?.delete(
                                callback
                            );

                    };

                },


                off(
                    event,
                    callback
                ) {

                    listeners
                        .get(event)
                        ?.delete(
                            callback
                        );

                },


                emit(
                    event,
                    data = {}
                ) {

                    const set =
                        listeners.get(
                            event
                        );


                    if (!set) {

                        return;

                    }


                    set.forEach(
                        callback => {

                            try {

                                callback(
                                    data
                                );

                            }

                            catch (error) {

                                console.error(
                                    "[HalDo Event]",
                                    event,
                                    error
                                );

                            }

                        }
                    );

                },


                clear(
                    event
                ) {

                    if (event) {

                        listeners.delete(
                            event
                        );

                    }

                    else {

                        listeners.clear();

                    }

                }

            };

        }


        HD.emit =
            function(
                event,
                data = {}
            ) {

                try {

                    HD.events.emit(
                        event,
                        data
                    );

                        "[HalDo]",
                        event,
                        error
                    );

        );


        window.addEventListener(
            "unhandledrejection",

                HD.state.lastError =
                    {
                        type:
                            "unhandledrejection",

                        message:
                            String(
                                event.reason ||
                                "Unknown rejection"
                            ),

                    };


                HD.emit(
                    "system:error",
                    HD.state.lastError
                );

            }
        );

<!-- =========================================================

<script>

    HD.persistence = {

        version:
            "22.0.0",

        initialized:
            false,


        save(
            key,
            value
        ) {

            return HD.storage.set(
                "persistence:" +
                key,
                value
            );

        },


        load(
            key,
            fallback = null
        ) {

            return HD.storage.get(
                "persistence:" +
                key,
                fallback
            );

        },


        remove(
            key
        ) {

            return HD.storage.remove(
                "persistence:" +
                key
            );

        },


        has(
            key
        ) {

            return HD.storage.has(
                "persistence:" +
                key
            );

        },


        clear() {

            HD.storage
                .keys()
                .filter(
                    key =>
                        key.startsWith(
                            "persistence:"
                        )
                )
                .forEach(
                    key => {

                        HD.storage.remove(
                            key
                        );

                    }
                );

            return true;

        },


        initialize() {

            if (
                this.initialized
            ) {

                return true;

            }


            this.initialized =
                true;


            HD.emit(
                "persistence:initialized"
            );


            return true;

        }

    };


    HD.persistence.initialize();


    HD.runtime.register(
        "persistence",
        HD.persistence,
        {
            priority:
                45
        }
    );

</script>


<!-- =========================================================
     APP STATE SYSTEM
     ========================================================= -->

<script>

    HD.appState = {

        version:
            "22.0.0",

        storagePrefix:
            "app-state:",

        cache:
            new Map(),


        load(
            appId
        ) {

            if (
                !appId
            ) {

                return {};

            }


            if (
                this.cache.has(
                    appId
                )
            ) {

                return this.cache.get(
                    appId
                );

            }


            const stored =
                HD.storage.get(
                    this.storagePrefix +
                    appId,
                    {}
                );


            const state =
                stored &&
                typeof stored ===
                "object"
                    ? stored
                    : {};


            this.cache.set(
                appId,
                state
            );


            return state;

        },


        save(
            appId,
            state
        ) {

            if (
                !appId
            ) {

                return false;

            }


            const safeState =
                state || {};


            this.cache.set(
                appId,
                safeState
            );


            try {

                HD.storage.set(
                    this.storagePrefix +
                    appId,
                    safeState
                );

            }

            catch (
                error
            ) {

                console.warn(
                    "HalDo App State Save:",
                    error
                );


                return false;

            }


            HD.emit(
                "app:state:saved",
                {
                    appId,
                    state:
                        safeState
                }
            );


            return true;

        },


        get(
            appId
        ) {

            return this.load(
                appId
            );

        },


        update(
            appId,
            changes
        ) {

            const state =
                this.load(
                    appId
                );


            Object.assign(
                state,
                changes || {}
            );


            return this.save(
                appId,
                state
            );

        },


        clear(
            appId
        ) {

            if (
                !appId
            ) {

                return false;

            }


            this.cache.delete(
                appId
            );


            try {

                HD.storage.remove(
                    this.storagePrefix +
                    appId
                );

            }

            catch (
                error
            ) {}


            HD.emit(
                "app:state:cleared",
                {
                    appId
                }
            );


            return true;

        }

    };


    HD.runtime.register(
        "app-state",
        HD.appState
    );


/* =========================================================
   APP DATA SYSTEM
   ========================================================= */

    HD.appData = {

        prefix:
            "app-data:",


        getKey(
            appId,
            key
        ) {

            return (
                this.prefix +
                appId +
                ":" +
                key
            );

        },


        set(
            appId,
            key,
            value
        ) {

            if (
                !appId ||
                !key
            ) {

                return false;

            }


            HD.storage.set(
                this.getKey(
                    appId,
                    key
                ),
                value
            );


            HD.emit(
                "app:data:set",
                {
                    appId,
                    key,
                    value
                }
            );


            return true;

        },


        get(
            appId,
            key,
            fallback = null
        ) {

            if (
                !appId ||
                !key
            ) {

                return fallback;

            }


            return HD.storage.get(
                this.getKey(
                    appId,
                    key
                ),
                fallback
            );

        },


        remove(
            appId,
            key
        ) {

            if (
                !appId ||
                !key
            ) {

                return false;

            }


            HD.storage.remove(
                this.getKey(
                    appId,
                    key
                )
            );


            HD.emit(
                "app:data:removed",
                {
                    appId,
                    key
                }
            );


            return true;

        }

    };


    HD.runtime.register(
        "app-data",
        HD.appData
    );

</script>


<!-- =========================================================
     APP RUNTIME
     ========================================================= -->

<script>

    HD.appRuntime = {

        version:
            "22.0.0",

        instances:
            new Map(),


        create(
            manifest
        ) {

            if (
                !manifest ||
                !manifest.id
            ) {

                return null;

            }


            if (
                this.instances.has(
                    manifest.id
                )
            ) {

                return this.instances.get(
                    manifest.id
                );

            }


            const instance =
                HD.appFoundation
                    .createDefinition(
                        manifest
                    );


            instance.state =
                HD.appState.load(
                    manifest.id
                );


            instance.data =
                {};


            instance.open =
                function() {

                    if (
                        this.destroyed
                    ) {

                        return false;

                    }


                    this.opened =
                        true;

                    this.active =
                        true;

                    this.minimized =
                        false;

                    this.closed =
                        false;


                    HD.emit(
                        "app:opened",
                        {
                            app:
                                this
                        }
                    );


                    return true;

                };


            instance.close =
                function() {

                    HD.appState.save(
                        this.id,
                        this.state
                    );


                    this.opened =
                        false;

                    this.active =
                        false;

                    this.closed =
                        true;


                    HD.emit(
                        "app:closed",
                        {
                            app:
                                this
                        }
                    );


                    return true;

                };


            instance.minimize =
                function() {

                    this.minimized =
                        true;

                    this.active =
                        false;


                    HD.emit(
                        "app:minimized",
                        {
                            app:
                                this
                        }
                    );


                    return true;

                };


            instance.restore =
                function() {

                    this.minimized =
                        false;

                    this.opened =
                        true;

                    this.closed =
                        false;

                    this.active =
                        true;


                    HD.emit(
                        "app:restored",
                        {
                            app:
                                this
                        }
                    );


                    return true;

                };


            instance.activate =
                function() {

                    this.active =
                        true;


                    HD.emit(
                        "app:activated",
                        {
                            app:
                                this
                        }
                    );


                    return true;

                };


            instance.deactivate =
                function() {

                    this.active =
                        false;


                    HD.emit(
                        "app:deactivated",
                        {
                            app:
                                this
                        }
                    );


                    return true;

                };


            instance.setState =
                function(
                    key,
                    value
                ) {

                    this.state =
                        this.state ||
                        {};


                    this.state[key] =
                        value;


                    HD.appState.save(
                        this.id,
                        this.state
                    );


                    HD.emit(
                        "app:state-change",
                        {
                            app:
                                this,

                            key,
                            value
                        }
                    );


                    return true;

                };


            instance.getState =
                function(
                    key,
                    fallback = null
                ) {

                    if (
                        this.state &&
                        Object.prototype
                            .hasOwnProperty
                            .call(
                                this.state,
                                key
                            )
                    ) {

                        return this.state[key];

                    }


                    return fallback;

                };


            instance.save =
                function() {

                    return HD.appState.save(
                        this.id,
                        this.state
                    );

                };


            instance.destroy =
                function() {

                    this.save();


                    HD.appFoundation
                        .destroy(
                            this
                        );


                    HD.appRuntime
                        .instances
                        .delete(
                            this.id
                        );


                    return true;

                };


            this.instances.set(
                manifest.id,
                instance
            );


            HD.appFoundation
                .initialize(
                    instance
                );


            HD.emit(
                "app:instance:created",
                {
                    app:
                        instance
                }
            );


            return instance;

        },


        get(
            appId
        ) {

            return this.instances.get(
                appId
            );

        },


        has(
            appId
        ) {

            return this.instances.has(
                appId
            );

        },


        getOrCreate(
            appId
        ) {

            let instance =
                this.get(
                    appId
                );


            if (
                instance
            ) {

                return instance;

            }


            const manifest =
                HD.appRegistry.get(
                    appId
                );


            if (
                !manifest
            ) {

                return null;

            }


            return this.create(
                manifest
            );

        },


        all() {

            return Array.from(
                this.instances.values()
            );

        }

    };


    HD.runtime.register(
        "app-runtime",
        HD.appRuntime
    );

</script>

<script>

    HD.windowManager = {

        version:
            "22.0.0",

        windows:
            new Map(),

        zIndex:
            1000,

        activeWindow:
            null,


        create(
            app
        ) {

            if (
                !app
            ) {

                return null;

            }


            const existing =
                this.windows.get(
                    app.id
                );


            if (
                existing
            ) {

                this.activate(
                    existing
                );


                return existing;

            }


            const windowElement =
                document.createElement(
                    "section"
                );


            windowElement.className =
                "haldo-window";


            windowElement.dataset.app =
                app.id;


            windowElement.dataset.window =
                app.id;


            windowElement.style.zIndex =
                ++this.zIndex;


            const savedWindow =
                HD.storage.get(
                    "window:" +
                    app.id,
                    {}
                );


            const width =
                Number(
                    savedWindow.width ||
                    HD.config
                        .defaultWindowWidth ||
                    680
                );


            const height =
                Number(
                    savedWindow.height ||
                    HD.config
                        .defaultWindowHeight ||
                    440
                );


            const left =
                Number(
                    savedWindow.left ??
                    80
                );


            const top =
                Number(
                    savedWindow.top ??
                    70
                );


            windowElement.style.width =
                width + "px";


            windowElement.style.height =
                height + "px";


            windowElement.style.left =
                left + "px";


            windowElement.style.top =
                top + "px";


            windowElement.innerHTML = `

                <div
                    class="haldo-window-header"
                    data-window-drag
                >

                    <div
                        class="haldo-window-title"
                    >

                        <div
                            class="haldo-window-icon"
                        >
                            ${HD.escapeHTML(
                                app.manifest?.icon ||
                                "○"
                            )}
                        </div>

                        <div
                            class="haldo-window-name"
                        >
                            ${HD.escapeHTML(
                                app.name ||
                                app.id
                            )}
                        </div>

                    </div>


                    <div
                        class="haldo-window-controls"
                    >

                        <button
                            type="button"
                            class="window-control minimize"
                            title="Minimieren"
                            aria-label="Minimieren"
                        >
                            −
                        </button>


                        <button
                            type="button"
                            class="window-control maximize"
                            title="Maximieren"
                            aria-label="Maximieren"
                        >
                            □
                        </button>


                        <button
                            type="button"
                            class="window-control close"
                            title="Schließen"
                            aria-label="Schließen"
                        >
                            ×
                        </button>

                    </div>

                </div>


                <div
                    class="haldo-window-body"
                >

                    <div
                        class="haldo-app-toolbar"
                    >

                        <span
                            class="app-toolbar-status"
                        >
                            ONLINE
                        </span>

                        <span
                            class="app-toolbar-name"
                        >
                            ${HD.escapeHTML(
                                app.manifest?.category ||
                                "HalDo Anwendung"
                            )}
                        </span>

                    </div>


                    <div
                        class="haldo-app-content"
                    ></div>

                </div>


                <div
                    class="haldo-window-resize"
                    aria-label="Fenstergröße ändern"
                ></div>

            `;


            const layer =
                document.querySelector(
                    "#haldo-window-layer"
                );


            if (
                !layer
            ) {

                return null;

            }


            layer.appendChild(
                windowElement
            );


            const record = {

                id:
                    HD.uid(
                        "window"
                    ),

                appId:
                    app.id,

                app,

                element:
                    windowElement,

                width,

                height,

                x:
                    left,

                y:
                    top,

                minimized:
                    false,

                maximized:
                    false,

                closed:
                    false,

                active:
                    false,

                zIndex:
                    ++this.zIndex

            };


            this.windows.set(
                app.id,
                record
            );


            this.attachWindowEvents(
                record
            );


            this.renderApp(
                record
            );


            this.applyGeometry(
                record
            );


            this.activate(
                record
            );


            return record;

        },


        attachWindowEvents(
            record
        ) {

            const element =
                record.element;


            if (
                !element
            ) {

                return;

            }


            const minimize =
                element.querySelector(
                    ".window-control.minimize"
                );


            const maximize =
                element.querySelector(
                    ".window-control.maximize"
                );


            const close =
                element.querySelector(
                    ".window-control.close"
                );


            const header =
                element.querySelector(
                    ".haldo-window-header"
                );


            const resizeHandle =
                element.querySelector(
                    ".haldo-window-resize"
                );


            element.addEventListener(
                "pointerdown",
                () => {

                    this.activate(
                        record
                    );

                }
            );


            minimize?.addEventListener(
                "click",
                event => {

                    event.preventDefault();
                    event.stopPropagation();

                    this.minimize(
                        record.appId
                    );

                }
            );


            maximize?.addEventListener(
                "click",
                event => {

                    event.preventDefault();
                    event.stopPropagation();

                    if (
                        record.maximized
                    ) {

                        this.restore(
                            record.appId
                        );

                    }

                    else {

                        this.maximize(
                            record.appId
                        );

                    }

                }
            );


            close?.addEventListener(
                "click",
                event => {

                    event.preventDefault();
                    event.stopPropagation();

                    /*
                     * EIN Klick = SOFORT SCHLIESSEN.
                     * Kein Delay.
                     * Kein zweiter Klick.
                     */

                    this.close(
                        record.appId
                    );

                }
            );


            header?.addEventListener(
                "dblclick",
                event => {

                    if (
                        event.target.closest(
                            ".haldo-window-controls"
                        )
                    ) {

                        return;

                    }


                    if (
                        record.maximized
                    ) {

                        this.restore(
                            record.appId
                        );

                    }

                    else {

                        this.maximize(
                            record.appId
                        );

                    }

                }
            );


            this.attachDragging(
                record,
                header
            );


            this.attachResizing(
                record,
                resizeHandle
            );

        },


        attachDragging(
            record,
            header
        ) {

            if (
                !header
            ) {

                return;

            }


            let dragging =
                false;

            let offsetX =
                0;

            let offsetY =
                0;


            header.addEventListener(
                "pointerdown",
                event => {

                    if (
                        event.target.closest(
                            ".haldo-window-controls"
                        )
                    ) {

                        return;

                    }


                    if (
                        record.maximized
                    ) {

                        return;

                    }


                    dragging =
                        true;


                    offsetX =
                        event.clientX -
                        record.x;


                    offsetY =
                        event.clientY -
                        record.y;


                    try {

                        header.setPointerCapture(
                            event.pointerId
                        );

                    }

                    catch (
                        error
                    ) {}


                    this.activate(
                        record
                    );


                    event.preventDefault();

                }
            );


            header.addEventListener(
                "pointermove",
                event => {

                    if (
                        !dragging
                    ) {

                        return;

                    }


                    record.x =
                        event.clientX -
                        offsetX;


                    record.y =
                        event.clientY -
                        offsetY;


                    this.keepInsideViewport(
                        record
                    );


                    this.applyGeometry(
                        record
                    );

                }
            );


            header.addEventListener(
                "pointerup",
                event => {

                    dragging =
                        false;


                    try {

                        header.releasePointerCapture(
                            event.pointerId
                        );

                    }

                    catch (
                        error
                    ) {}


                    this.saveGeometry(
                        record
                    );

                }
            );


            header.addEventListener(
                "pointercancel",
                () => {

                    dragging =
                        false;

                }
            );

        },


        attachResizing(
            record,
            handle
        ) {

            if (
                !handle
            ) {

                return;

            }


            let resizing =
                false;

            let startX =
                0;

            let startY =
                0;

            let startWidth =
                0;

            let startHeight =
                0;


            handle.addEventListener(
                "pointerdown",
                event => {

                    if (
                        record.maximized
                    ) {

                        return;

                    }


                    resizing =
                        true;


                    startX =
                        event.clientX;


                    startY =
                        event.clientY;


                    startWidth =
                        record.width;


                    startHeight =
                        record.height;


                    try {

                        handle.setPointerCapture(
                            event.pointerId
                        );

                    }

                    catch (
                        error
                    ) {}


                    this.activate(
                        record
                    );


                    event.preventDefault();

                }
            );


            handle.addEventListener(
                "pointermove",
                event => {

                    if (
                        !resizing
                    ) {

                        return;

                    }


                    const width =
                        startWidth +
                        (
                            event.clientX -
                            startX
                        );


                    const height =
                        startHeight +
                        (
                            event.clientY -
                            startY
                        );


                    record.width =
                        Math.max(
                            HD.config
                                .minimumWindowWidth ||
                            320,
                            width
                        );


                    record.height =
                        Math.max(
                            HD.config
                                .minimumWindowHeight ||
                            220,
                            height
                        );


                    if (
                        window.innerWidth <
                        700
                    ) {

                        record.width =
                            Math.min(
                                record.width,
                                window.innerWidth -
                                18
                            );


                        record.height =
                            Math.min(
                                record.height,
                                window.innerHeight -
                                110
                            );

                    }


                    this.applyGeometry(
                        record
                    );

                }
            );


            handle.addEventListener(
                "pointerup",
                event => {

                    resizing =
                        false;


                    try {

                        handle.releasePointerCapture(
                            event.pointerId
                        );

                    }

                    catch (
                        error
                    ) {}


                    this.saveGeometry(
                        record
                    );

                }
            );


            handle.addEventListener(
                "pointercancel",
                () => {

                    resizing =
                        false;

                }
            );

        },


        renderApp(
            record
        ) {

            const content =
                record.element?.querySelector(
                    ".haldo-app-content"
                );


            if (
                !content
            ) {

                return;

            }


            const app =
                record.app;


            content.innerHTML =
                "";


            /*
             * App-spezifisches Rendering.
             */

            if (
                typeof app.render ===
                "function"
            ) {

                try {

                    app.render(
                        content,
                        record,
                        HD
                    );


                    return;

                }

                catch (
                    error
                ) {

                    HD.errors.report(
                        error,
                        "App.render:" +
                        app.id
                    );

                }

            }


            /*
             * Fallback für eine registrierte
             * Anwendung ohne eigene Renderfunktion.
             *
             * Dies ist kein leerer Platzhalter:
             * Die Anwendung erhält ein funktionierendes
             * gemeinsames App-Grundgerüst.
             */

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "generic-app";


            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "generic-app-header";


            const title =
                document.createElement(
                    "strong"
                );


            title.textContent =
                app.name ||
                app.id;


            const category =
                document.createElement(
                    "small"
                );


            category.textContent =
                app.manifest?.description ||
                "HalDo Anwendung";


            header.appendChild(
                title
            );

            header.appendChild(
                category
            );


            const body =
                document.createElement(
                    "div"
                );


            body.className =
                "generic-app-main";


            const icon =
                document.createElement(
                    "div"
                );


            icon.className =
                "generic-app-icon";


            icon.textContent =
                app.manifest?.icon ||
                "○";


            const heading =
                document.createElement(
                    "h2"
                );


            heading.textContent =
                app.name ||
                app.id;


            const paragraph =
                document.createElement(
                    "p"
                );


            paragraph.textContent =
                app.manifest?.description ||
                "HalDo Anwendung";


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "generic-actions";


            const primary =
                document.createElement(
                    "button"
                );


            primary.type =
                "button";


            primary.textContent =
                "Öffnen";


            primary.addEventListener(
                "click",
                () => {

                    HD.emit(
                        "app:action",
                        {
                            appId:
                                app.id,

                            action:
                                "open",

                            app
                        }
                    );

                }
            );


            const settings =
                document.createElement(
                    "button"
                );


            settings.type =
                "button";


            settings.textContent =
                "Einstellungen";


            settings.addEventListener(
                "click",
                () => {

                    HD.emit(
                        "app:action",
                        {
                            appId:
                                app.id,

                            action:
                                "settings",

                            app
                        }
                    );

                }
            );


            actions.appendChild(
                primary
            );


            actions.appendChild(
                settings
            );


            body.appendChild(
                icon
            );


            body.appendChild(
                heading
            );


            body.appendChild(
                paragraph
            );


            body.appendChild(
                actions
            );


            wrapper.appendChild(
                header
            );


            wrapper.appendChild(
                body
            );


            content.appendChild(
                wrapper
            );

        },


        applyGeometry(
            record
        ) {

            if (
                !record ||
                !record.element
            ) {

                return;

            }


            if (
                record.maximized
            ) {

                record.element.classList.add(
                    "maximized"
                );


                record.element.style.left =
                    "0px";


                record.element.style.top =
                    "0px";


                record.element.style.width =
                    "100vw";


                record.element.style.height =
                    "100vh";


                return;

            }


            record.element.classList.remove(
                "maximized"
            );


            record.element.style.left =
                record.x + "px";


            record.element.style.top =
                record.y + "px";


            record.element.style.width =
                record.width + "px";


            record.element.style.height =
                record.height + "px";

        },


        keepInsideViewport(
            record
        ) {

            if (
                !record ||
                record.maximized
            ) {

                return;

            }


            const margin =
                HD.config
                    .mobileWindowMargin ||
                10;


            const maxX =
                Math.max(
                    margin,
                    window.innerWidth -
                    record.width -
                    margin
                );


            const maxY =
                Math.max(
                    margin,
                    window.innerHeight -
                    record.height -
                    margin
                );


            record.x =
                HD.clamp(
                    record.x,
                    margin,
                    maxX
                );


            record.y =
                HD.clamp(
                    record.y,
                    margin,
                    maxY
                );

        },


        activate(
            record
        ) {

            if (
                !record
            ) {

                return;

            }


            this.zIndex +=
                1;


            record.zIndex =
                this.zIndex;


            record.active =
                true;


            this.activeWindow =
                record;


            this.windows.forEach(
                item => {

                    if (
                        item !== record
                    ) {

                        item.active =
                            false;


                        item.element
                            ?.classList
                            .remove(
                                "active"
                            );

                    }

                }
            );


            if (
                record.element
            ) {

                record.element.style.zIndex =
                    String(
                        record.zIndex
                    );


                record.element.classList.add(
                    "active"
                );

            }


            if (
                record.app &&
                typeof record.app.activate ===
                "function"
            ) {

                record.app.activate();

            }


            HD.emit(
                "window:activated",
                {
                    window:
                        record,

                    app:
                        record.app
                }
            );

        },


        minimize(
            appId
        ) {

            const record =
                this.windows.get(
                    appId
                );


            if (
                !record
            ) {

                return false;

            }


            record.minimized =
                true;


            record.active =
                false;


            record.element
                ?.classList
                .add(
                    "minimized"
                );


            record.app
                ?.minimize?.();


            this.saveGeometry(
                record
            );


            HD.emit(
                "window:minimized",
                {
                    window:
                        record
                }
            );


            return true;

        },


        restore(
            appId
        ) {

            const record =
                this.windows.get(
                    appId
                );


            if (
                !record
            ) {

                return false;

            }


            record.minimized =
                false;


            record.element
                ?.classList
                .remove(
                    "minimized"
                );


            record.app
                ?.restore?.();


            this.restoreGeometry(
                record
            );


            this.activate(
                record
            );


            HD.emit(
                "window:restored",
                {
                    window:
                        record
                }
            );


            return true;

        },


        maximize(
            appId
        ) {

            const record =
                this.windows.get(
                    appId
                );


            if (
                !record
            ) {

                return false;

            }


            if (
                !record.maximized
            ) {

                record.restoreX =
                    record.x;


                record.restoreY =
                    record.y;


                record.restoreWidth =
                    record.width;


                record.restoreHeight =
                    record.height;

            }


            record.maximized =
                true;


            record.minimized =
                false;


            record.app
                ?.maximize?.();


            this.applyGeometry(
                record
            );


            this.activate(
                record
            );


            HD.emit(
                "window:maximized",
                {
                    window:
                        record
                }
            );


            return true;

        },


        close(
            appId
        ) {

            const record =
                this.windows.get(
                    appId
                );


            if (
                !record
            ) {

                return false;

            }


            /*
             * Direktes Schließen.
             * EIN Klick reicht.
             */

            record.closed =
                true;


            record.active =
                false;


            record.element
                ?.classList
                .add(
                    "closing"
                );


            this.saveGeometry(
                record
            );


            record.app
                ?.close?.();


            HD.emit(
                "window:closed",
                {
                    window:
                        record
                }
            );


            /*
             * Kein künstliches langes Warten.
             * Das Fenster wird unmittelbar entfernt.
             */

            if (
                record.element
            ) {

                record.element.remove();

            }


            this.windows.delete(
                appId
            );


            if (
                this.activeWindow ===
                record
            ) {

                this.activeWindow =
                    null;

            }


            return true;

        },


        open(
            appId
        ) {

            const app =
                typeof appId ===
                "string"
                    ? HD.appRuntime
                        .getOrCreate(
                            appId
                        )
                    : appId;


            if (
                !app
            ) {

                return null;

            }


            let record =
                this.windows.get(
                    app.id
                );


            if (
                !record
            ) {

                record =
                    this.create(
                        app
                    );

            }


            if (
                !record
            ) {

                return null;

            }


            record.closed =
                false;


            record.minimized =
                false;


            record.element
                ?.classList
                .remove(
                    "closing"
                );


            record.element
                ?.classList
                .remove(
                    "minimized"
                );


            record.element.style.display =
                "flex";


            app.open?.();


            this.restoreGeometry(
                record
            );


            this.activate(
                record
            );


            HD.emit(
                "window:opened",
                {
                    window:
                        record,

                    app
                }
            );


            return record;

        },


        closeAll() {

            Array.from(
                this.windows.keys()
            )
            .forEach(
                appId => {

                    this.close(
                        appId
                    );

                }
            );


            return true;

        },


        saveGeometry(
            record
        ) {

            if (
                !record
            ) {

                return false;

            }


            HD.storage.set(
                "window:" +
                record.appId,
                {

                    left:
                        record.x,

                    top:
                        record.y,

                    width:
                        record.width,

                    height:
                        record.height,

                    maximized:
                        record.maximized

                }
            );


            return true;

        },


        restoreGeometry(
            record
        ) {

            if (
                !record
            ) {

                return;

            }


            const saved =
                HD.storage.get(
                    "window:" +
                    record.appId,
                    null
                );


            if (
                saved &&
                typeof saved ===
                "object"
            ) {

                if (
                    Number.isFinite(
                        Number(
                            saved.left
                        )
                    )
                ) {

                    record.x =
                        Number(
                            saved.left
                        );

                }


                if (
                    Number.isFinite(
                        Number(
                            saved.top
                        )
                    )
                ) {

                    record.y =
                        Number(
                            saved.top
                        );

                }


                if (
                    Number.isFinite(
                        Number(
                            saved.width
                        )
                    )
                ) {

                    record.width =
                        Number(
                            saved.width
                        );

                }


                if (
                    Number.isFinite(
                        Number(
                            saved.height
                        )
                    )
                ) {

                    record.height =
                        Number(
                            saved.height
                        );

                }


                record.maximized =
                    !!saved.maximized;

            }


            if (
                window.innerWidth <=
                700
            ) {

                record.width =
                    Math.min(
                        record.width,
                        window.innerWidth -
                        18
                    );


                record.height =
                    Math.min(
                        record.height,
                        window.innerHeight -
                        110
                    );


                record.x =
                    9;


                record.y =
                    54;

            }


            this.keepInsideViewport(
                record
            );


            this.applyGeometry(
                record
            );

        }

    };


    HD.runtime.register(
        "window-manager",
        HD.windowManager
    );

</script>


<!-- =========================================================
     ROUTER
     ========================================================= -->

<script>

    HD.router = {

        version:
            "22.0.0",

        routes:
            new Map(),

        current:
            null,

        history:
            [],


        register(
            path,
            handler,
            options = {}
        ) {

            if (
                !path ||
                typeof handler !==
                "function"
            ) {

                return false;

            }


            this.routes.set(
                path,
                {
                    path,
                    handler,
                    options
                }
            );


            HD.emit(
                "router:registered",
                {
                    path
                }
            );


            return true;

        },


        has(
            path
        ) {

            return this.routes.has(
                path
            );

        },


        get(
            path
        ) {

            return this.routes.get(
                path
            );

        },


        navigate(
            path,
            params = {},
            options = {}
        ) {

            const route =
                this.routes.get(
                    path
                );


            if (
                !route
            ) {

                HD.emit(
                    "router:not-found",
                    {
                        path,
                        params
                    }
                );


                return false;

            }


            if (
                this.current &&
                !options.replace
            ) {

                this.history.push(
                    this.current
                );

            }


            this.current = {

                path,

                params,

                timestamp:
                    Date.now()

            };


            try {

                route.handler(
                    params,
                    this.current
                );

            }

            catch (
                error
            ) {

                HD.errors.report(
                    error,
                    "Router:" +
                    path
                );


                return false;

            }


            HD.emit(
                "router:navigate",
                {
                    path,
                    params,
                    route:
                        this.current
                }
            );


            return true;

        },


        back() {

            const previous =
                this.history.pop();


            if (
                !previous
            ) {

                return false;

            }


            return this.navigate(
                previous.path,
                previous.params,
                {
                    replace:
                        true
                }
            );

        },


        clearHistory() {

            this.history =
                [];


            return true;

        }

    };


    HD.runtime.register(
        "router",
        HD.router
    );

</script>


<!-- =========================================================
     NOTIFICATION SYSTEM
     ========================================================= -->

<script>

    HD.notifications = {

        items:
            [],

        max:
            100,


        push(
            notification = {}
        ) {

            const item = {

                id:
                    HD.uid(
                        "notification"
                    ),

                title:
                    notification.title ||
                    "HalDo",

                message:
                    notification.message ||
                    "",

                type:
                    notification.type ||
                    "info",

                timestamp:
                    Date.now(),

                read:
                    false,

                data:
                    notification.data ||
                    null

            };


            this.items.unshift(
                item
            );


            if (
                this.items.length >
                this.max
            ) {

                this.items =
                    this.items.slice(
                        0,
                        this.max
                    );

            }


            HD.emit(
                "notification:new",
                item
            );


            return item;

        },


        read(
            id
        ) {

            const item =
                this.items.find(
                    entry =>
                        entry.id ===
                        id
                );


            if (
                !item
            ) {

                return false;

            }


            item.read =
                true;


            HD.emit(
                "notification:read",
                item
            );


            return true;

        },


        remove(
            id
        ) {

            const oldLength =
                this.items.length;


            this.items =
                this.items.filter(
                    item =>
                        item.id !==
                        id
                );


            return (
                this.items.length !==
                oldLength
            );

        },


        clear() {

            this.items =
                [];


            HD.emit(
                "notifications:cleared"
            );


            return true;

        },


        unreadCount() {

            return this.items.filter(
                item =>
                    !item.read
            ).length;

        },


        all() {

            return [
                ...this.items
            ];

        }

    };


    HD.runtime.register(
        "notifications",
        HD.notifications
    );

</script>

     NETWORK SYSTEM
     ========================================================= -->

<script>

    HD.network = {

        online:
            navigator.onLine,

        initialized:
            false,


        updateState(
            online
        ) {

            this.online =
                !!online;


            HD.online =
                this.online;


            HD.emit(
                this.online
                    ? "network:online"
                    : "network:offline",
                {
                    online:
                        this.online
                }
            );

        },


        initialize() {

            if (
                this.initialized
            ) {

                return true;

            }


            window.addEventListener(
                "online",
                () => {

                    this.updateState(
                        true
                    );

                }
            );


            window.addEventListener(
                "offline",
                () => {

                    this.updateState(
                        false
                    );

                }
            );


            this.updateState(
                navigator.onLine
            );


            this.initialized =
                true;


            HD.emit(
                "network:initialized"
            );


            return true;

        }

    };


    HD.network.initialize();

            let parsed =

                }

                catch (_) {

                        {};

            this.memory.set(

        }


        const record =
            this.instances.get(
                app.id
            );


        if (!record) {

            return false;

        }


        if (
            HD.router &&
            typeof HD.router.navigate ===
                "function"
        ) {

            try {

                HD.router.navigate(
                    "/app/" +
                    encodeURIComponent(
                        app.id
                    ) +
                    "/" +
                    encodeURIComponent(
                        route
                    )
                );

            }

            catch (_) {}

        }


        HD.appState.update(
            app.id,
            {
                route:
                    route
            }
        );


        HD.emit(
            "app:navigate",
            {
                app:
                    app,

                route:
                    route
            }
        );


        return true;

    };


/* =========================================================
   ACTION BUTTON
   ========================================================= */

HD.appUI.action =
    function(
        app,
        action,
        data = {}
    ) {

        if (
            !app ||
            !action
        ) {

            return false;

        }


        HD.appEvents.emit(
            app.id,
            "action",
            {
                action:
                    action,

                data:
                    data,

                app:
                    app
            }
        );


        return true;

    };


/* =========================================================
   AI BRIDGE
   ========================================================= */

HD.appUI.askAI =
    async function(
        app,
        prompt,
        context = {}
    ) {

        if (
            !prompt
        ) {

            return "";

        }


        HD.emit(
            "app:ai-request",
            {
                app:
                    app,

                prompt:
                    prompt,

                context:
                    context
            }
        );


        if (
            HD.ai &&
            typeof HD.ai.respond ===
                "function"
        ) {

            try {

                return await HD.ai.respond(
                    prompt,
                    {
                        app:
                            app,

                        context:
                            context
                    }
                );

            }

            catch (error) {

                console.error(
                    "HalDo AI App-Anfrage:",
                    error
                );

            }

        }


        if (
            HD.aiCore &&
            typeof HD.aiCore.respond ===
                "function"
        ) {

            try {

                return await HD.aiCore.respond(
                    prompt,
                    {
                        app:
                            app,

                        context:
                            context
                    }
                );

            }

            catch (error) {

                console.error(
                    "HalDo AI Core:",
                    error
                );

            }

        }


        return (
            "HalDo AI ist für diese Anfrage momentan " +
            "nicht vollständig verbunden."
        );

    };


/* =========================================================
   VOICE BRIDGE
   ========================================================= */

HD.appUI.speak =
    async function(
        text,
        options = {}
    ) {

        if (
            !text
        ) {

            return false;

        }


        HD.emit(
            "app:voice-request",
            {
                text:
                    text,

                options:
                    options
            }
        );


        if (
            HD.voice &&
            typeof HD.voice.speak ===
                "function"
        ) {

            try {

                await HD.voice.speak(
                    text,
                    options
                );

                return true;

            }

            catch (_) {}

        }


        if (
            HD.voiceManager &&
            typeof HD.voiceManager.speak ===
                "function"
        ) {

            try {

                await HD.voiceManager.speak(
                    text,
                    options
                );

                return true;

            }

            catch (_) {}

        }


        if (
            "speechSynthesis" in
            window
        ) {

            try {

                window.speechSynthesis.cancel();


                const utterance =
                    new SpeechSynthesisUtterance(
                        String(text)
                    );


                utterance.lang =
                    options.lang ||
                    "de-DE";


                utterance.rate =
                    Number.isFinite(
                        options.rate
                    )
                        ? options.rate
                        : 1;


                utterance.pitch =
                    Number.isFinite(
                        options.pitch
                    )
                        ? options.pitch
                        : 1;


                window.speechSynthesis.speak(
                    utterance
                );


                return true;

            }

            catch (_) {}

        }


        return false;

    };


/* =========================================================
   BUILD UNIVERSAL APP
   ========================================================= */

HD.appUI.build =
    function(
        app,
        container,
        configuration = {}
    ) {

        if (
            !app ||
            !container
        ) {

            return null;

        }


        const root =
            this.createRoot(
                app,
                container
            );


        this.createHeader(
            app,
            root
        );


        this.createNavigation(
            app,
            root,
            configuration.navigation ||
            []
        );


        const content =
            this.createContent(
                app,
                root
            );


        this.createStatus(
            app,
            root
        );


        if (
            typeof configuration.render ===
                "function"
        ) {

            try {

                configuration.render(
                    {
                        app:
                            app,

                        root:
                            root,

                        content:
                            content,

                        ui:
                            this
                    }
                );

            }

            catch (error) {

                this.renderError(
                    content,
                    error
                );

            }

        }

        else {

            this.renderDefault(
                app,
                content
            );

        }


        HD.emit(
            "app-ui:built",
            {
                app:
                    app,

                root:
                    root
            }
        );


        return root;

    };


/* =========================================================
   DEFAULT APP VIEW
   ========================================================= */

HD.appUI.renderDefault =
    function(
        app,
        content
    ) {

        content.innerHTML = "";


        const panel =
            document.createElement(
                "div"
            );


        panel.className =
            "haldo-app-panel";


        const heading =
            document.createElement(
                "h2"
            );


        heading.textContent =
            app.name ||
            app.id;


        const description =
            document.createElement(
                "p"
            );


        description.textContent =
            app.manifest?.description ||
            "Diese HalDo App ist aktiv.";


        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "haldo-app-actions";


        const aiButton =
            document.createElement(
                "button"
            );


        aiButton.type =
            "button";


        aiButton.textContent =
            "✦ HalDo AI fragen";


        aiButton.addEventListener(
            "click",
            async () => {

                const response =
                    await this.askAI(
                        app,
                        "Erkläre mir die Funktionen dieser App.",
                        {
                            appId:
                                app.id
                        }
                    );


                this.showMessage(
                    content,
                    response
                );

            }
        );


        const saveButton =
            document.createElement(
                "button"
            );


        saveButton.type =
            "button";


        saveButton.textContent =
            "💾 Speichern";


        saveButton.addEventListener(
            "click",
            () => {

                if (
                    app.save
                ) {

                    app.save();

                }


                this.showMessage(
                    content,
                    "Der App-Zustand wurde gespeichert."
                );

            }
        );


        actions.appendChild(
            aiButton
        );

        actions.appendChild(
            saveButton
        );


        panel.appendChild(
            heading
        );

        panel.appendChild(
            description
        );

        panel.appendChild(
            actions
        );


        content.appendChild(
            panel
        );

    };


/* =========================================================
   MESSAGE
   ========================================================= */

HD.appUI.showMessage =
    function(
        container,
        message
    ) {

        if (
            !container
        ) {

            return;

        }


        const box =
            document.createElement(
                "div"
            );


        box.className =
            "haldo-app-message";


        box.textContent =
            String(
                message ||
                ""
            );


        container.appendChild(
            box
        );


        setTimeout(
            () => {

                box.classList.add(
                    "visible"
                );

            },
            20
        );

    };


/* =========================================================
   ERROR VIEW
   ========================================================= */

HD.appUI.renderError =
    function(
        container,
        error
    ) {

        if (
            !container
        ) {

            return;

        }


        container.innerHTML = "";


        const panel =
            document.createElement(
                "div"
            );


        panel.className =
            "haldo-app-error"
        ;


        panel.innerHTML =
            "<div class=\"error-icon\">!</div>" +

            "<h2>App-Fehler</h2>" +

            "<p>" +
            this.escape(
                error?.message ||
                "Unbekannter Fehler."
            ) +
            "</p>";


        container.appendChild(
            panel
        );


        HD.emit(
            "app-ui:error",
            {
                error:
                    error
            }
        );

    };


/* =========================================================
   CLOSE APP UI
   ========================================================= */

HD.appUI.destroy =
    function(appId) {

        const record =
            this.instances.get(
                appId
            );


        if (!record) {

            return false;

        }


        if (
            record.root &&
            record.root.parentNode
        ) {

            record.root.parentNode
                .removeChild(
                    record.root
                );

        }


        this.instances.delete(
            appId
        );


        return true;

    };


/* =========================================================
   SYSTEM EVENTS
   ========================================================= */

HD.on(
    "app:closed",
    data => {

        const app =
            data?.app;

        if (
            app &&
            app.id
        ) {

            HD.appUI.destroy(
                app.id
            );

        }

    }
);


/* =========================================================
   RUNTIME REGISTRATION
   ========================================================= */

if (
    HD.runtime &&
    typeof HD.runtime.register ===
        "function"
) {

    HD.runtime.register(
        "app-ui",
        HD.appUI
    );

}


if (
    HD.services &&
    typeof HD.services.register ===
        "function"
) {

    HD.services.register(
        "app-ui",
        HD.appUI
    );

}


HD.emit(
    "app-ui:initialized",
    {
        ui:
            HD.appUI
    }
);

</script>

                data =
                    HD6.storage.get(
                        "haldo-ai-chat-" +
                        chatId
                    );

            }


            if (
                !data &&
                HD6.storageManager &&
                typeof HD6.storageManager.get ===
                    "function"
            ) {

                data =
                    HD6.storageManager.get(
                        "haldo-ai-chat-" +
                        chatId
                    );

            }


            if (!data) {

                const raw =
                    localStorage.getItem(
                        "haldo-ai-chat-" +
                        chatId
                    );


                if (raw) {

                    data =
                        JSON.parse(
                            raw
                        );

                }

            }

        }

        catch (error) {

            console.warn(
                "HalDo AI Chat Laden:",
                error
            );

        }


        if (
            data &&
            typeof data ===
                "object"
        ) {

            const state =
                this.getState(
                    chatId
                );


            Object.assign(
                state,
                data
            );


            if (
                !Array.isArray(
                    state.messages
                )
            ) {

                state.messages =
                    [];

            }


            return state;

        }


        return this.getState(
            chatId
        );

    };
