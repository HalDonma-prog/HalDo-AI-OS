<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HalDo AI OS 24 — Cosmic World</title>
    <meta name="theme-color" content="#0a0a1a" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0a0a1a;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            color: #e0e0ff;
            touch-action: manipulation;
        }
        #cosmic {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* BOOT */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.5s ease;
            padding: 20px;
        }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo {
            font-size: clamp(3rem, 12vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 60px rgba(123, 47, 252, 0.5));
                transform: scale(1.05);
            }
        }
        #boot-status {
            margin-top: 16px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* OVERLAY */
        #ai-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
        }
        #ai-overlay.active {
            display: flex;
        }
        #ai-window {
            background: rgba(16, 16, 40, 0.95);
            border-radius: 20px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #ai-window .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 10px;
        }
        #ai-window .header h2 {
            font-size: 1.2rem;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #ai-window .header .close-btn {
            background: none;
            border: none;
            color: #ff6666;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 8px;
        }
        #ai-chat-box {
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        #ai-chat-box .msg-user {
            color: #00d4ff;
            margin: 4px 0;
        }
        #ai-chat-box .msg-ai {
            color: #e0e0ff;
            margin: 4px 0;
            padding-left: 8px;
            border-left: 2px solid #7b2ffc;
        }
        #ai-input-row {
            display: flex;
            gap: 8px;
        }
        #ai-input-row input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
        }
        #ai-input-row button {
            padding: 10px 18px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        #ai-input-row button:active {
            transform: scale(0.95);
        }

        /* DOCK */
        #dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: nowrap;
            max-width: 98vw;
            overflow-x: auto;
        }
        .dock-item {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            border: none;
            color: #fff;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .dock-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        /* NOTIFICATION */
        #notification {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(16, 16, 40, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 24px;
            max-width: 90%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            font-size: 0.9rem;
            display: none;
            border-left: 4px solid #00d4ff;
        }
        #notification.show {
            display: block;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* TOPBAR */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(10, 10, 30, 0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.8rem;
        }
        #topbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #topbar-left .logo-text {
            font-weight: 700;
            color: #00d4ff;
            font-size: 0.9rem;
        }
        #topbar-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        #clock-display {
            color: #8899bb;
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            .dock-item {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            #dock {
                padding: 6px 12px;
                gap: 6px;
            }
            #ai-window {
                padding: 16px;
                max-width: 100%;
                margin: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- BOOT -->
    <div id="boot">
        <div id="boot-logo">⟡ HalDo</div>
        <div class="boot-spinner"></div>
        <div id="boot-status">⟡ Cosmic World wird geladen ...</div>
    </div>

    <!-- COSMIC CANVAS -->
    <canvas id="cosmic"></canvas>

    <!-- TOPBAR -->
    <div id="topbar">
        <div id="topbar-left">
            <span class="logo-text">⟡ HalDo</span>
            <span id="clock-display">--:--</span>
        </div>
        <div id="topbar-right">
            <button class="top-btn" id="btn-about">ℹ️</button>
        </div>
    </div>

    <!-- AI OVERLAY (in der Sonne) -->
    <div id="ai-overlay">
        <div id="ai-window">
            <div class="header">
                <h2>☀️ HalDo AI — Sonnen-Geist</h2>
                <button class="close-btn" id="ai-close">✕</button>
            </div>
            <div id="ai-chat-box">
                <div class="msg-ai">☀️ Ich bin der Geist der Sonne – und dein HalDo AI. Frage mich alles!</div>
            </div>
            <div id="ai-input-row">
                <input type="text" id="ai-input" placeholder="Frage an HalDo ..." />
                <button id="ai-send">Senden</button>
            </div>
        </div>
    </div>

    <!-- DOCK -->
    <div id="dock">
        <button class="dock-item" data-app="ai">🤖</button>
        <button class="dock-item" data-app="mail">✉️</button>
        <button class="dock-item" data-app="chat">💬</button>
        <button class="dock-item" data-app="files">📁</button>
        <button class="dock-item" data-app="settings">⚙️</button>
        <button class="dock-item" data-app="cosmic">🌌</button>
        <button class="dock-item" data-app="notes">📝</button>
        <button class="dock-item" data-app="terminal">⌨️</button>
    </div>

    <!-- NOTIFICATION -->
    <div id="notification"></div>

    <script>
        // ================================================================
        //  HALDO AI OS 24 — COSMIC WORLD
        //  Teil 1: Sonne mit Logo, 12 Planeten (Stunde/Minute/Sekunde),
        //  Mond, Erde, Sterne, Galaxien, AI in der Sonne
        // ================================================================

        (function() {
            'use strict';

            // ===== DOM =====
            const canvas = document.getElementById('cosmic');
            const ctx = canvas.getContext('2d');
            const boot = document.getElementById('boot');
            const bootStatus = document.getElementById('boot-status');
            const overlay = document.getElementById('ai-overlay');
            const chatBox = document.getElementById('ai-chat-box');
            const aiInput = document.getElementById('ai-input');
            const aiSend = document.getElementById('ai-send');
            const aiClose = document.getElementById('ai-close');
            const notification = document.getElementById('notification');

            let W, H;

            // ===== COSMIC VARIABLEN =====
            let stars = [];
            let galaxies = [];
            let planets = [];
            let sun = null;
            let moon = null;
            let earth = null;
            let cosmicRunning = false;

            // ===== UHRZEIT =====
            let seconds = 0;
            let minutes = 0;
            let hours = 0;

            // ===== PLANETEN DATA =====
            const PLANET_DATA = [
                { name: 'Merkur', radius: 8, color: '#aaaaaa', orbit: 90, speed: 0.03 },
                { name: 'Venus', radius: 12, color: '#ffaa44', orbit: 130, speed: 0.022 },
                { name: 'Erde', radius: 14, color: '#4488ff', orbit: 180, speed: 0.015 },
                { name: 'Mars', radius: 10, color: '#ff6644', orbit: 230, speed: 0.012 },
                { name: 'Jupiter', radius: 26, color: '#ddaa77', orbit: 290, speed: 0.008 },
                { name: 'Saturn', radius: 20, color: '#ddcc88', orbit: 360, speed: 0.006 },
                { name: 'Uranus', radius: 16, color: '#88ddff', orbit: 430, speed: 0.0045 },
                { name: 'Neptun', radius: 15, color: '#4466ff', orbit: 500, speed: 0.0035 },
                { name: 'Pluto', radius: 6, color: '#ccbb99', orbit: 560, speed: 0.0025 },
                { name: 'HalDo-1', radius: 11, color: '#ff88dd', orbit: 620, speed: 0.0018 },
                { name: 'HalDo-2', radius: 13, color: '#88ffaa', orbit: 680, speed: 0.0012 },
                { name: 'HalDo-3', radius: 9, color: '#ffaa88', orbit: 740, speed: 0.0008 }
            ];

            // ===== RESIZE =====
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // ===== NOTIFICATION =====
            function showNotification(text) {
                notification.textContent = text;
                notification.classList.add('show');
                clearTimeout(notification._timeout);
                notification._timeout = setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }

            // ================================================================
            //  INIT COSMIC
            // ================================================================
            function initCosmic() {
                // Sterne (3000)
                stars = [];
                for (let i = 0; i < 3000; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 2.5 + 0.3,
                        speed: Math.random() * 0.03 + 0.005,
                        brightness: Math.random() * 0.8 + 0.2,
                        phase: Math.random() * Math.PI * 2,
                        color: `hsl(${Math.random() * 60 + 200}, 80%, ${60 + Math.random() * 40}%)`
                    });
                }

                // Galaxien (10)
                galaxies = [];
                for (let g = 0; g < 10; g++) {
                    const gx = Math.random() * W;
                    const gy = Math.random() * H;
                    const gSize = 50 + Math.random() * 180;
                    const angle = Math.random() * Math.PI * 2;
                    const points = [];
                    for (let i = 0; i < 500; i++) {
                        const t = Math.random() * Math.PI * 4;
                        const r = Math.random() * gSize * 0.6;
                        const x = gx + Math.cos(t + angle) * r * (1 + t * 0.08);
                        const y = gy + Math.sin(t + angle) * r * (1 + t * 0.08);
                        points.push({
                            x,
                            y,
                            r: Math.random() * 2 + 0.5,
                            brightness: Math.random() * 0.5 + 0.2,
                            hue: 200 + Math.random() * 80
                        });
                    }
                    galaxies.push({
                        x: gx,
                        y: gy,
                        size: gSize,
                        angle: angle,
                        points: points,
                        rotationSpeed: (Math.random() - 0.5) * 0.002
                    });
                }

                // Sonne (mit Logo)
                const centerX = W / 2;
                const centerY = H / 2;
                sun = {
                    x: centerX,
                    y: centerY,
                    radius: 55,
                    glow: 250,
                    color: '#ffdd44',
                    pulseSpeed: 0.008,
                    pulsePhase: 0,
                    flares: 16,
                    logo: '⟡ HalDo' // Das Logo in der Sonne
                };

                // Planeten (12)
                planets = [];
                PLANET_DATA.forEach((p, index) => {
                    // Bestimme Rolle: Stunde, Minute, Sekunde
                    let role = 'normal';
                    if (index === 0) role = 'second'; // Merkur = Sekunde
                    if (index === 1) role = 'minute'; // Venus = Minute
                    if (index === 2) role = 'hour'; // Erde = Stunde

                    planets.push({
                        name: p.name,
                        radius: p.radius,
                        color: p.color,
                        orbit: p.orbit,
                        speed: p.speed,
                        angle: Math.random() * Math.PI * 2,
                        centerX: centerX,
                        centerY: centerY,
                        glow: p.radius * 2.5,
                        ring: p.name === 'Saturn' ? true : false,
                        role: role,
                        trail: []
                    });
                });

                // Erde (als separater Planet für bessere Sichtbarkeit)
                earth = planets.find(p => p.name === 'Erde');

                // Mond (umkreist die Erde)
                moon = {
                    name: 'Mond',
                    radius: 6,
                    color: '#cccccc',
                    orbit: 30,
                    speed: 0.08,
                    angle: Math.random() * Math.PI * 2,
                    glow: 10
                };

                cosmicRunning = true;
                animateCosmic();
            }

            // ================================================================
            //  ANIMATE COSMIC
            // ================================================================
            function animateCosmic() {
                if (!cosmicRunning) return;

                // Uhrzeit aktualisieren
                const now = new Date();
                seconds = now.getSeconds();
                minutes = now.getMinutes();
                hours = now.getHours() % 12;

                // Sonnen-Puls
                if (sun) sun.pulsePhase += sun.pulseSpeed;

                // Planeten-Rotation (Stunde/Minute/Sekunde)
                planets.forEach(p => {
                    // Normale Rotation
                    p.angle += p.speed;

                    // Spezielle Rotation für Uhrzeit
                    if (p.role === 'second') {
                        p.angle = (seconds / 60) * Math.PI * 2;
                    } else if (p.role === 'minute') {
                        p.angle = (minutes / 60) * Math.PI * 2 + (seconds / 60) * (Math.PI * 2 / 60);
                    } else if (p.role === 'hour') {
                        p.angle = (hours / 12) * Math.PI * 2 + (minutes / 60) * (Math.PI * 2 / 12);
                    }

                    // Trail (für bewegte Planeten)
                    if (p.role !== 'second' && p.role !== 'minute' && p.role !== 'hour') {
                        if (!p.trail) p.trail = [];
                        const px = p.centerX + Math.cos(p.angle) * p.orbit;
                        const py = p.centerY + Math.sin(p.angle) * p.orbit;
                        p.trail.push({ x: px, y: py, life: 1 });
                        if (p.trail.length > 30) p.trail.shift();
                        p.trail.forEach(t => t.life *= 0.98);
                    }
                });

                // Mond um Erde
                if (earth && moon) {
                    const ex = earth.centerX + Math.cos(earth.angle) * earth.orbit;
                    const ey = earth.centerY + Math.sin(earth.angle) * earth.orbit;
                    moon.angle += moon.speed;
                    moon.x = ex + Math.cos(moon.angle) * moon.orbit;
                    moon.y = ey + Math.sin(moon.angle) * moon.orbit;
                }

                drawCosmic();
                requestAnimationFrame(animateCosmic);
            }

            // ================================================================
            //  DRAW COSMIC
            // ================================================================
            function drawCosmic() {
                ctx.clearRect(0, 0, W, H);

                // === HINTERGRUND (Himmelsfarben) ===
                const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.9);
                const time = Date.now() / 10000;
                const hue1 = 220 + 20 * Math.sin(time);
                const hue2 = 240 + 30 * Math.sin(time * 0.7 + 1);
                bgGrad.addColorStop(0, `hsl(${hue1}, 70%, 12%)`);
                bgGrad.addColorStop(0.5, `hsl(${hue2}, 60%, 8%)`);
                bgGrad.addColorStop(1, '#000005');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                // === GALAXIEN ===
                galaxies.forEach(g => {
                    g.angle += g.rotationSpeed;
                    g.points.forEach(p => {
                        const rotX = p.x - g.x;
                        const rotY = p.y - g.y;
                        const cosA = Math.cos(g.angle);
                        const sinA = Math.sin(g.angle);
                        const rx = g.x + rotX * cosA - rotY * sinA;
                        const ry = g.y + rotX * sinA + rotY * cosA;
                        ctx.fillStyle = `hsla(${p.hue}, 70%, 60%, ${p.brightness * 0.2})`;
                        ctx.beginPath();
                        ctx.arc(rx, ry, p.r, 0, Math.PI * 2);
                        ctx.fill();
                    });
                });

                // === PLANETEN-TRAILS ===
                planets.forEach(p => {
                    if (p.trail) {
                        p.trail.forEach(t => {
                            ctx.fillStyle = `rgba(255,255,255,${t.life * 0.05})`;
                            ctx.beginPath();
                            ctx.arc(t.x, t.y, 1.5, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    }
                });

                // === SONNE (mit Logo) ===
                if (sun) {
                    const pulse = 1 + 0.06 * Math.sin(sun.pulsePhase);
                    const radius = sun.radius * pulse;

                    // Glow
                    for (let i = 10; i > 0; i--) {
                        const grad = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * i * 0.15);
                        const alpha = 0.06 / i;
                        grad.addColorStop(0, `rgba(255, 220, 68, ${alpha})`);
                        grad.addColorStop(1, 'rgba(255, 220, 68, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(sun.x, sun.y, sun.glow * i * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Sonnenkorpus
                    const sunGrad = ctx.createRadialGradient(
                        sun.x - radius * 0.3, sun.y - radius * 0.3, 0,
                        sun.x, sun.y, radius
                    );
                    sunGrad.addColorStop(0, '#ffeeaa');
                    sunGrad.addColorStop(0.25, '#ffdd44');
                    sunGrad.addColorStop(0.5, '#ffaa00');
                    sunGrad.addColorStop(0.8, '#ff6600');
                    sunGrad.addColorStop(1, '#ff3300');
                    ctx.fillStyle = sunGrad;
                    ctx.shadowColor = '#ffdd44';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // === HALDO LOGO IN DER SONNE ===
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = `bold ${radius * 0.6}px system-ui, sans-serif`;
                    ctx.shadowColor = 'rgba(255,255,255,0.5)';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('⟡', sun.x, sun.y - radius * 0.05);
                    ctx.shadowBlur = 0;

                    // Kleiner Text
                    ctx.font = `${radius * 0.15}px system-ui, sans-serif`;
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.fillText('HalDo', sun.x, sun.y + radius * 0.45);

                    // Sonnenstrahlen
                    for (let i = 0; i < sun.flares; i++) {
                        const angle = i * (Math.PI / (sun.flares / 2)) + sun.pulsePhase * 0.3;
                        const len = radius * (1.5 + 0.5 * Math.sin(sun.pulsePhase * 0.7 + i * 0.5));
                        ctx.strokeStyle = `rgba(255, 220, 68, ${0.05 + 0.04 * Math.sin(sun.pulsePhase + i)})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(
                            sun.x + Math.cos(angle) * radius * 0.7,
                            sun.y + Math.sin(angle) * radius * 0.7
                        );
                        ctx.lineTo(
                            sun.x + Math.cos(angle) * len,
                            sun.y + Math.sin(angle) * len
                        );
                        ctx.stroke();
                    }

                    // Sonnenflecken
                    for (let i = 0; i < 8; i++) {
                        const spotAngle = i * 1.1 + sun.pulsePhase * 0.4;
                        const spotR = radius * (0.2 + 0.15 * Math.sin(sun.pulsePhase * 0.6 + i));
                        const spotX = sun.x + Math.cos(spotAngle) * radius * 0.45;
                        const spotY = sun.y + Math.sin(spotAngle) * radius * 0.45;
                        ctx.fillStyle = `rgba(180, 80, 20, ${0.15 + 0.1 * Math.sin(sun.pulsePhase + i)})`;
                        ctx.beginPath();
                        ctx.arc(spotX, spotY, spotR, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // === PLANETEN ===
                planets.forEach(p => {
                    const px = p.centerX + Math.cos(p.angle) * p.orbit;
                    const py = p.centerY + Math.sin(p.angle) * p.orbit;

                    // Orbit
                    ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 6]);
                    ctx.beginPath();
                    ctx.arc(p.centerX, p.centerY, p.orbit, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Glow
                    const glow = ctx.createRadialGradient(px, py, 0, px, py, p.glow);
                    glow.addColorStop(0, p.color + '30');
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(px, py, p.glow, 0, Math.PI * 2);
                    ctx.fill();

                    // Planet
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(px, py, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Saturn Ring
                    if (p.ring) {
                        ctx.strokeStyle = 'rgba(200, 180, 150, 0.3)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.ellipse(px, py, p.radius * 1.8, p.radius * 0.5, 0.3, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.strokeStyle = 'rgba(200, 180, 150, 0.15)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.ellipse(px, py, p.radius * 2.2, p.radius * 0.7, -0.2, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Name
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '8px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(p.name, px, py + p.radius + 6);

                    // Rolle anzeigen (Stunde/Minute/Sekunde)
                    if (p.role === 'second') {
                        ctx.fillStyle = 'rgba(255,200,100,0.3)';
                        ctx.font = '6px sans-serif';
                        ctx.fillText('⏱ Sekunde', px, py + p.radius + 20);
                    } else if (p.role === 'minute') {
                        ctx.fillStyle = 'rgba(100,200,255,0.3)';
                        ctx.font = '6px sans-serif';
                        ctx.fillText('⏱ Minute', px, py + p.radius + 20);
                    } else if (p.role === 'hour') {
                        ctx.fillStyle = 'rgba(255,100,100,0.3)';
                        ctx.font = '6px sans-serif';
                        ctx.fillText('⏱ Stunde', px, py + p.radius + 20);
                    }
                });

                // === MOND ===
                if (moon && moon.x !== undefined) {
                    // Mond-Glow
                    const moonGlow = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.glow);
                    moonGlow.addColorStop(0, 'rgba(200,200,200,0.15)');
                    moonGlow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = moonGlow;
                    ctx.beginPath();
                    ctx.arc(moon.x, moon.y, moon.glow, 0, Math.PI * 2);
                    ctx.fill();

                    // Mond
                    ctx.shadowColor = '#cccccc';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#cccccc';
                    ctx.beginPath();
                    ctx.arc(moon.x, moon.y, moon.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Mond-Krater
                    ctx.fillStyle = 'rgba(150,150,150,0.3)';
                    ctx.beginPath();
                    ctx.arc(moon.x - 2, moon.y - 2, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(moon.x + 3, moon.y + 1, 1, 0, Math.PI * 2);
                    ctx.fill();

                    // Mond-Name
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '6px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText('🌙 Mond', moon.x, moon.y + moon.radius + 4);
                }

                // === STERNE ===
                const time2 = Date.now() / 5000;
                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > H) { s.y = 0;
                        s.x = Math.random() * W; }
                    const bright = s.brightness * (0.6 + 0.4 * Math.sin(time2 * 2 + s.phase));
                    ctx.globalAlpha = bright;
                    ctx.fillStyle = s.color;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                // === UHRZEIT ANZEIGE ===
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.font = '12px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                const timeStr =
                    `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
                ctx.fillText(`🕐 ${timeStr}`, 16, H - 80);

                // Planeten-Rollen-Legende
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.font = '8px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText('⏱ Sekunde (Merkur) · ⏱ Minute (Venus) · ⏱ Stunde (Erde)', 16, H - 60);
            }

            function getAIResponse(input) {
                const lower = input.toLowerCase().trim();

                // Direkte Matches
                for (const [key, response] of Object.entries(KNOWLEDGE_BASE)) {
                    if (lower.includes(key)) {
                        return response;
                    }
                }

                // Suche nach Schlüsselwörtern
                const keywords = [
                    'physik', 'quanten', 'relativität', 'mathematik', 'informatik', 'ki', 'biologie', 'chemie',
                    'geschichte', 'ezidi', 'êzîdî', 'kurden', 'kurd', 'judentum', 'philosophie',
                    'technik', 'zukunft', 'klima', 'kunst', 'musik', 'literatur',
                    'gesundheit', 'meditation', 'psychologie',
                    'schreiben', 'brief', 'bewerbung',
                    'hallo', 'hi', 'wer bist du', 'was kannst du'
                ];

                for (const kw of keywords) {
                    if (lower.includes(kw)) {
                        for (const [key, response] of Object.entries(KNOWLEDGE_BASE)) {
                            if (key.includes(kw) || kw.includes(key)) {
                                return response;
                            }
                        }
                    }
                }

                // Wenn nichts gefunden wurde
                return KNOWLEDGE_BASE['default'];
            }

            // ===== AI IN DER SONNE =====
            function openAI() {
                overlay.classList.add('active');
                chatBox.innerHTML = `
                    <div class="msg-ai">☀️ Hallo! Ich bin der Geist der Sonne — und dein HalDo AI. Ich habe das Wissen von tausend Büchern in mir. Frage mich alles: Wissenschaft, Geschichte, Philosophie, Kultur, Technik, Leben ...</div>
                `;
                aiInput.value = '';
                aiInput.focus();
            }

            function closeAI() {
                overlay.classList.remove('active');
            }

            function sendMessage() {
                const text = aiInput.value.trim();
                if (!text) return;

                // User-Nachricht
                const userDiv = document.createElement('div');
                userDiv.className = 'msg-user';
                userDiv.textContent = '👤 ' + text;
                chatBox.appendChild(userDiv);

                // AI-Antwort
                const response = getAIResponse(text);
                const aiDiv = document.createElement('div');
                aiDiv.className = 'msg-ai';
                aiDiv.textContent = '☀️ ' + response;
                chatBox.appendChild(aiDiv);

                aiInput.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // ===== BOOT =====
            function bootSequence() {
                const statuses = [
                    '⟡ Sonne wird erweckt ...',
                    '⟡ 12 Planeten werden positioniert ...',
                    '⟡ Mond & Erde werden ausgerichtet ...',
                    '⟡ Galaxien werden geladen ...',
                    '⟡ HalDo AI wird aktiviert ...',
                    '⟡ Cosmic World ist READY 🚀'
                ];

                let i = 0;
                const interval = setInterval(() => {
                    if (i < statuses.length) {
                        bootStatus.textContent = statuses[i];
                        i++;
                    } else {
                        clearInterval(interval);
                        boot.classList.add('hidden');
                        showNotification('🌌 Cosmic World gestartet — Klicke auf die Sonne!');
                    }
                }, 500);
            }

            // ===== INIT =====
            function init() {
                initCosmic();
                bootSequence();

                // Sonne klickbar
                canvas.addEventListener('click', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    if (sun) {
                        const dx = x - sun.x;
                        const dy = y - sun.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < sun.radius * 1.5) {
                            openAI();
                        }
                    }
                });

                // Touch (für Mobil)
                canvas.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    const rect = canvas.getBoundingClientRect();
                    const x = touch.clientX - rect.left;
                    const y = touch.clientY - rect.top;
                    if (sun) {
                        const dx = x - sun.x;
                        const dy = y - sun.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < sun.radius * 2) {
                            openAI();
                        }
                    }
                }, { passive: true });

                // AI Controls
                aiSend.addEventListener('click', sendMessage);
                aiInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });
                aiClose.addEventListener('click', closeAI);

                // Overlay bei Klick auf Hintergrund schließen
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeAI();
                });

                // Dock-Buttons
                document.querySelectorAll('.dock-item').forEach(btn => {
                    btn.addEventListener('click', () => {
                        showNotification('📱 ' + btn.dataset.app + ' — wird geöffnet (Demo)');
                    });
                });

                // About
                document.getElementById('btn-about').addEventListener('click', () => {
                    showNotification('⟡ HalDo AI OS 24 — Cosmic World\n☀️ Sonne mit Logo · 12 Planeten · Mond · Erde\n💡 Klicke auf die Sonne für HalDo AI');
                });

                // Uhr
                function updateClock() {
                    const now = new Date();
                    document.getElementById('clock-display').textContent =
                        now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                }
                updateClock();
                setInterval(updateClock, 10000);

                // Globale API
                window.HalDo = {
                    openAI,
                    closeAI,
                    sendMessage,
                    showNotification,
                    getAIResponse
                };

                console.log('⟡ HalDo AI OS 24 — Cosmic World');
                console.log('☀️ Sonne mit Logo, 12 Planeten (Stunde/Minute/Sekunde)');
                console.log('🌍 Erde, Mond, Galaxien, 3000 Sterne');
                console.log('💡 Klicke auf die Sonne für HalDo AI');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
