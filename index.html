<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#090D18"
    >

    <meta
        name="description"
        content="HalDo AI OS 18 – Professional Ultimate Foundation"
    >

    <title>
        HalDo AI OS 18
    </title>


    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>


<!-- ==================================================
     HALDO AI OS 18
     STARTUP / SUNLIGHT INTRO
     ================================================== -->

<section
    id="startup-screen"
    class="screen startup-screen"
>

    <div class="haldo-sun-container">

        <!-- Äußerer Lichtkranz -->
        <div
            class="haldo-light-orbit orbit-outer"
        ></div>


        <!-- Mittlerer Lichtkranz -->
        <div
            class="haldo-light-orbit orbit-middle"
        ></div>


        <!-- Sonnenstrahlen -->
        <div
            class="haldo-rays rays-one"
        ></div>

        <div
            class="haldo-rays rays-two"
        ></div>


        <!-- Kleine Lichtblitze -->
        <div
            class="haldo-spark spark-1"
        >✦</div>

        <div
            class="haldo-spark spark-2"
        >✦</div>

        <div
            class="haldo-spark spark-3"
        >✧</div>

        <div
            class="haldo-spark spark-4"
        >✦</div>

        <div
            class="haldo-spark spark-5"
        >✧</div>

        <div
            class="haldo-spark spark-6"
        >✦</div>


        <!-- ==================================================
             DEIN LOGO
             DAS BILD SELBST DREHT SICH NICHT
             ================================================== -->

        <div class="haldo-logo-still">

            <img
                src="assets/logo/logo.png"
                class="haldo-startup-logo"
                alt="HalDo AI OS Logo"
            >

        </div>

    </div>


    <h1>
        HalDo AI OS 18
    </h1>


    <p id="system-status">
        🟡 HalDo AI OS startet...
    </p>

</section>


<!-- ==================================================
     WELCOME SCREEN
     ================================================== -->

<section
    id="welcome-screen"
    class="screen hidden welcome-screen"
>

    <div class="haldo-welcome-logo">

        <img
            src="assets/logo/logo.png"
            class="logo"
            alt="HalDo AI OS Logo"
        >

    </div>


    <h1>

        👋 Willkommen bei

        <br>

        HalDo AI OS 18

    </h1>


    <p>
        Professional Ultimate Foundation
    </p>


    <p id="clock">
        Systemzeit wird geladen...
    </p>


    <button
        type="button"
        onclick="openMainMenu()"
    >
        Hauptmenü öffnen
    </button>

</section>


<!-- ==================================================
     MAIN MENU
     ================================================== -->

<section
    id="main-menu"
    class="hidden main-menu"
>


    <header class="header">

        <div class="menu-logo-wrapper">

            <img
                src="assets/logo/logo.png"
                class="logo small"
                alt="HalDo AI OS"
            >

        </div>


        <h1>
            HalDo AI OS 18
        </h1>


        <p>
            Professional Ultimate Foundation
        </p>

    </header>


    <main class="menu-container">


        <h2>
            Hauptmenü
        </h2>


        <div class="menu-grid">


            <button
                type="button"
                onclick="openPage('dashboard.html')"
            >
                📊 Dashboard
            </button>


            <button
                type="button"
                onclick="openPage('ai-core.html')"
            >
                AI Core
            </button>


            <button
                type="button"
                onclick="openPage('modules.html')"
            >
                Module
            </button>


            <button
                type="button"
                onclick="openPage('apps.html')"
            >
                Apps
            </button>


            <button
                type="button"
                onclick="openPage('settings.html')"
            >
                Einstellungen
            </button>


            <button
                type="button"
                onclick="openPage('status.html')"
            >
                System Status
            </button>


            <button
                type="button"
                onclick="openPage('health.html')"
            >
                Health Center
            </button>


        </div>


    </main>


</section>


<!-- ==================================================
     FOUNDATION JAVASCRIPT
     REIHENFOLGE
     ================================================== -->

<script src="js/boot.js"></script>

<script src="js/kernel.js"></script>

<script src="js/system.js"></script>

<script src="js/module-manager.js"></script>

<script src="js/app-manager.js"></script>

<script src="js/storage.js"></script>

<script src="js/system-status.js"></script>

<script src="js/system-loader.js"></script>

<script src="js/startup.js"></script>


<!-- ==================================================
     GLOBAL UI FUNCTIONS
     ================================================== -->

<script>

function openMainMenu() {

    if (
        window.HalDoStartup &&
        typeof HalDoStartup.openMainMenu === "function"
    ) {

        HalDoStartup.openMainMenu();

        return;

    }


    const welcome =
        document.getElementById(
            "welcome-screen"
        );


    const menu =
        document.getElementById(
            "main-menu"
        );


    if (welcome) {

        welcome.style.display =
            "none";

    }


    if (menu) {

        menu.classList.remove(
            "hidden"
        );

        menu.style.display =
            "block";

    }

}


function openPage(page) {

    if (!page) {

        return;

    }


    window.location.href =
        page;

}


function updateClock() {

    const clock =
        document.getElementById(
            "clock"
        );


    if (!clock) {

        return;

    }


    clock.textContent =
        "🕒 " +
        new Date().toLocaleTimeString(
            "de-DE"
        );

}


setInterval(
    updateClock,
    1000
);


updateClock();

</script>


</body>

</html>
