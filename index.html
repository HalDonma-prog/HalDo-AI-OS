<script>
"use strict";

(function () {

    const HD = window.HalDo;

    if (!HD) {
        console.error(
            "HalDo AI OS 22: Global HD object fehlt."
        );
        return;
    }


    /* =========================================================
       WINDOW SYSTEM FOUNDATION
       ========================================================= */

    HD.windowSystem =
        HD.windowSystem || {

            windows:
                new Map(),

            zIndex:
                1000,

            activeWindow:
                null,

            initialized:
                false

        };


    /* =========================================================
       WINDOW LAYER
       ========================================================= */

    function getWindowLayer() {

        return (
            document.getElementById(
                "haldo-window-layer"
            )
            ||
            document.getElementById(
                "haldo-app-desktop"
            )
            ||
            document.body
        );

    }


    /* =========================================================
       WINDOW SIZE
       ========================================================= */

    function getDefaultWindowSize(
        manifest
    ) {

        const width =
            Number(
                manifest?.windowWidth
            ) ||
            Number(
                HD.config?.defaultWindowWidth
            ) ||
            720;

        const height =
            Number(
                manifest?.windowHeight
            ) ||
            Number(
                HD.config?.defaultWindowHeight
            ) ||
            480;

        return {
            width,
            height
        };

    }


    /* =========================================================
       WINDOW POSITION
       ========================================================= */

    function getDefaultWindowPosition(
        index
    ) {

        const offset =
            (index % 8) * 28;

        return {

            left:
                Math.max(
                    20,
                    80 + offset
                ),

            top:
                Math.max(
                    60,
                    70 + offset
                )

        };

    }


    /* =========================================================
       CREATE WINDOW
       ========================================================= */

    function createWindow(
        appInstance
    ) {

        if (
            !appInstance ||
            !appInstance.manifest
        ) {

            return null;

        }


        const manifest =
            appInstance.manifest;

        const appId =
            manifest.id;


        /*
         * Bereits geöffnet?
         */

        if (
            HD.windowSystem.windows.has(
                appId
            )
        ) {

            const existing =
                HD.windowSystem.windows.get(
                    appId
                );

            restoreWindow(
                existing
            );

            focusWindow(
                existing
            );

            return existing;

        }


        const layer =
            getWindowLayer();


        const size =
            getDefaultWindowSize(
                manifest
            );


        const position =
            getDefaultWindowPosition(
                HD.windowSystem.windows.size
            );


        const state =
            HD.appState?.get
                ? HD.appState.get(
                    appId
                )
                : {};


        /*
         * Fenster-State
         */

        const windowState = {

            id:
                "window-" +
                appId,

            appId,

            width:
                Number(
                    state.windowWidth
                ) ||
                size.width,

            height:
                Number(
                    state.windowHeight
                ) ||
                size.height,

            left:
                Number(
                    state.windowLeft
                ) ||
                position.left,

            top:
                Number(
                    state.windowTop
                ) ||
                position.top,

            minimized:
                false,

            maximized:
                Boolean(
                    state.windowMaximized
                ),

            closed:
                false,

            zIndex:
                ++HD.windowSystem.zIndex,

            element:
                null

        };


        /* =====================================================
           WINDOW ELEMENT
           ===================================================== */

        const windowElement =
            document.createElement(
                "section"
            );


        windowElement.className =
            "haldo-app-window";


        windowElement.dataset.app =
            appId;


        windowElement.dataset.window =
            windowState.id;


        windowElement.setAttribute(
            "role",
            "dialog"
        );


        windowElement.setAttribute(
            "aria-label",
            manifest.name ||
            appId
        );


        windowElement.style.position =
            "absolute";


        windowElement.style.width =
            windowState.width +
            "px";


        windowElement.style.height =
            windowState.height +
            "px";


        windowElement.style.left =
            windowState.left +
            "px";


        windowElement.style.top =
            windowState.top +
            "px";


        windowElement.style.zIndex =
            windowState.zIndex;


        /* =====================================================
           WINDOW HEADER
           ===================================================== */

        const header =
            document.createElement(
                "header"
            );


        header.className =
            "haldo-window-header";


        const titleArea =
            document.createElement(
                "div"
            );


        titleArea.className =
            "haldo-window-title-area";


        const icon =
            document.createElement(
                "span"
            );


        icon.className =
            "haldo-window-icon";


        icon.textContent =
            manifest.icon ||
            "○";


        const title =
            document.createElement(
                "strong"
            );


        title.className =
            "haldo-window-title";


        title.textContent =
            manifest.name ||
            appId;


        titleArea.appendChild(
            icon
        );


        titleArea.appendChild(
            title
        );


        const controls =
            document.createElement(
                "div"
            );


        controls.className =
            "haldo-window-controls";


        /* =====================================================
           MINIMIZE BUTTON
           ===================================================== */

        const minimizeButton =
            createWindowButton(
                "−",
                "Minimieren"
            );


        /* =====================================================
           MAXIMIZE BUTTON
           ===================================================== */

        const maximizeButton =
            createWindowButton(
                "□",
                "Maximieren"
            );


        /* =====================================================
           CLOSE BUTTON
           ===================================================== */

        const closeButton =
            createWindowButton(
                "×",
                "Schließen"
            );


        controls.appendChild(
            minimizeButton
        );


        controls.appendChild(
            maximizeButton
        );


        controls.appendChild(
            closeButton
        );


        header.appendChild(
            titleArea
        );


        header.appendChild(
            controls
        );


        /* =====================================================
           WINDOW CONTENT
           ===================================================== */

        const content =
            document.createElement(
                "div"
            );


        content.className =
            "haldo-window-content";


        content.dataset.appContent =
            appId;


        /* =====================================================
           APP CONTENT PLACEHOLDER
           ===================================================== */

        const appRoot =
            document.createElement(
                "div"
            );


        appRoot.className =
            "haldo-app-root";


        appRoot.dataset.app =
            appId;


        content.appendChild(
            appRoot
        );


        /* =====================================================
           WINDOW FOOTER
           ===================================================== */

        const footer =
            document.createElement(
                "footer"
            );


        footer.className =
            "haldo-window-footer";


        const status =
            document.createElement(
                "span"
            );


        status.className =
            "haldo-window-status";


        status.textContent =
            "● ONLINE";


        const appIdLabel =
            document.createElement(
                "span"
            );


        appIdLabel.className =
            "haldo-window-app-id";


        appIdLabel.textContent =
            appId;


        footer.appendChild(
            status
        );


        footer.appendChild(
            appIdLabel
        );


        /* =====================================================
           ASSEMBLE WINDOW
           ===================================================== */

        windowElement.appendChild(
            header
        );


        windowElement.appendChild(
            content
        );


        windowElement.appendChild(
            footer
        );


        layer.appendChild(
            windowElement
        );


        windowState.element =
            windowElement;


        windowState.header =
            header;


        windowState.content =
            content;


        windowState.root =
            appRoot;


        windowState.footer =
            footer;


        windowState.minimizeButton =
            minimizeButton;


        windowState.maximizeButton =
            maximizeButton;


        windowState.closeButton =
            closeButton;


        HD.windowSystem.windows.set(
            appId,
            windowState
        );


        /* =====================================================
           EVENTS
           ===================================================== */

        minimizeButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                minimizeWindow(
                    windowState
                );

            }
        );


        maximizeButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                toggleMaximizeWindow(
                    windowState
                );

            }
        );


        closeButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                closeWindow(
                    windowState
                );

            }
        );


        windowElement.addEventListener(
            "pointerdown",
            function () {

                focusWindow(
                    windowState
                );

            }
        );


        /* =====================================================
           DRAGGING
           ===================================================== */

        enableWindowDragging(
            windowState
        );


        /* =====================================================
           RESIZING
           ===================================================== */

        enableWindowResizing(
            windowState
        );


        /*
         * Maximierten Zustand wiederherstellen.
         */

        if (
            windowState.maximized
        ) {

            applyMaximizedState(
                windowState
            );

        }


        /*
         * App-Root initialisieren.
         */

        initializeAppRoot(
            windowState,
            appInstance
        );


        focusWindow(
            windowState
        );


        HD.emit(
            "window:created",
            {
                window:
                    windowState,

                app:
                    appInstance
            }
        );


        return windowState;

    }


    /* =========================================================
       WINDOW BUTTON
       ========================================================= */

    function createWindowButton(
        text,
        label
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "haldo-window-control";


        button.textContent =
            text;


        button.setAttribute(
            "aria-label",
            label
        );


        button.title =
            label;


        return button;

    }


    /* =========================================================
       APP ROOT INITIALIZATION
       ========================================================= */

    function initializeAppRoot(
        windowState,
        appInstance
    ) {

        const root =
            windowState.root;


        if (!root) {
            return;
        }


        root.innerHTML = "";


        /*
         * Bereits vorhandene App-Renderer
         * verwenden.
         */

        if (
            HD.appFoundation &&
            typeof
            HD.appFoundation.render ===
            "function"
        ) {

            try {

                HD.appFoundation.render(
                    appInstance,
                    root
                );

                return;

            }
            catch (error) {

                console.warn(
                    "HalDo App Foundation Render:",
                    error
                );

            }

        }


        /*
         * Registry-basierter Renderer.
         */

        const renderer =
            HD.appRenderers?.get
                ? HD.appRenderers.get(
                    appInstance.id
                )
                : null;


        if (
            typeof renderer ===
            "function"
        ) {

            try {

                renderer(
                    root,
                    appInstance
                );

                return;

            }
            catch (error) {

                console.warn(
                    "HalDo App Renderer:",
                    appInstance.id,
                    error
                );

            }

        }


        /*
         * Allgemeiner Fallback.
         *
         * Dieser Fallback ist absichtlich
         * funktional und kein "Coming Soon".
         */

        renderGenericApp(
            root,
            appInstance
        );

    }


    /* =========================================================
       GENERIC APP FOUNDATION
       ========================================================= */

    function renderGenericApp(
        root,
        appInstance
    ) {

        const manifest =
            appInstance.manifest;


        const state =
            appInstance.state ||
            {};


        const container =
            document.createElement(
                "div"
            );


        container.className =
            "haldo-generic-app";


        const heading =
            document.createElement(
                "h2"
            );


        heading.textContent =
            manifest.name ||
            appInstance.id;


        const description =
            document.createElement(
                "p"
            );


        description.textContent =
            manifest.description ||
            "HalDo System App";


        const editor =
            document.createElement(
                "textarea"
            );


        editor.className =
            "haldo-app-editor";


        editor.placeholder =
            "Inhalt schreiben …";


        editor.value =
            state.content ||
            "";


        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "haldo-app-actions";


        const save =
            document.createElement(
                "button"
            );


        save.type =
            "button";


        save.textContent =
            "Speichern";


        const clear =
            document.createElement(
                "button"
            );


        clear.type =
            "button";


        clear.textContent =
            "Löschen";


        const restore =
            document.createElement(
                "button"
            );


        restore.type =
            "button";


        restore.textContent =
            "Wiederherstellen";


        actions.appendChild(
            save
        );


        actions.appendChild(
            clear
        );


        actions.appendChild(
            restore
        );


        container.appendChild(
            heading
        );


        container.appendChild(
            description
        );


        container.appendChild(
            editor
        );


        container.appendChild(
            actions
        );


        root.appendChild(
            container
        );


        /* =====================================================
           PERSISTENT APP CONTENT
           ===================================================== */

        save.addEventListener(
            "click",
            function () {

                appInstance.state =
                    appInstance.state ||
                    {};


                appInstance.state.content =
                    editor.value;


                appInstance.state
                    .updatedAt =
                    Date.now();


                if (
                    HD.appState?.save
                ) {

                    HD.appState.save(
                        appInstance.id,
                        appInstance.state
                    );

                }


                HD.emit(
                    "app:content-saved",
                    {
                        app:
                            appInstance,

                        content:
                            editor.value
                    }
                );

            }
        );


        clear.addEventListener(
            "click",
            function () {

                editor.value = "";


                appInstance.state =
                    appInstance.state ||
                    {};


                appInstance.state.content =
                    "";


                if (
                    HD.appState?.save
                ) {

                    HD.appState.save(
                        appInstance.id,
                        appInstance.state
                    );

                }

            }
        );


        restore.addEventListener(
            "click",
            function () {

                const saved =
                    HD.storage?.get
                        ? HD.storage.get(
                            "app-state:" +
                            appInstance.id,
                            {}
                        )
                        : {};


                editor.value =
                    saved.content ||
                    "";

            }
        );

    }


    /* =========================================================
       FOCUS WINDOW
       ========================================================= */

    function focusWindow(
        windowState
    ) {

        if (
            !windowState ||
            !windowState.element
        ) {

            return;

        }


        HD.windowSystem.zIndex +=
            1;


        windowState.zIndex =
            HD.windowSystem.zIndex;


        windowState.element.style.zIndex =
            windowState.zIndex;


        HD.windowSystem.activeWindow =
            windowState;


        HD.windowSystem.windows
            .forEach(
                item => {

                    if (
                        item.element
                    ) {

                        item.element
                            .classList
                            .remove(
                                "active"
                            );

                    }

                }
            );


        windowState.element
            .classList
            .add(
                "active"
            );


        HD.emit(
            "window:focused",
            {
                window:
                    windowState
            }
        );

    }


    /* =========================================================
       MINIMIZE
       ========================================================= */

    function minimizeWindow(
        windowState
    ) {

        if (!windowState) {
            return;
        }


        windowState.minimized =
            true;


        windowState.element
            .classList
            .add(
                "minimized"
            );


        windowState.element.style
            .display =
            "none";


        saveWindowState(
            windowState
        );


        HD.emit(
            "window:minimized",
            {
                window:
                    windowState
            }
        );

    }


    /* =========================================================
       RESTORE
       ========================================================= */

    function restoreWindow(
        windowState
    ) {

        if (!windowState) {
            return;
        }


        windowState.minimized =
            false;


        windowState.element
            .classList
            .remove(
                "minimized"
            );


        windowState.element.style
            .display =
            "flex";


        focusWindow(
            windowState
        );


        HD.emit(
            "window:restored",
            {
                window:
                    windowState
            }
        );

    }


    /* =========================================================
       MAXIMIZE
       ========================================================= */

    function toggleMaximizeWindow(
        windowState
    ) {

        if (!windowState) {
            return;
        }


        if (
            windowState.maximized
        ) {

            restoreWindowSize(
                windowState
            );

        }
        else {

            maximizeWindow(
                windowState
            );

        }

    }


    function maximizeWindow(
        windowState
    ) {

        if (!windowState) {
            return;
        }


        if (
            !windowState.previous
        ) {

            windowState.previous = {

                width:
                    windowState.width,

                height:
                    windowState.height,

                left:
                    windowState.left,

                top:
                    windowState.top

            };

        }


        const layer =
            getWindowLayer();


        const rect =
            layer.getBoundingClientRect();


        windowState.width =
            rect.width;


        windowState.height =
            rect.height;


        windowState.left =
            0;


        windowState.top =
            0;


        windowState.maximized =
            true;


        applyWindowGeometry(
            windowState
        );


        windowState.element
            .classList
            .add(
                "maximized"
            );


        saveWindowState(
            windowState
        );


        HD.emit(
            "window:maximized",
            {
                window:
                    windowState
            }
        );

    }


    function applyMaximizedState(
        windowState
    ) {

        maximizeWindow(
            windowState
        );

    }


    function restoreWindowSize(
        windowState
    ) {

        if (
            !windowState.previous
        ) {

            return;

        }


        const previous =
            windowState.previous;


        windowState.width =
            previous.width;


        windowState.height =
            previous.height;


        windowState.left =
            previous.left;


        windowState.top =
            previous.top;


        windowState.maximized =
            false;


        windowState.element
            .classList
            .remove(
                "maximized"
            );


        applyWindowGeometry(
            windowState
        );


        saveWindowState(
            windowState
        );


        HD.emit(
            "window:unmaximized",
            {
                window:
                    windowState
            }
        );

    }


    /* =========================================================
       CLOSE
       ========================================================= */

    function closeWindow(
        windowState
    ) {

        if (!windowState) {
            return;
        }


        saveWindowState(
            windowState
        );


        if (
            windowState.appId &&
            HD.appRuntime
        ) {

            const instance =
                HD.appRuntime.get(
                    windowState.appId
                );


            if (
                instance &&
                typeof instance.close ===
                "function"
            ) {

                try {

                    instance.close();

                }
                catch (error) {

                    console.warn(
                        "HalDo App Close:",
                        error
                    );

                }

            }

        }


        windowState.closed =
            true;


        if (
            windowState.element
        ) {

            windowState.element
                .remove();

        }


        HD.windowSystem.windows.delete(
            windowState.appId
        );


        if (
            HD.windowSystem.activeWindow ===
            windowState
        ) {

            HD.windowSystem.activeWindow =
                null;

        }


        HD.emit(
            "window:closed",
            {
                window:
                    windowState
            }
        );

    }


    /* =========================================================
       WINDOW GEOMETRY
       ========================================================= */

    function applyWindowGeometry(
        windowState
    ) {

        if (
            !windowState?.element
        ) {

            return;

        }


        const minWidth =
            Number(
                HD.config?.minimumWindowWidth
            ) ||
            360;


        const minHeight =
            Number(
                HD.config?.minimumWindowHeight
            ) ||
            240;


        windowState.width =
            Math.max(
                minWidth,
                Number(
                    windowState.width
                )
            );


        windowState.height =
            Math.max(
                minHeight,
                Number(
                    windowState.height
                )
            );


        windowState.element.style.width =
            windowState.width +
            "px";


        windowState.element.style.height =
            windowState.height +
            "px";


        windowState.element.style.left =
            Math.max(
                0,
                windowState.left
            ) +
            "px";


        windowState.element.style.top =
            Math.max(
                0,
                windowState.top
            ) +
            "px";


        saveWindowState(
            windowState
        );

    }


    /* =========================================================
       DRAGGING
       ========================================================= */

    function enableWindowDragging(
        windowState
    ) {

        const header =
            windowState.header;


        if (!header) {
            return;
        }


        let dragging =
            false;


        let startX =
            0;


        let startY =
            0;


        let startLeft =
            0;


        let startTop =
            0;


        header.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {

                    return;

                }


                if (
                    windowState.maximized
                ) {

                    return;

                }


                dragging =
                    true;


                focusWindow(
                    windowState
                );


                startX =
                    event.clientX;


                startY =
                    event.clientY;


                startLeft =
                    windowState.left;


                startTop =
                    windowState.top;


                try {

                    header.setPointerCapture(
                        event.pointerId
                    );

                }
                catch (error) {}

            }
        );


        header.addEventListener(
            "pointermove",
            function (event) {

                if (!dragging) {
                    return;
                }


                windowState.left =
                    startLeft +
                    (
                        event.clientX -
                        startX
                    );


                windowState.top =
                    startTop +
                    (
                        event.clientY -
                        startY
                    );


                applyWindowGeometry(
                    windowState
                );

            }
        );


        header.addEventListener(
            "pointerup",
            function () {

                dragging =
                    false;


                saveWindowState(
                    windowState
                );

            }
        );


        header.addEventListener(
            "pointercancel",
            function () {

                dragging =
                    false;

            }
        );

    }


    /* =========================================================
       RESIZING
       ========================================================= */

    function enableWindowResizing(
        windowState
    ) {

        const element =
            windowState.element;


        if (!element) {
            return;
        }


        const resizeHandle =
            document.createElement(
                "div"
            );


        resizeHandle.className =
            "haldo-window-resize-handle";


        resizeHandle.setAttribute(
            "aria-label",
            "Fenstergröße ändern"
        );


        element.appendChild(
            resizeHandle
        );


        let resizing =
            false;


        let startX =
            0;


        let startY =
            0;


        let startWidth =
            0;


        let startHeight =
            0;


        resizeHandle.addEventListener(
            "pointerdown",
            function (event) {

                if (
                    windowState.maximized
                ) {

                    return;

                }


                event.preventDefault();


                resizing =
                    true;


                focusWindow(
                    windowState
                );


                startX =
                    event.clientX;


                startY =
                    event.clientY;


                startWidth =
                    windowState.width;


                startHeight =
                    windowState.height;


                try {

                    resizeHandle.setPointerCapture(
                        event.pointerId
                    );

                }
                catch (error) {}

            }
        );


        resizeHandle.addEventListener(
            "pointermove",
            function (event) {

                if (!resizing) {
                    return;
                }


                const minWidth =
                    Number(
                        HD.config
                            ?.minimumWindowWidth
                    ) ||
                    360;


                const minHeight =
                    Number(
                        HD.config
                            ?.minimumWindowHeight
                    ) ||
                    240;


                windowState.width =
                    Math.max(
                        minWidth,
                        startWidth +
                        (
                            event.clientX -
                            startX
                        )
                    );


                windowState.height =
                    Math.max(
                        minHeight,
                        startHeight +
                        (
                            event.clientY -
                            startY
                        )
                    );


                applyWindowGeometry(
                    windowState
                );

            }
        );


        resizeHandle.addEventListener(
            "pointerup",
            function () {

                resizing =
                    false;


                saveWindowState(
                    windowState
                );

            }
        );


        resizeHandle.addEventListener(
            "pointercancel",
            function () {

                resizing =
                    false;

            }
        );

    }


    /* =========================================================
       WINDOW STATE PERSISTENCE
       ========================================================= */

    function saveWindowState(
        windowState
    ) {

        if (
            !windowState ||
            !windowState.appId
        ) {

            return;

        }


        if (
            !HD.storage ||
            typeof HD.storage.set !==
            "function"
        ) {

            return;

        }


        HD.storage.set(
            "window-state:" +
            windowState.appId,
            {

                width:
                    windowState.width,

                height:
                    windowState.height,

                left:
                    windowState.left,

                top:
                    windowState.top,

                maximized:
                    windowState.maximized

            }
        );

    }


    /* =========================================================
       OPEN APP THROUGH WINDOW SYSTEM
       ========================================================= */

    HD.windowManager =
        HD.windowManager || {};


    HD.windowManager.open =
        function (
            appId
        ) {

            const manifest =
                HD.appRegistry?.get
                    ? HD.appRegistry.get(
                        appId
                    )
                    : null;


            if (!manifest) {

                console.warn(
                    "HalDo App nicht registriert:",
                    appId
                );

                return null;

            }


            let instance =
                HD.appRuntime?.get
                    ? HD.appRuntime.get(
                        appId
                    )
                    : null;


            if (!instance) {

                instance =
                    HD.appRuntime.create(
                        manifest
                    );

            }


            if (
                typeof instance.open ===
                "function"
            ) {

                instance.open();

            }


            const windowState =
                createWindow(
                    instance
                );


            return windowState;

        };


    /* =========================================================
       CLOSE APP
       ========================================================= */

    HD.windowManager.close =
        function (
            appId
        ) {

            const windowState =
                HD.windowSystem.windows
                    .get(
                        appId
                    );


            if (!windowState) {
                return false;
            }


            closeWindow(
                windowState
            );


            return true;

        };


    /* =========================================================
       MINIMIZE APP
       ========================================================= */

    HD.windowManager.minimize =
        function (
            appId
        ) {

            const windowState =
                HD.windowSystem.windows
                    .get(
                        appId
                    );


            if (!windowState) {
                return false;
            }


            minimizeWindow(
                windowState
            );


            return true;

        };


    /* =========================================================
       RESTORE APP
       ========================================================= */

    HD.windowManager.restore =
        function (
            appId
        ) {

            const windowState =
                HD.windowSystem.windows
                    .get(
                        appId
                    );


            if (!windowState) {
                return false;
            }


            restoreWindow(
                windowState
            );


            return true;

        };


    /* =========================================================
       MAXIMIZE APP
       ========================================================= */

    HD.windowManager.maximize =
        function (
            appId
        ) {

            const windowState =
                HD.windowSystem.windows
                    .get(
                        appId
                    );


            if (!windowState) {
                return false;
            }


            maximizeWindow(
                windowState
            );


            return true;

        };


    /* =========================================================
       TOGGLE MAXIMIZE
       ========================================================= */

    HD.windowManager.toggleMaximize =
        function (
            appId
        ) {

            const windowState =
                HD.windowSystem.windows
                    .get(
                        appId
                    );


            if (!windowState) {
                return false;
            }


            toggleMaximizeWindow(
                windowState
            );


            return true;

        };


    /* =========================================================
       FOCUS APP
       ========================================================= */

    HD.windowManager.focus =
        function (
            appId
        ) {

            const windowState =
                HD.windowSystem.windows
                    .get(
                        appId
                    );


            if (!windowState) {
                return false;
            }


            focusWindow(
                windowState
            );


            return true;

        };


    /* =========================================================
       GET WINDOW
       ========================================================= */

    HD.windowManager.get =
        function (
            appId
        ) {

            return HD.windowSystem.windows
                .get(
                    appId
                ) ||
                null;

        };


    /* =========================================================
       ALL WINDOWS
       ========================================================= */

    HD.windowManager.all =
        function () {

            return Array.from(
                HD.windowSystem.windows
                    .values()
            );

        };


    /* =========================================================
       WINDOW SYSTEM REGISTRATION
       ========================================================= */

    HD.runtime?.register?.(
        "window-manager",
        HD.windowManager
    );


    HD.services?.register?.(
        "window-manager",
        HD.windowManager
    );


    /* =========================================================
       APP MANAGER BRIDGE
       ========================================================= */

    HD.appManager =
        HD.appManager || {};


    const existingOpen =
        HD.appManager.open;


    HD.appManager.open =
        function (
            appId
        ) {

            /*
             * Wenn bereits eine ältere
             * App-Manager-Open-Funktion existiert,
             * zuerst ausführen.
             */

            let result =
                null;


            if (
                typeof existingOpen ===
                "function" &&
                existingOpen !==
                HD.appManager.open
            ) {

                try {

                    result =
                        existingOpen.call(
                            HD.appManager,
                            appId
                        );

                }
                catch (error) {

                    console.warn(
                        "HalDo App Manager:",
                        error
                    );

                }

            }


            /*
             * Fenster sicher öffnen.
             */

            const window =
                HD.windowManager.open(
                    appId
                );


            return (
                window ||
                result
            );

        };


    /* =========================================================
       DOUBLE-CLICK / OPEN EVENTS
       ========================================================= */

    HD.on?.(
        "app:open",
        function (data) {

            if (
                !data ||
                !data.app
            ) {

                return;

            }


            const app =
                data.app;


            if (
                !HD.windowSystem.windows
                    .has(
                        app.id
                    )
            ) {

                createWindow(
                    app
                );

            }

        }
    );


    /* =========================================================
       SYSTEM WINDOW EVENTS
       ========================================================= */

    HD.on?.(
        "window:closed",
        function (data) {

            if (
                !data?.window
            ) {

                return;

            }


            HD.emit(
                "app:window-closed",
                {
                    appId:
                        data.window.appId
                }
            );

        }
    );


    /* =========================================================
       INITIALIZE
       ========================================================= */

    HD.windowSystem.initialized =
        true;


    HD.emit(
        "window-system:initialized",
        {
            windows:
                HD.windowSystem.windows
                    .size
        }
    );


    console.log(
        "HalDo AI OS 22 — Window System ONLINE"
    );

})();
</script>

     INDEX.HTML — PART 8 / 16
     
     APP WINDOW SYSTEM
     - Fenster öffnen
     - verschieben
     - minimieren
