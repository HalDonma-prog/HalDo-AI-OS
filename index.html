<script>

"use strict";

/* =========================================================
   HALDO COSMIC WORLD ENGINE
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.Cosmic =
{

    initialized:
        false,

    world:
        null,

    starField:
        null,

    sun:
        null,

    init()
    {

        if (
            this.initialized
        ) {
            return;
        }

        this.world =
            document.getElementById(
                "haldo-cosmic-world"
            );

        this.starField =
            document.getElementById(
                "haldo-star-field"
            );

        this.sun =
            document.getElementById(
                "haldo-sun"
            );

        if (
            !this.world ||
            !this.starField ||
            !this.sun
        ) {
            return;
        }

        this.createStars();

        this.bindSun();

        this.bindPlanets();

        this.initialized =
            true;

        if (
            typeof window.HalDo.emit ===
            "function"
        ) {

            window.HalDo.emit(
                "cosmic:ready",
                {
                    cosmic:
                        this
                }
            );
        }
    },


    /* =====================================================
       STARS
       ===================================================== */

    createStars()
    {

        const count =
            window.innerWidth < 600
                ? 90
                : 180;

        const fragment =
            document.createDocumentFragment();

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const star =
                document.createElement(
                    "span"
                );

            star.className =
                "haldo-star";

            star.style.setProperty(
                "--x",
                `${Math.random() * 100}%`
            );

            star.style.setProperty(
                "--y",
                `${Math.random() * 100}%`
            );

            star.style.setProperty(
                "--size",
                `${(
                    Math.random() * 2 +
                    .5
                ).toFixed(2)}px`
            );

            star.style.setProperty(
                "--opacity",
                (
                    .25 +
                    Math.random() * .75
                ).toFixed(2)
            );

            star.style.setProperty(
                "--duration",
                `${
                    2 +
                    Math.random() * 4
                }s`
            );

            star.style.setProperty(
                "--delay",
                `${
                    Math.random() * -5
                }s`
            );

            fragment.appendChild(
                star
            );
        }

        this.starField.appendChild(
            fragment
        );
    },


    /* =====================================================
       SUN
       ===================================================== */

    bindSun()
    {

        this.sun.addEventListener(
            "click",
            () => {

                this.activateAI();

            }
        );

        this.sun.addEventListener(
            "pointerdown",
            () => {

                window.HalDo.Avatar?.react(
                    "sun-click"
                );

            }
        );
    },


    activateAI()
    {

        window.HalDo.Avatar?.react(
            "greeting"
        );

        if (
            typeof window.HalDo.openAIChat ===
            "function"
        ) {

            window.HalDo.openAIChat();

        }

        if (
            typeof window.HalDo.emit ===
            "function"
        ) {

            window.HalDo.emit(
                "ai:activated",
                {
                    source:
                        "sun"
                }
            );
        }
    },


    /* =====================================================
       PLANETS
       ===================================================== */

    bindPlanets()
    {

        const planets =
            this.world.querySelectorAll(
                ".haldo-planet"
            );

        planets.forEach(
            planet => {

                planet.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        const name =
                            planet.getAttribute(
                                "aria-label"
                            );

                        window.HalDo.Avatar?.react(
                            "point-right"
                        );

                        if (
                            typeof window.HalDo.emit ===
                            "function"
                        ) {

                            window.HalDo.emit(
                                "cosmic:planet-selected",
                                {
                                    planet:
                                        name
                                }
                            );
                        }
                    }
                );
            }
        );
    }
};


/* =========================================================
   START COSMIC WORLD
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            window.HalDo.Cosmic.init();

        },
        {
            once:
                true
        }
    );

}

else {

    window.HalDo.Cosmic.init();

}

</script>

<script>

"use strict";

/* =========================================================
   HALDO AI CORE BRIDGE
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.AIInterface =
{

    initialized:
        false,

    record:
        null,

    conversation:
        null,

    input:
        null,

    send:
        null,

    mic:
        null,

    status:
        null,

    busy:
        false,

    init(
        record
    )
    {

        if (
            this.initialized &&
            this.record === record
        ) {
            return;
        }

        this.record =
            record;

        if (
            !record ||
            !record.body
        ) {
            return;
        }

        this.conversation =
            record.body.querySelector(
                "#haldo-ai-conversation"
            );

        this.input =
            record.body.querySelector(
                "#haldo-ai-input"
            );

        this.send =
            record.body.querySelector(
                "#haldo-ai-send"
            );

        this.mic =
            record.body.querySelector(
                "#haldo-ai-mic"
            );

        this.status =
            record.body.querySelector(
                "#haldo-ai-status"
            );

        if (
            !this.conversation ||
            !this.input ||
            !this.send
        ) {
            return;
        }

        this.bind();

        this.initialized =
            true;

        this.setStatus(
            "Bereit"
        );
    },


    /* =====================================================
       BIND EVENTS
       ===================================================== */

    bind()
    {

        this.send.addEventListener(
            "click",
            () => {

                this.submit();

            }
        );

        this.input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    this.submit();
                }
            }
        );

        if (
            this.mic
        ) {

            this.mic.addEventListener(
                "click",
                () => {

                    this.toggleVoice();

                }
            );
        }

        const quickActions =
            this.record.body.querySelectorAll(
                "[data-ai-prompt]"
            );

        quickActions.forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const prompt =
                            button.dataset.aiPrompt;

                        if (
                            prompt
                        ) {

                            this.input.value =
                                prompt;

                            this.submit();
                        }
                    }
                );
            }
        );
    },


    /* =====================================================
       USER MESSAGE
       ===================================================== */

    submit()
    {

        if (
            this.busy
        ) {
            return;
        }

        const text =
            this.input.value.trim();

        if (
            !text
        ) {
            return;
        }

        this.input.value =
            "";

        this.addMessage(
            text,
            "user"
        );

        this.process(
            text
        );
    },


    /* =====================================================
       PROCESS
       ===================================================== */

    async process(
        text
    )
    {

        this.busy =
            true;

        this.setStatus(
            "Denke nach …"
        );

        window.HalDo.Avatar?.setState(
            "thinking"
        );

        this.showTyping();

        try {

            const command =
                this.detectCommand(
                    text
                );

            if (
                command
            ) {

                this.hideTyping();

                const result =
                    await this.executeCommand(
                        command
                    );

                this.addMessage(
                    result,
                    "ai"
                );

                window.HalDo.Avatar?.setState(
                    "happy"
                );

                this.setStatus(
                    "Bereit"
                );

                return;
            }


            const answer =
                await this.askCore(
                    text
                );

            this.hideTyping();

            this.addMessage(
                answer,
                "ai"
            );

            window.HalDo.Avatar?.setState(
                "speaking"
            );

            this.setStatus(
                "Bereit"
            );

        }

        catch (
            error
        ) {

            console.error(
                "[HalDo AI Interface]",
                error
            );

            this.hideTyping();

            this.addMessage(
                "Entschuldigung, dabei ist ein Fehler aufgetreten.",
                "ai"
            );

            window.HalDo.Avatar?.setState(
                "idle"
            );

            this.setStatus(
                "Bereit"
            );
        }

        finally {

            this.busy =
                false;
        }
    },


    /* =====================================================
       AI CORE
       ===================================================== */

    async askCore(
        text
    )
    {

        const candidates = [

            window.HalDo?.AI?.chat,

            window.HalDo?.AI?.ask,

            window.HalDo?.AICore?.chat,

            window.HalDo?.AICore?.ask,

            window.HalDo?.AIEngine?.chat,

            window.HalDo?.AIEngine?.generate

        ];

        for (
            const candidate of candidates
        ) {

            if (
                typeof candidate !==
                "function"
            ) {
                continue;
            }

            try {

                const response =
                    await candidate.call(
                        window.HalDo.AI ||
                        window.HalDo.AICore ||
                        window.HalDo.AIEngine,
                        text
                    );

                const answer =
                    this.normalizeResponse(
                        response
                    );

                if (
                    answer
                ) {
                    return answer;
                }

            }

            catch (
                error
            ) {

                console.warn(
                    "[HalDo AI] Core candidate failed",
                    error
                );
            }
        }


        return this.localIntelligence(
            text
        );
    },


    /* =====================================================
       RESPONSE NORMALIZATION
       ===================================================== */

    normalizeResponse(
        response
    )
    {

        if (
            typeof response ===
            "string"
        ) {

            return response;
        }

        if (
            !response
        ) {
            return "";
        }

        return (
            response.text ||
            response.answer ||
            response.response ||
            response.message ||
            response.content ||
            ""
        );
    },


    /* =====================================================
       LOCAL INTELLIGENCE FALLBACK
       ===================================================== */

    localIntelligence(
        text
    )
    {

        const value =
            text.toLowerCase();

        if (
            /hallo|hi|hey|guten morgen|guten abend/
                .test(
                    value
                )
        ) {

            return "Hallo. Ich bin HalDo AI. Schön, dass du da bist. Was möchtest du gemeinsam mit mir machen?";
        }

        if (
            /wer bist du|was bist du/
                .test(
                    value
                )
        ) {

            return "Ich bin HalDo AI – die zentrale intelligente Assistenz deines HalDo AI OS. Ich kann dich beim Arbeiten, Schreiben, Organisieren, Suchen und Bedienen des Systems unterstützen.";
        }

        if (
            /danke|thanks/
                .test(
                    value
                )
        ) {

            return "Sehr gerne. Ich bin jederzeit für dich da.";
        }

        if (
            /hilfe|help/
                .test(
                    value
                )
        ) {

            return "Natürlich. Du kannst mich etwas fragen, Texte schreiben lassen, Apps öffnen lassen oder mit mir über Aufgaben und Ideen sprechen.";
        }

        return "Ich habe deine Nachricht verstanden. Der zentrale HalDo-AI-Core kann diese Unterhaltung übernehmen, sobald seine entsprechende Schnittstelle verfügbar ist.";
    },


    /* =====================================================
       COMMAND DETECTION
       ===================================================== */

    detectCommand(
        text
    )
    {

        const value =
            text
                .toLowerCase()
                .trim();

        const patterns = [

            {
                regex:
                    /öffne (?:die )?einstellungen|open settings/,

                command:
                    "settings"
            },

            {
                regex:
                    /öffne (?:meine )?dateien|öffne den dateimanager|open files/,

                command:
                    "files"
            },

            {
                regex:
                    /öffne chat|öffne haldo ai|open chat/,

                command:
                    "chat"
            },

            {
                regex:
                    /öffne apps|app.?menü|zeige apps/,

                command:
                    "apps"
            }
        ];

        return (
            patterns.find(
                item =>
                    item.regex.test(
                        value
                    )
            )?.command ||
            null
        );
    },


    /* =====================================================
       COMMAND EXECUTION
       ===================================================== */

    async executeCommand(
        command
    )
    {

        switch (
            command
        ) {

            case "settings":

                return this.openApp(
                    "settings",
                    "Einstellungen"
                );

            case "files":

                return this.openApp(
                    "file-manager",
                    "Dateien"
                );

            case "apps":

                return this.openApp(
                    "app-menu",
                    "Apps"
                );

            case "chat":

                return "Du bist bereits im HalDo-AI-Fenster.";

            default:

                return "Der Befehl wurde erkannt.";
        }
    },


    /* =====================================================
       UNIVERSAL APP OPENER
       ===================================================== */

    openApp(
        id,
        title
    )
    {

        try {

            if (
                window.HalDo?.AppManager &&
                typeof window.HalDo.AppManager.open ===
                "function"
            ) {

                window.HalDo.AppManager.open(
                    id
                );

                return (
                    title +
                    " wird geöffnet."
                );
            }

            if (
                typeof window.HalDo?.openApp ===
                "function"
            ) {

                window.HalDo.openApp(
                    id
                );

                return (
                    title +
                    " wird geöffnet."
                );
            }

            if (
                typeof window.HalDo?.openWindow ===
                "function"
            ) {

                window.HalDo.openWindow(
                {
                    id:
                        "app-" +
                        id,

                    title:
                        title,

                    content:
                        `
                        <div class="haldo-app-content">

                            <h1 class="haldo-app-heading">
                                ${title}
                            </h1>

                            <p class="haldo-app-description">
                                HalDo AI bereitet die Anwendung vor.
                            </p>

                        </div>
                        `
                });

                return (
                    title +
                    " wird geöffnet."
                );
            }

        }

        catch (
            error
        ) {

            console.error(
                "[HalDo App Open]",
                error
            );
        }

        return (
            title +
            " ist im aktuellen App-System noch nicht erreichbar."
        );
    },


    /* =====================================================
       MESSAGE
       ===================================================== */

    addMessage(
        text,
        type
    )
    {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "haldo-ai-row " +
            type;

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "haldo-ai-message";

        message.textContent =
            String(
                text
            );

        row.appendChild(
            message
        );

        this.conversation.appendChild(
            row
        );

        this.conversation.scrollTop =
            this.conversation.scrollHeight;
    },


    /* =====================================================
       TYPING
       ===================================================== */

    showTyping()
    {

        if (
            this.record.body.querySelector(
                ".haldo-ai-typing-row"
            )
        ) {
            return;
        }

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "haldo-ai-row ai haldo-ai-typing-row";

        row.innerHTML = `

            <div
                class="haldo-ai-message"
            >

                <span
                    class="haldo-ai-typing"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </span>

            </div>
        `;

        this.conversation.appendChild(
            row
        );

        this.conversation.scrollTop =
            this.conversation.scrollHeight;
    },


    hideTyping()
    {

        this.record.body
            .querySelector(
                ".haldo-ai-typing-row"
            )
            ?.remove();
    },


    /* =====================================================
       STATUS
       ===================================================== */

    setStatus(
        value
    )
    {

        if (
            this.status
        ) {

            this.status.textContent =
                value;
        }
    },


    /* =====================================================
       VOICE
       ===================================================== */

    toggleVoice()
    {

        if (
            window.HalDo?.Voice &&
            typeof window.HalDo.Voice.toggle ===
            "function"
        ) {

            window.HalDo.Voice.toggle();

            return;
        }

        if (
            window.HalDo?.Speech &&
            typeof window.HalDo.Speech.start ===
            "function"
        ) {

            window.HalDo.Speech.start();

            return;
        }

        if (
            "webkitSpeechRecognition" in
            window ||
            "SpeechRecognition" in
            window
        ) {

            this.startBrowserRecognition();

            return;
        }

        this.addMessage(
            "Die Sprachfunktion ist auf diesem Gerät momentan nicht verfügbar.",
            "ai"
        );
    },


    /* =====================================================
       BROWSER SPEECH RECOGNITION
       ===================================================== */

    startBrowserRecognition()
    {

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (
            !Recognition
        ) {
            return;
        }

        const recognition =
            new Recognition();

        recognition.lang =
            document.documentElement.lang ||
            "de-DE";

        recognition.interimResults =
            false;

        recognition.continuous =
            false;

        this.setStatus(
            "Ich höre zu …"
        );

        window.HalDo.Avatar?.setState(
            "listening"
        );

        recognition.onresult =
            event => {

                const transcript =
                    event.results?.[0]?.[0]?.transcript ||
                    "";

                if (
                    transcript
                ) {

                    this.input.value =
                        transcript;

                    this.submit();
                }
            };

        recognition.onerror =
            () => {

                this.setStatus(
                    "Bereit"
                );

                window.HalDo.Avatar?.setState(
                    "idle"
                );
            };

        recognition.onend =
            () => {

                if (
                    !this.busy
                ) {

                    this.setStatus(
                        "Bereit"
                    );
                }
            };

        recognition.start();
    }
};

<script>

"use strict";

/* =========================================================
   COSMIC WORLD ENGINE
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.CosmicWorld =
{

    initialized:
        false,

    root:
        null,

    sun:
        null,

    rays:
        null,

    planets:
        [],

    timers:
        [],


    init()
    {

        if (
            this.initialized
        ) {
            return;
        }

        this.root =
            document.querySelector(
                ".haldo-cosmic-world"
            );

        if (
            !this.root
        ) {
            return;
        }

        this.sun =
            this.root.querySelector(
                ".haldo-sun"
            );

        this.rays =
            this.root.querySelector(
                ".haldo-sun-rays"
            );

        this.createSunRays();

        this.createPlanets();

        this.bindSun();

        this.initialized =
            true;
    },


    /* =====================================================
       CREATE 365 RAYS
       ===================================================== */

    createSunRays()
    {

        if (
            !this.rays
        ) {
            return;
        }

        if (
            this.rays.children.length >=
            365
        ) {
            return;
        }

        const fragment =
            document.createDocumentFragment();

        for (
            let i = 0;
            i < 365;
            i++
        ) {

            const ray =
                document.createElement(
                    "span"
                );

            ray.className =
                "haldo-sun-ray";

            ray.style.transform =
                `
                translateX(-50%)
                rotate(${i}deg)
                `;
            
            ray.style.opacity =
                String(
                    .22 +
                    (
                        i %
                        7
                    ) *
                    .055
                );

            fragment.appendChild(
                ray
            );
        }

        this.rays.appendChild(
            fragment
        );
    },


    /* =====================================================
       PLANET CONFIGURATION
       ===================================================== */

    createPlanets()
    {

        const system =
            this.root.querySelector(
                ".haldo-orbit-system"
            );

        if (
            !system
        ) {
            return;
        }

        const definitions = [

            {
                name:
                    "Mercury",

                className:
                    "mercury",

                radius:
                    "12%",

                size:
                    "10px",

                time:
                    "7s",

                direction:
                    "normal",

                tilt:
                    "-7deg"
            },

            {
                name:
                    "Venus",

                className:
                    "venus",

                radius:
                    "17%",

                size:
                    "14px",

                time:
                    "11s",

                direction:
                    "reverse",

                tilt:

    init()

        ) {

    /* =====================================================
       CACHE
       ===================================================== */

    cache()
    {

        this.overlay =
            document.getElementById(
                "haldo-ai-overlay"
            );

        this.window =
            this.overlay?.querySelector(
                ".haldo-ai-window"
            );

        this.chat =
            this.overlay?.querySelector(
                "[data-haldo-ai-chat]"
            );

        this.input =
            this.overlay?.querySelector(
                "[data-haldo-ai-input]"
            );

        this.mic =
            this.overlay?.querySelector(
                "[data-ai-mic]"
            );

        this.close =
            this.overlay?.querySelector(
                ".haldo-ai-close"
            );

        this.status =
            this.overlay?.querySelector(
                "[data-haldo-ai-status]"
            );
    },


    /* =====================================================
       EVENTS
       ===================================================== */

    bind()
    {

        this.close?.addEventListener(
            "click",
            () => this.closeAI()
        );


        this.overlay?.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    this.overlay
                ) {

                    this.closeAI();
                }
            }
        );


        this.input?.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    this.sendMessage();
                }
            }
        );


        this.input?.addEventListener(
            "input",
            () => {

                this.input.style.height =
                    "auto";

                this.input.style.height =
                    Math.min(
                        this.input.scrollHeight,
                        140
                    ) +
                    "px";
            }
        );


        const form =
            this.overlay?.querySelector(
                "[data-haldo-ai-form]"
            );

        form?.addEventListener(
            "submit",
            event => {

                event.preventDefault();

                this.sendMessage();
            }
        );


        this.mic?.addEventListener(
            "click",
            () => this.toggleVoice()
        );


        this.overlay
            ?.querySelectorAll(
                "[data-ai-quick]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            this.quickAction(
                                button.dataset.aiQuick
                            );
                        }
                    );
                }
            );


        this.overlay
            ?.querySelectorAll(
                "[data-ai-tool]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            this.toolAction(
                                button.dataset.aiTool
                            );
                        }
                    );
                }
            );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape" &&
                    this.isOpen()
                ) {

                    this.closeAI();
                }
            }
        );
    },


    /* =====================================================
       OPEN
       ===================================================== */

    openAI(
        message
    )
    {

        this.init();

        this.overlay?.classList.add(
            "is-open"
        );

        document.body.classList.add(
            "haldo-ai-open"
        );


        if (
            this.chat &&
            this.chat.children.length ===
            0
        ) {

            this.addMessage(
                "ai",
                "Hallo. Ich bin HalDo AI. Wie kann ich dir helfen?"
            );
        }


        if (
            message
        ) {

            this.addMessage(
                "ai",
                message
            );
        }


        setTimeout(
            () => this.input?.focus(),
            100
        );
    },


    /* =====================================================
       CLOSE
       ===================================================== */

    closeAI()
    {

        this.overlay?.classList.remove(
            "is-open"
        );

        document.body.classList.remove(
            "haldo-ai-open"
        );
    },


    isOpen()
    {

        return Boolean(
            this.overlay?.classList.contains(
                "is-open"
            )
        );
    },


    /* =====================================================
       MESSAGE
       ===================================================== */

    addMessage(
        sender,
        text
    )
    {

        if (
            !this.chat
        ) {
            return;
        }

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "haldo-ai-message " +
            (
                sender === "user"
                    ?
                "user"
                    :
                "ai"
            );


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "haldo-ai-bubble";

        bubble.textContent =
            text;


        row.appendChild(
            bubble
        );

        this.chat.appendChild(
            row
        );


        this.chat.scrollTop =
            this.chat.scrollHeight;


        this.conversation.push(
            {
                role:
                    sender === "user"
                        ?
                    "user"
                        :
                    "assistant",

                content:
                    text,

                time:
                    Date.now()
            }
        );
    },


    /* =====================================================
       THINKING INDICATOR
       ===================================================== */

    showThinking()
    {

        if (
            !this.chat
        ) {
            return null;
        }

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "haldo-ai-message ai";


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "haldo-ai-bubble";


        bubble.innerHTML = `

            <span
                class="haldo-ai-thinking"
                aria-label="HalDo AI denkt"
            >

                <i></i>
                <i></i>
                <i></i>

            </span>
        `;


        row.appendChild(
            bubble
        );

        this.chat.appendChild(
            row
        );

        this.chat.scrollTop =
            this.chat.scrollHeight;

        return row;
    },


    /* =====================================================
       STATUS
       ===================================================== */

    setStatus(
        text
    )
    {

        if (
            this.status
        ) {

            this.status.textContent =
                text;
        }
    },


    /* =====================================================
       SEND
       ===================================================== */

    async sendMessage()
    {

        const value =
            this.input?.value
                ?.trim();

        if (
            !value ||
            this.thinking
        ) {
            return;
        }


        this.input.value =
            "";

        this.input.style.height =
            "auto";


        this.addMessage(
            "user",
            value
        );


        this.thinking =
            true;

        this.setStatus(
            "Denkt …"
        );


        const thinking =
            this.showThinking();


        try {

            const response =
                await this.processRequest(
                    value
                );


            thinking?.remove();


            this.addMessage(
                "ai",
                response
            );


            this.setStatus(
                "Bereit"
            );


            this.speakIfEnabled(
                response
            );

        }

        catch (
            error
        ) {

            thinking?.remove();

            console.error(
                "[HalDo AI]",
                error
            );

            this.addMessage(
                "ai",
                "Entschuldigung. Bei der Verarbeitung ist ein Fehler aufgetreten."
            );

            this.setStatus(
                "Bereit"
            );

        }

        finally {

            this.thinking =
                false;
        }
    },


    /* =====================================================
       REQUEST ROUTER
       ===================================================== */

    async processRequest(
        text
    )
    {

        const normalized =
            text
                .toLowerCase()
                .trim();


        /* ================================================
           EXISTING AI CORE
           ================================================ */

        const aiFunctions = [

            window.HalDo?.AI?.ask,

            window.HalDo?.AI?.chat,

            window.HalDo?.AI?.respond,

            window.HalDo?.AI?.process,

            window.HalDo?.AI?.generate,

            window.HalDo?.ai?.ask,

            window.HalDo?.ai?.chat

        ];


        for (
            const fn of aiFunctions
        ) {

            if (
                typeof fn ===
                "function"
            ) {

                try {

                    const result =
                        await fn.call(
                            window.HalDo.AI,
                            text,
                            {
                                language:
                                    this.language,

                                conversation:
                                    this.conversation.slice(
                                        -20
                                    ),

                                system:
                                    "Du bist HalDo AI, ein professioneller, hilfreicher und natürlicher digitaler Assistent des HalDo AI OS."
                            }
                        );


                    if (
                        typeof result ===
                        "string" &&
                        result.trim()
                    ) {

                        return result;
                    }


                    if (
                        result?.text
                    ) {

                        return String(
                            result.text
                        );
                    }

                }

                catch (
                    error
                ) {

                    console.warn(
                        "[HalDo AI] Existing AI handler failed:",
                        error
                    );
                }
            }
        }


        /* ================================================
           LOCAL SYSTEM COMMANDS
           ================================================ */

        if (
            /^(hi|hello|hallo|hey)\b/
                .test(
                    normalized
                )
        ) {

            return this.localized(
                {
                    de:
                        "Hallo! Schön, dass du da bist. Ich bin HalDo AI. Was möchtest du gemeinsam machen?",

                    en:
                        "Hello! I'm HalDo AI. What would you like to do?",

                    ku:
                        "Silav! Ez HalDo AI me. Tu dixwazî çi bikin?",

                    ar:
                        "مرحباً! أنا HalDo AI. كيف يمكنني مساعدتك؟",

                    tr:
                        "Merhaba! Ben HalDo AI. Sana nasıl yardımcı olabilirim?"
                }
            );
        }


        if (
            normalized.includes(
                "einstellung"
            )
        ) {

            this.openSystemApp(
                [
                    "settings",
                    "haldo-settings",
                    "settings-app"
                ]
            );

            return this.localized(
                {
                    de:
                        "Ich öffne die Einstellungen.",

                    en:
                        "I'm opening Settings.",

                    ku:
                        "Ez mîhengên vekim.",

                    ar:
                        "سأفتح الإعدادات.",

                    tr:
                        "Ayarları açıyorum."
                }
            );
        }


        if (
            normalized.includes(
                "app"
            ) ||
            normalized.includes(
                "apps"
            )
        ) {

            this.openSystemApp(
                [
                    "app-launcher",
                    "launcher",
                    "apps"
                ]
            );

            return this.localized(
                {
                    de:
                        "Ich öffne deine Apps.",

                    en:
                        "I'm opening your apps.",

                    ku:
                        "Ez sepanên te vedikim.",

                    ar:
                        "سأفتح تطبيقاتك.",

                    tr:
                        "Uygulamalarını açıyorum."
                }
            );
        }


        if (
            normalized.includes(
                "datei"
            ) ||
            normalized.includes(
                "files"
            ) ||
            normalized.includes(
                "file"
            )
        ) {

            this.openSystemApp(
                [
                    "file-manager",
                    "files",
                    "file-manager-app"
                ]
            );

            return this.localized(
                {
                    de:
                        "Ich öffne den Dateimanager.",

                    en:
                        "I'm opening the file manager.",

                    ku:
                        "Ez rêveberê pelan vedikim.",

                    ar:
                        "سأفتح مدير الملفات.",

                    tr:
                        "Dosya yöneticisini açıyorum."
                }
            );
        }


        /* ================================================
           GENERAL LOCAL RESPONSE
           ================================================ */

        return this.localized(
            {
                de:
                    "Ich habe deine Nachricht verstanden. Für eine vollständige intelligente Antwort verbinde ich diese Oberfläche mit dem vorhandenen HalDo-AI-Core. Du kannst mich fragen, etwas schreiben lassen, Informationen erklären lassen oder mich auffordern, Apps und Systembereiche zu öffnen.",

                en:
                    "I understood your message. This interface is designed to connect to the existing HalDo AI core for full intelligent responses. You can ask questions, have me write something, explain information, or open system areas and apps.",

                ku:
                    "Ez peyama te fam kir. Ev rûber ji bo girêdana bi HalDo AI Core re hatiye amadekirin, da ku bersivên aqilmend bidin, nivîs binivîsin û sepan û beşên pergalê vekin.",

                ar:
                    "لقد فهمت رسالتك. هذه الواجهة مصممة للاتصال بنواة HalDo AI لتقديم إجابات ذكية وكتابة النصوص وشرح المعلومات وفتح التطبيقات وأجزاء النظام.",

                tr:
                    "Mesajını anladım. Bu arayüz, akıllı yanıtlar vermek, metin yazmak, bilgileri açıklamak ve uygulamalarla sistem bölümlerini açmak için mevcut HalDo AI çekirdeğine bağlanacak şekilde tasarlanmıştır."
            }
        );
    },


    /* =====================================================
       OPEN SYSTEM APP
       ===================================================== */

    openSystemApp(
        names
    )
    {

        const candidates =
            Array.isArray(
                names
            )
                ?
            names
                :
            [
                names
            ];


        const managers = [

            window.HalDo?.AppManager,

            window.HalDo?.appManager,

            window.HalDo?.Apps,

            window.HalDo?.apps,

            window.HalDo?.AppRouter,

            window.HalDo?.appRouter

        ];


        for (
            const manager
            of managers
        ) {

            if (
                !manager
            ) {
                continue;
            }


            for (
                const name
                of candidates
            ) {

                const methods = [

                    "openApp",
                    "launchApp",
                    "launch",
                    "open",
                    "start"
                ];


                for (
                    const method
                    of methods
                ) {

                    if (
                        typeof manager?.[method] ===
                        "function"
                    ) {

                        try {

                            manager[method](
                                name
                            );

                            return true;

                        }

                        catch (
                            error
                        ) {

                            console.warn(
                                "[HalDo AI] App open failed:",
                                name,
                                error
                            );
                        }
                    }
                }
            }
        }


        return false;
    },


    /* =====================================================
       QUICK ACTION
       ===================================================== */

    quickAction(
        action
    )
    {

        const map =
        {

            apps:
                "Öffne meine Apps.",

            settings:
                "Öffne die Einstellungen.",

            help:
                "Erkläre mir kurz, was du alles kannst.",

            hello:

        };


        const text =
            map[action];


        if (
            text
        ) {

            this.input.value =
                text;

            this.sendMessage();
        }
    },


    /* =====================================================
       TOOL ACTION
       ===================================================== */

    toolAction(
        action
    )
    {

        const commands =
        {

            apps:
                "Öffne meine Apps.",

            files:
                "Öffne meine Dateien.",

            settings:
                "Öffne die Einstellungen.",

            language:
                "Zeige mir die verfügbaren Sprachen.",

            voice:
                "Aktiviere die Sprachsteuerung."
        };


        if (
            commands[action]
        ) {

            this.input.value =
                commands[action];

            this.sendMessage();
        }
    },


    /* =====================================================
       SPEECH RECOGNITION
       ===================================================== */

    setupSpeechRecognition()
    {

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (
            !Recognition
        ) {
            return;
        }


        this.recognition =
            new Recognition();


        this.recognition.continuous =
            false;

        this.recognition.interimResults =
            false;


        this.recognition.lang =
            this.getSpeechLanguage();


        this.recognition.onstart =
            () => {

                this.setStatus(
                    "Ich höre zu …"
                );
            };


        this.recognition.onresult =
            event => {

                const result =
                    event
                        .results
                        ?.[0]
                        ?.[0]
                        ?.transcript;


                if (
                    result
                ) {

                    this.input.value =
                        result;

                    this.sendMessage();
                }
            };


        this.recognition.onerror =
            error => {

                console.warn(
                    "[HalDo AI Voice]",
                    error
                );

                this.setStatus(
                    "Bereit"
                );
            };


        this.recognition.onend =
            () => {

                if (
                    !this.thinking
                ) {

                    this.setStatus(
                        "Bereit"
                    );
                }
            };
    },


    toggleVoice()
    {

        if (
            !this.recognition
        ) {

            this.setStatus(
                "Spracherkennung nicht verfügbar"
            );

            return;
        }


        try {

            this.recognition.lang =
                this.getSpeechLanguage();

            this.recognition.start();

        }

        catch (
            error
        ) {

            console.warn(
                "[HalDo AI Voice]",
                error
            );
        }
    },


    getSpeechLanguage()
    {

        const map =
        {

            de:
                "de-DE",

            en:
                "en-US",

            ku:
                "ku-TR",

            ar:
                "ar-SA",

            tr:
                "tr-TR"
        };


        return (
            map[
                this.language
            ]
            ||
            "de-DE"
        );
    },


    /* =====================================================
       MULTI LANGUAGE
       ===================================================== */

    setLanguage(
        language
    )
    {

        if (
            typeof language !==
            "string"
        ) {
            return;
        }


        this.language =
            language
                .toLowerCase()
                .split(
                    "-"
                )[0];


        if (
            this.recognition
        ) {

            this.recognition.lang =
                this.getSpeechLanguage();
        }


        window.HalDo.Language =
            window.HalDo.Language ||
            {};

        window.HalDo.Language.current =
            this.language;
    },


    localized(
        translations
    )
    {

        return (
            translations?.[
                this.language
            ]
            ||
            translations?.de
            ||
            translations?.en
            ||
            Object.values(
                translations ||
                {}
            )[0]
            ||
            ""
        );
    },


    /* =====================================================
       OPTIONAL SPEECH OUTPUT
       ===================================================== */

    speakIfEnabled(
        text
    )
    {

        if (
            !text ||
            !window.speechSynthesis
        ) {
            return;
        }


        const settings =
            window.HalDo?.Config
            ||
            window.HalDo?.config
            ||
            {};


        const enabled =
            settings.voiceOutput === true ||
            settings.speechEnabled === true ||
            settings.aiVoice === true;


        if (
            !enabled
        ) {
            return;
        }


        try {

            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            utterance.lang =
                this.getSpeechLanguage();

            utterance.rate =
                .96;

            utterance.pitch =
                1.02;

            utterance.volume =
                .85;


            window.speechSynthesis.speak(
                utterance
            );

        }

        catch (
            error
        ) {

            console.warn(
                "[HalDo AI Speech]",
                error
            );
        }
    }
};

                name:
                    "HalDo-1",

                orbit:
                    116,

                speed:
                    "71s",

                reverse:
                    true,

                type:
                    "extra-1"
            },

            {
                name:
                    "HalDo-2",

                orbit:
                    125,

                speed:
                    "79s",

                reverse:
                    false,

                type:
                    "extra-2"
            },

            {
                name:
                    "HalDo-3",

                orbit:
                    134,

                speed:
                    "87s",

                reverse:
                    true,

                type:
                    "extra-3"
            }

        ],


    /* =====================================================
       INIT
       ===================================================== */

    init()
    {

        if (
            this.initialized
        ) {
            return;
        }


        this.create();

        this.initialized =
            true;
    },


    /* =====================================================
       CREATE
       ===================================================== */

    create()
    {

        if (
            document.querySelector(
                ".haldo-cosmic-world"
            )
        ) {

            this.root =
                document.querySelector(
                    ".haldo-cosmic-world"
                );

            this.system =
                this.root.querySelector(
                    ".haldo-cosmic-system"
                );

            return;
        }


        const host =
            this.findHost();


        if (
            !host
        ) {

            return;
        }


        const world =
            document.createElement(
                "section"
            );

        world.className =
            "haldo-cosmic-world";

        world.setAttribute(
            "aria-label",
            "HalDo Cosmic World"
        );


        world.innerHTML = `

            <div
                class="haldo-cosmic-stars"
            ></div>

            <div
                class="haldo-cosmic-aura"
            ></div>

            <div
                class="haldo-cosmic-system"
                data-haldo-cosmic-system
            >

                <div
                    class="haldo-orbit haldo-orbit-1"
                ></div>

                <div
                    class="haldo-orbit haldo-orbit-2"
                ></div>

                <div
                    class="haldo-orbit haldo-orbit-3"
                ></div>

                <div
                    class="haldo-orbit haldo-orbit-4"
                ></div>

                <div
                    class="haldo-orbit haldo-orbit-5"
                ></div>

                <div
                    class="haldo-orbit haldo-orbit-6"
                ></div>

                <div
                    class="haldo-orbit haldo-orbit-7"
                ></div>

                <div
                    class="haldo-orbit haldo-orbit-8"
                ></div>

                <div
                    class="haldo-orbit haldo-orbit-9"
                ></div>


                <button
                    class="haldo-cosmic-sun"
                    type="button"
                    aria-label="HalDo AI öffnen"
                    data-haldo-sun
                >

                    <span
                        class="haldo-sun-rays"
                    ></span>

                    <span
                        class="haldo-sun-core"
                    >

                        <img
                            class="haldo-sun-logo"
                            src="assets/logo/logo.png"
                            alt="HalDo AI"
                        >

                    </span>

                </button>

            </div>


            <div
                class="haldo-cosmic-label"
            >
                HalDo Cosmic World · HalDo AI
            </div>
        `;


        host.appendChild(
            world
        );


        this.root =
            world;

        this.system =
            world.querySelector(
                "[data-haldo-cosmic-system]"
            );


        this.createPlanets();

        this.bind();
    },


    /* =====================================================
       FIND DISPLAY HOST
       ===================================================== */

    findHost()
    {

        const selectors =
            [

                "[data-haldo-cosmic-world-host]",

                "#cosmic-world",

                "#cosmicWorld",

                ".cosmic-world",

                ".cosmic-world-container",

                "#display",

                ".display",

                "main"

            ];


        for (
            const selector
            of selectors
        ) {

            const element =
                document.querySelector(
                    selector
                );


            if (
                element
            ) {

                return element;
            }
        }


        return document.body;
    },


    /* =====================================================
       PLANETS
       ===================================================== */

    createPlanets()
    {

        if (
            !this.system
        ) {
            return;
        }


        this.planetData.forEach(
            planet => {

                const orbit =
                    document.createElement(
                        "div"
                    );

                orbit.className =
                    "haldo-planet-path " +
                    (
                        planet.reverse
                            ?
                        "reverse"
                            :
                        ""
                    );


                orbit.style.setProperty(
                    "--orbit-speed",
                    planet.speed
                );


                orbit.style.width =
                    planet.orbit +
                    "%";

                orbit.style.height =
                    planet.orbit +
                    "%";


                const holder =
                    document.createElement(
                        "div"
                    );

                holder.className =
                    "haldo-planet-holder";


                const planetElement =
                    document.createElement(
                        "div"
                    );

                planetElement.className =
                    "haldo-planet " +
                    planet.type;

                planetElement.setAttribute(
                    "aria-label",
                    planet.name
                );


                if (
                    planet.moon
                ) {

                    const moonOrbit =
                        document.createElement(
                            "div"
                        );

                    moonOrbit.className =
                        "haldo-moon-orbit";


                    const moon =
                        document.createElement(
                            "div"
                        );

                    moon.className =
                        "haldo-moon";


                    moonOrbit.appendChild(
                        moon
                    );

                    planetElement.appendChild(
                        moonOrbit
                    );
                }


                if (
                    planet.type ===
                    "saturn"
                ) {

                    const ring =
                        document.createElement(
                            "span"
                        );

                    ring.className =
                        "haldo-saturn-ring";

                    planetElement.appendChild(
                        ring
                    );
                }


                holder.appendChild(
                    planetElement
                );

                orbit.appendChild(
                    holder
                );

                this.system.appendChild(
                    orbit
                );
            }
        );
    },


    /* =====================================================
       SUN INTERACTION
       ===================================================== */

    bind()
    {

        const sun =
            this.root?.querySelector(
                "[data-haldo-sun]"
            );


        sun?.addEventListener(
            "click",
            event => {

                event.preventDefault();

                this.openHalDoAI();
            }
        );


        sun?.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" ||
                    event.key ===
                    " "
                ) {

                    event.preventDefault();

                    this.openHalDoAI();
                }
            }
        );
    },


    /* =====================================================
       OPEN HALDO AI
       ===================================================== */

    openHalDoAI()
    {

        if (
            typeof window.HalDo
                ?.openProfessionalAI ===
            "function"
        ) {

            window.HalDo.openProfessionalAI();

            return;
        }


        if (
            typeof window.HalDo
                ?.AI?.open ===
            "function"
        ) {

            window.HalDo.AI.open();

            return;
        }


        const event =
            new CustomEvent(
                "haldo:ai:open",
                {
                    detail:
                    {
                        source:
                            "cosmic-sun"
                    }
                }
            );


        document.dispatchEvent(
            event
        );
    },


    /* =====================================================
       LIVING STATE
       ===================================================== */

    setState(
        state
    )
    {

        if (
            !this.root
        ) {
            return;
        }


        this.root.dataset.haldoState =
            state ||
            "idle";
    }
};


/* =========================================================
   GLOBAL API
   ========================================================= */

window.HalDo.openCosmicWorld =
function()
{

    window.HalDo.CosmicWorld.init();
};


window.HalDo.openHalDoAIFromSun =
function()
{

    window.HalDo.CosmicWorld.init();

    window.HalDo.CosmicWorld.openHalDoAI();
};


/* =========================================================
   INITIALIZATION
   ========================================================= */

function haldoInitializeCosmicWorld()
{

    window.HalDo.CosmicWorld.init();
}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoInitializeCosmicWorld,
        {
            once:
                true
        }
    );

}

else {

    haldoInitializeCosmicWorld();

}
