    <script>
        "use strict";

        /*
         * ========================================================
         * HALDO GLOBAL NAMESPACE
         * ========================================================
         *
         * Alle Core-Systeme greifen auf window.HalDo zu.
         *
         * Die Struktur wird NICHT bei jedem Modul neu erzeugt.
         * Bereits vorhandene Objekte werden erhalten.
         */

        window.HalDo = window.HalDo || {};

        const HD = window.HalDo;


        /*
         * ========================================================
         * SYSTEM IDENTITY
         * ========================================================
         */

        HD.name =
            "HalDo AI OS";

        HD.product =
            "HalDo AI OS 22";

        HD.version =
            "22.0.0";

        HD.versionMajor =
            22;

        HD.codename =
            "Cosmic World";

        HD.build =
            "HALDO-OS-22-MASTER";

        HD.platform =
            "web-pwa";


        /*
         * ========================================================
         * GLOBAL FLAGS
         * ========================================================
         */

        HD.started =
            false;

        HD.ready =
            false;

        HD.booted =
            false;

        HD.online =
            navigator.onLine;

        HD.initialized =
            false;

        HD.shutdownRequested =
            false;


        /*
         * ========================================================
         * TIMING
         * ========================================================
         */

        HD.createdAt =
            Date.now();

        HD.bootTime =
            Date.now();


        /*
         * ========================================================
         * GLOBAL SYSTEM CONTAINERS
         * ========================================================
         *
         * Diese Container bleiben während des gesamten
         * Lebenszyklus von HalDo AI OS bestehen.
         */

        HD.config =
            HD.config || {};

        HD.state =
            HD.state || {};

        HD.system =
            HD.system || {};

        HD.runtime =
            HD.runtime || {};

        HD.events =
            HD.events || {};

        HD.services =
            HD.services || {};

        HD.apps =
            HD.apps || {};

        HD.storage =
            HD.storage || {};

        HD.persistence =
            HD.persistence || {};

        HD.ai =
            HD.ai || {};

        HD.language =
            HD.language || {};

        HD.voice =
            HD.voice || {};

        HD.speech =
            HD.speech || {};

        HD.keyboard =
            HD.keyboard || {};

        HD.cosmic =
            HD.cosmic || {};

        HD.windows =
            HD.windows || {};

        HD.update =
            HD.update || {};

        HD.backup =
            HD.backup || {};

        HD.migration =
            HD.migration || {};

        HD.recovery =
            HD.recovery || {};

        HD.pwa =
            HD.pwa || {};

        HD.network =
            HD.network || {};

        HD.security =
            HD.security || {};

        HD.ui =
            HD.ui || {};


        /*
         * ========================================================
         * GLOBAL CONSTANTS
         * ========================================================
         */

        HD.constants = {

            version:
                "22.0.0",

            storagePrefix:
                "haldo-ai-os-22:",

            defaultLanguage:
                "de",

            defaultTheme:
                "cosmic",

            defaultWindowWidth:
                720,

            defaultWindowHeight:
                480,

            minimumWindowWidth:
                320,

            minimumWindowHeight:
                220,

            maximumWindowWidth:
                1920,

            maximumWindowHeight:
                1200,

            animationEnabled:
                true,

            persistenceEnabled:
                true,

            cosmicWorldEnabled:
                true,

            aiEnabled:
                true,

            voiceEnabled:
                true,

            speechEnabled:
                true,

            offlineEnabled:
                true,

            pwaEnabled:
                true

        };


        /*
         * ========================================================
         * SYSTEM CONFIGURATION
         * ========================================================
         */

        HD.config = {

            ...HD.config,

            product:
                "HalDo AI OS",

            version:
                "22.0.0",

            codename:
                "Cosmic World",

            startupMode:
                "instant",

            startupStatus:
                "online",

            systemStatus:
                "online",

            language:
                "de",

            fallbackLanguage:
                "en",

            theme:
                "cosmic",

            appearance:
                "dark",

            soundEnabled:
                true,

            voiceEnabled:
                true,

            speechEnabled:
                true,

            aiEnabled:
                true,

            animationsEnabled:
                true,

            cosmicWorldEnabled:
                true,

            persistenceEnabled:
                true,

            offlineEnabled:
                true,

            responsiveEnabled:
                true,

            notificationsEnabled:
                true,

            windowSystemEnabled:
                true,

            appSystemEnabled:
                true,

            storageEnabled:
                true,

            autoRestoreApps:
                true,

            autoSaveState:
                true

        };


        /*
         * ========================================================
         * SYSTEM STATE
         * ========================================================
         */

        HD.state = {

            ...HD.state,

            boot:
                "starting",

            status:
                "online",

            mode:
                "desktop",

            activeApp:
                null,

            activeWindow:
                null,

            focusedWindow:
                null,

            menuOpen:
                false,

            notifications:
                [],

            openApps:
                [],

            openWindows:
                [],

            lastRoute:
                null,

            lastUpdate:
                Date.now()

        };


        /*
         * ========================================================
         * SYSTEM INFORMATION
         * ========================================================
         */

        HD.system = {

            ...HD.system,

            id:
                "haldo-system",

            name:
                "HalDo AI OS",

            version:
                "22.0.0",

            codename:
                "Cosmic World",

            status:
                "online",

            mode:
                "desktop",

            initialized:
                true,

            startTime:
                Date.now(),

            getUptime:
                function() {

                    return (
                        Date.now() -
                        this.startTime
                    );

                },

            getStatus:
                function() {

                    return this.status;

                },

            setStatus:
                function(status) {

                    this.status =
                        status;

                    HD.state.status =
                        status;

                    if (
                        typeof HD.emit ===
                        "function"
                    ) {

                        HD.emit(
                            "system:status",
                            {
                                status
                            }
                        );

                    }

                }

        };


        /*
         * ========================================================
         * DEVICE INFORMATION
         * ========================================================
         */

        HD.device = {

            type:
                "unknown",

            width:
                window.innerWidth,

            height:
                window.innerHeight,

            pixelRatio:
                window.devicePixelRatio || 1,

            touch:
                (
                    "ontouchstart" in window
                ) ||
                navigator.maxTouchPoints > 0,

            online:
                navigator.onLine,

            standalone:
                (
                    window.matchMedia &&
                    window.matchMedia(
                        "(display-mode: standalone)"
                    ).matches
                ),

            update:
                function() {

                    this.width =
                        window.innerWidth;

                    this.height =
                        window.innerHeight;

                    this.pixelRatio =
                        window.devicePixelRatio || 1;

                    this.touch =
                        (
                            "ontouchstart" in window
                        ) ||
                        navigator.maxTouchPoints > 0;

                    this.online =
                        navigator.onLine;

                    this.standalone =
                        (
                            window.matchMedia &&
                            window.matchMedia(
                                "(display-mode: standalone)"
                            ).matches
                        );

                    if (
                        this.width < 600
                    ) {

                        this.type =
                            "mobile";

                    }
                    else if (
                        this.width < 1000
                    ) {

                        this.type =
                            "tablet";

                    }
                    else {

                        this.type =
                            "desktop";

                    }

                }

        };


        HD.device.update();


        /*
         * ========================================================
         * GLOBAL ERROR HANDLING
         * ========================================================
         */

        HD.errors = {

            history:
                [],

            report:
                function(
                    error,
                    source = "unknown"
                ) {

                    const entry = {

                        source,

                        message:
                            error &&
                            error.message
                                ? error.message
                                : String(error),

                        time:
                            Date.now()

                    };

                    this.history.push(
                        entry
                    );

                    console.error(
                        "[HalDo]",
                        source,
                        error
                    );

                    if (
                        typeof HD.emit ===
                        "function"
                    ) {

                        HD.emit(
                            "system:error",
                            entry
                        );

                    }

                }

        };


        /*
         * ========================================================
         * GLOBAL WINDOW EVENTS
         * ========================================================
         */

        window.addEventListener(
            "online",
            function() {

                HD.online =
                    true;

                HD.device.online =
                    true;

                HD.system.setStatus(
                    "online"
                );

                if (
                    typeof HD.emit ===
                    "function"
                ) {

                    HD.emit(
                        "network:online"
                    );

                }

            }
        );


        window.addEventListener(
            "offline",
            function() {

                HD.online =
                    false;

                HD.device.online =
                    false;

                HD.system.setStatus(
                    "offline"
                );

                if (
                    typeof HD.emit ===
                    "function"
                ) {

                    HD.emit(
                        "network:offline"
                    );

                }

            }
        );


        window.addEventListener(
            "resize",
            function() {

                HD.device.update();

                if (
                    typeof HD.emit ===
                    "function"
                ) {

                    HD.emit(
                        "device:resize",
                        {
                            width:
                                HD.device.width,

                            height:
                                HD.device.height,

                            type:
                                HD.device.type
                        }
                    );

                }

            }
        );


        /*
         * ========================================================
         * PAGE VISIBILITY
         * ========================================================
         */

        document.addEventListener(
            "visibilitychange",
            function() {

                const visible =
                    document.visibilityState ===
                    "visible";

                if (
                    typeof HD.emit ===
                    "function"
                ) {

                    HD.emit(
                        visible
                            ? "system:visible"
                            : "system:hidden"
                    );

                }

            }
        );


        /*
         * ========================================================
         * DEBUG / BUILD INFORMATION
         * ========================================================
         */

        HD.buildInfo = {

            product:
                "HalDo AI OS 22",

            version:
                "22.0.0",

            codename:
                "Cosmic World",

            architecture:
                "Integrated Modular AI Operating System",

            shell:
                "index.html",

            generated:
                "HalDo Master Architecture",

            status:
                "START · ONLINE"

        };

    </script>

    <script>

        HD.pwa = {

            enabled:
                true,

            supported:
                "serviceWorker" in navigator,

            installed:
                false,

            standalone:
                HD.device.standalone,

            registration:
                null,

            status:
                "online",

            updateAvailable:
                false,

            offline:
                !navigator.onLine,


            setStatus:
                function(
                    status
                ) {

                    this.status =
                        status;

                    HD.emit(
                        "pwa:status",
                        {
                            status
                        }
                    );

                },


            check:
                function()
                {

                    this.offline =
                        !navigator.onLine;

                    this.standalone =
                        (
                            window.matchMedia &&
                            window.matchMedia(
                                "(display-mode: standalone)"
                            ).matches
                        );

                    this.setStatus(
                        this.offline
                            ? "offline"
                            : "online"
                    );

                },


            registerServiceWorker:
                async function()
                {

                    if (
                        !this.supported
                    ) {

                        return null;

                    }

                    /*
                     * Die tatsächliche Registrierung wird
                     * in der finalen PWA-Systemintegration
                     * ausgeführt.
                     */

                    return null;

                }

        };


        HD.pwa.check();

    </script>

<script>
"use strict";

(function () {

    const HD = window.HalDo;

    if (!HD) {
        console.error(
            "[HalDo] Core fehlt – PART 2 kann nicht starten."
        );
        return;
    }


    /* =========================================================
       EVENT BUS
       ========================================================= */

    HD.events =
        HD.events ||
        {};

    HD.events.listeners =
        HD.events.listeners ||
        new Map();


    HD.on =
        function (
            event,
            handler
        ) {

            const name =
                String(
                    event || ""
                ).trim();

            if (
                !name ||
                typeof handler !== "function"
            ) {
                return function () {};
            }

            if (
                !HD.events.listeners.has(
                    name
                )
            ) {

                HD.events.listeners.set(
                    name,
                    new Set()
                );

            }

            const listeners =
                HD.events.listeners.get(
                    name
                );

            listeners.add(
                handler
            );

            return function () {

                listeners.delete(
                    handler
                );

            };

        };


    HD.off =
        function (
            event,
            handler
        ) {

            const name =
                String(
                    event || ""
                ).trim();

            const listeners =
                HD.events.listeners.get(
                    name
                );

            if (!listeners) {
                return false;
            }

            return listeners.delete(
                handler
            );

        };


    HD.emit =
        function (
            event,
            detail
        ) {

            const name =
                String(
                    event || ""
                ).trim();

            if (!name) {
                return false;
            }

            const listeners =
                HD.events.listeners.get(
                    name
                );

            let dispatched =
                false;

            if (listeners) {

                Array.from(
                    listeners
                ).forEach(
                    function (
                        handler
                    ) {

                        try {

                            handler(
                                detail
                            );

                            dispatched =
                                true;

                        }

                        catch (error) {

                            if (
                                HD.errors &&
                                typeof HD.errors.report ===
                                "function"
                            ) {

                                HD.errors.report(
                                    error,
                                    "event:" + name
                                );

                            }

                        }

                    }
                );

            }

            try {

                window.dispatchEvent(
                    new CustomEvent(
                        "haldo:" + name,
                        {
                            detail:
                                detail
                        }
                    )
                );

            }

            catch (error) {

                console.warn(
                    "[HalDo] CustomEvent fehlgeschlagen:",
                    error
                );

            }

            return dispatched;

        };


    /* =========================================================
       ERROR MANAGEMENT
       ========================================================= */

    HD.errors =
        HD.errors ||
        {};

    HD.errors.history =
        HD.errors.history ||
        [];

    HD.errors.maxHistory =
        500;


    HD.errors.report =
        function (
            error,
            source = "unknown",
            metadata = {}
        ) {

            const record = {

                id:
                    "err-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2),

                source:
                    String(
                        source || "unknown"
                    ),

                message:
                    error instanceof Error
                        ? error.message
                        : String(
                            error || "Unknown error"
                        ),

                name:
                    error instanceof Error
                        ? error.name
                        : "Error",

                stack:
                    error instanceof Error
                        ? error.stack || null
                        : null,

                metadata:
                    metadata || {},

                time:
                    Date.now()

            };


            this.history.push(
                record
            );


            if (
                this.history.length >
                this.maxHistory
            ) {

                this.history.splice(
                    0,
                    this.history.length -
                    this.maxHistory
                );

            }


            try {

                console.error(
                    "[HalDo]",
                    record.source,
                    record.message,
                    record
                );

            }

            catch (_) {}


            try {

                HD.emit(
                    "system:error",
                    record
                );

            }

            catch (_) {}


            return record;

        };


    HD.errors.warn =
        function (
            message,
            source = "unknown",
            metadata = {}
        ) {

            const record = {

                source:
                    String(
                        source || "unknown"
                    ),

                message:
                    String(
                        message || ""
                    ),

                metadata:
                    metadata || {},

                time:
                    Date.now()

            };


            try {

                console.warn(
                    "[HalDo]",
                    record.source,
                    record.message
                );

            }

            catch (_) {}


            try {

                HD.emit(
                    "system:warning",
                    record
                );

            }

            catch (_) {}


            return record;

        };


    HD.errors.clear =
        function () {

            this.history =
                [];

            HD.emit(
                "system:errors-cleared"
            );

        };


    HD.errors.last =
        function () {

            return this.history.length
                ? this.history[
                    this.history.length - 1
                ]
                : null;

        };


    /* =========================================================
       GLOBAL ERROR HANDLERS
       ========================================================= */

    window.addEventListener(
        "error",
        function (
            event
        ) {

            HD.errors.report(
                event.error ||
                event.message ||
                "Unknown window error",
                "window.error",
                {
                    filename:
                        event.filename ||
                        null,

                    line:
                        event.lineno ||
                        null,

                    column:
                        event.colno ||
                        null
                }
            );

        }
    );


    window.addEventListener(
        "unhandledrejection",

                "window.unhandledrejection"
            );

        }
    );


    /* =========================================================

       ========================================================= */

    HD.config =
        HD.config ||
        {};


    HD.config.product =
        HD.config.product ||

    HD.config.version =

    Object.assign(

                true,

                true,

                true,

                true,

                true,

                true,

            universalAppRuntime:
                true

        }
    );


    /* =========================================================
       BUILD INFORMATION
       ========================================================= */

    HD.buildInfo =
        HD.buildInfo ||
        {};


    HD.buildInfo.product =
        HD.config.product;


    HD.buildInfo.version =
        HD.config.version;


    HD.buildInfo.codename =
        HD.config.codename;


    HD.buildInfo.edition =
        HD.config.edition;


    HD.buildInfo.timestamp =
        HD.buildInfo.timestamp ||
        Date.now();


    HD.buildInfo.parts =
        16;


    HD.buildInfo.complete =
        true;


    /* =========================================================
       DEVICE INFORMATION
       ========================================================= */

    HD.device =
        HD.device ||
        {};


    HD.device.update =
        function () {

            const width =
                window.innerWidth ||
                document.documentElement
                    .clientWidth ||
                0;

            const height =
                window.innerHeight ||
                document.documentElement
                    .clientHeight ||
                0;


            let type =
                "desktop";


            if (width <= 600) {

                type =
                    "mobile";

            }

            else if (width <= 1024) {

                type =
                    "tablet";

            }


            this.width =
                width;

            this.height =
                height;

            this.type =
                type;

            this.touch =
                "ontouchstart" in window ||
                navigator.maxTouchPoints > 0;

            this.online =
                navigator.onLine;

            this.pixelRatio =
                window.devicePixelRatio ||
                1;

            this.orientation =
                width >= height
                    ? "landscape"
                    : "portrait";


            return this;

        };


    HD.device.update();


    window.addEventListener(
        "resize",
        function () {

            HD.device.update();

            HD.emit(
                "device:resize",
                HD.device
            );

        }
    );


    window.addEventListener(
        "orientationchange",
        function () {

            HD.device.update();

            HD.emit(
                "device:orientation",
                HD.device
            );

        }
    );


    /* =========================================================
       NETWORK STATE
       ========================================================= */

    HD.network =
        HD.network ||
        {};


    HD.network.online =
        navigator.onLine;


    HD.network.update =
        function (
            online
        ) {

            this.online =
                Boolean(
                    online
                );

            HD.device.online =
                this.online;


            HD.emit(
                this.online
                    ? "network:online"
                    : "network:offline",
                {
                    online:
                        this.online,

                    time:
                        Date.now()
                }
            );


            return this.online;

        };


    window.addEventListener(
        "online",
        function () {

            HD.network.update(
                true
            );

        }
    );


    window.addEventListener(
        "offline",
        function () {

            HD.network.update(
                false
            );

        }
    );


    /* =========================================================
       RUNTIME FOUNDATION
       ========================================================= */

    HD.runtime =
        HD.runtime ||
        {};


    HD.runtime.initialized =
        Boolean(
            HD.runtime.initialized
        );


    HD.runtime.started =
        Boolean(
            HD.runtime.started
        );


    HD.runtime.startedAt =
        HD.runtime.startedAt ||
        null;


    HD.runtime.modules =
        HD.runtime.modules ||
        new Map();


    HD.runtime.register =
        function (
            name,
            module
        ) {

            const id =
                String(
                    name || ""
                )
                    .trim()
                    .toLowerCase();


            if (
                !id ||
                !module
            ) {

                return false;

            }


            this.modules.set(
                id,
                module
            );


            HD.emit(
                "runtime:module-registered",
                {
                    name:
                        id,

                    module
                }
            );


            return true;

        };


    HD.runtime.get =
        function (
            name
        ) {

            return this.modules.get(
                String(
                    name || ""
                )
                    .trim()
                    .toLowerCase()
            ) || null;

        };


    HD.runtime.list =
        function () {

            return Array.from(
                this.modules.keys()
            );

        };


    HD.runtime.start =
        async function () {

            if (
                this.started
            ) {

                return true;

            }


            this.startedAt =
                Date.now();


            HD.emit(
                "runtime:start"
            );


            this.initialized =
                true;


            this.started =
                true;


            HD.emit(
                "runtime:started",
                {
                    startedAt:
                        this.startedAt
                }
            );


            return true;

        };


    HD.runtime.stop =
        async function () {

            if (
                !this.started
            ) {

                return true;

            }


            this.started =
                false;

            this.initialized =
                false;


            HD.emit(
                "runtime:stopped"
            );


            return true;

        };


    /* =========================================================
       RUNTIME SYSTEM REGISTRATION
       ========================================================= */

    HD.runtime.register(
        "core",
        {
            name:
                "HalDo Core",

            version:
                HD.config.version,

            initialized:
                true
        }
    );


    /* =========================================================
       SYSTEM READY FOUNDATION
       ========================================================= */

    HD.systemState =
        HD.systemState ||
        {};


    HD.systemState.bootStage =
        HD.systemState.bootStage ||
        "foundation";


    HD.systemState.online =
        navigator.onLine;


    HD.systemState.ready =
        false;


    HD.systemState.updatedAt =
        Date.now();


    HD.systemState.setStage =
        function (
            stage
        ) {

            this.bootStage =
                String(
                    stage || "unknown"
                );

            this.updatedAt =
                Date.now();


            HD.emit(
                "system:boot-stage",
                {
                    stage:
                        this.bootStage,

                    time:
                        this.updatedAt
                }
            );


            return this.bootStage;

        };


    /* =========================================================
       CORE FOUNDATION READY
       ========================================================= */

    HD.systemState.setStage(
        "core-ready"
    );


    HD.emit(
        "ecosystem:part2-ready",
        {
            core:
                true,

            events:
                true,

            errors:
                true,

            config:
                true,

            device:
                true,

            network:
                true,

            runtime:
                true
        }
    );


})();

    /* =========================================================
       CANVAS CREATION
       ========================================================= */

    HD.cosmic.createCanvas =
        function () {

            if (
                this.canvas &&
                document.body.contains(
                    this.canvas
                )
            ) {

                return this.canvas;

            }


            let canvas =
                document.getElementById(
                    "haldo-cosmic-world"
                );


            if (!canvas) {

                canvas =
                    document.createElement(
                        "canvas"
                    );

                canvas.id =
                    "haldo-cosmic-world";

                canvas.setAttribute(
                    "aria-label",
                    "HalDo Cosmic World"
                );

                canvas.setAttribute(
                    "role",
                    "presentation"
                );


                canvas.style.position =
                    "fixed";

                canvas.style.inset =
                    "0";

                canvas.style.width =
                    "100%";

                canvas.style.height =
                    "100%";

                canvas.style.zIndex =
                    "-2";

                canvas.style.pointerEvents =
                    "none";

                canvas.style.background =
                    "#02030a";


                document.body.prepend(
                    canvas
                );

            }


            this.canvas =
                canvas;

            this.ctx =
                canvas.getContext(
                    "2d",
                    {
                        alpha: true
                    }
                );


            this.resize();

            return canvas;

        };


    /* =========================================================
       CANVAS RESIZE
       ========================================================= */

    HD.cosmic.resize =
        function () {

            if (
                !this.canvas ||
                !this.ctx
            ) {

                return;

            }


            const ratio =
                Math.min(
                    window.devicePixelRatio ||
                    1,
                    2
                );


            const width =
                Math.max(
                    window.innerWidth,
                    1
                );


            const height =
                Math.max(
                    window.innerHeight,
                    1
                );


            this.canvas.width =
                Math.floor(
                    width *
                    ratio
                );

            this.canvas.height =
                Math.floor(
                    height *
                    ratio
                );


            this.ctx.setTransform(
                ratio,
                0,
                0,
                ratio,
                0,
                0
            );


            this.width =
                width;

            this.height =
                height;

        };


    /* =========================================================
       WORLD SCALE
       ========================================================= */

    HD.cosmic.getScale =
        function () {

            const width =
                this.width ||
                window.innerWidth;

            const height =
                this.height ||
                window.innerHeight;


            const base =
                Math.min(
                    width,
                    height
                );


            return (
                base /
                900
            ) *
            this.zoom;

        };


    /* =========================================================
       WORLD TO SCREEN
       ========================================================= */

    HD.cosmic.worldToScreen =
        function (
            x,
            y
        ) {

            const scale =
                this.getScale();


            return {

                x:
                    (
                        this.width / 2
                    ) +
                    (
                        x -
                        this.camera.x
                    ) *
                    scale,

                y:
                    (
                        this.height / 2
                    ) +
                    (
                        y -
                        this.camera.y
                    ) *
                    scale

            };

        };


    /* =========================================================
       BACKGROUND
       ========================================================= */

    HD.cosmic.drawBackground =
        function () {

            const ctx =
                this.ctx;

            const width =
                this.width;

            const height =
                this.height;


            const gradient =
                ctx.createRadialGradient(
                    width * 0.5,
                    height * 0.5,
                    0,
                    width * 0.5,
                    height * 0.5,
                    Math.max(
                        width,
                        height
                    )
                );


            gradient.addColorStop(
                0,
                "rgba(10,16,42,1)"
            );

            gradient.addColorStop(
                0.45,
                "rgba(4,7,20,1)"
            );

            gradient.addColorStop(
                1,
                "rgba(1,2,8,1)"
            );


            ctx.fillStyle =
                gradient;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );

        };


    /* =========================================================
       NEBULA RENDERING
       ========================================================= */

    HD.cosmic.drawNebulas =
        function () {

            const ctx =
                this.ctx;

            const scale =
                this.getScale();


            for (
                const nebula of
                this.nebulas
            ) {

                const point =
                    this.worldToScreen(
                        nebula.x,
                        nebula.y
                    );


                const radius =
                    nebula.radius *
                    scale;


                const gradient =
                    ctx.createRadialGradient(
                        point.x,
                        point.y,
                        0,
                        point.x,
                        point.y,
                        radius
                    );


                gradient.addColorStop(
                    0,
                    `hsla(${nebula.hue},80%,65%,${nebula.alpha})`
                );

                gradient.addColorStop(
                    0.45,
                    `hsla(${nebula.hue},75%,55%,${nebula.alpha * 0.45})`
                );

                gradient.addColorStop(
                    1,
                    `hsla(${nebula.hue},70%,45%,0)`
                );


                ctx.fillStyle =
                    gradient;


                ctx.beginPath();

                ctx.arc(
                    point.x,
                    point.y,
                    radius,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }

        };


    /* =========================================================
       STAR RENDERING
       ========================================================= */

    HD.cosmic.drawStars =
        function (
            time
        ) {

            const ctx =
                this.ctx;

            const scale =
                this.getScale();


            for (
                const star of
                this.stars
            ) {

                const point =
                    this.worldToScreen(
                        star.x,
                        star.y
                    );


                if (
                    point.x < -20 ||
                    point.x >
                    this.width + 20 ||
                    point.y < -20 ||
                    point.y >
                    this.height + 20
                ) {

                    continue;

                }


                const twinkle =
                    (
                        Math.sin(
                            time *
                            star.twinkle +
                            star.phase
                        ) + 1
                    ) / 2;


                const alpha =
                    Math.min(
                        1,
                        star.alpha *
                        (
                            0.65 +
                            twinkle *
                            0.35
                        )
                    );


                const size =
                    Math.max(
                        0.45,
                        star.size *
                        (
                            0.7 +
                            scale *
                            0.35
                        )
                    );


                ctx.beginPath();

                ctx.arc(
                    point.x,
                    point.y,
                    size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `hsla(${star.hue},35%,${88 + twinkle * 12}%,${alpha})`;

                ctx.fill();


                if (
                    size > 1.4
                ) {

                    ctx.strokeStyle =
                        `hsla(${star.hue},50%,90%,${alpha * 0.22})`;

                    ctx.lineWidth =
                        0.5;


                    ctx.beginPath();

                    ctx.moveTo(
                        point.x -
                        size * 4,
                        point.y
                    );

                    ctx.lineTo(
                        point.x +
                        size * 4,
                        point.y
                    );

                    ctx.moveTo(
                        point.x,
                        point.y -
                        size * 4
                    );

                    ctx.lineTo(
                        point.x,
                        point.y +
                        size * 4
                    );

                    ctx.stroke();

                }

            }

        };


    /* =========================================================
       ORBIT RENDERING
       ========================================================= */

    HD.cosmic.drawOrbits =
        function () {

            const ctx =
                this.ctx;

            const scale =
                this.getScale();


            for (
                const planet of
                this.planets
            ) {

                const radius =
                    planet.orbit *
                    scale;


                const yRadius =
                    radius *
                    planet.orbitY;


                ctx.save();

                ctx.translate(
                    this.width / 2,
                    this.height / 2
                );

                ctx.rotate(
                    planet.tilt
                );


                ctx.beginPath();

                ctx.ellipse(
                    0,
                    0,
                    radius,
                    yRadius,
                    0,
                    0,
                    Math.PI * 2
                );


                ctx.strokeStyle =
                    "rgba(120,180,255,0.075)";

                ctx.lineWidth =
                    1;


                ctx.setLineDash(
                    [
                        2,
                        8
                    ]
                );

                ctx.stroke();

                ctx.restore();

            }

        };

            );

            glow.addColorStop(

                "rgba(255,100,10,0)"
            );


            ctx.fillStyle =

            ctx.beginPath();

            ctx.arc(
                point.x,

                0,
                Math.PI * 2
            );

    /* =========================================================
       SUN BODY
       ========================================================= */

    HD.cosmic.drawSun =
        function (
            time
        ) {

            const ctx =
                this.ctx;

            const point =
                this.worldToScreen(
                    0,
                    0
                );

            const scale =
                this.getScale();


            const radius =
                this.sun.radius *
                scale;


            const body =
                ctx.createRadialGradient(
                    point.x -
                    radius * 0.25,
                    point.y -
                    radius * 0.25,
                    radius * 0.08,
                    point.x,
                    point.y,
                    radius
                );


            body.addColorStop(
                0,
                "#fffde1"
            );

            body.addColorStop(
                0.18,
                "#fff3a1"
            );

            body.addColorStop(
                0.48,
                "#ffc52f"
            );

            body.addColorStop(
                0.78,
                "#ff8b16"
            );

            body.addColorStop(
                1,
                "#ff4b0b"
            );


            ctx.fillStyle =
                body;


            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * Solar surface movement.
             */

            ctx.save();

            ctx.globalAlpha =
                0.22;


            for (
                let i = 0;
                i < 14;
                i++
            ) {

                const angle =
                    (
                        i *
                        0.73 +
                        time *
                        0.11
                    );


                const x =
                    point.x +
                    Math.cos(angle) *
                    radius *
                    (
                        0.25 +
                        (
                            i % 4
                        ) *
                        0.12
                    );


                const y =
                    point.y +
                    Math.sin(angle * 1.4) *
                    radius *
                    0.6;


                ctx.beginPath();

                ctx.ellipse(
                    x,
                    y,
                    radius *
                    0.06,
                    radius *
                    0.025,
                    angle,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "#fff5a0";

                ctx.fill();

            }

            ctx.restore();


            /*
             * Solar rays.
             */

            ctx.save();

            ctx.translate(
                point.x,
                point.y
            );


            const rayCount =
                this.sun.rays;


            for (
                let i = 0;
                i < rayCount;
                i++
            ) {

                const angle =
                    (
                        i /
                        rayCount
                    ) *
                    Math.PI *
                    2 +
                    time *
                    0.035;


                const length =
                    radius *
                    (
                        1.18 +
                        0.35 *
                        (
                            Math.sin(
                                time *
                                2.1 +
                                i *
                                1.7
                            ) + 1
                        ) /
                        2
                    );


                const inner =
                    radius *
                    1.02;


                ctx.beginPath();

                ctx.moveTo(
                    Math.cos(angle) *
                    inner,
                    Math.sin(angle) *
                    inner
                );

                ctx.lineTo(
                    Math.cos(angle + 0.012) *
                    length,
                    Math.sin(angle + 0.012) *
                    length
                );


                ctx.strokeStyle =
                    `rgba(255,215,75,${0.10 + (i % 4) * 0.025})`;

                ctx.lineWidth =
                    Math.max(
                        0.5,
                        scale * 1.2
                    );

                ctx.stroke();

            }

            ctx.restore();

        };

    /* =========================================================
       PLANET RENDERING
       ========================================================= */

    HD.cosmic.drawPlanet =
        function (
            planet,
            time
        ) {

            const ctx =
                this.ctx;

            const scale =
                this.getScale();


            const point =
                this.worldToScreen(
                    planet.x,
                    planet.y
                );


            const radius =
                Math.max(
                    2,
                    planet.radius *
                    scale
                );


            if (
                point.x < -radius * 4 ||
                point.x >
                this.width +
                radius * 4 ||
                point.y < -radius * 4 ||
                point.y >
                this.height +
                radius * 4
            ) {

                return;

            }


            /*
             * Planet atmosphere glow.
             */

            if (
                planet.atmosphere >
                0
            ) {

                const atmosphere =
                    ctx.createRadialGradient(
                        point.x,
                        point.y,
                        radius * 0.75,
                        point.x,
                        point.y,
                        radius *
                        (
                            1.5 +
                            planet.atmosphere
                        )
                    );


                atmosphere.addColorStop(
                    0,
                    `hsla(${planet.hue},80%,70%,0)`
                );

                atmosphere.addColorStop(
                    0.72,
                    `hsla(${planet.hue},85%,70%,${planet.atmosphere * 0.38})`
                );

                atmosphere.addColorStop(
                    1,
                    `hsla(${planet.hue},90%,70%,0)`
                );


                ctx.fillStyle =
                    atmosphere;


                ctx.beginPath();

                ctx.arc(
                    point.x,
                    point.y,
                    radius *
                    (
                        1.5 +
                        planet.atmosphere
                    ),
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }


            /*
             * Rings behind the planet.
             */

            if (
                planet.rings
            ) {

                ctx.save();

                ctx.translate(
                    point.x,
                    point.y
                );

                ctx.rotate(
                    planet.tilt +
                    0.18
                );


                for (
                    let ring = 0;
                    ring < 4;
                    ring++
                ) {

                    ctx.beginPath();

                    ctx.ellipse(
                        0,
                        0,
                        radius *
                        (
                            1.55 +
                            ring *
                            0.15
                        ),
                        radius *
                        (
                            0.38 +
                            ring *
                            0.035
                        ),
                        0,
                        0,
                        Math.PI * 2
                    );


                    ctx.strokeStyle =
                        `hsla(${planet.hue},45%,75%,${0.22 - ring * 0.035})`;

                    ctx.lineWidth =
                        Math.max(

                ctx.createRadialGradient(

                    point.y -

                    point.y,

                palette[2]

            ctx.arc(
                point.x,
                point.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * Surface bands / continents / clouds.

            ctx.save();

            ctx.beginPath();

            ctx.arc(

                ctx.ellipse(

                    radius *
                    0.27,
                    radius *
                    (
                        0.65 +
                        (
                            i % 2
                        ) *
                        0.12

                    radius *
                    (

                    planet.rotation *

                    Math.PI * 2

                    i < 7;
                    i++

                        0.2 +
                        i *
                        2.1;

                        point.x +
                        Math.cos(a) *

                        0.48;

                        Math.sin(a) *

                        0.55;

                        cy,

                        (

                            0.035

                        0,
                        Math.PI * 2

                        planet.texture ===
                        10

                    ctx.fill();

            ctx.restore();

             * Planet highlight.

            const highlight =
                ctx.createRadialGradient(
                    point.x -
                    radius * 0.38,
                    point.y -
                    radius * 0.42,
                    0,
                    point.x -
                    radius * 0.2,
                    point.y -
                    radius * 0.2,
                    radius

            highlight.addColorStop(
                0,
                "rgba(255,255,255,0.30)"
            );

            highlight.addColorStop(
                0.35,
                "rgba(255,255,255,0.06)"
            );

            highlight.addColorStop(
                1,
                "rgba(255,255,255,0)"
            );


            ctx.fillStyle =
                highlight;


            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /*
             * Planet night-side shadow.
             */

            const shadow =
                ctx.createLinearGradient(
                    point.x -
                    radius,
                    point.y,
                    point.x +

            shadow.addColorStop(

            );


            ctx.fillStyle =
                shadow;


            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();

             * Planet ring foreground.

            if (

                    point.y

                    planet.tilt +

                ctx.ellipse(
                    0,
                    0,
                    radius * 1.65,
                    radius * 0.40,
                    0,
                    Math.PI * 0.08,
                    Math.PI * 0.92

                    `hsla(${planet.hue},50%,82%,0.38)`;

                    Math.max(
                        1,
                        scale * 1.4

                ctx.stroke();

                ctx.restore();

            planet.rotation +=
                0.0025 *
                this.speed;

    /* =========================================================
       MOON RENDERING
       ========================================================= */

    HD.cosmic.drawMoons =
        function (
            planet,
            time
        ) {

            if (
                !planet.moonsData ||
                !planet.moonsData.length
            ) {

                return;

            }


            const scale =
                this.getScale();


            const planetPoint =
                this.worldToScreen(
                    planet.x,
                    planet.y
                );


            for (
                const moon of
                planet.moonsData

                moon.angle +=
                    0.008 *
                    moon.speed *
                    moon.direction *
                    this.speed;


                const orbitX =
                    moon.orbit *
                    scale;


                const orbitY =
                    orbitX *
                    0.62;


                const mx =
                    planetPoint.x +
                    Math.cos(
                        moon.angle
                    ) *
                    orbitX;


                const my =
                    planetPoint.y +
                    Math.sin(
                        moon.angle

                    orbitY;


                /*
                 * Moon orbit.
                 */

                this.ctx.save();

                this.ctx.beginPath();

                this.ctx.ellipse(
                    planetPoint.x,
                    planetPoint.y,
                    orbitX,
                    orbitY,
                    0,
                    0,
                    Math.PI * 2
                );

                this.ctx.strokeStyle =
                    "rgba(180,210,255,0.08)";

                this.ctx.lineWidth =
                    0.5;

                this.ctx.stroke();

                this.ctx.restore();


                /*
                 * Moon body.
                 */

                const radius =
                    moon.radius *
                    scale;


                const moonGradient =
                    this.ctx.createRadialGradient(
                        mx -
                        radius * 0.3,
                        my -
                        radius * 0.3,
                        radius * 0.05,
                        mx,
                        my,
                        radius
                    );


                moonGradient.addColorStop(
                    0,
                    "#eaf3ff"
                );

                moonGradient.addColorStop(
                    0.6,
                    "#aab9cb"
                );

                moonGradient.addColorStop(
                    1,
                    "#4d5b6d"
                );


                this.ctx.fillStyle =
                    moonGradient;


                this.ctx.beginPath();

                this.ctx.arc(
                    mx,
                    my,
                    Math.max(
                        1,
                        radius
                    ),
                    0,
                    Math.PI * 2
                );

                this.ctx.fill();

            }

        };


    /* =========================================================
       PLANET POSITION UPDATE
       ========================================================= */

    HD.cosmic.updatePlanets =
        function (
            delta
        ) {

            const elapsed =
                this.time *
                this.speed;


            for (
                const planet of
                this.planets
            ) {

                const angle =
                    planet.angle +
                    elapsed *
                    0.00004 *
                    planet.speed *
                    planet.direction;


                const eccentricity =
                    planet.eccentricity;


                const distance =
                    planet.orbit *
                    (
                        1 -
                        eccentricity *
                        eccentricity
                    ) /
                    (
                        1 +
                        eccentricity *
                        Math.cos(
                            angle
                        )
                    );


                planet.x =
                    Math.cos(
                        angle
                    ) *
                    distance;


                planet.y =
                    Math.sin(
                        angle
                    ) *
                    distance *
                    planet.orbitY;

            }

        };


    /* =========================================================
       COSMIC FRAME
       ========================================================= */

    HD.cosmic.render =
        function (
            timestamp
        ) {

            if (
                !this.ctx
            ) {

                return;

            }


            const previous =
                this.lastFrame ||
                timestamp;


            const delta =
                Math.min(
                    100,
                    timestamp -
                    previous
                );


            this.lastFrame =
                timestamp;


            this.time +=
                delta;


            this.updatePlanets(
                delta
            );


            this.drawBackground();

            this.drawNebulas();

            this.drawStars(
                timestamp * 0.001
            );

            this.drawOrbits();

            this.drawSunGlow(
                timestamp * 0.001
            );


            /*
             * Render planets sorted by
             * distance for natural depth.
             */

            const visiblePlanets =
                this.planets
                    .slice()
                    .sort(
                        function (
                            a,
                            b
                        ) {

                            return (
                                a.y -
                                b.y
                            );

                        }
                    );


            for (
                const planet of
                visiblePlanets
            ) {

                this.drawMoons(
                    planet,
                    timestamp * 0.001
                );

            }


            for (
                const planet of
                visiblePlanets
            ) {

                this.drawPlanet(
                    planet,
                    timestamp * 0.001
                );

            }


            this.drawSun(
                timestamp * 0.001
            );


            if (
                this.running
            ) {

                this.animationFrame =
                    requestAnimationFrame(
                        this.render.bind(
                            this
                        )
                    );

            }

        };

    HD.cosmic.stop =

                this.animationFrame =

    HD.cosmic.reset =

                0;

       COSMIC ZOOM
       ========================================================= */

    HD.cosmic.setZoom =
        function (
            value
        ) {

            const next =
                Number(
                    value
                );


            if (
                !Number.isFinite(
                    next
                )
            ) {

                return this.zoom;

            }


            this.zoom =
                Math.max(
                    0.35,
                    Math.min(
                        2.5,
                        next

                );


            this.emit(
                "cosmic:zoom",
                {
                    zoom:
                        this.zoom
                }
            );


            return this.zoom;

        };

    if (

                "Gold, Gelb und Weiß",

            facts: [
                "Kristalline Oberflächen",
                "Vier Monde",
                "Ausgeprägtes Ringsystem"
            ]
        }

    };


    cosmic.planetary.catalog =
        planetaryCatalog;


    /* =========================================================
       PLANET DATA NORMALIZATION
       ========================================================= */

    for (
        const planet of
        cosmic.planets
    ) {

        if (
            !planet ||
            !planet.id
        ) {

            continue;

        }


        const key =
            String(
                planet.id
            )
                .trim()
                .toLowerCase();


        planet.data =
            planetaryCatalog[key] ||
            {

                classification:
                    "Unknown Cosmic World",

                description:
                    "Unbekannte Welt im HalDo Cosmic World System.",

                composition:
                    "Nicht bestimmt",

                atmosphere:
                    "Nicht bestimmt",

                surface:
                    "Nicht bestimmt",

                climate:
                    "Nicht bestimmt",

                lifePotential:
                    "Nicht bestimmt",

                color:
                    "Nicht bestimmt",

                facts:
                    []

            };


        cosmic.planetary.catalog[key] =
            planet.data;

    }


    /* =========================================================
       PLANETARY SEARCH
       ========================================================= */

    cosmic.planetary.find =
        function (
            query
        ) {

            const value =
                String(
                    query || ""
                )
                    .trim()
                    .toLowerCase();


            if (!value) {

                return [];

            }


            return this.getAll().filter(
                function (
                    planet
                ) {

                    const haystack =
                        [
                            planet.id,
                            planet.name,
                            planet.type,
                            planet.data &&
                                planet.data.classification,
                            planet.data &&
                                planet.data.description
                        ]
                            .join(" ")
                            .toLowerCase();


                    return haystack.includes(
                        value
                    );

                }
            );

        };


    /* =========================================================
       GET ALL PLANETS
       ========================================================= */

    cosmic.planetary.getAll =
        function () {

            return cosmic.planets.map(
                function (
                    planet
                ) {

                    return cosmic.getPlanetInfo(
                        planet
                    );

                }
            );

        };


    /* =========================================================
       GET COMPLETE PLANET RECORD
       ========================================================= */

    cosmic.planetary.get =
        function (
            id
        ) {

            const planet =
                cosmic.getPlanet(
                    id
                );


            if (!planet) {

                return null;

            }


            return {

                ...cosmic.getPlanetInfo(
                    planet
                ),

                data:
                    planet.data ||
                    null

            };

        };


    /* =========================================================
       SELECT + FOCUS PLANET
       ========================================================= */

    cosmic.planetary.select =
        function (
            id,
            options
        ) {

            const planet =
                cosmic.getPlanet(
                    id
                );


            if (!planet) {

                return null;

            }


            options =
                options ||
                {};


            cosmic.selectPlanet(
                planet
            );


            if (
                options.follow !==
                false
            ) {

                cosmic.followPlanet(
                    planet.id
                );

            }


            if (
                Number.isFinite(
                    options.zoom
                )
            ) {

                cosmic.setZoom(
                    options.zoom
                );

            }


            this.selected =
                planet.id;


            cosmic.emit(
                "cosmic:planet-focus",
                {
                    planet:
                        this.get(
                            planet.id
                        )
                }
            );


            return this.get(
                planet.id
            );

        };


    /* =========================================================
       PLANETARY STATISTICS
       ========================================================= */

    cosmic.planetary.statistics =
        function () {

            const planets =
                cosmic.planets;


            const statistics = {

                total:
                    planets.length,

                terrestrial:
                    0,

                gas:
                    0,

                ice:
                    0,

                exoplanet:
                    0,

                oceanic:
                    0,

                crystal:
                    0,

                rings:
                    0,

                moons:
                    0

            };


            for (
                const planet of
                planets
            ) {

                if (
                    planet.type ===
                    "terrestrial"
                ) {

                    statistics.terrestrial++;

                }

                else if (
                    planet.type ===
                    "gas"
                ) {

                    statistics.gas++;

                }

                else if (
                    planet.type ===
                    "ice"
                ) {

                    statistics.ice++;

                }

                else if (
                    planet.type ===
                    "exoplanet"
                ) {

                    statistics.exoplanet++;

                }

                else if (
                    planet.type ===
                    "oceanic"
                ) {

                    statistics.oceanic++;

                }

                else if (
                    planet.type ===
                    "crystal"
                ) {

                    statistics.crystal++;

                }


                if (
                    planet.rings
                ) {

                    statistics.rings++;

                }


                statistics.moons +=
                    planet.moonsData
                        ? planet.moonsData.length
                        : 0;

            }


            return statistics;

        };


    /* =========================================================
       PLANET PANEL FOUNDATION
       ========================================================= */

    cosmic.planetPanel =

    cosmic.createPlanetPanel =

                panel.innerHTML = `

                Object.assign(

                        boxShadow:

                        backdropFilter:

                        WebkitBackdropFilter:

                        color:

                        fontFamily:
                            "system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"

                    }

                );


                document.body.appendChild(
                    panel

            }


            this.planetPanel.element =
                panel;

            this.planetPanel.initialized =

            this.bindPlanetPanel(

            return panel;

    /* =========================================================

                grid.querySelectorAll(

                );


            if (facts) {

                Object.assign(
                    facts.style,
                    {
                        display:
                            "flex",

                        flexDirection:
                            "column",

                        gap:
                            "5px",

                        fontSize:

                        opacity:

                    }
                );

            const actions =
                panel.querySelector(

                );


            if (actions) {

                Object.assign(

                    );
