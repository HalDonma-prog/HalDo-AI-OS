<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>HalDo AI OS 22</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 35%,rgba(255,205,80,.13),transparent 25%),
        radial-gradient(circle at 20% 80%,rgba(70,130,255,.13),transparent 35%),
        #030914;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* =========================================================
   DESKTOP
   ========================================================= */
#haldo-desktop{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* =========================================================
   LIVING HALDO AI SUN
   ========================================================= */
#haldo-ai-core{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-55%);
    width:min(42vw,430px);
    height:min(42vw,430px);
    min-width:220px;
    min-height:220px;
    display:grid;
    place-items:center;
    pointer-events:none;
}

.haldo-sun{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:
        radial-gradient(circle,
            rgba(255,255,255,.98) 0 7%,
            rgba(255,221,108,.96) 13%,
            rgba(255,183,45,.72) 28%,
            rgba(255,140,30,.18) 55%,
            transparent 72%);
    filter:blur(.2px);
    box-shadow:
        0 0 35px rgba(255,205,80,.8),
        0 0 100px rgba(255,168,40,.35),
        0 0 180px rgba(255,130,30,.15);
    animation:haldo-breathe 4.5s ease-in-out infinite;
}

.haldo-sun:before,
.haldo-sun:after{
    content:"";
    position:absolute;
    inset:-18%;
    border-radius:50%;
    border:1px solid rgba(255,211,100,.12);
    animation:haldo-rotate 18s linear infinite;
}
.haldo-sun:after{
    inset:-30%;
    border-color:rgba(255,180,70,.07);
    animation-duration:27s;
    animation-direction:reverse;
}

#haldo-logo{
    position:relative;
    z-index:2;
    width:42%;
    height:42%;
    object-fit:contain;
    border-radius:50%;
    filter:
        drop-shadow(0 0 10px rgba(255,255,255,.75))
        drop-shadow(0 0 30px rgba(255,190,60,.65));
    animation:haldo-human-breathe 4s ease-in-out infinite;
}

#haldo-ai-state{
    position:absolute;
    z-index:3;
    bottom:5%;
    padding:8px 15px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    background:rgba(3,9,20,.58);
    backdrop-filter:blur(16px);
    color:rgba(255,255,255,.78);
    font-size:12px;
    letter-spacing:.04em;
}

/* =========================================================
   TOP BAR
   ========================================================= */
#haldo-topbar{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:62px;
    z-index:9000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:rgba(3,9,20,.58);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(22px);
}

.top-left,.top-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.haldo-menu-button{
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.13);
    border-radius:13px;
    background:rgba(255,255,255,.06);
    color:white;
    font-size:22px;
    overflow:hidden;
}

.haldo-menu-button img{
    width:29px;
    height:29px;
    object-fit:contain;
}

.haldo-brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:700;
}

.haldo-brand-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#73ffb0;
    box-shadow:0 0 16px #73ffb0;
}

.system-pill{
    padding:8px 11px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    color:rgba(255,255,255,.65);
    font-size:11px;
}

/* =========================================================
   SIDE APP MENU
   ========================================================= */
#haldo-app-menu{
    position:absolute;
    z-index:10000;
    top:0;
    bottom:0;
    left:0;
    width:min(390px,88vw);
    padding:76px 12px 18px;
    transform:translateX(-105%);
    transition:transform .25s ease;
    background:rgba(3,9,20,.92);
    border-right:1px solid rgba(255,255,255,.11);
    backdrop-filter:blur(30px);
    overflow:auto;
}
#haldo-app-menu.open{transform:translateX(0)}

.menu-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}
.menu-title{font-size:18px;font-weight:750}
.menu-close{
    width:36px;height:36px;border:0;border-radius:10px;
    background:rgba(255,255,255,.07);color:#fff;font-size:19px;
}
.menu-search{
    width:100%;
    height:42px;
    margin-bottom:12px;
    padding:0 13px;
    color:white;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    outline:none;
}
.app-menu-item{
    width:100%;
    min-height:47px;
    display:flex;
    align-items:center;
    gap:12px;
    margin:4px 0;
    padding:8px 11px;
    border:1px solid transparent;
    border-radius:12px;
    color:rgba(255,255,255,.86);
    background:transparent;
    text-align:left;
}
.app-menu-item:hover{
    background:rgba(255,255,255,.075);
    border-color:rgba(255,255,255,.08);
}
.app-menu-icon{width:27px;text-align:center;font-size:19px}
.app-menu-name{font-size:13px}

/* =========================================================
   WINDOWS
   ========================================================= */
#haldo-window-layer{
    position:absolute;
    inset:62px 0 58px;
    pointer-events:none;
    z-index:5000;
}
.haldo-window{
    position:absolute;
    min-width:320px;
    min-height:220px;
    display:flex;
    flex-direction:column;
    pointer-events:auto;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    background:linear-gradient(145deg,rgba(11,24,48,.98),rgba(4,11,26,.98));
    box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 60px rgba(80,150,255,.08);
    backdrop-filter:blur(22px);
}
.haldo-window.active{
    border-color:rgba(160,210,255,.28);
    box-shadow:0 35px 100px rgba(0,0,0,.6),0 0 65px rgba(100,170,255,.14);
}
.haldo-window.minimized{
    opacity:0;
    pointer-events:none;
    transform:scale(.94) translateY(25px);
}
.haldo-window.maximized{
    left:0!important;
    top:0!important;
    width:100%!important;
    height:100%!important;
    border-radius:0;
}
.haldo-window-header{
    height:50px;
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8px 0 14px;
    background:rgba(255,255,255,.055);
    border-bottom:1px solid rgba(255,255,255,.08);
    user-select:none;
    cursor:grab;
}
.haldo-window-title{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}
.haldo-window-icon{
    width:30px;height:30px;display:grid;place-items:center;
    border-radius:9px;background:rgba(255,255,255,.08);
    flex:none;
}
.haldo-window-name{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:14px;font-weight:650;
}
.haldo-window-controls{display:flex;gap:4px}
.window-control{
    width:34px;height:32px;border:0;border-radius:9px;
    color:rgba(255,255,255,.75);
    background:transparent;font-size:17px;
}
.window-control:hover{background:rgba(255,255,255,.09);color:white}
.window-control.close:hover{background:rgba(255,70,90,.25)}
.haldo-window-body{
    min-height:0;
    flex:1;
    display:flex;
    flex-direction:column;
}
.haldo-app-toolbar{
    min-height:34px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 13px;
    border-bottom:1px solid rgba(255,255,255,.055);
    font-size:10px;
}
.toolbar-online{color:#75ffb2}
.toolbar-muted{color:rgba(255,255,255,.4)}
.haldo-app-content{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:18px;
}
.haldo-window-resize{
    position:absolute;
    right:2px;bottom:2px;width:20px;height:20px;
    cursor:nwse-resize;
}
.haldo-window-resize:after{
    content:"";
    position:absolute;
    right:3px;bottom:3px;
    width:9px;height:9px;
    border-right:2px solid rgba(255,255,255,.4);
    border-bottom:2px solid rgba(255,255,255,.4);
}

/* =========================================================
   APP UI
   ========================================================= */
.app{
    min-height:100%;
    display:flex;
    flex-direction:column;
    gap:15px;
}
.app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding-bottom:14px;
    border-bottom:1px solid rgba(255,255,255,.08);
}
.app-heading{
    display:flex;
    align-items:center;
    gap:12px;
}
.app-big-icon{
    width:50px;height:50px;
    display:grid;place-items:center;
    border-radius:15px;
    background:rgba(255,255,255,.07);
    font-size:25px;
}
.app h1{font-size:20px;margin:0}
.app p{margin:4px 0 0;color:rgba(255,255,255,.55);line-height:1.5}
.app-status{font-size:10px;color:#75ffb2}
.panel{
    padding:14px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:14px;
    background:rgba(255,255,255,.035);
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
}
.card{
    padding:14px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
    background:rgba(255,255,255,.035);
}
.card strong{display:block;margin-bottom:5px}
.card small{color:rgba(255,255,255,.48);line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.action{
    min-height:38px;
    padding:0 13px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    color:white;
    background:rgba(255,255,255,.055);
}
.action:hover{background:rgba(255,255,255,.11)}
.input,.textarea,.select{
    width:100%;
    color:white;
    background:rgba(0,0,0,.2);
    border:1px solid rgba(255,255,255,.11);
    border-radius:10px;
    outline:none;
    padding:11px 12px;
}
.textarea{min-height:170px;resize:vertical}
.form-grid{display:grid;gap:10px}
.label{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:5px}
.status-box{
    padding:10px 12px;
    border-radius:10px;
    background:rgba(90,255,170,.06);
    border:1px solid rgba(90,255,170,.12);
    color:rgba(255,255,255,.72);
}
.list{display:grid;gap:7px}
.list-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 11px;border-radius:10px;background:rgba(255,255,255,.035);
}

/* =========================================================
   BOTTOM BAR
   ========================================================= */
#haldo-taskbar{
    position:absolute;
    left:0;right:0;bottom:0;height:58px;
    z-index:9000;
    display:flex;align-items:center;
    gap:7px;padding:7px 10px;
    background:rgba(3,9,20,.72);
    border-top:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(22px);
    overflow-x:auto;
}
.task{
    flex:0 0 auto;
    min-width:42px;height:42px;
    padding:0 11px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:11px;
    background:rgba(255,255,255,.05);
    color:white;
}
.task.active{background:rgba(110,170,255,.15)}
#system-clock{margin-left:auto;white-space:nowrap;color:rgba(255,255,255,.62);font-size:11px}

/* =========================================================
   BOOT
   ========================================================= */
#haldo-boot{
    position:fixed;
    inset:0;
    z-index:50000;
    display:grid;
    place-items:center;
    background:#020711;
    transition:opacity .5s ease,visibility .5s ease;
}
#haldo-boot.hide{opacity:0;visibility:hidden}
.boot-content{text-align:center}
.boot-logo{
    width:150px;height:150px;object-fit:contain;
    animation:haldo-human-breathe 2s ease-in-out infinite;
    filter:drop-shadow(0 0 35px rgba(255,190,50,.8));
}
.boot-title{margin-top:18px;font-size:23px;font-weight:800}
.boot-status{margin-top:7px;color:rgba(255,255,255,.5);font-size:12px}

/* =========================================================
   ANIMATION
   ========================================================= */
@keyframes haldo-breathe{
    0%,100%{transform:scale(.96);opacity:.88}
    50%{transform:scale(1.04);opacity:1}
}
@keyframes haldo-human-breathe{
    0%,100%{transform:scale(.97) translateY(0)}
    50%{transform:scale(1.03) translateY(-3px)}
}
@keyframes haldo-rotate{
    to{transform:rotate(360deg)}
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media(max-width:700px){
    #haldo-topbar{height:56px}
    #haldo-window-layer{inset:56px 0 58px}
    .haldo-window{
        min-width:0;
        left:8px!important;
        top:8px!important;
        width:calc(100vw - 16px)!important;
        height:calc(100% - 16px)!important;
        max-width:none;
        border-radius:16px;
    }
    .haldo-window-resize{display:none}
    .haldo-window-header{height:52px;min-height:52px}
    .window-control{width:38px;height:36px}
    .haldo-app-content{padding:13px}
    #haldo-ai-core{
        width:70vw;height:70vw;
        min-width:210px;min-height:210px;
        transform:translate(-50%,-52%);
    }
    .system-pill{display:none}
    #haldo-taskbar{height:56px}
    #system-clock{display:none}
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */
@media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<div id="haldo-boot">
    <div class="boot-content">
        <img id="boot-logo" class="boot-logo"
             src="assets/logo/logo.png"
             alt="HalDo">
        <div class="boot-title">HalDo AI OS 22</div>
        <div id="boot-status" class="boot-status">System wird gestartet …</div>
    </div>
</div>

<div id="haldo-desktop">

    <header id="haldo-topbar">
        <div class="top-left">
            <button id="menu-button" class="haldo-menu-button"
                    title="HalDo AI OS Menü">
                <img src="assets/logo/logo.png" alt="HalDo">
            </button>

            <div class="haldo-brand">
                <span class="haldo-brand-dot"></span>
                <span>HalDo AI</span>
            </div>
        </div>

        <div class="top-right">
            <span id="network-pill" class="system-pill">NETZWERK</span>
            <span id="runtime-pill" class="system-pill">RUNTIME</span>
        </div>
    </header>

    <aside id="haldo-app-menu">
        <div class="menu-head">
            <div class="menu-title">HalDo AI OS</div>
            <button id="menu-close" class="menu-close">×</button>
        </div>

        <input id="app-search" class="menu-search"
               placeholder="App suchen …">

        <div id="app-menu-list"></div>
    </aside>

    <main id="haldo-ai-core">
        <div class="haldo-sun"></div>

        <img id="haldo-logo"
             src="assets/logo/logo.png"
             alt="Lebendiges HalDo AI Logo">

        <div id="haldo-ai-state">HalDo AI • bereit</div>
    </main>

    <section id="haldo-window-layer"></section>

    <footer id="haldo-taskbar">
        <button class="task" id="home-task" title="HalDo AI">☀️</button>
        <div id="window-tasks"></div>
        <span id="system-clock"></span>
    </footer>
</div>

<script>
"use strict";

/* =========================================================
   HALDO AI OS 22
   CENTRAL INDEX RUNTIME
   EIN GEMEINSAMES SYSTEM
   ========================================================= */

(function(){

const HD = window.HalDo = window.HalDo || {};

/* =========================================================
   CONFIG
   ========================================================= */

HD.version = "22.0.0";
HD.name = "HalDo AI OS";
HD.config = Object.assign({
    defaultWindowWidth:720,
    defaultWindowHeight:500,
    minimumWindowWidth:320,
    minimumWindowHeight:220,
    menuPosition:"left"
},HD.config || {});

/* =========================================================
   EVENTS
   ========================================================= */

HD.events = HD.events || new Map();

HD.on = function(name,fn){
    if(typeof fn !== "function") return ()=>{};
    if(!this.events.has(name)) this.events.set(name,new Set());
    this.events.get(name).add(fn);
    return ()=>this.events.get(name)?.delete(fn);
};

HD.off = function(name,fn){
    this.events.get(name)?.delete(fn);
};

HD.emit = function(name,payload={}){
    const listeners=this.events.get(name);
    if(listeners) {
        [...listeners].forEach(fn=>{
            try{fn(payload)}catch(e){console.error("HalDo Event",name,e)}
        });
    }
    window.dispatchEvent(new CustomEvent("haldo:"+name,{detail:payload}));
};

/* compatibility */
HD.events.on=HD.on;
HD.events.off=HD.off;
HD.events.emit=HD.emit;

/* =========================================================
   STORAGE / PERSISTENCE
   ========================================================= */

HD.storage = {
    prefix:"haldo-os22:",
    memory:new Map(),

    set(key,value){
        try{
            localStorage.setItem(
                this.prefix+key,
                JSON.stringify(value)
            );
        }catch(e){
            this.memory.set(key,value);
        }
        return value;
    },

    get(key,fallback=null){
        try{
            const raw=localStorage.getItem(this.prefix+key);
            return raw===null?fallback:JSON.parse(raw);
        }catch(e){
            return this.memory.has(key)
                ?this.memory.get(key)
                :fallback;
        }
    },

    remove(key){
        try{localStorage.removeItem(this.prefix+key)}catch(_){}
        this.memory.delete(key);
    },

    clear(){
        try{
            Object.keys(localStorage)
                .filter(k=>k.startsWith(this.prefix))
                .forEach(k=>localStorage.removeItem(k));
        }catch(_){}
        this.memory.clear();
    }
};

HD.appState={
    get(id){return HD.storage.get("app-state:"+id,{})||{}},
    save(id,state){
        HD.storage.set("app-state:"+id,state||{});
        return true;
    }
};

/* =========================================================
   RUNTIME
   ========================================================= */

HD.runtime={
    initialized:false,
    components:new Map(),

    register(name,component){
        this.components.set(name,component);
        HD.emit("runtime:registered",{name,component});
        return component;
    },

    get(name){return this.components.get(name)||null},

    has(name){return this.components.has(name)},

    start(){
        this.initialized=true;
        HD.emit("runtime:ready",{version:HD.version});
        return true;
    }
};

/* =========================================================
   SECURITY
   ========================================================= */

HD.security={
    authenticated:false,
    user:"local",

    sanitize(value){
        const div=document.createElement("div");
        div.textContent=String(value??"");
        return div.innerHTML;
    },

    confirm(action){
        return window.confirm("HalDo AI OS\n\n"+action+"\n\nFortfahren?");
    }
};
HD.runtime.register("security",HD.security);

/* =========================================================
   NETWORK
   ========================================================= */

HD.network={
    online:navigator.onLine,

    async request(url,options={}){
        return fetch(url,options);
    },

    init(){
        window.addEventListener("online",()=>{
            this.online=true;
            HD.emit("network:online");
            updateSystemPills();
        });
        window.addEventListener("offline",()=>{
            this.online=false;
            HD.emit("network:offline");
            updateSystemPills();
        });
    }
};
HD.network.init();
HD.runtime.register("network",HD.network);

/* =========================================================
   LANGUAGE
   ========================================================= */

HD.language={
    current:HD.storage.get("language","de"),
    supported:[
        "Deutsch","English","Kurdî","Êzîdî",
        "العربية","Türkçe","Français","Español",
        "Italiano","Русский","فارسی",
        "中文","日本語"
    ],

    set(language){
        this.current=language;
        HD.storage.set("language",language);
        HD.emit("language:changed",{language});
    }
};
HD.runtime.register("language",HD.language);

/* =========================================================
   VOICE
   ========================================================= */

HD.voice={
    recognition:null,
    speaking:false,

    speak(text){
        if(!("speechSynthesis" in window)){
            HD.emit("voice:unavailable");
            return false;
        }

        window.speechSynthesis.cancel();

        const utterance=new SpeechSynthesisUtterance(
            String(text||"")
        );

        utterance.lang=HD.language.current==="de"
            ?"de-DE"
            :"en-US";

        utterance.onstart=()=>{
            this.speaking=true;
            HD.emit("voice:start");
        };

        utterance.onend=()=>{
            this.speaking=false;
            HD.emit("voice:end");
        };

        speechSynthesis.speak(utterance);
        return true;
    },

    stop(){
        if("speechSynthesis" in window)
            speechSynthesis.cancel();
        this.speaking=false;
        HD.emit("voice:stop");
    },

    listen(callback){
        const Recognition=
            window.SpeechRecognition||
            window.webkitSpeechRecognition;

        if(!Recognition){
            HD.emit("voice:recognition-unavailable");
            return false;
        }

        const r=new Recognition();
        r.lang=HD.language.current==="de"
            ?"de-DE"
            :"en-US";

        r.interimResults=false;

        r.onresult=e=>{
            const text=e.results?.[0]?.[0]?.transcript||"";
            callback?.(text);
            HD.emit("voice:result",{text});
        };

        r.onerror=e=>HD.emit("voice:error",{error:e});

        r.start();
        this.recognition=r;
        return true;
    }
};
HD.runtime.register("voice",HD.voice);

HD.ai={
    name:"HalDo AI",
    state:"ready",

    setState(state){
        this.state=state;
        const el=document.getElementById("haldo-ai-state");
        if(el) el.textContent="HalDo AI • "+state;
        HD.emit("ai:state",{state});
    },

    answer(input){
        const text=String(input||"").trim();

        if(!text)
            return "Ich bin bereit. Was möchtest du mit HalDo AI machen?";

        const lower=text.toLowerCase();

        if(lower.includes("hallo")||
           lower.includes("hi")||
           lower.includes("hey"))
            return "Hallo. Ich bin HalDo AI. Ich bin bereit, dir zu helfen.";

        if(lower.includes("wer bist du"))
            return "Ich bin HalDo AI, die zentrale intelligente Assistenz des HalDo AI OS 22.";

        if(lower.includes("danke"))
            return "Sehr gerne. 💙❤️";

        if(lower.includes("zeit"))
            return "Die aktuelle Systemzeit ist "+new Date().toLocaleTimeString("de-DE")+".";

        if(lower.includes("app"))
            return "Du kannst jede App über das HalDo AI OS Menü öffnen.";

        return "Ich habe deine Eingabe verstanden. Für externe KI-Dienste kann später ein sicherer AI-Provider über den zentralen AI-Core angebunden werden. Die lokale HalDo-AI-Schicht ist bereits aktiv.";
    },

    chat(input){
        const answer=this.answer(input);
        HD.emit("ai:response",{input,answer});
        return answer;
    }
};

HD.bluetooth={
    supported:"bluetooth" in navigator,
    connected:false,
    devices:[],

    async requestDevice(){
        if(!navigator.bluetooth){
            throw new Error("Web Bluetooth wird auf diesem Gerät/Browser nicht unterstützt.");
        }

        const device=await navigator.bluetooth.requestDevice({
            acceptAllDevices:true
        });

        this.devices.push(device);
        this.connected=true;

        HD.emit("bluetooth:connected",{device});
        return device;
    },

    disconnect(){
        this.connected=false;
        HD.emit("bluetooth:disconnected");
    }
};

};

HD.appRegistry={
    apps:new Map(),

    register(manifest){
        if(!manifest?.id) return false;
        this.apps.set(manifest.id,manifest);
        return true;
    },

    get(id){return this.apps.get(id)||null},

    all(){return [...this.apps.values()]},

    search(query){
        const q=String(query||"").toLowerCase();
        return this.all().filter(app=>
            app.name.toLowerCase().includes(q)||
            app.id.toLowerCase().includes(q)||
            String(app.description||"").toLowerCase().includes(q)
        );
    }
};

HD.appRuntime={
    instances:new Map(),

    get(id){return this.instances.get(id)||null},

    create(manifest){
        if(!manifest) return null;

        const existing=this.get(manifest.id);
        if(existing) return existing;

        const state=HD.appState.get(manifest.id);

        const instance={
            id:manifest.id,
            name:manifest.name,
            icon:manifest.icon,
            manifest,
            state,
            opened:false,
            active:false,
            minimized:false,
            maximized:false,
            closed:true,

            open(){
                this.opened=true;
                this.closed=false;
                this.active=true;
                this.minimized=false;
                HD.emit("app:opened",{app:this});
                return this;
            },

            activate(){
                this.active=true;
                this.minimized=false;
                HD.emit("app:activated",{app:this});
                return this;
            },

            minimize(){
                this.minimized=true;
                this.active=false;
                HD.emit("app:minimized",{app:this});
                return this;
            },

            restore(){
                this.minimized=false;
                this.closed=false;
                this.opened=true;
                this.active=true;
                HD.emit("app:restored",{app:this});
                return this;
            },

            maximize(){
                this.maximized=true;
                this.minimized=false;
                this.active=true;
                HD.emit("app:maximized",{app:this});
                return this;
            },

            unmaximize(){
                this.maximized=false;
                HD.emit("app:unmaximized",{app:this});
                return this;
            },

            close(){
                this.save();
                this.opened=false;
                this.closed=true;
                this.active=false;
                this.minimized=false;
                HD.emit("app:closed",{app:this});
                return this;
            },

            setState(key,value){
                this.state=this.state||{};
                this.state[key]=value;
                HD.appState.save(this.id,this.state);
                HD.emit("app:state-change",{
                    app:this,key,value
                });
                return value;
            },

            getState(key,fallback=null){
                return Object.prototype.hasOwnProperty.call(
                    this.state||{},key
                )?this.state[key]:fallback;
            },

            save(){
                HD.appState.save(this.id,this.state||{});
                HD.emit("app:saved",{app:this});
                return true;
            }
        };

        this.instances.set(manifest.id,instance);
        return instance;
    }
};

HD.runtime.register("app-runtime",HD.appRuntime);

    Object.assign(el.style,{

        left:"50%",
        bottom:"76px",

        zIndex:60000,

    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2600);
}

/* =========================================================
   WINDOW SYSTEM
   ========================================================= */

HD.windowSystem={
    windows:new Map(),
    zIndex:100,
    activeWindowId:null,
    initialized:false,

    create(instance){
        if(!instance)return null;

        let existing=this.getByApp(instance.id);

        if(existing){
            this.restore(existing.id);
            this.focus(existing.id);
            return existing;
        }

        const manifest=instance.manifest;
        const saved=HD.storage.get(
            "window-state:"+instance.id,
            {}
        );

        const record={
            id:"window-"+instance.id+"-"+Date.now(),
            appId:instance.id,
            title:manifest.name,
            icon:manifest.icon,
            x:Number.isFinite(saved.x)?saved.x:null,
            y:Number.isFinite(saved.y)?saved.y:null,
            width:Number.isFinite(saved.width)
                ?saved.width
                :HD.config.defaultWindowWidth,
            height:Number.isFinite(saved.height)
                ?saved.height
                :HD.config.defaultWindowHeight,
            minimized:false,
            maximized:!!saved.maximized,
            closed:false,
            zIndex:++this.zIndex,
            element:null,
            content:null
        };

        this.windows.set(record.id,record);

        this.render(record,instance);
        this.focus(record.id);

        HD.emit("window:opened",{window:record});
        return record;
    },

    getByApp(appId){
        return [...this.windows.values()]
            .find(w=>w.appId===appId&&!w.closed)||null;
    },

    get(id){
        return this.windows.get(id)||null;
    },

    all(){
        return [...this.windows.values()]
            .filter(w=>!w.closed);
    },

    render(record,instance){
        const layer=document.getElementById("haldo-window-layer");
        if(!layer)return;

        const el=document.createElement("article");
        el.className="haldo-window";
        el.dataset.windowId=record.id;
        el.dataset.appId=record.appId;

        el.innerHTML=`
            <div class="haldo-window-header">
                <div class="haldo-window-title">
                    <span class="haldo-window-icon"></span>
                    <span class="haldo-window-name"></span>
                </div>

                <div class="haldo-window-controls">
                    <button class="window-control minimize">−</button>
                    <button class="window-control maximize">□</button>
                    <button class="window-control close">×</button>
                </div>
            </div>

            <div class="haldo-window-body">
                <div class="haldo-app-toolbar">
                    <span class="toolbar-online">● ONLINE</span>
                    <span class="toolbar-muted"></span>
                </div>
                <div class="haldo-app-content"></div>
            </div>

            <div class="haldo-window-resize"></div>
        `;

        el.querySelector(".haldo-window-icon").textContent=record.icon;
        el.querySelector(".haldo-window-name").textContent=record.title;
        el.querySelector(".toolbar-muted").textContent=record.title;

        layer.appendChild(el);

        record.element=el;
        record.content=el.querySelector(".haldo-app-content");

        this.applyPosition(record);
        this.applySize(record);

        HD.appUI.render(instance,record.content);

        this.bind(record);
    },

    bind(record){
        const el=record.element;
        const header=el.querySelector(".haldo-window-header");

        el.addEventListener("pointerdown",()=>{
            this.focus(record.id);
        });

        el.querySelector(".minimize").onclick=e=>{
            e.stopPropagation();
            this.minimize(record.id);
        };

        el.querySelector(".maximize").onclick=e=>{
            e.stopPropagation();
            record.maximized
                ?this.restore(record.id)
                :this.maximize(record.id);
        };

        el.querySelector(".close").onclick=e=>{
            e.stopPropagation();
            HD.appManager.close(record.appId);
        };

        header.ondblclick=()=>{
            record.maximized
                ?this.restore(record.id)
                :this.maximize(record.id);
        };

        let dragging=false;
        let sx=0,sy=0,ox=0,oy=0;

        header.addEventListener("pointerdown",e=>{
            if(e.target.closest(".haldo-window-controls"))return;
            if(record.maximized)return;

            dragging=true;
            sx=e.clientX;
            sy=e.clientY;
            ox=record.x;
            oy=record.y;

            header.setPointerCapture(e.pointerId);
        });

        header.addEventListener("pointermove",e=>{
            if(!dragging)return;

            record.x=ox+(e.clientX-sx);
            record.y=oy+(e.clientY-sy);

            this.clamp(record);
            this.applyPosition(record);
        });

        header.addEventListener("pointerup",e=>{
            dragging=false;
            try{header.releasePointerCapture(e.pointerId)}catch(_){}
            this.saveState(record);
        });

        const resize=el.querySelector(".haldo-window-resize");

        let resizing=false;
        let rsx=0,rsy=0,rw=0,rh=0;

        resize.addEventListener("pointerdown",e=>{
            if(record.maximized)return;

            resizing=true;
            rsx=e.clientX;
            rsy=e.clientY;
            rw=record.width;
            rh=record.height;

            resize.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        resize.addEventListener("pointermove",e=>{
            if(!resizing)return;

            record.width=Math.max(
                HD.config.minimumWindowWidth,
                rw+e.clientX-rsx
            );

            record.height=Math.max(
                HD.config.minimumWindowHeight,
                rh+e.clientY-rsy
            );

            this.applySize(record);
            this.clamp(record);
        });

        resize.addEventListener("pointerup",e=>{
            resizing=false;
            try{resize.releasePointerCapture(e.pointerId)}catch(_){}
            this.saveState(record);
        });
    },

    clamp(record){
        const width=window.innerWidth;
        const height=window.innerHeight-62-58;

        record.x=Math.max(
            0,
            Math.min(
                record.x||0,
                Math.max(0,width-record.width)
            )
        );

        record.y=Math.max(
            0,
            Math.min(
                record.y||0,
                Math.max(0,height-record.height)
            )
        );
    },

    applyPosition(record){
        if(!record.element)return;
        if(record.x===null)
            record.x=Math.max(
                10,
                (window.innerWidth-record.width)/2
            );
        if(record.y===null)
            record.y=Math.max(
                10,
                (window.innerHeight-120-record.height)/2
            );

        record.element.style.left=record.x+"px";
        record.element.style.top=record.y+"px";
    },

    applySize(record){
        if(!record.element)return;
        record.element.style.width=record.width+"px";
        record.element.style.height=record.height+"px";
    },

    focus(id){
        const record=this.get(id);
        if(!record)return;

        record.zIndex=++this.zIndex;
        this.activeWindowId=id;

        this.windows.forEach(w=>{
            w.element?.classList.remove("active");
        });

        record.element?.classList.add("active");
        record.element&&(record.element.style.zIndex=record.zIndex);

        this.updateTasks();

        const instance=HD.appRuntime.get(record.appId);
        instance?.activate();

        HD.emit("window:focused",{window:record});
    },

    minimize(id){
        const record=this.get(id);
        if(!record)return;

        record.minimized=true;
        record.element?.classList.add("minimized");

        HD.appRuntime.get(record.appId)?.minimize();

        this.saveState(record);
        this.updateTasks();

        HD.emit("window:minimized",{window:record});
    },

    restore(id){
        const record=this.get(id);
        if(!record)return;

        record.minimized=false;
        record.maximized=false;

        record.element?.classList.remove(
            "minimized","maximized"
        );

        this.applyPosition(record);
        this.applySize(record);
        this.focus(id);

        HD.appRuntime.get(record.appId)?.restore();

        this.saveState(record);
        this.updateTasks();
    },

    maximize(id){
        const record=this.get(id);
        if(!record)return;

        record.minimized=false;
        record.maximized=true;

        record.element?.classList.remove("minimized");
        record.element?.classList.add("maximized");

        this.focus(id);
        HD.appRuntime.get(record.appId)?.maximize();

        this.saveState(record);
        this.updateTasks();
    },

    close(id){
        const record=this.get(id);
        if(!record)return false;

        record.closed=true;
        record.element?.remove();

        this.windows.delete(id);

        this.saveState(record);
        this.updateTasks();

        HD.emit("window:closed",{window:record});
        return true;
    },

    closeApp(appId){
        const record=this.getByApp(appId);
        if(record)this.close(record.id);
    },

    closeAll(){
        this.all().forEach(w=>this.close(w.id));
    },

    saveState(record){
        HD.storage.set(
            "window-state:"+record.appId,
            {
                x:record.x,
                y:record.y,
                width:record.width,
                height:record.height,
                maximized:record.maximized
            }
        );
    },

    updateTasks(){
        const container=document.getElementById("window-tasks");
        if(!container)return;

        container.innerHTML="";

        this.all().forEach(record=>{
            const button=document.createElement("button");
            button.className="task"+
                (record.id===this.activeWindowId?" active":"");

            button.textContent=record.icon+" "+record.title;

            button.onclick=()=>{
                record.minimized
                    ?this.restore(record.id)
                    :this.focus(record.id);
            };

            container.appendChild(button);
        });
    }
};

HD.windowManager=HD.windowSystem;
HD.runtime.register("window-system",HD.windowSystem);

/* =========================================================
   APP MANAGER
   ========================================================= */

HD.appManager={

    open(appId){
        const manifest=HD.appRegistry.get(appId);
        if(!manifest)return null;

        let instance=HD.appRuntime.get(appId);

        if(!instance)
            instance=HD.appRuntime.create(manifest);

        instance.open();

        const window=HD.windowSystem.create(instance);

        instance.windowId=window?.id||null;

        HD.emit("app:open",{app:instance,window});
        return instance;
    },

    close(appId){
        const instance=HD.appRuntime.get(appId);
        HD.windowSystem.closeApp(appId);

        if(instance)
            instance.close();

        HD.emit("app:close",{app:instance,appId});
        return true;
    },

    minimize(appId){
        const w=HD.windowSystem.getByApp(appId);
        if(w)HD.windowSystem.minimize(w.id);
    },

    restore(appId){
        const w=HD.windowSystem.getByApp(appId);
        if(w)HD.windowSystem.restore(w.id);
    },

    maximize(appId){
        const w=HD.windowSystem.getByApp(appId);
        if(w)HD.windowSystem.maximize(w.id);
    },

    get(appId){
        return HD.appRuntime.get(appId);
    },

    all(){
        return HD.appRuntime.instances;
    },

    closeAll(){
        HD.windowSystem.closeAll();
        HD.appRuntime.instances.forEach(i=>i.close());
    }
};

HD.runtime.register("app-manager",HD.appManager);

HD.router={
    current:null,
    history:[],

    open(appId){
        if(!HD.appRegistry.get(appId))return false;

        this.history.push(appId);
        this.current=appId;
        HD.appManager.open(appId);

        HD.emit("router:navigate",{appId});
        return true;
    },

    back(){
        if(this.history.length<2)return false;

        this.history.pop();
        const id=this.history[this.history.length-1];

        this.current=id;
        HD.appManager.open(id);
        return true;
    }
};

HD.runtime.register("router",HD.router);

/* =========================================================
   GLOBAL API
   ========================================================= */

HD.openWindow=id=>HD.router.open(id);
HD.closeWindow=id=>HD.appManager.close(id);
HD.minimizeWindow=id=>HD.appManager.minimize(id);
HD.restoreWindow=id=>HD.appManager.restore(id);
HD.maximizeWindow=id=>HD.appManager.maximize(id);

/* =========================================================
   APP MENU
   ========================================================= */

function renderAppMenu(query=""){
    const list=document.getElementById("app-menu-list");
    if(!list)return;

    list.innerHTML="";

    HD.appRegistry.search(query).forEach(app=>{
        const button=document.createElement("button");
        button.className="app-menu-item";

        const icon=document.createElement("span");
        icon.className="app-menu-icon";
        icon.textContent=app.icon;

        const name=document.createElement("span");
        name.className="app-menu-name";
        name.textContent=app.name;

        button.append(icon,name);

        button.onclick=()=>{
            HD.router.open(app.id);
            document.getElementById("haldo-app-menu")
                .classList.remove("open");
        };

        list.appendChild(button);
    });
}

document.getElementById("menu-button").onclick=()=>{
    document.getElementById("haldo-app-menu")
        .classList.add("open");
};

document.getElementById("menu-close").onclick=()=>{
    document.getElementById("haldo-app-menu")
        .classList.remove("open");
};

document.getElementById("app-search").addEventListener(
    "input",
    e=>renderAppMenu(e.target.value)
);

document.getElementById("home-task").onclick=()=>{
    HD.router.open("haldo-ai");
};

/* =========================================================
   SYSTEM UI
   ========================================================= */

function updateSystemPills(){
    document.getElementById("network-pill").textContent=
        HD.network.online?"🌐 ONLINE":"🌐 OFFLINE";

    document.getElementById("runtime-pill").textContent=
        HD.runtime.initialized
            ?"RUNTIME ONLINE"
            :"RUNTIME STARTING";
}

function updateClock(){
    document.getElementById("system-clock")
        .textContent=
        new Date().toLocaleString(
            "de-DE",
            {
                dateStyle:"short",
                timeStyle:"short"
            }
        );
}

setInterval(updateClock,1000);
updateClock();

/* =========================================================
   INITIALIZATION
   ========================================================= */

async function boot(){

    const boot=document.getElementById("haldo-boot");
    const status=document.getElementById("boot-status");

    const steps=[
        "Runtime wird geladen …",
        "App-System wird verbunden …",
        "Window-System wird geladen …",
        "Router wird verbunden …",
        "Storage wird initialisiert …",
        "Voice und Language werden verbunden …",
        "Connectivity wird initialisiert …",
        "HalDo AI wird aktiviert …"
    ];

    for(const step of steps){
        status.textContent=step;
        await new Promise(r=>setTimeout(r,100));
    }

    HD.runtime.start();

    HD.windowSystem.initialized=true;

    renderAppMenu();
    updateSystemPills();

    HD.ai.setState("bereit");

    HD.emit("system:ready",{
        version:HD.version,
        apps:HD.appRegistry.all().length
    });

    status.textContent=
        "HalDo AI OS 22 • ONLINE";

    await new Promise(r=>setTimeout(r,450));

    boot.classList.add("hide");

    /* zentraler Start */
    HD.router.open("haldo-ai");
}

/* =========================================================
   GLOBAL ERROR BRIDGE
   ========================================================= */

window.addEventListener("error",event=>{
    HD.emit("system:error",{
        message:event.message,
        filename:event.filename,
        line:event.lineno
    });
});

window.addEventListener("unhandledrejection",event=>{
    HD.emit("system:error",{
        message:String(event.reason)
    });
});

/* =========================================================
   START
   ========================================================= */

if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",boot,{once:true});
}else{
    boot();
}

})();
</script>
