<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#020611"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – Cosmic Intelligent Operating System"
    >

    <meta
        name="application-name"
        content="HalDo AI OS 20"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS"
    >

    <title>HalDo AI OS 20</title>

    <style>

        /* =========================================================
           HALDO AI OS 20
           CENTRAL INDEX SHELL
           PART 1 / 8

           ARCHITECTURE
           ---------------------------------------------------------
           Shell
             ↓
           Core Runtime
             ↓
           Event Bus
             ↓
           Services
             ↓
           App Registry
             ↓
           App Runtime
             ↓
           Window Manager
             ↓
           Applications
           ========================================================= */


        /* =========================================================
           ROOT DESIGN SYSTEM
           ========================================================= */

        :root {

            --haldo-bg:
                #020611;

            --haldo-bg-2:
                #050d1c;

            --haldo-bg-3:
                #081225;

            --haldo-panel:
                rgba(7, 17, 34, 0.82);

            --haldo-panel-strong:
                rgba(5, 14, 29, 0.96);

            --haldo-panel-soft:
                rgba(255, 255, 255, 0.045);

            --haldo-border:
                rgba(125, 222, 255, 0.20);

            --haldo-border-bright:
                rgba(125, 222, 255, 0.46);

            --haldo-text:
                #f1fbff;

            --haldo-text-soft:
                #b9cfdd;

            --haldo-text-muted:
                #7891a4;

            --haldo-cyan:
                #69ddff;

            --haldo-blue:
                #438dff;

            --haldo-violet:
                #9074ff;

            --haldo-pink:
                #e276ff;

            --haldo-green:
                #62e8ad;

            --haldo-yellow:
                #ffd76a;

            --haldo-red:
                #ff6680;

            --haldo-radius-small:
                10px;

            --haldo-radius:
                18px;

            --haldo-radius-large:
                26px;

            --haldo-shadow:
                0 30px 90px rgba(0, 0, 0, 0.48);

            --haldo-shadow-small:
                0 12px 35px rgba(0, 0, 0, 0.28);

            --haldo-glow:
                0 0 35px rgba(105, 221, 255, 0.18);

            --haldo-transition:
                180ms ease;

            --haldo-font:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            --haldo-safe-top:
                env(safe-area-inset-top, 0px);

            --haldo-safe-right:
                env(safe-area-inset-right, 0px);

            --haldo-safe-bottom:
                env(safe-area-inset-bottom, 0px);

            --haldo-safe-left:
                env(safe-area-inset-left, 0px);

            /*
             * Fenster-Grundgrößen.
             * Diese Werte werden später vom Window Manager
             * dynamisch verändert.
             */

            --haldo-window-width:
                min(760px, calc(100vw - 140px));

            --haldo-window-height:
                min(560px, calc(100vh - 120px));

            --haldo-window-min-width:
                300px;

            --haldo-window-min-height:
                220px;

            --haldo-dock-width:
                76px;

            --haldo-topbar-height:
                60px;
        }


        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background:
                var(--haldo-bg);

            color-scheme: dark;
        }


        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            color:
                var(--haldo-text);

            background:
                var(--haldo-bg);

            font-family:
                var(--haldo-font);

            -webkit-font-smoothing:
                antialiased;

            text-rendering:
                optimizeLegibility;

            overscroll-behavior:
                none;

            touch-action:
                manipulation;
        }


        button,
        input,
        textarea,
        select {
            font:
                inherit;
        }


        button {
            color:
                inherit;

            border:
                0;
        }


        button,
        [role="button"] {
            -webkit-tap-highlight-color:
                transparent;

            user-select:
                none;
        }


        input,
        textarea,
        select {
            color:
                var(--haldo-text);

            background:
                rgba(255, 255, 255, 0.045);

            border:
                1px solid var(--haldo-border);

            outline:
                none;
        }


        input:focus,
        textarea:focus,
        select:focus {
            border-color:
                var(--haldo-border-bright);

            box-shadow:
                0 0 0 3px
                rgba(105, 221, 255, 0.08);
        }


        ::selection {
            background:
                rgba(105, 221, 255, 0.25);
        }


        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }


        ::-webkit-scrollbar-track {
            background:
                transparent;
        }


        ::-webkit-scrollbar-thumb {
            background:
                rgba(105, 221, 255, 0.18);

            border-radius:
                20px;
        }


        ::-webkit-scrollbar-thumb:hover {
            background:
                rgba(105, 221, 255, 0.32);
        }


        /* =========================================================
           MAIN OPERATING SYSTEM
           ========================================================= */

        #haldo-os {

            position:
                fixed;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            isolation:
                isolate;

            background:

                radial-gradient(
                    circle at 50% 50%,
                    rgba(28, 75, 132, 0.28),
                    transparent 34%
                ),

                radial-gradient(
                    circle at 15% 5%,
                    rgba(100, 71, 220, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(25, 123, 180, 0.13),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #020611 0%,
                    #030a17 48%,
                    #02050d 100%
                );
        }


        /* =========================================================
           COSMIC WORLD
           ========================================================= */

        #haldo-cosmic-world {

            position:
                absolute;

            inset:
                0;

            overflow:
                hidden;

            z-index:
                1;

            pointer-events:
                auto;

            transition:
                opacity 350ms ease,
                filter 350ms ease;
        }


        #haldo-cosmic-world.hidden {

            opacity:
                0;

            pointer-events:
                none;
        }


        #haldo-cosmic-world.dimmed {

            filter:
                brightness(0.62)
                saturate(0.85);
        }


        /* =========================================================
           STAR FIELD
           ========================================================= */

        #haldo-stars {

            position:
                absolute;

            inset:
                0;

            overflow:
                hidden;

            pointer-events:
                none;
        }


        .haldo-star {

            position:
                absolute;

            display:
                block;

            width:
                2px;

            height:
                2px;

            border-radius:
                50%;

            background:
                rgba(255, 255, 255, 0.9);

            box-shadow:
                0 0 6px
                rgba(180, 235, 255, 0.85);

            animation:
                haldo-star-twinkle
                var(--star-duration, 4s)
                ease-in-out
                infinite;
        }


        @keyframes haldo-star-twinkle {

            0%,
            100% {
                opacity:
                    var(--star-opacity, 0.7);

                transform:
                    scale(1);
            }

            50% {
                opacity:
                    0.12;

                transform:
                    scale(0.45);
            }
        }


        /* =========================================================
           GALAXIES
           ========================================================= */

        .haldo-galaxy {

            position:
                absolute;

            width:
                520px;

            height:
                520px;

            border-radius:
                50%;

            opacity:
                0.16;

            pointer-events:
                none;

            filter:
                blur(1px);

            background:

                radial-gradient(
                    ellipse at center,
                    rgba(190, 150, 255, 0.48) 0%,
                    rgba(90, 160, 255, 0.24) 18%,
                    rgba(30, 100, 210, 0.12) 38%,
                    transparent 70%
                );

            transform:
                rotate(-25deg)
                scaleX(1.7);

            animation:
                haldo-galaxy-drift
                55s
                linear
                infinite;
        }


        .haldo-galaxy::before,
        .haldo-galaxy::after {

            content:
                "";

            position:
                absolute;

            inset:
                15%;

            border-radius:
                50%;

            border:
                1px solid
                rgba(190, 160, 255, 0.15);

            transform:
                rotate(25deg)
                scaleX(1.8);
        }


        .haldo-galaxy::after {

            inset:
                28%;

            border-color:
                rgba(100, 220, 255, 0.16);
        }


        .haldo-galaxy.one {

            left:
                -230px;

            top:
                12%;
        }


        .haldo-galaxy.two {

            right:
                -260px;

            bottom:
                -120px;

            transform:
                rotate(18deg)
                scaleX(1.55);

            animation-duration:
                70s;
        }


        @keyframes haldo-galaxy-drift {

            from {
                transform:
                    rotate(-25deg)
                    scaleX(1.7);
            }

            to {
                transform:
                    rotate(335deg)
                    scaleX(1.7);
            }
        }


        /* =========================================================
           COSMIC SUN SYSTEM
           ========================================================= */

        #haldo-sun-system {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                180px;

            height:
                180px;

            transform:
                translate(-50%, -50%);

            z-index:
                20;

            pointer-events:
                none;
        }


        #haldo-sun-glow-outer {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                430px;

            height:
                430px;

            transform:
                translate(-50%, -50%);

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle,
                    rgba(255, 235, 139, 0.22) 0%,
                    rgba(255, 176, 67, 0.12) 32%,
                    rgba(255, 99, 44, 0.06) 50%,
                    transparent 72%
                );

            filter:
                blur(7px);

            animation:
                haldo-sun-glow
                5s
                ease-in-out
                infinite;
        }


        #haldo-sun-glow-inner {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                260px;

            height:
                260px;

            transform:
                translate(-50%, -50%);

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle,
                    rgba(255, 255, 220, 0.58) 0%,
                    rgba(255, 224, 116, 0.24) 42%,
                    rgba(255, 139, 50, 0.09) 65%,
                    transparent 78%
                );

            filter:
                blur(5px);

            animation:
                haldo-sun-inner-glow
                3.5s
                ease-in-out
                infinite;
        }


        #haldo-sun {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                128px;

            height:
                128px;

            transform:
                translate(-50%, -50%);

            border:
                0;

            border-radius:
                50%;

            cursor:
                pointer;

            pointer-events:
                auto;

            background:

                radial-gradient(
                    circle at 31% 26%,
                    #ffffff 0%,
                    #fffbd3 7%,
                    #ffe46e 25%,
                    #ffbd43 48%,
                    #ff7134 72%,
                    #ff3d28 100%
                );

            box-shadow:

                0 0 25px
                rgba(255, 249, 178, 0.95),

                0 0 65px
                rgba(255, 215, 95, 0.72),

                0 0 130px
                rgba(255, 130, 55, 0.45),

                0 0 230px
                rgba(255, 80, 35, 0.20);

            transition:
                transform 250ms ease,
                filter 250ms ease;
        }


        #haldo-sun:hover {

            transform:
                translate(-50%, -50%)
                scale(1.08);

            filter:
                brightness(1.12);
        }


        #haldo-sun:active {

            transform:
                translate(-50%, -50%)
                scale(0.96);
        }


        @keyframes haldo-sun-glow {

            0%,
            100% {
                opacity:
                    0.72;

                transform:
                    translate(-50%, -50%)
                    scale(0.94);
            }

            50% {
                opacity:
                    1;

                transform:
                    translate(-50%, -50%)
                    scale(1.12);
            }
        }


        @keyframes haldo-sun-inner-glow {

            0%,
            100% {
                opacity:
                    0.70;

                transform:
                    translate(-50%, -50%)
                    scale(0.96);
            }

            50% {
                opacity:
                    1;

                transform:
                    translate(-50%, -50%)
                    scale(1.08);
            }
        }


        /* =========================================================
           PLANETARY ORBITS
           ========================================================= */

        .haldo-orbit {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            border:
                1px solid
                rgba(150, 225, 255, 0.14);

            border-radius:
                50%;

            transform:
                translate(-50%, -50%)
                rotateX(64deg);

            transform-style:
                preserve-3d;

            pointer-events:
                none;

            animation:
                haldo-orbit-rotation
                var(--orbit-speed, 30s)
                linear
                infinite;
        }


        @keyframes haldo-orbit-rotation {

            from {
                transform:
                    translate(-50%, -50%)
                    rotateX(64deg)
                    rotateZ(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotateX(64deg)
                    rotateZ(360deg);
            }
        }


        .haldo-planet {

            position:
                absolute;

            left:
                100%;

            top:
                50%;

            width:
                var(--planet-size, 18px);

            height:
                var(--planet-size, 18px);

            margin:
                calc(var(--planet-size, 18px) / -2);

            border-radius:
                50%;

            pointer-events:
                auto;

            cursor:
                pointer;

            transform:
                rotateX(-64deg);

            box-shadow:
                0 0 12px
                var(
                    --planet-glow,
                    rgba(100, 220, 255, 0.35)
                );

            transition:
                filter 200ms ease,
                transform 200ms ease;
        }


        .haldo-planet:hover {

            filter:
                brightness(1.25);

            transform:
                rotateX(-64deg)
                scale(1.2);
        }


        .planet-mercury {

            width:
                190px;

            height:
                110px;

            --orbit-speed:
                11s;
        }


        .planet-mercury .haldo-planet {

            --planet-size:
                10px;

            background:

                radial-gradient(
                    circle at 30% 25%,
                    #eee,
                    #aaa 35%,
                    #666 72%,
                    #333
                );
        }


        .planet-venus {

            width:
                280px;

            height:
                165px;

            --orbit-speed:
                17s;
        }


        .planet-venus .haldo-planet {

            --planet-size:
                16px;

            background:

                radial-gradient(
                    circle at 32% 25%,
                    #fff0ba,
                    #dda85c 42%,
                    #a85d32 76%,
                    #68351f
                );

            --planet-glow:
                rgba(255, 210, 130, 0.45);
        }


        .planet-earth {

            width:
                385px;

            height:
                225px;

            --orbit-speed:
                25s;
        }


        .planet-earth .haldo-planet {

            --planet-size:
                22px;

            background:

                radial-gradient(
                    circle at 32% 25%,
                    #b9fbff 0%,
                    #4fd7ed 18%,
                    #2473d0 48%,
                    #173477 78%,
                    #081832 100%
                );

            --planet-glow:
                rgba(85, 220, 255, 0.72);
        }


        .planet-earth .haldo-planet::before {

            content:
                "";

            position:
                absolute;

            width:
                9px;

            height:
                5px;

            left:
                6px;

            top:
                5px;

            border-radius:
                50%;

            background:
                rgba(105, 220, 145, 0.85);

            transform:
                rotate(-20deg);
        }


        .planet-earth .haldo-planet::after {

            content:
                "";

            position:
                absolute;

            width:
                6px;

            height:
                4px;

            left:
                12px;

            top:
                12px;

            border-radius:
                50%;

            background:
                rgba(80, 205, 130, 0.72);
        }


        .planet-mars {

            width:
                495px;

            height:
                290px;

            --orbit-speed:
                34s;
        }


        .planet-mars .haldo-planet {

            --planet-size:
                15px;

            background:

                radial-gradient(
                    circle at 30% 25%,
                    #ffad79,
                    #c9573f 42%,
                    #783427 78%,
                    #3e1713
                );

            --planet-glow:
                rgba(255, 102, 67, 0.40);
        }


        .planet-jupiter {

            width:
                625px;

            height:
                370px;

            --orbit-speed:
                48s;
        }


        .planet-jupiter .haldo-planet {

            --planet-size:
                43px;

            background:

                linear-gradient(
                    175deg,
                    #8b705c 0%,
                    #d2b38e 15%,
                    #b58e72 24%,
                    #ead7ae 31%,
                    #99725c 40%,
                    #d7bd91 52%,
                    #9d7058 65%,
                    #c7a783 76%,
                    #735243 100%
                );

            --planet-glow:
                rgba(235, 202, 161, 0.42);
        }


        .haldo-jupiter-spot {

            position:
                absolute;

            width:
                9px;

            height:
                6px;

            right:
                5px;

            top:
                24px;

            border-radius:
                50%;

            background:
                rgba(135, 72, 54, 0.72);
        }


        .planet-saturn {

            width:
                780px;

            height:
                455px;

            --orbit-speed:
                62s;
        }


        .planet-saturn .haldo-planet {

            --planet-size:
                33px;

            background:

                radial-gradient(
                    circle at 32% 25%,
                    #fff0bd,
                    #d9ba76 40%,
                    #aa8651 74%,
                    #5e482d
                );

            --planet-glow:
                rgba(255, 218, 136, 0.42);
        }


        .haldo-saturn-ring {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                68px;

            height:
                20px;

            transform:
                translate(-50%, -50%)
                rotate(-18deg);

            border:
                3px solid
                rgba(240, 217, 164, 0.62);

            border-left-color:
                rgba(240, 217, 164, 0.25);

            border-right-color:
                rgba(240, 217, 164, 0.25);

            border-radius:
                50%;

            pointer-events:
                none;
        }


        .planet-uranus {

            width:
                940px;

            height:
                550px;

            --orbit-speed:
                78s;
        }


        .planet-uranus .haldo-planet {

            --planet-size:
                25px;

            background:

                radial-gradient(
                    circle at 32% 25%,
                    #d9ffff,
                    #7ed9e5 48%,
                    #3c849b 80%,
                    #173c55
                );

            --planet-glow:
                rgba(110, 230, 255, 0.48);
        }


        .planet-neptune {

            width:
                1090px;

            height:
                640px;

            --orbit-speed:
                96s;
        }


        .planet-neptune .haldo-planet {

            --planet-size:
                25px;

            background:

                radial-gradient(
                    circle at 32% 25%,
                    #8aaeff,
                    #4168dc 45%,
                    #203d98 78%,
                    #101e52
                );

            --planet-glow:
                rgba(91, 130, 255, 0.52);
        }


        /* =========================================================
           EARTH + MOON DETAIL
           ========================================================= */

        #haldo-earth-moon {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                58px;

            height:
                58px;

            margin:
                -29px;

            z-index:
                32;

            pointer-events:
                none;
        }


        #haldo-earth-moon-core {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                22px;

            height:
                22px;

            margin:
                -11px;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 32% 25%,
                    #c8ffff,
                    #49d7eb 20%,
                    #2476d2 54%,
                    #172e79 78%,
                    #08172d 100%
                );

            box-shadow:
                0 0 18px
                rgba(92, 224, 255, 0.72);

            animation:
                haldo-earth-rotation
                7s
                linear
                infinite;
        }


        #haldo-moon {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                8px;

            height:
                8px;

            margin:
                -4px;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 30% 25%,
                    #fff,
                    #cfcfcf 48%,
                    #777
                );

            box-shadow:
                0 0 8px
                rgba(255, 255, 255, 0.7);

            transform-origin:
                4px 4px;

            animation:
                haldo-moon-orbit
                5s
                linear
                infinite;
        }


        @keyframes haldo-earth-rotation {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }
        }


        @keyframes haldo-moon-orbit {

            from {
                transform:
                    rotate(0deg)
                    translateX(26px);
            }

            to {
                transform:
                    rotate(360deg)
                    translateX(26px);
            }
        }


        /* =========================================================
           TOP SYSTEM BAR
           ========================================================= */

        #haldo-topbar {

            position:
                absolute;

            left:
                calc(16px + var(--haldo-safe-left));

            right:
                calc(16px + var(--haldo-safe-right));

            top:
                calc(14px + var(--haldo-safe-top));

            height:
                var(--haldo-topbar-height);

            z-index:
                1000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                12px;

            padding:
                7px 9px;

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                20px;

            background:
                rgba(3, 10, 22, 0.70);

        .haldo-window-content {

        /* =========================================================

                    calc(

                        + var(--haldo-safe-top)
                    );

                    calc(
                        8px
                        + var(--haldo-safe-bottom)
                    );

                    var(--haldo-dock-width);

                padding:
                    7px 5px;

                border-radius:
                    18px;
            }


            .haldo-dock-button {

                width:
                    43px;

                height:
                    43px;

                border-radius:
                    13px;

                font-size:
                    18px;
            }


            .haldo-dock-button::after {

                display:
                    none;
            }


            #haldo-workspace {

                left:
                    calc(
                        var(--haldo-dock-width)

                        + var(--haldo-safe-left)
                    );

                right:
                    var(--haldo-safe-right);

                top:
                    calc(
                        var(--haldo-topbar-height)

                    );

                bottom:
                    var(--haldo-safe-bottom);

                display:
                    none;
            }

                gap:
                    4px;

                width:
                    38px;

                    7px;

                    grid;

                place-items:
                    center;
            }


            .haldo-top-actions

                display:
                    none;
            }


            #haldo-sun-system {

                transform:
                    translate(-50%, -50%)
                    scale(0.70);
            }


            .haldo-window {

                left:
                    50% !important;

                top:
                    50% !important;

                width:
                    min(
                        calc(100vw - 20px),
                        680px
                    ) !important;

                height:
                    min(
                        calc(100vh - 110px),
                        720px
                    ) !important;

                transform:
                    translate(-50%, -50%);
            }


            .haldo-window-header {

                height:
                    46px;

                height:
                    calc(100% - 46px);

        /* =========================================================

        @media (max-width: 390px) {

            :root {

                --haldo-dock-width:

            .haldo-dock-button {

                width:
                    38px;

                height:
                    38px;

                font-size:
                    16px;
            }

                left:
                    calc(
                        var(--haldo-dock-width)
                        + 12px
                        + var(--haldo-safe-left)
                    );

            .haldo-brand-logo {

                width:
                    38px;

                height:
                    38px;
            }
        }


        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.001ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.001ms !important;

                scroll-behavior:
                    auto !important;

        /* =========================================================
           SAFE AREA / LANDSCAPE

        @media (

        ) {

            #haldo-topbar {

                height:
                    52px;
            }


            #haldo-dock {

                top:
                    calc(
                        62px
                        + var(--haldo-safe-top)
                    );
            }


            #haldo-workspace {

                top:
                    calc(
                        62px
                        + var(--haldo-safe-top)
                    );
            }


            .haldo-window {

                height:
                    calc(100vh - 72px);
            }
        }

    </style>
</head>

<script>

"use strict";

/* ================================================================
   HALDO AI OS 20
   CORE RUNTIME
   PART 1 / 8
   ================================================================ */


/* ================================================================
   GLOBAL NAMESPACE
   ================================================================ */

window.HalDo =
    window.HalDo ||
    {};

const HalDo =
    window.HalDo;


/* ================================================================
   VERSION
   ================================================================ */

HalDo.version =
    "20.0.0";

HalDo.build =
    "Cosmic Intelligent Operating System";

HalDo.codename =
    "Cosmic Foundation";

HalDo.runtimeVersion =
    "20.0.0";


/* ================================================================
   RUNTIME FLAGS
   ================================================================ */

HalDo.flags =
    HalDo.flags ||
    {

        development:
            false,

        debug:
            false,

        safeMode:
            false,

        mobile:
            false,

        touch:
            false,

        reducedMotion:
            false
    };


/* ================================================================
   DEVICE DETECTION
   ================================================================ */

HalDo.device =
    {

        update() {

            HalDo.flags.mobile =
                window.matchMedia(
                    "(max-width: 760px)"
                ).matches;

            HalDo.flags.touch =
                (
                    "ontouchstart" in window
                ) ||

    /* ============================================================
       TOAST SYSTEM
       ============================================================ */

    toast(
        message,
        duration = 2600
    ) {

        let container =
            document.getElementById(
                "haldo-toast-container"
            );

        if (!container) {

            container =
                this.createElement(
                    "div",
                    "",
                    {
                        id:
                            "haldo-toast-container",
                        "aria-live":
                            "polite"
                    }
                );

            document.body.appendChild(
                container
            );
        }

        const toast =
            this.createElement(
                "div",
                "haldo-toast",
                {
                    role:
                        "status",
                    text:
                        message
                }
            );

        container.appendChild(
            toast
        );

        window.setTimeout(
            () => {

                toast.style.opacity =
                    "0";

                toast.style.transform =
                    "translateY(8px)";

                toast.style.transition =
                    "180ms ease";

                window.setTimeout(
                    () => toast.remove(),
                    190
                );

            },
            duration
        );

    },


    /* ============================================================
       STAR FIELD
       ============================================================ */

    createStars(
        count = 110
    ) {

        const container =
            this.elements.stars;

        if (!container) {
            return;
        }

        container.replaceChildren();

        const fragment =
            document.createDocumentFragment();

        for (
            let index = 0;
            index < count;
            index++
        ) {

            const star =
                this.createElement(
                    "span",
                    "haldo-star"
                );

            star.style.left =
                `${Math.random() * 100}%`;

            star.style.top =
                `${Math.random() * 100}%`;

            const size =
                Math.random() < 0.84
                    ? 1
                    : 2;

            star.style.width =
                `${size}px`;

            star.style.height =
                `${size}px`;

            star.style.setProperty(
                "--star-opacity",
                String(
                    0.25 +
                    Math.random() * 0.75
                )
            );

            star.style.setProperty(
                "--star-duration",
                `${2.5 + Math.random() * 5}s`
            );

            star.style.animationDelay =
                `${Math.random() * 5}s`;

            fragment.appendChild(
                star
            );
        }

        container.appendChild(
            fragment
        );

    },


    /* ============================================================
       COSMIC WORLD
       ============================================================ */

    setCosmicWorld(
        enabled
    ) {

        const world =
            this.elements.cosmicWorld;

        if (!world) {
            return;
        }

        HalDo.state.cosmicWorld =
            Boolean(enabled);

    /* ============================================================
       DOCK
       ============================================================ */

    renderDock() {

        const dock =
            this.elements.dock;

        if (!dock) {
            return;
        }

        dock.replaceChildren();

        const apps =
            HalDo.registry.all();

        const fragment =
            document.createDocumentFragment();

        apps.forEach(
            app => {

                const button =
                    this.createElement(
                        "button",
                        "haldo-dock-button",
                        {
                            type:
                                "button",
                            title:
                                app.name,
                            "aria-label":
                                app.name,
                            "data-app-id":
                                app.id
                        }
                    );

                button.textContent =
                    app.icon || "◈";

                button.addEventListener(
                    "click",
                    () => {

                        this.openApp(
                            app.id
                        );

                    }
                );

                fragment.appendChild(
                    button
                );

            }
        );

        dock.appendChild(
            fragment
        );

        this.updateDockActiveState();

    },


    updateDockActiveState() {

        const active =
            HalDo.state.activeApp;

        const buttons =
            document.querySelectorAll(
                ".haldo-dock-button"
            );

        buttons.forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.appId ===
                        active
                );

            }
        );

    },


    /* ============================================================
       APP OPEN
       ============================================================ */

    async openApp(
        id,
        options = {}
    ) {

        const app =
            HalDo.registry.get(id);

        if (!app) {

            this.toast(
                `App "${id}" wurde nicht gefunden.`
            );

            return null;
        }

        if (
            HalDo.appManager &&
            typeof HalDo.appManager.open ===
                "function"
        ) {

            await HalDo.appManager.open(
                id
            );

        }

        HalDo.state.activeApp =
            id;

        this.updateDockActiveState();

        HalDo.emit(
            "ui:open-app",
            {
                id,
                app,
                options
            }
        );

        return this.createAppWindow(
            app,
            options
        );

    },


    /* ============================================================
       WINDOW CREATION
       ============================================================ */

    createAppWindow(
        app,
        options = {}
    ) {

        const existing =
            document.querySelector(
                `.haldo-window[data-app-window="${app.id}"]`
            );

        if (existing) {

            existing.classList.remove(
                "minimized"
            );

            this.focusWindow(
                existing
            );

            return existing;

        }

        const windowId =
            HalDo.utils.id(
                `window-${app.id}`
            );

        const windowElement =
            this.createElement(
                "section",
                "haldo-window",
                {
                    "data-window-id":
                        windowId,
                    "data-app-window":
                        app.id,
                    "aria-label":
                        app.name
                }
            );

        const header =
            this.createElement(
                "header",
                "haldo-window-header"
            );

        const titleArea =
            this.createElement(
                "div",
                "haldo-window-title-area"
            );

        const icon =
            this.createElement(
                "div",
                "haldo-window-icon",
                {
                    "aria-hidden":
                        "true",
                    text:
                        app.icon || "◈"
                }
            );

        const titleText =
            this.createElement(
                "div"
            );

        const title =
            this.createElement(
                "div",
                "haldo-window-title",
                {
                    text:
                        app.name
                }
            );

        const subtitle =
            this.createElement(
                "div",
                "haldo-window-subtitle",
                {
                    text:
                        app.category ||
                        "HalDo Application"
                }
            );

        titleText.append(
            title,
            subtitle
        );

        titleArea.append(
            icon,
            titleText
        );

        const controls =
            this.createElement(
                "div",
                "haldo-window-controls"
            );

        const minimizeButton =
            this.createWindowControl(
                "−",
                "Minimieren"
            );

        const maximizeButton =
            this.createWindowControl(
                "□",
                "Maximieren"
            );

        const closeButton =
            this.createWindowControl(
                "×",
                "Schließen",
                "close"
            );

        controls.append(
            minimizeButton,
            maximizeButton,
            closeButton
        );

        header.append(
            titleArea,
            controls
        );

        const body =
            this.createElement(
                "div",
                "haldo-window-body"
            );

        const page =
            this.createElement(
                "div",
                "haldo-app-page"
            );

        this.renderAppContent(
            app,
            page,
            options
        );

        body.appendChild(
            page
        );

        windowElement.append(
            header,
            body
        );

        this.elements.workspace
            .appendChild(
                windowElement
            );

        this.setupWindowDrag(
            windowElement,
            header
        );

        minimizeButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                windowElement.classList.add(
                    "minimized"
                );

                HalDo.emit(
                    "window:minimized",
                    {
                        id:
                            windowId,
                        app:
                            app.id
                    }
                );

            }
        );

        maximizeButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                windowElement.classList.toggle(
                    "maximized"
                );

                this.focusWindow(
                    windowElement
                );

            }
        );

        closeButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                this.closeWindow(
                    windowElement
                );

            }
        );

        windowElement.addEventListener(
            "pointerdown",
            () => {

                this.focusWindow(
                    windowElement
                );

            }
        );

        this.focusWindow(
            windowElement
        );

        if (
            options.width ||
            options.height
        ) {

            if (options.width) {

                windowElement.style.width =
                    this.normalizeSize(
                        options.width,
                        "width"
                    );

            }

            if (options.height) {

                windowElement.style.height =
                    this.normalizeSize(
                        options.height,
                        "height"
                    );

            }

        }

        if (
            HalDo.windowManager &&
            typeof HalDo.windowManager.register ===
                "function"
        ) {

            HalDo.windowManager.register(
                windowId,
                windowElement
            );

        }

        HalDo.emit(
            "window:created",
            {
                id:
                    windowId,
                app:
                    app.id,
                element:
                    windowElement
            }
        );

        return windowElement;

    },

    /* ============================================================
       WINDOW SIZE
       ============================================================ */

    normalizeSize(
        value,
        type
    ) {

        if (
            typeof value ===
                "number"
        ) {

            return `${value}px`;

        }

        const stringValue =
            String(value);

        if (
            /^\d+$/.test(
                stringValue
            )
        ) {

            return `${stringValue}px`;

        }

        if (
            /^(px|%|vw|vh|rem)$/.test(
                stringValue
            )
        ) {

            return stringValue;

        }

        if (
            /^[0-9.]+(px|%|vw|vh|rem)$/.test(
                stringValue
            )
        ) {

            return stringValue;

        }

        return type === "width"
            ? "min(760px, calc(100vw - 150px))"
            : "min(560px, calc(100vh - 150px))";

    },


    /* ============================================================
       FOCUS WINDOW
       ============================================================ */

    focusWindow(
        element
    ) {

        if (!element) {
            return;
        }

        if (
            HalDo.windowManager &&
            typeof HalDo.windowManager.focus ===
                "function"
        ) {

            HalDo.windowManager.focus(
                element.dataset.windowId
            );

        } else {

            const windows =
                document.querySelectorAll(
                    ".haldo-window"
                );

            let maxZ =
                200;

            windows.forEach(
                item => {

                    const z =
                        Number(
                            item.style.zIndex
                        );

                    if (
                        Number.isFinite(z) &&
                        z > maxZ
                    ) {
                        maxZ = z;
                    }

                }
            );

            element.style.zIndex =
                String(maxZ + 1);

        }

        HalDo.emit(
            "ui:window-focus",
            {
                element,
                app:
                    element.dataset.appWindow
            }
        );

    },


    /* ============================================================
       CLOSE WINDOW
       ============================================================ */

    closeWindow(
        element
    ) {

        if (!element) {
            return false;
        }

        const id =
            element.dataset.windowId;

        if (
            HalDo.windowManager &&
            typeof HalDo.windowManager.close ===
                "function"
        ) {

            const managed =
                HalDo.windowManager.close(
                    id
                );

            if (managed) {

                HalDo.emit(
                    "ui:window-closed",
                    {
                        id,
                        app:
                            element.dataset.appWindow
                    }
                );

                return true;

            }

        }

        element.remove();

        HalDo.emit(
            "ui:window-closed",
            {
                id,
                app:
                    element.dataset.appWindow
            }
        );

        return true;

    },


    /* ============================================================
       DRAGGABLE WINDOWS
       ============================================================ */

    setupWindowDrag(
        windowElement,
        header
    ) {

        if (!windowElement || !header) {
            return;
        }

        let dragging = false;

        let startX = 0;
        let startY = 0;

        let startLeft = 0;
        let startTop = 0;

        header.addEventListener(
            "pointerdown",
            event => {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {
                    return;
                }

                if (
                    windowElement.classList.contains(
                        "maximized"
                    )
                ) {
                    return;
                }

                dragging = true;

                this.focusWindow(
                    windowElement
                );

                const rect =
                    windowElement.getBoundingClientRect();

                startX =
                    event.clientX;

                startY =
                    event.clientY;

                startLeft =
                    rect.left;

                startTop =
                    rect.top;

                windowElement.style.left =
                    `${rect.left}px`;

                windowElement.style.top =
                    `${rect.top}px`;

                windowElement.style.transform =
                    "none";

                try {

                    header.setPointerCapture(
                        event.pointerId
                    );

                } catch (_) {}

                event.preventDefault();

            }
        );

        header.addEventListener(
            "pointermove",
            event => {

                if (!dragging) {
                    return;
                }

                const deltaX =
                    event.clientX -
                    startX;

                const deltaY =
                    event.clientY -
                    startY;

                let nextLeft =
                    startLeft +
                    deltaX;

                let nextTop =
                    startTop +
                    deltaY;

                const rect =
                    windowElement.getBoundingClientRect();

                const maxLeft =
                    window.innerWidth -
                    Math.min(
                        rect.width,
                        window.innerWidth
                    );

                const maxTop =
                    window.innerHeight -
                    Math.min(
                        rect.height,
                        window.innerHeight
                    );

                nextLeft =
                    Math.max(
                        0,
                        Math.min(
                            nextLeft,
                            Math.max(
                                0,
                                maxLeft
                            )
                        )
                    );

                nextTop =
                    Math.max(
                        60,
                        Math.min(
                            nextTop,
                            Math.max(
                                60,
                                maxTop
                            )
                        )
                    );

                windowElement.style.left =
                    `${nextLeft}px`;

                windowElement.style.top =
                    `${nextTop}px`;

            }
        );

        const stopDragging =
            event => {

                if (!dragging) {
                    return;
                }

                dragging = false;

                try {

                    header.releasePointerCapture(
                        event.pointerId
                    );

                } catch (_) {}

            };

        header.addEventListener(
            "pointerup",
            stopDragging
        );

        header.addEventListener(
            "pointercancel",
            stopDragging
        );

    },


    /* ============================================================
       MAIN MENU
       ============================================================ */

    menuLayer: null,

    openMainMenu() {

        if (!this.menuLayer) {
            this.createMainMenu();
        }

        this.menuLayer.classList.add(
            "open"
        );

    },


    closeMainMenu() {

        if (!this.menuLayer) {
            return;
        }

        this.menuLayer.classList.remove(
            "open"
        );

    },


    toggleMainMenu() {

        if (
            this.menuLayer &&
            this.menuLayer.classList.contains(
                "open"
            )
        ) {

            this.closeMainMenu();

        } else {

            this.openMainMenu();

        }

    },


    createMainMenu() {

        if (
            document.getElementById(
                "haldo-main-menu"
            )
        ) {

            this.menuLayer =
                document.getElementById(
                    "haldo-main-menu"
                );

            return;

        }

        const layer =
            this.createElement(
                "div",
                "haldo-menu-layer",
                {
                    id:
                        "haldo-main-menu"
                }
            );

        const panel =
            this.createElement(
                "div",
                "haldo-menu-panel",
                {
                    role:
                        "menu"
                }
            );

        const title =
            this.createElement(
                "div",
                "haldo-menu-title",
                {
                    text:
                        "HalDo AI OS"
                }
            );

        panel.appendChild(
            title
        );

        HalDo.registry.all()
            .forEach(
                app => {

                    const item =
                        this.createElement(
                            "button",
                            "haldo-menu-item",
                            {
                                type:
                                    "button",
                                role:
                                    "menuitem"
                            }
                        );

                    const itemIcon =
                        this.createElement(
                            "div",
                            "haldo-menu-item-icon",
                            {
                                text:
                                    app.icon ||
                                    "◈"
                            }
                        );

                    const text =
                        this.createElement(
                            "div",
                            "haldo-menu-item-text"
                        );

                    const name =
                        this.createElement(
                            "div",
                            "haldo-menu-item-name",
                            {
                                text:
                                    app.name
                            }
                        );

                    const description =
                        this.createElement(
                            "div",
                            "haldo-menu-item-description",
                            {
                                text:
                                    app.description ||
                                    app.category ||
                                    "HalDo App"
                            }
                        );

                    text.append(
                        name,
                        description
                    );

                    item.append(
                        itemIcon,
                        text
                    );

                    item.addEventListener(
                        "click",
                        () => {

                            this.closeMainMenu();

                            this.openApp(
                                app.id
                            );

                        }
                    );

                    panel.appendChild(
                        item
                    );

                }
            );

        layer.appendChild(
            panel
        );

        layer.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    layer
                ) {

                    this.closeMainMenu();

                }

            }
        );

        document.body.appendChild(
            layer
        );

        this.menuLayer =
            layer;

    },

                }

            }
        );

        input.addEventListener(
            "input",
            () => {

                this.renderSearchResults(
                    input.value,
                    results
                );

            }
        );

        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    this.closeSearch();

                }

            }
        );

        document.body.appendChild(
            overlay
        );

        this.searchOverlay =
            overlay;

        this.searchInput =
            input;

        this.searchResults =
            results;

    },


    openSearch() {

        if (!this.searchOverlay) {
            this.createSearch();
        }

        this.searchOverlay.classList.add(
            "open"
        );

        window.setTimeout(
            () => {

                if (this.searchInput) {

                    this.searchInput.focus();

                }

            },
            30
        );

        this.renderSearchResults(
            "",
            this.searchResults
        );

    },


    closeSearch() {

        if (!this.searchOverlay) {
            return;
        }

        this.searchOverlay.classList.remove(
            "open"
        );

    },


    renderSearchResults(
        query,
        container
    ) {

        if (!container) {
            return;
        }

        container.replaceChildren();

        const normalized =
            String(query || "")
                .trim()
                .toLowerCase();

        const apps =
            HalDo.registry.all()
                .filter(
                    app => {

                        if (!normalized) {
                            return true;
                        }

                        return (
                            String(app.name || "")
                                .toLowerCase()
                                .includes(normalized)
                            ||
                            String(app.id || "")
                                .toLowerCase()
                                .includes(normalized)
                            ||
                            String(app.category || "")
                                .toLowerCase()
                                .includes(normalized)
                            ||
                            String(app.description || "")
                                .toLowerCase()
                                .includes(normalized)
                        );

                    }
                );

        apps.forEach(
            app => {

                const item =
                    this.createElement(
                        "button",
                        "haldo-menu-item",
                        {
                            type:
                                "button"
                        }
                    );

                const icon =
                    this.createElement(
                        "div",
                        "haldo-menu-item-icon",
                        {
                            text:
                                app.icon ||
                                "◈"
                        }
                    );

                const text =
                    this.createElement(
                        "div",
                        "haldo-menu-item-text"
                    );

                text.append(
                    this.createElement(
                        "div",
                        "haldo-menu-item-name",
                        {
                            text:
                                app.name
                        }
                    ),
                    this.createElement(
                        "div",
                        "haldo-menu-item-description",
                        {
                            text:
                                app.description ||
                                app.category ||
                                "HalDo App"
                        }
                    )
                );

                item.append(
                    icon,
                    text
                );

                item.addEventListener(
                    "click",
                    () => {

                        this.closeSearch();

                        this.openApp(
                            app.id
                        );

                    }
                );

                container.appendChild(
                    item
                );

            }
        );

        if (!apps.length) {

            container.appendChild(
                this.createElement(
                    "div",
                    "haldo-card",
                    {
                        text:
                            "Keine passende App gefunden."
                    }
                )
            );

        }

    },


    /* ============================================================
       BUTTON EVENTS
       ============================================================ */

    bindGlobalButtons() {

        if (this.elements.sun) {

            this.elements.sun.addEventListener(
                "click",
                () => {

                    this.openApp(
                        "ai"
                    );

                }
            );

        }

        if (this.elements.aiButton) {

            this.elements.aiButton.addEventListener(
                "click",
                () => {

                    this.openApp(
                        "ai"
                    );

                }
            );

        }

        if (this.elements.searchButton) {

            this.elements.searchButton.addEventListener(
                "click",
                () => {

                    this.openSearch();

                }
            );

        }

        if (this.elements.settingsButton) {

            this.elements.settingsButton.addEventListener(
                "click",
                () => {

                    this.openApp(
                        "settings"
                    );

                }
            );

        }

    },


    /* ============================================================
       KEYBOARD SHORTCUTS
       ============================================================ */

    bindKeyboard() {

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    this.closeMainMenu();
                    this.closeSearch();

                    return;

                }

                if (
                    (event.ctrlKey ||
                     event.metaKey) &&
                    event.key.toLowerCase() ===
                        "k"
                ) {

                    event.preventDefault();

                    this.openSearch();

                    return;

                }

                if (
                    (event.ctrlKey ||
                     event.metaKey) &&
                    event.key.toLowerCase() ===
                        "m"
                ) {

                    event.preventDefault();

                    this.toggleMainMenu();

                }

            }
        );

    },


    /* ============================================================
       ACTIVE WINDOW / APP STATE
       ============================================================ */

    bindRuntimeEvents() {

        HalDo.on(
            "app:registered",
            () => {

                this.renderDock();

            }
        );

        HalDo.on(
            "ui:open-app",
            event => {

                const id =
                    event.detail &&
                    event.detail.id;

                if (id) {

                    HalDo.state.activeApp =
                        id;

                    this.updateDockActiveState();

                }

            }
        );

        HalDo.on(
            "window:close",
            () => {

                this.updateDockActiveState();

            }
        );

    },


    /* ============================================================
       INITIALIZE
       ============================================================ */

    init() {

        if (this.initialized) {
            return;
        }

        this.cacheElements();

        this.installStyles();

        this.createStars(
            window.innerWidth < 600
                ? 75
                : 125
        );

        this.renderDock();

        this.createMainMenu();

        this.createSearch();

        this.bindGlobalButtons();

        this.bindKeyboard();

        this.bindRuntimeEvents();

        this.initialized =
            true;

        HalDo.emit(
            "ui:ready",
            {
                version:
                    this.version
            }
        );

    }

};

    HalDoUI;

function haldoStartUIRuntime() {

    try {

        HalDoUI.init();

        console.info(
            "[HalDo UI] Part 2 ready."
        );

    } catch (error) {

        console.error(
            "[HalDo UI] Initialization failed:",
            error
        );

        HalDo.emit(
            "ui:error",
            {
                error
            }
        );

    }

}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoStartUIRuntime,
        {
            once:
                true
        }
    );

} else {

    haldoStartUIRuntime();

}
