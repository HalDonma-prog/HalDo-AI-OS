    <!-- =====================================================
         HALDO V20 SHELL STYLE
    ====================================================== -->

    <style>

        :root {

            --haldo-bg:
                #030713;

            --haldo-panel:
                rgba(8, 14, 31, 0.78);

            --haldo-panel-strong:
                rgba(7, 12, 28, 0.94);

            --haldo-border:
                rgba(255,255,255,0.10);

            --haldo-border-soft:
                rgba(255,255,255,0.055);

            --haldo-text:
                rgba(255,255,255,0.96);

            --haldo-muted:
                rgba(255,255,255,0.62);

            --haldo-shadow:
                0 24px 80px rgba(0,0,0,0.42);

            --haldo-radius:
                20px;

            --haldo-transition:
                180ms cubic-bezier(.2,.8,.2,1);
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background:
                var(--haldo-bg);

            color:
                var(--haldo-text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing:
                antialiased;
        }


        body {

            position: relative;

            user-select: none;

            overscroll-behavior: none;
        }


        button,
        input,
        textarea,
        select {

            font: inherit;
        }


        button {

            border: 0;

            color: inherit;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;
        }


        /* =====================================================
           OS ROOT
        ====================================================== */

        #haldo-os {

            position: relative;

            width: 100%;
            height: 100%;

            min-height: 100dvh;

            overflow: hidden;

            isolation: isolate;
        }


        /* =====================================================
           COSMIC WORLD
        ====================================================== */

        #haldo-cosmic-world {

            position: absolute;

            inset: 0;

            z-index: 0;

            overflow: hidden;

            pointer-events: none;
        }


        #haldo-cosmic-canvas {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;
        }


        /*
         * Wichtig:
         * Keine sichtbaren weißen Orbit-Linien.
         *
         * Die Cosmic Engine entscheidet selbst,
         * welche Lichtkörper sichtbar sind.
         */


        /* =====================================================
           MAIN UI
        ====================================================== */

        #haldo-interface {

            position: absolute;

            inset: 0;

            z-index: 10;

            pointer-events: none;
        }


        #haldo-interface > * {

            pointer-events: auto;
        }


        /* =====================================================
           TOP BAR
        ====================================================== */

        #haldo-topbar {

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            min-height: 66px;

            padding:
                env(safe-area-inset-top)
                16px
                0
                16px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            z-index: 50;

            background:
                linear-gradient(
                    to bottom,
                    rgba(2,6,18,.78),
                    rgba(2,6,18,0)
                );
        }


        #haldo-brand {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        #haldo-brand-logo {

            width: 40px;
            height: 40px;

            object-fit: contain;
        }


        #haldo-brand-title {

            font-size: 15px;

            font-weight: 700;

            letter-spacing:
                .04em;
        }


        #haldo-system-status {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .haldo-system-button {

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                50%;

            background:
                rgba(7,12,27,.52);

            backdrop-filter:
                blur(14px);

            transition:
                transform var(--haldo-transition),
                background var(--haldo-transition);
        }


        .haldo-system-button:hover {

            transform:
                translateY(-1px);

            background:
                rgba(255,255,255,.10);
        }


        /* =====================================================
           DESKTOP
        ====================================================== */

        #haldo-desktop {

            position: absolute;

            inset: 0;

            padding:
                76px
                16px
                92px;

            overflow: hidden;

            z-index: 20;
        }


        #haldo-desktop-content {

            position: relative;

            width: 100%;
            height: 100%;
        }


        /* =====================================================
           WINDOW LAYER
        ====================================================== */

        #haldo-window-layer {

            position: absolute;

            inset: 0;

            z-index: 100;

            pointer-events: none;
        }


        #haldo-window-layer > * {

            pointer-events: auto;
        }


        /* =====================================================
           APP MENU
        ====================================================== */

        #haldo-app-menu {

            position: absolute;

            left: 14px;

            bottom:
                calc(
                    84px +
                    env(safe-area-inset-bottom)
                );

            width:
                min(
                    460px,
                    calc(100vw - 28px)
                );

            max-height:
                calc(100dvh - 110px);

            padding: 16px;

            overflow:
                auto;

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                24px;

            background:
                var(--haldo-panel-strong);

            backdrop-filter:
                blur(26px);

            box-shadow:
                var(--haldo-shadow);

            opacity: 0;

            visibility: hidden;

            transform:
                translateY(14px)
                scale(.985);

            transition:
                opacity 180ms ease,
                transform 180ms ease,
                visibility 180ms ease;

            z-index: 300;
        }


        #haldo-app-menu.open {

            opacity: 1;

            visibility: visible;

            transform:
                translateY(0)
                scale(1);
        }


        #haldo-app-menu-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 14px;
        }


        #haldo-app-menu-title {

            font-size: 19px;

            font-weight: 750;
        }


        #haldo-app-search {

            width: 100%;

            height: 42px;

            margin-bottom: 14px;

            padding:
                0 14px;

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                13px;

            outline: none;

            background:
                rgba(255,255,255,.055);

            color:
                white;
        }


        #haldo-app-search::placeholder {

            color:
                rgba(255,255,255,.42);
        }


        #haldo-app-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(78px,1fr)
                );

            gap: 9px;
        }


        .haldo-app-tile {

            min-height: 78px;

            padding: 8px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 6px;

            border:
                1px solid
                var(--haldo-border-soft);

            border-radius:
                16px;

            background:
                rgba(255,255,255,.045);

            transition:
                transform var(--haldo-transition),
                background var(--haldo-transition);
        }


        .haldo-app-tile:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255,255,255,.095);
        }


        .haldo-app-icon {

            font-size: 25px;

            line-height: 1;
        }


        .haldo-app-label {

            width: 100%;

            overflow: hidden;

            text-align: center;

            white-space: nowrap;

            text-overflow: ellipsis;

            font-size: 11px;

            color:
                var(--haldo-muted);
        }


        /* =====================================================
           DOCK
        ====================================================== */

        #haldo-dock {

            position: absolute;

            left: 50%;

            bottom:
                calc(
                    12px +
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            max-width:
                calc(100vw - 20px);

            min-height: 62px;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                7px 9px;

            overflow-x: auto;

            overflow-y: hidden;

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                22px;

            background:
                rgba(7,12,28,.70);

            backdrop-filter:
                blur(22px);

            box-shadow:
                var(--haldo-shadow);

            z-index: 400;
        }


        .haldo-dock-item {

            width: 48px;
            height: 48px;

            flex:
                0 0 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius:
                15px;

            background:
                rgba(255,255,255,.055);

            transition:
                transform var(--haldo-transition),
                background var(--haldo-transition);
        }


        .haldo-dock-item:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255,255,255,.11);
        }


        /* =====================================================
           BOOT
        ====================================================== */

        #haldo-boot {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(35,58,130,.30),
                    rgba(2,5,15,.985)
                );

            z-index: 2000;

            transition:
                opacity .55s ease,
                visibility .55s ease;
        }


        #haldo-boot.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        #haldo-boot-inner {

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        #haldo-boot-logo {

            width: 154px;
            height: 154px;

            object-fit: contain;

            animation:
                haldoLogoBreath
                2.8s
                ease-in-out
                infinite;
        }


        #haldo-boot-title {

            margin-top: 17px;

            font-size: 23px;

            font-weight: 750;

            letter-spacing:
                .055em;
        }


        #haldo-boot-message {

            margin-top: 7px;

            color:
                var(--haldo-muted);

            font-size: 13px;
        }


        @keyframes haldoLogoBreath {

            0%,
            100% {

                transform:
                    scale(.97)
                    rotate(0deg);

                filter:
                    brightness(1)
                    drop-shadow(
                        0 0 15px
                        rgba(255,255,255,.20)
                    );
            }

            50% {

                transform:
                    scale(1.035)
                    rotate(4deg);

                filter:
                    brightness(1.20)
                    drop-shadow(
                        0 0 35px
                        rgba(255,255,255,.50)
                    );
            }
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 600px) {

            #haldo-brand-title {

                display: none;
            }


            #haldo-topbar {

                padding-left: 10px;
                padding-right: 10px;
            }


            #haldo-desktop {

                padding:
                    70px
                    9px
                    88px;
            }


            #haldo-app-menu {

                left: 8px;

                width:
                    calc(100vw - 16px);
            }


            #haldo-dock {

                max-width:
                    calc(100vw - 12px);
            }
        }

    </style>

</head>

    <!-- =====================================================
         V20 SHELL CONTROLLER
    ====================================================== -->

    <script>

        (function () {

            "use strict";


            const state = {

                menuOpen: false,

                apps: [],

                initialized: false
            };


            function get(id) {

                return document.getElementById(id);
            }


            function emit(name, detail) {

                try {

                    document.dispatchEvent(
                        new CustomEvent(
                            "haldo:shell:" + name,
                            {
                                detail:
                                    detail || {}
                            }
                        )
                    );

                } catch (error) {

                    console.warn(
                        "[HalDo Shell]",
                        error
                    );
                }
            }


            function openMenu() {

                const menu =
                    get("haldo-app-menu");

                const button =
                    get("haldo-menu-button");

                if (!menu) {
                    return;
                }


                state.menuOpen = true;

                menu.classList.add(
                    "open"
                );


                if (button) {

                    button.setAttribute(
                        "aria-expanded",
                        "true"
                    );
                }


                emit(
                    "menu-opened"
                );
            }


            function closeMenu() {

                const menu =
                    get("haldo-app-menu");

                const button =
                    get("haldo-menu-button");

                if (!menu) {
                    return;
                }


                state.menuOpen = false;

                menu.classList.remove(
                    "open"
                );


                if (button) {

                    button.setAttribute(
                        "aria-expanded",
                        "false"
                    );
                }


                emit(
                    "menu-closed"
                );
            }


            function toggleMenu() {

                if (state.menuOpen) {

                    closeMenu();

                } else {

                    openMenu();
                }
            }


            function getRegistry() {

                return (
                    window.HalDoV20AppRegistry ||
                    null
                );
            }


            function getRuntime() {

                return (
                    window.HalDoAppRuntime ||
                    null
                );
            }


            function renderApps(
                query
            ) {

                const grid =
                    get("haldo-app-grid");

                if (!grid) {
                    return;
                }


                const registry =
                    getRegistry();


                if (!registry) {

                    grid.innerHTML = "";

                    return;
                }


                let apps;


                if (
                    query &&
                    typeof registry.search ===
                    "function"
                ) {

                    apps =
                        registry.search(
                            query
                        );

                } else if (
                    typeof registry.getAll ===
                    "function"
                ) {

                    apps =
                        registry.getAll();

                } else {

                    apps = [];
                }


                state.apps = apps;


                grid.innerHTML = "";


                apps
                    .filter(function (app) {

                        return (
                            app &&
                            app.enabled !== false
                        );

                    })
                    .forEach(
                        function (app) {

                            const button =
                                document.createElement(
                                    "button"
                                );


                            button.type =
                                "button";


                            button.className =
                                "haldo-app-tile";


                            button.dataset.app =
                                app.id;


                            button.innerHTML =

                                '<span class="haldo-app-icon">' +
                                escapeHtml(
                                    app.icon || "◈"
                                ) +
                                '</span>' +

                                '<span class="haldo-app-label">' +
                                escapeHtml(
                                    app.name || app.id
                                ) +
                                '</span>';


                            button.addEventListener(
                                "click",
                                function () {

                                    launchApp(
                                        app.id
                                    );

                                }
                            );


                            grid.appendChild(
                                button
                            );

                        }
                    );
            }


            function escapeHtml(value) {

                return String(value)
                    .replace(
                        /&/g,
                        "&amp;"
                    )
                    .replace(
                        /</g,
                        "&lt;"
                    )
                    .replace(
                        />/g,
                        "&gt;"
                    )
                    .replace(
                        /"/g,
                        "&quot;"
                    )
                    .replace(
                        /'/g,
                        "&#039;"
                    );
            }


            async function launchApp(
                appId
            ) {

                const runtime =
                    getRuntime();


                if (!runtime) {

                    console.warn(
                        "[HalDo Shell] " +
                        "App Runtime nicht verfügbar:",
                        appId
                    );

                    return;
                }


                try {

                    closeMenu();


                    await runtime.open(
                        appId,
                        {
                            source:
                                "haldo-shell"
                        }
                    );


                    emit(
                        "app-opened",
                        {
                            appId:
                                appId
                        }
                    );

                } catch (error) {

                    console.error(
                        "[HalDo Shell] " +
                        "App konnte nicht geöffnet werden:",
                        appId,
                        error
                    );


                    emit(
                        "app-error",
                        {
                            appId:
                                appId,

                            error:
                                error
                        }
                    );
                }
            }


            function connectDock() {

                document
                    .querySelectorAll(
                        "[data-app]"
                    )
                    .forEach(
                        function (button) {

                            button.addEventListener(
                                "click",
                                function () {

                                    launchApp(
                                        button.dataset.app
                                    );

                                }
                            );

                        }
                    );
            }


            function connectControls() {

                const menuButton =
                    get("haldo-menu-button");


                if (menuButton) {

                    menuButton.addEventListener(
                        "click",
                        toggleMenu
                    );
                }


                const homeButton =
                    get("haldo-home-button");


                if (homeButton) {

                    homeButton.addEventListener(
                        "click",
                        function () {

                            closeMenu();

                            emit(
                                "home"
                            );

                        }
                    );
                }


                const search =
                    get("haldo-app-search");


                if (search) {

                    search.addEventListener(
                        "input",
                        function () {

                            renderApps(
                                search.value
                            );

                        }
                    );
                }


                document.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key ===
                            "Escape"
                        ) {

                            closeMenu();
                        }

                    }
                );
            }


            function updateNetworkStatus() {

                const button =
                    get(
                        "haldo-network-button"
                    );


                if (!button) {
                    return;
                }


                const online =
                    navigator.onLine;


                button.textContent =
                    online
                        ? "◉"
                        : "○";


                button.title =
                    online
                        ? "Online"
                        : "Offline";
            }


            function connectNetwork() {

                window.addEventListener(
                    "online",
                    updateNetworkStatus
                );


                window.addEventListener(
                    "offline",
                    updateNetworkStatus
                );


                updateNetworkStatus();
            }


            function startBootExit() {

                const boot =
                    get("haldo-boot");


                if (!boot) {
                    return;
                }


                window.setTimeout(
                    function () {

                        boot.classList.add(
                            "hidden"
                        );

                    },
                    1200
                );
            }


            function initializeShell() {

                if (
                    state.initialized
                ) {

                    return;
                }


                state.initialized =
                    true;


                connectControls();

                connectDock();

                connectNetwork();

                renderApps();

                startBootExit();


                emit(
                    "ready"
                );


                console.log(
                    "%cHalDo AI OS 20",
                    "font-weight:700;",
                    "Shell bereit."
                );
            }


            function waitForRuntime() {

                if (
                    window.HalDoAppRuntime
                ) {

                    initializeShell();

                    return;
                }


                window.setTimeout(
                    waitForRuntime,
                    50
                );
            }


            if (
                document.readyState ===
                "loading"
            ) {

                document.addEventListener(
                    "DOMContentLoaded",
                    waitForRuntime,
                    {
                        once: true
                    }
                );

            } else {

                waitForRuntime();
            }


            window.HalDoV20Shell = {

                openMenu:
                    openMenu,

                closeMenu:
                    closeMenu,

                toggleMenu:
                    toggleMenu,

                launchApp:
                    launchApp,

                refreshApps:
                    renderApps,

                getState:
                    function () {

                        return Object.assign(
                            {},
                            state
                        );
                    }
            };

        })();

    </script>

</div>
