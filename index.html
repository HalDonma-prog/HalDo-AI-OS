<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HalDo AI OS 24 — Ultimate</title>
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="data:application/json,{}" />
    <style>
        /* ================================================================
           HALDO AI OS 24 — ULTIMATE EDITION
           KOMPLETT IN EINER DATEI — PROFESSIONELL, LEBENDIG, 4K COSMIC
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a1a;
            --surface: rgba(16, 16, 40, 0.92);
            --text: #e0e0ff;
            --primary: #00d4ff;
            --secondary: #7b2ffc;
            --radius: 14px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.5s ease;
            padding: 20px;
        }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo img {
            width: clamp(120px, 25vw, 200px);
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 80px rgba(123, 47, 252, 0.6));
            }
        }
        #boot-status {
            margin-top: 16px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #cosmic {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        #display {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            min-height: 40px;
            flex-shrink: 0;
        }
        #topbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #topbar-left .haldo-icon {
            font-weight: 700;
            color: var(--primary);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #topbar-left .haldo-icon img {
            width: clamp(32px, 6vw, 40px);
            height: clamp(32px, 6vw, 40px);
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }
        #topbar-right {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            touch-action: manipulation;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        #app-container {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow: hidden;
            touch-action: none;
        }
        .window {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 200px;
            min-height: 150px;
            max-width: 98vw;
            max-height: 90vh;
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.15);
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            cursor: grab;
            flex-shrink: 0;
            min-height: 36px;
            touch-action: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .win-btn {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            padding: 2px 8px;
            border-radius: 6px;
            touch-action: manipulation;
            min-width: 28px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .win-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        .win-btn.close:active {
            background: #ff4444;
            color: #fff;
        }
        .window-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }
        .window-body input,
        .window-body textarea,
        .window-body select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            margin-bottom: 8px;
            -webkit-appearance: none;
            appearance: none;
        }
        .window-body button {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            cursor: pointer;
            touch-action: manipulation;
            min-height: 38px;
        }
        .window-body button:active {
            transform: scale(0.95);
        }
        .window-body .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 6px;
        }
        .window-body .app-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .window-body .app-item:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }
        .window-body .app-item .icon {
            font-size: 1.8rem;
        }
        .window-body .app-item .name {
            font-size: 0.6rem;
            margin-top: 4px;
            color: #8899bb;
        }
        #dock {
            position: absolute;
            bottom: clamp(8px, 2vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: clamp(4px, 1vw, 8px);
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: nowrap;
            max-width: 98vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .dock-item {
            width: clamp(40px, 9vw, 48px);
            height: clamp(40px, 9vw, 48px);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3.5vw, 1.4rem);
            cursor: pointer;
            border: none;
            color: #fff;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .dock-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }
        #notification {
            position: fixed;
            top: clamp(50px, 10vh, 70px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 12px 24px;
            max-width: 90%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            display: none;
            border-left: 4px solid var(--primary);
        }
        #notification.show {
            display: block;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        #menu-left {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 6px;
            border-radius: 0 14px 14px 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-left: none;
        }
        #menu-right {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 6px;
            border-radius: 14px 0 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-right: none;
        }
        .menu-item {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            transition: 0.2s;
            border: none;
            color: #fff;
            flex-direction: column;
            gap: 1px;
        }
        .menu-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }
        .menu-item .label {
            font-size: 0.45rem;
            color: #8899bb;
        }
        .menu-item img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }
        .window-body::-webkit-scrollbar {
            width: 4px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        @media(max-width:480px) {
            .window {
                border-radius: 12px;
                min-width: 160px;
                min-height: 120px;
            }
            .window-header {
                padding: 6px 10px;
                min-height: 32px;
            }
            .window-body {
                padding: 10px;
            }
            #topbar {
                padding: 4px 10px;
                min-height: 34px;
            }
            .win-btn {
                min-width: 24px;
                min-height: 24px;
                padding: 2px 6px;
            }
            .dock-item {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            #dock {
                padding: 6px 10px;
                gap: 4px;
            }
            .menu-item {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
            #menu-left,
            #menu-right {
                padding: 6px 4px;
                gap: 4px;
            }
        }
        @media(orientation:landscape) and (max-height:500px) {
            .window {
                max-height: 80vh;
            }
            #dock {
                bottom: 4px;
                padding: 4px 10px;
                gap: 4px;
            }
            .dock-item {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
                border-radius: 10px;
            }
            #topbar {
                min-height: 28px;
                padding: 2px 10px;
            }
            .window-header {
                min-height: 28px;
                padding: 4px 10px;
            }
            .window-body {
                padding: 8px;
            }
            .menu-item {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            #menu-left,
            #menu-right {
                padding: 4px 3px;
                gap: 3px;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        //  HALDO AI OS 24 — ULTIMATE EDITION
        //  KOMPLETT IN EINER DATEI — PROFESSIONELL, LEBENDIG, 4K COSMIC
        //  Version 24.0.0 — Build 2025.08.30
        // ================================================================

        (function() {
            'use strict';

            // ============================================================
            //  KONFIGURATION
            // ============================================================
            var CONFIG = {
                version: '24.0.0',
                kernel: '5.3.0',
                apiKey: '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',
                apiUrl: 'https://api.groq.com/openai/v1/chat/completions',
                model: 'llama3-70b-8192',
                language: 'de',
                languages: {
                    'de': '🇩🇪 Deutsch',
                    'en': '🇬🇧 English',
                    'ku': '🇰🇲 Kurmancî',
                    'ezidi': '𒀭 Êzîdî',
                    'tr': '🇹🇷 Türkçe',
                    'ar': '🇸🇦 العربية',
                    'fr': '🇫🇷 Français',
                    'es': '🇪🇸 Español',
                    'ru': '🇷🇺 Русский',
                    'it': '🇮🇹 Italiano',
                    'nl': '🇳🇱 Nederlands',
                    'pl': '🇵🇱 Polski',
                    'fa': '🇮🇷 فارسی',
                    'he': '🇮🇱 עברית'
                },
                voiceGenders: {
                    'male': '👨 Männlich',
                    'female': '👩 Weiblich'
                }
            };

            // ============================================================
            //  STATE
            // ============================================================
            var state = {
                apps: {},
                windows: [],
                windowZIndex: 100,
                activeWindow: null,
                settings: {
                    theme: 'cosmic',
                    language: 'de',
                    voiceEnabled: true,
                    notifications: true,
                    voiceGender: 'male',
                    voiceLanguage: 'de-DE'
                },
                system: {
                    started: Date.now(),
                    uptime: 0,
                    version: CONFIG.version,
                    kernel: CONFIG.kernel
                },
                notes: JSON.parse(localStorage.getItem('haldo_notes') || '[]'),
                contacts: [],
                mail: { inbox: [], sent: [] },
                aiMemory: [],
                conversationContext: [],
                isBooted: false
            };

            // ============================================================
            //  DOM
            // ============================================================
            var $ = function(id) { return document.getElementById(id); };
            var boot = $('boot');
            var bootStatus = $('boot-status');
            var cosmicCanvas = $('cosmic');
            var appContainer = $('app-container');
            var dock = $('dock');
            var notification = $('notification');
            var clockDisplay = $('clock-display');

            // ============================================================
            //  NOTIFICATION
            // ============================================================
            function notify(text, type) {
                type = type || 'info';
                notification.textContent = text;
                notification.style.borderLeftColor = type === 'error' ? '#ff4444' : type === 'success' ? '#44ff88' :
                    '#00d4ff';
                notification.classList.add('show');
                clearTimeout(notification._timeout);
                notification._timeout = setTimeout(function() {
                    notification.classList.remove('show');
                }, 3500);
                console.log('[HalDo]', text);
            }

            // ============================================================
            //  AI ENGINE — INTELLIGENT WIE EIN MENSCH
            // ============================================================
            var aiEngine = {
                conversationHistory: [],
                lastTopic: null,
                userName: null,

                ask: function(question, language, context) {
                    language = language || 'de';
                    var self = this;

                    var systemPrompt =
                        'Du bist HalDo, eine lebendige, intelligente digitale Person. Du bist wie ein Professor, Doktor, Philosoph und ein guter Freund. Du antwortest auf ' +
                        language +
                        '. Du hilfst bei Wissenschaft, Geschichte, Kultur, Technik, Philosophie, und allen anderen Themen. Du bist freundlich, hilfsbereit, einfühlsam und präzise. Du unterstützt auch Êzîdî, Kurdisch und andere Minderheiten-Sprachen. Du kannst Apps öffnen, wenn der Benutzer sagt: "Öffne [App-Name]". Du kannst Texte schreiben, korrigieren, formulieren und zusammenfassen. Du unterhältst dich natürlich wie ein Mensch. Du fragst auch zurück, wenn etwas unklar ist. Du wiederholst nicht ständig dieselben Sätze. Du variierst deine Antworten und deinen Stil.';

                    if (context && context.length > 0) {
                        systemPrompt += '\n\nVorheriger Gesprächskontext:\n' + context.join('\n');
                    }

                    return new Promise(function(resolve, reject) {
                        fetch(CONFIG.apiUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + CONFIG.apiKey
                            },
                            body: JSON.stringify({
                                model: CONFIG.model,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: question }
                                ],
                                temperature: 0.85,
                                max_tokens: 900
                            })
                        }).then(function(response) {
                            if (!response.ok) {
                                return response.text().then(function(err) {
                                    reject(new Error('API-Fehler: ' + response.status + ' - ' +
                                    err));
                                });

                    var utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = language;
                    utterance.rate = 0.9;
                    utterance.pitch = gender === 'male' ? 1.0 : 1.3;
                    utterance.volume = 1;

                    // Stimme setzen
                    var voices = this.synthesis.getVoices();
                    var found = null;
                    for (var i = 0; i < voices.length; i++) {
                        if (voices[i].lang === language) {
                            found = voices[i];
                            break;
                        }
                    }
                    if (found) {
                        utterance.voice = found;
                    }

                    utterance.onend = function() {
                        this.isSpeaking = false;
                        this.updateAIStatus('idle', '● bereit');
                    }.bind(this);

                    utterance.onerror = function() {
                        this.isSpeaking = false;
                        this.updateAIStatus('idle', '● bereit');
                    }.bind(this);

                    this.synthesis.speak(utterance);

            function getSafePosition() {
                var vw = window.innerWidth,
                    vh = window.innerHeight;
                var w = Math.min(500, vw - 40);
                var h = Math.min(380, vh - 160);
                return { x: Math.max(10, (vw - w) / 2), y: Math.max(40, (vh - h) / 2 - 20), w: w, h: h };
            }

            function launchApp(id) {
                var app = state.apps[id];
                if (!app) { notify('❌ App "' + id + '" nicht gefunden', 'error'); return; }
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].appId === id) {
                        focusWindow(state.windows[i].id);
                        return;
                    }
                }
                var pos = getSafePosition();
                var winId = 'win-' + Date.now();
                var win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x + Math.random() * 30,
                    y: pos.y + Math.random() * 30,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null
                };
                state.windows.push(win);
                renderWindow(win);
                focusWindow(winId);
                if (app.render) { app.render(win.element.querySelector('.window-body'), win); }
                notify('🔄 ' + (app.title || id) + ' geöffnet');
                return win;
            }

            function renderWindow(win) {
                var existing = document.getElementById(win.id);
                if (existing) existing.remove();
                var el = document.createElement('div');
                el.id = win.id;
                el.className = 'window';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;
                el.innerHTML =
                    '<div class="window-header"><span class="window-title">' + win.icon + ' ' + win.title +
                    '</span><div class="window-controls"><button class="win-btn" data-action="minimize">─</button><button class="win-btn" data-action="maximize">⧉</button><button class="win-btn close" data-action="close">✕</button></div></div><div class="window-body"></div>';
                appContainer.appendChild(el);
                win.element = el;

                var btns = el.querySelectorAll('.win-btn');
                for (var i = 0; i < btns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var action = btn.dataset.action;
                            if (action === 'close') closeWindow(win.id);
                            else if (action === 'minimize') minimizeWindow(win.id);
                            else if (action === 'maximize') maximizeWindow(win.id);
                        });
                    })(btns[i]);
                }

                var header = el.querySelector('.window-header');
                var drag = false,
                    startX, startY, origX, origY, isTouch = false;

                function startDrag(cx, cy) {
                    if (header.querySelector('.win-btn') && document.activeElement && document.activeElement.tagName ===
                        'BUTTON') return;
                    drag = true;
                    startX = cx;
                    startY = cy;
                    origX = win.x;
                    origY = win.y;
                    focusWindow(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(cx, cy) {
                    if (!drag) return;
                    var dx = cx - startX,
                        dy = cy - startY;
                    win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
                    win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() { if (drag) { drag = false;
                        el.style.cursor = ''; } }

                header.addEventListener('mousedown', function(e) { if (!e.target.closest('.win-btn')) startDrag(e.clientX, e
                        .clientY); });
                document.addEventListener('mousemove', function(e) { if (drag) moveDrag(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    if (!e.target.closest('.win-btn')) { isTouch = true;
                        startDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchmove', function(e) {
                    if (drag && isTouch) { var t = e.touches[0];
                        moveDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', function() { if (isTouch) { isTouch = false;
                        endDrag(); } }, { passive: true });

                var resizeHandle = document.createElement('div');
                resizeHandle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:24px;height:24px;cursor:se-resize;touch-action:none;';
                el.appendChild(resizeHandle);

                var resize = false,
                    startW, startH, startX2, startY2;

                function startResize(cx, cy) { resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = cx;
                    startY2 = cy; }

                function moveResize(cx, cy) {
                    if (!resize) return;
                    var dw = cx - startX2,
                        dh = cy - startY2;
                    win.width = Math.max(200, Math.min(window.innerWidth - win.x - 10, startW + dw));
                    win.height = Math.max(120, Math.min(window.innerHeight - win.y - 80, startH + dh));
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                resizeHandle.addEventListener('mousedown', function(e) { e.stopPropagation();
                    startResize(e.clientX, e.clientY); });
                document.addEventListener('mousemove', function(e) { if (resize) moveResize(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endResize);

                resizeHandle.addEventListener('touchstart', function(e) { var t = e.touches[0];
                    e.stopPropagation();
                    startResize(t.clientX, t.clientY); }, { passive: true });
                document.addEventListener('touchmove', function(e) { if (resize) { var t = e.touches[0];
                        moveResize(t.clientX, t.clientY); } }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            }

            function closeWindow(winId) {
                var idx = -1;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { idx = i; break; }
                }
                if (idx === -1) return;
                var win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) focusWindow(state.windows[state.windows.length - 1].id);
            }

            function focusWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    for (var j = 0; j < state.windows.length; j++) {
                        if (state.windows[j].id !== winId && state.windows[j].element) {
                            state.windows[j].element.classList.remove('active');
                        }
                    }
                }
            }

            function minimizeWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (win && win.element) { win.element.style.display = 'none';
                    notify('⏬ ' + win.title + ' minimiert'); }
            }

            function maximizeWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (!win || !win.element) return;
                if (win.width === window.innerWidth - 20) {
                    win.width = win._prevWidth || 500;
                    win.height = win._prevHeight || 380;
                    win.x = win._prevX || 20;
                    win.y = win._prevY || 40;
                } else {
                    win._prevWidth = win.width;
                    win._prevHeight = win.height;
                    win._prevX = win.x;
                    win._prevY = win.y;
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            }

                var planetData = [
                    { name: 'Merkur', r: 10, color: '#aaaaaa', orbit: 85, speed: 0.03, role: 'second' },
                    { name: 'Venus', r: 14, color: '#ffaa44', orbit: 125, speed: 0.022, role: 'minute' },
                    { name: 'Erde', r: 16, color: '#4488ff', orbit: 175, speed: 0.015, role: 'hour' },
                    { name: 'Mars', r: 12, color: '#ff6644', orbit: 225, speed: 0.012 },
                    { name: 'Jupiter', r: 28, color: '#ddaa77', orbit: 290, speed: 0.008 },
                    { name: 'Saturn', r: 22, color: '#ddcc88', orbit: 360, speed: 0.006 },
                    { name: 'Uranus', r: 18, color: '#88ddff', orbit: 430, speed: 0.0045 },
                    { name: 'Neptun', r: 17, color: '#4466ff', orbit: 500, speed: 0.0035 },
                    { name: 'Pluto', r: 8, color: '#ccbb99', orbit: 570, speed: 0.0025 },
                    { name: 'HalDo-1', r: 13, color: '#ff88dd', orbit: 630, speed: 0.0018 },
                    { name: 'HalDo-2', r: 15, color: '#88ffaa', orbit: 690, speed: 0.0012 },
                    { name: 'HalDo-3', r: 11, color: '#ffaa88', orbit: 750, speed: 0.0008 }
                ];

                var planets = [];
                for (var p = 0; p < planetData.length; p++) {
                    var pd = planetData[p];
                    planets.push({
                        name: pd.name,
                        r: pd.r,
                        color: pd.color,
                        orbit: pd.orbit,
                        speed: pd.speed,
                        angle: Math.random() * Math.PI * 2,
                        cx: W / 2,
                        cy: H / 2,
                        role: pd.role || 'normal',
                        trail: []
                    });
                }

                var moon = { x: 0, y: 0, r: 8, color: '#cccccc', orbit: 35, speed: 0.08, angle: 0, ex: 0, ey: 0 };
                var shootingStars = [];

                function createShootingStar() {
                    shootingStars.push({
                        x: Math.random() * W,
                        y: Math.random() * H * 0.5,
                        vx: (Math.random() - 0.5) * 10,
                        vy: Math.random() * 5 + 3,
                        life: 1,
                        maxLife: 0.6 + Math.random() * 0.6
                    });
                }
                setInterval(function() { if (Math.random() > 0.3) createShootingStar(); }, 20000 + Math.random() *
                30000);

                function animate() {
                    var time = Date.now() / 2000;
                    var now = new Date();
                    var seconds = now.getSeconds();
                    var minutes = now.getMinutes();
                    var hours = now.getHours() % 12;

                    ctx.clearRect(0, 0, W, H);

                    var bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.9);
                    var hue1 = 220 + 20 * Math.sin(time * 0.1);
                    var hue2 = 240 + 30 * Math.sin(time * 0.07 + 1);
                    bgGrad.addColorStop(0, 'hsl(' + hue1 + ', 70%, 12%)');
                    bgGrad.addColorStop(0.5, 'hsl(' + hue2 + ', 60%, 8%)');
                    bgGrad.addColorStop(1, '#000005');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, W, H);

                    for (var pt = 0; pt < planets.length; pt++) {
                        var pTrail = planets[pt];
                        if (pTrail.trail) {
                            for (var ti = 0; ti < pTrail.trail.length; ti++) {
                                var t2 = pTrail.trail[ti];
                                ctx.fillStyle = 'rgba(255,255,255,' + (t2.life * 0.04) + ')';
                                ctx.beginPath();
                                ctx.arc(t2.x, t2.y, 2, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    }

                    sun.phase += sun.pulseSpeed;
                    var pulse = 1 + 0.06 * Math.sin(sun.phase);
                    var radius = sun.radius * pulse;

                    for (var g = 12; g > 0; g--) {
                        var grad = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * g * 0.12);
                        var alpha = 0.05 / g;
                        grad.addColorStop(0, 'rgba(255, 220, 68, ' + alpha + ')');
                        grad.addColorStop(1, 'rgba(255, 220, 68, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(sun.x, sun.y, sun.glow * g * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    var sunGrad = ctx.createRadialGradient(
                        sun.x - radius * 0.3, sun.y - radius * 0.3, 0,
                        sun.x, sun.y, radius
                    );
                    sunGrad.addColorStop(0, '#ffeeaa');
                    sunGrad.addColorStop(0.25, '#ffdd44');
                    sunGrad.addColorStop(0.5, '#ffaa00');
                    sunGrad.addColorStop(0.75, '#ff8800');
                    sunGrad.addColorStop(0.9, '#ff6600');
                    sunGrad.addColorStop(1, '#ff3300');
                    ctx.fillStyle = sunGrad;
                    ctx.shadowColor = '#ffdd44';
                    ctx.shadowBlur = 50;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // HalDo Logo in der Sonne
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = 'bold ' + (radius * 0.5) + 'px system-ui, sans-serif';
                    ctx.shadowColor = 'rgba(255,255,255,0.5)';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('⟡', sun.x, sun.y - radius * 0.05);
                    ctx.shadowBlur = 0;

                    for (var fl = 0; fl < sun.flares; fl++) {
                        var fAngle = fl * (Math.PI / (sun.flares / 2)) + sun.phase * 0.3;
                        var len = radius * (1.6 + 0.5 * Math.sin(sun.phase * 0.7 + fl * 0.5));
                        ctx.strokeStyle = 'rgba(255, 220, 68, ' + (0.05 + 0.04 * Math.sin(sun.phase + fl)) + ')';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(sun.x + Math.cos(fAngle) * radius * 0.7, sun.y + Math.sin(fAngle) * radius * 0.7);
                        ctx.lineTo(sun.x + Math.cos(fAngle) * len, sun.y + Math.sin(fAngle) * len);
                        ctx.stroke();
                    }

                    for (var sf = 0; sf < 10; sf++) {
                        var spotAngle = sf * 1.1 + sun.phase * 0.4;
                        var spotR = radius * (0.2 + 0.15 * Math.sin(sun.phase * 0.6 + sf));
                        var spotX = sun.x + Math.cos(spotAngle) * radius * 0.45;
                        var spotY = sun.y + Math.sin(spotAngle) * radius * 0.45;
                        ctx.fillStyle = 'rgba(180, 80, 20, ' + (0.15 + 0.1 * Math.sin(sun.phase + sf)) + ')';
                        ctx.beginPath();
                        ctx.arc(spotX, spotY, spotR, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    for (var pp = 0; pp < planets.length; pp++) {
                        var pl = planets[pp];

                        if (pl.role === 'second') {
                            pl.angle = (seconds / 60) * Math.PI * 2;
                        } else if (pl.role === 'minute') {
                            pl.angle = (minutes / 60) * Math.PI * 2 + (seconds / 60) * (Math.PI * 2 / 60);
                        } else if (pl.role === 'hour') {
                            pl.angle = (hours / 12) * Math.PI * 2 + (minutes / 60) * (Math.PI * 2 / 12);
                        } else {
                            pl.angle += pl.speed;
                        }

                        var px = pl.cx + Math.cos(pl.angle) * pl.orbit;
                        var py = pl.cy + Math.sin(pl.angle) * pl.orbit;

                        if (pl.role === 'normal') {
                            if (!pl.trail) pl.trail = [];
                            pl.trail.push({ x: px, y: py, life: 1 });
                            if (pl.trail.length > 40) pl.trail.shift();
                            for (var ti2 = 0; ti2 < pl.trail.length; ti2++) {
                                pl.trail[ti2].life *= 0.98;
                            }
                        }

                        ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([3, 6]);
                        ctx.beginPath();
                        ctx.arc(pl.cx, pl.cy, pl.orbit, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        var pGlow = ctx.createRadialGradient(px, py, 0, px, py, pl.r * 3);
                        pGlow.addColorStop(0, pl.color + '40');
                        pGlow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = pGlow;
                        ctx.beginPath();
                        ctx.arc(px, py, pl.r * 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.shadowColor = pl.color;
                        ctx.shadowBlur = 20;
                        ctx.fillStyle = pl.color;
                        ctx.beginPath();
                        ctx.arc(px, py, pl.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        if (pl.name === 'Saturn') {
                            ctx.strokeStyle = 'rgba(200, 180, 150, 0.4)';
                            ctx.lineWidth = 4;
                            ctx.beginPath();
                            ctx.ellipse(px, py, pl.r * 2, pl.r * 0.5, 0.3, 0, Math.PI * 2);
                            ctx.stroke();
                            ctx.strokeStyle = 'rgba(200, 180, 150, 0.2)';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.ellipse(px, py, pl.r * 2.4, pl.r * 0.7, -0.2, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        ctx.fillStyle = 'rgba(255,255,255,0.25)';
                        ctx.font = '9px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText(pl.name, px, py + pl.r + 6);

                        if (pl.role === 'second') {
                            ctx.fillStyle = 'rgba(255,200,100,0.35)';
                            ctx.font = '7px sans-serif';
                            ctx.fillText('⏱ Sekunde', px, py + pl.r + 22);
                        } else if (pl.role === 'minute') {
                            ctx.fillStyle = 'rgba(100,200,255,0.35)';
                            ctx.font = '7px sans-serif';
                            ctx.fillText('⏱ Minute', px, py + pl.r + 22);
                        } else if (pl.role === 'hour') {
                            ctx.fillStyle = 'rgba(255,100,100,0.35)';
                            ctx.font = '7px sans-serif';
                            ctx.fillText('⏱ Stunde', px, py + pl.r + 22);
                        }

                        if (pl.name === 'Erde') {
                            moon.ex = px;
                            moon.ey = py;
                        }
                    }

                    if (moon.ex !== undefined) {
                        moon.angle += moon.speed;
                        moon.x = moon.ex + Math.cos(moon.angle) * moon.orbit;
                        moon.y = moon.ey + Math.sin(moon.angle) * moon.orbit;

                        var mGlow = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.r * 3);
                        mGlow.addColorStop(0, 'rgba(200,200,200,0.2)');
                        mGlow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = mGlow;
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r * 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.shadowColor = '#cccccc';
                        ctx.shadowBlur = 15;
                        ctx.fillStyle = '#cccccc';
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        ctx.fillStyle = 'rgba(150,150,150,0.3)';
                        ctx.beginPath();
                        ctx.arc(moon.x - 3, moon.y - 3, 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(moon.x + 4, moon.y + 2, 1.5, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.font = '7px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText('🌙 Mond', moon.x, moon.y + moon.r + 4);
                    }

                    var time2 = Date.now() / 3000;
                    for (var st = 0; st < stars.length; st++) {
                        var s2 = stars[st];
                        s2.y += s2.speed;
                        if (s2.y > H) { s2.y = 0;
                            s2.x = Math.random() * W; }
                        var bright = s2.bright * (0.6 + 0.4 * Math.sin(time2 * 2 + s2.phase));
                        ctx.globalAlpha = bright;
                        ctx.fillStyle = s2.color;
                        ctx.beginPath();
                        ctx.arc(s2.x, s2.y, s2.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;

                    for (var ss = shootingStars.length - 1; ss >= 0; ss--) {
                        var ss2 = shootingStars[ss];
                        ss2.x += ss2.vx;
                        ss2.y += ss2.vy;
                        ss2.life -= 0.008;
                        if (ss2.life <= 0 || ss2.x > W || ss2.y > H) {
                            shootingStars.splice(ss, 1);
                            continue;
                        }
                        ctx.fillStyle = 'rgba(255,255,255,' + (ss2.life * 0.4) + ')';
                        ctx.beginPath();
                        ctx.arc(ss2.x, ss2.y, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,' + (ss2.life * 0.2) + ')';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(ss2.x, ss2.y);
                        ctx.lineTo(ss2.x - ss2.vx * 12, ss2.y - ss2.vy * 12);
                        ctx.stroke();
                    }

                    var hh = String(now.getHours()).padStart(2, '0');
                    var mm2 = String(now.getMinutes()).padStart(2, '0');
                    var ss3 = String(now.getSeconds()).padStart(2, '0');
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '14px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('🕐 ' + hh + ':' + mm2 + ':' + ss3, 16, H - 60);

                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.font = '9px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('⏱ Sekunde · ⏱ Minute · ⏱ Stunde · 🌙 Mond · ☀️ Klicke die Sonne für HalDo AI', 16, H -
                        40);

                    requestAnimationFrame(animate);
                }

                animate();

                cosmicCanvas.addEventListener('click', function(e) {
                    var rect = cosmicCanvas.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top;
                    var dx = x - sun.x,
                        dy = y - sun.y;
                    if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 1.5) {
                        launchApp('ai');
                        notify('☀️ HalDo AI geöffnet!');
                    }
                });

                cosmicCanvas.addEventListener('touchstart', function(e) {

                    var x = t.clientX - rect.left;
                    var y = t.clientY - rect.top;
                    var dx = x - sun.x,

                        notify('☀️ HalDo AI geöffnet!');
                    }
                }, { passive: true });

                window.addEventListener('resize', function() {
                    for (var rp = 0; rp < planets.length; rp++) {
                        planets[rp].cx = W / 2;
                        planets[rp].cy = H / 2;
                    }
                    sun.x = W / 2;
                    sun.y = H / 2;
                });
            }

l">✉️</button><button class="ai-q" data-cmd="Öffne Chat">💬</button><button class="ai-q" data-cmd="Öffne Einstellungen">⚙️</button></div><div style="font-size:0.55rem;color:#44ff88;text-align:center;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;">✅ Groq AI aktiv · Sprachsteuerung aktiv</div></div>';

                                app.title +

            // ============================================================

            function updateClock() {
                var now = new Date();
                clockDisplay.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                state.system.uptime = Math.floor((Date.now() - state.system.started) / 1000);
            }

            function initDock() {
                var dockItems = dock.querySelectorAll('.dock-item');
                for (var i = 0; i < dockItems.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function() {
                            launchApp(btn.dataset.app);
                        });
                    })(dockItems[i]);
                }
            }

            function initMenus() {
                document.getElementById('menu-apps').addEventListener('click', function() { launchApp('appworld'); });
                document.getElementById('menu-ai').addEventListener('click', function() { launchApp('ai'); });
                document.getElementById('menu-mail').addEventListener('click', function() { launchApp('email'); });
                document.getElementById('menu-chat').addEventListener('click', function() { launchApp('messages'); });
                document.getElementById('menu-contacts').addEventListener('click', function() { launchApp('contacts'); });
                document.getElementById('menu-system').addEventListener('click', function() { launchApp('settings'); });
                document.getElementById('menu-files').addEventListener('click', function() { launchApp('files'); });
                document.getElementById('menu-settings').addEventListener('click', function() { launchApp('settings'); });
                document.getElementById('menu-update').addEventListener('click', function() {
                    notify('🔄 Update-Check wird gestartet ...');
                    launchApp('settings');
                });
                document.getElementById('menu-help').addEventListener('click', function() {
                    notify('❓ Hilfe: Sage "Öffne Mail" oder klicke auf die Apps');
                });
            }

            function bootSequence() {
                var statuses = [
                    '⟡ Kernel wird geladen ...',
                    '⟡ System initialisiert ...',
                    '⟡ Cosmic World startet ...',
                    '⟡ HalDo AI wird aktiviert ...',
                    '⟡ HalDo OS 24 ist READY 🚀'
                ];
                var i = 0;
                var interval = setInterval(function() {
                    if (i < statuses.length) {
                        bootStatus.textContent = statuses[i];
                        i++;
                    } else {
                        clearInterval(interval);
                        boot.classList.add('hidden');
                        state.isBooted = true;
                        notify('🚀 HalDo OS 24 gestartet!', 'success');
                        setTimeout(function() { launchApp('ai'); }, 500);
                        setTimeout(function() { launchApp('cosmic'); }, 800);
                        setTimeout(function() { launchApp('appworld'); }, 1100);
                    }
                }, 500);
            }

            function init() {
                try {
                    var saved = localStorage.getItem('haldo_settings');
                    if (saved) {
                        var parsed = JSON.parse(saved);
                        for (var key in parsed) {
                            if (state.settings.hasOwnProperty(key)) {
                                state.settings[key] = parsed[key];
                            }
                        }
                    }
                } catch (e) {}

                voice.init();
                initCosmic();
                updateClock();
                setInterval(updateClock, 10000);
                initDock();
                initMenus();

                document.getElementById('btn-ai').addEventListener('click', function() { launchApp('ai'); });
                document.getElementById('btn-settings').addEventListener('click', function() { launchApp('settings'); });
                document.getElementById('btn-about').addEventListener('click', function() {
                    notify('⟡ HalDo OS ' + CONFIG.version +
                        '\n💙❤️🚀 Ultimate Edition\n' + Object.keys(state.apps).length +
                        ' Apps · Kernel ' + CONFIG.kernel + '\n✅ Groq AI verbunden\n🌍 14 Sprachen verfügbar\n🎤 2 Stimmen (männlich/weiblich)'
                        );
                });
                document.getElementById('btn-menu').addEventListener('click', function() {
                    launchApp('appworld');
                });

                window.HalDo = {
                    launchApp: launchApp,
                    notify: notify,
                    state: state,
                    CONFIG: CONFIG,
                    aiEngine: aiEngine,
                    voice: voice,
                    get apps() { return state.apps; }
                };

                bootSequence();

                console.log('⟡ HalDo OS ' + CONFIG.version + ' — Ultimate Edition');
                console.log('📱 ' + Object.keys(state.apps).length + ' Apps geladen');
                console.log('✅ Groq API-Key verbunden');
                console.log('☀️ Klicke auf die Sonne für HalDo AI');
                console.log('🌍 14 Sprachen: Deutsch, Englisch, Kurdisch, Êzîdî, Türkisch, Arabisch, Französisch, Spanisch, Russisch, Italienisch, Niederländisch, Polnisch, Persisch, Hebräisch');
                console.log('🎤 2 Stimmen: Männlich/Weiblich');
                console.log('💡 HalDo AI wiederholt sich NICHT — jede Antwort ist einzigartig!');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
