<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>HalDo AI OS — 100 Apps Professional</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0e1a;
            --surface: rgba(16, 22, 42, 0.92);
            --border: rgba(255, 255, 255, 0.05);
            --text: #e8edf5;
            --gold: #ffd54b;
            --gold-dark: #ff9f1c;
            --radius: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
        }
        #app {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 30% 20%, rgba(30, 60, 140, 0.12), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(80, 40, 160, 0.08), transparent 50%),
                var(--bg);
            padding: 8px;
            gap: 6px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 12px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex-shrink: 0;
            backdrop-filter: blur(16px);
            height: 38px;
        }
        .top-bar .logo {
            font-size: 14px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .top-bar .time {
            font-size: 11px;
            opacity: 0.5;
            font-family: monospace;
        }
        .top-bar .status {
            font-size: 9px;
            opacity: 0.4;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .top-bar .status .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .content {
            flex: 1;
            display: flex;
            gap: 6px;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            width: 160px;
            flex-shrink: 0;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 4px;
            overflow-y: auto;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .sidebar .app-btn {
            padding: 5px 8px;
            border-radius: 5px;
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            text-align: left;
            font-size: 10.5px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            width: 100%;
            line-height: 1.3;
        }
        .sidebar .app-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .sidebar .app-btn.active {
            background: rgba(255, 200, 80, 0.08);
            border-color: rgba(255, 200, 80, 0.12);
            color: var(--gold);
        }
        .sidebar .app-btn .icon {
            font-size: 13px;
            width: 18px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar .app-btn .badge {
            margin-left: auto;
            font-size: 8px;
            background: rgba(255, 80, 80, 0.2);
            color: #ff6b6b;
            padding: 1px 5px;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            backdrop-filter: blur(16px);
            min-width: 0;
        }
        .app-header {
            padding: 6px 12px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 34px;
        }
        .app-header .actions {
            display: flex;
            gap: 3px;
        }
        .app-header .actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, 0.5);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }
        .app-header .actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .btn-primary {
            padding: 5px 14px;
            border-radius: 5px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0a0e1a;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 11px;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(255, 200, 80, 0.2);
        }
        .btn-secondary {
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 10px;
            transition: background 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-danger {
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(255, 80, 80, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 80, 80, 0.15);
            cursor: pointer;
            font-size: 10px;
            transition: background 0.2s;
        }
        .btn-danger:hover {
            background: rgba(255, 80, 80, 0.2);
        }
        input,
        textarea,
        select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(255, 200, 80, 0.25);
        }
        textarea {
            resize: vertical;
            min-height: 30px;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 8px 10px;
            margin-bottom: 6px;
            transition: background 0.2s;
        }
        .card:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .card .card-title {
            font-weight: 600;
            font-size: 12px;
        }
        .card .card-meta {
            font-size: 10px;
            opacity: 0.35;
            margin-top: 1px;
        }
        .card .card-actions {
            margin-top: 5px;
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }
        .warning-card {
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #ff6b6b;
            background: rgba(255, 80, 80, 0.05);
            animation: warnIn 0.3s ease-out;
        }
        .warning-card.baustelle {
            border-left-color: #ffa94d;
            background: rgba(255, 169, 77, 0.05);
        }
        .warning-card.sperrung {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
        }
        .warning-card.gefahr {
            border-left-color: #ff0000;
            background: rgba(255, 0, 0, 0.06);
        }
        .warning-card.blitzer {
            border-left-color: #ffd93d;
            background: rgba(255, 217, 61, 0.05);
        }
        @keyframes warnIn {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .warning-card .w-icon {
            font-size: 18px;
        }
        .warning-card .w-info {
            flex: 1;
        }
        .warning-card .w-info .w-title {
            font-weight: 700;
            font-size: 12px;
        }
        .warning-card .w-info .w-desc {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 1px;
        }
        .warning-card .w-time {
            font-size: 9px;
            opacity: 0.25;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .flex-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .flex-row>* {
            flex: 1;
            min-width: 60px;
        }
        .flex-row .btn-primary,
        .flex-row .btn-secondary,
        .flex-row .btn-danger {
            flex: 0 0 auto;
        }
        .question-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .question-item .q-title {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .question-item .q-image {
            font-size: 32px;
            text-align: center;
            padding: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .question-item .q-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 6px;
            cursor: pointer;
            font-size: 11px;
        }
        .question-item .q-options label:hover {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
        }
        .question-item .q-options input[type="radio"],
        .question-item .q-options input[type="checkbox"] {
            width: 12px;
            height: 12px;
            accent-color: var(--gold);
            flex: 0 0 auto;
        }
        @media (max-width: 700px) {
            .sidebar {
                width: 44px;
                padding: 3px;
            }
            .sidebar .app-btn span:not(.icon) {
                display: none;
            }
            .sidebar .app-btn {
                justify-content: center;
                padding: 6px;
            }
            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr;
            }
            #app {
                padding: 4px;
                gap: 4px;
            }
            .app-body {
                padding: 6px;
            }
            .top-bar .status {
                display: none;
            }
        }
        @media (max-width: 480px) {
            .sidebar {
                width: 36px;
            }
            .sidebar .app-btn .icon {
                font-size: 11px;
                width: 14px;
            }
            .top-bar .logo {
                font-size: 11px;
            }
            .app-header {
                font-size: 11px;
                padding: 4px 8px;
            }
            .app-body {
                padding: 4px;
            }
            .card {
                padding: 6px 8px;
            }
        }
    </style>
</head>

    <script>
        "use strict";

        // =========================================================
        // VERSION
        // =========================================================
        const HALDO_VERSION = "20.0.0";
        const HALDO_BUILD = "100-APPS-PROFESSIONAL";

        // =========================================================
        // STORAGE
        // =========================================================
        const Storage = {
            prefix: 'haldo_',
            get(key, def = null) {
                try {
                    const val = localStorage.getItem(this.prefix + key);
                    if (val === null) return def;
                    try { return JSON.parse(val); } catch (e) { return val; }
                } catch (e) { return def; }
            },
            set(key, val) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(val)); return true; } catch (e) { return false; }
            },
            remove(key) {
                try { localStorage.removeItem(this.prefix + key); return true; } catch (e) { return false; }
            },
            getAll() {
                const res = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try { res[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k)); } catch (e) { res[
                                k.replace(this.prefix, '')] = localStorage.getItem(k); }
                    });
                } catch (e) {}
                return res;
            },
            clear() {
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
                    return true;
                } catch (e) { return false; }
            }
        };

        // =========================================================
        // TIME
        // =========================================================
        function updateTime() {
            const el = document.getElementById('top-time');
            if (el) el.textContent = new Date().toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        // =========================================================
        // SPEAK
        // =========================================================
        function speak(text) {
            if (!window.speechSynthesis) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.volume = 0.85;
                window.speechSynthesis.speak(utterance);
            } catch (e) {}
        }

            const el = document.getElementById('status-text');
            if (el) el.textContent = text;

            renderSidebar() {
                const sidebar = this.sidebar;
                if (!sidebar) return;
                const sorted = [...this.APP_LIST].sort((a, b) => a.name.localeCompare(b.name));
                sidebar.innerHTML = sorted.map(app =>
                    `<button class="app-btn" data-app="${app.id}">
                        <span class="icon">${app.icon}</span>
                        <span>${app.name}</span>
                    </button>`
                ).join('');
                sidebar.querySelectorAll('.app-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.switchTo(btn.dataset.app));
                });
            },

            switchTo(appId) {
                this.sidebar.querySelectorAll('.app-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.app === appId);
                });
                const app = this.APP_LIST.find(a => a.id === appId);
                if (!app) return;
                this.current = appId;
                this.header.textContent = `${app.icon} ${app.name}`;
                this.body.innerHTML = this.renderApp(appId);
                this.initApp(appId);
                setStatus(`App: ${app.name}`);

            sendAIMessage() {
                const input = document.getElementById('ai-input');
                const messages = document.getElementById('ai-chat-messages');
                const thinking = document.getElementById('ai-thinking');
                if (!input || !messages) return;
                const text = input.value.trim();
                if (!text) return;
                const userDiv = document.createElement('div');
                userDiv.style.cssText =
                    'padding:6px 10px;background:rgba(255,255,255,0.06);border-radius:6px;margin-bottom:4px;align-self:flex-end;text-align:right;border:1px solid rgba(255,255,255,0.04);font-size:12px;';
                userDiv.textContent = '👤 ' + text;
                messages.appendChild(userDiv);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
                thinking.style.display = 'block';
                setTimeout(() => {
                    thinking.style.display = 'none';
                    const response = HalDoAI.ask(text);
                    const aiDiv = document.createElement('div');
                    aiDiv.style.cssText =
                        'padding:6px 10px;background:rgba(255,200,80,0.06);border-radius:6px;margin-bottom:4px;border:1px solid rgba(255,200,80,0.06);font-size:12px;';
                    aiDiv.textContent = '🤖 ' + response;
                    messages.appendChild(aiDiv);
                    messages.scrollTop = messages.scrollHeight;
                    speak(response);
                }, 600);
            },

            voiceInput() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) { alert('Spracherkennung nicht unterstützt.'); return; }
                const rec = new Recognition();
                rec.lang = 'de-DE';
                rec.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const input = document.getElementById('ai-input');
                    if (input) input.value = text;
                    this.sendAIMessage();
                };
                rec.start();
                speak('Ich höre zu.');
            },

                        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
                            ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(b =>
                                `<button onclick="AppRouter.calcPress('${b}')" style="padding:10px;border-radius:4px;background:${['C','±','%','÷','×','−','+','='].includes(b)?'rgba(255,200,80,0.12)':'rgba(255,255,255,0.04)'};color:#fff;border:1px solid rgba(255,255,255,0.04);cursor:pointer;font-size:14px;">${b}</button>`
                            ).join('')}
                        </div>

                `;

            calcPress(val) {
                const display = document.getElementById('calc-display');
                if (!display) return;
                if (!this._calcExpr) this._calcExpr = '';
                if (val === 'C') { this._calcExpr = '';
                    display.textContent = '0'; return; }
                if (val === '⌫') { this._calcExpr = this._calcExpr.slice(0, -1);
                    display.textContent = this._calcExpr || '0'; return; }
                if (val === '=') {
                    try {
                        const result = Function('"use strict"; return (' + this._calcExpr.replace('×', '*').replace('÷', '/')
                            .replace('−', '-') + ')')();
                        display.textContent = result;
                        this._calcExpr = String(result);
                    } catch (e) { display.textContent = 'Fehler';
                        this._calcExpr = ''; }
                    return;
                }
                this._calcExpr += val;
                display.textContent = this._calcExpr;
            },

            renderTimer() {
                return `
                    <div style="text-align:center;padding:16px;">

                        <div style="display:flex;gap:6px;justify-content:center;margin-top:8px;">

                            <button onclick="AppRouter.timerReset()" class="btn-secondary">🔄 Reset</button>

                        </div>
                    </div>
                `;
            },

            timerStart() {
                const input = document.getElementById('timer-input');
                const display = document.getElementById('timer-display');
                if (!display) return;
                if (this._timerInterval) return;
                let seconds = parseInt(input?.value) || 30;
                if (seconds < 1) seconds = 1;
                if (seconds > 3600) seconds = 3600;
                this._timerSeconds = seconds;
                this._timerInterval = setInterval(() => {
                    if (this._timerSeconds <= 0) {
                        clearInterval(this._timerInterval);
                        this._timerInterval = null;
                        speak('Timer abgelaufen!');
                        display.textContent = '00:00';
                        return;
                    }
                    this._timerSeconds--;
                    const mins = Math.floor(this._timerSeconds / 60);
                    const secs = this._timerSeconds % 60;
                    display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                }, 1000);
            },

            timerStop() {
                if (this._timerInterval) { clearInterval(this._timerInterval);
                    this._timerInterval = null; }
            },

            timerReset() {
                this.timerStop();
                const display = document.getElementById('timer-display');
                if (display) display.textContent = '00:30';
            },

                const backups = Storage.get('backups', []);
                if (index === undefined || index === null) {
                    if (backups.length === 0) { speak('Keine Backups.'); return; }
                    index = backups.length - 1;
                }
                const backup = backups[index];
                if (!backup) { speak('Backup nicht gefunden.'); return; }
                if (confirm(`Backup vom ${new Date(backup.createdAt).toLocaleString()} wiederherstellen?`)) {
                    Object.entries(backup.data).forEach(([key, val]) => Storage.set(key, val));
                    speak('Backup wiederhergestellt.');
                    setTimeout(() => location.reload(), 1000);

                const backups = Storage.get('backups', []);

            checkUpdates() {
                const result = document.getElementById('update-result');
                const history = document.getElementById('update-history');
                if (!result) return;

                                <option value="esq">Êzîdî</option>

                                <option value="ku">Kurdî</option>
                                <option value="esq">Êzîdî</option>
                            </select>
                        </div>

                    </div>
                `;
            },

            translateText() {
                const text = document.getElementById('trans-text');
                const result = document.getElementById('trans-result');
                if (!text || !result) return;
                const input = text.value.trim();
                if (!input) { result.textContent = '⚠️ Bitte Text eingeben.'; return; }
                const to = document.getElementById('trans-to')?.value || 'en';
                const dict = {
                    'en': { 'Hallo': 'Hello', 'Danke': 'Thank you', 'Guten Tag': 'Good day' },
                    'de': { 'Hello': 'Hallo', 'Thank you': 'Danke', 'Good day': 'Guten Tag' },
                    'ku': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' },
                    'esq': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' }
                };
                const d = dict[to] || {};
                let translated = input;
                for (const [key, val] of Object.entries(d)) {
                    if (input.toLowerCase().includes(key.toLowerCase())) {
                        translated = translated.replace(new RegExp(key, 'gi'), val);
                    }
                }
                result.textContent = `🌍 ${translated}`;
            },

        const WarningSystem = {
            warnings: [],
            tones: { blitzer: { freq: 1400, pattern: 'short' }, baustelle: { freq: 800, pattern: 'long' },
                sperrung: { freq: 600, pattern: 'double' }, gefahr: { freq: 400, pattern: 'triple' } },
            load() { this.warnings = Storage.get('warnings', []); return this; },
            save() { Storage.set('warnings', this.warnings); return this; },
            add(type, title, description, location = 'Unbekannt') {
                const types = { blitzer: { icon: '📸', label: 'Blitzer' }, baustelle: { icon: '🚧', label: 'Baustelle' },
                    sperrung: { icon: '🚫', label: 'Sperrung' }, gefahr: { icon: '⚠️', label: 'Gefahr' } };
                const t = types[type] || types['gefahr'];
                const warning = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), type, icon: t.icon,
                    label: t.label, title, description, location, timestamp: new Date().toISOString(),
                active: true };
                this.warnings.unshift(warning);
                this.save();
                this.playTone(type);
                speak(`Achtung! ${title} in ${location}. ${description}`);
                AppRouter.renderWarnings();
                return warning;
            },
            playTone(type) {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    const tone = this.tones[type] || this.tones['gefahr'];
                    osc.frequency.value = tone.freq;
                    osc.type = 'square';
                    gain.gain.value = 0.10;
                    osc.start();
                    if (tone.pattern === 'short') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 150); } else if (tone.pattern === 'long') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 400); } else if (tone.pattern === 'double') { setTimeout(() => { osc.stop(); },
                            150);
                        setTimeout(() => {
                            const ctx2 = new(window.AudioContext || window.webkitAudioContext)();
                            const o2 = ctx2.createOscillator();
                            const g2 = ctx2.createGain();
                            o2.connect(g2);
                            g2.connect(ctx2.destination);
                            o2.frequency.value = tone.freq;
                            o2.type = 'square';
                            g2.gain.value = 0.10;
                            o2.start();
                            setTimeout(() => { o2.stop();
                                ctx2.close(); }, 150);
                        }, 250);
                    } else if (tone.pattern === 'triple') {
                        for (let i = 0; i < 3; i++) {
                            setTimeout(() => {
                                const ctx3 = new(window.AudioContext || window.webkitAudioContext)();
                                const o3 = ctx3.createOscillator();
                                const g3 = ctx3.createGain();
                                o3.connect(g3);
                                g3.connect(ctx3.destination);
                                o3.frequency.value = tone.freq + i * 200;
                                o3.type = 'square';
                                g3.gain.value = 0.08;
                                o3.start();
                                setTimeout(() => { o3.stop();
                                    ctx3.close(); }, 120);
                            }, i * 200);
                        }
                    }
                } catch (e) {}
            },
            dismiss(id) { const w = this.warnings.find(w => w.id === id); if (w) w.active = false;
                this.save();
                AppRouter.renderWarnings(); },
            clearAll() { this.warnings.forEach(w => w.active = false);
                this.save();
                AppRouter.renderWarnings(); },
            getActive() { return this.warnings.filter(w => w.active); },
            render() {
                const container = document.getElementById('warnings-container');
                if (!container) return;
                const active = this.getActive();
                if (active.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:20px;font-size:12px;">✅ Keine aktiven Warnungen</div>`;

            ask(text) {

                WarningSystem.add('baustelle', 'Baustelle A1', 'Fahrbahnverengung, 60 km/h', 'A1, km 45');

            setTimeout(() => {
                WarningSystem.add('blitzer', 'Blitzer A100', '80 km/h erlaubt', 'A100, Höhe Köln');
            }, 5000);
            setTimeout(() => {
                setStatus('System bereit');
                speak('HalDo AI OS erfolgreich gestartet. 100 Apps verfügbar.');
            }, 1000);

            console.log('✅ System bereit');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>
