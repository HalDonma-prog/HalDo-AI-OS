                        <p style="color:var(--text-secondary);"><strong>Laufende Apps:</strong> ${document.querySelectorAll('#window-container .window').length}</p>
                        <p style="color:var(--text-secondary);"><strong>Installierte Apps:</strong> ${AppManager.installedApps.length}</p>
                        <p style="color:var(--text-secondary);"><strong>Registrierte Apps:</strong> ${AppManager.apps.length}</p>

        AppManager.getYourHaldoUI = function() {

        // ---- APP-CONTENT ERWEITERUNG ----
        // Die neuen Apps in getAppContent integrieren
        const originalGetAppContent = AppManager.getAppContent;
        AppManager.getAppContent = function(appId) {
            switch (appId) {
                case 'remote':
                    return this.getRemoteUI();
                case 'system-center':
                    return this.getSystemCenterUI();
                case 'module-manager':
                    return this.getModuleManagerUI();
                case 'about':
                    return this.getAboutUI();
                case 'developer':
                    return this.getDeveloperUI();
                case 'installation':
                    return this.getInstallationUI();
                case 'migration':
                    return this.getMigrationUI();
                case 'rollback':
                    return this.getRollbackUI();
                case 'recovery':
                    return this.getRecoveryUI();
                case 'service-manager':
                    return this.getServiceManagerUI();
                case 'extensions':
                    return this.getExtensionsUI();
                case 'app-runtime':
                    return this.getAppRuntimeUI();
                case 'app-registry':
                    return this.getAppRegistryUI();
                case 'your-haldo':
                    return this.getYourHaldoUI();
                case 'your-personal':
                    return this.getPersonalCenterUI();
                default:
                    return originalGetAppContent.call(this, appId);
            }
        };

        // ---- EXTENDED SETTINGS IN SHOWSETTINGS INTEGRIEREN ----
        const originalShowSettings = AppManager.showSettings;
        AppManager.showSettings = function(category) {
            if (category === 'updates' || category === 'storage' || category === 'about') {
                this.getExtendedSettingsUI(category);
                return;
            }
            originalShowSettings.call(this, category);
        };

        // ---- SETTINGS KATEGORIEN ERWEITERN ----
        const originalOpenSettings = AppManager.openSettings;
        AppManager.openSettings = function(app) {
            const categories = [
                { id: 'general', label: '⚙️ Allgemein' },
                { id: 'ai', label: '🧠 AI & Memory' },
                { id: 'display', label: '🖥️ Display' },
                { id: 'language', label: '🌍 Sprache' },
                { id: 'themes', label: '🎨 Themes' },
                { id: 'voice', label: '🎤 Voice' },
                { id: 'system', label: '📊 System' },
                { id: 'security', label: '🔒 Sicherheit' },
                { id: 'storage', label: '💾 Speicher' },
                { id: 'updates', label: '🔄 Updates' },
                { id: 'about', label: 'ℹ️ Über' }
            ];
            const content = `
                <div style="display:flex;height:100%;">
                    <div style="width:140px;padding:4px;border-right:1px solid var(--glass-border);flex-shrink:0;overflow-y:auto;">
                        ${categories.map(c => `
                            <div onclick="AppManager.showSettings('${c.id}')" data-cat="${c.id}" style="padding:8px 12px;margin:2px 0;border-radius:8px;cursor:pointer;color:var(--text-secondary);transition:all var(--transition-fast);">${c.label}</div>
                        `).join('')}
                    </div>
                    <div id="settings-content" style="flex:1;padding:16px;overflow-y:auto;">
                        <h2 style="color:var(--text-primary);">Einstellungen</h2>
                        <p style="color:var(--text-secondary);">Wähle eine Kategorie</p>
                    </div>
                </div>
            `;
            const win = this.createWindow(app.name, app.icon, content, 640, 500);
            document.getElementById('window-container').appendChild(win);
            this.updateTaskbar();
            setTimeout(() => this.showSettings('general'), 100);
        };

        // ---- ALLE NEUEN APPS INSTALLIEREN ----
        additionalApps.forEach(app => {
            if (!AppManager.installedApps.includes(app.id)) {
                AppManager.installedApps.push(app.id);
            }
        });
        Storage.set('installed_apps', AppManager.installedApps);

        // ---- DESKTOP ICONS AKTUALISIEREN ----
        AppManager.renderDesktopIcons();

        // ---- BENACHRICHTIGUNG FÜR TEIL 2 ----
        const nots2 = Storage.get('notifications', []);
        nots2.push('🚀 Teil 2 geladen! Neue Apps: Remote Center, System Center, Module Manager, About, Developer, Installation, Migration, Rollback, Recovery, Service Manager, Extensions, App Runtime, App Registry, Your HalDo, Personal Center');
        if (nots2.length > 20) nots2.shift();
        Storage.set('notifications', nots2);

        console.log('✅ Teil 2 geladen – Alle 80+ Apps sind jetzt verfügbar!');
        console.log('📱 HalDo AI OS 24.6.0 – Vollständig installiert!');
    </script>
