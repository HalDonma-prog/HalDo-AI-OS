<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#030712">
<meta name="application-name" content="HalDo AI OS 22">

<title>HalDo AI OS 22</title>

<style>
/* =========================================================
   HALDO AI OS 22
   CENTRAL INDEX
   COMPLETE START FOUNDATION
   ========================================================= */

:root {
    --bg: #02050d;
    --bg2: #06101f;
    --panel: rgba(8,18,36,.88);
    --panel2: rgba(12,27,52,.92);
    --glass: rgba(255,255,255,.065);
    --border: rgba(255,255,255,.13);
    --text: rgba(255,255,255,.94);
    --muted: rgba(255,255,255,.58);
    --dim: rgba(255,255,255,.38);
    --cyan: #76e7ff;
    --blue: #6ca8ff;
    --green: #65f7a5;
    --gold: #ffd978;
    --danger: #ff6d88;
    --shadow: 0 30px 100px rgba(0,0,0,.55);
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(40,100,190,.15),
            transparent 32%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(80,30,150,.12),
            transparent 35%
        ),
        #02050d;
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        system-ui,
        sans-serif;
}

/* =========================================================
   GALAXY
   ========================================================= */

#galaxy {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    background:
        radial-gradient(
            ellipse at center,
            #071a35 0%,
            #030a18 45%,
            #01030a 100%
        );
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    opacity: .65;
    animation:
        starPulse
        var(--duration)
        ease-in-out
        infinite;
}

@keyframes starPulse {
    0%,100% {
        opacity: .18;
        transform: scale(.7);
    }
    50% {
        opacity: .9;
        transform: scale(1.5);
    }
}

.galaxy-nebula {
    position: absolute;
    width: 80vw;
    height: 80vw;
    max-width: 1000px;
    max-height: 1000px;
    left: 50%;
    top: 43%;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(100,180,255,.08),
            transparent,
            rgba(170,100,255,.07),
            transparent
        );
    filter: blur(25px);
    animation: galaxyRotate 55s linear infinite;
}

@keyframes galaxyRotate {
    to {
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

/* =========================================================
   BOOT
   ========================================================= */

#boot {
    position: fixed;
    inset: 0;
    z-index: 100000;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at center,
            #071c39,
            #02050d 60%,
            #000 100%
        );
    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#boot.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.boot-content {
    width: min(92vw, 520px);
    text-align: center;
}

.boot-logo {
    width: min(230px,55vw);
    height: min(230px,55vw);
    object-fit: contain;
    border-radius: 50%;
    filter:
        drop-shadow(0 0 18px rgba(110,210,255,.5))
        drop-shadow(0 0 60px rgba(70,120,255,.35));
    animation:
        bootLogo 4s ease-in-out infinite;
}

@keyframes bootLogo {
    0% {
        transform: scale(.72) rotate(-8deg);
        filter:
            drop-shadow(0 0 12px rgba(110,210,255,.35));
    }
    50% {
        transform: scale(1) rotate(0deg);
        filter:
            drop-shadow(0 0 30px rgba(110,210,255,.75))
            drop-shadow(0 0 80px rgba(70,120,255,.45));
    }
    100% {
        transform: scale(.72) rotate(8deg);
        filter:
            drop-shadow(0 0 12px rgba(110,210,255,.35));
    }
}

.boot-title {
    margin-top: 22px;
    font-size: clamp(24px,6vw,42px);
    font-weight: 750;
    letter-spacing: .04em;
}

.boot-status {
    margin-top: 10px;
    color: var(--muted);
    min-height: 24px;
}

.boot-progress {
    margin: 25px auto 0;
    width: min(360px,80vw);
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
}

.boot-progress span {
    display: block;
    width: 0;
    height: 100%;
    background:
        linear-gradient(
            90deg,
            #65e6ff,
            #8d9dff,
            #fff
        );
    box-shadow: 0 0 20px #67ddff;
    transition: width .25s ease;
}

/* =========================================================
   OS SHELL
   ========================================================= */

#os {
    position: fixed;
    inset: 0;
    z-index: 10;
    opacity: 0;
    transition: opacity .8s ease;
}

#os.ready {
    opacity: 1;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
    position: fixed;
    top: env(safe-area-inset-top,0);
    left: 0;
    right: 0;
    height: 58px;
    z-index: 9000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        0
        max(12px,env(safe-area-inset-right))
        0
        max(12px,env(safe-area-inset-left));

    background:
        linear-gradient(
            180deg,
            rgba(2,7,17,.88),
            rgba(2,7,17,.55)
        );

    border-bottom:
        1px solid rgba(255,255,255,.07);

    backdrop-filter: blur(20px);
}

.top-left,
.top-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.menu-button {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: rgba(255,255,255,.07);
    color: white;
    cursor: pointer;
    font-size: 22px;
}

.menu-button:hover {
    background: rgba(255,255,255,.13);
}

.mini-logo {
    width: 34px;
    height: 34px;
    object-fit: contain;
    border-radius: 50%;
}

.os-name {
    font-weight: 700;
    letter-spacing: .03em;
}

.system-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 11px;
    border-radius: 999px;
    background: rgba(255,255,255,.055);
    color: var(--muted);
    font-size: 11px;
}

.online-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
}

/* =========================================================
   SIDE MENU
   ========================================================= */

#sideMenu {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 9500;

    width: min(390px,88vw);

    transform: translateX(-105%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1);

    background:
        linear-gradient(
            145deg,
            rgba(7,19,39,.98),
            rgba(2,7,17,.99)
        );

    border-right:
        1px solid rgba(255,255,255,.11);

    box-shadow: 30px 0 100px rgba(0,0,0,.5);

    backdrop-filter: blur(28px);

    overflow-y: auto;
}

#sideMenu.open {
    transform: translateX(0);
}

.menu-header {
    position: sticky;
    top: 0;
    z-index: 2;

    display: flex;
    align-items: center;
    gap: 12px;

    padding:
        calc(16px + env(safe-area-inset-top))
        16px
        16px;

    background: rgba(3,9,20,.94);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.menu-header img {
    width: 52px;
    height: 52px;
    object-fit: contain;
}

.menu-header strong {
    display: block;
    font-size: 17px;
}

.menu-header small {
    color: var(--muted);
}

.menu-close {
    margin-left: auto;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 11px;
    background: rgba(255,255,255,.07);
    color: white;
    cursor: pointer;
    font-size: 20px;
}

.menu-search {
    padding: 12px 14px;
}

.menu-search input {
    width: 100%;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255,255,255,.055);
    color: white;
    outline: none;
    padding: 0 13px;
}

.menu-section-title {
    padding: 10px 16px 6px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: .11em;
    font-size: 10px;
}

.app-list {
    padding: 4px 10px 30px;
}

.app-item {
    width: 100%;
    min-height: 50px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    padding: 8px 11px;
    margin: 2px 0;
}

.app-item:hover {
    background: rgba(255,255,255,.08);
}

.app-item-icon {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: rgba(255,255,255,.065);
    font-size: 17px;
}

.app-item-text {
    min-width: 0;
}

.app-item-name {
    display: block;
    font-size: 13px;
    font-weight: 600;
}

.app-item-desc {
    display: block;
    margin-top: 2px;
    color: var(--dim);
    font-size: 10px;
}

/* =========================================================
   DESKTOP
   ========================================================= */

.desktop {
    position: fixed;
    inset: 58px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.central-ai {
    width: min(600px,88vw);
    text-align: center;
    user-select: none;
}

.living-logo {
    width: min(250px,48vw);
    height: min(250px,48vw);
    object-fit: contain;
    border-radius: 50%;
    filter:
        drop-shadow(0 0 22px rgba(100,210,255,.55))
        drop-shadow(0 0 75px rgba(70,120,255,.25));
    animation:
        living 5s ease-in-out infinite;
}

@keyframes living {
    0%,100% {
        transform:
            translateY(0)
            scale(1);
    }
    50% {
        transform:
            translateY(-8px)
            scale(1.025);
    }
}

.ai-status {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13px;
}

.ai-status strong {
    color: var(--text);
}

/* =========================================================
   WINDOW LAYER
   ========================================================= */

#windowLayer {
    position: fixed;
    inset: 58px 0 0;
    z-index: 1000;
    pointer-events: none;
}

.haldo-window {
    position: absolute;
    min-width: 340px;
    min-height: 240px;
    width: 720px;
    height: 500px;
    max-width: calc(100vw - 20px);
    max-height: calc(100vh - 78px);

    display: flex;
    flex-direction: column;

    pointer-events: auto;

    border:
        1px solid rgba(255,255,255,.13);

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(9,22,44,.98),
            rgba(3,9,21,.99)
        );

    box-shadow: var(--shadow);

    overflow: hidden;

    opacity: 1;

    transform:
        translateZ(0);

    transition:
        opacity .15s ease,
        transform .15s ease,
        box-shadow .15s ease;
}

.haldo-window.active {
    border-color:
        rgba(120,210,255,.28);

    box-shadow:
        0 35px 110px rgba(0,0,0,.62),
        0 0 60px rgba(90,170,255,.11);
}

.haldo-window.minimized {
    opacity: 0;
    pointer-events: none;
    transform:
        translateY(30px)
        scale(.94);
}

.haldo-window.closing {
    opacity: 0;
    transform:
        scale(.96)
        translateY(12px);
    pointer-events: none;
}

.haldo-window.maximized {
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    height: 100% !important;
    max-width: none;
    max-height: none;
    border-radius: 0;
}

.window-header {
    height: 50px;
    min-height: 50px;

    display: flex;
    align-items: center;

    padding: 0 8px 0 14px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    border-bottom:
        1px solid rgba(255,255,255,.07);

    user-select: none;
}

.window-title {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 1;
    cursor: grab;
}

.window-title-icon {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: rgba(255,255,255,.07);
}

.window-title-name {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-weight: 650;
}

.window-controls {
    display: flex;
    gap: 3px;
}

.window-control {
    width: 37px;
    height: 34px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: rgba(255,255,255,.72);
    cursor: pointer;
    font-size: 16px;
}

.window-control:hover {
    background: rgba(255,255,255,.1);
    color: white;
}

.window-control.close:hover {
    background: rgba(255,70,100,.3);
}

.window-body {
    min-height: 0;
    flex: 1;
    overflow: hidden;
}

/* =========================================================
   APP UI
   ========================================================= */

.app-shell {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.app-toolbar {
    min-height: 40px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    overflow-x: auto;
}

.app-toolbar button {
    flex: 0 0 auto;
    height: 30px;
    padding: 0 10px;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 9px;
    background: rgba(255,255,255,.055);
    color: var(--text);
    cursor: pointer;
    font-size: 11px;
}

.app-toolbar button:hover {
    background: rgba(255,255,255,.1);
}

.app-content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px;
}

.card-grid {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(150px,1fr)
        );
    gap: 10px;
}

.card {
    padding: 15px;
    border:
        1px solid rgba(255,255,255,.09);
    border-radius: 14px;
    background:
        rgba(255,255,255,.045);
}

.card strong {
    display: block;
    margin-bottom: 6px;
}

.card small {
    color: var(--muted);
    line-height: 1.5;
}

.app-heading {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.app-heading-icon {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: rgba(255,255,255,.07);
    font-size: 25px;
}

.app-heading h2 {
    margin: 0;
    font-size: 22px;
}

.app-heading p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12px;
}

/* =========================================================
   CHAT / AI
   ========================================================= */

.ai-chat {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
}

.message {
    max-width: 82%;
    margin-bottom: 11px;
    padding: 11px 13px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 13px;
    white-space: pre-wrap;
}

.message.user {
    margin-left: auto;
    background:
        linear-gradient(
            135deg,
            rgba(74,150,255,.28),
            rgba(80,100,220,.2)
        );
    border: 1px solid rgba(120,190,255,.18);
}

.message.ai {
    margin-right: auto;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
}

.message-meta {
    display: block;
    margin-bottom: 4px;
    color: var(--dim);
    font-size: 9px;
}

.chat-input-area {
    padding: 10px;
    border-top: 1px solid rgba(255,255,255,.07);
}

.chat-input-wrap {
    display: flex;
    gap: 7px;
}

.chat-input {
    flex: 1;
    min-width: 0;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    padding: 11px 12px;
    border:
        1px solid rgba(255,255,255,.11);
    border-radius: 13px;
    background: rgba(255,255,255,.055);
    color: white;
    outline: none;
    font: inherit;
}

.chat-send,
.chat-voice {
    width: 45px;
    min-width: 45px;
    border: 0;
    border-radius: 13px;
    background:
        linear-gradient(
            135deg,
            rgba(85,180,255,.4),
            rgba(95,100,255,.32)
        );
    color: white;
    cursor: pointer;
}

.chat-send:hover,
.chat-voice:hover {
    filter: brightness(1.2);
}

/* =========================================================
   FORMS
   ========================================================= */

.form-grid {
    display: grid;
    gap: 10px;
}

.field {
    display: grid;
    gap: 6px;
}

.field label {
    color: var(--muted);
    font-size: 11px;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    border:
        1px solid rgba(255,255,255,.1);
    border-radius: 11px;
    background: rgba(255,255,255,.05);
    color: white;
    outline: none;
    padding: 10px;
    font: inherit;
}

.field textarea {
    min-height: 130px;
    resize: vertical;
}

.primary-button {
    min-height: 40px;
    padding: 0 15px;
    border: 0;
    border-radius: 11px;
    background:
        linear-gradient(
            135deg,
            #348fff,
            #6c6dff
        );
    color: white;
    cursor: pointer;
    font-weight: 650;
}

/* =========================================================
   AI AVATAR
   ========================================================= */

.ai-avatar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    margin-bottom: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
}

.ai-avatar img {
    width: 58px;
    height: 58px;
    object-fit: contain;
    border-radius: 50%;
    animation: avatarBreath 3s ease-in-out infinite;
}

@keyframes avatarBreath {
    0%,100% {
        transform: scale(1);
        filter:
            drop-shadow(0 0 10px rgba(90,210,255,.3));
    }
    50% {
        transform: scale(1.06);
        filter:
            drop-shadow(0 0 25px rgba(90,210,255,.7));
    }
}

.ai-avatar strong {
    display: block;
}

.ai-avatar span {
    color: var(--muted);
    font-size: 11px;
}

/* =========================================================
   TOAST
   ========================================================= */

#toastLayer {
    position: fixed;
    right: 15px;
    bottom: 15px;
    z-index: 20000;
    display: grid;
    gap: 8px;
    pointer-events: none;
}

.toast {
    min-width: 220px;
    max-width: min(360px,85vw);
    padding: 11px 13px;
    border-radius: 12px;
    background: rgba(8,18,36,.95);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: var(--shadow);
    font-size: 12px;
    animation: toastIn .2s ease;
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width:700px) {

    .topbar {
        height: 54px;
    }

    .os-name {
        display: none;
    }

    .system-pill {
        padding: 7px 9px;
    }

    .desktop {
        inset: 54px 0 0;
    }

    #windowLayer {
        inset: 54px 0 0;
    }

    .haldo-window {
        min-width: 0;
        width: calc(100vw - 18px) !important;
        height: calc(100vh - 72px) !important;
        left: 9px !important;
        top: 9px !important;
        max-width: calc(100vw - 18px);
        max-height: calc(100vh - 72px);
        border-radius: 16px;
    }

    .haldo-window.maximized {
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
    }

    .window-control {
        width: 40px;
        height: 36px;
    }

    .message {
        max-width: 91%;
    }

    .central-ai {
        transform: translateY(-20px);
    }

    .living-logo {
        width: min(210px,55vw);
        height: min(210px,55vw);
    }

}
</style>
</head>

<body>

<!-- =======================================================
     GALAXY
     ======================================================= -->

<div id="galaxy">
    <div class="galaxy-nebula"></div>
</div>

<!-- =======================================================
     BOOT
     ======================================================= -->

<div id="boot">

    <div class="boot-content">

        <img
            class="boot-logo"
            src="assets/logo/logo.png"
            alt="HalDo AI">

        <div class="boot-title">
            HalDo AI OS 22
        </div>

        <div
            class="boot-status"
            id="bootStatus">
            HalDo AI wird gestartet …
        </div>

        <div class="boot-progress">
            <span id="bootProgress"></span>
        </div>

    </div>

</div>

<!-- =======================================================
     OS
     ======================================================= -->

<div id="os">

    <!-- TOP BAR -->

<script>
"use strict";

/* =========================================================
   HALDO AI OS 22
   CENTRAL RUNTIME
   ========================================================= */

window.HalDo =
    window.HalDo || {};

const HD =
    window.HalDo;

/* =========================================================
   CONFIG
   ========================================================= */

HD.config = {
    version: "22.0.0",
    name: "HalDo AI OS 22",
    defaultWindowWidth: 720,
    defaultWindowHeight: 500,
    minimumWindowWidth: 340,
    minimumWindowHeight: 240,
    logo: "assets/logo/logo.png"
};

/* =========================================================
   EVENTS
   ========================================================= */

HD.events = {

    map: new Map(),

    on(name, callback) {

        if (!this.map.has(name)) {
            this.map.set(name, new Set());
        }

        this.map.get(name).add(callback);

        return () => {
            this.map.get(name)?.delete(callback);
        };
    },

    emit(name, data = {}) {

        const listeners =
            this.map.get(name);

        if (!listeners) {
            return;
        }

        listeners.forEach(
            callback => {

                try {
                    callback(data);
                }

                catch (error) {

                    console.error(
                        "HalDo Event Error:",
                        name,
                        error
                    );

                }

            }
        );
    }

};

HD.on = HD.events.on.bind(HD.events);
HD.emit = HD.events.emit.bind(HD.events);

/* =========================================================
   TOAST
   ========================================================= */

HD.toast = function(message) {

    const layer =
        document.getElementById(
            "toastLayer"
        );

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "toast";

    item.textContent =
        message;

    layer.appendChild(item);

    setTimeout(
        () => item.remove(),
        3000
    );

};

/* =========================================================
   STORAGE
   ========================================================= */

HD.storage = {

    prefix: "haldo-os22:",

    get(key, fallback = null) {

        try {

            const raw =
                localStorage.getItem(
                    this.prefix + key
                );

            if (raw === null) {
                return fallback;
            }

            return JSON.parse(raw);

        }

        catch (error) {

            console.warn(
                "Storage read error:",
                key,
                error
            );

            return fallback;

        }

    },

    set(key, value) {

        try {

            localStorage.setItem(
                this.prefix + key,
                JSON.stringify(value)
            );

            return true;

        }

        catch (error) {

            console.warn(
                "Storage write error:",
                key,
                error
            );

            return false;

        }

    },

    remove(key) {

        try {

            localStorage.removeItem(
                this.prefix + key
            );

            return true;

        }

        catch (_) {
            return false;
        }

    }

};

/* =========================================================
   APP STATE
   ========================================================= */

HD.appState = {

    states: new Map(),

    get(appId) {

        if (!this.states.has(appId)) {

            this.states.set(
                appId,
                HD.storage.get(
                    "app:" + appId,
                    {}
                )
            );

        }

        return this.states.get(appId);

    },

    save(appId, state) {

        this.states.set(
            appId,
            state || {}
        );

        return HD.storage.set(
            "app:" + appId,
            state || {}
        );

    }

};

/* =========================================================
   RUNTIME
   ========================================================= */

HD.runtime = {

    initialized: false,

    services: new Map(),

    register(name, service) {

        if (!name || !service) {
            return false;
        }

        this.services.set(
            name,
            service
        );

        HD.emit(
            "runtime:registered",
            {
                name,
                service
            }
        );

        return true;
    },

    get(name) {
        return this.services.get(name);
    },

    start() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        HD.emit(
            "runtime:ready",
            {
                runtime: this
            }
        );

        return true;
    }

};

   LANGUAGE SYSTEM
   ========================================================= */

        ["ku","Kurdî"],
        ["ckb","Kurdî (Soranî)"],
        ["ez","Êzîdî"],
        ["tr","Türkçe"],
        ["ar","العربية"],
        ["fr","Français"],
        ["es","Español"],
        ["it","Italiano"],
        ["pt","Português"],
        ["nl","Nederlands"],
        ["da","Dansk"],
        ["sv","Svenska"],
        ["no","Norsk"],
        ["fi","Suomi"],
        ["pl","Polski"],
        ["cs","Čeština"],
        ["sk","Slovenčina"],
        ["hu","Magyar"],
        ["ro","Română"],
        ["bg","Български"],
        ["el","Ελληνικά"],
        ["ru","Русский"],
        ["uk","Українська"],
        ["ka","ქართული"],

        ["hi","हिन्दी"],

        ["zh","中文"],
        ["ja","日本語"],

        if (
            !this.languages.some(
                item => item[0] === code

        ) {
            return false;
        }

        this.current =
            code;

        HD.storage.set(
            "language",
            code
        );

        HD.emit(
            "language:changed",
            {
                language: code
            }
        );

        return true;

    }

};

/* =========================================================
   AI CORE
   ========================================================= */

HD.aiCore = {

    initialized: false,

    name:
        "HalDo AI",

    conversation: HD.storage.get(
        "conversation:main",
        []
    ),

    systemPrompt:
        "Du bist HalDo AI. " +
        "Du bist freundlich, hilfreich, " +
        "respektvoll und natürlich. " +
        "Antworte klar und verständlich.",

    initialize() {

        this.initialized =
            true;

        return true;

    },

    async respond(text) {

        const input =
            String(text || "")
                .trim();

        if (!input) {
            return "";
        }

        /*
         * Zentrale AI-Schnittstelle.
         *
         * Hier kann später ein echter
         * HalDo-AI-Backend/API-Endpunkt
         * angeschlossen werden.
         */

        const answer =
            this.localResponse(
                input
            );

        this.conversation.push({
            role: "user",
            content: input,
            time: Date.now()
        });

        this.conversation.push({
            role: "assistant",
            content: answer,
            time: Date.now()
        });

        HD.storage.set(
            "conversation:main",
            this.conversation.slice(-200)
        );

        HD.emit(
            "ai:response",
            {
                input,
                answer
            }
        );

        return answer;

    },

    localResponse(text) {

        const lower =
            text.toLowerCase();

        if (
            lower.includes("hallo") ||
            lower.includes("hi") ||
            lower.includes("hey")
        ) {

            return (
                "Hallo! Ich bin HalDo AI. " +
                "💙❤️ Ich bin bereit, mit dir " +
                "zu sprechen, zu schreiben, " +
                "Fragen zu beantworten und dir " +
                "bei deinen Aufgaben zu helfen."
            );

        }

        if (
            lower.includes("wie geht") ||
            lower.includes("wie geht es")
        ) {

            return (
                "Danke der Nachfrage. 💙 " +
                "Ich bin bereit und arbeite " +
                "mit dem HalDo AI OS zusammen. " +
                "Erzähl mir einfach, was du machen möchtest."
            );

        }

        if (
            lower.includes("wer bist du") ||
            lower.includes("was bist du")
        ) {

            return (
                "Ich bin HalDo AI – die zentrale " +
                "künstliche Intelligenz des HalDo AI OS 22. " +
                "Ich kann mit dir schreiben, " +
                "sprechen, erklären, planen, lernen " +
                "und verschiedene Apps miteinander verbinden."
            );

        }

        if (
            lower.includes("danke")
        ) {

            return (
                "Sehr gerne. 💙❤️ " +
                "Ich bin weiterhin für dich da."
            );

        }

        if (
            lower.includes("hilfe") ||
            lower.includes("help")
        ) {

            return (
                "Natürlich. Sag mir einfach, " +
                "wobei du Hilfe brauchst. " +
                "Du kannst eine Frage stellen, " +
                "einen Text schreiben lassen, " +
                "eine App öffnen oder eine Aufgabe beschreiben."
            );

        }

        return (
            "Ich habe deine Nachricht erhalten. " +
            "Ich bin HalDo AI und kann deine Anfrage " +
            "gemeinsam mit den System- und App-Diensten " +
            "verarbeiten. Für vollständige freie KI-Antworten " +
            "wird anschließend der echte HalDo-AI-Dienst " +
            "über die zentrale AI-Schnittstelle angeschlossen."
        );

    }

};

HD.runtime.register(
    "ai-core",
    HD.aiCore

/* =========================================================
   VOICE
   ========================================================= */

HD.voice = {

    recognition: null,

    speaking: false,

    initialize() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (SpeechRecognition) {

            this.recognition =
                new SpeechRecognition();

            this.recognition.lang =
                "de-DE";

            this.recognition.continuous =
                false;

            this.recognition.interimResults =
                false;

        }

        return true;

    },

    listen(callback) {

        if (!this.recognition) {

            HD.toast(
                "Spracherkennung ist auf diesem Gerät/Browser nicht verfügbar."
            );

            return false;

        }

        this.recognition.onresult =
            event => {

                const text =
                    event.results[0][0].transcript;

                callback?.(text);

                HD.emit(
                    "voice:recognized",
                    {
                        text
                    }
                );

            };

        this.recognition.onerror =
            error => {

                HD.emit(
                    "voice:error",
                    {
                        error
                    }
                );

            };

        try {

            this.recognition.start();

            HD.emit(
                "voice:listening"
            );

            return true;

        }

        catch (error) {

            console.warn(
                error
            );

            return false;

        }

    },

    speak(text) {

        if (
            !("speechSynthesis" in window)
        ) {

            HD.toast(
                "Sprachausgabe ist nicht verfügbar."
            );

            return false;

        }

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                String(text || "")
            );

        utterance.lang =
            this.currentLanguage();

        utterance.rate =
            .98;

        utterance.pitch =
            1;

        utterance.onstart =
            () => {

                this.speaking =
                    true;

                HD.emit(
                    "voice:speaking"
                );

            };

        utterance.onend =
            () => {

                this.speaking =
                    false;

                HD.emit(
                    "voice:ended"
                );

            };

        window.speechSynthesis.speak(
            utterance
        );

        return true;

    },

    currentLanguage() {

        const map = {

            de: "de-DE",
            en: "en-US",
            tr: "tr-TR",
            ar: "ar-SA",
            fr: "fr-FR",
            es: "es-ES",
            it: "it-IT",
            ru: "ru-RU"

        };

        return (
            map[HD.language.current] ||
            "de-DE"
        );

    }

};

HD.voice.initialize();

HD.runtime.register(
    "voice",
    HD.voice
);

/* =========================================================
   APP FOUNDATION
   ========================================================= */

HD.appFoundation = {

    createInstance(manifest) {

        const state =
            HD.appState.get(
                manifest.id
            );

        const instance = {

            id: manifest.id,
            name: manifest.name,
            icon: manifest.icon,
            manifest,
            state,
            opened: false,
            active: false,
            minimized: false,
            maximized: false,
            closed: true,
            windowId: null,

            open() {

                this.opened = true;
                this.closed = false;
                this.active = true;
                this.minimized = false;

                HD.emit(
                    "app:opened",
                    {
                        app: this
                    }
                );

                return this;

            },

            activate() {

                this.active = true;
                this.minimized = false;

                HD.emit(
                    "app:activated",
                    {
                        app: this
                    }
                );

                return this;

            },

            minimize() {

                this.minimized = true;
                this.active = false;

                HD.emit(
                    "app:minimized",
                    {
                        app: this
                    }
                );

                return this;

            },

            restore() {

                this.opened = true;
                this.closed = false;
                this.minimized = false;
                this.active = true;

                HD.emit(
                    "app:restored",
                    {
                        app: this
                    }
                );

                return this;

            },

            maximize() {

                this.maximized = true;
                this.minimized = false;
                this.active = true;

                HD.emit(
                    "app:maximized",
                    {
                        app: this
                    }
                );

                return this;

            },

            unmaximize() {

                this.maximized = false;

                HD.emit(
                    "app:unmaximized",
                    {
                        app: this
                    }
                );

                return this;

            },

            close() {

                this.save();

                this.opened = false;
                this.closed = true;
                this.active = false;
                this.minimized = false;

                HD.emit(
                    "app:closed",
                    {
                        app: this
                    }
                );

                return this;

            },

            setState(key,value) {

                this.state[key] =
                    value;

                this.save();

                HD.emit(
                    "app:state-change",
                    {
                        app: this,
                        key,
                        value
                    }
                );

                return value;

            },

            getState(key,fallback=null) {

                return Object.prototype
                    .hasOwnProperty
                    .call(
                        this.state,
                        key
                    )
                    ? this.state[key]
                    : fallback;

            },

            save() {

                HD.appState.save(
                    this.id,
                    this.state
                );

                return true;

            }

        };

        return instance;

    }

};

/* =========================================================
   APP MANAGER
   ========================================================= */

HD.appManager = {

    instances: new Map(),

    get(appId) {

        return this.instances.get(
            appId
        );

    },

    create(appId) {

        let instance =
            this.get(
                appId
            );

        if (instance) {
            return instance;
        }

        const manifest =
            HD.appRegistry.get(
                appId
            );

        if (!manifest) {
            return null;
        }

        instance =
            HD.appFoundation
                .createInstance(
                    manifest
                );

        this.instances.set(
            appId,
            instance
        );

        return instance;

    },

    open(appId) {

        const instance =
            this.create(
                appId
            );

        if (!instance) {

            HD.toast(
                "App nicht gefunden: " +
                appId
            );

            return null;

        }

        instance.open();

        HD.windowManager.open(
            instance
        );

        HD.emit(
            "app-manager:open",
            {
                app: instance
            }
        );

        return instance;

    },

    close(appId) {

        const instance =
            this.get(
                appId
            );

        if (!instance) {
            return false;
        }

        instance.close();

        HD.windowManager.close(
            appId
        );

        return true;

    },

    minimize(appId) {

        const instance =
            this.get(
                appId
            );

        if (!instance) {
            return false;
        }

        instance.minimize();

        HD.windowManager.minimize(
            appId
        );

        return true;

    },

    restore(appId) {

        const instance =
            this.get(
                appId
            );

        if (!instance) {
            return false;
        }

        instance.restore();

        HD.windowManager.restore(
            appId
        );

        return true;

    },

    maximize(appId) {

        const instance =
            this.get(
                appId
            );

        if (!instance) {
            return false;
        }

        instance.maximize();

        HD.windowManager.maximize(
            appId
        );

        return true;

    }

};

HD.runtime.register(
    "app-manager",
    HD.appManager
);

HD.router = {

    current: null,

    open(appId) {

        if (
            !HD.appRegistry.get(
                appId
            )
        ) {
            return false;
        }

        this.current =
            appId;

        HD.appManager.open(
            appId
        );

        HD.emit(
            "route:changed",
            {
                appId
            }
        );

        return true;

    },

    close(appId) {

        HD.appManager.close(
            appId
        );

        if (
            this.current ===
            appId
        ) {

            this.current =
                null;

        }

        return true;

    }

};

    HD.router
);

/* =========================================================
   WINDOW MANAGER
   ========================================================= */

HD.windowManager = {

    windows: new Map(),

    zIndex: 1000,

    activeWindowId: null,

    layer:
        document.getElementById(
            "windowLayer"
        ),

    create(instance) {

        if (!instance) {
            return null;
        }

        const existing =
            this.windows.get(
                instance.id
            );

        if (existing) {
            return existing;
        }

        const manifest =
            instance.manifest;

        const element =
            document.createElement(
                "section"
            );

        element.className =
            "haldo-window";

        element.dataset.appId =
            instance.id;

        const header =
            document.createElement(
                "header"
            );

        header.className =
            "window-header";

        const title =
            document.createElement(
                "div"
            );

        title.className =
            "window-title";

        const icon =
            document.createElement(
                "span"
            );

        icon.className =
            "window-title-icon";

        icon.textContent =
            manifest.icon ||
            "○";

        const name =
            document.createElement(
                "span"
            );

        name.className =
            "window-title-name";

        name.textContent =
            manifest.name;

        title.append(
            icon,
            name
        );

        const controls =
            document.createElement(
                "div"
            );

        controls.className =
            "window-controls";

        const minimize =
            document.createElement(
                "button"
            );

        minimize.className =
            "window-control";

        minimize.textContent =
            "−";

        const maximize =
            document.createElement(
                "button"
            );

        maximize.className =
            "window-control";

        maximize.textContent =
            "□";

        const close =
            document.createElement(
                "button"
            );

        close.className =
            "window-control close";

        close.textContent =
            "×";

        controls.append(
            minimize,
            maximize,
            close
        );

        header.append(
            title,
            controls
        );

        const body =
            document.createElement(
                "div"
            );

        body.className =
            "window-body";

        element.append(
            header,
            body
        );

        this.layer.appendChild(
            element
        );

        const saved =
            HD.appState.get(
                instance.id
            ).window || {};

        const record = {

            id: instance.id,

            app:
                instance,

            element,

            header,

            body,

            x:
                Number.isFinite(saved.x)
                    ? saved.x
                    : 70,

            y:
                Number.isFinite(saved.y)
                    ? saved.y
                    : 70,

            width:
                Number.isFinite(saved.width)
                    ? saved.width
                    : HD.config
                        .defaultWindowWidth,

            height:
                Number.isFinite(saved.height)
                    ? saved.height
                    : HD.config
                        .defaultWindowHeight,

            maximized:
                !!saved.maximized,

            minimized:
                false

        };

        this.windows.set(
            instance.id,
            record
        );

        this.renderApp(
            record
        );

        this.applyGeometry(
            record
        );

        /* -------------------------------------------------
           ONE CLICK CLOSE
           ------------------------------------------------- */

        close.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();
                event.stopPropagation();

                /*
                 * Sofort schließen.
                 * Kein click/double-event-Konflikt.
                 */

                this.close(
                    instance.id
                );

            }
        );

        minimize.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();
                event.stopPropagation();

                this.minimize(
                    instance.id
                );

            }
        );

        maximize.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();
                event.stopPropagation();

                if (
                    record.maximized
                ) {

                    this.restore(
                        instance.id
                    );

                }

                else {

                    this.maximize(
                        instance.id
                    );

                }

            }
        );

        element.addEventListener(
            "pointerdown",
            () => {

                this.focus(
                    instance.id
                );

            }
        );

        this.setupDragging(
            record
        );

        return record;

    },

    setupDragging(record) {

        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;

        record.header.addEventListener(
            "pointerdown",
            event => {

                if (
                    event.target.closest(
                        ".window-controls"
                    )
                ) {
                    return;
                }

                if (
                    record.maximized
                ) {
                    return;
                }

                dragging =
                    true;

                offsetX =
                    event.clientX -
                    record.x;

                offsetY =
                    event.clientY -
                    record.y;

                try {
                    record.header
                        .setPointerCapture(
                            event.pointerId
                        );
                }
                catch (_) {}

                this.focus(
                    record.id
                );

            }
        );

        record.header.addEventListener(
            "pointermove",
            event => {

                if (!dragging) {
                    return;
                }

                record.x =
                    event.clientX -
                    offsetX;

                record.y =
                    event.clientY -
                    offsetY;

                this.applyGeometry(
                    record
                );

            }
        );

        record.header.addEventListener(
            "pointerup",
            event => {

                dragging =
                    false;

                try {
                    record.header
                        .releasePointerCapture(
                            event.pointerId
                        );
                }
                catch (_) {}

                this.saveGeometry(
                    record
                );

            }
        );

    },

    renderApp(record) {

        record.body.innerHTML = "";

        const shell =
            document.createElement(
                "div"
            );

        shell.className =
            "app-shell";

        const toolbar =
            document.createElement(
                "div"
            );

        toolbar.className =
            "app-toolbar";

        const content =
            document.createElement(
                "div"
            );

        content.className =
            "app-content";

        shell.append(
            toolbar,
            content
        );

        record.body.appendChild(
            shell
        );

        AppRenderer.render(
            record.app,
            toolbar,
            content
        );

    },

    applyGeometry(record) {

        if (
            record.maximized
        ) {

            record.element.classList
                .add(
                    "maximized"
                );

            return;

        }

        record.element.classList
            .remove(
                "maximized"
            );

        record.element.style.left =
            record.x + "px";

        record.element.style.top =
            record.y + "px";

        record.element.style.width =
            record.width + "px";

        record.element.style.height =
            record.height + "px";

    },

    saveGeometry(record) {

        const state =
            HD.appState.get(
                record.id
            );

        state.window =
            state.window || {};

        state.window.x =
            record.x;

        state.window.y =
            record.y;

        state.window.width =
            record.width;

        state.window.height =
            record.height;

        state.window.maximized =
            record.maximized;

        HD.appState.save(
            record.id,
            state
        );

    },

    open(instance) {

        let record =
            this.windows.get(
                instance.id
            );

        if (!record) {

            record =
                this.create(
                    instance
                );

        }

        if (!record) {
            return null;
        }

        record.minimized =
            false;

        record.element.classList
            .remove(
                "minimized"
            );

        record.element.style.display =
            "flex";

        this.applyGeometry(
            record
        );

        this.focus(
            record.id
        );

        return record;

    },

    focus(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return;
        }

        this.zIndex++;

        record.element.style.zIndex =
            String(
                this.zIndex
            );

        document
            .querySelectorAll(
                ".haldo-window.active"
            )
            .forEach(
                item =>
                    item.classList
                        .remove(
                            "active"
                        )
            );

        record.element.classList
            .add(
                "active"
            );

        this.activeWindowId =
            appId;

        record.app.activate();

    },

    minimize(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return;
        }

        record.minimized =
            true;

        record.element.classList
            .add(
                "minimized"
            );

        record.app.minimize();

        this.saveGeometry(
            record
        );

    },

    restore(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return;
        }

        record.minimized =
            false;

        record.element.classList
            .remove(
                "minimized"
            );

        record.app.restore();

        this.focus(
            appId
        );

    },

    maximize(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return;
        }

        record.maximized =
            true;

        record.app.maximize();

        this.applyGeometry(
            record
        );

        this.saveGeometry(
            record
        );

        this.focus(
            appId
        );

    },

    close(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return false;
        }

        /*
         * Direkte Schließung.
         * Kein zweiter Klick erforderlich.
         */

        record.element.classList
            .add(
                "closing"
            );

        record.app.close();

        setTimeout(
            () => {

                record.element.remove();

                this.windows.delete(
                    appId
                );

                HD.emit(
                    "window:closed",
                    {
                        appId
                    }
                );

            },
            150
        );

        return true;

    }

};

HD.runtime.register(
    "window-manager",
    HD.windowManager
);

const AppRenderer = {

    render(
        instance,
        toolbar,
        content
    ) {

        const id =
            instance.id;

        const actions = {

            "haldo-ai":
                () =>
                    this.renderAI(
                        instance,
                        toolbar,
                        content
                    ),

            "chat":
                () =>
                    this.renderAI(
                        instance,
                        toolbar,
                        content
                    ),

            "voice":
                () =>
                    this.renderVoice(
                        instance,
                        toolbar,
                        content
                    ),

            "mail":
                () =>
                    this.renderMail(
                        instance,
                        toolbar,
                        content
                    ),

            "languages":
                () =>
                    this.renderLanguages(
                        instance,
                        toolbar,
                        content
                    ),

            "translator":
                () =>
                    this.renderTranslator(
                        instance,
                        toolbar,
                        content
                    ),

            "dictionary":
                () =>
                    this.renderDictionary(
                        instance,
                        toolbar,
                        content
                    ),

            "settings":
                () =>
                    this.renderSettings(
                        instance,
                        toolbar,
                        content
                    ),

            "notes":
                () =>
                    this.renderNotes(
                        instance,
                        toolbar,
                        content
                    ),

            "calendar":
                () =>
                    this.renderCalendar(
                        instance,
                        toolbar,
                        content
                    ),

            "weather":
                () =>
                    this.renderWeather(
                        instance,
                        toolbar,
                        content
                    ),

            "music-studio":
                () =>
                    this.renderMusic(
                        instance,
                        toolbar,
                        content
                    ),

            "audio-studio":
                () =>
                    this.renderAudio(
                        instance,
                        toolbar,
                        content
                    ),

            "video-studio":
                () =>
                    this.renderVideo(
                        instance,
                        toolbar,
                        content
                    )

        };

        if (actions[id]) {
            actions[id]();
            return;
        }

        this.renderGeneric(
            instance,
            toolbar,
            content
        );

    },

    button(
        toolbar,
        text,
        callback
    ) {

        const button =
            document.createElement(
                "button"
            );

        button.textContent =
            text;

        button.addEventListener(
            "click",
            callback
        );

        toolbar.appendChild(
            button
        );

        return button;

    },

    heading(
        instance,
        content,
        description
    ) {

        const heading =
            document.createElement(
                "div"
            );

        heading.className =
            "app-heading";

        heading.innerHTML =

            "<div class=\"app-heading-icon\">" +
                this.escape(
                    instance.icon
                ) +
            "</div>" +

            "<div>" +
                "<h2>" +
                    this.escape(
                        instance.name
                    ) +
                "</h2>" +

                "<p>" +
                    this.escape(
                        description ||
                        instance.manifest.description
                    ) +
                "</p>" +
            "</div>";

        content.appendChild(
            heading
        );

    },

    renderAI(
        instance,
        toolbar,
        content
    ) {

        this.button(
            toolbar,
            "Neues Gespräch",
            () => {

                instance.setState(
                    "messages",
                    []
                );

                renderMessages();

            }
        );

        this.button(
            toolbar,
            "Sprechen",
            () => {

                HD.voice.listen(
                    text => {

                        input.value =
                            text;

                        send();

                    }
                );

            }
        );

        this.button(
            toolbar,
            "Antwort vorlesen",
            () => {

                const messages =
                    instance.getState(
                        "messages",
                        []
                    );

                const last =
                    [...messages]
                        .reverse()
                        .find(
                            m =>
                                m.role ===
                                "assistant"
                        );

                if (last) {
                    HD.voice.speak(
                        last.text
                    );
                }

            }
        );

        const chat =
            document.createElement(
                "div"
            );

        chat.className =
            "ai-chat";

        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "ai-avatar";

        avatar.innerHTML =
            "<img src=\"" +
            HD.config.logo +
            "\" alt=\"HalDo AI\">" +

            "<div>" +
                "<strong>HalDo AI</strong>" +
                "<span>Bereit für deine Unterhaltung</span>" +
            "</div>";

        chat.appendChild(
            avatar
        );

        const messages =
            document.createElement(
                "div"
            );

        messages.className =
            "chat-messages";

        const inputArea =
            document.createElement(
                "div"
            );

        inputArea.className =
            "chat-input-area";

        const wrap =
            document.createElement(
                "div"
            );

        wrap.className =
            "chat-input-wrap";

        const input =
            document.createElement(
                "textarea"
            );

        input.className =
            "chat-input";

        input.placeholder =
            "Schreibe HalDo AI etwas …";

        const voice =
            document.createElement(
                "button"
            );

        voice.className =
            "chat-voice";

        voice.textContent =
            "🎙️";

        const send =
            document.createElement(
                "button"
            );

        send.className =
            "chat-send";

        send.textContent =
            "➤";

        wrap.append(
            input,
            voice,
            send
        );

        inputArea.appendChild(
            wrap
        );

        chat.append(
            messages,
            inputArea
        );

        content.appendChild(
            chat
        );

        let messageState =
            instance.getState(
                "messages",
                []
            );

        function renderMessages() {

            messageState =
                instance.getState(
                    "messages",
                    []
                );

            messages.innerHTML =
                "";

            if (
                messageState.length === 0
            ) {

                const welcome =
                    document.createElement(
                        "div"
                    );

                welcome.className =
                    "message ai";

                welcome.innerHTML =
                    "<span class=\"message-meta\">HalDo AI</span>" +
                    "Hallo 💙❤️ Ich bin HalDo AI. " +
                    "Schreib mir einfach etwas. " +
                    "Ich kann mit dir sprechen, Fragen beantworten, " +
                    "Texte schreiben und dir bei deinen Aufgaben helfen.";

                messages.appendChild(
                    welcome
                );

                return;

            }

            messageState.forEach(
                message => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "message " +
                        (
                            message.role ===
                            "user"
                                ? "user"
                                : "ai"
                        );

                    item.innerHTML =
                        "<span class=\"message-meta\">" +
                        (
                            message.role ===
                            "user"
                                ? "Du"
                                : "HalDo AI"
                        ) +
                        "</span>" +
                        this.escape(
                            message.text
                        );

                    messages.appendChild(
                        item
                    );

                }
            );

            messages.scrollTop =
                messages.scrollHeight;

        }

        async function send() {

            const text =
                input.value.trim();

            if (!text) {
                return;
            }

            messageState.push({
                role: "user",
                text,
                time: Date.now()
            });

            instance.setState(
                "messages",
                messageState
            );

            input.value = "";

            renderMessages();

            const thinking =
                document.createElement(
                    "div"
                );

            thinking.className =
                "message ai";

            thinking.textContent =
                "HalDo AI schreibt …";

            messages.appendChild(
                thinking
            );

            messages.scrollTop =
                messages.scrollHeight;

            try {

                const answer =
                    await HD.aiCore.respond(
                        text
                    );

                thinking.remove();

                messageState.push({
                    role: "assistant",
                    text: answer,
                    time: Date.now()
                });

                instance.setState(
                    "messages",
                    messageState
                );

                renderMessages();

            }

            catch (error) {

                thinking.textContent =
                    "Entschuldigung, bei der Verarbeitung " +
                    "ist ein Fehler aufgetreten.";

                console.error(
                    error
                );

            }

        }

        send.addEventListener(
            "click",
            send
        );

        voice.addEventListener(
            "click",
            () => {

                HD.voice.listen(
                    text => {

                        input.value =
                            text;

                        send();

                    }
                );

            }
        );

        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    send();

                }

            }
        );

        renderMessages();

    },

    renderVoice(
        instance,
        toolbar,
        content
    ) {

        this.button(
            toolbar,
            "Mikrofon",
            () => {

                HD.voice.listen(
                    text => {

                        result.textContent =
                            text;

                    }
                );

            }
        );

        this.button(
            toolbar,
            "Sprechen",
            () => {

                HD.voice.speak(
                    text.value
                );

            }
        );

        this.heading(
            instance,
            content,
            "Sprache hören und sprechen"
        );

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "card";

        const text =
            document.createElement(
                "textarea"
            );

        text.placeholder =
            "Text für HalDo Voice …";

        const result =
            document.createElement(
                "p"
            );

        result.style.color =
            "var(--muted)";

        box.append(
            text,
            result
        );

        content.appendChild(
            box
        );

    },

    renderMail(
        instance,
        toolbar,
        content
    ) {

        this.button(
            toolbar,
            "Entwurf speichern",
            () =>
                instance.setState(
                    "draft",
                    {
                        to: to.value,
                        subject: subject.value,
                        body: body.value
                    }
                )
        );

        this.button(
            toolbar,
            "AI schreiben",
            async () => {

                const suggestion =
                    await HD.aiCore.respond(
                        "Schreibe einen professionellen " +
                        "freundlichen E-Mail-Text zu: " +
                        subject.value
                    );

                body.value =
                    suggestion;

            }
        );

        this.heading(
            instance,
            content,
            "name@haldo.ai – Mail, Briefe und Dokumente"
        );

        const form =
            document.createElement(
                "div"
            );

        form.className =
            "form-grid";

        const to =
            document.createElement(
                "input"
            );

        to.placeholder =
            "Empfänger";

        const subject =
            document.createElement(
                "input"
            );

        subject.placeholder =
            "Betreff";

        const body =
            document.createElement(
                "textarea"
            );

        body.placeholder =
            "Nachricht schreiben …";

        const account =
            document.createElement(
                "div"
            );

        account.className =
            "card";

        account.innerHTML =
            "<strong>HalDo Mail</strong>" +
            "<br>" +
            "<small>" +
            "Deine HalDo-Mail-Identität: " +
            "<b>name@haldo.ai</b>" +
            "</small>";

        form.append(
            account,
            to,
            subject,
            body
        );

        content.appendChild(
            form
        );

    },

    renderLanguages(
        instance,
        toolbar,
        content
    ) {

        this.heading(
            instance,
            content,
            "Viele Sprachen für AI, Voice und Übersetzung"
        );

        const grid =
            document.createElement(
                "div"
            );

        grid.className =
            "card-grid";

        HD.language.languages.forEach(
            language => {

                const card =
                    document.createElement(
                        "button"
                    );

                card.className =
                    "card";

                card.style.color =
                    "white";

                card.style.textAlign =
                    "left";

                card.style.cursor =
                    "pointer";

                card.innerHTML =
                    "<strong>" +
                    this.escape(
                        language[1]
                    ) +
                    "</strong>" +
                    "<small>" +
                    this.escape(
                        language[0]
                    ) +
                    "</small>";

                card.addEventListener(
                    "click",
                    () => {

                        HD.language.set(
                            language[0]
                        );

    escape(value) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }

function createAppItem(
    manifest
) {

    const button =
        document.createElement(
            "button"
        );

    button.className =
        "app-item";

    button.dataset.name =
        (
            manifest.name +
            " " +
            manifest.description
        ).toLowerCase();

    button.innerHTML =

        "<span class=\"app-item-icon\">" +
            AppRenderer.escape(
                manifest.icon ||
                "○"
            ) +
        "</span>" +

        "<span class=\"app-item-text\">" +

            "<span class=\"app-item-name\">" +
                AppRenderer.escape(
                    manifest.name
                ) +
            "</span>" +

            "<span class=\"app-item-desc\">" +
                AppRenderer.escape(
                    manifest.description ||
                    ""
                ) +
            "</span>" +

        "</span>";

    button.addEventListener(
        "click",
        () => {

            sideMenu.classList
                .remove(
                    "open"
                );

            HD.router.open(
                manifest.id
            );

        }
    );

    return button;

}

function renderMenu(
    filter = ""
) {

    appList.innerHTML =
        "";

    systemAppList.innerHTML =
        "";

    const query =
        filter
            .trim()
            .toLowerCase();

    SYSTEM_APPS
        .filter(
            app =>
                !query ||
                (
                    app.name +
                    " " +
                    app.description
                )
                .toLowerCase()
                .includes(
                    query
                )
        )
        .forEach(
            app => {

                systemAppList
                    .appendChild(
                        createAppItem(
                            app
                        )
                    );

            }
        );

    APPS
        .map(
            item =>
                HD.appRegistry.get(
                    item[0]
                )
        )
        .filter(Boolean)
        .filter(
            app =>
                !query ||
                (
                    app.name +
                    " " +
                    app.description
                )
                .toLowerCase()
                .includes(
                    query
                )
        )
        .forEach(
            app => {

                appList.appendChild(
                    createAppItem(
                        app
                    )
                );

            }
        );

}

renderMenu();

    () => {

        sideMenu.classList

);

menuClose.addEventListener(

/* =========================================================

document.addEventListener(

        if (

                .contains(

);
