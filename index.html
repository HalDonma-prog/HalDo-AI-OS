<script>
/* =========================================================
   HALDO AI OS 20
   PART 22 — APP REGISTRY / CAPABILITY BRIDGE
   ========================================================= */

(function () {

    "use strict";


    const HALDO =
        window.HalDoOS =
            window.HalDoOS || {};


    const state = {

        initialized:
            false,

        registry:
            new Map(),

        aliases:
            new Map(),

        categories:
            new Map(),

        history:
            [],

        maxHistory:
            300

    };


    /* =====================================================
       HELPERS
       ===================================================== */

    function timestamp() {
        return Date.now();
    }


    function normalize(
        value
    ) {

        return String(
            value || ""
        )
            .trim()
            .toLowerCase()
            .replace(
                /\s+/g,
                "-"
            );

    }


    function clone(
        value
    ) {

        if (
            value === undefined
        ) {

            return undefined;

        }


        try {

            return JSON.parse(
                JSON.stringify(
                    value
                )
            );

        } catch {

            return value;

        }

    }


    function emit(
        eventName,
        detail = {}
    ) {

        const bridge =
            HALDO.events ||
            window.HalDoEvents;


        if (
            bridge &&
            typeof bridge.emit ===
            "function"
        ) {

            try {

                bridge.emit(
                    eventName,
                    detail
                );

            } catch (error) {

                console.warn(
                    "[HalDo App Registry]",
                    error
                );

            }

        }


        try {

            window.dispatchEvent(
                new CustomEvent(
                    eventName,
                    {
                        detail
                    }
                )
            );

        } catch {

            // Event dispatch is optional.

        }

    }


    function record(
        type,
        appId,
        detail = {}
    ) {

        state.history.push({

            type,

            appId,

            detail,

            timestamp:
                timestamp()

        });


        if (
            state.history.length >
            state.maxHistory
        ) {

            state.history.shift();

        }

    }


    /* =====================================================
       CATEGORY MANAGEMENT
       ===================================================== */

    function addToCategory(
        category,
        appId
    ) {

        const normalizedCategory =
            normalize(
                category
            );


        if (!normalizedCategory) {

            return;

        }


        if (
            !state.categories.has(
                normalizedCategory
            )
        ) {

            state.categories.set(
                normalizedCategory,
                new Set()
            );

        }


        state.categories
            .get(
                normalizedCategory
            )
            .add(
                appId
            );

    }


    function removeFromCategories(
        appId
    ) {

        state.categories.forEach(
            apps => {

                apps.delete(
                    appId
                );

            }
        );

    }


    /* =====================================================
       REGISTER
       ===================================================== */

    function register(
        definition
    ) {

        if (
            !definition ||
            typeof definition !==
            "object"
        ) {

            return null;

        }


        const id =
            normalize(
                definition.id ||
                definition.appId ||
                definition.name
            );


        if (!id) {

            console.warn(
                "[HalDo App Registry]",
                "App benötigt eine gültige ID."
            );


            return null;

        }


        const existing =
            state.registry.get(
                id
            );


        const app = {

            id,

            name:
                definition.name ||
                id,

            title:
                definition.title ||
                definition.name ||
                id,

            description:
                definition.description ||
                "",

            version:
                definition.version ||
                "1.0.0",

            icon:
                definition.icon ||
                "◈",

            category:
                normalize(
                    definition.category ||
                    "system"
                ),

            enabled:
                definition.enabled !==
                    false,

            visible:
                definition.visible !==
                    false,

            launchable:
                definition.launchable !==
                    false,

            permissions:
                Array.isArray(
                    definition.permissions
                )
                    ? [
                        ...new Set(
                            definition.permissions
                        )
                    ]
                    : [],

            capabilities:
                Array.isArray(
                    definition.capabilities
                )
                    ? [
                        ...new Set(
                            definition.capabilities
                        )
                    ]
                    : [],

            metadata:
                {
                    ...(definition.metadata ||
                        {})
                },

            module:
                definition.module ||
                null,

            factory:
                typeof definition.factory ===
                "function"
                    ? definition.factory
                    : null,

            open:
                typeof definition.open ===
                "function"
                    ? definition.open
                    : null,

            close:
                typeof definition.close ===
                "function"
                    ? definition.close
                    : null,

            createdAt:
                existing?.createdAt ||
                timestamp(),

            updatedAt:
                timestamp()

        };


        state.registry.set(
            id,
            app
        );


        removeFromCategories(
            id
        );


        addToCategory(
            app.category,
            id
        );


        if (
            Array.isArray(
                definition.aliases
            )
        ) {

            definition.aliases.forEach(
                alias => {

                    const normalized =
                        normalize(
                            alias
                        );


                    if (
                        normalized
                    ) {

                        state.aliases.set(
                            normalized,
                            id
                        );

                    }

                }
            );

        }


        record(
            existing
                ? "updated"
                : "registered",
            id,
            {
                name:
                    app.name,

                category:
                    app.category

            }
        );


        emit(
            existing
                ? "app:registry:updated"
                : "app:registry:registered",
            {
                app:
                    clone(
                        app
                    )
            }
        );


        return app;

    }


    /* =====================================================
       UNREGISTER
       ===================================================== */

    function unregister(
        appId
    ) {

        const id =
            resolveId(
                appId
            );


        if (!id) {

            return false;

        }


        if (
            !state.registry.has(
                id
            )
        ) {

            return false;

        }


        state.registry.delete(
            id
        );


        state.aliases.forEach(
            (target, alias) => {

                if (
                    target === id
                ) {

                    state.aliases.delete(
                        alias
                    );

                }

            }
        );


        removeFromCategories(
            id
        );


        record(
            "unregistered",
            id
        );


        emit(
            "app:registry:unregistered",
            {
                appId:
                    id
            }
        );


        return true;

    }


    /* =====================================================
       RESOLVE
       ===================================================== */

    function resolveId(
        value
    ) {

        const normalized =
            normalize(
                value
            );


        if (!normalized) {

            return null;

        }


        if (
            state.registry.has(
                normalized
            )
        ) {

            return normalized;

        }


        return (
            state.aliases.get(
                normalized
            ) ||
            null
        );

    }


    /* =====================================================
       LOOKUP
       ===================================================== */

    function get(
        appId
    ) {

        const id =
            resolveId(
                appId
            );


        if (!id) {

            return null;

        }


        return (
            state.registry.get(
                id
            ) ||
            null
        );

    }


    function has(
        appId
    ) {

        return !!get(
            appId
        );

    }


    /* =====================================================
       FILTERING
       ===================================================== */

    function getAll(
        options = {}
    ) {

        let apps =
            Array.from(
                state.registry.values()
            );


        if (
            options.category
        ) {

            const category =
                normalize(
                    options.category
                );


            apps =
                apps.filter(
                    app =>
                        app.category ===
                        category
                );

        }


        if (
            options.enabled !==
            undefined
        ) {

            apps =
                apps.filter(
                    app =>
                        app.enabled ===
                        !!options.enabled
                );

        }


        if (
            options.visible !==
            undefined
        ) {

            apps =
                apps.filter(
                    app =>
                        app.visible ===
                        !!options.visible
                );

        }


        if (
            options.launchable !==
            undefined
        ) {

            apps =
                apps.filter(
                    app =>
                        app.launchable ===
                        !!options.launchable
                );

        }


        if (
            options.capability
        ) {

            const capability =
                normalize(
                    options.capability
                );


            apps =
                apps.filter(
                    app =>
                        app.capabilities
                            .map(
                                normalize
                            )
                            .includes(
                                capability
                            )
                );

        }


        return apps;

    }


    function getByCategory(
        category
    ) {

        return getAll({
            category
        });

    }


    function getCategories() {

        return Array.from(
            state.categories.keys()
        );

    }


    /* =====================================================
       CAPABILITIES
       ===================================================== */

    function hasCapability(
        appId,
        capability
    ) {

        const app =
            get(
                appId
            );


        if (!app) {

            return false;

        }


        const wanted =
            normalize(
                capability
            );


        return app.capabilities
            .map(
                normalize
            )
            .includes(
                wanted
            );

    }


    function getCapabilities(
        appId
    ) {

        const app =
            get(
                appId
            );


        return app
            ? [
                ...app.capabilities
            ]
            : [];

    }


    /* =====================================================
       APP LAUNCH DELEGATION
       ===================================================== */

    async function launch(
        appId,
        context = {}
    ) {

        const app =
            get(
                appId
            );


        if (!app) {

            emit(
                "app:launch:error",
                {
                    appId,
                    reason:
                        "not-found"
                }
            );


            return {

                success:
                    false,

                error:
                    "App nicht gefunden."

            };

        }


        if (
            !app.enabled
        ) {

            return {

                success:
                    false,

                error:
                    "App ist deaktiviert."

            };

        }


        if (
            !app.launchable
        ) {

            return {

                success:
                    false,

                error:
                    "App kann nicht gestartet werden."

            };

        }


        try {

            let result =
                null;


            if (
                typeof app.open ===
                "function"
            ) {

                result =
                    await app.open(
                        context
                    );

            } else if (
                typeof app.factory ===
                "function"
            ) {

                result =
                    await app.factory(
                        context
                    );

            } else {

                const ui =
                    window.HalDoUI;


                if (
                    ui &&
                    typeof ui.openAppWindow ===
                    "function"
                ) {

                    result =
                        await ui.openAppWindow(
                            app.title,
                            app.module ||
                            app.description ||
                            ""
                        );

                }

            }


            record(
                "launched",
                app.id
            );


            emit(
                "app:launched",
                {

                    app:
                        clone(
                            app
                        ),

                    context,

                    result

                }
            );


            return {

                success:
                    true,

                app,
                result

            };

        } catch (error) {

            record(
                "launch-error",
                app.id,
                {
                    message:
                        error?.message ||
                        String(error)
                }
            );


            emit(
                "app:launch:error",
                {

                    appId:
                        app.id,

                    error

                }
            );


            console.error(
                "[HalDo App Registry]",
                "App-Start fehlgeschlagen:",
                app.id,
                error
            );


            return {

                success:
                    false,

                error:
                    error?.message ||
                    "Unbekannter App-Fehler."

            };

        }

    }


    /* =====================================================
       CLOSE DELEGATION
       ===================================================== */

    async function close(
        appId,
        context = {}
    ) {

        const app =
            get(
                appId
            );


        if (!app) {

            return false;

        }


        try {

            if (
                typeof app.close ===
                "function"
            ) {

                await app.close(
                    context
                );

            }


            if (
                HALDO.appState &&
                typeof HALDO.appState.close ===
                "function"
            ) {

                HALDO.appState.close(
                    app.id
                );

            }


            record(
                "closed",
                app.id
            );


            emit(
                "app:registry:closed",
                {

                    appId:
                        app.id

                }
            );


            return true;

        } catch (error) {

            console.error(
                "[HalDo App Registry]",
                "App-Schließen fehlgeschlagen:",
                error
            );


            return false;

        }

    }


    /* =====================================================
       SNAPSHOT
       ===================================================== */

    function snapshot() {

        return {

            version:
                "20.0.0",

            count:
                state.registry.size,

            apps:
                getAll().map(
                    clone
                ),

            categories:
                getCategories(),

            timestamp:
                timestamp()

        };

    }


    function getHistory(
        limit = 50
    ) {

        const amount =
            Math.max(
                1,
                Math.min(
                    Number(limit) || 50,
                    state.maxHistory
                )
            );


        return state.history
            .slice(
                -amount
            )
            .map(
                clone
            );

    }


    /* =====================================================
       INITIALIZATION
       ===================================================== */

    function initialize() {

        if (
            state.initialized
        ) {

            return HALDO.appRegistry;

        }


        state.initialized =
            true;


        HALDO.appRegistry = {

            register,

            unregister,

            resolveId,

            get,

            has,

            getAll,

            getByCategory,

            getCategories,

            hasCapability,

            getCapabilities,

            launch,

            close,

            snapshot,

            getHistory

        };


        /*
         * Das bestehende App-Registry-Modul
         * wird nicht überschrieben.
         *
         * Diese Bridge stellt nur eine
         * zentrale Zugriffsschicht bereit.
         */

        window.HalDoAppRegistry =
            HALDO.appRegistry;


        emit(
            "app:registry:bridge:ready",
            {

                version:
                    "20.0.0",

                timestamp:
                    timestamp()

            }
        );


        console.info(
            "%cHalDo AI OS 20%c App-Registry- und Capability-Bridge bereit",
            "color:#42e6ff;font-weight:800;",
            "color:#ffffff;"
        );


        return HALDO.appRegistry;

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once:
                    true
            }
        );

    } else {

        initialize();

    }


})();
</script>
<script>
/* =========================================================
   HALDO AI OS 20
   PART 22
   CENTRAL RUNTIME / SAFETY / COMPATIBILITY BRIDGE
   ========================================================= */

(() => {

    "use strict";


    /* =====================================================
       GLOBAL HALDO NAMESPACE
       ===================================================== */

    window.HalDoOS =
        window.HalDoOS || {};


    window.HalDoOS.version =
        "20.0.0";


    window.HalDoOS.edition =
        "Professional Ultimate Foundation";


    window.HalDoOS.runtime =
        window.HalDoOS.runtime || {};


    window.HalDoOS.runtime.startedAt =
        window.HalDoOS.runtime.startedAt ||
        Date.now();


    /* =====================================================
       RUNTIME STATE
       ===================================================== */

    const runtimeState = {

        initialized:
            false,

        domReady:
            document.readyState !== "loading",

        online:
            navigator.onLine,

        errors:
            0,

        warnings:
            0,

        lastError:
            null,

        lastWarning:
            null,

        modules:
            {},

        services:
            {},

        apps:
            {},

        events:
            {}

    };


    window.HalDoOS.runtime.state =
        runtimeState;


    /* =====================================================
       SAFE LOGGER
       ===================================================== */

    function log(
        ...args
    ) {

        try {

            console.info(
                "[HalDo OS 20]",
                ...args
            );

        } catch (_) {}

    }


    function warn(
        ...args
    ) {

        runtimeState.warnings++;

        runtimeState.lastWarning =
            args;

        try {

            console.warn(
                "[HalDo OS 20]",
                ...args
            );

        } catch (_) {}

    }


    function error(
        ...args
    ) {

        runtimeState.errors++;

        runtimeState.lastError =
            args;

        try {

            console.error(
                "[HalDo OS 20]",
                ...args
            );

        } catch (_) {}

    }


    /* =====================================================
       SAFE DOM HELPERS
       ===================================================== */

    function getElement(
        id
    ) {

        if (
            typeof id !==
            "string"
        ) {

            return null;

        }


        return document.getElementById(
            id
        );

    }


    function setText(
        id,
        value
    ) {

        const element =
            getElement(id);


        if (!element) {

            return false;

        }


        element.textContent =
            String(
                value ?? ""
            );


        return true;

    }


    /* =====================================================
       BOOT PROGRESS BRIDGE
       ===================================================== */

    function updateBootProgress(
        percent,
        status
    ) {

        const bar =
            getElement(
                "haldo-boot-progress-bar"
            );


        const statusElement =
            getElement(
                "haldo-boot-status"
            );


        const safePercent =
            Math.max(
                0,
                Math.min(
                    100,
                    Number(percent) || 0
                )
            );


        if (bar) {

            bar.style.width =
                `${safePercent}%`;

        }


        if (statusElement) {

            statusElement.textContent =
                status ||
                "HalDo AI OS 20 wird gestartet ...";

        }

    }


    /* =====================================================
       MODULE REGISTRATION BRIDGE
       ===================================================== */

    function registerModule(
        name,
        module
    ) {

        if (
            !name ||
            !module
        ) {

            return false;

        }


        runtimeState.modules[name] =
            module;


        try {

            window.HalDoOS.modules =
                window.HalDoOS.modules ||
                {};


            window.HalDoOS.modules[name] =
                module;

        } catch (exception) {

            warn(
                "Modul konnte nicht global verbunden werden.",
                name,
                exception
            );

        }


        return true;

    }


    function getModule(
        name
    ) {

        if (
            runtimeState.modules[name]
        ) {

            return runtimeState.modules[name];

        }


        if (
            window.HalDoOS.modules &&
            window.HalDoOS.modules[name]
        ) {

            return window.HalDoOS.modules[name];

        }


        return null;

    }


    /* =====================================================
       SERVICE REGISTRATION
       ===================================================== */

    function registerService(
        name,
        service
    ) {

        if (
            !name ||
            !service
        ) {

            return false;

        }


        runtimeState.services[name] =
            service;


        window.HalDoOS.services =
            window.HalDoOS.services ||
            {};


        window.HalDoOS.services[name] =
            service;


        return true;

    }


    function getService(
        name
    ) {

        return (
            runtimeState.services[name] ||
            window.HalDoOS.services?.[name] ||
            null
        );

    }


    /* =====================================================
       EVENT BRIDGE
       ===================================================== */

    function on(
        eventName,
        callback
    ) {

        if (
            !eventName ||
            typeof callback !==
            "function"
        ) {

            return () => {};

        }


        if (
            !runtimeState.events[eventName]
        ) {

            runtimeState.events[eventName] =
                new Set();

        }


        runtimeState.events[eventName]
            .add(callback);


        return () => {

            off(
                eventName,
                callback
            );

        };

    }


    function off(
        eventName,
        callback
    ) {

        const listeners =
            runtimeState.events[eventName];


        if (!listeners) {

            return;

        }


        listeners.delete(
            callback
        );

    }


    function emit(
        eventName,
        detail
    ) {

        const listeners =
            runtimeState.events[eventName];


        if (listeners) {

            listeners.forEach(
                callback => {

                    try {

                        callback(
                            detail
                        );

                    } catch (exception) {

                        error(
                            "Event-Handler-Fehler:",
                            eventName,
                            exception
                        );

                    }

                }
            );

        }


        try {

            window.dispatchEvent(
                new CustomEvent(
                    eventName,
                    {
                        detail
                    }
                )
            );

        } catch (exception) {

            warn(
                "CustomEvent konnte nicht ausgelöst werden.",
                exception
            );

        }

    }


    /* =====================================================
       NETWORK STATE
       ===================================================== */

    function updateNetworkState() {

        runtimeState.online =
            navigator.onLine;


        setText(
            "home-status-network",
            runtimeState.online
                ? "Online"
                : "Offline"
        );


        const dot =
            getElement(
                "home-status-network-dot"
            );


        if (dot) {

            dot.classList.toggle(
                "is-online",
                runtimeState.online
            );

        }


        emit(
            "network:changed",
            {
                online:
                    runtimeState.online,

                timestamp:
                    Date.now()
            }
        );

    }


    window.addEventListener(
        "online",
        updateNetworkState
    );


    window.addEventListener(
        "offline",
        updateNetworkState
    );


    /* =====================================================
       GLOBAL ERROR PROTECTION
       ===================================================== */

    window.addEventListener(
        "error",
        event => {

            runtimeState.errors++;

            runtimeState.lastError =
                event.error ||
                event.message ||
                "Unbekannter Fehler";


            error(
                "Globaler Laufzeitfehler:",
                runtimeState.lastError
            );


            emit(
                "runtime:error",
                {
                    type:
                        "error",

                    error:
                        runtimeState.lastError,

                    timestamp:
                        Date.now()
                }
            );

        }
    );


    window.addEventListener(
        "unhandledrejection",
        event => {

            runtimeState.errors++;

            runtimeState.lastError =
                event.reason;


            error(
                "Nicht behandelte Promise-Ablehnung:",
                event.reason
            );


            emit(
                "runtime:error",
                {
                    type:
                        "unhandledrejection",

                    error:
                        event.reason,

                    timestamp:
                        Date.now()
                }
            );

        }
    );


    /* =====================================================
       EXISTING SYSTEM CONNECTIONS
       ===================================================== */

    function connectExistingSystems() {

        const kernel =
            window.HalDoKernel ||
            window.HalDoOS.kernel;


        const system =
            window.HalDoSystem ||
            window.HalDoOS.system;


        const appManager =
            window.HalDoAppManager ||
            window.HalDoOS.appManager;


        const router =
            window.HalDoAppRouter ||
            window.HalDoOS.appRouter;


        const ui =
            window.HalDoUI;


        if (kernel) {

            registerService(
                "kernel",
                kernel
            );

        }


        if (system) {

            registerService(
                "system",
                system
            );

        }


        if (appManager) {

            registerService(
                "appManager",
                appManager
            );

        }


        if (router) {

            registerService(
                "router",
                router
            );

        }


        if (ui) {

            registerService(
                "ui",
                ui
            );

        }


        emit(
            "runtime:systems-connected",
            {
                kernel:
                    !!kernel,

                system:
                    !!system,

                appManager:
                    !!appManager,

                router:
                    !!router,

                ui:
                    !!ui,

                timestamp:
                    Date.now()
            }
        );

    }


    /* =====================================================
       RUNTIME DIAGNOSTICS
       ===================================================== */

    function diagnostics() {

        const result = {

            version:
                window.HalDoOS.version,

            edition:
                window.HalDoOS.edition,

            initialized:
                runtimeState.initialized,

            domReady:
                runtimeState.domReady,

            online:
                runtimeState.online,

            errors:
                runtimeState.errors,

            warnings:
                runtimeState.warnings,

            modules:
                Object.keys(
                    runtimeState.modules
                ),

            services:
                Object.keys(
                    runtimeState.services
                ),

            timestamp:
                Date.now()

        };


        return result;

    }


    /* =====================================================
       PUBLIC RUNTIME API
       ===================================================== */

    window.HalDoOS.runtime.registerModule =
        registerModule;


    window.HalDoOS.runtime.getModule =
        getModule;


    window.HalDoOS.runtime.registerService =
        registerService;


    window.HalDoOS.runtime.getService =
        getService;


    window.HalDoOS.runtime.on =
        on;


    window.HalDoOS.runtime.off =
        off;


    window.HalDoOS.runtime.emit =
        emit;


    window.HalDoOS.runtime.diagnostics =
        diagnostics;


    window.HalDoOS.runtime.updateBootProgress =
        updateBootProgress;


    window.HalDoOS.runtime.updateNetworkState =
        updateNetworkState;


    /* =====================================================
       INITIALIZATION
       ===================================================== */

    function initializeRuntime() {

        if (
            runtimeState.initialized
        ) {

            return;

        }


        runtimeState.domReady =
            true;


        updateBootProgress(
            92,
            "HalDo AI OS 20 verbindet Systemdienste ..."
        );


        connectExistingSystems();


        updateNetworkState();


        runtimeState.initialized =
            true;


        updateBootProgress(
            96,
            "HalDo AI OS 20 prüft die Laufzeit ..."
        );


        emit(
            "runtime:ready",
            diagnostics()
        );


        updateBootProgress(
            100,
            "HalDo AI OS 20 ist bereit."
        );


        log(
            "Runtime Bridge bereit.",
            diagnostics()
        );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeRuntime,
            {
                once:
                    true
            }
        );

    } else {

        initializeRuntime();

    }


})();
</script>
<script>
/* =========================================================
   HALDO AI OS 20
   PART 23
   APPLICATION REGISTRY / APP DISCOVERY / APP BRIDGE
   ========================================================= */

(() => {

    "use strict";


    /* =====================================================
       HALDO NAMESPACE
       ===================================================== */

    window.HalDoOS =
        window.HalDoOS || {};


    window.HalDoOS.appSystem =
        window.HalDoOS.appSystem || {};


    /* =====================================================
       INTERNAL STATE
       ===================================================== */

    const state = {

        initialized:
            false,

        registry:
            new Map(),

        instances:
            new Map(),

        activeApp:
            null,

        launchHistory:
            [],

        maxHistory:
            100

    };


    window.HalDoOS.appSystem.state =
        state;


    /* =====================================================
       SAFE HELPERS
       ===================================================== */

    function safeString(
        value
    ) {

        return String(
            value ?? ""
        ).trim();

    }


    function createId(
        name
    ) {

        return safeString(
            name
        )
        .toLowerCase()
        .replace(
            /[^a-z0-9äöüß_-]+/gi,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

    }


    function getAppLayer() {

        return document.getElementById(
            "haldo-app-layer"
        );

    }


    function emit(
        eventName,
        detail
    ) {

        try {

            window.dispatchEvent(
                new CustomEvent(
                    eventName,
                    {
                        detail
                    }
                )
            );

        } catch (error) {

            console.warn(
                "[HalDo AppSystem]",
                error
            );

        }


        const runtime =
            window.HalDoOS?.runtime;


        if (
            runtime &&
            typeof runtime.emit ===
            "function"
        ) {

            try {

                runtime.emit(
                    eventName,
                    detail
                );

            } catch (_) {}

        }

    }


    /* =====================================================
       APPLICATION DEFINITION
       ===================================================== */

    function normalizeDefinition(
        definition
    ) {

        if (
            !definition ||
            typeof definition !==
            "object"
        ) {

            return null;

        }


        const name =
            safeString(
                definition.name
            );


        if (!name) {

            return null;

        }


        const id =
            createId(
                definition.id ||
                name
            );


        return {

            id,

            name,

            title:
                safeString(
                    definition.title ||
                    name
                ),

            description:
                safeString(
                    definition.description
                ),

            icon:
                definition.icon ||
                "◈",

            category:
                safeString(
                    definition.category ||
                    "System"
                ),

            version:
                safeString(
                    definition.version ||
                    "1.0.0"
                ),

            singleton:
                definition.singleton !==
                false,

            system:
                definition.system ===
                true,

            factory:
                typeof definition.factory ===
                "function"
                    ? definition.factory
                    : null,

            launch:
                typeof definition.launch ===
                "function"
                    ? definition.launch
                    : null,

            close:
                typeof definition.close ===
                "function"
                    ? definition.close
                    : null,

            metadata:
                definition.metadata &&
                typeof definition.metadata ===
                "object"
                    ? {
                        ...definition.metadata
                    }
                    : {}

        };

    }


    /* =====================================================
       REGISTER APP
       ===================================================== */

    function registerApp(
        definition
    ) {

        const app =
            normalizeDefinition(
                definition
            );


        if (!app) {

            console.warn(
                "[HalDo AppSystem] Ungültige App-Definition."
            );

            return null;

        }


        const existing =
            state.registry.get(
                app.id
            );


        if (existing) {

            const merged = {

                ...existing,

                ...app,

                metadata: {

                    ...existing.metadata,

                    ...app.metadata

                }

            };


            state.registry.set(
                app.id,
                merged
            );


            emit(
                "app:registry:updated",
                merged
            );


            return merged;

        }


        state.registry.set(
            app.id,
            app
        );


        emit(
            "app:registry:registered",
            app
        );


        return app;

    }


    /* =====================================================
       REGISTER MANY
       ===================================================== */

    function registerApps(
        definitions
    ) {

        if (
            !Array.isArray(
                definitions
            )
        ) {

            return [];

        }


        return definitions
            .map(
                registerApp
            )
            .filter(
                Boolean
            );

    }


    /* =====================================================
       GET APP
       ===================================================== */

    function getApp(
        id
    ) {

        const key =
            createId(
                id
            );


        return (
            state.registry.get(
                key
            ) ||
            null
        );

    }


    /* =====================================================
       GET ALL APPS
       ===================================================== */

    function getApps(
        options = {}
    ) {

        let apps =
            Array.from(
                state.registry.values()
            );


        if (
            options.category
        ) {

            const category =
                safeString(
                    options.category
                )
                .toLowerCase();


            apps =
                apps.filter(
                    app =>
                        app.category
                            .toLowerCase() ===
                        category
                );

        }


        if (
            options.search
        ) {

            const query =
                safeString(
                    options.search
                )
                .toLowerCase();


            apps =
                apps.filter(
                    app => {

                        const haystack =
                            [
                                app.id,
                                app.name,
                                app.title,
                                app.description,
                                app.category
                            ]
                            .join(" ")
                            .toLowerCase();


                        return haystack.includes(
                            query
                        );

                    }
                );

        }


        return apps;

    }


    /* =====================================================
       APP INSTANCE
       ===================================================== */

    function createInstance(
        app,
        options
    ) {

        const instanceId =
            `${app.id}-${Date.now()}-${Math.random()
                .toString(36)
                .slice(2, 8)}`;


        const instance = {

            id:
                instanceId,

            appId:
                app.id,

            app,

            options:
                options || {},

            element:
                null,

            createdAt:
                Date.now(),

            active:
                false,

            closed:
                false,

            api:
                {},

            close:
                () => closeApp(
                    instanceId
                )

        };


        state.instances.set(
            instanceId,
            instance
        );


        return instance;

    }


    /* =====================================================
       DEFAULT APP WINDOW
       ===================================================== */

    function createDefaultWindow(
        app,
        instance
    ) {

        const wrapper =
            document.createElement(
                "section"
            );


        wrapper.className =
            "haldo-app-window";


        wrapper.dataset.appId =
            app.id;


        wrapper.dataset.instanceId =
            instance.id;


        wrapper.setAttribute(
            "role",
            "dialog"
        );


        wrapper.setAttribute(
            "aria-label",
            app.title
        );


        Object.assign(
            wrapper.style,
            {

                position:
                    "absolute",

                inset:
                    "22px",

                zIndex:
                    String(
                        Date.now() % 100000
                    ),

                overflow:
                    "auto",

                border:
                    "1px solid rgba(255,255,255,0.10)",

                borderRadius:
                    "18px",

                background:
                    "rgba(8,12,21,0.96)",

                boxShadow:
                    "0 24px 80px rgba(0,0,0,0.45)",

                backdropFilter:
                    "blur(24px)",

                WebkitBackdropFilter:
                    "blur(24px)"

            }
        );


        const header =
            document.createElement(
                "header"
            );


        Object.assign(
            header.style,
            {

                position:
                    "sticky",

                top:
                    "0",

                zIndex:
                    "2",

                display:
                    "flex",

                alignItems:
                    "center",

                justifyContent:
                    "space-between",

                gap:
                    "12px",

                minHeight:
                    "54px",

                padding:
                    "8px 12px",

                borderBottom:
                    "1px solid rgba(255,255,255,0.08)",

                background:
                    "rgba(8,12,21,0.90)"

            }
        );


        const title =
            document.createElement(
                "div"
            );


        title.style.display =
            "flex";


        title.style.alignItems =
            "center";


        title.style.gap =
            "9px";


        const icon =
            document.createElement(
                "span"
            );


        icon.textContent =
            app.icon;


        icon.setAttribute(
            "aria-hidden",
            "true"
        );


        const name =
            document.createElement(
                "strong"
            );


        name.textContent =
            app.title;


        title.append(
            icon,
            name
        );


        const close =
            document.createElement(
                "button"
            );


        close.type =
            "button";


        close.textContent =
            "×";


        close.title =
            "App schließen";


        Object.assign(
            close.style,
            {

                width:
                    "34px",

                height:
                    "34px",

                borderRadius:
                    "10px",

                color:
                    "#fff",

                background:
                    "rgba(255,255,255,0.06)",

                fontSize:
                    "20px",

                cursor:
                    "pointer"

            }
        );


        close.addEventListener(
            "click",
            () =>
                closeApp(
                    instance.id
                )
        );


        header.append(
            title,
            close
        );


        const content =
            document.createElement(
                "div"
            );


        content.className =
            "haldo-app-content";


        content.style.padding =
            "18px";


        wrapper.append(
            header,
            content
        );


        instance.element =
            wrapper;


        instance.content =
            content;


        return wrapper;

    }


    /* =====================================================
       LAUNCH APP
       ===================================================== */

    async function launchApp(
        id,
        options = {}
    ) {

        const app =
            getApp(
                id
            );


        if (!app) {

            console.warn(
                "[HalDo AppSystem] App nicht registriert:",
                id
            );

            emit(
                "app:launch:error",
                {
                    id,
                    reason:
                        "not-registered"
                }
            );


            return null;

        }


        if (
            app.singleton
        ) {

            const existing =
                Array.from(
                    state.instances.values()
                )
                .find(
                    instance =>
                        instance.appId ===
                        app.id &&
                        !instance.closed
                );


            if (existing) {

                activateInstance(
                    existing
                );


                return existing;

            }

        }


        const instance =
            createInstance(
                app,
                options
            );


        const layer =
            getAppLayer();


        if (!layer) {

            console.warn(
                "[HalDo AppSystem] App-Layer fehlt."
            );

            state.instances.delete(
                instance.id
            );


            return null;

        }


        const windowElement =
            createDefaultWindow(
                app,
                instance
            );


        layer.append(
            windowElement
        );


        try {

            if (app.factory) {

                const result =
                    await app.factory(
                        instance,
                        options
                    );


                if (
                    result instanceof
                    HTMLElement
                ) {

                    instance.content
                        .replaceChildren(
                            result
                        );

                } else if (
                    typeof result ===
                    "string"
                ) {

                    instance.content.innerHTML =
                        result;

                } else if (
                    result &&
                    typeof result ===
                    "object"
                ) {

                    instance.api =
                        result;

                }

            }


            if (app.launch) {

                await app.launch(
                    instance,
                    options
                );

            }


            activateInstance(
                instance
            );


            state.launchHistory.push(
                {
                    appId:
                        app.id,

                    instanceId:
                        instance.id,

                    timestamp:
                        Date.now()
                }
            );


            if (
                state.launchHistory.length >
                state.maxHistory
            ) {

                state.launchHistory.shift();

            }


            emit(
                "app:launched",
                {
                    app,
                    instance,
                    options
                }
            );


            return instance;

        } catch (error) {

            console.error(
                "[HalDo AppSystem] App-Startfehler:",
                error
            );


            emit(
                "app:launch:error",
                {
                    app,
                    instance,
                    error
                }
            );


            closeApp(
                instance.id
            );


            return null;

        }

    }


    /* =====================================================
       ACTIVATE INSTANCE
       ===================================================== */

    function activateInstance(
        instance
    ) {

        if (
            !instance ||
            instance.closed
        ) {

            return;

        }


        state.instances.forEach(
            other => {

                if (
                    other.id !==
                    instance.id
                ) {

                    other.active =
                        false;


                    if (
                        other.element
                    ) {

                        other.element
                            .classList
                            .remove(
                                "is-active"
                            );

                    }

                }

            }
        );


        instance.active =
            true;


        state.activeApp =
            instance;


        if (
            instance.element
        ) {

            instance.element
                .classList
                .add(
                    "is-active"
                );


            instance.element.style.zIndex =
                String(
                    Date.now() % 1000000
                );

        }


        emit(
            "app:activated",
            instance
        );

    }


    /* =====================================================
       CLOSE APP
       ===================================================== */

    async function closeApp(
        instanceId
    ) {

        const instance =
            state.instances.get(
                instanceId
            );


        if (!instance) {

            return false;

        }


        try {

            if (
                instance.app.close
            ) {

                await instance.app.close(
                    instance
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo AppSystem] Fehler beim Schließen:",
                error
            );

        }


        if (
            instance.element
        ) {

            instance.element.remove();

        }


        instance.closed =
            true;


        instance.active =
            false;


        state.instances.delete(
            instanceId
        );


        if (
            state.activeApp?.id ===
            instanceId
        ) {

            state.activeApp =
                null;

        }


        emit(
            "app:closed",
            instance
        );


        return true;

    }


    /* =====================================================
       CLOSE ALL
       ===================================================== */

    async function closeAllApps() {

        const ids =
            Array.from(
                state.instances.keys()
            );


        for (
            const id of ids
        ) {

            await closeApp(
                id
            );

        }

    }


    /* =====================================================
       APP REGISTRY BRIDGE
       ===================================================== */

    function importExistingRegistry() {

        const registry =
            window.HalDoAppRegistry ||
            window.HalDoOS?.appRegistry;


        if (
            !registry
        ) {

            return;

        }


        try {

            let definitions = [];


            if (
                typeof registry.getApps ===
                "function"
            ) {

                definitions =
                    registry.getApps();

            } else if (
                Array.isArray(
                    registry.apps
                )
            ) {

                definitions =
                    registry.apps;

            }


            if (
                Array.isArray(
                    definitions
                )
            ) {

                definitions.forEach(
                    definition => {

                        if (
                            definition &&
                            typeof definition ===
                            "object"
                        ) {

                            registerApp(
                                definition
                            );

                        }

                    }
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo AppSystem] Registry-Import fehlgeschlagen:",
                error
            );

        }

    }


    /* =====================================================
       LEGACY UI BRIDGE
       ===================================================== */

    function connectLegacyUI() {

        const ui =
            window.HalDoUI;


        if (
            !ui
        ) {

            return;

        }


        if (
            typeof ui.openAppWindow ===
            "function"
        ) {

            window.HalDoOS.appSystem
                .legacyOpenAppWindow =
                ui.openAppWindow;

        }

    }


    /* =====================================================
       PUBLIC API
       ===================================================== */

    const api = {

        state,

        registerApp,

        registerApps,

        getApp,

        getApps,

        launchApp,

        closeApp,

        closeAllApps,

        activateInstance,

        diagnostics() {

            return {

                initialized:
                    state.initialized,

                registeredApps:
                    state.registry.size,

                openInstances:
                    state.instances.size,

                activeApp:
                    state.activeApp?.appId ||
                    null,

                launchHistory:
                    state.launchHistory.length,

                timestamp:
                    Date.now()

            };

        }

    };


    window.HalDoOS.appSystem =
        api;


    window.HalDoAppSystem =
        api;


    /* =====================================================
       INITIALIZATION
       ===================================================== */

    function initialize() {

        if (
            state.initialized
        ) {

            return;

        }


        importExistingRegistry();

        connectLegacyUI();


        state.initialized =
            true;


        emit(
            "app:system:ready",
            api.diagnostics()
        );


        console.info(
            "%cHalDo AI OS 20%c App-System bereit · %d Apps registriert",
            "color:#42e6ff;font-weight:800;",
            "color:#ffffff;",
            state.registry.size
        );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once:
                    true
            }
        );

    } else {

        initialize();

    }


})();

<script>
/* =========================================================
   HALDO AI OS 20
   PART 24
   APP LAUNCHER / APP CATALOG / APP MENU BRIDGE
   ========================================================= */

(() => {

    "use strict";


    /* =====================================================
       NAMESPACE
       ===================================================== */

    window.HalDoOS =
        window.HalDoOS || {};

    window.HalDoOS.appLauncher =
        window.HalDoOS.appLauncher || {};


    /* =====================================================
       STATE
       ===================================================== */

    const state = {

        initialized:
            false,

        menuOpen:
            false,

        selectedCategory:
            "Alle",

        searchQuery:
            "",

        container:
            null,

        catalog:
            [],

        renderedApps:
            [],

        launchCount:
            0

    };


    /* =====================================================
       HELPERS
       ===================================================== */

    function getAppSystem() {

        return (
            window.HalDoAppSystem ||
            window.HalDoOS?.appSystem ||
            null
        );

    }


    function getLayer() {

        return document.getElementById(
            "haldo-app-layer"
        );

    }


    function escapeHTML(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    function emit(
        name,
        detail
    ) {

        try {

            window.dispatchEvent(
                new CustomEvent(
                    name,
                    {
                        detail
                    }
                )
            );

        } catch (_) {}


        const runtime =
            window.HalDoOS?.runtime;


        if (
            runtime &&
            typeof runtime.emit ===
            "function"
        ) {

            try {

                runtime.emit(
                    name,
                    detail
                );

            } catch (_) {}

        }

    }


    /* =====================================================
       APP CATALOG
       ===================================================== */

    function refreshCatalog() {

        const system =
            getAppSystem();


        if (
            !system ||
            typeof system.getApps !==
            "function"
        ) {

            state.catalog =
                [];


            return [];

        }


        state.catalog =
            system.getApps();


        return state.catalog;

    }


    /* =====================================================
       CATEGORIES
       ===================================================== */

    function getCategories() {

        const categories =
            new Set(
                ["Alle"]
            );


        state.catalog.forEach(
            app => {

                if (
                    app.category
                ) {

                    categories.add(
                        app.category
                    );

                }

            }
        );


        return Array.from(
            categories
        );

    }


    /* =====================================================
       FILTER
       ===================================================== */

    function getFilteredApps() {

        let apps =
            [...state.catalog];


        if (
            state.selectedCategory !==
            "Alle"
        ) {

            apps =
                apps.filter(
                    app =>
                        app.category ===
                        state.selectedCategory
                );

        }


        const query =
            state.searchQuery
                .trim()
                .toLowerCase();


        if (query) {

            apps =
                apps.filter(
                    app => {

                        const text =
                            [
                                app.id,
                                app.name,
                                app.title,
                                app.description,
                                app.category
                            ]
                            .join(" ")
                            .toLowerCase();


                        return text.includes(
                            query
                        );

                    }
                );

        }


        state.renderedApps =
            apps;


        return apps;

    }


    /* =====================================================
       STYLES

                    1px solid

                    rgba(255,255,255,0.06);

                font-size: 20px;

            }


            .haldo-app-launcher-search {

            }


            .haldo-app-launcher-categories {

                display: flex;

                flex: 0 0 auto;

                border:
                    1px solid
                    rgba(255,255,255,0.08);

                border-radius: 99px;

                color:

                    rgba(255,255,255,0.035);

                transition:

            }


            .haldo-app-card:hover {

                transform:
                    translateY(-2px);

                border-color:
                    rgba(66,230,255,0.22);

                background:
                    rgba(66,230,255,0.055);

            }


            .haldo-app-card-icon {

                width: 44px;

                height: 44px;

                display: grid;

                place-items: center;

                border-radius: 13px;

                background:
                    rgba(66,230,255,0.08);

                color: #42e6ff;

                font-size: 22px;

            }


            .haldo-app-card-title {

                font-size: 14px;

                font-weight: 750;

            }


            .haldo-app-card-description {

                color:
                    rgba(255,255,255,0.52);

                font-size: 11px;

                line-height: 1.45;

            }

                margin-top: auto;

                color:
                    rgba(255,255,255,0.36);

                font-size: 9px;

            }


            .haldo-app-empty {

                grid-column: 1 / -1;

                display: grid;

                place-items: center;

                min-height: 180px;

                color:
                    rgba(255,255,255,0.45);

                text-align: center;

            }


            @media (max-width: 600px) {

                .haldo-app-launcher {

                    inset: 10px;

                .haldo-app-launcher-grid {

                    grid-template-columns:
                        repeat(
                            2,
                            minmax(0, 1fr)
                        );

                    padding: 12px;
