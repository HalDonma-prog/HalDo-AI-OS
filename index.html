            windowElement.style.top =
                app.state.y + "px";

            windowElement.style.width =
                app.state.width + "px";

            windowElement.style.height =
                app.state.height + "px";

            windowElement.style.zIndex =
                ++this.zIndex;


            /* =================================================
               WINDOW HEADER
               ================================================= */

            const header =
                document.createElement(
                    "header"
                );

            header.className =
                "haldo-window-header";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "haldo-window-title";

            title.innerHTML =

                "<span class=\"window-app-icon\">" +

                String(
                    app.manifest.icon ||
                    "○"
                ) +

                "</span>" +

                "<span>" +

                String(
                    app.manifest.name ||
                    app.id
                ) +

                "</span>";


            const controls =
                document.createElement(
                    "div"
                );

            controls.className =
                "haldo-window-controls";


            const minimize =
                this.createControl(
                    "—",
                    "Minimieren"
                );

            const maximize =
                this.createControl(
                    "□",
                    "Maximieren"
                );

            const close =
                this.createControl(
                    "×",
                    "Schließen"
                );


            controls.appendChild(
                minimize
            );

            controls.appendChild(
                maximize
            );

            controls.appendChild(
                close
            );


            header.appendChild(
                title
            );

            header.appendChild(
                controls
            );


            /* =================================================
               WINDOW CONTENT
               ================================================= */

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "haldo-window-content";


            const appBody =
                document.createElement(
                    "div"
                );

            appBody.className =
                "haldo-app-body";

            appBody.dataset.app =
                app.id;


            content.appendChild(
                appBody
            );


            windowElement.appendChild(
                header
            );

            windowElement.appendChild(
                content
            );


            /* =================================================
               RESIZE HANDLE
               ================================================= */

            const resizeHandle =
                document.createElement(
                    "div"
                );

            resizeHandle.className =
                "haldo-window-resize";

            windowElement.appendChild(
                resizeHandle
            );


            /* =================================================
               EVENTS
               ================================================= */

            minimize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    this.minimize(
                        app.id
                    );

                }
            );


            maximize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    this.maximize(
                        app.id
                    );

                }
            );


            close.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    this.close(
                        app.id
                    );

                }
            );


            windowElement.addEventListener(
                "mousedown",
                () => {

                    this.focus(
                        app.id
                    );

                }
            );


            windowElement.addEventListener(
                "touchstart",
                () => {

                    this.focus(
                        app.id
                    );

                },
                {
                    passive: true
                }
            );


            this.enableDragging(
                windowElement,
                header,
                app
            );


            this.enableResizing(
                windowElement,
                resizeHandle,
                app
            );


            const layer =
                HD.ui?.windowLayer ||
                document.getElementById(
                    "haldo-window-layer"
                );

            if (layer) {

                layer.appendChild(
                    windowElement
                );

            }


            app.windowElement =
                windowElement;

            app.element =
                appBody;


            this.windows.set(
                app.id,
                windowElement
            );


            this.focus(
                app.id
            );


            return windowElement;

        },


        createControl(
            symbol,
            label
        ) {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "haldo-window-control";

            button.textContent =
                symbol;

            button.title =
                label;

            button.setAttribute(
                "aria-label",
                label
            );

            return button;

        },


        focus(
            appId
        ) {

            const element =
                this.windows.get(
                    appId
                );

            if (!element) {
                return;
            }

            element.style.zIndex =
                ++this.zIndex;

            this.activeWindow =
                appId;

            const app =
                HD.appRuntime?.get(
                    appId
                );

            if (app) {

                app.state.active =
                    true;

                app.state.minimized =
                    false;

                app.save();

            }

            HD.emit?.(
                "window:focus",
                {
                    appId
                }
            );

        },


        minimize(
            appId
        ) {

            const element =
                this.windows.get(
                    appId
                );

            const app =
                HD.appRuntime?.get(
                    appId
                );

            if (!element || !app) {
                return;
            }

            element.classList.add(
                "minimized"
            );

            app.minimize();

        },


        maximize(
            appId
        ) {

            const element =
                this.windows.get(
                    appId
                );

            const app =
                HD.appRuntime?.get(
                    appId
                );

            if (!element || !app) {
                return;
            }

            app.maximize();

            if (
                app.state.maximized
            ) {

                element.classList.add(
                    "maximized"
                );

            }
            else {

                element.classList.remove(
                    "maximized"
                );

                element.style.left =
                    app.state.x + "px";

                element.style.top =
                    app.state.y + "px";

                element.style.width =
                    app.state.width + "px";

                element.style.height =
                    app.state.height + "px";

            }

            this.focus(
                appId
            );

        },


        restore(
            appId
        ) {

            const element =
                this.windows.get(
                    appId
                );

            const app =
                HD.appRuntime?.get(
                    appId
                );

            if (!element || !app) {
                return;
            }

            element.classList.remove(
                "minimized"
            );

            app.state.minimized =
                false;

            app.state.opened =
                true;

            app.state.active =
                true;

            app.save();

            this.focus(
                appId
            );

        },


        close(
            appId
        ) {

            const element =
                this.windows.get(
                    appId
                );

            const app =
                HD.appRuntime?.get(
                    appId
                );

            if (!app) {
                return;
            }

            app.close();

            if (element) {

                element.remove();

            }

            this.windows.delete(
                appId
            );

            if (
                this.activeWindow ===
                appId
            ) {

                this.activeWindow =
                    null;

            }

            HD.emit?.(
                "window:closed",
                {
                    appId
                }
            );

        },


        enableDragging(
            element,
            handle,
            app
        ) {

            let dragging =
                false;

            let offsetX =
                0;

            let offsetY =
                0;


            const start =
                event => {

                    if (
                        event.target.closest(
                            "button"
                        )
                    ) {
                        return;
                    }

                    dragging =
                        true;

                    const point =
                        event.touches
                            ? event.touches[0]
                            : event;

                    const rect =
                        element.getBoundingClientRect();

                    offsetX =
                        point.clientX -
                        rect.left;

                    offsetY =
                        point.clientY -
                        rect.top;

                    element.classList.add(
                        "dragging"
                    );

                };


            const move =
                event => {

                    if (!dragging) {
                        return;
                    }

                    const point =
                        event.touches
                            ? event.touches[0]
                            : event;

                    const x =
                        point.clientX -
                        offsetX;

                    const y =
                        point.clientY -
                        offsetY;

                    element.style.left =
                        Math.max(
                            0,
                            x
                        ) + "px";

                    element.style.top =
                        Math.max(
                            0,
                            y
                        ) + "px";

                    app.move(
                        Math.max(
                            0,
                            x
                        ),
                        Math.max(
                            0,
                            y
                        )
                    );

                };


            const stop =
                () => {

                    if (!dragging) {
                        return;
                    }

                    dragging =
                        false;

                    element.classList.remove(
                        "dragging"
                    );

                };


            handle.addEventListener(
                "mousedown",
                start
            );

            window.addEventListener(
                "mousemove",
                move
            );

            window.addEventListener(
                "mouseup",
                stop
            );


            handle.addEventListener(
                "touchstart",
                start,
                {
                    passive: true
                }
            );

            window.addEventListener(
                "touchmove",
                move,
                {
                    passive: false
                }
            );

            window.addEventListener(
                "touchend",
                stop
            );

        },


        enableResizing(
            element,
            handle,
            app
        ) {

            let resizing =
                false;

            let startX =
                0;

            let startY =
                0;

            let startWidth =
                0;

            let startHeight =
                0;


            const start =
                event => {

                    event.preventDefault();

                    resizing =
                        true;

                    const point =
                        event.touches
                            ? event.touches[0]
                            : event;

                    startX =
                        point.clientX;

                    startY =
                        point.clientY;

                    startWidth =
                        element.offsetWidth;

                    startHeight =
                        element.offsetHeight;

                };


            const move =
                event => {

                    if (!resizing) {
                        return;
                    }

                    const point =
                        event.touches
                            ? event.touches[0]
                            : event;

                    const width =
                        startWidth +
                        (
                            point.clientX -
                            startX
                        );

                    const height =
                        startHeight +
                        (
                            point.clientY -
                            startY
                        );

                    const minWidth =
                        HD.config
                            ?.minimumWindowWidth ||
                        320;

                    const minHeight =
                        HD.config
                            ?.minimumWindowHeight ||
                        220;

                    const finalWidth =
                        Math.max(
                            minWidth,
                            width
                        );

                    const finalHeight =
                        Math.max(
                            minHeight,
                            height
                        );

                    element.style.width =
                        finalWidth + "px";

                    element.style.height =
                        finalHeight + "px";

                    app.resize(
                        finalWidth,
                        finalHeight
                    );

                };


            const stop =
                () => {

                    resizing =
                        false;

                };


            handle.addEventListener(
                "mousedown",
                start
            );

            window.addEventListener(
                "mousemove",
                move
            );

            window.addEventListener(
                "mouseup",
                stop
            );


            handle.addEventListener(
                "touchstart",
                start,
                {
                    passive: false
                }
            );

            window.addEventListener(
                "touchmove",
                move,
                {
                    passive: false
                }
            );

            window.addEventListener(
                "touchend",
                stop
            );

        }

    };

   ========================================================= */

HD.applicationEngine =
    HD.applicationEngine || {

        open(
            appId
        ) {

            const manifest =
                HD.appRegistry?.get(
                    appId
                );

            if (!manifest) {

                console.warn(
                    "HalDo App nicht gefunden:",
                    appId
                );

                return null;

            }


            const app =
                HD.appFactory.create(
                    manifest
                );


            if (
                !app.windowElement
            ) {

                HD.windowSystem.create(
                    app
                );

            }
            else {

                HD.windowSystem.restore(
                    appId
                );

            }


            app.open();


            this.render(
                app
            );


            HD.emit?.(
                "application:opened",
                {
                    app
                }
            );


            return app;

        },


        close(
            appId
        ) {

            HD.windowSystem.close(
                appId
            );

        },


        render(
            app
        ) {

            if (
                !app ||
                !app.element
            ) {
                return;
            }

            const renderer =
                HD.appRenderers?.[
                    app.id
                ];

            if (
                typeof renderer ===
                "function"
            ) {

                renderer(
                    app,
                    app.element
                );

                return;

            }

            this.renderGeneric(
                app
            );

        },


        renderGeneric(
            app
        ) {

            const element =
                app.element;

            element.innerHTML = "";


            const heading =
                document.createElement(
                    "h2"
                );

            heading.textContent =
                app.manifest.name;


            const description =
                document.createElement(
                    "p"
                );

            description.textContent =
                app.manifest.description ||
                "HalDo Anwendung";


            const status =
                document.createElement(
                    "div"
                );

            status.className =
                "app-system-status";

            status.innerHTML =

                "<span class=\"status-dot online\"></span>" +

                "<span>APP ONLINE · PERSISTENT STORAGE AKTIV</span>";


            element.appendChild(
                heading
            );

            element.appendChild(
                description
            );

            element.appendChild(
                status
            );

        }

    };

<script>
"use strict";

window.HalDo = window.HalDo || {};

HD.appFoundation = HD.appFoundation || {};

/* =========================================================
   APP INSTANCE STORAGE
   ========================================================= */

HD.appData = HD.appData || {};

HD.appData.load = function(appId, fallback = {}) {

    if (!appId) {
        return fallback;
    }

    return HD.storage.get(
        "app-data:" + appId,
        fallback
    );
};


HD.appData.save = function(appId, data) {

    if (!appId) {
        return false;
    }

    HD.storage.set(
        "app-data:" + appId,
        data
    );

    HD.emit(
        "app:data:saved",
        {
            appId,
            data
        }
    );

    return true;
};


HD.appData.remove = function(appId) {

    if (!appId) {
        return false;
    }

    HD.storage.remove(
        "app-data:" + appId
    );

    delete HD.appData[appId];

    HD.emit(
        "app:data:removed",
        {
            appId
        }
    );

    return true;
};


/* =========================================================
   APP CONTENT DATABASE
   ========================================================= */

HD.contentStore = {

    createCollection(appId) {

        const key =
            "collection:" + appId;

        const existing =
            HD.storage.get(
                key,
                []
            );

        if (
            !Array.isArray(existing)
        ) {
            HD.storage.set(
                key,
                []
            );

            return [];
        }

        return existing;
    },


    get(appId) {

        return this.createCollection(
            appId
        );
    },


    save(appId, items) {

        if (
            !Array.isArray(items)
        ) {
            return false;
        }

        HD.storage.set(
            "collection:" + appId,
            items
        );

        HD.emit(
            "content:saved",
            {
                appId,
                items
            }
        );

        return true;
    },


    add(appId, item) {

        const items =
            this.get(appId);

        const entry = {

            id:
                item.id ||
                (
                    appId +
                    "-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2)
                ),

            createdAt:
                item.createdAt ||
                Date.now(),

            updatedAt:
                Date.now(),

            ...item

        };

        items.push(
            entry
        );

        this.save(
            appId,
            items
        );

        return entry;
    },


    update(appId, id, changes) {

        const items =
            this.get(appId);

        const index =
            items.findIndex(
                item =>
                    item.id === id
            );

        if (
            index === -1
        ) {
            return null;
        }

        items[index] = {

            ...items[index],

            ...changes,

            updatedAt:
                Date.now()

        };

        this.save(
            appId,
            items
        );

        return items[index];
    },


    remove(appId, id) {

        const items =
            this.get(appId);

        const filtered =
            items.filter(
                item =>
                    item.id !== id
            );

        this.save(
            appId,
            filtered
        );

        return true;
    },


    clear(appId) {

        this.save(
            appId,
            []
        );

        return true;
    }

};


/* =========================================================
   APP UI FACTORY
   ========================================================= */

HD.appUI = HD.appUI || {};

HD.appUI.escape = function(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

};


HD.appUI.button = function(
    text,
    action,
    className = ""
) {

    const button =
        document.createElement(
            "button"
        );

    button.type =
        "button";

    button.className =
        "haldo-app-button " +
        className;

    button.textContent =
        text;

    if (
        typeof action ===
        "function"
    ) {

        button.addEventListener(
            "click",
            action
        );

    }

    return button;
};


HD.appUI.empty = function(

) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "haldo-app-empty";

    element.textContent =

/* =========================================================

HD.apps.notes =
HD.apps.notes || {};

HD.apps.notes.id =
    "notes";


HD.apps.notes.create =
function(app) {

    const shell =
        HD.appWindows.createShell(
            app
        );

    const toolbar =
        document.createElement(
            "div"
        );

    toolbar.className =
        "haldo-notes-toolbar";


    const newButton =
        HD.appUI.button(
            "＋ Neue Notiz",
            () => {

                editor.value =
                    "";

                titleInput.value =
                    "Neue Notiz";

                editor.focus();

            }
        );


    const saveButton =
        HD.appUI.button(
            "Speichern",
            saveNote
        );


    const deleteButton =
        HD.appUI.button(
            "Löschen",
            deleteNote
        );


    toolbar.appendChild(
        newButton
    );

    toolbar.appendChild(
        saveButton
    );

    toolbar.appendChild(
        deleteButton
    );


    const titleInput =
        document.createElement(
            "input"
        );

    titleInput.className =
        "haldo-note-title";

    titleInput.placeholder =
        "Titel der Notiz";


    const editor =
        document.createElement(
            "textarea"
        );

    editor.className =
        "haldo-note-editor";

    editor.placeholder =
        "Schreibe deine Notiz …";


    const list =
        document.createElement(
            "div"
        );

    list.className =
        "haldo-note-list";


    let selectedId =
        null;


    function renderList() {

        list.innerHTML =
            "";

        const notes =
            HD.contentStore.get(
                "notes"
            );

        if (
            notes.length === 0
        ) {

            list.appendChild(
                HD.appUI.empty(
                    "Noch keine Notizen vorhanden."
                )
            );

            return;
        }

        notes
        .slice()
        .reverse()
        .forEach(
            note => {

                const item =
                    document.createElement(
                        "button"
                    );

                item.type =
                    "button";

                item.className =
                    "haldo-note-item";

                item.innerHTML =
                    `
                    <strong>
                        ${HD.appUI.escape(
                            note.title ||
                            "Unbenannte Notiz"
                        )}
                    </strong>

                    <small>
                        ${new Date(
                            note.updatedAt
                        ).toLocaleString(
                            "de-DE"
                        )}
                    </small>
                    `;

                item.addEventListener(
                    "click",
                    () => {

                        selectedId =
                            note.id;

                        titleInput.value =
                            note.title || "";

                        editor.value =
                            note.content || "";

                    }
                );

                list.appendChild(
                    item
                );

            }
        );

    }


    function saveNote() {

        const title =
            titleInput.value
                .trim() ||
            "Unbenannte Notiz";

        const content =
            editor.value;


        if (
            selectedId
        ) {

            HD.contentStore.update(
                "notes",
                selectedId,
                {
                    title,
                    content
                }
            );

        }
        else {

            const note =
                HD.contentStore.add(
                    "notes",
                    {
                        title,
                        content
                    }
                );

            selectedId =
                note.id;

        }


        renderList();

        HD.emit(
            "notes:saved",
            {
                id:
                    selectedId
            }
        );

    }


    function deleteNote() {

        if (
            !selectedId
        ) {
            return;
        }

        HD.contentStore.remove(
            "notes",
            selectedId
        );

        selectedId =
            null;

        titleInput.value =
            "";

        editor.value =
            "";

        renderList();

    }


    shell.content.appendChild(
        toolbar
    );

    shell.content.appendChild(
        titleInput
    );

    shell.content.appendChild(
        editor
    );

    shell.content.appendChild(
        list
    );

    renderList();

    return shell.root;

};

HD.apps.calculator =
HD.apps.calculator || {};


HD.apps.calculator.create =
function(app) {

    const shell =
        HD.appWindows.createShell(
            app
        );

    const display =
        document.createElement(
            "input"
        );

    display.className =
        "haldo-calculator-display";

    display.type =
        "text";

    display.readOnly =
        true;


    const grid =
        document.createElement(
            "div"
        );

    grid.className =
        "haldo-calculator-grid";


    const keys = [

        "7", "8", "9", "/",
        "4", "5", "6", "*",
        "1", "2", "3", "-",
        "0", ".", "=", "+",
        "C"

    ];


    keys.forEach(
        key => {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.textContent =
                key;

            button.className =
                "haldo-calc-key";


            button.addEventListener(
                "click",
                () => {

                    if (
                        key === "C"
                    ) {

                        display.value =
                            "";

                        return;
                    }


                    if (
                        key === "="
                    ) {

                        try {

                            const expression =
                                display.value
                                    .replace(
                                        /[^0-9+\-*/().]/g,
                                        ""
                                    );

                            display.value =
                                String(
                                    Function(
                                        "return " +
                                        expression
                                    )()
                                );

                        }
                        catch (
                            error
                        ) {

                            display.value =
                                "Fehler";

                        }

                        return;
                    }


                    display.value +=
                        key;

                }
            );


            grid.appendChild(
                button
            );

        }
    );


    shell.content.appendChild(
        display
    );

    shell.content.appendChild(
        grid
    );

    return shell.root;

};

   ========================================================= */

HD.apps.clock =
HD.apps.clock || {};


HD.apps.clock.create =
function(app) {

    const shell =
        HD.appWindows.createShell(
            app
        );

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "haldo-clock-large";


    const date =
        document.createElement(
            "div"
        );

    date.className =
        "haldo-clock-date";


    function update() {

        const now =
            new Date();

        time.textContent =
            now.toLocaleTimeString(
                "de-DE"
            );

        date.textContent =
            now.toLocaleDateString(
                "de-DE",
                {
                    weekday:
                        "long",

                    year:
                        "numeric",

                    month:
                        "long",

                    day:
                        "numeric"
                }
            );

    }


    update();

    const timer =
        setInterval(
            update,
            1000
        );


    shell.root
        .addEventListener(
            "haldo:destroy",
            () => {

                clearInterval(
                    timer
                );

            }
        );


    shell.content.appendChild(
        time
    );

    shell.content.appendChild(
        date
    );

    return shell.root;

};

            messages
        );

        shell.content.appendChild(
            input
        );

        shell.content.appendChild(
            send
        );

        return shell.root;

    }
);


/* =========================================================
   HALDO AI VIEW
   ========================================================= */

HD.appViews.register(
    "haldo-ai",
    function(app) {

        const shell =
            HD.appWindows.createShell(
                app
            );


        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "haldo-ai-avatar";


        const image =
            document.createElement(

            );

        image.src =

        image.alt =
            "HalDo AI";

        image.onerror =
            function() {

                this.style.display =

            };


        avatar.appendChild(

        );


        const greeting =
            document.createElement(

            );

        greeting.className =

        shell.content.appendChild(

        );

        shell.content.appendChild(

        );

        shell.content.appendChild(
            input
        );

        shell.content.appendChild(
            send
        );

        return shell.root;

    }
);


/* =========================================================
   APP RUNTIME OPEN VIEW CONNECTION
   ========================================================= */

HD.appRuntime.openView =
function(
    appInstance
) {

    if (
        !appInstance
    ) {
        return null;
    }

    const factory =
        HD.appViews[
            appInstance.id
        ];

    if (
        typeof factory !==
        "function"
    ) {

        return HD.apps.generic(
            appInstance
        );

    }

    try {

        return factory(
            appInstance
        );

    }
    catch (
        error
    ) {

        console.error(
            "HalDo App View Error:",
            appInstance.id,
            error
        );

        return HD.apps.generic(
            appInstance,
            "Die App konnte nicht dargestellt werden."
        );

    }

};


/* =========================================================
   APP PERSISTENCE
   ========================================================= */

HD.persistence =
HD.persistence || {};


HD.persistence.saveAll =
function() {

    const snapshot = {

        version:
            HD.version,

        timestamp:
            Date.now(),

        apps:
            {},

        system:
            {
                online:
                    HD.online
            }

    };


    HD.appRuntime.instances
        .forEach(
            (instance, id) => {

                snapshot.apps[id] = {

                    state:
                        instance.state || {},

                    opened:
                        instance.opened,

                    active:
                        instance.active

                };

            }
        );


    HD.storage.set(
        "system-snapshot",
        snapshot
    );

    return snapshot;

};


HD.persistence.restore =
function() {

    return HD.storage.get(
        "system-snapshot",
        null
    );

};


window.addEventListener(
    "beforeunload",
    function() {

        try {

            HD.persistence
                .saveAll();

        }
        catch (
            error
        ) {

            console.warn(
                "HalDo Persistence Error:",
                error
            );

        }

    }
);


/* =========================================================
   APP FOUNDATION REGISTRATION
   ========================================================= */

HD.runtime.register(
    "app-foundation",
    HD.appFoundation
);

HD.runtime.register(
    "app-data",
    HD.appData
);

HD.runtime.register(
    "content-store",
    HD.contentStore
);

HD.runtime.register(
    "app-ui",
    HD.appUI
);

HD.runtime.register(
    "app-views",
    HD.appViews
);

HD.runtime.register(
    "persistence",
    HD.persistence
);


/* =========================================================
   EVENT CONNECTION
   ========================================================= */

HD.on(
    "app:open",
    function(event) {

        if (
            !event ||
            !event.app
        ) {
            return;
        }

        const instance =
            event.app;

        if (
            !instance.view
        ) {

            instance.view =
                HD.appRuntime
                    .openView(
                        instance
                    );

        }

    }
);


/* =========================================================
   SYSTEM READY MARKER
   ========================================================= */

HD.emit(
    "app-foundation:ready",
    {
        version:
            "22.0.0",

        applications:
            HD.appRegistry
                ? HD.appRegistry
                    .all()
                    .length
                : 0
    }
);
