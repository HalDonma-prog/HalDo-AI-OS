<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#020611"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – Cosmic Intelligent Operating System"
    >

    <title>HalDo AI OS 20</title>

    <style>
        /* =========================================================
           HALDO AI OS 20
           INDEX SHELL
           PART 1 / 8
           ========================================================= */

        :root {
            --haldo-bg: #020611;
            --haldo-bg-2: #050d1c;
            --haldo-panel: rgba(7, 17, 34, 0.82);
            --haldo-panel-strong: rgba(5, 14, 29, 0.96);

            --haldo-border: rgba(125, 222, 255, 0.20);
            --haldo-border-bright: rgba(125, 222, 255, 0.46);

            --haldo-text: #f1fbff;
            --haldo-text-soft: #b9cfdd;
            --haldo-text-muted: #7891a4;

            --haldo-cyan: #69ddff;
            --haldo-blue: #438dff;
            --haldo-violet: #9074ff;
            --haldo-pink: #e276ff;

            --haldo-green: #62e8ad;
            --haldo-yellow: #ffd76a;
            --haldo-red: #ff6680;

            --haldo-radius-small: 10px;
            --haldo-radius: 18px;
            --haldo-radius-large: 26px;

            --haldo-shadow:
                0 30px 90px rgba(0, 0, 0, 0.48);

            --haldo-glow:
                0 0 35px rgba(105, 221, 255, 0.18);

            --haldo-transition:
                180ms ease;

            --haldo-font:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--haldo-bg);
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;

            color: var(--haldo-text);
            background: var(--haldo-bg);

            font-family: var(--haldo-font);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            color: inherit;
        }

        button,
        [role="button"] {
            -webkit-tap-highlight-color: transparent;
        }

        ::selection {
            background: rgba(105, 221, 255, 0.25);
        }

        /* =========================================================
           MAIN OS
           ========================================================= */

        #haldo-os {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            isolation: isolate;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(28, 75, 132, 0.28),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 15% 5%,
                    rgba(100, 71, 220, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(25, 123, 180, 0.13),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #020611 0%,
                    #030a17 48%,
                    #02050d 100%
                );
        }

        #haldo-cosmic-world {
            position: absolute;
            inset: 0;

            overflow: hidden;

            z-index: 1;

            transition:
                opacity 350ms ease,
                filter 350ms ease;
        }

        #haldo-cosmic-world.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* =========================================================
           STAR FIELD
           ========================================================= */

        #haldo-stars {
            position: absolute;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }

        .haldo-star {
            position: absolute;

            display: block;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.9);

            box-shadow:
                0 0 6px rgba(180, 235, 255, 0.85);

            animation:
                haldo-star-twinkle
                var(--star-duration, 4s)
                ease-in-out
                infinite;
        }

        @keyframes haldo-star-twinkle {
            0%,
            100% {
                opacity: var(--star-opacity, 0.7);
                transform: scale(1);
            }

            50% {
                opacity: 0.12;
                transform: scale(0.45);
            }
        }

        /* =========================================================
           GALAXY BACKGROUND
           ========================================================= */

        .haldo-galaxy {
            position: absolute;

            width: 520px;
            height: 520px;

            border-radius: 50%;

            opacity: 0.16;

            pointer-events: none;

            filter: blur(1px);

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(190, 150, 255, 0.48) 0%,
                    rgba(90, 160, 255, 0.24) 18%,
                    rgba(30, 100, 210, 0.12) 38%,
                    transparent 70%
                );

            transform:
                rotate(-25deg)
                scaleX(1.7);

            animation:
                haldo-galaxy-drift
                55s
                linear
                infinite;
        }

        .haldo-galaxy::before,
        .haldo-galaxy::after {
            content: "";

            position: absolute;
            inset: 15%;

            border-radius: 50%;

            border:
                1px solid rgba(190, 160, 255, 0.15);

            transform:
                rotate(25deg)
                scaleX(1.8);
        }

        .haldo-galaxy::after {
            inset: 28%;

            border-color:
                rgba(100, 220, 255, 0.16);
        }

        .haldo-galaxy.one {
            left: -230px;
            top: 12%;
        }

        .haldo-galaxy.two {
            right: -260px;
            bottom: -120px;

            transform:
                rotate(18deg)
                scaleX(1.55);

            animation-duration: 70s;
        }

        @keyframes haldo-galaxy-drift {
            from {
                transform:
                    rotate(-25deg)
                    scaleX(1.7);
            }

            to {
                transform:
                    rotate(335deg)
                    scaleX(1.7);
            }
        }

        /* =========================================================
           COSMIC SUN
           ========================================================= */

        #haldo-sun-system {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 180px;
            height: 180px;

            transform:
                translate(-50%, -50%);

            z-index: 20;

            pointer-events: none;
        }

        #haldo-sun-glow-outer {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 430px;
            height: 430px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 235, 139, 0.22) 0%,
                    rgba(255, 176, 67, 0.12) 32%,
                    rgba(255, 99, 44, 0.06) 50%,
                    transparent 72%
                );

            filter: blur(7px);

            animation:
                haldo-sun-glow
                5s
                ease-in-out
                infinite;
        }

        #haldo-sun-glow-inner {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 260px;
            height: 260px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 220, 0.58) 0%,
                    rgba(255, 224, 116, 0.24) 42%,
                    rgba(255, 139, 50, 0.09) 65%,
                    transparent 78%
                );

            filter: blur(5px);

            animation:
                haldo-sun-inner-glow
                3.5s
                ease-in-out
                infinite;
        }

        #haldo-sun {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 128px;
            height: 128px;

            transform:
                translate(-50%, -50%);

            border: 0;

            border-radius: 50%;

            cursor: pointer;

            pointer-events: auto;

            background:
                radial-gradient(
                    circle at 31% 26%,
                    #ffffff 0%,
                    #fffbd3 7%,
                    #ffe46e 25%,
                    #ffbd43 48%,
                    #ff7134 72%,
                    #ff3d28 100%
                );

            box-shadow:
                0 0 25px rgba(255, 249, 178, 0.95),
                0 0 65px rgba(255, 215, 95, 0.72),
                0 0 130px rgba(255, 130, 55, 0.45),
                0 0 230px rgba(255, 80, 35, 0.20);

            transition:
                transform 250ms ease,
                filter 250ms ease;
        }

        #haldo-sun:hover {
            transform:
                translate(-50%, -50%)
                scale(1.08);

            filter:
                brightness(1.12);
        }

        #haldo-sun:active {
            transform:
                translate(-50%, -50%)
                scale(0.96);
        }

        @keyframes haldo-sun-glow {
            0%,
            100% {
                opacity: 0.72;
                transform:
                    translate(-50%, -50%)
                    scale(0.94);
            }

            50% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.12);
            }
        }

        @keyframes haldo-sun-inner-glow {
            0%,
            100% {
                opacity: 0.70;
                transform:
                    translate(-50%, -50%)
                    scale(0.96);
            }

            50% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.08);
            }
        }

        /* =========================================================
           PLANETARY SYSTEM
           ========================================================= */

        .haldo-orbit {
            position: absolute;

            left: 50%;
            top: 50%;

            border:
                1px solid rgba(150, 225, 255, 0.14);

            border-radius: 50%;

            transform:
                translate(-50%, -50%)
                rotateX(64deg);

            transform-style: preserve-3d;

            pointer-events: none;

            animation:
                haldo-orbit-rotation
                var(--orbit-speed, 30s)
                linear
                infinite;
        }

        @keyframes haldo-orbit-rotation {
            from {
                transform:
                    translate(-50%, -50%)
                    rotateX(64deg)
                    rotateZ(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotateX(64deg)
                    rotateZ(360deg);
            }
        }

        .haldo-planet {
            position: absolute;

            left: 100%;
            top: 50%;

            width: var(--planet-size, 18px);
            height: var(--planet-size, 18px);

            margin:
                calc(var(--planet-size, 18px) / -2);

            border-radius: 50%;

            pointer-events: auto;

            cursor: pointer;

            transform:
                rotateX(-64deg);

            box-shadow:
                0 0 12px
                var(--planet-glow, rgba(100, 220, 255, 0.35));

            transition:
                filter 200ms ease,
                transform 200ms ease;
        }

        .haldo-planet:hover {
            filter:
                brightness(1.25);

            transform:
                rotateX(-64deg)
                scale(1.2);
        }

        .planet-mercury {
            width: 190px;
            height: 110px;
            --orbit-speed: 11s;
        }

        .planet-mercury .haldo-planet {
            --planet-size: 10px;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #eee,
                    #aaa 35%,
                    #666 72%,
                    #333
                );
        }

        .planet-venus {
            width: 280px;
            height: 165px;
            --orbit-speed: 17s;
        }

        .planet-venus .haldo-planet {
            --planet-size: 16px;

            background:
                radial-gradient(
                    circle at 32% 25%,
                    #fff0ba,
                    #dda85c 42%,
                    #a85d32 76%,
                    #68351f
                );

            --planet-glow:
                rgba(255, 210, 130, 0.45);
        }

        .planet-earth {
            width: 385px;
            height: 225px;
            --orbit-speed: 25s;
        }

        .planet-earth .haldo-planet {
            --planet-size: 22px;

            background:
                radial-gradient(
                    circle at 32% 25%,
                    #b9fbff 0%,
                    #4fd7ed 18%,
                    #2473d0 48%,
                    #173477 78%,
                    #081832 100%
                );

            --planet-glow:
                rgba(85, 220, 255, 0.72);
        }

        .planet-earth .haldo-planet::before {
            content: "";

            position: absolute;

            width: 9px;
            height: 5px;

            left: 6px;
            top: 5px;

            border-radius: 50%;

            background:
                rgba(105, 220, 145, 0.85);

            transform:
                rotate(-20deg);
        }

        .planet-earth .haldo-planet::after {
            content: "";

            position: absolute;

            width: 6px;
            height: 4px;

            left: 12px;
            top: 12px;

            border-radius: 50%;

            background:
                rgba(80, 205, 130, 0.72);
        }

        .planet-mars {
            width: 495px;
            height: 290px;
            --orbit-speed: 34s;
        }

        .planet-mars .haldo-planet {
            --planet-size: 15px;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #ffad79,
                    #c9573f 42%,
                    #783427 78%,
                    #3e1713
                );

            --planet-glow:
                rgba(255, 102, 67, 0.40);
        }

        .planet-jupiter {
            width: 625px;
            height: 370px;
            --orbit-speed: 48s;
        }

        .planet-jupiter .haldo-planet {
            --planet-size: 43px;

            background:
                linear-gradient(
                    175deg,
                    #8b705c 0%,
                    #d2b38e 15%,
                    #b58e72 24%,
                    #ead7ae 31%,
                    #99725c 40%,
                    #d7bd91 52%,
                    #9d7058 65%,
                    #c7a783 76%,
                    #735243 100%
                );

            --planet-glow:
                rgba(235, 202, 161, 0.42);
        }

        .planet-jupiter .haldo-jupiter-spot {
            position: absolute;

            width: 9px;
            height: 6px;

            right: 5px;
            top: 24px;

            border-radius: 50%;

            background:
                rgba(135, 72, 54, 0.72);
        }

        .planet-saturn {
            width: 780px;
            height: 455px;
            --orbit-speed: 62s;
        }

        .planet-saturn .haldo-planet {
            --planet-size: 33px;

            background:
                radial-gradient(
                    circle at 32% 25%,
                    #fff0bd,
                    #d9ba76 40%,
                    #aa8651 74%,
                    #5e482d
                );

            --planet-glow:
                rgba(255, 218, 136, 0.42);
        }

        .haldo-saturn-ring {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 68px;
            height: 20px;

            transform:
                translate(-50%, -50%)
                rotate(-18deg);

            border:
                3px solid rgba(240, 217, 164, 0.62);

            border-left-color:
                rgba(240, 217, 164, 0.25);

            border-right-color:
                rgba(240, 217, 164, 0.25);

            border-radius: 50%;

            pointer-events: none;
        }

        .planet-uranus {
            width: 940px;
            height: 550px;
            --orbit-speed: 78s;
        }

        .planet-uranus .haldo-planet {
            --planet-size: 25px;

            background:
                radial-gradient(
                    circle at 32% 25%,
                    #d9ffff,
                    #7ed9e5 48%,
                    #3c849b 80%,
                    #173c55
                );

            --planet-glow:
                rgba(110, 230, 255, 0.48);
        }

        .planet-neptune {
            width: 1090px;
            height: 640px;
            --orbit-speed: 96s;
        }

        .planet-neptune .haldo-planet {
            --planet-size: 25px;

            background:
                radial-gradient(
                    circle at 32% 25%,
                    #8aaeff,
                    #4168dc 45%,
                    #203d98 78%,
                    #101e52
                );

            --planet-glow:
                rgba(91, 130, 255, 0.52);
        }

        /* =========================================================
           EARTH + MOON
           ========================================================= */

        #haldo-earth-moon {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 58px;
            height: 58px;

            margin:
                -29px;

            z-index: 32;

            pointer-events: none;
        }

        #haldo-earth-moon-core {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 22px;
            height: 22px;

            margin:
                -11px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 32% 25%,
                    #c8ffff,
                    #49d7eb 20%,
                    #2476d2 54%,
                    #172e79 78%,
                    #08172d 100%
                );

            box-shadow:
                0 0 18px rgba(92, 224, 255, 0.72);

            animation:
                haldo-earth-rotation
                7s
                linear
                infinite;
        }

        #haldo-moon {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 8px;
            height: 8px;

            margin:
                -4px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #fff,
                    #cfcfcf 48%,
                    #777
                );

            box-shadow:
                0 0 8px rgba(255, 255, 255, 0.7);

            transform-origin:
                4px 4px;

            animation:
                haldo-moon-orbit
                5s
                linear
                infinite;
        }

        @keyframes haldo-earth-rotation {
            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }
        }

        @keyframes haldo-moon-orbit {
            from {
                transform:
                    rotate(0deg)
                    translateX(26px);
            }

            to {
                transform:
                    rotate(360deg)
                    translateX(26px);
            }
        }

        /* =========================================================
           TOP SYSTEM BAR
           ========================================================= */

        #haldo-topbar {
            position: absolute;

            left: 16px;
            right: 16px;
            top: 14px;

            height: 60px;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding:
                7px 9px;

            border:
                1px solid var(--haldo-border);

            border-radius:
                20px;

            background:
                rgba(3, 10, 22, 0.70);

            backdrop-filter:
                blur(24px);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.20);
        }

        .haldo-brand {
            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }

        .haldo-brand-logo {
            position: relative;

            width: 42px;
            height: 42px;

            flex: 0 0 auto;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #ffffff 0%,
                    #8eeeff 28%,
                    #716cff 65%,
                    transparent 72%
                );

            box-shadow:
                0 0 28px rgba(105, 221, 255, 0.55);
        }

        .haldo-brand-logo::before {
            content: "✦";

            font-size: 20px;

            color: white;

            text-shadow:
                0 0 10px #fff,
                0 0 20px var(--haldo-cyan);
        }

        .haldo-brand-name {
            font-size: 15px;
            font-weight: 850;

            white-space: nowrap;
        }

        .haldo-brand-status {
            margin-top: 2px;

            color:
                var(--haldo-text-muted);

            font-size: 10px;

            white-space: nowrap;
        }

        .haldo-status-dot {
            display: inline-block;

            width: 7px;
            height: 7px;

            margin-right: 5px;

            border-radius: 50%;

            background:
                var(--haldo-green);

            box-shadow:
                0 0 9px var(--haldo-green);
        }

        .haldo-top-actions {
            display: flex;

            align-items: center;

            gap: 7px;
        }

        .haldo-glass-button {
            min-height: 38px;

            padding:
                8px 12px;

            border:
                1px solid var(--haldo-border);

            border-radius:
                12px;

            background:
                rgba(255, 255, 255, 0.045);

            color:
                var(--haldo-text);

            cursor: pointer;

            transition:
                var(--haldo-transition);
        }

        .haldo-glass-button:hover {
            background:
                rgba(105, 221, 255, 0.10);

            border-color:
                var(--haldo-border-bright);

            transform:
                translateY(-1px);
        }

        /* =========================================================
           APP DOCK
           ========================================================= */

        #haldo-dock {
            position: absolute;

            left: 16px;
            top: 88px;
            bottom: 16px;

            width: 76px;

            z-index: 100;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            padding:
                9px 8px;

            overflow-y: auto;
            overflow-x: hidden;

            border:
                1px solid var(--haldo-border);

            border-radius:
                24px;

            background:
                rgba(3, 11, 25, 0.72);

            backdrop-filter:
                blur(24px);

            box-shadow:
                0 18px 60px rgba(0, 0, 0, 0.28);
        }

        #haldo-dock::-webkit-scrollbar {
            width: 3px;
        }

        #haldo-dock::-webkit-scrollbar-thumb {
            background:
                rgba(105, 221, 255, 0.22);

            border-radius:
                20px;
        }

        .haldo-dock-button {
            position: relative;

            width: 52px;
            height: 52px;

            flex: 0 0 auto;

            display: grid;
            place-items: center;

            border:
                1px solid transparent;

            border-radius:
                16px;

            background:
                rgba(255, 255, 255, 0.035);

            color:
                var(--haldo-text);

            font-size: 21px;

            cursor: pointer;

            transition:
                var(--haldo-transition);
        }

        .haldo-dock-button:hover {
            background:
                rgba(105, 221, 255, 0.10);

            border-color:
                var(--haldo-border);

            transform:
                translateY(-2px);
        }

        .haldo-dock-button.active {
            background:
                linear-gradient(
                    135deg,
                    rgba(105, 221, 255, 0.20),
                    rgba(144, 116, 255, 0.18)
                );

            border-color:
                var(--haldo-border-bright);

            box-shadow:
                0 0 18px rgba(105, 221, 255, 0.12);
        }

        /* =========================================================
           WORKSPACE
           ========================================================= */

        #haldo-workspace {
            position: absolute;

            left: 108px;
            right: 0;

            top: 80px;
            bottom: 0;

            z-index: 50;

            pointer-events: none;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 760px) {

            #haldo-topbar {
                left: 10px;
                right: 10px;
            }

            #haldo-dock {
                left: 10px;
                width: 60px;
            }

            .haldo-dock-button {
                width: 43px;
                height: 43px;

                border-radius: 13px;

                font-size: 18px;
            }

            #haldo-workspace {
                left: 82px;
            }

            .haldo-brand-name,
            .haldo-brand-status {
                display: none;
            }

            .haldo-top-actions .haldo-glass-button span {
                display: none;
            }

            #haldo-sun-system {
                transform:
                    translate(-50%, -50%)
                    scale(0.78);
            }
        }

    </style>
</head>

<body>

<div id="haldo-os">

    <!-- =========================================================

/* ================================================================
   SAFE STORAGE
   ================================================================ */

HalDo.storage = {

    prefix: "haldo.os20.",

    get(key, fallback = null) {

        try {

            const raw =
                window.localStorage.getItem(
                    this.prefix + key
                );

            if (raw === null) {
                return fallback;
            }

            return JSON.parse(raw);

        } catch (error) {

            console.warn(
                "[HalDo Storage] Read failed:",
                key,
                error
            );

            return fallback;
        }
    },

    set(key, value) {

        try {

            window.localStorage.setItem(
                this.prefix + key,
                JSON.stringify(value)
            );

            return true;

        } catch (error) {

            console.warn(
                "[HalDo Storage] Write failed:",
                key,
                error
            );

            return false;
        }
    },

    remove(key) {

        try {

            window.localStorage.removeItem(
                this.prefix + key
            );

            return true;

        } catch (error) {

            return false;
        }
    }

};

/* ================================================================
   EVENT BUS
   ================================================================ */

HalDo.events = new EventTarget();

HalDo.emit = function (
    eventName,
    detail = {}
) {

    HalDo.events.dispatchEvent(
        new CustomEvent(
            eventName,
            {
                detail
            }
        )
    );

};

HalDo.on = function (
    eventName,
    callback
) {

    HalDo.events.addEventListener(
        eventName,
        callback
    );

};

HalDo.off = function (
    eventName,
    callback
) {

    HalDo.events.removeEventListener(
        eventName,
        callback
    );

};

/* ================================================================
   UTILITIES

            Date.now().toString(36) +
            "-" +
            Math.random()
                .toString(36)
                .slice(2, 9)
        );
    },

    escape(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    },

    formatDate(date = new Date()) {

        return date.toLocaleDateString(
            "de-DE",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"

            {

        );

        );

        return true;

    get(id) {

        return this.items.get(id) ||

        }

        HalDo.state.activeApp =

    register(

        element
    ) {

        if (!element) {
            return false;
        }

        this.windows.set(
            id,
            element
        );

        return true;
    },

    get(id) {

        return this.windows.get(id) ||
            null;
    },

    focus(id) {

        const window =
            this.get(id);

        if (!window) {
            return false;
        }

        this.zIndex += 1;

        window.style.zIndex =
            String(this.zIndex);

        HalDo.state.activeWindow =
            id;

        HalDo.emit(
            "window:focus",
            {
                id,
                window
            }
        );

        return true;
    },

    close(id) {

        const window =
            this.get(id);

        if (!window) {
            return false;
        }

        window.remove();

        this.windows.delete(id);

        HalDo.emit(
            "window:close",
            {
                id
            }
        );

        return true;
    }

};

                content,
                timestamp:

        if (

            200
        ) {

            this.history =
                this.history.slice(-200);

        HalDo.storage.set(
            "ai-history",

        ) {

            );

            /datum|welcher tag/.test(text)
        ) {

            return (

            "muss anschließend die vorhandene HalDo " +
            "AI-Service-Bridge mit einem echten Modell " +
            "verbunden werden. Ich erfinde keine nicht " +
            "vorhandene Verbindung."
        );

    }

};

<script>

/* ================================================================
   HALDO AI OS 20
   PART 2 / 8
   RUNTIME + WINDOW SYSTEM + APP FOUNDATION
   ================================================================ */

"use strict";

const HD = window.HalDo;

/* ================================================================
   RUNTIME
   ================================================================ */

HD.runtime = {

    initialized: false,

    components: new Map(),

    register(name, component) {

        if (!name || !component) {
            return false;
        }

        this.components.set(name, component);

        HD.emit("runtime:component-registered", {
            name,
            component
        });

        return true;
    },

    get(name) {
        return this.components.get(name) || null;
    },

    has(name) {
        return this.components.has(name);
    },

    async start() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        HD.state.booted = true;

        HD.emit("runtime:started", {
            version: HD.version
        });

        return true;
    }

};

/* ================================================================
   DOM REFERENCES
   ================================================================ */

HD.dom = {

    os: null,
    world: null,
    stars: null,
    workspace: null,
    dock: null,
    topbar: null,
    sun: null,

    init() {

        this.os =
            document.getElementById("haldo-os");

        this.world =
            document.getElementById(
                "haldo-cosmic-world"
            );

        this.stars =
            document.getElementById(
                "haldo-stars"
            );

        this.workspace =
            document.getElementById(
                "haldo-workspace"
            );

        this.dock =
            document.getElementById(
                "haldo-dock"
            );

        this.topbar =
            document.getElementById(
                "haldo-topbar"
            );

        this.sun =
            document.getElementById(
                "haldo-sun"
            );

    }

};

/* ================================================================
   COSMIC WORLD ENGINE
   ================================================================ */

HD.cosmic = {

    starCount: 190,

    running: true,

    init() {

        this.createStars();
        this.bindPlanets();
        this.bindSun();

        if (!HD.state.cosmicWorld) {
            this.hide();
        }

    },

    createStars() {

        if (!HD.dom.stars) {
            return;
        }

        HD.dom.stars.innerHTML = "";

        const fragment =
            document.createDocumentFragment();

        for (
            let i = 0;
            i < this.starCount;
            i++
        ) {

            const star =
                document.createElement("span");

            star.className =
                "haldo-star";

            const size =
                Math.random() > 0.9
                    ? 3
                    : Math.random() > 0.55
                        ? 2
                        : 1;

            star.style.width =
                `${size}px`;

            star.style.height =
                `${size}px`;

            star.style.left =
                `${Math.random() * 100}%`;

            star.style.top =
                `${Math.random() * 100}%`;

            star.style.setProperty(
                "--star-opacity",
                String(
                    0.25 +
                    Math.random() * 0.75
                )
            );

            star.style.setProperty(
                "--star-duration",
                `${2.2 + Math.random() * 5}s`
            );

            star.style.animationDelay =
                `${Math.random() * 5}s`;

            fragment.appendChild(star);

        }

        HD.dom.stars.appendChild(fragment);

    },

    bindSun() {

        if (!HD.dom.sun) {
            return;
        }

        HD.dom.sun.addEventListener(
            "click",
            () => {

                HD.emit(
                    "cosmic:sun-clicked"
                );

                HD.appManager.open("ai");

            }
        );

    },

    bindPlanets() {

        document
            .querySelectorAll(
                ".haldo-planet"
            )
            .forEach(
                planet => {

                    planet.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                            const name =
                                planet.dataset.planet;

                            HD.emit(
                                "cosmic:planet-selected",
                                {
                                    planet: name
                                }
                            );

                            HD.notifications.show(
                                this.planetMessage(
                                    name
                                ),
                                "info"
                            );

                        }
                    );

                }
            );

    },

    planetMessage(name) {

        const names = {

            mercury:
                "Merkur – der sonnennächste Planet.",

            venus:
                "Venus – eine heiße Welt mit dichter Atmosphäre.",

            earth:
                "Erde – unser Heimatplanet.",

            mars:
                "Mars – die rote Welt.",

            jupiter:
                "Jupiter – der größte Planet unseres Sonnensystems.",

            saturn:
                "Saturn – bekannt für sein beeindruckendes Ringsystem.",

            uranus:
                "Uranus – ein eisiger Planet mit ungewöhnlicher Achsneigung.",

            neptune:
                "Neptun – eine tiefblaue Eiswelt am äußeren Rand."
        };

        return (
            names[name] ||
            "Kosmisches Objekt von HalDo."
        );

    },

    show() {

        HD.state.cosmicWorld = true;

        HD.dom.world?.classList.remove(
            "hidden"
        );

        HD.saveState();

        HD.emit(
            "cosmic:shown"
        );

    },

    hide() {

        HD.state.cosmicWorld = false;

        HD.dom.world?.classList.add(
            "hidden"
        );

        HD.saveState();

        HD.emit(
            "cosmic:hidden"
        );

    },

    toggle() {

        if (HD.state.cosmicWorld) {
            this.hide();
        } else {
            this.show();
        }

    }

};

HD.notifications = {

    init() {

        this.container =

    },

    show(
        message,
        type = "info",
        duration = 3500
    ) {

        if (!this.container) {
            this.init();
        }

        const item =
            document.createElement("div");

        const icon = {

            info: "ℹ",
            success: "✓",
            warning: "!",
            error: "×"

        }[type] || "ℹ";

        Object.assign(
            item.style,
            {
                pointerEvents: "auto",
                padding: "14px 16px",
                border: "1px solid rgba(120,220,255,.24)",
                borderRadius: "16px",

                boxShadow: "0 18px 55px rgba(0,0,0,.4)",
                color: "#f1fbff",
                display: "flex",
                alignItems: "flex-start",
                gap: "11px",
                fontSize: "13px",
                lineHeight: "1.45",
                transform: "translateY(15px)",
                opacity: "0",
                transition: "all 220ms ease"
            }
        );

        item.innerHTML = `
            <span
                style="
                    display:grid;
                    place-items:center;
                    width:26px;
                    height:26px;
                    flex:0 0 26px;
                    border-radius:50%;

            <button
                type="button"
                aria-label="Schließen"
                style="
                    border:0;
                    background:transparent;
                    color:#7891a4;
                    cursor:pointer;
                    font-size:17px;
                "
            >×</button>
        `;

        this.container.appendChild(item);

        requestAnimationFrame(() => {

            item.style.opacity = "1";
            item.style.transform =
                "translateY(0)";

        });

        const close =
            () => {

                item.style.opacity = "0";

                item.style.transform =
                    "translateY(15px)";

                setTimeout(
                    () => item.remove(),
                    240
                );

            };

        item
            .querySelector("button")
            ?.addEventListener(
                "click",
                close
            );

        setTimeout(
            close,
            duration
        );

    }

};

/* ================================================================
   WINDOW CONTROLS
   ================================================================ */

HD.windowManager.bindControls =
    function (
        element,
        id
    ) {

        element
            .querySelectorAll(
                "[data-action]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                            const action =
                                button.dataset.action;

                            if (
                                action ===
                                "close"
                            ) {

                                this.close(id);

                            }

                            if (
                                action ===
                                "maximize"
                            ) {

                                element.classList.toggle(
                                    "maximized"
                                );

                                this.focus(id);

                            }

                            if (
                                action ===
                                "minimize"
                            ) {

                                element.style.display =
                                    "none";

                                HD.emit(
                                    "window:minimized",
                                    {
                                        id
                                    }
                                );

                            }

                        }
                    );

                }
            );

        element.addEventListener(
            "mousedown",
            () => this.focus(id)
        );

        element.addEventListener(
            "touchstart",
            () => this.focus(id),
            {
                passive: true
            }
        );

    };

/* ================================================================
   WINDOW DRAGGING
   ================================================================ */

HD.windowManager.enableDragging =
    function (element) {

        const handle =
            element.querySelector(
                "[data-window-drag-handle]"
            );

        if (!handle) {
            return;
        }

        let dragging = false;

        let startX = 0;
        let startY = 0;

        let originX = 0;
        let originY = 0;

        const begin =
            event => {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {
                    return;
                }

                if (
                    element.classList.contains(
                        "maximized"
                    )
                ) {
                    return;
                }

                dragging = true;

                const point =
                    event.touches
                        ? event.touches[0]
                        : event;

                const rect =
                    element.getBoundingClientRect();

                startX = point.clientX;
                startY = point.clientY;

                originX =
                    rect.left;

                originY =
                    rect.top;

                element.style.left =
                    `${originX}px`;

                element.style.top =
                    `${originY}px`;

                element.style.transform =
                    "none";

                element.setPointerCapture?.(
                    event.pointerId
                );

            };

        const move =
            event => {

                if (!dragging) {
                    return;
                }

                const point =
                    event.touches
                        ? event.touches[0]
                        : event;

                const dx =
                    point.clientX - startX;

                const dy =
                    point.clientY - startY;

                element.style.left =
                    `${originX + dx}px`;

                element.style.top =
                    `${originY + dy}px`;

            };

        const end =
            () => {

                dragging = false;

            };

        handle.addEventListener(
            "pointerdown",
            begin
        );

        window.addEventListener(
            "pointermove",
            move
        );

        window.addEventListener(
            "pointerup",
            end
        );

    };

/* ================================================================
   APP ROUTER
   ================================================================ */

HD.router = {

    routes: new Map(),

    register(
        appId,
        handler
    ) {

        if (
            !appId ||
            typeof handler !== "function"
        ) {
            return false;
        }

        this.routes.set(
            appId,
            handler
        );

        return true;

    },

    async navigate(
        appId,
        params = {}
    ) {

        const handler =
            this.routes.get(appId);

        if (handler) {

            return await handler(
                params
            );

        }

        return HD.appRenderer.openGeneric(
            appId,
            params
        );

    }

};

HD.appManager.open =
    async function (id, params = {}) {

        const app =
            HD.registry.get(id);

        if (!app) {

            HD.notifications.show(
                "Diese App ist im aktuellen Manifest nicht vorhanden.",
                "error"
            );

            return false;

        }

        HD.state.activeApp =
            id;

        HD.emit(
            "app:open-request",
            {
                id,
                app,
                params
            }
        );

        try {

            const result =
                await HD.router.navigate(
                    id,
                    params
                );

            HD.emit(
                "app:opened",
                {
                    id,
                    result
                }
            );

            return result;

        } catch (error) {

            console.error(
                "[HalDo App]",
                id,
                error
            );

            HD.notifications.show(
                `Die App „${app.name}“ konnte nicht geöffnet werden.`,
                "error"
            );

            return false;

        }

    };

/* ================================================================
   APP RENDERER
   ================================================================ */

HD.appRenderer = {

    openGeneric(
        appId,
        params = {}
    ) {

        const app =
            HD.registry.get(appId);

        if (!app) {
            return false;
        }

        const content =
            this.genericContent(
                app,
                params
            );

        const element =
            HD.windowManager.create(
                {
                    id:
                        `app-${app.id}`,

                    appId:
                        app.id,

                    title:
                        app.name,

                    icon:
                        app.icon,

                    content
                }
            );

        return element;

    },

    genericContent(
        app,
        params
    ) {

        return `

                    ${HD.utils.escape(app.name)}

        "music",
        "gallery",
        "settings"
    ],

    render() {

        const apps =
            this.favorites
                .map(
                    id =>
                        HD.registry.get(id)
                )

        const fragment =
            document.createDocumentFragment();

        apps.forEach(
            app => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "haldo-dock-button";

                button.dataset.appId =
                    app.id;

                button.title =
                    app.name;

                button.setAttribute(
                    "aria-label",
                    app.name
                );

                button.innerHTML =
                    HD.utils.escape(

                button.addEventListener(
                    "click",
                    () => {

                        this.setActive(

                        HD.appManager.open(
                            app.id

                    }
                );

                fragment.appendChild(
                    button

        HD.dom.dock.appendChild(

        document
            .querySelectorAll(

        });

                .trim();

        if (!value) {

            return "Ich höre dir zu. Was möchtest du wissen?";

        }

        if (
            value.includes("hallo") ||
            value.includes("hi") ||
            value.includes("hey")
        ) {

            return "Hallo! ❤️ Ich bin HalDo AI. Schön, dass du da bist. Was möchtest du gemeinsam machen?";

        }

        if (
            value.includes("wer bist du") ||
            value.includes("was bist du")
        ) {

            return "Ich bin HalDo AI – die zentrale intelligente Assistenz von HalDo AI OS. Ich kann dich beim Planen, Schreiben, Organisieren, Erklären und Bedienen deines Systems unterstützen.";

        }

        if (
            value.includes("kalender")
        ) {

            return "Natürlich. Ich kann dir helfen, Termine zu planen. Öffne den Kalender oder sage mir, welchen Termin du vorbereiten möchtest.";

        }

        if (
            value.includes("notiz")
        ) {

            return "Ich kann dir beim Erstellen und Strukturieren von Notizen helfen. Öffne dafür die Notizen-App.";

        }

        if (
            value.includes("aufgabe") ||
            value.includes("todo")
        ) {

            return "Aufgaben können in der Aufgaben-App gespeichert und abgehakt werden. Wenn du möchtest, können wir deine Aufgabe direkt formulieren.";

        }

        if (
            value.includes("danke")
        ) {

            return "Sehr gerne. ❤️ Ich bin hier und helfe dir weiter.";

        }

        if (
            value.includes("cosmic") ||
            value.includes("planet") ||
            value.includes("sonne")
        ) {

            return "Die HalDo Cosmic World ist die lebendige Oberfläche des Systems. Sonne, Planeten, Erde, Mond, Sterne und weitere kosmische Elemente werden miteinander verbunden.";

        }

        return `Ich habe dich verstanden: „${text}“. Die lokale HalDo-Intelligenz ist bereit. Für wirklich allgemeine Wissensfragen kann später zusätzlich ein externes KI-Modell über die HalDo-AI-Service-Schicht angebunden werden.`;

    },

    open() {

        this.load();

        const existing =
            HDA.windowManager.get(
                "app-ai"
            );

        if (existing) {

            HDA.windowManager.focus(
                "app-ai"
            );

            return existing;

        }

        const history =
            this.messages.length

        const content = `

                <div

                        flex:0 0 auto;
                        padding:14px;
                        border-top:
                            1px solid
                            rgba(125,222,255,.10);
                        background:
                            rgba(255,255,255,.025);
                    "
                >

                    <div
                        style="
                            display:flex;
                            gap:9px;
                            align-items:flex-end;
                        "
                    >

                        <textarea
                            id="haldo-ai-input"

                        ></textarea>

                        <button

                        <button

        const messages =
            element.querySelector(

        const input =
            element.querySelector(

        const send =
            element.querySelector(
                "#haldo-ai-send"
            );

        const submit =
            () => {

                const text =
                    input.value.trim();

                if (!text) {
                    return;
                }

                this.addMessage(
                    "user",
                    text
                );

                messages.insertAdjacentHTML(
                    "beforeend",
                    this.renderMessage({
                        role:"user",
                        text
                    })
                );

                input.value = "";

                messages.scrollTop =
                    messages.scrollHeight;

                send.disabled = true;

                setTimeout(
                    () => {

                        const answer =

                        this.addMessage(
                            "assistant",
                            answer
                        );

                        messages.insertAdjacentHTML(
                            "beforeend",

                            })
                        );

                        messages.scrollTop =
                            messages.scrollHeight;

                        send.disabled = false;

                        input.focus();

                    },
                    350
                );

            };

        send.addEventListener(
            "click",
            submit
        );

        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    submit();

                }

            }
        );

                    );

            );

            messages.scrollHeight;

        return element;

                            };

                    <div

                    >
                        ${user ? "DU" : "HALDO AI"}
                    </div>

                    ${HDA.utils.escape(
                        message.text
                    )}

                </div>

            </div>

        `;

    }

                >

                    placeholder="Apps oder Funktionen suchen..."
                    autocomplete="off"
                >

                <div
                    id="haldo-search-results"
                    style="
                        margin-top:18px;
                        display:grid;
                        gap:9px;
                    "
                ></div>

            </div>

        `;

        const element =
            HDA.apps.createWindow({
                id:"app-search",
                appId:"search",
                title:"Suche",
                icon:"⌕",
                content,
                width:
                    "min(700px,calc(100vw - 60px))",
                height:
                    "min(600px,calc(100vh - 100px))"
            });

        const input =
            element.querySelector(
                "#haldo-search-input"
            );

        const results =
            element.querySelector(
                "#haldo-search-results"
            );

        const render =
            () => {

                const query =
                    input.value
                        .trim()
                        .toLowerCase();

                const apps =
                    HDA.registry
                        .all()
                        .filter(
                            app => {

                                if (!query) {
                                    return true;
                                }

                                return (
                                    app.name
                                        .toLowerCase()
                                        .includes(query) ||

                                    app.id
                                        .toLowerCase()
                                        .includes(query) ||

                                    (
                                        app.description ||
                                        ""
                                    )
                                    .toLowerCase()
                                    .includes(query)
                                );

                            }
                        )
                        .slice(0,30);

                results.innerHTML =
                    apps.map(
                        app => `

                            <button
                                type="button"
                                data-search-app="${HDA.apps.escape(app.id)}"
                                style="
                                    width:100%;
                                    display:flex;
                                    align-items:center;
                                    gap:13px;

                                    style="

                                    "
                                >
                                    ${HDA.apps.escape(app.icon)}
                                </span>

                                <span>

                                    <strong>
                                        ${HDA.apps.escape(app.name)}
                                    </strong>

                                    <small
                                        style="
                                            display:block;
                                            color:#7891a4;
                                            margin-top:3px;
                                        "
                                    >
                                        ${HDA.apps.escape(app.description || "")}
                                    </small>

                                </span>

                            </button>

                        `
                    )
                    .join("");

                results
                    .querySelectorAll(
                        "[data-search-app]"
                    )
                    .forEach(
                        button => {

                            button.addEventListener(
                                "click",
                                () => {

                                    HDA.appManager.open(
                                        button.dataset.searchApp
                                    );

                                }
                            );

                        }
                    );

            };

        input.addEventListener(
            "input",
            render
        );

        render();

        setTimeout(
            () => input.focus(),
            80
        );

        return element;

    }

};

            );

            return existing;

        }

        const content = `

            <div
                class="haldo-app-page"
            >

                <h1
                    class="haldo-app-heading"
                >
                    Kalender
                </h1>

                <p
                    class="haldo-app-subheading"
                >
                    Termine planen und dauerhaft
                    in HalDo speichern.
                </p>

                <div
                    style="
                        display:grid;
                        grid-template-columns:
                            minmax(180px,1fr)
                            minmax(180px,1fr)
                            auto;
                        gap:9px;
                        margin-bottom:20px;
                    "
                >

                    <input
                        id="calendar-title"
                        class="haldo-input"
                        placeholder="Termin"
                    >

                    <input
                        id="calendar-date"
                        class="haldo-input"
                        type="datetime-local"
                    >

                    <button
                        id="calendar-add"
                        class="haldo-primary"
                        type="button"
                    >
                        + Hinzufügen
                    </button>

                </div>

                <div
                    id="calendar-list"
                ></div>

            </div>

        `;

        const element =
            HDA.apps.createWindow({
                id:"app-calendar",
                appId:"calendar",
                title:"Kalender",
                icon:"📅",
                content,
                width:
                    "min(850px,calc(100vw - 60px))",
                height:
                    "min(680px,calc(100vh - 90px))"
            });

        const title =
            element.querySelector(
                "#calendar-title"
            );

        const date =
            element.querySelector(
                "#calendar-date"
            );

        const add =
            element.querySelector(
                "#calendar-add"
            );

        const list =
            element.querySelector(
                "#calendar-list"
            );

        const render =
            () => {

                const events =
                    [...this.events]
                        .sort(
                            (a,b) =>
                                a.date.localeCompare(
                                    b.date
                                )
                        );

                if (!events.length) {

                    list.innerHTML = `
                        <div
                            class="haldo-card"
                            style="
                                text-align:center;
                                color:#7891a4;
                            "
                        >
                            Noch keine Termine.
                        </div>
                    `;

                    return;

                }

                list.innerHTML =
                    events
                        .map(

                                    class="haldo-card"
                                    style="
                                        display:flex;
                                        justify-content:
                                            space-between;
                                        gap:12px;
                                        margin-bottom:9px;
                                    "
                                >

                                            class="haldo-card-title"
                                        >
                                            ${HDA.apps.escape(
                                                event.title
                                            )}
                                        </div>

                                        <div
                                            class="haldo-card-text"
                                        >
                                            ${HDA.apps.escape(
                                                event.date
                                            )}
                                        </div>

                                    </div>

                                    <button
                                        class="haldo-secondary"
                                        data-calendar-delete="${event.id}"
                                        type="button"
                                    >
                                        Löschen
                                    </button>

                                </article>

                            `
                        )
                        .join("");

                list
                    .querySelectorAll(
                        "[data-calendar-delete]"
                    )
                    .forEach(
                        button => {

                            button.addEventListener(
                                "click",
                                () => {

                                    this.events =
                                        this.events.filter(
                                            event =>
                                                event.id !==
                                                button.dataset.calendarDelete
                                        );

                                    this.save();

                                    render();

                                }
                            );

                        }
                    );

            };

        add.addEventListener(
            "click",
            () => {

                const eventTitle =
                    title.value.trim();

                const eventDate =
                    date.value;

                if (!eventTitle) {

                    HDA.notifications.show(
                        "Bitte gib einen Titel für den Termin ein.",
                        "warning"
                    );

                    title.focus();

                    return;

                }

                if (!eventDate) {

                    HDA.notifications.show(
                        "Bitte wähle Datum und Uhrzeit.",
                        "warning"
                    );

                    date.focus();

                    return;

                }

                this.events.push({

                    id:
                        HDA.utils.id(
                            "calendar"
                        ),

                    title:
                        eventTitle,

                    date:
                        eventDate,

                    createdAt:
                        Date.now()

                });

                this.save();

                title.value = "";
                date.value = "";

                render();

                HDA.emit(
                    "calendar:event-created"
                );

                HDA.notifications.show(
                    "Termin gespeichert.",
                    "success"
                );

            }
        );

        render();

        return element;

    }

};

<script>

/* ================================================================
   HALDO AI OS 20
   PART 4 / 8
   SYSTEM + SETTINGS + LANGUAGE + VOICE + UTILITIES
   ================================================================ */

"use strict";

const HDA4 = window.HalDo;

/* ================================================================
   SETTINGS STATE
   ================================================================ */

HDA4.settings = HDA4.settings || {

    get(key, fallback = null) {

        return HDA4.storage.get(
            `haldo-setting-${key}`,
            fallback
        );

    },

    set(key, value) {

        HDA4.storage.set(
            `haldo-setting-${key}`,
            value
        );

        HDA4.emit(
            "settings:changed",
            {
                key,
                value
            }
        );

    }

};

/* ================================================================
   LANGUAGE SYSTEM
   ================================================================ */

HDA4.language = HDA4.language || {

    current:
        HDA4.storage.get(
            "haldo-language",
            "de"
        ),

    languages: {

        de: {
            name: "Deutsch",
            native: "Deutsch"
        },

        en: {
            name: "English",
            native: "English"
        },

        fr: {
            name: "French",
            native: "Français"
        },

        es: {
            name: "Spanish",
            native: "Español"
        },

        it: {
            name: "Italian",
            native: "Italiano"
        },

        tr: {
            name: "Turkish",
            native: "Türkçe"
        },

        ar: {
            name: "Arabic",
            native: "العربية"
        },

        ku: {
            name: "Kurdî",
            native: "Kurdî"
        },

        fa: {
            name: "Persian",
            native: "فارسی"
        },

        ru: {
            name: "Russian",
            native: "Русский"
        },

        uk: {
            name: "Ukrainian",
            native: "Українська"
        },

        zh: {
            name: "Chinese",
            native: "中文"
        },

        ja: {
            name: "Japanese",
            native: "日本語"
        },

        ko: {
            name: "Korean",
            native: "한국어"
        }

    },

    set(code) {

        if (!this.languages[code]) {
            return false;
        }

        this.current =
            code;

        HDA4.storage.set(
            "haldo-language",
            code
        );

        document.documentElement
            .setAttribute(
                "lang",
                code
            );

        HDA4.emit(
            "language:changed",
            {
                language: code
            }
        );

        HDA4.notifications.show(
            `Sprache geändert: ${this.languages[code].native}`,
            "success"
        );

        return true;

    },

    get() {

        return this.current;

    }

};

/* ================================================================
   VOICE ENGINE
   ================================================================ */

HDA4.voice = HDA4.voice || {

    enabled:
        HDA4.storage.get(
            "haldo-voice-enabled",
            true
        ),

    speaking:
        false,

    voices: [],

    loadVoices() {

        if (
            !("speechSynthesis" in window)
        ) {
            return;
        }

        this.voices =
            window.speechSynthesis
                .getVoices();

    },

    speak(
        text,
        options = {}
    ) {

        if (
            !this.enabled ||
            !("speechSynthesis" in window)
        ) {
            return false;
        }

        this.stop();

        const utterance =
            new SpeechSynthesisUtterance(
                String(text)
            );

        utterance.lang =
            options.lang ||
            this.languageToVoiceLanguage(
                HDA4.language.get()
            );

        utterance.rate =
            Number(
                options.rate ?? 0.96
            );

        utterance.pitch =
            Number(
                options.pitch ?? 1.03
            );

        utterance.volume =
            Number(
                options.volume ?? 0.75
            );

        const preferred =
            this.voices.find(
                voice =>
                    voice.lang
                        .toLowerCase()
                        .startsWith(
                            utterance.lang
                                .toLowerCase()
                                .split("-")[0]
                        )
            );

        if (preferred) {
            utterance.voice =
                preferred;
        }

        utterance.onstart =
            () => {

                this.speaking =
                    true;

                HDA4.emit(
                    "voice:start"
                );

            };

        utterance.onend =
            () => {

                this.speaking =
                    false;

                HDA4.emit(
                    "voice:end"
                );

            };

        utterance.onerror =
            () => {

                this.speaking =
                    false;

                HDA4.emit(
                    "voice:error"
                );

            };

        window.speechSynthesis
            .speak(
                utterance
            );

        return true;

    },

    stop() {

        if (
            "speechSynthesis" in window
        ) {

            window.speechSynthesis
                .cancel();

        }

        this.speaking =
            false;

    },

    languageToVoiceLanguage(
        language
    ) {

        const map = {

            de: "de-DE",
            en: "en-US",
            fr: "fr-FR",
            es: "es-ES",
            it: "it-IT",
            tr: "tr-TR",
            ar: "ar-SA",
            ku: "ku-TR",
            fa: "fa-IR",
            ru: "ru-RU",
            uk: "uk-UA",
            zh: "zh-CN",
            ja: "ja-JP",
            ko: "ko-KR"

        };

        return (
            map[language] ||
            "de-DE"
        );

    },

    setEnabled(
        enabled
    ) {

        this.enabled =
            Boolean(
                enabled
            );

        HDA4.storage.set(
            "haldo-voice-enabled",
            this.enabled
        );

        if (!this.enabled) {
            this.stop();
        }

        HDA4.emit(
            "voice:setting-changed",
            {
                enabled:
                    this.enabled
            }
        );

    }

};

if (
    "speechSynthesis" in window
) {

    HDA4.voice.loadVoices();

    window.speechSynthesis
        .addEventListener(
            "voiceschanged",
            () =>
                HDA4.voice.loadVoices()
        );

}
