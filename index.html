<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HalDo AI OS 24 – Ultimate</title>
    <link rel="icon" href="assets/images/favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
        /* ==============================================================
           HALDO AI OS 24 – ULTIMATE CSS (VOLLSTÄNDIG)
           ============================================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-window: rgba(16, 16, 40, 0.94);
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #e8eef5;
            --text-secondary: #8899bb;
            --text-muted: #556688;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.04);
            --accent-1: #00d4ff;
            --accent-2: #7b2ffc;
            --accent-3: #ff6b6b;
            --shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            --radius: 12px;
            --radius-sm: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        html,
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== LOGO INTRO ===== */
        #intro-container {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #intro-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .logo-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-intro-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            animation: logoPulse 2.8s ease-in-out infinite;
            filter: drop-shadow(0 0 50px rgba(0, 212, 255, 0.3));
            z-index: 2;
            position: relative;
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.2));
            }
            50% {
                transform: scale(1.06);
                filter: drop-shadow(0 0 80px rgba(123, 47, 252, 0.5));
            }
        }

        .logo-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, 0.06);
            animation: ringSpin linear infinite;
            pointer-events: none;
        }
        .logo-ring:nth-child(1) {
            inset: -10px;
            border-color: rgba(0, 212, 255, 0.08);
            animation-duration: 10s;
        }
        .logo-ring:nth-child(2) {
            inset: -25px;
            border-color: rgba(123, 47, 252, 0.06);
            animation-duration: 14s;
            animation-direction: reverse;
        }
        .logo-ring:nth-child(3) {
            inset: -40px;
            border-color: rgba(255, 255, 255, 0.03);
            animation-duration: 18s;
        }
        .logo-ring:nth-child(4) {
            inset: -55px;
            border-color: rgba(0, 212, 255, 0.04);
            animation-duration: 22s;
            animation-direction: reverse;
        }

        @keyframes ringSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .intro-title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 4px;
            animation: titleFade 1.2s ease-out forwards;
            opacity: 0;
        }

        @keyframes titleFade {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .intro-subtitle {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0.5;
            animation: subtitleFade 1.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes subtitleFade {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 0.5;
                transform: translateY(0);
            }
        }

        .intro-loader {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid var(--accent-1);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .intro-status {
            font-size: 0.7rem;
            color: var(--text-secondary);
            animation: pulse 1.4s ease-in-out infinite;
            min-height: 20px;
            text-align: center;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        .intro-progress {
            width: 280px;
            height: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 3px;
            margin-top: 14px;
            overflow: hidden;
            position: relative;
        }
        .intro-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .intro-progress-text {
            font-size: 0.45rem;
            color: var(--text-secondary);
            margin-top: 6px;
            letter-spacing: 2px;
            opacity: 0.4;
        }

        .intro-version {
            position: fixed;
            bottom: 20px;
            right: 24px;
            font-size: 0.45rem;
            color: var(--text-secondary);
            opacity: 0.2;
            letter-spacing: 1px;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent);
            pointer-events: none;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.3);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            .logo-wrapper {
                width: 120px;
                height: 120px;
            }
            .intro-title {
                font-size: 2rem;
            }
            .intro-subtitle {
                font-size: 0.55rem;
                letter-spacing: 5px;
            }
            .intro-progress {
                width: 200px;
            }
            .logo-ring:nth-child(3) {
                inset: -30px;
            }
            .logo-ring:nth-child(4) {
                inset: -42px;
            }
        }

        @media (max-width: 380px) {
            .logo-wrapper {
                width: 90px;
                height: 90px;
            }
            .intro-title {
                font-size: 1.6rem;
            }
            .intro-subtitle {
                font-size: 0.5rem;
                letter-spacing: 4px;
            }
            .intro-progress {
                width: 160px;
            }
            .logo-ring:nth-child(3) {
                inset: -22px;
            }
            .logo-ring:nth-child(4) {
                inset: -32px;
            }
        }

        @supports (-webkit-touch-callout: none) {
            .logo-intro-img {
                -webkit-user-select: none;
            }
        }

        /* ===== COSMIC CANVAS ===== */
        #cosmic {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: auto;
            display: block;
        }

        /* ===== MENU BAR ===== */
        #menu-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 38px;
            z-index: 2000;
            background: rgba(10, 10, 26, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.7rem;
        }
        #menu-bar .menu-item {
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            font-weight: 500;
            letter-spacing: 0.3px;
            font-size: 0.65rem;
        }
        #menu-bar .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        #menu-bar .menu-left {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        #menu-bar .logo-text {
            font-weight: 700;
            font-size: 0.85rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 6px;
        }
        #menu-bar .menu-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        #menu-bar .clock {
            color: var(--text-secondary);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }
        #menu-bar .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #44ff88;
            display: inline-block;
            margin-right: 4px;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }
        #menu-bar .status-text {
            font-size: 0.5rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* ===== APP CONTAINER ===== */
        #app-container {
            position: fixed;
            inset: 38px 0 58px 0;
            z-index: 10;
            pointer-events: none;
        }
        #app-container .window {
            position: absolute;
            pointer-events: auto;
            background: var(--bg-window);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-width: 200px;
            min-height: 130px;
            overflow: hidden;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }
        #app-container .window.active {
            box-shadow: 0 16px 56px rgba(0, 180, 255, 0.08);
            border-color: rgba(0, 180, 255, 0.12);
        }
        #app-container .window.minimized {
            display: none;
        }

        .window-header {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            cursor: grab;
            flex-shrink: 0;
            min-height: 34px;
            user-select: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .window-title .icon {
            font-size: 0.9rem;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }
        .window-controls .win-btn {
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            font-size: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            transition: all var(--transition);
            line-height: 1;
        }
        .window-controls .win-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .window-controls .win-btn.close:hover {
            background: #ff4444;
            color: #fff;
        }
        .window-controls .win-btn.maximize:hover {
            background: rgba(68, 255, 136, 0.15);
            color: #44ff88;
        }
        .window-controls .win-btn.minimize:hover {
            background: rgba(255, 204, 0, 0.15);
            color: #ffcc00;
        }

        .window-body {
            flex: 1;
            padding: 10px 12px;
            overflow: auto;
            font-size: 0.7rem;
            color: var(--text-primary);
            min-height: 60px;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== DOCK ===== */
        #dock {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 6px 12px;
            display: flex;
            gap: 4px;
            align-items: center;
            pointer-events: auto;
            max-width: 94vw;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dock-item {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .dock-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-4px);
        }
        .dock-item:active {
            transform: translateY(0px) scale(0.92);
        }
        .dock-item .label {
            position: absolute;
            bottom: -20px;
            font-size: 0.45rem;
            color: var(--text-secondary);
            white-space: nowrap;
            opacity: 0;
            transition: opacity var(--transition);
            pointer-events: none;
        }
        .dock-item:hover .label {
            opacity: 1;
        }
        .dock-divider {
            width: 1px;
            height: 28px;
            background: var(--border-color);
            margin: 0 3px;
        }

        /* ===== NOTIFICATION ===== */
        #notification {
            position: fixed;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            z-index: 9999;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-1);
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 0.75rem;
            color: var(--text-primary);
            max-width: 88vw;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            white-space: pre-line;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== LIVING AI AVATAR ===== */
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
        }
        .avatar-face {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a1a3a, #0a0a1a);
            border: 2px solid var(--border-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .avatar-face .eyes {
            display: flex;
            gap: 20px;
            position: absolute;
            top: 30%;
        }
        .avatar-face .eye {
            width: 16px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            transition: all 0.2s ease;
        }
        .avatar-face .eye::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #1a1a3a;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            left: 4px;
            transition: all 0.2s ease;
        }
        .avatar-face .eye.listening::after {
            left: 2px;
            bottom: 1px;
        }
        .avatar-face .eye.thinking::after {
            left: 6px;
            bottom: 6px;
        }
        .avatar-face .eye.happy::after {
            left: 4px;
            bottom: 2px;
            width: 10px;
            height: 10px;
        }
        .avatar-face .mouth {
            position: absolute;
            bottom: 22%;
            width: 24px;
            height: 4px;
            background: rgba(255, 100, 100, 0.3);
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .avatar-face .mouth.speaking {
            width: 28px;
            height: 10px;
            background: rgba(255, 100, 100, 0.5);
            border-radius: 0 0 14px 14px;
            animation: speak 0.3s ease-in-out infinite alternate;
        }
        .avatar-face .mouth.happy {
            width: 28px;
            height: 12px;
            border-radius: 0 0 20px 20px;
            background: rgba(255, 150, 150, 0.4);
        }
        .avatar-face .mouth.thinking {
            width: 16px;
            height: 6px;
            border-radius: 0 0 8px 8px;
            background: rgba(255, 200, 100, 0.3);
        }
        @keyframes speak {
            from {
                height: 4px;
                width: 20px;
            }
            to {
                height: 12px;
                width: 32px;
            }
        }
        .avatar-face .eyebrow {
            position: absolute;
            width: 20px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            top: 18%;
            transition: all 0.3s ease;
        }
        .avatar-face .eyebrow.left {
            left: 22%;
        }
        .avatar-face .eyebrow.right {
            right: 22%;
        }
        .avatar-face .eyebrow.happy {
            transform: translateY(-4px) rotate(-5deg);
        }
        .avatar-face .eyebrow.thinking {
            transform: translateY(-2px) rotate(5deg);
        }
        .avatar-face .eyebrow.sad {
            transform: translateY(2px) rotate(-5deg);
        }
        .avatar-status {
            font-size: 0.5rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .avatar-status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
            animation: blink 2s ease-in-out infinite;
        }
        .avatar-status .dot.idle {
            background: #44ff88;
        }
        .avatar-status .dot.listening {
            background: #44aaff;
        }
        .avatar-status .dot.thinking {
            background: #ffcc00;
            animation: blink 0.5s ease-in-out infinite;
        }
        .avatar-status .dot.speaking {
            background: #ff6b6b;
            animation: blink 0.3s ease-in-out infinite;
        }
        .avatar-status .dot.happy {
            background: #ffdd44;
        }

        /* ===== LANGUAGE SELECTOR ===== */
        .lang-selector {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .lang-btn {
            padding: 2px 8px;
            font-size: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        .lang-btn.active {
            background: var(--accent-1);
            color: #fff;
            border-color: var(--accent-1);
        }

        /* ===== APP-SPECIFIC ===== */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 6px;
        }
        .app-grid-item {
            background: var(--bg-card);
            padding: 8px 4px;
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid transparent;
        }
        .app-grid-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-light);
            transform: translateY(-2px);
        }
        .app-grid-item .icon {
            font-size: 1.4rem;
        }
        .app-grid-item .name {
            font-size: 0.45rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            font-size: 0.65rem;
            margin-bottom: 3px;
        }
        .list-item .text {
            word-break: break-word;
        }
        .list-item .del-btn {
            background: none;
            border: none;
            color: var(--accent-3);
            cursor: pointer;
            font-size: 0.6rem;
            padding: 2px 6px;
        }
        .list-item .del-btn:hover {
            color: #ff4444;
        }

        .input-field {
            flex: 1;
            font-size: 0.65rem;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.03);

            startListening: function() {
                if (!this.recognition) {
                    Notify.error(t('error'));
                    return;
                }
                if (this.isListening) {
                    this.recognition.stop();
                    return;
                }
                try {
                    var langCode = CONFIG.language === 'ku' ? 'ku' :
                        CONFIG.language === 'ezidi' ? 'ku' :
                        CONFIG.language === 'tr' ? 'tr' :
                        CONFIG.language === 'ar' ? 'ar' :
                        CONFIG.language === 'fr' ? 'fr' :
                        CONFIG.language === 'es' ? 'es' : 'de-DE';
                    this.recognition.lang = langCode;
                    this.recognition.start();
                    this.isListening = true;
                    Notify.info('🎤 ' + (CONFIG.language === 'en' ? 'Listening...' :
                        CONFIG.language === 'ku' ? 'Guhdarî...' :
                        CONFIG.language === 'tr' ? 'Dinliyorum...' : 'Höre zu ...'));

                    Notify.error(t('error'));

            _onResult: function(event) {
                var text = event.results[0][0].transcript;
                this.isListening = false;
                Notify.success('🎤 "' + text + '"');
                this._updateAvatarStatus('thinking');

                var cmd = AI._parseCommand(text);
                if (cmd && cmd.action === 'open') {
                    if (state.apps[cmd.app]) {
                        launchApp(cmd.app);
                        Notify.success(state.apps[cmd.app].title + ' ' + (CONFIG.language === 'en' ? 'opened!' :
                            CONFIG.language === 'ku' ? 'vebû!' :
                            CONFIG.language === 'tr' ? 'açıldı!' : 'geöffnet!'));
                        this._updateAvatarStatus('idle');
                        this.speak(state.apps[cmd.app].title + ' ' + (CONFIG.language === 'en' ? 'opened!' :
                            CONFIG.language === 'ku' ? 'vebû!' :
                            CONFIG.language === 'tr' ? 'açıldı!' : 'geöffnet!'));
                        return;
                    }
                }

                var input = document.getElementById('ai-input');
                if (input) {
                    input.value = text;
                    var sendBtn = document.getElementById('ai-send');
                    if (sendBtn) sendBtn.click();
                } else {
                    AI.ask(text, CONFIG.language).then(function(response) {
                        Notify.info(response);
                        if (state.settings.voiceEnabled) {
                            Voice.speak(response);
                        }
                    });
                }
            },

            _onError: function(event) {
                this.isListening = false;
                this._updateAvatarStatus('idle');
                if (event.error === 'not-allowed') {
                    Notify.error(t('error'));

                this.isListening = false;
                this._updateAvatarStatus('idle');

            speak: function(text, language) {
                if (!state.settings.voiceEnabled) return;
                language = language || CONFIG.language;
                var langCode = language === 'ku' ? 'ku' :
                    language === 'ezidi' ? 'ku' :
                    language === 'tr' ? 'tr' :
                    language === 'ar' ? 'ar' :
                    language === 'fr' ? 'fr' :
                    language === 'es' ? 'es' : 'de-DE';
                if (!('speechSynthesis' in window)) return;
                if (this.synthesis.speaking) {
                    this.synthesis.cancel();
                }
                this._updateAvatarStatus('speaking');
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langCode;

                // Stimme auswählen (männlich/weiblich)
                var voices = this.synthesis.getVoices();
                if (voices.length > 0) {
                    var voiceName = state.settings.voiceGender === 'female' ?
                        voices.find(function(v) { return v.lang === langCode && v.name.includes('Female'); }) ||
                        voices.find(function(v) { return v.lang === langCode; }) :
                        voices.find(function(v) { return v.lang === langCode && v.name.includes('Male'); }) ||
                        voices.find(function(v) { return v.lang === langCode; });
                    if (voiceName) utterance.voice = voiceName;
                }

                utterance.rate = 0.9;
                utterance.pitch = state.settings.voiceGender === 'female' ? 1.2 : 1.0;
                utterance.volume = 1;
                utterance.onend = function() {
                    Voice._updateAvatarStatus('idle');
                };
                this.synthesis.speak(utterance);
            },

            ask: function(question, language) {
                language = language || CONFIG.language;
                var self = this;
                this.isThinking = true;
                Voice._updateAvatarStatus('thinking');

                var lower = question.toLowerCase();
                var knowledge = this.knowledge[language] || this.knowledge['de'];
                for (var key in knowledge) {
                    if (lower.includes(key) || key.includes(lower)) {
                        var answer = knowledge[key];
                        this._addToHistory('user', question);
                        this._addToHistory('assistant', answer);
                        this.isThinking = false;
                        Voice._updateAvatarStatus('idle');
                        return Promise.resolve(answer);
                    }
                }

                var cmd = this._parseCommand(question);
                if (cmd && cmd.action === 'open') {
                    var appName = cmd.app;
                    if (state.apps[appName]) {
                        launchApp(appName);
                        this.isThinking = false;
                        Voice._updateAvatarStatus('idle');
                        return Promise.resolve('✅ ' + state.apps[appName].title + ' ' + (language === 'en' ?
                            'opened!' : language === 'ku' ? 'vebû!' : 'geöffnet!'));
                    }
                }

                var systemPrompt = language === 'en' ?
                    'You are HalDo, an intelligent, friendly and professional assistant. You help with all topics. You respond in ' +
                    language +
                    '. You can open apps when the user says: "Open [App-Name]". You are precise, helpful and empathetic. You have deep knowledge in law, medicine, science, history, culture, philosophy, technology, health and education.' :
                    language === 'ku' ?
                    'Tu HalDo yî, alîkarekî jîr, dostane û pîşeyî. Tu bi hemî mijaran re alîkarî dikî. Tu bi ' +
                    language +
                    ' bersivê didî. Tu dikarî appan vekî dema bikarhêner dibêje: "Veke [App-Name]". Tu rast, alîkar û dilovan î. Tu zanîna kûr di dad, bijîşkî, zanist, dîrok, çand, felsefe, teknolojî, tenduristî û perwerdeyê de heye.' :
                    'Du bist HalDo, ein intelligenter, freundlicher und professioneller Assistent. Du hilfst bei allen Themen. Du antwortest auf ' +
                    language +
                    '. Du kannst Apps öffnen, wenn der Benutzer sagt: "Öffne [App-Name]". Du bist präzise, hilfsbereit und einfühlsam. Du hast tiefes Wissen in Recht, Medizin, Wissenschaft, Geschichte, Kultur, Philosophie, Technik, Gesundheit und Bildung.';

                return new Promise(function(resolve, reject) {
                    fetch(CONFIG.apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',

        // ============================================================
        //  COSMIC WORLD (VOLLSTÄNDIG)
        // ============================================================
        function initCosmic() {
            var canvas = DOM.cosmic;
            if (!canvas) {
                console.error('[Cosmic] Canvas nicht gefunden!');
                return;
            }
            var ctx = canvas.getContext('2d');
            var W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // Sterne (350 Stück)
            var stars = [];
            for (var i = 0; i < 350; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 2.8 + 0.3,
                    speed: Math.random() * 0.02 + 0.002,
                    bright: Math.random() * 0.8 + 0.2,
                    phase: Math.random() * Math.PI * 2,
                    twinkle: Math.random() * 0.5 + 0.5
                });
            }

            // Sonne
            var sun = { x: W / 2, y: H / 2, radius: 55, glow: 160, phase: 0 };

            // 12 Planeten
            var planets = [];
            var planetData = [
                { name: 'Merkur', r: 5, color: '#b8b8b8', orbit: 55, speed: 0.035 },
                { name: 'Venus', r: 7, color: '#e8a060', orbit: 80, speed: 0.025 },
                { name: 'Erde', r: 9, color: '#4488ff', orbit: 110, speed: 0.018 },
                { name: 'Mars', r: 6, color: '#e86040', orbit: 140, speed: 0.014 },
                { name: 'Jupiter', r: 14, color: '#d4a060', orbit: 180, speed: 0.009 },
                { name: 'Saturn', r: 10, color: '#d4b880', orbit: 220, speed: 0.007 },
                { name: 'Uranus', r: 9, color: '#80d0f0', orbit: 260, speed: 0.005 },
                { name: 'Neptun', r: 8, color: '#4060f0', orbit: 300, speed: 0.004 },
                { name: 'Pluto', r: 4, color: '#c0a880', orbit: 335, speed: 0.003 },
                { name: 'HalDo-1', r: 7, color: '#f080d0', orbit: 370, speed: 0.0022 },
                { name: 'HalDo-2', r: 8, color: '#80f0a0', orbit: 405, speed: 0.0016 },
                { name: 'HalDo-3', r: 6, color: '#f0a080', orbit: 440, speed: 0.0012 }
            ];

            for (var p = 0; p < planetData.length; p++) {
                var pd = planetData[p];
                planets.push({
                    name: pd.name,
                    r: pd.r,
                    color: pd.color,
                    orbit: pd.orbit,
                    speed: pd.speed,
                    angle: Math.random() * Math.PI * 2,
                    cx: W / 2,
                    cy: H / 2,
                    glow: pd.r * 0.6
                });
            }

            // Monde
            var moons = [];
            for (var m = 0; m < 3; m++) {
                moons.push({
                    r: 3 + Math.random() * 2,
                    color: ['#ccc', '#aaa', '#888'][m],
                    orbit: 15 + m * 5,
                    speed: 0.08 + m * 0.02,
                    angle: Math.random() * Math.PI * 2,
                    ex: 0,
                    ey: 0,
                    parent: m === 0 ? 'Erde' : m === 1 ? 'Mars' : 'Jupiter'
                });
            }

            // Nebel
            var nebula = [];
            for (var n = 0; n < 60; n++) {
                nebula.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 100 + 30,
                    a: Math.random() * 0.035 + 0.005,
                    color: ['rgba(100,50,200,', 'rgba(200,50,100,', 'rgba(50,100,200,', 'rgba(200,100,50,',
                        'rgba(50,200,150,'
                    ][Math.floor(Math.random() * 5)]
                });
            }

            // Sternschnuppen
            var shootingStars = [];

            function animate() {
                var time = Date.now() / 2000;
                ctx.clearRect(0, 0, W, H);

                // Hintergrund
                var grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.9);
                grad.addColorStop(0, '#0a0a2a');
                grad.addColorStop(0.5, '#050515');
                grad.addColorStop(1, '#000005');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // Nebel
                for (var nb = 0; nb < nebula.length; nb++) {
                    var neb = nebula[nb];
                    neb.x += Math.sin(time * 0.08 + nb) * 0.3;
                    neb.y += Math.cos(time * 0.06 + nb * 0.5) * 0.3;
                    if (neb.x < -100) neb.x = W + 100;
                    if (neb.x > W + 100) neb.x = -100;
                    if (neb.y < -100) neb.y = H + 100;
                    if (neb.y > H + 100) neb.y = -100;

                    var grd = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.r);
                    grd.addColorStop(0, neb.color + (neb.a * 0.9) + ')');
                    grd.addColorStop(0.5, neb.color + (neb.a * 0.5) + ')');
                    grd.addColorStop(1, neb.color + '0)');
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(neb.x, neb.y, neb.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Sterne
                for (var s = 0; s < stars.length; s++) {
                    var st = stars[s];
                    st.y += st.speed;
                    if (st.y > H) { st.y = 0;
                        st.x = Math.random() * W; }
                    var b = st.bright * (0.5 + 0.5 * Math.sin(time * st.twinkle + st.phase));
                    ctx.globalAlpha = b * 0.9;
                    ctx.shadowColor = 'rgba(255,255,255,0.03)';
                    ctx.shadowBlur = 3;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // Sternschnuppen
                if (Math.random() < 0.003 && shootingStars.length < 3) {
                    var startX = Math.random() * W * 0.8 + W * 0.1;
                    var startY = Math.random() * H * 0.3;
                    shootingStars.push({
                        x: startX,
                        y: startY,
                        speedX: (Math.random() * 6 + 4) * (Math.random() > 0.5 ? 1 : -1),
                        speedY: Math.random() * 4 + 2,
                        life: 80 + Math.random() * 40,
                        maxLife: 80 + Math.random() * 40,
                        length: 60 + Math.random() * 40,
                        alpha: 0.8
                    });
                }

                for (var ss = shootingStars.length - 1; ss >= 0; ss--) {
                    var sstar = shootingStars[ss];
                    sstar.x += sstar.speedX;
                    sstar.y += sstar.speedY;
                    sstar.life--;

                    var progress = 1 - (sstar.life / sstar.maxLife);
                    var alpha = sstar.alpha * (1 - progress * progress) * 0.8;

                    ctx.globalAlpha = alpha;
                    ctx.shadowColor = 'rgba(255,255,255,0.1)';
                    ctx.shadowBlur = 10;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(sstar.x, sstar.y);
                    ctx.lineTo(sstar.x - sstar.speedX * 0.5, sstar.y - sstar.speedY * 0.5);
                    ctx.stroke();

                    ctx.globalAlpha = alpha * 0.3;
                    ctx.shadowBlur = 20;
                    ctx.strokeStyle = '#88ddff';
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(sstar.x, sstar.y);
                    ctx.lineTo(sstar.x - sstar.speedX * 0.8, sstar.y - sstar.speedY * 0.8);
                    ctx.stroke();

                    if (sstar.life <= 0 || sstar.x < -50 || sstar.x > W + 50 || sstar.y > H + 50) {
                        shootingStars.splice(ss, 1);
                    }
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // Sonne
                sun.phase += 0.02;
                var pulse = 1 + 0.04 * Math.sin(sun.phase);
                var r = sun.radius * pulse;

                // Sonnen-Corona
                for (var g = 10; g > 0; g--) {
                    var gr = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * g * 0.08);
                    gr.addColorStop(0, 'rgba(255,220,68,' + (0.04 / g) + ')');
                    gr.addColorStop(0.5, 'rgba(255,200,50,' + (0.02 / g) + ')');
                    gr.addColorStop(1, 'rgba(255,180,30,0)');
                    ctx.fillStyle = gr;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, sun.glow * g * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Sonnen-Oberfläche (detailliert)
                var sg = ctx.createRadialGradient(sun.x - r * 0.3, sun.y - r * 0.3, 0, sun.x, sun.y, r);
                sg.addColorStop(0, '#ffeecc');
                sg.addColorStop(0.15, '#ffdd66');
                sg.addColorStop(0.4, '#ffaa22');
                sg.addColorStop(0.7, '#ff8800');
                sg.addColorStop(0.9, '#ff5500');
                sg.addColorStop(1, '#ff3300');
                ctx.fillStyle = sg;
                ctx.shadowColor = '#ffdd44';
                ctx.shadowBlur = 50;
                ctx.beginPath();
                ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Sonnen-Flecken
                for (var sp = 0; sp < 8; sp++) {
                    var angle = sp * 0.9 + time * 0.08;
                    var dist = r * (0.15 + 0.35 * Math.sin(time * 0.04 + sp * 0.7));
                    var sx = sun.x + Math.cos(angle) * dist;
                    var sy = sun.y + Math.sin(angle) * dist;
                    var sr = r * (0.06 + 0.04 * Math.sin(time * 0.08 + sp * 0.5));
                    ctx.fillStyle = 'rgba(200,80,20,0.2)';
                    ctx.shadowColor = 'rgba(200,80,20,0.1)';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Heller Rand
                    ctx.fillStyle = 'rgba(255,200,100,0.1)';
                    ctx.beginPath();
                    ctx.arc(sx - sr * 0.2, sy - sr * 0.2, sr * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Sonnen-Symbol
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold ' + (r * 0.5) + 'px system-ui, sans-serif';
                ctx.shadowColor = 'rgba(255,255,255,0.2)';
                ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.fillText('⟡', sun.x, sun.y - r * 0.05);
                ctx.shadowBlur = 0;

                // Planeten
                for (var pl = 0; pl < planets.length; pl++) {
                    var p2 = planets[pl];
                    p2.angle += p2.speed;
                    var px = p2.cx + Math.cos(p2.angle) * p2.orbit;
                    var py = p2.cy + Math.sin(p2.angle) * p2.orbit;

                    // Orbit
                    ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 8]);
                    ctx.beginPath();
                    ctx.arc(p2.cx, p2.cy, p2.orbit, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Planet-Glow
                    var pGlow = p2.glow || p2.r * 0.6;
                    ctx.shadowColor = p2.color;
                    ctx.shadowBlur = pGlow * 2.5;
                    ctx.fillStyle = p2.color;
                    ctx.beginPath();
                    ctx.arc(px, py, p2.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Planet-Details
                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.beginPath();
                    ctx.arc(px - p2.r * 0.25, py - p2.r * 0.25, p2.r * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.05)';
                    ctx.beginPath();
                    ctx.arc(px + p2.r * 0.2, py + p2.r * 0.2, p2.r * 0.25, 0, Math.PI * 2);
                    ctx.fill();

                    // Name
                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.font = '5px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(p2.name, px, py + p2.r + 4);

                    // Mond speichern
                    if (p2.name === 'Erde') {
                        for (var mi = 0; mi < moons.length; mi++) {
                            if (moons[mi].parent === 'Erde') {
                                moons[mi].ex = px;
                                moons[mi].ey = py;
                            }
                        }
                    }
                    if (p2.name === 'Mars') {
                        for (var mi = 0; mi < moons.length; mi++) {
                            if (moons[mi].parent === 'Mars') {
                                moons[mi].ex = px;
                                moons[mi].ey = py;
                            }
                        }
                    }
                    if (p2.name === 'Jupiter') {
                        for (var mi = 0; mi < moons.length; mi++) {
                            if (moons[mi].parent === 'Jupiter') {
                                moons[mi].ex = px;
                                moons[mi].ey = py;
                            }
                        }
                    }
                }

                // Monde
                for (var mi = 0; mi < moons.length; mi++) {
                    var moon = moons[mi];
                    if (moon.ex !== undefined && moon.ey !== undefined) {
                        moon.angle += moon.speed;
                        moon.x = moon.ex + Math.cos(moon.angle) * moon.orbit;
                        moon.y = moon.ey + Math.sin(moon.angle) * moon.orbit;

                        ctx.shadowColor = moon.color;
                        ctx.shadowBlur = 4;
                        ctx.fillStyle = moon.color;
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }

                // Zeit
                var now = new Date();
                var timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit',
                    second: '2-digit' });
                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText('🕐 ' + timeStr, 14, H - 14);

                // Version & Info
                ctx.fillStyle = 'rgba(255,255,255,0.015)';
                ctx.font = '8px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText('HalDo v' + CONFIG.version + ' · ' + Object.keys(state.apps).length + ' Apps', W -
                14, H - 14);

                requestAnimationFrame(animate);
            }

            animate();

            // Interaktion: Klick auf Sonne → AI
            canvas.addEventListener('click', function(e) {
                var rect = canvas.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var dx = x - sun.x,
                    dy = y - sun.y;
                if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 1.8) {
                    launchApp('ai');
                    Notify.info('☀️ ' + (CONFIG.language === 'en' ? 'HalDo AI opened!' : CONFIG.language ===
                        'ku' ? 'HalDo AI vebû!' : 'HalDo AI geöffnet!'));
                }
            });

            canvas.addEventListener('touchstart', function(e) {
                var t = e.touches[0];
                var rect = canvas.getBoundingClientRect();
                var x = t.clientX - rect.left;
                var y = t.clientY - rect.top;
                var dx = x - sun.x,
                    dy = y - sun.y;
                if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 2) {
                    launchApp('ai');
                    Notify.info('☀️ ' + (CONFIG.language === 'en' ? 'HalDo AI opened!' : CONFIG.language ===
                        'ku' ? 'HalDo AI vebû!' : 'HalDo AI geöffnet!'));
                }
            }, { passive: true });

            window.addEventListener('resize', function() {
                for (var rp = 0; rp < planets.length; rp++) {
                    planets[rp].cx = W / 2;
                    planets[rp].cy = H / 2;
                }
                sun.x = W / 2;
                sun.y = H / 2;
            });

            console.log('🌌 Cosmic World erfolgreich gestartet!');
        }
       // ============================================================
        //  WINDOW MANAGER
        // ============================================================
        var WindowManager = {
            getSafePosition: function() {
                var vw = window.innerWidth,
                    vh = window.innerHeight;
                var w = Math.min(480, vw - 30);
                var h = Math.min(380, vh - 150);
                return {
                    x: Math.max(10, (vw - w) / 2 + (Math.random() - 0.5) * 30),
                    y: Math.max(40, (vh - h) / 2 - 20 + (Math.random() - 0.5) * 30),
                    w: w,
                    h: h
                };
            },

            launch: function(id) {
                var app = state.apps[id];
                if (!app) {
                    Notify.error(t('error') + ': "' + id + '"');
                    return null;
                }

                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].appId === id) {
                        this._focus(state.windows[i].id);
                        return state.windows[i];
                    }
                }

                var pos = this.getSafePosition();
                var winId = 'win-' + uid();
                var win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x,
                    y: pos.y,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null,
                    minimized: false,
                    _prev: {}
                };

                state.windows.push(win);
                this._render(win);
                this._focus(winId);

                if (app.render) {
                    var body = win.element.querySelector('.window-body');
                    app.render(body, win);
                }

                state.system.appLaunches++;
                Notify.info('🔄 ' + (app.title || id) + ' ' + (CONFIG.language === 'en' ? 'opened' : CONFIG
                    .language === 'ku' ? 'vebû' : 'geöffnet'));
                return win;
            },

            _render: function(win) {
                var existing = document.getElementById(win.id);
                if (existing) existing.remove();

                var el = document.createElement('div');
                el.id = win.id;
                el.className = 'window active';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;

                el.innerHTML =
                    '<div class="window-header">' +
                    '<span class="window-title"><span class="icon">' + win.icon + '</span>' + win.title +
                    '</span>' +
                    '<div class="window-controls">' +
                    '<button class="win-btn minimize" data-action="minimize">─</button>' +
                    '<button class="win-btn maximize" data-action="maximize">⧉</button>' +
                    '<button class="win-btn close" data-action="close">✕</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="window-body"></div>';

                DOM.appContainer.appendChild(el);
                win.element = el;

                var btns = el.querySelectorAll('.win-btn');
                for (var i = 0; i < btns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var action = btn.dataset.action;
                            if (action === 'close') WindowManager.close(win.id);
                            else if (action === 'minimize') WindowManager.minimize(win.id);
                            else if (action === 'maximize') WindowManager.maximize(win.id);
                        });
                    })(btns[i]);
                }

                this._setupDrag(win, el);
                this._setupResize(win, el);
            },

            _setupDrag: function(win, el) {
                var header = el.querySelector('.window-header');
                var drag = false,
                    startX, startY, origX, origY;

                function startDrag(cx, cy) {
                    if (header.querySelector('.win-btn')) return;
                    drag = true;
                    startX = cx;
                    startY = cy;
                    origX = win.x;
                    origY = win.y;
                    WindowManager._focus(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(cx, cy) {
                    if (!drag) return;
                    var dx = cx - startX,
                        dy = cy - startY;
                    win.x = clamp(origX + dx, 0, window.innerWidth - win.width);
                    win.y = clamp(origY + dy, 0, window.innerHeight - win.height - 60);
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() {
                    if (drag) { drag = false;
                        el.style.cursor = ''; }
                }

                header.addEventListener('mousedown', function(e) {
                    if (!e.target.closest('.win-btn')) startDrag(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', function(e) { if (drag) moveDrag(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    if (!e.target.closest('.win-btn')) startDrag(t.clientX, t.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', function(e) {
                    if (drag) { var t = e.touches[0];
                        moveDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', endDrag, { passive: true });
            },

            _setupResize: function(win, el) {
                var handle = document.createElement('div');
                handle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:20px;height:20px;cursor:se-resize;touch-action:none;';
                el.appendChild(handle);

                var resize = false,
                    startW, startH, startX2, startY2;

                function startResize(cx, cy) {
                    resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = cx;
                    startY2 = cy;
                }

                function moveResize(cx, cy) {
                    if (!resize) return;
                    var dw = cx - startX2,
                        dh = cy - startY2;
                    win.width = clamp(startW + dw, 160, window.innerWidth - win.x - 10);
                    win.height = clamp(startH + dh, 100, window.innerHeight - win.y - 70);
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                handle.addEventListener('mousedown', function(e) {
                    e.stopPropagation();
                    startResize(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', function(e) { if (resize) moveResize(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endResize);

                handle.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    e.stopPropagation();
                    startResize(t.clientX, t.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', function(e) {
                    if (resize) { var t = e.touches[0];
                        moveResize(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            },

            close: function(winId) {
                var idx = -1;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { idx = i; break; }
                }
                if (idx === -1) return;
                var win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) {
                    this._focus(state.windows[state.windows.length - 1].id);
                }
            },

            minimize: function(winId) {
                var win = this._find(winId);
                if (!win) return;
                win.minimized = !win.minimized;
                if (win.element) {
                    win.element.classList.toggle('minimized', win.minimized);
                }
                Notify.info(win.minimized ? '⏬ ' + win.title + ' ' + (CONFIG.language === 'en' ? 'minimized' :
                    CONFIG.language === 'ku' ? 'biçûkkirî' : 'minimiert') : '🔄 ' + win.title + ' ' + (CONFIG
                    .language === 'en' ? 'restored' : CONFIG.language === 'ku' ? 'vebû' : 'wiederhergestellt'));
            },

            maximize: function(winId) {
                var win = this._find(winId);
                if (!win || !win.element) return;

                if (win.width === window.innerWidth - 20) {
                    win.width = win._prev.w || 420;
                    win.height = win._prev.h || 320;
                    win.x = win._prev.x || 20;
                    win.y = win._prev.y || 40;
                } else {
                    win._prev = { w: win.width, h: win.height, x: win.x, y: win.y };
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            },

            _focus: function(winId) {
                var win = this._find(winId);
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    for (var i = 0; i < state.windows.length; i++) {
                        if (state.windows[i].id !== winId && state.windows[i].element) {
                            state.windows[i].element.classList.remove('active');
                        }
                    }
                }
            },

            _find: function(winId) {
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) return state.windows[i];
                }
                return null;
            }

                    '" 📧\n• "' + (CONFIG.language === 'en' ? 'Open Health' : CONFIG.language ===
                        'ku' ? 'Veke Tenduristî' : 'Öffne Gesundheit') + '" 🏥\n• "' + (CONFIG
                        .language === 'en' ? 'Open University' : CONFIG.language === 'ku' ?
                        'Veke Zanîngeh' : 'Öffne Universität') + '" 🏛️\n\n⌨️ ' +
                    (CONFIG.language === 'en' ? 'Shortcuts:' : CONFIG.language === 'ku' ?
                        'Kîteya:' : 'Shortcuts:') +
                    '\n• Cmd+K → AI\n• ' +
                    (CONFIG.language === 'en' ? 'Escape → Close window' : CONFIG.language === 'ku' ?
                        'Escape → Pencerê bigire' : 'Escape → Fenster schließen') +
                    '\n\n☀️ ' +
                    (CONFIG.language === 'en' ? 'Click on the sun!' : CONFIG.language === 'ku' ?
                        'Li rojê bitikîne!' : 'Klicke auf die Sonne!')
                );
            });
        }

        function loadSettings() {
            try {
                var saved = JSON.parse(localStorage.getItem('haldo_settings'));
                if (saved) {
                    for (var key in saved) {
                        if (state.settings.hasOwnProperty(key)) {
                            state.settings[key] = saved[key];
                        }
                    }
                    CONFIG.language = state.settings.language || 'de';
                    CONFIG.voiceGender = state.settings.voiceGender || 'male';
                }
            } catch (e) {}
        }

        function loadData() {
            try {
                var notes = localStorage.getItem('haldo_notes');
                if (notes) state.notes = JSON.parse(notes);
                var contacts = localStorage.getItem('haldo_contacts');
                if (contacts) state.contacts = JSON.parse(contacts);
                var tasks = localStorage.getItem('haldo_tasks');
                if (tasks) state.tasks = JSON.parse(tasks);
                var emails = localStorage.getItem('haldo_emails');
                if (emails) state.emails = JSON.parse(emails);
                var conv = localStorage.getItem('haldo_conversations');
                if (conv) {
                    var parsed = JSON.parse(conv);
                    if (Array.isArray(parsed)) AI.conversationHistory = parsed;
                }
            } catch (e) { console.log('[Storage] Fehler', e); }
        }

        // ============================================================
        //  GLOBAL EXPOSURE
        // ============================================================
        window.HalDo = {
            CONFIG: CONFIG,
            state: state,
            AI: AI,
            Voice: Voice,
            Notify: Notify,
            launchApp: launchApp,
            closeWindow: closeWindow,
            minimizeWindow: minimizeWindow,
            maximizeWindow: maximizeWindow,
            WindowManager: WindowManager,
            get apps() { return state.apps; },
            get windows() { return state.windows; },
            version: CONFIG.version,
            booted: function() { return state.isBooted; },
            resetData: function() {
                if (confirm('Alle Daten löschen?')) {
                    localStorage.clear();
                    location.reload();
                }
            },
            updateAvatar: function(status) {
                state.avatar.status = status;
                var el = document.getElementById('avatar-status');
                if (el) {
                    var texts = {
                        'idle': CONFIG.language === 'en' ? '● Ready' :
                            CONFIG.language === 'ku' ? '● Amade' : '● Bereit',
                        'listening': CONFIG.language === 'en' ? '🎤 Listening...' :
                            CONFIG.language === 'ku' ? '🎤 Guhdarî...' : '🎤 Hört zu...',
                        'thinking': CONFIG.language === 'en' ? '🧠 Thinking...' :
                            CONFIG.language === 'ku' ? '🧠 Difikire...' : '🧠 Denkt...',
                        'speaking': CONFIG.language === 'en' ? '🗣️ Speaking...' :
                            CONFIG.language === 'ku' ? '🗣️ Dipeyive...' : '🗣️ Spricht...',
                        'happy': CONFIG.language === 'en' ? '😊 Happy' :
                            CONFIG.language === 'ku' ? '😊 Kêfxweş' : '😊 Glücklich'
                    };
                    el.textContent = texts[status] || '● Bereit';
                    el.className = 'avatar-status ' + status;
                }
                var eyes = document.querySelectorAll('.eye');
                eyes.forEach(function(eye) { eye.className = 'eye ' + status; });
                var mouth = document.querySelector('.mouth');
                if (mouth) {
                    var mouthClasses = {
                        'speaking': 'mouth speaking',
                        'happy': 'mouth happy',
                        'thinking': 'mouth thinking',
                        'idle': 'mouth',
                        'listening': 'mouth'
                    };
                    mouth.className = mouthClasses[status] || 'mouth';
                }
                var eyebrows = document.querySelectorAll('.eyebrow');
                eyebrows.forEach(function(eb) {
                    var ebClasses = {
                        'happy': 'eyebrow happy',
                        'thinking': 'eyebrow thinking',
                        'idle': 'eyebrow',
                        'listening': 'eyebrow',
                        'speaking': 'eyebrow'
                    };
                    eb.className = ebClasses[status] || 'eyebrow';
                });
            },
            changeLanguage: window.changeLanguage
        };

        window.notify = Notify.show;

        // ============================================================
        //  SPRACHE WECHSELN
        // ============================================================
        window.changeLanguage = function(lang) {
            if (CONFIG.languages[lang]) {
                CONFIG.language = lang;
                state.settings.language = lang;
                try {
                    localStorage.setItem('haldo_settings', JSON.stringify(state.settings));
                } catch (e) {}
                Notify.success('🌍 ' + (lang === 'en' ? 'Language changed to English' : lang === 'ku' ?
                    'Ziman hate guhertin Kurmancî' : lang === 'ezidi' ?
                    'Ziman hate guhertin Êzîdî' : 'Sprache geändert zu ' + CONFIG.languages[lang]
                    .name));
                var aiState = document.getElementById('ai-state');
                if (aiState) {
                    aiState.textContent = '● ' + (CONFIG.language === 'en' ? 'Ready' : CONFIG.language ===
                        'ku' ? 'Amade' : 'bereit');
                }
                var avatarStatus = document.getElementById('avatar-status');
                if (avatarStatus) {
                    avatarStatus.textContent = '● ' + (CONFIG.language === 'en' ? 'Ready' : CONFIG.language ===
                        'ku' ? 'Amade' : 'bereit');
                }
                document.querySelectorAll('.lang-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.textContent.includes(CONFIG.languages[lang]
                    .name));
                });
                var settingsLang = document.getElementById('settings-language');
                if (settingsLang) settingsLang.value = lang;
            }
        };

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                launchApp('ai');
            }
            if (e.key === 'Escape' && state.activeWindow) {
                closeWindow(state.activeWindow);
            }
            if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'L') {
                e.preventDefault();
                var langs = Object.keys(CONFIG.languages);
                var currentIdx = langs.indexOf(CONFIG.language);
                var nextIdx = (currentIdx + 1) % langs.length;
                window.changeLanguage(langs[nextIdx]);
            }
            // Voice umschalten (Cmd+Shift+V)
            if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'V') {
                e.preventDefault();
                state.settings.voiceGender = state.settings.voiceGender === 'female' ? 'male' : 'female';
                CONFIG.voiceGender = state.settings.voiceGender;
                try {
                    localStorage.setItem('haldo_settings', JSON.stringify(state.settings));
                } catch (e) {}
                Notify.info('🎤 ' + (CONFIG.language === 'en' ? 'Voice changed to' : CONFIG.language ===
                    'ku' ? 'Deng hate guhertin' : 'Stimme geändert zu') + ' ' + (state.settings
                    .voiceGender === 'female' ? '♀ ' + (CONFIG.language === 'en' ? 'Female' :
                        CONFIG.language === 'ku' ? 'Mê' : 'Weiblich') : '♂ ' + (CONFIG.language ===
                        'en' ? 'Male' : CONFIG.language === 'ku' ? 'Mêr' : 'Männlich')));
            }
        });

        // ============================================================
        //  MAIN INIT
        // ============================================================

        function init() {
            console.log('⟡ HalDo OS ' + CONFIG.version + ' — ULTIMATE EDITION');
            console.log('📱 ' + Object.keys(state.apps).length + ' Apps registriert');
            console.log('👤 Living AI integriert');
            console.log('🌍 Sprachen: ' + Object.keys(CONFIG.languages).join(', '));

            loadSettings();
            loadData();

            Voice.init();
            initCosmic();
            updateClock();
            setInterval(updateClock, 10000);
            initDock();
            initMenus();

            document.getElementById('btn-about').addEventListener('click', function() {
                Notify.show(
                    '⟡ **HalDo OS ' + CONFIG.version + '**\n' +
                    '💙❤️🚀 ' + Object.keys(state.apps).length + ' Apps\n' +
                    '✅ Groq AI verbunden\n' +
                    '👤 Living AI aktiv\n' +
                    '🚗 Fahrschule integriert\n' +
                    '📝 Notizen & Tasks lokal\n' +
                    '📧 E-Mail System\n' +
                    '🏥 Gesundheit & 🏛️ Universität\n' +
                    '🌍 ' + (CONFIG.language === 'en' ? 'Language' : CONFIG.language === 'ku' ?
                        'Ziman' : 'Sprache') + ': ' + CONFIG.languages[CONFIG.language]
                    .name + '\n' +
                    '🎤 Voice: ' + (state.settings.voiceGender === 'female' ? '♀' : '♂') +
                    '\n' +
                    '🔧 Build: ' + CONFIG.build + '\n' +
                    '⏱️ Uptime: ' + Math.floor((now() - state.system.started) / 1000) + 's\n' +
                    '📱 ' + (CONFIG.language === 'en' ? 'App launches' : CONFIG.language ===
                        'ku' ? 'Vekirina appan' : 'App-Starts') + ': ' + state.system
                    .appLaunches,
                    'info'
                );
            });

            bootSequence();
            console.log('✅ System bereit!');
            console.log('💡 Tipp: Cmd+K für AI, Escape für Fenster schließen, Cmd+Shift+V für Stimme');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

</body>
</html>
