<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="HalDo AI OS – Das ultimative intelligente Betriebssystem" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="logo.png" />
    <title>HalDo AI OS 26.0.0 – Cosmic Ultimate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           HALDO AI OS 26.0.0 – COSMIC ULTIMATE DESIGN
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0a0a1a;
            color: #fff;
            user-select: none;
        }
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --secondary: #00D4FF;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(20px);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.35);
            --taskbar-height: 48px;
            --menu-top-height: 40px;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== BOOT SCREEN ===== */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
            flex-direction: column;
            gap: 12px;
        }
        #boot-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .boot-container {
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #boot-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .boot-logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .boot-logo-ring {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(108, 60, 225, 0.15);
            animation: ringSpin 8s linear infinite;
        }
        .boot-logo-ring::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            width: 6px;
            height: 6px;
            background: var(--primary-light);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary-light);
        }
        @keyframes ringSpin {
            to {
                transform: rotate(360deg);
            }
        }
        .boot-logo {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bootPulse 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
            z-index: 2;
            position: relative;
            overflow: hidden;
        }
        #boot-logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }
        @keyframes bootPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 100px rgba(108, 60, 225, 0.6);
            }
        }
        .boot-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.12), transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes glowPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
        .boot-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            z-index: 2;
        }
        .boot-status {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            min-height: 20px;
            z-index: 2;
        }
        .boot-progress {
            width: 240px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            z-index: 2;
        }
        .boot-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }
        .boot-version {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            z-index: 2;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #0a0a1a;
        }
        #cosmic-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        #cosmic-canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #living-ai-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            z-index: 10;
            pointer-events: none;
            border-radius: 50%;
            overflow: hidden;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.15), transparent 70%);
            display: none;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.2);
        }
        #living-ai-container canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            mix-blend-mode: screen;
            image-rendering: auto;
        }

        /* ===== TOP MENU ===== */
        #top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--menu-top-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            z-index: 90;
        }
        .menu-left {
            display: flex;
            gap: 2px;
            overflow-x: auto;
            flex: 1;
        }
        .menu-left::-webkit-scrollbar {
            height: 0;
        }
        .menu-item {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: transparent;
            white-space: nowrap;
            transition: 0.2s;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .menu-item.active {
            background: var(--primary);
            color: #fff;
        }
        .menu-right {
            display: flex;
            gap: 4px;
        }
        .menu-right .menu-item {
            font-size: 9px;
            padding: 2px 6px;
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--taskbar-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 6px;
            z-index: 100;
            gap: 6px;
        }
        #taskbar-logo {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            overflow: hidden;
        }
        #taskbar-logo img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }
        #taskbar-time {
            font-size: 11px;
            color: var(--text-secondary);
            min-width: 50px;
            font-variant-numeric: tabular-nums;
        }
        .taskbar-center {
            flex: 1;
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }
        .taskbar-center::-webkit-scrollbar {
            height: 0;
        }
        .taskbar-app-btn {
            padding: 2px 8px;
            height: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-radius: 5px;
            color: var(--text-secondary);
            font-size: 9px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .taskbar-app-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--glass-border);
        }
        .taskbar-app-btn.active {
            background: rgba(108, 60, 225, 0.2);
            border-color: var(--primary);
            color: #fff;
        }
        .taskbar-right {
            display: flex;
            gap: 4px;
        }
        .taskbar-right .tb-icon {
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 4px;
            transition: 0.2s;
        }
        .taskbar-right .tb-icon:hover {
            color: #fff;
        }

        /* ===== WINDOWS ===== */
        #window-container {
            position: fixed;
            top: var(--menu-top-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--menu-top-height) - var(--taskbar-height));
            z-index: 10;
            pointer-events: none;
            padding: 6px;
        }
        .window {
            position: absolute;
            min-width: 220px;
            min-height: 150px;
            max-width: 85vw;
            max-height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--glass-shadow);
            pointer-events: all;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowOpen 0.2s ease;
            resize: both;
        }
        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .window.minimized {
            transform: scale(0.8) translateY(40px);
            opacity: 0;
            pointer-events: none;
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
            max-width: 100vw;
            max-height: 100vh;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid var(--glass-border);
            cursor: grab;
            min-height: 32px;
            flex-shrink: 0;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
        }
        .window-controls {
            display: flex;
            gap: 5px;
        }
        .window-controls button {
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 7px;
            line-height: 12px;
            text-align: center;
            color: transparent;
            transition: 0.2s;
        }
        .window-controls .btn-close {
            background: #FF5F57;
        }
        .window-controls .btn-close:hover {
            background: #FF3B30;
            transform: scale(1.1);
        }
        .window-controls .btn-minimize {
            background: #FFBD2E;
        }
        .window-controls .btn-minimize:hover {
            background: #FFA500;
            transform: scale(1.1);
        }
        .window-controls .btn-maximize {
            background: #28C840;
        }
        .window-controls .btn-maximize:hover {
            background: #00A020;
            transform: scale(1.1);
        }
        .window-body {
            flex: 1;
            padding: 10px;
            overflow: auto;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .window-body h2 {
            color: var(--text-primary);
            font-size: 15px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .window-body textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            padding: 6px 8px;
            font-family: inherit;
            font-size: 12px;
            resize: vertical;
        }
        .window-body textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .window-body input[type="text"],
        .window-body input[type="password"],
        .window-body select {
            width: 100%;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            font-size: 11px;
            outline: none;
            transition: 0.2s;
        }
        .window-body input:focus,
        .window-body select:focus {
            border-color: var(--primary);
        }

        /* ===== DESKTOP ICONS ===== */
        #desktop-icons {
            position: fixed;
            top: calc(var(--menu-top-height) + 8px);
            left: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 64px);
            gap: 8px;
            z-index: 1;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 72px;
            padding: 4px;
            border-radius: 12px;
            background: var(--glass-bg);
            border: 1px solid transparent;
            cursor: pointer;
            text-align: center;
            gap: 2px;
            backdrop-filter: var(--glass-blur);
            transition: 0.2s;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
            transform: translateY(-3px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .desktop-icon .icon-img {
            font-size: 24px;
        }
        .desktop-icon .icon-label {
            font-size: 9px;
            color: var(--text-secondary);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            max-width: 56px;
            word-wrap: break-word;
            line-height: 1.2;
        }

        /* ===== AI FLOATING BUTTON ===== */
        #ai-floating-btn {
            position: fixed;
            bottom: 64px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 30px rgba(108, 60, 225, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            border: none;
            overflow: hidden;
            transition: 0.3s;
        }
        #ai-floating-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 40px rgba(108, 60, 225, 0.6);
        }
        #ai-floating-btn img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        /* ===== FORM ELEMENTS ===== */
        .haldo-input {
            width: 100%;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            font-size: 11px;
            outline: none;
            transition: 0.2s;
        }
        .haldo-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
        }
        .haldo-btn {
            padding: 5px 14px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .haldo-btn:hover {
            background: var(--primary-light);
            transform: scale(1.02);
        }
        .haldo-btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
        }
        .haldo-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            :root {
                --taskbar-height: 40px;
                --menu-top-height: 34px;
            }
            .menu-item {
                font-size: 9px;
                padding: 2px 6px;
            }
            .boot-title {
                font-size: 20px;
            }
            .boot-logo {
                width: 60px;
                height: 60px;
            }
            #boot-logo-img {
                width: 38px;
                height: 38px;
            }
            .boot-logo-wrapper {
                width: 90px;
                height: 90px;
            }
            .boot-logo-ring {
                width: 110px;
                height: 110px;
            }
            .window {
                min-width: 70vw;
                min-height: 30vh;
            }
            .desktop-icon {
                width: 52px;
                height: 60px;
            }
            .desktop-icon .icon-img {
                font-size: 20px;
            }
            .desktop-icon .icon-label {
                font-size: 8px;
                max-width: 44px;
            }
            #living-ai-container {
                width: 130px;
                height: 130px;
            }
            #ai-floating-btn {
                width: 40px;
                height: 40px;
                bottom: 54px;
                right: 10px;
            }
            #ai-floating-btn img {
                width: 22px;
                height: 22px;
            }
        }
        @media (max-width: 480px) {
            .window {
                min-width: 85vw;
                min-height: 35vh;
            }
            #living-ai-container {
                width: 100px;
                height: 100px;
            }
        }
        @media (min-width: 1200px) {
            .window {
                min-width: 400px;
                min-height: 280px;
            }
            #living-ai-container {
                width: 220px;
                height: 220px;
            }
        }

        /* ===== THEMES ===== */
        [data-theme="light"] {
            --bg-primary: #f0f0f5;
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(0, 0, 0, 0.06);
        }
        [data-theme="cosmic"] {
            --bg-primary: #050510;
            --text-primary: #ffffff;
            --glass-bg: rgba(108, 60, 225, 0.08);
            --glass-border: rgba(108, 60, 225, 0.12);
            --primary: #8B5CF6;
            --secondary: #00D4FF;
        }
        [data-theme="aurora"] {
            --bg-primary: #0a0a20;
            --text-primary: #ffffff;
            --glass-bg: rgba(0, 200, 150, 0.06);
            --glass-border: rgba(0, 200, 150, 0.1);
            --primary: #00C896;
            --secondary: #00D4FF;
        }
        [data-theme="midnight"] {
            --bg-primary: #080812;
            --text-primary: #e0e0ff;
            --glass-bg: rgba(30, 20, 60, 0.2);
            --glass-border: rgba(80, 60, 160, 0.12);
            --primary: #7C5CFE;
            --secondary: #6C3CE1;
        }
    </style>
</head>

<body>

    <!-- ===== BOOT SCREEN ===== -->
    <div id="boot-screen">
        <div id="boot-stars"></div>
        <div class="boot-container">
            <div class="boot-logo-wrapper">
                <div class="boot-logo-ring"></div>
                <div class="boot-logo">
                    <img src="logo.png" alt="HalDo OS" id="boot-logo-img" onerror="this.src='logo.png'" />
                </div>
                <div class="boot-glow"></div>
            </div>
            <h1 class="boot-title">HalDo AI OS</h1>
            <p class="boot-status" id="boot-status">Initializing Cosmic Core...</p>
            <div class="boot-progress"><div class="boot-progress-bar" id="boot-progress"></div></div>
            <p class="boot-version">v26.0.0 Cosmic Ultimate</p>
        </div>
    </div>

    <!-- ===== DESKTOP ===== -->
    <div id="desktop">
        <div id="cosmic-canvas-container">
            <div id="living-ai-container"></div>
        </div>
        <div id="desktop-icons"></div>
        <div id="window-container"></div>

        <!-- TOP MENU -->
        <div id="top-menu">
            <div class="menu-left">
                <button class="menu-item active" data-menu="apps">📱 Apps</button>
                <button class="menu-item" data-menu="system">⚙️ System</button>
                <button class="menu-item" data-menu="tools">🔧 Tools</button>
                <button class="menu-item" data-menu="media">🎬 Medien</button>
                <button class="menu-item" data-menu="communication">💬 Kommunikation</button>
                <button class="menu-item" data-menu="health">🏥 Gesundheit</button>
                <button class="menu-item" data-menu="settings">⚙️ Einstellungen</button>
            </div>
            <div class="menu-right">
                <button class="menu-item" id="menu-theme">🌙</button>
                <button class="menu-item" id="menu-voice">👩</button>
                <button class="menu-item" id="menu-lang">DE</button>
                <button class="menu-item" id="menu-status">●</button>
            </div>
        </div>

        <!-- TASKBAR -->
        <div id="taskbar">
            <div class="taskbar-left">
                <div id="taskbar-logo">
                    <img src="logo.png" alt="HalDo" id="taskbar-logo-img" onerror="this.src='logo.png'" />
                </div>
                <span id="taskbar-time">00:00:00</span>
            </div>
            <div class="taskbar-center" id="taskbar-apps"></div>
            <div class="taskbar-right">
                <button class="tb-icon" id="tb-notifications">🔔</button>
                <button class="tb-icon" id="tb-status">●</button>
            </div>
        </div>

        <!-- AI FLOATING BUTTON -->
        <button id="ai-floating-btn">
            <img src="logo.png" alt="AI" onerror="this.src='logo.png'" />
        </button>
    </div>

    <script>
        // ============================================================
        //  HALDO AI OS 26.0.0 – COSMIC ULTIMATE (KOMPLETT & FEHLERFREI)
        //  ============================================================

        // ============================================================
        //  STORAGE
        // ============================================================
        const Storage = {
            prefix: 'haldo_',
            get(key, fallback = null) {
                try { const d = localStorage.getItem(this.prefix + key); return d ? JSON.parse(d) : fallback; } catch { return fallback; }
            },
            set(key, value) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); return true; } catch { return false; }
            },
            remove(key) { localStorage.removeItem(this.prefix + key); },
            clear() {
                Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
            }
        };
        window.Storage = Storage;

        // ============================================================
        //  EVENT BUS
        // ============================================================
        class EventBus {
            constructor() { this.events = {}; }
            on(event, fn) { if (!this.events[event]) this.events[event] = [];
                this.events[event].push(fn); }
            emit(event, data) { if (this.events[event]) this.events[event].forEach(fn => fn(data)); }
        }
        const bus = new EventBus();

        // ============================================================
        //  KERNEL
        // ============================================================
        const Kernel = {
            version: '26.0.0',
            name: 'HalDo AI OS',
            uptime: 0,
            init() {
                this.uptime = Date.now();
                console.log(`🔧 ${this.name} ${this.version} gestartet`);
                return this;
            },
            getUptime() { return Math.floor((Date.now() - this.uptime) / 1000); }
        };

        // ============================================================
        //  BOOT
        // ============================================================
        const Boot = {
            statusEl: document.getElementById('boot-status'),
            progressBar: document.getElementById('boot-progress'),
            starsContainer: document.getElementById('boot-stars'),

            createStars() {
                if (!this.starsContainer) return;
                const count = 80;
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    const size = Math.random() * 2.5 + 0.5;
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const delay = Math.random() * 3;
                    const duration = 2 + Math.random() * 3;
                    star.style.cssText =
                        `position:absolute;width:${size}px;height:${size}px;background:white;border-radius:50%;left:${x}%;top:${y}%;opacity:0;animation:starFade ${duration}s ease-in-out ${delay}s infinite;box-shadow:0 0 ${size*2}px rgba(255,255,255,0.2);`;
                    this.starsContainer.appendChild(star);
                }
                if (!document.getElementById('star-keyframes')) {
                    const style = document.createElement('style');
                    style.id = 'star-keyframes';
                    style.textContent =
                        `@keyframes starFade { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1); } }`;
                    document.head.appendChild(style);
                }
            },

            async start() {
                this.createStars();
                const steps = [
                    'Initializing Cosmic Core...',
                    'Loading Kernel...',
                    'Loading AI Engine...',
                    'Loading Applications...',
                    'Loading Cosmic World...',
                    'System Ready 🚀'
                ];
                for (let i = 0; i < steps.length; i++) {
                    this.statusEl.textContent = steps[i];
                    this.progressBar.style.width = ((i + 1) / steps.length * 100) + '%';
                    await new Promise(r => setTimeout(r, 300));
                    if (i === 2) AICore.init();
                    if (i === 3) AppManager.init();
                    if (i === 4) CosmicWorld.init();
                }
                document.getElementById('boot-screen').classList.add('hidden');
                document.getElementById('desktop').style.display = 'block';
                document.getElementById('ai-floating-btn').style.display = 'flex';
                document.getElementById('living-ai-container').style.display = 'block';
                setTimeout(() => LivingAI.init('living-ai-container'), 400);
                this.setupUI();
                bus.emit('system:ready');
            },

            setupUI() {
                document.querySelectorAll('.menu-item[data-menu]').forEach(el => {
                    el.addEventListener('click', function() {
                        document.querySelectorAll('.menu-item[data-menu]').forEach(e => e.classList.remove('active'));
                        this.classList.add('active');
                        AppManager.openCategory(this.dataset.menu);
                    });
                });
                document.getElementById('menu-theme').addEventListener('click', () => {
                    const themes = ['dark', 'light', 'cosmic', 'aurora', 'midnight'];
                    const current = document.documentElement.getAttribute('data-theme') || 'dark';
                    const next = themes[(themes.indexOf(current) + 1) % themes.length];
                    document.documentElement.setAttribute('data-theme', next);
                    const icons = { dark: '🌙', light: '☀️', cosmic: '🌌', aurora: '🌠', midnight: '🌃' };
                    document.getElementById('menu-theme').textContent = icons[next] || '🌙';
                    Storage.set('theme', next);
                });
                document.getElementById('menu-voice').addEventListener('click', () => {
                    const voices = ['👩', '👨', '🧑', '👧', '👦'];
                    const current = document.getElementById('menu-voice').textContent;
                    const idx = voices.indexOf(current);
                    const next = voices[(idx + 1) % voices.length];
                    document.getElementById('menu-voice').textContent = next;
                    Storage.set('voice_gender', next);
                });
                document.getElementById('menu-lang').addEventListener('click', () => {
                    const langs = ['DE', 'EN', 'KU', 'EZ', 'TR', 'AR', 'FR', 'ES', 'RU', 'FA', 'IT', 'PT', 'LA'];
                    const current = document.getElementById('menu-lang').textContent;
                    const idx = langs.indexOf(current);
                    const next = langs[(idx + 1) % langs.length];
                    document.getElementById('menu-lang').textContent = next;
                    Storage.set('language', next);
                    bus.emit('language:changed', { lang: next });
                });
                document.getElementById('menu-status').addEventListener('click', () => AppManager.openApp('system-monitor'));
                document.getElementById('taskbar-logo').addEventListener('click', () => AppManager.openApp('app-center'));
                document.getElementById('tb-notifications').addEventListener('click', () => {
                    const nots = Storage.get('notifications', []);
                    alert(nots.length ? '🔔 Benachrichtigungen:\n' + nots.join('\n') : '🔔 Keine Benachrichtigungen');
                });
                document.getElementById('tb-status').addEventListener('click', () => alert(
                    `✅ ${Kernel.name} ${Kernel.version}\nUptime: ${Kernel.getUptime()}s\nApps: ${AppManager.apps.length}`));
                document.getElementById('ai-floating-btn').addEventListener('click', () => AppManager.openApp('haldo-ai'));
                setInterval(() => {
                    const el = document.getElementById('taskbar-time');
                    if (el) el.textContent = new Date().toLocaleTimeString('de', { hour: '2-digit', minute: '2-digit',
                        second: '2-digit' });
                }, 1000);
                const savedTheme = Storage.get('theme', 'dark');
                document.documentElement.setAttribute('data-theme', savedTheme);
                const themeIcons = { dark: '🌙', light: '☀️', cosmic: '🌌', aurora: '🌠', midnight: '🌃' };
                document.getElementById('menu-theme').textContent = themeIcons[savedTheme] || '🌙';
                document.getElementById('menu-voice').textContent = Storage.get('voice_gender', '👩');
                document.getElementById('menu-lang').textContent = Storage.get('language', 'DE');
            }
        };

        // ============================================================
        //  COSMIC WORLD – 3D mit 13 Planeten, Sonne mit Logo
        // ============================================================
        const CosmicWorld = {
            isReady: false,
            scene: null,
            camera: null,
            renderer: null,
            planetMeshes: [],
            sunMesh: null,
            sunGlow: null,
            logoTexture: null,

            init() {
                console.log('🌌 Cosmic World init');
                const container = document.getElementById('cosmic-canvas-container');
                if (!container) return;

                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    this.logoTexture = new THREE.Texture(img);
                    if (this.sunMesh) {
                        this.sunMesh.material.map = this.logoTexture;
                        this.sunMesh.material.needsUpdate = true;
                    }
                };
                img.onerror = () => console.warn('⚠️ Logo nicht gefunden');
                img.src = 'logo.png';

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a0a1a);
                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 16, 40);
                camera.lookAt(0, 0, 0);
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);
                this.scene = scene;
                this.camera = camera;
                this.renderer = renderer;

                const light = new THREE.PointLight(0xffaa33, 2.5, 150);
                light.position.set(0, 0, 0);
                scene.add(light);
                scene.add(new THREE.AmbientLight(0x222244, 0.5));

                // Sonne mit Logo
                const sunGeo = new THREE.SphereGeometry(2.8, 64, 64);
                const sunMat = new THREE.MeshStandardMaterial({
                    color: 0xff8800,
                    emissive: 0xff4400,
                    emissiveIntensity: 1.0,
                    roughness: 0.2,
                    metalness: 0.0
                });
                const sun = new THREE.Mesh(sunGeo, sunMat);
                sun.position.set(0, 0, 0);
                sun.userData.isSun = true;
                scene.add(sun);
                this.sunMesh = sun;

                const glow = new THREE.Mesh(
                    new THREE.SphereGeometry(3.4, 32, 32),
                    new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.25, blending: THREE
                            .AdditiveBlending })
                );
                scene.add(glow);
                this.sunGlow = glow;

                const outer = new THREE.Mesh(
                    new THREE.SphereGeometry(4.8, 32, 32),
                    new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.06, blending: THREE
                            .AdditiveBlending })
                );
                scene.add(outer);

                // 13 Planeten (8 + 5 Zwergplaneten)
                const planetData = [
                    { name: 'Merkur', size: 0.22, dist: 4.0, color: 0xaaaaaa, speed: 0.04 },
                    { name: 'Venus', size: 0.38, dist: 5.8, color: 0xffcc88, speed: 0.025 },
                    { name: 'Erde', size: 0.42, dist: 7.6, color: 0x4488ff, speed: 0.018 },
                    { name: 'Mars', size: 0.34, dist: 9.4, color: 0xff4422, speed: 0.014 },
                    { name: 'Jupiter', size: 1.0, dist: 12.0, color: 0xddbb88, speed: 0.009 },
                    { name: 'Saturn', size: 0.85, dist: 15.0, color: 0xeeddbb, speed: 0.007 },
                    { name: 'Uranus', size: 0.6, dist: 18.2, color: 0x88ddff, speed: 0.005 },
                    { name: 'Neptun', size: 0.55, dist: 21.4, color: 0x3366ff, speed: 0.004 },
                    { name: 'Pluto', size: 0.15, dist: 24.6, color: 0xccbbaa, speed: 0.003 },
                    { name: 'Ceres', size: 0.12, dist: 27.0, color: 0xaa8866, speed: 0.0025 },
                    { name: 'Haumea', size: 0.16, dist: 29.4, color: 0x88ccaa, speed: 0.002 },
                    { name: 'Makemake', size: 0.14, dist: 31.8, color: 0xcc8866, speed: 0.0018 },
                    { name: 'Eris', size: 0.18, dist: 34.2, color: 0x6699cc, speed: 0.0015 }
                ];

                this.planetMeshes = [];
                planetData.forEach((p, i) => {
                    const geo = new THREE.SphereGeometry(p.size, 32, 32);
                    const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.5, metalness: 0.1,
                        emissive: p.color, emissiveIntensity: 0.02 });
                    const mesh = new THREE.Mesh(geo, mat);
                    const angle = (i / planetData.length) * Math.PI * 2 + Math.random() * 0.2;
                    mesh.position.x = Math.cos(angle) * p.dist;
                    mesh.position.z = Math.sin(angle) * p.dist;
                    mesh.userData = { dist: p.dist, speed: p.speed, angle: angle, name: p.name };
                    scene.add(mesh);
                    this.planetMeshes.push(mesh);

                    const pts = [];
                    for (let j = 0; j <= 60; j++) {
                        const t = (j / 60) * Math.PI * 2;
                        pts.push(new THREE.Vector3(Math.cos(t) * p.dist, 0, Math.sin(t) * p.dist));
                    }
                    const orbit = new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints(pts),
                        new THREE.LineBasicMaterial({ color: p.color, transparent: true, opacity: 0.08 })
                    );
                    scene.add(orbit);
                });

                // Sterne
                const starCount = 500;
                const starPos = new Float32Array(starCount * 3);
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * 400;
                }
                const starGeo = new THREE.BufferGeometry();
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.8 });
                scene.add(new THREE.Points(starGeo, starMat));

                container.style.pointerEvents = 'auto';
                container.addEventListener('click', (e) => this.onClick(e));

                let time = 0;
                const animate = () => {
                    requestAnimationFrame(animate);
                    time += 0.005;
                    if (this.sunMesh) {
                        this.sunMesh.rotation.y += 0.002;
                        if (this.sunGlow) {
                            const p = 1 + Math.sin(time * 0.5) * 0.04;
                            this.sunGlow.scale.set(p, p, p);
                            this.sunGlow.material.opacity = 0.2 + Math.sin(time * 0.4) * 0.05;
                        }
                    }
                    this.planetMeshes.forEach(m => {
                        const data = m.userData;
                        data.angle += data.speed * 0.3;
                        m.position.x = Math.cos(data.angle) * data.dist;
                        m.position.z = Math.sin(data.angle) * data.dist;
                        m.rotation.y += 0.01;
                    });
                    const a = time * 0.01;
                    camera.position.x = Math.sin(a) * 6;
                    camera.position.z = 38 + Math.sin(a * 0.7) * 3;
                    camera.position.y = 14 + Math.sin(a * 0.5) * 1.5;
                    camera.lookAt(0, 0, 0);
                    renderer.render(scene, camera);
                };
                animate();
                this.isReady = true;

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            },

            onClick(e) {
                if (!this.scene || !this.camera) return;
                const rect = this.renderer.domElement.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(x, y), this.camera);
                const intersects = ray.intersectObjects(this.scene.children, true);

                let hitSun = false;
                let hitPlanet = null;
                for (const hit of intersects) {
                    let obj = hit.object;
                    while (obj) {
                        if (obj.userData && obj.userData.isSun) { hitSun = true; break; }
                        if (obj.userData && obj.userData.name) { hitPlanet = obj.userData.name; break; }
                        obj = obj.parent;
                    }
                    if (hitSun || hitPlanet) break;
                }

                if (hitSun) {
                    console.log('☀️ Sonne geklickt – öffne HalDo AI!');
                    AppManager.openApp('haldo-ai');
                    bus.emit('sun:clicked');
                    return;
                }
                if (hitPlanet) {
                    const info = {
                        'Merkur': '☿ Merkur – Kleinster Planet, 57,9 Mio. km',
                        'Venus': '♀ Venus – Heißester Planet, 108,2 Mio. km',
                        'Erde': '🌍 Erde – Unser Zuhause, 149,6 Mio. km',
                        'Mars': '♂ Mars – Der rote Planet, 227,9 Mio. km',
                        'Jupiter': '♃ Jupiter – Größter Planet, 778,6 Mio. km',
                        'Saturn': '♄ Saturn – Herr der Ringe, 1,43 Mrd. km',
                        'Uranus': '♅ Uranus – Kälter Planet, 2,87 Mrd. km',
                        'Neptun': '♆ Neptun – Stürmischster Planet, 4,50 Mrd. km',
                        'Pluto': 'Pluto – Zwergplanet, 5,91 Mrd. km',
                        'Ceres': 'Ceres – Zwergplanet im Asteroidengürtel',
                        'Haumea': 'Haumea – Ei-förmiger Zwergplanet',
                        'Makemake': 'Makemake – Zwergplanet im Kuipergürtel',
                        'Eris': 'Eris – Größter Zwergplanet'
                    };
                    alert(`🪐 ${hitPlanet}\n${info[hitPlanet] || 'Ein faszinierender Himmelskörper!'}`);
                }
            }
        };

        // ============================================================
        //  LIVING AI – Avatar mit logo.png als lebendiges Gesicht
        //  Super-Vision-Qualität, 4K/8K-ready
        // ============================================================
        const LivingAI = {
            width: 400,
            height: 480,
            container: null,
            canvas: null,
            ctx: null,
            emotion: 'idle',
            isSpeaking: false,
            isThinking: false,
            breath: 0,
            blinkTimer: 0,
            eyeState: 'open',
            logoLoaded: false,
            logoImg: null,
            emotionData: {
                idle: { label: '💙 Bereit', eyeWidth: 1.0, eyeHeight: 1.0, mouthType: 'neutral', browY: 0, blush: 0.05,
                    light: 0.3 },
                thinking: { label: '🧠 Denkend', eyeWidth: 0.85, eyeHeight: 0.85, mouthType: 'thinking', browY: -6,
                    blush: 0, light: 0.6 },
                speaking: { label: '🗣️ Sprechend', eyeWidth: 0.95, eyeHeight: 0.95, mouthType: 'speaking', browY: 0,
                    blush: 0.1, light: 0.9 },
                happy: { label: '😊 Glücklich', eyeWidth: 0.9, eyeHeight: 0.85, mouthType: 'smile', browY: -4, blush: 0.25,
                    light: 0.7 }
            },

            init(containerId) {
                this.container = document.getElementById(containerId);
                if (!this.container) return;

                this.logoImg = new Image();
                this.logoImg.crossOrigin = 'anonymous';
                this.logoImg.onload = () => { this.logoLoaded = true; };
                this.logoImg.onerror = () => { console.warn('⚠️ Logo nicht gefunden, verwende Platzhalter');
                    this.logoLoaded = false; };
                this.logoImg.src = 'logo.png';

                this.canvas = document.createElement('canvas');
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.container.appendChild(this.canvas);
                this.ctx = this.canvas.getContext('2d');
                this.animate();

                bus.on('ai:processing', (p) => { this.isThinking = p;
                    this.emotion = p ? 'thinking' : 'idle'; });
                bus.on('ai:response', (data) => {
                    if (data && data.content) {
                        this.speak(data.content);
                        this.emotion = 'happy';
                        setTimeout(() => { if (!this.isSpeaking && !this.isThinking) this.emotion = 'idle'; }, 2000);
                    }
                });
                bus.on('system:ready', () => { this.emotion = 'idle'; });
                bus.on('sun:clicked', () => { this.wave(); });

                console.log('👤 Living AI Avatar mit Logo gestartet!');
            },

            animate() {
                requestAnimationFrame(() => this.animate());
                this.breath += 0.02;
                this.blinkTimer += 0.01;
                if (this.blinkTimer > 3 + Math.random() * 2) {
                    this.eyeState = 'closed';
                    setTimeout(() => { this.eyeState = 'open';
                        this.blinkTimer = 0; }, 150);
                }
                this.draw();
            },

            wave() {
                this.emotion = 'happy';
                setTimeout(() => { if (!this.isSpeaking) this.emotion = 'idle'; }, 800);
            },

            draw() {
                const ctx = this.ctx,
                    w = this.width,
                    h = this.height;
                ctx.clearRect(0, 0, w, h);
                const cx = w / 2,
                    cy = h / 2 - 10;

                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 220);
                const emotion = this.emotionData[this.emotion] || this.emotionData.idle;
                const lightIntensity = emotion.light || 0.3;
                grad.addColorStop(0, `rgba(108,60,225,${0.2 * lightIntensity})`);
                grad.addColorStop(0.5, `rgba(0,212,255,${0.08 * lightIntensity})`);
                grad.addColorStop(1, 'rgba(10,10,30,0.95)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Körper
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.fillStyle = '#2a1a3a';
                ctx.beginPath();
                ctx.ellipse(cx, h * 0.78, 80, 50, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3a2a1a';
                ctx.fillRect(cx - 20, h * 0.55, 40, 50);
                ctx.shadowBlur = 0;

                // Kopf
                const headX = cx + Math.sin(this.breath * 0.5) * 3;
                const headY = cy + Math.sin(this.breath * 0.3) * 2;
                const headR = 90;
                ctx.shadowBlur = 25;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(headX, headY, headR, 0, Math.PI * 2);
                const skinGrad = ctx.createRadialGradient(headX - 20, headY - 20, 10, headX, headY, headR);
                skinGrad.addColorStop(0, '#f5e0c8');
                skinGrad.addColorStop(0.6, '#e8c9a0');
                skinGrad.addColorStop(1, '#d4b08a');
                ctx.fillStyle = skinGrad;
                ctx.fill();
                ctx.shadowBlur = 0;

                // LOGO als Gesicht
                if (this.logoLoaded && this.logoImg) {
                    const logoSize = 120;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(headX, headY, headR * 0.72, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this.logoImg, headX - logoSize / 2, headY - logoSize / 2, logoSize, logoSize);
                    ctx.restore();
                } else {
                    ctx.fillStyle = 'rgba(108,60,225,0.15)';
                    ctx.font = '60px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('☀', headX, headY + 4);
                }

                // Wangen
                if (emotion.blush > 0) {
                    ctx.globalAlpha = emotion.blush;
                    ctx.fillStyle = '#ff6b8a';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'rgba(255,107,138,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(headX - 55, headY + 18, 22, 16, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(headX + 55, headY + 18, 22, 16, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }

                // Augen
                const eyeY = headY - 12,
                    spacing = 38,
                    eyeR = 18;
                const isClosed = this.eyeState === 'closed';
                const eyeW = emotion.eyeWidth || 1;
                const eyeH = emotion.eyeHeight || 1;

                for (let side of [-1, 1]) {
                    const ex = headX + side * spacing;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(0,0,0,0.1)';
                    ctx.beginPath();
                    ctx.ellipse(ex, eyeY, eyeR * eyeW, isClosed ? 3 : eyeR * eyeH, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (!isClosed) {

            openApp(appId) {
                const app = this.apps.find(a => a.id === appId);
                if (!app) { alert('App nicht gefunden, Bruder!'); return; }
                if (!this.installedApps.includes(appId)) {
                    this.installedApps.push(appId);
                    Storage.set('installed_apps', this.installedApps);
                    this.renderDesktopIcons();
                }
                if (appId === 'cosmic-world') {
                    if (!CosmicWorld.isReady) CosmicWorld.init();
                    else alert('🌌 Cosmic World läuft bereits, Bruder!');
                    return;
                }
                if (appId === 'haldo-ai' || appId === 'ai-chat') {
                    this.openAIChat(app);
                    return;
                }
                if (appId === 'settings') {
                    this.openSettings(app);
                    return;
                }
                const content = this.getAppContent(appId);
                const win = this.createWindow(app.name, app.icon, content);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            createWindow(title, icon, content, width = 400, height = 320) {
                const win = document.createElement('div');
                win.className = 'window';
                const w = Math.min(width, window.innerWidth - 60);
                const h = Math.min(height, window.innerHeight - 120);
                const windows = document.querySelectorAll('#window-container .window');
                const offset = windows.length * 20;
                const x = 20 + (windows.length % 5) * 25 + offset * 0.04;
                const y = 15 + (windows.length % 4) * 20 + offset * 0.04;
                win.style.cssText =
                    `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${Date.now()%1000+100};`;
                win.innerHTML = `
                    <div class="window-header">
                        <div class="window-title"><span>${icon}</span> ${title}</div>
                        <div class="window-controls">
                            <button class="btn-minimize">−</button>
                            <button class="btn-maximize">⛶</button>
                            <button class="btn-close">✕</button>
                        </div>
                    </div>
                    <div class="window-body">${content}</div>
                `;
                win.querySelector('.btn-close').onclick = () => { win.remove();
                    this.updateTaskbar(); };
                win.querySelector('.btn-minimize').onclick = () => win.classList.toggle('minimized');
                win.querySelector('.btn-maximize').onclick = () => win.classList.toggle('maximized');
                const header = win.querySelector('.window-header');
                let drag = false,
                    ox, oy, sx, sy;
                header.addEventListener('mousedown', (e) => {
                    if (win.classList.contains('maximized')) return;
                    drag = true;
                    const rect = win.getBoundingClientRect();
                    ox = rect.left;
                    oy = rect.top;
                    sx = e.clientX;
                    sy = e.clientY;
                    win.style.cursor = 'grabbing';
                    win.style.zIndex = Date.now() % 1000 + 200;
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    win.style.left = (ox + e.clientX - sx) + 'px';
                    win.style.top = (oy + e.clientY - sy) + 'px';
                });
                document.addEventListener('mouseup', () => { drag = false;
                    win.style.cursor = ''; });
                const resize = document.createElement('div');
                resize.style.cssText =
                    'position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;z-index:1000;';
                win.appendChild(resize);
                let rs = false,
                    rsx, rsy, rsw, rsh;
                resize.addEventListener('mousedown', (e) => {
                    if (win.classList.contains('maximized')) return;
                    rs = true;
                    rsx = e.clientX;
                    rsy = e.clientY;
                    rsw = win.offsetWidth;
                    rsh = win.offsetHeight;
                    e.preventDefault();
                });
                document.addEventListener('mousemove', (e) => {
                    if (!rs) return;
                    win.style.width = Math.max(180, rsw + e.clientX - rsx) + 'px';
                    win.style.height = Math.max(120, rsh + e.clientY - rsy) + 'px';
                });
                document.addEventListener('mouseup', () => { rs = false; });
                return win;
            },

                if (!input || !input.value.trim()) return;
                const notes = Storage.get('notes', []);

                if (body) body.innerHTML = this.getNotesUI();

                        <div id="calc-display" style="padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;text-align:right;font-size:22px;min-height:36px;">0</div>
                        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:6px;">
                            ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(b=>`<button onclick="AppManager.calcInput('${b}')" style="padding:8px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:4px;color:#fff;cursor:pointer;">${b}</button>`).join('')}

                `;

            calcInput(v) {
                const d = document.getElementById('calc-display');
                if (!d) return;
                if (v === '=') {
                    try { d.textContent = eval(d.textContent.replace('×', '*').replace('÷', '/')); } catch { d.textContent =
                            'Error'; }
                } else if (v === 'C') d.textContent = '0';
                else if (v === '⌫') d.textContent = d.textContent.length > 1 ? d.textContent.slice(0, -1) : '0';
                else {
                    if (d.textContent === '0' && v !== '.') d.textContent = v;
                    else d.textContent += v;
                }
            },
