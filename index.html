/* =========================================================
   GALAXY BOOT SOUND
   ========================================================= */

let audioContext = null;

function playGalaxyBootSound() {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioContext.state ===
            "suspended"
        ) {
            audioContext.resume();
        }

        const now =
            audioContext.currentTime;

        const master =
            audioContext.createGain();

        master.gain.setValueAtTime(
            0,
            now
        );

        master.gain.exponentialRampToValueAtTime(
            .045,
            now + .7
        );

        master.gain.exponentialRampToValueAtTime(
            .001,
            now + 4.2
        );

        master.connect(
            audioContext.destination
        );

        const frequencies = [
            110,
            164.81,
            220,
            329.63
        ];

        frequencies.forEach(
            (frequency,index) => {

                const oscillator =
                    audioContext
                        .createOscillator();

                oscillator.type =
                    index === 0
                        ? "sine"
                        : "triangle";

                oscillator.frequency.setValueAtTime(
                    frequency,
                    now
                );

                oscillator.frequency.exponentialRampToValueAtTime(
                    frequency * 1.5,
                    now + 3.5
                );

                const gain =
                    audioContext
                        .createGain();

                gain.gain.setValueAtTime(
                    .0001,
                    now
                );

                gain.gain.exponentialRampToValueAtTime(
                    .025 / (index + 1),
                    now + 1
                );

                gain.gain.exponentialRampToValueAtTime(
                    .0001,
                    now + 4
                );

                oscillator.connect(
                    gain
                );

                gain.connect(
                    master
                );

                oscillator.start(
                    now
                );

                oscillator.stop(
                    now + 4.2
                );

            }
        );

    }

    catch (error) {

        console.info(
            "Galaxy Audio:",
            error
        );

    }

}

/* =========================================================
   BOOT SEQUENCE
   ========================================================= */

async function boot() {

    const boot =
        document.getElementById(
            "boot"
        );

    const os =
        document.getElementById(
            "os"
        );

    const status =
        document.getElementById(
            "bootStatus"
        );

    const progress =
        document.getElementById(
            "bootProgress"
        );

    const stages = [

        [
            8,
            "Galaxie wird initialisiert …"
        ],

        [
            18,
            "HalDo Logo wird aktiviert …"
        ],

        [
            30,
            "Runtime wird gestartet …"
        ],

        [
            42,
            "App System wird verbunden …"
        ],

        [
            54,
            "Window System wird verbunden …"
        ],

        [
            66,
            "Storage / Persistence wird geladen …"
        ],

        [
            76,
            "Language System wird geladen …"
        ],

        [
            86,
            "AI Core wird aktiviert …"
        ],

        [
            94,
            "Voice System wird verbunden …"
        ],

        [
            100,
            "HalDo AI OS 22 ist bereit."
        ]

    ];

    for (
        const [value,text]
        of stages
    ) {

        progress.style.width =
            value + "%";

        status.textContent =
            text;

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    180
                )
        );

    }

    HD.runtime.start();

    HD.aiCore.initialize();

    playGalaxyBootSound();

    os.classList.add(
        "ready"
    );

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                500
            )
    );

    boot.classList.add(
        "hidden"
    );

    HD.emit(
        "system:ready"
    );

}
