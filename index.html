<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050816">
  <meta name="color-scheme" content="dark">
  <meta
    name="description"
    content="HalDo AI OS 20 – intelligente, lebendige Cosmic Operating System Oberfläche"
  >

  <title>HalDo AI OS 20</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #03050d;
      --bg2: #071126;
      --panel: rgba(9, 16, 38, .82);
      --panel2: rgba(18, 29, 61, .72);
      --glass: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.13);
      --text: #f5f8ff;
      --muted: #9ba8c7;
      --accent: #76a9ff;
      --accent2: #a779ff;
      --success: #64e7b1;
      --warning: #ffd56a;
      --danger: #ff6f91;
      --shadow: 0 25px 80px rgba(0,0,0,.45);
      --radius: 22px;
      --dock-height: 78px;
      --top-height: 56px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
      border: 0;
      cursor: pointer;
    }

    #haldo-os {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(72,104,210,.16), transparent 32%),
        radial-gradient(circle at 15% 80%, rgba(123,73,255,.10), transparent 30%),
        linear-gradient(135deg, #02040c, #071126 48%, #02030a);
    }

    #cosmic-world {
      position: absolute;
      inset: 0;
      overflow: hidden;
      perspective: 1100px;
      background:
        radial-gradient(circle at 50% 48%, rgba(88,125,255,.08), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(156,88,255,.08), transparent 30%);
    }

    .stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      opacity: .5;
      animation: starPulse 4s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { opacity: .18; transform: scale(.8); }
      50% { opacity: .85; transform: scale(1.4); }
    }

    .galaxy {
      position: absolute;
      width: 42vw;
      height: 18vw;
      left: 50%;
      top: 45%;
      transform:
        translate(-50%, -50%)
        rotate(-18deg);
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse,
          rgba(184,204,255,.15),
          rgba(104,124,255,.08) 35%,
          transparent 70%
        );
      filter: blur(10px);
      opacity: .65;
      pointer-events: none;
    }

    .cosmic-orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      border: 1px solid rgba(150,180,255,.09);
      border-radius: 50%;
      transform:
        translate(-50%, -50%)
        rotateX(68deg)
        rotateZ(var(--rotation, 0deg));
      pointer-events: none;
    }

    .orbit-1 {
      width: 330px;
      height: 330px;
    }

    .orbit-2 {
      width: 500px;
      height: 500px;
    }

    .orbit-3 {
      width: 690px;
      height: 690px;
    }

    .orbit-4 {
      width: 900px;
      height: 900px;
    }

    .orbit-5 {
      width: 1120px;
      height: 1120px;
    }

    .sun {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 150px;
      height: 150px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      background:
        radial-gradient(
          circle at 36% 32%,
          #fffde4 0%,
          #fff3a1 15%,
          #ffd25c 36%,
          #ff9d32 63%,
          #ff6335 82%,
          rgba(255,90,40,.2) 100%
        );
      box-shadow:
        0 0 35px rgba(255,205,88,.9),
        0 0 80px rgba(255,164,56,.7),
        0 0 150px rgba(255,108,42,.42);
      animation:
        sunBreath 4s ease-in-out infinite,
        sunSpin 22s linear infinite;
    }

    .sun::before,
    .sun::after {
      content: "";
      position: absolute;
      inset: -32px;
      border-radius: 50%;
      pointer-events: none;
    }

    .sun::before {
      background: radial-gradient(
        circle,
        rgba(255,224,120,.22),
        transparent 68%
      );
      animation: sunHalo 3s ease-in-out infinite;
    }

    .sun::after {
      inset: -65px;
      border: 2px solid rgba(255,190,90,.08);
      box-shadow:
        0 0 50px rgba(255,174,69,.15),
        inset 0 0 50px rgba(255,174,69,.1);
      animation: sunHalo 5s ease-in-out infinite reverse;
    }

    @keyframes sunBreath {
      0%, 100% { transform: translate(-50%, -50%) scale(.97); }
      50% { transform: translate(-50%, -50%) scale(1.045); }
    }

    @keyframes sunSpin {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(7deg); }
    }

    @keyframes sunHalo {
      0%, 100% { transform: scale(.92); opacity: .4; }
      50% { transform: scale(1.08); opacity: .8; }
    }

    .sun-label {
      position: absolute;
      left: 50%;
      top: calc(50% + 105px);
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,240,200,.8);
      letter-spacing: .18em;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 0 18px rgba(255,190,80,.8);
      pointer-events: none;
    }

    .planet {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      z-index: 8;
      cursor: pointer;
      box-shadow:
        inset -8px -7px 12px rgba(0,0,0,.35),
        0 0 18px rgba(120,160,255,.2);
      transform-origin: center;
    }

    .planet-earth {
      width: 40px;
      height: 40px;
      background:
        radial-gradient(circle at 35% 32%, #87d7ff, #2573bd 42%, #0c2c67 75%);
      animation: earthOrbit 22s linear infinite;
    }

    .planet-earth::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 35%, #6ed083 0 17%, transparent 18%),
        radial-gradient(circle at 60% 65%, #4eae6a 0 16%, transparent 17%),
        transparent;
      opacity: .85;
    }

    .planet-moon {
      width: 13px;
      height: 13px;
      background:
        radial-gradient(circle at 35% 30%, #fff, #b8becb 50%, #6e7481);
      animation: moonOrbit 5s linear infinite;
    }

    @keyframes earthOrbit {
      from {
        transform:
          rotate(0deg)
          translateX(165px)
          rotate(0deg);
      }
      to {
        transform:
          rotate(360deg)
          translateX(165px)
          rotate(-360deg);
      }
    }

    @keyframes moonOrbit {
      from {
        transform:
          rotate(0deg)
          translateX(35px);
      }
      to {
        transform:
          rotate(360deg)
          translateX(35px);
      }
    }

    .planet-2 {
      width: 25px;
      height: 25px;
      background:
        radial-gradient(circle at 35% 30%, #f8b785, #bd6e47 58%, #602b31);
      animation: planet2Orbit 31s linear infinite;
    }

    .planet-3 {
      width: 32px;
      height: 32px;
      background:
        radial-gradient(circle at 30% 30%, #d5e8ff, #6680ad 55%, #27385e);
      animation: planet3Orbit 42s linear infinite reverse;
    }

    .planet-4 {
      width: 52px;
      height: 52px;
      background:
        radial-gradient(circle at 35% 30%, #ffe3a1, #c58b47 55%, #6b4428);
      animation: planet4Orbit 58s linear infinite;
    }

    .planet-5 {
      width: 64px;
      height: 64px;
      background:
        radial-gradient(circle at 32% 28%, #e3c4a0, #8e705b 54%, #3c3941);
      animation: planet5Orbit 78s linear infinite reverse;
    }

    @keyframes planet2Orbit {
      from { transform: rotate(0deg) translateX(250px); }
      to { transform: rotate(360deg) translateX(250px); }
    }

    @keyframes planet3Orbit {
      from { transform: rotate(0deg) translateX(345px); }
      to { transform: rotate(360deg) translateX(345px); }
    }

    @keyframes planet4Orbit {
      from { transform: rotate(0deg) translateX(450px); }
      to { transform: rotate(360deg) translateX(450px); }
    }

    @keyframes planet5Orbit {
      from { transform: rotate(0deg) translateX(560px); }
      to { transform: rotate(360deg) translateX(560px); }
    }

    #topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--top-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      background: linear-gradient(
        to bottom,
        rgba(2,4,12,.72),
        rgba(2,4,12,.12)
      );
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-orb {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #fff, #8db5ff 30%, #755dff 70%, #241a66);
      box-shadow:
        0 0 18px rgba(111,142,255,.65);
    }

    .brand-text strong {
      display: block;
      font-size: 14px;
      letter-spacing: .04em;
    }

    .brand-text span {
      display: block;
      font-size: 10px;
      color: var(--muted);
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.045);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      backdrop-filter: blur(12px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px rgba(100,231,177,.8);
    }
  </style>
</head>

<body>
  <div id="haldo-os">

    <section id="cosmic-world" aria-label="HalDo Cosmic World">

      <div class="stars" id="star-field"></div>
      <div class="galaxy"></div>

      <div class="cosmic-orbit orbit-1"></div>
      <div class="cosmic-orbit orbit-2"></div>
      <div class="cosmic-orbit orbit-3"></div>
      <div class="cosmic-orbit orbit-4"></div>
      <div class="cosmic-orbit orbit-5"></div>

      <div
        class="sun"
        id="haldo-sun"
        role="button"
        tabindex="0"
        aria-label="HalDo Sonne – HalDo AI öffnen"
        title="HalDo AI"
      ></div>

      <div class="sun-label">HALDO AI</div>

      <div class="planet planet-earth" title="Erde"></div>
      <div class="planet planet-moon" title="Mond"></div>
      <div class="planet planet-2" title="Planet"></div>
      <div class="planet planet-3" title="Planet"></div>
      <div class="planet planet-4" title="Planet"></div>
      <div class="planet planet-5" title="Planet"></div>
    </section>

    <header id="topbar">
      <div class="brand">
        <div class="brand-orb"></div>
        <div class="brand-text">
          <strong>HalDo AI OS 20</strong>
          <span id="system-message">Cosmic Intelligence</span>
        </div>
      </div>

      <div class="system-status">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="runtime-status">System bereit</span>
        </div>
        <button
          class="status-pill"
          id="notification-button"
          type="button"
          aria-label="Benachrichtigungen"
        >
          🔔 <span id="notification-count">0</span>
        </button>
      </div>
    </header>

    <main id="desktop-root"></main>

    <aside id="launcher-root" aria-label="HalDo App Launcher"></aside>

    <section id="window-root" aria-label="Geöffnete Apps"></section>

    <section id="notification-root" aria-label="Benachrichtigungen"></section>

    <div id="boot-overlay">
      <div class="boot-logo">
        <div class="boot-orb"></div>
        <div class="boot-title">HalDo</div>
        <div class="boot-subtitle">AI OS 20</div>
        <div class="boot-progress">
          <span id="boot-progress-bar"></span>
        </div>
        <div id="boot-text">Cosmic System wird gestartet …</div>
      </div>
    </div>

  </div>

  <script>
    /*
     * ============================================================
     * HALDO AI OS 20
     * CENTRAL SHELL
     * ============================================================
     *
     * Diese Datei ist die visuelle und orchestrierende Shell.
     * Die eigentliche Systemlogik wird über die vorhandenen
     * HalDo-Module angebunden.
     *
     * Der interne HALDO Kernel/Event/Runtime Layer wird deshalb
     * nicht unnötig dupliziert.
     */

    window.HalDo = window.HalDo || {};

    window.HalDo.version = "20.0.0";
    window.HalDo.name = "HalDo AI OS";
    window.HalDo.ready = false;

    window.HalDo.state = {
      booted: false,
      currentApp: "haldo-home",
      launcherOpen: false,
      notificationsOpen: false,
      windows: new Map(),
      language: "de",
      theme: "cosmic",
      soundEnabled: true,
      voiceEnabled: true
    };

    window.HalDo.apps = new Map();

    window.HalDo.events = window.HalDo.events || {
      listeners: new Map(),

      on(event, handler) {
        if (!this.listeners.has(event)) {
          this.listeners.set(event, new Set());
        }

        this.listeners.get(event).add(handler);

        return () => {
          this.listeners.get(event)?.delete(handler);
        };
      },

      emit(event, payload = {}) {
        const handlers = this.listeners.get(event);

        if (!handlers) {
          return;
        }

        handlers.forEach(handler => {
          try {
            handler(payload);
          } catch (error) {
            console.error("[HalDo Event Error]", event, error);
          }
        });
      }
    };

    window.HalDo.storage = {
      prefix: "haldo-os20:",

      get(key, fallback = null) {
        try {
          const value = localStorage.getItem(this.prefix + key);
          return value === null ? fallback : JSON.parse(value);
        } catch {
          return fallback;
        }
      },

      set(key, value) {
        try {
          localStorage.setItem(
            this.prefix + key,
            JSON.stringify(value)
          );

          return true;
        } catch {
          return false;
        }
      },

      remove(key) {
        try {
          localStorage.removeItem(this.prefix + key);
        } catch {}
      }
    };

    window.HalDo.notify = function(message, type = "info") {
      window.HalDo.events.emit("notification", {
        message,
        type,
        time: Date.now()
      });
    };

    window.HalDo.openApp = function(appId, options = {}) {
      window.HalDo.events.emit("app:open", {
        appId,
        options
      });
    };

    window.HalDo.closeApp = function(appId) {
      window.HalDo.events.emit("app:close", {
        appId
      });
    };

    window.HalDo.toggleLauncher = function(force) {
      const launcher = document.getElementById("launcher-root");

      if (!launcher) {
        return;
      }

      const shouldOpen =
        typeof force === "boolean"
          ? force
          : !window.HalDo.state.launcherOpen;

      window.HalDo.state.launcherOpen = shouldOpen;
      launcher.classList.toggle("open", shouldOpen);

      window.HalDo.events.emit("launcher:toggle", {
        open: shouldOpen
      });
    };

    window.HalDo.setSystemMessage = function(message) {
      const element = document.getElementById("system-message");

      if (element) {
        element.textContent = message;
      }
    };

    window.HalDo.setRuntimeStatus = function(message) {
      const element = document.getElementById("runtime-status");

      if (element) {
        element.textContent = message;
      }
    };

    window.HalDo.registerApp = function(app) {
      if (!app || !app.id) {
        return false;
      }

      window.HalDo.apps.set(app.id, {
        id: app.id,
        name: app.name || app.id,
        icon: app.icon || "◉",
        category: app.category || "system",
        description: app.description || "",
        module: app.module || null,
        open: app.open || null
      });

      return true;
    };
  </script>
    <style>
    #desktop-root {
      position: absolute;
      inset: 56px 0 78px 0;
      z-index: 20;
      pointer-events: none;
    }

    #launcher-root {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(var(--dock-height) + 12px);
      max-height: min(72vh, 650px);
      z-index: 500;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(20px) scale(.98);
      pointer-events: none;
      transition:
        opacity .22s ease,
        transform .22s ease;
    }

    #launcher-root.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .launcher-panel {
      width: min(900px, 100%);
      margin: auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(5,9,24,.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px);
    }

    .launcher-header {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .launcher-search {
      width: 100%;
      height: 46px;
      padding: 0 16px;
      border-radius: 15px;
      border: 1px solid var(--border);
      outline: none;
      color: var(--text);
      background: rgba(255,255,255,.055);
    }

    .launcher-search:focus {
      border-color: rgba(118,169,255,.55);
      box-shadow: 0 0 0 3px rgba(118,169,255,.08);
    }

    .launcher-content {
      padding: 18px;
      overflow: auto;
      max-height: 55vh;
    }

    .app-section-title {
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
    }

    .app-tile {
      min-height: 92px;
      padding: 12px 8px;
      border: 1px solid transparent;
      border-radius: 18px;
      background: rgba(255,255,255,.045);
      transition:
        transform .16s ease,
        background .16s ease,
        border-color .16s ease;
    }

    .app-tile:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.085);
      border-color: rgba(255,255,255,.12);
    }

    .app-icon {
      width: 45px;
      height: 45px;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background:
        linear-gradient(
          145deg,
          rgba(118,169,255,.25),
          rgba(167,121,255,.15)
        );
      border: 1px solid rgba(255,255,255,.1);
      font-size: 22px;
    }

    .app-name {
      text-align: center;
      font-size: 11px;
      line-height: 1.25;
      color: var(--text);
    }

    #window-root {
      position: absolute;
      inset: 56px 10px 88px 10px;
      z-index: 300;
      pointer-events: none;
    }

    .haldo-window {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(900px, calc(100vw - 28px));
      height: min(680px, calc(100vh - 120px));
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: auto;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(7,12,29,.92);
      box-shadow: 0 30px 100px rgba(0,0,0,.58);
      backdrop-filter: blur(26px);
    }

    .window-header {
      height: 54px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      cursor: grab;
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .window-title-icon {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(118,169,255,.13);
    }

    .window-title-text {
      min-width: 0;
    }

    .window-title-text strong {
      display: block;
      font-size: 13px;
    }

    .window-title-text span {
      display: block;
      color: var(--muted);
      font-size: 9px;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .window-control {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255,255,255,.055);
    }

    .window-control:hover {
      background: rgba(255,255,255,.1);
    }

    .window-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    #notification-root {
      position: absolute;
      top: 68px;
      right: 14px;
      width: min(360px, calc(100vw - 28px));
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .notification-card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: rgba(7,12,29,.9);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(20px);
      animation: notificationIn .24s ease;
      pointer-events: auto;
    }

    @keyframes notificationIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    #boot-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: grid;

  <script>
    (function createStars() {
      const field = document.getElementById("star-field");

      if (!field) return;

      const count = Math.min(
        180,
        Math.max(80, Math.floor(
          (window.innerWidth * window.innerHeight) / 8500
        ))
      );

      const fragment = document.createDocumentFragment();

      for (let i = 0; i < count; i++) {
        const star = document.createElement("span");

        star.className = "star";

        const size = Math.random() > .92 ? 3 : 1 + Math.random();

        star.style.width = size + "px";
        star.style.height = size + "px";
        star.style.left = (Math.random() * 100) + "%";
        star.style.top = (Math.random() * 100) + "%";
        star.style.animationDelay =
          (-Math.random() * 4) + "s";
        star.style.animationDuration =
          (2.5 + Math.random() * 5) + "s";

        fragment.appendChild(star);
      }

      field.appendChild(fragment);
    })();
  </script>

  <script>
    window.HalDo.UI = {

      renderLauncher() {
        const root = document.getElementById("launcher-root");

        if (!root) return;

        root.innerHTML = `
          <div class="launcher-panel">
            <div class="launcher-header">
              <input
                id="app-search"
                class="launcher-search"
                type="search"
                autocomplete="off"
                placeholder="Apps, Einstellungen oder HalDo AI suchen …"
                aria-label="Apps suchen"
              >
            </div>

            <div class="launcher-content">
              <div id="launcher-app-sections"></div>
            </div>
          </div>
        `;

        const search =
          document.getElementById("app-search");

        search.addEventListener("input", () => {
          this.renderAppGrid(search.value);
        });

        this.renderAppGrid();
      },

      renderAppGrid(query = "") {
        const container =
          document.getElementById("launcher-app-sections");

        if (!container) return;

        const normalized =
          String(query).trim().toLowerCase();

        const apps =
          Array.from(window.HalDo.apps.values())
            .filter(app => {
              if (!normalized) return true;

              return (
                app.name.toLowerCase().includes(normalized) ||
                app.id.toLowerCase().includes(normalized) ||
                app.category.toLowerCase().includes(normalized)
              );
            });

        const categories = {
          ai: "🤖 Artificial Intelligence",
          communication: "💬 Kommunikation",
          productivity: "📅 Organisation",
          files: "📁 Dateien",
          media: "🎵 Medien",
          internet: "🌍 Internet",
          tools: "🧰 Werkzeuge",
          language: "⌨️ Sprache",
          system: "⚙️ System"
        };

        const grouped = {};

        apps.forEach(app => {
          const category = app.category || "system";

          if (!grouped[category]) {
            grouped[category] = [];
          }

          grouped[category].push(app);
        });

        container.innerHTML = "";

        Object.entries(grouped).forEach(
          ([category, categoryApps]) => {

            const section =
              document.createElement("section");

            section.innerHTML = `
              <div class="app-section-title">
                ${categories[category] || category}
              </div>
              <div class="app-grid"></div>
            `;

            const grid =
              section.querySelector(".app-grid");

            categoryApps.forEach(app => {
              const button =
                document.createElement("button");

              button.type = "button";
              button.className = "app-tile";
              button.dataset.appId = app.id;

              button.innerHTML = `
                <div class="app-icon">${app.icon}</div>
                <div class="app-name">${app.name}</div>
              `;

              button.addEventListener("click", () => {
                window.HalDo.toggleLauncher(false);
                window.HalDo.openApp(app.id);
              });

              grid.appendChild(button);
            });

            container.appendChild(section);
          }
        );
      }
    };

    window.HalDo.UI.renderLauncher();
  </script>

      async process(text) {
        const lower = text.toLowerCase();

        /*
         * Zuerst vorhandene HalDo AI APIs verwenden.
         * Dadurch kann die echte AI-Engine der ZIP später
         * übernommen werden, ohne die Shell neu zu schreiben.
         */

        const possibleEngines = [
          window.HalDoAI,
          window.HalDo?.AIEngine,
          window.HalDo?.AI,
          window.HalDoAIEngine
        ];

        for (const engine of possibleEngines) {
          if (!engine) continue;

          try {
            if (typeof engine.respond === "function") {
              const result =
                await engine.respond(text);

              if (result) return String(result);
            }

            if (typeof engine.chat === "function") {
              const result =
                await engine.chat(text);

              if (result) return String(result);
            }

            if (typeof engine.process === "function") {
              const result =
                await engine.process(text);

              if (result) return String(result);
            }
          } catch (error) {
            console.warn(
              "[HalDo AI]",
              error

          }
        }

        if (
          lower.includes("öffne") ||
          lower.includes("open")
        ) {
          const app =
            this.detectApp(text);

          if (app) {
            window.HalDo.openApp(app.id);

            return `${app.name} wird geöffnet.`;
          }
        }

        if (
          lower.includes("hallo") ||
          lower.includes("hi") ||
          lower.includes("hey")
        ) {
          return "Hallo ❤️💙 Schön, dass du da bist. Ich bin HalDo AI und bereit.";
        }

        if (
          lower.includes("wer bist du")
        ) {
          return "Ich bin HalDo AI, der intelligente Assistent von HalDo AI OS 20.";
        }

        if (
          lower.includes("danke")
        ) {
          return "Sehr gerne, Bruder. ❤️💙🚀";
        }

        if (
          lower.includes("hilfe")
        ) {
          return [
            "Natürlich.",
            "",
            "Du kannst mich zum Beispiel bitten:",
            "• Apps zu öffnen",
            "• Einstellungen zu ändern",
            "• Texte zu schreiben",
            "• Informationen zu erklären",
            "• mit dir zu sprechen",
            "• Sprache und Tastatur zu wechseln"
          ].join("\n");
        }

        return [
          "Ich habe deine Nachricht verstanden:",
          "",
          `„${text}“`,
          "",
          "Meine vollständige AI-Engine wird über die HalDo AI Runtime angebunden."
        ].join("\n");
      },

      detectApp(text) {
        const normalized =
          text.toLowerCase();

        for (const app of window.HalDo.apps.values()) {
          if (
            normalized.includes(
              app.name.toLowerCase()
            ) ||
            normalized.includes(app.id.toLowerCase())
          ) {
            return app;
          }
        }

        const aliases = {
          kalender: "calendar",
          dateien: "file-manager",
          dateimanager: "file-manager",
          einstellungen: "settings",
          tastatur: "ezidi-keyboard",
          sprache: "language",
          wetter: "weather",
          musik: "music",
          galerie: "gallery",
          notizen: "notes",
          aufgaben: "tasks",
          rechner: "calculator"
        };

        for (const [alias, id] of Object.entries(aliases)) {
          if (normalized.includes(alias)) {
            return window.HalDo.apps.get(id);
          }
        }

        return null;
      }

          "js/haldo-v20-integration.js",
          "js/kernel.js",
          "js/system.js",
          "js/storage.js",
          "js/storage-manager.js",
          "js/language-system.js",
          "js/language-manager.js",
          "js/ai-core.js",
          "js/ai-engine.js",
          "js/ai-memory.js",
          "js/ai-chat.js",
          "js/ai-language.js",
          "js/ai-speech.js",
          "js/ai-voice.js",
          "js/app-registry.js",
          "js/app-manager.js",
          "js/app-router.js",
          "js/window-manager.js"
        ];

        for (const src of modules) {
          try {
            await window.HalDo.loadModule(src);
          } catch {}
        }

        window.HalDo.connectExistingSystems();
        window.HalDo.registerExternalRuntime();

        window.HalDo.setRuntimeStatus(
          window.HalDo.runtimeConnections > 0
            ? "HalDo Runtime verbunden"
            : "HalDo Shell aktiv"
        );
      };

    /*
     * Service Worker
     */
    if (
      "serviceWorker" in navigator
    ) {
      window.addEventListener(
        "load",
        () => {
          navigator.serviceWorker
            .register(
              "service-worker.js"
            )
            .catch(() => {});
        }
      );
    }

    /*
     * Start
     *
     * Die bestehende Projekt-Runtime kann vor dieser
     * Shell bereits geladen worden sein. Deshalb wird
     * nicht blind eine zweite Runtime erzeugt.
     */
    window.addEventListener(
      "DOMContentLoaded",
      async () => {

        await window.HalDo.startExistingModules();

        await window.HalDo.boot();
      }
    );

    /*
     * Debug / Entwicklerzugriff
     *
     * window.HalDo.system.getInfo()
     * window.HalDo.system.listApps()
     * window.HalDo.system.launch("calendar")
     */
    window.addEventListener(
      "error",
      event => {
        console.error(
          "[HalDo OS Error]",
          event.error || event.message
        );
      }
    );

    window.addEventListener(
      "unhandledrejection",
      event => {
        console.error(
          "[HalDo OS Promise Error]",
          event.reason
        );
      }
    );
  </script>

</body>
</html>
