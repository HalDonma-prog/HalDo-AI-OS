<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HalDo OS 24 — Ultimate</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
        /* ================================================================
           HALDO OS 24 — ULTIMATE EDITION
           ALLES IN EINER DATEI — PROFESSIONELL & LEBENDIG
           Version 24.0.0 — Build 2025.08.30
           ================================================================ */

        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a1a;
            --surface: rgba(16, 16, 40, 0.92);
            --text: #e0e0ff;
            --primary: #00d4ff;
            --secondary: #7b2ffc;
            --radius: 14px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== BOOT ===== */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.5s ease;
            padding: 20px;
        }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo {
            font-size: clamp(3rem, 12vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 60px rgba(123, 47, 252, 0.5));
            }
        }
        #boot-logo img {
            width: clamp(100px, 20vw, 160px);
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.3);
            animation: pulseGlow 2s infinite alternate;
        }
        #boot-status {
            margin-top: 16px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COSMIC CANVAS ===== */
        #cosmic {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ===== DISPLAY ===== */
        #display {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* ===== TOPBAR ===== */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            min-height: 40px;
            flex-shrink: 0;
        }
        #topbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #topbar-left .haldo-icon {
            font-weight: 700;
            color: var(--primary);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #topbar-left .haldo-icon img {
            width: clamp(28px, 5vw, 36px);
            height: clamp(28px, 5vw, 36px);
            border-radius: 50%;
            border: 2px solid var(--primary);
        }
        #topbar-right {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            touch-action: manipulation;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== APP CONTAINER ===== */
        #app-container {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow: hidden;
            touch-action: none;
        }

        /* ===== WINDOW ===== */
        .window {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 200px;
            min-height: 150px;
            max-width: 98vw;
            max-height: 90vh;
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.15);
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            cursor: grab;
            flex-shrink: 0;
            min-height: 36px;
            touch-action: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .win-btn {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            padding: 2px 8px;
            border-radius: 6px;
            touch-action: manipulation;
            min-width: 28px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .win-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        .win-btn.close:active {
            background: #ff4444;
            color: #fff;
        }
        .window-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }
        .window-body input,
        .window-body textarea,
        .window-body select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            margin-bottom: 8px;
            -webkit-appearance: none;
            appearance: none;
        }
        .window-body button {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            cursor: pointer;
            touch-action: manipulation;
            min-height: 38px;
        }
        .window-body button:active {
            transform: scale(0.95);
        }
        .window-body .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 6px;
        }
        .window-body .app-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .window-body .app-item:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }
        .window-body .app-item .icon {
            font-size: 1.8rem;
        }
        .window-body .app-item .name {
            font-size: 0.6rem;
            margin-top: 4px;
            color: #8899bb;
        }

        /* ===== DOCK ===== */
        #dock {
            position: absolute;
            bottom: clamp(8px, 2vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: clamp(4px, 1vw, 8px);
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: nowrap;
            max-width: 98vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .dock-item {
            width: clamp(40px, 9vw, 48px);
            height: clamp(40px, 9vw, 48px);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3.5vw, 1.4rem);
            cursor: pointer;
            border: none;
            color: #fff;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .dock-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        /* ===== NOTIFICATION ===== */
        #notification {
            position: fixed;
            top: clamp(50px, 10vh, 70px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 12px 24px;
            max-width: 90%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            display: none;
            border-left: 4px solid var(--primary);
        }
        #notification.show {
            display: block;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ===== ZWEI MENÜS (Links & Rechts) ===== */
        #menu-left {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 6px;
            border-radius: 0 14px 14px 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-left: none;
        }
        #menu-right {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 6px;
            border-radius: 14px 0 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-right: none;
        }
        .menu-item {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            transition: 0.2s;
            border: none;
            color: #fff;
            flex-direction: column;
            gap: 1px;
        }
        .menu-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }
        .menu-item .label {
            font-size: 0.45rem;
            color: #8899bb;
        }
        .menu-item img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        /* ===== SCROLLBAR ===== */
        .window-body::-webkit-scrollbar {
            width: 4px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .window {
                border-radius: 12px;
                min-width: 160px;
                min-height: 120px;
            }
            .window-header {
                padding: 6px 10px;
                min-height: 32px;
            }
            .window-body {
                padding: 10px;
            }
            #topbar {
                padding: 4px 10px;
                min-height: 34px;
            }
            .win-btn {
                min-width: 24px;
                min-height: 24px;
                padding: 2px 6px;
            }
            .dock-item {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            #dock {
                padding: 6px 10px;
                gap: 4px;
            }
            .menu-item {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
            #menu-left,
            #menu-right {
                padding: 6px 4px;
                gap: 4px;
            }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .window {
                max-height: 80vh;
            }
            #dock {
                bottom: 4px;
                padding: 4px 10px;
                gap: 4px;
            }
            .dock-item {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
                border-radius: 10px;
            }
            #topbar {
                min-height: 28px;
                padding: 2px 10px;
            }
            .window-header {
                min-height: 28px;
                padding: 4px 10px;
            }
            .window-body {
                padding: 8px;
            }
            .menu-item {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            #menu-left,
            #menu-right {
                padding: 4px 3px;
                gap: 3px;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        //  HALDO OS 24 — ULTIMATE EDITION
        //  ALLES IN EINER DATEI — PROFESSIONELL, LEBENDIG, KOMPLETT
        //  Version 24.0.0 — Build 2025.08.30
        // ================================================================

        (function() {
            'use strict';

            // ============================================================
            //  KONFIGURATION
            // ============================================================
            var CONFIG = {
                version: '24.0.0',
                kernel: '5.3.0',
                apiKey: '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',
                apiUrl: 'https://api.groq.com/openai/v1/chat/completions',
                model: 'llama3-70b-8192',
                language: 'de',
                languages: ['de', 'en', 'ku', 'ezidi']
            };

            // ============================================================
            //  STATE
            // ============================================================
            var state = {
                apps: {},
                windows: [],
                windowZIndex: 100,
                activeWindow: null,
                settings: {
                    theme: 'cosmic',
                    language: 'de',
                    voiceEnabled: true,
                    notifications: true
                },
                system: {
                    started: Date.now(),
                    uptime: 0,
                    version: CONFIG.version,
                    kernel: CONFIG.kernel
                },
                notes: JSON.parse(localStorage.getItem('haldo_notes') || '[]'),
                contacts: [],
                mail: { inbox: [], sent: [] },
                aiMemory: [],
                isBooted: false
            };

            // ============================================================
            //  DOM
            // ============================================================
            var $ = function(id) { return document.getElementById(id); };
            var boot = $('boot');
            var bootStatus = $('boot-status');
            var cosmicCanvas = $('cosmic');
            var appContainer = $('app-container');
            var dock = $('dock');
            var notification = $('notification');
            var clockDisplay = $('clock-display');

            // ============================================================
            //  NOTIFICATION
            // ============================================================
            function notify(text, type) {
                type = type || 'info';
                notification.textContent = text;
                notification.style.borderLeftColor = type === 'error' ? '#ff4444' : type === 'success' ? '#44ff88' :
                    '#00d4ff';
                notification.classList.add('show');
                clearTimeout(notification._timeout);
                notification._timeout = setTimeout(function() {
                    notification.classList.remove('show');
                }, 3000);
                console.log('[HalDo]', text);
            }

            // ============================================================
            //  AI ENGINE — Groq API
            // ============================================================
            var aiEngine = {
                ask: function(question, language) {
                    language = language || 'de';
                    return new Promise(function(resolve, reject) {
                        fetch(CONFIG.apiUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + CONFIG.apiKey
                            },
                            body: JSON.stringify({
                                model: CONFIG.model,
                                messages: [
                                    { role: 'system',
                                        content: 'Du bist HalDo, ein intelligenter Assistent. Du bist wie ein Professor, Doktor und Philosoph. Du antwortest auf ' +
                                        language +
                                        '. Du hilfst bei Wissenschaft, Geschichte, Kultur, Technik, Philosophie, und allen anderen Themen. Du bist freundlich, hilfsbereit und präzise. Du unterstützt auch Êzîdî, Kurdisch und andere Minderheiten-Sprachen. Du kannst Apps öffnen, wenn der Benutzer sagt: "Öffne [App-Name]". Du kannst Texte schreiben, korrigieren, formulieren und zusammenfassen.'
                                        },
                                    { role: 'user', content: question }
                                ],
                                temperature: 0.7,
                                max_tokens: 800
                            })
                        }).then(function(response) {
                            if (!response.ok) {
                                return response.text().then(function(err) {
                                    reject(new Error('API-Fehler: ' + response.status + ' - ' +
                                    err));
                                });
                            }
                            return response.json();
                        }).then(function(data) {
                            resolve(data.choices[0].message.content);
                        }).catch(function(error) {
                            reject(error);
                        });
                    });
                },

                handleCommand: function(text) {
                    var lower = text.toLowerCase();
                    var commands = {
                        'mail': ['mail', 'e-mail', 'email', 'post'],
                        'messages': ['chat', 'nachricht', 'message'],
                        'contacts': ['kontakte', 'adressbuch', 'contacts'],
                        'settings': ['einstellungen', 'settings', 'optionen'],
                        'files': ['dateien', 'files', 'ordner'],
                        'notes': ['notizen', 'notes', 'zettel'],
                        'calendar': ['kalender', 'calendar', 'termin'],
                        'music': ['musik', 'music', 'lieder'],
                        'terminal': ['terminal', 'konsole', 'command'],
                        'cosmic': ['cosmic', 'weltraum', 'space'],
                        'appworld': ['app world', 'apps', 'anwendungen']
                    };

                    for (var appId in commands) {
                        for (var i = 0; i < commands[appId].length; i++) {
                            if (lower.includes('öffne ' + commands[appId][i]) ||
                                lower.includes('starte ' + commands[appId][i]) ||
                                lower.includes('zeige ' + commands[appId][i])) {
                                return { command: 'open', app: appId };
                            }
                        }
                    }
                    return null;
                }
            };

            // ============================================================
            //  VOICE — Sprachausgabe & -eingabe
            // ============================================================
            var voice = {
                isListening: false,
                isSpeaking: false,
                recognition: null,
                synthesis: window.speechSynthesis,

                init: function() {
                    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                        this.recognition = new SpeechRecognition();
                        this.recognition.lang = 'de-DE';
                        this.recognition.continuous = false;
                        this.recognition.interimResults = false;
                        this.recognition.onresult = this.onResult.bind(this);
                        this.recognition.onerror = this.onError.bind(this);
                        this.recognition.onend = this.onEnd.bind(this);
                        console.log('[Voice] Speech Recognition bereit');
                    } else {
                        console.log('[Voice] Speech Recognition nicht unterstützt');
                    }

                    // Mikrofon-Berechtigung anfragen
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        navigator.mediaDevices.getUserMedia({ audio: true })
                            .then(function(stream) {
                                stream.getTracks().forEach(function(track) { track.stop(); });
                                console.log('[Voice] Mikrofon-Zugriff gewährt');
                            })
                            .catch(function() {
                                console.log('[Voice] Mikrofon-Zugriff verweigert');
                                notify('⚠️ Mikrofon-Zugriff verweigert. Bitte erlaube in den Einstellungen.',
                                    'warning');
                            });
                    }
                },

                startListening: function() {
                    if (!this.recognition) {
                        notify('❌ Sprachsteuerung nicht unterstützt', 'error');
                        return;
                    }
                    if (this.isListening) {
                        this.recognition.stop();
                        return;
                    }
                    try {
                        this.recognition.start();
                        this.isListening = true;
                        notify('🎤 Höre zu ...', 'info');
                        this.updateAIStatus('listening', '🎤 hört zu ...');
                    } catch (e) {
                        console.log('[Voice] Fehler:', e);
                        notify('❌ Mikrofon konnte nicht gestartet werden', 'error');
                    }
                },

                onResult: function(event) {
                    var text = event.results[0][0].transcript;
                    console.log('[Voice] Verstanden:', text);
                    this.isListening = false;
                    notify('🎤 "' + text + '"', 'success');
                    this.updateAIStatus('thinking', '🧠 denkt ...');

                    var cmd = aiEngine.handleCommand(text);
                    if (cmd && cmd.command === 'open') {
                        if (state.apps[cmd.app]) {
                            launchApp(cmd.app);
                            notify('✅ ' + state.apps[cmd.app].title + ' geöffnet!', 'success');
                            this.updateAIStatus('idle', '● bereit');
                            return;
                        }
                    }

                    var input = document.getElementById('ai-input');
                    if (input) {
                        input.value = text;
                        var sendBtn = document.getElementById('ai-send');
                        if (sendBtn) sendBtn.click();
                    }
                },

                onError: function(event) {
                    console.log('[Voice] Fehler:', event.error);
                    this.isListening = false;
                    this.updateAIStatus('idle', '● bereit');
                    if (event.error === 'not-allowed') {
                        notify('❌ Mikrofon-Zugriff verweigert. Bitte erlaube in den Einstellungen.', 'error');
                    }
                },

                onEnd: function() {
                    this.isListening = false;
                    this.updateAIStatus('idle', '● bereit');
                },

                speak: function(text, language) {
                    language = language || 'de-DE';
                    if (!('speechSynthesis' in window)) return;
                    if (this.isSpeaking) this.synthesis.cancel();
                    this.isSpeaking = true;
                    this.updateAIStatus('speaking', '🔊 spricht ...');
                    var utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = language;
                    utterance.rate = 0.9;
                    utterance.pitch = 1.0;
                    utterance.volume = 1;
                    utterance.onend = function() {
                        this.isSpeaking = false;
                        this.updateAIStatus('idle', '● bereit');
                    }.bind(this);
                    utterance.onerror = function() {
                        this.isSpeaking = false;
                        this.updateAIStatus('idle', '● bereit');
                    }.bind(this);
                    this.synthesis.speak(utterance);
                },

                updateAIStatus: function(state, text) {
                    var statusDot = document.getElementById('ai-status-dot');
                    var statusText = document.getElementById('ai-status-text');
                    var aiState = document.getElementById('ai-state');
                    if (statusDot) {
                        statusDot.className = '';
                        if (state === 'thinking') statusDot.classList.add('thinking');
                        else if (state === 'listening') statusDot.classList.add('listening');
                        else if (state === 'speaking') statusDot.classList.add('speaking');
                    }
                    if (statusText) statusText.textContent = text || '● bereit';
                    if (aiState) {
                        aiState.textContent = text || '● bereit';
                        aiState.style.color = state === 'thinking' ? '#ffcc00' : state === 'listening' ?
                            '#44aaff' : state === 'speaking' ? '#44ff88' : '#44ff88';
                    }
                }
            };

            // ============================================================
            //  WINDOW MANAGER
            // ============================================================
            function getSafePosition() {
                var vw = window.innerWidth,
                    vh = window.innerHeight;
                var w = Math.min(500, vw - 40);
                var h = Math.min(380, vh - 160);
                return { x: Math.max(10, (vw - w) / 2), y: Math.max(40, (vh - h) / 2 - 20), w: w, h: h };
            }

            function launchApp(id) {
                var app = state.apps[id];
                if (!app) { notify('❌ App "' + id + '" nicht gefunden', 'error'); return; }

                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].appId === id) {
                        focusWindow(state.windows[i].id);
                        return;
                    }
                }

                var pos = getSafePosition();
                var winId = 'win-' + Date.now();
                var win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x + Math.random() * 30,
                    y: pos.y + Math.random() * 30,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null
                };

                state.windows.push(win);
                renderWindow(win);
                focusWindow(winId);
                if (app.render) { app.render(win.element.querySelector('.window-body'), win); }
                notify('🔄 ' + (app.title || id) + ' geöffnet');
                return win;
            }

            function renderWindow(win) {
                var existing = document.getElementById(win.id);
                if (existing) existing.remove();

                var el = document.createElement('div');
                el.id = win.id;
                el.className = 'window';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;

                el.innerHTML =
                    '<div class="window-header"><span class="window-title">' + win.icon + ' ' + win.title +
                    '</span><div class="window-controls"><button class="win-btn" data-action="minimize">─</button><button class="win-btn" data-action="maximize">⧉</button><button class="win-btn close" data-action="close">✕</button></div></div><div class="window-body"></div>';

                appContainer.appendChild(el);
                win.element = el;

                var btns = el.querySelectorAll('.win-btn');
                for (var i = 0; i < btns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var action = btn.dataset.action;
                            if (action === 'close') closeWindow(win.id);
                            else if (action === 'minimize') minimizeWindow(win.id);
                            else if (action === 'maximize') maximizeWindow(win.id);
                        });
                    })(btns[i]);
                }

                var header = el.querySelector('.window-header');
                var drag = false,
                    startX, startY, origX, origY, isTouch = false;

                function startDrag(cx, cy) {
                    if (header.querySelector('.win-btn') && document.activeElement && document.activeElement.tagName ===
                        'BUTTON') return;
                    drag = true;
                    startX = cx;
                    startY = cy;
                    origX = win.x;
                    origY = win.y;
                    focusWindow(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(cx, cy) {
                    if (!drag) return;
                    var dx = cx - startX,
                        dy = cy - startY;
                    win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
                    win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() { if (drag) { drag = false;
                        el.style.cursor = ''; } }

                header.addEventListener('mousedown', function(e) { if (!e.target.closest('.win-btn')) startDrag(e.clientX, e
                        .clientY); });
                document.addEventListener('mousemove', function(e) { if (drag) moveDrag(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    if (!e.target.closest('.win-btn')) { isTouch = true;
                        startDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchmove', function(e) {
                    if (drag && isTouch) { var t = e.touches[0];
                        moveDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', function() { if (isTouch) { isTouch = false;
                        endDrag(); } }, { passive: true });

                var resizeHandle = document.createElement('div');
                resizeHandle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:24px;height:24px;cursor:se-resize;touch-action:none;';
                el.appendChild(resizeHandle);

                var resize = false,
                    startW, startH, startX2, startY2;

                function startResize(cx, cy) { resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = cx;
                    startY2 = cy; }

                function moveResize(cx, cy) {
                    if (!resize) return;
                    var dw = cx - startX2,
                        dh = cy - startY2;
                    win.width = Math.max(200, Math.min(window.innerWidth - win.x - 10, startW + dw));
                    win.height = Math.max(120, Math.min(window.innerHeight - win.y - 80, startH + dh));
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                resizeHandle.addEventListener('mousedown', function(e) { e.stopPropagation();
                    startResize(e.clientX, e.clientY); });
                document.addEventListener('mousemove', function(e) { if (resize) moveResize(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endResize);

                resizeHandle.addEventListener('touchstart', function(e) { var t = e.touches[0];
                    e.stopPropagation();
                    startResize(t.clientX, t.clientY); }, { passive: true });
                document.addEventListener('touchmove', function(e) { if (resize) { var t = e.touches[0];
                        moveResize(t.clientX, t.clientY); } }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            }

            function closeWindow(winId) {
                var idx = -1;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { idx = i; break; }
                }
                if (idx === -1) return;
                var win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) focusWindow(state.windows[state.windows.length - 1].id);
            }

            function focusWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    for (var j = 0; j < state.windows.length; j++) {
                        if (state.windows[j].id !== winId && state.windows[j].element) {
                            state.windows[j].element.classList.remove('active');
                        }
                    }
                }
            }

            function minimizeWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (win && win.element) { win.element.style.display = 'none';
                    notify('⏬ ' + win.title + ' minimiert'); }
            }

            function maximizeWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (!win || !win.element) return;
                if (win.width === window.innerWidth - 20) {
                    win.width = win._prevWidth || 500;
                    win.height = win._prevHeight || 380;
                    win.x = win._prevX || 20;
                    win.y = win._prevY || 40;
                } else {
                    win._prevWidth = win.width;
                    win._prevHeight = win.height;
                    win._prevX = win.x;
                    win._prevY = win.y;
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            }

            // ============================================================
            //  APP REGISTRATION
            // ============================================================
            function registerApp(id, config) {
                state.apps[id] = { id: id, title: config.title, icon: config.icon, render: config.render };
            }

            // ============================================================
            //  COSMIC WORLD — MIT 12 PLANETEN, STUNDE/MINUTE/SEKUNDE
            // ============================================================
            function initCosmic() {
                var ctx = cosmicCanvas.getContext('2d');
                var W, H;

                function resize() {
                    W = cosmicCanvas.width = window.innerWidth;
                    H = cosmicCanvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                // ===== STERNE (2500) =====
                var stars = [];
                for (var i = 0; i < 2500; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 2.5 + 0.3,
                        speed: Math.random() * 0.03 + 0.005,
                        bright: Math.random() * 0.8 + 0.2,
                        phase: Math.random() * Math.PI * 2,
                        color: 'hsl(' + (200 + Math.random() * 60) + ', 80%, ' + (60 + Math.random() * 40) + '%)'
                    });
                }

                // ===== SONNE =====
                var sun = {
                    x: W / 2,
                    y: H / 2,
                    radius: 55,
                    glow: 220,
                    phase: 0,
                    pulseSpeed: 0.008,
                    flares: 16
                };

                // ===== 12 PLANETEN (mit Stunde/Minute/Sekunde) =====
                var planetData = [
                    { name: 'Merkur', r: 8, color: '#aaaaaa', orbit: 80, speed: 0.03, role: 'second' },
                    { name: 'Venus', r: 12, color: '#ffaa44', orbit: 120, speed: 0.022, role: 'minute' },
                    { name: 'Erde', r: 14, color: '#4488ff', orbit: 170, speed: 0.015, role: 'hour' },
                    { name: 'Mars', r: 10, color: '#ff6644', orbit: 220, speed: 0.012 },
                    { name: 'Jupiter', r: 26, color: '#ddaa77', orbit: 280, speed: 0.008 },
                    { name: 'Saturn', r: 20, color: '#ddcc88', orbit: 350, speed: 0.006 },
                    { name: 'Uranus', r: 16, color: '#88ddff', orbit: 420, speed: 0.0045 },
                    { name: 'Neptun', r: 15, color: '#4466ff', orbit: 490, speed: 0.0035 },
                    { name: 'Pluto', r: 6, color: '#ccbb99', orbit: 560, speed: 0.0025 },
                    { name: 'HalDo-1', r: 11, color: '#ff88dd', orbit: 620, speed: 0.0018 },
                    { name: 'HalDo-2', r: 13, color: '#88ffaa', orbit: 680, speed: 0.0012 },
                    { name: 'HalDo-3', r: 9, color: '#ffaa88', orbit: 740, speed: 0.0008 }
                ];

                var planets = [];
                for (var p = 0; p < planetData.length; p++) {
                    var pd = planetData[p];
                    planets.push({
                        name: pd.name,
                        r: pd.r,
                        color: pd.color,
                        orbit: pd.orbit,
                        speed: pd.speed,
                        angle: Math.random() * Math.PI * 2,
                        cx: W / 2,
                        cy: H / 2,
                        role: pd.role || 'normal',
                        trail: []
                    });
                }

                // ===== MOND =====
                var moon = {
                    x: 0,
                    y: 0,
                    r: 6,
                    color: '#cccccc',
                    orbit: 30,
                    speed: 0.08,
                    angle: 0,
                    ex: 0,
                    ey: 0
                };

                // ===== STERNSCHNUPPEN =====
                var shootingStars = [];

                function createShootingStar() {
                    shootingStars.push({
                        x: Math.random() * W,
                        y: Math.random() * H * 0.5,
                        vx: (Math.random() - 0.5) * 8,
                        vy: Math.random() * 4 + 2,
                        life: 1,
                        maxLife: 0.5 + Math.random() * 0.5
                    });
                }
                setInterval(function() { if (Math.random() > 0.3) createShootingStar(); }, 30000 + Math.random() *
                30000);

                // ===== ANIMATION =====
                function animate() {
                    var time = Date.now() / 2000;
                    var now = new Date();
                    var seconds = now.getSeconds();
                    var minutes = now.getMinutes();
                    var hours = now.getHours() % 12;

                    ctx.clearRect(0, 0, W, H);

                    // === HINTERGRUND ===
                    var bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.9);
                    var hue1 = 220 + 20 * Math.sin(time * 0.1);
                    var hue2 = 240 + 30 * Math.sin(time * 0.07 + 1);
                    bgGrad.addColorStop(0, 'hsl(' + hue1 + ', 70%, 12%)');
                    bgGrad.addColorStop(0.5, 'hsl(' + hue2 + ', 60%, 8%)');
                    bgGrad.addColorStop(1, '#000005');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, W, H);

                    // === PLANETEN-TRAILS ===
                    for (var pt = 0; pt < planets.length; pt++) {
                        var pTrail = planets[pt];
                        if (pTrail.trail) {
                            for (var ti = 0; ti < pTrail.trail.length; ti++) {
                                var t2 = pTrail.trail[ti];
                                ctx.fillStyle = 'rgba(255,255,255,' + (t2.life * 0.04) + ')';
                                ctx.beginPath();
                                ctx.arc(t2.x, t2.y, 1.5, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    }

                    // === SONNE ===
                    sun.phase += sun.pulseSpeed;
                    var pulse = 1 + 0.06 * Math.sin(sun.phase);
                    var radius = sun.radius * pulse;

                    for (var g = 10; g > 0; g--) {
                        var grad = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * g * 0.12);
                        var alpha = 0.05 / g;
                        grad.addColorStop(0, 'rgba(255, 220, 68, ' + alpha + ')');
                        grad.addColorStop(1, 'rgba(255, 220, 68, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(sun.x, sun.y, sun.glow * g * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    var sunGrad = ctx.createRadialGradient(
                        sun.x - radius * 0.3, sun.y - radius * 0.3, 0,
                        sun.x, sun.y, radius
                    );
                    sunGrad.addColorStop(0, '#ffeeaa');
                    sunGrad.addColorStop(0.3, '#ffdd44');
                    sunGrad.addColorStop(0.6, '#ffaa00');
                    sunGrad.addColorStop(0.85, '#ff6600');
                    sunGrad.addColorStop(1, '#ff3300');
                    ctx.fillStyle = sunGrad;
                    ctx.shadowColor = '#ffdd44';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // HalDo Logo in der Sonne
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = 'bold ' + (radius * 0.5) + 'px system-ui, sans-serif';
                    ctx.shadowColor = 'rgba(255,255,255,0.5)';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('⟡', sun.x, sun.y - radius * 0.05);
                    ctx.shadowBlur = 0;

                    // Sonnenstrahlen
                    for (var fl = 0; fl < sun.flares; fl++) {
                        var fAngle = fl * (Math.PI / (sun.flares / 2)) + sun.phase * 0.3;
                        var len = radius * (1.5 + 0.5 * Math.sin(sun.phase * 0.7 + fl * 0.5));
                        ctx.strokeStyle = 'rgba(255, 220, 68, ' + (0.05 + 0.04 * Math.sin(sun.phase + fl)) + ')';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(sun.x + Math.cos(fAngle) * radius * 0.7, sun.y + Math.sin(fAngle) * radius * 0.7);
                        ctx.lineTo(sun.x + Math.cos(fAngle) * len, sun.y + Math.sin(fAngle) * len);
                        ctx.stroke();
                    }

                    // Sonnenflecken
                    for (var sf = 0; sf < 8; sf++) {
                        var spotAngle = sf * 1.1 + sun.phase * 0.4;
                        var spotR = radius * (0.2 + 0.15 * Math.sin(sun.phase * 0.6 + sf));
                        var spotX = sun.x + Math.cos(spotAngle) * radius * 0.45;
                        var spotY = sun.y + Math.sin(spotAngle) * radius * 0.45;
                        ctx.fillStyle = 'rgba(180, 80, 20, ' + (0.15 + 0.1 * Math.sin(sun.phase + sf)) + ')';
                        ctx.beginPath();
                        ctx.arc(spotX, spotY, spotR, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // === PLANETEN ===
                    for (var pp = 0; pp < planets.length; pp++) {
                        var pl = planets[pp];

                        // Uhrzeit-Rotation
                        if (pl.role === 'second') {
                            pl.angle = (seconds / 60) * Math.PI * 2;
                        } else if (pl.role === 'minute') {
                            pl.angle = (minutes / 60) * Math.PI * 2 + (seconds / 60) * (Math.PI * 2 / 60);
                        } else if (pl.role === 'hour') {
                            pl.angle = (hours / 12) * Math.PI * 2 + (minutes / 60) * (Math.PI * 2 / 12);
                        } else {
                            pl.angle += pl.speed;
                        }

                        var px = pl.cx + Math.cos(pl.angle) * pl.orbit;
                        var py = pl.cy + Math.sin(pl.angle) * pl.orbit;

                        // Trail für normale Planeten
                        if (pl.role === 'normal') {
                            if (!pl.trail) pl.trail = [];
                            pl.trail.push({ x: px, y: py, life: 1 });
                            if (pl.trail.length > 30) pl.trail.shift();
                            for (var ti2 = 0; ti2 < pl.trail.length; ti2++) {
                                pl.trail[ti2].life *= 0.98;
                            }
                        }

                        // Orbit
                        ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([3, 6]);
                        ctx.beginPath();
                        ctx.arc(pl.cx, pl.cy, pl.orbit, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Planet-Glow
                        var pGlow = ctx.createRadialGradient(px, py, 0, px, py, pl.r * 2.5);
                        pGlow.addColorStop(0, pl.color + '30');
                        pGlow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = pGlow;
                        ctx.beginPath();
                        ctx.arc(px, py, pl.r * 2.5, 0, Math.PI * 2);
                        ctx.fill();

                        // Planet
                        ctx.shadowColor = pl.color;
                        ctx.shadowBlur = 15;
                        ctx.fillStyle = pl.color;
                        ctx.beginPath();
                        ctx.arc(px, py, pl.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        // Saturn-Ring
                        if (pl.name === 'Saturn') {
                            ctx.strokeStyle = 'rgba(200, 180, 150, 0.3)';
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.ellipse(px, py, pl.r * 1.8, pl.r * 0.5, 0.3, 0, Math.PI * 2);
                            ctx.stroke();
                            ctx.strokeStyle = 'rgba(200, 180, 150, 0.15)';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.ellipse(px, py, pl.r * 2.2, pl.r * 0.7, -0.2, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        // Planeten-Name
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.font = '8px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText(pl.name, px, py + pl.r + 4);

                        // Rolle anzeigen
                        if (pl.role === 'second') {
                            ctx.fillStyle = 'rgba(255,200,100,0.3)';
                            ctx.font = '6px sans-serif';
                            ctx.fillText('⏱ Sekunde', px, py + pl.r + 18);
                        } else if (pl.role === 'minute') {
                            ctx.fillStyle = 'rgba(100,200,255,0.3)';
                            ctx.font = '6px sans-serif';
                            ctx.fillText('⏱ Minute', px, py + pl.r + 18);
                        } else if (pl.role === 'hour') {
                            ctx.fillStyle = 'rgba(255,100,100,0.3)';
                            ctx.font = '6px sans-serif';
                            ctx.fillText('⏱ Stunde', px, py + pl.r + 18);
                        }

                        // Erde speichern für Mond
                        if (pl.name === 'Erde') {
                            moon.ex = px;
                            moon.ey = py;
                        }
                    }

                    // === MOND ===
                    if (moon.ex !== undefined) {
                        moon.angle += moon.speed;
                        moon.x = moon.ex + Math.cos(moon.angle) * moon.orbit;
                        moon.y = moon.ey + Math.sin(moon.angle) * moon.orbit;

                        var mGlow = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.r * 2.5);
                        mGlow.addColorStop(0, 'rgba(200,200,200,0.15)');
                        mGlow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = mGlow;
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r * 2.5, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.shadowColor = '#cccccc';
                        ctx.shadowBlur = 10;
                        ctx.fillStyle = '#cccccc';
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        ctx.fillStyle = 'rgba(150,150,150,0.3)';
                        ctx.beginPath();
                        ctx.arc(moon.x - 2, moon.y - 2, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(moon.x + 3, moon.y + 1, 1, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = 'rgba(255,255,255,0.12)';
                        ctx.font = '6px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText('🌙 Mond', moon.x, moon.y + moon.r + 2);
                    }

                    // === STERNE ===
                    var time2 = Date.now() / 3000;
                    for (var st = 0; st < stars.length; st++) {
                        var s2 = stars[st];
                        s2.y += s2.speed;
                        if (s2.y > H) { s2.y = 0;
                            s2.x = Math.random() * W; }
                        var bright = s2.bright * (0.6 + 0.4 * Math.sin(time2 * 2 + s2.phase));
                        ctx.globalAlpha = bright;
                        ctx.fillStyle = s2.color;
                        ctx.beginPath();
                        ctx.arc(s2.x, s2.y, s2.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;

                    // === STERNSCHNUPPEN ===
                    for (var ss = shootingStars.length - 1; ss >= 0; ss--) {
                        var ss2 = shootingStars[ss];
                        ss2.x += ss2.vx;
                        ss2.y += ss2.vy;
                        ss2.life -= 0.008;
                        if (ss2.life <= 0 || ss2.x > W || ss2.y > H) {
                            shootingStars.splice(ss, 1);
                            continue;
                        }
                        ctx.fillStyle = 'rgba(255,255,255,' + (ss2.life * 0.3) + ')';
                        ctx.beginPath();
                        ctx.arc(ss2.x, ss2.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,' + (ss2.life * 0.15) + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(ss2.x, ss2.y);
                        ctx.lineTo(ss2.x - ss2.vx * 10, ss2.y - ss2.vy * 10);
                        ctx.stroke();
                    }

                    // === UHRZEIT ANZEIGE ===
                    var hh = String(now.getHours()).padStart(2, '0');
                    var mm2 = String(now.getMinutes()).padStart(2, '0');
                    var ss3 = String(now.getSeconds()).padStart(2, '0');
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.font = '12px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('🕐 ' + hh + ':' + mm2 + ':' + ss3, 16, H - 60);

                    // Legende
                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.font = '8px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('⏱ Sekunde · ⏱ Minute · ⏱ Stunde · 🌙 Mond · ☀️ Klicke die Sonne für HalDo AI', 16, H -
                        40);

                    requestAnimationFrame(animate);
                }

                        var resp = '';
                        var parts = cmd.trim().split(' ');

                        if (main === 'help') resp =
                            'help, version, apps, clear, echo, date, whoami, uptime, sysinfo, ezidi, planets, sun, mail, chat, contacts';
                        else if (main === 'version') resp = 'HalDo OS ' + CONFIG.version;

                        else if (main === 'clear') { output.innerHTML = ''; return; } else if (main === 'echo')

                        else if (main === 'date') resp = new Date().toLocaleString();
                        else if (main === 'whoami') resp = 'haldo@cosmic';
                        else if (main === 'uptime') resp = '⏱ ' + Math.floor((Date.now() - state.system

                        else if (main === 'sysinfo') resp = 'OS: HalDo OS ' + CONFIG.version + '\nKernel: ' +

                        else if (main === 'ezidi') resp =

                        else if (cmd === '') return;
                        else resp = '❌ Unbekannt: "' + cmd + '". Tipp: help';

                        var rl = document.createElement('div');
                        rl.style.color = '#8899bb';
                        rl.textContent = resp;
                        output.appendChild(rl);

                // Globale API
                window.HalDo = {
                    launchApp: launchApp,
                    notify: notify,
                    state: state,
                    CONFIG: CONFIG,
                    aiEngine: aiEngine,
                    voice: voice,
                    get apps() { return state.apps; }
                };

                // Boot starten
                bootSequence();

                console.log('⟡ HalDo OS ' + CONFIG.version + ' — Ultimate Edition');
                console.log('📱 ' + Object.keys(state.apps).length + ' Apps geladen');
                console.log('✅ Groq API-Key verbunden');
                console.log('☀️ Klicke auf die Sonne für HalDo AI');
                console.log('🌍 Sprachen: Deutsch, Englisch, Kurdisch, Êzîdî');
                console.log('🎤 Sprachbefehle: "Öffne Mail", "Öffne Chat", "Öffne Einstellungen"');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
