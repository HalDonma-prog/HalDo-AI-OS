HDA4.apps.calculator = {

    open() {

        const existing =
            HDA4.windowManager.get(
                "app-calculator"
            );

        if (existing) {

            HDA4.windowManager.focus(
                "app-calculator"
            );

            return existing;

        }

        const content = `

            <div
                class="haldo-app-page"
                style="
                    max-width:480px;
                    margin:auto;
                "
            >

                <h1
                    class="haldo-app-heading"
                >
                    Rechner
                </h1>

                <div
                    style="
                        padding:18px;
                        border-radius:18px;
                        background:
                            rgba(0,0,0,.25);
                        border:
                            1px solid
                            rgba(125,222,255,.10);
                        margin-bottom:12px;
                    "
                >

                    <input
                        id="calculator-display"
                        class="haldo-input"
                        readonly
                        value="0"
                        style="
                            font-size:28px;
                            text-align:right;
                            font-variant-numeric:
                                tabular-nums;
                        "
                    >

                </div>

                <div
                    id="calculator-buttons"
                    style="
                        display:grid;
                        grid-template-columns:
                            repeat(4,1fr);
                        gap:8px;
                    "
                >

                    ${[
                        "C",
                        "⌫",
                        "%",
                        "÷",
                        "7",
                        "8",
                        "9",
                        "×",
                        "4",
                        "5",
                        "6",
                        "-",
                        "1",
                        "2",
                        "3",
                        "+",
                        "0",
                        ".",
                        "="
                    ]
                    .map(
                        button => `

                            <button
                                type="button"
                                class="haldo-secondary"
                                data-calc="${button}"
                                style="
                                    min-height:54px;
                                    font-size:17px;
                                    ${
                                        button === "="
                                        ? "grid-column:span 2;"
                                        : ""
                                    }
                                "
                            >
                                ${button}
                            </button>

                        `
                    )
                    .join("")}

                </div>

            </div>

        `;

        const element =
            HDA4.apps.createWindow({
                id:"app-calculator",
                appId:"calculator",
                title:"Rechner",
                icon:"⌗",
                content,
                width:
                    "min(520px,calc(100vw - 50px))",
                height:
                    "min(650px,calc(100vh - 70px))"
            });

        const display =
            element.querySelector(
                "#calculator-display"
            );

        let expression = "";

        const safeCalculate =
            value => {

                if (
                    !/^[0-9+\-*/().%\s]+$/
                        .test(value)
                ) {

                    throw new Error(
                        "Ungültiger Ausdruck."
                    );

                }

                const normalized =
                    value
                        .replaceAll(
                            "×",
                            "*"
                        )
                        .replaceAll(
                            "÷",
                            "/"
                        );

                return Function(
                    `"use strict"; return (${normalized})`
                )();

            };

        element
            .querySelectorAll(
                "[data-calc]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const value =
                                button.dataset.calc;

                            if (
                                value === "C"
                            ) {

                                expression = "";
                                display.value = "0";
                                return;

                            }

                            if (
                                value === "⌫"
                            ) {

                                expression =
                                    expression.slice(
                                        0,
                                        -1
                                    );

                                display.value =
                                    expression ||
                                    "0";

                                return;

                            }

                            if (
                                value === "="
                            ) {

                                try {

                                    const result =
                                        safeCalculate(
                                            expression
                                        );

                                    expression =
                                        String(
                                            result
                                        );

                                    display.value =
                                        expression;

                                }
                                catch {

                                    expression = "";

                                    display.value =
                                        "Fehler";

                                }

                                return;

                            }

                            if (
                                value === "%"
                            ) {

                                expression +=
                                    "/100";

                            }
                            else {

                                expression +=
                                    value;

                            }

                            display.value =
                                expression;

                        }
                    );

                }
            );

        return element;

    }

};

    () => HDA4.apps.calculator.open()
);

            element.querySelector(

            );

                    }

                }
            );

/* ================================================================
   GLOBAL VOICE COMMAND
   ================================================================ */

HDA4.voiceCommand =
    HDA4.voiceCommand || {

        recognition:
            null,

        active:
            false,

        supported:
            false,

        init() {

            const Recognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!Recognition) {

                this.supported =
                    false;

                return false;

            }

            this.supported =
                true;

            this.recognition =
                new Recognition();

            this.recognition.continuous =
                false;

            this.recognition.interimResults =
                false;

            this.recognition.lang =
                HDA4.voice
                    .languageToVoiceLanguage(
                        HDA4.language.get()
                    );

            this.recognition.onstart =
                () => {

                    this.active =
                        true;

                    HDA4.emit(
                        "voice-command:start"
                    );

                };

            this.recognition.onend =
                () => {

                    this.active =
                        false;

                    HDA4.emit(
                        "voice-command:end"
                    );

                };

            this.recognition.onerror =
                error => {

                    this.active =
                        false;

                    HDA4.emit(
                        "voice-command:error",
                        error
                    );

                };

            this.recognition.onresult =
                event => {

                    const result =
                        event.results[
                            event.results.length - 1
                        ];

                    const text =
                        result[0].transcript
                            .trim();

                    HDA4.emit(
                        "voice-command",
                        {
                            text
                        }
                    );

                    this.execute(
                        text
                    );

                };

            return true;

        },

        start() {

            if (
                !this.supported
            ) {

                HDA4.notifications.show(
                    "Spracherkennung wird von diesem Browser nicht unterstützt.",
                    "warning"
                );

                return false;

            }

            try {

                this.recognition.lang =
                    HDA4.voice
                        .languageToVoiceLanguage(
                            HDA4.language.get()
                        );

                this.recognition.start();

                return true;

            }
            catch {

                return false;

            }

        },

        stop() {

            try {

                this.recognition?.stop();

            }
            catch {}

        },

        execute(
            text
        ) {

            const value =
                String(
                    text
                )
                .toLowerCase();

            if (
                value.includes("haldo ai")
            ) {

                HDA4.appManager.open(
                    "ai"
                );

                return;

            }

            if (
                value.includes("kalender")
            ) {

                HDA4.appManager.open(
                    "calendar"
                );

                return;

            }

            if (
                value.includes("notiz")
            ) {

                HDA4.appManager.open(
                    "notes"
                );

                return;

            }

            if (
                value.includes("aufgabe")
            ) {

                HDA4.appManager.open(
                    "tasks"
                );

                return;

            }

            if (
                value.includes("einstellung")
            ) {

                HDA4.appManager.open(
                    "settings"
                );

                return;

            }

            HDA4.appManager.open(
                "ai"
            );

            setTimeout(
                () => {

                    HDA4.emit(
                        "ai:voice-input",
                        {
                            text
                        }
                    );

                },
                100
            );

        }

    };

HDA4.voiceCommand.init();

/* ================================================================

HDA4.emit(

        ]
    }
);

</script>
<script>
/* ================================================================
   HALDO AI OS 20
   PART 5 / 8
   AI CORE + CHAT + MEMORY + NOTES + TASKS + CALENDAR
   ================================================================ */

"use strict";

const HDA5 = window.HalDo;

/* ================================================================
   AI MEMORY
   ================================================================ */

HDA5.aiMemory = HDA5.aiMemory || {

    key: "haldo-ai-memory",

    data:
        HDA5.storage.get(
            "haldo-ai-memory",
            {
                facts: [],
                preferences: [],
                conversations: []
            }
        ),

    save() {

        HDA5.storage.set(
            this.key,
            this.data
        );

    },

    add(type, value) {

        if (!this.data[type]) {
            this.data[type] = [];
        }

        if (!value) {
            return;
        }

        this.data[type].push({
            value: String(value),
            createdAt:
                new Date().toISOString()
        });

        if (
            this.data[type].length > 200
        ) {

            this.data[type] =
                this.data[type].slice(-200);

        }

        this.save();

        HDA5.emit(
            "ai:memory-added",
            {
                type,
                value
            }
        );

    },

    get(type) {

        return [
            ...(this.data[type] || [])
        ];

    },

    clear() {

        this.data = {
            facts: [],
            preferences: [],
            conversations: []
        };

        this.save();

        HDA5.emit(
            "ai:memory-cleared"
        );

    }

};

/* ================================================================
   AI CONVERSATION STORAGE
   ================================================================ */

HDA5.aiConversation =
    HDA5.aiConversation || {

        key:
            "haldo-ai-conversation",

        messages:
            HDA5.storage.get(
                "haldo-ai-conversation",
                []
            ),

        save() {

            HDA5.storage.set(
                this.key,
                this.messages
            );

        },

        add(
            role,
            content
        ) {

            this.messages.push({

                id:
                    HDA5.util?.id?.(
                        "msg"
                    ) ||
                    `msg-${Date.now()}-${Math.random()}`,

                role,

                content:
                    String(content),

                timestamp:
                    new Date()
                        .toISOString()

            });

            if (
                this.messages.length >
                300
            ) {

                this.messages =
                    this.messages.slice(-300);

            }

            this.save();

        },

        clear() {

            this.messages = [];

            this.save();

        },

        all() {

            return [
                ...this.messages
            ];

        }

    };

/* ================================================================
   AI CORE
   ================================================================ */

HDA5.aiCore = HDA5.aiCore || {

    status:
        "ready",

    name:
        "HalDo AI",

    version:
        "20.0.0",

    capabilities: [

        "conversation",
        "writing",
        "reasoning",
        "summarization",
        "translation",
        "planning",
        "system-control",
        "app-control",
        "memory",
        "voice"

    ],

    setStatus(
        status
    ) {

        this.status =
            status;

        HDA5.emit(
            "ai:status",
            {
                status
            }
        );

    },

    normalize(
        text
    ) {

        return String(
            text || ""
        )
        .trim();

    },

    detectIntent(
        text
    ) {

        const value =
            this.normalize(
                text
            ).toLowerCase();

        if (!value) {
            return "empty";
        }

        if (
            /^(hi|hallo|hey|hello|moin|guten)/i
                .test(value)
        ) {

            return "greeting";

        }

        if (
            value.includes(
                "wie geht"
            ) ||
            value.includes(
                "wie fühl"
            )
        ) {

            return "smalltalk";

        }

        if (
            value.includes(
                "kalender"
            ) ||
            value.includes(
                "termin"
            )
        ) {

            return "calendar";

        }

        if (
            value.includes(
                "notiz"
            ) ||
            value.includes(
                "notizen"
            )
        ) {

            return "notes";

        }

        if (
            value.includes(
                "aufgabe"
            ) ||
            value.includes(
                "todo"
            )
        ) {

            return "tasks";

        }

        if (
            value.includes(
                "einstellung"
            )
        ) {

            return "settings";

        }

        if (
            value.includes(
                "uhr"
            ) ||
            value.includes(
                "zeit"
            )
        ) {

            return "clock";

        }

        if (
            value.includes(
                "rechner"
            ) ||
            value.includes(
                "berechne"
            )
        ) {

            return "calculator";

        }

        if (
            value.startsWith(
                "übersetze"
            ) ||
            value.startsWith(
                "translate"
            )
        ) {

            return "translation";

        }

        if (
            value.includes(
                "schreib"
            ) ||
            value.includes(
                "formuliere"
            ) ||
            value.includes(
                "erstelle einen text"
            )
        ) {

            return "writing";

        }

        return "conversation";

    },

    localResponse(
        text
    ) {

        const intent =
            this.detectIntent(
                text
            );

        const language =
            HDA5.language
                ?.get?.() ||
            "de";

        if (
            intent === "empty"
        ) {

            return {
                text:
                    "Ich bin da. Schreib mir einfach, was du möchtest.",
                intent
            };

        }

        if (
            intent === "greeting"
        ) {

            const responses = {

                de:
                    "Hallo! ❤️ Ich bin HalDo AI. Schön, dass du da bist. Was möchtest du heute gemeinsam machen?",

                en:
                    "Hello! ❤️ I am HalDo AI. What would you like us to do today?",

                fr:
                    "Bonjour ! ❤️ Je suis HalDo AI. Que souhaitez-vous faire aujourd'hui ?"

            };

            return {
                text:
                    responses[language] ||
                    responses.de,

                intent
            };

        }

        if (
            intent === "smalltalk"
        ) {

            return {

                text:
                    "Danke, dass du fragst. Ich bin bereit und aufmerksam. Erzähl mir, was gerade wichtig für dich ist.",

                intent

            };

        }

        if (
            intent === "calendar"
        ) {

            return {

                text:
                    "Ich kann deinen HalDo-Kalender öffnen und Termine verwalten.",

                intent,

                action:
                    "calendar"

            };

        }

        if (
            intent === "notes"
        ) {

            return {

                text:
                    "Ich kann deine Notizen öffnen, erstellen und speichern.",

                intent,

                action:
                    "notes"

            };

        }

        if (
            intent === "tasks"
        ) {

            return {

                text:
                    "Ich kann deine Aufgabenverwaltung öffnen und Aufgaben speichern.",

                intent,

                action:
                    "tasks"

            };

        }

        if (
            intent === "settings"
        ) {

            return {

                text:
                    "Ich öffne die HalDo-Einstellungen für dich.",

                intent,

                action:
                    "settings"

            };

        }

        if (
            intent === "clock"
        ) {

            return {

                text:
                    `Die aktuelle Zeit ist ${new Date().toLocaleTimeString()}.`,

                intent,

                action:
                    "clock"

            };

        }

        if (
            intent === "calculator"
        ) {

            return {

                text:
                    "Der HalDo-Rechner steht bereit.",

                intent,

                action:
                    "calculator"

            };

        }

        if (
            intent === "writing"
        ) {

            return {

                text:
                    "Natürlich. Sag mir Thema, Stil und Länge. Ich kann daraus einen strukturierten Text erstellen.",

                intent

            };

        }

        if (
            intent === "translation"
        ) {

            return {

                text:
                    "Gerne. Schreibe den Text und nenne mir die gewünschte Zielsprache.",

                intent

            };

        }

        return {

            text:
                "Ich habe deine Nachricht verstanden. Die lokale HalDo-AI-Schicht ist aktiv. Für Antworten, die echtes externes Wissen oder komplexe KI-Inferenz benötigen, kann später ein AI-Service angebunden werden.",

            intent

        };

    },

    async ask(
        text,
        options = {}
    ) {

        const input =
            this.normalize(
                text
            );

        if (!input) {

            return this.localResponse(
                ""
            );

        }

        this.setStatus(
            "thinking"
        );

        HDA5.aiConversation.add(
            "user",
            input
        );

        const response =
            this.localResponse(
                input
            );

        if (
            response.action
        ) {

            setTimeout(
                () => {

                    try {

                        HDA5.appManager.open(
                            response.action
                        );

                    }
                    catch {}

                },
                180
            );

        }

        HDA5.aiConversation.add(
            "assistant",
            response.text
        );

        this.setStatus(
            "ready"
        );

        HDA5.emit(
            "ai:response",
            response
        );

        return response;

    }

};

/* ================================================================
   AI CHAT APP

HDA5.apps.ai = {

        if (existing) {

            return existing;

        }

        const messages =

        const content = `

                    display:flex;
                    flex-direction:column;
                "
            >

                <div
                    style="
                        padding:15px 18px;

                            1px solid

                        justify-content:space-between;
                        gap:12px;
                    "
                >

                    <div>

                        <div
                            style="
                                font-size:17px;
                                font-weight:800;
                            "
                        >
                            ✦ HalDo AI
                        </div>

                        <div
                            id="haldo-ai-status"
                            style="
                                margin-top:3px;
                                font-size:11px;

                            "
                        >
                            ● Bereit
                        </div>

                    </div>

                    <div
                        style="
                            display:flex;
                            gap:7px;
                        "
                    >

                        <button
                            id="haldo-ai-voice"

                            title="Spracheingabe"
                        >
                            🎤
                        </button>

                        <button
                            id="haldo-ai-speak"

                            title="Letzte Antwort vorlesen"
                        >
                            🔊
                        </button>

                        <button
                            id="haldo-ai-clear"
                            class="haldo-secondary"
                            type="button"
                        >
                            Neu
                        </button>

                    </div>

                </div>

                <div
                    id="haldo-ai-messages"
                    style="
                        flex:1;
                        min-height:0;
                        overflow:auto;
                        padding:20px;
                        display:flex;
                        flex-direction:column;
                        gap:12px;
                    "
                >

                    ${
                        messages.length
                        ? messages
                            .map(
                                message =>
                                    this.messageHTML(
                                        message
                                    )
                            )
                            .join("")
                        : `
                            <div
                                data-ai-welcome
                                style="
                                    margin:auto;
                                    text-align:center;
                                    max-width:520px;
                                "
                            >

                                <div
                                    style="
                                        font-size:58px;
                                        margin-bottom:15px;
                                    "
                                >
                                    ✦
                                </div>

                                <h2
                                    style="
                                        margin:0 0 8px;
                                    "
                                >
                                    Hallo, ich bin HalDo AI
                                </h2>

                                <p
                                    style="
                                        color:#8199aa;
                                        line-height:1.6;
                                    "
                                >
                                    Deine zentrale KI-Schnittstelle
                                    im HalDo AI OS.
                                </p>

                            </div>
                        `
                    }

                </div>

                <div
                    style="
                        padding:12px;
                        border-top:
                            1px solid
                            rgba(125,222,255,.10);
                    "
                >

                    <div
                        style="
                            display:flex;
                            gap:8px;
                            align-items:flex-end;
                        "
                    >

                        <textarea
                            id="haldo-ai-input"
                            class="haldo-input"
                            rows="2"
                            placeholder="Schreibe HalDo AI..."
                            style="
                                flex:1;
                                resize:none;
                                min-height:48px;
                                max-height:150px;
                            "
                        ></textarea>

                        <button
                            id="haldo-ai-send"
                            class="haldo-primary"
                            type="button"
                            style="
                                min-width:78px;
                                min-height:48px;
                            "
                        >
                            Senden
                        </button>

                    </div>

                </div>

            </div>

        `;

        const element =
            HDA5.apps.createWindow({

                id:
                    "app-ai",

                appId:
                    "ai",

                title:
                    "HalDo AI",

                icon:
                    "✦",

                content,

                width:
                    "min(950px,calc(100vw - 30px))",

                height:
                    "min(780px,calc(100vh - 40px))"

            });

        const messagesEl =
            element.querySelector(
                "#haldo-ai-messages"
            );

        const input =
            element.querySelector(
                "#haldo-ai-input"
            );

        const send =
            element.querySelector(
                "#haldo-ai-send"
            );

        const status =
            element.querySelector(
                "#haldo-ai-status"
            );

        const renderMessage =
            message => {

                const welcome =
                    element.querySelector(
                        "[data-ai-welcome]"
                    );

                welcome?.remove();

                messagesEl.insertAdjacentHTML(
                    "beforeend",
                    this.messageHTML(
                        message
                    )
                );

                messagesEl.scrollTop =
                    messagesEl.scrollHeight;

            };

        const submit =
            async () => {

                const text =
                    input.value.trim();

                if (!text) {
                    return;
                }

                input.value =
                    "";

                renderMessage({

                    role:
                        "user",

                    content:
                        text

                });

                status.textContent =
                    "● Denkt nach...";

                status.style.color =
                    "#ffd36b";

                send.disabled =
                    true;

                try {

                    const response =
                        await HDA5.aiCore.ask(
                            text
                        );

                    renderMessage({

                        role:
                            "assistant",

                        content:
                            response.text

                    });

                    if (

                    ) {

                        HDA5.voice.speak(
                            response.text
                        );

                    }

                }
                catch (
                    error
                ) {

                    renderMessage({

                        role:
                            "assistant",

                        content:
                            "Entschuldigung. Bei der Verarbeitung ist ein Fehler aufgetreten."

                    });

                    console.error(
                        "HalDo AI:",
                        error
                    );

                }
                finally {

                    status.textContent =
                        "● Bereit";

                    status.style.color =
                        "#69f7b4";

                    send.disabled =
                        false;

                    input.focus();

                }

            };

        send.addEventListener(
            "click",
            submit
        );

        input.addEventListener(
            "keydown",
            event => {

                if (

                    !event.shiftKey
                ) {

                    event.preventDefault();

                    submit();

                }

            }
        );

        element
            .querySelector(
                "#haldo-ai-clear"
            )
            .addEventListener(
                "click",
                () => {

                    HDA5.aiConversation.clear();

                    messagesEl.innerHTML =
                        "";

                    messagesEl.insertAdjacentHTML(
                        "beforeend",
                        `
                        <div
                            style="
                                margin:auto;
                                text-align:center;
                                color:#8199aa;

                        `
                    );

            );

        element
            .querySelector(
                "#haldo-ai-speak"
            )
            .addEventListener(
                "click",

                    const last =
                        HDA5.aiConversation
                            .all()
                            .filter(
                                item =>
                                    item.role ===
                                    "assistant"
                            )
                            .pop();

                    if (last) {

                        HDA5.voice.speak(
                            last.content
                        );

                    }

                }
            );

        element
            .querySelector(
                "#haldo-ai-voice"
            )
            .addEventListener(
                "click",
                () => {

                    HDA5.voiceCommand.start();

                }
            );

        HDA5.on(
            "ai:voice-input",
            data => {

                if (
                    data?.text
                ) {

                    input.value =
                        data.text;

                    submit();

                }

            }
        );

        setTimeout(
            () => input.focus(),
            100
        );

        return element;

    },

    messageHTML(
        message
    ) {

        const user =
            message.role ===
            "user";

        return `

            <div
                style="
                    display:flex;
                    justify-content:
                        ${user ? "flex-end" : "flex-start"};
                "
            >

                <div
                    style="
                        max-width:78%;
                        padding:12px 15px;
                        border-radius:18px;
                        line-height:1.55;
                        white-space:pre-wrap;
                        background:
                            ${
                                user
                                ? "rgba(72,164,255,.20)"
                                : "rgba(255,255,255,.055)"
                            };
                        border:
                            1px solid
                            ${
                                user
                                ? "rgba(72,164,255,.22)"
                                : "rgba(255,255,255,.08)"
                            };
                    "
                >

                    ${
                        this.escape(
                            message.content
                        )
                    }

                </div>

            </div>

        `;

    },

    escape(
        value
    ) {

        return String(
            value
        )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        );

    }

};

    "ai",
    () => HDA5.apps.ai.open()
);

   NOTES APP
   ================================================================ */

    key:
        "haldo-notes",

    data:
        HDA5.storage.get(
            "haldo-notes",
            []
        ),

    save() {

        HDA5.storage.set(
            this.key,
            this.data
        );

    },

    create(
        title,
        content
    ) {

        const note = {

            id:
                `note-${Date.now()}-${Math.random()}`,

            title:
                title ||
                "Neue Notiz",

            content:
                content ||
                "",

            createdAt:
                new Date()
                    .toISOString(),

            updatedAt:
                new Date()
                    .toISOString()

        };

        this.data.unshift(
            note
        );

        this.save();

        HDA5.emit(
            "notes:created",
            note
        );

        return note;

    },

    update(
        id,
        patch
    ) {

        const note =
            this.data.find(
                item =>
                    item.id === id
            );

        if (!note) {
            return null;
        }

        Object.assign(
            note,
            patch,
            {
                updatedAt:
                    new Date()
                        .toISOString()
            }
        );

        this.save();

        HDA5.emit(
            "notes:updated",
            note
        );

        return note;

    },

    remove(
        id
    ) {

        this.data =
            this.data.filter(
                item =>
                    item.id !== id
            );

        this.save();

        HDA5.emit(
            "notes:deleted",
            {
                id
            }
        );

    }

};

                    item.id !== id
            );

        this.save();

    },

    get(

"use strict";

/* ================================================================
   UTILITY: SAFE HTML
   ================================================================ */

HDA7.util =
HDA7.util || {};

HDA7.util.escape =
    HDA7.util.escape ||
    function(value) {

        return String(
            value ?? ""
        )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    };

/* ================================================================
   CALCULATOR
   ================================================================ */

HDA7.calculator =
HDA7.calculator || {

    expression:
        "",

    calculate(
        expression
    ) {

        const cleaned =
            String(expression)
                .replace(
                    /[^0-9+\-*/().% ]/g,
                    ""
                );

        if (!cleaned.trim()) {
            return "";
        }

        try {

            /*
             * Mathematical expressions only.
             * No identifiers or arbitrary JavaScript
             * are accepted by the sanitizer above.
             */

            const result =
                Function(
                    `"use strict";return (${cleaned})`
                )();

            if (
                typeof result !== "number" ||
                !Number.isFinite(result)
            ) {

                return "Ungültiges Ergebnis";

            }

            return result;

        }
        catch {

            return "Fehler";

        }

    }

};

HDA7.apps.calculator = {

    open() {

        const existing =

        const buttons = [
            "C",
            "(",
            ")",
            "÷",
            "7",
            "8",
            "9",
            "×",
            "4",
            "5",

        ];

        const content = `

            <div

                    height:100%;

                            )

        const element =

            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const value =
                                button.dataset.calc;

                            if (
                                value === "C"
                            ) {

                                HDA7.calculator
                                    .expression =
                                    "";

                                display.value =
                                    "";

                                return;

                            }

                            if (
                                value === "="
                            ) {

                                const result =
                                    HDA7.calculator
                                        .calculate(
                                            HDA7.calculator
                                                .expression
                                        );

                                display.value =

                                HDA7.calculator
                                    .expression =

                                    .replace(

                                HDA7.calculator
                                    .expression;

                    );

                }
            );

    }

                height:

            });

            element.querySelector(
                "#browser-url"
            );

        const frame =
            element.querySelector(
                "#browser-frame"
            );

        const navigate =
            () => {

                let url =
                    input.value.trim();

                if (
                    !url
                ) {
                    return;
                }

                if (
                    !/^https?:\/\//i.test(
                        url
                    )
                ) {

                    url =
                        "https://" +
                        url;

                }

                try {

                    const parsed =
                        new URL(url);

                    if (
                        ![
                            "http:",
                            "https:"
                        ].includes(
                            parsed.protocol
                        )
                    ) {
                        return;
                    }

                    frame.src =
                        parsed.href;

                }
                catch {}

            };

        element
            .querySelector(
                "#browser-go"
            )
            .addEventListener(
                "click",
                navigate
            );

        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    navigate();

                }

            }
        );

        navigate();

        return element;

    }

HDA7.voice =
HDA7.voice || {

    recognition:
        null,

    listening:
        false,

    supported:
        Boolean(
            window.SpeechRecognition ||
            window.webkitSpeechRecognition
        ),

    start(
        callback
    ) {

        if (
            !this.supported
        ) {

            throw new Error(
                "Spracherkennung wird von diesem Browser nicht unterstützt."
            );

        }

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        const recognition =
            new Recognition();

        recognition.lang =
            HDA7.language?.current ||
            navigator.language ||
            "de-DE";

        recognition.interimResults =
            true;

        recognition.continuous =
            false;

        recognition.onstart =
            () => {

                this.listening =
                    true;

                HDA7.emit(
                    "voice:start"
                );

            };

        recognition.onresult =
            event => {

                let text =
                    "";

                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    text +=
                        event.results[i][0]
                            .transcript;

                }

                callback?.(
                    text,
                    event
                );

                HDA7.emit(
                    "voice:result",
                    {
                        text
                    }
                );

            };

        recognition.onerror =
            error => {

                HDA7.emit(
                    "voice:error",
                    error
                );

            };

        recognition.onend =
            () => {

                this.listening =
                    false;

                HDA7.emit(
                    "voice:end"
                );

            };

        this.recognition =
            recognition;

        recognition.start();

    },

    stop() {

        try {

            this.recognition?.stop();

        }
        catch {}

    }

};

HDA8.notifications =
HDA8.notifications || {

    items:
        HDA8.appData.get(
            "notifications",
            []
        ),

    add(
        title,
        message,
        type = "info"
    ) {

        const notification = {

            id:
                `notification-${Date.now()}-${Math.random()}`,

            title:
                String(title || "HalDo"),

            message:
                String(message || ""),

            type,

            created:
                new Date().toISOString(),

        };

        this.items.unshift(
            notification
        );

        this.items =
            this.items.slice(
                0,
                100
            );

        HDA8.appData.set(
            "notifications",
            this.items
        );

        HDA8.emit(
            "notification:new",
            notification
        );

        this.toast(
            notification
        );

        return notification;

    },

    markRead(
        id
    ) {

        const item =
            this.items.find(

                "notifications",
                this.items
            );

        }

    },

/* ================================================================
   HALDO AI RESPONSE ENGINE
   ================================================================ */

HDA8.ai.engine =
HDA8.ai.engine || {

    name:
        "HalDo AI",

    version:
        "20.0.0",

    async respond(
        message,
        context = {}
    ) {

        const text =
            String(
                message || ""
            ).trim();

        if (
            !text
        ) {

            return {

                text:
                    "Ich bin da. Erzähl mir, wobei ich dir helfen soll.",

                source:
                    "local"

            };

        }

        /*
         * First use the existing HalDo AI engine
         * when it is available.
         */

        const engines = [

            HDA8.aiEngine,
            HDA8.aiCore,
            HDA8.ai?.core,
            window.HalDoAI

        ];

        for (
            const engine of engines
        ) {

            if (
                !engine
            ) {
                continue;
            }

            try {

                if (
                    typeof engine.respond ===
                    "function"
                ) {

                    const result =
                        await engine.respond(
                            text,
                            context
                        );

                    if (
                        result
                    ) {

                        return {

                            text:
                                typeof result ===
                                "string"
                                    ? result
                                    : result.text ||
                                      result.message ||
                                      JSON.stringify(
                                          result
                                      ),

                            source:
                                "haldo-engine"

                        };

                    }

                }

                if (
                    typeof engine.chat ===
                    "function"
                ) {

                    const result =
                        await engine.chat(
                            text,
                            context
                        );

                    if (
                        result
                    ) {

                        return {

                            text:
                                typeof result ===
                                "string"
                                    ? result
                                    : result.text ||
                                      result.message ||
                                      JSON.stringify(
                                          result
                                      ),

                            source:
                                "haldo-engine"

                        };

                    }

                }

            }
            catch (
                error
            ) {

                HDA8.emit(
                    "ai:engine-error",
                    {
                        error
                    }
                );

            }

        }

        /*
         * Local fallback.
         *
         * This is deliberately honest:
         * without a connected AI model/API,
         * the browser cannot magically become
         * a full cloud LLM.
         */

        return {

            text:
                this.localResponse(
                    text
                ),

            source:
                "local-fallback"

        };

    },

    localResponse(
        text
    ) {

        const lower =
            text.toLocaleLowerCase(
                "de-DE"
            );

        if (
            /^(hi|hallo|hey|guten morgen|guten tag|guten abend)\b/
                .test(
                    lower
                )
        ) {

            return (
                "Hallo! ❤️ Ich bin HalDo AI. "
                +
                "Ich bin bereit. Was möchtest du gemeinsam machen?"
            );

        }

        if (
            lower.includes(
                "wer bist du"
            )
        ) {

            return (
                "Ich bin HalDo AI – die zentrale "
                +
                "Assistenzschicht von HalDo AI OS 20. "
                +
                "Ich kann mit den Systemdiensten, Apps, "
                +
                "Fenstern, Sprache und dem Speicher "
                +
                "zusammenarbeiten."
            );

        }

        if (
            lower.includes(
                "uhr"
            ) ||
            lower.includes(
                "zeit"
            )
        ) {

            return (
                "Es ist gerade " +
                new Date()
                    .toLocaleTimeString(
                        "de-DE"
                    ) +
                "."
            );

        }

        if (
            lower.includes(
                "datum"
            ) ||
            lower.includes(
                "welcher tag"
            )
        ) {

            return (
                "Heute ist " +
                new Date()
                    .toLocaleDateString(
                        "de-DE",
                        {
                            weekday:
                                "long",

                            day:
                                "numeric",

                            month:
                                "long",

                            year:
                                "numeric"

                        }
                    ) +
                "."
            );

        }

        if (
            lower.includes(
                "danke"
            )
        ) {

            return (
                "Sehr gerne. ❤️ "
                +
                "Ich bin weiterhin bei dir."
            );

        }

        if (
            lower.includes(
                "hilfe"
            )
        ) {

            return (
                "Ich kann dir innerhalb von HalDo AI OS "
                +
                "bei Apps, Dateien, Einstellungen, "
                +
                "Systemfunktionen, Sprache und "
                +
                "Navigation helfen."
            );

        }

        return (
            "Ich habe deine Nachricht verstanden: "
            +
            "„" +
            text +
            "“. "
            +
            "Für eine wirklich umfassende freie "
            +
            "KI-Unterhaltung muss HalDo AI noch "
            +
            "mit einem echten KI-Modell bzw. einer "
            +
            "entsprechenden API verbunden werden. "
            +
            "Die zentrale Schnittstelle dafür ist "
            +
            "bereits vorbereitet."
        );

    }

};

/* ================================================================
   APP COMMAND ENGINE
   ================================================================ */

HDA8.commands =
HDA8.commands || {

    aliases: {

        rechner:
            "calculator",

        taschenrechner:
            "calculator",

        uhr:
            "clock",

        übersetzer:
            "translator",

        translator:
            "translator",

        browser:
            "browser",

        downloads:
            "downloads",

        systemmonitor:
            "system-monitor",

        system:
            "system-monitor",

        voice:
            "voice",

        sprache:
            "voice"

    },

    findApp(
        text
    ) {

        const lower =
            text
                .toLocaleLowerCase(
                    "de-DE"
                );

        for (
            const [
                alias,
                appId
            ]
            of Object.entries(
                this.aliases
            )
        ) {

            if (
                lower.includes(
                    alias
                )
            ) {

                return appId;

            }

        }

        return null;

    },

    async execute(
        text
    ) {

        const appId =
            this.findApp(
                text
            );

        if (
            appId
        ) {

            try {

                const result =
                    await HDA8.router.open(
                        appId
                    );

                HDA8.notifications.add(
                    "HalDo",
                    `App geöffnet: ${appId}`,
                    "success"
                );

                return {

                    handled:
                        true,

                    result

                };

            }
            catch (
                error
            ) {

                HDA8.notifications.add(
                    "HalDo Fehler",
                    error.message ||
                    "App konnte nicht geöffnet werden.",
                    "error"
                );

                return {

                    handled:
                        true,

                    error

                };

            }

        }

        return {

            handled:
                false

        };

    }

};

/* ================================================================
   GLOBAL SEARCH
   ================================================================ */

HDA8.search =
HDA8.search || {

    async query(
        text
    ) {

        const query =
            String(
                text || ""
            )
            .trim()
            .toLocaleLowerCase(
                "de-DE"
            );

        if (
            !query
        ) {

            return [];

        }

        const results =
            [];

        let apps =
            [];

        try {

            apps =
                HDA8.registry
                    .getAll?.() ||
                HDA8.registry
                    .list?.() ||
                [];

        }
        catch {}

        apps.forEach(
            app => {

                const name =
                    String(
                        app.name ||
                        ""
                    );

                const id =
                    String(
                        app.id ||
                        ""
                    );

                if (
                    name
                        .toLocaleLowerCase(
                            "de-DE"
                        )
                        .includes(
                            query
                        ) ||
                    id
                        .toLocaleLowerCase(
                            "de-DE"
                        )
                        .includes(
                            query
                        )
                ) {

                    results.push({

                        type:
                            "app",

                        id,

                        title:
                            name,

                        icon:
                            app.icon ||
                            "◉"

                    });

                }

            }
        );

        return results;

    }

};

            element.querySelector(

            element.querySelector(

            );

            () => {

                messageBox.innerHTML =
                    this.messages
                        .map(
                            message => `

                                    style="
                                        align-self:
                                            ${
                                                message.role ===
                                                "user"
                                                    ? "flex-end"
                                                    : "flex-start"
                                            };

                                        max-width:82%;

                                        padding:12px 14px;

                                        border-radius:16px;

                                        background:

                                                "user"
                                                    ? "rgba(85,190,255,.18)"
                                                    : "rgba(255,255,255,.06)"
                                            };

                                            pre-wrap;

                                        line-height:1.5;
                                    "
                                >
                                    ${HDA8.util.escape(
                                        message.text
                                    )}
                                </div>

                            `
                        )
                        .join("");

                messageBox.scrollTop =
                    messageBox.scrollHeight;

            };

        const sendMessage =
            async () => {

                const text =
                    input.value.trim();

                if (
                    !text
                ) {
                    return;
                }

                input.value =
                    "";

                this.messages.push({

                    role:
                        "user",

                    text,

                    timestamp:
                        new Date()
                            .toISOString()

                });

                render();

                send.disabled =
                    true;

                const command =
                    await HDA8.commands
                        .execute(
                            text
                        );

                let response;

                if (
                    command.handled
                ) {

                    response =
                        {
                            text:
                                "Erledigt. Ich habe die gewünschte Systemaktion ausgeführt.",
                            source:
                                "command"
                        };

                    response =
                        await HDA8.ai.engine
                            .respond(
                                text,
                                {
                                    source:
                                        "chat"
                                }
                            );

                }

                this.messages.push({

                    role:
                        "assistant",

                    text:
                        response.text,

                    timestamp:
                        new Date()
                            .toISOString(),

                    source:
                        response.source

                });

                this.save();

                render();

                send.disabled =
                    false;

                input.focus();

            };

        send.addEventListener(
            "click",
            sendMessage
        );

        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );

        render();

        return element;

    }

};

/* ================================================================
   CREATE COSMIC WORLD WHEN SHELL IS READY
   ================================================================ */

const startCosmic =
    () => {

        HDA8.cosmic.start();

    };

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        startCosmic,
        {
            once:true
        }
    );

}
else {

    startCosmic();

}

/* ================================================================
   GLOBAL KEYBOARD SHORTCUTS
   ================================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.ctrlKey &&
            event.key.toLowerCase() ===
            "k"
        ) {

            event.preventDefault();

            HDA8.router.open(
                "search"
            );

        }

        if (
            event.ctrlKey &&
            event.key.toLowerCase() ===
            "j"
        ) {

            event.preventDefault();

            HDA8.router.open(
                "chat"
            );

        }

        if (
            event.key ===
            "Escape"
        ) {

            HDA8.emit(
                "keyboard:escape"
            );

        }

    }
);

/* ================================================================
   CENTRAL AI EVENT CONNECTION
   ================================================================ */

HDA8.on(
    "ai:user-message",
    async payload => {

        if (
            !payload?.text
        ) {
            return;
        }

        const response =
            await HDA8.ai.engine
                .respond(
                    payload.text,
                    {
                        source:
                            payload.source ||
                            "system"
                    }
                );

        HDA8.emit(
            "ai:response",
            response
        );

        /*
         * Voice output is only used if the
         * existing speech system exposes it.
         */

        try {

            const speech =
                HDA8.aiSpeech ||
                HDA8.voiceOutput ||
                window.speechSynthesis;

            if (
                speech &&
                typeof speech.speak ===
                "function"
            ) {

                if (
                    speech instanceof
                    SpeechSynthesis
                ) {

                    const utterance =
                        new SpeechSynthesisUtterance(
                            response.text
                        );

                    utterance.lang =
                        HDA8.language?.current ||
                        "de-DE";

                    speech.speak(
                        utterance
                    );

                }

            }

        }
        catch {}

    }
);

/* ================================================================
   WELCOME SOUND CONTROLLER
   ================================================================ */

HDA8.cosmicWelcome =
HDA8.cosmicWelcome || {

    enabled:
        HDA8.appData.get(
            "cosmic-welcome-enabled",
            true
        ),

    setEnabled(
        value
    ) {

        this.enabled =
            Boolean(
                value
            );

        HDA8.appData.set(
            "cosmic-welcome-enabled",
            this.enabled
        );

        HDA8.emit(
            "cosmic-sound:changed",
            {
                enabled:
                    this.enabled
            }
        );

    },

    play(
        short = false
    ) {

        if (
            !this.enabled
        ) {
            return;
        }

        /*
         * Web Audio is generated only when
         * the browser has received user interaction.
         */

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (
                !AudioContext
            ) {
                return;
            }

            const context =
                new AudioContext();

            const now =
                context.currentTime;

            const notes =
                short
                    ? [659.25, 783.99]
                    : [
                        523.25,
                        659.25,
                        783.99,
                        1046.50
                    ];

            notes.forEach(
                (
                    frequency,
                    index
                ) => {

                    const oscillator =
                        context.createOscillator();

                    const gain =
                        context.createGain();

                    oscillator.type =
                        "sine";

                    oscillator.frequency
                        .setValueAtTime(
                            frequency,
                            now +
                            index * .12
                        );

                    gain.gain
                        .setValueAtTime(
                            0,
                            now +
                            index * .12
                        );

                    gain.gain
                        .linearRampToValueAtTime(
                            .035,
                            now +
                            index * .12 +
                            .04
                        );

                    gain.gain
                        .exponentialRampToValueAtTime(
                            .001,
                            now +
                            index * .12 +
                            .55
                        );

                    oscillator.connect(
                        gain
                    );

                    gain.connect(
                        context.destination
                    );

                    oscillator.start(
                        now +
                        index * .12
                    );

                    oscillator.stop(
                        now +
                        index * .12 +
                        .6
                    );

                }
            );

            setTimeout(
                () => {

                    try {
                        context.close();
                    }
                    catch {}

                },
                1500
            );

        }
        catch {}

    }

};

/* ================================================================
   STARTUP ORCHESTRATOR
   ================================================================ */

HDA8.startup =
HDA8.startup || {

    started:
        false,

    async start() {

        if (
            this.started
        ) {
            return;
        }

        this.started =
            true;

        HDA8.emit(
            "system:startup",
            {
                version:
                    "20.0.0"
            }
        );

        /*
         * Existing runtime gets the opportunity
         * to initialize first.
         */

        try {

            if (
                typeof HDA8.system?.start ===
                "function"
            ) {

                await HDA8.system.start();

            }

        }
        catch (
            error
        ) {

            HDA8.emit(
                "system:error",
                {
                    error
                }
            );

        }

        try {

            HDA8.cosmic.start();

        }
        catch {}

        HDA8.notifications.add(
            "HalDo AI OS",
            "HalDo AI OS 20 ist bereit.",
            "success"
        );

        HDA8.cosmicWelcome.play(
            false
        );

        HDA8.emit(
            "system:ready",
            {
                version:
                    "20.0.0"
            }
        );

    }

};

   FINAL RUNTIME STATUS
   ================================================================ */

{

        "20.0.0",

    shell:
        true,

    kernel:
        Boolean(
            HDA8.kernel ||
            HDA8.Kernel
        ),

    system:
        Boolean(
            HDA8.system
        ),

    events:
        Boolean(
            HDA8.on &&
            HDA8.emit
        ),

    storage:
        Boolean(
            HDA8.appData
        ),

    registry:
        Boolean(
            HDA8.registry
        ),

    router:
        Boolean(
            HDA8.router
        ),

    windowManager:
        Boolean(
            HDA8.windowManager
        ),

    ai:
        Boolean(
            HDA8.ai
        ),

    cosmic:
        true,

    chat:
        true,

    voice:
        HDA8.voice.supported

};

/* ================================================================
   FINAL EVENT
   ================================================================ */

HDA8.emit(
    "haldo:v20:complete",
    HDA8.runtimeStatus
);

/* ================================================================
   START
   ================================================================ */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        () =>
            HDA8.startup.start(),
        {
            once:true
        }
    );

}
else {

    HDA8.startup.start();

}

console.info(

);
