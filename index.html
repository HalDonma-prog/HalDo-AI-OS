<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HalDo AI OS 24 – Ultimate</title>
    <link rel="icon" href="assets/images/favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== INTRO (LOGO + BOOT) ===== -->
    <div id="intro-container">
        <div class="logo-wrapper">
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <img src="assets/images/logo.png" alt="HalDo Logo" class="logo-intro-img" id="logo-intro-img"
            onerror="this.style.display='none'; document.getElementById('logo-fallback-intro').style.display='flex';" />
            <div id="logo-fallback-intro" style="display:none;font-size:4.5rem;font-weight:900;background:linear-gradient(135deg,#00d4ff,#7b2ffc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:4px;z-index:2;position:relative;">
                ⟡
            </div>
        </div>
        <div class="intro-title">HalDo OS</div>
        <div class="intro-subtitle">Cosmic Intelligent Operating System</div>
        <div class="intro-loader"></div>
        <div class="intro-status" id="intro-status">⟡ System wird gestartet ...</div>
        <div class="intro-progress">
            <div class="intro-progress-bar" id="intro-progress-bar"></div>
        </div>
        <div class="intro-progress-text" id="intro-progress-text">0%</div>
        <div class="intro-version">HalDo OS v24.6.0</div>
    </div>

    <!-- ===== COSMIC CANVAS ===== -->
    <canvas id="cosmic"></canvas>

    <!-- ===== MENU BAR ===== -->
    <div id="menu-bar">
        <div class="menu-left">
            <span class="logo-text">⟡ HalDo</span>
            <span class="menu-item" id="menu-apps">📱 Apps</span>
            <span class="menu-item" id="menu-ai">🤖 AI</span>
            <span class="menu-item" id="menu-fahrschule">🚗 Fahrschule</span>
            <span class="menu-item" id="menu-system">⚙️ System</span>
            <span class="menu-item" id="menu-update">🔄 Update</span>
            <span class="menu-item" id="menu-help">❓ Hilfe</span>
        </div>
        <div class="menu-right">
            <span class="status-text"><span class="status-dot"></span>Online</span>
            <span class="clock" id="clock-display">--:--</span>
        </div>
    </div>

    <!-- ===== APP CONTAINER ===== -->
    <div id="app-container"></div>

    <!-- ===== DOCK ===== -->
    <div id="dock">
        <button class="dock-item" data-app="ai" title="HalDo AI">🤖</button>
        <button class="dock-item" data-app="avatar" title="Living AI">👤</button>
        <button class="dock-item" data-app="fahrschule" title="Fahrschule">🚗</button>
        <button class="dock-item" data-app="notes" title="Notizen">📝</button>
        <button class="dock-item" data-app="tasks" title="Aufgaben">✅</button>
        <button class="dock-item" data-app="cosmic" title="Cosmic World">🌌</button>
        <div class="dock-divider"></div>
        <button class="dock-item" data-app="appworld" title="App World">📱</button>
        <button class="dock-item" data-app="settings" title="Einstellungen">⚙️</button>
        <button class="dock-item" data-app="files" title="Dateien">📁</button>
        <button class="dock-item" data-app="email" title="E-Mail">📧</button>
        <button class="dock-item" data-app="contacts" title="Kontakte">👤</button>
        <button class="dock-item" data-app="language" title="Sprache">🌍</button>
        <button class="dock-item" id="btn-about" title="Info">💙</button>
    </div>

    <!-- ===== NOTIFICATION ===== -->
    <div id="notification"></div>

    <!-- ===== JAVASCRIPT MODULE ===== -->
    <script src="config.js"></script>
    <script src="core.js"></script>
    <script src="apps.js"></script>
    <script src="cosmic.js"></script>
    <script src="init.js"></script>

</body>
</html>
