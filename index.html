<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HalDo AI OS — Cosmic Intelligent OS</title>
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a1a;
            --surface: rgba(16, 16, 40, 0.92);
            --text: #e0e0ff;
            --primary: #00d4ff;
            --secondary: #7b2ffc;
            --radius: 14px;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== BOOT ===== */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.2s ease;
            padding: 20px;
        }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo {
            font-size: clamp(3rem, 12vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 60px rgba(123, 47, 252, 0.5));
                transform: scale(1.05);
            }
        }
        #boot-status {
            margin-top: 16px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COSMIC CANVAS ===== */
        #cosmic {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ===== DISPLAY ===== */
        #display {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* ===== TOPBAR ===== */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            min-height: 40px;
            flex-shrink: 0;
        }
        #topbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #topbar-left .haldo-icon {
            font-weight: 700;
            color: var(--primary);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #topbar-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== APP CONTAINER ===== */
        #app-container {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow: hidden;
            touch-action: none;
        }

        /* ===== WINDOW ===== */
        .window {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.3s;
            min-width: 200px;
            min-height: 150px;
            max-width: 98vw;
            max-height: 90vh;
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.15);
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            cursor: grab;
            flex-shrink: 0;
            min-height: 36px;
            touch-action: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .win-btn {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.2s;
            touch-action: manipulation;
            min-width: 28px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .win-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        .win-btn.close:active {
            background: #ff4444;
            color: #fff;
        }
        .window-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }
        .window-body input,
        .window-body textarea,
        .window-body select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            margin-bottom: 10px;
            -webkit-appearance: none;
            appearance: none;
        }
        .window-body button {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
            min-height: 44px;
        }
        .window-body button:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
        .window-body .ai-quick {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            font-size: clamp(0.7rem, 1.4vw, 0.8rem);
            min-height: 36px;
        }
        .window-body .ai-quick:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== DOCK ===== */
        #dock {
            position: absolute;
            bottom: clamp(8px, 2vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: clamp(4px, 1vw, 10px);
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 18px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: nowrap;
            max-width: 98vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .dock-item {
            width: clamp(40px, 9vw, 52px);
            height: clamp(40px, 9vw, 52px);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3.5vw, 1.6rem);
            cursor: pointer;
            transition: 0.2s;
            border: none;
            color: #fff;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .dock-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: clamp(50px, 10vh, 70px);
            right: clamp(8px, 2vw, 20px);
            left: clamp(8px, 2vw, 20px);
            z-index: 999;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 14px 18px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: var(--shadow);
            animation: slideIn 0.4s ease;
            border-left: 4px solid var(--primary);
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
        }
        .notification.success {
            border-left-color: #44ff88;
        }
        .notification.error {
            border-left-color: #ff4444;
        }
        @keyframes slideIn {
            from {
                transform: translateY(-120%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ===== SCROLLBAR ===== */
        .window-body::-webkit-scrollbar {
            width: 4px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .window {
                border-radius: 12px;
                min-width: 160px;
                min-height: 120px;
            }
            .window-header {
                padding: 6px 10px;
                min-height: 32px;
            }
            .window-body {
                padding: 10px;
            }
            #topbar {
                padding: 4px 10px;
                min-height: 34px;
            }
            .win-btn {
                min-width: 24px;
                min-height: 24px;
                padding: 2px 6px;
            }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .window {
                max-height: 80vh;
            }
            #dock {
                bottom: 4px;
                padding: 4px 10px;
                gap: 4px;
            }
            .dock-item {
                width: 34px;
                height: 34px;
                font-size: 1rem;
                border-radius: 10px;
            }
            #topbar {
                min-height: 28px;
                padding: 2px 10px;
            }
            .window-header {
                min-height: 28px;
                padding: 4px 10px;
            }
            .window-body {
                padding: 8px;
            }
            .window-body button {
                min-height: 32px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- BOOT -->
        <div id="boot">
            <div id="boot-logo">⟡ HalDo</div>
            <div class="boot-spinner"></div>
            <div id="boot-status">⟡ System wird geladen ...</div>
        </div>

        <!-- COSMIC CANVAS -->
        <canvas id="cosmic"></canvas>

        <!-- DISPLAY -->
        <div id="display">
            <!-- TOPBAR -->
            <div id="topbar">
                <div id="topbar-left">
                    <span class="haldo-icon" id="menu-system">⟡ HalDo</span>
                    <span id="clock-display">--:--</span>
                </div>
                <div id="topbar-right">
                    <button class="top-btn" id="btn-appworld">📱</button>
                    <button class="top-btn" id="btn-theme">🎨</button>
                    <button class="top-btn" id="btn-about">ℹ️</button>
                </div>
            </div>

            <!-- APP CONTAINER -->
            <div id="app-container"></div>

            <!-- DOCK -->
            <div id="dock">
                <button class="dock-item" data-app="ai">🤖</button>
                <button class="dock-item" data-app="files">📁</button>
                <button class="dock-item" data-app="settings">⚙️</button>
                <button class="dock-item" data-app="cosmic">🌌</button>
                <button class="dock-item" data-app="notes">📝</button>
                <button class="dock-item" data-app="terminal">⌨️</button>
                <button class="dock-item" data-app="calendar">📅</button>
                <button class="dock-item" data-app="music">🎵</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  HALDO AI OS — VEREINFACHTE GARANTIERT FUNKTIONIERENDE VERSION
        //  Kein Login-Zwang, Bootet direkt ins System
        // ================================================================

        (function() {
            'use strict';

            // ===== STATE =====
            const state = {
                apps: {},
                windows: [],
                windowZIndex: 100,
                activeWindow: null,
                theme: 'cosmic',
                language: 'de',
                booted: false,
                aiMemory: [],
                settings: {
                    theme: 'cosmic',
                    language: 'de',
                    voiceEnabled: false,
                    notifications: true
                }
            };

            // ===== DOM HELPERS =====
            const $ = (id) => document.getElementById(id);
            const boot = $('boot');
            const bootStatus = $('boot-status');
            const cosmicCanvas = $('cosmic');
            const appContainer = $('app-container');
            const dock = $('dock');

            // ===== COSMIC WORLD =====
            let stars = [];
            let particles = [];
            let cosmicRunning = false;
            let cosmicCtx = null;
            let cosmicW = 0,
                cosmicH = 0;

            function initCosmic() {
                const ctx = cosmicCanvas.getContext('2d');
                cosmicCtx = ctx;

                function resize() {
                    cosmicW = cosmicCanvas.width = window.innerWidth;
                    cosmicH = cosmicCanvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                stars = [];
                for (let i = 0; i < 150; i++) {
                    stars.push({
                        x: Math.random() * cosmicW,
                        y: Math.random() * cosmicH,
                        r: Math.random() * 2 + 0.5,
                        speed: Math.random() * 0.3 + 0.1,
                        brightness: Math.random() * 0.8 + 0.2,
                        phase: Math.random() * Math.PI * 2
                    });
                }

                particles = [];
                for (let i = 0; i < 35; i++) {
                    particles.push({
                        x: Math.random() * cosmicW,
                        y: Math.random() * cosmicH,
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: (Math.random() - 0.5) * 0.2,
                        r: Math.random() * 35 + 15,
                        alpha: Math.random() * 0.025 + 0.008,
                        hue: Math.random() * 60 + 220
                    });
                }

                cosmicRunning = true;
                animateCosmic();
            }

            function animateCosmic() {
                if (!cosmicRunning || !cosmicCtx) return;
                const ctx = cosmicCtx;
                const w = cosmicW,
                    h = cosmicH;

                ctx.clearRect(0, 0, w, h);

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
                    grad.addColorStop(0, `hsla(${p.hue}, 80%, 60%, ${p.alpha})`);
                    grad.addColorStop(1, `hsla(${p.hue}, 80%, 40%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                const time = Date.now() / 2000;
                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                    const bright = s.brightness * (0.7 + 0.3 * Math.sin(time + s.phase));
                    ctx.fillStyle = `rgba(255,255,255,${bright})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
                grad.addColorStop(0, 'rgba(0,212,255,0.015)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                requestAnimationFrame(animateCosmic);
            }

            // ===== BOOT =====
            function bootSequence() {
                const statuses = [
                    '⟡ Kernel lädt ...',
                    '⟡ System initialisiert ...',
                    '⟡ Cosmic World startet ...',
                    '⟡ Living AI wird geweckt ...',
                    '⟡ HalDo AI OS ist READY 🚀'
                ];

                let i = 0;
                const interval = setInterval(() => {
                    if (i < statuses.length) {
                        bootStatus.textContent = statuses[i];
                        i++;
                    } else {
                        clearInterval(interval);
                        boot.classList.add('hidden');
                        state.booted = true;
                        notify('🚀 HalDo AI OS erfolgreich gestartet!');
                        setTimeout(() => launchApp('ai'), 400);
                        setTimeout(() => launchApp('cosmic'), 700);
                    }
                }, 500);
            }

            // ===== WINDOW MANAGEMENT =====
            function getSafeWindowPosition() {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const w = Math.min(500, vw - 40);
                const h = Math.min(400, vh - 160);
                const x = Math.max(10, (vw - w) / 2);
                const y = Math.max(40, (vh - h) / 2 - 20);
                return { x, y, w, h };
            }

            function launchApp(id) {
                const app = state.apps[id];
                if (!app) {
                    notify(`❌ App "${id}" nicht gefunden`, 'error');
                    return;
                }

                const existing = state.windows.find(w => w.appId === id);
                if (existing) {
                    focusWindow(existing.id);
                    return;
                }

                const pos = getSafeWindowPosition();
                const winId = 'win-' + Date.now();
                const win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x + Math.random() * 20,
                    y: pos.y + Math.random() * 20,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null
                };

                state.windows.push(win);
                renderWindow(win);
                focusWindow(winId);

                if (app.render) {
                    const body = win.element.querySelector('.window-body');
                    app.render(body, win);
                }

                notify(`🔄 ${app.title || id} geöffnet`);
            }

            function renderWindow(win) {
                const existing = document.getElementById(win.id);
                if (existing) existing.remove();

                const el = document.createElement('div');
                el.id = win.id;
                el.className = 'window';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;

                el.innerHTML = `
                    <div class="window-header">
                        <span class="window-title">${win.icon} ${win.title}</span>
                        <div class="window-controls">
                            <button class="win-btn" data-action="minimize">─</button>
                            <button class="win-btn" data-action="maximize">⧉</button>
                            <button class="win-btn close" data-action="close">✕</button>
                        </div>
                    </div>
                    <div class="window-body"></div>
                `;

                appContainer.appendChild(el);
                win.element = el;

                // Controls
                el.querySelectorAll('.win-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        if (action === 'close') closeWindow(win.id);
                        else if (action === 'minimize') minimizeWindow(win.id);
                        else if (action === 'maximize') maximizeWindow(win.id);
                    });
                });

                // Drag
                const header = el.querySelector('.window-header');
                let drag = false,
                    startX, startY, origX, origY, isTouch = false;

                function startDrag(clientX, clientY) {
                    if (header.querySelector('.win-btn') && document.activeElement?.tagName === 'BUTTON') return;
                    drag = true;
                    startX = clientX;
                    startY = clientY;
                    origX = win.x;
                    origY = win.y;
                    focusWindow(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(clientX, clientY) {
                    if (!drag) return;
                    const dx = clientX - startX;
                    const dy = clientY - startY;
                    win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
                    win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() {
                    if (drag) { drag = false;
                        el.style.cursor = ''; }
                }

                header.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.win-btn')) return;
                    startDrag(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    moveDrag(e.clientX, e.clientY);
                });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    if (e.target.closest('.win-btn')) return;
                    isTouch = true;
                    startDrag(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', (e) => {
                    if (!drag || !isTouch) return;
                    const touch = e.touches[0];
                    moveDrag(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchend', () => {
                    if (isTouch) { isTouch = false;
                        endDrag(); }
                }, { passive: true });

                // Resize
                const resizeHandle = document.createElement('div');
                resizeHandle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:24px;height:24px;cursor:se-resize;touch-action:none;';
                el.appendChild(resizeHandle);

                let resize = false,
                    startW, startH, startX2, startY2;

                function startResize(clientX, clientY) {
                    resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = clientX;
                    startY2 = clientY;
                }

                function moveResize(clientX, clientY) {
                    if (!resize) return;
                    const dw = clientX - startX2,
                        dh = clientY - startY2;
                    win.width = Math.max(200, Math.min(window.innerWidth - win.x - 10, startW + dw));
                    win.height = Math.max(120, Math.min(window.innerHeight - win.y - 80, startH + dh));
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                resizeHandle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    startResize(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', (e) => {
                    if (!resize) return;
                    moveResize(e.clientX, e.clientY);
                });
                document.addEventListener('mouseup', endResize);

                resizeHandle.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    const touch = e.touches[0];
                    startResize(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', (e) => {
                    if (!resize) return;
                    const touch = e.touches[0];
                    moveResize(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            }

            function closeWindow(winId) {
                const idx = state.windows.findIndex(w => w.id === winId);
                if (idx === -1) return;
                const win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) {
                    focusWindow(state.windows[state.windows.length - 1].id);
                }
            }

            function focusWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    state.windows.forEach(w => {
                        if (w.id !== winId && w.element) w.element.classList.remove('active');
                    });
                }
            }

            function minimizeWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (win && win.element) {
                    win.element.style.display = 'none';
                    notify(`⏬ ${win.title} minimiert`);
                }
            }

            function maximizeWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (!win || !win.element) return;
                if (win.width === window.innerWidth - 20) {
                    win.width = win._prevWidth || 500;
                    win.height = win._prevHeight || 400;
                    win.x = win._prevX || 20;
                    win.y = win._prevY || 40;
                } else {
                    win._prevWidth = win.width;
                    win._prevHeight = win.height;
                    win._prevX = win.x;
                    win._prevY = win.y;
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            }

            // ===== NOTIFICATION =====
            function notify(message, type = 'info') {
                const el = document.createElement('div');
                el.className = `notification ${type}`;
                el.textContent = message;
                document.body.appendChild(el);

                    el.style.opacity = '0';
                    el.style.transform = 'translateY(-120%)';
                    setTimeout(() => el.remove(), 400);
                }, 2800);

                    root.style.setProperty('--surface', 'rgba(16,16,40,0.92)');
                } else if (theme === 'dark') {
                    root.style.setProperty('--bg', '#0a0a0a');
                    root.style.setProperty('--text', '#ffffff');
                    root.style.setProperty('--surface', 'rgba(30,30,40,0.92)');
                } else if (theme === 'light') {
                    root.style.setProperty('--bg', '#e8e8f0');
                    root.style.setProperty('--text', '#1a1a2e');
                    root.style.setProperty('--surface', 'rgba(255,255,255,0.92)');
                }
                state.settings.theme = theme;
                localStorage.setItem('haldo_theme', theme);
            }

                const current = state.settings.theme;

                notify(`🎨 Theme: ${next}`);

                                    <span style="cursor:pointer;">🔊</span>
                                </div>
                                <div style="text-align:center;font-size:0.8rem;color:#8899bb;">🎵 Jetzt spielt: ${songs[0]}</div>
                                <div style="margin-top:6px;">
                                    ${songs.map(s => `
                                        <div style="padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:8px;margin:3px 0;font-size:0.8rem;display:flex;justify-content:space-between;">
                                            <span>${s}</span>
                                            <span style="color:#8899bb;">▶</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                });

                // App World
                registerApp('appworld', {
                    title: 'App World',
                    icon: '📱',
                    render: (body) => {
                        const apps = Object.entries(state.apps).filter(([id]) => id !== 'appworld');
                        body.innerHTML = `
                            <h3 style="margin-bottom:10px;">📱 HalDo App World</h3>
                            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;">
                                ${apps.map(([id, app]) => `
                                    <div style="background:rgba(255,255,255,0.04);padding:12px;border-radius:10px;text-align:center;cursor:pointer;" onclick="HalDo.launchApp('${id}')">
                                        <div style="font-size:1.8rem;">${app.icon}</div>
                                        <div style="font-size:0.7rem;margin-top:4px;">${app.title}</div>
                                    </div>
                                `).join('')}
                            </div>
                            <div style="margin-top:12px;font-size:0.7rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px;">
                                ${apps.length} Apps installiert · HalDo AI OS v20.0.0
                            </div>
                        `;
                    }
                });
            }

            // ===== CLOCK =====
            function updateClock() {
                const el = document.getElementById('clock-display');
                if (el) {
                    el.textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                }
            }

            // ===== ABOUT =====
            function showAbout() {
                notify('⟡ HalDo AI OS v20.0.0 — Cosmic Intelligent OS\n💙 Für alle Geräte optimiert');
            }

            // ===== SHOW APP WORLD =====
            function showAppWorld() {
                launchApp('appworld');
            }

            // ===== SHOW SYSTEM MENU =====
            function showSystemMenu() {
                notify('⚙️ System-Menü: Dateien · Einstellungen · Apps · AI · Sprache · Theme · Speicher · Updates');
                launchApp('settings');
            }

            // ===== INIT =====
            function init() {
                // Theme laden
                const savedTheme = localStorage.getItem('haldo_theme') || 'cosmic';
                applyTheme(savedTheme);

                // Apps definieren
                defineApps();

                // Cosmic starten
                initCosmic();

                // Uhr
                updateClock();
                setInterval(updateClock, 10000);

                // Dock-Events
                dock.querySelectorAll('.dock-item').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const appId = btn.dataset.app;
                        launchApp(appId);
                    });
                });

                // Topbar Buttons
                document.getElementById('menu-system').addEventListener('click', showSystemMenu);
                document.getElementById('btn-appworld').addEventListener('click', showAppWorld);
                document.getElementById('btn-theme').addEventListener('click', toggleTheme);
                document.getElementById('btn-about').addEventListener('click', showAbout);

                // Boot starten
                bootSequence();

                // Globale API
                window.HalDo = {
                    notify,
                    toggleTheme,
                    showAbout,
                    launchApp,
                    state,
                    showSystemMenu,
                    showAppWorld
                };

                console.log('⟡ HalDo AI OS v20.0.0');
                console.log('🌌 Cosmic Intelligent OS');
                console.log('💡 HalDo.launchApp("ai")');
            }

            // ===== START =====
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
