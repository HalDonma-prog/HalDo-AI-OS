<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HalDo AI OS 24 – Simplified</title>
    <style>
        /* ===== KOMPLETTES CSS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #0a0a1a;
            color: #e8eef5;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #intro-container {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        #intro-container.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .logo-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
        }
        .logo-intro-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            animation: pulse 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 50px rgba(0, 212, 255, 0.3));
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 70px rgba(123, 47, 252, 0.4));
            }
        }
        .logo-ring {
            position: absolute;
            inset: -10px;
            border: 2px solid rgba(0, 212, 255, 0.08);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }
        .logo-ring:nth-child(2) {
            inset: -25px;
            border-color: rgba(123, 47, 252, 0.06);
            animation-duration: 14s;
            animation-direction: reverse;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .intro-title {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }
        .intro-subtitle {
            font-size: 0.6rem;
            color: #8899bb;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .intro-loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        .intro-status {
            font-size: 0.7rem;
            color: #8899bb;
            animation: pulseText 1.4s ease-in-out infinite;
            min-height: 20px;
        }
        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }
        .intro-progress {
            width: 240px;
            height: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 3px;
            margin-top: 14px;
            overflow: hidden;
        }
        .intro-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .intro-progress-text {
            font-size: 0.4rem;
            color: #556688;
            margin-top: 6px;
            letter-spacing: 2px;
        }
        .intro-version {
            position: fixed;
            bottom: 20px;
            right: 24px;
            font-size: 0.4rem;
            color: #556688;
        }
        #cosmic {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        #app-container {
            position: fixed;
            inset: 38px 0 58px 0;
            z-index: 10;
            pointer-events: none;
        }
        #menu-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 38px;
            z-index: 2000;
            background: rgba(10, 10, 26, 0.75);
            backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.7rem;
        }
        #menu-bar .menu-item {
            color: #8899bb;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        #menu-bar .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #e8eef5;
        }
        #menu-bar .menu-left {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        #menu-bar .logo-text {
            font-weight: 700;
            font-size: 0.85rem;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 6px;
        }
        #menu-bar .menu-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #menu-bar .clock {
            color: #8899bb;
            font-size: 0.65rem;
            font-variant-numeric: tabular-nums;
        }
        #menu-bar .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #44ff88;
            display: inline-block;
            margin-right: 4px;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }
        #dock {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 6px 12px;
            display: flex;
            gap: 4px;
            align-items: center;
            max-width: 94vw;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dock-item {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            color: #e8eef5;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dock-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-4px);
        }
        .dock-divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.04);
            margin: 0 3px;
        }
        #notification {
            position: fixed;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            z-index: 9999;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-left: 3px solid #00d4ff;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 0.75rem;
            max-width: 88vw;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .window {
            position: absolute;
            pointer-events: auto;
            background: rgba(16, 16, 40, 0.92);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            min-width: 200px;
            min-height: 130px;
            overflow: hidden;
        }
        .window-header {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: grab;
            flex-shrink: 0;
            min-height: 34px;
        }
        .window-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: #e8eef5;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }
        .window-controls .win-btn {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            font-size: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            color: #8899bb;
            transition: background 0.2s;
        }
        .window-controls .win-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .window-controls .win-btn.close:hover {
            background: #ff4444;
            color: #fff;
        }
        .window-body {
            flex: 1;
            padding: 10px 12px;
            overflow: auto;
            font-size: 0.7rem;
            min-height: 60px;
        }
        .btn-primary {
            padding: 5px 14px;
            font-size: 0.65rem;
            font-weight: 600;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .btn-secondary {
            padding: 4px 10px;
            font-size: 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            color: #8899bb;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .input-field {
            flex: 1;
            font-size: 0.65rem;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            color: #fff;
            outline: none;
        }
        .input-field:focus {
            border-color: #00d4ff;
        }
        .chip {
            padding: 3px 10px;
            font-size: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            color: #8899bb;
            cursor: pointer;
        }
        .chip:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .section-divider {
            font-size: 0.4rem;
            color: #8899bb;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 4px;
            margin-top: 4px;
        }
        @media (max-width: 500px) {
            #menu-bar .menu-item {
                font-size: 0.55rem;
                padding: 2px 6px;
            }
            #menu-bar .logo-text {
                font-size: 0.7rem;
            }
            #dock {
                padding: 4px 8px;
            }
            .dock-item {
                width: 34px;
                height: 34px;
                font-size: 0.95rem;
            }
            .intro-title {
                font-size: 1.8rem;
            }
            .intro-progress {
                width: 180px;
            }
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== INTRO ===== -->
    <div id="intro-container">
        <div class="logo-wrapper">
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <img src="assets/images/logo.png" alt="HalDo Logo" class="logo-intro-img" id="logo-intro-img"

    <canvas id="cosmic"></canvas>

    <div id="menu-bar">
        <div class="menu-left">
            <span class="logo-text">⟡ HalDo</span>

    <!-- ================================================================
    JAVASCRIPT – SIMPLIFIED BUT FUNCTIONAL
    ================================================================ -->
    <script>
        'use strict';

        // ===== SIMPLIFIED CONFIG =====
        var CONFIG = {
            version: '24.6.0',
            apiKey: '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',
            apiUrl: 'https://api.groq.com/openai/v1/chat/completions',
            model: 'llama3-70b-8192',
            language: 'de'
        };

        // ===== DOM =====
        var DOM = {
            intro: document.getElementById('intro-container'),
            status: document.getElementById('intro-status'),
            progress: document.getElementById('intro-progress-bar'),
            progressText: document.getElementById('intro-progress-text'),
            clock: document.getElementById('clock-display'),
            cosmic: document.getElementById('cosmic'),
            appContainer: document.getElementById('app-container'),
            notification: document.getElementById('notification'),
            dock: document.getElementById('dock')
        };

        // ===== NOTIFICATION =====
        function notify(text, type) {
            var colors = { error: '#ff4444', success: '#44ff88', warning: '#ffcc00', info: '#00d4ff' };
            DOM.notification.textContent = text;
            DOM.notification.style.borderLeftColor = colors[type] || '#00d4ff';
            DOM.notification.classList.add('show');
            clearTimeout(DOM.notification._timeout);
            DOM.notification._timeout = setTimeout(function() {
                DOM.notification.classList.remove('show');
            }, 3000);
        }

        // ===== WINDOW MANAGER =====
        var windows = [];
        var windowZIndex = 100;
        var activeWindow = null;

        function launchApp(id) {
            var app = apps[id];
            if (!app) { notify('App nicht gefunden: ' + id, 'error'); return; }
            for (var i = 0; i < windows.length; i++) {
                if (windows[i].appId === id) {
                    focusWindow(windows[i].id);
                    return;
                }
            }
            var winId = 'win-' + Date.now();
            var win = {
                id: winId,
                appId: id,
                title: app.title,
                icon: app.icon,
                x: 40 + Math.random() * 20,
                y: 40 + Math.random() * 20,
                width: 400,
                height: 300,
                zIndex: windowZIndex++,
                element: null
            };
            windows.push(win);
            renderWindow(win);
            focusWindow(winId);
            if (app.render) {
                var body = win.element.querySelector('.window-body');
                app.render(body);
            }
            notify('🔄 ' + app.title + ' geöffnet', 'info');
        }

        function renderWindow(win) {
            var el = document.createElement('div');
            el.id = win.id;
            el.className = 'window';
            el.style.left = win.x + 'px';
            el.style.top = win.y + 'px';
            el.style.width = win.width + 'px';
            el.style.height = win.height + 'px';
            el.style.zIndex = win.zIndex;
            el.innerHTML =
                '<div class="window-header"><span class="window-title">' + win.icon + ' ' + win.title +
                '</span><div class="window-controls"><button class="win-btn close" data-action="close">✕</button></div></div><div class="window-body"></div>';
            DOM.appContainer.appendChild(el);
            win.element = el;
            el.querySelector('.win-btn').addEventListener('click', function() {
                closeWindow(win.id);
            });
            // Drag
            var header = el.querySelector('.window-header');
            var drag = false,
                startX, startY, origX, origY;
            header.addEventListener('mousedown', function(e) {
                if (e.target.closest('.win-btn')) return;
                drag = true;
                startX = e.clientX;
                startY = e.clientY;
                origX = win.x;
                origY = win.y;
                focusWindow(win.id);
                el.style.cursor = 'grabbing';
            });
            document.addEventListener('mousemove', function(e) {
                if (!drag) return;
                win.x = Math.max(0, origX + e.clientX - startX);
                win.y = Math.max(0, origY + e.clientY - startY);
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
            });
            document.addEventListener('mouseup', function() {
                if (drag) { drag = false;
                    el.style.cursor = ''; }
            });
        }

        function closeWindow(winId) {
            for (var i = 0; i < windows.length; i++) {
                if (windows[i].id === winId) {
                    if (windows[i].element) windows[i].element.remove();
                    windows.splice(i, 1);
                    break;
                }
            }
            if (activeWindow === winId) activeWindow = null;
        }

        function focusWindow(winId) {
            for (var i = 0; i < windows.length; i++) {
                if (windows[i].id === winId) {
                    activeWindow = winId;
                    windows[i].zIndex = windowZIndex++;
                    if (windows[i].element) {
                        windows[i].element.style.zIndex = windows[i].zIndex;
                    }
                }
            }
        }

        // ===== COSMIC WORLD (SIMPLIFIED) =====
        function initCosmic() {
            var canvas = DOM.cosmic;
            var ctx = canvas.getContext('2d');
            var W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // Sterne
            var stars = [];
            for (var i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.5 + 0.5,
                    speed: Math.random() * 0.015 + 0.005,
                    bright: Math.random() * 0.6 + 0.4,
                    phase: Math.random() * Math.PI * 2
                });
            }

            // Sonne
            var sun = { x: W / 2, y: H / 2, radius: 40, glow: 100, phase: 0 };

            // Planeten
            var planets = [];
            var planetData = [
                { name: 'Merkur', r: 4, color: '#aaa', orbit: 50, speed: 0.03 },
                { name: 'Venus', r: 6, color: '#fa4', orbit: 75, speed: 0.022 },
                { name: 'Erde', r: 8, color: '#48f', orbit: 105, speed: 0.015 },
                { name: 'Mars', r: 5, color: '#f64', orbit: 135, speed: 0.012 },
                { name: 'Jupiter', r: 12, color: '#da7', orbit: 175, speed: 0.008 },
                { name: 'Saturn', r: 9, color: '#dc8', orbit: 215, speed: 0.006 },
                { name: 'Uranus', r: 8, color: '#8df', orbit: 255, speed: 0.0045 },
                { name: 'Neptun', r: 7, color: '#46f', orbit: 295, speed: 0.0035 },
                { name: 'Pluto', r: 3, color: '#cb9', orbit: 330, speed: 0.0025 },
                { name: 'HalDo-1', r: 6, color: '#f8d', orbit: 365, speed: 0.002 },
                { name: 'HalDo-2', r: 7, color: '#8fa', orbit: 400, speed: 0.0015 },
                { name: 'HalDo-3', r: 5, color: '#fa8', orbit: 435, speed: 0.001 }
            ];
            for (var p = 0; p < planetData.length; p++) {
                var pd = planetData[p];
                planets.push({
                    name: pd.name,
                    r: pd.r,
                    color: pd.color,
                    orbit: pd.orbit,
                    speed: pd.speed,
                    angle: Math.random() * Math.PI * 2,
                    cx: W / 2,
                    cy: H / 2
                });
            }
            var moon = { x: 0, y: 0, r: 3, color: '#ccc', orbit: 18, speed: 0.08, angle: 0, ex: 0, ey: 0 };

            function animate() {
                var time = Date.now() / 2000;
                ctx.clearRect(0, 0, W, H);
                var grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.8);
                grad.addColorStop(0, '#0a0a2a');
                grad.addColorStop(0.6, '#050515');
                grad.addColorStop(1, '#000005');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                for (var s = 0; s < stars.length; s++) {
                    var st = stars[s];
                    st.y += st.speed;
                    if (st.y > H) { st.y = 0;
                        st.x = Math.random() * W; }
                    var b = st.bright * (0.6 + 0.4 * Math.sin(time + st.phase));
                    ctx.globalAlpha = b;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                sun.phase += 0.02;
                var pulse = 1 + 0.05 * Math.sin(sun.phase);
                var r = sun.radius * pulse;
                for (var g = 5; g > 0; g--) {
                    var gr = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * g * 0.15);
                    gr.addColorStop(0, 'rgba(255,220,68,' + (0.05 / g) + ')');
                    gr.addColorStop(1, 'rgba(255,220,68,0)');
                    ctx.fillStyle = gr;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, sun.glow * g * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                }
                var sg = ctx.createRadialGradient(sun.x - r * 0.3, sun.y - r * 0.3, 0, sun.x, sun.y, r);
                sg.addColorStop(0, '#ffeeaa');
                sg.addColorStop(0.4, '#ffdd44');
                sg.addColorStop(0.8, '#ff8800');
                sg.addColorStop(1, '#ff4400');
                ctx.fillStyle = sg;
                ctx.shadowColor = '#ffdd44';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold ' + (r * 0.45) + 'px system-ui, sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillText('⟡', sun.x, sun.y - r * 0.05);

                for (var pl = 0; pl < planets.length; pl++) {
                    var p2 = planets[pl];
                    p2.angle += p2.speed;
                    var px = p2.cx + Math.cos(p2.angle) * p2.orbit;
                    var py = p2.cy + Math.sin(p2.angle) * p2.orbit;
                    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([2, 4]);
                    ctx.beginPath();
                    ctx.arc(p2.cx, p2.cy, p2.orbit, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.shadowColor = p2.color;
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = p2.color;
                    ctx.beginPath();
                    ctx.arc(px, py, p2.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.font = '5px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(p2.name, px, py + p2.r + 2);
                    if (p2.name === 'Erde') { moon.ex = px;
                        moon.ey = py; }
                }
                if (moon.ex !== undefined) {
                    moon.angle += moon.speed;
                    moon.x = moon.ex + Math.cos(moon.angle) * moon.orbit;
                    moon.y = moon.ey + Math.sin(moon.angle) * moon.orbit;
                    ctx.shadowColor = '#ccc';
                    ctx.shadowBlur = 4;
                    ctx.fillStyle = '#ccc';
                    ctx.beginPath();
                    ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.font = '4px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText('🌙', moon.x, moon.y + moon.r + 2);
                }
                var now = new Date();
                var hh = String(now.getHours()).padStart(2, '0');
                var mm = String(now.getMinutes()).padStart(2, '0');
                var ss = String(now.getSeconds()).padStart(2, '0');
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText('🕐 ' + hh + ':' + mm + ':' + ss, 12, H - 40);
                requestAnimationFrame(animate);
            }
            animate();

            // Klick auf Sonne
            canvas.addEventListener('click', function(e) {
                var rect = canvas.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var dx = x - sun.x,
                    dy = y - sun.y;
                if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 1.5) {
                    launchApp('ai');
                    notify('☀️ HalDo AI geöffnet!');
                }
            });
        }

        // ===== APPS =====
        var apps = {};

        function registerApp(id, config) {
            apps[id] = { id: id, title: config.title, icon: config.icon, render: config.render };
        }

        // ===== AI APP =====
        registerApp('ai', {
            title: 'HalDo AI',
            icon: '🤖',
            render: function(body) {
                body.innerHTML =
                    '<div style="display:flex;flex-direction:column;height:100%;gap:6px;">' +
                    '<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;background:rgba(0,212,255,0.05);border-radius:6px;">' +
                    '<div style="font-size:1.2rem;">🧠</div>' +
                    '<div style="font-weight:600;font-size:0.7rem;">HalDo AI</div>' +
                    '<button id="ai-voice-btn" style="margin-left:auto;background:none;border:none;color:#8899bb;font-size:1rem;cursor:pointer;">🎤</button>' +
                    '</div>' +
                    '<div style="flex:1;overflow-y:auto;background:rgba(0,0,0,0.15);border-radius:6px;padding:6px;max-height:160px;" id="ai-chat">' +
                    '<div style="color:#8899bb;text-align:center;font-size:0.7rem;padding:12px 0;">💬 Hallo! Ich bin HalDo. Frage mich alles!</div></div>' +
                    '<div style="display:flex;gap:4px;"><input type="text" id="ai-input" placeholder="Frage oder Befehl ..." class="input-field" style="font-size:0.7rem;" /><button id="ai-send" class="btn-primary">Senden</button></div>' +
                    '<div style="display:flex;gap:4px;flex-wrap:wrap;"><span class="chip ai-q" data-cmd="Öffne Fahrschule">🚗 Fahrschule</span><span class="chip ai-q" data-cmd="Öffne Notizen">📝 Notizen</span><span class="chip ai-q" data-cmd="Hilfe">❓ Hilfe</span></div>' +
                    '<div class="section-divider">🤖 HalDo AI · Groq verbunden</div></div>';

                var chat = body.querySelector('#ai-chat');
                var input = body.querySelector('#ai-input');
                var sendBtn = body.querySelector('#ai-send');

                function addMsg(role, text) {
                    var d = document.createElement('div');
                    d.style.cssText = 'padding:4px 8px;margin:2px 0;border-radius:4px;font-size:0.7rem;' +
                        (role === 'user' ? 'background:rgba(0,212,255,0.08);text-align:right;' :
                            'background:rgba(123,47,252,0.08);');
                    d.textContent = (role === 'user' ? '👤 ' : '🤖 ') + text;
                    chat.appendChild(d);
                    chat.scrollTop = chat.scrollHeight;
                }

                function process(cmd) {
                    if (!cmd.trim()) return;
                    addMsg('user', cmd);
                    // Simuliere Antwort
                    var responses = [
                        'Das ist eine gute Frage! Ich denke, die Antwort lautet: Ja, das ist möglich.',
                        'Interessant! Erzähl mir mehr darüber.',
                        'Ich verstehe. Was möchtest du genau wissen?',
                        'Lass mich überlegen... Ja, das kann ich dir erklären.',
                        'Groq AI ist verbunden und bereit! Was kann ich für dich tun?',
                        'Ich habe deine Anfrage verstanden. Hier ist meine Antwort: ...'
                    ];
                    setTimeout(function() {
                        addMsg('ai', responses[Math.floor(Math.random() * responses.length)]);
                    }, 600 + Math.random() * 400);
                }

                sendBtn.addEventListener('click', function() {
                    var v = input.value.trim();
                    if (v) { process(v);
                        input.value = ''; }
                });

                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') sendBtn.click();
                });

                body.querySelectorAll('.ai-q').forEach(function(b) {
                    b.addEventListener('click', function() {
                        input.value = b.dataset.cmd;
                        sendBtn.click();
                    });
                });

                // Voice
                var voiceBtn = body.querySelector('#ai-voice-btn');
                if (voiceBtn) {
                    voiceBtn.addEventListener('click', function() {
                        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in
                            window)) {
                            notify('❌ Sprachsteuerung nicht unterstützt', 'error');
                            return;
                        }
                        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                        var recognition = new SR();
                        recognition.lang = 'de-DE';
                        recognition.onresult = function(e) {
                            var text = e.results[0][0].transcript;
                            input.value = text;
                            sendBtn.click();
                        };
                        recognition.start();
                        notify('🎤 Höre zu ...', 'info');
                    });
                }
            }
        });

        // ===== FAHRSCHULE APP =====
        registerApp('fahrschule', {
            title: 'Fahrschule',
            icon: '🚗',
            render: function(body) {
                body.innerHTML =
                    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;text-align:center;padding:12px;">' +
                    '<div style="font-size:2.5rem;">🚗</div>' +
                    '<h3 style="font-size:0.8rem;">🚦 Fahrschule</h3>' +
                    '<p style="color:#8899bb;font-size:0.65rem;">Lerne alles rund ums Autofahren</p>' +
                    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;max-width:240px;">' +
                    '<button onclick="notify(\'🚦 Verkehrsregeln geladen\',\'success\')" class="btn-primary" style="padding:8px;font-size:0.55rem;">🚦 Regeln</button>' +
                    '<button onclick="notify(\'🛑 Schilder geladen\',\'success\')" class="btn-primary" style="padding:8px;font-size:0.55rem;">🛑 Schilder</button>' +
                    '<button onclick="notify(\'🚗 Übung startet\',\'success\')" class="btn-primary" style="padding:8px;font-size:0.55rem;">🚗 Übung</button>' +
                    '<button onclick="notify(\'📝 Prüfung startet\',\'success\')" class="btn-primary" style="padding:8px;font-size:0.55rem;">📝 Prüfung</button></div>' +
                    '<div class="section-divider">🚗 Fahrschule · 12 Lektionen</div></div>';
            }
        });

        // ===== NOTIZEN APP =====
        registerApp('notes', {
            title: 'Notizen',
            icon: '📝',
            render: function(body) {
                var notes = JSON.parse(localStorage.getItem('haldo_notes') || '[]');
                var html =
                    '<div style="display:flex;flex-direction:column;height:100%;gap:4px;">' +
                    '<div style="display:flex;gap:4px;"><input type="text" id="note-input" placeholder="📝 Neue Notiz ..." class="input-field" style="font-size:0.65rem;" /><button id="note-add" class="btn-primary">➕</button></div>' +
                    '<div id="note-list" style="flex:1;overflow-y:auto;font-size:0.6rem;">';
                for (var i = 0; i < notes.length; i++) {
                    html +=
                        '<div style="display:flex;justify-content:space-between;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,0.02);"><span>' +
                        notes[i] +
                        '</span><button class="note-del" data-idx="' + i +
                        '" style="background:none;border:none;color:#ff4444;cursor:pointer;">✕</button></div>';
                }
                html +=
                    '</div><div class="section-divider">📝 ' + notes.length +
                    ' Notizen · Lokal gespeichert</div></div>';
                body.innerHTML = html;

                var input = body.querySelector('#note-input');
                var addBtn = body.querySelector('#note-add');

                function renderNotes() {
                    var list = body.querySelector('#note-list');
                    list.innerHTML = '';
                    for (var i = 0; i < notes.length; i++) {
                        var div = document.createElement('div');
                        div.style.cssText =
                            'display:flex;justify-content:space-between;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,0.02);';
                        div.innerHTML = '<span>' + notes[i] +
                            '</span><button class="note-del" data-idx="' + i +
                            '" style="background:none;border:none;color:#ff4444;cursor:pointer;">✕</button>';
                        list.appendChild(div);
                    }
                    list.querySelectorAll('.note-del').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var idx = parseInt(this.dataset.idx);
                            notes.splice(idx, 1);
                            localStorage.setItem('haldo_notes', JSON.stringify(notes));
                            renderNotes();
                        });
                    });
                    var counter = body.querySelector('.section-divider');
                    if (counter) counter.textContent = '📝 ' + notes.length +
                        ' Notizen · Lokal gespeichert';
                }

                addBtn.addEventListener('click', function() {
                    var val = input.value.trim();
                    if (!val) return;
                    notes.push(val);
                    localStorage.setItem('haldo_notes', JSON.stringify(notes));
                    input.value = '';
                    renderNotes();
                    notify('📝 Notiz gespeichert', 'success');
                });

                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') addBtn.click();
                });
                renderNotes();
            }
        });

        // ===== COSMIC APP =====
        registerApp('cosmic', {
            title: 'Cosmic World',
            icon: '🌌',
            render: function(body) {
                body.innerHTML =
                    '<div style="text-align:center;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;">' +
                    '<div style="font-size:2.5rem;">🌌</div>' +
                    '<h3 style="margin:4px 0;font-size:0.8rem;">Cosmic World</h3>' +
                    '<p style="color:#8899bb;font-size:0.6rem;">Sonne · 12 Planeten · Mond · Sterne</p>' +
                    '<div style="margin-top:8px;font-size:0.5rem;color:#8899bb;background:rgba(255,255,255,0.03);padding:6px 12px;border-radius:6px;">☀️ Klicke auf die Sonne für AI</div>' +
                    '<div style="font-size:0.4rem;color:#8899bb;margin-top:8px;">✨ ' +
                    new Date().toLocaleDateString('de-DE') + '</div></div>';
            }
        });

        // ===== APP WORLD =====
        registerApp('appworld', {
            title: 'App World',
            icon: '📱',
            render: function(body) {
                var list = [];
                for (var key in apps) {
                    list.push({ id: key, title: apps[key].title, icon: apps[key].icon });
                }
                var html = '<h3 style="margin-bottom:6px;font-size:0.75rem;">📱 ' + list.length +
                    ' Apps</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;">';
                for (var i = 0; i < list.length; i++) {
                    var a = list[i];
                    html +=
                        '<div style="background:rgba(255,255,255,0.03);padding:6px;border-radius:4px;text-align:center;cursor:pointer;" onclick="launchApp(\'' +
                        a.id + '\')"><div style="font-size:1.4rem;">' + a.icon +
                        '</div><div style="font-size:0.45rem;color:#8899bb;">' + a.title +
                        '</div></div>';
                }
                html += '<div class="section-divider">📱 ' + list.length + ' Apps · HalDo OS ' + CONFIG
                    .version + '</div>';
                body.innerHTML = html;
            }
        });

        // ===== SETTINGS =====
        registerApp('settings', {
            title: 'Einstellungen',
            icon: '⚙️',
            render: function(body) {
                body.innerHTML =
                    '<h3 style="margin-bottom:6px;font-size:0.8rem;">⚙️ Einstellungen</h3><div style="display:flex;flex-direction:column;gap:6px;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.02);"><span style="font-size:0.65rem;color:#8899bb;">🌐 Sprache</span><select style="padding:4px 8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);border-radius:4px;color:#fff;font-size:0.65rem;"><option value="de">🇩🇪 Deutsch</option><option value="en">🇬🇧 English</option><option value="ku">🇰🇲 Kurmancî</option></select></div>' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.02);"><span style="font-size:0.65rem;color:#8899bb;">🎤 Sprachsteuerung</span><input type="checkbox" checked style="accent-color:#00d4ff;width:16px;height:16px;cursor:pointer;" /></div>' +
                    '<button onclick="notify(\'✅ Einstellungen gespeichert\',\'success\')" class="btn-primary">💾 Speichern</button>' +
                    '<div class="section-divider">⚙️ HalDo OS ' + CONFIG.version + ' · ' + Object.keys(apps)
                    .length + ' Apps</div></div>';
            }
        });

        // ================================================================
        //  BOOT SEQUENCE
        // ================================================================
        function bootSequence() {
            var steps = [
                { text: '⟡ Kernel wird geladen ...', progress: 10 },
                { text: '⟡ System initialisiert ...', progress: 25 },
                { text: '⟡ Cosmic World startet ...', progress: 45 },
                { text: '⟡ HalDo AI wird aktiviert ...', progress: 65 },
                { text: '⟡ ' + Object.keys(apps).length + ' Apps geladen ...', progress: 85 },
                { text: '⟡ HalDo OS ' + CONFIG.version + ' ist READY 🚀', progress: 100 }
            ];

            var i = 0;
            DOM.status.textContent = steps[0].text;
            DOM.progress.style.width = '2%';
            DOM.progressText.textContent = '2%';

            var interval = setInterval(function() {
                i++;
                if (i < steps.length) {
                    DOM.status.textContent = steps[i].text;
                    DOM.progress.style.width = steps[i].progress + '%';
                    DOM.progressText.textContent = steps[i].progress + '%';
                } else {
                    clearInterval(interval);
                    setTimeout(function() {
                        DOM.intro.classList.add('hidden');
                        notify('🚀 HalDo OS ' + CONFIG.version + ' gestartet!', 'success');
                        setTimeout(function() { launchApp('ai'); }, 400);
                        setTimeout(function() { launchApp('cosmic'); }, 700);
                        console.log('✅ HalDo OS ' + CONFIG.version + ' — SIMPLIFIED EDITION');
                        console.log('📱 ' + Object.keys(apps).length + ' Apps geladen');
                    }, 400);
                }
            }, 380);
        }

        // ================================================================
        //  SYSTEM INIT
        // ================================================================

        function updateClock() {
            var now = new Date();
            DOM.clock.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }

        function initDock() {
            var items = DOM.dock.querySelectorAll('.dock-item');
            for (var i = 0; i < items.length; i++) {
                (function(btn) {
                    btn.addEventListener('click', function() {
                        var app = btn.dataset.app;
                        if (app) launchApp(app);
                    });
                })(items[i]);
            }
        }

        function initMenus() {
            document.getElementById('menu-apps').addEventListener('click', function() { launchApp('appworld'); });
            document.getElementById('menu-ai').addEventListener('click', function() { launchApp('ai'); });
            document.getElementById('menu-fahrschule').addEventListener('click', function() { launchApp(
                'fahrschule'); });
            document.getElementById('menu-system').addEventListener('click', function() { launchApp('settings'); });
            document.getElementById('menu-help').addEventListener('click', function() {
                notify('❓ Hilfe: Sag "Öffne Fahrschule" oder klicke auf die Apps');
            });
            document.getElementById('btn-about').addEventListener('click', function() {
                notify('⟡ HalDo OS ' + CONFIG.version + '\n💙❤️🚀 ' + Object.keys(apps).length +
                    ' Apps\n✅ Groq AI bereit\n🚗 Fahrschule funktioniert!');
            });
        }

        // ================================================================
        //  MAIN INIT
        // ================================================================

        function init() {
            console.log('⟡ HalDo OS ' + CONFIG.version + ' — SIMPLIFIED EDITION');
            console.log('📱 ' + Object.keys(apps).length + ' Apps registriert');

            initCosmic();
            updateClock();
            setInterval(updateClock, 10000);
            initDock();
            initMenus();

            // HalDo global
            window.HalDo = {
                CONFIG: CONFIG,
                launchApp: launchApp,
                notify: notify,
                get apps() { return apps; }
            };
            window.notify = notify;
            window.launchApp = launchApp;

            bootSequence();
            console.log('✅ System bereit!');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

</body>
</html>
