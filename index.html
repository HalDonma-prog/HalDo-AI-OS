<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HalDo OS 24 – Master Version</title>
    <style>
        /* ==============================================================
           HALDO OS 24 – MASTER CSS (KOMPLETT)
           ============================================================== */

        /* ----- RESET ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-window: rgba(16, 16, 40, 0.94);
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #e8eef5;
            --text-secondary: #8899bb;
            --text-muted: #556688;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.04);
            --accent-1: #00d4ff;
            --accent-2: #7b2ffc;
            --accent-3: #ff6b6b;
            --shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            --radius: 12px;
            --radius-sm: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        html,
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* ----- SCROLLBARS ----- */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ----- BOOT SCREEN ----- */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #boot.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #boot .logo {
            font-size: 3.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 2px;
        }
        #boot .subtitle {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        #boot .loader {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid var(--accent-1);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #boot-status {
            font-size: 0.7rem;
            color: var(--text-secondary);
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }
        #boot .progress {
            width: 160px;
            height: 2px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 2px;
            margin-top: 14px;
            overflow: hidden;
        }
        #boot .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* ----- COSMIC CANVAS ----- */
        #cosmic {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: auto;
            display: block;
        }

        /* ----- MENU BAR ----- */
        #menu-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            z-index: 2000;
            background: rgba(10, 10, 26, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.7rem;
        }
        #menu-bar .menu-item {
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        #menu-bar .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        #menu-bar .menu-left {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        #menu-bar .logo-text {
            font-weight: 700;
            font-size: 0.85rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 4px;
        }
        #menu-bar .menu-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #menu-bar .clock {
            color: var(--text-secondary);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }
        #menu-bar .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #44ff88;
            display: inline-block;
            margin-right: 4px;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        #menu-bar .status-text {
            font-size: 0.5rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* ----- APP CONTAINER ----- */
        #app-container {
            position: fixed;
            inset: 36px 0 58px 0;
            z-index: 10;
            pointer-events: none;
        }
        #app-container .window {
            position: absolute;
            pointer-events: auto;
            background: var(--bg-window);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-width: 180px;
            min-height: 120px;
            overflow: hidden;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }
        #app-container .window.active {
            box-shadow: 0 16px 56px rgba(0, 180, 255, 0.08);
            border-color: rgba(0, 180, 255, 0.12);
        }
        #app-container .window.minimized {
            display: none;
        }

        .window-header {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            cursor: grab;
            flex-shrink: 0;
            min-height: 34px;
            user-select: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .window-title .icon {
            font-size: 0.9rem;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }
        .window-controls .win-btn {
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            font-size: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            transition: all var(--transition);
            line-height: 1;
        }
        .window-controls .win-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .window-controls .win-btn.close:hover {
            background: #ff4444;
            color: #fff;
        }
        .window-controls .win-btn.maximize:hover {
            background: rgba(68, 255, 136, 0.15);
            color: #44ff88;
        }
        .window-controls .win-btn.minimize:hover {
            background: rgba(255, 204, 0, 0.15);
            color: #ffcc00;
        }

        .window-body {
            flex: 1;
            padding: 10px 12px;
            overflow: auto;
            font-size: 0.7rem;
            color: var(--text-primary);
            min-height: 60px;
            -webkit-overflow-scrolling: touch;
        }

        /* ----- DOCK ----- */
        #dock {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 6px 12px;
            display: flex;
            gap: 4px;
            align-items: center;
            pointer-events: auto;
            max-width: 94vw;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dock-item {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .dock-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-4px);
        }
        .dock-item:active {
            transform: translateY(0px) scale(0.92);
        }
        .dock-item .label {
            position: absolute;
            bottom: -20px;
            font-size: 0.45rem;
            color: var(--text-secondary);
            white-space: nowrap;
            opacity: 0;
            transition: opacity var(--transition);
            pointer-events: none;
        }
        .dock-item:hover .label {
            opacity: 1;
        }
        .dock-divider {
            width: 1px;
            height: 28px;
            background: var(--border-color);
            margin: 0 3px;
        }

        /* ----- NOTIFICATION ----- */
        #notification {
            position: fixed;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            z-index: 9999;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-1);
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 0.75rem;
            color: var(--text-primary);
            max-width: 88vw;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            white-space: pre-line;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 500px) {
            #menu-bar .menu-item {
                font-size: 0.55rem;
                padding: 2px 6px;
            }
            #menu-bar .logo-text {
                font-size: 0.7rem;
            }
            #menu-bar .clock {
                font-size: 0.55rem;
            }
            #menu-bar .status-text {
                display: none;
            }
            #dock {
                padding: 4px 8px;
                gap: 3px;
                border-radius: 14px;
            }
            .dock-item {
                width: 34px;
                height: 34px;
                font-size: 0.95rem;
                border-radius: 8px;
            }
            .window-header {
                padding: 4px 8px;
                min-height: 28px;
            }
            .window-title {
                font-size: 0.6rem;
            }
            .window-body {
                font-size: 0.6rem;
                padding: 6px 8px;
            }
            #notification {
                font-size: 0.65rem;
                padding: 8px 14px;
                bottom: 64px;
            }
            #boot .logo {
                font-size: 2.4rem;
            }
            #boot .subtitle {
                font-size: 0.55rem;
                letter-spacing: 4px;
            }
        }

        @media (max-width: 380px) {
            .dock-item {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
                border-radius: 6px;
            }
            #menu-bar .menu-item {
                font-size: 0.5rem;
                padding: 2px 4px;
            }
            #menu-bar .logo-text {
                font-size: 0.6rem;
            }
            .window-controls .win-btn {
                width: 16px;
                height: 16px;
                font-size: 0.4rem;
            }
        }

        /* ----- SAFARI FIXES ----- */
        @supports (-webkit-touch-callout: none) {
            #menu-bar,
            #dock,
            #app-container .window,
            #notification {
                -webkit-backdrop-filter: blur(18px);
            }
        }

        /* ----- UTILITY ----- */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-1 {
            gap: 4px;
        }
        .gap-2 {
            gap: 8px;
        }
        .text-muted {
            color: var(--text-secondary);
        }
        .text-xs {
            font-size: 0.55rem;
        }
        .text-sm {
            font-size: 0.65rem;
        }
        .text-base {
            font-size: 0.75rem;
        }
        .font-bold {
            font-weight: 700;
        }
        .w-full {
            width: 100%;
        }
        .rounded {
            border-radius: var(--radius-sm);
        }

        /* ----- APP-SPECIFIC ----- */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 6px;
        }
        .app-grid-item {
            background: var(--bg-card);
            padding: 8px 4px;
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid transparent;
        }
        .app-grid-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-light);
        }
        .app-grid-item .icon {
            font-size: 1.4rem;
        }
        .app-grid-item .name {
            font-size: 0.45rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            font-size: 0.65rem;
            margin-bottom: 3px;
        }
        .list-item .text {
            word-break: break-word;
        }
        .list-item .del-btn {
            background: none;
            border: none;
            color: var(--accent-3);
            cursor: pointer;
            font-size: 0.6rem;
            padding: 2px 6px;
        }
        .list-item .del-btn:hover {
            color: #ff4444;
        }

        .input-field {
            flex: 1;
            font-size: 0.65rem;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            outline: none;
            transition: border-color var(--transition);
        }
        .input-field:focus {
            border-color: var(--accent-1);
        }
        .input-field::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            padding: 5px 12px;
            font-size: 0.65rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            cursor: pointer;
            transition: opacity var(--transition);
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .btn-secondary {
            padding: 4px 10px;
            font-size: 0.6rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        .chip {
            padding: 3px 10px;
            font-size: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .chip:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .section-divider {
            font-size: 0.4rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 4px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- ===== BOOT SCREEN ===== -->
    <div id="boot">
        <div class="loader"></div>
        <div class="logo">⟡ HalDo</div>
        <div class="subtitle">AI Operating System</div>
        <div id="boot-status">⟡ System wird gestartet ...</div>
        <div class="progress">
            <div class="progress-bar" id="boot-progress"></div>
        </div>
    </div>

    <!-- ===== COSMIC CANVAS ===== -->
    <canvas id="cosmic"></canvas>

    <!-- ===== MENU BAR ===== -->
    <div id="menu-bar">
        <div class="menu-left">
            <span class="logo-text">⟡ HalDo</span>
            <span class="menu-item" id="menu-apps">📱 Apps</span>
            <span class="menu-item" id="menu-ai">🤖 AI</span>
            <span class="menu-item" id="menu-fahrschule">🚗 Fahrschule</span>
            <span class="menu-item" id="menu-system">⚙️ System</span>
            <span class="menu-item" id="menu-help">❓ Hilfe</span>
        </div>
        <div class="menu-right">
            <span class="status-text"><span class="status-dot"></span>Online</span>
            <span class="clock" id="clock-display">--:--</span>
        </div>

    <!-- ===== APP CONTAINER ===== -->
    <div id="app-container"></div>

    <!-- ===== DOCK ===== -->
    <div id="dock">
        <button class="dock-item" data-app="ai" title="HalDo AI">🤖</button>
        <button class="dock-item" data-app="fahrschule" title="Fahrschule">🚗</button>
        <button class="dock-item" data-app="notes" title="Notizen">📝</button>
        <button class="dock-item" data-app="tasks" title="Aufgaben">✅</button>
        <button class="dock-item" data-app="cosmic" title="Cosmic World">🌌</button>
        <div class="dock-divider"></div>
        <button class="dock-item" data-app="appworld" title="App World">📱</button>
        <button class="dock-item" data-app="settings" title="Einstellungen">⚙️</button>

        <button class="dock-item" id="btn-about" title="Info">💙</button>
    </div>

    <!-- ===== NOTIFICATION ===== -->
    <div id="notification"></div>

    <!-- ================================================================
    JAVASCRIPT – HALDO OS 24 MASTER
    ================================================================ -->
    <script>
        'use strict';

        // ================================================================
        //  HALDO OS 24 – MASTER VERSION
        //  Version: 24.2.0
        //  Build: 2026-08-31
        //  Alle Funktionen integriert
        // ================================================================

        (function() {
            'use strict';

            // ============================================================
            //  KONFIGURATION
            // ============================================================
            var CONFIG = {
                version: '24.2.0',
                build: '2026.08.31',
                kernel: '5.3.0',
                apiKey: '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',
                apiUrl: 'https://api.groq.com/openai/v1/chat/completions',
                model: 'llama3-70b-8192',
                language: 'de',
                maxHistory: 50,
                notificationDuration: 3000,
                appCategories: ['core', 'productivity', 'learning', 'entertainment', 'system', 'communication']
            };

            // ============================================================
            //  STATE
            // ============================================================
            var state = {
                apps: {},
                windows: [],
                windowZIndex: 100,
                activeWindow: null,
                settings: {
                    theme: 'dark',
                    language: 'de',
                    voiceEnabled: true,
                    notifications: true,
                    voiceGender: 'male',
                    autoStartAI: true,
                    showDockLabels: false
                },
                system: {
                    started: Date.now(),
                    uptime: 0,
                    version: CONFIG.version,
                    build: CONFIG.build,
                    kernel: CONFIG.kernel,
                    bootTime: 0,
                    appLaunches: 0
                },
                notes: JSON.parse(localStorage.getItem('haldo_notes') || '[]'),
                contacts: JSON.parse(localStorage.getItem('haldo_contacts') || '[]'),
                tasks: JSON.parse(localStorage.getItem('haldo_tasks') || '[]'),
                documents: JSON.parse(localStorage.getItem('haldo_documents') || '[]'),
                aiMemory: JSON.parse(localStorage.getItem('haldo_ai_memory') || '[]'),
                conversationHistory: JSON.parse(localStorage.getItem('haldo_conversations') || '[]'),
                isBooted: false,
                isReady: false
            };

            // ============================================================
            //  DOM-REFERENZEN
            // ============================================================
            var DOM = {
                boot: document.getElementById('boot'),
                bootStatus: document.getElementById('boot-status'),
                bootProgress: document.getElementById('boot-progress'),
                cosmic: document.getElementById('cosmic'),
                appContainer: document.getElementById('app-container'),
                dock: document.getElementById('dock'),
                notification: document.getElementById('notification'),
                clock: document.getElementById('clock-display')
            };

            // ============================================================
            //  HELPER
            // ============================================================
            function $(id) { return document.getElementById(id); }

            function now() { return Date.now(); }

            function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

            function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 4); }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function truncate(text, max) {
                if (text.length <= max) return text;
                return text.substr(0, max) + '…';

            // ============================================================
            //  VOICE ENGINE
            // ============================================================
            var Voice = {
                isListening: false,
                recognition: null,
                synthesis: window.speechSynthesis,
                isSupported: false,

                init: function() {
                    var hasRecognition = ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window);
                    var hasSynthesis = ('speechSynthesis' in window);

                    if (hasRecognition) {
                        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                        this.recognition = new SR();
                        this.recognition.lang = 'de-DE';
                        this.recognition.continuous = false;
                        this.recognition.interimResults = false;
                        this.recognition.onresult = this._onResult.bind(this);
                        this.recognition.onerror = this._onError.bind(this);
                        this.recognition.onend = this._onEnd.bind(this);
                        this.isSupported = true;
                        console.log('[Voice] Speech Recognition bereit');
                    }

                    if (hasSynthesis) {
                        console.log('[Voice] Speech Synthesis bereit');
                    }

                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        navigator.mediaDevices.getUserMedia({ audio: true })
                            .then(function(stream) {
                                stream.getTracks().forEach(function(t) { t.stop(); });
                                console.log('[Voice] Mikrofon-Zugriff gewährt');
                            })
                            .catch(function() {
                                console.log('[Voice] Mikrofon-Zugriff verweigert');
                            });
                    }
                },

                startListening: function() {
                    if (!this.recognition) {
                        Notify.error('Sprachsteuerung nicht unterstützt');
                        return;
                    }
                    if (this.isListening) {
                        this.recognition.stop();
                        return;
                    }
                    try {
                        this.recognition.start();
                        this.isListening = true;
                        Notify.info('🎤 Höre zu ...');
                        this._updateStatus('listening', '🎤 hört zu ...');
                    } catch (e) {
                        Notify.error('Mikrofon konnte nicht gestartet werden');
                    }
                },

                _onResult: function(event) {
                    var text = event.results[0][0].transcript;
                    this.isListening = false;
                    Notify.success('🎤 "' + text + '"');
                    this._updateStatus('thinking', '🧠 denkt ...');

                    var cmd = AI._parseCommand(text);
                    if (cmd && cmd.action === 'open') {
                        if (state.apps[cmd.app]) {
                            launchApp(cmd.app);
                            Notify.success(state.apps[cmd.app].title + ' geöffnet!');
                            this._updateStatus('idle', '● bereit');
                            this.speak(state.apps[cmd.app].title + ' wurde geöffnet!');
                            return;
                        }
                    }

                    var input = document.getElementById('ai-input');
                    if (input) {
                        input.value = text;
                        var sendBtn = document.getElementById('ai-send');
                        if (sendBtn) sendBtn.click();
                    } else {
                        AI.ask(text, CONFIG.language).then(function(response) {
                            Notify.info(response);
                            if (state.settings.voiceEnabled) {
                                Voice.speak(response);
                            }
                        });
                    }
                },

                _onError: function(event) {
                    this.isListening = false;
                    this._updateStatus('idle', '● bereit');
                    if (event.error === 'not-allowed') {
                        Notify.error('Mikrofon-Zugriff verweigert.');
                    } else if (event.error === 'no-speech') {
                        // Stille ignorieren
                    } else {
                        console.log('[Voice] Fehler:', event.error);
                    }
                },

                _onEnd: function() {
                    this.isListening = false;
                    this._updateStatus('idle', '● bereit');
                },

                speak: function(text, language) {
                    if (!state.settings.voiceEnabled) return;
                    language = language || 'de-DE';
                    if (!('speechSynthesis' in window)) return;
                    if (this.synthesis.speaking) {
                        this.synthesis.cancel();
                    }
                    var utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = language;
                    utterance.rate = 0.9;
                    utterance.pitch = 1.0;
                    utterance.volume = 1;
                    this.synthesis.speak(utterance);
                },

                _updateStatus: function(status, text) {
                    var el = document.getElementById('ai-state');
                    if (el) {
                        el.textContent = text || '● bereit';
                        var colors = {
                            'thinking': '#ffcc00',
                            'listening': '#44aaff',
                            'idle': '#44ff88'
                        };
                        el.style.color = colors[status] || '#44ff88';
                    }
                }
            };

            // ============================================================
            //  WINDOW MANAGER
            // ============================================================
            var WindowManager = {
                getSafePosition: function() {
                    var vw = window.innerWidth,
                        vh = window.innerHeight;
                    var w = Math.min(460, vw - 30);
                    var h = Math.min(360, vh - 150);
                    return {
                        x: Math.max(10, (vw - w) / 2 + (Math.random() - 0.5) * 30),
                        y: Math.max(40, (vh - h) / 2 - 20 + (Math.random() - 0.5) * 30),
                        w: w,
                        h: h
                    };
                },

                launch: function(id) {
                    var app = state.apps[id];
                    if (!app) {
                        Notify.error('App "' + id + '" nicht gefunden');
                        return null;
                    }

                    // Bereits offen?
                    for (var i = 0; i < state.windows.length; i++) {
                        if (state.windows[i].appId === id) {
                            this._focus(state.windows[i].id);
                            return state.windows[i];
                        }
                    }

                    var pos = this.getSafePosition();
                    var winId = 'win-' + uid();
                    var win = {
                        id: winId,
                        appId: id,
                        title: app.title || id,
                        icon: app.icon || '📦',
                        x: pos.x,
                        y: pos.y,
                        width: pos.w,
                        height: pos.h,
                        zIndex: state.windowZIndex++,
                        element: null,
                        minimized: false,
                        _prev: {}
                    };

                    state.windows.push(win);
                    this._render(win);
                    this._focus(winId);

                    if (app.render) {
                        var body = win.element.querySelector('.window-body');
                        app.render(body, win);
                    }

                    state.system.appLaunches++;
                    Notify.info('🔄 ' + (app.title || id) + ' geöffnet');
                    return win;
                },

                _render: function(win) {
                    var existing = document.getElementById(win.id);
                    if (existing) existing.remove();

                    var el = document.createElement('div');
                    el.id = win.id;
                    el.className = 'window active';
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                    el.style.zIndex = win.zIndex;
                    el.dataset.appId = win.appId;

                    el.innerHTML =
                        '<div class="window-header">' +
                        '<span class="window-title"><span class="icon">' + win.icon + '</span>' + win.title +
                        '</span>' +
                        '<div class="window-controls">' +
                        '<button class="win-btn minimize" data-action="minimize">─</button>' +
                        '<button class="win-btn maximize" data-action="maximize">⧉</button>' +
                        '<button class="win-btn close" data-action="close">✕</button>' +
                        '</div>' +
                        '</div>' +
                        '<div class="window-body"></div>';

                    DOM.appContainer.appendChild(el);
                    win.element = el;

                    // Buttons
                    var btns = el.querySelectorAll('.win-btn');
                    for (var i = 0; i < btns.length; i++) {
                        (function(btn) {
                            btn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                var action = btn.dataset.action;
                                if (action === 'close') WindowManager.close(win.id);
                                else if (action === 'minimize') WindowManager.minimize(win.id);
                                else if (action === 'maximize') WindowManager.maximize(win.id);
                            });
                        })(btns[i]);
                    }

                    this._setupDrag(win, el);
                    this._setupResize(win, el);
                },

                _setupDrag: function(win, el) {
                    var header = el.querySelector('.window-header');
                    var drag = false,
                        startX, startY, origX, origY;

                    function startDrag(cx, cy) {
                        if (header.querySelector('.win-btn')) return;
                        drag = true;
                        startX = cx;
                        startY = cy;
                        origX = win.x;
                        origY = win.y;
                        WindowManager._focus(win.id);
                        el.style.cursor = 'grabbing';
                    }

                    function moveDrag(cx, cy) {
                        if (!drag) return;
                        var dx = cx - startX,
                            dy = cy - startY;
                        win.x = clamp(origX + dx, 0, window.innerWidth - win.width);
                        win.y = clamp(origY + dy, 0, window.innerHeight - win.height - 60);
                        el.style.left = win.x + 'px';
                        el.style.top = win.y + 'px';
                    }

                    function endDrag() {
                        if (drag) { drag = false;
                            el.style.cursor = ''; }
                    }

                    header.addEventListener('mousedown', function(e) {
                        if (!e.target.closest('.win-btn')) startDrag(e.clientX, e.clientY);
                    });
                    document.addEventListener('mousemove', function(e) { if (drag) moveDrag(e.clientX, e.clientY); });
                    document.addEventListener('mouseup', endDrag);

                    header.addEventListener('touchstart', function(e) {
                        var t = e.touches[0];
                        if (!e.target.closest('.win-btn')) startDrag(t.clientX, t.clientY);
                    }, { passive: true });
                    document.addEventListener('touchmove', function(e) {
                        if (drag) { var t = e.touches[0];
                            moveDrag(t.clientX, t.clientY); }
                    }, { passive: true });
                    document.addEventListener('touchend', endDrag, { passive: true });
                },

                _setupResize: function(win, el) {
                    var handle = document.createElement('div');
                    handle.style.cssText =
                        'position:absolute;bottom:0;right:0;width:20px;height:20px;cursor:se-resize;touch-action:none;';
                    el.appendChild(handle);

                    var resize = false,
                        startW, startH, startX2, startY2;

                    function startResize(cx, cy) {
                        resize = true;
                        startW = win.width;
                        startH = win.height;
                        startX2 = cx;
                        startY2 = cy;
                    }

                    function moveResize(cx, cy) {
                        if (!resize) return;
                        var dw = cx - startX2,
                            dh = cy - startY2;
                        win.width = clamp(startW + dw, 160, window.innerWidth - win.x - 10);
                        win.height = clamp(startH + dh, 100, window.innerHeight - win.y - 70);
                        el.style.width = win.width + 'px';
                        el.style.height = win.height + 'px';
                    }

                    function endResize() { resize = false; }

                    handle.addEventListener('mousedown', function(e) {
                        e.stopPropagation();
                        startResize(e.clientX, e.clientY);
                    });
                    document.addEventListener('mousemove', function(e) { if (resize) moveResize(e.clientX, e.clientY); });
                    document.addEventListener('mouseup', endResize);

                    handle.addEventListener('touchstart', function(e) {
                        var t = e.touches[0];
                        e.stopPropagation();
                        startResize(t.clientX, t.clientY);
                    }, { passive: true });
                    document.addEventListener('touchmove', function(e) {
                        if (resize) { var t = e.touches[0];
                            moveResize(t.clientX, t.clientY); }
                    }, { passive: true });
                    document.addEventListener('touchend', endResize, { passive: true });
                },

                close: function(winId) {
                    var idx = -1;
                    for (var i = 0; i < state.windows.length; i++) {
                        if (state.windows[i].id === winId) { idx = i; break; }
                    }
                    if (idx === -1) return;
                    var win = state.windows[idx];
                    if (win.element) win.element.remove();
                    state.windows.splice(idx, 1);
                    if (state.activeWindow === winId) state.activeWindow = null;
                    if (state.windows.length > 0) {
                        this._focus(state.windows[state.windows.length - 1].id);
                    }
                },

                minimize: function(winId) {
                    var win = this._find(winId);
                    if (!win) return;
                    win.minimized = !win.minimized;
                    if (win.element) {
                        win.element.classList.toggle('minimized', win.minimized);
                    }
                    Notify.info(win.minimized ? '⏬ ' + win.title + ' minimiert' : '🔄 ' + win.title + ' wiederhergestellt');
                },

                maximize: function(winId) {
                    var win = this._find(winId);
                    if (!win || !win.element) return;

                    if (win.width === window.innerWidth - 20) {
                        win.width = win._prev.w || 420;
                        win.height = win._prev.h || 320;
                        win.x = win._prev.x || 20;
                        win.y = win._prev.y || 40;
                    } else {
                        win._prev = { w: win.width, h: win.height, x: win.x, y: win.y };
                        win.width = window.innerWidth - 20;
                        win.height = window.innerHeight - 100;
                        win.x = 10;
                        win.y = 30;
                    }
                    win.element.style.width = win.width + 'px';
                    win.element.style.height = win.height + 'px';
                    win.element.style.left = win.x + 'px';
                    win.element.style.top = win.y + 'px';
                },

                _focus: function(winId) {
                    var win = this._find(winId);
                    if (!win) return;
                    state.activeWindow = winId;
                    win.zIndex = state.windowZIndex++;
                    if (win.element) {
                        win.element.style.zIndex = win.zIndex;
                        win.element.classList.add('active');
                        for (var i = 0; i < state.windows.length; i++) {
                            if (state.windows[i].id !== winId && state.windows[i].element) {
                                state.windows[i].element.classList.remove('active');
                            }
                        }
                    }
                },

                _find: function(winId) {
                    for (var i = 0; i < state.windows.length; i++) {
                        if (state.windows[i].id === winId) return state.windows[i];
                    }
                    return null;
                },

                closeAll: function() {
                    var ids = state.windows.map(function(w) { return w.id; });
                    for (var i = 0; i < ids.length; i++) {
                        this.close(ids[i]);
                    }
                    Notify.info('Alle Fenster geschlossen');
                }
            };

            var launchApp = WindowManager.launch.bind(WindowManager);
            var closeWindow = WindowManager.close.bind(WindowManager);
            var minimizeWindow = WindowManager.minimize.bind(WindowManager);
            var maximizeWindow = WindowManager.maximize.bind(WindowManager);

            function registerApp(id, config) {
                state.apps[id] = {

            // ============================================================
            //  COSMIC WORLD
            // ============================================================
            function initCosmic() {
                var canvas = DOM.cosmic;
                var ctx = canvas.getContext('2d');
                var W, H;

                function resize() {
                    W = canvas.width = window.innerWidth;
                    H = canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                var stars = [];
                for (var i = 0; i < 250; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 2 + 0.3,
                        speed: Math.random() * 0.015 + 0.005,
                        bright: Math.random() * 0.6 + 0.4,
                        phase: Math.random() * Math.PI * 2
                    });
                }

                var sun = { x: W / 2, y: H / 2, radius: 44, glow: 120, phase: 0 };

                var planets = [];
                var planetData = [
                    { name: 'Merkur', r: 4, color: '#b8b8b8', orbit: 50, speed: 0.035 },
                    { name: 'Venus', r: 6, color: '#e8a060', orbit: 75, speed: 0.025 },
                    { name: 'Erde', r: 8, color: '#4488ff', orbit: 105, speed: 0.018 },
                    { name: 'Mars', r: 5, color: '#e86040', orbit: 135, speed: 0.014 },
                    { name: 'Jupiter', r: 12, color: '#d4a060', orbit: 175, speed: 0.009 },
                    { name: 'Saturn', r: 9, color: '#d4b880', orbit: 215, speed: 0.007 },
                    { name: 'Uranus', r: 8, color: '#80d0f0', orbit: 255, speed: 0.005 },
                    { name: 'Neptun', r: 7, color: '#4060f0', orbit: 295, speed: 0.004 },
                    { name: 'Pluto', r: 3, color: '#c0a880', orbit: 330, speed: 0.003 },
                    { name: 'HalDo-1', r: 6, color: '#f080d0', orbit: 365, speed: 0.0022 },
                    { name: 'HalDo-2', r: 7, color: '#80f0a0', orbit: 400, speed: 0.0016 },
                    { name: 'HalDo-3', r: 5, color: '#f0a080', orbit: 435, speed: 0.0012 }
                ];

                for (var p = 0; p < planetData.length; p++) {
                    var pd = planetData[p];
                    planets.push({
                        name: pd.name,
                        r: pd.r,
                        color: pd.color,
                        orbit: pd.orbit,
                        speed: pd.speed,
                        angle: Math.random() * Math.PI * 2,
                        cx: W / 2,
                        cy: H / 2
                    });
                }

                var moon = { x: 0, y: 0, r: 3, color: '#ccc', orbit: 18, speed: 0.09, angle: 0, ex: 0, ey: 0 };

                function animate() {
                    var time = Date.now() / 2000;
                    ctx.clearRect(0, 0, W, H);

                    var grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.85);
                    grad.addColorStop(0, '#0a0a2a');
                    grad.addColorStop(0.6, '#050515');
                    grad.addColorStop(1, '#000005');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, H);

                    for (var s = 0; s < stars.length; s++) {
                        var st = stars[s];
                        st.y += st.speed;
                        if (st.y > H) { st.y = 0;
                            st.x = Math.random() * W; }
                        var b = st.bright * (0.5 + 0.5 * Math.sin(time + st.phase));
                        ctx.globalAlpha = b;
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;

                    sun.phase += 0.02;
                    var pulse = 1 + 0.05 * Math.sin(sun.phase);
                    var r = sun.radius * pulse;

                    for (var g = 6; g > 0; g--) {
                        var gr = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * g * 0.12);
                        gr.addColorStop(0, 'rgba(255,220,68,' + (0.04 / g) + ')');
                        gr.addColorStop(1, 'rgba(255,220,68,0)');
                        ctx.fillStyle = gr;
                        ctx.beginPath();
                        ctx.arc(sun.x, sun.y, sun.glow * g * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    var sg = ctx.createRadialGradient(sun.x - r * 0.3, sun.y - r * 0.3, 0, sun.x, sun.y, r);
                    sg.addColorStop(0, '#ffeeaa');
                    sg.addColorStop(0.3, '#ffdd44');
                    sg.addColorStop(0.7, '#ff8800');
                    sg.addColorStop(1, '#ff4400');
                    ctx.fillStyle = sg;
                    ctx.shadowColor = '#ffdd44';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = 'bold ' + (r * 0.5) + 'px system-ui, sans-serif';
                    ctx.shadowColor = 'rgba(255,255,255,0.3)';
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fillText('⟡', sun.x, sun.y - r * 0.05);
                    ctx.shadowBlur = 0;

                    for (var pl = 0; pl < planets.length; pl++) {
                        var p2 = planets[pl];
                        p2.angle += p2.speed;
                        var px = p2.cx + Math.cos(p2.angle) * p2.orbit;
                        var py = p2.cy + Math.sin(p2.angle) * p2.orbit;

                        ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([2, 5]);
                        ctx.beginPath();
                        ctx.arc(p2.cx, p2.cy, p2.orbit, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        ctx.shadowColor = p2.color;
                        ctx.shadowBlur = 8;
                        ctx.fillStyle = p2.color;
                        ctx.beginPath();
                        ctx.arc(px, py, p2.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        ctx.fillStyle = 'rgba(255,255,255,0.06)';
                        ctx.font = '5px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText(p2.name, px, py + p2.r + 3);

                        if (p2.name === 'Erde') { moon.ex = px;
                            moon.ey = py; }
                    }

                    if (moon.ex !== undefined) {
                        moon.angle += moon.speed;
                        moon.x = moon.ex + Math.cos(moon.angle) * moon.orbit;
                        moon.y = moon.ey + Math.sin(moon.angle) * moon.orbit;

                        ctx.shadowColor = '#ccc';
                        ctx.shadowBlur = 5;
                        ctx.fillStyle = '#ccc';
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        ctx.fillStyle = 'rgba(255,255,255,0.05)';
                        ctx.font = '4px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText('🌙', moon.x, moon.y + moon.r + 2);
                    }

                    var now = new Date();
                    var timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit',
                        second: '2-digit' });
                    ctx.fillStyle = 'rgba(255,255,255,0.04)';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('🕐 ' + timeStr, 14, H - 14);

                    ctx.fillStyle = 'rgba(255,255,255,0.02)';
                    ctx.font = '8px monospace';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('HalDo v' + CONFIG.version, W - 14, H - 14);

                    requestAnimationFrame(animate);
                }

                animate();

                canvas.addEventListener('click', function(e) {
                    var rect = canvas.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top;
                    var dx = x - sun.x,
                        dy = y - sun.y;
                    if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 1.8) {
                        launchApp('ai');
                        Notify.info('☀️ HalDo AI geöffnet!');
                    }
                });

                canvas.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    var rect = canvas.getBoundingClientRect();
                    var x = t.clientX - rect.left;
                    var y = t.clientY - rect.top;
                    var dx = x - sun.x,
                        dy = y - sun.y;
                    if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 2) {
                        launchApp('ai');
                        Notify.info('☀️ HalDo AI geöffnet!');
                    }
                }, { passive: true });

                window.addEventListener('resize', function() {
                    for (var rp = 0; rp < planets.length; rp++) {
                        planets[rp].cx = W / 2;
                        planets[rp].cy = H / 2;
                    }
                    sun.x = W / 2;
                    sun.y = H / 2;
                });
            }

                            document.documentElement.style.setProperty('--border-color', 'rgba(0,0,0,0.06)');
                            document.documentElement.style.setProperty('--border-light', 'rgba(0,0,0,0.04)');
                        } else {
                            document.documentElement.style.setProperty('--bg-primary', '#0a0a1a');
                            document.documentElement.style.setProperty('--bg-secondary', '#12122a');
                            document.documentElement.style.setProperty('--bg-window', 'rgba(16,16,40,0.94)');
                            document.documentElement.style.setProperty('--bg-card', 'rgba(255,255,255,0.03)');
                            document.documentElement.style.setProperty('--text-primary', '#e8eef5');
                            document.documentElement.style.setProperty('--text-secondary', '#8899bb');
                            document.documentElement.style.setProperty('--border-color', 'rgba(255,255,255,0.06)');
                            document.documentElement.style.setProperty('--border-light', 'rgba(255,255,255,0.04)');
                        }

                        Notify.success('✅ Einstellungen gespeichert!');
                        loadSettingsUI();
                    });

                    resetBtn.addEventListener('click', function() {
                        if (confirm('Alle Einstellungen zurücksetzen?')) {
                            localStorage.removeItem('haldo_settings');
                            state.settings = {
                                theme: 'dark',
                                language: 'de',
                                voiceEnabled: true,
                                notifications: true,
                                voiceGender: 'male',
                                autoStartAI: true,
                                showDockLabels: false
                            };
                            CONFIG.language = 'de';
                            loadSettingsUI();
                            Notify.info('↺ Einstellungen zurückgesetzt');
                            // Theme zurücksetzen
                            document.documentElement.style.setProperty('--bg-primary', '#0a0a1a');
                            document.documentElement.style.setProperty('--bg-secondary', '#12122a');
                            document.documentElement.style.setProperty('--bg-window', 'rgba(16,16,40,0.94)');
                            document.documentElement.style.setProperty('--bg-card', 'rgba(255,255,255,0.03)');
                            document.documentElement.style.setProperty('--text-primary', '#e8eef5');
                            document.documentElement.style.setProperty('--text-secondary', '#8899bb');
                            document.documentElement.style.setProperty('--border-color', 'rgba(255,255,255,0.06)');
                            document.documentElement.style.setProperty('--border-light', 'rgba(255,255,255,0.04)');
                        }
                    });
                }
            });

            // ============================================================
            //  SYSTEM INIT
            // ============================================================

            function updateClock() {
                var now = new Date();
                DOM.clock.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                state.system.uptime = Math.floor((now() - state.system.started) / 1000);
            }

            function initDock() {
                var items = DOM.dock.querySelectorAll('.dock-item');
                for (var i = 0; i < items.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function() {
                            var app = btn.dataset.app;
                            if (app) launchApp(app);
                        });
                    })(items[i]);
                }
            }

            function initMenus() {
                var menuMap = {
                    'menu-apps': 'appworld',
                    'menu-ai': 'ai',
                    'menu-fahrschule': 'fahrschule',
                    'menu-system': 'settings'
                };
                for (var id in menuMap) {
                    var el = document.getElementById(id);
                    if (el) {
                        (function(appId) {
                            el.addEventListener('click', function() { launchApp(appId); });
                        })(menuMap[id]);
                    }
                }

                document.getElementById('menu-help').addEventListener('click', function() {
                    Notify.info(
                        '❓ **Hilfe für HalDo OS**\n\n' +
                        '📱 **Apps öffnen:**\n' +
                        '• "Öffne Fahrschule" 🚗\n' +
                        '• "Öffne Notizen" 📝\n' +
                        '• "Öffne Aufgaben" ✅\n' +
                        '• "Öffne Kontakte" 👤\n\n' +
                        '⌨️ **Shortcuts:**\n' +
                        '• Cmd+K → AI öffnen\n' +
                        '• Escape → Fenster schließen\n\n' +
                        '🎤 **Sprachsteuerung:**\n' +
                        '• Klicke auf 🎤 in der AI\n' +
                        '• Sag "Öffne Fahrschule"\n\n' +
                        '☀️ **Tipp:**\n' +
                        '• Klicke auf die Sonne im Hintergrund\n' +
                        '• Alle Daten werden lokal gespeichert'
                    );
                });
            }

            function bootSequence() {
                var steps = [
                    { text: '⟡ Kernel v' + CONFIG.kernel + ' wird geladen ...', progress: 12 },
                    { text: '⟡ System initialisiert ...', progress: 28 },
                    { text: '⟡ Cosmic World startet ...', progress: 45 },
                    { text: '⟡ HalDo AI wird aktiviert ...', progress: 62 },
                    { text: '⟡ ' + Object.keys(state.apps).length + ' Apps geladen ...', progress: 80 },
                    { text: '⟡ Daten werden geladen ...', progress: 92 },
                    { text: '⟡ HalDo OS ' + CONFIG.version + ' ist READY 🚀', progress: 100 }
                ];

                var i = 0;
                DOM.bootStatus.textContent = steps[0].text;
                DOM.bootProgress.style.width = '3%';

                var interval = setInterval(function() {
                    i++;
                    if (i < steps.length) {
                        DOM.bootStatus.textContent = steps[i].text;
                        DOM.bootProgress.style.width = steps[i].progress + '%';
                    } else {
                        clearInterval(interval);
                        setTimeout(function() {
                            DOM.boot.classList.add('hidden');
                            state.isBooted = true;
                            state.isReady = true;
                            Notify.success('🚀 HalDo OS ' + CONFIG.version + ' gestartet!');
                            if (state.settings.autoStartAI !== false) {
                                setTimeout(function() { launchApp('ai'); }, 500);
                            }
                            setTimeout(function() { launchApp('cosmic'); }, 900);
                            console.log('✅ HalDo OS ' + CONFIG.version + ' — MASTER VERSION');
                            console.log('📱 ' + Object.keys(state.apps).length + ' Apps geladen');
                            console.log('💾 Alle Daten lokal gespeichert');
                        }, 300);
                    }
                }, 320);
            }

            function loadSettings() {
                try {
                    var saved = JSON.parse(localStorage.getItem('haldo_settings'));
                    if (saved) {
                        for (var key in saved) {
                            if (state.settings.hasOwnProperty(key)) {
                                state.settings[key] = saved[key];
                            }
                        }
                        CONFIG.language = state.settings.language || 'de';
                    }
                } catch (e) {}
            }

            function loadData() {
                try {
                    var notes = localStorage.getItem('haldo_notes');
                    if (notes) state.notes = JSON.parse(notes);

                    var contacts = localStorage.getItem('haldo_contacts');
                    if (contacts) state.contacts = JSON.parse(contacts);

                    var tasks = localStorage.getItem('haldo_tasks');
                    if (tasks) state.tasks = JSON.parse(tasks);

                    var conv = localStorage.getItem('haldo_conversations');
                    if (conv) {
                        var parsed = JSON.parse(conv);
                        if (Array.isArray(parsed)) AI.conversationHistory = parsed;
                    }

                    var memory = localStorage.getItem('haldo_ai_memory');
                    if (memory) state.aiMemory = JSON.parse(memory);
                } catch (e) {
                    console.log('[Storage] Fehler beim Laden', e);
                }
            }

            // ============================================================
            //  GLOBAL EXPOSURE
            // ============================================================
            window.HalDo = {
                CONFIG: CONFIG,
                state: state,
                AI: AI,
                Voice: Voice,
                Notify: Notify,
                launchApp: launchApp,
                closeWindow: closeWindow,
                minimizeWindow: minimizeWindow,
                maximizeWindow: maximizeWindow,
                WindowManager: WindowManager,
                get apps() { return state.apps; },
                get windows() { return state.windows; },
                version: CONFIG.version,
                booted: function() { return state.isBooted; },
                resetData: function() {
                    if (confirm('Alle Daten löschen?')) {
                        localStorage.clear();
                        location.reload();
                    }
                }
            };

            window.notify = Notify.show;

            // ============================================================
            //  KEYBOARD SHORTCUTS
            // ============================================================
            document.addEventListener('keydown', function(e) {
                // Cmd/Ctrl + K → AI
                if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                    e.preventDefault();
                    launchApp('ai');
                }
                // Escape → active window schließen
                if (e.key === 'Escape' && state.activeWindow) {
                    closeWindow(state.activeWindow);
                }
                // Cmd/Ctrl + Shift + R → Reset (nur für Notfall)
                if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'R') {
                    e.preventDefault();
                    if (confirm('HalDo OS wirklich zurücksetzen?')) {
                        localStorage.clear();
                        location.reload();
                    }
                }
            });

            // ============================================================
            //  MAIN INIT
            // ============================================================

            function init() {
                console.log('⟡ HalDo OS ' + CONFIG.version + ' — MASTER VERSION');
                console.log('🔧 Build: ' + CONFIG.build);
                console.log('📱 ' + Object.keys(state.apps).length + ' Apps registriert');

                loadSettings();
                loadData();

                Voice.init();
                initCosmic();
                updateClock();
                setInterval(updateClock, 10000);
                initDock();
                initMenus();

                // About button
                document.getElementById('btn-about').addEventListener('click', function() {
                    Notify.show(
                        '⟡ **HalDo OS ' + CONFIG.version + '**\n' +
                        '💙❤️🚀 ' + Object.keys(state.apps).length + ' Apps\n' +
                        '✅ Groq AI verbunden\n' +
                        '🚗 Fahrschule aktiv\n' +
                        '📝 Notizen & Tasks lokal\n' +
                        '🔧 Build: ' + CONFIG.build + '\n' +
                        '⏱️ Uptime: ' + Math.floor((now() - state.system.started) / 1000) + 's\n' +
                        '📱 App-Launches: ' + state.system.appLaunches,
                        'info'
                    );
                });

                bootSequence();

                console.log('✅ System bereit — Viel Spaß mit HalDo OS!');
                console.log('💡 Tipp: Cmd+K für AI, Escape für Fenster schließen');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
