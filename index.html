<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05080f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HalDo AI OS 23.1.6 — 100+ Apps Professional</title>

    <style>
        /* =========================================================
        KOMPLETTE STYLES
        ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #05080f;
            --surface: rgba(8, 12, 28, 0.92);
            --border: rgba(255, 255, 255, 0.04);
            --text: #e8edf5;
            --gold: #ffd54b;
            --gold-dark: #ff9f1c;
            --radius: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
        }

        #haldo-os {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 30% 20%, rgba(20, 50, 120, 0.10), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(60, 30, 140, 0.06), transparent 50%),
                var(--bg);
            padding: 6px;
            gap: 4px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex-shrink: 0;
            backdrop-filter: blur(16px);
            height: 34px;
        }

        .top-bar .logo {
            font-size: 13px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .top-bar .time {
            font-size: 10px;
            opacity: 0.5;
            font-family: monospace;
        }

        .top-bar .status {
            font-size: 8px;
            opacity: 0.4;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-bar .status .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .content {
            flex: 1;
            display: flex;
            gap: 4px;
            min-height: 0;
            overflow: hidden;
        }

        /* =========================================================
        SIDEBAR
        ========================================================= */
        .sidebar {
            width: 150px;
            flex-shrink: 0;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 3px;
            overflow-y: auto;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .sidebar .app-btn {
            padding: 3px 6px;
            border-radius: 4px;
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            text-align: left;
            font-size: 9px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
            width: 100%;
            line-height: 1.2;
        }

        .sidebar .app-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
        }

        .sidebar .app-btn.active {
            background: rgba(255, 200, 80, 0.06);
            border-color: rgba(255, 200, 80, 0.10);
            color: var(--gold);
        }

        .sidebar .app-btn .icon {
            font-size: 11px;
            width: 14px;
            text-align: center;
            flex-shrink: 0;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            backdrop-filter: blur(16px);
            min-width: 0;
        }

        .app-header {
            padding: 4px 10px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 11px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 28px;
        }

        .app-header .actions {
            display: flex;
            gap: 2px;
        }

        .app-header .actions button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, 0.4);
            padding: 1px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 8px;
            transition: all 0.2s;
        }

        .app-header .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        ::-webkit-scrollbar {
            width: 2px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }

        .btn-primary {
            padding: 3px 10px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0a0e1a;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 9px;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(255, 200, 80, 0.15);
        }

        .btn-secondary {
            padding: 2px 7px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 8px;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-danger {
            padding: 2px 7px;
            border-radius: 3px;
            background: rgba(255, 80, 80, 0.10);
            color: #ff6b6b;
            border: 1px solid rgba(255, 80, 80, 0.12);
            cursor: pointer;
            font-size: 8px;
            transition: background 0.2s;
        }

        .btn-danger:hover {
            background: rgba(255, 80, 80, 0.18);
        }

        input,
        textarea,
        select {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: #fff;
            padding: 3px 5px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 9px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(255, 200, 80, 0.20);
        }

        textarea {
            resize: vertical;
            min-height: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px 7px;
            margin-bottom: 3px;
            transition: background 0.2s;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .card .card-title {
            font-weight: 600;
            font-size: 10px;
        }

        .card .card-meta {
            font-size: 8px;
            opacity: 0.35;
            margin-top: 1px;
        }

        .card .card-actions {
            margin-top: 3px;
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }

        .flex-row {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            align-items: center;
        }

        .flex-row>* {
            flex: 1;
            min-width: 40px;
        }

        .flex-row .btn-primary,
        .flex-row .btn-secondary,
        .flex-row .btn-danger {
            flex: 0 0 auto;
        }

        /* =========================================================
        COSMIC WORLD
        ========================================================= */
        .cosmic-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 350px;
            overflow: hidden;
            border-radius: 4px;
            background: radial-gradient(circle at 50% 50%, rgba(10, 20, 50, 0.6), #05080f);
            cursor: default;
        }

        .cosmic-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .cosmic-star {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            animation: starTwinkle var(--speed, 3s) ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.7);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .cosmic-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100px;
            height: 100px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 40px rgba(255, 220, 70, 0.9), 0 0 80px rgba(255, 165, 40, 0.6), 0 0 150px rgba(255, 100, 20, 0.3);
            animation: sunPulse 3s ease-in-out infinite;
            z-index: 10;
            cursor: pointer;
        }

        .cosmic-sun:hover {
            box-shadow: 0 0 60px rgba(255, 220, 70, 1), 0 0 120px rgba(255, 165, 40, 0.8);
        }

        @keyframes sunPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.98);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.04);
            }
        }

        .cosmic-sun .logo-in-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 55%;
            height: 55%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #0a0e1a;
            text-shadow: 0 0 30px rgba(255, 200, 80, 0.6);
            animation: logoPulse 3s ease-in-out infinite;
            border: 2px solid rgba(255, 200, 80, 0.15);
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            overflow: hidden;
        }

        .cosmic-sun .logo-in-sun img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .cosmic-sun .logo-in-sun .logo-text {
            font-size: 18px;
            font-weight: 800;
            color: #0a0e1a;
            text-shadow: 0 0 20px rgba(255, 200, 80, 0.5);
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.06);
            }
        }

        /* Planet Orbits */
        .cosmic-planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 5;
        }

        .cosmic-planet:hover {
            transform: scale(1.2) !important;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2) !important;
            z-index: 20;
        }

        .cosmic-planet .planet-label {
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6px;
            opacity: 0.35;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.6);
            padding: 1px 4px;
            border-radius: 2px;
            pointer-events: none;
            color: #fff;
        }

        .cosmic-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Living Logo */
        .living-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
            width: 80px;
            height: 80px;
        }

        .living-logo .logo-aura {
            position: absolute;
            inset: -30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.12), rgba(255, 200, 80, 0.03) 40%, transparent 70%);
            animation: auraPulse 3s ease-in-out infinite;
        }

        @keyframes auraPulse {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.6;
            }
        }

        .living-logo .logo-mouth {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 22%;
            height: 4%;
            border-radius: 50%;
            background: rgba(255, 200, 150, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.08s ease;
        }

        .living-logo.speaking .logo-mouth {
            animation: mouthSpeak 0.25s ease-in-out infinite alternate;
        }

        @keyframes mouthSpeak {
            0% {
                height: 3%;
                transform: translateX(-50%) scaleY(0.6);
            }
            100% {
                height: 10%;
                transform: translateX(-50%) scaleY(1.2);
            }
        }

        .living-logo .logo-eyes {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 9%;
            display: flex;
            justify-content: space-between;
        }

        .living-logo .logo-eyes .eye {
            width: 28%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .living-logo .logo-eyes .eye::after {
            content: '';
            position: absolute;
            width: 35%;
            height: 35%;
            border-radius: 50%;
            background: rgba(255, 220, 100, 0.3);
            top: 30%;
            left: 30%;
            transition: all 0.3s ease;
        }

        .living-logo.listening .logo-eyes .eye::after {
            animation: eyeListen 1.2s ease-in-out infinite;
        }

        @keyframes eyeListen {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
            }
        }

        .living-logo.thinking .logo-eyes .eye::after {
            animation: eyeThink 1.8s ease-in-out infinite;
        }

        @keyframes eyeThink {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(3px, -2px);
            }
        }

        .living-logo.idle .logo-eyes .eye::after {
            animation: eyeIdle 3.5s ease-in-out infinite;
        }

        @keyframes eyeIdle {
            0%,
            100% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(-1px, -1px);
            }
            75% {
                transform: translate(1px, 1px);
            }
        }

        .living-logo .logo-hands {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .living-logo .logo-hands .hand {
            position: absolute;
            width: 10%;
            height: 10%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.10), rgba(255, 200, 100, 0.03) 50%, transparent 70%);
            animation: handMove 4.5s ease-in-out infinite;
        }

        .living-logo .logo-hands .hand-left {
            left: -6%;
            top: 30%;
            animation-delay: 0s;
        }

        .living-logo .logo-hands .hand-right {
            right: -6%;
            top: 30%;
            animation-delay: 2.2s;
        }

        @keyframes handMove {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(0, -3px) scale(1.06);
            }
        }

        .living-logo .logo-glow {
            position: absolute;
            inset: -8%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.05), transparent 60%);
            animation: glowPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.06);
            }
        }

        .cosmic-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .cosmic-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 200, 80, 0.15);
            animation: particleFloat var(--duration, 5s) ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0.1;
            }
            50% {
                transform: translate(var(--dx, 15px), var(--dy, -15px)) scale(1);
                opacity: 0.5;
            }
        }

        /* =========================================================
        AI CHAT
        ========================================================= */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            margin-bottom: 4px;
            max-height: 250px;
            min-height: 80px;
            font-size: 10px;
        }

        .chat-messages .user {
            padding: 3px 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 3px;
            margin-bottom: 2px;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: #aac;
        }

        .chat-messages .ai {
            padding: 3px 6px;
            background: rgba(255, 200, 80, 0.04);
            border-radius: 3px;
            margin-bottom: 2px;
            border: 1px solid rgba(255, 200, 80, 0.04);
            color: #e8edf5;
            font-size: 9px;
            line-height: 1.4;
        }

        /* =========================================================
        WINDOW SYSTEM
        ========================================================= */
        .window-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
        }

        .window-overlay.active {
            pointer-events: all;
        }

        .window-frame {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 300px;
            min-height: 200px;
            resize: both;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: all;
        }

        .window-frame .window-titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            cursor: grab;
            user-select: none;
            min-height: 26px;
        }

        .window-frame .window-titlebar .title {
            font-size: 10px;
            font-weight: 600;
            opacity: 0.7;
        }

        .window-frame .window-titlebar .controls {
            display: flex;
            gap: 4px;
        }

        .window-frame .window-titlebar .controls button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 12px;
            padding: 0 4px;
            transition: color 0.2s;
        }

        .window-frame .window-titlebar .controls button:hover {
            color: #fff;
        }

        .window-frame .window-titlebar .controls .close:hover {
            color: #ff6b6b;
        }

        .window-frame .window-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-size: 9px;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .sidebar {
                width: 38px;
                padding: 2px;
            }
            .sidebar .app-btn span:not(.icon) {
                display: none;
            }
            .sidebar .app-btn {
                justify-content: center;
                padding: 4px;
            }
            #haldo-os {
                padding: 3px;
                gap: 3px;
            }
            .app-body {
                padding: 3px;
            }
            .top-bar .status {
                display: none;
            }
            .cosmic-sun {
                width: 70px;
                height: 70px;
            }
            .living-logo {
                width: 56px;
                height: 56px;
            }
            .cosmic-planet .planet-label {
                font-size: 5px;
                bottom: -12px;
            }
            .window-frame {
                min-width: 200px;
                min-height: 150px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 30px;
            }
            .sidebar .app-btn .icon {
                font-size: 9px;
                width: 12px;
            }
            .top-bar .logo {
                font-size: 10px;
            }
            .app-header {
                font-size: 9px;
                padding: 2px 6px;
            }
            .app-body {
                padding: 2px;
            }
            .card {
                padding: 3px 5px;
            }
            .cosmic-sun {
                width: 55px;
                height: 55px;
            }
            .living-logo {
                width: 44px;
                height: 44px;
            }
            .window-frame {
                min-width: 160px;
                min-height: 120px;
            }
        }
    </style>
</head>
<body>

    <div id="haldo-os">
        <div class="top-bar">
            <div class="logo" onclick="AppRouter.switchTo('cosmic')">✦ HalDo AI OS 23.1.6</div>
            <div class="status">
                <span class="dot"></span>
                <span id="status-text">Bereit</span>
            </div>
            <div class="time" id="top-time">--:--:--</div>
        </div>
        <div class="content">
            <nav class="sidebar" id="sidebar"></nav>
            <div class="main-area">
                <div class="app-header" id="app-header">
                    <span id="app-title">🌌 Cosmic World</span>
                    <div class="actions" id="app-actions"></div>
                </div>
                <div class="app-body" id="app-body"></div>
            </div>
        </div>
    </div>

    <!-- Window Overlay -->
    <div class="window-overlay" id="window-overlay"></div>

    <script>
        "use strict";

        // =========================================================
        // VERSION
        // =========================================================
        const HALDO_VERSION = "23.1.6";
        const HALDO_BUILD = "100-APPS-PROFESSIONAL";

        // =========================================================

        const Storage = {
            prefix: 'haldo_',
            get(key, def = null) {
                try {
                    const val = localStorage.getItem(this.prefix + key);
                    if (val === null) return def;
                    try { return JSON.parse(val); } catch (e) { return val; }
                } catch (e) { return def; }
            },
            set(key, val) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(val)); return true; } catch (e) { return false; }
            },
            remove(key) {
                try { localStorage.removeItem(this.prefix + key); return true; } catch (e) { return false; }
            },
            getAll() {
                const res = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try { res[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k)); } catch (e) { res[
                                k.replace(this.prefix, '')] = localStorage.getItem(k); }
                    });
                } catch (e) {}
                return res;
            }
        };

        // =========================================================
        // WINDOW MANAGER
        // =========================================================
        const WindowManager = {
            windows: [],
            overlay: document.getElementById('window-overlay'),
            zIndex: 100000,

            create(appId, title, content, icon = '📱') {
                const frame = document.createElement('div');
                frame.className = 'window-frame';
                frame.dataset.app = appId;
                frame.style.left = (100 + Math.random() * 200) + 'px';
                frame.style.top = (80 + Math.random() * 150) + 'px';
                frame.style.width = '400px';
                frame.style.height = '350px';
                frame.style.zIndex = this.zIndex++;

                frame.innerHTML = `
                    <div class="window-titlebar">
                        <span class="title">${icon} ${title}</span>
                        <div class="controls">
                            <button class="minimize" title="Minimieren">−</button>
                            <button class="close" title="Schließen">✕</button>
                        </div>
                    </div>
                    <div class="window-content">${content}</div>
                `;

                // Titlebar Drag
                const titlebar = frame.querySelector('.window-titlebar');
                let isDragging = false;
                let startX, startY, startLeft, startTop;

                titlebar.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.controls')) return;
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    startLeft = parseInt(frame.style.left);
                    startTop = parseInt(frame.style.top);
                    frame.style.zIndex = this.zIndex++;
                    document.addEventListener('mousemove', onDrag);
                    document.addEventListener('mouseup', onDragEnd);
                });

                const onDrag = (e) => {
                    if (!isDragging) return;
                    frame.style.left = (startLeft + e.clientX - startX) + 'px';
                    frame.style.top = (startTop + e.clientY - startY) + 'px';
                };

                const onDragEnd = () => {
                    isDragging = false;
                    document.removeEventListener('mousemove', onDrag);
                    document.removeEventListener('mouseup', onDragEnd);
                };

                // Close
                frame.querySelector('.close').addEventListener('click', () => {
                    this.close(appId);
                });

                // Minimize
                frame.querySelector('.minimize').addEventListener('click', () => {
                    frame.style.display = frame.style.display === 'none' ? 'flex' : 'none';
                });

                // Click to bring to front
                frame.addEventListener('mousedown', () => {
                    frame.style.zIndex = this.zIndex++;
                });

                this.overlay.classList.add('active');
                this.overlay.appendChild(frame);
                this.windows.push({ id: appId, frame });

                return frame;
            },

            close(appId) {
                const win = this.windows.find(w => w.id === appId);
                if (win) {
                    win.frame.remove();
                    this.windows = this.windows.filter(w => w.id !== appId);
                    if (this.windows.length === 0) {
                        this.overlay.classList.remove('active');
                    }
                }
            },

            closeAll() {
                this.windows.forEach(w => w.frame.remove());
                this.windows = [];
                this.overlay.classList.remove('active');
            },

            getWindow(appId) {
                const win = this.windows.find(w => w.id === appId);
                return win ? win.frame : null;
            },

            hasWindow(appId) {
                return this.windows.some(w => w.id === appId);
            }
        };

                'antike': 'Die Antike ist die Epoche der griechisch-römischen Kultur (etwa 800 v. Chr. bis 500 n. Chr.). Sie hat die Grundlagen der abendländischen Philosophie (Platon, Aristoteles, Sokrates), der Demokratie (Athen), der Kunst (griechische Bildhauerei, römische Architektur), der Literatur (Homer, Vergil) und des Rechts (römisches Recht) gelegt. Die Antike ist die Wiege der westlichen Zivilisation.',
                'mittelalter': 'Das Mittelalter ist die Epoche zwischen Antike und Neuzeit (etwa 500 bis 1500 n. Chr.). Es war geprägt von Feudalismus, Rittertum, Klöstern, der katholischen Kirche, Kreuzzügen, der Entstehung der modernen Nationen, der Gotik und der Scholastik. Das Mittelalter war eine Zeit des Wandels und der Innovation.',
                'renaissance': 'Die Renaissance (14. bis 17. Jahrhundert) war eine Epoche des Wiedererwachens der antiken Kultur und des humanistischen Denkens. Sie brachte große Fortschritte in der Kunst (Leonardo da Vinci, Michelangelo, Raphael), der Wissenschaft (Galilei, Kopernikus) und der Philosophie (Machiavelli, Erasmus). Die Renaissance war eine Blütezeit der europäischen Kultur.',
                'aufklaerung': 'Die Aufklärung (17. und 18. Jahrhundert) war eine geistige Bewegung, die den Einsatz der Vernunft und die Befreiung des Menschen von Unmündigkeit forderte. Sie beeinflusste die Demokratie (Locke, Rousseau), die Menschenrechte (Voltaire), die wissenschaftliche Methode (Bacon, Newton) und die kritische Philosophie (Kant). Die Aufklärung ist die Grundlage der modernen liberalen Demokratie.',
                'industrielle revolution': 'Die Industrielle Revolution war der Übergang von der Agrar- zur Industriegesellschaft im 18. und 19. Jahrhundert. Sie brachte Maschinen, Fabriken, Eisenbahnen, Dampfschiffe, die Massenproduktion und die Urbanisierung hervor. Die Industrielle Revolution hat die Welt grundlegend verändert und ist die Grundlage der modernen Wirtschaft.',
                'weltkriege': 'Die Weltkriege des 20. Jahrhunderts waren die zerstörerischsten Konflikte der Menschheitsgeschichte. Der Erste Weltkrieg (1914-1918) und der Zweite Weltkrieg (1939-1945) führten zu enormen Verlusten an Menschenleben, politischen Umwälzungen, technologischen Fortschritten und der Gründung der Vereinten Nationen. Sie sind Mahnmale für die Schrecken des Krieges und die Bedeutung des Friedens.',

                // === TECHNIK ===
                'technik': 'Die Technik umfasst die Anwendung von wissenschaftlichen Erkenntnissen für praktische Zwecke. Sie ist die Grundlage für die moderne Zivilisation und umfasst den Maschinenbau, die Elektrotechnik, die Bauingenieurwissenschaften, die Verfahrenstechnik, die Informationstechnik, die Umwelttechnik, die Biotechnik und die Medizintechnik. Die Technik verbessert die Lebensqualität und löst praktische Probleme.',
                'robotik': 'Die Robotik ist die Wissenschaft der Konstruktion, Programmierung und Anwendung von Robotern. Sie umfasst die Mechanik, die Elektronik, die Sensorik, die Steuerungstechnik, die künstliche Intelligenz und die Mensch-Roboter-Interaktion. Roboter werden in der Industrie (Fertigungsroboter), der Medizin (Operationsroboter), der Forschung (Explorationsroboter), dem Militär (Drohnen) und im Alltag (Service-Roboter) eingesetzt.',
                'elektrotechnik': 'Die Elektrotechnik ist die Ingenieurwissenschaft, die sich mit elektrischen Systemen, Schaltkreisen, Motoren, Generatoren, Transformatoren, Leistungselektronik, Regelungstechnik und Kommunikationstechnik befasst. Sie ist die Grundlage der modernen Energieversorgung, der Elektromobilität, der Kommunikationstechnologie und der Automatisierungstechnik.',
                'maschinenbau': 'Der Maschinenbau ist die Ingenieurwissenschaft, die sich mit der Konstruktion, der Fertigung und dem Betrieb von Maschinen und Anlagen befasst. Er umfasst die Mechanik, die Thermodynamik, die Strömungslehre, die Werkstoffkunde, die Fertigungstechnik und die Konstruktionslehre. Der Maschinenbau ist eine der ältesten und wichtigsten Ingenieurdisziplinen.',
                'bauwesen': 'Das Bauwesen umfasst die Planung, die Konstruktion und die Errichtung von Gebäuden, Brücken, Straßen, Tunneln, Dämmen und anderen Bauwerken. Es umfasst die Architektur, die Bauingenieurwissenschaften, die Baustoffkunde, die Statik, die Geotechnik und die Bauphysik. Das Bauwesen ist die Grundlage der modernen Infrastruktur.',

                // === WIRTSCHAFT ===
                'wirtschaft': 'Die Wirtschaft umfasst die Produktion, die Verteilung und den Konsum von Gütern und Dienstleistungen. Sie ist das Rückgrat jeder Gesellschaft und umfasst die Makroökonomie (Gesamtwirtschaft), die Mikroökonomie (individuelle Entscheidungen), die Betriebswirtschaftslehre (Unternehmen), die Finanzwirtschaft, die Außenwirtschaft und die Wirtschaftspolitik. Die Wirtschaft ist die Grundlage für den Wohlstand und die Entwicklung einer Gesellschaft.',
                'finanzen': 'Die Finanzen umfassen die Verwaltung von Geld, Kapital, Investitionen, Krediten, Risiken und Finanzinstrumenten. Sie umfasst die Unternehmensfinanzierung, die private Finanzplanung, das Investmentbanking, das Asset Management, die Versicherungswirtschaft und die Finanzregulierung. Die Finanzen sind ein zentraler Bestandteil der modernen Wirtschaft.',
                'marketing': 'Das Marketing umfasst die Vermarktung von Produkten und Dienstleistungen. Es umfasst die Marktforschung, die Produktentwicklung, die Preisgestaltung, die Werbung, den Vertrieb, das Branding, das Kundenbeziehungsmanagement und die digitale Kommunikation. Das Marketing ist wichtig für den Erfolg von Unternehmen und die Befriedigung von Kundenbedürfnissen.',
                'management': 'Das Management ist die Leitung und Organisation von Unternehmen und Institutionen. Es umfasst die Planung, die Steuerung, die Führung, die Koordination und die Kontrolle von Prozessen und Mitarbeitern. Das Management ist die Grundlage für die Effizienz und den Erfolg von Organisationen.',
                'unternehmertum': 'Das Unternehmertum ist die Fähigkeit, Geschäftsideen zu entwickeln und in erfolgreiche Unternehmen umzusetzen. Es umfasst die Identifikation von Chancen, die Risikobereitschaft, die Innovation, die Kreativität, die Führungsfähigkeiten und die unternehmerische Verantwortung. Unternehmer sind die Motoren der Wirtschaft und des Fortschritts.',

                // === KULTUR ===
                'kultur': 'Die Kultur umfasst die Gesamtheit von Traditionen, Bräuchen, Sprache, Kunst, Musik, Literatur, Philosophie, Religion, Werten und Normen einer Gesellschaft. Sie ist die Identität eines Volkes und die Grundlage für den Zusammenhalt und die Entwicklung einer Gesellschaft. Die Kultur ist das Erbe der Menschheit.',
                'kunst': 'Die Kunst ist der Ausdruck von Kreativität, Emotionen, Ideen und Visionen durch visuelle, akustische, performative und literarische Medien. Sie umfasst die Malerei, die Bildhauerei, die Architektur, die Musik, die Literatur, den Tanz, das Theater, den Film und die Fotografie. Die Kunst ist ein wesentlicher Bestandteil der menschlichen Kultur und bereichert das Leben.',
                'musik': 'Die Musik ist die Kunst der Klanggestaltung. Sie umfasst die Komposition, die Interpretation, den Gesang, die Instrumente, die Musiktheorie, die Musikgeschichte und die Musikproduktion. Die Musik ist eine universelle Sprache der Menschheit und hat eine tiefe emotionale und kulturelle Bedeutung.',
                'literatur': 'Die Literatur umfasst schriftliche Werke wie Romane, Gedichte, Dramen, Essays, Märchen, Sagen, Biografien und philosophische Schriften. Sie ist ein Spiegel der menschlichen Erfahrung, der Phantasie, der Emotionen und der Gedanken. Die Literatur ist ein wesentlicher Bestandteil der Kultur und der Bildung.',
                'sprache': 'Die Sprache ist ein System von Zeichen, Symbolen und Regeln, das Menschen zur Kommunikation, zum Ausdruck von Gedanken und zur Weitergabe von Informationen verwenden. Die Sprache ist das wichtigste Werkzeug des Menschen und die Grundlage für die Kultur, die Bildung und die Gesellschaft.',

                // === PSYCHOLOGIE ===
                'psychologie': 'Die Psychologie ist die Wissenschaft vom menschlichen Erleben und Verhalten. Sie umfasst die Wahrnehmung, das Lernen, das Gedächtnis, die Emotionen, die Motivation, die Persönlichkeit, die Entwicklungspsychologie, die Sozialpsychologie, die klinische Psychologie, die Arbeitspsychologie, die Gesundheitspsychologie und die Neuropsychologie. Die Psychologie ist die Wissenschaft des menschlichen Geistes und Verhaltens.',
                'wahrnehmung': 'Die Wahrnehmung ist der Prozess der Verarbeitung von Sinneseindrücken. Sie umfasst das Sehen, Hören, Riechen, Schmecken, Tasten und die Integration dieser Sinne im Gehirn. Die Wahrnehmung ist die Grundlage für das Verständnis der Umwelt und ist ein zentrales Thema der kognitiven Psychologie.',
                'lernen': 'Lernen ist der Prozess des Erwerbs von Wissen, Fähigkeiten, Einstellungen und Verhaltensweisen. Es umfasst das assoziative Lernen (klassische und operante Konditionierung), das kognitive Lernen (Einsicht, Problemlösen), das Beobachtungslernen (Bandura) und das implizite Lernen. Lernen ist die Grundlage für die Entwicklung und die Anpassung des Menschen.',
                'gedaechtnis': 'Das Gedächtnis ist die Fähigkeit, Informationen zu speichern, zu behalten und abzurufen. Es umfasst das sensorische Gedächtnis, das Kurzzeitgedächtnis, das Arbeitsgedächtnis, das Langzeitgedächtnis (episodisch, semantisch, prozedural) und die Gedächtnisbildung (Konsolidierung). Das Gedächtnis ist die Grundlage für Identität, Lernen und Wissen.',
                'emotionen': 'Emotionen sind komplexe psychologische Zustände, die durch Gefühle, Gedanken, körperliche Reaktionen und Verhalten gekennzeichnet sind. Sie umfassen Freude, Trauer, Angst, Wut, Überraschung, Ekel, Liebe, Stolz, Scham, Schuld und Neugier. Emotionen haben eine wichtige Funktion für die Motivation, die Kommunikation, die Entscheidungsfindung und das soziale Verhalten.',
                'persoenlichkeit': 'Die Persönlichkeit umfasst die individuellen Merkmale, Denkweisen, Gefühle und Verhaltensmuster eines Menschen. Sie wird durch Gene, Umwelt, Erziehung, Erfahrungen und soziale Interaktionen geprägt. Die Persönlichkeit ist ein zentrales Thema der Psychologie und wird durch verschiedene Theorien beschrieben (Traittheorien, psychodynamische Theorien, humanistische Theorien).',

                // === SOZIOLOGIE ===
                'soziologie': 'Die Soziologie ist die Wissenschaft der Gesellschaft. Sie untersucht soziale Strukturen, Institutionen, Gruppen, Schichten, Klassen, Machtverhältnisse, sozialen Wandel, soziale Ungleichheit, soziale Probleme, Kultur, Sozialisation und soziale Kontrolle. Die Soziologie ist die Wissenschaft der menschlichen Gesellschaft und ihrer Dynamik.',
                'familie': 'Die Familie ist die kleinste soziale Einheit und die Basis der Gesellschaft. Sie umfasst Eltern, Kinder, Großeltern und andere Verwandte. Die Familie hat wichtige Funktionen: die Reproduktion, die Sozialisation, die emotionale Unterstützung, die wirtschaftliche Versorgung und die Weitergabe von Werten. Die Familie ist der Ort der Geborgenheit und der ersten sozialen Erfahrungen.',
                'bildung': 'Bildung ist der Prozess des Erwerbs von Wissen, Fähigkeiten, Werten und kulturellen Fertigkeiten. Sie umfasst die formale Bildung (Schule, Universität), die non-formale Bildung (Weiterbildung) und die informelle Bildung (Lebenserfahrung). Bildung ist der Schlüssel zu persönlicher Entwicklung, beruflichem Erfolg und gesellschaftlicher Teilhabe.',
                'arbeit': 'Die Arbeit ist die Tätigkeit zur Produktion von Gütern und Dienstleistungen. Sie ist wichtig für den Lebensunterhalt, die Identität, die soziale Anerkennung, die Sinnstiftung und die gesellschaftliche Teilhabe. Die Arbeit ist ein zentraler Bestandteil des Lebens und der Gesellschaft.',
                'soziale ungleichheit': 'Soziale Ungleichheit beschreibt die ungleiche Verteilung von Ressourcen, Chancen, Macht und Prestige in einer Gesellschaft. Sie umfasst die Einkommensungleichheit, die Vermögensungleichheit, die Bildungsungleichheit, die Gesundheitsungleichheit, die Geschlechterungleichheit und die ethnische Ungleichheit. Soziale Ungleichheit ist eine der größten Herausforderungen der modernen Gesellschaft.',

                // === MEDIZIN ===
                'medizin': 'Die Medizin ist die Wissenschaft der Heilung, der Gesundheitserhaltung und der Krankheitsprävention. Sie umfasst die Anatomie, die Physiologie, die Pathologie, die Pharmakologie, die Chirurgie, die Innere Medizin, die Pädiatrie, die Gynäkologie, die Psychiatrie, die Radiologie, die Anästhesie, die Notfallmedizin, die Präventivmedizin und die öffentliche Gesundheit. Die Medizin ist die Wissenschaft des Lebens und der Gesundheit.',
                'anatomie': 'Die Anatomie ist die Lehre vom Aufbau des menschlichen Körpers. Sie umfasst die Knochen, die Muskeln, die Organe, die Blutgefäße, die Nerven, die Haut, die Sinnesorgane und die inneren Strukturen. Die Anatomie ist die Grundlage für die Chirurgie, die Radiologie, die Pathologie und die Physiotherapie.',
                'physiologie': 'Die Physiologie ist die Lehre von den Funktionen des menschlichen Körpers. Sie umfasst das Herz-Kreislauf-System, die Atmung, die Verdauung, den Stoffwechsel, die Hormone, das Immunsystem, das Nervensystem, die Nierenfunktion, die Hautfunktion und die Reproduktion. Die Physiologie ist die Grundlage für die Innere Medizin, die Kardiologie, die Pneumologie, die Endokrinologie und die Neurologie.',
                'gesundheit': 'Gesundheit ist der Zustand des körperlichen, geistigen und sozialen Wohlbefindens. Sie ist die Grundlage für ein erfülltes Leben und wird durch Ernährung, Bewegung, Schlaf, Stressbewältigung, soziale Kontakte und medizinische Versorgung beeinflusst. Gesundheit ist das höchste Gut des Menschen.',
                'pharmazie': 'Die Pharmazie ist die Wissenschaft der Arzneimittel. Sie umfasst die Entwicklung, die Herstellung, die Prüfung, die Zulassung, die Lagerung, die Abgabe und die Anwendung von Medikamenten. Die Pharmazie ist die Grundlage für die medikamentöse Therapie und die Gesundheitsversorgung.',

                // === LEBEN ===
                'leben': 'Das Leben ist ein komplexer Prozess der Organisation, des Wachstums, der Reproduktion, des Stoffwechsels, der Reaktion auf Umweltreize, der Evolution und der Anpassung. Es ist eines der größten Wunder der Natur und das zentrale Thema der Biologie. Das Leben ist einzigartig und wertvoll.',
                'bewusstsein': 'Das Bewusstsein ist die Fähigkeit, sich selbst und die Umwelt wahrzunehmen, zu fühlen, zu denken und zu handeln. Es ist eines der größten Rätsel der Philosophie, der Psychologie und der Neurowissenschaften. Das Bewusstsein ist das, was uns zu Menschen macht.',
                'liebe': 'Die Liebe ist ein tiefes Gefühl der Zuneigung, der Verbundenheit, der Fürsorge und des Verlangens nach Nähe. Sie ist eine der stärksten menschlichen Emotionen und prägt das Leben, die Beziehungen, die Kultur, die Kunst und die Philosophie. Die Liebe ist die Grundlage für Glück und menschliche Verbindung.',
                'glueck': 'Das Glück ist ein Zustand des Wohlbefindens, der Freude, der Zufriedenheit und der Erfüllung. Es wird durch äußere Umstände, innere Einstellung, zwischenmenschliche Beziehungen, Sinnfindung und persönliche Entwicklung beeinflusst. Das Glück ist das Ziel des menschlichen Strebens.',
                'freiheit': 'Die Freiheit ist die Möglichkeit, selbstbestimmt zu handeln, ohne durch äußere Zwänge eingeschränkt zu werden. Sie ist ein Grundwert der Philosophie, der Ethik, der Politik und der Gesellschaft. Die Freiheit ist das Fundament der Demokratie und der Menschenrechte.',
                'tod': 'Der Tod ist das Ende des Lebens. Er ist ein natürlicher Teil des Lebenszyklus und wird in vielen Kulturen, Religionen und Philosophien thematisiert. Der Tod gibt dem Leben seine Bedeutung und ist eine Quelle der Reflexion und der Wertschätzung des Lebens.'
            },

Ich kann Ihnen fundierte, detaillierte und verständliche Antworten auf alle Ihre Fragen geben. Stellen Sie mir einfach eine Frage – ich bin bereit!`;

                // Allgemeine Wissensfrage
                const prefixes = ['was ist', 'was bedeutet', 'was weißt du über', 'erkläre', 'erzähle von', 'wie funktioniert',

                for (const prefix of prefixes) {

                // Intelligente Standardantworten
                const responses = [
                    'Ich habe Ihre Frage verstanden. Dies ist ein interessantes Thema, das in meinem Wissensbereich liegt. Bitte spezifizieren Sie Ihre Frage etwas genauer, damit ich Ihnen die besten Informationen geben kann. Ich kann Ihnen fundierte, detaillierte und verständliche Antworten liefern.',
                    'Ein faszinierendes Thema! Ich habe umfangreiches Wissen dazu. Können Sie Ihre Frage präzisieren, damit ich Ihnen eine vollständige und hilfreiche Antwort geben kann? Ich bin hier, um mein Wissen mit Ihnen zu teilen.',
                    'Ich kenne mich mit diesem Thema aus. Bitte geben Sie mir etwas mehr Details, damit ich Ihnen eine präzise Antwort liefern kann. Ich habe Wissen über alle Bereiche der Wissenschaft, Philosophie, Technologie, Geschichte, Kunst und Kultur.',
                    'Das ist ein wichtiges Thema in meinem Wissensgebiet. Bitte fragen Sie konkreter, damit ich Ihnen die besten Informationen geben kann. Ich bin bereit, mein umfangreiches Wissen mit Ihnen zu teilen.'
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            },

            search(query) {
                const results = [];
                const q = query.toLowerCase().trim();
                if (!q) return results;
                for (const [key, value] of Object.entries(this.knowledge)) {
                    const cleanKey = key.replace(/_/g, ' ');
                    if (cleanKey.includes(q) || value.toLowerCase().includes(q)) {
                        results.push({ topic: cleanKey, content: value.substring(0, 200) + '...' });
                    }
                }
                return results;
            },

            getAllTopics() {
                return Object.keys(this.knowledge).map(k => k.replace(/_/g, ' ')).sort();
            },

            }

                                <span class="hand hand-right"></span>
                            </div>
                        </div>

                        <!-- Planetenuhr Info -->
                        <div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:25;background:rgba(0,0,0,0.5);padding:4px 12px;border-radius:4px;font-size:7px;color:rgba(255,255,255,0.4);text-align:center;pointer-events:none;">
                            🕐 Merkur=Stunde · Venus=Minute · Erde=Sekunde
                            <span id="planet-clock" style="display:block;font-size:8px;color:rgba(255,200,80,0.6);margin-top:2px;"></span>
                        </div>

                        <style>
                            ${keyframes}
                            .cosmic-planet {
                                position: absolute;
                                left: 50%;
                                top: 50%;
                                border-radius: 50%;
                                cursor: pointer;
                                transition: transform 0.3s ease, box-shadow 0.3s ease;
                                z-index: 5;
                            }
                            .cosmic-planet:hover {
                                transform: scale(1.2) !important;
                                box-shadow: 0 0 30px rgba(255,255,255,0.2) !important;
                                z-index: 20;
                            }
                            .cosmic-planet .planet-label {
                                position: absolute;
                                bottom: -14px;
                                left: 50%;
                                transform: translateX(-50%);
                                font-size: 6px;
                                opacity: 0.35;

            // =========================================================

            // =========================================================
            renderAI() {
                return `
                    <div style="display:flex;flex-direction:column;height:100%;min-height:200px;">
                        <div style="background:rgba(255,200,80,0.04);border-radius:4px;padding:6px;margin-bottom:4px;border:1px solid rgba(255,200,80,0.06);font-size:9px;opacity:0.6;">
                            🤖 HalDo AI — Professioneller Assistent (${Object.keys(HalDoAI.knowledge).length} Wissensgebiete)
                        </div>
                        <div class="chat-messages" id="ai-chat-messages">
                            <div class="ai">Guten Tag! Ich bin HalDo AI, Ihr professioneller KI-Assistent und Wissenspartner. Ich habe ein umfassendes Wissen über alle Gebiete der Wissenschaft, Philosophie, Technologie, Geschichte, Kunst, Kultur und des Lebens. Stellen Sie mir eine Frage – ich bin bereit, mein Wissen mit Ihnen zu teilen.</div>
                        </div>
                        <div class="flex-row">
                            <textarea id="ai-input" rows="1" placeholder="Frage an HalDo AI..." style="flex:1;min-height:28px;font-size:9px;"></textarea>
                            <button onclick="AppRouter.sendAIMessage()" class="btn-primary">Senden</button>
                            <button onclick="AppRouter.voiceInput()" class="btn-secondary">🎙️</button>
                            <button onclick="AppRouter.switchTo('ai-wissen')" class="btn-secondary">📚</button>
                        </div>
                        <div id="ai-thinking" style="display:none;font-size:8px;opacity:0.5;margin-top:2px;">🤔 HalDo AI denkt...</div>
                    </div>
                `;
            },

            sendAIMessage() {
                const input = document.getElementById('ai-input');
                const messages = document.getElementById('ai-chat-messages');
                const thinking = document.getElementById('ai-thinking');
                if (!input || !messages) return;
                const text = input.value.trim();
                if (!text) return;

                const userDiv = document.createElement('div');
                userDiv.className = 'user';
                userDiv.textContent = '👤 ' + text;
                messages.appendChild(userDiv);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
                thinking.style.display = 'block';
                this.setLogoState('thinking');

                setTimeout(() => {
                    thinking.style.display = 'none';
                    const response = HalDoAI.ask(text);
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'ai';
                    aiDiv.textContent = response;
                    messages.appendChild(aiDiv);
                    messages.scrollTop = messages.scrollHeight;
                    this.setLogoState('speaking');
                    speak(response.substring(0, 120) + '...');
                    setTimeout(() => this.setLogoState('idle'), 1000);
                }, 400);
            },

            voiceInput() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) { alert('Spracherkennung nicht unterstützt.'); return; }
                const rec = new Recognition();
                rec.lang = 'de-DE';
                rec.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const input = document.getElementById('ai-input');
                    if (input) input.value = text;
                    this.sendAIMessage();
                };
                rec.start();
                this.setLogoState('listening');
                speak('Ich höre zu.');
                setTimeout(() => this.setLogoState('idle'), 5000);
            },

            renderAIWissen() {
                const topics = HalDoAI.getAllTopics();
                return `

                `;
            },

            searchWissen() {
                const input = document.getElementById('wissen-search');
                const results = document.getElementById('wissen-results');
                if (!input || !results) return;
                const query = input.value.trim();
                if (!query) { results.innerHTML = ''; return; }
                const found = HalDoAI.search(query);
                if (found.length === 0) {
                    results.innerHTML = '<div style="opacity:0.3;font-size:7px;">Keine Themen gefunden.</div>';
                    return;
                }
                results.innerHTML = found.map(f =>
                    `<div class="card" style="cursor:pointer;padding:2px 5px;font-size:7px;" onclick="AppRouter.showWissen('${f.topic}')">📚 ${f.topic}</div>`
                ).join('');
            },

            randomWissen() {
                const fact = HalDoAI.getRandomFact();
                const content = document.getElementById('wissen-content');
                if (content) content.textContent = fact;
                speak(fact);
            },

            showWissen(topic) {
                const content = document.getElementById('wissen-content');
                if (!content) return;
                const text = HalDoAI.knowledge[topic.replace(/ /g, '_')] || HalDoAI.knowledge[topic];
                if (text) {
                    content.innerHTML = `<strong>📚 ${topic}</strong><br>${text}`;
                    speak(text.substring(0, 120) + '...');
                }
            },

            // =========================================================

            // =========================================================
            renderAIMemory() {
                const memories = Storage.get('ai_memory', []);
                return `
                    <div style="margin-bottom:4px;">
                        <button onclick="AppRouter.clearAIMemory()" class="btn-danger">🗑️ Memory löschen</button>
                    </div>
                    <div id="memory-list">
                        ${memories.length === 0 ? '<div style="opacity:0.3;text-align:center;padding:12px;font-size:8px;">🧠 Keine Erinnerungen</div>' :
                        memories.map((m, i) => `

                                <div class="card-title">${m.title || 'Erinnerung'}</div>
                                <div style="font-size:7px;opacity:0.5;">${new Date(m.createdAt).toLocaleString()}</div>
                                <div style="font-size:8px;margin-top:1px;">${m.content}</div>
                                <div class="card-actions">
                                    <button onclick="AppRouter.deleteMemory(${i})" class="btn-danger">Löschen</button>

                            </div>

                    </div>
                    <div class="flex-row" style="margin-top:3px;">

                        <button onclick="AppRouter.saveMemory()" class="btn-primary">💾</button>
                    </div>
                `;
            },

            saveMemory() {
                const title = document.getElementById('memory-title');
                const content = document.getElementById('memory-content');
                if (!title || !content) return;
                const memories = Storage.get('ai_memory', []);
                memories.push({ title: title.value || 'Erinnerung', content: content.value, createdAt: new Date()
                        .toISOString() });
                Storage.set('ai_memory', memories);
                title.value = '';
                content.value = '';
                this.renderAIMemory();
                speak('Erinnerung gespeichert.');
            },

            deleteMemory(index) {
                const memories = Storage.get('ai_memory', []);
                memories.splice(index, 1);
                Storage.set('ai_memory', memories);
                this.renderAIMemory();
            },

            clearAIMemory() {
                if (confirm('Alle Erinnerungen löschen?')) {
                    Storage.set('ai_memory', []);
                    this.renderAIMemory();
                    speak('Memory gelöscht.');
                }
            },

            renderKnowledgeApp(appId) {
                const names = {

            createBackup() {
                const data = { version: HALDO_VERSION, createdAt: new Date().toISOString(), data: Storage.getAll() };
                const backups = Storage.get('backups', []);
                backups.push(data);
                Storage.set('backups', backups);
                speak('Backup erstellt.');
                this.renderBackup();
            },

            restoreBackup(index) {
                const backups = Storage.get('backups', []);
                if (index === undefined || index === null) {
                    if (backups.length === 0) { speak('Keine Backups.'); return; }
                    index = backups.length - 1;
                }
                const backup = backups[index];
                if (!backup) { speak('Backup nicht gefunden.'); return; }
                if (confirm(`Backup vom ${new Date(backup.createdAt).toLocaleString()} wiederherstellen?`)) {
                    Object.entries(backup.data).forEach(([key, val]) => Storage.set(key, val));
                    speak('Backup wiederhergestellt.');
                    setTimeout(() => location.reload(), 1000);
                }
            },

            deleteBackup(index) {
                const backups = Storage.get('backups', []);
                backups.splice(index, 1);
                Storage.set('backups', backups);
                this.renderBackup();
            },

                        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px;">
                            ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(b =>
                                `<button onclick="AppRouter.calcPress('${b}')" style="padding:6px;border-radius:3px;background:${['C','±','%','÷','×','−','+','='].includes(b)?'rgba(255,200,80,0.10)':'rgba(255,255,255,0.02)'};color:#fff;border:1px solid rgba(255,255,255,0.03);cursor:pointer;font-size:10px;">${b}</button>`
                            ).join('')}
                        </div>
                    </div>
                `;
            },

            calcPress(val) {
                const display = document.getElementById('calc-display');
                if (!display) return;
                if (!this._calcExpr) this._calcExpr = '';
                if (val === 'C') { this._calcExpr = '';
                    display.textContent = '0'; return; }
                if (val === '⌫') { this._calcExpr = this._calcExpr.slice(0, -1);
                    display.textContent = this._calcExpr || '0'; return; }
                if (val === '=') {
                    try {
                        const result = Function('"use strict"; return (' + this._calcExpr.replace('×', '*').replace('÷', '/')
                            .replace('−', '-') + ')')();
                        display.textContent = result;
                        this._calcExpr = String(result);
                    } catch (e) { display.textContent = 'Fehler';
                        this._calcExpr = ''; }
                    return;
                }
                this._calcExpr += val;
                display.textContent = this._calcExpr;
            },

                `;

            timerStart() {
                const input = document.getElementById('timer-input');
                const display = document.getElementById('timer-display');
                if (!display) return;
                if (this._timerInterval) return;
                let seconds = parseInt(input?.value) || 30;
                if (seconds < 1) seconds = 1;
                if (seconds > 3600) seconds = 3600;
                this._timerSeconds = seconds;
                this._timerInterval = setInterval(() => {
                    if (this._timerSeconds <= 0) {
                        clearInterval(this._timerInterval);
                        this._timerInterval = null;
                        speak('Timer abgelaufen!');
                        display.textContent = '00:00';
                        return;
                    }
                    this._timerSeconds--;
                    const mins = Math.floor(this._timerSeconds / 60);
                    const secs = this._timerSeconds % 60;
                    display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                }, 1000);
            },

            timerStop() {
                if (this._timerInterval) { clearInterval(this._timerInterval);
                    this._timerInterval = null; }
            },

            timerReset() {
                this.timerStop();
                const display = document.getElementById('timer-display');
                if (display) display.textContent = '00:30';
            },

            translateText() {
                const text = document.getElementById('trans-text');
                const result = document.getElementById('trans-result');
                if (!text || !result) return;
                const input = text.value.trim();
                if (!input) { result.textContent = '⚠️ Bitte Text eingeben.'; return; }
                const to = document.getElementById('trans-to')?.value || 'en';
                const dict = {
                    'en': { 'Hallo': 'Hello', 'Danke': 'Thank you', 'Guten Tag': 'Good day' },
                    'de': { 'Hello': 'Hallo', 'Thank you': 'Danke', 'Good day': 'Guten Tag' },
                    'ku': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' },
                    'esq': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' }
                };
                const d = dict[to] || {};
                let translated = input;
                for (const [key, val] of Object.entries(d)) {
                    if (input.toLowerCase().includes(key.toLowerCase())) {
                        translated = translated.replace(new RegExp(key, 'gi'), val);
                    }
                }
                result.textContent = `🌍 ${translated}`;
            },

            setLogoState(state) {
