<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apps Web 3.0</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1f6feb">

<link rel="apple-touch-icon" href="icon.png">

</head>


<body>


<div class="app">


<header>

<div class="top-navigation">

<button onclick="goBack()">
⬅️
</button>

<h1>
Apps Web 3.0
</h1>

<button onclick="goForward()">
➡️
</button>

</div>


<p id="subtitle">
Login
</p>


</header>





<!-- LOGIN -->

<section id="loginPage" class="page">


<h2>
Anmelden
</h2>


<input 
id="loginName"
placeholder="Benutzername"
>


<input 
id="loginPassword"
type="password"
placeholder="Passwort"
>


<button onclick="login()">
Anmelden
</button>


</section>







<!-- DASHBOARD -->

<section id="dashboard" class="page hidden">


<h2>
Dashboard
</h2>



<div class="welcome-card">


<h3>
Hallo <span id="activeUser"></span> 👋
</h3>


<p>
🟢 HalDo AI Online
</p>


<p>
💬 Nachrichten:
<span id="messageCount">
0
</span>
</p>


</div>




<div class="cards">



<button class="app-card" onclick="openHalDoAI()">


<div class="logo">
🤖
</div>


<h3>
HalDo AI
</h3>


<p>
Chat & Sprache
</p>


</button>





<button class="app-card" onclick="openProfile()">


<div class="logo">
👤
</div>


<h3>
Profil
</h3>


<p>
Einstellungen
</p>


</button>






<button class="app-card">


<div class="logo">
☁️
</div>


<h3>
Cloud
</h3>


<p>
Synchronisierung
</p>


</button>





<button class="app-card">


<div class="logo">
🔔
</div>


<h3>
Aktivität
</h3>


<p>
Updates
</p>


</button>



</div>



</section>







<!-- HALDO AI -->


<section id="haldoPage" class="page hidden">


<div class="haldo-header">


<div class="haldo-logo">
🤖
</div>


<h2>
HalDo AI
</h2>


<p>
Dein persönlicher Assistent
</p>


</div>





<div id="chatBox" class="chat"></div>





<div class="input-area">


<input
id="messageInput"
placeholder="HalDo fragen..."
>



<button onclick="startVoice()">
🎤
</button>



<button onclick="sendMessage()">
➤
</button>



</div>



</section>







<!-- PROFIL -->


<section id="profilePage" class="page hidden">


<h2>
Mein Profil
</h2>



<div class="profile-avatar">
👤
</div>


<input 
id="profileName"
placeholder="Neuer Name"
>


<button onclick="changeName()">
Speichern
</button>



</section>








<!-- APP NAVIGATION -->


<nav>


<button onclick="goDashboard()">
🏠
<br>
Home
</button>


<button onclick="openHalDoAI()">
🤖
<br>
HalDo
</button>


<button onclick="openProfile()">
👤
<br>
Profil
</button>


</nav>




</div>



<script src="script.js"></script>


</body>

</html>
