<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Web 3.0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>Apps Web 3.0</h1>
        <p>Mobile Version</p>
    </header>

    <main id="chatBox" class="chat">
        <div class="message bot">
            Willkommen bei Apps Web 3.0 👋
        </div>
    </main>

    <div class="input-area">
        <input 
            id="messageInput" 
            type="text" 
            placeholder="Nachricht schreiben..."
        >

        <button onclick="sendMessage()">
            Senden
        </button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
