<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apps Web 3.0</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1f6feb">

</head>


<body>


<div class="app">


<header>

<h1>Apps Web 3.0</h1>

<p id="subtitle">Home</p>

</header>



<section id="home" class="page">


<h2 id="welcome">
Willkommen
</h2>


<div class="icons">


<button onclick="openChat()">
💬
<span>Chat</span>
</button>


<button onclick="openSettings()">
⚙️
<span>Einstellungen</span>
</button>


<button>
📁
<span>Dateien</span>
</button>


<button>
🌐
<span>Web</span>
</button>


</div>


</section>



<section id="chatPage" class="page hidden">

<div class="input-area">


<input id="messageInput"
placeholder="Nachricht schreiben...">


<button onclick="sendMessage()">
➤
</button>


</div>


<button class="delete" onclick="clearChat()">
🗑 Löschen
</button>


</section>

<h2>Einstellungen</h2>


<input id="nameInput"
placeholder="Dein Name">


<button onclick="saveName()">
Speichern
</button>


</section>



<nav>


<button onclick="goHome()">
🏠<br>
Home
</button>


<button onclick="openChat()">
💬<br>
Chat
</button>


<button onclick="openSettings()">
⚙️<br>
Einstellungen
</button>


</nav>


</div>



<script src="script.js"></script>
