<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050816">
    <title>HalDo AI OS — Professional Universe</title>

    <style>
        /* =========================================================
           HALDO AI OS — KOMPLETTE STYLES
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --haldo-gold: #ffd54b;
            --haldo-gold-dark: #ff9f1c;
            --haldo-bg: #02030a;
            --haldo-surface: rgba(10,14,30,0.92);
            --haldo-border: rgba(255,255,255,.08);
            --haldo-text: #ffffff;
            --haldo-radius: 16px;
            --haldo-shadow: 0 20px 60px rgba(0,0,0,.5);
            --haldo-font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--haldo-bg);
            color: var(--haldo-text);
            font-family: var(--haldo-font);
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea, select { font: inherit; }
        button { border: 0; outline: none; cursor: pointer; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }

        /* =========================================================
           MASTER DISPLAY
           ========================================================= */

        #haldo-os {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, rgba(35,73,150,.16), transparent 30%),
                        radial-gradient(circle at 20% 20%, rgba(70,110,255,.08), transparent 30%),
                        radial-gradient(circle at 80% 80%, rgba(150,70,255,.07), transparent 32%),
                        var(--haldo-bg);
        }

        .haldo-cosmic-world {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(circle at center, rgba(15,30,75,.28), transparent 42%);
        }

        .haldo-space {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.025), transparent 52%);
        }

        /* =========================================================
           STARS
           ========================================================= */

        .haldo-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .haldo-star {
            position: absolute;
            display: block;
            border-radius: 50%;
            background: rgba(255,255,255,.95);
            box-shadow: 0 0 5px rgba(255,255,255,.9);
            animation: haldo-star-twinkle var(--star-speed, 4s) ease-in-out infinite;
            animation-delay: var(--star-delay, 0s);
        }

        @keyframes haldo-star-twinkle {
            0%, 100% { opacity: .2; transform: scale(.7); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        /* =========================================================
           COSMIC CENTER
           ========================================================= */

        .haldo-cosmic-center {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(92vw, 950px);
            height: min(92vw, 950px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* =========================================================
           ORBIT SYSTEM — 12 PLANETEN
           ========================================================= */

        .haldo-orbit-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .haldo-orbit-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(120,175,255,.12);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(70,150,255,.04);
            animation: haldo-ring-pulse 8s ease-in-out infinite;
        }

        @keyframes haldo-ring-pulse {
            0%, 100% { opacity: .4; }
            50% { opacity: .8; }
        }

        /* 12 ORBIT-RINGE */
        .haldo-orbit-ring-1 { width: 12%; height: 12%; }
        .haldo-orbit-ring-2 { width: 19%; height: 19%; transform: translate(-50%, -50%) rotate(18deg); }
        .haldo-orbit-ring-3 { width: 27%; height: 27%; transform: translate(-50%, -50%) rotate(-12deg); }
        .haldo-orbit-ring-4 { width: 35%; height: 35%; transform: translate(-50%, -50%) rotate(25deg); }
        .haldo-orbit-ring-5 { width: 44%; height: 44%; transform: translate(-50%, -50%) rotate(-8deg); }
        .haldo-orbit-ring-6 { width: 53%; height: 53%; transform: translate(-50%, -50%) rotate(32deg); }
        .haldo-orbit-ring-7 { width: 62%; height: 62%; transform: translate(-50%, -50%) rotate(-15deg); }
        .haldo-orbit-ring-8 { width: 71%; height: 71%; transform: translate(-50%, -50%) rotate(22deg); }
        .haldo-orbit-ring-9 { width: 80%; height: 80%; transform: translate(-50%, -50%) rotate(-28deg); }
        .haldo-orbit-ring-10 { width: 88%; height: 88%; transform: translate(-50%, -50%) rotate(12deg); }
        .haldo-orbit-ring-11 { width: 95%; height: 95%; transform: translate(-50%, -50%) rotate(-18deg); }
        .haldo-orbit-ring-12 { width: 102%; height: 102%; transform: translate(-50%, -50%) rotate(35deg); }

        /* =========================================================
           PLANETEN — 12 STÜCK
           ========================================================= */

        .haldo-planet-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .haldo-planet-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: haldo-orbit-spin var(--orbit-speed, 20s) linear infinite;
            animation-direction: var(--orbit-direction, normal);
        }

        @keyframes haldo-orbit-spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .haldo-planet {
            position: absolute;
            left: 50%;
            top: 0;
            width: var(--planet-size, 14px);
            height: var(--planet-size, 14px);
            margin-left: calc(var(--planet-size, 14px) / -2);
            margin-top: calc(var(--planet-size, 14px) / -2);
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            background: var(--planet-bg, radial-gradient(circle at 35% 30%, #ffffff, #8fc8ff 28%, #3263bd 62%, #0d1c43 100%));
            box-shadow: 0 0 var(--planet-glow-size, 10px) var(--planet-glow, rgba(80,170,255,.6));
            animation: haldo-planet-pulse 3s ease-in-out infinite;
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .haldo-planet:hover {
            transform: scale(1.3);
            box-shadow: 0 0 25px var(--planet-glow, rgba(80,170,255,.8));
            z-index: 100;
        }

        @keyframes haldo-planet-pulse {
            0%, 100% { filter: brightness(.9); }
            50% { filter: brightness(1.15); }
        }

        /* PLANET 1 — Merkur */
        .haldo-planet-1 {
            --planet-size: 10px;
            --planet-bg: radial-gradient(circle at 35% 30%, #ddd, #8a8a8a 55%, #444);
            --planet-glow: rgba(200,200,200,.4);
            --planet-glow-size: 8px;
        }

        /* PLANET 2 — Venus */
        .haldo-planet-2 {
            --planet-size: 14px;
            --planet-bg: radial-gradient(circle at 35% 30%, #ffecb3, #d4a843 50%, #8a5a1a);
            --planet-glow: rgba(255,200,100,.5);
            --planet-glow-size: 12px;
        }

        /* PLANET 3 — ERDE */
        .haldo-planet-3 {
            --planet-size: 18px;
            --planet-bg: radial-gradient(circle at 35% 30%, #b8f2ff 0%, #2b91df 23%, #1264ad 58%, #062b61 100%);
            --planet-glow: rgba(50,180,255,.8);
            --planet-glow-size: 16px;
        }
        .haldo-planet-3::after {
            content: '';
            position: absolute;
            width: 40%;
            height: 22%;
            left: 20%;
            top: 28%;
            border-radius: 60% 40% 55% 45%;
            background: rgba(60,200,100,.7);
            transform: rotate(-15deg);
        }
        .haldo-planet-3 .moon-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 220%;
            height: 220%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            animation: moon-orbit-spin 3.8s linear infinite;
        }
        .haldo-planet-3 .moon {
            position: absolute;
            left: 50%;
            top: -4px;
            width: 6px;
            height: 6px;
            margin-left: -3px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, #b0b8c5 55%, #666);
            box-shadow: 0 0 6px rgba(255,255,255,.5);
        }
        @keyframes moon-orbit-spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* PLANET 4 — Mars */
        .haldo-planet-4 {
            --planet-size: 14px;
            --planet-bg: radial-gradient(circle at 35% 30%, #ffc4a0, #c94a2a 50%, #6b1a10);
            --planet-glow: rgba(255,100,60,.6);
            --planet-glow-size: 12px;
        }

        /* PLANET 5 — Jupiter */
        .haldo-planet-5 {
            --planet-size: 32px;
            --planet-bg: repeating-linear-gradient(0deg, #e8c8a0 0 6px, #b0885a 6px 10px, #d8b888 10px 14px);
            --planet-glow: rgba(255,200,150,.4);
            --planet-glow-size: 18px;
        }

        /* PLANET 6 — Saturn mit Ring */
        .haldo-planet-6 {
            --planet-size: 28px;
            --planet-bg: radial-gradient(circle at 35% 30%, #f5e0b0, #c8a050 55%, #7a5a2a);
            --planet-glow: rgba(255,210,120,.4);
            --planet-glow-size: 16px;
        }
        .haldo-planet-6::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 200%;
            height: 35%;
            transform: translate(-50%, -50%) rotate(-18deg);
            border: 2px solid rgba(200,180,140,.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(200,180,140,.2);
        }

        /* PLANET 7 — Uranus */
        .haldo-planet-7 {
            --planet-size: 22px;
            --planet-bg: radial-gradient(circle at 35% 30%, #c8f5ff, #5ab0c8 50%, #1a5a6a);
            --planet-glow: rgba(100,220,255,.5);
            --planet-glow-size: 14px;
        }

        /* PLANET 8 — Neptun */
        .haldo-planet-8 {
            --planet-size: 22px;
            --planet-bg: radial-gradient(circle at 35% 30%, #8ab8ff, #3a5ab8 50%, #1a2a5a);
            --planet-glow: rgba(80,120,255,.6);
            --planet-glow-size: 14px;
        }

        /* PLANET 9 — Pluto */
        .haldo-planet-9 {
            --planet-size: 10px;
            --planet-bg: radial-gradient(circle at 35% 30%, #ddd8c8, #9a8a7a 55%, #4a3a2a);
            --planet-glow: rgba(200,180,160,.3);
            --planet-glow-size: 8px;
        }

        /* PLANET 10 — HalDo World */
        .haldo-planet-10 {
            --planet-size: 16px;
            --planet-bg: radial-gradient(circle at 35% 30%, #ffd8e8, #c85a8a 50%, #6a1a3a);
            --planet-glow: rgba(255,100,180,.5);
            --planet-glow-size: 12px;
        }

        /* PLANET 11 — Nova */
        .haldo-planet-11 {
            --planet-size: 12px;
            --planet-bg: radial-gradient(circle at 35% 30%, #aaffd0, #3a9a6a 50%, #1a4a2a);
            --planet-glow: rgba(80,255,150,.4);
            --planet-glow-size: 10px;
        }

        /* PLANET 12 — Astra */
        .haldo-planet-12 {
            --planet-size: 14px;
            --planet-bg: radial-gradient(circle at 35% 30%, #e8d0ff, #8a5ac8 50%, #3a1a6a);
            --planet-glow: rgba(180,120,255,.5);
            --planet-glow-size: 12px;
        }

        /* =========================================================
           SONNE — MIT LOGO + STRAHLEN
           ========================================================= */

        .haldo-sun-container {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(220px, 28vw, 360px);
            height: clamp(220px, 28vw, 360px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: auto;
            cursor: pointer;
        }

        .haldo-sun-core {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 30px rgba(255,220,70,.95), 0 0 80px rgba(255,165,40,.72), 0 0 150px rgba(255,100,20,.38), 0 0 250px rgba(255,80,0,.15);
            animation: haldo-sun-pulse 4s ease-in-out infinite;
        }

        @keyframes haldo-sun-pulse {
            0%, 100% { transform: scale(.98); box-shadow: 0 0 25px rgba(255,220,70,.9); }
            50% { transform: scale(1.035); box-shadow: 0 0 40px rgba(255,220,70,1), 0 0 100px rgba(255,165,40,.8); }
        }

        /* 365 SONNENSTRAHLEN */
        .haldo-sun-rays {
            position: absolute;
            inset: -45%;
            border-radius: 50%;
            pointer-events: none;
            background: repeating-conic-gradient(from 0deg,
                rgba(255,246,180,.0) 0deg,
                rgba(255,246,180,.0) .65deg,
                rgba(255,224,94,.7) .9deg,
                rgba(255,160,35,.15) 1.2deg,
                rgba(255,246,180,.0) 1.8deg,
                rgba(255,246,180,.0) 2.2deg
            );
            mask-image: radial-gradient(circle, transparent 0 48%, #000 49% 53%, transparent 55%);
            -webkit-mask-image: radial-gradient(circle, transparent 0 48%, #000 49% 53%, transparent 55%);
            animation: haldo-sun-rays-spin 35s linear infinite;
        }

        @keyframes haldo-sun-rays-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* SONNEN-AURA */
        .haldo-sun-aura {
            position: absolute;
            inset: -20%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,240,130,.25), rgba(255,174,35,.1) 38%, rgba(255,100,30,.04) 58%, transparent 72%);
            filter: blur(20px);
            animation: haldo-sun-aura-pulse 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes haldo-sun-aura-pulse {
            0%, 100% { transform: scale(.92); opacity: .6; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* =========================================================
           HALDO AI OS — LEUCHTENDES SCHRIFT-LOGO
           ========================================================= */

        .haldo-os-logo-text {
            position: absolute;
            left: 50%;
            top: 60%;
            transform: translateX(-50%);
            z-index: 70;
            font-size: clamp(14px, 2vw, 28px);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffd54b, #ff9f1c, #ffd54b, #ff6b00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: haldo-logo-text-glow 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255,200,80,.3), 0 0 60px rgba(255,200,80,.15);
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes haldo-logo-text-glow {
            0%, 100% { background-position: 0% 50%; filter: drop-shadow(0 0 10px rgba(255,200,80,.2)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 25px rgba(255,200,80,.5)); }
        }

        .haldo-os-logo-text .haldo-highlight {
            color: #fff;
            -webkit-text-fill-color: #fff;
            background: none;
            text-shadow: 0 0 20px rgba(255,255,255,.5), 0 0 40px rgba(255,200,80,.3);
        }

        /* =========================================================
           HALDO LOGO — LEBENDIG IN DER SONNE
           ========================================================= */

        .haldo-logo-in-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 42%;
            height: 42%;
            transform: translate(-50%, -50%);
            z-index: 60;
            border-radius: 50%;
            pointer-events: none;
        }

        .haldo-logo-in-sun img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px rgba(255,255,255,.85)) drop-shadow(0 0 30px rgba(255,205,70,.9));
            animation: haldo-logo-living 4.2s ease-in-out infinite;
        }

        @keyframes haldo-logo-living {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.02) rotate(0.5deg); }
            50% { transform: scale(1.035) rotate(0deg); }
            75% { transform: scale(1.01) rotate(-0.5deg); }
        }

        /* =========================================================
           LIVING HALDO AI — MENSCHLICHE PRÄSENZ
           ========================================================= */

        .haldo-living-avatar {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 55%;
            height: 55%;
            transform: translate(-50%, -50%);
            z-index: 40;
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .haldo-living-avatar .avatar-aura {
            position: absolute;
            inset: -12%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.2), rgba(255,220,100,.12) 35%, rgba(100,190,255,.06) 55%, transparent 75%);
            filter: blur(10px);
            animation: haldo-avatar-aura 3.5s ease-in-out infinite;
        }

        @keyframes haldo-avatar-aura {
            0%, 100% { opacity: .4; transform: scale(.9); }
            50% { opacity: .9; transform: scale(1.08); }
        }

        .haldo-living-avatar img {
            position: relative;
            z-index: 4;
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 0 8px rgba(255,255,255,.7)) drop-shadow(0 0 22px rgba(255,205,70,.6));
            transition: all .3s ease;
        }

        /* AVATAR ZUSTÄNDE */
        .haldo-living-avatar[data-state="idle"] img { animation: haldo-avatar-idle 4.8s ease-in-out infinite; }
        .haldo-living-avatar[data-state="listening"] img { animation: haldo-avatar-listening 1.6s ease-in-out infinite; }
        .haldo-living-avatar[data-state="thinking"] img { animation: haldo-avatar-thinking 2.2s ease-in-out infinite; }
        .haldo-living-avatar[data-state="speaking"] img { animation: haldo-avatar-speaking .6s ease-in-out infinite; }
        .haldo-living-avatar[data-state="happy"] img { animation: haldo-avatar-happy .7s ease-out 1; }

        @keyframes haldo-avatar-idle {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(-2px) scale(1.01) rotate(0.3deg); }
            50% { transform: translateY(0) scale(1.015) rotate(0deg); }
            75% { transform: translateY(1px) scale(1.005) rotate(-0.3deg); }
        }

        @keyframes haldo-avatar-listening {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes haldo-avatar-thinking {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }

        @keyframes haldo-avatar-speaking {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.045); }
        }

        @keyframes haldo-avatar-happy {
            0% { transform: scale(.92); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* HÄNDE */
        .haldo-living-avatar .hand {
            position: absolute;
            width: 16%;
            height: 16%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.35), rgba(255,200,100,.12) 50%, transparent 70%);
            filter: blur(1px);
            opacity: .4;
            animation: haldo-hand-move 3.8s ease-in-out infinite;
        }

        .haldo-living-avatar .hand-left { left: -2%; top: 35%; animation-delay: 0s; }
        .haldo-living-avatar .hand-right { right: -2%; top: 35%; animation-delay: 1.9s; }

        @keyframes haldo-hand-move {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(0, -6px) scale(1.08); }
        }

        /* MUND (LIP-SYNC) */
        .haldo-living-avatar .mouth {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 20%;
            height: 5%;
            border-radius: 50%;
            background: rgba(255,200,150,.25);
            border: 1px solid rgba(255,255,255,.08);
            transition: all .1s ease;
        }

        .haldo-living-avatar[data-state="speaking"] .mouth {
            animation: haldo-mouth-speak .3s ease-in-out infinite alternate;
        }

        @keyframes haldo-mouth-speak {
            0% { height: 4%; transform: translateX(-50%) scaleY(.7); }
            100% { height: 11%; transform: translateX(-50%) scaleY(1.2); }
        }

        /* AUGEN */
        .haldo-living-avatar .eyes {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 11%;
            display: flex;
            justify-content: space-between;
        }

        .haldo-living-avatar .eye {
            width: 28%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.06);
            position: relative;
        }

        .haldo-living-avatar .eye::after {
            content: '';
            position: absolute;
            width: 32%;
            height: 32%;
            border-radius: 50%;
            background: rgba(255,220,100,.5);
            top: 30%;
            left: 30%;
            transition: all .3s ease;
        }

        .haldo-living-avatar[data-state="listening"] .eye::after {
            animation: haldo-eye-listen 1.2s ease-in-out infinite;
        }

        .haldo-living-avatar[data-state="thinking"] .eye::after {
            animation: haldo-eye-think 1.8s ease-in-out infinite;
        }

        @keyframes haldo-eye-listen {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        @keyframes haldo-eye-think {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(4px, -3px); }
        }

        /* =========================================================
           MENÜ BUTTONS
           ========================================================= */

        .haldo-menu-button {
            position: fixed;
            z-index: 9500;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(8,12,30,0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all .25s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,.3);
        }

        .haldo-menu-button:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,.12);
            border-color: rgba(255,200,80,.3);
        }

        .haldo-menu-button img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-menu-button.system { top: 16px; left: 16px; }
        .haldo-menu-button.apps { bottom: 16px; left: 50%; transform: translateX(-50%); }
        .haldo-menu-button.apps:hover { transform: translateX(-50%) scale(1.05); }

        /* =========================================================
           MENÜ PANELS
           ========================================================= */

        .haldo-menu-panel {
            position: fixed;
            z-index: 9600;
            width: min(420px, calc(100vw - 24px));
            max-height: min(75vh, calc(100dvh - 100px));
            overflow-y: auto;
            padding: 16px;
            border-radius: 20px;
            background: var(--haldo-surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--haldo-border);
            box-shadow: var(--haldo-shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(.96);
            transition: all .3s ease;
            color: #fff;
        }

        .haldo-menu-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .haldo-menu-panel.system-panel { top: 72px; left: 16px; }
        .haldo-menu-panel.apps-panel { bottom: 76px; left: 50%; transform: translateX(-50%) translateY(12px) scale(.96); }
        .haldo-menu-panel.apps-panel.open { transform: translateX(-50%) translateY(0) scale(1); }

        .haldo-menu-panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--haldo-border);
            margin-bottom: 12px;
        }

        .haldo-menu-panel-header img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-menu-panel-header .title { font-size: 16px; font-weight: 700; flex: 1; }

        .haldo-menu-panel-header .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,.06);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .haldo-menu-panel-header .close-btn:hover { background: rgba(255,80,80,.2); }

        .haldo-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.04);
            color: rgba(255,255,255,.85);
            cursor: pointer;
            transition: all .2s ease;
            margin-bottom: 6px;
        }

        .haldo-menu-item:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,200,80,.15);
            transform: translateX(3px);
        }

        .haldo-menu-item .icon { font-size: 20px; width: 32px; text-align: center; }
        .haldo-menu-item .info { flex: 1; min-width: 0; }
        .haldo-menu-item .info .name { font-size: 13px; font-weight: 600; }
        .haldo-menu-item .info .desc { font-size: 10px; opacity: .5; margin-top: 2px; }

        /* =========================================================
           AI CHAT WINDOW — PROFESSIONELL
           ========================================================= */

        .haldo-ai-chat-window {
            position: fixed;
            z-index: 9000;
            width: min(580px, calc(100vw - 24px));
            height: min(660px, calc(100vh - 40px));
            right: 18px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 24px;
            background: var(--haldo-surface);
            backdrop-filter: blur(28px);
            box-shadow: var(--haldo-shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(18px) scale(.97);
            transition: opacity .25s ease, transform .25s ease, visibility .25s;
            color: #fff;
        }

        .haldo-ai-chat-window.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .haldo-ai-chat-window.minimized { height: 60px; min-height: 60px; }
        .haldo-ai-chat-window.minimized .haldo-chat-body,
        .haldo-ai-chat-window.minimized .haldo-chat-footer { display: none; }

        .haldo-chat-header {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px 8px 18px;
            cursor: grab;
            user-select: none;
            border-bottom: 1px solid var(--haldo-border);
        }

        .haldo-chat-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .haldo-chat-title img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-chat-title .haldo-title-glow {
            background: linear-gradient(135deg, #ffd54b, #ff9f1c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255,200,80,.3);
        }

        .haldo-chat-subtitle { font-size: 11px; opacity: .55; margin-top: 2px; }

        .haldo-chat-controls { display: flex; gap: 4px; }

        .haldo-chat-control {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 9px;
            background: rgba(255,255,255,.07);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        .haldo-chat-control:hover { background: rgba(255,255,255,.14); }

        .haldo-chat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

        .haldo-chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .haldo-chat-message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            word-break: break-word;
            animation: haldoMessageIn .25s ease-out;
        }

        .haldo-chat-message-user {
            align-self: flex-end;
            background: rgba(255,255,255,.12);
            border-bottom-right-radius: 4px;
        }

        .haldo-chat-message-ai {
            align-self: flex-start;
            background: rgba(255,220,140,.10);
            border: 1px solid rgba(255,255,255,.07);
            border-bottom-left-radius: 4px;
        }

        .haldo-chat-typing {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 0 16px 8px;
        }

        .haldo-chat-typing.active { display: flex; }

        .haldo-chat-typing span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: .35;
            animation: haldoTypingDot 1s ease-in-out infinite;
        }

        .haldo-chat-typing span:nth-child(2) { animation-delay: .12s; }
        .haldo-chat-typing span:nth-child(3) { animation-delay: .24s; }

        @keyframes haldoTypingDot {
            0%, 100% { transform: translateY(0); opacity: .3; }
            50% { transform: translateY(-4px); opacity: .9; }
        }

        @keyframes haldoMessageIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .haldo-chat-footer {
            padding: 10px 12px 14px;
            border-top: 1px solid var(--haldo-border);
        }

        .haldo-chat-input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .haldo-chat-input {
            flex: 1;
            min-height: 44px;
            max-height: 150px;
            resize: none;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            padding: 11px 14px;
            background: rgba(255,255,255,.06);
            color: #fff;
            font: inherit;
            outline: none;
            line-height: 1.4;
        }

        .haldo-chat-input:focus { border-color: rgba(255,255,255,.25); }
        .haldo-chat-input::placeholder { color: rgba(255,255,255,.3); }

        .haldo-chat-send,
        .haldo-chat-voice {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            border: 0;
            border-radius: 13px;
            background: rgba(255,255,255,.08);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            transition: all .2s ease;
        }

        .haldo-chat-send:hover,
        .haldo-chat-voice:hover { background: rgba(255,255,255,.15); }

        .haldo-chat-voice.listening {
            background: rgba(255,80,80,.25);
            box-shadow: 0 0 20px rgba(255,80,80,.15);
        }

        /* =========================================================
           APP WINDOWS
           ========================================================= */

        .haldo-app-window {
            position: fixed;
            z-index: 9999;
            width: min(540px, 92vw);
            max-height: 75vh;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--haldo-surface);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: var(--haldo-shadow);
            overflow: auto;
            color: #fff;
            animation: haldoAppWindowIn .25s ease-out;
        }

        @keyframes haldoAppWindowIn {
            from { opacity: 0; transform: translate(-50%, -45%) scale(.96); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .haldo-app-window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--haldo-border);
        }

        .haldo-app-window-header .title {
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .haldo-app-window-header .title img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-app-window-header .title .app-glow {
            background: linear-gradient(135deg, #ffd54b, #ff9f1c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .haldo-app-window-close {
            background: rgba(255,255,255,.08);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all .2s ease;
        }

        .haldo-app-window-close:hover { background: rgba(255,80,80,.3); }

        .haldo-app-window-body {
            padding: 16px;
            overflow-y: auto;
            max-height: 60vh;
        }

        /* =========================================================
           STATUS BAR
           ========================================================= */

        .haldo-status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9400;
            height: 24px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--haldo-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 10px;
            color: rgba(255,255,255,.4);
            font-family: monospace;
        }

        .haldo-status-bar .version { color: rgba(255,200,80,.6); }
        .haldo-status-bar .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .haldo-status-bar .status-dot.online {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76,175,80,.4);
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 700px) {
            .haldo-cosmic-center { width: 96vw; height: 96vw; }
            .haldo-orbit-system { transform: translate(-50%, -50%) scale(.72); }
            .haldo-sun-container { width: 190px; height: 190px; }

            .haldo-menu-button { width: 44px; height: 44px; font-size: 18px; }
            .haldo-menu-button.system { top: 12px; left: 12px; }
            .haldo-menu-button.apps { bottom: 12px; }

            .haldo-menu-panel.system-panel { top: 64px; left: 12px; width: calc(100vw - 24px); }
            .haldo-menu-panel.apps-panel { bottom: 68px; width: calc(100vw - 24px); }

            .haldo-ai-chat-window {
                right: 8px;
                bottom: 8px;
                width: calc(100vw - 16px);
                height: min(600px, calc(100vh - 16px));
                border-radius: 18px;
            }
            .haldo-chat-message { max-width: 90%; }

            .haldo-app-window {
                width: calc(100vw - 16px);
                max-height: 80vh;
                border-radius: 18px;
            }

            .haldo-status-bar { font-size: 8px; height: 20px; padding: 0 8px; }
            .haldo-os-logo-text { font-size: clamp(10px, 1.5vw, 18px); top: 65%; }
        }

        @media (max-width: 420px) {
            .haldo-ai-chat-window {
                right: 0;
                bottom: 0;
                width: 100vw;
                height: 100dvh;
                border-radius: 0;
            }
            .haldo-sun-container { width: 145px; height: 145px; }
            .haldo-cosmic-center { width: 100vw; height: 100vw; }
            .haldo-menu-panel { width: calc(100vw - 12px); left: 6px; right: 6px; }
            .haldo-menu-panel.system-panel { top: 60px; }
            .haldo-menu-panel.apps-panel { bottom: 62px; }
            .haldo-os-logo-text { font-size: clamp(8px, 1.2vw, 14px); top: 68%; letter-spacing: 2px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

        // =========================================================

        function generateStars() {
            const stars = document.getElementById("haldo-stars");
            if (!stars) return;
            stars.innerHTML = "";
            const count = Math.min(350, Math.max(180, Math.floor(window.innerWidth * window.innerHeight / 7000)));
            for (let i = 0; i < count; i++) {
                const star = document.createElement("span");
                star.className = "haldo-star";
                const size = Math.random() * 3 + 0.5;
                star.style.width = size + "px";
                star.style.height = size + "px";
                star.style.left = Math.random() * 100 + "%";
                star.style.top = Math.random() * 100 + "%";
                star.style.setProperty('--star-speed', (2 + Math.random() * 6) + 's');
                star.style.setProperty('--star-delay', (Math.random() * 6) + 's');
                stars.appendChild(star);
            }
        }

        // =========================================================
        // 2. TIME DISPLAY
        // =========================================================

        function updateTimeDisplay() {
            const el = document.getElementById("haldo-time-display");
            if (el) el.textContent = new Date().toLocaleTimeString();
        }

        // =========================================================
        // 3. EVENT BUS
        // =========================================================

        window.HalDo = window.HalDo || {};
        window.HalDo.events = window.HalDo.events || new EventTarget();

        window.HalDo.emit = function(name, detail = {}) {
            window.HalDo.events.dispatchEvent(new CustomEvent(name, { detail }));
        };

        window.HalDo.on = function(name, callback) {
            if (typeof callback !== "function") return;
            window.HalDo.events.addEventListener(name, callback);
        };

        // =========================================================
        // 4. STORAGE
        // =========================================================

        window.HalDo.Storage = {
            prefix: "haldo_",

            get(key, defaultValue = null) {
                try {
                    const value = localStorage.getItem(this.prefix + key);
                    if (value === null) return defaultValue;
                    try { return JSON.parse(value); } catch(e) { return value; }
                } catch(e) { return defaultValue; }
            },

            set(key, value) {
                try {
                    localStorage.setItem(this.prefix + key, JSON.stringify(value));
                    return true;
                } catch(e) { return false; }
            },

            remove(key) {
                try {
                    localStorage.removeItem(this.prefix + key);
                    return true;
                } catch(e) { return false; }
            },

            getAll() {
                const result = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try {
                            result[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k));
                        } catch(e) {
                            result[k.replace(this.prefix, '')] = localStorage.getItem(k);
                        }
                    });
                } catch(e) {}
                return result;
            }
        };

            getKnowledge(topic, lang = 'de') {
                const topicLower = topic.toLowerCase();
                if (this.knowledgeBase[topicLower] && this.knowledgeBase[topicLower][lang]) {
                    return this.knowledgeBase[topicLower][lang];
                }
                return null;
            },

            async ask(text, options = {}) {
                this.init();
                const clean = String(text || "").trim();
                if (!clean) return this.translate("Bitte sag mir, was ich für dich tun kann. 🌌", options.lang || 'de');

                const lower = clean.toLowerCase();
                const detectedLang = this.detectLanguage(clean);
                const lang = options.lang || detectedLang || 'de';

                // === WISSEN ABFRAGEN ===
                const topics = ['ai', 'weltall', 'haldo', 'erde', 'sonne', 'programmieren', 'video', 'gesundheit', 'bildung', 'verkehr', 'universum', 'galaxie', 'stern', 'planet'];
                for (const topic of topics) {
                    if (lower.includes(topic) || lower.includes(topic + ' ')) {
                        const knowledge = this.getKnowledge(topic, lang);
                        if (knowledge) return knowledge;
                        const knowledgeDe = this.getKnowledge(topic, 'de');
                        if (knowledgeDe) return this.translate(knowledgeDe, lang);
                    }
                }

                // === APP ÖFFNEN ===
                if (lower.includes("öffne") || lower.includes("open") || lower.includes("starte") || lower.includes("zeige") || lower.includes("start")) {
                    const match = lower.match(/(?:öffne|open|starte|zeige|start)\s+(.+)/);
                    if (match) {
                        const appName = match[1].trim();
                        const app = window.HalDo.AppRegistry?.getAll().find(a =>
                            (a.name && a.name.toLowerCase().includes(appName)) ||
                            (a.id && a.id.toLowerCase().includes(appName))
                        );
                        if (app) {
                            window.HalDo.AppManager?.open(app.id);
                            this.reactAvatar('happy');
                            setTimeout(() => this.reactAvatar('idle'), 800);
                            return this.translate(`🌌 Ich öffne "${app.name || app.id}" für dich.`, lang);
                        }
                        const similar = window.HalDo.AppRegistry?.getAll().find(a =>
                            (a.name && a.name.toLowerCase().includes(appName.split(' ')[0])) ||
                            (a.id && a.id.toLowerCase().includes(appName.split(' ')[0]))
                        );
                        if (similar) {
                            window.HalDo.AppManager?.open(similar.id);
                            this.reactAvatar('happy');
                            setTimeout(() => this.reactAvatar('idle'), 800);
                            return this.translate(`🌌 Ich öffne "${similar.name || similar.id}" für dich.`, lang);
                        }
                        const available = window.HalDo.AppRegistry?.getAll().map(a => a.name || a.id).join(', ') || 'Keine';
                        return this.translate(`🌌 Ich konnte "${appName}" nicht finden. Verfügbare Apps: ${available}`, lang);
                    }
                }

                // === APP SCHLIESSEN ===
                if (lower.includes("schließe") || lower.includes("close") || lower.includes("beende") || lower.includes("schliessen")) {
                    const match = lower.match(/(?:schließe|close|beende|schliessen)\s+(.+)/);
                    if (match) {
                        const appName = match[1].trim();
                        const app = window.HalDo.AppRegistry?.getAll().find(a =>
                            (a.name && a.name.toLowerCase().includes(appName)) ||
                            (a.id && a.id.toLowerCase().includes(appName))
                        );
                        if (app && window.HalDo.AppManager?.activeApps.has(app.id)) {
                            window.HalDo.AppManager?.close(app.id);
                            return this.translate(`🌌 Ich schließe "${app.name || app.id}".`, lang);
                        }
                        return this.translate(`🌌 Die App "${appName}" ist nicht geöffnet.`, lang);
                    }
                }

                // === HILFE ===
                if (lower.includes("hilfe") || lower.includes("help") || lower.includes("was kannst du") || lower.includes("fähigkeiten") || lower.includes("kannst du")) {
                    return this.translate(
                        `🌌 Ich bin HalDo AI (Universe Professional Edition) und kann dir helfen mit:\n\n` +
                        `📱 Apps öffnen und schließen\n` +
                        `🗣️ Fragen in ${this.languages.length} Sprachen beantworten\n` +
                        `✍️ Texte schreiben, korrigieren und verbessern\n` +
                        `🌍 Übersetzen in alle Sprachen\n` +
                        `🎙️ Spracheingabe und Sprachausgabe\n` +
                        `📊 Systemstatus abfragen\n` +
                        `🧮 Rechnen und Mathematik\n` +
                        `😂 Witze erzählen\n` +
                        `🎬 Video-Bearbeitung (4K, 8K, HD, 3D)\n` +
                        `📚 Wissen über AI, Weltall, Programmierung und mehr\n` +
                        `💡 Sag einfach was du brauchst! 🌌`,
                        lang
                    );
                }

                // === STATUS ===
                if (lower.includes("status") || lower.includes("system") || lower.includes("info") || lower.includes("über") || lower.includes("version")) {
                    const apps = window.HalDo.AppRegistry?.getAll().length || 0;
                    return this.translate(
                        `📊 Systemstatus (Universe Professional):\n` +
                        `• Version: ${window.HALDO_VERSION} ${window.HALDO_BUILD}\n` +
                        `• Apps: ${apps} registriert, ${window.HalDo.AppRegistry?.installed.size || 0} installiert\n` +
                        `• AI Core: ✅ Aktiv (Universe-Modus)\n` +
                        `• Sprachen: ${this.languages.length} unterstützt\n` +
                        `• Knowledge Base: ${Object.keys(this.knowledgeBase).length} Themen\n` +
                        `• Uptime: ${Math.floor((Date.now() - window._haldoStartTime) / 1000)}s\n` +
                        `• Speicher: ${Object.keys(window.HalDo.Storage.getAll()).length} Einträge`,
                        lang
                    );
                }

                // === ZEIT ===
                if (lower.includes("zeit") || lower.includes("uhr") || lower.includes("wie spät") || lower.includes("uhrzeit") || lower.includes("wie viel uhr")) {
                    return this.translate(`🕐 Es ist ${new Date().toLocaleTimeString()}`, lang);
                }

                if (lower.includes("datum") || lower.includes("welcher tag") || lower.includes("heute") || lower.includes("wochentag") || lower.includes("welches datum")) {

                if (lower.includes("wetter") || lower.includes("temperatur") || lower.includes("regnet") || lower.includes("sonnig")) {

                    return this.translate(
                        `🌤️ Wetter heute (simuliert):\n${conditions[Math.floor(Math.random() * conditions.length)]}\n🌡️ ${Math.floor(Math.random()*15+15)}°C\n💨 Wind: ${Math.floor(Math.random()*20+5)} km/h\n💧 Luftfeuchtigkeit: ${Math.floor(Math.random()*40+40)}%\n🌅 Sonnenaufgang: ${Math.floor(Math.random()*2+5)}:${String(Math.floor(Math.random()*60)).padStart(2,'0')} Uhr\n🌇 Sonnenuntergang: ${Math.floor(Math.random()*2+18)}:${String(Math.floor(Math.random()*60)).padStart(2,'0')} Uhr`,
                        lang
                    );
                }

                // === RECHNEN ===
                if (lower.includes("rechne") || lower.includes("berechnen") || lower.includes("plus") || lower.includes("minus") ||
                    lower.includes("mal") || lower.includes("geteilt") || lower.includes("durch") || lower.includes("wurzel") || lower.includes("potenz")) {
                    try {
                        let math = lower.replace(/rechne|berechnen|ist|gleich|ergibt/g, '')
                            .replace(/plus/g, '+').replace(/minus/g, '-')
                            .replace(/mal|×/g, '*').replace(/geteilt|durch|÷/g, '/')
                            .replace(/wurzel/g, 'Math.sqrt(').replace(/potenz|hoch/g, '**')
                            .replace(/[^0-9+\-*/().Math.sqrta-z]/g, '').trim();
                        if (math && /[0-9]/.test(math)) {
                            const result = Function('"use strict"; return (' + math + ')')();
                            return this.translate(`🧮 ${math} = ${result}`, lang);
                        }
                    } catch(e) {}
                }

                // === WITZ ===
                if (lower.includes("witz") || lower.includes("lachen") || lower.includes("spaß") || lower.includes("humor") || lower.includes("lustig")) {
                    const jokes = [
                        "Warum können Geister so gut programmieren? Weil sie keinen Speicher haben! 👻",

                        "Warum hat der Computer einen kalten Kaffee? Weil er den Code nicht runterbekam! ☕",
                        "Was sagt die Festplatte zum RAM? 'Hast du auch mal was gespeichert?' 😂",
                        "Wie nennt man einen Programmierer, der keine Fehler macht? Einen Legenden-Developer! 👑",
                        "Warum können Programmierer gut Halloween feiern? Weil sie mit Hex-Codes arbeiten! 🎃"
                    ];
                    this.reactAvatar('happy');
                    setTimeout(() => this.reactAvatar('idle'), 800);
                    return this.translate(`😂 ${jokes[Math.floor(Math.random() * jokes.length)]}`, lang);
                }

                // === ÊZÎDÎ ===
                if (lower.includes("silav") || lower.includes("rojbaş") || lower.includes("salam") || lower.includes("êzîdî") || lower.includes("ezidi")) {
                    return this.translate(
                        "Silav! Ez HalDo AI me. 💙❤️ Tu dixwazî çi bikin?\n\n" +
                        "Ez dikarim alîkariya te bikim bi:\n" +
                        "• Vekirina sepanan\n" +
                        "• Bersivdana pirsan (li ser her mijarê)\n" +
                        "• Wergerandin (bi ${this.languages.length} zimanan)\n" +
                        "• Nivîsandin û rastkirin\n" +
                        "• Zanyariya li ser cîhanê, AI, bernamekirin, û hêj bêhtir\n\n" +
                        "Tu çi dixwazî?",
                        'ku'
                    );
                }

                // === VIDEO BEARBEITEN ===
                if (lower.includes("video") || lower.includes("bearbeiten") || lower.includes("effekte") || lower.includes("4k") || lower.includes("8k") || lower.includes("hd")) {
                    return this.translate(
                        `🎬 Video-Bearbeitung mit HalDo AI:\n\n` +
                        `Unterstützte Formate: MP4, AVI, MOV, MKV, WEBM\n` +
                        `Auflösungen: HD (1280x720), Full HD (1920x1080), 4K (3840x2160), 8K (7680x4320)\n` +
                        `Effekte: Übergänge, Farbkorrektur, Filter, Text-Overlays, 3D-Effekte\n` +
                        `Audio: Rauschunterdrückung, Lautstärkeanpassung, Hintergrundmusik\n` +
                        `AI-Funktionen: Automatisches Schneiden, Gesichtserkennung, Objekt-Tracking\n\n` +
                        `💡 Hinweis: Deine Videos werden mit dem HalDo AI OS Logo in der oberen linken Ecke versehen.`,
                        lang
                    );
                }

                // === TEXT KORRIGIEREN ===
                if (lower.includes("korrigiere") || lower.includes("verbessere") || lower.includes("rechtschreibung") || lower.includes("grammatik")) {
                    const match = lower.match(/(?:korrigiere|verbessere|text korrigieren)\s+(.+)/);
                    if (match) {
                        return this.correctText(match[1].trim(), lang);
                    }
                    return this.translate("📝 Bitte gib den Text an, den ich korrigieren soll. z.B. 'Korrigiere: Ich habe ein Apfel.'", lang);
                }

                // === ZUSAMMENFASSEN ===
                if (lower.includes("fasse zusammen") || lower.includes("zusammenfassen") || lower.includes("summary")) {
                    const match = lower.match(/(?:fasse zusammen|zusammenfassen|summary)\s+(.+)/);
                    if (match) {
                        return this.summarizeText(match[1].trim(), lang);
                    }
                    return this.translate("📄 Bitte gib den Text an, den ich zusammenfassen soll. z.B. 'Fasse zusammen: ...'", lang);
                }

                // === ÜBERSETZEN ===
                if (lower.includes("übersetze") || lower.includes("translate") || lower.includes("übersetzung")) {
                    const match = lower.match(/(?:übersetze|translate)\s+(.+?)\s+(?:auf|to|in)\s+(\w+)/);
                    if (match) {
                        const text = match[1].trim();
                        const targetLang = match[2].trim();
                        const translation = this.translateText(text, targetLang);
                        return this.translate(`🌍 Übersetzung (${targetLang}):\n"${translation}"`, lang);
                    }
                    return this.translate("🌍 Sag mir: 'Übersetze [Text] auf [Sprache]'", lang);
                }

                // === STANDARD PROFESSIONELL ===
                this.reactAvatar('thinking');
                setTimeout(() => this.reactAvatar('idle'), 1000);
                return this.professionalResponse(clean, lang);
            },

            // =========================================================
            // SPRACHERKENNUNG — ALLE SPRACHEN
            // =========================================================

            detectLanguage(text) {
                const lower = text.toLowerCase();
                if (/[äöüß]/.test(lower) || /\b(der|die|das|und|ich|nicht|ist|sie|wir|haben)\b/.test(lower)) return 'de';
                if (/\b(the|and|you|are|what|how|can|please|would|could|should)\b/.test(lower)) return 'en';
                if (/[ەێڵگڕۆ]/.test(lower) || /\b(silav|rojbaş|spas|kurdî|kurd|ezidi)\b/.test(lower)) return 'ku';
                if (/[بتثجحخ]/.test(lower) || /\b(مرحبا|شكرا|كيف|سلام|السلام)\b/.test(lower)) return 'ar';
                if (/\b(merhaba|nasılsın|teşekkür|iyi|günaydın|hoş)\b/.test(lower)) return 'tr';
                if (/\b(bonjour|merci|comment|français|ça|oui|non)\b/.test(lower)) return 'fr';

            // =========================================================
            // TEXT KORRIGIEREN
            // =========================================================

            correctText(text, lang = 'de') {
                const corrections = {
                    'Apfel': 'Äpfel', 'apfel': 'Äpfel',
                    'hause': 'Hause', 'Hause': 'Haus',
                    'gehen': 'gehen', 'komme': 'komme',
                    'ich habe': 'Ich habe', 'ich bin': 'Ich bin',
                    'sie sind': 'Sie sind', 'sie haben': 'Sie haben',
                    'das ist': 'Das ist', 'das war': 'Das war',
                    'er hat': 'Er hat', 'sie hat': 'Sie hat',
                    'wir haben': 'Wir haben', 'ihr habt': 'Ihr habt'
                };

                let corrected = text;
                for (const [wrong, right] of Object.entries(corrections)) {
                    corrected = corrected.replace(new RegExp(wrong, 'g'), right);
                }

                const suggestions = [];
                if (text.includes('  ')) suggestions.push('• Doppelte Leerzeichen entfernen');
                if (text.split('.').length > 2) suggestions.push('• Satzzeichen prüfen (Punkt am Satzende)');
                if (text.length > 0 && text[0] !== text[0].toUpperCase()) suggestions.push('• Großschreibung am Satzanfang prüfen');

                let result = this.translate(`📝 Korrigierter Text:\n"${corrected}"`, lang);
                if (suggestions.length > 0) {
                    result += this.translate(`\n\n💡 Vorschläge:\n${suggestions.join('\n')}`, lang);
                } else {
                    result += this.translate('\n\n✅ Der Text sieht grammatikalisch korrekt aus.', lang);
                }
                return result;
            },

            // =========================================================
            // ZUSAMMENFASSUNG
            // =========================================================

            summarizeText(text, lang = 'de') {
                const words = text.split(' ');
                if (words.length <= 20) {
                    return this.translate(`📄 Zusammenfassung:\n"${text}"\n\n💡 Der Text ist bereits kurz und prägnant.`, lang);
                }

                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
                const summary = sentences.slice(0, Math.min(3, sentences.length)).join('. ') + '.';

                return this.translate(
                    `📄 Zusammenfassung:\n"${summary}"\n\n` +
                    `📊 Statistik:\n• Wörter: ${words.length}\n• Sätze: ${sentences.length}\n• Zeichen: ${text.length}`,
                    lang
                );
            },

            // =========================================================
            // AVATAR REAKTION
            // =========================================================

            reactAvatar(state) {
                const avatar = document.getElementById('haldo-living-avatar');
                if (avatar) avatar.dataset.state = state;
                window.HalDo.emit("avatar:state", { state });
            }
        };

        // =========================================================

        window.HalDo.AppRegistry = {

                if (!app || !app.id) return false;
                if (this.apps.has(app.id)) return false;
                this.apps.set(app.id, {
                    ...app,
                    registeredAt: Date.now(),
                    status: 'registered',
                    installed: false
                });
                console.log(`✅ App "${app.name || app.id}" registriert`);
                return true;
            },

            get(id) { return this.apps.get(id) || null; },
            getAll() { return Array.from(this.apps.values()); },

            install(id) {
                const app = this.get(id);
                if (!app) return false;
                if (this.installed.has(id)) return true;
                app.status = 'installed';
                app.installed = true;
                this.installed.add(id);
                window.HalDo.Storage.set('app_installed_' + id, true);
                console.log(`📦 App "${app.name || id}" installiert`);
                return true;
            },

            isInstalled(id) {
                return this.installed.has(id) || window.HalDo.Storage.get('app_installed_' + id, false);
            },

            loadInstalled() {
                this.getAll().forEach(app => {

                        app.installed = true;
                        this.installed.add(app.id);
                    }

                    { id: 'backup', icon: '◫', name: 'Backup', desc: 'Sichern & Wiederherstellen' },

                    { id: 'video-editor', icon: '🎬', name: 'Video Editor', desc: '4K/8K Bearbeitung' }
                ];

                list.innerHTML = items.map(item => `
                    <div class="haldo-menu-item" data-app="${item.id}">
                        <span class="icon">${item.icon}</span>
                        <div class="info">
                            <div class="name">${item.name}</div>
                            <div class="desc">${item.desc}</div>
                        </div>
                    </div>
                `).join('');

                list.querySelectorAll('[data-app]').forEach(el => {
                    el.addEventListener('click', () => {
                        const app = el.dataset.app;
                        document.getElementById("haldo-system-panel").classList.remove("open");
                        document.getElementById("haldo-apps-panel").classList.remove("open");
                        window.HalDo.AppManager.open(app);
                    });
                });
            },

            renderAppsMenu() {
                const list = document.getElementById("haldo-apps-list");
                if (!list) return;

                const apps = window.HalDo.AppRegistry.getAll();
                apps.sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));

                list.innerHTML = apps.map(app => `
                    <div class="haldo-menu-item" data-app="${app.id}">
                        <span class="icon">${app.icon || '📱'}</span>
                        <div class="info">
                            <div class="name">${app.name || app.id}</div>
                            <div class="desc">${app.description || app.category || 'App'}</div>
                        </div>
                        <span class="badge">${app.status === 'installed' ? '✅' : ''}</span>
                    </div>
                `).join('');

                list.querySelectorAll('[data-app]').forEach(el => {
                    el.addEventListener('click', () => {
                        const app = el.dataset.app;
                        document.getElementById("haldo-system-panel").classList.remove("open");
                        document.getElementById("haldo-apps-panel").classList.remove("open");
                        window.HalDo.AppManager.open(app);
                    });
                });
            }
        };

        // =========================================================
        // 8. CHAT CONTROLLER — PROFESSIONELL + VOICE
        // =========================================================

        window.HalDo.Chat = {
            init() {
                this.window = document.getElementById("haldo-chat-window");
                this.messages = document.getElementById("haldo-chat-messages");
                this.input = document.getElementById("haldo-chat-input");
                this.sendBtn = document.getElementById("haldo-chat-send");
                this.voiceBtn = document.getElementById("haldo-chat-voice");
                this.status = document.getElementById("haldo-chat-status");
                this.typing = document.getElementById("haldo-chat-typing");
                this.history = window.HalDo.Storage.get('chat_history', []);
                this._sending = false;

                if (!this.window) return;

                document.getElementById("haldo-chat-close").addEventListener("click", () => this.close());
                document.getElementById("haldo-chat-minimize").addEventListener("click", () => this.toggleMinimize());
                this.sendBtn.addEventListener("click", () => this.send());
                this.voiceBtn.addEventListener("click", () => this.toggleVoice());

                this.input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        this.send();
                    }
                });

                this.input.addEventListener("input", () => {
                    this.input.style.height = "auto";
                    this.input.style.height = Math.min(this.input.scrollHeight, 150) + "px";
                });

                // History laden
                this.history.forEach(msg => this.renderMessage(msg.role, msg.content));
                if (this.history.length === 0) {
                    this.renderMessage("ai", "🌌 Guten Tag! Ich bin HalDo AI im Universe-Modus. 💙❤️ Ich beantworte ALLE Ihre Fragen — von A bis Z! Wie kann ich Ihnen helfen?");
                }

                // AI Core initialisieren
                window.HalDo.AICore.init();

                // Voice
                this.setupVoice();

                // Sun click
                document.getElementById("haldo-sun-container")?.addEventListener("click", () => {
                    this.open();
                    window.HalDo.AICore.reactAvatar('happy');
                    setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 800);
                });

                // Avatar click
                document.getElementById("haldo-living-avatar")?.addEventListener("click", () => {
                    this.open();
                    window.HalDo.AICore.reactAvatar('happy');
                    setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 800);
                });

                // Planet click handler
                document.querySelectorAll('.haldo-planet').forEach(planet => {
                    planet.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const name = planet.dataset.planet || 'Planet';
                        window.HalDo.AICore.ask(`Erzähle mir etwas über ${name}`).then(response => {
                            this.open();
                            setTimeout(() => {
                                this.input.value = `Erzähle mir etwas über ${name}`;
                                this.send();
                            }, 300);
                        });
                    });
                });
            },

            open() {
                this.window.classList.add("open");
                this.window.removeAttribute("aria-hidden");
                setTimeout(() => this.input.focus(), 100);
                window.HalDo.AICore.reactAvatar('happy');
                setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 800);
            },

            close() {
                this.window.classList.remove("open");
                this.window.setAttribute("aria-hidden", "true");
            },

            toggleMinimize() {
                this.window.classList.toggle("minimized");
            },

            renderMessage(role, content) {
                const div = document.createElement("div");
                div.className = `haldo-chat-message ${role === "user" ? "haldo-chat-message-user" : "haldo-chat-message-ai"}`;
                div.textContent = content;
                this.messages.appendChild(div);
                this.messages.scrollTop = this.messages.scrollHeight;
            },

            setStatus(text) {
                this.status.textContent = text;
            },

            showTyping() {
                this.typing.classList.add("active");
                this.setStatus("HalDo AI denkt …");
                window.HalDo.AICore.reactAvatar('thinking');
            },

            hideTyping() {
                this.typing.classList.remove("active");
                this.setStatus("🌌 Bereit für alle Fragen");
                window.HalDo.AICore.reactAvatar('idle');
            },

            async send() {
                const text = this.input.value.trim();
                if (!text || this._sending) return;

                this.input.value = "";
                this.input.style.height = "auto";
                this.renderMessage("user", text);
                this.history.push({ role: "user", content: text });
                window.HalDo.Storage.set('chat_history', this.history.slice(-200));

                this._sending = true;
                this.showTyping();

                try {
                    const response = await window.HalDo.AICore.ask(text);
                    this.hideTyping();
                    this.renderMessage("ai", response);
                    this.history.push({ role: "ai", content: response });
                    window.HalDo.Storage.set('chat_history', this.history.slice(-200));

                    window.HalDo.AICore.reactAvatar('speaking');
                    setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 1000);
                    this.speak(response);

                } catch(e) {
                    this.hideTyping();
                    this.renderMessage("ai", "🌌 Entschuldigung, ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.");
                    console.error(e);
                }

                this._sending = false;
            },

            speak(text) {
                if (!window.speechSynthesis) return;
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = "de-DE";
                    utterance.rate = 0.92;
                    utterance.pitch = 1.0;
                    utterance.volume = 0.85;
                    utterance.onstart = () => window.HalDo.AICore.reactAvatar('speaking');
                    utterance.onend = () => window.HalDo.AICore.reactAvatar('idle');
                    utterance.onerror = () => window.HalDo.AICore.reactAvatar('idle');
                    window.speechSynthesis.speak(utterance);
                } catch(e) {}
            },

            setupVoice() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) return;

                this.recognition = new Recognition();
                this.recognition.lang = "de-DE";
                this.recognition.continuous = false;
                this.recognition.interimResults = true;

                this.recognition.onstart = () => {
                    this.voiceBtn.classList.add("listening");
                    this.setStatus("🎙️ Ich höre zu …");
                    window.HalDo.AICore.reactAvatar('listening');
                };

                this.recognition.onresult = (event) => {
                    let final = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    }
                    if (final) {
                        this.input.value = final;
                        this.stopVoice();
                        setTimeout(() => this.send(), 100);
                    }
                };

                this.recognition.onerror = () => {
                    this.stopVoice();
                    this.setStatus("Bereit");
                };

                this.recognition.onend = () => {
                    this.voiceBtn.classList.remove("listening");
                    if (this.status.textContent === "🎙️ Ich höre zu …") {
                        this.setStatus("🌌 Bereit für alle Fragen");
                    }
                    window.HalDo.AICore.reactAvatar('idle');
                };
            },

            toggleVoice() {
                if (this.recognition?.listening) {
                    this.stopVoice();
                } else {
                    this.startVoice();
                }
            },

            startVoice() {
                if (!this.recognition) return;
                try { this.recognition.start(); } catch(e) {}
            },

            stopVoice() {
                try { this.recognition?.stop(); } catch(e) {}
                this.voiceBtn.classList.remove("listening");
                window.HalDo.AICore.reactAvatar('idle');
                this.setStatus("🌌 Bereit für alle Fragen");
            }
        };

        // =========================================================
        // 9. BOOT — ALLES STARTEN
        // =========================================================

                { id: 'ai-memory', name: 'AI Memory', icon: '🧠', category: 'AI', description: 'Kurz- & Langzeitgedächtnis' },
                { id: 'ai-voice', name: 'AI Voice', icon: '🎙️', category: 'AI', description: 'Spracheingabe & Ausgabe' },
                // Internet

                { id: 'translate', name: 'Übersetzer', icon: '🌍', category: 'Internet', description: 'Mehrsprachige Übersetzungen' },
                // Produktivität
                { id: 'calculator', name: 'Rechner', icon: '🧮', category: 'Produktivität', description: 'Berechnungen & Mathematik' },
                { id: 'calendar', name: 'Kalender', icon: '📅', category: 'Produktivität', description: 'Termine & Planung' },
                { id: 'clock', name: 'Uhr', icon: '🕐', category: 'Produktivität', description: 'Zeit, Timer & Wecker' },
                { id: 'notes', name: 'Notizen', icon: '📝', category: 'Produktivität', description: 'Texte & Ideen' },
                // System
                { id: 'settings', name: 'Einstellungen', icon: '⚙️', category: 'System', description: 'System & Geräte' },
                { id: 'updates', name: 'Updates', icon: '↻', category: 'System', description: 'Systemupdates & Versionen' },
                { id: 'storage', name: 'Speicher', icon: '💾', category: 'System', description: 'Daten & Speicher' },
                { id: 'security', name: 'Sicherheit', icon: '🛡️', category: 'System', description: 'Datenschutz' },

                { id: 'diagnostics', name: 'Diagnose', icon: '⌁', category: 'System', description: 'Systemstatus & Fehler' },

                { id: 'files', name: 'Dateien', icon: '📁', category: 'System', description: 'Dateimanager & Ordner' },
                // Medien
                { id: 'gallery', name: 'Galerie', icon: '🖼️', category: 'Medien', description: 'Bilder & Medien' },

                { id: 'camera', name: 'Kamera', icon: '📷', category: 'Medien', description: 'Fotos & Aufnahmen' },
                // Kommunikation
                { id: 'messages', name: 'Nachrichten', icon: '💬', category: 'Kommunikation', description: 'Kommunikation' },
                { id: 'contacts', name: 'Kontakte', icon: '👤', category: 'Kommunikation', description: 'Adressbuch' },
                { id: 'email', name: 'Mail', icon: '✉️', category: 'Kommunikation', description: 'E-Mail & Nachrichten' },
                // Fahren
                { id: 'fahrschule', name: 'Fahrschule', icon: '🚗', category: 'Fahren', description: 'Führerschein & Verkehrslernen' },
                { id: 'verkehr', name: 'Verkehr', icon: '🚦', category: 'Fahren', description: 'Verkehrsinformationen' },
                // Gesundheit
                { id: 'gesundheit', name: 'Gesundheit', icon: '🏥', category: 'Gesundheit', description: 'Deine Gesundheitsdaten' },
                // Bildung
                { id: 'schule', name: 'Schule', icon: '🏫', category: 'Bildung', description: 'Lernen & Bildung' },
                { id: 'universitaet', name: 'Universität', icon: '🎓', category: 'Bildung', description: 'Studium & Forschung' },
                // Entwicklung
                { id: 'code', name: 'Code/Entwicklung', icon: '💻', category: 'Entwicklung', description: 'Entwickler-Tools' },
                // Video
                { id: 'video-editor', name: 'Video Editor', icon: '🎬', category: 'Medien', description: '4K/8K Videobearbeitung' },
                // Tools
                { id: 'keyboard', name: 'Êzîdî Keyboard', icon: '⌨️', category: 'Tools', description: 'Tastatur & Sprachen' },
                { id: 'weather', name: 'Wetter', icon: '☀️', category: 'Tools', description: 'Wetterinformationen' }
            ];

            apps.forEach(app => window.HalDo.AppRegistry.register(app));
            window.HalDo.AppRegistry.loadInstalled();

            // Menü
            window.HalDo.Menu.init();

            // Chat
            window.HalDo.Chat.init();

            // Keyboard shortcuts
            document.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === "k") {
                    e.preventDefault();
                    if (window.HalDo.Chat.window?.classList.contains("open")) {
                        window.HalDo.Chat.close();
                    } else {
                        window.HalDo.Chat.open();
                    }
                }
                if (e.key === "Escape") {
                    document.querySelectorAll(".haldo-menu-panel.open").forEach(p => p.classList.remove("open"));
                    window.HalDo.Chat.close();
                }
            });

            console.log("🌌 HalDo AI OS v" + window.HALDO_VERSION + " " + window.HALDO_BUILD + " erfolgreich gestartet!");
            console.log("📱 " + window.HalDo.AppRegistry.getAll().length + " Apps verfügbar");
            console.log("🌍 " + window.HalDo.AICore.languages.length + " Sprachen unterstützt");
            console.log("📚 " + Object.keys(window.HalDo.AICore.knowledgeBase).length + " Wissensbereiche");
            console.log("💙❤️🚀 HalDo AI lebt — Universe Professional Edition!");
            console.log("🎬 4K/8K Video-Bearbeitung verfügbar");

            // Welcome
            setTimeout(() => {
                window.HalDo.AICore.ask("Hallo").then(response => {
                    console.log("🧠 AI:", response);
                });
            }, 500);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", haldoBoot, { once: true });
        } else {
            haldoBoot();
        }
    </script>
