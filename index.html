/* =========================================================
   ADD MESSAGE
   ========================================================= */

HD11.aiChat.addMessage =
function(
    role,
    text
) {

    const value =
        String(
            text || ""
        ).trim();

    if (
        !value
    ) {
        return;
    }

    const message = {

        id:
            "msg-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2),

        role:
            role === "user"
                ? "user"
                : "assistant",

        text:
            value,

        time:
            new Date()
                .toISOString()

    };


    this.state.messages.push(
        message
    );


    if (
        !this.state.messagesElement
    ) {
        return message;
    }


    const empty =
        this.state.messagesElement
            .querySelector(
                "[data-ai-empty]"
            );


    empty?.remove();


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "haldo-ai-message " +
        message.role;


    if (
        message.role ===
        "assistant"
    ) {

        row.innerHTML = `

            <div
                class="haldo-ai-message-avatar"
            >

                <img
                    src="logo.png"
                    alt="HalDo"
                >

            </div>

            <div>

                <div
                    class="haldo-ai-message-bubble"
                ></div>

                <div
                    class="haldo-ai-message-time"
                >
                    ${new Date(
                        message.time
                    ).toLocaleTimeString(
                        [],
                        {
                            hour:
                                "2-digit",
                            minute:
                                "2-digit"
                        }
                    )}
                </div>

            </div>

        `;

    }

    else {

        row.innerHTML = `

            <div>

                <div
                    class="haldo-ai-message-bubble"
                ></div>

                <div
                    class="haldo-ai-message-time"
                >
                    ${new Date(
                        message.time
                    ).toLocaleTimeString(
                        [],
                        {
                            hour:
                                "2-digit",
                            minute:
                                "2-digit"
                        }
                    )}
                </div>

            </div>

        `;

    }


    const bubble =
        row.querySelector(
            ".haldo-ai-message-bubble"
        );


    bubble.textContent =
        message.text;


    this.state.messagesElement
        .appendChild(
            row
        );


    this.scrollToBottom();


    HD11.emit(
        "ai:message",
        message
    );


    return message;

};

/* =========================================================

   ========================================================= */

HD11.aiChat.localResponse =
function(
    message
) {

    const text =
        String(
            message || ""
        )
            .trim()
            .toLowerCase();


    if (
        !text
    ) {

        return (
            "Schreib mir einfach etwas. " +
            "Ich bin hier. 💙❤️"
        );

    }


    if (
        text.includes("hallo") ||
        text.includes("hi haldo") ||
        text.includes("hey haldo")
    ) {

        return (
            "Hallo 💙❤️ Ich bin HalDo AI. " +
            "Schön, dass du da bist. " +
            "Wie kann ich dir helfen?"
        );

    }


    if (
        text.includes("wer bist du") ||
        text.includes("was bist du")
    ) {

        return (
            "Ich bin HalDo AI – die zentrale " +
            "künstliche Intelligenz deiner " +
            "HalDo-Welt. 💙❤️🚀"
        );

    }


    if (
        text.includes("danke")
    ) {

        return (
            "Sehr gerne, Bruder. 💙❤️🚀"
        );

    }


    if (
        text.includes("menü") ||
        text.includes("menu")
    ) {

        return (
            "Öffne das Hauptmenü. " +
            "Dort findest du Apps, AI und " +
            "Systemfunktionen."
        );

    }


    if (
        text.includes("einstellungen")
    ) {

        return (
            "Die Einstellungen können über " +
            "das Hauptmenü geöffnet werden. " +
            "Dort lassen sich die HalDo-System-" +
            "und Cosmic-World-Funktionen konfigurieren."
        );

    }


    return (
        "Ich habe deine Nachricht erhalten. 💙❤️ " +
        "Die Nachricht wird an die vorhandene " +
        "HalDo-AI-Engine weitergereicht."
    );

};


/* =========================================================
   AI ENGINE CONNECTION
   ========================================================= */

HD11.aiChat.generateResponse =
async function(
    message
) {

    const candidates = [

        HD11.ai?.chat,
        HD11.ai?.respond,
        HD11.ai?.ask,
        HD11.aiCore?.chat,
        HD11.aiCore?.respond,
        HD11.aiEngine?.generate,
        HD11.aiEngine?.respond

    ];


    for (
        const candidate of candidates
    ) {

        if (
            typeof candidate !==
            "function"
        ) {

            continue;

        }


        try {

            const owner =
                HD11.ai ||
                HD11.aiCore ||
                HD11.aiEngine ||
                HD11;


            const result =
                await candidate.call(
                    owner,
                    message
                );


            if (
                typeof result ===
                "string" &&
                result.trim()
            ) {

                return result;

            }


            if (
                result &&
                typeof result.text ===
                "string" &&
                result.text.trim()
            ) {

                return result.text;

            }

        }

        catch(error) {

            console.warn(
                "[HalDo AI] Engine connection failed:",
                error
            );

        }

    }


    return this.localResponse(
        message
    );

};


/* =========================================================
   SEND MESSAGE
   ========================================================= */

HD11.aiChat.send =
async function() {

    if (
        this.state.processing
    ) {

        return;

    }


    if (
        !this.state.input
    ) {

        this.create();

    }


    const message =
        String(
            this.state.input.value ||
            ""
        ).trim();


    if (
        !message
    ) {

        return;

    }


    this.state.input.value =
        "";

    this.autoResize();

    this.addMessage(
        "user",
        message
    );


    this.state.processing =
        true;


    if (
        this.state.sendButton
    ) {

        this.state.sendButton.disabled =
            true;

    }


    this.setStatus(
        "denkt …"
    );

    this.showTyping();


    try {

        const response =
            await this.generateResponse(
                message
            );


        this.hideTyping();


        this.addMessage(
            "assistant",
            response
        );


        this.setStatus(
            "bereit"
        );

    }

    catch(error) {

        this.hideTyping();


        console.error(
            "[HalDo AI] Chat error:",
            error
        );


        this.addMessage(
            "assistant",
            "Beim Verarbeiten der Nachricht ist ein Fehler aufgetreten."
        );


        this.setStatus(
            "Fehler"
        );


        HD11.emit(
            "ai:error",
            error
        );

    }

    finally {

        this.state.processing =
            false;


        if (
            this.state.sendButton
        ) {

            this.state.sendButton.disabled =
                false;

        }


        if (
            this.state.input &&
            this.state.open
        ) {

            this.state.input.focus();

        }

    }

};

/* =========================================================
   VOICE CONNECTION
   ========================================================= */

HD11.aiChat.startVoice =
function() {

    const voiceCandidates = [

        HD11.aiVoice?.start,
        HD11.voice?.start,
        HD11.aiSpeech?.start,
        HD11.speech?.start

    ];


    for (
        const candidate of
        voiceCandidates
    ) {

        if (
            typeof candidate !==
            "function"
        ) {

            continue;

        }


        try {

            const owner =
                HD11.aiVoice ||
                HD11.voice ||
                HD11.aiSpeech ||
                HD11.speech ||
                HD11;


            return candidate.call(
                owner
            );

        }

        catch(error) {

            console.warn(
                "[HalDo AI] Voice start failed:",
                error
            );

        }

    }


    this.addMessage(
        "assistant",
        "Die Sprachfunktion ist momentan nicht verfügbar."
    );

    return false;

};

            }

        },

            ) {

                HD11.aiChat.state.input.value =
                    String(
                        message || ""
                    );

            }

            return HD11.aiChat.send();

        },

    clear:

            HD11.aiChat.clear()

};

<script>
"use strict";

/* ============================================================
   HALDO APP CONTENT ENGINE
   Jede App bekommt eine eigene Oberfläche,
   eigenen State und gemeinsame Systemfunktionen.
   ============================================================ */

(function () {

    const HD = window.HalDo;

    if (!HD) {
        console.error("HalDo Core nicht gefunden.");
        return;
    }

    HD.appContent =
        HD.appContent ||
        {};

    HD.appContent.version =
        "22.0.0";

    HD.appContent.apps =
        HD.appContent.apps ||
        new Map();

    HD.appContent.activeApp =
        HD.appContent.activeApp ||
        null;

    HD.appContent.activeView =
        HD.appContent.activeView ||
        null;

    HD.appContent.register =
        function (
            appId,
            definition
        ) {

            if (
                !appId ||
                !definition
            ) {
                return false;
            }

            const id =
                String(appId)
                    .trim()
                    .toLowerCase();

            this.apps.set(
                id,
                definition
            );

            HD.emit(
                "app-content:registered",
                {
                    appId: id,
                    definition
                }
            );

            return true;
        };


    HD.appContent.get =
        function (
            appId
        ) {

            return this.apps.get(
                String(appId || "")
                    .trim()
                    .toLowerCase()
            ) || null;

        };


    HD.appContent.has =
        function (
            appId
        ) {

            return this.apps.has(
                String(appId || "")
                    .trim()
                    .toLowerCase()
            );

        };


    HD.appContent.list =
        function () {

            return Array.from(
                this.apps.keys()
            );

        };


    HD.appContent.open =
        async function (
            appId,
            options = {}
        ) {

            const id =
                String(appId || "")
                    .trim()
                    .toLowerCase();

            const app =
                this.get(id);

            if (!app) {

                HD.emit(
                    "app-content:error",
                    {
                        appId: id,
                        error:
                            "App content not registered"
                    }
                );

                return false;
            }

            this.activeApp =
                id;

            this.activeView =
                options.view ||
                "main";

            HD.emit(
                "app-content:open",
                {
                    appId: id,
                    view:
                        this.activeView,
                    options
                }
            );

            try {

                if (
                    typeof app.onOpen ===
                    "function"
                ) {

                    await app.onOpen(
                        options
                    );

                }

            }
            catch (error) {

                console.error(
                    "[HalDo] App open failed:",
                    error
                );

                HD.emit(
                    "app-content:error",
                    {
                        appId: id,
                        error
                    }
                );

                return false;
            }

            return true;
        };


    HD.appContent.close =
        async function (
            appId
        ) {

            const id =
                String(
                    appId ||
                    this.activeApp ||
                    ""
                )
                    .trim()
                    .toLowerCase();

            const app =
                this.get(id);

            if (
                app &&
                typeof app.onClose ===
                "function"
            ) {

                try {

                    await app.onClose();

                }
                catch (error) {

                    console.warn(
                        "[HalDo] App close failed:",
                        error
                    );

                }

            }

            HD.emit(
                "app-content:close",
                {
                    appId: id
                }
            );

            if (
                this.activeApp === id
            ) {

                this.activeApp =
                    null;

                this.activeView =
                    null;

            }

            return true;
        };


    HD.appContent.render =
        async function (
            appId,
            container,
            options = {}
        ) {

            const id =
                String(appId || "")
                    .trim()
                    .toLowerCase();

            const app =
                this.get(id);

            if (!app) {
                return false;
            }

            const target =
                typeof container ===
                "string"
                    ? document.querySelector(
                        container
                    )
                    : container;

            if (!target) {
                return false;
            }

            try {

                if (
                    typeof app.render ===
                    "function"
                ) {

                    await app.render(
                        target,
                        options
                    );

                }

                HD.emit(
                    "app-content:rendered",
                    {
                        appId: id,
                        target,
                        options
                    }
                );

                return true;

            }
            catch (error) {

                console.error(
                    "[HalDo] App render failed:",
                    error
                );

                HD.emit(
                    "app-content:error",
                    {
                        appId: id,
                        error
                    }
                );

                return false;
            }
        };

})();


/* ============================================================
   APP UI FACTORY
   ============================================================ */

(function () {

    const HD = window.HalDo;

    if (!HD) {
        return;
    }

    HD.appUI =
        HD.appUI ||
        {};

    HD.appUI.version =
        "22.0.0";

    HD.appUI.createElement =
        function (
            tag,
            options = {}
        ) {

            const element =
                document.createElement(
                    tag
                );

            if (
                options.id
            ) {

                element.id =
                    options.id;

            }

            if (
                options.className
            ) {

                element.className =
                    options.className;

            }

            if (
                options.text !==
                undefined
            ) {

                element.textContent =
                    options.text;

            }

            if (
                options.html !==
                undefined
            ) {

                element.innerHTML =
                    options.html;

            }

            if (
                options.attributes
            ) {

                Object.entries(
                    options.attributes
                )
                    .forEach(
                        (
                            [
                                key,
                                value
                            ]
                        ) => {

                            element.setAttribute(
                                key,
                                value
                            );

                        }
                    );

            }

            if (
                options.style
            ) {

                Object.assign(
                    element.style,
                    options.style
                );

            }

            if (
                options.events
            ) {

                Object.entries(
                    options.events
                )
                    .forEach(
                        (
                            [
                                event,
                                handler
                            ]
                        ) => {

                            if (
                                typeof handler ===
                                "function"
                            ) {

                                element.addEventListener(
                                    event,
                                    handler
                                );

                            }

                        }
                    );

            }

            return element;
        };


    HD.appUI.clear =
        function (
            container
        ) {

            if (!container) {
                return;
            }

            while (
                container.firstChild
            ) {

                container.removeChild(
                    container.firstChild
                );

            }

        };


    HD.appUI.button =
        function (
            text,
            handler,
            options = {}
        ) {

            return this.createElement(
                "button",
                {

                    className:
                        options.className ||
                        "haldo-app-button",

                    text,

                    attributes:
                        {

                            type:
                                "button",

                            ...(options.attributes ||
                                {})

                        },

                    events:
                        {

                            click:
                                handler

                        }

                }
            );

        };


    HD.appUI.panel =
        function (
            title,
            content,
            options = {}
        ) {

            const panel =
                this.createElement(
                    "section",
                    {

                        className:
                            options.className ||
                            "haldo-app-panel"

                    }
                );

            const header =
                this.createElement(
                    "div",
                    {

                        className:
                            "haldo-app-panel-header"

                    }
                );

            const titleElement =
                this.createElement(
                    "h2",
                    {

                        className:
                            "haldo-app-panel-title",

                        text:
                            title || "HalDo"

                    }
                );

            header.appendChild(
                titleElement
            );

            panel.appendChild(
                header
            );

            const body =
                this.createElement(
                    "div",
                    {

                        className:
                            "haldo-app-panel-body"

                    }
                );

            if (
                typeof content ===
                "string"
            ) {

                body.innerHTML =
                    content;

            }

            else if (
                content instanceof
                Node
            ) {

                body.appendChild(
                    content
                );

            }

            panel.appendChild(
                body
            );

            return panel;
        };

})();


/* ============================================================
   APP STATE BRIDGE
   ============================================================ */

(function () {

    const HD = window.HalDo;

    if (!HD) {
        return;
    }

    HD.appState =
        HD.appState ||
        {};

    HD.appState.data =
        HD.appState.data ||
        {};

    HD.appState.get =
        function (
            appId,
            key,
            fallback = null
        ) {

            const app =
                this.data[
                    appId
                ];

            if (
                !app ||
                app[key] ===
                undefined
            ) {

                return fallback;
            }

            return app[key];
        };


    HD.appState.set =
        function (
            appId,
            key,
            value
        ) {

            if (
                !this.data[
                    appId
                ]
            ) {

                this.data[
                    appId
                ] =
                    {};

            }

            this.data[
                appId
            ][
                key
            ] =
                value;

            HD.emit(
                "app-state:changed",
                {
                    appId,
                    key,
                    value
                }
            );

            return value;
        };


    HD.appState.remove =
        function (
            appId,
            key
        ) {

            if (
                this.data[
                    appId
                ]
            ) {

                delete this.data[
                    appId
                ][
                    key
                ];

            }

            HD.emit(
                "app-state:removed",
                {
                    appId,
                    key
                }
            );

            return true;
        };


    HD.appState.clear =
        function (
            appId
        ) {

            delete this.data[
                appId
            ];

            HD.emit(
                "app-state:cleared",
                {
                    appId
                }
            );

            return true;
        };

})();

            title.textContent =
                options.title ||

            header.appendChild(

                        );

                    else {

                        windowElement.remove();

                    }

                }
            );

            controls.appendChild(

            );

            );

            HD.emit(
                "launcher:open"
            );

        };

                this.root.classList.remove(
                    "open"
                );

            }

            HD.emit(
                "launcher:close"
            );

        };

        function () {

            if (
                this.root &&
                this.root.classList.contains(
                    "open"
                )
            ) {

                this.close();

            }

            else {

                this.open();

            }

        };

        function () {

            ) {

(function () {

    const HD = window.HalDo;

    if (!HD) {
        return;

    HD.appSearch =
        HD.appSearch ||
        {};

    HD.appSearch.query =
        "";

    HD.appSearch.filter =
        function (
            query
        ) {

            const q =
                String(
                    query || ""
                )
                    .trim()
                    .toLowerCase();

            this.query =
                q;

            return Object.values(
                HD.apps ||
                {}
            )
                .filter(
                    app => {

                        const text =
                            [
                                app.id,
                                app.name,
                                app.description,
                                app.category
                            ]
                                .filter(Boolean)
                                .join(" ")
                                .toLowerCase();

                        return !q ||
                            text.includes(
                                q
                            );

                    }
                );

        };


    HD.appSearch.render =
        function (
            container,
            query
        ) {

            const target =
                typeof container ===
                "string"
                    ? document.querySelector(
                        container
                    )
                    : container;

            if (!target) {
                return;
            }

            const apps =
                this.filter(
                    query
                );

            target.innerHTML =
                "";

            apps.forEach(
                app => {

                    const item =
                        document.createElement(
                            "button"
                        );

                    item.type =
                        "button";

                    item.className =
                        "haldo-app-search-item";

                            ${
                                app.category ||
                                "app"

                                {
                                    appId:

                                }
                            );

                        }
                    );

                    target.appendChild(
                        item
                    );

                }
            );

        };

})();

    /* =========================================================
       WINDOW MANAGER FOUNDATION
       ========================================================= */

    HD.windowManager = HD.windowManager || {

        windows:
            new Map(),

        zIndex:
            1000,

        activeWindow:
            null,

        initialized:
            false

    };


    /* =========================================================
       WINDOW ID
       ========================================================= */

    HD.windowManager.createId =
        function (appId) {

            return (
                "haldo-window-" +
                appId +
                "-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2, 8)
            );

        };


    /* =========================================================
       WINDOW POSITION
       ========================================================= */

    HD.windowManager.getPosition =
        function (appId) {

            const state =
                HD.appState.ensure(
                    appId
                );

            return {

                x:
                    Number.isFinite(
                        state.windowX
                    )
                        ? state.windowX
                        : 80,

                y:
                    Number.isFinite(
                        state.windowY
                    )
                        ? state.windowY
                        : 90,

                width:
                    Number.isFinite(
                        state.windowWidth
                    )
                        ? state.windowWidth
                        : (
                            HD.config
                                ?.defaultWindowWidth
                            || 720
                        ),

                height:
                    Number.isFinite(
                        state.windowHeight
                    )
                        ? state.windowHeight
                        : (
                            HD.config
                                ?.defaultWindowHeight
                            || 480
                        )

            };

        };


    /* =========================================================
       CLAMP WINDOW
       ========================================================= */

    HD.windowManager.clamp =
        function (
            position
        ) {

            const width =
                Math.max(
                    HD.config
                        ?.minimumWindowWidth
                    || 360,
                    position.width
                );

            const height =
                Math.max(
                    HD.config
                        ?.minimumWindowHeight
                    || 240,
                    position.height
                );

            const viewportWidth =
                window.innerWidth;

            const viewportHeight =
                window.innerHeight;


            const maxX =
                Math.max(
                    0,
                    viewportWidth -
                    Math.min(
                        width,
                        viewportWidth
                    )
                );


            const maxY =
                Math.max(
                    0,
                    viewportHeight -
                    Math.min(
                        height,
                        viewportHeight
                    )
                );


            return {

                x:
                    Math.min(
                        Math.max(
                            0,
                            position.x
                        ),
                        maxX
                    ),

                y:
                    Math.min(
                        Math.max(
                            0,
                            position.y
                        ),
                        maxY
                    ),

                width:
                    Math.min(
                        width,
                        viewportWidth
                    ),

                height:
                    Math.min(
                        height,
                        viewportHeight
                    )

            };

        };


    /* =========================================================
       SAVE WINDOW STATE
       ========================================================= */

    HD.windowManager.saveState =
        function (
            appId,
            position,
            flags = {}
        ) {

            HD.appState.patch(
                appId,
                {

                    windowX:
                        position.x,

                    windowY:
                        position.y,

                    windowWidth:
                        position.width,

                    windowHeight:
                        position.height,

                    minimized:
                        !!flags.minimized,

                    maximized:
                        !!flags.maximized,

                    closed:
                        !!flags.closed,

                    updatedAt:
                        Date.now()

                }
            );

        };


    /* =========================================================
       FOCUS WINDOW
       ========================================================= */

    HD.windowManager.focus =
        function (windowElement) {

            if (!windowElement) {
                return;
            }

            this.zIndex += 1;

            windowElement.style.zIndex =
                String(
                    this.zIndex
                );

            this.activeWindow =
                windowElement;

            document
                .querySelectorAll(
                    ".haldo-window.active"
                )
                .forEach(
                    element => {

                        if (
                            element !==
                            windowElement
                        ) {

                            element.classList
                                .remove(
                                    "active"
                                );

                        }

                    }
                );

            windowElement.classList
                .add(
                    "active"
                );

            const appId =
                windowElement.dataset
                    .appId;

            if (appId) {

                HD.emit(
                    "window:focus",
                    {
                        appId,
                        window:
                            windowElement
                    }
                );

            }

        };


    /* =========================================================
       CREATE WINDOW
       ========================================================= */

    HD.windowManager.create =
        function (
            appId
        ) {

            const manifest =
                HD.appRegistry
                    ?.get(appId);

            if (!manifest) {

                console.warn(
                    "Unbekannte App:",
                    appId
                );

                return null;
            }


            const existing =
                this.get(appId);

            if (existing) {

                this.restore(
                    existing
                );

                this.focus(
                    existing
                );

                return existing;
            }


            const layer =
                HD.ui
                    ?.windowLayer ||
                document.getElementById(
                    "haldo-window-layer"
                );

            if (!layer) {
                return null;
            }


            const position =
                this.clamp(
                    this.getPosition(
                        appId
                    )
                );


            const windowElement =
                document.createElement(
                    "section"
                );

            windowElement.className =
                "haldo-window active";

            windowElement.dataset.appId =
                appId;

            windowElement.dataset.windowId =
                this.createId(
                    appId
                );

            windowElement.style.left =
                position.x + "px";

            windowElement.style.top =
                position.y + "px";

            windowElement.style.width =
                position.width + "px";

            windowElement.style.height =
                position.height + "px";

            windowElement.style.zIndex =
                String(
                    ++this.zIndex
                );


            /* =================================================
               WINDOW HEADER
               ================================================= */

            const header =
                document.createElement(
                    "header"
                );

            header.className =
                "haldo-window-header";


            const titleArea =
                document.createElement(
                    "div"
                );

            titleArea.className =
                "haldo-window-title-area";


            const icon =
                document.createElement(
                    "span"
                );

            icon.className =
                "haldo-window-icon";

            icon.textContent =
                manifest.icon ||
                "○";


            const title =
                document.createElement(
                    "strong"
                );

            title.textContent =
                manifest.name;


            const online =
                document.createElement(
                    "span"
                );

            online.className =
                "status-dot online";


            titleArea.appendChild(
                icon
            );

            titleArea.appendChild(
                title
            );

            titleArea.appendChild(
                online
            );


            /* =================================================
               WINDOW CONTROLS
               ================================================= */

            const controls =
                document.createElement(
                    "div"
                );

            controls.className =
                "haldo-window-controls";


            const minimize =
                document.createElement(
                    "button"
                );

            minimize.type =
                "button";

            minimize.className =
                "window-control minimize";

            minimize.title =
                "Minimieren";

            minimize.textContent =
                "−";


            const maximize =
                document.createElement(
                    "button"
                );

            maximize.type =
                "button";

            maximize.className =
                "window-control maximize";

            maximize.title =
                "Vergrößern";

            maximize.textContent =
                "□";


            const close =
                document.createElement(
                    "button"
                );

            close.type =
                "button";

            close.className =
                "window-control close";

            close.title =
                "Schließen";

            close.textContent =
                "×";


            controls.appendChild(
                minimize
            );

            controls.appendChild(
                maximize
            );

            controls.appendChild(
                close
            );


            header.appendChild(
                titleArea
            );

            header.appendChild(
                controls
            );


            /* =================================================
               WINDOW BODY
               ================================================= */

            const body =
                document.createElement(
                    "div"
                );

            body.className =
                "haldo-window-body";


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "haldo-window-content";


            body.appendChild(
                content
            );


            windowElement.appendChild(
                header
            );

            windowElement.appendChild(
                body
            );


            /* =================================================
               RESIZE HANDLE
               ================================================= */

            const resizeHandle =
                document.createElement(
                    "div"
                );

            resizeHandle.className =
                "haldo-window-resize";

            resizeHandle.setAttribute(
                "aria-label",
                "Fenstergröße ändern"
            );


            windowElement.appendChild(
                resizeHandle
            );


            layer.appendChild(
                windowElement
            );


            /* =================================================
               WINDOW INSTANCE
               ================================================= */

            const instance = {

                id:
                    windowElement
                        .dataset
                        .windowId,

                appId,

                manifest,

                element:
                    windowElement,

                content,

                minimized:
                    false,

                maximized:
                    false,

                previous:
                    null,

                destroyed:
                    false

            };


            this.windows.set(
                appId,
                instance
            );


            /* =================================================
               FOCUS
               ================================================= */

            windowElement.addEventListener(
                "pointerdown",
                () => {

                    this.focus(
                        windowElement
                    );

                }
            );


            /* =================================================
               MINIMIZE
               ================================================= */

            minimize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    this.minimize(
                        instance
                    );

                }
            );


            /* =================================================
               MAXIMIZE
               ================================================= */

            maximize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    this.toggleMaximize(
                        instance
                    );

                }
            );


            /* =================================================
               CLOSE
               ================================================= */

            close.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    this.close(
                        instance
                    );

                }
            );


            /* =================================================
               DRAGGING
               ================================================= */

            this.enableDragging(
                instance,
                header
            );


            /* =================================================
               RESIZING
               ================================================= */

            this.enableResizing(
                instance,
                resizeHandle
            );


            /* =================================================
               RENDER APP
               ================================================= */

            HD.appContent
                ?.render(
                    appId,
                    content,
                    {
                        window:
                            instance
                    }
                );


            HD.emit(
                "window:created",
                {
                    appId,
                    window:
                        instance
                }
            );


            this.focus(
                windowElement
            );


            return instance;

        };


    /* =========================================================
       GET WINDOW
       ========================================================= */

    HD.windowManager.get =
        function (appId) {

            const instance =
                this.windows.get(
                    appId
                );

            if (!instance) {
                return null;
            }

            if (
                instance.destroyed
            ) {

                this.windows.delete(
                    appId
                );

                return null;
            }

            return instance;

        };


    /* =========================================================
       OPEN / RESTORE
       ========================================================= */

    HD.windowManager.open =
        function (appId) {

            let instance =
                this.get(
                    appId
                );

            if (!instance) {

                instance =
                    this.create(
                        appId
                    );

            }

            if (!instance) {
                return null;
            }

            this.restore(
                instance
            );

            this.focus(
                instance.element
            );

            return instance;

        };


    HD.windowManager.restore =
        function (instance) {

            if (!instance) {
                return;
            }

            instance.minimized =
                false;

            instance.element
                .classList
                .remove(
                    "minimized"
                );

            instance.element
                .style.display =
                "flex";


            const state =
                HD.appState.ensure(
                    instance.appId
                );


            if (
                state.maximized
            ) {

                instance.maximized =
                    true;

                this.applyMaximized(
                    instance
                );

            }


            HD.emit(
                "window:restored",
                {
                    appId:
                        instance.appId
                }
            );

        };


    /* =========================================================
       MINIMIZE
       ========================================================= */

    HD.windowManager.minimize =
        function (instance) {

            if (!instance) {
                return;
            }

            instance.minimized =
                true;

            instance.element
                .classList
                .add(
                    "minimized"
                );

            instance.element
                .style.display =
                "none";


            this.saveState(
                instance.appId,
                {
                    x:
                        parseFloat(
                            instance
                                .element
                                .style
                                .left
                        ) || 0,

                    y:
                        parseFloat(
                            instance
                                .element
                                .style
                                .top
                        ) || 0,

                    width:
                        instance
                            .element
                            .offsetWidth,

                    height:
                        instance
                            .element
                            .offsetHeight

                },
                {
                    minimized:
                        true,

                    maximized:
                        instance.maximized
                }
            );


            HD.emit(
                "window:minimized",
                {
                    appId:
                        instance.appId
                }
            );

        };


    /* =========================================================
       APPLY MAXIMIZED
       ========================================================= */

    HD.windowManager.applyMaximized =
        function (instance) {

            if (!instance) {
                return;
            }

            instance.element
                .classList
                .add(
                    "maximized"
                );

            instance.element.style.left =
                "0px";

            instance.element.style.top =
                "0px";

            instance.element.style.width =
                "100%";

            instance.element.style.height =
                "100%";

        };


    /* =========================================================
       TOGGLE MAXIMIZE
       ========================================================= */

    HD.windowManager.toggleMaximize =
        function (instance) {

            if (!instance) {
                return;
            }


            if (
                instance.maximized
            ) {

                instance.maximized =
                    false;

                instance.element
                    .classList
                    .remove(
                        "maximized"
                    );


                if (
                    instance.previous
                ) {

                    const p =
                        instance.previous;

                    instance.element.style.left =
                        p.x + "px";

                    instance.element.style.top =
                        p.y + "px";

                    instance.element.style.width =
                        p.width + "px";

                    instance.element.style.height =
                        p.height + "px";

                }

            }
            else {

                instance.previous = {

                    x:
                        parseFloat(
                            instance.element.style.left
                        ) || 0,

                    y:
                        parseFloat(
                            instance.element.style.top
                        ) || 0,

                    width:
                        instance.element.offsetWidth,

                    height:
                        instance.element.offsetHeight

                };


                instance.maximized =
                    true;

                this.applyMaximized(
                    instance
                );

            }


            const position = {

                x:
                    parseFloat(
                        instance.element.style.left
                    ) || 0,

                y:
                    parseFloat(
                        instance.element.style.top
                    ) || 0,

                width:
                    instance.element.offsetWidth,

                height:
                    instance.element.offsetHeight

            };


            this.saveState(
                instance.appId,
                position,
                {
                    minimized:
                        false,

                    maximized:
                        instance.maximized
                }
            );


            this.focus(
                instance.element
            );


            HD.emit(
                "window:maximized",
                {
                    appId:
                        instance.appId,

                    maximized:
                        instance.maximized
                }
            );

        };


    /* =========================================================
       CLOSE
       ========================================================= */

    HD.windowManager.close =
        function (instance) {

            if (!instance) {
                return;
            }


            const element =
                instance.element;


            const position = {

                x:
                    parseFloat(
                        element.style.left
                    ) || 0,

                y:
                    parseFloat(
                        element.style.top
                    ) || 0,

                width:
                    element.offsetWidth,

                height:
                    element.offsetHeight

            };


            this.saveState(
                instance.appId,
                position,
                {
                    minimized:
                        false,

                    maximized:
                        instance.maximized,

                    closed:
                        true
                }
            );


            if (
                typeof instance.destroy ===
                "function"
            ) {

                try {
                    instance.destroy();
                }
                catch (error) {
                    console.warn(
                        "HalDo App Destroy:",
                        error
                    );
                }

            }


            element.remove();

            instance.destroyed =
                true;

            this.windows.delete(
                instance.appId
            );


            HD.emit(
                "window:closed",
                {
                    appId:
                        instance.appId
                }
            );

        };


    /* =========================================================
       DRAGGING
       ========================================================= */

    HD.windowManager.enableDragging =
        function (
            instance,
            header
        ) {

            let dragging =
                false;

            let startX =
                0;

            let startY =
                0;

            let originX =
                0;

            let originY =
                0;


            header.addEventListener(
                "pointerdown",
                function (event) {

                    if (
                        event.target.closest(
                            ".haldo-window-controls"
                        )
                    ) {
                        return;
                    }

                    if (
                        instance.maximized
                    ) {
                        return;
                    }


                    dragging =
                        true;

                    startX =
                        event.clientX;

                    startY =
                        event.clientY;

                    originX =
                        parseFloat(
                            instance
                                .element
                                .style
                                .left
                        ) || 0;

                    originY =
                        parseFloat(
                            instance
                                .element
                                .style
                                .top
                        ) || 0;


                    header.setPointerCapture(
                        event.pointerId
                    );


                    this.focus(
                        instance.element
                    );

                }.bind(this)
            );


            header.addEventListener(
                "pointermove",
                function (event) {

                    if (!dragging) {
                        return;
                    }


                    const deltaX =
                        event.clientX -
                        startX;

                    const deltaY =
                        event.clientY -
                        startY;


                    const position =
                        this.clamp(
                            {

                                x:
                                    originX +
                                    deltaX,

                                y:
                                    originY +
                                    deltaY,

                                width:
                                    instance
                                        .element
                                        .offsetWidth,

                                height:
                                    instance
                                        .element
                                        .offsetHeight

                            }
                        );


                    instance.element.style.left =
                        position.x + "px";

                    instance.element.style.top =
                        position.y + "px";


                }.bind(this)
            );


            header.addEventListener(
                "pointerup",
                function () {

                    if (!dragging) {
                        return;
                    }

                    dragging =
                        false;

                    this.persistWindow(
                        instance
                    );

                }.bind(this)
            );


            header.addEventListener(
                "pointercancel",
                function () {

                    dragging =
                        false;

                    this.persistWindow(
                        instance
                    );

                }.bind(this)
            );

        };


    /* =========================================================
       RESIZING
       ========================================================= */

    HD.windowManager.enableResizing =
        function (
            instance,
            handle
        ) {

            let resizing =
                false;

            let startX =
                0;

            let startY =
                0;

            let startWidth =
                0;

            let startHeight =
                0;


            handle.addEventListener(
                "pointerdown",
                function (event) {

                    if (
                        instance.maximized
                    ) {
                        return;
                    }


                    resizing =
                        true;

                    startX =
                        event.clientX;

                    startY =
                        event.clientY;

                    startWidth =
                        instance
                            .element
                            .offsetWidth;

                    startHeight =
                        instance
                            .element
                            .offsetHeight;


                    handle.setPointerCapture(
                        event.pointerId
                    );


                    this.focus(
                        instance.element
                    );


                    event.preventDefault();

                }.bind(this)
            );


            handle.addEventListener(
                "pointermove",
                function (event) {

                    if (!resizing) {
                        return;
                    }


                    const minimumWidth =
                        HD.config
                            ?.minimumWindowWidth
                        || 360;

                    const minimumHeight =
                        HD.config
                            ?.minimumWindowHeight
                        || 240;


                    const width =
                        Math.max(
                            minimumWidth,
                            startWidth +
                            (
                                event.clientX -
                                startX
                            )
                        );


                    const height =
                        Math.max(
                            minimumHeight,
                            startHeight +
                            (
                                event.clientY -
                                startY
                            )
                        );


                    instance.element.style.width =
                        Math.min(
                            width,
                            window.innerWidth
                        ) + "px";

                    instance.element.style.height =
                        Math.min(
                            height,
                            window.innerHeight
                        ) + "px";

                }.bind(this)
            );


            handle.addEventListener(
                "pointerup",
                function () {

                    if (!resizing) {
                        return;
                    }

                    resizing =
                        false;

                    this.persistWindow(
                        instance
                    );

                }.bind(this)
            );


            handle.addEventListener(
                "pointercancel",
                function () {

                    resizing =
                        false;

                    this.persistWindow(
                        instance
                    );

                }.bind(this)
            );

        };


    /* =========================================================
       PERSIST WINDOW
       ========================================================= */

    HD.windowManager.persistWindow =
        function (instance) {

            if (!instance) {
                return;
            }


            const element =
                instance.element;


            this.saveState(
                instance.appId,
                {

                    x:
                        parseFloat(
                            element.style.left
                        ) || 0,

                    y:
                        parseFloat(
                            element.style.top
                        ) || 0,

                    width:
                        element.offsetWidth,

                    height:
                        element.offsetHeight

                },
                {

                    minimized:
                        instance.minimized,

                    maximized:
                        instance.maximized,

                    closed:
                        false

                }
            );

        };


    /* =========================================================
       CLOSE ALL
       ========================================================= */

    HD.windowManager.closeAll =
        function () {

            Array.from(
                this.windows.values()
            )
            .forEach(
                instance => {

                    this.close(
                        instance
                    );

                }
            );

        };


    /* =========================================================
       RESTORE PREVIOUS WINDOWS
       ========================================================= */

    HD.windowManager.restorePersistent =
        function () {

            if (!HD.appRegistry) {
                return;
            }


            HD.appRegistry
                .all()
                .forEach(
                    manifest => {

                        const state =
                            HD.appState
                                .ensure(
                                    manifest.id
                                );


                        /*
                         * Apps werden nicht automatisch
                         * geöffnet, wenn sie vorher
                         * ausdrücklich geschlossen wurden.
                         *
                         * Der Zustand bleibt trotzdem
                         * dauerhaft gespeichert.
                         */

                        if (
                            state.wasOpen === true
                        ) {

                            this.open(
                                manifest.id
                            );

                        }

                    }
                );

        };


    /* =========================================================
       WINDOW RESPONSIVENESS
       ========================================================= */

    HD.windowManager.adaptToViewport =
        function () {

            this.windows.forEach(
                instance => {

                    if (
                        instance.maximized
                    ) {
                        return;
                    }


                    const position =
                        this.clamp(
                            {

                                x:
                                    parseFloat(
                                        instance
                                            .element
                                            .style
                                            .left
                                    ) || 0,

                                y:
                                    parseFloat(
                                        instance
                                            .element
                                            .style
                                            .top
                                    ) || 0,

                                width:
                                    instance
                                        .element
                                        .offsetWidth,

                                height:
                                    instance
                                        .element
                                        .offsetHeight

                            }
                        );


                    instance.element.style.left =
                        position.x + "px";

                    instance.element.style.top =
                        position.y + "px";

                    instance.element.style.width =
                        position.width + "px";

                    instance.element.style.height =
                        position.height + "px";

                }
            );

        };


    window.addEventListener(
        "resize",
        function () {

            HD.windowManager
                .adaptToViewport();

        }
    );


    /* =========================================================
       CONNECT TO APP RUNTIME
       ========================================================= */

    if (
        HD.appRuntime
    ) {

        HD.appRuntime.openWindow =
            function (
                appId
            ) {

                return HD.windowManager
                    .open(
                        appId
                    );

            };


        HD.appRuntime.closeWindow =
            function (
                appId
            ) {

                const instance =
                    HD.windowManager
                        .get(
                            appId
                        );

       ========================================================= */

    HD.cosmic.createPlanets =
        function () {

            const container =
                document.getElementById(
                    "haldo-cosmic-planets"
                );


            const sun =
                document.getElementById(
                    "haldo-sun"
                );


            if (
                !container ||
                !sun
            ) {

                return false;

            }


            container.innerHTML =
                "";


            this.planets =
                [];


            this.planetDefinitions
                .forEach(
                    definition => {

                        const orbit =
                            document.createElement(
                                "div"
                            );


                        orbit.className =
                            "haldo-cosmic-orbit";


                        orbit.style.width =
                            (
                                definition.distance *
                                2.5
                            ) + "vw";


                        orbit.style.height =
                            (
                                definition.distance *
                                2.5
                            ) + "vw";


                        orbit.style.animationDuration =
                            definition.duration +
                            "s";


                        const planet =
                            document.createElement(
                                "div"
                            );


                        planet.className =
                            "haldo-cosmic-planet " +
                            definition.className;


                        planet.style.width =
                            definition.size +
                            "px";


                        planet.style.height =
                            definition.size +
                            "px";


                        planet.title =
                            definition.name;


                        planet.setAttribute(
                            "aria-label",
                            definition.name
                        );


                        const body =
                            document.createElement(
                                "span"
                            );


                        body.className =
                            "planet-body";


                        planet.appendChild(
                            body
                        );


                        if (
                            definition.ring
                        ) {

                            const ring =
                                document.createElement(
                                    "span"
                                );


                            ring.className =
                                "planet-ring";


                            planet.appendChild(
                                ring
                            );

                        }


                        if (
                            definition.moon
                        ) {

                            const moonOrbit =
                                document.createElement(
                                    "span"
                                );


                            moonOrbit.className =
                                "haldo-moon-orbit";


                            const moon =
                                document.createElement(
                                    "span"
                                );


                            moon.className =
                                "haldo-moon";


                            moon.title =
                                "Mond";


                            moonOrbit.appendChild(
                                moon
                            );


                            planet.appendChild(
                                moonOrbit
                            );

                        }


                        orbit.appendChild(
                            planet
                        );


                        container.appendChild(
                            orbit
                        );


                        this.planets.push(
                            {
                                definition,
                                orbit,
                                planet
                            }
                        );

                    }
                );


            return true;

        };
