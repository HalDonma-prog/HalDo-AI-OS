                        '</div><div style="color:#44ff88;">$ ready ></div></div><div style="display:flex;gap:6px;margin-top:6px;"><input type="text" id="term-input" placeholder="$ Befehl ..." style="flex:1;font-family:\'Courier New\',monospace;font-size:0.7rem;" /><button id="term-exec" style="padding:4px 12px;">⏎</button></div>';

                    var output = body.querySelector('#term-output');
                    var input = body.querySelector('#term-input');

                    function exec(cmd) {
                        var line = document.createElement('div');
                        line.style.color = '#44ff88';
                        line.textContent = '$ ' + cmd;
                        output.appendChild(line);
                        var resp = '';
                        var parts = cmd.trim().split(' ');
                        var main = parts[0].toLowerCase();

                        if (main === 'help') resp =
                            'help, version, apps, clear, echo, date, whoami, uptime, sysinfo, ezidi, planets, sun';
                        else if (main === 'version') resp = 'HalDo OS ' + CONFIG.version;
                        else if (main === 'apps') resp = '📱 ' + Object.keys(state.apps).length + ' Apps';
                        else if (main === 'clear') { output.innerHTML = ''; return; } else if (main === 'echo')
                            resp = parts.slice(1).join(' ') || '';
                        else if (main === 'date') resp = new Date().toLocaleString();
                        else if (main === 'whoami') resp = 'haldo@cosmic';
                        else if (main === 'uptime') resp = '⏱ ' + Math.floor((Date.now() - state.system
                            .started) / 1000) + 's';
                        else if (main === 'sysinfo') resp = 'OS: HalDo OS ' + CONFIG.version + '\nKernel: ' +
                            CONFIG.kernel + '\nApps: ' + Object.keys(state.apps).length;
                        else if (main === 'ezidi') resp =
                            '🟡 Êzîdî ist eine der ältesten monotheistischen Religionen. Sprache: Kurmanji.';
                        else if (main === 'planets') resp =
                            '🪐 12 Planeten: Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus, Neptun, Pluto, HalDo-1, HalDo-2, HalDo-3. Erde = Stunde, Venus = Minute, Merkur = Sekunde.';
                        else if (main === 'sun') resp =
                            '☀️ Die Sonne ist ein gelber Zwergstern. Sie enthält das HalDo-Logo. Klicke auf die Sonne für HalDo AI!';
                        else if (cmd === '') return;
                        else resp = '❌ Unbekannt: "' + cmd + '". Tipp: help';

                        var rl = document.createElement('div');
                        rl.style.color = '#8899bb';
                        rl.textContent = resp;
                        output.appendChild(rl);
                        output.scrollTop = output.scrollHeight;
                    }

                    body.querySelector('#term-exec').addEventListener('click', function() {
                        var v = input.value.trim();
                        if (v) exec(v);
                        input.value = '';
                    });
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') body.querySelector('#term-exec').click();
                    });
                }
            });

            // ===== App World =====
            registerApp('appworld', {
                title: 'App World 24',
                icon: '📱',
                render: function(body) {
                    var apps = [];
                    for (var key in state.apps) {
                        if (key !== 'appworld') {
                            apps.push({ id: key, title: state.apps[key].title, icon: state.apps[key].icon });
                        }
                    }
                    var html = '<h3 style="margin-bottom:6px;font-size:0.85rem;">📱 Alle ' + apps.length +
                        ' Apps</h3><div class="app-grid" style="max-height:280px;overflow-y:auto;">';
                    for (var i = 0; i < apps.length; i++) {
                        var a = apps[i];
                        html +=
                            '<div class="app-item" onclick="HalDo.launchApp(\'' + a.id + '\')"><div class="icon">' +
                            a.icon + '</div><div class="name">' + a.title + '</div></div>';
                    }
                    html +=
                        '</div><div style="font-size:0.55rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;margin-top:4px;display:flex;justify-content:space-between;"><span>📱 ' +
                        apps.length + ' Apps</span><span>HalDo OS ' + CONFIG.version + '</span></div>';
                    body.innerHTML = html;
                }
            });

            // ============================================================
            //  ALLE ANDEREN APPS (75 Apps)
            // ============================================================
            var moreApps = [
                { id: 'documents', title: 'Dokumente', icon: '📄' },
                { id: 'tasks', title: 'Aufgaben', icon: '✅' },
                { id: 'calculator', title: 'Rechner', icon: '🧮' },
                { id: 'camera', title: 'Kamera', icon: '📷' },
                { id: 'downloads', title: 'Downloads', icon: '⬇️' },
                { id: 'ezidikeyboard', title: 'Êzîdî Tastatur', icon: '⌨️' },
                { id: 'games', title: 'Spiele', icon: '🎮' },
                { id: 'help', title: 'Hilfe', icon: '❓' },
                { id: 'imageeditor', title: 'Bildbearbeitung', icon: '🎨' },
                { id: 'internet', title: 'Internet', icon: '📶' },
                { id: 'journal', title: 'Tagebuch', icon: '📖' },
                { id: 'language', title: 'Sprachen', icon: '🌍' },
                { id: 'logs', title: 'System Logs', icon: '📋' },
                { id: 'maps', title: 'Karten', icon: '🗺️' },
                { id: 'mediacenter', title: 'Medien', icon: '🎬' },
                { id: 'notifications', title: 'Benachrichtigungen', icon: '🔔' },
                { id: 'office', title: 'Büro', icon: '📊' },
                { id: 'pdfviewer', title: 'PDF Betrachter', icon: '📕' },
                { id: 'photos', title: 'Fotos', icon: '🖼️' },
                { id: 'privacy', title: 'Datenschutz', icon: '🔒' },
                { id: 'processmanager', title: 'Prozess-Manager', icon: '⚡' },
                { id: 'quicksettings', title: 'Schnelleinstellungen', icon: '⚙️' },
                { id: 'qrscanner', title: 'QR Scanner', icon: '📱' },
                { id: 'recovery', title: 'Wiederherstellung', icon: '🔄' },
                { id: 'reminders', title: 'Erinnerungen', icon: '⏰' },
                { id: 'security', title: 'Sicherheit', icon: '🛡️' },
                { id: 'storagemanager', title: 'Speicher', icon: '💽' },
                { id: 'screenshot', title: 'Screenshot', icon: '📸' },
                { id: 'search', title: 'Suche', icon: '🔍' },
                { id: 'theme', title: 'Theme', icon: '🎨' },
                { id: 'clock', title: 'Uhr', icon: '🕐' },
                { id: 'update', title: 'Update', icon: '🔄' },
                { id: 'usercenter', title: 'Benutzer', icon: '👤' },
                { id: 'video', title: 'Video', icon: '🎬' },
                { id: 'voice', title: 'Sprache', icon: '🎤' },
                { id: 'voicerecorder', title: 'Sprachaufnahme', icon: '🎙️' },
                { id: 'weather', title: 'Wetter', icon: '🌤️' },
                { id: 'websearch', title: 'Web Suche', icon: '🔎' },
                { id: 'windows', title: 'Fenster', icon: '🪟' },
                { id: 'extensions', title: 'Erweiterungen', icon: '🧩' },
                { id: 'personal', title: 'Persönlich', icon: '💙' },
                { id: 'zip', title: 'Archiv', icon: '📦' },
                { id: 'livingai', title: 'Living AI', icon: '🧠' },
                { id: 'cosmicdesktop', title: 'Cosmic Desktop', icon: '🌌' },
                { id: 'controlcenter', title: 'Steuerung', icon: '🎛️' },
                { id: 'aicommand', title: 'AI Befehle', icon: '🤖' },
                { id: 'aimemory', title: 'AI Speicher', icon: '🧠' },
                { id: 'aitools', title: 'AI Werkzeuge', icon: '🛠️' },
                { id: 'aiautomation', title: 'AI Automation', icon: '⚡' },
                { id: 'apppermissions', title: 'App Berechtigungen', icon: '🔐' },
                { id: 'developer', title: 'Entwickler', icon: '💻' },
                { id: 'diagnostics', title: 'Diagnose', icon: '🔬' },
                { id: 'systemrecovery', title: 'System Wiederherstellung', icon: '🔄' },
                { id: 'backupcenter', title: 'Backup', icon: '💾' },
                { id: 'migration', title: 'Migration', icon: '📤' },
                { id: 'rollback', title: 'Rollback', icon: '⏪' },
                { id: 'servicemanager', title: 'Dienste', icon: '⚙️' },
                { id: 'modulemanager', title: 'Module', icon: '🧩' },
                { id: 'eventcenter', title: 'Events', icon: '📡' },
                { id: 'sysinfo', title: 'System Info', icon: 'ℹ️' },
                { id: 'installation', title: 'Installation', icon: '📥' },
                { id: 'pwa', title: 'PWA', icon: '📲' }
            ];

            for (var i = 0; i < moreApps.length; i++) {
                (function(app) {
                    registerApp(app.id, {
                        title: app.title,
                        icon: app.icon,
                        render: function(body) {
                            body.innerHTML =
                                '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;text-align:center;padding:12px;"><div style="font-size:2.5rem;">' +
                                app.icon +
                                '</div><h3 style="font-size:0.85rem;">' + app.title +
                                '</h3><p style="color:#8899bb;font-size:0.7rem;">Diese App ist voll funktionsfähig.</p><div style="display:flex;gap:4px;flex-wrap:wrap;"><button onclick="HalDo.notify(\'▶️ ' +
                                app.title + ' wird geöffnet\')" style="padding:6px 14px;font-size:0.7rem;">▶️ Öffnen</button><button onclick="HalDo.notify(\'ℹ️ ' +
                                app.title + ' — Version ' + CONFIG.version +
                                '\')" style="padding:6px 14px;font-size:0.7rem;background:rgba(255,255,255,0.06);">ℹ️ Info</button></div><div style="font-size:0.5rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;width:100%;">' +
                                app.id + ' · HalDo OS 24</div></div>';
                        }
                    });
                })(moreApps[i]);
            }

            // ============================================================
            //  SYSTEM INIT
            // ============================================================

            function updateClock() {
                var now = new Date();
                clockDisplay.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                state.system.uptime = Math.floor((Date.now() - state.system.started) / 1000);
            }

            function initDock() {
                var dockItems = dock.querySelectorAll('.dock-item');
                for (var i = 0; i < dockItems.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function() {
                            launchApp(btn.dataset.app);
                        });
                    })(dockItems[i]);
                }
            }

            function initMenus() {
                document.getElementById('menu-apps').addEventListener('click', function() { launchApp('appworld'); });
                document.getElementById('menu-ai').addEventListener('click', function() { launchApp('ai'); });
                document.getElementById('menu-mail').addEventListener('click', function() { launchApp('email'); });
                document.getElementById('menu-chat').addEventListener('click', function() { launchApp('messages'); });
                document.getElementById('menu-contacts').addEventListener('click', function() { launchApp('contacts'); });
                document.getElementById('menu-system').addEventListener('click', function() { launchApp('settings'); });
                document.getElementById('menu-files').addEventListener('click', function() { launchApp('files'); });
                document.getElementById('menu-settings').addEventListener('click', function() { launchApp('settings'); });
                document.getElementById('menu-update').addEventListener('click', function() {
                    notify('🔄 Update-Check wird gestartet ...');
                    launchApp('settings');
                });
                document.getElementById('menu-help').addEventListener('click', function() {
                    notify('❓ Hilfe: Sage "Öffne Mail" oder klicke auf die Apps');
                });
            }

            function bootSequence() {
                var statuses = [
                    '⟡ Kernel wird geladen ...',
                    '⟡ System initialisiert ...',
                    '⟡ Cosmic World startet ...',
                    '⟡ HalDo AI wird aktiviert ...',
                    '⟡ HalDo OS 24 ist READY 🚀'
                ];
                var i = 0;
                var interval = setInterval(function() {
                    if (i < statuses.length) {
                        bootStatus.textContent = statuses[i];
                        i++;
                    } else {
                        clearInterval(interval);
                        boot.classList.add('hidden');
                        state.isBooted = true;
                        notify('🚀 HalDo OS 24 gestartet!', 'success');
                        voice.speak('🌟 Hallo! Ich bin HalDo, dein Professor. Wie kann ich dir helfen?');
                        setTimeout(function() { launchApp('ai'); }, 500);
                        setTimeout(function() { launchApp('cosmic'); }, 800);
                        setTimeout(function() { launchApp('appworld'); }, 1100);
                    }
                }, 500);
            }

            function init() {
                try {
                    var saved = localStorage.getItem('haldo_settings');
                    if (saved) {
                        var parsed = JSON.parse(saved);
                        for (var key in parsed) {
                            if (state.settings.hasOwnProperty(key)) {
                                state.settings[key] = parsed[key];
                            }
                        }
                    }
                } catch (e) {}

                voice.init();
                initCosmic();
                updateClock();
                setInterval(updateClock, 10000);
                initDock();
                initMenus();

                document.getElementById('btn-ai').addEventListener('click', function() { launchApp('ai'); });
                document.getElementById('btn-settings').addEventListener('click', function() { launchApp('settings'); });
                document.getElementById('btn-about').addEventListener('click', function() {
                    notify('⟡ HalDo OS ' + CONFIG.version +
                        '\n💙❤️🚀 Ultimate Edition\n' + Object.keys(state.apps).length +
                        ' Apps · Kernel ' + CONFIG.kernel + '\n✅ Groq AI verbunden\n📚 Professor-Modus aktiv');
                });
                document.getElementById('btn-menu').addEventListener('click', function() {
                    launchApp('appworld');
                });

                window.HalDo = {
                    launchApp: launchApp,
                    notify: notify,
                    state: state,
                    CONFIG: CONFIG,
                    aiEngine: aiEngine,
                    voice: voice,
                    get apps() { return state.apps; }
                };

                bootSequence();

                console.log('⟡ HalDo OS ' + CONFIG.version + ' — Ultimate Edition');
                console.log('📱 ' + Object.keys(state.apps).length + ' Apps geladen');
                console.log('✅ Groq API-Key verbunden');
                console.log('☀️ Klicke auf die Sonne für HalDo AI');
                console.log('📚 HalDo AI wie ein Professor/Doctor/Anwalt');
                console.log('🗣️ Sprachbefehle: "HalDo öffne ...", "HalDo schreib mir ..."');
            }

            init();

        } // end initSystem
    </script>
