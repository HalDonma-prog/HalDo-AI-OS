            </button>


            <div
                class="haldo-cosmic-label"
            >
                HALDO AI
            </div>

        </div>


        <div
            class="haldo-cosmic-info"
            id="haldo-cosmic-info"
        >

            <div
                class="haldo-cosmic-info-title"
                id="haldo-cosmic-info-title"
            >
                HalDo Cosmic World
            </div>

            <div
                class="haldo-cosmic-info-text"
                id="haldo-cosmic-info-text"
            >
                Eine lebendige Welt des HalDo AI OS.
            </div>

        </div>

    `;


    const solar =
        cosmic.querySelector(
            "#haldo-solar-system"
        );


    /* =========================================================
       CREATE ORBITS
    ========================================================== */

    cosmicState.bodies
        .filter(
            body =>
                body.type ===
                "planet"
        )
        .forEach(
            body => {

                const orbit =
                    document.createElement(
                        "div"
                    );


                orbit.className =
                    "haldo-orbit";


                /*
                 * Bewusst gestaffelte
                 * Abstände, damit die Planeten
                 * nicht ineinanderlaufen.
                 */

                const orbitSize =
                    105 +
                    (
                        body.orbit *
                        58
                    );


                orbit.style.setProperty(
                    "--orbit-size",
                    `${orbitSize}px`
                );


                const bodyElement =
                    document.createElement(
                        "button"
                    );


                bodyElement.type =
                    "button";


                bodyElement.className =
                    "haldo-orbit-body";


                bodyElement.dataset.bodyId =
                    body.id;


                bodyElement.title =
                    body.name;


                bodyElement.style.setProperty(
                    "--body-size",
                    `${body.size}px`
                );


                bodyElement.style.setProperty(
                    "--orbit-duration",
                    `${body.duration / cosmicState.speed}s`
                );


                const surface =
                    document.createElement(
                        "span"
                    );


                surface.className =
                    "haldo-planet-surface";


                surface.classList.add(
                    `haldo-planet-${body.id}`
                );


                bodyElement.appendChild(
                    surface
                );


                /*
                 * Erde bekommt einen Mond.
                 */

                if (
                    body.id ===
                    "earth"
                ) {

                    const moonOrbit =
                        document.createElement(
                            "span"
                        );


                    moonOrbit.className =
                        "haldo-earth-moon-orbit";


                    moonOrbit.innerHTML = `

                        <span
                            class="haldo-moon"
                            title="Mond"
                        ></span>

                    `;


                    bodyElement.appendChild(
                        moonOrbit
                    );

                }


                bodyElement.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        selectCosmicBody(
                            body
                        );

                    }
                );


                orbit.appendChild(
                    bodyElement
                );


                solar.appendChild(
                    orbit
                );

            }
        );


    /* =========================================================
       COSMIC BODY INTERACTION
    ========================================================== */

    function selectCosmicBody(
        body
    ) {

        cosmicState.selectedBody =
            body.id;


        const info =
            document.querySelector(
                "#haldo-cosmic-info"
            );


        const title =
            document.querySelector(
                "#haldo-cosmic-info-title"
            );


        const text =
            document.querySelector(
                "#haldo-cosmic-info-text"
            );


        if (
            title
        ) {

            title.textContent =
                body.name;

        }


        if (
            text
        ) {

            const descriptions = {

                sun:
                    "Das lebendige Zentrum der HalDo Cosmic World.",

                mercury:
                    "Merkur bewegt sich schnell auf seiner inneren Umlaufbahn.",

                venus:
                    "Venus ist die zweite Welt des HalDo-Sonnensystems.",

                earth:
                    "Die Erde besitzt eine eigene Rotation und einen umlaufenden Mond.",

                mars:
                    "Mars ist die rote Welt hinter der Erde.",

                jupiter:
                    "Jupiter ist der größte Planet des Systems.",

                saturn:
                    "Saturn besitzt sein charakteristisches Ringsystem.",

                uranus:
                    "Uranus ist ein kalter äußerer Planet.",

                neptune:
                    "Neptun befindet sich weit außen im System."

            };


            text.textContent =
                descriptions[
                    body.id
                ] ||
                "Kosmisches Objekt des HalDo AI OS.";

        }


        info?.classList.add(
            "is-visible"
        );


        OS.events.emit(
            "cosmic:body-selected",
            body
        );


        /*
         * HalDo AI kann auf die
         * Interaktion reagieren.
         */

        if (
            window.HalDoAI
        ) {

            const message =
                `Der Nutzer hat ${body.name} ausgewählt.`;


            OS.events.emit(
                "ai:context",
                {
                    type:
                        "cosmic",

                    message,

                    body
                }
            );

        }

    }


    /* =========================================================
       SUN INTERACTION
    ========================================================== */

    const sun =
        document.querySelector(
            "#haldo-sun"
        );


    sun?.addEventListener(
        "click",
        () => {

            selectCosmicBody(
                cosmicState.bodies[0]
            );


            /*
             * Zentrale HalDo AI öffnen.
             */

            setTimeout(
                () => {

                    if (
                        typeof
                        window.HalDoOpenApp ===
                        "function"
                    ) {

                        /*
                         * Erst mögliche
                         * Chat-App suchen.
                         */

                        const candidates = [

                            "ai-chat",

                            "haldo-ai",

                            "chat",

                            "ai"

                        ];


                        for (
                            const id of
                            candidates
                        ) {

                            try {

                                const app =
                                    window.HalDoGetApp
                                        ? window.HalDoGetApp(
                                            id
                                        )
                                        : null;


                                if (
                                    app
                                ) {

                                    window.HalDoOpenApp(
                                        id
                                    );

                                    return;

                                }

                            } catch {}

                        }

                    }


                    OS.events.emit(
                        "ai:focus"
                    );

                },
                120
            );

        }
    );


    /* =========================================================
       HALDO LOGO INTERACTION
    ========================================================== */

    const logo =
        document.querySelector(
            "#haldo-cosmic-logo"
        );


    logo?.addEventListener(
        "click",
        () => {

            OS.events.emit(
                "ai:focus"
            );


            if (
                typeof
                window.HalDoOpenApp ===
                "function"
            ) {

                const ids = [

                    "ai-chat",
                    "haldo-ai",
                    "chat",
                    "ai"

                ];


                for (
                    const id of ids
                ) {

                    try {

                        if (
                            window.HalDoGetApp &&
                            window.HalDoGetApp(
                                id
                            )
                        ) {

                            window.HalDoOpenApp(
                                id
                            );

                            return;

                        }

                    } catch {}

                }

            }

        }
    );


    /* =========================================================
       CLICK COSMIC BACKGROUND
    ========================================================== */

    cosmic.addEventListener(
        "click",
        event => {

            if (
                event.target.closest(
                    ".haldo-orbit-body"
                ) ||
                event.target.closest(
                    "#haldo-sun"
                ) ||
                event.target.closest(
                    "#haldo-cosmic-logo"
                )
            ) {

                return;

            }


            document
                .querySelector(
                    "#haldo-cosmic-info"
                )
                ?.classList.remove(
                    "is-visible"
                );

        }
    );


    /* =========================================================
       COSMIC API
    ========================================================== */

    window.HalDoCosmicWorld = {

        state:
            cosmicState,

        select:
            selectCosmicBody,

        pause:
            () => {

                cosmicState.running =
                    false;

                cosmic.style.setProperty(
                    "--haldo-animation-state",
                    "paused"
                );

            },

        resume:
            () => {

                cosmicState.running =
                    true;

            },

        setSpeed:
            speed => {

                const value =
                    Math.max(
                        .1,
                        Math.min(
                            5,
                            Number(
                                speed
                            ) || 1
                        )
                    );


                cosmicState.speed =
                    value;


                document
                    .querySelectorAll(
                        ".haldo-orbit-body"
                    )
                    .forEach(
                        (element, index) => {

                            const body =
                                cosmicState.bodies
                                    .filter(
                                        item =>
                                            item.type ===
                                            "planet"
                                    )[index];


                            if (
                                body
                            ) {

                                element.style.setProperty(
                                    "--orbit-duration",
                                    `${body.duration / value}s`
                                );

                            }

                        }
                    );

            }

    };


    /* =========================================================
       GLOBAL APP SYSTEM READY
    ========================================================== */

    OS.events.emit(
        "cosmic:ready",
        {
            planets:
                cosmicState.bodies.length,

            interactive:
                true
        }
    );


    /* =========================================================
       FINAL SYSTEM STATUS
    ========================================================== */

    function createFinalStatus() {

        window.HalDoSystemStatus =
            window.HalDoSystemStatus ||
            {

                kernel:
                    true,

                system:
                    true,

                events:
                    true,

                services:
                    true,

                runtime:
                    true,

                registry:
                    true,

                manager:
                    true,

                router:
                    true,

                windows:
                    true,

                storage:
                    true,

                ai:
                    true,

                language:
                    true,

                voice:
                    true,

                keyboard:
                    true,

                cosmic:
                    true

            };


        OS.events.emit(
            "system:ready",
            window.HalDoSystemStatus
        );

    }


    createFinalStatus();


    /* =========================================================
       FINAL BOOT MESSAGE
    ========================================================== */

    function finalBoot() {

        document.documentElement
            .classList.add(
                "haldo-os-ready"
            );


        document.body
            .classList.add(
                "haldo-os-ready"
            );


        /*
         * Status-Badge, falls vorhanden.
         */

        const status =
            document.querySelector(
                "[data-haldo-status]"
            );


        if (
            status
        ) {

            status.textContent =
                "ONLINE";

        }


        OS.events.emit(
            "haldo:ready",
            {
                version:
                    "20.0",

                timestamp:
                    Date.now()
            }
        );


        console.log(
            "%c HALDO AI OS 20 ",
            "font-weight:bold;font-size:16px"
        );


        console.log(
            "System: ONLINE"
        );


        console.log(
            "Kernel: CONNECTED"
        );


        console.log(
            "Runtime: CONNECTED"
        );


        console.log(
            "Window System: CONNECTED"
        );


        console.log(
            "AI: CONNECTED"
        );


        console.log(
            "Language: CONNECTED"
        );


        console.log(
            "Cosmic World: CONNECTED"
        );

    }


    /*
     * Kleine Verzögerung, damit alle
     * vorherigen Teile initialisiert sind.
     */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            finalBoot,
            {
                once:
                    true
            }
        );

    } else {

        finalBoot();

    }


})();
</script>
