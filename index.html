<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05080f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HalDo AI OS 23.1.6 — Ultimative Version</title>

    <style>
        /* =========================================================
        KOMPLETTE STYLES
        ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #05080f;
            --surface: rgba(8, 12, 28, 0.92);
            --border: rgba(255, 255, 255, 0.04);
            --text: #e8edf5;
            --gold: #ffd54b;
            --gold-dark: #ff9f1c;
            --radius: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            user-select: none;
            -webkit-user-select: none;
        }

        #haldo-os {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 30% 20%, rgba(20, 50, 120, 0.10), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(60, 30, 140, 0.06), transparent 50%),
                var(--bg);
            padding: 6px;
            gap: 4px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex-shrink: 0;
            backdrop-filter: blur(16px);
            height: 34px;
        }

        .top-bar .logo {
            font-size: 13px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .top-bar .time {
            font-size: 10px;
            opacity: 0.5;
            font-family: monospace;
        }

        .top-bar .status {
            font-size: 8px;
            opacity: 0.4;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-bar .status .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .content {
            flex: 1;
            display: flex;
            gap: 4px;
            min-height: 0;
            overflow: hidden;
        }

        /* =========================================================
        SIDEBAR - DREI MENÜS
        ========================================================= */
        .sidebar {
            width: 160px;
            flex-shrink: 0;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 4px;
            overflow-y: auto;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar .menu-section {
            font-size: 8px;
            text-transform: uppercase;
            opacity: 0.3;
            padding: 4px 6px 2px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sidebar .menu-section .menu-icon {
            font-size: 12px;
        }

        .sidebar .app-btn {
            padding: 6px 10px;
            border-radius: 5px;
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            text-align: left;
            font-size: 11px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            width: 100%;
            line-height: 1.3;
        }

        .sidebar .app-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .sidebar .app-btn.active {
            background: rgba(255, 200, 80, 0.08);
            border-color: rgba(255, 200, 80, 0.12);
            color: var(--gold);
        }

        .sidebar .app-btn .icon {
            font-size: 15px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar .app-btn .badge {
            margin-left: auto;
            font-size: 8px;
            background: rgba(255, 80, 80, 0.15);
            color: #ff6b6b;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .sidebar .app-btn .menu-logo {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: contain;
            background: rgba(255, 200, 80, 0.1);
            border: 1px solid rgba(255, 200, 80, 0.1);
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            backdrop-filter: blur(16px);
            min-width: 0;
        }

        .app-header {
            padding: 4px 10px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 30px;
        }

        .app-header .actions {
            display: flex;
            gap: 3px;
        }

        .app-header .actions button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, 0.4);
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            transition: all 0.2s;
        }

        .app-header .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }

        .btn-primary {
            padding: 5px 14px;
            border-radius: 5px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0a0e1a;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 11px;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(255, 200, 80, 0.15);
        }

        .btn-secondary {
            padding: 3px 10px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 10px;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-danger {
            padding: 3px 10px;
            border-radius: 4px;
            background: rgba(255, 80, 80, 0.10);
            color: #ff6b6b;
            border: 1px solid rgba(255, 80, 80, 0.12);
            cursor: pointer;
            font-size: 10px;
            transition: background 0.2s;
        }

        .btn-danger:hover {
            background: rgba(255, 80, 80, 0.18);
        }

        input,
        textarea,
        select {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(255, 200, 80, 0.20);
        }

        textarea {
            resize: vertical;
            min-height: 35px;
        }

        .card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 10px 12px;
            margin-bottom: 6px;
            transition: background 0.2s;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .card .card-title {
            font-weight: 600;
            font-size: 13px;
        }

        .card .card-meta {
            font-size: 10px;
            opacity: 0.35;
            margin-top: 1px;
        }

        .card .card-actions {
            margin-top: 5px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .flex-row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            align-items: center;
        }

        .flex-row>* {
            flex: 1;
            min-width: 60px;
        }

        .flex-row .btn-primary,
        .flex-row .btn-secondary,
        .flex-row .btn-danger {
            flex: 0 0 auto;
        }

        /* =========================================================
        COSMIC WORLD - PLANETEN WEIT VON DER SONNE
        ========================================================= */
        .cosmic-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 380px;
            overflow: hidden;
            border-radius: 4px;
            background: radial-gradient(circle at 50% 50%, rgba(10, 20, 50, 0.6), #05080f);
            cursor: default;
            touch-action: none;
        }

        .cosmic-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .cosmic-star {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            animation: starTwinkle var(--speed, 3s) ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.7);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .cosmic-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 110px;
            height: 110px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 50px rgba(255, 220, 70, 0.9), 0 0 100px rgba(255, 165, 40, 0.6), 0 0 200px rgba(255, 100, 20, 0.3);
            animation: sunPulse 3s ease-in-out infinite;
            z-index: 5;
            cursor: pointer;
        }

        .cosmic-sun:hover {
            box-shadow: 0 0 80px rgba(255, 220, 70, 1), 0 0 160px rgba(255, 165, 40, 0.8);
        }

        @keyframes sunPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.98);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.04);
            }
        }

        .cosmic-sun .logo-in-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 65%;
            height: 65%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #0a0e1a;
            text-shadow: 0 0 30px rgba(255, 200, 80, 0.5);
            animation: logoPulse 3s ease-in-out infinite;
            border: 2px solid rgba(255, 200, 80, 0.15);
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            overflow: hidden;
        }

        .cosmic-sun .logo-in-sun img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            display: block;
        }

        .cosmic-sun .logo-in-sun .logo-text {
            font-size: 30px;
            font-weight: 800;
            color: #0a0e1a;
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.06);
            }
        }

        .cosmic-planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .cosmic-planet:hover {
            transform: scale(1.25) !important;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.3) !important;
            z-index: 20;
        }

        .cosmic-planet .planet-label {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            opacity: 0.6;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 8px;
            border-radius: 4px;
            pointer-events: none;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .cosmic-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .living-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
            width: 80px;
            height: 80px;
        }

        .living-logo .logo-aura {
            position: absolute;
            inset: -30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.12), rgba(255, 200, 80, 0.03) 40%, transparent 70%);
            animation: auraPulse 3s ease-in-out infinite;
        }

        @keyframes auraPulse {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.6;
            }
        }

        .living-logo .logo-mouth {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 22%;
            height: 4%;
            border-radius: 50%;
            background: rgba(255, 200, 150, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.08s ease;
        }

        .living-logo.speaking .logo-mouth {
            animation: mouthSpeak 0.25s ease-in-out infinite alternate;
        }

        @keyframes mouthSpeak {
            0% {
                height: 3%;
                transform: translateX(-50%) scaleY(0.6);
            }
            100% {
                height: 10%;
                transform: translateX(-50%) scaleY(1.2);
            }
        }

        .living-logo .logo-eyes {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 9%;
            display: flex;
            justify-content: space-between;
        }

        .living-logo .logo-eyes .eye {
            width: 28%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .living-logo .logo-eyes .eye::after {
            content: '';
            position: absolute;
            width: 35%;
            height: 35%;
            border-radius: 50%;
            background: rgba(255, 220, 100, 0.3);
            top: 30%;
            left: 30%;
            transition: all 0.3s ease;
        }

        .living-logo.listening .logo-eyes .eye::after {
            animation: eyeListen 1.2s ease-in-out infinite;
        }

        @keyframes eyeListen {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
            }
        }

        .living-logo.thinking .logo-eyes .eye::after {
            animation: eyeThink 1.8s ease-in-out infinite;
        }

        @keyframes eyeThink {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(3px, -2px);
            }
        }

        .living-logo.idle .logo-eyes .eye::after {
            animation: eyeIdle 3.5s ease-in-out infinite;
        }

        @keyframes eyeIdle {
            0%,
            100% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(-1px, -1px);
            }
            75% {
                transform: translate(1px, 1px);
            }
        }

        .living-logo .logo-hands {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .living-logo .logo-hands .hand {
            position: absolute;
            width: 10%;
            height: 10%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.10), rgba(255, 200, 100, 0.03) 50%, transparent 70%);
            animation: handMove 4.5s ease-in-out infinite;
        }

        .living-logo .logo-hands .hand-left {
            left: -6%;
            top: 30%;
            animation-delay: 0s;
        }

        .living-logo .logo-hands .hand-right {
            right: -6%;
            top: 30%;
            animation-delay: 2.2s;
        }

        @keyframes handMove {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(0, -3px) scale(1.06);
            }
        }

        .living-logo .logo-glow {
            position: absolute;
            inset: -8%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.05), transparent 60%);
            animation: glowPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.06);
            }
        }

        .cosmic-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .cosmic-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 200, 80, 0.15);
            animation: particleFloat var(--duration, 5s) ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0.1;
            }
            50% {
                transform: translate(var(--dx, 15px), var(--dy, -15px)) scale(1);
                opacity: 0.5;
            }
        }

        /* =========================================================
        CHAT MESSAGES
        ========================================================= */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            margin-bottom: 4px;
            max-height: 250px;
            min-height: 80px;
            font-size: 11px;
        }

        .chat-messages .user {
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            margin-bottom: 3px;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: #aac;
        }

        .chat-messages .ai {
            padding: 5px 10px;
            background: rgba(255, 200, 80, 0.04);
            border-radius: 4px;
            margin-bottom: 3px;
            border: 1px solid rgba(255, 200, 80, 0.04);
            color: #e8edf5;
            font-size: 11px;
            line-height: 1.5;
        }

        /* =========================================================
        WINDOW SYSTEM
        ========================================================= */
        .window-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
        }

        .window-overlay.active {
            pointer-events: all;
        }

        .window-frame {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 360px;
            min-height: 250px;
            pointer-events: all;
            animation: windowIn 0.25s ease-out;
            touch-action: none;
        }

        @keyframes windowIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .window-frame .window-titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            cursor: grab;
            user-select: none;
            min-height: 34px;
            touch-action: none;
        }

        .window-frame .window-titlebar:active {
            cursor: grabbing;
        }

        .window-frame .window-titlebar .title {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.7;
        }

        .window-frame .window-titlebar .controls {
            display: flex;
            gap: 6px;
        }

        .window-frame .window-titlebar .controls button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            transition: color 0.2s;
            touch-action: manipulation;
        }

        .window-frame .window-titlebar .controls button:hover {
            color: #fff;
        }

        .window-frame .window-titlebar .controls .close:hover {
            color: #ff6b6b;
        }

        .window-frame .window-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-size: 11px;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 44px;
                padding: 2px;
            }
            .sidebar .app-btn span:not(.icon) {
                display: none;
            }
            .sidebar .app-btn {
                justify-content: center;
                padding: 5px;
            }
            .sidebar .app-btn .menu-logo {
                width: 18px;
                height: 18px;
            }
            #haldo-os {
                padding: 3px;
                gap: 3px;
            }
            .app-body {
                padding: 5px;
            }
            .top-bar .status {
                display: none;
            }
            .cosmic-sun {
                width: 75px;
                height: 75px;
            }
            .living-logo {
                width: 56px;
                height: 56px;
            }
            .cosmic-planet .planet-label {
                font-size: 6px;
                bottom: -16px;
            }
            .window-frame {
                min-width: 240px;
                min-height: 180px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 36px;
            }
            .sidebar .app-btn .icon {
                font-size: 12px;
                width: 16px;
            }
            .top-bar .logo {
                font-size: 10px;
            }

        // =========================================================
        const Storage = {
            prefix: 'haldo_',
            get(key, def = null) {
                try {
                    const val = localStorage.getItem(this.prefix + key);
                    if (val === null) return def;
                    try { return JSON.parse(val); } catch (e) { return val; }
                } catch (e) { return def; }
            },
            set(key, val) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(val)); return true; } catch (e) { return false; }
            },
            remove(key) {
                try { localStorage.removeItem(this.prefix + key); return true; } catch (e) { return false; }
            },
            getAll() {
                const res = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try { res[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k)); } catch (e) { res[
                                k.replace(this.prefix, '')] = localStorage.getItem(k); }
                    });
                } catch (e) {}
                return res;
            }
        };

        const WindowManager = {
            windows: [],

            create(appId, title, content, icon = '📱') {
                if (this.hasWindow(appId)) {
                    this.close(appId);
                    return;
                }
                const frame = document.createElement('div');
                frame.className = 'window-frame';
                frame.dataset.app = appId;
                const w = Math.min(520, window.innerWidth - 40);
                const h = Math.min(460, window.innerHeight - 80);
                frame.style.left = (Math.random() * (window.innerWidth - w - 40) + 20) + 'px';
                frame.style.top = (Math.random() * (window.innerHeight - h - 60) + 30) + 'px';
                frame.style.width = w + 'px';
                frame.style.height = h + 'px';
                frame.style.zIndex = this.zIndex++;

                frame.innerHTML = `
                    <div class="window-titlebar">
                        <span class="title">${icon} ${title}</span>
                        <div class="controls">
                            <button class="minimize" title="Minimieren">−</button>
                            <button class="close" title="Schließen">✕</button>
                        </div>
                    </div>
                    <div class="window-content">${content}</div>
                `;

                const titlebar = frame.querySelector('.window-titlebar');
                let isDragging = false;
                let startX, startY, startLeft, startTop;

                const startDrag = (e) => {
                    if (e.target.closest('.controls')) return;
                    isDragging = true;
                    const touch = e.touches ? e.touches[0] : e;
                    startX = touch.clientX;
                    startY = touch.clientY;
                    startLeft = parseInt(frame.style.left) || 0;
                    startTop = parseInt(frame.style.top) || 0;
                    frame.style.zIndex = this.zIndex++;
                    document.addEventListener('mousemove', onDrag);
                    document.addEventListener('mouseup', onDragEnd);
                    document.addEventListener('touchmove', onTouchDrag, { passive: false });
                    document.addEventListener('touchend', onTouchEnd, { passive: false });
                };

                const onDrag = (e) => {
                    if (!isDragging) return;
                    frame.style.left = (startLeft + e.clientX - startX) + 'px';
                    frame.style.top = (startTop + e.clientY - startY) + 'px';
                };

                const onTouchDrag = (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    frame.style.left = (startLeft + touch.clientX - startX) + 'px';
                    frame.style.top = (startTop + touch.clientY - startY) + 'px';
                };

                const onDragEnd = () => {
                    isDragging = false;
                    document.removeEventListener('mousemove', onDrag);
                    document.removeEventListener('mouseup', onDragEnd);
                    document.removeEventListener('touchmove', onTouchDrag);
                    document.removeEventListener('touchend', onTouchEnd);
                };

                const onTouchEnd = () => {
                    isDragging = false;
                    document.removeEventListener('mousemove', onDrag);
                    document.removeEventListener('mouseup', onDragEnd);
                    document.removeEventListener('touchmove', onTouchDrag);
                    document.removeEventListener('touchend', onTouchEnd);
                };

                titlebar.addEventListener('mousedown', startDrag);
                titlebar.addEventListener('touchstart', startDrag, { passive: true });

                frame.querySelector('.close').addEventListener('click', () => this.close(appId));
                frame.querySelector('.minimize').addEventListener('click', () => {
                    const content = frame.querySelector('.window-content');
                    const isHidden = content.style.display === 'none';
                    content.style.display = isHidden ? 'block' : 'none';
                    frame.style.height = isHidden ? h + 'px' : '42px';
                });

                frame.addEventListener('mousedown', () => {
                    frame.style.zIndex = this.zIndex++;
                });

                this.overlay.classList.add('active');
                this.overlay.appendChild(frame);
                this.windows.push({ id: appId, frame });

                return frame;
            },

            close(appId) {
                const win = this.windows.find(w => w.id === appId);
                if (win) {
                    win.frame.remove();
                    this.windows = this.windows.filter(w => w.id !== appId);
                    if (this.windows.length === 0) {
                        this.overlay.classList.remove('active');
                    }
                }
            },

            closeAll() {
                this.windows.forEach(w => w.frame.remove());
                this.windows = [];
                this.overlay.classList.remove('active');
            },

            getWindow(appId) {
                const win = this.windows.find(w => w.id === appId);
                return win ? win.frame : null;
            },

            hasWindow(appId) {
                return this.windows.some(w => w.id === appId);

            // =========================================================
            // COSMIC WORLD - PLANETEN WEIT VON DER SONNE
            // =========================================================
            renderCosmic() {
                const planetData = [
                    { name: 'Merkur', size: 22, color: '#b8b8b8', orbit: 14, speed: 4, zIndex: 10 },
                    { name: 'Venus', size: 26, color: '#e8b84a', orbit: 20, speed: 7, zIndex: 11 },
                    { name: 'Erde', size: 30, color: '#4a8fd4', orbit: 26, speed: 10, zIndex: 12 },
                    { name: 'Mars', size: 24, color: '#c84a2a', orbit: 32, speed: 13, zIndex: 13 },
                    { name: 'Jupiter', size: 48, color: '#e8c8a0', orbit: 40, speed: 17, zIndex: 14 },
                    { name: 'Saturn', size: 42, color: '#d4b080', orbit: 48, speed: 21, zIndex: 15 },
                    { name: 'Uranus', size: 34, color: '#7ab8c8', orbit: 56, speed: 26, zIndex: 16 },
                    { name: 'Neptun', size: 34, color: '#3a5ab8', orbit: 64, speed: 31, zIndex: 17 },
                    { name: 'Pluto', size: 18, color: '#b8a898', orbit: 72, speed: 36, zIndex: 18 },
                    { name: 'HalDo', size: 26, color: '#ffd54b', orbit: 80, speed: 42, zIndex: 19 },
                    { name: 'Nova', size: 22, color: '#ff6b6b', orbit: 88, speed: 48, zIndex: 20 },
                    { name: 'Astra', size: 22, color: '#8a5ac8', orbit: 96, speed: 54, zIndex: 21 }
                ];

                const orbits = planetData.map((p, i) =>
                    `<div class="cosmic-orbit" style="width:${p.orbit}%;height:${p.orbit}%;"></div>`
                ).join('');

                const planets = planetData.map((p, i) => {
                    const delay = (i / planetData.length) * 360;
                    const duration = 15 + i * 2;
                    const direction = i % 2 === 0 ? 'normal' : 'reverse';
                    const size = Math.min(p.size, window.innerWidth < 700 ? p.size * 0.6 : p.size);
                    return `<div class="cosmic-planet" style="width:${size}px;height:${size}px;background:radial-gradient(circle at 35% 30%, #fff, ${p.color});box-shadow:0 0 ${size}px rgba(255,255,255,0.15);animation:orbit${i} ${duration}s linear infinite ${direction};animation-delay:${delay}s;z-index:${p.zIndex};">
                        <span class="planet-label">${p.name}</span>
                    </div>`;
                }).join('');

                const keyframes = planetData.map((p, i) => {
                    const radius = p.orbit / 100;
                    return `@keyframes orbit${i} {
                        from { transform: rotate(0deg) translateX(${radius * 50}%) rotate(0deg); }
                        to { transform: rotate(360deg) translateX(${radius * 50}%) rotate(-360deg); }
                    }`;
                }).join('\n');

                return `
                    <div class="cosmic-container" id="cosmic-container">
                        <div class="cosmic-stars" id="cosmic-stars"></div>
                        <div class="cosmic-particles" id="cosmic-particles"></div>

                        ${orbits}
                        ${planets}

                        <div class="cosmic-sun" id="cosmic-sun-click" onclick="AppRouter.switchTo('ai')">
                            <div class="logo-in-sun">
                                <!-- HIER DEIN LOGO-BILD EINFÜGEN -->
                                <span class="logo-text">✦</span>
                                <!-- <img src="logo.png" alt="HalDo Logo"> -->
                            </div>
                        </div>

                        <div class="living-logo idle" id="living-logo">
                            <div class="logo-glow"></div>
                            <div class="logo-aura"></div>
                            <div class="logo-eyes">
                                <span class="eye"></span>
                                <span class="eye"></span>
                            </div>
                            <div class="logo-mouth"></div>
                            <div class="logo-hands">
                                <span class="hand hand-left"></span>
                                <span class="hand hand-right"></span>
                            </div>
                        </div>

                return `

                            <div class="ai">Hallo! Ich bin HalDo AI, dein Wissensbuch mit über ${Object.keys(KnowledgeBook).length} Themen. Ich kann Briefe schreiben, Bewerbungen erstellen, Notizen mit Kalender verbinden und Apps für dich öffnen. Was möchtest du wissen?</div>

                            <textarea id="ai-input" rows="1" placeholder="Frage an HalDo AI..." style="flex:1;min-height:32px;font-size:11px;"></textarea>
                            <button onclick="AppRouter.sendAIMessage()" class="btn-primary" style="font-size:11px;">Senden</button>
                            <button onclick="AppRouter.voiceInput()" class="btn-secondary" style="font-size:11px;">🎙️</button>
                        </div>
                        <div id="ai-thinking" style="display:none;font-size:9px;opacity:0.5;margin-top:3px;">🤔 denkt...</div>
                    </div>
                `;
            },

            sendAIMessage() {
                const input = document.getElementById('ai-input');
                const messages = document.getElementById('ai-chat-messages');
                const thinking = document.getElementById('ai-thinking');
                if (!input || !messages) return;
                const text = input.value.trim();
                if (!text) return;

                // Handgesten simulieren
                this.setLogoState('thinking');

                const crossResult = HalDoAI.crossAppAction(text);
                if (crossResult) {
                    const userDiv = document.createElement('div');
                    userDiv.className = 'user';
                    userDiv.textContent = '👤 ' + text;
                    messages.appendChild(userDiv);
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'ai';
                    aiDiv.textContent = crossResult;
                    messages.appendChild(aiDiv);
                    messages.scrollTop = messages.scrollHeight;
                    this.setLogoState('speaking');
                    speak(crossResult);
                    setTimeout(() => this.setLogoState('idle'), 1000);
                    return;
                }

                const userDiv = document.createElement('div');
                userDiv.className = 'user';
                userDiv.textContent = '👤 ' + text;
                messages.appendChild(userDiv);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
                thinking.style.display = 'block';
                this.setLogoState('thinking');

                setTimeout(() => {
                    thinking.style.display = 'none';
                    const response = HalDoAI.ask(text);
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'ai';
                    aiDiv.textContent = response;
                    messages.appendChild(aiDiv);
                    messages.scrollTop = messages.scrollHeight;
                    this.setLogoState('speaking');
                    speak(response);
                    setTimeout(() => this.setLogoState('idle'), 800);
                }, 400);
            },

            voiceInput() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) { alert('Spracherkennung nicht unterstützt.'); return; }
                const rec = new Recognition();
                rec.lang = 'de-DE';
                rec.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const input = document.getElementById('ai-input');
                    if (input) input.value = text;
                    this.sendAIMessage();
                };
                rec.start();
                this.setLogoState('listening');
                speak('Ich höre zu.');
                setTimeout(() => this.setLogoState('idle'), 5000);
            },

                            ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(b =>
                                `<button onclick="AppRouter.calcPress('${b}')" style="padding:10px;border-radius:4px;background:${['C','±','%','÷','×','−','+','='].includes(b)?'rgba(255,200,80,0.10)':'rgba(255,255,255,0.02)'};color:#fff;border:1px solid rgba(255,255,255,0.03);cursor:pointer;font-size:14px;">${b}</button>`

            calcPress(val) {
                const display = document.getElementById('calc-display');
                if (!display) return;
                if (!this._calcExpr) this._calcExpr = '';
                if (val === 'C') { this._calcExpr = '';
                    display.textContent = '0'; return; }
                if (val === '⌫') { this._calcExpr = this._calcExpr.slice(0, -1);
                    display.textContent = this._calcExpr || '0'; return; }
                if (val === '=') {
                    try {
                        const result = Function('"use strict"; return (' + this._calcExpr.replace('×', '*').replace('÷', '/')
                            .replace('−', '-') + ')')();
                        display.textContent = result;
                        this._calcExpr = String(result);
                    } catch (e) { display.textContent = 'Fehler';
                        this._calcExpr = ''; }
                    return;
                }
                this._calcExpr += val;
                display.textContent = this._calcExpr;
            },

                            <button onclick="AppRouter.timerStop()" class="btn-secondary" style="font-size:10px;">⏹</button>

            timerStart() {
                const input = document.getElementById('timer-input');
                const display = document.getElementById('timer-display');
                if (!display) return;
                if (this._timerInterval) return;
                let seconds = parseInt(input?.value) || 30;
                if (seconds < 1) seconds = 1;
                if (seconds > 3600) seconds = 3600;
                this._timerSeconds = seconds;
                this._timerInterval = setInterval(() => {
                    if (this._timerSeconds <= 0) {
                        clearInterval(this._timerInterval);
                        this._timerInterval = null;
                        speak('Timer abgelaufen!');
                        display.textContent = '00:00';
                        return;
                    }
                    this._timerSeconds--;
                    const mins = Math.floor(this._timerSeconds / 60);
                    const secs = this._timerSeconds % 60;
                    display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                }, 1000);
            },

            timerStop() {
                if (this._timerInterval) { clearInterval(this._timerInterval);
                    this._timerInterval = null; }
            },

            timerReset() {
                this.timerStop();
                const display = document.getElementById('timer-display');
                if (display) display.textContent = '00:30';
            },

            translateText() {
                const text = document.getElementById('trans-text');
                const result = document.getElementById('trans-result');
                if (!text || !result) return;
                const input = text.value.trim();
                if (!input) { result.textContent = '⚠️ Bitte Text eingeben.'; return; }
                const to = document.getElementById('trans-to')?.value || 'en';
                const dict = {
                    'en': { 'Hallo': 'Hello', 'Danke': 'Thank you', 'Guten Tag': 'Good day' },
                    'de': { 'Hello': 'Hallo', 'Thank you': 'Danke', 'Good day': 'Guten Tag' },
                    'ku': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' },
                    'esq': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' }
                };
                const d = dict[to] || {};
                let translated = input;
                for (const [key, val] of Object.entries(d)) {
                    if (input.toLowerCase().includes(key.toLowerCase())) {
                        translated = translated.replace(new RegExp(key, 'gi'), val);
                    }
                }
                result.textContent = `🌍 ${translated}`;
            },

            runTerminalCommand() {
                const input = document.getElementById('terminal-input');
                const output = document.getElementById('terminal-output');
                if (!input || !output) return;
                const cmd = input.value.trim().toLowerCase();
                if (!cmd) return;
                let result = '';
                switch (cmd) {
                    case 'status':
                        result = `✅ Version ${HALDO_VERSION} · ${APP_LIST.length} Apps`;
                        break;
                    case 'apps':
                        result = `📱 ${APP_LIST.length} Apps`;
                        break;
                    case 'backup':
                        result = '💾 Backup wird erstellt...';
                        setTimeout(() => this.createBackup(), 300);
                        break;
                    case 'update':
                        result = '🔄 Updates werden geprüft...';
                        setTimeout(() => this.checkUpdates(), 300);
                        break;
                    case 'help':
                        result = 'Befehle: status, apps, backup, update, help, clear';
                        break;
                    case 'clear':
                        output.innerHTML = '';
                        input.value = '';
                        return;
                    default:
                        result = `❌ Unbekannt: "${cmd}". Geben Sie "help" ein.`;
                }
                output.innerHTML += `<div style="color:#4caf50;">$ ${cmd}</div><div style="padding-bottom:3px;">${result}</div>`;
                input.value = '';
                output.scrollTop = output.scrollHeight;
            },

                // Handgesten: Hände bewegen sich je nach Zustand
                if (state === 'speaking') {

            // =========================================================
            initApp(appId) {
                if (appId === 'warnings') WarningSystem.render();

                if (appId === 'calendar') CalendarSystem.render();
                if (appId === 'contacts') ContactSystem.render();
                if (appId === 'files') FileSystem.render();
                if (appId === 'tasks') TaskSystem.render();
                if (appId === 'backup') this.renderBackup();
                if (appId === 'updates') this.checkUpdates();
                if (appId === 'cosmic') {
                    this.setLogoState('idle');
                    this.initCosmicStars();
                    this.initPlanetClock();
                    // Handgesten CSS
                    const style = document.createElement('style');
                    style.textContent = `
                        @keyframes handSpeak {
                            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
                            50% { transform: translate(0, -5px) scale(1.1) rotate(5deg); }

                const container = document.getElementById('cosmic-stars');
                if (!container) return;
                container.innerHTML = '';
                for (let i = 0; i < 365; i++) {
                    const star = document.createElement('span');
                    star.className = 'cosmic-star';
                    const size = Math.random() * 2.5 + 0.5;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.setProperty('--speed', (2 + Math.random() * 5) + 's');
                    star.style.animationDelay = (Math.random() * 5) + 's';
                    container.appendChild(star);
                }
            },

            initPlanetClock() {
                const el = document.getElementById('planet-clock');
                if (!el) return;
                setInterval(() => {
                    const now = new Date();
                    const h = now.getHours();
                    const m = now.getMinutes();
                    const s = now.getSeconds();
                    el.textContent =
                        `🪐 Merkur: ${h}h · Venus: ${m}m · Erde: ${s}s`;
                }, 1000);

            load() { this.warnings = Storage.get('warnings', []); return this; },
            save() { Storage.set('warnings', this.warnings); return this; },
            add(type, title, description, location = 'Unbekannt') {
                const types = { blitzer: { icon: '📸', label: 'Blitzer' }, baustelle: { icon: '🚧', label: 'Baustelle' },
                    sperrung: { icon: '🚫', label: 'Sperrung' }, gefahr: { icon: '⚠️', label: 'Gefahr' } };
                const t = types[type] || types['gefahr'];
                const warning = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), type, icon: t.icon,
                    label: t.label, title, description, location, timestamp: new Date().toISOString(),
                active: true };
                this.warnings.unshift(warning);
                this.save();
                this.playTone(type);
                speak(`Achtung! ${title} in ${location}. ${description}`);
                AppRouter.renderWarnings();
                return warning;
            },
            playTone(type) {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    const tone = this.tones[type] || this.tones['gefahr'];
                    osc.frequency.value = tone.freq;
                    osc.type = 'square';
                    gain.gain.value = 0.06;
                    osc.start();
                    if (tone.pattern === 'short') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 100); } else if (tone.pattern === 'long') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 300); } else if (tone.pattern === 'double') { setTimeout(() => { osc.stop(); },
                            100);
                        setTimeout(() => {
                            const ctx2 = new(window.AudioContext || window.webkitAudioContext)();
                            const o2 = ctx2.createOscillator();
                            const g2 = ctx2.createGain();
                            o2.connect(g2);
                            g2.connect(ctx2.destination);
                            o2.frequency.value = tone.freq;
                            o2.type = 'square';
                            g2.gain.value = 0.06;
                            o2.start();
                            setTimeout(() => { o2.stop();
                                ctx2.close(); }, 100);
                        }, 180);
                    } else if (tone.pattern === 'triple') {
                        for (let i = 0; i < 3; i++) {
                            setTimeout(() => {
                                const ctx3 = new(window.AudioContext || window.webkitAudioContext)();
                                const o3 = ctx3.createOscillator();
                                const g3 = ctx3.createGain();
                                o3.connect(g3);
                                g3.connect(ctx3.destination);
                                o3.frequency.value = tone.freq + i * 150;
                                o3.type = 'square';
                                g3.gain.value = 0.05;
                                o3.start();
                                setTimeout(() => { o3.stop();
                                    ctx3.close(); }, 80);
                            }, i * 150);
                        }
                    }
                } catch (e) {}
            },
            dismiss(id) { const w = this.warnings.find(w => w.id === id); if (w) w.active = false;
                this.save();
                AppRouter.renderWarnings(); },
            clearAll() { this.warnings.forEach(w => w.active = false);
                this.save();
                AppRouter.renderWarnings(); },
            getActive() { return this.warnings.filter(w => w.active); },
            render() {
                const container = document.getElementById('warnings-container');
                if (!container) return;
                const active = this.getActive();
                if (active.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:10px;">✅ Keine aktiven Warnungen</div>`;
                    return; }
                container.innerHTML = active.map(w =>
                    `<div style="padding:5px 10px;border-radius:4px;margin-bottom:4px;display:flex;align-items:center;gap:6px;border-left:3px solid ${w.type === 'blitzer' ? '#ffd93d' : w.type === 'baustelle' ? '#ffa94d' : w.type === 'sperrung' ? '#ff6b6b' : '#ff0000'};background:rgba(255,80,80,0.04);font-size:10px;">
                        <span style="font-size:16px;">${w.icon}</span>
                        <div style="flex:1;"><strong>${w.title}</strong> ${w.description} · 📍 ${w.location}</div>
                        <span style="opacity:0.3;font-size:9px;">${new Date(w.timestamp).toLocaleTimeString()}</span>
                        <button onclick="WarningSystem.dismiss('${w.id}')" style="background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:12px;">✕</button>
                    </div>`
                ).join('');
            }
        };
        WarningSystem.load();

        // =========================================================
        // NOTIZEN SYSTEM
        // =========================================================
        const NoteSystem = {
            notes: [],
            load() { this.notes = Storage.get('notes', []); return this; },
            save() { Storage.set('notes', this.notes); return this; },
            create() {
                const title = document.getElementById('note-title');
                const content = document.getElementById('note-content');
                if (!title || !content) return;
                const note = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Ohne Titel', content: content.value || '', createdAt: new Date().toISOString() };
                this.notes.unshift(note);
                this.save();
                title.value = '';
                content.value = '';
                AppRouter.renderNotes();
                speak('Notiz gespeichert.');
            },
            delete(id) { this.notes = this.notes.filter(n => n.id !== id);
                this.save();
                AppRouter.renderNotes(); },
            render() {
                const container = document.getElementById('notes-container');
                if (!container) return;
                if (this.notes.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:10px;">📝 Keine Notizen</div>`;
                    return; }
                container.innerHTML = this.notes.map(n =>
                    `<div class="card" style="padding:5px 8px;">
                        <div class="card-title">${n.title}</div>
                        <div class="card-meta">${new Date(n.createdAt).toLocaleDateString()}</div>
                        <div style="font-size:9px;opacity:0.6;max-height:30px;overflow:hidden;">${n.content || '(leer)'}</div>
                        <div class="card-actions">
                            <button onclick="NoteSystem.delete('${n.id}')" class="btn-danger" style="font-size:9px;">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        NoteSystem.load();

        // =========================================================
        // KALENDER SYSTEM
        // =========================================================
        const CalendarSystem = {
            events: [],
            load() { this.events = Storage.get('events', []); return this; },
            save() { Storage.set('events', this.events); return this; },
            add() {
                const title = document.getElementById('event-title');
                const date = document.getElementById('event-date');
                const desc = document.getElementById('event-desc');
                if (!title || !date) return;
                const event = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Termin', date: date.value || new Date().toISOString().split('T')[0], description: desc?.value ||
                        '', createdAt: new Date().toISOString() };
                this.events.push(event);
                this.save();
                title.value = '';
                if (desc) desc.value = '';
                AppRouter.renderCalendar();
                speak('Termin hinzugefügt.');
            },
            delete(id) { this.events = this.events.filter(e => e.id !== id);
                this.save();
                AppRouter.renderCalendar(); },
            render() {
                const container = document.getElementById('calendar-container');
                if (!container) return;
                const sorted = [...this.events].sort((a, b) => a.date.localeCompare(b.date));
                if (sorted.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:10px;">📅 Keine Termine</div>`;
                    return; }
                container.innerHTML = sorted.map(e =>
                    `<div class="card" style="padding:5px 8px;">
                        <div class="card-title">${e.title}</div>
                        <div class="card-meta">📅 ${new Date(e.date + 'T00:00:00').toLocaleDateString('de-DE')}</div>
                        ${e.description ? `<div style="font-size:9px;opacity:0.5;">${e.description}</div>` : ''}
                        <div class="card-actions">
                            <button onclick="CalendarSystem.delete('${e.id}')" class="btn-danger" style="font-size:9px;">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        CalendarSystem.load();

        // =========================================================
        // KONTAKTE SYSTEM
        // =========================================================
        const ContactSystem = {
            contacts: [],
            load() { this.contacts = Storage.get('contacts', []); return this; },
            save() { Storage.set('contacts', this.contacts); return this; },
            add() {
                const name = document.getElementById('contact-name');
                const phone = document.getElementById('contact-phone');
                const email = document.getElementById('contact-email');
                if (!name || !phone) return;
                const contact = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: name.value ||
                        'Unbekannt', phone: phone.value || '', email: email?.value || '', createdAt: new Date()
                        .toISOString() };
                this.contacts.push(contact);
                this.save();
                name.value = '';
                phone.value = '';
                if (email) email.value = '';
                AppRouter.renderContacts();
                speak('Kontakt hinzugefügt.');
            },
            delete(id) { this.contacts = this.contacts.filter(c => c.id !== id);
                this.save();
                AppRouter.renderContacts(); },
            render() {
                const container = document.getElementById('contacts-container');
                if (!container) return;
                if (this.contacts.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:10px;">👤 Keine Kontakte</div>`;
                    return; }
                container.innerHTML = this.contacts.map(c =>
                    `<div class="card" style="padding:5px 8px;">
                        <div class="card-title">${c.name}</div>
                        <div class="card-meta">📞 ${c.phone} ${c.email ? '· ✉️ ' + c.email : ''}</div>
                        <div class="card-actions">
                            <button onclick="ContactSystem.delete('${c.id}')" class="btn-danger" style="font-size:9px;">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        ContactSystem.load();

        // =========================================================
        // FILES SYSTEM
        // =========================================================
        const FileSystem = {
            files: [],
            load() { this.files = Storage.get('files', []); return this; },
            save() { Storage.set('files', this.files); return this; },
            create() {
                const name = document.getElementById('file-name');
                const content = document.getElementById('file-content');
                if (!name) return;
                const file = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: name.value ||
                        'Unbenannt', content: content?.value || '', size: Math.floor((content?.value?.length || 0) /
                        1024 * 10) / 10 + ' KB', createdAt: new Date().toISOString() };
                this.files.unshift(file);
                this.save();
                name.value = '';
                if (content) content.value = '';
                AppRouter.renderFiles();
                speak('Datei erstellt.');
            },
            delete(id) { this.files = this.files.filter(f => f.id !== id);
                this.save();
                AppRouter.renderFiles(); },
            render() {
                const container = document.getElementById('files-container');
                if (!container) return;
                if (this.files.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:10px;">📁 Keine Dateien</div>`;
                    return; }
                container.innerHTML = this.files.map(f =>
                    `<div class="card" style="padding:5px 8px;">
                        <div class="card-title">${f.name}</div>
                        <div class="card-meta">${f.size} · ${new Date(f.createdAt).toLocaleDateString()}</div>
                        <div style="font-size:9px;opacity:0.5;max-height:30px;overflow:hidden;">${f.content || '(leer)'}</div>
                        <div class="card-actions">
                            <button onclick="FileSystem.delete('${f.id}')" class="btn-danger" style="font-size:9px;">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        FileSystem.load();

        // =========================================================
        // TASKS SYSTEM
        // =========================================================
        const TaskSystem = {
            tasks: [],
            load() { this.tasks = Storage.get('tasks', []); return this; },
            save() { Storage.set('tasks', this.tasks); return this; },
            add() {
                const title = document.getElementById('task-title');
                const date = document.getElementById('task-date');
                if (!title) return;
                const task = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Aufgabe', date: date?.value || new Date().toISOString().split('T')[0], done: false,
                    createdAt: new Date().toISOString() };
                this.tasks.push(task);
                this.save();
                title.value = '';
                AppRouter.renderTasks();
                speak('Aufgabe hinzugefügt.');
            },
            toggle(id) { const task = this.tasks.find(t => t.id === id); if (task) { task.done = !task.done;
                    this.save();
                    AppRouter.renderTasks(); } },
            delete(id) { this.tasks = this.tasks.filter(t => t.id !== id);
                this.save();
                AppRouter.renderTasks(); },
            render() {
                const container = document.getElementById('tasks-container');
                if (!container) return;
                if (this.tasks.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:10px;">✅ Keine Aufgaben</div>`;
                    return; }
                container.innerHTML = this.tasks.map(t =>
                    `<div class="card" style="padding:5px 8px;${t.done ? 'opacity:0.5;' : ''}">
                        <div class="card-title">${t.done ? '✅' : '⬜'} ${t.title}</div>
                        <div class="card-meta">📅 ${new Date(t.date + 'T00:00:00').toLocaleDateString('de-DE')}</div>
                        <div class="card-actions">
                            <button onclick="TaskSystem.toggle('${t.id}')" class="btn-secondary" style="font-size:9px;">${t.done ? '↩️' : '✅'}</button>
                            <button onclick="TaskSystem.delete('${t.id}')" class="btn-danger" style="font-size:9px;">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        TaskSystem.load();

        // =========================================================
        // BOOT
        // =========================================================
        window._startTime = Date.now();

        function boot() {
            console.log(`🌌 HalDo AI OS ${HALDO_VERSION} ${HALDO_BUILD}`);
            console.log(`📱 ${APP_LIST.length} Apps`);
            console.log(`📖 Wissensbuch: ${Object.keys(KnowledgeBook).length} Themen`);

            AppRouter.init();

            setTimeout(() => {
                WarningSystem.add('baustelle', 'Baustelle A1', 'Fahrbahnverengung, 60 km/h', 'A1, km 45');
            }, 2000);
            setTimeout(() => {
                WarningSystem.add('blitzer', 'Blitzer A100', '80 km/h erlaubt', 'A100, Höhe Köln');
            }, 5000);

            setTimeout(() => {
                setStatus('Bereit');
                speak('HalDo AI OS 23.1.6. Das ultimative Wissensbuch mit über 200 Themen ist bereit. 100+ Apps verfügbar.');
            }, 1200);

            console.log('✅ System bereit');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>

</body>
