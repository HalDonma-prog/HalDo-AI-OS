            // ===== KONTAKTE =====
            getContactsUI() {
                const contacts = Storage.get('contacts', [{ name: 'HalDo AI', phone: '💙 Immer da' }]);
                return `
                    <div>
                        ${contacts.map(c=>`<div style="display:flex;justify-content:space-between;padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;margin:2px 0;"><span>${c.name}</span><span>${c.phone}</span></div>`).join('')}
                    </div>
                    <button class="haldo-btn" onclick="alert('Neuer Kontakt, Bruder!')">+ Hinzufügen</button>
                `;
            },

            // ===== E-MAIL =====
            getEmailUI() {
                const emails = Storage.get('emails', [{ from: 'haldo@local.com', subject: 'Willkommen, Bruder!',
                    body: 'Dein HalDo AI OS ist bereit! 💙' }]);
                return `
                    <div>
                        ${emails.map(e=>`<div style="padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;margin:2px 0;cursor:pointer;" onclick="alert('Von: ${e.from}\nBetreff: ${e.subject}\n\n${e.body}')"><strong>${e.from}</strong> ${e.subject}</div>`).join('')}
                    </div>
                `;
            },

            // ===== BROWSER =====
            getBrowserUI() {
                return `
                    <div style="display:flex;flex-direction:column;height:100%;">
                        <div style="display:flex;gap:4px;padding:4px 0;">
                            <input id="browser-url" class="haldo-input" placeholder="URL..." style="flex:1;" value="https://example.com">
                            <button class="haldo-btn" onclick="AppManager.browse()">Go</button>
                        </div>
                        <iframe id="browser-frame" src="about:blank" style="flex:1;border:none;background:white;width:100%;"></iframe>
                    </div>
                `;
            },
            browse() {
                const input = document.getElementById('browser-url');
                const frame = document.getElementById('browser-frame');
                if (!input || !frame) return;
                let url = input.value.trim();
                if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                try { frame.src = url; } catch { alert('Ungültige URL, Bruder!'); }
            },

            // ===== ERINNERUNGEN =====
            getRemindersUI() {
                const reminders = Storage.get('reminders', []);
                return `
                    <div>
                        <div style="display:flex;gap:4px;margin-bottom:6px;">
                            <input id="reminder-input" class="haldo-input" placeholder="Neue Erinnerung, Bruder..." style="flex:1;">
                            <button onclick="AppManager.addReminder()" class="haldo-btn">+</button>
                        </div>
                        <div>
                            ${reminders.length?reminders.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;margin:2px 0;"><span>${r}</span><button onclick="AppManager.deleteReminder(${i})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;">✕</button></div>`).join(''):'<p style="color:var(--text-muted);text-align:center;">Keine Erinnerungen, Bruder.</p>'}
                        </div>
                    </div>
                `;
            },
            addReminder() {
                const input = document.getElementById('reminder-input');
                if (!input || !input.value.trim()) return;
                const rem = Storage.get('reminders', []);
                rem.push(input.value.trim());
                Storage.set('reminders', rem);
                input.value = '';
                const body = document.querySelector('.window .window-body');
                if (body) body.innerHTML = this.getRemindersUI();
            },
            deleteReminder(i) {
                const rem = Storage.get('reminders', []);
                rem.splice(i, 1);
                Storage.set('reminders', rem);
                const body = document.querySelector('.window .window-body');
                if (body) body.innerHTML = this.getRemindersUI();
            },

            // ===== JOURNAL =====
            getJournalUI() {
                const entries = Storage.get('journal', []);
                return `
                    <div>
                        <div style="display:flex;gap:4px;margin-bottom:6px;">
                            <input id="journal-input" class="haldo-input" placeholder="Heutiger Eintrag, Bruder..." style="flex:1;">
                            <button onclick="AppManager.addJournal()" class="haldo-btn">+</button>
                        </div>
                        <div>
                            ${entries.length?entries.slice().reverse().map((e,i)=>`<div style="padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;margin:2px 0;"><span style="color:var(--text-muted);font-size:9px;">${new Date(e.date).toLocaleDateString()}</span><br>${e.text}</div>`).join(''):'<p style="color:var(--text-muted);text-align:center;">Keine Einträge, Bruder.</p>'}
                        </div>
                    </div>
                `;
            },
            addJournal() {
                const input = document.getElementById('journal-input');
                if (!input || !input.value.trim()) return;
                const entries = Storage.get('journal', []);
                entries.push({ text: input.value.trim(), date: Date.now() });
                Storage.set('journal', entries);
                input.value = '';
                const body = document.querySelector('.window .window-body');
                if (body) body.innerHTML = this.getJournalUI();
            },

            // ===== TERMINAL =====
            getTerminalUI() {
                return `
                    <div style="display:flex;flex-direction:column;height:100%;">
                        <div id="terminal-output" style="flex:1;background:rgba(0,0,0,0.3);border-radius:4px;padding:6px;font-family:monospace;font-size:11px;color:#00ff88;overflow-y:auto;white-space:pre-wrap;">
                            > HalDo OS Terminal v${Kernel.version}
                            > 🔒 ${AICore.useLocal ? 'Lokale KI aktiv' : 'Groq API aktiv'}
                            > Bereit für Befehle, Bruder!
                        </div>
                        <div style="display:flex;gap:4px;margin-top:4px;">
                            <span style="color:var(--text-secondary);">$</span>
                            <input id="terminal-input" class="haldo-input" placeholder="Befehl..." style="flex:1;" onkeydown="if(event.key==='Enter')AppManager.runCommand()">
                            <button onclick="AppManager.runCommand()" class="haldo-btn">⏎</button>
                        </div>
                    </div>
                `;
            },
            runCommand() {
                const input = document.getElementById('terminal-input');
                const output = document.getElementById('terminal-output');
                if (!input || !output) return;
                const cmd = input.value.trim();
                if (!cmd) return;
                output.textContent += `\n$ ${cmd}`;
                input.value = '';
                const parts = cmd.split(' ');
                const command = parts[0].toLowerCase();
                switch (command) {
                    case 'help':
                        output.textContent += '\n> help, version, apps, clear, echo, date, uptime, ai <frage>';
                        break;
                    case 'version':
                        output.textContent += `\n> HalDo AI OS ${Kernel.version}`;
                        break;
                    case 'apps':
                        output.textContent += `\n> Apps: ${this.apps.length} installiert, Bruder!`;
                        break;
                    case 'clear':
                        output.textContent = '> Terminal gelöscht, Bruder!';
                        break;
                    case 'echo':
                        output.textContent += `\n> ${parts.slice(1).join(' ')}`;
                        break;
                    case 'date':
                        output.textContent += `\n> ${new Date().toLocaleString()}`;
                        break;
                    case 'uptime':
                        output.textContent += `\n> ${Kernel.getUptime()}s`;
                        break;
                    case 'ai':
                        const question = parts.slice(1).join(' ');
                        if (!question) { output.textContent += '\n> Bitte Frage: ai <frage>'; break; }
                        output.textContent += '\n> 🤖 Frage wird gesendet...';
                        AICore.simpleChat(question).then(reply => {
                            output.textContent += `\n> 💙 ${reply}`;
                            output.scrollTop = output.scrollHeight;
                        });
                        break;
                    default:
                        output.textContent += `\n> Unbekannt, Bruder: ${cmd}`;
                }
                output.scrollTop = output.scrollHeight;
            },

            // ===== THEMES =====
            getThemesUI() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                return `
                    <div style="display:flex;flex-wrap:wrap;gap:4px;">
                        ${['dark','light','cosmic','aurora','midnight'].map(t=>`
                            <div onclick="document.documentElement.setAttribute('data-theme','${t}');const icons={dark:'🌙',light:'☀️',cosmic:'🌌',aurora:'🌠',midnight:'🌃'};document.getElementById('menu-theme').textContent=icons['${t}'];Storage.set('theme','${t}');" style="padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;cursor:pointer;border:2px solid ${current===t?'var(--primary)':'transparent'};">
                                ${t==='dark'?'🌙':t==='light'?'☀️':t==='cosmic'?'🌌':t==='aurora'?'🌠':'🌃'} ${t.charAt(0).toUpperCase()+t.slice(1)}
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            // ===== APP CENTER =====
            getAppCenterUI() {
                const categories = [...new Set(this.apps.map(a => a.category))];
                return `
                    <div>
                        <h2>📱 App Center</h2>
                        <p style="color:var(--text-secondary);">${this.apps.length} Apps verfügbar – alle lokal, Bruder!</p>
                        ${categories.map(cat => `
                            <h3 style="font-size:12px;color:var(--text-secondary);margin:6px 0 2px;">${cat.toUpperCase()}</h3>
                            <div style="display:flex;flex-wrap:wrap;gap:4px;">
                                ${this.apps.filter(a=>a.category===cat).map(app => `
                                    <div onclick="AppManager.openApp('${app.id}')" style="padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;border:1px solid var(--glass-border);cursor:pointer;font-size:10px;">
                                        ${app.icon} ${app.name}
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            // ===== AI CHAT =====
            openAIChat(app) {
                const content = `
                    <div style="display:flex;flex-direction:column;height:100%;padding:0;">
                        <div id="ai-chat-messages" style="flex:1;overflow-y:auto;padding:8px;">
                            <div style="text-align:center;color:var(--text-muted);padding:12px;">
                                💙 Hallo Bruder! Ich bin <strong style="color:var(--text-primary);">HalDo</strong>.<br>
                                🔒 ${AICore.useLocal ? 'Lokale KI aktiv' : 'Groq API aktiv'}<br>
                                Frag mich alles – ich habe ein riesiges Wissen für dich!
                            </div>
                        </div>
                        <div style="display:flex;gap:4px;padding:4px 8px;border-top:1px solid var(--glass-border);">
                            <input id="ai-chat-input" class="haldo-input" placeholder="Nachricht, Bruder..." style="flex:1;" onkeydown="if(event.key==='Enter')AppManager.sendAIMessage()">
                            <button onclick="AppManager.sendAIMessage()" class="haldo-btn">📤</button>
                            <button onclick="AppManager.voiceInput()" class="haldo-btn haldo-btn-secondary">🎤</button>
                        </div>
                    </div>
                `;
                const win = this.createWindow(app.name, app.icon, content, 420, 380);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            sendAIMessage() {
                const input = document.getElementById('ai-chat-input');
                const messagesDiv = document.getElementById('ai-chat-messages');
                if (!input || !messagesDiv || !input.value.trim()) return;
                const text = input.value.trim();
                input.value = '';
                const userMsg = document.createElement('div');
                userMsg.style.cssText =
                    'text-align:right;margin:3px 0;padding:5px 10px;background:var(--primary);border-radius:6px;color:#fff;max-width:85%;margin-left:auto;font-size:11px;';
                userMsg.textContent = '🧑 ' + text;
                messagesDiv.appendChild(userMsg);
                const loading = document.createElement('div');
                loading.style.cssText =
                    'text-align:left;margin:3px 0;padding:5px 10px;background:rgba(255,255,255,0.03);border-radius:6px;color:var(--text-secondary);max-width:85%;font-size:11px;';
                loading.textContent = '💭 HalDo denkt, Bruder...';
                messagesDiv.appendChild(loading);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                AICore.simpleChat(text).then(reply => {
                    loading.remove();
                    const aiMsg = document.createElement('div');
                    aiMsg.style.cssText =
                        'text-align:left;margin:3px 0;padding:5px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:6px;color:var(--text-primary);max-width:85%;font-size:11px;';
                    aiMsg.textContent = '💙 ' + reply;
                    messagesDiv.appendChild(aiMsg);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    if ('speechSynthesis' in window) {
                        const utter = new SpeechSynthesisUtterance(reply);
                        utter.lang = 'de-DE';
                        window.speechSynthesis.speak(utter);
                    }
                });
            },

            voiceInput() {
                if (!('webkitSpeechRecognition' in window)) { alert('🎤 Speech Recognition nicht unterstützt, Bruder.'); return; }
                const rec = new webkitSpeechRecognition();
                rec.lang = 'de-DE';
                rec.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const input = document.getElementById('ai-chat-input');
                    if (input) { input.value = text;
                        this.sendAIMessage(); }
                };
                rec.start();
            },

            // ===== EINSTELLUNGEN – MIT API-KEY-EINGABE =====
            openSettings(app) {
                const apiKey = Storage.get('groq_api_key', '');
                const content = `
                    <div style="height:100%;padding:8px;overflow-y:auto;">
                        <h2>⚙️ Einstellungen</h2>

                        <div style="margin-top:12px;">
                            <h3 style="font-size:12px;color:var(--text-secondary);">🧠 AI & Memory</h3>
                            <p style="font-size:11px;color:var(--text-muted);">🔒 Aktuell: ${AICore.useLocal ? 'Lokale KI (kein API-Key)' : 'Groq API aktiv'}</p>
                            <div style="margin-top:4px;">
                                <label style="font-size:10px;color:var(--text-secondary);">🔑 Groq API Key (gsk_...)</label>
                                <input id="api-key-input" class="haldo-input" type="password" value="${apiKey}" placeholder="gsk_..." style="margin-top:2px;">
                                <button onclick="AppManager.saveAPIKey()" class="haldo-btn" style="margin-top:4px;">💾 Speichern</button>
                                <button onclick="document.getElementById('api-key-input').value='';AppManager.saveAPIKey();" class="haldo-btn haldo-btn-secondary" style="margin-top:4px;">🗑️ Entfernen</button>
                                <p style="font-size:10px;color:${AICore.useLocal ? 'var(--warning)' : 'var(--success)'};margin-top:4px;">
                                    ${AICore.useLocal ? '⚠️ Lokaler Modus aktiv – für Groq-API Key eingeben' : '✅ Groq-API aktiv'}
                                </p>
                            </div>
                            <div style="margin-top:8px;">
                                <p style="font-size:11px;color:var(--text-secondary);">🧠 Memory: ${Storage.get('ai_memory',[]).length} Einträge</p>
                                <button onclick="Storage.set('ai_memory',[]);alert('Memory gelöscht, Bruder!');" class="haldo-btn haldo-btn-secondary" style="margin-top:4px;">🧹 Memory löschen</button>
                            </div>
                        </div>

                        <div style="margin-top:16px;">
                            <h3 style="font-size:12px;color:var(--text-secondary);">💾 Speicher</h3>
                            <p style="font-size:11px;color:var(--text-secondary);">Einträge: ${localStorage.length}</p>
                            <button onclick="Storage.clear();alert('Cache geleert, Bruder!');" class="haldo-btn haldo-btn-secondary" style="margin-top:4px;">🗑️ Cache leeren</button>
                        </div>

                        <div style="margin-top:16px;">
                            <h3 style="font-size:12px;color:var(--text-secondary);">📊 System</h3>
                            <p style="font-size:11px;color:var(--text-secondary);">Version: ${Kernel.version}</p>
                            <p style="font-size:11px;color:var(--text-secondary);">Uptime: ${Kernel.getUptime()}s</p>
                            <p style="font-size:11px;color:var(--text-secondary);">Apps: ${this.apps.length}</p>
                            <button onclick="Kernel.reboot()" class="haldo-btn haldo-btn-secondary" style="margin-top:4px;">🔄 Neustart</button>
                        </div>

                        <div style="margin-top:16px;">
                            <h3 style="font-size:12px;color:var(--text-secondary);">🌍 Sprache</h3>
                            <select class="haldo-input" style="margin-top:4px;" onchange="document.getElementById('menu-lang').textContent=this.value;Storage.set('language',this.value);">
                                <option value="DE">🇩🇪 Deutsch</option>
                                <option value="EN">🇬🇧 English</option>
                                <option value="KU">🏴 Kurmancî</option>
                                <option value="EZ">🏴 Êzîdî</option>
                                <option value="TR">🇹🇷 Türkçe</option>
                                <option value="AR">🇸🇦 العربية</option>
                                <option value="FR">🇫🇷 Français</option>
                                <option value="ES">🇪🇸 Español</option>
                                <option value="RU">🇷🇺 Русский</option>
                                <option value="FA">🇮🇷 فارسی</option>
                                <option value="IT">🇮🇹 Italiano</option>
                                <option value="PT">🇵🇹 Português</option>
                                <option value="LA">🏛️ Latina</option>
                            </select>
                        </div>
                    </div>
                `;
                const win = this.createWindow(app.name, app.icon, content, 400, 480);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            saveAPIKey() {
                const input = document.getElementById('api-key-input');
                if (!input) return;
                const key = input.value.trim();
                AICore.setApiKey(key);
                alert(key ? '✅ API Key gespeichert, Bruder!' : '⚠️ Key entfernt, lokale KI aktiv.');
                const body = document.querySelector('.window .window-body');
                if (body) {
                    const app = this.apps.find(a => a.id === 'settings');
                    if (app) this.openSettings(app);
                }
            },

            // ===== KATEGORIEN =====
            openCategory(category) {
                const apps = this.apps.filter(a => a.category === category);
                if (!apps.length) { alert(`Keine Apps in "${category}", Bruder!`); return; }
                const content = `
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                        ${apps.map(app => `<div onclick="AppManager.openApp('${app.id}')" style="padding:6px 12px;background:rgba(255,255,255,0.03);border-radius:6px;border:1px solid var(--glass-border);cursor:pointer;">${app.icon} ${app.name}</div>`).join('')}
                    </div>
                `;
                const win = this.createWindow(category.toUpperCase(), '📂', content, 400, 300);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            updateTaskbar() {
                const container = document.getElementById('taskbar-apps');
                if (!container) return;
                const windows = document.querySelectorAll('#window-container .window');
                container.innerHTML = '';
                windows.forEach(win => {
                    const title = win.querySelector('.window-title')?.textContent?.trim() || 'App';
                    const btn = document.createElement('button');
                    btn.className = 'taskbar-app-btn';
                    btn.textContent = title;
                    btn.onclick = () => {
                        win.classList.toggle('minimized');
                        this.updateTaskbar();
                    };
                    container.appendChild(btn);
                });
            },

            renderDesktopIcons() {
                const container = document.getElementById('desktop-icons');
                if (!container) return;
                const apps = this.apps.filter(a => this.installedApps.includes(a.id));
                container.innerHTML = apps.slice(0, 16).map(app => `
                    <div class="desktop-icon" onclick="AppManager.openApp('${app.id}')">
                        <div class="icon-img">${app.icon}</div>
                        <div class="icon-label">${app.name}</div>
                    </div>
                `).join('');
            }
        };

        // ============================================================
        //  START
        // ============================================================
        window.onload = function() {
            Kernel.init();
            Boot.start();
        };

        window.onerror = function(msg, url, line) {
            console.error('❌ Fehler:', msg, url, line);
            const logs = Storage.get('logs', []);
            logs.push({ level: 'error', message: `${msg} (${url}:${line})`, time: Date.now() });
            if (logs.length > 100) logs.shift();
            Storage.set('logs', logs);
        };

        console.log('💙❤️🚀 HalDo AI OS 26.0.0 Cosmic Ultimate – KOMPLETT GELADEN, Bruder!');
        console.log('🔒 KI: ' + (AICore.useLocal ? 'Lokal' : 'Groq API'));
        console.log('☀️ Klick die Sonne an – HalDo AI öffnet sich!');
        console.log('💡 HalDo antwortet abwechslungsreich und kontextbewusst!');
        console.log('📱 ' + AppManager.apps.length + ' Apps installiert – alle funktionsfähig!');
        console.log('⚙️ API-Key in den Einstellungen (⚙️ → AI & Memory) eintragen!');
    </script>
</body>
</html>
