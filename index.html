<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HalDo AI OS 24 – Ultimate Edition</title>
    <link rel="icon" href="assets/images/favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    
    <style>
        /* ==============================================================
           HALDO AI OS 24 – ULTIMATE CSS (VOLLSTÄNDIG)
           ============================================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-window: rgba(16, 16, 40, 0.94);
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #e8eef5;
            --text-secondary: #8899bb;
            --text-muted: #556688;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.04);
            --accent-1: #00d4ff;
            --accent-2: #7b2ffc;
            --accent-3: #ff6b6b;
            --shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            --radius: 12px;
            --radius-sm: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        html,
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== BOOT SCREEN ===== */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #boot.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #boot .logo-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        #boot .logo-container .haldo-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            animation: logoPulse 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 50px rgba(0, 212, 255, 0.3));
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.2));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 70px rgba(123, 47, 252, 0.4));
            }
        }

        #boot .logo-container .ring {
            position: absolute;
            inset: -8px;
            border: 2px solid rgba(0, 212, 255, 0.08);
            border-radius: 50%;
            animation: ringSpin 10s linear infinite;
        }
        #boot .logo-container .ring:nth-child(2) {
            inset: -22px;
            border-color: rgba(123, 47, 252, 0.06);
            animation-duration: 14s;
            animation-direction: reverse;
        }
        #boot .logo-container .ring:nth-child(3) {
            inset: -36px;
            border-color: rgba(255, 255, 255, 0.03);
            animation-duration: 18s;
        }

        @keyframes ringSpin {
            to {
                transform: rotate(360deg);
            }
        }

        #boot .title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 2px;
        }

        #boot .subtitle {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        #boot .loader {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid var(--accent-1);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #boot-status {
            font-size: 0.7rem;
            color: var(--text-secondary);
            animation: pulse 1.4s ease-in-out infinite;
            min-height: 20px;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        #boot .progress {
            width: 280px;
            height: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 3px;
            margin-top: 14px;
            overflow: hidden;
            position: relative;
        }
        #boot .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        #boot .progress-text {
            font-size: 0.45rem;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* ===== COSMIC CANVAS ===== */
        #cosmic {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: auto;
            display: block;
        }

        /* ===== MENU BAR ===== */
        #menu-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 38px;
            z-index: 2000;
            background: rgba(10, 10, 26, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.7rem;
        }
        #menu-bar .menu-item {
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            transition: all var(--transition);
            font-weight: 500;
            letter-spacing: 0.3px;
            font-size: 0.65rem;
        }
        #menu-bar .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        #menu-bar .menu-left {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        #menu-bar .logo-text {
            font-weight: 700;
            font-size: 0.85rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 6px;
        }
        #menu-bar .menu-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        #menu-bar .clock {
            color: var(--text-secondary);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }
        #menu-bar .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #44ff88;
            display: inline-block;
            margin-right: 4px;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }
        #menu-bar .status-text {
            font-size: 0.5rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* ===== APP CONTAINER ===== */
        #app-container {
            position: fixed;
            inset: 38px 0 58px 0;
            z-index: 10;
            pointer-events: none;
        }
        #app-container .window {
            position: absolute;
            pointer-events: auto;
            background: var(--bg-window);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-width: 200px;
            min-height: 130px;
            overflow: hidden;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }
        #app-container .window.active {
            box-shadow: 0 16px 56px rgba(0, 180, 255, 0.08);
            border-color: rgba(0, 180, 255, 0.12);
        }
        #app-container .window.minimized {
            display: none;
        }

        .window-header {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            cursor: grab;
            flex-shrink: 0;
            min-height: 34px;
            user-select: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .window-title .icon {
            font-size: 0.9rem;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }
        .window-controls .win-btn {
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            font-size: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            transition: all var(--transition);
            line-height: 1;
        }
        .window-controls .win-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .window-controls .win-btn.close:hover {
            background: #ff4444;
            color: #fff;
        }
        .window-controls .win-btn.maximize:hover {
            background: rgba(68, 255, 136, 0.15);
            color: #44ff88;
        }
        .window-controls .win-btn.minimize:hover {
            background: rgba(255, 204, 0, 0.15);
            color: #ffcc00;
        }

        .window-body {
            flex: 1;
            padding: 10px 12px;
            overflow: auto;
            font-size: 0.7rem;
            color: var(--text-primary);
            min-height: 60px;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== DOCK ===== */
        #dock {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 6px 12px;
            display: flex;
            gap: 4px;
            align-items: center;
            pointer-events: auto;
            max-width: 94vw;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dock-item {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .dock-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-4px);
        }
        .dock-item:active {
            transform: translateY(0px) scale(0.92);
        }
        .dock-item .label {
            position: absolute;
            bottom: -20px;
            font-size: 0.45rem;
            color: var(--text-secondary);
            white-space: nowrap;
            opacity: 0;
            transition: opacity var(--transition);
            pointer-events: none;
        }
        .dock-item:hover .label {
            opacity: 1;
        }
        .dock-divider {
            width: 1px;
            height: 28px;
            background: var(--border-color);
            margin: 0 3px;
        }

        /* ===== NOTIFICATION ===== */
        #notification {
            position: fixed;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            z-index: 9999;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-1);
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 0.75rem;
            color: var(--text-primary);
            max-width: 88vw;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            white-space: pre-line;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            #menu-bar .menu-item {
                font-size: 0.5rem;
                padding: 2px 6px;
            }
            #menu-bar .logo-text {
                font-size: 0.7rem;
            }
            #menu-bar .clock {
                font-size: 0.55rem;
            }
            #menu-bar .status-text {
                display: none;
            }
            #dock {
                padding: 4px 8px;
                gap: 3px;
                border-radius: 14px;
            }
            .dock-item {
                width: 34px;
                height: 34px;
                font-size: 0.95rem;
                border-radius: 8px;
            }
            .window-header {
                padding: 4px 8px;
                min-height: 28px;
            }
            .window-title {
                font-size: 0.6rem;
            }
            .window-body {
                font-size: 0.6rem;
                padding: 6px 8px;
            }
            #notification {
                font-size: 0.65rem;
                padding: 8px 14px;
                bottom: 64px;
            }
            #boot .logo-container {
                width: 100px;
                height: 100px;
            }
            #boot .title {
                font-size: 1.8rem;
            }
            #boot .subtitle {
                font-size: 0.5rem;
                letter-spacing: 4px;
            }
            #boot .progress {
                width: 180px;
            }
        }

        @media (max-width: 380px) {
            .dock-item {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
                border-radius: 6px;
            }
            #menu-bar .menu-item {
                font-size: 0.45rem;
                padding: 2px 4px;
            }
            #menu-bar .logo-text {
                font-size: 0.6rem;
            }
            .window-controls .win-btn {
                width: 16px;
                height: 16px;
                font-size: 0.4rem;
            }
        }

        /* ===== SAFARI FIXES ===== */
        @supports (-webkit-touch-callout: none) {
            #menu-bar,
            #dock,
            #app-container .window,
            #notification {
                -webkit-backdrop-filter: blur(18px);
            }
        }

        /* ===== UTILITY ===== */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-1 {
            gap: 4px;
        }
        .gap-2 {
            gap: 8px;
        }
        .text-muted {
            color: var(--text-secondary);
        }
        .text-xs {
            font-size: 0.55rem;
        }
        .text-sm {
            font-size: 0.65rem;
        }
        .text-base {
            font-size: 0.75rem;
        }
        .font-bold {
            font-weight: 700;
        }
        .w-full {
            width: 100%;
        }
        .rounded {
            border-radius: var(--radius-sm);
        }

        /* ===== APP-SPECIFIC ===== */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 6px;
        }
        .app-grid-item {
            background: var(--bg-card);
            padding: 8px 4px;
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid transparent;
        }
        .app-grid-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-light);
            transform: translateY(-2px);
        }
        .app-grid-item .icon {
            font-size: 1.4rem;
        }
        .app-grid-item .name {
            font-size: 0.45rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            font-size: 0.65rem;
            margin-bottom: 3px;
        }
        .list-item .text {
            word-break: break-word;
        }
        .list-item .del-btn {
            background: none;
            border: none;
            color: var(--accent-3);
            cursor: pointer;
            font-size: 0.6rem;
            padding: 2px 6px;
        }
        .list-item .del-btn:hover {
            color: #ff4444;
        }

        .input-field {
            flex: 1;
            font-size: 0.65rem;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            outline: none;
            transition: border-color var(--transition);
        }
        .input-field:focus {
            border-color: var(--accent-1);
        }
        .input-field::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            padding: 5px 14px;
            font-size: 0.65rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            cursor: pointer;
            transition: opacity var(--transition);
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .btn-secondary {
            padding: 4px 10px;
            font-size: 0.6rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        .chip {
            padding: 3px 10px;
            font-size: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .chip:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        .section-divider {
            font-size: 0.4rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 4px;
            margin-top: 4px;
        }

        .window-body::-webkit-scrollbar {
            width: 3px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
        }
        .window-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== LIVING AI AVATAR ===== */
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
        }
        .avatar-face {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a1a3a, #0a0a1a);
            border: 2px solid var(--border-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .avatar-face .eyes {
            display: flex;
            gap: 16px;
            position: absolute;
            top: 30%;
        }
        .avatar-face .eye {
            width: 12px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            transition: all 0.2s ease;
        }
        .avatar-face .eye::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #1a1a3a;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            left: 3px;
            transition: all 0.2s ease;
        }
        .avatar-face .eye.listening::after {
            left: 1px;
            bottom: 1px;
        }
        .avatar-face .eye.thinking::after {
            left: 5px;
            bottom: 5px;
        }
        .avatar-face .mouth {
            position: absolute;
            bottom: 20%;
            width: 20px;
            height: 4px;
            background: rgba(255, 100, 100, 0.3);
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .avatar-face .mouth.speaking {
            width: 24px;
            height: 8px;
            background: rgba(255, 100, 100, 0.5);
            border-radius: 0 0 12px 12px;
            animation: speak 0.3s ease-in-out infinite alternate;
        }
        @keyframes speak {
            from {
                height: 4px;
                width: 16px;
            }
            to {
                height: 10px;
                width: 28px;
            }
        }
        .avatar-status {
            font-size: 0.5rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .avatar-status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
            animation: blink 2s ease-in-out infinite;
        }
        .avatar-status .dot.idle {
            background: #44ff88;
        }
        .avatar-status .dot.listening {
            background: #44aaff;
        }
        .avatar-status .dot.thinking {
            background: #ffcc00;

    <!-- ================================================================

    <script>
        'use strict';

        // ================================================================
        //  HALDO AI OS 24 – ULTIMATE EDITION
        //  Version: 24.4.0
        //  Build: 2026-08-31
        //  KOMPLETT – ALLE 100+ APPS
        // ================================================================

        // ============================================================

        var CONFIG = {
            version: '24.4.0',
            build: '2026.08.31',
            kernel: '5.3.0',
            apiKey: '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',
            apiUrl: 'https://api.groq.com/openai/v1/chat/completions',
            model: 'llama3-70b-8192',
            language: 'de',
            maxHistory: 50,
            notificationDuration: 3000,
            appCategories: ['core', 'productivity', 'learning', 'entertainment', 'system', 'communication',
                'creative', 'tools', 'media', 'office', 'language'
            ]
        };

        // ============================================================
        //  STATE
        // ============================================================
        var state = {
            apps: {},
            windows: [],
            windowZIndex: 100,
            activeWindow: null,
            avatarStatus: 'idle',
            settings: {
                theme: 'dark',
                language: 'de',

                notifications: true,
                voiceGender: 'male',
                autoStartAI: true,
                showDockLabels: false
            },
            system: {

                uptime: 0,
                version: CONFIG.version,
                build: CONFIG.build,
                kernel: CONFIG.kernel,
                bootTime: 0,
                appLaunches: 0,
                updateAvailable: false,
                updateVersion: null
            },
            notes: JSON.parse(localStorage.getItem('haldo_notes') || '[]'),
            contacts: JSON.parse(localStorage.getItem('haldo_contacts') || '[]'),
            tasks: JSON.parse(localStorage.getItem('haldo_tasks') || '[]'),
            emails: JSON.parse(localStorage.getItem('haldo_emails') || '{"inbox":[],"sent":[],"drafts":[]}'),
            documents: JSON.parse(localStorage.getItem('haldo_documents') || '[]'),
            aiMemory: JSON.parse(localStorage.getItem('haldo_ai_memory') || '[]'),
            conversationHistory: JSON.parse(localStorage.getItem('haldo_conversations') || '[]'),
            isBooted: false,
            isReady: false,
            avatar: {
                status: 'idle',
                expression: 'neutral',
                speaking: false
            }
        };

        // ============================================================
        //  DOM-REFERENZEN
        // ============================================================
        var DOM = {
            boot: document.getElementById('boot'),
            bootStatus: document.getElementById('boot-status'),
            bootProgress: document.getElementById('boot-progress'),
            bootProgressText: document.getElementById('boot-progress-text'),
            cosmic: document.getElementById('cosmic'),
            appContainer: document.getElementById('app-container'),
            dock: document.getElementById('dock'),
            notification: document.getElementById('notification'),
            clock: document.getElementById('clock-display')
        };

        // ============================================================
        //  HELPER
        // ============================================================
        function $(id) { return document.getElementById(id); }

        function now() { return Date.now(); }

        function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

        function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 4); }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  NOTIFICATION SYSTEM
        // ============================================================
        var Notify = {
            _timeout: null,

            show: function(text, type) {
                type = type || 'info';
                var colors = {
                    error: '#ff4444',
                    success: '#44ff88',
                    warning: '#ffcc00',
                    info: '#00d4ff'
                };
                DOM.notification.textContent = text;
                DOM.notification.style.borderLeftColor = colors[type] || '#00d4ff';
                DOM.notification.classList.add('show');
                clearTimeout(this._timeout);
                this._timeout = setTimeout(function() {
                    DOM.notification.classList.remove('show');
                }, CONFIG.notificationDuration);
                console.log('[HalDo]', text);
            },

            error: function(text) { this.show('❌ ' + text, 'error'); },
            success: function(text) { this.show('✅ ' + text, 'success'); },
            warning: function(text) { this.show('⚠️ ' + text, 'warning'); },
            info: function(text) { this.show('ℹ️ ' + text, 'info'); }
        };

        var notify = Notify.show;

        // ============================================================
        //  VOICE ENGINE
        // ============================================================
        var Voice = {
            isListening: false,
            recognition: null,
            synthesis: window.speechSynthesis,
            isSupported: false,

            init: function() {
                var hasRecognition = ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window);
                var hasSynthesis = ('speechSynthesis' in window);

                if (hasRecognition) {
                    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SR();
                    this.recognition.lang = 'de-DE';
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;
                    this.recognition.onresult = this._onResult.bind(this);
                    this.recognition.onerror = this._onError.bind(this);
                    this.recognition.onend = this._onEnd.bind(this);
                    this.isSupported = true;
                    console.log('[Voice] Speech Recognition bereit');
                }

                if (hasSynthesis) {
                    console.log('[Voice] Speech Synthesis bereit');
                }

                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(function(stream) {
                            stream.getTracks().forEach(function(t) { t.stop(); });
                            console.log('[Voice] Mikrofon-Zugriff gewährt');
                        })
                        .catch(function() {
                            console.log('[Voice] Mikrofon-Zugriff verweigert');
                        });
                }
            },

            startListening: function() {
                if (!this.recognition) {
                    Notify.error('Sprachsteuerung nicht unterstützt');
                    return;
                }
                if (this.isListening) {
                    this.recognition.stop();
                    return;
                }
                try {
                    this.recognition.start();
                    this.isListening = true;
                    Notify.info('🎤 Höre zu ...');
                    this._updateAvatarStatus('listening');
                } catch (e) {
                    Notify.error('Mikrofon konnte nicht gestartet werden');
                }
            },

            _onResult: function(event) {
                var text = event.results[0][0].transcript;
                this.isListening = false;
                Notify.success('🎤 "' + text + '"');
                this._updateAvatarStatus('thinking');

                var cmd = AI._parseCommand(text);
                if (cmd && cmd.action === 'open') {
                    if (state.apps[cmd.app]) {
                        launchApp(cmd.app);
                        Notify.success(state.apps[cmd.app].title + ' geöffnet!');
                        this._updateAvatarStatus('idle');
                        this.speak(state.apps[cmd.app].title + ' wurde geöffnet!');
                        return;
                    }
                }

                var input = document.getElementById('ai-input');
                if (input) {
                    input.value = text;
                    var sendBtn = document.getElementById('ai-send');
                    if (sendBtn) sendBtn.click();
                } else {
                    AI.ask(text, CONFIG.language).then(function(response) {
                        Notify.info(response);
                        if (state.settings.voiceEnabled) {
                            Voice.speak(response);
                        }
                    });
                }
            },

            _onError: function(event) {
                this.isListening = false;
                this._updateAvatarStatus('idle');
                if (event.error === 'not-allowed') {
                    Notify.error('Mikrofon-Zugriff verweigert.');
                }
            },

            _onEnd: function() {
                this.isListening = false;
                this._updateAvatarStatus('idle');
            },

            speak: function(text, language) {
                if (!state.settings.voiceEnabled) return;
                language = language || 'de-DE';
                if (!('speechSynthesis' in window)) return;
                if (this.synthesis.speaking) {
                    this.synthesis.cancel();
                }
                this._updateAvatarStatus('speaking');
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = language;
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.volume = 1;
                utterance.onend = function() {
                    Voice._updateAvatarStatus('idle');
                };
                this.synthesis.speak(utterance);
            },

            _updateAvatarStatus: function(status) {
                state.avatar.status = status;
                var el = document.getElementById('avatar-status');
                if (el) {
                    var statusText = {
                        'idle': '● Bereit',
                        'listening': '🎤 Hört zu...',
                        'thinking': '🧠 Denkt...',
                        'speaking': '🗣️ Spricht...'
                    };
                    el.textContent = statusText[status] || '● Bereit';
                    el.className = 'avatar-status ' + status;
                }
                var eyes = document.querySelectorAll('.eye');
                eyes.forEach(function(eye) {
                    eye.className = 'eye ' + status;
                });
                var mouth = document.querySelector('.mouth');
                if (mouth) {
                    mouth.className = 'mouth' + (status === 'speaking' ? ' speaking' : '');
                }
            }
        };

        // ============================================================
        //  AI ENGINE
        // ============================================================
        var AI = {
            conversationHistory: [],
            isThinking: false,

            knowledge: {
                'recht': 'Das Recht ist die Grundlage unserer Gesellschaft. Es regelt das Zusammenleben der Menschen und schützt die Rechte jedes Einzelnen.',
                'vertrag': 'Ein Vertrag ist eine rechtlich bindende Vereinbarung zwischen zwei oder mehreren Parteien.',
                'medizin': 'Die Medizin ist die Wissenschaft der Heilung und der Erhaltung der Gesundheit.',
                'brief': 'Ein Brief ist eine schriftliche Nachricht an eine bestimmte Person oder Institution.',
                'quantenmechanik': 'Die Quantenmechanik beschreibt die Welt der kleinsten Teilchen.',
                'philosophie': 'Die Philosophie ist die Liebe zur Weisheit.',
                'ezidi': 'Die Êzîdî sind eine der ältesten monotheistischen Religionen der Welt.',
                'kurden': 'Die Kurden sind ein indigenes Volk in der Region Kurdistan.',
                'default': 'Ich habe ein tiefes Verständnis für viele Bereiche: Wissenschaft, Geschichte, Philosophie, Kultur, Technik, Kunst, Gesundheit, Recht und Medizin.'
            },

            ask: function(question, language) {
                language = language || CONFIG.language;
                var self = this;
                this.isThinking = true;
                Voice._updateAvatarStatus('thinking');

                var lower = question.toLowerCase();
                for (var key in this.knowledge) {
                    if (lower.includes(key) || key.includes(lower)) {
                        var answer = this.knowledge[key];
                        this._addToHistory('user', question);
                        this._addToHistory('assistant', answer);
                        this.isThinking = false;
                        Voice._updateAvatarStatus('idle');
                        return Promise.resolve(answer);
                    }
                }

                var cmd = this._parseCommand(question);
                if (cmd && cmd.action === 'open') {
                    var appName = cmd.app;
                    if (state.apps[appName]) {
                        launchApp(appName);
                        this.isThinking = false;
                        Voice._updateAvatarStatus('idle');
                        return Promise.resolve('✅ ' + state.apps[appName].title + ' wurde geöffnet!');
                    }
                }

                var systemPrompt =
                    'Du bist HalDo, ein intelligenter, freundlicher und professioneller Assistent. Du hilfst bei allen Themen. Du antwortest auf ' +
                    language +
                    '. Du kannst Apps öffnen, wenn der Benutzer sagt: "Öffne [App-Name]". Du kannst Texte schreiben, korrigieren, formulieren. Du bist präzise, hilfsbereit und einfühlsam.';

                return new Promise(function(resolve, reject) {
                    fetch(CONFIG.apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + CONFIG.apiKey
                        },
                        body: JSON.stringify({
                            model: CONFIG.model,
                            messages: [
                                { role: 'system', content: systemPrompt },
                                { role: 'user', content: question }
                            ],
                            temperature: 0.7,
                            max_tokens: 1000
                        })
                    }).then(function(response) {
                        if (!response.ok) {
                            return response.text().then(function(err) {
                                reject(new Error('API-Fehler: ' + response.status));
                            });
                        }
                        return response.json();
                    }).then(function(data) {
                        var answer = data.choices[0].message.content;
                        self._addToHistory('user', question);
                        self._addToHistory('assistant', answer);
                        self.isThinking = false;
                        Voice._updateAvatarStatus('idle');
                        resolve(answer);
                    }).catch(function(error) {
                        var fallback = self._getFallback(question);
                        self.isThinking = false;
                        Voice._updateAvatarStatus('idle');
                        resolve(fallback);
                    });
                });
            },

            _addToHistory: function(role, content) {
                this.conversationHistory.push({ role: role, content: content, timestamp: now() });
                if (this.conversationHistory.length > CONFIG.maxHistory) {
                    this.conversationHistory.splice(0, this.conversationHistory.length - CONFIG.maxHistory);
                }
                try {
                    localStorage.setItem('haldo_conversations', JSON.stringify(this.conversationHistory));
                } catch (e) {}
            },

            _parseCommand: function(text) {
                var lower = text.toLowerCase();
                var appMap = {
                    'ai': ['ai', 'haldo ai', 'chat', 'assistent', 'haldo', 'ki'],
                    'fahrschule': ['fahrschule', 'auto fahren', 'führerschein', 'auto'],
                    'settings': ['einstellungen', 'settings', 'optionen', 'system'],
                    'notes': ['notizen', 'notes', 'zettel', 'memo'],
                    'tasks': ['aufgaben', 'tasks', 'to-do', 'todo'],
                    'contacts': ['kontakte', 'adressbuch', 'contacts'],
                    'files': ['dateien', 'files', 'ordner', 'dokumente'],
                    'cosmic': ['cosmic', 'weltraum', 'space', 'galaxie', 'sonne'],
                    'appworld': ['app world', 'apps', 'anwendungen'],
                    'email': ['email', 'mail', 'e-mail', 'post'],
                    'avatar': ['avatar', 'living ai', 'lebendig']
                };

                for (var appId in appMap) {
                    var keywords = appMap[appId];
                    for (var i = 0; i < keywords.length; i++) {
                        var kw = keywords[i];
                        if (lower.includes('öffne ' + kw) ||
                            lower.includes('starte ' + kw) ||
                            lower.includes('haldo öffne ' + kw) ||
                            lower === kw) {
                            return { action: 'open', app: appId };
                        }
                    }
                }
                return null;
            },

            _getFallback: function(cmd) {
                var lower = cmd.toLowerCase();

                var fallbackApps = {
                    'fahrschule': ['fahrschule', 'auto', 'führerschein'],
                    'ai': ['ai', 'haldo', 'chat', 'ki'],
                    'settings': ['einstellungen', 'settings', 'optionen'],
                    'notes': ['notizen', 'notes', 'memo'],
                    'tasks': ['aufgaben', 'tasks', 'todo'],
                    'contacts': ['kontakte', 'contacts'],
                    'files': ['dateien', 'files', 'ordner'],
                    'cosmic': ['cosmic', 'weltraum', 'sonne'],
                    'appworld': ['apps', 'app world'],
                    'email': ['email', 'mail', 'e-mail']
                };

                for (var appId in fallbackApps) {
                    var words = fallbackApps[appId];
                    for (var i = 0; i < words.length; i++) {
                        if (lower.includes(words[i]) || lower.includes('öffne ' + words[i])) {
                            if (state.apps[appId]) {
                                launchApp(appId);
                                return '✅ ' + state.apps[appId].title + ' wurde geöffnet!';
                            }
                        }
                    }
                }

                if (lower.includes('schreib mir') || lower.includes('brief') || lower.includes('schreiben')) {
                    return '✍️ Hier ist dein Text:\n\nSehr geehrte Damen und Herren,\n\nhiermit möchte ich Sie über folgendes informieren...\n\nMit freundlichen Grüßen\nIhr HalDo AI';
                }

                if (lower.includes('hallo') || lower.includes('hi') || lower.includes('hey')) {
                    return '👋 Hallo! Ich bin HalDo, dein persönlicher AI-Assistent. Wie kann ich dir helfen?';
                }

                if (lower.includes('hilfe') || lower.includes('help') || lower.includes('?')) {
                    return '❓ **HalDo AI – Hilfe**\n\n📱 Apps:\n• "Öffne Fahrschule" 🚗\n• "Öffne Notizen" 📝\n• "Öffne E-Mail" 📧\n\n⌨️ Shortcuts:\n• Cmd+K → AI\n• Escape → Fenster schließen\n\n☀️ Klicke auf die Sonne!';
                }

                return '💡 Ich habe verstanden: "' + cmd +
                    '".\n\nIch kann:\n• Apps öffnen ("Öffne Fahrschule")\n• Texte schreiben ("Schreib mir einen Brief")\n• Fragen beantworten\n\nSag "Hilfe" für mehr!';
            },

            clearHistory: function() {
                this.conversationHistory = [];
                try {
                    localStorage.setItem('haldo_conversations', JSON.stringify([]));
                } catch (e) {}
                Notify.info('🧹 Chat-Historie gelöscht');
            }
        };

        // ============================================================
        //  WINDOW MANAGER
        // ============================================================
        var WindowManager = {
            getSafePosition: function() {
                var vw = window.innerWidth,
                    vh = window.innerHeight;
                var w = Math.min(480, vw - 30);
                var h = Math.min(380, vh - 150);
                return {
                    x: Math.max(10, (vw - w) / 2 + (Math.random() - 0.5) * 30),
                    y: Math.max(40, (vh - h) / 2 - 20 + (Math.random() - 0.5) * 30),
                    w: w,
                    h: h
                };
            },

            launch: function(id) {
                var app = state.apps[id];
                if (!app) {
                    Notify.error('App "' + id + '" nicht gefunden');
                    return null;
                }

                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].appId === id) {
                        this._focus(state.windows[i].id);
                        return state.windows[i];
                    }
                }

                var pos = this.getSafePosition();
                var winId = 'win-' + uid();
                var win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x,
                    y: pos.y,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null,
                    minimized: false,
                    _prev: {}
                };

                state.windows.push(win);
                this._render(win);
                this._focus(winId);

                if (app.render) {
                    var body = win.element.querySelector('.window-body');
                    app.render(body, win);
                }

                state.system.appLaunches++;
                Notify.info('🔄 ' + (app.title || id) + ' geöffnet');
                return win;
            },

            _render: function(win) {
                var existing = document.getElementById(win.id);
                if (existing) existing.remove();

                var el = document.createElement('div');
                el.id = win.id;
                el.className = 'window active';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;

                el.innerHTML =
                    '<div class="window-header">' +
                    '<span class="window-title"><span class="icon">' + win.icon + '</span>' + win.title +
                    '</span>' +
                    '<div class="window-controls">' +
                    '<button class="win-btn minimize" data-action="minimize">─</button>' +
                    '<button class="win-btn maximize" data-action="maximize">⧉</button>' +
                    '<button class="win-btn close" data-action="close">✕</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="window-body"></div>';

                DOM.appContainer.appendChild(el);
                win.element = el;

                var btns = el.querySelectorAll('.win-btn');
                for (var i = 0; i < btns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var action = btn.dataset.action;
                            if (action === 'close') WindowManager.close(win.id);
                            else if (action === 'minimize') WindowManager.minimize(win.id);
                            else if (action === 'maximize') WindowManager.maximize(win.id);
                        });
                    })(btns[i]);
                }

                this._setupDrag(win, el);
                this._setupResize(win, el);
            },

            _setupDrag: function(win, el) {
                var header = el.querySelector('.window-header');
                var drag = false,
                    startX, startY, origX, origY;

                function startDrag(cx, cy) {
                    if (header.querySelector('.win-btn')) return;
                    drag = true;
                    startX = cx;
                    startY = cy;
                    origX = win.x;
                    origY = win.y;
                    WindowManager._focus(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(cx, cy) {
                    if (!drag) return;
                    var dx = cx - startX,
                        dy = cy - startY;
                    win.x = clamp(origX + dx, 0, window.innerWidth - win.width);
                    win.y = clamp(origY + dy, 0, window.innerHeight - win.height - 60);
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() {
                    if (drag) { drag = false;
                        el.style.cursor = ''; }
                }

                header.addEventListener('mousedown', function(e) {
                    if (!e.target.closest('.win-btn')) startDrag(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', function(e) { if (drag) moveDrag(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    if (!e.target.closest('.win-btn')) startDrag(t.clientX, t.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', function(e) {
                    if (drag) { var t = e.touches[0];
                        moveDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', endDrag, { passive: true });
            },

            _setupResize: function(win, el) {
                var handle = document.createElement('div');
                handle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:20px;height:20px;cursor:se-resize;touch-action:none;';
                el.appendChild(handle);

                var resize = false,
                    startW, startH, startX2, startY2;

                function startResize(cx, cy) {
                    resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = cx;
                    startY2 = cy;
                }

                function moveResize(cx, cy) {
                    if (!resize) return;
                    var dw = cx - startX2,
                        dh = cy - startY2;
                    win.width = clamp(startW + dw, 160, window.innerWidth - win.x - 10);
                    win.height = clamp(startH + dh, 100, window.innerHeight - win.y - 70);
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                handle.addEventListener('mousedown', function(e) {
                    e.stopPropagation();
                    startResize(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', function(e) { if (resize) moveResize(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endResize);

                handle.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    e.stopPropagation();
                    startResize(t.clientX, t.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', function(e) {
                    if (resize) { var t = e.touches[0];
                        moveResize(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            },

            close: function(winId) {
                var idx = -1;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { idx = i; break; }
                }
                if (idx === -1) return;
                var win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) {
                    this._focus(state.windows[state.windows.length - 1].id);
                }
            },

            minimize: function(winId) {
                var win = this._find(winId);
                if (!win) return;
                win.minimized = !win.minimized;
                if (win.element) {
                    win.element.classList.toggle('minimized', win.minimized);
                }
                Notify.info(win.minimized ? '⏬ ' + win.title + ' minimiert' : '🔄 ' + win.title + ' wiederhergestellt');
            },

            maximize: function(winId) {
                var win = this._find(winId);
                if (!win || !win.element) return;

                if (win.width === window.innerWidth - 20) {
                    win.width = win._prev.w || 420;
                    win.height = win._prev.h || 320;
                    win.x = win._prev.x || 20;
                    win.y = win._prev.y || 40;
                } else {
                    win._prev = { w: win.width, h: win.height, x: win.x, y: win.y };
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            },

            _focus: function(winId) {
                var win = this._find(winId);
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    for (var i = 0; i < state.windows.length; i++) {
                        if (state.windows[i].id !== winId && state.windows[i].element) {
                            state.windows[i].element.classList.remove('active');
                        }
                    }
                }
            },

            _find: function(winId) {
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) return state.windows[i];
                }
                return null;
            }
        };

        var launchApp = WindowManager.launch.bind(WindowManager);
        var closeWindow = WindowManager.close.bind(WindowManager);
        var minimizeWindow = WindowManager.minimize.bind(WindowManager);
        var maximizeWindow = WindowManager.maximize.bind(WindowManager);

        // ============================================================
        //  APP REGISTRATION (KERN-APPS)
        // ============================================================
        function registerApp(id, config) {
            state.apps[id] = {
                id: id,
                title: config.title,
                icon: config.icon,
                render: config.render,
                category: config.category || 'all',
                description: config.description || ''
            };
        }

        // ============================================================
        //  COSMIC WORLD (VOLLSTÄNDIG)
        // ============================================================
        function initCosmic() {
            var canvas = DOM.cosmic;
            var ctx = canvas.getContext('2d');
            var W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            var stars = [];
            for (var i = 0; i < 300; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 2.5 + 0.3,
                    speed: Math.random() * 0.02 + 0.003,
                    bright: Math.random() * 0.7 + 0.3,
                    phase: Math.random() * Math.PI * 2,
                    twinkle: Math.random() * 0.5 + 0.5
                });
            }

            var sun = { x: W / 2, y: H / 2, radius: 50, glow: 150, phase: 0 };

            var planets = [];
            var planetData = [
                { name: 'Merkur', r: 4, color: '#b8b8b8', orbit: 50, speed: 0.035 },
                { name: 'Venus', r: 6, color: '#e8a060', orbit: 75, speed: 0.025 },
                { name: 'Erde', r: 8, color: '#4488ff', orbit: 105, speed: 0.018 },
                { name: 'Mars', r: 5, color: '#e86040', orbit: 135, speed: 0.014 },
                { name: 'Jupiter', r: 12, color: '#d4a060', orbit: 175, speed: 0.009 },
                { name: 'Saturn', r: 9, color: '#d4b880', orbit: 215, speed: 0.007 },
                { name: 'Uranus', r: 8, color: '#80d0f0', orbit: 255, speed: 0.005 },
                { name: 'Neptun', r: 7, color: '#4060f0', orbit: 295, speed: 0.004 },
                { name: 'Pluto', r: 3, color: '#c0a880', orbit: 330, speed: 0.003 },
                { name: 'HalDo-1', r: 6, color: '#f080d0', orbit: 365, speed: 0.0022 },
                { name: 'HalDo-2', r: 7, color: '#80f0a0', orbit: 400, speed: 0.0016 },
                { name: 'HalDo-3', r: 5, color: '#f0a080', orbit: 435, speed: 0.0012 }
            ];

            for (var p = 0; p < planetData.length; p++) {
                var pd = planetData[p];
                planets.push({
                    name: pd.name,
                    r: pd.r,
                    color: pd.color,
                    orbit: pd.orbit,
                    speed: pd.speed,
                    angle: Math.random() * Math.PI * 2,
                    cx: W / 2,
                    cy: H / 2,
                    glow: pd.r * 0.5
                });
            }

            var moon = { x: 0, y: 0, r: 3, color: '#ccc', orbit: 18, speed: 0.09, angle: 0, ex: 0, ey: 0 };

            var nebula = [];
            for (var n = 0; n < 50; n++) {
                nebula.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 80 + 20,
                    a: Math.random() * 0.03 + 0.01,
                    color: ['rgba(100,50,200,', 'rgba(200,50,100,', 'rgba(50,100,200,', 'rgba(200,100,50,'][
                        Math.floor(Math.random() * 4)
                    ]
                });
            }

            function animate() {
                var time = Date.now() / 2000;
                ctx.clearRect(0, 0, W, H);

                // Hintergrund
                var grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.9);
                grad.addColorStop(0, '#0a0a2a');
                grad.addColorStop(0.5, '#050515');
                grad.addColorStop(1, '#000005');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // Nebel
                for (var nb = 0; nb < nebula.length; nb++) {
                    var neb = nebula[nb];
                    neb.x += Math.sin(time * 0.1 + nb) * 0.2;
                    neb.y += Math.cos(time * 0.08 + nb * 0.5) * 0.2;
                    if (neb.x < -100) neb.x = W + 100;
                    if (neb.x > W + 100) neb.x = -100;
                    if (neb.y < -100) neb.y = H + 100;
                    if (neb.y > H + 100) neb.y = -100;

                    var grd = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.r);
                    grd.addColorStop(0, neb.color + (neb.a * 0.8) + ')');
                    grd.addColorStop(1, neb.color + '0)');
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(neb.x, neb.y, neb.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Sterne
                for (var s = 0; s < stars.length; s++) {
                    var st = stars[s];
                    st.y += st.speed;
                    if (st.y > H) { st.y = 0;
                        st.x = Math.random() * W; }
                    var b = st.bright * (0.5 + 0.5 * Math.sin(time * st.twinkle + st.phase));
                    ctx.globalAlpha = b * 0.8;
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(255,255,255,0.05)';
                    ctx.shadowBlur = 4;
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // Sonne
                sun.phase += 0.02;
                var pulse = 1 + 0.04 * Math.sin(sun.phase);
                var r = sun.radius * pulse;

                // Sonnen-Corona
                for (var g = 8; g > 0; g--) {
                    var gr = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * g * 0.1);
                    gr.addColorStop(0, 'rgba(255,220,68,' + (0.035 / g) + ')');
                    gr.addColorStop(1, 'rgba(255,220,68,0)');
                    ctx.fillStyle = gr;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, sun.glow * g * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Sonnen-Oberfläche
                var sg = ctx.createRadialGradient(sun.x - r * 0.3, sun.y - r * 0.3, 0, sun.x, sun.y, r);
                sg.addColorStop(0, '#ffeecc');
                sg.addColorStop(0.2, '#ffdd55');
                sg.addColorStop(0.5, '#ffaa22');
                sg.addColorStop(0.8, '#ff7700');
                sg.addColorStop(1, '#ff4400');
                ctx.fillStyle = sg;
                ctx.shadowColor = '#ffdd44';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Sonnen-Flecken
                for (var sp = 0; sp < 6; sp++) {
                    var angle = sp * 1.2 + time * 0.1;
                    var dist = r * (0.2 + 0.3 * Math.sin(time * 0.05 + sp));
                    var sx = sun.x + Math.cos(angle) * dist;
                    var sy = sun.y + Math.sin(angle) * dist;
                    var sr = r * (0.08 + 0.04 * Math.sin(time * 0.1 + sp));
                    ctx.fillStyle = 'rgba(200,100,30,0.15)';
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Sonnen-Symbol
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold ' + (r * 0.45) + 'px system-ui, sans-serif';
                ctx.shadowColor = 'rgba(255,255,255,0.2)';
                ctx.shadowBlur = 15;
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillText('⟡', sun.x, sun.y - r * 0.05);
                ctx.shadowBlur = 0;

                // Planeten
                for (var pl = 0; pl < planets.length; pl++) {
                    var p2 = planets[pl];
                    p2.angle += p2.speed;
                    var px = p2.cx + Math.cos(p2.angle) * p2.orbit;
                    var py = p2.cy + Math.sin(p2.angle) * p2.orbit;

                    ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([2, 6]);
                    ctx.beginPath();
                    ctx.arc(p2.cx, p2.cy, p2.orbit, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    var pGlow = p2.glow || p2.r * 0.5;
                    ctx.shadowColor = p2.color;
                    ctx.shadowBlur = pGlow * 2;
                    ctx.fillStyle = p2.color;
                    ctx.beginPath();
                    ctx.arc(px, py, p2.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.beginPath();
                    ctx.arc(px - p2.r * 0.2, py - p2.r * 0.2, p2.r * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.font = '5px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(p2.name, px, py + p2.r + 4);

                    if (p2.name === 'Erde') { moon.ex = px;
                        moon.ey = py; }
                }

                // Mond
                if (moon.ex !== undefined) {
                    moon.angle += moon.speed;
                    moon.x = moon.ex + Math.cos(moon.angle) * moon.orbit;
                    moon.y = moon.ey + Math.sin(moon.angle) * moon.orbit;

                    ctx.shadowColor = '#ccc';
                    ctx.shadowBlur = 4;
                    ctx.fillStyle = '#ccc';
                    ctx.beginPath();
                    ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(255,255,255,0.04)';
                    ctx.font = '4px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText('🌙', moon.x, moon.y + moon.r + 2);
                }

                // Uhrzeit
                var now = new Date();
                var timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit',
                    second: '2-digit' });
                ctx.fillStyle = 'rgba(255,255,255,0.03)';
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText('🕐 ' + timeStr, 14, H - 14);

                // Version
                ctx.fillStyle = 'rgba(255,255,255,0.015)';
                ctx.font = '8px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText('HalDo v' + CONFIG.version, W - 14, H - 14);

                requestAnimationFrame(animate);
            }

            animate();

            // Interaktion
            canvas.addEventListener('click', function(e) {
                var rect = canvas.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var dx = x - sun.x,
                    dy = y - sun.y;
                if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 1.8) {
                    launchApp('ai');
                    Notify.info('☀️ HalDo AI geöffnet!');
                }
            });

            canvas.addEventListener('touchstart', function(e) {
                var t = e.touches[0];
                var rect = canvas.getBoundingClientRect();
                var x = t.clientX - rect.left;
                var y = t.clientY - rect.top;
                var dx = x - sun.x,
                    dy = y - sun.y;
                if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 2) {
                    launchApp('ai');
                    Notify.info('☀️ HalDo AI geöffnet!');
                }
            }, { passive: true });

            window.addEventListener('resize', function() {
                for (var rp = 0; rp < planets.length; rp++) {
                    planets[rp].cx = W / 2;
                    planets[rp].cy = H / 2;
                }
                sun.x = W / 2;
                sun.y = H / 2;
            });
        }

                var chat = body.querySelector('#ai-chat');

                var voiceBtn = body.querySelector('#ai-voice-btn');
                var clearBtn = body.querySelector('#ai-clear-btn');

                setTimeout(function() { if (input) input.focus(); }, 100);

                function addMsg(role, text) {
                    var d = document.createElement('div');
                    var isUser = role === 'user';
                    d.style.cssText =
                        'padding:5px 10px;margin:3px 0;border-radius:6px;font-size:0.7rem;word-wrap:break-word;max-width:92%;' +
                        (isUser ?
                            'background:rgba(0,212,255,0.08);text-align:right;margin-left:auto;border-radius:8px 8px 0 8px;' :
                            'background:rgba(123,47,252,0.08);border-radius:8px 8px 8px 0;'
                        );
                    d.textContent = (isUser ? '👤 ' : '🤖 ') + text;
                    chat.appendChild(d);
                    chat.scrollTop = chat.scrollHeight;
                }

                function process(cmd) {
                    if (!cmd.trim()) return;
                    addMsg('user', cmd);
                    var stateEl = document.getElementById('ai-state');
                    if (stateEl) { stateEl.textContent = '🧠 denkt ...';
                        stateEl.style.color = '#ffcc00'; }

                    var cmdResult = AI._parseCommand(cmd);
                    if (cmdResult && cmdResult.action === 'open') {
                        if (state.apps[cmdResult.app]) {
                            launchApp(cmdResult.app);
                            addMsg('ai', '✅ ' + state.apps[cmdResult.app].title + ' wurde geöffnet!');
                            if (stateEl) { stateEl.textContent = '● bereit';
                                stateEl.style.color = '#44ff88'; }
                            return;
                        }
                    }

                    AI.ask(cmd, CONFIG.language).then(function(response) {
                        addMsg('ai', response);
                        if (stateEl) { stateEl.textContent = '● bereit';
                            stateEl.style.color = '#44ff88'; }
                        if (state.settings.voiceEnabled) {
                            Voice.speak(response);
                        }
                    }).catch(function() {
                        var fallback = AI._getFallback(cmd);
                        addMsg('ai', fallback);
                        if (stateEl) { stateEl.textContent = '● bereit';
                            stateEl.style.color = '#44ff88'; }
                    });
                }

                sendBtn.addEventListener('click', function() {
                    var v = input.value.trim();
                    if (v) { process(v);
                        input.value = ''; }
                });

                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        sendBtn.click();
                    }
                });

                body.querySelectorAll('.ai-q').forEach(function(b) {
                    b.addEventListener('click', function() {
                        input.value = b.dataset.cmd;
                        sendBtn.click();
                    });
                });

                if (voiceBtn) {
                    voiceBtn.addEventListener('click', function() { Voice.startListening(); });
                }
                if (clearBtn) {
                    clearBtn.addEventListener('click', function() {
                        AI.clearHistory();
                        chat.innerHTML =
                            '<div style="color:#8899bb;text-align:center;font-size:0.7rem;padding:12px 0;">💬 Chat geleert.</div>';
                    });
                }

                if (AI.conversationHistory.length > 0) {
                    var history = AI.conversationHistory.slice(-10);
                    for (var i = 0; i < history.length; i++) {
                        if (history[i]) addMsg(history[i].role, history[i].content);
                    }
                }
            }
        });
