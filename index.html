<script>
(function () {

    "use strict";


    /* =========================================================
       HALDO APP SYSTEM
       ========================================================= */

    const HalDoAppSystem = {

        version: "20.0.0",

        apps: new Map(),

        windows: new Map(),

        activeAppId: null,

        initialized: false,


        /* =====================================================
           SAFE HELPERS
           ===================================================== */

        log() {

            console.log(
                "[HalDo App System]",
                ...arguments
            );

        },


        warn() {

            console.warn(
                "[HalDo App System]",
                ...arguments
            );

        },


        error() {

            console.error(
                "[HalDo App System]",
                ...arguments
            );

        },


        getElement(id) {

            return document.getElementById(id);

        },


        getKernel() {

            return (
                window.HalDoKernel ||
                window.HalDoOS?.kernel ||
                null
            );

        },


        getSystem() {

            return (
                window.HalDoSystem ||
                window.HalDoOS?.system ||
                null
            );

        },


        getAppManager() {

            return (
                window.HalDoAppManager ||
                window.HalDoOS?.appManager ||
                null
            );

        },


        getAppRegistry() {

            return (
                window.HalDoAppRegistry ||
                window.HalDoOS?.appRegistry ||
                null
            );

        },


        getRouter() {

            return (
                window.HalDoAppRouter ||
                window.HalDoOS?.appRouter ||
                window.HalDoOS?.router ||
                null
            );

        },


        getWindowManager() {

            return (
                window.HalDoWindowManager ||
                window.HalDoOS?.windowManager ||
                null
            );

        },


        /* =====================================================
           NORMALIZE APP
           ===================================================== */

        normalizeApp(app) {

            if (!app) {

                return null;

            }


            if (typeof app === "string") {

                return {

                    id: app,

                    name: app,

                    title: app,

                    version: "1.0.0",

                    status: "registered"

                };

            }


            const normalized = {

                id:
                    app.id ||
                    app.appId ||
                    app.name,

                name:
                    app.name ||
                    app.title ||
                    app.id,

                title:
                    app.title ||
                    app.name ||
                    app.id,

                description:
                    app.description ||
                    "",

                icon:
                    app.icon ||
                    "◈",

                version:
                    app.version ||
                    "1.0.0",

                category:
                    app.category ||
                    "system",

                status:
                    app.status ||
                    "registered",

                module:
                    app.module ||
                    null,

                component:
                    app.component ||
                    null,

                create:
                    app.create ||
                    app.factory ||
                    null,

                mount:
                    app.mount ||
                    null,

                unmount:
                    app.unmount ||
                    null,

                destroy:
                    app.destroy ||
                    null,

                metadata:
                    app.metadata ||
                    {}

            };


            if (!normalized.id) {

                return null;

            }


            return normalized;

        },


        /* =====================================================
           REGISTER APP
           ===================================================== */

        register(app) {

            const normalized =
                this.normalizeApp(app);


            if (!normalized) {

                this.warn(
                    "Ungültige App-Registrierung.",
                    app
                );

                return false;

            }


            if (
                this.apps.has(
                    normalized.id
                )
            ) {

                this.warn(
                    "App bereits registriert:",
                    normalized.id
                );

                return false;

            }


            this.apps.set(
                normalized.id,
                normalized
            );


            this.emit(
                "app:registered",
                normalized
            );


            return true;

        },


        /* =====================================================
           REGISTER OR UPDATE
           ===================================================== */

        registerOrUpdate(app) {

            const normalized =
                this.normalizeApp(app);


            if (!normalized) {

                return false;

            }


            const existing =
                this.apps.get(
                    normalized.id
                );


            if (existing) {

                Object.assign(
                    existing,
                    normalized
                );


                this.emit(
                    "app:updated",
                    existing
                );


                return true;

            }


            return this.register(
                normalized
            );

        },


        /* =====================================================
           UNREGISTER
           ===================================================== */

        unregister(appId) {

            if (
                !this.apps.has(
                    appId
                )
            ) {

                return false;

            }


            if (
                this.activeAppId ===
                appId
            ) {

                this.close(
                    appId
                );

            }


            this.apps.delete(
                appId
            );


            this.emit(
                "app:unregistered",
                appId
            );


            return true;

        },


        /* =====================================================
           GET APP
           ===================================================== */

        get(appId) {

            return (
                this.apps.get(
                    appId
                ) ||
                null
            );

        },


        /* =====================================================
           GET ALL APPS
           ===================================================== */

        getAll() {

            return Array.from(
                this.apps.values()
            );

        },


        /* =====================================================
           APP COUNT
           ===================================================== */

        count() {

            return this.apps.size;

        },


        /* =====================================================
           IMPORT EXISTING REGISTRY
           ===================================================== */

        importRegistry() {

            const registry =
                this.getAppRegistry();


            if (!registry) {

                this.warn(
                    "HalDo App Registry noch nicht verfügbar."
                );

                return 0;

            }


            let source = null;


            try {

                if (
                    typeof registry.getAll ===
                    "function"
                ) {

                    source =
                        registry.getAll();

                } else if (
                    typeof registry.getApps ===
                    "function"
                ) {

                    source =
                        registry.getApps();

                } else if (
                    Array.isArray(
                        registry.apps
                    )
                ) {

                    source =
                        registry.apps;

                }

            } catch (error) {

                this.error(
                    "Registry konnte nicht gelesen werden.",
                    error
                );

            }


            if (!Array.isArray(source)) {

                return 0;

            }


            let imported = 0;


            source.forEach(
                app => {

                    if (
                        this.registerOrUpdate(
                            app
                        )
                    ) {

                        imported++;

                    }

                }
            );


            return imported;

        },


        /* =====================================================
           IMPORT APP MANAGER
           ===================================================== */

        importAppManager() {

            const manager =
                this.getAppManager();


            if (!manager) {

                return 0;

            }


            let source = null;


            try {

                if (
                    typeof manager.getApps ===
                    "function"
                ) {

                    source =
                        manager.getApps();

                } else if (
                    typeof manager.getAllApps ===
                    "function"
                ) {

                    source =
                        manager.getAllApps();

                } else if (
                    Array.isArray(
                        manager.apps
                    )
                ) {

                    source =
                        manager.apps;

                }

            } catch (error) {

                this.error(
                    "App Manager konnte nicht gelesen werden.",
                    error
                );

            }


            if (!Array.isArray(source)) {

                return 0;

            }


            let imported = 0;


            source.forEach(
                app => {

                    if (
                        this.registerOrUpdate(
                            app
                        )
                    ) {

                        imported++;

                    }

                }
            );


            return imported;

        },


        /* =====================================================
           CREATE APP WINDOW
           ===================================================== */

        createWindow(app) {

            const layer =
                this.getElement(
                    "haldo-app-layer"
                );


            if (!layer) {

                this.error(
                    "App-Layer fehlt."
                );

                return null;

            }


            const existing =
                this.windows.get(
                    app.id
                );


            if (existing) {

                this.focusWindow(
                    app.id
                );

                return existing;

            }


            const windowElement =
                document.createElement(
                    "section"
                );


            windowElement.className =
                "haldo-app-window";


            windowElement.dataset.appId =
                app.id;


            windowElement.setAttribute(
                "role",
                "dialog"
            );


            windowElement.setAttribute(
                "aria-label",
                app.title
            );


            windowElement.innerHTML = `

                <div
                    class="haldo-app-window-header"
                >

                    <div
                        class="haldo-app-window-title"
                    >

                        <span
                            class="haldo-app-window-icon"
                        >
                            ${this.escapeHTML(app.icon)}
                        </span>

                        <span>
                            ${this.escapeHTML(app.title)}
                        </span>

                    </div>


                    <div
                        class="haldo-app-window-actions"
                    >

                        <button
                            type="button"
                            data-action="minimize"
                            title="Minimieren"
                            aria-label="Minimieren"
                        >
                            −
                        </button>


                        <button
                            type="button"
                            data-action="maximize"
                            title="Maximieren"
                            aria-label="Maximieren"
                        >
                            □
                        </button>


                        <button
                            type="button"
                            data-action="close"
                            title="Schließen"
                            aria-label="Schließen"
                        >
                            ×
                        </button>

                    </div>

                </div>


                <div
                    class="haldo-app-window-content"
                    data-app-content
                ></div>

            `;


            layer.appendChild(
                windowElement
            );


            this.windows.set(
                app.id,
                windowElement
            );


            this.attachWindowEvents(
                app,
                windowElement
            );


            return windowElement;

        },


        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        escapeHTML(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                String(
                    value ?? ""
                );


            return div.innerHTML;

        },


        /* =====================================================
           ATTACH WINDOW EVENTS
           ===================================================== */

        attachWindowEvents(
            app,
            windowElement
        ) {

            const closeButton =
                windowElement.querySelector(
                    '[data-action="close"]'
                );


            const minimizeButton =
                windowElement.querySelector(
                    '[data-action="minimize"]'
                );


            const maximizeButton =
                windowElement.querySelector(
                    '[data-action="maximize"]'
                );


            if (closeButton) {

                closeButton.addEventListener(
                    "click",
                    () => {

                        this.close(
                            app.id
                        );

                    }
                );

            }


            if (minimizeButton) {

                minimizeButton.addEventListener(
                    "click",
                    () => {

                        this.minimize(
                            app.id
                        );

                    }
                );

            }


            if (maximizeButton) {

                maximizeButton.addEventListener(
                    "click",
                    () => {

                        this.maximize(
                            app.id
                        );

                    }
                );

            }


            windowElement.addEventListener(
                "pointerdown",
                () => {

                    this.focusWindow(
                        app.id
                    );

                }
            );

        },


        /* =====================================================
           OPEN APP
           ===================================================== */

        async open(appId, options = {}) {

            const app =
                this.get(
                    appId
                );


            if (!app) {

                this.warn(
                    "App nicht gefunden:",
                    appId
                );


                this.emit(
                    "app:error",
                    {
                        appId,
                        error:
                            "App nicht registriert."
                    }
                );


                return false;

            }


            let windowElement =
                this.createWindow(
                    app
                );


            if (!windowElement) {

                return false;

            }


            const content =
                windowElement.querySelector(
                    "[data-app-content]"
                );


            try {

                if (
                    typeof app.create ===
                    "function"
                ) {

                    const result =
                        await app.create(
                            content,
                            {
                                app,
                                options,
                                system:
                                    this.getSystem(),
                                kernel:
                                    this.getKernel(),
                                manager:
                                    this.getAppManager()
                            }
                        );


                    if (
                        result instanceof Node
                    ) {

                        content.innerHTML =
                            "";

                        content.appendChild(
                            result
                        );

                    } else if (
                        typeof result ===
                        "string"
                    ) {

                        content.innerHTML =
                            result;

                    }

                } else if (
                    typeof app.mount ===
                    "function"
                ) {

                    await app.mount(
                        content,
                        options
                    );

                } else if (
                    app.component
                ) {

                    if (
                        typeof app.component ===
                        "function"
                    ) {

                        const result =
                            await app.component(
                                content,
                                options
                            );


                        if (
                            result instanceof Node
                        ) {

                            content.innerHTML =
                                "";

                            content.appendChild(
                                result
                            );

                        }

                    } else {

                        content.innerHTML =
                            String(
                                app.component
                            );

                    }

                } else {

                    content.innerHTML = `

                        <div
                            class="haldo-app-empty-state"
                        >

                            <div>
                                ${this.escapeHTML(app.icon)}
                            </div>

                            <h2>
                                ${this.escapeHTML(app.title)}
                            </h2>

                            <p>
                                ${this.escapeHTML(
                                    app.description ||
                                    "Diese App ist registriert und wartet auf ihr internes Modul."
                                )}
                            </p>

                        </div>

                    `;

                }


                app.status =
                    "running";


                this.activeAppId =
                    app.id;


                this.focusWindow(
                    app.id
                );


                this.emit(
                    "app:opened",
                    {
                        app,
                        options
                    }
                );


                this.notify(
                    app.title,
                    "App geöffnet."
                );


                return true;

            } catch (error) {

                app.status =
                    "error";


                this.error(
                    "App konnte nicht geöffnet werden:",
                    app.id,
                    error
                );


                content.innerHTML = `

                    <div
                        class="haldo-app-error"
                    >

                        <h2>
                            ${this.escapeHTML(
                                app.title
                            )}
                        </h2>

                        <p>
                            Die App konnte nicht gestartet werden.
                        </p>

                        <small>
                            ${this.escapeHTML(
                                error?.message ||
                                String(error)
                            )}
                        </small>

                    </div>

                `;


                this.emit(
                    "app:error",
                    {
                        appId: app.id,
                        error
                    }
                );


                return false;

            }

        },


        /* =====================================================
           CLOSE APP
           ===================================================== */

        async close(appId) {

            const app =
                this.get(
                    appId
                );


            const windowElement =
                this.windows.get(
                    appId
                );


            if (
                app &&
                typeof app.unmount ===
                "function"
            ) {

                try {

                    await app.unmount();

                } catch (error) {

                    this.warn(
                        "App unmount Fehler:",
                        error
                    );

                }

            }


            if (
                app &&
                typeof app.destroy ===
                "function"
            ) {

                try {

                    await app.destroy();

                } catch (error) {

                    this.warn(
                        "App destroy Fehler:",
                        error
                    );

                }

            }


            if (windowElement) {

                windowElement.remove();

            }


            this.windows.delete(
                appId
            );


            if (
                app
            ) {

                app.status =
                    "registered";

            }


            if (
                this.activeAppId ===
                appId
            ) {

                this.activeAppId =
                    null;

            }


            this.emit(
                "app:closed",
                appId
            );


            return true;

        },


        /* =====================================================
           MINIMIZE
           ===================================================== */

        minimize(appId) {

            const element =
                this.windows.get(
                    appId
                );


            if (!element) {

                return false;

            }


            element.classList.toggle(
                "is-minimized"
            );


            this.emit(
                "app:minimized",
                appId
            );


            return true;

        },


        /* =====================================================
           MAXIMIZE
           ===================================================== */

        maximize(appId) {

            const element =
                this.windows.get(
                    appId
                );


            if (!element) {

                return false;

            }


            element.classList.toggle(
                "is-maximized"
            );


            this.focusWindow(
                appId
            );


            this.emit(
                "app:maximized",
                appId
            );


            return true;

        },


        /* =====================================================
           FOCUS
           ===================================================== */

        focusWindow(appId) {

            const target =
                this.windows.get(
                    appId
                );


            if (!target) {

                return false;

            }


            this.windows.forEach(
                (element, id) => {

                    element.classList.toggle(
                        "is-active",
                        id === appId
                    );

                }
            );


            target.classList.remove(
                "is-minimized"
            );


            target.style.zIndex =
                String(
                    Date.now()
                );


            this.activeAppId =
                appId;


            this.emit(
                "app:focused",
                appId
            );


            return true;

        },


        /* =====================================================
           CLOSE ALL
           ===================================================== */

        async closeAll() {

            const ids =
                Array.from(
                    this.windows.keys()
                );


            for (
                const id of ids
            ) {

                await this.close(
                    id
                );

            }


            this.activeAppId =
                null;

        },


        /* =====================================================
           EVENT SYSTEM
           ===================================================== */

        emit(
            eventName,
            detail
        ) {

            try {

                window.dispatchEvent(
                    new CustomEvent(
                        "haldo:" + eventName,
                        {
                            detail
                        }
                    )
                );

            } catch (error) {

                this.warn(
                    "Event konnte nicht ausgelöst werden.",
                    error
                );

            }


            const kernel =
                this.getKernel();


            if (
                kernel &&
                typeof kernel.emit ===
                "function"
            ) {

                try {

                    kernel.emit(
                        eventName,
                        detail
                    );

                } catch (error) {

                    this.warn(
                        "Kernel Event Fehler:",
                        error
                    );

                }

            }

        },


        /* =====================================================
           NOTIFICATION
           ===================================================== */

        notify(
            title,
            message
        ) {

            if (
                window.HalDoUI &&
                typeof window.HalDoUI.notify ===
                "function"
            ) {

                try {

                    window.HalDoUI.notify(
                        title,
                        message
                    );

                    return;

                } catch (error) {

                    this.warn(
                        "UI Notification Fehler:",
                        error
                    );

                }

            }


            this.log(
                title + ":",
                message
            );

        },


        /* =====================================================
           CONNECT ROUTER
           ===================================================== */

        connectRouter() {

            const router =
                this.getRouter();


            if (!router) {

                return;

            }


            try {

                if (
                    typeof router.registerHandler ===
                    "function"
                ) {

                    router.registerHandler(
                        "app",
                        async appId => {

                            return this.open(
                                appId
                            );

                        }
                    );

                }

            } catch (error) {

                this.warn(
                    "Router-Verbindung fehlgeschlagen.",
                    error
                );

            }

        },


        /* =====================================================
           CONNECT WINDOW MANAGER
           ===================================================== */

        connectWindowManager() {

            const manager =
                this.getWindowManager();


            if (!manager) {

                return;

            }


            this.log(
                "Window Manager erkannt."
            );

        },


        /* =====================================================
           INITIALIZE
           ===================================================== */

        initialize() {

            if (
                this.initialized
            ) {

                return;

            }


            this.initialized =
                true;


            const registryCount =
                this.importRegistry();


            const managerCount =
                this.importAppManager();


            this.connectRouter();

            this.connectWindowManager();


            this.emit(
                "app-system:ready",
                {
                    version:
                        this.version,

                    apps:
                        this.count(),

                    registryImported:
                        registryCount,

                    managerImported:
                        managerCount
                }
            );


            this.log(
                "App-System bereit.",
                this.count(),
                "Apps erkannt."
            );

        }

    };


    /* =========================================================
       GLOBAL API
       ========================================================= */

    window.HalDoAppSystem =
        HalDoAppSystem;


    if (!window.HalDoOS) {

        window.HalDoOS = {};

    }


    window.HalDoOS.appSystem =
        HalDoAppSystem;


    /* =========================================================
       CSS FOR APP WINDOWS
       ========================================================= */

    const style =
        document.createElement(
            "style"
        );


    style.id =
        "haldo-app-system-style";


    style.textContent = `

        .haldo-app-window {

            position:
                absolute;

            left:
                5%;

            top:
                5%;

            width:
                min(90%, 900px);

            height:
                min(90%, 680px);

            display:
                flex;

            flex-direction:
                column;

            overflow:
                hidden;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius:
                18px;

            background:
                rgba(8,12,22,0.96);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.55);

            backdrop-filter:
                blur(24px);

            -webkit-backdrop-filter:
                blur(24px);

            transform:
                translateZ(0);

        }


        .haldo-app-window.is-maximized {

            left:
                12px;

            top:
                12px;

            width:
                calc(100% - 24px);

            height:
                calc(100% - 24px);

        }


        .haldo-app-window.is-minimized {

            display:
                none;

        }


        .haldo-app-window-header {

            min-height:
                52px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                12px;

            padding:
                8px 10px 8px 16px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.025);

        }


        .haldo-app-window-title {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            min-width:
                0;

            font-size:
                13px;

            font-weight:
                700;

        }


        .haldo-app-window-icon {

            display:
                grid;

            place-items:
                center;

            width:
                30px;

            height:
                30px;

            border-radius:
                9px;

            background:
                rgba(66,230,255,0.08);

            color:
                #42e6ff;

        }


        .haldo-app-window-actions {

            display:
                flex;

            gap:
                5px;

        }


        .haldo-app-window-actions button {

            width:
                32px;

            height:
                32px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius:
                9px;

            color:
                rgba(255,255,255,0.68);

            background:
                rgba(255,255,255,0.035);

        }


        .haldo-app-window-actions button:hover {

            color:
                #fff;

            background:
                rgba(255,255,255,0.08);

        }


        .haldo-app-window-content {

            flex:
                1;

            min-height:
                0;

            overflow:
                auto;

        }


        .haldo-app-empty-state,
        .haldo-app-error {

            min-height:
                100%;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            padding:
                30px;

            text-align:
                center;

        }


        .haldo-app-empty-state > div {

            font-size:
                42px;

            color:
                #42e6ff;

            margin-bottom:
                15px;

        }


        .haldo-app-empty-state h2,
        .haldo-app-error h2 {

            margin:
                0;

        }


        .haldo-app-empty-state p,
        .haldo-app-error p {

            max-width:
                520px;

            color:
                rgba(255,255,255,0.62);

            line-height:
                1.6;

        }


        .haldo-app-error {

            color:
                #ff6b81;

        }


        .haldo-app-error small {

            max-width:
                700px;

            color:
                rgba(255,255,255,0.48);

            word-break:
                break-word;

        }


        @media (max-width: 720px) {

            .haldo-app-window {

                left:
                    8px;

                top:
                    8px;

                width:
                    calc(100% - 16px);

                height:
                    calc(100% - 16px);

                border-radius:
                    15px;

            }

        }

    `;


    document.head.appendChild(
        style
    );


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    function initializeHalDoAppSystem() {

        HalDoAppSystem.initialize();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeHalDoAppSystem,
            {
                once: true
            }
        );

    } else {

        initializeHalDoAppSystem();

    }


})();

<script>
(function () {

    "use strict";


    /* =========================================================
       WAIT FOR APP SYSTEM
       ========================================================= */

        return (
            window.HalDoAppSystem ||
            window.HalDoOS?.appSystem ||
            null
        );

    }


    /* =========================================================
       HALDO APP CATALOG
       ========================================================= */

    const HalDoAppCatalog = {

        version: "20.0.0",

        definitions: {},


        /* =====================================================
           ADD DEFINITION
           ===================================================== */

        add(definition) {

            if (
                !definition ||
                !definition.id
            ) {

                return false;

            }


            this.definitions[
                definition.id
            ] = {

                id:
                    definition.id,

                name:
                    definition.name ||
                    definition.title ||
                    definition.id,

                title:
                    definition.title ||
                    definition.name ||
                    definition.id,

                icon:
                    definition.icon ||
                    "◈",

                category:
                    definition.category ||
                    "system",

                description:
                    definition.description ||
                    "",

                version:
                    definition.version ||
                    "1.0.0",

                status:
                    definition.status ||
                    "available",

                keywords:
                    Array.isArray(
                        definition.keywords
                    )
                        ? definition.keywords
                        : [],

                permissions:
                    Array.isArray(
                        definition.permissions
                    )
                        ? definition.permissions
                        : [],

                create:
                    definition.create ||
                    null,

                metadata:
                    definition.metadata ||
                    {}

            };


            return true;

        },


        /* =====================================================
           GET
           ===================================================== */

        get(id) {

            return (
                this.definitions[id] ||
                null
            );

        },


        /* =====================================================
           GET ALL
           ===================================================== */

        getAll() {

            return Object.values(
                this.definitions
            );

        },


        /* =====================================================
           SEARCH
           ===================================================== */

        search(query) {

            const value =
                String(
                    query || ""
                )
                .trim()
                .toLowerCase();


            if (!value) {

                return this.getAll();

            }


            return this.getAll()
                .filter(
                    app => {

                        const haystack =
                            [

                                app.id,

                                app.name,

                                app.title,

                                app.category,

                                app.description,

                                ...app.keywords

                            ]
                            .join(" ")
                            .toLowerCase();


                        return haystack.includes(
                            value
                        );

                    }
                );

        }

    };

        {

                "Webzugriff innerhalb der HalDo Umgebung.",

            keywords:
                [

                ]

<script>
(function () {

    "use strict";


    /* =========================================================
       HALDO APP RUNTIME
       ========================================================= */

    const HalDoAppRuntime = {

        version: "20.0.0",

        instances: new Map(),

        state: new Map(),

        listeners: new Map(),


        /* =====================================================
           EVENT SYSTEM
           ===================================================== */

        on(
            eventName,
            callback
        ) {

            if (
                typeof callback !==
                "function"
            ) {

                return () => {};

            }


            if (
                !this.listeners.has(
                    eventName
                )
            ) {

                this.listeners.set(
                    eventName,
                    new Set()
                );

            }


            this.listeners
                .get(eventName)
                .add(callback);


            return () => {

                this.off(
                    eventName,
                    callback
                );

            };

        },


        off(
            eventName,
            callback
        ) {

            const listeners =
                this.listeners.get(
                    eventName
                );


            if (!listeners) {

                return;

            }


            listeners.delete(
                callback
            );

        },


        emit(
            eventName,
            detail = {}
        ) {

            const listeners =
                this.listeners.get(
                    eventName
                );


            if (!listeners) {

                return;

            }


            listeners.forEach(
                callback => {

                    try {

                        callback(
                            detail
                        );

                    } catch (error) {

                        console.error(
                            "[HalDo App Runtime]",
                            eventName,
                            error
                        );

                    }

                }
            );

        },


        /* =====================================================
           APP STATE
           ===================================================== */

        getState(
            appId
        ) {

            if (
                !this.state.has(
                    appId
                )
            ) {

                this.state.set(
                    appId,
                    {}
                );

            }


            return this.state.get(
                appId
            );

        },


        setState(
            appId,
            patch = {}
        ) {

            const current =
                this.getState(
                    appId
                );


            Object.assign(
                current,
                patch
            );


            this.emit(
                "state:changed",
                {
                    appId,
                    state: current
                }
            );


            return current;

        },


        /* =====================================================
           INSTANCE MANAGEMENT
           ===================================================== */

        registerInstance(
            appId,
            instance
        ) {

            if (
                !appId ||
                !instance
            ) {

                return false;

            }


            this.instances.set(
                appId,
                instance
            );


            this.emit(
                "app:instance-registered",
                {
                    appId,
                    instance
                }
            );


            return true;

        },


        getInstance(
            appId
        ) {

            return (
                this.instances.get(
                    appId
                ) ||
                null
            );

        },


        removeInstance(
            appId
        ) {

            const removed =
                this.instances.delete(
                    appId
                );


            if (removed) {

                this.emit(
                    "app:instance-removed",
                    {
                        appId
                    }
                );

            }


            return removed;

        }

    };


    /* =========================================================
       APP STORAGE
       ========================================================= */

    const HalDoAppStorage = {

        prefix:
            "haldo-os20-app:",


        getKey(
            appId
        ) {

            return (
                this.prefix +
                String(appId)
            );

        },


        read(
            appId,
            fallback = {}
        ) {

            try {

                const raw =
                    localStorage.getItem(
                        this.getKey(
                            appId
                        )
                    );


                if (!raw) {

                    return fallback;

                }


                const parsed =
                    JSON.parse(
                        raw
                    );


                return (
                    parsed &&
                    typeof parsed ===
                    "object"
                )
                    ? parsed
                    : fallback;

            } catch (error) {

                console.warn(
                    "[HalDo App Storage] Lesen fehlgeschlagen:",
                    appId,
                    error
                );


                return fallback;

            }

        },


        write(
            appId,
            value
        ) {

            try {

                localStorage.setItem(
                    this.getKey(
                        appId
                    ),
                    JSON.stringify(
                        value
                    )
                );


                return true;

            } catch (error) {

                console.error(
                    "[HalDo App Storage] Speichern fehlgeschlagen:",
                    appId,
                    error
                );


                return false;

            }

        },


        remove(
            appId
        ) {

            try {

                localStorage.removeItem(
                    this.getKey(
                        appId
                    )
                );


                return true;

            } catch (error) {

                console.warn(
                    "[HalDo App Storage] Löschen fehlgeschlagen:",
                    appId,
                    error
                );


                return false;

            }

        }

    };


    /* =========================================================
       COMMON APP UI
       ========================================================= */

    function escapeHTML(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    function createElement(
        html
    ) {

        const template =
            document.createElement(
                "template"
            );


        template.innerHTML =
            String(
                html || ""
            ).trim();


        return (
            template.content.firstElementChild

    }


    function getAppLayer() {

        return document.getElementById(

    }


    /* =========================================================

    class HalDoBaseApp {

        constructor(

                    {}

            Object.assign(
                this.state,
                saved
            );

        }


        /* =====================================================
           ROOT
           ===================================================== */

        createRoot() {

            const root =
                document.createElement(
                    "section"

            root.className =
                "haldo-runtime-app";

                <div

            return root;

        }


        /* =====================================================
           MOUNT
           ===================================================== */

        mount(
            container
        ) {

            if (
                this.mounted
            ) {

                return this.root;

            }


            if (!container) {

                throw new Error(
                    "App-Container fehlt."
                );

            }


            this.root =
                this.createRoot();

                this.root
            );

            this.destroyed =
                false;

                    this.id,
                    this
                );


            this.emit(
                "mounted"
            );


            return this.root;

        }


        /* =====================================================
           COMMON EVENTS
           ===================================================== */

        bindCommonEvents() {

            if (!this.root) {

                return;

            const closeButton =

            if (
                closeButton

                        );

                    }
                );

        }


        /* =====================================================
           RENDER
           ===================================================== */

        render() {

            const content =

                    "[data-app-content]"

        /* =====================================================

        setState(

            this.state =

                    this.id,
                    patch
                );

                this.id,
                this.state
            );


            this.render();


            return this.state;

        }


        /* =====================================================
           EVENT HELPERS
           ===================================================== */

        emit(
            eventName,
            detail = {}
        ) {

            HalDoAppRuntime.emit(
                `app:${this.id}:${eventName}`,

                    app: this,

        /* =====================================================
           CLOSE
           ===================================================== */

        close() {

            const launcher =
                window.HalDoAppLauncher;


            if (
                launcher &&
                typeof launcher.close ===
                "function"
            ) {

                return launcher.close(

            }


            this.unmount();

            return true;

        }


        /* =====================================================
           UNMOUNT
           ===================================================== */

        unmount() {

            if (
                !this.mounted
            ) {

                return false;

            }


            this.unsubscribe
                .splice(0)
                .forEach(
                    cleanup => {

                        try {

                            cleanup();

                        } catch (error) {

                            console.warn(
                                "[HalDo App]",
                                error
                            );

                        }

                    }
                );


            if (
                this.root
            ) {

                this.root.remove();

            }


            this.mounted =
                false;

            this.destroyed =
                true;


            HalDoAppRuntime
                .removeInstance(
                    this.id
                );


            this.emit(
                "unmounted"
            );


            return true;

        }


        /* =====================================================
           DESTROY
           ===================================================== */

        destroy() {

            return this.unmount();

        }

    }


    /* =========================================================

                        ) {

                            ) {

                            }

                            value =
                                value[part];

    <script>
    (function () {

        "use strict";

        const HalDoIntegration = {

            version: "20.0.0",

            connected: false,

            modules: {},

            events: {},


            /* =====================================================
               EVENT SYSTEM
               ===================================================== */

            on(name, callback) {

                if (typeof callback !== "function") {
                    return () => {};
                }

                if (!this.events[name]) {
                    this.events[name] = [];
                }

                this.events[name].push(callback);

                return () => {
                    this.off(name, callback);
                };
            },


            off(name, callback) {

                if (!this.events[name]) {
                    return;
                }

                this.events[name] =
                    this.events[name].filter(
                        fn => fn !== callback
                    );
            },


            emit(name, detail) {

                const listeners =
                    this.events[name] || [];

                listeners.forEach(
                    callback => {

                        try {

                            callback(detail);

                        } catch (error) {

                            console.error(
                                "[HalDo Integration]",
                                error
                            );

                        }

                    }
                );

                window.dispatchEvent(
                    new CustomEvent(
                        "haldo:integration:" + name,
                        {
                            detail
                        }
                    )
                );

            },


            /* =====================================================
               MODULE DISCOVERY
               ===================================================== */

            discover() {

                const sources = {

                    kernel:
                        window.HalDoKernel ||
                        window.HalDoOS?.kernel ||
                        null,

                    system:
                        window.HalDoSystem ||
                        window.HalDoOS?.system ||
                        null,

                    appManager:
                        window.HalDoAppManager ||
                        window.HalDoOS?.appManager ||
                        null,

                    appRouter:
                        window.HalDoAppRouter ||
                        window.HalDoOS?.appRouter ||
                        null,

                    launcher:
                        window.HalDoLauncher ||
                        window.HalDoOS?.launcher ||
                        null,

                    windowManager:
                        window.HalDoWindowManager ||
                        window.HalDoOS?.windowManager ||
                        null,

                    storage:
                        window.HalDoStorage ||
                        window.HalDoOS?.storage ||
                        null,

                    storageManager:
                        window.HalDoStorageManager ||
                        window.HalDoOS?.storageManager ||
                        null,

                    config:
                        window.HalDoConfigManager ||
                        window.HalDoOS?.configManager ||
                        null,

                    language:
                        window.HalDoLanguage ||
                        window.HalDoOS?.language ||
                        null,

                    ai:
                        window.HalDoAI ||
                        window.HalDoOS?.ai ||
                        null,

                    voice:
                        window.HalDoVoice ||
                        window.HalDoOS?.voice ||
                        null,

                    keyboard:
                        window.HalDoEzidiKeyboard ||
                        window.HalDoOS?.ezidiKeyboard ||
                        null

                };


                this.modules =
                    sources;

                return sources;

            },


            /* =====================================================
               CONNECTION TEST
               ===================================================== */

            connect() {

                this.discover();

                let count = 0;

                Object.keys(this.modules)
                    .forEach(
                        key => {

                            if (
                                this.modules[key]
                            ) {

                                count++;

                            }

                        }
                    );


                this.connected =
                    count > 0;


                this.emit(
                    "connected",
                    {
                        connected:
                            this.connected,

                        moduleCount:
                            count,

                        modules:
                            this.modules
                    }

                return this.connected;

               SAFE MODULE ACCESS

            get(name) {

                    this.modules &&
                    this.modules[name]

                }

                this.discover();

                return this.modules[name] || null;

            },


            has(name) {

                return !!this.get(name);

            },


            /* =====================================================
               SAFE METHOD CALL
               ===================================================== */

            call(
                moduleName,
                methodName,
                ...args
            ) {

                const module =
                    this.get(moduleName);


                if (!module) {

                    return {
                        success: false,
                        reason:
                            "module-not-available"
                    };

                }


                if (
                    typeof module[methodName] !==
                    "function"
                ) {

                    return {
                        success: false,
                        reason:
                            "method-not-available"
                    };

                }


                try {

                    const result =
                        module[methodName](...args);


                    if (
                        result &&
                        typeof result.then ===
                        "function"
                    ) {

                        return result
                            .then(
                                value => ({
                                    success: true,
                                    value
                                })

                            .catch(

                                    console.error(

                                    );

                                    return {
                                        success: false,
                                        reason:
                                            "execution-error",
                                        error

                    return {
                        success: true,
                        value: result

                    return {
                        success: false,
                        reason:
                            "execution-error",
                        error

            /* =====================================================
               SYSTEM STATUS
               ===================================================== */

            getStatus() {

                this.discover();

                const status = {};


                Object.keys(this.modules)
                    .forEach(
                        name => {

                            status[name] =
                                !!this.modules[name];

                        }
                    );

                    navigator.onLine;


                status.version =
                    this.version;


                status.connected =
                    this.connected;

            /* =====================================================

            connectKernel() {

                const kernel =
                    this.get("kernel");

                        "kernel:error",
                        payload => {

                        "[HalDo Integration]",
                        error

                }

            /* =====================================================
               SYSTEM CONNECTION

            connectSystem() {

                const system =
                    this.get("system");


                if (!system) {

                    return false;

                }


                this.emit(
                    "system-discovered",
                    {
                        system
                    }
                );


                return true;

            },


            /* =====================================================
               APP CONNECTION

            connectApps() {

                const manager =
                    this.get("appManager");


                const router =
                    this.get("appRouter");


                const launcher =
                    this.get("launcher");


                this.emit(
                    "apps-discovered",

                        manager,
                        router,
                        launcher

                    router ||

               AI CONNECTION

            connectAI() {

                const ai =
                    this.get("ai");


                if (!ai) {

                    definition.id
                )
            );

        }


        if (
            moduleRegistry.pending.has(

            )

            );

<script>
(function () {

    "use strict";


    /* =====================================================
       HALDO GLOBAL OBJECT
       ===================================================== */

    if (!window.HalDoOS) {
        window.HalDoOS = {};
    }


    /* =====================================================
       EVENT BUS
       ===================================================== */

    const listeners =
        new Map();


    function on(
        eventName,
        callback
    ) {

        if (
            typeof callback !==
            "function"
        ) {
            return () => {};
        }


        if (
            !listeners.has(
                eventName
            )
        ) {

            listeners.set(
                eventName,
                new Set()
            );

        }


        const callbacks =
            listeners.get(
                eventName
            );


        callbacks.add(
            callback
        );


        return () => {

            callbacks.delete(
                callback
            );

        };

    }


    function off(
        eventName,
        callback
    ) {

        const callbacks =
            listeners.get(
                eventName
            );


        if (!callbacks) {
            return;
        }


        callbacks.delete(
            callback
        );


        if (
            callbacks.size ===
            0
        ) {

            listeners.delete(
                eventName
            );

        }

    }


    function emit(
        eventName,
        detail = {}
    ) {

        const callbacks =
            listeners.get(
                eventName
            );


        if (callbacks) {

            callbacks.forEach(
                callback => {

                    try {

                        callback(
                            detail
                        );

                    } catch (error) {

                        console.error(
                            "[HalDo EventBus]",
                            eventName,
                            error
                        );

                    }

                }
            );

        }


        /*
         * Zusätzliches DOM-Event.
         * Dadurch können externe Module,
         * Apps und UI-Komponenten ebenfalls
         * auf HalDo-Ereignisse reagieren.
         */

        try {

            window.dispatchEvent(
                new CustomEvent(
                    "haldo:" + eventName,
                    {
                        detail
                    }
                )
            );

        } catch (error) {

            console.warn(
                "[HalDo EventBus] DOM Event Fehler:",
                error
            );

        }


        return true;

    }


    function once(
        eventName,
        callback
    ) {

        let unsubscribe;


        const handler =
            detail => {

                if (unsubscribe) {
                    unsubscribe();
                }


                callback(
                    detail
                );

            };


        unsubscribe =
            on(
                eventName,
                handler
            );


        return unsubscribe;

    }


    /* =====================================================
       CHANNEL SYSTEM
       ===================================================== */

    const channels =
        new Map();


    function createChannel(
        channelName
    ) {

        if (
            !channels.has(
                channelName
            )
        ) {

            channels.set(
                channelName,
                new Set()
            );

        }


        return {

            name:
                channelName,


            subscribe(
                callback
            ) {

                const subscribers =
                    channels.get(
                        channelName
                    );


                if (
                    typeof callback ===
                    "function"
                ) {

                    subscribers.add(
                        callback
                    );

                }


                return () => {

                    subscribers.delete(
                        callback
                    );

                };

            },


            publish(
                data = {}
            ) {

                const subscribers =
                    channels.get(
                        channelName
                    );


                subscribers.forEach(
                    callback => {

                        try {

                            callback(
                                data
                            );

                        } catch (error) {

                            console.error(
                                "[HalDo Channel]",
                                channelName,
                                error
                            );

                        }

                    }
                );


                emit(
                    "channel:" +
                    channelName,
                    data
                );

            },


            clear() {

                const subscribers =
                    channels.get(
                        channelName
                    );


                if (subscribers) {
                    subscribers.clear();
                }

            }

        };

    }


    /* =====================================================
       STANDARD HALDO CHANNELS
       ===================================================== */

    const systemChannel =
        createChannel(
            "system"
        );


    const appChannel =
        createChannel(
            "apps"
        );


    const aiChannel =
        createChannel(
            "ai"
        );


    const storageChannel =
        createChannel(
            "storage"
        );


    const windowChannel =
        createChannel(
            "windows"
        );


    const notificationChannel =
        createChannel(
            "notifications"
        );


    /* =====================================================
       MODULE LOOKUP
       ===================================================== */

    function getKernel() {

        return (
            window.HalDoKernel ||
            window.HalDoOS?.kernel ||
            null
        );

    }


    function getSystem() {

        return (
            window.HalDoSystem ||
            window.HalDoOS?.system ||
            null
        );

    }


    function getAppManager() {

        return (
            window.HalDoAppManager ||
            window.HalDoOS?.appManager ||
            null
        );

    }


    function getAppRouter() {

        return (
            window.HalDoAppRouter ||
            window.HalDoOS?.appRouter ||
            null
        );

    }


    function getWindowManager() {

        return (
            window.HalDoWindowManager ||
            window.HalDoOS?.windowManager ||
            null
        );

    }


    function getStorage() {

        return (
            window.HalDoStorage ||
            window.HalDoOS?.storage ||
            null
        );

    }


    function getAI() {

        return (
            window.HalDoAI ||
            window.HalDoOS?.ai ||
            window.HalDoAIEngine ||
            window.HalDoOS?.aiEngine ||
            null
        );

    }


    /* =====================================================
       MODULE STATUS
       ===================================================== */

    function getModuleStatus() {

        const modules =
            window.HalDoOS.modules;


        return {

            kernel:
                !!getKernel(),

            system:
                !!getSystem(),

            appManager:
                !!getAppManager(),

            appRouter:
                !!getAppRouter(),

            windowManager:
                !!getWindowManager(),

            storage:
                !!getStorage(),

            ai:
                !!getAI(),

            ui:
                !!window.HalDoUI

        };

    }


    /* =====================================================
       SYSTEM COMMAND BRIDGE
       ===================================================== */

    async function systemCommand(
        command,
        payload = {}
    ) {

        const kernel =
            getKernel();


        const system =
            getSystem();


        const detail = {

            command,
            payload,

            timestamp:
                Date.now(),

            source:
                "HalDoOS.communication"

        };


        emit(
            "system:command",
            detail
        );


        systemChannel.publish(
            detail
        );


        /*
         * Bereits vorhandene Kernel-APIs
         * werden bevorzugt verwendet.
         */

        if (
            kernel &&
            typeof kernel.emit ===
            "function"
        ) {

            try {

                kernel.emit(
                    "system:command",
                    detail
                );

            } catch (error) {

                console.warn(
                    "[HalDo Bridge]",
                    error
                );

            }

        }


        if (
            system &&
            typeof system.handleCommand ===
            "function"
        ) {

            try {

                return await system.handleCommand(
                    command,
                    payload
                );

            } catch (error) {

                console.error(
                    "[HalDo System Command]",
                    error
                );

            }

        }


        return {

            success:
                false,

            command,

            message:
                "Kein direktes System-Command-Interface verfügbar."

        };

    }


    /* =====================================================
       APP COMMAND BRIDGE
       ===================================================== */

    async function appCommand(
        command,
        payload = {}
    ) {

        const detail = {

            command,
            payload,

            timestamp:
                Date.now(),

            source:
                "HalDoOS.communication"

        };


        emit(
            "app:command",
            detail
        );


        appChannel.publish(
            detail
        );


        const manager =
            getAppManager();


        if (!manager) {

            return {

                success:
                    false,

                command,

                message:
                    "App Manager ist momentan nicht verfügbar."

            };

        }


        try {

            if (
                command ===
                "open" &&
                typeof manager.openApp ===
                "function"
            ) {

                return await manager.openApp(
                    payload.appId ||
                    payload.id
                );

            }


            if (
                command ===
                "close" &&
                typeof manager.closeApp ===
                "function"
            ) {

                return await manager.closeApp(
                    payload.appId ||
                    payload.id
                );

            }


            if (
                command ===
                "launch" &&
                typeof manager.launchApp ===
                "function"
            ) {

                return await manager.launchApp(
                    payload.appId ||
                    payload.id,
                    payload
                );

            }


            if (
                typeof manager.handleCommand ===
                "function"
            ) {

                return await manager.handleCommand(
                    command,
                    payload
                );

            }

        } catch (error) {

            console.error(
                "[HalDo App Command]",
                error
            );


            return {

                success:
                    false,

                error:
                    error.message,

                command

            };

        }


        return {

            success:
                false,

            command,

            message:
                "Der App Manager besitzt keine passende Command-API."

        };

    }


    /* =====================================================
       AI COMMAND BRIDGE

    async function aiCommand(
        command,
