                        false,

                    maximized:
                        false,

                    closed:
                        true,


                    open() {

                        this.opened =
                            true;

                        this.closed =
                            false;

                        this.active =
                            true;

                        this.minimized =
                            false;

                        HD.emit(
                            "app:opened",
                            {
                                app:
                                    this
                            }
                        );

                        return this;

                    },


                    close() {

                        this.opened =
                            false;

                        this.closed =
                            true;

                        this.active =
                            false;

                        HD.appState.save(
                            this.id,
                            this.state
                        );

                        HD.emit(
                            "app:closed",
                            {
                                app:
                                    this
                            }
                        );

                        return this;

                    },


                    minimize() {

                        this.minimized =
                            true;

                        this.active =
                            false;

                    },


                    restore() {

                        this.minimized =
                            false;

                        this.active =
                            true;

                        this.opened =
                            true;

                        this.closed =
                            false;

                    },


                    maximize() {

                        this.maximized =
                            true;

                    },


                    setState(
                        key,
                        value
                    ) {

                        this.state =
                            this.state ||
                            {};

                        this.state[key] =
                            value;

                        HD.appState.save(
                            this.id,
                            this.state
                        );

                        HD.emit(
                            "app:state-change",
                            {
                                app:
                                    this,

                                key,

                                value
                            }
                        );

                    }

                };


                this.instances.set(
                    appId,
                    instance
                );

                HD.appRuntime.instances.set(
                    appId,
                    instance
                );


                return instance;

            },


            open(
                appId
            ) {

                const instance =
                    this.create(
                        appId
                    );

                if (!instance) {

                    return null;

                }


                instance.open();


                const record =
                    HD.windowManager.open(
                        instance
                    );


                HD.emit(
                    "app:open",
                    {
                        app:
                            instance,

                        window:
                            record
                    }
                );


                return instance;

            },


            close(
                appId
            ) {

                const instance =
                    this.get(
                        appId
                    );


                if (!instance) {

                    return false;

                }


                instance.close();


                HD.windowManager.close(
                    appId
                );


                return true;

            },


            minimize(
                appId
            ) {

                const instance =
                    this.get(
                        appId
                    );

                if (!instance) {

                    return false;

                }

                instance.minimize();

                HD.windowManager.minimize(
                    appId
                );

                return true;

            },


            restore(
                appId
            ) {

                const instance =
                    this.get(
                        appId
                    );

                if (!instance) {

                    return false;

                }

                instance.restore();

                HD.windowManager.restore(
                    appId
                );

                return true;

            },


            maximize(
                appId
            ) {

                const instance =
                    this.get(
                        appId
                    );

                if (!instance) {

                    return false;

                }

                instance.maximize();

                HD.windowManager.maximize(
                    appId
                );

                return true;

            }

        };


    HD.runtime.register(
        "app-manager",
        HD.appManager
    );


    /* ========================================================
       MENU
       ======================================================== */

    const menuButton =
        document.getElementById(
            "menu-button"
        );

    const menu =
        document.getElementById(
            "app-menu"
        );

    const menuList =
        document.getElementById(
            "app-menu-list"
        );

    const search =
        document.getElementById(
            "app-search"
        );


    function renderMenu(
        filter = ""
    ) {

        const normalized =
            filter
                .toLowerCase()
                .trim();


        menuList.innerHTML =
            "";


        HD.appRegistry
            .all()
            .filter(
                app => {

                    if (!normalized) {

                        return true;

                    }

                    return (
                        app.name
                            .toLowerCase()
                            .includes(
                                normalized
                            ) ||

                        app.category
                            .toLowerCase()
                            .includes(
                                normalized
                            )
                    );

                }
            )
            .forEach(
                app => {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.type =
                        "button";

                    button.className =
                        "app-menu-item";


                    button.innerHTML = `
                        <span class="app-menu-icon">
                            ${app.icon}
                        </span>

                        <span class="app-menu-text">

                            <span class="app-menu-name">
                                ${escapeHTML(
                                    app.name
                                )}
                            </span>

                            <span class="app-menu-category">
                                ${escapeHTML(
                                    app.category
                                )}
                            </span>

                        </span>
                    `;


                    button.addEventListener(
                        "click",
                        () => {

                            HD.appManager.open(
                                app.id
                            );

                            menu.classList
                                .remove(
                                    "open"
                                );

                        }
                    );


                    menuList.appendChild(
                        button
                    );

                }
            );

    }


    function escapeHTML(
        value
    ) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    menuButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            menu.classList.toggle(
                "open"
            );

            if (
                menu.classList.contains(
                    "open"
                )
            ) {

                search.focus();

            }

        }
    );


    menu.addEventListener(
        "click",
        event => {

            event.stopPropagation();

        }
    );


    document.addEventListener(
        "click",
        () => {

            menu.classList.remove(
                "open"
            );

        }
    );


    search.addEventListener(
        "input",
        () => {

            renderMenu(
                search.value
            );

        }
    );


    renderMenu();


    /* ========================================================
       CENTRAL AI BUTTON
       ======================================================== */

    const aiButtons = [

        document.getElementById(
            "sun-ai-button"
        ),

        document.getElementById(
            "center-ai-button"
        )

    ];


    aiButtons.forEach(
        button => {

            button?.addEventListener(
                "click",
                event => {

                    event.preventDefault();
                    event.stopPropagation();

                    HD.appManager.open(
                        "haldo-ai"
                    );

                }
            );

        }
    );


    /* ========================================================
       GALAXY STARS
       ======================================================== */

    function createStars(
        container,
        count
    ) {

        if (!container) {

            return;

        }

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const star =
                document.createElement(
                    "span"
                );

            star.className =
                "star";


            star.style.left =
                Math.random() *
                100 +
                "%";


            star.style.top =
                Math.random() *
                100 +
                "%";


            star.style.opacity =
                (
                    .25 +
                    Math.random() *
                    .75
                ).toFixed(
                    2
                );


            star.style.setProperty(
                "--pulse",
                (
                    2 +
                    Math.random() *
                    6
                ).toFixed(2) +
                "s"
            );


            container.appendChild(
                star
            );

        }

    }


    createStars(
        document.getElementById(
            "galaxy-stars"
        ),
        170
    );


    createStars(
        document.getElementById(
            "boot-stars"
        ),
        90
    );


    /* ========================================================
       STARTUP SOUND
       ======================================================== */

    let audioContext =
        null;


    function playStartupSound() {

        const enabled =
            HD.storage.get(
                "startup-sound",
                HD.config.startupSound
            );


        if (!enabled) {

            return;

        }


        try {

            audioContext =
                audioContext ||
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            const now =
                audioContext.currentTime;


            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type =
                "sine";


            oscillator.frequency
                .setValueAtTime(
                    220,
                    now
                );


            oscillator.frequency
                .exponentialRampToValueAtTime(
                    440,
                    now + .7
                );


            oscillator.frequency
                .exponentialRampToValueAtTime(
                    660,
                    now + 1.25
                );


            gain.gain
                .setValueAtTime(
                    .0001,
                    now
                );


            gain.gain
                .exponentialRampToValueAtTime(
                    .09,
                    now + .08
                );


            gain.gain
                .exponentialRampToValueAtTime(
                    .0001,
                    now + 1.8
                );


            oscillator.connect(
                gain
            );

            gain.connect(
                audioContext.destination
            );


            oscillator.start(
                now
            );

            oscillator.stop(
                now + 1.85
            );

        }

        catch (_) {}

    }


    /* ========================================================
       BOOT
       ======================================================== */

    const boot =
        document.getElementById(
            "haldo-boot"
        );

    const os =
        document.getElementById(
            "haldo-os"
        );

    const startButton =
        document.getElementById(
            "boot-start"
        );

    const bootStatus =
        document.getElementById(
            "boot-status"
        );


    let started =
        false;


    function startOS() {

        if (started) {

            return;

        }

        started =
            true;


        bootStatus.textContent =
            "HalDo AI OS 22 wird geöffnet …";


        startButton.disabled =
            true;


        startButton.style.opacity =
            ".6";


        /*
         * Kein langes Boot-Warten.
         * Das System wird sofort sichtbar.
         */

        setTimeout(
            () => {

                boot.style.display =
                    "none";

                os.classList.add(
                    "visible"
                );


                HD.runtime.initialized =
                    true;


                HD.runtime.register(
                    "storage",
                    HD.storage
                );

                HD.runtime.register(
                    "router",
                    HD.router
                );

                HD.runtime.register(
                    "ai",
                    HD.ai
                );

                HD.runtime.register(
                    "app-registry",
                    HD.appRegistry
                );


                playStartupSound();


                HD.emit(
                    "system:ready",
                    {
                        version:
                            HD.config.version
                    }
                );


                /*
                 * HalDo AI ist direkt erreichbar,
                 * aber wird nicht automatisch als
                 * großes Fenster geöffnet.
                 */

            },
            180
        );

    }


    startButton.addEventListener(
        "click",
        startOS
    );


    /* ========================================================
       GLOBAL RESIZE
       ======================================================== */

    window.addEventListener(
        "resize",
        () => {

            HD.windowManager.windows
                .forEach(
                    record => {

                        HD.windowManager
                            .keepInside(
                                record
                            );

                        HD.windowManager
                            .apply(
                                record
                            );

                    }
                );

        }
    );


    /* ========================================================
       EXTERNAL HALDO FILES
       ========================================================
       Diese Dateien werden NUR geladen, wenn sie vorhanden
       sind. Ein fehlendes Modul darf den Startbildschirm
       NICHT mehr blockieren.
       ======================================================== */

    const externalModules = [

        "js/kernel.js",
        "js/system.js",
        "js/runtime.js",
        "js/ai-core.js",
        "js/ai-engine.js",
        "js/ai-chat.js",
        "js/ai-language.js",
        "js/ai-speech.js",
        "js/ai-voice.js",
        "js/voice.js",
        "js/language-manager.js",
        "js/language-system.js",
        "js/ezidi-keyboard.js",
        "js/app-registry.js",
        "js/app-manager.js",
        "js/app-launcher.js",
        "js/app-router.js",
        "js/window-manager.js",
        "js/storage.js",
        "js/storage-manager.js",
        "js/config-manager.js",
        "js/module-manager.js",
        "js/shell-manager.js",
        "js/system-loader.js",
        "js/system-status.js",
        "js/haldo-light-system.js",
        "js/logo-animation-manager.js",
        "js/logo-intro-manager.js",
        "js/conversation-state.js",
        "js/startup.js",
        "js/boot.js"
    ];


    /*
     * Absichtlich NACH dem stabilen Grundsystem.
     *
     * So kann eine einzelne alte Datei nicht mehr verhindern,
     * dass index.html überhaupt erscheint.
     */

    function loadExternalModules() {

        externalModules.forEach(
            path => {

                const script =
                    document.createElement(
                        "script"
                    );

                script.src =
                    path;

                script.async =
                    true;

                script.onerror =
                    () => {

                        console.info(
                            "[HalDo] Optionales Modul nicht geladen:",
                            path
                        );

                    };

                document.head.appendChild(
                    script
                );

            }
        );

    }


    /*
     * Externe Module erst nach DOM und
     * sichtbarem Startsystem laden.
     */

    window.addEventListener(
        "load",
        () => {

            setTimeout(
                loadExternalModules,
                500
            );

        }
    );


    /* ========================================================
       GLOBAL API
       ======================================================== */

    window.HalDoOS =
        window.HalDoOS ||
        {};

    window.HalDoOS.appManager =
        HD.appManager;

    window.HalDoOS.windowManager =
        HD.windowManager;

    window.HalDoOS.router =
        HD.router;

    window.HalDoOS.storage =
        HD.storage;

    window.HalDoOS.ai =
        HD.ai;


    HD.emit(
        "index:ready",
        {
            version:
                HD.config.version,

            apps:
                HD.appRegistry
                    .all()
                    .length
        }
    );


})();
</script>
