<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HalDo AI OS 24 — Cosmic Intelligent OS</title>
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a1a;
            --surface: rgba(16, 16, 40, 0.92);
            --text: #e0e0ff;
            --primary: #00d4ff;
            --secondary: #7b2ffc;
            --radius: 14px;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== BOOT ===== */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.5s ease;
            padding: 20px;
        }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo {
            font-size: clamp(3.5rem, 14vw, 6rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseGlow 2s infinite alternate;
            filter: drop-shadow(0 0 40px rgba(0, 212, 255, 0.3));
        }
        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 80px rgba(123, 47, 252, 0.6));
                transform: scale(1.05);
            }
        }
        #boot-status {
            margin-top: 16px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COSMIC CANVAS ===== */
        #cosmic {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ===== DISPLAY ===== */
        #display {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* ===== TOPBAR ===== */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            min-height: 40px;
            flex-shrink: 0;
        }
        #topbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #topbar-left .haldo-icon {
            font-weight: 700;
            color: var(--primary);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #topbar-left .haldo-icon img {
            width: clamp(28px, 5vw, 36px);
            height: clamp(28px, 5vw, 36px);
            border-radius: 50%;
            border: 2px solid var(--primary);
        }
        #topbar-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== APP CONTAINER ===== */
        #app-container {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow: hidden;
            touch-action: none;
        }

        /* ===== WINDOW ===== */
        .window {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 200px;
            min-height: 150px;
            max-width: 98vw;
            max-height: 90vh;
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.2);
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            cursor: grab;
            flex-shrink: 0;
            min-height: 36px;
            touch-action: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .win-btn {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.2s;
            touch-action: manipulation;
            min-width: 28px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .win-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        .win-btn.close:active {
            background: #ff4444;
            color: #fff;
        }
        .window-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== DOCK ===== */
        #dock {
            position: absolute;
            bottom: clamp(8px, 2vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: clamp(4px, 1vw, 10px);
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 18px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: nowrap;
            max-width: 98vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .dock-item {
            width: clamp(40px, 9vw, 52px);
            height: clamp(40px, 9vw, 52px);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3.5vw, 1.6rem);
            cursor: pointer;
            transition: 0.2s;
            border: none;
            color: #fff;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .dock-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: clamp(50px, 10vh, 70px);
            right: clamp(8px, 2vw, 20px);
            left: clamp(8px, 2vw, 20px);
            z-index: 999;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 14px 18px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: var(--shadow);
            animation: slideIn 0.4s ease;
            border-left: 4px solid var(--primary);
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
        }
        .notification.success {
            border-left-color: #44ff88;
        }
        .notification.error {
            border-left-color: #ff4444;
        }
        .notification.communication {
            border-left-color: #ff8844;
        }
        @keyframes slideIn {
            from {
                transform: translateY(-120%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ===== SCROLLBAR ===== */
        .window-body::-webkit-scrollbar {
            width: 4px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        @media (max-width: 480px) {
            .window {
                border-radius: 12px;
                min-width: 160px;
                min-height: 120px;
            }
            .window-header {
                padding: 6px 10px;
                min-height: 32px;
            }
            .window-body {
                padding: 10px;
            }
            #topbar {
                padding: 4px 10px;
                min-height: 34px;
            }
            .win-btn {
                min-width: 24px;
                min-height: 24px;
                padding: 2px 6px;
            }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .window {
                max-height: 80vh;
            }
            #dock {
                bottom: 4px;
                padding: 4px 10px;
                gap: 4px;
            }
            .dock-item {
                width: 34px;
                height: 34px;
                font-size: 1rem;
                border-radius: 10px;
            }
            #topbar {
                min-height: 28px;
                padding: 2px 10px;
            }
            .window-header {
                min-height: 28px;
                padding: 4px 10px;
            }
            .window-body {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- BOOT -->
        <div id="boot">
            <div id="boot-logo">⟡ HalDo</div>
            <div class="boot-spinner"></div>
            <div id="boot-status">⟡ System wird initialisiert ...</div>
        </div>

        <!-- COSMIC CANVAS -->
        <canvas id="cosmic"></canvas>

        <!-- DISPLAY -->
        <div id="display">
            <!-- TOPBAR -->
            <div id="topbar">
                <div id="topbar-left">
                    <span class="haldo-icon" id="menu-system">⟡ HalDo</span>
                    <span id="clock-display">--:--</span>
                </div>
                <div id="topbar-right">
                    <button class="top-btn" id="btn-communication" title="Kommunikation">💬</button>
                    <button class="top-btn" id="btn-appworld">📱</button>
                    <button class="top-btn" id="btn-theme">🎨</button>
                    <button class="top-btn" id="btn-about">ℹ️</button>
                </div>
            </div>

            <!-- APP CONTAINER -->
            <div id="app-container"></div>

            <!-- DOCK -->
            <div id="dock">
                <button class="dock-item" data-app="ai">🤖</button>
                <button class="dock-item" data-app="mail">✉️</button>
                <button class="dock-item" data-app="chat">💬</button>
                <button class="dock-item" data-app="contacts">👤</button>
                <button class="dock-item" data-app="files">📁</button>
                <button class="dock-item" data-app="settings">⚙️</button>
                <button class="dock-item" data-app="cosmic">🌌</button>
                <button class="dock-item" data-app="notes">📝</button>
                <button class="dock-item" data-app="terminal">⌨️</button>
                <button class="dock-item" data-app="appworld">📱</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  HALDO AI OS 24 — COSMIC INTELLIGENT OPERATING SYSTEM
        //  Mit: Cosmic World (Sonne, 12 Planeten, Galaxien)
        //       Living AI, 84 Apps, Mail, Chat, Calls
        // ================================================================

        (function() {
            'use strict';

            // ===== STATE =====
            const state = {
                apps: {},
                windows: [],
                windowZIndex: 100,
                activeWindow: null,
                theme: 'cosmic',
                language: 'de',
                booted: false,
                user: null,
                aiMemory: [],
                mail: {
                    inbox: [],
                    sent: [],
                    drafts: [],
                    spam: []
                },
                contacts: [],
                messages: [],
                calls: [],
                settings: {
                    theme: 'cosmic',
                    language: 'de',
                    voiceEnabled: false,
                    notifications: true,
                    mailSignature: 'Mit freundlichen Grüßen\nDein HalDo AI OS'
                }
            };

            // ===== DOM HELPERS =====
            const $ = (id) => document.getElementById(id);
            const boot = $('boot');
            const bootStatus = $('boot-status');
            const cosmicCanvas = $('cosmic');
            const appContainer = $('app-container');
            const dock = $('dock');

            // ================================================================
            //  COSMIC WORLD — MIT SONNE, 12 PLANETEN, GALAXIEN
            // ================================================================
            let stars = [];
            let galaxies = [];
            let planets = [];
            let sun = null;
            let cosmicRunning = false;
            let cosmicCtx = null;
            let cosmicW = 0,
                cosmicH = 0;

            const PLANET_DATA = [
                { name: 'Merkur', radius: 8, color: '#aaaaaa', orbit: 80, speed: 0.02 },
                { name: 'Venus', radius: 12, color: '#ffaa44', orbit: 120, speed: 0.015 },
                { name: 'Erde', radius: 14, color: '#4488ff', orbit: 170, speed: 0.01 },
                { name: 'Mars', radius: 10, color: '#ff6644', orbit: 220, speed: 0.008 },
                { name: 'Jupiter', radius: 25, color: '#ddaa77', orbit: 280, speed: 0.005 },
                { name: 'Saturn', radius: 20, color: '#ddcc88', orbit: 350, speed: 0.004 },
                { name: 'Uranus', radius: 16, color: '#88ddff', orbit: 420, speed: 0.003 },
                { name: 'Neptun', radius: 15, color: '#4466ff', orbit: 490, speed: 0.002 },
                { name: 'Pluto', radius: 6, color: '#ccbb99', orbit: 550, speed: 0.0015 },
                { name: 'Xena', radius: 9, color: '#99aaff', orbit: 600, speed: 0.0012 },
                { name: 'HalDo-1', radius: 11, color: '#ff88dd', orbit: 650, speed: 0.001 },
                { name: 'HalDo-2', radius: 13, color: '#88ffaa', orbit: 700, speed: 0.0008 }
            ];

            function initCosmic() {
                const ctx = cosmicCanvas.getContext('2d');
                cosmicCtx = ctx;

                function resize() {
                    cosmicW = cosmicCanvas.width = window.innerWidth;
                    cosmicH = cosmicCanvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                // Sterne (2000)
                stars = [];
                for (let i = 0; i < 2000; i++) {
                    stars.push({
                        x: Math.random() * cosmicW,
                        y: Math.random() * cosmicH,
                        r: Math.random() * 2.5 + 0.3,
                        speed: Math.random() * 0.05 + 0.01,
                        brightness: Math.random() * 0.8 + 0.2,
                        phase: Math.random() * Math.PI * 2,
                        color: `hsl(${Math.random() * 60 + 200}, 80%, ${60 + Math.random() * 40}%)`
                    });
                }

                // Galaxien (8)
                galaxies = [];
                for (let g = 0; g < 8; g++) {
                    const gx = Math.random() * cosmicW;
                    const gy = Math.random() * cosmicH;
                    const gSize = 60 + Math.random() * 150;
                    const angle = Math.random() * Math.PI * 2;
                    const points = [];
                    for (let i = 0; i < 400; i++) {
                        const t = Math.random() * Math.PI * 4;
                        const r = Math.random() * gSize * 0.6;
                        const x = gx + Math.cos(t + angle) * r * (1 + t * 0.08);
                        const y = gy + Math.sin(t + angle) * r * (1 + t * 0.08);
                        points.push({
                            x,
                            y,
                            r: Math.random() * 2 + 0.5,
                            brightness: Math.random() * 0.5 + 0.2,
                            hue: 200 + Math.random() * 80
                        });
                    }
                    galaxies.push({
                        x: gx,
                        y: gy,
                        size: gSize,
                        angle: angle,
                        points: points,
                        rotationSpeed: (Math.random() - 0.5) * 0.002
                    });
                }

                // Planeten (12)
                planets = [];
                const centerX = cosmicW / 2;
                const centerY = cosmicH / 2;
                PLANET_DATA.forEach((p) => {
                    planets.push({
                        name: p.name,
                        radius: p.radius,
                        color: p.color,
                        orbit: p.orbit,
                        speed: p.speed + (Math.random() - 0.5) * 0.001,
                        angle: Math.random() * Math.PI * 2,
                        centerX: centerX + (Math.random() - 0.5) * 80,
                        centerY: centerY + (Math.random() - 0.5) * 80,
                        glow: p.radius * 2.5,
                        ring: p.name === 'Saturn' ? true : false
                    });
                });

                // Sonne
                sun = {
                    x: centerX,
                    y: centerY,
                    radius: 45,
                    glow: 180,
                    color: '#ffdd44',
                    pulseSpeed: 0.005,
                    pulsePhase: 0,
                    flares: 12
                };

                cosmicRunning = true;
                animateCosmic();
            }

            function animateCosmic() {
                if (!cosmicRunning || !cosmicCtx) return;
                const ctx = cosmicCtx;
                const w = cosmicW,
                    h = cosmicH;

                // Hintergrund
                const bgGrad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.9);
                bgGrad.addColorStop(0, '#0a0a2a');
                bgGrad.addColorStop(0.4, '#050515');
                bgGrad.addColorStop(1, '#000005');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                // Galaxien
                galaxies.forEach(g => {
                    g.angle += g.rotationSpeed;
                    g.points.forEach(p => {
                        const rotX = p.x - g.x;
                        const rotY = p.y - g.y;
                        const cosA = Math.cos(g.angle);
                        const sinA = Math.sin(g.angle);
                        const rx = g.x + rotX * cosA - rotY * sinA;
                        const ry = g.y + rotX * sinA + rotY * cosA;
                        ctx.fillStyle = `hsla(${p.hue}, 70%, 60%, ${p.brightness * 0.25})`;
                        ctx.beginPath();
                        ctx.arc(rx, ry, p.r, 0, Math.PI * 2);
                        ctx.fill();
                    });
                });

                // Sonne
                if (sun) {
                    sun.pulsePhase += sun.pulseSpeed;
                    const pulse = 1 + 0.06 * Math.sin(sun.pulsePhase);
                    const radius = sun.radius * pulse;

                    // Glow
                    for (let i = 8; i > 0; i--) {
                        const grad = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * i * 0.2);
                        grad.addColorStop(0, `rgba(255, 220, 68, ${0.08 / i})`);
                        grad.addColorStop(1, 'rgba(255, 220, 68, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(sun.x, sun.y, sun.glow * i * 0.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Sonnenflecken
                    const sunGrad = ctx.createRadialGradient(sun.x - radius * 0.3, sun.y - radius * 0.3, 0, sun.x, sun.y,
                        radius);
                    sunGrad.addColorStop(0, '#ffeeaa');
                    sunGrad.addColorStop(0.3, '#ffdd44');
                    sunGrad.addColorStop(0.7, '#ff8800');
                    sunGrad.addColorStop(1, '#ff4400');
                    ctx.fillStyle = sunGrad;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, radius, 0, Math.PI * 2);
                    ctx.fill();

                    // Sonnenstrahlen
                    for (let i = 0; i < sun.flares; i++) {
                        const angle = i * (Math.PI / (sun.flares / 2)) + sun.pulsePhase * 0.3;
                        const len = radius * (1.4 + 0.4 * Math.sin(sun.pulsePhase * 0.7 + i * 0.5));
                        ctx.strokeStyle = `rgba(255, 220, 68, ${0.06 + 0.04 * Math.sin(sun.pulsePhase + i)})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(sun.x + Math.cos(angle) * radius * 0.7, sun.y + Math.sin(angle) * radius * 0.7);
                        ctx.lineTo(sun.x + Math.cos(angle) * len, sun.y + Math.sin(angle) * len);
                        ctx.stroke();
                    }
                }

                // Planeten
                planets.forEach(p => {
                    p.angle += p.speed;
                    const px = p.centerX + Math.cos(p.angle) * p.orbit;
                    const py = p.centerY + Math.sin(p.angle) * p.orbit;

                    // Orbit
                    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 8]);
                    ctx.beginPath();
                    ctx.arc(p.centerX, p.centerY, p.orbit, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Glow
                    const glow = ctx.createRadialGradient(px, py, 0, px, py, p.glow);
                    glow.addColorStop(0, p.color + '40');
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(px, py, p.glow, 0, Math.PI * 2);
                    ctx.fill();

                    // Planet
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(px, py, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Ring (Saturn)
                    if (p.ring) {
                        ctx.strokeStyle = 'rgba(200, 180, 150, 0.3)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.ellipse(px, py, p.radius * 1.8, p.radius * 0.6, 0.3, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.strokeStyle = 'rgba(200, 180, 150, 0.15)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.ellipse(px, py, p.radius * 2.2, p.radius * 0.8, -0.2, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Name
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '7px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.name, px, py + p.radius + 14);
                });

                // Sterne
                const time = Date.now() / 4000;
                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > cosmicH) { s.y = 0;
                        s.x = Math.random() * cosmicW; }
                    const bright = s.brightness * (0.6 + 0.4 * Math.sin(time * 2 + s.phase));
                    ctx.globalAlpha = bright;
                    ctx.fillStyle = s.color;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                requestAnimationFrame(animateCosmic);
            }

            // ===== BOOT =====
            function bootSequence() {
                const statuses = [
                    '⟡ Kernel wird geladen ...',

            // ===== WINDOW MANAGEMENT =====
            function getSafeWindowPosition() {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const w = Math.min(560, vw - 40);
                const h = Math.min(440, vh - 160);
                const x = Math.max(10, (vw - w) / 2);
                const y = Math.max(40, (vh - h) / 2 - 20);
                return { x, y, w, h };
            }

            function launchApp(id) {
                const app = state.apps[id];
                if (!app) {
                    notify(`❌ App "${id}" nicht gefunden`, 'error');
                    return;
                }

                const existing = state.windows.find(w => w.appId === id);
                if (existing) {
                    focusWindow(existing.id);
                    return;
                }

                const pos = getSafeWindowPosition();
                const winId = 'win-' + Date.now();
                const win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x + Math.random() * 30,
                    y: pos.y + Math.random() * 30,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null
                };

                state.windows.push(win);
                renderWindow(win);
                focusWindow(winId);

                if (app.render) {
                    const body = win.element.querySelector('.window-body');
                    app.render(body, win);
                }

                notify(`🔄 ${app.title || id} geöffnet`);
            }

            function renderWindow(win) {
                const existing = document.getElementById(win.id);
                if (existing) existing.remove();

                const el = document.createElement('div');
                el.id = win.id;
                el.className = 'window';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;

                el.innerHTML = `
                    <div class="window-header">
                        <span class="window-title">${win.icon} ${win.title}</span>
                        <div class="window-controls">
                            <button class="win-btn" data-action="minimize">─</button>
                            <button class="win-btn" data-action="maximize">⧉</button>
                            <button class="win-btn close" data-action="close">✕</button>
                        </div>
                    </div>
                    <div class="window-body"></div>
                `;

                appContainer.appendChild(el);
                win.element = el;

                // Controls
                el.querySelectorAll('.win-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        if (action === 'close') closeWindow(win.id);
                        else if (action === 'minimize') minimizeWindow(win.id);
                        else if (action === 'maximize') maximizeWindow(win.id);
                    });
                });

                // Drag
                const header = el.querySelector('.window-header');
                let drag = false,
                    startX, startY, origX, origY, isTouch = false;

                function startDrag(clientX, clientY) {
                    if (header.querySelector('.win-btn') && document.activeElement?.tagName === 'BUTTON') return;
                    drag = true;
                    startX = clientX;
                    startY = clientY;
                    origX = win.x;
                    origY = win.y;
                    focusWindow(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(clientX, clientY) {
                    if (!drag) return;
                    const dx = clientX - startX;
                    const dy = clientY - startY;
                    win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
                    win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() {
                    if (drag) { drag = false;
                        el.style.cursor = ''; }
                }

                header.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.win-btn')) return;
                    startDrag(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    moveDrag(e.clientX, e.clientY);
                });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    if (e.target.closest('.win-btn')) return;
                    isTouch = true;
                    startDrag(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', (e) => {
                    if (!drag || !isTouch) return;
                    const touch = e.touches[0];
                    moveDrag(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchend', () => {
                    if (isTouch) { isTouch = false;
                        endDrag(); }
                }, { passive: true });

                // Resize
                const resizeHandle = document.createElement('div');
                resizeHandle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:24px;height:24px;cursor:se-resize;touch-action:none;';
                el.appendChild(resizeHandle);

                let resize = false,
                    startW, startH, startX2, startY2;

                function startResize(clientX, clientY) {
                    resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = clientX;
                    startY2 = clientY;
                }

                function moveResize(clientX, clientY) {
                    if (!resize) return;
                    const dw = clientX - startX2,
                        dh = clientY - startY2;
                    win.width = Math.max(200, Math.min(window.innerWidth - win.x - 10, startW + dw));
                    win.height = Math.max(120, Math.min(window.innerHeight - win.y - 80, startH + dh));
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                resizeHandle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    startResize(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', (e) => {
                    if (!resize) return;
                    moveResize(e.clientX, e.clientY);
                });
                document.addEventListener('mouseup', endResize);

                resizeHandle.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    const touch = e.touches[0];
                    startResize(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', (e) => {
                    if (!resize) return;
                    const touch = e.touches[0];
                    moveResize(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            }

            function closeWindow(winId) {
                const idx = state.windows.findIndex(w => w.id === winId);
                if (idx === -1) return;
                const win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) {
                    focusWindow(state.windows[state.windows.length - 1].id);
                }
            }

            function focusWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    state.windows.forEach(w => {
                        if (w.id !== winId && w.element) w.element.classList.remove('active');
                    });
                }
            }

            function minimizeWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (win && win.element) {
                    win.element.style.display = 'none';
                    notify(`⏬ ${win.title} minimiert`);
                }
            }

            function maximizeWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (!win || !win.element) return;
                if (win.width === window.innerWidth - 20) {
                    win.width = win._prevWidth || 560;
                    win.height = win._prevHeight || 440;
                    win.x = win._prevX || 20;
                    win.y = win._prevY || 40;
                } else {
                    win._prevWidth = win.width;
                    win._prevHeight = win.height;
                    win._prevX = win.x;
                    win._prevY = win.y;
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            }

            // ===== NOTIFICATION =====

                    root.style.setProperty('--text', '#e0e0ff');
                    root.style.setProperty('--surface', 'rgba(16,16,40,0.92)');

                    root.style.setProperty('--bg', '#0a0a0a');
                    root.style.setProperty('--text', '#ffffff');
                    root.style.setProperty('--surface', 'rgba(30,30,40,0.92)');
                } else if (theme === 'light') {
                    root.style.setProperty('--bg', '#e8e8f0');
                    root.style.setProperty('--text', '#1a1a2e');
                    root.style.setProperty('--surface', 'rgba(255,255,255,0.92)');
                }
                state.settings.theme = theme;
                localStorage.setItem('haldo_theme', theme);
            }

            function toggleTheme() {
                const themes = ['cosmic', 'dark', 'light'];
                const current = state.settings.theme;
                const next = themes[(themes.indexOf(current) + 1) % themes.length];
                applyTheme(next);
                notify(`🎨 Theme: ${next}`);

                        </div>
                    `;
                    const output = body.querySelector('#terminal-output');
                    const input = body.querySelector('#terminal-input');

                    function exec(cmd) {
                        const line = document.createElement('div');
                        line.style.color = '#44ff88';
                        line.textContent = `$ ${cmd}`;
                        output.appendChild(line);
                        let response = '';
                        if (cmd === 'help') response =
                            'help, version, apps, theme, clear, echo, date, whoami, sysinfo, ezidi, kurdish, galaxy, planets, sun, mail, chat, contacts';
                        else if (cmd === 'version') response = 'HalDo AI OS 24 | Kernel 5.3.0 | Cosmic Engine 4.0';
                        else if (cmd === 'apps') response = '📱 Apps: ' + Object.keys(state.apps).length +
                            ' installiert (84 geplant)';
                        else if (cmd === 'theme') response = `🎨 Theme: ${state.settings.theme}`;
                        else if (cmd === 'clear') { output.innerHTML = ''; return; }
                        else if (cmd.startsWith('echo ')) response = cmd.substring(5);
                        else if (cmd === 'date') response = new Date().toLocaleString();
                        else if (cmd === 'whoami') response = `👤 ${state.user?.username || 'haldo@cosmic'}`;
                        else if (cmd === 'sysinfo') response =
                            `OS: HalDo AI OS 24\nPlatform: ${navigator.platform}\nRAM: ${navigator.deviceMemory || '?'} GB\nTheme: ${state.settings.theme}\nStars: ${stars.length}\nGalaxies: ${galaxies.length}\nPlanets: ${planets.length}\nApps: ${Object.keys(state.apps).length}`;
                        else if (cmd === 'ezidi') response =
                            '🟡 Êzîdî: Eine der ältesten monotheistischen Religionen. Sprache: Kurmanji (Kurdisch). Kultur: reich an Traditionen, Musik und Poesie.';
                        else if (cmd === 'kurdish') response =
                            '🇰🇲 Kurdisch (Kurmanji) wird von Êzîdî und Kurden gesprochen. Die Sprache hat mehrere Dialekte und eine reiche literarische Tradition.';
                        else if (cmd === 'galaxy' || cmd === 'galaxies') response =
                            `🌀 ${galaxies.length} Galaxien im sichtbaren Universum. Jede enthält Milliarden von Sternen.`;
                        else if (cmd === 'planets') response =
                            `🪐 ${planets.length} Planeten: ${planets.map(p => p.name).join(', ')}. Unser Sonnensystem ist nur eines von vielen.`;
                        else if (cmd === 'sun') response =
                            `☀️ Die Sonne ist ein gelber Zwergstern. Ihr Durchmesser beträgt etwa 1,4 Millionen km. Die Oberflächentemperatur beträgt ca. 5.500°C.`;
                        else if (cmd === 'mail') response =
                            `✉️ ${state.mail.inbox.length} E-Mails im Posteingang · ${state.mail.sent.length} gesendet`;
                        else if (cmd === 'chat') response =
                            `💬 ${state.contacts.length} Kontakte · ${state.contacts.filter(c => c.status === 'online').length} online`;
                        else if (cmd === 'contacts') response =
                            `👤 ${state.contacts.map(c => c.name).join(', ')}`;
                        else if (cmd === '') return;
                        else response = `❌ Unbekannt: "${cmd}". Tipp: help`;
                        const respLine = document.createElement('div');
                        respLine.style.color = '#8899bb';
                        respLine.textContent = response;
                        output.appendChild(respLine);
                        output.scrollTop = output.scrollHeight;
                    }

                    body.querySelector('#terminal-exec').addEventListener('click', () => {
                        const val = input.value.trim();
                        if (val) exec(val);
                        input.value = '';

            // ===== CLOCK =====
            function updateClock() {
                const el = document.getElementById('clock-display');
                if (el) {
                    el.textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                }
            }

            // ===== MENUS =====
            function showSystemMenu() {
                notify(
                    '⚙️ System-Menü: AI · Mail · Chat · Kontakte · Dateien · Einstellungen · Cosmic · Notizen · Terminal · Kalender · Musik · App World · Suche · Sprache · Êzîdî · Theme · Benutzer · Datenschutz · Sicherheit · Speicher · Benachrichtigungen · Updates · Backup · Wiederherstellung · Systeminfo'
                    );
                launchApp('settings');
            }

            function showAppWorld() {
                launchApp('appworld');
            }

            function showCommunication() {
                notify('💬 Kommunikationszentrum: ✉️ Mail · 💬 Chat · 👤 Kontakte · 📞 Anrufe · 📹 Video', 'communication');
                launchApp('mail');
            }

            function showAbout() {
                notify(
                    '⟡ HalDo AI OS 24 — Cosmic Intelligent Operating System\n🌌 Mit Sonne, 12 Planeten, Galaxien & Sternen\n🤖 Living HalDo AI mit Voice & Lip-Sync\n✉️ HalDo Mail · 💬 HalDo Chat · 📞 Audio/Video-Calls\n🟡 Êzîdî · Kurdisch · Deutsch · Englisch\n📱 ' +
                    Object.keys(state.apps).length + ' Apps installiert\n💙❤️🚀 Version 24 — Professional Ultimate Edition'
                    );
            }

            // ===== INIT =====
            function init() {
                // Settings laden
                const savedSettings = localStorage.getItem('haldo_settings');
                if (savedSettings) {
                    try {
                        const parsed = JSON.parse(savedSettings);
                        Object.assign(state.settings, parsed);
                        applyTheme(state.settings.theme);
                    } catch (e) {}
                }

                // User laden
                const savedUser = localStorage.getItem('haldo_user');
                if (savedUser) {
                    try {
                        state.user = JSON.parse(savedUser);
                    } catch (e) {}
                }

                // Apps generieren
                generateAllApps();

                // Cosmic starten
                initCosmic();

                // Uhr
                updateClock();
                setInterval(updateClock, 10000);

                // Dock-Events
                dock.querySelectorAll('.dock-item').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const appId = btn.dataset.app;
                        launchApp(appId);
                    });
                });

                // Topbar Buttons
                document.getElementById('menu-system').addEventListener('click', showSystemMenu);
                document.getElementById('btn-communication').addEventListener('click', showCommunication);
                document.getElementById('btn-appworld').addEventListener('click', showAppWorld);
                document.getElementById('btn-theme').addEventListener('click', toggleTheme);
                document.getElementById('btn-about').addEventListener('click', showAbout);

                // Boot starten
                bootSequence();

                // Globale API
                window.HalDo = {
                    notify,
                    toggleTheme,
                    showAbout,
                    launchApp,
                    state,
                    showSystemMenu,
                    showAppWorld,
                    showCommunication
                };

                console.log('⟡ HalDo AI OS 24');
                console.log('🌌 Cosmic Intelligent Operating System');
                console.log('📱 ' + Object.keys(state.apps).length + ' Apps installiert');
                console.log('💡 HalDo.launchApp("ai")');
            }

            // ===== START =====
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
