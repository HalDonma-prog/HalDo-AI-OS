<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030713">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS 22</title>
<style>
:root{
    --bg:#02050d;
    --glass:rgba(8,16,35,.78);
    --glass2:rgba(10,22,48,.92);
    --line:rgba(255,255,255,.12);
    --text:#f4f8ff;
    --muted:rgba(240,247,255,.58);
    --accent:#72b8ff;
    --accent2:#b7ddff;
    --good:#63ffb0;
    --danger:#ff7184;
    --shadow:0 30px 90px rgba(0,0,0,.58);
}
*{
    box-sizing:border-box;
}
html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}
button,
input,
textarea,
select{
    font:inherit;
}
button{
    -webkit-tap-highlight-color:transparent;
}
#haldo-os{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 48%,rgba(45,100,180,.08),transparent 40%),
        radial-gradient(circle at 20% 20%,rgba(100,160,255,.06),transparent 35%),
        #02050d;
}
/* =========================================================
   GALAXY
   ========================================================= */
#galaxy{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}
.stars,
.stars::before,
.stars::after{
    position:absolute;
    inset:-50%;
    content:"";
    background-image:
        radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px),
        radial-gradient(circle,rgba(150,205,255,.7) 0 1px,transparent 1.5px),
        radial-gradient(circle,rgba(255,255,255,.5) 0 1px,transparent 1.5px);
    background-size:180px 180px,270px 270px,390px 390px;
    animation:starsMove 120s linear infinite;
    opacity:.45;
}
.stars::before{
    animation-duration:180s;
    transform:scale(1.25);
    opacity:.35;
}
.stars::after{
    animation-duration:240s;
    transform:scale(1.5);
    opacity:.22;
}
@keyframes starsMove{
    from{transform:rotate(0deg) translate3d(0,0,0)}
    to{transform:rotate(360deg) translate3d(0,0,0)}
}
/* =========================================================
   SOLAR SYSTEM
   ========================================================= */
#solar-system{
    position:absolute;
    left:50%;
    top:50%;
    width:min(92vw,760px);
    height:min(92vw,760px);
    transform:translate(-50%,-50%);
    pointer-events:none;
}
.sun{
    position:absolute;
    left:50%;
    top:50%;
    width:clamp(90px,14vw,150px);
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,
            #fff,
            #fff6a8 12%,
            #ffd35a 28%,
            #ff9e2d 52%,
            #ff5b18 72%,
            rgba(255,70,0,.15) 100%);
    box-shadow:
        0 0 35px #fff3a0,
        0 0 75px #ffb82e,
        0 0 140px rgba(255,160,20,.55),
        0 0 240px rgba(255,100,20,.2);
    animation:sunPulse 4s ease-in-out infinite;
}
.sun::before,
.sun::after{
    content:"";
    position:absolute;
    inset:-25%;
    border-radius:50%;
    background:conic-gradient(
        transparent,
        rgba(255,240,140,.2),
        transparent 18%,
        rgba(255,180,40,.25),
        transparent 40%
    );
    animation:sunCorona 12s linear infinite;
}
.sun::after{
    inset:-45%;
    opacity:.35;
    animation-duration:20s;
}
@keyframes sunPulse{
    50%{
        transform:translate(-50%,-50%) scale(1.06);
        filter:brightness(1.18);
    }
}
@keyframes sunCorona{
    to{transform:rotate(360deg)}
}
.orbit{
    position:absolute;
    left:50%;
    top:50%;
    border:1px solid rgba(150,205,255,.12);
    border-radius:50%;
    transform:translate(-50%,-50%);
    animation:orbitSpin linear infinite;
}
.orbit::after{
    content:"";
    position:absolute;
    left:50%;
    top:-5px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--planet);
    box-shadow:
        0 0 10px var(--planet),
        0 0 22px var(--planet);
}
.orbit1{width:25%;height:25%;--planet:#d5d5d5;animation-duration:6s}
.orbit2{width:35%;height:35%;--planet:#dba765;animation-duration:10s}
.orbit3{width:47%;height:47%;--planet:#5e9cff;animation-duration:14s}
.orbit4{width:59%;height:59%;--planet:#e66f55;animation-duration:19s}
.orbit5{width:72%;height:72%;--planet:#e8c67a;animation-duration:27s}
.orbit6{width:83%;height:83%;--planet:#d8c59b;animation-duration:35s}
.orbit7{width:94%;height:94%;--planet:#77d7ff;animation-duration:44s}
@keyframes orbitSpin{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}
/* =========================================================
   TOP BAR
   ========================================================= */
#topbar{
    position:absolute;
    left:14px;
    right:14px;
    top:calc(10px + env(safe-area-inset-top));
    height:54px;
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
}
.top-button{
    pointer-events:auto;
    width:48px;
    height:48px;
    border:1px solid var(--line);
    border-radius:15px;
    background:rgba(7,15,31,.72);
    color:white;
    cursor:pointer;
    backdrop-filter:blur(20px);
    box-shadow:0 12px 35px rgba(0,0,0,.3);
    transition:.18s ease;
}
.top-button:hover{
    transform:translateY(-1px);
    background:rgba(25,48,82,.88);
}
#menu-logo{
    width:28px;
    height:28px;
    object-fit:contain;
    border-radius:8px;
}
#system-time{
    pointer-events:auto;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(5,12,26,.62);
    backdrop-filter:blur(18px);
    color:var(--muted);
    font-size:12px;
}
/* =========================================================
   MENU
   ========================================================= */
#side-menu{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:min(370px,92vw);
    z-index:6000;
    transform:translateX(-105%);
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
    background:rgba(3,8,19,.94);
    border-right:1px solid var(--line);
    backdrop-filter:blur(30px);
    box-shadow:30px 0 80px rgba(0,0,0,.5);
    display:flex;
    flex-direction:column;
}
#side-menu.open{
    transform:translateX(0);
}
.menu-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px;
    padding-top:calc(20px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
}
.menu-logo{
    width:42px;
    height:42px;
    object-fit:contain;
    border-radius:12px;
}
.menu-title strong{
    display:block;
    font-size:17px;
}
.menu-title span{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}
#menu-close{
    margin-left:auto;
}
#app-list{
    flex:1;
    overflow:auto;
    padding:12px;
}
.app-entry{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    min-height:48px;
    padding:9px 11px;
    margin-bottom:4px;
    border:1px solid transparent;
    border-radius:13px;
    background:transparent;
    color:white;
    text-align:left;
    cursor:pointer;
}
.app-entry:hover{
    background:rgba(255,255,255,.07);
    border-color:var(--line);
}
.app-entry .icon{
    width:30px;
    text-align:center;
    font-size:20px;
}
.app-entry .info{
    min-width:0;
}
.app-entry strong{
    display:block;
    font-size:13px;
    font-weight:650;
}
.app-entry small{
    display:block;
    margin-top:2px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
/* =========================================================
   LIVING AI
   ========================================================= */
#living-ai{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(210px,42vw);
    aspect-ratio:1;
    z-index:100;
    cursor:pointer;
    border-radius:50%;
    display:grid;
    place-items:center;
}
#living-ai img{
    width:70%;
    height:70%;
    object-fit:contain;
    filter:
        drop-shadow(0 0 18px rgba(130,205,255,.7))
        drop-shadow(0 0 50px rgba(80,150,255,.35));
    animation:livingLogo 5s ease-in-out infinite;
}
#living-ai::before{
    content:"";
    position:absolute;
    inset:8%;
    border-radius:50%;
    border:1px solid rgba(180,225,255,.22);
    box-shadow:
        0 0 30px rgba(100,190,255,.18),
        inset 0 0 30px rgba(100,190,255,.08);
    animation:livingRing 8s linear infinite;
}
#living-ai::after{
    content:"";
    position:absolute;
    inset:-10%;
    border-radius:50%;
    background:radial-gradient(circle,rgba(120,200,255,.14),transparent 65%);
    animation:livingGlow 3s ease-in-out infinite;
}
@keyframes livingLogo{
    0%,100%{transform:translateY(0) scale(1) rotate(-1deg)}
    50%{transform:translateY(-7px) scale(1.035) rotate(1deg)}
}
@keyframes livingRing{
    to{transform:rotate(360deg)}
}
@keyframes livingGlow{
    50%{transform:scale(1.15);opacity:.65}
}
#ai-label{
    position:absolute;
    bottom:-34px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    color:rgba(255,255,255,.8);
    font-size:11px;
    letter-spacing:.08em;
}
/* =========================================================
   WINDOWS
   ========================================================= */
#window-layer{
    position:absolute;
    inset:0;
    z-index:3000;
    pointer-events:none;
}
.haldo-window{
    position:absolute;
    display:flex;
    flex-direction:column;
    pointer-events:auto;
    min-width:330px;
    min-height:220px;
    width:620px;
    height:430px;
    max-width:calc(100vw - 20px);
    max-height:calc(100vh - 90px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    overflow:hidden;
    background:linear-gradient(145deg,rgba(11,24,48,.98),rgba(3,9,23,.98));
    box-shadow:var(--shadow),0 0 60px rgba(80,150,255,.08);
    backdrop-filter:blur(24px);
    transition:
        opacity .16s ease,
        transform .16s ease,
        box-shadow .16s ease;
}
.haldo-window.active{
    box-shadow:
        0 35px 90px rgba(0,0,0,.58),
        0 0 70px rgba(100,175,255,.14);
}
.haldo-window.maximized{
    left:10px!important;
    top:74px!important;
    width:calc(100vw - 20px)!important;
    height:calc(100vh - 94px)!important;
    border-radius:14px;
}
.haldo-window.minimized{
    opacity:0;
    transform:translateY(30px) scale(.94);
    pointer-events:none;
}
.window-header{
    height:50px;
    min-height:50px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 8px 0 14px;
    user-select:none;
    cursor:grab;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
}
.window-header:active{
    cursor:grabbing;
}
.window-app-icon{
    width:30px;
    height:30px;
    display:grid;
    place-items:center;
    border-radius:9px;
    background:rgba(255,255,255,.08);
}
.window-name{
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-weight:650;
}
.window-controls{
    display:flex;
    gap:3px;
}
.window-control{
    width:35px;
    height:34px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:white;
    cursor:pointer;
}
.window-control:hover{
    background:rgba(255,255,255,.1);
}
.window-control.close:hover{
    background:rgba(255,70,90,.28);
}
.window-body{
    min-height:0;
    flex:1;
    display:flex;
    flex-direction:column;
}
.app-toolbar{
    min-height:36px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 13px;
    border-bottom:1px solid rgba(255,255,255,.06);
    color:var(--muted);
    font-size:11px;
}
.app-content{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:18px;
}
.resize-handle{
    position:absolute;
    right:2px;
    bottom:2px;
    width:22px;
    height:22px;
    cursor:nwse-resize;
}
.resize-handle::after{
    content:"";
    position:absolute;
    right:3px;
    bottom:3px;
    width:10px;
    height:10px;
    border-right:2px solid rgba(255,255,255,.4);
    border-bottom:2px solid rgba(255,255,255,.4);
}
/* =========================================================
   COMMON APP UI
   ========================================================= */
.app-shell{
    display:flex;
    flex-direction:column;
    gap:14px;
    min-height:100%;
}
.app-card{
    border:1px solid var(--line);
    background:rgba(255,255,255,.035);
    border-radius:15px;
    padding:15px;
}
.app-card h2,
.app-card h3,
.app-card p{
    margin-top:0;
}
.app-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
}
.action-button{
    min-height:40px;
    padding:8px 14px;
    border:1px solid rgba(255,255,255,.11);
    border-radius:11px;
    background:rgba(255,255,255,.06);
    color:white;
    cursor:pointer;
}
.action-button:hover{
    background:rgba(255,255,255,.12);
}
.action-button.primary{
    background:linear-gradient(135deg,#377cc7,#65b7ff);
    color:#03101e;
    border:0;
}
.input,
.textarea,
.select{
    width:100%;
    padding:11px 12px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    background:rgba(0,0,0,.2);
    color:white;
    outline:none;
}
.textarea{
    min-height:100px;
    resize:vertical;
}
.chat{
    display:flex;
    flex-direction:column;
    height:100%;
    gap:10px;
}
.chat-messages{
    flex:1;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:9px;
}
.chat-message{
    max-width:85%;
    padding:11px 13px;
    border-radius:14px;
    line-height:1.5;
    font-size:14px;
}
.chat-message.ai{
    align-self:flex-start;
    background:rgba(100,170,255,.1);
    border:1px solid rgba(100,170,255,.15);
}
.chat-message.user{
    align-self:flex-end;
    background:rgba(255,255,255,.08);
}
.chat-input{
    display:flex;
    gap:8px;
}
.chat-input textarea{
    flex:1;
    min-height:48px;
    max-height:130px;
}
.status{
    color:var(--good);
    font-size:11px;
}
/* =========================================================
   BOOT
   ========================================================= */
#boot-screen{
    position:absolute;
    inset:0;
    z-index:10000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#01030a;
    transition:opacity .8s ease,visibility .8s ease;
}
#boot-screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}
#boot-logo{
    width:min(180px,45vw);
    height:min(180px,45vw);
    object-fit:contain;
    filter:
        drop-shadow(0 0 25px rgba(100,190,255,.7))
        drop-shadow(0 0 70px rgba(80,130,255,.35));
    animation:bootLogo 3s ease-in-out infinite;
}
@keyframes bootLogo{
    50%{
        transform:scale(1.05) rotate(2deg);
        filter:
            drop-shadow(0 0 35px rgba(150,220,255,.9))
            drop-shadow(0 0 90px rgba(80,150,255,.5));
    }
}
#boot-title{
    margin-top:20px;
    font-size:22px;
    font-weight:700;
}
#boot-status{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
}
/* =========================================================
   RESPONSIVE
   ========================================================= */
@media(max-width:700px){
    #solar-system{
        width:125vw;
        height:125vw;
        opacity:.88;
    }
    #living-ai{
        width:190px;
        max-width:48vw;
    }
    .haldo-window{
        min-width:0;
        width:calc(100vw - 18px)!important;
        height:calc(100vh - 110px)!important;
        left:9px!important;
        top:64px!important;
        max-width:none;
        max-height:none;
        border-radius:16px;
    }
    .resize-handle{
        display:none;
    }
    .app-content{
        padding:13px;
    }
    .window-control{
        width:38px;
        height:36px;
    }
    #system-time{
        display:none;
    }
}
@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
        transition-duration:.001ms!important;
    }
}
</style>
</head>
<body>
<div id="haldo-os">
<div id="galaxy">
    <div class="stars"></div>
</div>
<div id="solar-system">
    <div class="sun"></div>
    <div class="orbit orbit1"></div>
    <div class="orbit orbit2"></div>
    <div class="orbit orbit3"></div>
    <div class="orbit orbit4"></div>
    <div class="orbit orbit5"></div>
    <div class="orbit orbit6"></div>
    <div class="orbit orbit7"></div>
</div>
<header id="topbar">
    <button id="menu-button" class="top-button" aria-label="HalDo Menü">
        <img id="menu-logo" src="assets/logo/logo.png" alt="HalDo">
    </button>
    <div id="system-time"></div>
</header>
<aside id="side-menu">
    <div class="menu-head">
        <img
            class="menu-logo"
            src="assets/logo/logo.png"
            alt="HalDo AI"
        >
        <div class="menu-title">
            <strong>HalDo AI OS 22</strong>
            <span>Alle Anwendungen & Systeme</span>
        </div>
        <button
            id="menu-close"
            class="top-button"
            aria-label="Menü schließen"
        >×</button>
    </div>
    <div id="app-list"></div>
</aside>
<main
    id="living-ai"
    aria-label="HalDo AI öffnen"
    role="button"
    tabindex="0"
>
    <img
        src="assets/logo/logo.png"
        alt="Lebendiges HalDo AI Logo"
    >
    <div id="ai-label">HalDo AI</div>
</main>
<div id="window-layer"></div>
<section id="boot-screen">
    <img
        id="boot-logo"
        src="assets/logo/logo.png"
        alt="HalDo"
    >
    <div id="boot-title">
        HALDO AI OS 22
    </div>
    <div id="boot-status">
        HalDo AI wird gestartet …
    </div>
</section>
</div>
<script>
"use strict";
/* =========================================================
   HALDO GLOBAL FOUNDATION
   ========================================================= */
window.HalDo = window.HalDo || {};
const HD = window.HalDo;
HD.version = "22.0.0";
HD.name = "HalDo AI OS";
HD.initialized = HD.initialized || false;
/* =========================================================
   EVENTS
   ========================================================= */
HD.events = HD.events || (() => {
    const listeners = new Map();
    return {
        on(name,callback){
            if(typeof callback !== "function") return () => {};
            if(!listeners.has(name)){
                listeners.set(name,new Set());
            }
            listeners.get(name).add(callback);
            return () => {
                listeners.get(name)?.delete(callback);
            };
        },
        off(name,callback){
            listeners.get(name)?.delete(callback);
        },
        emit(name,data={}){
            listeners.get(name)?.forEach(fn=>{
                try{
                    fn(data);
                }catch(error){
                    console.error("HalDo event error:",name,error);
                }
            });
            window.dispatchEvent(
                new CustomEvent("haldo:"+name,{detail:data})
            );
        }
    };
})();
HD.emit = HD.emit || ((name,data)=>HD.events.emit(name,data));
/* =========================================================
   STORAGE / PERSISTENCE
   ========================================================= */
HD.storage = HD.storage || {
    prefix:"haldo-os22:",
    get(key,fallback=null){
        try{
            const value =
                localStorage.getItem(
                    this.prefix + key
                );
            return value === null
                ? fallback
                : JSON.parse(value);
        }catch(error){
            console.warn("HalDo Storage read:",error);
            return fallback;
        }
    },
    set(key,value){
        try{
            localStorage.setItem(
                this.prefix + key,
                JSON.stringify(value)
            );
            HD.emit("storage:saved",{key,value});
            return true;
        }catch(error){
            console.error("HalDo Storage write:",error);
            return false;
        }
    },
    remove(key){
        try{
            localStorage.removeItem(
                this.prefix + key
            );
            return true;
        }catch(_){
            return false;
        }
    }
};
HD.appState = HD.appState || {
    get(appId){
        return HD.storage.get(
            "app:"+appId,
            {}
        );
    },
    save(appId,state){
        return HD.storage.set(
            "app:"+appId,
            state || {}
        );
    }
};

            String(input || "").trim();
        if(!text){
            return "Ich bin hier. Schreib mir einfach, was du möchtest.";
        }
        const lower =
            text.toLowerCase();
        let answer;
        if(
            lower.includes("hallo") ||
            lower.includes("hi") ||
            lower.includes("hey")
        ){
            answer =
                "Hallo Bruder ❤️💙. Ich bin HalDo AI und höre dir zu. Was möchtest du machen?";
        }
        else if(
            lower.includes("wer bist") ||
            lower.includes("wer bist du")

        }
        else if(
            lower.includes("zeit")
        ){
            answer =
                "Die aktuelle Systemzeit ist " +
                new Date().toLocaleTimeString(
                    "de-DE"
                ) +
                ".";
        }
        else if(
            lower.includes("apps") ||

        ){
            answer =
                "Im HalDo AI OS 22 sind " +
                HD.apps.all().length +

HD.voice = HD.voice || {
    speaking:false,
    speak(text){
        if(
            !("speechSynthesis" in window)
        ){
            return false;
        }
        window.speechSynthesis.cancel();
        const utterance =
            new SpeechSynthesisUtterance(
                String(text)
            );
        utterance.lang =
            HD.config.language === "de"
                ? "de-DE"
                : HD.config.language;
        utterance.rate=.96;
        utterance.pitch=1.02;
        utterance.onstart=()=>{
            this.speaking=true;
            HD.emit("voice:start",{text});
        };
        utterance.onend=()=>{
            this.speaking=false;
            HD.emit("voice:end",{text});
        };
        window.speechSynthesis.speak(
            utterance
        );
        return true;
    },
    stop(){
        if("speechSynthesis" in window){
            window.speechSynthesis.cancel();
        }
        this.speaking=false;
    }
};
/* =========================================================
   WELCOME SOUND
   ========================================================= */
HD.audio = HD.audio || {
    playWelcome(){
        if(!HD.config.welcomeSound){
            return;
        }
        try{
            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;
            if(!AudioContext) return;
            const ctx =
                new AudioContext();
            const now =
                ctx.currentTime;
            const notes =
                [220,277.18,329.63,440];
            notes.forEach(
                (frequency,index)=>{
                    const oscillator =
                        ctx.createOscillator();
                    const gain =
                        ctx.createGain();
                    oscillator.type =
                        "sine";
                    oscillator.frequency
                        .setValueAtTime(
                            frequency,
                            now + index*.12
                        );
                    gain.gain.setValueAtTime(
                        0,
                        now + index*.12
                    );
                    gain.gain.linearRampToValueAtTime(
                        .035,
                        now + index*.12 + .04
                    );
                    gain.gain.exponentialRampToValueAtTime(
                        .0001,
                        now + index*.12 + .75
                    );
                    oscillator.connect(gain);
                    gain.connect(ctx.destination);
                    oscillator.start(
                        now + index*.12
                    );
                    oscillator.stop(
                        now + index*.12 + .8
                    );
                }
            );
            setTimeout(
                ()=>ctx.close().catch(()=>{}),
                1500
            );
        }catch(error){
            console.warn(
                "HalDo Welcome Audio:",
                error
            );
        }
    }
};

            x:Number(
                windowState.x ?? 70
            ),
            y:Number(
                windowState.y ?? 75
            ),

                windowState.width ??

            ),

            )

        if(windowState.maximized){

        /* ONE CLICK CLOSE */

    },
    control(symbol){
        const button =
            document.createElement(
                "button"
            );
        button.className =
            "window-control";
        button.type="button";
        button.textContent=symbol;
        return button;
    },
    focus(appId){
        const record =
            this.windows.get(
                appId
            );
        if(!record) return;
        this.zIndex++;
        record.element.style.zIndex =
            String(this.zIndex);
        this.active =
            appId;
        this.windows.forEach(
            item=>{
                item.element.classList
                    .toggle(
                        "active",
                        item.id === appId
                    );
            }
        );
        HD.emit(
            "window:activated",
            {window:record}
        );
    },
    close(appId){
        const record =
            this.windows.get(
                appId
            );
        if(!record) return;
        this.save(record);
        record.element.remove();
        this.windows.delete(
            appId
        );
        if(this.active===appId){
            this.active=null;
        }
        HD.emit(
            "window:closed",
            {window:record}
        );
    },
    minimize(appId){
        const record =
            this.windows.get(
                appId
            );
        if(!record) return;
        record.minimized=true;
        record.element.classList.add(
            "minimized"
        );
        HD.emit(
            "window:minimized",
            {window:record}
        );
    },
    restore(appId){
        const record =
            this.windows.get(
                appId
            );
        if(!record) return;
        record.minimized=false;
        record.element.classList.remove(
            "minimized"
        );
        this.focus(appId);
    },
    toggleMaximize(appId){
        const record =
            this.windows.get(
                appId
            );
        if(!record) return;
        record.maximized =
            !record.maximized;
        record.element.classList.toggle(
            "maximized",
            record.maximized
        );
        this.save(record);

    apply(record){
        if(record.maximized) return;
        record.element.style.left =
            record.x+"px";
        record.element.style.top =
            record.y+"px";
        record.element.style.width =
            record.width+"px";
        record.element.style.height =
            record.height+"px";

    save(record){
        const state =
            HD.appState.get(
                record.id

            x:record.x,

            height:record.height,

    enableDragging(record){
        let dragging=false;
        let offsetX=0;
        let offsetY=0;
        record.header.addEventListener(
            "pointerdown",
            event=>{
                if(
                    event.target.closest(
                        ".window-controls"
                    )
                ){
                    return;
                }
                if(record.maximized){
                    return;
                }
                dragging=true;
                offsetX =
                    event.clientX-record.x;
                offsetY =
                    event.clientY-record.y;
                record.header.setPointerCapture(
                    event.pointerId
                );
            }
        );
        record.header.addEventListener(
            "pointermove",
            event=>{
                if(!dragging) return;
                record.x =
                    Math.max(
                        5,
                        event.clientX-offsetX
                    );
                record.y =
                    Math.max(
                        60,
                        event.clientY-offsetY
                    );
                this.apply(record);
            }
        );
        record.header.addEventListener(
            "pointerup",
            event=>{
                dragging=false;
                try{
                    record.header.releasePointerCapture(
                        event.pointerId
                    );
                }catch(_){}
                this.save(record);
            }
        );
    },
    enableResize(record){
        let resizing=false;
        let startX=0;
        let startY=0;
        let startW=0;
        let startH=0;
        record.resize.addEventListener(
            "pointerdown",
            event=>{
                if(record.maximized){
                    return;
                }
                resizing=true;
                startX=event.clientX;
                startY=event.clientY;
                startW=record.width;
                startH=record.height;
                record.resize.setPointerCapture(
                    event.pointerId
                );
                event.preventDefault();
            }
        );
        record.resize.addEventListener(
            "pointermove",
            event=>{
                if(!resizing) return;
                record.width =
                    Math.max(
                        HD.config.minimumWindowWidth,
                        startW+
                        event.clientX-
                        startX
                    );
                record.height =
                    Math.max(
                        HD.config.minimumWindowHeight,
                        startH+
                        event.clientY-
                        startY
                    );
                this.apply(record);
            }
        );
        record.resize.addEventListener(
            "pointerup",
            event=>{
                resizing=false;
                try{
                    record.resize.releasePointerCapture(
                        event.pointerId

                <p>HalDo kann Antworten vorlesen und Sprachfunktionen des Geräts verwenden.</p>
                <div class="app-grid">
                    <button class="action-button primary" data-speak>HalDo sprechen</button>
                    <button class="action-button" data-stop>Stopp</button>
                </div>
            </div>
            `;
        shell.querySelector(
            "[data-speak]"
        ).onclick=()=>HD.voice.speak(
            "Hallo. Ich bin HalDo AI. Schön, dass du mit mir sprichst."
        );
        shell.querySelector(
            "[data-stop]"
        ).onclick=()=>HD.voice.stop();
        record.content.appendChild(
            shell
        );
    },
    renderSettings(record){
        const shell =
            document.createElement(
                "div"
            );
        shell.className=
            "app-shell";
        shell.innerHTML=
            `
            <div class="app-card">
                <h2>⚙️ Einstellungen</h2>
                <p>Persönliche HalDo AI OS Einstellungen.</p>
            </div>
            <div class="app-card">
                <h3>Willkommens-Ton</h3>
                <label>
                    <input type="checkbox" data-welcome>
                    HalDo AI Begrüßungston aktivieren
                </label>
            </div>
            <div class="app-card">
                <h3>Sprache</h3>
                <select class="select" data-language>
                    <option value="de-DE">Deutsch</option>
                    <option value="en-US">English</option>
                    <option value="ku">Kurdî</option>
                    <option value="ar-SA">العربية</option>
                    <option value="tr-TR">Türkçe</option>
                    <option value="fr-FR">Français</option>
                    <option value="es-ES">Español</option>
                    <option value="it-IT">Italiano</option>
                    <option value="ru-RU">Русский</option>
                    <option value="el-GR">Ελληνικά</option>
                </select>
            </div>
            `;
        const welcome =
            shell.querySelector(
                "[data-welcome]"
            );
        welcome.checked =
            !!HD.config.welcomeSound;
        welcome.onchange=()=>{
            HD.config.welcomeSound =
                welcome.checked;
            HD.storage.set(
                "setting:welcomeSound",
                welcome.checked
            );
        };
        const language =
            shell.querySelector(
                "[data-language]"
            );
        language.value =
            HD.config.language === "de"
                ? "de-DE"
                : HD.config.language;
        language.onchange=()=>{
            HD.config.language =
                language.value;
            HD.storage.set(
                "setting:language",
                language.value
            );
        };
        record.content.appendChild(
            shell
        );
    },
    renderGeneric(record){
        const manifest =
            record.app.manifest;
        const shell =
            document.createElement(
                "div"
            );
        shell.className=
            "app-shell";
        shell.innerHTML=
            `
            <div class="app-card">
                <h2>${this.escape(manifest.icon)} ${this.escape(manifest.name)}</h2>
                <p>${this.escape(manifest.description)}</p>
                <span class="status">● APP ONLINE</span>
            </div>
            <div class="app-grid">
                <button class="action-button primary" data-ai>HalDo AI Hilfe</button>
                <button class="action-button" data-save>Speichern</button>
                <button class="action-button" data-settings>Einstellungen</button>
            </div>
            <div class="app-card">
                <h3>Arbeitsbereich</h3>
                <textarea class="textarea" placeholder="Hier kann die Anwendung arbeiten …"></textarea>
        </div>
        `;
    shell.querySelector(
        "[data-ai]"
    ).onclick=()=>{
        this.close(record.id);
        this.open("haldo-ai");
    };
    shell.querySelector(
        "[data-save]"
    ).onclick=()=>{
        const state =
            HD.appState.get(
                record.id
            );
        state.savedAt =
            Date.now();
        HD.appState.save(
            record.id,
            state
        );
    };
    shell.querySelector(
        "[data-settings]"
    ).onclick=()=>{
        this.open("settings");
    };
    record.content.appendChild(
        shell
    );
}

};

HD.runtime.register(
“window-manager”,
HD.windowManager
);

/* =========================================================
APP MANAGER
========================================================= */

HD.appManager = HD.appManager || {

instances:new Map(),
get(id){
    return this.instances.get(id) || null;
},
create(id){
    const manifest =
        HD.apps.get(id);
    if(!manifest) return null;
    let instance =
        this.instances.get(id);
    if(instance) return instance;
    instance={
        id,
        name:manifest.name,
        manifest,
        state:HD.appState.get(id),
        opened:false,
        closed:true,
        active:false,
        minimized:false,
        maximized:false,
        open(){
            this.opened=true;
            this.closed=false;
            this.active=true;
            this.minimized=false;
            HD.emit(
                "app:opened",
                {app:this}
            );
            return this;
        },
        close(){
            this.opened=false;
            this.closed=true;
            this.active=false;
            this.minimized=false;
            HD.windowManager.close(
                this.id
            );
            HD.emit(
                "app:closed",
                {app:this}
            );
            return this;
        },
        minimize(){
            this.minimized=true;
            this.active=false;
            HD.windowManager.minimize(
                this.id
            );
            return this;
        },
        restore(){
            this.minimized=false;
            this.active=true;
            HD.windowManager.restore(
                this.id
            );
            return this;
        },
        maximize(){
            this.maximized=true;
            this.active=true;
            HD.windowManager
                .toggleMaximize(
                    this.id
                );
            return this;
        }
    };
    this.instances.set(
        id,
        instance
    );
    return instance;
},
open(id){
    const app =
        this.create(id);
    if(!app) return null;
    app.open();
    HD.windowManager.open(id);
    HD.router.navigate(
        "/app/"+id,
        {app}
    );
    HD.emit(
        "app:action",
        {
            appId:id,
            action:"open",
            app
        }
    );
    return app;
},
close(id){
    const app =
        this.get(id);
    if(!app) return false;
    app.close();
    return true;
},
minimize(id){
    const app =
        this.get(id);
    if(!app) return false;
    app.minimize();
    return true;
},
restore(id){
    const app =
        this.get(id);
    if(!app) return false;
    app.restore();
    return true;
},
maximize(id){
    const app =
        this.get(id);
    if(!app) return false;
    app.maximize();
    return true;
}

};

HD.runtime.register(
“app-manager”,
HD.appManager
);

MENU

document.getElementById(

);

HALDO_APPS.forEach(

);

);

/* =========================================================
SYSTEM TIME
========================================================= */

const timeElement =
document.getElementById(
“system-time”
);

timeElement.textContent =
    new Date().toLocaleString(

/* =========================================================
BOOT
========================================================= */

async function bootHalDo(){

const boot =
    document.getElementById(
        "boot-screen"
    );
const status =
    document.getElementById(
        "boot-status"
    );
const stages=[
    "HalDo AI wird gestartet …",
    "Runtime wird verbunden …",
    "App-System wird verbunden …",
    "Window-System wird verbunden …",
    "Router wird verbunden …",
    "Storage wird geladen …",
    "Living HalDo AI wird aktiviert …",
    "HalDo AI OS 22 ist bereit."
];
for(
    const message of stages
){
    status.textContent =
        message;
    await new Promise(
        resolve=>
            setTimeout(
                resolve,
                180
            )
    );
}
HD.runtime.initialized=true;
HD.initialized=true;
HD.emit(
    "system:ready",
    {
        version:HD.version
    }
);
setTimeout(
    ()=>{
        boot.classList.add(
            "hidden"
        );
        HD.audio.playWelcome();
        if(
            HD.config.welcomeSound
        ){
            setTimeout(
                ()=>{
                    HD.voice.speak(
                        "Willkommen bei HalDo AI OS 22. Schön, dass du da bist."
                    );
                },
                250
            );
        }
    },
    500
);

}

window.addEventListener(
“load”,
bootHalDo
);

/* =========================================================
RESPONSIVE WINDOW SAFETY
========================================================= */

window.addEventListener(
“resize”,
()=>{

    HD.windowManager.windows
        .forEach(
            record=>{
                if(
                    record.maximized
                ){
                    return;
                }
                const maxX =
                    Math.max(
                        5,
                        window.innerWidth -
                        record.width -
                        5
                    );
                const maxY =
                    Math.max(
                        60,
                        window.innerHeight -
                        record.height -
                        5
                    );
                record.x =
                    Math.min(
                        record.x,
                        maxX
                    );
                record.y =
                    Math.min(
                        record.y,
                        maxY
                    );
                HD.windowManager.apply(
                    record
                );
            }
        );
}

);

/* =========================================================
COMPATIBILITY BRIDGES
========================================================= */

HD.windows =
HD.windowManager;

HD.appsManager =
HD.appManager;

HD.services =
HD.services || {

    register(name,service){
        HD.runtime.register(
            name,
            service
        );
    },
    get(name){
        return HD.runtime.get(
            name
        );
    }
};

INITIAL ROUTES
========================================================= */

HD.router.register(
“/”,
()=>true
);

HALDO_APPS.forEach(
app=>{

    HD.router.register(
        "/app/"+app.id,
        data=>data
    );
}

);

HD.emit(
“haldo:index-ready”,
{
version:HD.version,
apps:HALDO_APPS.length
}
);
