<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apps Web 3.0</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1f6feb">

<link rel="apple-touch-icon" href="icon.png">

</head>


<body>


<div class="app">


<header>

<h1>Apps Web 3.0</h1>

<p id="subtitle">Login</p>

</header>



<!-- LOGIN -->

<section id="loginPage" class="page">


<h2>Anmelden</h2>


<input 
id="loginName"
placeholder="Benutzername"
>


<input 
id="loginPassword"
type="password"
placeholder="Passwort"
>


<button onclick="login()">
Anmelden
</button>


</section>




<!-- HOME -->

<section id="home" class="page hidden">


<h2 id="welcome">
Willkommen
</h2>


<p>
Aktiver Benutzer:
<span id="activeUser"></span>
</p>



<div class="icons">


<button onclick="openChat()">
💬
<span>Chat</span>
</button>



<button onclick="openUsers()">
👤
<span>Benutzer</span>
</button>



<button onclick="logout()">
🚪
<span>Logout</span>
</button>



<button>
🌐
<span>Web</span>
</button>



</div>


</section>





<!-- CHAT -->


<section id="chatPage" class="page hidden">


<div id="chatBox" class="chat"></div>


<div class="input-area">


<input 
id="messageInput"
placeholder="Nachricht schreiben..."
>


<button onclick="sendMessage()">
➤
</button>


</div>


</section>





<!-- USERS -->


<section id="usersPage" class="page hidden">


<h2>Benutzer</h2>


<div id="usersList"></div>


<input 
id="newUser"
placeholder="Neuer Benutzer"
>


<button onclick="addUser()">
Hinzufügen
</button>


</section>





<nav>


<button onclick="goHome()">
🏠
<br>
Home
</button>


<button onclick="openChat()">
💬
<br>
Chat
</button>


<button onclick="openUsers()">
👤
<br>
Benutzer
</button>


</nav>



</div>



<script src="script.js"></script>


</body>

</html>
