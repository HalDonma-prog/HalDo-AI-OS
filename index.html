<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050816">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HalDo AI OS">
    <meta name="description" content="HalDo AI OS — Cosmic AI Operating System">
    <title>HalDo AI OS</title>

    <style>
        /* =========================================================
           HALDO AI OS — MASTER STYLES
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #02030a;
            color: #ffffff;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button, input, textarea, select {
            font: inherit;
        }

        button {
            border: 0;
            outline: none;
            cursor: pointer;
        }

        /* =========================================================
           MASTER DISPLAY
           ========================================================= */

        #haldo-os {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, rgba(35,73,150,.16), transparent 30%),
                        radial-gradient(circle at 20% 20%, rgba(70,110,255,.08), transparent 30%),
                        radial-gradient(circle at 80% 80%, rgba(150,70,255,.07), transparent 32%),
                        #02030a;
        }

        /* =========================================================
           COSMIC BACKGROUND
           ========================================================= */

        .haldo-cosmic-world {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(circle at center, rgba(15,30,75,.28), transparent 42%);
        }

        /* =========================================================
           DEEP SPACE
           ========================================================= */

        .haldo-space {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.025), transparent 52%);
        }

        /* =========================================================
           STARS
           ========================================================= */

        .haldo-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .haldo-star {
            position: absolute;
            display: block;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: rgba(255,255,255,.95);
            box-shadow: 0 0 5px rgba(255,255,255,.9);
            animation: haldo-star-twinkle 4s ease-in-out infinite;
        }

        @keyframes haldo-star-twinkle {
            0%, 100% { opacity: .25; transform: scale(.75); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* =========================================================
           COSMIC CENTER
           ========================================================= */

        .haldo-cosmic-center {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(88vw, 900px);
            height: min(88vw, 900px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* =========================================================
           ORBIT SYSTEM
           ========================================================= */

        .haldo-orbit-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .haldo-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(120,175,255,.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(70,150,255,.05);
            animation: haldo-orbit-pulse 7s ease-in-out infinite;
        }

        @keyframes haldo-orbit-pulse {
            0%, 100% { opacity: .45; }
            50% { opacity: .85; }
        }

        .haldo-orbit::before {
            content: "";
            position: absolute;
            inset: -2px;
            border: 1px solid rgba(120,190,255,.08);
            border-radius: 50%;
            filter: blur(2px);
        }

        /* =========================================================
           PLANET
           ========================================================= */

        .haldo-planet {
            position: absolute;
            left: 50%;
            top: -7px;
            width: 14px;
            height: 14px;
            margin: 0;
            border-radius: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            background: radial-gradient(circle at 30% 25%, #ffffff, #8fc8ff 28%, #3263bd 62%, #0d1c43 100%);
            box-shadow: 0 0 10px rgba(80,170,255,.8);
            animation: haldo-planet-glow 3s ease-in-out infinite;
        }

        @keyframes haldo-planet-glow {
            0%, 100% { box-shadow: 0 0 8px rgba(80,170,255,.55); }
            50% { box-shadow: 0 0 18px rgba(120,200,255,.95); }
        }

        .haldo-planet-earth {
            background: radial-gradient(circle at 35% 30%, #dff8ff, #4ca9ff 20%, #1267bd 48%, #06325e 70%, #020a18 100%);
            box-shadow: 0 0 14px rgba(50,160,255,.95);
        }

        /* =========================================================
           MOON
           ========================================================= */

        .haldo-moon-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(255,255,255,.12);
            border-radius: 50%;
            animation: haldo-moon-orbit 4s linear infinite;
        }

        .haldo-moon {
            position: absolute;
            left: 50%;
            top: -3px;
            width: 6px;
            height: 6px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #aeb8c7 55%, #525a68 100%);
            box-shadow: 0 0 7px rgba(255,255,255,.7);
        }

        @keyframes haldo-moon-orbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* =========================================================
           SUN
           ========================================================= */

        .haldo-sun-container {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(190px, 24vw, 310px);
            height: clamp(190px, 24vw, 310px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
        }

        .haldo-solar-aura {
            position: absolute;
            inset: -25%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,240,130,.28), rgba(255,174,35,.13) 38%, rgba(255,100,30,.05) 58%, transparent 72%);
            filter: blur(18px);
            animation: haldo-solar-breathe 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes haldo-solar-breathe {
            0%, 100% { transform: scale(.94); opacity: .72; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        .haldo-solar-rays {
            position: absolute;
            inset: -42%;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(255,246,180,.0) 0deg, rgba(255,246,180,.0) .75deg, rgba(255,224,94,.72) 1deg, rgba(255,160,35,.12) 2deg, rgba(255,246,180,.0) 3deg, rgba(255,246,180,.0) 5deg);
            filter: blur(1px);
            animation: haldo-solar-rays 26s linear infinite;
            pointer-events: none;
        }

        @keyframes haldo-solar-rays {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .haldo-sun-button {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: transparent;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .haldo-sun-core {
            position: absolute;
            width: 66%;
            height: 66%;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 25px rgba(255,220,70,.95), 0 0 70px rgba(255,165,40,.72), 0 0 130px rgba(255,100,20,.38);
            animation: haldo-sun-breathe 4s ease-in-out infinite;
        }

        @keyframes haldo-sun-breathe {
            0%, 100% { transform: scale(.98); }
            50% { transform: scale(1.035); }
        }

        /* =========================================================
           HALDO AI AVATAR
           ========================================================= */

        .haldo-avatar {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 56%;
            height: 56%;
            transform: translate(-50%, -50%);
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            border-radius: 50%;
        }

        .haldo-avatar-aura {
            position: absolute;
            inset: -16%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.24), rgba(255,220,100,.16) 35%, rgba(100,190,255,.09) 55%, transparent 75%);
            filter: blur(9px);
            animation: haldo-avatar-aura 4s ease-in-out infinite;
        }

        @keyframes haldo-avatar-aura {
            0%, 100% { opacity: .65; transform: scale(.95); }
            50% { opacity: 1; transform: scale(1.08); }
        }

        .haldo-avatar-logo {
            position: relative;
            z-index: 4;
            width: 76%;
            height: 76%;
            object-fit: contain;
            object-position: center;
            user-select: none;
            -webkit-user-drag: none;
            filter: drop-shadow(0 0 8px rgba(255,255,255,.85)) drop-shadow(0 0 22px rgba(255,205,70,.72));
            animation: haldo-avatar-float 4.8s ease-in-out infinite;
        }

        @keyframes haldo-avatar-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.025); }
        }

        /* =========================================================
           AVATAR STATES
           ========================================================= */

        .haldo-avatar[data-state="listening"] .haldo-avatar-logo {
            animation: haldo-avatar-listening 1.8s ease-in-out infinite;
        }

        .haldo-avatar[data-state="thinking"] .haldo-avatar-logo {
            animation: haldo-avatar-thinking 2.4s ease-in-out infinite;
        }

        .haldo-avatar[data-state="speaking"] .haldo-avatar-logo {
            animation: haldo-avatar-speaking .42s ease-in-out infinite;
        }

        .haldo-avatar[data-state="happy"] .haldo-avatar-logo {
            animation: haldo-avatar-happy 1.2s ease-in-out infinite;
        }

        @keyframes haldo-avatar-listening {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        @keyframes haldo-avatar-thinking {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }

        @keyframes haldo-avatar-speaking {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.035); }
        }

        @keyframes haldo-avatar-happy {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(-2deg); }
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 700px) {
            .haldo-cosmic-center { width: 96vw; height: 96vw; }
            .haldo-orbit-system { transform: translate(-50%, -50%) scale(.72); }
            .haldo-sun-container { width: 190px; height: 190px; }
        }

        @media (max-width: 430px) {
            .haldo-sun-container { width: 145px; height: 145px; }
            .haldo-cosmic-center { width: 100vw; height: 100vw; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <div id="haldo-os" data-haldo-os="true">
        <main class="haldo-cosmic-world" data-haldo-cosmic aria-label="HalDo AI OS Cosmic World">

            <div class="haldo-space" aria-hidden="true"></div>
            <div class="haldo-stars" id="haldo-stars" aria-hidden="true"></div>

            <section class="haldo-cosmic-center" aria-label="HalDo Cosmic Center">

                <div class="haldo-orbit-system" aria-hidden="true">

                    <div class="haldo-orbit" style="width:190px;height:190px;">
                        <button class="haldo-planet" type="button" aria-label="Planet"></button>
                    </div>

                    <div class="haldo-orbit" style="width:270px;height:270px;">
                        <button class="haldo-planet" type="button" aria-label="Planet"></button>
                    </div>

                    <div class="haldo-orbit" style="width:350px;height:350px;">
                        <button class="haldo-planet haldo-planet-earth" type="button" aria-label="Erde">
                            <span class="haldo-moon-orbit"><span class="haldo-moon"></span></span>
                        </button>
                    </div>

                </div>

                <div class="haldo-sun-container">
                    <div class="haldo-solar-aura" aria-hidden="true"></div>
                    <div class="haldo-solar-rays" aria-hidden="true"></div>

                    <button class="haldo-sun-button" id="haldo-sun-button" type="button" aria-label="HalDo AI öffnen">
                        <span class="haldo-sun-core"></span>
                        <span class="haldo-avatar" id="haldo-avatar" data-state="idle">
                            <span class="haldo-avatar-aura"></span>
                            <img class="haldo-avatar-logo" src="assets/logo/logo.png" alt="HalDo AI">
                        </span>
                    </button>
                </div>

            </section>
        </main>
    </div>

    <!-- =========================================================
    HALDO MASTER FOUNDATION
    ========================================================= -->

    <script>
    "use strict";

    window.HalDo = window.HalDo || {};
    window.HalDo.OS = window.HalDo.OS || {};
    window.HalDo.OS.version = "22.0.0";
    window.HalDo.OS.build = "COSMIC-MASTER";

    window.HalDo.state = window.HalDo.state || {
        booted: false,
        avatar: "idle",
        language: "de",
        activeApp: null,
        activeWindow: null,
        ai: { listening: false, thinking: false, speaking: false }
    };

    /* =========================================================
       EVENT BUS
       ========================================================= */

    window.HalDo.events = window.HalDo.events || new EventTarget();

    window.HalDo.emit = function(name, detail = {}) {
        window.HalDo.events.dispatchEvent(new CustomEvent(name, { detail }));
    };

    window.HalDo.on = function(name, callback) {
        if (typeof callback !== "function") return;
        window.HalDo.events.addEventListener(name, callback);
    };

    /* =========================================================
       AVATAR CONTROLLER
       ========================================================= */

    window.HalDo.Avatar = {
        element: null,

        init() {
            this.element = document.getElementById("haldo-avatar");
            if (!this.element) return;
            this.setState("idle");
        },

        setState(state) {
            if (!this.element) return;
            this.element.dataset.state = state;
            window.HalDo.state.avatar = state;
            window.HalDo.emit("avatar:state", { state });
        },

        idle() { this.setState("idle"); },
        listening() { this.setState("listening"); },
        thinking() { this.setState("thinking"); },
        speaking() { this.setState("speaking"); },
        happy() { this.setState("happy"); }
    };

    /* =========================================================
       AI OPEN REQUEST
       ========================================================= */

    window.HalDo.openAI = function() {
        window.HalDo.Avatar.happy();
        window.HalDo.emit("ai:open", { source: "cosmic-sun" });
        if (window.HalDo.AppManager && typeof window.HalDo.AppManager.open === "function") {
            window.HalDo.AppManager.open("ai-chat");
        }
    };

    /* =========================================================
       SUN INTERACTION
       ========================================================= */

    const sunButton = document.getElementById("haldo-sun-button");
    if (sunButton) {
        sunButton.addEventListener("click", function() {
            window.HalDo.openAI();
        });
    }

    /* =========================================================
       AI EVENT CONNECTION
       ========================================================= */

    window.HalDo.on("ai:listening", () => window.HalDo.Avatar.listening());
    window.HalDo.on("ai:thinking", () => window.HalDo.Avatar.thinking());
    window.HalDo.on("ai:speaking", () => window.HalDo.Avatar.speaking());
    window.HalDo.on("ai:idle", () => window.HalDo.Avatar.idle());
    window.HalDo.on("ai:happy", () => window.HalDo.Avatar.happy());

    /* =========================================================
       BOOT
       ========================================================= */

    function haldoMasterBoot() {
        window.HalDo.Avatar.init();
        window.HalDo.state.booted = true;
        window.HalDo.emit("haldo:booted", { version: window.HalDo.OS.version, build: window.HalDo.OS.build });

        // Generate stars
        const stars = document.getElementById("haldo-stars");
        if (stars) {
            for (let i = 0; i < 200; i++) {
                const star = document.createElement("span");
                star.className = "haldo-star";
                const size = Math.random() * 2 + 1;
                star.style.width = size + "px";
                star.style.height = size + "px";
                star.style.left = Math.random() * 100 + "%";
                star.style.top = Math.random() * 100 + "%";
                star.style.animationDuration = (2 + Math.random() * 3) + "s";
                star.style.animationDelay = (Math.random() * 3) + "s";
                stars.appendChild(star);
            }
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", haldoMasterBoot, { once: true });
    } else {
        haldoMasterBoot();
    }
    </script>

    <!-- =========================================================
    HALDO AI OS — COMPLETE CHAT + VOICE + AVATAR + APP BRIDGE
    ========================================================= -->

    <style>
        /* =========================================================
           AI CHAT WINDOW
           ========================================================= */

        .haldo-ai-chat-window {
            position: fixed;
            z-index: 9000;
            width: min(520px, calc(100vw - 24px));
            height: min(600px, calc(100vh - 40px));
            right: 18px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 24px;
            background: rgba(12,15,30,.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 0 18px 70px rgba(0,0,0,.45);
            opacity: 0;
            visibility: hidden;
            transform: translateY(18px) scale(.97);
            transition: opacity .25s ease, transform .25s ease, visibility .25s;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            color: #fff;
        }

        .haldo-ai-chat-window.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .haldo-ai-chat-window.minimized {
            height: 60px;
            min-height: 60px;
        }

        .haldo-ai-chat-window.minimized .haldo-chat-body,
        .haldo-ai-chat-window.minimized .haldo-chat-footer {
            display: none;
        }

        .haldo-chat-header {
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px 8px 18px;
            cursor: grab;
            user-select: none;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .haldo-chat-title {
            font-size: 16px;
            font-weight: 700;
        }

        .haldo-chat-subtitle {
            font-size: 11px;
            opacity: .55;
            margin-top: 2px;
        }

        .haldo-chat-controls {
            display: flex;
            gap: 4px;
        }

        .haldo-chat-control {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 9px;
            background: rgba(255,255,255,.07);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        .haldo-chat-control:hover {
            background: rgba(255,255,255,.14);
        }

        .haldo-chat-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .haldo-chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .haldo-chat-message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            word-break: break-word;
            animation: haldoMessageIn .25s ease-out;
        }

        .haldo-chat-message-user {
            align-self: flex-end;
            background: rgba(255,255,255,.12);
            border-bottom-right-radius: 4px;
        }

        .haldo-chat-message-ai {
            align-self: flex-start;
            background: rgba(255,220,140,.10);
            border: 1px solid rgba(255,255,255,.07);
            border-bottom-left-radius: 4px;
        }

        .haldo-chat-typing {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 0 16px 8px;
        }

        .haldo-chat-typing.active {
            display: flex;
        }

        .haldo-chat-typing span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: .35;
            animation: haldoTypingDot 1s ease-in-out infinite;
        }

        .haldo-chat-typing span:nth-child(2) { animation-delay: .12s; }
        .haldo-chat-typing span:nth-child(3) { animation-delay: .24s; }

        @keyframes haldoTypingDot {
            0%, 100% { transform: translateY(0); opacity: .3; }
            50% { transform: translateY(-4px); opacity: .9; }
        }

        @keyframes haldoMessageIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .haldo-chat-footer {
            padding: 10px 12px 14px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .haldo-chat-input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .haldo-chat-input {
            flex: 1;
            min-height: 44px;
            max-height: 150px;
            resize: none;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            padding: 11px 14px;
            background: rgba(255,255,255,.06);
            color: #fff;
            font: inherit;
            outline: none;
            line-height: 1.4;
        }

        .haldo-chat-input:focus {
            border-color: rgba(255,255,255,.25);
        }

        .haldo-chat-send,
        .haldo-chat-voice {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            border: 0;
            border-radius: 13px;
            background: rgba(255,255,255,.08);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
        }

        .haldo-chat-send:hover,
        .haldo-chat-voice:hover {
            background: rgba(255,255,255,.15);
        }

        .haldo-chat-voice.listening {
            background: rgba(255,80,80,.25);
            box-shadow: 0 0 20px rgba(255,80,80,.15);
        }

        @media (max-width: 700px) {
            .haldo-ai-chat-window {
                right: 8px;
                bottom: 8px;
                width: calc(100vw - 16px);

    <!-- =========================================================

    <script>
    "use strict";

    // =========================================================
    // HALDO CHAT CONTROLLER
    // =========================================================

    window.HalDo = window.HalDo || {};

    window.HalDo.Chat = {
        window: null,
        messages: null,
        input: null,
        sendBtn: null,
        voiceBtn: null,
        status: null,
        typing: null,
        open: false,
        minimized: false,
        history: [],
        recognition: null,
        listening: false,

        init() {
            this.window = document.getElementById("haldo-chat-window");
            this.messages = document.getElementById("haldo-chat-messages");
            this.input = document.getElementById("haldo-chat-input");
            this.sendBtn = document.getElementById("haldo-chat-send");
            this.voiceBtn = document.getElementById("haldo-chat-voice");
            this.status = document.getElementById("haldo-chat-status");
            this.typing = document.getElementById("haldo-chat-typing");

            document.getElementById("haldo-chat-close").addEventListener("click", () => this.close());
            document.getElementById("haldo-chat-minimize").addEventListener("click", () => this.toggleMinimize());
            this.sendBtn.addEventListener("click", () => this.send());
            this.voiceBtn.addEventListener("click", () => this.toggleVoice());

            this.input.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    this.send();
                }
            });

            this.input.addEventListener("input", () => {
                this.input.style.height = "auto";
                this.input.style.height = Math.min(this.input.scrollHeight, 150) + "px";
            });

            // Load history
            try {
                const saved = localStorage.getItem("haldo-chat-history");
                if (saved) {
                    this.history = JSON.parse(saved);
                    this.history.forEach(msg => this.renderMessage(msg.role, msg.content));
                }
            } catch(e) {}

            // Welcome message
            if (this.history.length === 0) {
                this.renderMessage("ai", "Hallo! Ich bin HalDo AI. 💙❤️ Wie kann ich dir helfen?");
            }

            // Auto-open on sun click
            document.addEventListener("haldo:ai:open", () => this.open());

            this.setupSpeech();
        },

        open() {
            this.window.classList.add("open");
            this.window.removeAttribute("aria-hidden");
            this.open = true;
            setTimeout(() => this.input.focus(), 100);
        },

        close() {
            this.window.classList.remove("open");
            this.window.setAttribute("aria-hidden", "true");
            this.open = false;
            if (this.listening) this.stopVoice();
        },

        toggleMinimize() {
            this.minimized = !this.minimized;
            this.window.classList.toggle("minimized", this.minimized);
            if (!this.minimized && this.open) {
                setTimeout(() => this.input.focus(), 100);
            }
        },

        renderMessage(role, content) {
            const div = document.createElement("div");
            div.className = `haldo-chat-message ${role === "user" ? "haldo-chat-message-user" : "haldo-chat-message-ai"}`;
            div.textContent = content;
            this.messages.appendChild(div);
            this.messages.scrollTop = this.messages.scrollHeight;
        },

        setStatus(text) {
            this.status.textContent = text;
        },

        showTyping() {
            this.typing.classList.add("active");
            this.setStatus("HalDo AI denkt …");
            if (window.HalDo.Avatar) window.HalDo.Avatar.thinking();
        },

        hideTyping() {
            this.typing.classList.remove("active");
            this.setStatus("Bereit");
            if (window.HalDo.Avatar) window.HalDo.Avatar.idle();
        },

        async send() {
            const text = this.input.value.trim();
            if (!text || this._sending) return;

            this.input.value = "";
            this.input.style.height = "auto";
            this.renderMessage("user", text);
            this.history.push({ role: "user", content: text });
            this.saveHistory();

            this._sending = true;
            this.showTyping();

            try {
                const response = await this.getAIResponse(text);
                this.hideTyping();
                this.renderMessage("ai", response);
                this.history.push({ role: "ai", content: response });
                this.saveHistory();

                if (window.HalDo.Avatar) window.HalDo.Avatar.speaking();
                setTimeout(() => {
                    if (window.HalDo.Avatar) window.HalDo.Avatar.idle();
                }, 1000);

                // Speak response
                this.speak(response);

            } catch(e) {
                this.hideTyping();
                this.renderMessage("ai", "Entschuldigung, ein Fehler ist aufgetreten.");
                console.error("[HalDo Chat]", e);
            }

            this._sending = false;
        },

        async getAIResponse(text) {
            // Try existing AI Core first
            const cores = [
                window.HalDo.AICore,
                window.HalDo.AI,
                window.HalDo.AIEngine,
                window.HalDo.ConversationRuntime
            ];

            for (const core of cores) {
                if (core && typeof core.respond === "function") {
                    try {
                        const result = await core.respond(text, { history: this.history });
                        if (result) return String(result);
                    } catch(e) {}
                }
                if (core && typeof core.send === "function") {
                    try {
                        const result = await core.send(text);
                        if (result) return String(result);
                    } catch(e) {}
                }
                if (core && typeof core.chat === "function") {
                    try {
                        const result = await core.chat(text);
                        if (result) return String(result);
                    } catch(e) {}
                }
            }

            // Local fallback
            return this.localResponse(text);
        },

        localResponse(text) {
            const lower = text.toLowerCase();
            if (lower.includes("hallo") || lower.includes("hi") || lower.includes("hey")) {
                return "Hallo! Schön, dass du da bist. 💙❤️ Wie kann ich dir helfen?";
            }
            if (lower.includes("wer bist du") || lower.includes("was bist du")) {
                return "Ich bin HalDo AI – dein intelligenter Begleiter im HalDo AI OS!";
            }
            if (lower.includes("danke")) {
                return "Sehr gerne! 💙";
            }
            if (lower.includes("hilfe")) {
                return "Ich kann mit dir schreiben, sprechen, Apps öffnen, Fragen beantworten und dich durch das System begleiten.";
            }
            if (lower.includes("uhr") || lower.includes("zeit")) {
                return `Die aktuelle Zeit ist ${new Date().toLocaleTimeString()}.`;
            }
            if (lower.includes("datum")) {
                return `Heute ist ${new Date().toLocaleDateString()}.`;
            }
            return "Ich habe deine Nachricht verstanden. Für vollständige AI-Antworten kann ich mit dem verbundenen HalDo AI Core arbeiten.";
        },

        // =========================================================
        // SPEECH SYNTHESIS
        // =========================================================

        speak(text) {
            if (!window.speechSynthesis) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "de-DE";
                utterance.rate = 0.95;
                utterance.pitch = 1.02;
                utterance.volume = 0.8;
                utterance.onstart = () => {
                    if (window.HalDo.Avatar) window.HalDo.Avatar.speaking();
                };
                utterance.onend = () => {
                    if (window.HalDo.Avatar) window.HalDo.Avatar.idle();
                };
                window.speechSynthesis.speak(utterance);
            } catch(e) {}
        },

        // =========================================================
        // SPEECH RECOGNITION
        // =========================================================

        setupSpeech() {
            const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Recognition) return;

            this.recognition = new Recognition();
            this.recognition.lang = "de-DE";
            this.recognition.continuous = false;
            this.recognition.interimResults = true;

            this.recognition.onstart = () => {
                this.listening = true;
                this.voiceBtn.classList.add("listening");
                this.setStatus("Ich höre zu …");
                if (window.HalDo.Avatar) window.HalDo.Avatar.listening();
            };

            this.recognition.onresult = (event) => {
                let final = "";
                let interim = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) final += transcript;
                    else interim += transcript;
                }
                if (final) {
                    this.input.value = final;
                    this.stopVoice();
                    this.send();
                } else if (interim) {
                    this.input.value = interim;
                }
            };

            this.recognition.onerror = () => {
                this.stopVoice();
            };

            this.recognition.onend = () => {
                this.listening = false;
                this.voiceBtn.classList.remove("listening");
                if (window.HalDo.Avatar) window.HalDo.Avatar.idle();
                this.setStatus("Bereit");
            };
        },

        toggleVoice() {
            if (this.listening) {
                this.stopVoice();
            } else {
                this.startVoice();
            }
        },

        startVoice() {
            if (!this.recognition) {
                this.setStatus("Spracheingabe nicht verfügbar");
                return;
            }
            try {
                this.recognition.start();
            } catch(e) {}
        },

        stopVoice() {
            try {
                this.recognition.stop();
            } catch(e) {}
            this.listening = false;
            this.voiceBtn.classList.remove("listening");
            if (window.HalDo.Avatar) window.HalDo.Avatar.idle();
            this.setStatus("Bereit");
        },

        saveHistory() {
            try {
                localStorage.setItem("haldo-chat-history", JSON.stringify(this.history.slice(-100)));
            } catch(e) {}
        }
    };

    // =========================================================
    // START CHAT
    // =========================================================

    document.addEventListener("DOMContentLoaded", () => {
        window.HalDo.Chat.init();

        // Open chat from sun button
        const sunBtn = document.getElementById("haldo-sun-button");
        if (sunBtn) {
            sunBtn.addEventListener("click", () => {
                setTimeout(() => window.HalDo.Chat.open(), 100);
            });
        }

        // Global shortcut: Ctrl+K
        document.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "k") {
                e.preventDefault();
                if (window.HalDo.Chat.open) {
                    window.HalDo.Chat.open ? window.HalDo.Chat.close() : window.HalDo.Chat.open();
                }
            }
        });
    });

    // =========================================================
    // GLOBAL API
    // =========================================================

    window.HalDo.openChat = function() {
        if (window.HalDo.Chat) window.HalDo.Chat.open();
    };

    window.HalDo.closeChat = function() {
        if (window.HalDo.Chat) window.HalDo.Chat.close();
    };

    window.HalDo.sendChatMessage = function(text) {
        if (window.HalDo.Chat) {
            window.HalDo.Chat.input.value = text;
            window.HalDo.Chat.send();
        }
    };

    window.HalDo.toggleChat = function() {
        if (window.HalDo.Chat) {
            window.HalDo.Chat.open ? window.HalDo.Chat.close() : window.HalDo.Chat.open();
        }
    };
    </script>

    "use strict";

    // =========================================================

    window.HalDo.LivingAvatar = {
        element: null,
        state: "idle",

        init() {
            this.element = document.getElementById("haldo-living-avatar");
            if (!this.element) return;

            // Show after short delay
            setTimeout(() => this.element.classList.add("visible"), 500);

            this.element.addEventListener("click", () => {

                this.react("happy", 800);

            document.addEventListener("haldo:ai:open", () => {

                this.react("happy", 600);
            });
        },

        setState(state) {
            this.state = state;
            if (this.element) {
                this.element.dataset.state = state;
            }
            if (window.HalDo.Avatar) {
                window.HalDo.Avatar.setState(state);
            }
        },

        react(state, duration = 800) {
            this.setState(state);
            clearTimeout(this._timer);
            this._timer = setTimeout(() => {
                this.setState("idle");
            }, duration);
        },

        listening() { this.setState("listening"); },
        thinking() { this.setState("thinking"); },
        speaking() { this.setState("speaking"); },
        happy() { this.react("happy", 800); },
        idle() { this.setState("idle"); }

        // Chat status
        document.addEventListener("haldo:chat:open", () => window.HalDo.LivingAvatar.happy());

            notes: `
                <div style="padding:20px;">
                    <div style="font-size:32px;font-weight:700;margin-bottom:12px;">📝 Notizen</div>
                    <div style="opacity:.7;font-size:14px;">Deine Notizen erscheinen hier.</div>
                    <div style="margin-top:16px;display:flex;gap:10px;">
                        <input type="text" placeholder="Notiz Titel..." style="flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;">
                        <button style="padding:10px 20px;border-radius:10px;background:rgba(255,200,80,.2);color:#fff;cursor:pointer;">+</button>
                    </div>
                    <div style="margin-top:16px;color:rgba(255,255,255,.3);text-align:center;font-size:14px;">Keine Notizen vorhanden</div>
                </div>
            `,
            settings: `
                <div style="padding:20px;">
                    <div style="font-size:32px;font-weight:700;margin-bottom:12px;">⚙️ Einstellungen</div>
                    <div style="opacity:.7;font-size:14px;">System, Anzeige, Sprache, AI und Geräte</div>
                    <div style="margin-top:16px;display:grid;gap:8px;">
                        ${['Sprache', 'Thema', 'AI', 'Voice', 'Speicher', 'System'].map(s =>
                            `<div style="padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;">
                                <span>${s}</span>
                                <span style="opacity:.4;font-size:12px;">›</span>
                            </div>`
                        ).join('')}
                    </div>
                </div>
            `
        };

        const content = appWindows[appId] || `
            <div style="padding:40px;text-align:center;">
                <div style="font-size:48px;margin-bottom:12px;">📱</div>
                <div style="font-size:20px;font-weight:700;">${appId}</div>
                <div style="opacity:.5;margin-top:8px;">Diese App wird vorbereitet.</div>
            </div>
        `;

        // Create floating window
        const existing = document.querySelector(`[data-app-window="${appId}"]`);
        if (existing) {
            existing.style.display = "flex";
            existing.style.opacity = "1";
            return;
        }

        const win = document.createElement("div");
        win.dataset.appWindow = appId;
        win.style.cssText = `
            position: fixed;
            z-index: 9999;
            width: min(480px, 92vw);
            max-height: 70vh;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10,14,30,0.95);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: 0 30px 80px rgba(0,0,0,.6);
            overflow: auto;
            color: #fff;
            animation: haldoWindowIn .25s ease-out;
        `;

        win.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07);">
                <span style="font-weight:700;font-size:16px;">${appId.charAt(0).toUpperCase() + appId.slice(1)}</span>
                <button style="background:rgba(255,255,255,.08);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;" onclick="this.closest('[data-app-window]').remove()">×</button>
            </div>
            <div style="padding:16px;overflow-y:auto;max-height:60vh;">
                ${content}
            </div>
        `;

        document.body.appendChild(win);

        // Close on click outside
        win.addEventListener("click", (e) => {
            if (e.target === win) win.remove();
        });
    };

    // Add window animation
    const style = document.createElement("style");
    style.textContent = `
        @keyframes haldoWindowIn {
            from { opacity: 0; transform: translate(-50%, -45%) scale(.96); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    `;
    document.head.appendChild(style);
    </script>

</body>
</html>
