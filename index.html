<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050711"
>

<meta
    name="description"
    content="HalDo AI OS 20.1 — Cosmic AI Operating System"
>

<link
    rel="manifest"
    href="manifest.json"
>

<title>HalDo AI OS 20.1</title>


<style>

/* ============================================================
   HALDO AI OS 20.1
   COSMIC FOUNDATION
   ============================================================ */

:root {

    --bg:
        #03050d;

    --glass:
        rgba(12, 16, 34, .72);

    --glass-strong:
        rgba(10, 13, 28, .92);

    --line:
        rgba(255,255,255,.10);

    --text:
        rgba(255,255,255,.94);

    --muted:
        rgba(255,255,255,.55);

    --accent:
        #9da9ff;

    --accent-soft:
        rgba(130,145,255,.22);

    --shadow:
        rgba(0,0,0,.45);

}


/* ============================================================
   RESET
   ============================================================ */

*,
*::before,
*::after {

    box-sizing:
        border-box;

}


html,
body {

    width:
        100%;

    height:
        100%;

    margin:
        0;

    padding:
        0;

}


body {

    overflow:
        hidden;

    background:
        var(--bg);

    color:
        var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing:
        antialiased;

}


/* ============================================================
   ROOT
   ============================================================ */

#haldo-root {

    position:
        fixed;

    inset:
        0;

    overflow:
        hidden;

}


/* ============================================================
   COSMIC DESKTOP
   ============================================================ */

#desktop {

    position:
        absolute;

    inset:
        0;

    display:
        none;

    overflow:
        hidden;

}


#desktop.active {

    display:
        block;

}


/* ============================================================
   COSMIC BACKGROUND
   ============================================================ */

.cosmic-space {

    position:
        absolute;

    inset:
        0;

    overflow:
        hidden;

    background:

        radial-gradient(
            circle at 50% 47%,
            rgba(105,125,255,.18),
            transparent 18%
        ),

        radial-gradient(
            circle at 15% 25%,
            rgba(130,150,255,.10),
            transparent 20%
        ),

        radial-gradient(
            circle at 82% 70%,
            rgba(180,110,255,.08),
            transparent 22%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(50,80,180,.10),
            transparent 35%
        ),

        #03050d;

}


/* ============================================================
   STARS
   ============================================================ */

.stars {

    position:
        absolute;

    inset:
        0;

    pointer-events:
        none;

    opacity:
        .8;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.8) 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(180,200,255,.55) 1px,
            transparent 1.5px
        ),

        radial-gradient(
            circle,
            rgba(255,255,255,.4) 1px,
            transparent 1.5px
        );

    background-size:
        130px 130px,
        190px 190px,
        260px 260px;

    background-position:
        0 0,
        45px 80px,
        120px 30px;

    animation:
        stars-drift
        80s
        linear
        infinite;

}


@keyframes stars-drift {

    from {
        transform:
            translate3d(0,0,0);
    }

    to {
        transform:
            translate3d(-100px,70px,0);
    }

}


/* ============================================================
   PLANETS
   ============================================================ */

.planet {

    position:
        absolute;

    border-radius:
        50%;

    pointer-events:
        none;

}


.planet-one {

    width:
        95px;

    height:
        95px;

    left:
        7%;

    top:
        23%;

    background:

        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.5),
            rgba(120,145,230,.38) 28%,
            rgba(50,65,130,.55) 70%,
            rgba(10,15,40,.9)
        );

    box-shadow:
        0 0 35px rgba(100,130,255,.18);

}


.planet-two {

    width:
        54px;

    height:
        54px;

    right:
        11%;

    top:
        27%;

    background:

        radial-gradient(
            circle at 35% 30%,
            rgba(255,220,180,.55),
            rgba(170,110,90,.45) 40%,
            rgba(45,20,35,.9)
        );

    box-shadow:
        0 0 28px rgba(200,130,120,.16);

}


.planet-three {

    width:
        38px;

    height:
        38px;

    right:
        24%;

    bottom:
        18%;

    background:

        radial-gradient(
            circle at 35% 30%,
            rgba(210,230,255,.65),
            rgba(90,130,190,.4) 50%,
            rgba(20,30,70,.9)
        );

}


/* ============================================================
   ORBIT
   ============================================================ */

.orbit {

    position:
        absolute;

    left:
        50%;

    top:
        47%;

    width:
        470px;

    height:
        470px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid rgba(160,175,255,.10);

    border-radius:
        50%;

    pointer-events:
        none;

}


.orbit::before {

    content:
        "";

    position:
        absolute;

    inset:
        70px;

    border:
        1px solid rgba(160,175,255,.07);

    border-radius:
        50%;

}


/* ============================================================
   HALDO SUN / AI CENTER
   ============================================================ */

#haldo-sun {

    position:
        absolute;

    left:
        50%;

    top:
        47%;

    width:
        170px;

    height:
        170px;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    display:
        grid;

    place-items:
        center;

    z-index:
        20;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.98) 0%,
            rgba(255,240,190,.92) 16%,
            rgba(255,205,100,.62) 34%,
            rgba(130,145,255,.20) 62%,
            transparent 76%
        );

    box-shadow:

        0 0 35px
        rgba(255,220,130,.45),

        0 0 90px
        rgba(125,145,255,.30),

        0 0 150px
        rgba(100,120,255,.15);

    animation:
        sun-breathe
        5s
        ease-in-out
        infinite;

}


@keyframes sun-breathe {

    0%,
    100% {

        transform:
            translate(-50%,-50%)
            scale(1);

    }

    50% {

        transform:
            translate(-50%,-50%)
            scale(1.045);

    }

}


#haldo-avatar {

    width:
        100px;

    height:
        100px;

    border-radius:
        50%;

    display:
        grid;

    place-items:
        center;

    overflow:
        hidden;

    background:
        rgba(255,255,255,.16);

    border:
        1px solid
        rgba(255,255,255,.28);

    box-shadow:
        inset 0 0 25px
        rgba(255,255,255,.18);

}


#haldo-avatar span {

    font-size:
        48px;

    font-weight:
        900;

    letter-spacing:
        -.08em;

    text-shadow:
        0 0 28px
        rgba(255,255,255,.8);

}


/* ============================================================
   TOP BAR
   ============================================================ */

#topbar {

    position:
        absolute;

    left:
        0;

    right:
        0;

    top:
        0;

    height:
        58px;

    z-index:
        1000;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        0 18px;

    background:
        rgba(3,5,13,.48);

    backdrop-filter:
        blur(20px);

    border-bottom:
        1px solid var(--line);

}


.brand {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    font-weight:
        800;

}


.brand-mark {

    width:
        30px;

    height:
        30px;

    display:
        grid;

    place-items:
        center;

    border-radius:
        10px;

    background:
        rgba(255,255,255,.10);

}


.system-status {

    font-size:
        12px;

    color:
        var(--muted);

}


/* ============================================================
   WINDOWS
   ============================================================ */

#windows {

    position:
        absolute;

    inset:
        58px 0 86px;

    z-index:
        500;

    pointer-events:
        none;

}


.window {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        min(88vw,900px);

    height:
        min(72vh,650px);

    transform:
        translate(-50%,-50%);

    display:
        flex;

    flex-direction:
        column;

    overflow:
        hidden;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:
        24px;

    background:
        var(--glass-strong);

    backdrop-filter:
        blur(30px);

    box-shadow:
        0 35px 100px
        var(--shadow);

    pointer-events:
        auto;

}


.window-header {

    flex:
        0 0 54px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        0 14px 0 18px;

    background:
        rgba(255,255,255,.045);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

}


.window-title {

    font-weight:
        750;

}


.window-controls {

    display:
        flex;

    gap:
        6px;

}


.window-control {

    width:
        32px;

    height:
        32px;

    border:
        0;

    border-radius:
        9px;

    color:
        #fff;

    background:
        rgba(255,255,255,.07);

}


.window-control:hover {

    background:
        rgba(255,255,255,.14);

}


.window-body {

    flex:
        1;

    overflow:
        auto;

    padding:
        22px;

}


/* ============================================================
   APP CONTENT
   ============================================================ */

.app-hero {

    padding:
        22px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:
        20px;

    background:
        rgba(255,255,255,.04);

    margin-bottom:
        14px;

}


.app-hero-icon {

    font-size:
        38px;

    margin-bottom:
        10px;

}


.app-hero-title {

    font-size:
        24px;

    font-weight:
        800;

}


.app-hero-description {

    margin-top:
        6px;

    color:
        var(--muted);

}


.app-section {

    padding:
        18px;

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius:
        18px;

    background:
        rgba(255,255,255,.035);

    margin-bottom:
        12px;

}


.app-section h3 {

    margin:
        0 0 8px;

}


.muted {

    color:
        var(--muted);

    font-size:
        13px;

    line-height:
        1.55;

}


.action {

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:
        12px;

    padding:
        10px 14px;

    color:
        #fff;

    background:
        var(--accent-soft);

}


.action:hover {

    background:
        rgba(130,145,255,.34);

}


/* ============================================================
   LAUNCHER
   ============================================================ */

#launcher {

    position:
        absolute;

    left:
        50%;

    top:
        72px;

    transform:
        translateX(-50%);

    width:
        min(94vw,1050px);

    height:
        min(78vh,720px);

    z-index:
        3000;

    display:
        none;

    padding:
        22px;

    border:
        1px solid
        var(--line);

    border-radius:
        28px;

    background:
        rgba(8,11,24,.94);

    backdrop-filter:
        blur(35px);

    box-shadow:
        0 40px 120px
        rgba(0,0,0,.6);

}


#launcher.open {

    display:
        block;

}


.launcher-header {

    display:
        flex;

    gap:
        10px;

    margin-bottom:
        18px;

}


#app-search {

    flex:
        1;

    height:
        48px;

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:
        none;

    border-radius:
        14px;

    padding:
        0 16px;

    color:
        #fff;

    background:
        rgba(255,255,255,.06);

}


#launcher-close {

    width:
        48px;

    border:
        0;

    border-radius:
        14px;

    color:
        #fff;

    background:
        rgba(255,255,255,.07);

}


#app-grid {

    height:
        calc(100% - 66px);

    overflow:
        auto;

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(150px,1fr)
        );

    gap:
        11px;

}


.app-card {

    min-height:
        125px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:
        19px;

    padding:
        16px;

    color:
        #fff;

    text-align:
        left;

    background:
        rgba(255,255,255,.035);

    transition:
        transform .18s,
        background .18s;

}


.app-card:hover {

    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.08);

}


.app-icon {

    font-size:
        30px;

    margin-bottom:
        11px;

}


.app-name {

    font-weight:
        700;

}


.app-category {

    margin-top:
        5px;

    font-size:
        10px;

    color:
        var(--muted);

}


/* ============================================================
   DOCK
   ============================================================ */

#dock {

    position:
        absolute;

    left:
        50%;

    bottom:
        18px;

    transform:
        translateX(-50%);

    z-index:
        4000;

    display:
        flex;

    gap:
        8px;

    padding:
        9px;

    border:
        1px solid
        rgba(255,255,255,.11);

    border-radius:
        23px;

    background:
        rgba(8,11,24,.75);

    backdrop-filter:
        blur(25px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.4);

}


.dock-button {

    width:
        48px;

    height:
        48px;

    border:
        0;

    border-radius:
        15px;

    color:
        #fff;

    background:
        rgba(255,255,255,.06);

}


.dock-button:hover {

    transform:
        translateY(-4px);

    background:
        rgba(255,255,255,.13);

}


/* ============================================================
   TOAST
   ============================================================ */

#toast {

    position:
        absolute;

    left:
        50%;

    bottom:
        90px;

    transform:
        translateX(-50%);

    z-index:
        5000;

    max-width:
        90vw;

    padding:
        11px 17px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:
        14px;

    background:
        rgba(10,13,26,.94);

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity .2s;

}


#toast.visible {

    opacity:
        1;

}


/* ============================================================
   BOOT
   ============================================================ */

#boot {

    position:
        absolute;

    inset:
        0;

    z-index:
        99999;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        #03050d;

    transition:
        opacity .7s,
        visibility .7s;

}


#boot.finished {

    opacity:
        0;

    visibility:
        hidden;

    pointer-events:
        none;

}


.boot-content {

    width:
        min(90vw,520px);

    text-align:
        center;

}


.boot-logo {

    width:
        105px;

    height:
        105px;

    margin:
        0 auto 24px;

    display:
        grid;

    place-items:
        center;

    border-radius:
        32px;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95),
            rgba(130,145,255,.48),
            transparent 72%
        );

    box-shadow:
        0 0 60px
        rgba(130,145,255,.38);

}


.boot-logo span {

    font-size:
        48px;

    font-weight:
        900;

}


.boot-title {

    margin:
        0;

    font-size:
        34px;

}


.boot-subtitle {

    margin:
        8px 0 30px;

    color:
        var(--muted);

}


#boot-message {

    min-height:
        22px;

}


.boot-track {

    height:
        4px;

    margin-top:
        14px;

    border-radius:
        99px;

    overflow:
        hidden;

    background:
        rgba(255,255,255,.08);

}


#boot-progress {

    width:
        0%;

    height:
        100%;

    background:
        linear-gradient(
            90deg,
            #7585ff,
            #ffffff,
            #7585ff
        );

    transition:
        width .25s;

}


#boot-detail {

    margin-top:
        9px;

    font-size:
        10px;

    color:
        var(--muted);

}


/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width:700px) {

    .orbit {

        width:
            320px;

        height:
            320px;

    }


    #haldo-sun {

        width:
            135px;

        height:
            135px;

    }


    #haldo-avatar {

        width:
            82px;

        height:
            82px;

    }


    #windows {

        inset:
            58px 0 80px;

    }


    .window {

        width:
            94vw;

        height:
            78vh;

    }


    #launcher {

        top:
            66px;

        height:
            82vh;

    }


    .planet-one {

        width:
            60px;

        height:
            60px;

    }

}

</style>

</head>


<body>

<div id="haldo-root">


<!-- ==========================================================
     COSMIC DESKTOP
     ========================================================== -->

<main id="desktop">


    <div class="cosmic-space"></div>

    <div class="stars"></div>

    <div class="planet planet-one"></div>

    <div class="planet planet-two"></div>

    <div class="planet planet-three"></div>

    <div class="orbit"></div>


    <!-- ======================================================
         TOP BAR
         ====================================================== -->

    <header id="topbar">

        <div class="brand">

            <div class="brand-mark">
                H
            </div>

            <span>
                HalDo AI OS 20
            </span>

        </div>


        <div
            class="system-status"
            id="system-status"
        >
            System wird gestartet …
        </div>

    </header>


    <!-- ======================================================
         HALDO AI SUN
         ====================================================== -->

    <section
        id="haldo-sun"
        aria-label="HalDo AI"
    >

        <div id="haldo-avatar">

            <span>
                H
            </span>

        </div>

    </section>


    <!-- ======================================================
         WINDOWS
         ====================================================== -->

    <section
        id="windows"
        aria-live="polite"
    ></section>


    <!-- ======================================================
         LAUNCHER
         ====================================================== -->

    <section
        id="launcher"
    >

        <div class="launcher-header">

            <input
                id="app-search"
                type="search"
                placeholder="HalDo Apps suchen …"
                autocomplete="off"
            >

            <button
                id="launcher-close"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="app-grid"
        ></div>

    </section>


    <!-- ======================================================
         DOCK
         ====================================================== -->

    <nav id="dock">

        <button
            class="dock-button"
            data-launcher
            title="Apps"
        >
            ☰
        </button>


        <button
            class="dock-button"
            data-app="ai"
            title="HalDo AI"
        >
            ☀
        </button>


        <button
            class="dock-button"
            data-app="files"
            title="Dateien"
        >
            📁
        </button>


        <button
            class="dock-button"
            data-app="browser"
            title="Browser"
        >
            🌐
        </button>


        <button
            class="dock-button"
            data-app="settings"
            title="Einstellungen"
        >
            ⚙
        </button>

    </nav>


</main>


<!-- ==========================================================
     BOOT
     ========================================================== -->

<section
    id="boot"
    data-haldo-boot
>

    <div class="boot-content">

        <div class="boot-logo">
            <span>H</span>
        </div>


        <h1 class="boot-title">
            HalDo AI OS 20
        </h1>


        <p class="boot-subtitle">
            Professional Ultimate Foundation
        </p>


        <div
            id="boot-message"
            data-boot-message
        >
            HalDo AI OS wird vorbereitet …
        </div>


        <div class="boot-track">

            <div
                id="boot-progress"
                data-boot-progress
            ></div>

        </div>


        <div
            id="boot-detail"
            data-boot-detail
        >
            Foundation · 0%
        </div>

    </div>

</section>


<div id="toast"></div>


</div>


<!-- ==========================================================
     EXISTIERENDER KERNEL
     ========================================================== -->

<script src="js/kernel.js"></script>


<!-- ==========================================================
     BOOTSTRAP
     ========================================================== -->

<script src="js/haldo-bootstrap.js"></script>


<script>

/* ============================================================
   HALDO AI OS 20.1
   APPLICATION RUNTIME
   ============================================================ */

"use strict";


window.HalDo =
    window.HalDo ||
    {};


const HalDo =
    window.HalDo;


/* ============================================================
   SYSTEM VERSION
   ============================================================ */

HalDo.version =
    "20.1.0";

HalDo.codename =
    "Cosmic Professional";


/* ============================================================
   APP REGISTRY
   ============================================================ */

HalDo.appRegistry =
    HalDo.appRegistry ||
    {};


HalDo.appRegistry.apps =
    HalDo.appRegistry.apps ||
    new Map();


/* ============================================================
   COMPLETE PLANNED APP CATALOG
   ============================================================ */

const HALDO_APPS = [

    /* CORE */

    ["dashboard","Dashboard","⌂","Core"],
    ["launcher","App Launcher","☰","Core"],
    ["search","Universal Search","⌕","Core"],
    ["settings","Einstellungen","⚙","System"],
    ["files","Dateien","📁","System"],

    /* AI */

    ["ai","HalDo AI","☀","AI"],
    ["chat","AI Chat","💬","AI"],

/* ============================================================
   REGISTER ALL
   ============================================================ */

HALDO_APPS.forEach(
    definition => {

        const [
            id,
            name,
            icon,
            category
        ] = definition;


        HalDo.appRegistry.apps.set(
            id,
            {

                id,
                name,
                icon,
                category,

                installed:
                    true,

                enabled:
                    true,

                state:
                    "registered"

            }
        );

    }
);


/* ============================================================
   REGISTRY API
   ============================================================ */

HalDo.appRegistry.list =
    function () {

        return Array.from(
            this.apps.values()
        );

    };


HalDo.appRegistry.get =
    function (id) {

        return this.apps.get(id)
            || null;

    };


HalDo.appRegistry.register =
    function (app) {

        if (
            !app ||
            !app.id
        ) {

            return false;

        }


        this.apps.set(
            app.id,
            {

                installed:
                    true,

                enabled:
                    true,

                state:
                    "registered",

                ...app

            }
        );


        renderAppGrid();

        return true;

    };


/* ============================================================
   WINDOW MANAGER
   ============================================================ */

HalDo.windowManager =
    HalDo.windowManager ||
    {};


HalDo.windowManager.windows =
    new Map();


let windowZ =
    100;


function openApp(id) {

    const app =
        HalDo.appRegistry.get(
            id
        );


    if (!app) {

        showToast(
            "App nicht gefunden: " +
            id
        );

        return null;

    }


    /*
     * Echte App-Module werden später bevorzugt.
     */

    if (
        window.HalDoApps &&
        window.HalDoApps[id] &&
        typeof
        window.HalDoApps[id].open ===
        "function"
    ) {

        return window.HalDoApps[id].open();

    }


    /*
     * Bereits geöffnet?
     */

    const existing =
        HalDo.windowManager.windows.get(
            id
        );


    if (existing) {

        existing.style.zIndex =
            ++windowZ;

        return existing;

    }


    const win =
        document.createElement(
            "article"
        );


    win.className =
        "window";


    win.dataset.app =
        id;


    win.style.zIndex =
        ++windowZ;


    win.innerHTML = `

        <header class="window-header">

            <div class="window-title">

                ${escapeHTML(app.icon)}
                &nbsp;
                ${escapeHTML(app.name)}

            </div>


            <div class="window-controls">

                <button
                    class="window-control"
                    data-minimize
                >
                    −
                </button>

                <button
                    class="window-control"
                    data-close
                >
                    ×
                </button>

            </div>

        </header>


        <div class="window-body">

            <section class="app-hero">

                <div class="app-hero-icon">
                    ${escapeHTML(app.icon)}
                </div>

                <div class="app-hero-title">
                    ${escapeHTML(app.name)}
                </div>

                <div class="app-hero-description">
                    ${escapeHTML(app.category)}
                </div>

            </section>


            <section class="app-section">

                <h3>
                    HalDo App Runtime
                </h3>

                <div class="muted">

                    App ID:
                    ${escapeHTML(app.id)}

                    <br>

                    Registry:
                    registriert

                    <br>

                    Installation:
                    aktiv

                    <br>

                    Runtime:
                    verbunden

                </div>

            </section>


            <section class="app-section">

                <h3>
                    App-Modul
                </h3>

                <div class="muted">

                    Die äußere App-Shell ist
                    aktiv. Der vollständige
                    innere Funktionsumfang
                    dieses Moduls wird in der
                    jeweiligen App-Datei aufgebaut.

                </div>

            </section>


            <button
                class="action"
                data-action="settings"
            >
                App-Einstellungen
            </button>


            <button
                class="action"
                data-action="refresh"
            >
                Aktualisieren
            </button>

        </div>
    `;


    document
        .getElementById("windows")
        .appendChild(win);


    HalDo.windowManager.windows.set(
        id,
        win
    );


    win.addEventListener(
        "mousedown",
        () => {

            win.style.zIndex =
                ++windowZ;

        }
    );


    win.querySelector(
        "[data-close]"
    ).addEventListener(
        "click",
        () => {

            win.remove();

            HalDo.windowManager.windows.delete(
                id
            );

        }
    );


    win.querySelector(
        "[data-minimize]"
    ).addEventListener(
        "click",
        () => {

            win.style.display =
                "none";

        }
    );


    win.querySelector(
        "[data-action='settings']"
    ).addEventListener(
        "click",
        () => {

            openApp(
                "settings"
            );

        }
    );


    win.querySelector(
        "[data-action='refresh']"
    ).addEventListener(
        "click",
        () => {

            showToast(
                app.name +
                " wurde aktualisiert."
            );

        }
    );


    showToast(
        app.name +
        " geöffnet"
    );


    return win;

}


HalDo.appManager =
    HalDo.appManager ||
    {};


HalDo.appManager.open =
    openApp;


HalDo.appManager.launch =
    openApp;


HalDo.appManager.startApp =
    openApp;


/* ============================================================
   APP GRID
   ============================================================ */

function renderAppGrid(
    search = ""
) {

    const grid =
        document.getElementById(
            "app-grid"
        );


    if (!grid) {
        return;
    }


    grid.innerHTML =
        "";


    const query =
        search
            .trim()
            .toLowerCase();


    HalDo.appRegistry
        .list()
        .filter(
            app => {

                if (!query) {
                    return true;
                }


                return (

                    app.name
                        .toLowerCase()
                        .includes(query)

                    ||

                    app.category
                        .toLowerCase()
                        .includes(query)

                    ||

                    app.id
                        .toLowerCase()
                        .includes(query)

                );

            }
        )
        .forEach(
            app => {

                const card =
                    document.createElement(
                        "button"
                    );


                card.className =
                    "app-card";


                card.type =
                    "button";


                card.innerHTML = `

                    <div class="app-icon">
                        ${escapeHTML(app.icon)}
                    </div>

                    <div class="app-name">
                        ${escapeHTML(app.name)}
                    </div>

                    <div class="app-category">
                        ${escapeHTML(app.category)}
                    </div>

                `;


                card.addEventListener(
                    "click",
                    () => {

                        openApp(
                            app.id
                        );

                    }
                );


                grid.appendChild(
                    card
                );

            }
        );

}


/* ============================================================
   ESCAPE
   ============================================================ */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* ============================================================
   TOAST
   ============================================================ */

function showToast(
    text
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.classList.add(
        "visible"
    );


    clearTimeout(
        toast._timer
    );


    toast._timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "visible"
                );

            },
            2000
        );

}


/* ============================================================
   LAUNCHER
   ============================================================ */

const launcher =
    document.getElementById(
        "launcher"
    );


document
    .querySelector(
        "[data-launcher]"
    )
    .addEventListener(
        "click",
        () => {

            launcher.classList.add(
                "open"
            );

        }
    );


document
    .getElementById(
        "launcher-close"
    )
    .addEventListener(
        "click",
        () => {

            launcher.classList.remove(
                "open"
            );

        }
    );


document
    .getElementById(
        "app-search"
    )
    .addEventListener(
        "input",
        event => {

            renderAppGrid(
                event.target.value
            );

        }
    );


/* ============================================================
   DOCK
   ============================================================ */

document
    .querySelectorAll(
        "[data-app]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    openApp(
                        button.dataset.app
                    );

                }
            );

        }
    );


/* ============================================================
   BOOT UI
   ============================================================ */

function updateBoot(
    event
) {

    const data =
        event.detail ||
        {};


    const progress =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    data.progress
                ) || 0
            )
        );


    const bar =
        document.getElementById(
            "boot-progress"
        );


    const message =
        document.getElementById(
            "boot-message"
        );


    const detail =
        document.getElementById(
            "boot-detail"
        );


    if (bar) {

        bar.style.width =
            progress + "%";

    }


    if (
        message &&
        data.message
    ) {

        message.textContent =
            data.message;

    }


    if (detail) {

        detail.textContent =
            `${data.stage || "system"} · ${progress}%`;

    }

}


window.addEventListener(
    "haldo:bootstrap:stage",
    updateBoot
);


window.addEventListener(
    "haldo:boot:stage",
    updateBoot
);


/* ============================================================
   READY
   ============================================================ */

function showDesktop() {

    document
        .getElementById(
            "desktop"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "boot"
        )
        .classList.add(
            "finished"
        );


    document
        .getElementById(
            "system-status"
        )
        .textContent =
            "HalDo AI OS · Bereit";


    renderAppGrid();


    /*
     * HalDo AI bleibt im Zentrum.
     */

}


window.addEventListener(
    "haldo:bootstrap:ready",
    showDesktop
);


window.addEventListener(
    "haldo:boot:ready",
    showDesktop
);


/* ============================================================
   FALLBACK
   ============================================================ */

window.setTimeout(
    () => {

        /*
         * Falls der Bootstrap nicht existiert,
         * bleibt das System nicht endlos unsichtbar.
         */

        if (
            !HalDo.bootstrap ||
            typeof
            HalDo.bootstrap.start !==
            "function"
        ) {

            showDesktop();

        }

    },
    3500
);


/* ============================================================
   INITIAL REGISTRY
   ============================================================ */

renderAppGrid();


/* ============================================================
   SERVICE WORKER
   ============================================================ */

if (
    "serviceWorker" in
    navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "service-worker.js"
                )
                .catch(
                    error => {

                        console.warn(
                            "[HalDo PWA]",
                            error
                        );

                    }
                );

        }
    );

}


console.info(
    "[HalDo AI OS 20.1] Apps registriert:",
    HalDo.appRegistry.list().length
);

</script>
