        HD6.menu.renderCategories =
            function() {

                if (
                    !this.state.categories
                ) {

                    return;

                }


                const apps =
                    HD6.apps.list(
                        {
                            enabledOnly:
                                true
                        }
                    );


                const categorySet =
                    new Set(
                        [
                            "all",
                            ...apps.map(
                                app =>
                                    app.category ||
                                    "system"
                            )
                        ]
                    );


                this.state.categories.innerHTML =
                    "";


                categorySet.forEach(
                    category => {

                        const button =
                            document.createElement(
                                "button"
                            );


                        button.type =
                            "button";


                        button.className =
                            "haldo-menu-category";


                        if (
                            category ===
                            this.state.activeCategory
                        ) {

                            button.classList.add(
                                "is-active"
                            );

                        }


                        button.textContent =
                            category ===
                            "all"
                                ? "Alle"
                                : category;


                        button.addEventListener(
                            "click",
                            () => {

                                this.state.activeCategory =
                                    category;


                                this.renderCategories();

                                this.renderApps(
                                    this.state
                                        .searchInput
                                        ?.value ||
                                    ""
                                );

                            }
                        );


                        this.state.categories.appendChild(
                            button
                        );

                    }
                );

            };


        /* ========================================================
           RENDER APPS
           ======================================================== */

        HD6.menu.renderApps =
            function(
                query = ""
            ) {

                if (
                    !this.state.grid
                ) {

                    return;

                }


                let apps =
                    HD6.apps.search(
                        query
                    );


                if (
                    this.state.activeCategory !==
                    "all"
                ) {

                    apps =
                        apps.filter(
                            app =>
                                (
                                    app.category ||
                                    "system"
                                ) ===
                                this.state.activeCategory
                        );

                }


                this.state.grid.innerHTML =
                    "";


                if (
                    !apps.length
                ) {

                    const empty =
                        document.createElement(
                            "div"
                        );


                    empty.className =
                        "haldo-menu-empty";


                    empty.textContent =
                        "Keine passende App gefunden.";


                    this.state.grid.appendChild(
                        empty
                    );


                    return;

                }


                apps.forEach(
                    app => {

                        const card =
                            document.createElement(
                                "button"
                            );


                        card.type =
                            "button";


                        card.className =
                            "haldo-app-card";


                        card.dataset.appId =
                            app.id;


                        card.innerHTML = `

                            <span
                                class="haldo-app-icon"
                            >
                                ${app.icon}
                            </span>

                            <span
                                class="haldo-app-name"
                            >
                                ${app.name}
                            </span>

                            <span
                                class="haldo-app-description"
                            >
                                ${app.description || ""}
                            </span>

                        `;


                        card.addEventListener(
                            "click",
                            () => {

                                HD6.apps.open(
                                    app.id
                                );


                                this.close();

                            }
                        );


                        this.state.grid.appendChild(
                            card
                        );

                    }
                );

            };


        /* ========================================================
           OPEN MENU
           ======================================================== */

        HD6.menu.open =
            function() {

                if (
                    !this.state.initialized
                ) {

                    this.create();

                }


                this.renderCategories();

                this.renderApps(
                    this.state
                        .searchInput
                        ?.value ||
                    ""
                );


                this.state.element.classList.add(
                    "is-open"
                );


                this.state.open =
                    true;


                HD6.emit(
                    "menu:opened"
                );


                setTimeout(
                    () => {

                        this.state.searchInput
                            ?.focus();

                    },
                    50
                );

            };


        /* ========================================================
           CLOSE MENU
           ======================================================== */

        HD6.menu.close =
            function() {

                if (
                    !this.state.element
                ) {

                    return;

                }


                this.state.element.classList.remove(
                    "is-open"
                );


                this.state.open =
                    false;


                HD6.emit(
                    "menu:closed"
                );

            };


        /* ========================================================
           TOGGLE MENU
           ======================================================== */

        HD6.menu.toggle =
            function() {

                if (
                    this.state.open
                ) {

                    this.close();

                }

                else {

                    this.open();

                }

            };


        /* ========================================================
           MENU BUTTON CONNECTION
           ======================================================== */

        HD6.menu.bindButton =
            function() {

                const buttons =
                    document.querySelectorAll(
                        "[data-haldo-menu]"
                    );


                buttons.forEach(
                    button => {

                        if (
                            button.dataset
                                .haldoMenuBound ===
                            "true"
                        ) {

                            return;

                        }


                        button.dataset
                            .haldoMenuBound =
                            "true";


                        button.addEventListener(
                            "click",
                            event => {

                                event.preventDefault();

                                event.stopPropagation();

                                this.toggle();

                            }
                        );

                    }
                );

            };


        /* ========================================================
           MENU COMPATIBILITY ALIASES
           ======================================================== */

        HD6.mainMenu =
            HD6.menu;


        window.HalDoMenu =
            HD6.menu;


        /* ========================================================
           INITIALIZATION
           ======================================================== */

        HD6.menu.create();

        HD6.menu.bindButton();


        HD6.on(
            "apps:ready",
            function() {

                HD6.menu.renderCategories();

                HD6.menu.renderApps();

                HD6.menu.bindButton();

            }
        );


        HD6.menu.state.initialized =
            true;


        HD6.emit(
            "mainMenu:ready"
        );

                            await method.call(
                                HD7.ai ||
                                HD7,
                                text
                            );


                        if (
                            result !==
                            undefined &&
                            result !==
                            null &&
                            String(
                                result
                            ).trim()
                        ) {

                            return String(
                                result
                            );

                        }

                    }

                    catch(error) {

                        console.warn(
                            "[HalDo] Existing AI responder failed:",
                            error
                        );

                    }

                }


                /*
                 * Local fallback keeps the chat
                 * functional even when an external
                 * AI service is unavailable.
                 */

                const normalized =
                    String(
                        text
                    )
                    .trim()
                    .toLowerCase();


                if (
                    /^(hi|hallo|hey|hello|selam|slaw)\b/
                        .test(
                            normalized
                        )
                ) {

                    return (
                        "Willkommen bei HalDo AI. " +
                        "Ich bin für dich da. " +
                        "Was möchtest du machen?"
                    );

                }


                if (
                    normalized.includes(
                        "wer bist du"
                    )
                ) {

                    return (
                        "Ich bin HalDo AI – " +
                        "deine intelligente " +
                        "Begleitung im HalDo AI OS."
                    );

                }


                if (
                    normalized.includes(
                        "danke"
                    )
                ) {

                    return (
                        "Sehr gerne. 💙❤️"
                    );

                }


                return (
                    "Ich habe deine Nachricht " +
                    "verstanden. 💙 Ich bin bereit, " +
                    "mit dir weiterzusprechen."
                );

            };


        /* ========================================================
           SEND MESSAGE
           ======================================================== */

        HD7.chat.send =
            async function(
                text,
                instance
            ) {

                const value =
                    String(
                        text ||
                        ""
                    ).trim();


                if (
                    !value ||
                    !instance ||
                    instance.destroyed
                ) {

                    return;

                }


                if (
                    this.state.typing
                ) {

                    return;

                }


                instance.input.value =
                    "";


                instance.input.style.height =
                    "auto";


                this.state.messages.push(
                    {

                        role:
                            "user",

                        text:
                            value,

                        timestamp:
                            Date.now()

                    }
                );


                this.renderMessage(
                    "user",
                    value,
                    instance
                );


                this.state.typing =
                    true;


                instance.send.disabled =
                    true;


                this.showTyping(
                    instance
                );


                HD7.emit(
                    "chat:user-message",
                    {
                        text:
                            value
                    }
                );


                try {

                    const response =
                        await this.generateResponse(
                            value
                        );


                    this.hideTyping(
                        instance
                    );


                    this.state.messages.push(
                        {

                            role:
                                "ai",

                            text:
                                response,

                            timestamp:
                                Date.now()

                        }
                    );


                    this.renderMessage(
                        "ai",
                        response,
                        instance
                    );


                    HD7.emit(
                        "chat:ai-message",
                        {
                            text:
                                response
                        }
                    );


                    /*
                     * Connect to the existing voice
                     * systems when available.
                     */

                    if (
                        HD7.voice?.speak &&
                        typeof HD7.voice.speak ===
                        "function"
                    ) {

                        try {

                            await HD7.voice.speak(
                                response
                            );

                        }

                        catch {}

                    }

                    else if (
                        HD7.aiVoice?.speak &&
                        typeof HD7.aiVoice.speak ===
                        "function"
                    ) {

                        try {

                            await HD7.aiVoice.speak(
                                response
                            );

                        }

                        catch {}

                    }

                }

                catch(error) {

                    console.error(
                        "[HalDo] Chat response error:",
                        error
                    );


                    this.hideTyping(
                        instance
                    );


                    const fallback =
                        "Entschuldigung, " +
                        "bei der Antwort ist " +
                        "ein Fehler aufgetreten.";


                    this.renderMessage(
                        "ai",
                        fallback,
                        instance
                    );


                    HD7.emit(
                        "chat:error",
                        {
                            error
                        }
                    );

                }

                finally {

                    this.state.typing =
                        false;


                    instance.send.disabled =
                        false;


                    instance.input.focus();

                }

            };


        /* ========================================================
           CLEAR CONVERSATION
           ======================================================== */

        HD7.chat.clear =
            function(
                instance
            ) {

                this.state.messages =
                    [];


                if (
                    instance?.messages
                ) {

                    instance.messages.innerHTML =
                        "";

                }


                this.addWelcome(
                    instance
                );


                HD7.emit(
                    "chat:cleared"
                );

            };


        /* ========================================================
           WELCOME MESSAGE
           ======================================================== */

        HD7.chat.addWelcome =
            function(
                instance
            ) {

                if (
                    !instance
                ) {

                    return;

                }


                const message =
                    "Willkommen bei HalDo AI. " +
                    "Schön, dass du da bist. " +
                    "Wie kann ich dir helfen?";


                this.state.messages.push(
                    {

                        role:
                            "ai",

                        text:
                            message,

                        timestamp:
                            Date.now()

                    }
                );


                this.renderMessage(
                    "ai",
                    message,
                    instance
                );

            };


        /* ========================================================
           VOICE INPUT
           ======================================================== */

        HD7.chat.voiceInput =
            function(
                instance
            ) {

                if (
                    !instance
                ) {

                    return;

                }


                const SpeechRecognition =
                    window.SpeechRecognition ||
                    window.webkitSpeechRecognition;


                if (
                    !SpeechRecognition
                ) {

                    HD7.emit(
                        "chat:voice-unavailable"
                    );


                    return;

                }


                const recognition =
                    new SpeechRecognition();


                recognition.lang =
                    document.documentElement
                        .lang ||
                    "de-DE";


                recognition.interimResults =
                    false;


                recognition.continuous =
                    false;


                recognition.onresult =
                    event => {

                        const transcript =
                            event
                                .results?.[0]?.[0]
                                ?.transcript ||
                            "";


                        instance.input.value =
                            transcript;


                        instance.input.dispatchEvent(
                            new Event(
                                "input"
                            )
                        );


                        instance.input.focus();

                    };


                recognition.onerror =
                    error => {

                        console.warn(
                            "[HalDo] Voice input error:",
                            error
                        );

                    };


                try {

                    recognition.start();

                }

                catch(error) {

                    console.warn(
                        "[HalDo] Voice input could not start:",
                        error
                    );

                }

            };


        /* ========================================================
           OPEN CHAT APP
           ======================================================== */

        HD7.chat.open =
            function(
                options = {}
            ) {

                /*
                 * Reuse an already open chat window.
                 */

                if (
                    this.state.currentInstance &&
                    !this.state.currentInstance
                        .destroyed
                ) {

                    const existing =
                        this.state.currentInstance;


                    if (
                        existing.root?.closest(
                            ".haldo-window"
                        )
                    ) {

                        const windowElement =
                            existing.root.closest(
                                ".haldo-window"
                            );


                        if (
                            windowElement
                        ) {

                            HD7.windows.focus(
                                windowElement.id
                            );

                        }

                    }


                    return existing;

                }


                const instance =
                    this.create();


                this.state.currentInstance =
                    instance;


                const app =
                    HD7.apps.get(
                        "haldo-ai"
                    );


                if (
                    app
                ) {

                    /*
                     * The registered app is opened
                     * through the common app system.
                     */

                    const appInstance =
                        HD7.apps.open(
                            "haldo-ai",
                            {
                                width:
                                    options.width ||
                                    760,

                                height:
                                    options.height ||
                                    560,

                                context:
                                    {
                                        chat:
                                            true
                                    }
                            }
                        );


                    if (
                        appInstance
                    ) {

                        this.state.currentInstance =
                            appInstance
                                .content
                                ?.querySelector(
                                    ".haldo-chat"
                                )
                                ? instance
                                : instance;

                    }

                }

                this.addWelcome(
                    instance
                );


                HD7.emit(
                    "chat:opened",
                    instance
                );


                return instance;

            };


        /* ========================================================
           APP REGISTRATION
           ======================================================== */

        HD7.apps.register(
            {

                id:
                    "haldo-ai",

                name:
                    "HalDo AI",

                title:
                    "HalDo AI",

                icon:
                    "assets/logo/logo.png",

                category:
                    "AI",

                description:
                    "Intelligente Unterhaltung, Antworten, Sprache und HalDo-AI-Unterstützung.",

                version:
                    "20.0.0",

                singleton:
                    true,

                width:
                    760,

                height:
                    560,

                order:
                    1,

                factory:
                    function() {

                        return HD7.chat.create()
                            .root;

                    },

                open:
                    function(
                        instance
                    ) {

                        const chatRoot =
                            instance
                                ?.content
                                ?.querySelector(
                                    ".haldo-chat"
                                );


                        if (
                            chatRoot
                        ) {

                            const chatInstance =
                                HD7.chat.create();


                            HD7.chat.state
                                .currentInstance =
                                chatInstance;

                        }

                    }

            }
        );


        /* ========================================================
           PUBLIC ALIASES
           ======================================================== */

        HD7.aiChat =
            HD7.chat;


        window.HalDoChat =
            HD7.chat;


        /* ========================================================
           READY
           ======================================================== */

        HD7.chat.state.initialized =
            true;


        HD7.emit(
            "chat:ready"
        );

        <!-- =========================================================

    <script>

        "use strict";

        /* ========================================================
           WORLD STATE

        HD8.world =

                    null,

        /* ========================================================

        HD8.world.defaults =
            {

                sun:

                    true,

        /* ========================================================
           STYLE
           ======================================================== */

        HD8.world.injectStyles =
            function() {

                if (
                    document.getElementById(
                        "haldo-world-style"
                    )
                ) {

                    return;

                }


                const style =

                        pointer-events:
                            none;

                            0;

                            absolute;

                            );

                );

        /* ========================================================
           GET WORLD ROOT
           ======================================================== */

        HD8.world.getRoot =
            function() {

                let root =
                    document.getElementById(
                        "haldo-world"
                    );


                if (
                    root
                ) {

                    return root;

                }


                root =
                    document.createElement(
                        "div"
                    );


                root.id =
                    "haldo-world";


                const canvas =
                    document.createElement(
                        "canvas"
                    );


                canvas.id =
                    "haldo-world-canvas";


                const overlay =
                    document.createElement(
                        "div"
                    );


                overlay.className =
                    "haldo-world-overlay";


                root.appendChild(
                    canvas
                );


                root.appendChild(
                    overlay
                );


                const host =
                    document.getElementById(
                        "haldo-desktop"
                    ) ||
                    document.body;


                host.prepend(
                    root
                );


                return root;

            };


        /* ========================================================
           CANVAS
           ======================================================== */

        HD8.world.setupCanvas =
            function() {

                const root =
                    this.getRoot();


                const canvas =
                    root.querySelector(
                        "#haldo-world-canvas"
                    );


                if (
                    !canvas
                ) {

                    return;

                }


                const rect =
                    root.getBoundingClientRect();


                const ratio =
                    Math.min(
                        window.devicePixelRatio ||
                        1,
                        2
                    );


                this.state.width =
                    Math.max(
                        1,
                        rect.width
                    );


                this.state.height =
                    Math.max(
                        1,
                        rect.height
                    );


                canvas.width =
                    Math.floor(
                        this.state.width *
                        ratio
                    );


                canvas.height =
                    Math.floor(
                        this.state.height *
                        ratio
                    );


                canvas.style.width =
                    this.state.width +
                    "px";


                canvas.style.height =
                    this.state.height +
                    "px";


                const context =
                    canvas.getContext(
                        "2d"
                    );


                if (
                    context
                ) {

                    context.setTransform(
                        ratio,
                        0,
                        0,
                        ratio,
                        0,
                        0
                    );

                }


                this.state.canvas =
                    canvas;


                this.state.context =
                    context;

            };


        /* ========================================================
           RANDOM
           ======================================================== */

        HD8.world.random =
            function(
                min,
                max
            ) {

                return (
                    Math.random() *
                    (
                        max -
                        min
                    )
                ) +
                min;

            };


        /* ========================================================
           CREATE STARS
           ======================================================== */

        HD8.world.createStars =
            function() {

                const count =
                    Math.max(
                        20,
                        Math.min(
                            1000,
                            Number(
                                this.state.settings
                                    .starCount
                            ) || 365
                        )
                    );


                this.state.stars =
                    [];


                for (
                    let index = 0;
                    index < count;
                    index += 1
                ) {

                    this.state.stars.push(
                        {

                            angle:
                                Math.random() *
                                Math.PI *
                                2,

                            distance:
                                Math.random(),

                            size:
                                this.random(
                                    .35,
                                    1.8
                                ),

                            alpha:
                                this.random(
                                    .25,
                                    .95
                                ),

                            twinkle:
                                this.random(
                                    .6,
                                    2.4
                                ),

                            phase:
                                Math.random() *
                                Math.PI *
                                2

                        }
                    );

                }

            };


        /* ========================================================
           CREATE PLANETS
           ======================================================== */

        HD8.world.createPlanets =
            function() {

                const count =
                    Math.max(
                        1,
                        Math.min(
                            16,
                            Number(
                                this.state.settings
                                    .planetCount
                            ) || 8
                        )
                    );


                this.state.planets =
                    [];


                for (
                    let index = 0;
                    index < count;
                    index += 1
                ) {

                    this.state.planets.push(
                        {

                            orbit:
                                .10 +
                                (
                                    index *
                                    .065
                                ),

                            angle:
                                (
                                    index /
                                    count
                                ) *
                                Math.PI *
                                2,

                            speed:
                                (
                                    .00045 +
                                    (
                                        Math.random() *
                                        .0007
                                    )
                                )
                                *
                                (
                                    index %
                                    2 ===
                                    0
                                        ? 1
                                        : -1
                                ),

                            size:
                                2.5 +
                                Math.random() *
                                4,

                            phase:
                                Math.random() *
                                Math.PI *
                                2,

                            light:
                                .45 +
                                Math.random() *
                                .55

                        }
                    );

                }

            };


        /* ========================================================
           RESIZE
           ======================================================== */

        HD8.world.resize =
            function() {

                this.setupCanvas();

            };


        /* ========================================================
           SKY COLOR
           ======================================================== */

        HD8.world.getSky =
            function(
                time
            ) {

                if (
                    this.state.settings.skyMode ===
                    "night"
                ) {

                    return {
                        top:
                            "#01030d",

                        bottom:
                            "#050a1e"

                    };

                }


                if (
                    this.state.settings.skyMode ===
                    "day"
                ) {

                    return {
                        top:
                            "#071b42",

                        bottom:
                            "#020617"

                    };

                }


                /*
                 * Auto mode.
                 * A deep blue permanent HalDo
                 * night/day transition keeps the
                 * sun and stars visible together.
                 */

                const cycle =
                    (
                        time %
                        86400000
                    ) /
                    86400000;


                const warmth =
                    (
                        Math.sin(
                            cycle *
                            Math.PI *
                            2
                        ) +
                        1
                    ) /
                    2;


                return {

                    top:
                        warmth > .65
                            ? "#08285c"
                            : "#020717",

                    bottom:
                        "#01030d"

                };

            };


        /* ========================================================
           DRAW SKY
           ======================================================== */

        HD8.world.drawSky =
            function(
                time
            ) {

                const ctx =
                    this.state.context;


                if (
                    !ctx
                ) {

                    return;

                }


                const width =
                    this.state.width;


                const height =
                    this.state.height;


                const sky =
                    this.getSky(
                        time
                    );


                const gradient =
                    ctx.createLinearGradient(
                        0,
                        0,
                        0,
                        height
                    );


                gradient.addColorStop(
                    0,
                    sky.top
                );


                gradient.addColorStop(
                    1,
                    sky.bottom
                );


                ctx.fillStyle =
                    gradient;


                ctx.fillRect(
                    0,
                    0,
                    width,
                    height
                );

            };


        /* ========================================================
           DRAW STARS
           ======================================================== */

        HD8.world.drawStars =
            function(
                time
            ) {

                if (
                    !this.state.settings.stars
                ) {

                    return;

                }


                const ctx =
                    this.state.context;


                if (
                    !ctx
                ) {

                    return;

                }


                const width =
                    this.state.width;


                const height =
                    this.state.height;


                const centerX =
                    width *
                    .5;


                const centerY =
                    height *
                    .47;


                const radius =
                    Math.max(
                        width,
                        height
                    ) *
                    .68;


                this.state.stars.forEach(
                    star => {

                        const angle =
                            star.angle +
                            (
                                time *
                                .000002
                            );


                        const distance =
                            star.distance *
                            radius;


                        const x =
                            centerX +
                            Math.cos(
                                angle
                            ) *
                            distance;


                        const y =
                            centerY +
                            Math.sin(
                                angle
                            ) *
                            distance *
                            .58;


                        if (
                            x < -5 ||
                            x >
                                width + 5 ||
                            y < -5 ||
                            y >
                                height + 5
                        ) {

                            return;

                        }


                        const pulse =
                            this.state.settings
                                .starLight
                                ? (
                                    .65 +
                                    .35 *
                                    Math.sin(
                                        (
                                            time *
                                            .001 *
                                            star.twinkle
                                        ) +
                                        star.phase
                                    )
                                )
                                : .72;


                        const alpha =
                            star.alpha *
                            pulse;


                        ctx.beginPath();


                        ctx.arc(
                            x,
                            y,
                            star.size,
                            0,
                            Math.PI *
                            2
                        );


                        ctx.fillStyle =
                            "rgba(" +
                            "255,255,255," +
                            alpha +
                            ")";


                        ctx.fill();

                    }
                );

            };


        /* ========================================================
           DRAW SUN GLOW
           ======================================================== */

        HD8.world.drawSunGlow =
            function(
                centerX,
                centerY,
                radius
            ) {

                if (
                    !this.state.settings.glow
                ) {

                    return;

                }


                const ctx =
                    this.state.context;


                const gradient =
                    ctx.createRadialGradient(
                        centerX,
                        centerY,
                        radius *
                        .15,
                        centerX,
                        centerY,
                        radius *
                        4.5
                    );


                gradient.addColorStop(
                    0,
                    "rgba(255,245,190,.72)"
                );


                gradient.addColorStop(
                    .16,
                    "rgba(255,215,110,.42)"
                );


                gradient.addColorStop(
                    .40,
                    "rgba(255,175,55,.14)"
                );


                gradient.addColorStop(
                    1,
                    "rgba(255,150,30,0)"
                );


                ctx.fillStyle =
                    gradient;


                ctx.beginPath();


                ctx.arc(
                    centerX,
                    centerY,
                    radius *
                    4.5,
                    0,
                    Math.PI *
                    2
                );


                ctx.fill();

            };


        /* ========================================================
           DRAW SUN
           ======================================================== */

        HD8.world.drawSun =
            function(
                time
            ) {

                if (
                    !this.state.settings.sun
                ) {

                    return;

                }


                const ctx =
                    this.state.context;


                const width =
                    this.state.width;


                const height =
                    this.state.height;


                const centerX =
                    width *
                    .5;


                const centerY =
                    height *
                    .47;


                const radius =
                    Math.min(
                        width,
                        height
                    ) *
                    .105;


                this.drawSunGlow(
                    centerX,
                    centerY,
                    radius
                );


                if (
                    this.state.settings.sunRays
                ) {

                    const rayCount =
                        48;


                    ctx.save();


                    ctx.translate(
                        centerX,
                        centerY
                    );


                    ctx.rotate(
                        time *
                        .00004
                    );


                    for (
                        let index = 0;
                        index < rayCount;
                        index += 1
                    ) {

                        const angle =
                            (
                                index /
                                rayCount
                            ) *
                            Math.PI *
                            2;


                        const inner =
                            radius *
                            1.12;


                        const outer =
                            radius *
                            (
                                1.35 +
                                .08 *
                                Math.sin(
                                    time *
                                    .001 +
                                    index
                                )
                            );


                        ctx.beginPath();


                        ctx.moveTo(

                            ) *
                            outer
                        );


                        ctx.strokeStyle =
                            "rgba(255,220,130,.20)";


                        ctx.lineWidth =
                            1;


                        ctx.stroke();

                    ctx.restore();

                    ctx.createRadialGradient(
                        centerX -
                        radius *
                        .30,

                        centerY -
                        radius *
                        .35,

                        radius *
                        .08,

                        centerX,
                        centerY,
                        radius

                    .34,
                    "#ffe9a0"

                sunGradient.addColorStop(

                    "#ffc85a"

                    "#ff9e2c"

                ctx.arc(

                    centerY,
                    radius,

                    Math.PI *

                centerY,
                baseRadius
            ) {

                    !this.state.settings.orbits ||
                    !this.state.settings.planets

                    return;

                }


                const ctx =
                    this.state.context;

                            planet.orbit;


                        ctx.beginPath();


                        ctx.ellipse(
                            centerX,
                            centerY,
                            orbitRadius,
                            orbitRadius *
                            .58,
                            0,
                            0,
                            Math.PI *
                            2
                        );


                        ctx.strokeStyle =
                            "rgba(170,205,255,.10)";


                        ctx.lineWidth =
                            1;


                        ctx.stroke();

                    }
                );

            };

           DRAW PLANETS
           ======================================================== */

        HD8.world.drawPlanets =
            function(
                time
            ) {

                if (
                    !this.state.settings.planets
                ) {

                    return;

                }


                const ctx =
                    this.state.context;


                const width =
                    this.state.width;


                const height =
                    this.state.height;


                const centerX =
                    width *
                    .5;


                const centerY =
                    height *
                    .47;


                const baseRadius =
                    Math.max(
                        width,
                        height
                    ) *
                    .52;


                this.drawOrbits(
                    centerX,
                    centerY,
                    baseRadius
                );


                this.state.planets.forEach(
                    (
                        planet,
                        index
                    ) => {

                        planet.angle +=
                            planet.speed *
                            this.state.settings
                                .rotationSpeed *
                            16;


                        const orbitRadius =
                            baseRadius *
                            planet.orbit;


                        const x =
                            centerX +
                            Math.cos(
                                planet.angle
                            ) *
                            orbitRadius;


                        const y =
                            centerY +
                            Math.sin(
                                planet.angle
                            ) *
                            orbitRadius *
                            .58;


                        const size =
                            planet.size;


                        const gradient =
                            ctx.createRadialGradient(
                                x -
                                size *
                                .35,

                                y -
                                size *
                                .35,

                                .5,

                                x,
                                y,
                                size *
                                1.6
                            );


                        const hue =
                            (
                                index *
                                47
                            ) %
                            360;


                        gradient.addColorStop(
                            0,
                            "hsl(" +
                            hue +
                            " 80% 88%)"
                        );


                        gradient.addColorStop(
                            .45,
                            "hsl(" +
                            hue +
                            " 70% 62%)"
                        );


                        gradient.addColorStop(
                            1,
                            "hsl(" +
                            hue +
                            " 70% 28%)"
                        );


                        ctx.fillStyle =
                            gradient;


                        ctx.beginPath();


                        ctx.arc(
                            x,
                            y,
                            size,
                            0,
                            Math.PI *
                            2
                        );


                        ctx.fill();

                    }
                );

            };


        /* ========================================================
           FRAME
           ======================================================== */

        HD8.world.render =
            function(
                timestamp
            ) {

                if (
                    !this.state.running
                ) {

                    return;

                }


                this.drawSky(
                    Date.now()
                );


                this.drawStars(
                    Date.now()
                );


                this.drawPlanets(
                    Date.now()
                );


                this.drawSun(
                    Date.now()
                );


                this.state.animationFrame =
                    requestAnimationFrame(
                        time =>
                            this.render(
                                time
                            )
                    );

            };


        /* ========================================================
           START
           ======================================================== */

        HD8.world.start =
            function() {

                if (
                    this.state.running
                ) {

                    return;

                }


                this.setupCanvas();

                this.createStars();

                this.createPlanets();


                this.state.running =
                    true;


                this.render(
                    performance.now()
                );


                HD8.emit(
                    "world:started"
                );

            };


        /* ========================================================
           STOP
           ======================================================== */

        HD8.world.stop =
            function() {

                    false;


                if (
                    this.state.animationFrame
                ) {

                    cancelAnimationFrame(
                        this.state.animationFrame
                    );

                }


                this.state.animationFrame =
                    null;


                HD8.emit(
                    "world:stopped"
                );

            };

           ======================================================== */

                const button =

                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "haldo-menu-item";


                const icon =
                    config.icon ||
                    "•";


                let iconMarkup =
                    icon;


                if (
                    typeof icon ===
                    "string" &&
                    (
                        icon.endsWith(
                            ".png"
                        ) ||
                        icon.endsWith(
                            ".jpg"
                        ) ||
                        icon.endsWith(
                            ".jpeg"
                        ) ||
                        icon.endsWith(
                            ".webp"
                        ) ||
                        icon.includes(
                            "/"
                        )
                    )
                ) {

                    iconMarkup =
                        `
                        <img
                            src="${icon}"
                            alt=""
                        >
                        `;

                }


                button.innerHTML = `

                    <span
                        class="haldo-menu-item-icon"
                    >
                        ${iconMarkup}
                    </span>

                    <span
                        class="haldo-menu-item-text"
                    >

                        <span
                            class="haldo-menu-item-title"
                        >
                            ${config.title || config.name || "App"}

                            config.description

                                        class="haldo-menu-item-description"
                                    >
                                        ${config.description}
                                    </span>
                                  `
                                : ""
                        }

                    </span>

                `;


                button.addEventListener(
                    "click",
                    () => {

                        if (
                            typeof config.action ===
                            "function"
                        ) {

                            config.action();

                            return;

                        }


                        if (

                /*
                 * System menu.

                system.appendChild(

                            title:

                            description:

                /*

                const registered =
                    this.getApps();


                const known =

                registered.forEach(
                    app => {

                        if (
                            !app ||
                            !app.id ||
                            known.has(
                                app.id
                            )
                        ) {

                            return;

                        }


                        known.add(
                            app.id
                        );


                        /*
                         * Don't duplicate the
                         * primary menu entries.
                         */

                        if (
                            app.id ===
                            "haldo-ai" ||
                            app.id ===
                            "settings"
                        ) {

                            return;

                        apps.appendChild(
                            this.createItem(

                            )
                        );

                    }
                );


                /*
                 * Always make sure the apps screen
                 * has something useful even if the
                 * registry is still loading.
                 */

                if (
                    apps.children.length ===
                    0
                ) {

                    apps.appendChild(
                        this.createItem(

                                title:
                                    "Keine Apps geladen",

                                description:
                                    "Die App-Registrierung wird noch initialisiert.",

                                icon:
                                    "•"

                            }
                        )
                    );

        /* ========================================================
           NAVIGATION
           ======================================================== */

        HD10.menu.bindNavigation =
            function(
                overlay
            ) {

                overlay
                    .querySelectorAll(
                        "[data-menu-nav]"
                    )
                    .forEach(
                        button => {

                            button.addEventListener(
                                "click",
                                () => {

                                    this.show(
                                        button.dataset
                                            .menuNav
                                    );

                                }
                            );

                        }
                    );

            };


        HD10.menu.show =
            function(
                section
            ) {

                const overlay =
                    this.state.root;


                if (
                    !overlay
                ) {

                    return;

                }


                overlay
                    .querySelectorAll(
                        "[data-menu-section]"
                    )
                    .forEach(
                        element => {

                            element.classList.toggle(
                                "active",
                                element.dataset
                                    .menuSection ===
                                section
                            );

                        }
                    );


                overlay
                    .querySelectorAll(
                        "[data-menu-nav]"
                    )
                    .forEach(
                        button => {

                            button.classList.toggle(
                                "active",
                                button.dataset
                                    .menuNav ===
                                section
                            );

                        }
                    );


                this.state.activeSection =
                    section;


                HD10.emit(
                    "menu:section",
                    {
                        section
                    }
                );

            };


        /* ========================================================
           OPEN
           ======================================================== */

        HD10.menu.open =
            function() {

                if (
                    !this.state.root
                ) {

                    this.create();

                }


                if (
                    !this.state.root
                ) {

                    return;

                }


                this.state.open =
                    true;


                this.state.root.classList.add(
                    "open"
                );


                HD10.emit(
                    "menu:open"
                );

            };


        /* ========================================================
           CLOSE
           ======================================================== */

        HD10.menu.close =
            function() {

                if (
                    !this.state.root
                ) {

                    return;

                }


                this.state.open =
                    false;


                this.state.root.classList.remove(
                    "open"
                );


                HD10.emit(
                    "menu:close"
                );

            };


        /* ========================================================
           TOGGLE
           ======================================================== */

        HD10.menu.toggle =
            function() {

                if (
                    this.state.open
                ) {

                    this.close();

                }

                else {

                    this.open();

                }

            };


        /* ========================================================
           KEYBOARD
           ======================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape" &&
                    HD10.menu.state.open
                ) {

                    HD10.menu.close();

                }

            }
        );


        /* ========================================================
           MENU BUTTON CONNECTION
           ======================================================== */

        HD10.menu.bindExternalButton =
            function(
                element
            ) {

                if (
                    !element
                ) {

                    return;

                }


                if (
                    element.dataset
                        .haldoMenuBound ===
                    "true"
                ) {

                    return;

                }


                element.dataset
                    .haldoMenuBound =
                    "true";


                element.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();

                        event.stopPropagation();

                        this.toggle();

                    }
                );

            };


        HD10.menu.bindExistingButtons =
            function() {

                const selectors = [

                    "[data-haldo-menu]",

                    "#haldo-menu-button",

                    "#menu-button",

                    ".haldo-menu-button",

                    ".menu-button"

                ];


                selectors.forEach(
                    selector => {

                        document
                            .querySelectorAll(
                                selector
                            )
                            .forEach(
                                element => {

                                    this.bindExternalButton(
                                        element
                                    );

                                }
                            );

                    }
                );

            };


        /* ========================================================
           GLOBAL MENU API
           ======================================================== */

        window.HalDoMenu =
            {

                open:
                    () =>
                        HD10.menu.open(),

                close:
                    () =>
                        HD10.menu.close(),

                toggle:
                    () =>
                        HD10.menu.toggle(),

                show:
                    section =>
                        HD10.menu.show(
                            section
                        )

            };


        /* ========================================================
           INITIALIZATION
           ======================================================== */

        HD10.menu.injectStyles();

        HD10.menu.create();

        HD10.menu.bindExistingButtons();


        HD10.menu.state.initialized =
            true;


        HD10.emit(
            "menu:ready"
        );

    </script>

        HD11.aiChat.generateResponse =
            async function(

                /*
                 * Prefer the existing AI system.
                 */

                const candidates = [

                    HD11.ai?.chat,

                    HD11.ai?.respond,

                    HD11.ai?.ask,

                    HD11.aiCore?.chat,

                    HD11.aiCore?.respond,

                    HD11.aiEngine?.generate,

                    HD11.aiEngine?.respond

                ];


                for (
                    const candidate of
                    candidates
                ) {

                    if (
                        typeof candidate !==
                        "function"
                    ) {

                        continue;

                    }


                    try {

                        const result =
                            await candidate.call(
                                HD11.ai ||
                                HD11.aiCore ||
                                HD11.aiEngine,
                                message
                            );


                        if (
                            typeof result ===
                            "string" &&
                            result.trim()
                        ) {

                            return result;

                        }


                        if (
                            result?.text
                        ) {

                            return String(
                                result.text
                            );

                        }


                        if (
                            result?.response
                        ) {

                            return String(
                                result.response
                            );

                        }

                    }

                    catch(error) {

                        console.warn(
                            "[HalDo AI] Engine connection failed:",
                            error
                        );

                    }

                }


                return this.localResponse(
                    message

        /* ========================================================

        HD11.aiChat.send =

                    this.state.processing

                if (

                    "user",

                    true;


                if (
                    this.state.sendButton

                        true;

                this.setStatus(
                    "denke …"

                this.showTyping();


                try {

                    const response =
                        await this.generateResponse(
                            message

                    this.hideTyping();


                    this.addMessage(
                        "assistant",
                        response

                    this.setStatus(
                        "bereit"

                    /*

                        HD11.settings?.get(

                            "function"
