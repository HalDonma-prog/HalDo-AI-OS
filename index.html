<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#030712"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 — Professional AI Operating System"
    >

    <meta
        name="application-name"
        content="HalDo AI OS 20"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS"
    >

    <title>HalDo AI OS 20</title>

    <!-- =========================================================
         HALDO AI OS 20
         CENTRAL INDEX / SYSTEM SHELL
         ========================================================= -->

    <style>

        /* =====================================================
           ROOT
           ===================================================== */

        :root {
            --haldo-bg: #02040b;
            --haldo-bg-2: #050b18;

            --haldo-panel: rgba(8, 14, 29, 0.78);
            --haldo-panel-strong: rgba(10, 18, 38, 0.94);

            --haldo-border: rgba(130, 190, 255, 0.20);

            --haldo-text: #f4f8ff;
            --haldo-text-soft: #aabbd3;

            --haldo-blue: #58b9ff;
            --haldo-purple: #9b72ff;
            --haldo-cyan: #62efff;

            --haldo-green: #65e6a2;
            --haldo-red: #ff647c;

            --haldo-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55);

            --haldo-radius: 18px;

            --haldo-topbar-height: 58px;
            --haldo-dock-height: 76px;
        }


        /* =====================================================
           RESET
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        html {
            background: var(--haldo-bg);
            color-scheme: dark;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(45, 75, 150, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 20% 20%,
                    rgba(85, 45, 160, 0.10),
                    transparent 30%
                ),
                var(--haldo-bg);

            color: var(--haldo-text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            color: inherit;
        }

        img {
            max-width: 100%;
        }

        [hidden] {
            display: none !important;
        }


        /* =====================================================
           MAIN OS
           ===================================================== */

        #haldo-os {
            position: fixed;
            inset: 0;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    rgba(27, 42, 88, 0.20),
                    transparent 48%
                );

            isolation: isolate;
        }


        /* =====================================================
           COSMIC BACKGROUND
           ===================================================== */

        #haldo-cosmic-world {
            position: absolute;
            inset: 0;

            overflow: hidden;

            z-index: 1;

            pointer-events: auto;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(20, 35, 75, 0.15),
                    transparent 50%
                );
        }

        #haldo-stars {
            position: absolute;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }

        .haldo-star {
            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 5px rgba(255, 255, 255, 0.9),
                0 0 12px rgba(100, 180, 255, 0.5);

            opacity: 0.75;

            animation:
                haldo-star-pulse
                var(--star-duration)
                ease-in-out
                infinite alternate;
        }

        @keyframes haldo-star-pulse {

            from {
                opacity: 0.25;
                transform: scale(0.65);
            }

            to {
                opacity: 1;
                transform: scale(1.2);
            }
        }


        /* =====================================================
           COSMIC SYSTEM
           ===================================================== */

        #haldo-solar-system {
            position: absolute;

            width: 1100px;
            height: 1100px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.78);

            transform-origin: center center;

            transition:
                transform 0.5s ease;

            pointer-events: none;
        }


        /* =====================================================
           SUN
           ===================================================== */

        #haldo-sun {
            position: absolute;

            width: 125px;
            height: 125px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            cursor: pointer;

            pointer-events: auto;

            z-index: 20;

            background:
                radial-gradient(
                    circle at 35% 28%,
                    #fffef1 0%,
                    #fff7b0 12%,
                    #ffd34f 30%,
                    #ff9a20 55%,
                    #ff5516 78%,
                    #bd1f0b 100%
                );

            box-shadow:
                0 0 20px #fff0a0,
                0 0 45px #ffc13c,
                0 0 90px #ff8a20,
                0 0 160px rgba(255, 103, 20, 0.80),
                0 0 260px rgba(255, 70, 10, 0.38);

            animation:
                haldo-sun-breathe
                3s
                ease-in-out
                infinite
                alternate;
        }

        #haldo-sun::before {
            content: "";

            position: absolute;

            inset: -25px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 180, 60, 0.24),
                    transparent 68%
                );

            animation:
                haldo-sun-aura
                2.6s
                ease-in-out
                infinite
                alternate;

            pointer-events: none;
        }

        #haldo-sun::after {
            content: "HALDO";

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            color: white;

            font-size: 15px;
            font-weight: 900;

            letter-spacing: 3px;

            text-shadow:
                0 0 8px #ffffff,
                0 0 18px #ffb82e;
        }

        @keyframes haldo-sun-breathe {

            from {
                transform:
                    translate(-50%, -50%)
                    scale(0.96);

                box-shadow:
                    0 0 20px #fff0a0,
                    0 0 45px #ffc13c,
                    0 0 90px #ff8a20,
                    0 0 160px rgba(255, 103, 20, 0.75);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    scale(1.08);

                box-shadow:
                    0 0 30px #fff7bd,
                    0 0 70px #ffd35b,
                    0 0 130px #ff8a20,
                    0 0 230px rgba(255, 103, 20, 0.90);
            }
        }

        @keyframes haldo-sun-aura {

            from {
                transform: scale(0.9);
                opacity: 0.45;
            }

            to {
                transform: scale(1.2);
                opacity: 0.9;
            }
        }


        /* =====================================================
           ORBITS
           ===================================================== */

        .haldo-orbit {
            position: absolute;

            left: 50%;
            top: 50%;

            border:
                1px solid
                rgba(130, 190, 255, 0.12);

            border-radius: 50%;

            pointer-events: none;

            transform:
                translate(-50%, -50%)
                rotateX(var(--orbit-x))
                rotateZ(var(--orbit-z));
        }

        .haldo-orbit-1 {
            width: 180px;
            height: 180px;

            --orbit-x: 68deg;
            --orbit-z: 5deg;
        }

        .haldo-orbit-2 {
            width: 260px;
            height: 260px;

            --orbit-x: 66deg;
            --orbit-z: -12deg;
        }

        .haldo-orbit-3 {
            width: 350px;
            height: 350px;

            --orbit-x: 72deg;
            --orbit-z: 18deg;
        }

        .haldo-orbit-4 {
            width: 450px;
            height: 450px;

            --orbit-x: 70deg;
            --orbit-z: -22deg;
        }

        .haldo-orbit-5 {
            width: 570px;
            height: 570px;

            --orbit-x: 75deg;
            --orbit-z: 8deg;
        }

        .haldo-orbit-6 {
            width: 700px;
            height: 700px;

            --orbit-x: 77deg;
            --orbit-z: -15deg;
        }

        .haldo-orbit-7 {
            width: 830px;
            height: 830px;

            --orbit-x: 79deg;
            --orbit-z: 21deg;
        }

        .haldo-orbit-8 {
            width: 960px;
            height: 960px;

            --orbit-x: 81deg;
            --orbit-z: -8deg;
        }

        .haldo-orbit-9 {
            width: 1070px;
            height: 1070px;

            --orbit-x: 83deg;
            --orbit-z: 13deg;
        }


        /* =====================================================
           PLANETS
           ===================================================== */

        .haldo-planet-anchor {
            position: absolute;

            left: 50%;
            top: 0;

            transform:
                translate(-50%, -50%);

            pointer-events: auto;
        }

        .haldo-planet {
            position: relative;

            border-radius: 50%;

            cursor: pointer;

            box-shadow:
                0 0 14px currentColor;

            transition:
                filter 0.2s ease,
                transform 0.2s ease;
        }

        .haldo-planet:hover {
            filter: brightness(1.45);

            transform: scale(1.15);
        }

        .haldo-mercury {
            width: 12px;
            height: 12px;

            background: #aeb3bc;
            color: #aeb3bc;
        }

        .haldo-venus {
            width: 18px;
            height: 18px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fff0b0,
                    #d99745 70%
                );

            color: #e5ae58;
        }

        .haldo-earth {
            width: 23px;
            height: 23px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #71dfff,
                    #2775c9 58%,
                    #143e83
                );

            color: #4fbfff;
        }

        .haldo-mars {
            width: 17px;
            height: 17px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ff9c73,
                    #b83b2b
                );

            color: #e65b43;
        }

        .haldo-jupiter {
            width: 37px;
            height: 37px;

            background:
                linear-gradient(
                    175deg,
                    #f2d2a4,
                    #a66f42 30%,
                    #e8c092 52%,
                    #9c6339 70%,
                    #e0bd8d
                );

            color: #d6a36a;
        }

        .haldo-saturn {
            width: 33px;
            height: 33px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #f5dfb4,
                    #bd9667
                );

            color: #d7bb8d;
        }

        .haldo-saturn::before {
            content: "";

            position: absolute;

            width: 67px;
            height: 18px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                rotate(-12deg);

            border:
                3px solid
                rgba(231, 202, 153, 0.78);

            border-radius: 50%;
        }

        .haldo-uranus {
            width: 27px;
            height: 27px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #a8f1ff,
                    #4eacc8
                );

            color: #75dfff;
        }

        .haldo-neptune {
            width: 25px;
            height: 25px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #739dff,
                    #234ca4
                );

            color: #5f86ff;
        }

        .haldo-pluto {
            width: 12px;
            height: 12px;

            background: #aaa6ad;
            color: #b4afb9;
        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        #haldo-topbar {
            position: absolute;

            left: 0;
            right: 0;
            top: 0;

            height: var(--haldo-topbar-height);

            z-index: 100;

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                8px
                12px;

            background:
                linear-gradient(
                    180deg,
                    rgba(2, 5, 14, 0.92),
                    rgba(2, 5, 14, 0.45)
                );

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid
                rgba(130, 190, 255, 0.10);
        }

        #haldo-brand {
            display: flex;

            align-items: center;

            gap: 8px;

            font-weight: 900;

            letter-spacing: 1px;
        }

        #haldo-brand-mark {
            color: white;

            text-shadow:
                0 0 10px var(--haldo-blue),
                0 0 25px var(--haldo-purple);
        }

        #haldo-system-status {
            margin-left: auto;

            color: var(--haldo-text-soft);

            font-size: 12px;
        }


        /* =====================================================
           BUTTONS
           ===================================================== */

        .haldo-button {
            border:
                1px solid
                var(--haldo-border);

            background:
                rgba(15, 25, 48, 0.78);

            border-radius: 12px;

            padding:
                9px
                12px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .haldo-button:hover {
            background:
                rgba(45, 70, 115, 0.82);

            border-color:
                rgba(110, 190, 255, 0.42);

            transform:
                translateY(-1px);
        }


        /* =====================================================
           MAIN MENU
           ===================================================== */

        #haldo-menu {
            position: absolute;

            left: 12px;
            top: 65px;

            width:
                min(
                    420px,
                    calc(100vw - 24px)
                );

            max-height:
                calc(100vh - 145px);

            overflow: auto;

            z-index: 180;

            padding: 14px;

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                var(--haldo-radius);

            background:
                rgba(5, 10, 23, 0.93);

            box-shadow:
                var(--haldo-shadow);

            backdrop-filter:
                blur(25px);

            opacity: 0;

            transform:
                translateY(-12px)
                scale(0.98);

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        #haldo-menu.open {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);

            pointer-events: auto;
        }

        #haldo-menu-header {
            margin-bottom: 12px;
        }

        #haldo-menu-title {
            font-size: 18px;
            font-weight: 900;
        }

        #haldo-menu-subtitle {
            color: var(--haldo-text-soft);
            font-size: 12px;
        }

        #haldo-app-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(92px, 1fr)
                );

            gap: 8px;
        }

        .haldo-app-button {
            min-height: 76px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 5px;

            border:
                1px solid
                var(--haldo-border);

            border-radius: 14px;

            background:
                rgba(17, 28, 53, 0.68);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .haldo-app-button:hover {
            transform:
                translateY(-3px);

            background:
                rgba(42, 67, 111, 0.82);
        }

        .haldo-app-icon {
            font-size: 24px;
        }

        .haldo-app-name {
            font-size: 11px;

            text-align: center;
        }


        /* =====================================================
           SEARCH
           ===================================================== */

        #haldo-search {
            position: absolute;

            top: 65px;
            right: 12px;

            width:
                min(
                    380px,
                    calc(100vw - 24px)
                );

            z-index: 181;

            padding: 12px;

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                var(--haldo-radius);

            background:
                rgba(5, 10, 23, 0.94);

            backdrop-filter:
                blur(25px);

            opacity: 0;

            transform:
                translateY(-10px);

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        #haldo-search.open {
            opacity: 1;

            transform:
                translateY(0);

            pointer-events: auto;
        }

        #haldo-search-input {
            width: 100%;

            padding: 11px;

            border:
                1px solid
                var(--haldo-border);

            border-radius: 10px;

            outline: none;

            background:
                rgba(2, 7, 18, 0.95);

            color:
                var(--haldo-text);
        }

        #haldo-search-results {
            margin-top: 8px;

            max-height: 350px;

            overflow: auto;
        }


        /* =====================================================
           WINDOWS
           ===================================================== */

        #haldo-window-layer {
            position: absolute;

            left: 0;
            right: 0;

            top:
                var(--haldo-topbar-height);

            bottom:
                var(--haldo-dock-height);

            z-index: 80;

            pointer-events: none;
        }

        .haldo-window {
            position: absolute;

            left: 50%;
            top: 50%;

            width:
                min(
                    900px,
                    92vw
                );

            height:
                min(
                    650px,
                    82vh
                );

            transform:
                translate(-50%, -50%);

            display: flex;

            flex-direction: column;

            overflow: hidden;

            border:
                1px solid
                rgba(140, 195, 255, 0.28);

            border-radius:
                var(--haldo-radius);

            background:
                rgba(6, 12, 27, 0.94);

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.62);

            backdrop-filter:
                blur(24px);

            pointer-events: auto;
        }

        .haldo-window.maximized {
            width: 96vw;
            height: 90vh;
        }

        .haldo-window.minimized {
            display: none;
        }

        .haldo-window-header {
            height: 48px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                0 10px;

            background:
                rgba(18, 30, 55, 0.92);

            border-bottom:
                1px solid
                var(--haldo-border);
        }

        .haldo-window-title {
            flex: 1;

            font-size: 14px;

            font-weight: 800;
        }

        .haldo-window-button {
            width: 34px;
            height: 30px;

            border: 0;

            border-radius: 8px;

            background:
                transparent;

            cursor: pointer;
        }

        .haldo-window-button:hover {
            background:
                rgba(255, 255, 255, 0.09);
        }

        .haldo-window-content {
            flex: 1;

            overflow: auto;

            padding: 16px;
        }


        /* =====================================================
           DOCK
           ===================================================== */

        #haldo-dock {
            position: absolute;

            left: 50%;
            bottom: 14px;

            transform:
                translateX(-50%);

            z-index: 110;

            display: flex;

            align-items: center;

            gap: 7px;

            max-width:
                calc(100vw - 20px);

            overflow-x: auto;

            padding: 8px;

            border:
                1px solid
                var(--haldo-border);

            border-radius: 18px;

            background:
                rgba(4, 9, 20, 0.82);

            backdrop-filter:
                blur(22px);

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.45);
        }

        .haldo-dock-button {
            min-width: 52px;
            height: 48px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 2px;

            border:
                1px solid
                transparent;

            border-radius: 11px;

            background:
                rgba(20, 32, 57, 0.72);

            cursor: pointer;
        }

        .haldo-dock-button:hover {
            background:
                rgba(50, 78, 125, 0.85);

            border-color:
                var(--haldo-border);
        }

        .haldo-dock-icon {
            font-size: 18px;
        }

        .haldo-dock-label {
            font-size: 8px;

            color:
                var(--haldo-text-soft);
        }


        /* =====================================================
           BOOT SCREEN
           ===================================================== */

        #haldo-boot {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #101d40,
                    #02040b 65%
                );

            transition:
                opacity 0.8s ease;
        }

        #haldo-boot.hidden {
            opacity: 0;

            pointer-events: none;
        }

        #haldo-boot-content {
            text-align: center;
        }

        #haldo-boot-logo {
            font-size:
                clamp(
                    48px,
                    12vw,
                    100px
                );

            font-weight: 1000;

            letter-spacing:
                10px;

            color: white;

            text-shadow:
                0 0 15px #58b9ff,
                0 0 35px #8b62ff,
                0 0 80px #58b9ff;

            animation:
                haldo-boot-logo
                2.2s
                ease-in-out
                infinite
                alternate;
        }

        @keyframes haldo-boot-logo {

            from {
                transform:
                    rotateY(0deg)
                    scale(0.95);
            }

            to {
                transform:
                    rotateY(360deg)
                    scale(1.06);
            }
        }

        #haldo-boot-text {
            margin-top: 12px;

            color:
                var(--haldo-text-soft);

            font-size: 13px;
        }

        #haldo-boot-progress {
            width: 280px;

            height: 4px;

            margin:
                25px
                auto
                0;

            overflow: hidden;

            border-radius: 10px;

            background:
                rgba(100, 150, 220, 0.14);
        }

        #haldo-boot-progress-bar {
            width: 0;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    var(--haldo-blue),
                    var(--haldo-purple)
                );

            transition:
                width 0.35s ease;
        }


        /* =====================================================
           TOAST
           ===================================================== */

        #haldo-toast-container {
            position: absolute;

            right: 15px;
            bottom: 88px;

            z-index: 500;

            display: flex;

            flex-direction: column;

            gap: 8px;

            pointer-events: none;
        }

        .haldo-toast {
            max-width:
                min(
                    360px,
                    calc(100vw - 30px)
                );

            padding:
                11px
                14px;

            border:
                1px solid
                var(--haldo-border);

            border-radius: 12px;

            background:
                rgba(7, 13, 28, 0.95);

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.45);

            animation:
                haldo-toast-in
                0.25s
                ease;
        }

<script>

(function () {

    "use strict";


    /* =========================================================
       GLOBAL HALDO SHELL
       ========================================================= */

    window.HalDoIndexShell = {

        version: "20.0.0",

        started: false,

        appButtons: new Map(),

        windows: new Map(),

        zIndex: 200,


        /* =====================================================
           UTILITY
           ===================================================== */

        $(selector) {
            return document.querySelector(selector);
        },


        $all(selector) {
            return Array.from(
                document.querySelectorAll(selector)
            );
        },


        escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        },


        toast(message) {

            const container =
                this.$("#haldo-toast-container");

            if (!container) {
                return;
            }

            const toast =
                document.createElement("div");

            toast.className =
                "haldo-toast";

            toast.textContent =
                message;

            container.appendChild(toast);

            window.setTimeout(
                function () {

                    toast.style.opacity = "0";

                    window.setTimeout(
                        function () {

                            toast.remove();

                        },
                        250
                    );

                },
                2800
            );
        },


        /* =====================================================
           STARS
           ===================================================== */

        createStars() {

            const container =
                this.$("#haldo-stars");

            if (!container) {
                return;
            }

            const fragment =
                document.createDocumentFragment();

            const count =
                window.innerWidth < 700
                    ? 110
                    : 220;


            for (
                let index = 0;
                index < count;
                index++
            ) {

                const star =
                    document.createElement("span");

                star.className =
                    "haldo-star";


                star.style.left =
                    (Math.random() * 100) + "%";


                star.style.top =
                    (Math.random() * 100) + "%";


                const size =
                    Math.random() * 2 + 1;

                star.style.width =
                    size + "px";

                star.style.height =
                    size + "px";


                star.style.setProperty(
                    "--star-duration",
                    (2 + Math.random() * 5) + "s"
                );


                star.style.animationDelay =
                    (-Math.random() * 5) + "s";


                fragment.appendChild(star);
            }


            container.appendChild(fragment);
        },


        /* =====================================================
           APP MANIFEST
           ===================================================== */

        getManifest() {

            const possibleNames = [

                "HalDoAppManifest",

                "HALDO_APP_MANIFEST",

                "HalDoManifest",

                "AppManifest"

            ];


            for (
                const name of possibleNames
            ) {

                if (
                    window[name] &&
                    Array.isArray(window[name])
                ) {

                    return window[name];
                }
            }


            return [

                {
                    id: "home",
                    name: "HalDo Home",
                    icon: "⌂"
                },

                {
                    id: "ai-chat",
                    name: "HalDo AI",
                    icon: "✦"
                },

                {
                    id: "files",
                    name: "Dateien",
                    icon: "▣"
                },

                {
                    id: "calendar",
                    name: "Kalender",
                    icon: "▦"
                },

                {
                    id: "notes",
                    name: "Notizen",
                    icon: "✎"
                },

                {
                    id: "settings",
                    name: "Einstellungen",
                    icon: "⚙"
                },

                {
                    id: "system",
                    name: "System",
                    icon: "◈"
                },

                {
                    id: "about",
                    name: "Über HalDo",
                    icon: "ⓘ"
                }

            ];
        },


        normalizeApp(app) {

            if (Array.isArray(app)) {

                return {

                    id: app[0],

                    name:
                        app[1] ||
                        app[0],

                    icon:
                        app[2] ||
                        "◇"

                };
            }


            return {

                id:
                    app.id ||
                    app.appId ||
                    app.name,

                name:
                    app.name ||
                    app.title ||
                    app.id,

                icon:
                    app.icon ||
                    "◇"

            };
        },


        /* =====================================================
           MENU
           ===================================================== */

        buildMenu() {

            const grid =
                this.$("#haldo-app-grid");

            if (!grid) {
                return;
            }


            grid.innerHTML = "";


            const manifest =
                this.getManifest();


            manifest
                .map(app => this.normalizeApp(app))
                .filter(app => app.id)
                .forEach(app => {

                    const button =
                        document.createElement("button");

                    button.type =
                        "button";

                    button.className =
                        "haldo-app-button";

                    button.dataset.app =
                        app.id;


                    button.innerHTML = `

                        <span class="haldo-app-icon">
                            ${this.escapeHTML(app.icon)}
                        </span>

                        <span class="haldo-app-name">
                            ${this.escapeHTML(app.name)}
                        </span>

                    `;


                    button.addEventListener(
                        "click",
                        () => {

                            this.openApp(
                                app.id,
                                app
                            );

                            this.closeMenu();

                        }
                    );


                    this.appButtons.set(
                        app.id,
                        button
                    );


                    grid.appendChild(
                        button
                    );

                });
        },


        openMenu() {

            const menu =
                this.$("#haldo-menu");

            if (!menu) {
                return;
            }


            menu.classList.add(
                "open"
            );

            menu.setAttribute(
                "aria-hidden",
                "false"
            );
        },


        closeMenu() {

            const menu =
                this.$("#haldo-menu");

            if (!menu) {
                return;
            }


            menu.classList.remove(
                "open"
            );

            menu.setAttribute(
                "aria-hidden",
                "true"
            );
        },


        toggleMenu() {

            const menu =
                this.$("#haldo-menu");

            if (!menu) {
                return;
            }


            menu.classList.contains("open")
                ? this.closeMenu()
                : this.openMenu();
        },


        /* =====================================================
           SEARCH
           ===================================================== */

        openSearch() {

            const search =
                this.$("#haldo-search");

            const input =
                this.$("#haldo-search-input");


            if (!search) {
                return;
            }


            search.classList.add(
                "open"
            );

            search.setAttribute(
                "aria-hidden",
                "false"
            );


            if (input) {

                input.focus();

                input.select();

            }
        },


        closeSearch() {

            const search =
                this.$("#haldo-search");

            if (!search) {
                return;
            }


            search.classList.remove(
                "open"
            );

            search.setAttribute(
                "aria-hidden",
                "true"
            );
        },


        searchApps(query) {

            const results =
                this.$("#haldo-search-results");

            if (!results) {
                return;
            }


            const q =
                String(query || "")
                    .trim()
                    .toLowerCase();


            const manifest =
                this.getManifest()
                    .map(app =>
                        this.normalizeApp(app)
                    );


            const matches =
                manifest.filter(
                    app =>
                        !q ||
                        app.id
                            .toLowerCase()
                            .includes(q) ||
                        app.name
                            .toLowerCase()
                            .includes(q)
                );


            results.innerHTML = "";


            matches.forEach(
                app => {

                    const button =
                        document.createElement("button");

                    button.type =
                        "button";

                    button.className =
                        "haldo-app-button";

                    button.style.width =
                        "100%";

                    button.style.marginBottom =
                        "6px";


                    button.innerHTML = `

                        <span
                            style="
                                font-size:20px;
                                margin-right:8px;
                            "
                        >
                            ${this.escapeHTML(app.icon)}
                        </span>

                        ${this.escapeHTML(app.name)}

                    `;


                    button.addEventListener(
                        "click",
                        () => {

                            this.openApp(
                                app.id,
                                app
                            );

                            this.closeSearch();

                        }
                    );


                    results.appendChild(
                        button
                    );

                }
            );
        },


        /* =====================================================
           APP OPENING
           ===================================================== */

        openApp(id, manifestApp) {

            /*
             * Zuerst versuchen wir die echte HalDo-Runtime.
             */

            const runtimeCandidates = [

                window.HalDoAppRuntime,

                window.HalDoOS?.appRuntime,

                window.HalDoOS?.runtime,

                window.HalDoRuntime

            ];


            for (
                const runtime of runtimeCandidates
            ) {

                if (!runtime) {
                    continue;
                }


                try {

                    if (
                        typeof runtime.openApp ===
                        "function"
                    ) {

                        runtime.openApp(id);

                        return;
                    }


                    if (
                        typeof runtime.launch ===
                        "function"
                    ) {

                        runtime.launch(id);

                        return;
                    }


                    if (
                        typeof runtime.startApp ===
                        "function"
                    ) {

                        runtime.startApp(id);

                        return;
                    }

                }
                catch (error) {

                    console.error(
                        "HalDo Runtime openApp error:",
                        error
                    );

                }

            }


            /*
             * Danach Router.
             */

            const routerCandidates = [

                window.HalDoAppRouter,

                window.HalDoRouter,

                window.HalDoOS?.router

            ];


            for (
                const router of routerCandidates
            ) {

                if (!router) {
                    continue;
                }


                try {

                    if (
                        typeof router.navigate ===
                        "function"
                    ) {

                        router.navigate(
                            id
                        );

                        return;
                    }


                    if (
                        typeof router.open ===
                        "function"
                    ) {

                        router.open(
                            id
                        );

                        return;
                    }


                    if (
                        typeof router.route ===
                        "function"
                    ) {

                        router.route(
                            id
                        );

                        return;
                    }

                }
                catch (error) {

                    console.error(
                        "HalDo Router error:",
                        error
                    );

                }

            }


            /*
             * Wenn die externe Runtime noch keine
             * konkrete Open-Funktion bereitstellt,
             * zeigt die Shell trotzdem ein funktionierendes
             * Systemfenster.
             */

            this.openShellWindow(
                id,
                manifestApp
            );
        },


        /* =====================================================
           FALLBACK WINDOW
           ===================================================== */

        openShellWindow(id, app) {

            const existing =
                this.windows.get(id);


            if (existing) {

                existing.style.zIndex =
                    ++this.zIndex;

                existing.classList.remove(
                    "minimized"
                );

                return;
            }


            const normalized =
                this.normalizeApp(
                    app || {
                        id,
                        name: id,
                        icon: "◇"
                    }
                );


            const windowElement =
                document.createElement("section");

            windowElement.className =
                "haldo-window";


            windowElement.dataset.app =
                id;


            windowElement.style.zIndex =
                ++this.zIndex;


            windowElement.innerHTML = `

                <div class="haldo-window-header">

                    <div class="haldo-window-title">

                        ${this.escapeHTML(
                            normalized.icon
                        )}

                        ${this.escapeHTML(
                            normalized.name
                        )}

                    </div>


                    <button
                        type="button"
                        class="haldo-window-button"
                        data-window-action="minimize"
                    >
                        —
                    </button>


                    <button
                        type="button"
                        class="haldo-window-button"
                        data-window-action="maximize"
                    >
                        □
                    </button>


                    <button
                        type="button"
                        class="haldo-window-button"
                        data-window-action="close"
                    >
                        ×
                    </button>

                </div>


                <div class="haldo-window-content">

                    <div
                        data-haldo-app-root="${this.escapeHTML(id)}"
                    ></div>

                </div>

            `;


            const layer =
                this.$(
                    "#haldo-window-layer"
                );


            if (!layer) {
                return;
            }


            layer.appendChild(
                windowElement
            );


            this.windows.set(
                id,
                windowElement
            );


            const content =
                windowElement.querySelector(
                    ".haldo-window-content"
                );


            /*
             * Versuche die echte App zu mounten.
             */

            const appManagerCandidates = [

                window.HalDoAppManager,

                window.HalDoOS?.appManager,

                window.HalDoAppManagerInstance

            ];


            let mounted = false;


            for (
                const manager of
                appManagerCandidates
            ) {

                if (!manager) {
                    continue;
                }


                try {

                    if (
                        typeof manager.mount ===
                        "function"
                    ) {

                        manager.mount(
                            id,
                            content
                        );

                        mounted = true;

                        break;
                    }


                    if (
                        typeof manager.render ===
                        "function"
                    ) {

                        manager.render(
                            id,
                            content
                        );

                        mounted = true;

                        break;
                    }

                }
                catch (error) {

                    console.error(
                        "HalDo App Manager:",
                        error
                    );

                }

            }


            if (!mounted) {

                this.renderShellApp(
                    id,
                    normalized,
                    content
                );

            }


            /*
             * Window actions.
             */

            windowElement
                .querySelector(
                    '[data-window-action="close"]'
                )
                .addEventListener(
                    "click",
                    () => {

                        this.closeApp(
                            id
                        );

                    }
                );


            windowElement
                .querySelector(
                    '[data-window-action="minimize"]'
                )
                .addEventListener(
                    "click",
                    () => {

                        windowElement.classList.add(
                            "minimized"
                        );

                    }
                );


            windowElement
                .querySelector(
                    '[data-window-action="maximize"]'
                )
                .addEventListener(
                    "click",
                    () => {

                        windowElement.classList.toggle(
                            "maximized"
                        );

                    }
                );


            windowElement.addEventListener(
                "pointerdown",
                () => {

                    windowElement.style.zIndex =
                        ++this.zIndex;

                }
            );
        },


        /* =====================================================
           SHELL APP CONTENT
           ===================================================== */

        renderShellApp(
            id,
            app,
            content
        ) {

            const name =
                this.escapeHTML(
                    app.name
                );


            const icon =
                this.escapeHTML(
                    app.icon
                );


            content.innerHTML = `

                <div
                    style="
                        display:grid;
                        gap:14px;
                    "
                >

                    <div>

                        <h1
                            style="
                                margin:0 0 6px;
                            "
                        >
                            ${icon} ${name}
                        </h1>

                        <p
                            style="
                                color:var(--haldo-text-soft);
                            "
                        >
                            HalDo AI OS 20 Runtime
                        </p>

                    </div>


                    <div
                        style="
                            display:grid;
                            grid-template-columns:
                                repeat(
                                    auto-fit,
                                    minmax(
                                        180px,
                                        1fr
                                    )
                                );
                            gap:10px;
                        "
                    >

                        <div
                            style="
                                padding:14px;
                                border:1px solid
                                    var(--haldo-border);
                                border-radius:14px;
                                background:
                                    rgba(
                                        18,
                                        30,
                                        55,
                                        0.6
                                    );
                            "
                        >

                            <strong>
                                App Registry
                            </strong>

                            <p
                                style="
                                    color:
                                        var(
                                            --haldo-text-soft
                                        );
                                    font-size:12px;
                                "
                            >
                                Verbunden
                            </p>

                        </div>


                        <div
                            style="
                                padding:14px;
                                border:1px solid
                                    var(--haldo-border);
                                border-radius:14px;
                                background:
                                    rgba(
                                        18,
                                        30,
                                        55,
                                        0.6
                                    );
                            "
                        >

                            <strong>
                                Window Manager
                            </strong>

                            <p
                                style="
                                    color:
                                        var(
                                            --haldo-text-soft
                                        );
                                    font-size:12px;
                                "
                            >
                                Aktiv
                            </p>

                        </div>


                        <div
                            style="
                                padding:14px;
                                border:1px solid
                                    var(--haldo-border);
                                border-radius:14px;
                                background:
                                    rgba(
                                        18,
                                        30,
                                        55,
                                        0.6
                                    );
                            "
                        >

                            <strong>
                                Service System
                            </strong>

                            <p
                                style="
                                    color:
                                        var(
                                            --haldo-text-soft
                                        );
                                    font-size:12px;
                                "
                            >
                                Bereit
                            </p>

                        </div>

                    </div>


                    <div
                        style="
                            padding:16px;
                            border:
                                1px solid
                                var(--haldo-border);
                            border-radius:14px;
                            background:
                                rgba(
                                    10,
                                    18,
                                    36,
                                    0.65
                                );
                        "
                    >

                        <h3>
                            ${name}
                        </h3>

                        <p
                            style="
                                color:
                                    var(
                                        --haldo-text-soft
                                    );
                            "
                        >
                            Die App ist im HalDo
                            Application System registriert.
                            Ihre vollständige innere
                            Funktionalität wird über die
                            zentrale HalDo Runtime und
                            das jeweilige App-Modul
                            bereitgestellt.
                        </p>

                    </div>

                </div>

            `;
        },


        /* =====================================================
           CLOSE APP
           ===================================================== */

        closeApp(id) {

            const windowElement =
                this.windows.get(id);


            if (!windowElement) {
                return;
            }


            const managerCandidates = [

                window.HalDoAppManager,

                window.HalDoOS?.appManager

            ];


            for (
                const manager of
                managerCandidates
            ) {

                if (!manager) {
                    continue;
                }


                try {

                    if (
                        typeof manager.closeApp ===
                        "function"
                    ) {

                        manager.closeApp(
                            id
                        );

                    }
                    else if (
                        typeof manager.unmount ===
                        "function"
                    ) {

                        manager.unmount(
                            id
                        );

                    }

                }
                catch (error) {

                    console.error(
                        "HalDo App close error:",
                        error
                    );

                }

            }


            windowElement.remove();

            this.windows.delete(
                id
            );
        },


        /* =====================================================
           SUN
           ===================================================== */

        bindSun() {

            const sun =
                this.$("#haldo-sun");


            if (!sun) {
                return;
            }


            sun.addEventListener(
                "click",
                () => {

                    this.openApp(
                        "ai-chat",
                        {
                            id: "ai-chat",
                            name: "HalDo AI",
                            icon: "✦"
                        }
                    );


                    this.toast(
                        "HalDo AI wird geöffnet…"
                    );

                }
            );
        },


        /* =====================================================
           PLANETS
           ===================================================== */

        bindPlanets() {

            this.$all(
                ".haldo-planet[data-app]"
            ).forEach(
                planet => {

                    planet.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();


                            const id =
                                planet.dataset.app;


                            this.openApp(
                                id
                            );

                        }
                    );

                }
            );
        },


        /* =====================================================
           DOCK
           ===================================================== */

        bindDock() {

            this.$all(
                "#haldo-dock [data-app]"
            ).forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            this.openApp(
                                button.dataset.app
                            );

                        }
                    );

                }
            );
        },


        /* =====================================================
           GLOBAL EVENTS
           ===================================================== */

        bindGlobalEvents() {

            const menuButton =
                this.$(
                    "#haldo-menu-button"
                );


            const searchButton =
                this.$(
                    "#haldo-search-button"
                );


            if (menuButton) {

                menuButton.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        this.toggleMenu();

                    }
                );

            }


            if (searchButton) {

                searchButton.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        this.openSearch();

                    }
                );

            }


            document.addEventListener(
                "click",
                event => {

                    const menu =
                        this.$(
                            "#haldo-menu"
                        );

                    const search =
                        this.$(
                            "#haldo-search"
                        );


                    if (
                        menu &&
                        menu.classList.contains("open") &&
                        !menu.contains(event.target) &&
                        event.target !== menuButton
                    ) {

                        this.closeMenu();

                    }


                    if (
                        search &&
                        search.classList.contains("open") &&
                        !search.contains(event.target) &&
                        event.target !== searchButton
                    ) {

                        this.closeSearch();

                    }

                }
            );


            const searchInput =
                this.$(
                    "#haldo-search-input"
                );


            if (searchInput) {

                searchInput.addEventListener(
                    "input",
                    event => {

                        this.searchApps(
                            event.target.value
                        );

                    }
                );

            }


            document.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Escape"
                    ) {

                        this.closeMenu();
                        this.closeSearch();

                    }


                    if (
                        event.ctrlKey &&
                        event.key.toLowerCase() ===
                        "k"
                    ) {

                        event.preventDefault();

                        this.openSearch();

                    }

                }
            );


            window.addEventListener(
                "online",
                () => {

                    this.updateStatus(
                        "ONLINE"
                    );

                }
            );


            window.addEventListener(
                "offline",
                () => {

                    this.updateStatus(
                        "OFFLINE"
                    );

                }
            );

        },


        /* =====================================================
           STATUS
           ===================================================== */

        updateStatus(status) {

            const element =
                this.$(
                    "#haldo-system-status"
                );


            if (!element) {
                return;
            }


            element.textContent =
                "Kernel: " + status;
        },


        /* =====================================================
           BOOT
           ===================================================== */

        async boot() {

            if (this.started) {
                return;
            }


            this.started = true;


            const progress =
                this.$(
                    "#haldo-boot-progress-bar"
                );


            const bootText =
                this.$(
                    "#haldo-boot-text"
                );


            const bootScreen =
                this.$(
                    "#haldo-boot"
                );


            const setStage =
                async (
                    percentage,
                    text
                ) => {

                    if (progress) {

                        progress.style.width =
                            percentage + "%";

                    }


                    if (bootText) {

                        bootText.textContent =
                            text;

                    }


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                180
                            )
                    );

                };


            await setStage(
                8,
                "HalDo Boot Manager…"
            );


            await setStage(
                20,
                "Kernel wird initialisiert…"
            );


            await setStage(
                35,
                "System Core wird verbunden…"
            );


            await setStage(
                48,
                "Event System wird verbunden…"
            );


            await setStage(
                60,
                "Service Bridge wird gestartet…"
            );


            await setStage(
                72,
                "App Registry wird geladen…"
            );


            await setStage(
                84,
                "App Runtime wird verbunden…"
            );


            await setStage(
                94,
                "Cosmic World wird initialisiert…"
            );


            await setStage(
                100,
                "HalDo AI OS ist bereit."
            );


            this.updateStatus(
                "READY"
            );


            document
                .documentElement
                .setAttribute(
                    "data-haldo-ready",
                    "true"
                );


            const os =
                this.$(
                    "#haldo-os"
                );


            if (os) {

                os.dataset.haldoRuntime =
                    "ready";

            }


            /*
             * Vorhandene HalDo-Systeme informieren.
             */

            const events = [

                "haldo:ready",

                "system:ready",

                "runtime:ready",

                "kernel:ready"

            ];


            events.forEach(
                eventName => {

                    try {

                        window.dispatchEvent(
                            new CustomEvent(
                                eventName,
                                {
                                    detail: {
                                        version:
                                            "20.0.0"
                                    }
                                }
                            )
                        );

                    }
                    catch (error) {

                        console.warn(
                            eventName,
                            error
                        );

                    }

                }
            );


            if (bootScreen) {

                window.setTimeout(
                    () => {

                        bootScreen.classList.add(
                            "hidden"
                        );

                        window.setTimeout(
                            () => {

                                bootScreen.remove();

                            },
                            900
                        );

                    },
                    350
                );

            }


            this.toast(
                "HalDo AI OS 20 ist bereit."
            );
        },


        /* =====================================================
           INITIALIZATION
           ===================================================== */

        init() {

            this.createStars();

            this.buildMenu();

            this.bindSun();

            this.bindPlanets();

            this.bindDock();

            this.bindGlobalEvents();

            this.boot();

        }

    };


    /* =========================================================
       GLOBAL API
       ========================================================= */

    window.HalDoIndex =
        window.HalDoIndexShell;


    window.HalDoOS =
        window.HalDoOS ||
        {};


    window.HalDoOS.index =
        window.HalDoIndexShell;


    /* =========================================================
       START
       ========================================================= */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                window.HalDoIndexShell.init();

            },
            {
                once: true
            }
        );

    }
    else {

        window.HalDoIndexShell.init();

    }


})();

</script>
