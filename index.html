
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#05070d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – Professional Ultimate AI Operating System"
    >

    <title>HalDo AI OS 20</title>

    <link rel="manifest" href="manifest.json">

    <style>
        /* ============================================================
           HALDO AI OS 20
           CORE UI
        ============================================================ */

        :root {
            --haldo-bg: #05070d;
            --haldo-bg-2: #0b0f18;
            --haldo-panel: rgba(15, 20, 32, 0.92);
            --haldo-panel-2: rgba(25, 31, 47, 0.92);
            --haldo-border: rgba(255, 255, 255, 0.11);
            --haldo-text: #f5f7fb;
            --haldo-muted: #9ca7ba;
            --haldo-accent: #55aaff;
            --haldo-accent-2: #8d6cff;
            --haldo-success: #51d88a;
            --haldo-danger: #ff5c73;

            --window-width: min(860px, 88vw);
            --window-height: min(650px, 78vh);

            --dock-height: 74px;
            --topbar-height: 58px;

            --radius: 20px;
            --shadow:
                0 24px 80px rgba(0, 0, 0, 0.48),
                0 8px 30px rgba(0, 0, 0, 0.30);

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--haldo-bg);
            color: var(--haldo-text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        /* ============================================================
           BOOT
        ============================================================ */

        #haldo-boot {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(70, 120, 255, 0.18),
                    transparent 38%
                ),
                #05070d;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        #haldo-boot.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .boot-content {
            width: min(420px, 84vw);
            text-align: center;
        }

        .boot-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;

            animation:
                bootLogoRotate 4s linear infinite,
                bootLogoGlow 1.8s ease-in-out infinite alternate;
        }

        @keyframes bootLogoRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes bootLogoGlow {
            from {
                filter:
                    drop-shadow(0 0 10px rgba(80, 160, 255, 0.3));
            }

            to {
                filter:
                    drop-shadow(0 0 35px rgba(80, 160, 255, 0.95));
            }
        }

        .boot-title {
            margin-top: 22px;
            font-size: 26px;
            font-weight: 700;
        }

        .boot-subtitle {
            margin-top: 8px;
            color: var(--haldo-muted);
            font-size: 14px;
        }

        .boot-progress {
            margin-top: 26px;
            height: 4px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
        }

        .boot-progress-bar {
            width: 0%;
            height: 100%;
            background:
                linear-gradient(
                    90deg,
                    var(--haldo-accent),
                    var(--haldo-accent-2)
                );
            transition: width 0.3s ease;
        }

        .boot-status {
            margin-top: 14px;
            color: var(--haldo-muted);
            font-size: 12px;
        }

        /* ============================================================
           DESKTOP
        ============================================================ */

        #haldo-desktop {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(75, 120, 255, 0.10),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(140, 90, 255, 0.08),
                    transparent 35%
                ),
                linear-gradient(
                    145deg,
                    #05070d,
                    #080c15 45%,
                    #05070d
                );

            overflow: hidden;
        }

        /* ============================================================
           TOP BAR
        ============================================================ */

        #haldo-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            height: calc(
                var(--topbar-height) + var(--safe-top)
            );

            padding:
                var(--safe-top)
                var(--safe-right)
                0
                var(--safe-left);

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(5, 7, 13, 0.66);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid var(--haldo-border);

            z-index: 5000;
        }

        .top-left,
        .top-right {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .haldo-brand {
            display: flex;
            align-items: center;
            gap: 9px;

            padding: 6px 10px;
            border-radius: 14px;

            color: white;
            background: rgba(255, 255, 255, 0.04);
        }

        .haldo-brand img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .haldo-brand-text {
            display: flex;
            flex-direction: column;
        }

        .haldo-brand-title {
            font-size: 13px;
            font-weight: 700;
        }

        .haldo-brand-version {
            color: var(--haldo-muted);
            font-size: 9px;
        }

        .system-time {
            color: var(--haldo-muted);
            font-size: 12px;
        }

        .top-button {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            color: var(--haldo-text);
            background: rgba(255, 255, 255, 0.06);

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .top-button:hover {
            background: rgba(255, 255, 255, 0.11);
            transform: translateY(-1px);
        }

        /* ============================================================
           WORKSPACE
        ============================================================ */

        #haldo-workspace {
            position: absolute;

            top: calc(var(--topbar-height) + var(--safe-top));
            right: 0;
            bottom: calc(
                var(--dock-height) + var(--safe-bottom)
            );
            left: 0;

            overflow: hidden;
        }

        /* ============================================================
           APP LAUNCHER
        ============================================================ */

        #haldo-app-launcher {
            position: absolute;

            inset: 18px;

            z-index: 100;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transform: translateY(12px) scale(0.98);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                visibility 0.25s ease;
        }

        #haldo-app-launcher.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transform: translateY(0) scale(1);
        }

        .launcher-panel {
            width: 100%;
            height: 100%;

            padding: 20px;

            overflow: auto;

            border: 1px solid var(--haldo-border);
            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(13, 18, 30, 0.97),
                    rgba(8, 12, 21, 0.97)
                );

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow: var(--shadow);
        }

        .launcher-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .launcher-title {
            font-size: 21px;
            font-weight: 700;
        }

        .launcher-subtitle {
            margin-top: 4px;
            color: var(--haldo-muted);
            font-size: 12px;
        }

        .launcher-search {
            width: min(360px, 48vw);

            padding: 11px 14px;

            color: white;

            outline: none;

            border: 1px solid var(--haldo-border);
            border-radius: 13px;

            background: rgba(255, 255, 255, 0.05);
        }

        .app-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(105px, 1fr)
                );

            gap: 12px;
        }

        .app-tile {
            min-height: 105px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 12px;

            color: white;

            border: 1px solid var(--haldo-border);
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.035);

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease;
        }

        .app-tile:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.075);
            border-color: rgba(100, 160, 255, 0.4);
        }

        .app-icon {
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    rgba(80, 150, 255, 0.24),
                    rgba(140, 90, 255, 0.22)
                );

            font-size: 22px;
        }

        .app-name {
            max-width: 100%;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 12px;
        }

        /* ============================================================
           WINDOW LAYER
        ============================================================ */

        #haldo-window-layer {
            position: absolute;
            inset: 0;

            z-index: 1000;

            pointer-events: none;
        }

        .haldo-window {
            position: absolute;

            width: var(--window-width);
            height: var(--window-height);

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            border-radius: var(--radius);

            background:
                linear-gradient(
                    145deg,
                    rgba(17, 22, 35, 0.97),
                    rgba(8, 12, 21, 0.98)
                );

            box-shadow: var(--shadow);

            pointer-events: auto;

            transition:
                width 0.22s ease,
                height 0.22s ease,
                border-radius 0.22s ease,
                opacity 0.18s ease;
        }

        .haldo-window.window-small {
            width: min(480px, 70vw);
            height: min(390px, 60vh);
        }

        .haldo-window.window-normal {
            width: var(--window-width);
            height: var(--window-height);
        }

        .haldo-window.window-large {
            width: min(1050px, 94vw);
            height: min(780px, 88vh);
        }

        .haldo-window.window-maximized {
            inset: 10px;

            width: auto;
            height: auto;

            left: 10px;
            top: 10px;

            transform: none;

            border-radius: 16px;
        }

        .haldo-window.minimized {
            opacity: 0;
            pointer-events: none;
            transform:
                translate(-50%, -50%)
                scale(0.75);
        }

        .window-header {
            min-height: 48px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 7px 9px 7px 14px;

            border-bottom:
                1px solid
                var(--haldo-border);

            background:
                rgba(255, 255, 255, 0.025);

            user-select: none;
            touch-action: none;
        }

        .window-title-area {
            display: flex;
            align-items: center;
            gap: 9px;

            min-width: 0;
        }

        .window-icon {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex: 0 0 auto;

            border-radius: 9px;

            background:
                rgba(80, 150, 255, 0.14);
        }

        .window-title {
            overflow: hidden;

            font-size: 13px;
            font-weight: 600;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .window-control {
            width: 31px;
            height: 31px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--haldo-muted);

            border-radius: 9px;

            background: transparent;

            transition:
                background 0.18s ease,
                color 0.18s ease;
        }

        .window-control:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        .window-control.close:hover {
            color: white;
            background: rgba(255, 70, 90, 0.28);
        }

        .window-content {
            flex: 1;
            min-height: 0;

            overflow: auto;

            padding: 16px;
        }

        /* ============================================================
           HALDO AI
        ============================================================ */

        .ai-app {
            height: 100%;

            display: flex;
            flex-direction: column;
        }

        .ai-welcome {
            padding: 16px 4px;
        }

        .ai-welcome-title {
            font-size: 24px;
            font-weight: 750;
        }

        .ai-welcome-subtitle {
            margin-top: 6px;
            color: var(--haldo-muted);
            line-height: 1.55;
            font-size: 13px;
        }

        .ai-messages {
            flex: 1;

            overflow-y: auto;

            padding: 8px 3px 18px;
        }

        .ai-message {
            max-width: min(760px, 88%);
            margin-bottom: 13px;
        }

        .ai-message.user {
            margin-left: auto;
        }

        .ai-message-bubble {
            padding: 12px 14px;

            border-radius: 16px;

            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;

            background: rgba(255, 255, 255, 0.055);
        }

        .ai-message.user .ai-message-bubble {
            background:
                linear-gradient(
                    145deg,
                    rgba(65, 130, 240, 0.27),
                    rgba(110, 80, 220, 0.25)
                );
        }

        .ai-message-label {
            margin-bottom: 5px;

            color: var(--haldo-muted);

            font-size: 10px;
        }

        .ai-input-area {
            display: flex;
            align-items: flex-end;
            gap: 8px;

            padding-top: 10px;

            border-top:
                1px solid
                var(--haldo-border);
        }

        .ai-input {
            flex: 1;

            min-height: 46px;
            max-height: 150px;

            resize: none;

            padding: 13px 14px;

            outline: none;

            color: white;

            border:
                1px solid
                var(--haldo-border);

            border-radius: 15px;

            background:
                rgba(255, 255, 255, 0.045);
        }

        .ai-action {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex: 0 0 auto;

            color: white;

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.07);
        }

        .ai-action.active {
            background:
                rgba(255, 70, 90, 0.25);
        }

        .ai-send {
            background:
                linear-gradient(
                    145deg,
                    rgba(70, 145, 255, 0.65),
                    rgba(120, 80, 230, 0.65)
                );
        }

        /* ============================================================
           EZIDI KEYBOARD
        ============================================================ */

        .ezidi-keyboard {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(42px, 1fr)
                );

            gap: 6px;

            margin-top: 10px;
            padding: 10px;

            border:
                1px solid
                var(--haldo-border);

            border-radius: 15px;

            background:
                rgba(0, 0, 0, 0.18);
        }

        .ezidi-key {
            min-height: 38px;

            color: white;

            border-radius: 9px;

            background:
                rgba(255, 255, 255, 0.055);

            transition:
                transform 0.1s ease,
                background 0.1s ease;
        }

        .ezidi-key:active {
            transform: scale(0.94);
            background:
                rgba(90, 150, 255, 0.25);
        }

        .ezidi-tools {
            display: flex;
            gap: 7px;
            margin-top: 9px;
        }

        .ezidi-tool {
            padding: 8px 11px;

            color: white;

            border-radius: 9px;

            background:
                rgba(255, 255, 255, 0.06);
        }

        /* ============================================================
           GENERIC APP
        ============================================================ */

        .generic-app {
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .generic-card {
            padding: 18px;

            border:
                1px solid
                var(--haldo-border);

            border-radius: 17px;

            background:
                rgba(255, 255, 255, 0.035);
        }

        .generic-title {
            font-size: 19px;
            font-weight: 700;
        }

        .generic-text {
            margin-top: 7px;

            color: var(--haldo-muted);

            line-height: 1.55;
            font-size: 13px;
        }

        /* ============================================================
           DOCK
        ============================================================ */

        #haldo-dock {
            position: absolute;

            bottom: 0;
            left: 0;
            right: 0;

            height: calc(
                var(--dock-height) + var(--safe-bottom)
            );

            padding:
                7px
                max(10px, var(--safe-right))
                var(--safe-bottom)
                max(10px, var(--safe-left));

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 5000;

            pointer-events: none;
        }

        .dock-inner {
            min-width: min(360px, 92vw);
            max-width: 760px;

            padding: 7px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            border:
                1px solid
                var(--haldo-border);

            border-radius: 19px;

            background:
                rgba(9, 13, 22, 0.84);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.35);

            pointer-events: auto;
        }

        .dock-button {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.055);

            transition:
                transform 0.18s ease,
                background 0.18s ease;
        }

        .dock-button:hover {
            transform: translateY(-2px);
            background:
                rgba(255, 255, 255, 0.10);
        }

        .dock-button.primary {
            background:
                linear-gradient(
                    145deg,
                    rgba(70, 145, 255, 0.52),
                    rgba(130, 85, 235, 0.52)
                );
        }

        /* ============================================================
           RESPONSIVE — TABLET
        ============================================================ */

        @media (max-width: 900px) {
            :root {
                --window-width: min(760px, 91vw);
                --window-height: min(620px, 76vh);
            }

            .launcher-search {
                width: 42vw;
            }

            .app-grid {
                grid-template-columns:
                    repeat(
                        auto-fill,
                        minmax(95px, 1fr)
                    );
            }
        }

        /* ============================================================
           RESPONSIVE — PHONE
        ============================================================ */

        @media (max-width: 600px) {
            :root {
                --topbar-height: 51px;
                --dock-height: 65px;

                --window-width: min(92vw, 430px);
                --window-height: min(69vh, 590px);

                --radius: 16px;
            }

            #haldo-workspace {
                top: calc(
                    var(--topbar-height) +
                    var(--safe-top)
                );
            }

            #haldo-app-launcher {
                inset: 8px;
            }

            .launcher-panel {
                padding: 13px;
                border-radius: 18px;
            }

            .launcher-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .launcher-search {
                width: 100%;
            }

            .app-grid {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

                gap: 8px;
            }

            .app-tile {
                min-height: 88px;
                padding: 8px;
                border-radius: 14px;
            }

            .app-icon {
                width: 40px;
                height: 40px;
                border-radius: 12px;
                font-size: 18px;
            }

            .app-name {
                font-size: 10px;
            }

            .haldo-window {
                width: 92vw;
                height: 69vh;

                border-radius: 16px;
            }

            .haldo-window.window-small {
                width: 76vw;
                height: 48vh;
            }

            .haldo-window.window-normal {
                width: 92vw;
                height: 69vh;
            }

            .haldo-window.window-large {
                width: 96vw;
                height: 84vh;
            }

            .haldo-window.window-maximized {
                inset: 5px;

                width: auto;
                height: auto;

                left: 5px;
                top: 5px;
            }

            .window-header {
                min-height: 44px;
                padding-left: 9px;
            }

            .window-control {
                width: 29px;
                height: 29px;
            }

            .window-content {
                padding: 11px;
            }

            .dock-inner {
                min-width: 0;
                width: auto;
            }

            .dock-button {
                width: 42px;
                height: 42px;
            }

            .haldo-brand-text {
                display: none;
            }

            .system-time {
                display: none;
            }

            .ai-welcome-title {
                font-size: 20px;
            }

            .ai-input-area {
                gap: 5px;
            }

            .ai-action {
                width: 42px;
                height: 42px;
            }

            .ai-input {
                min-height: 42px;
            }
        }

        /* ============================================================
           VERY SMALL PHONE
        ============================================================ */

        @media (max-width: 380px) {
            .app-grid {
                grid-template-columns:
                    repeat(
                        3,
                        1fr
                    );
            }

            .dock-button {
                width: 38px;
                height: 38px;
            }

            .dock-inner {
                gap: 4px;
                padding: 5px;
            }

            .haldo-window {
                width: 94vw;
                height: 66vh;

    </style>

<!-- ================================================================
     HALDO RUNTIME BOOTSTRAP
================================================================ -->

<script>
(function () {

    "use strict";

    /* ============================================================
       GLOBAL HALDO BOOT OBJECT
    ============================================================ */

    window.HalDoBoot = {
        startedAt: Date.now(),
        progress: 0,
        stage: "initializing",

        setProgress(value, message) {

            this.progress = Math.max(
                0,
                Math.min(100, value)
            );

            const bar =
                document.getElementById(
                    "haldo-boot-progress-bar"
                );

            const status =
                document.getElementById(
                    "haldo-boot-status"
                );

            if (bar) {
                bar.style.width =
                    this.progress + "%";
            }

            if (status && message) {
                status.textContent = message;
            }
        },

        finish() {

            this.setProgress(
                100,
                "HalDo AI ist bereit."
            );

            setTimeout(() => {

                const boot =
                    document.getElementById(
                        "haldo-boot"
                    );

                if (boot) {
                    boot.classList.add("hidden");
                }

            }, 650);
        }
    };


    /* ============================================================
       HALDO GLOBAL UI
    ============================================================ */

    window.HalDoUI = {

        windows: new Map(),

        activeWindow: null,

        zIndex: 1000,

        device: "desktop",

        windowSize: "normal",

        appDefinitions: [],

        launcherOpen: false,

        setDevice() {

            const width =
                window.innerWidth;

            if (width <= 600) {
                this.device = "phone";
            } else if (width <= 1000) {
                this.device = "tablet";
            } else {
                this.device = "desktop";
            }

            document.documentElement
                .dataset
                .device = this.device;
        },

        toggleLauncher(force) {

            const launcher =
                document.getElementById(
                    "haldo-app-launcher"
                );

            if (!launcher) {
                return;
            }

            this.launcherOpen =
                typeof force === "boolean"
                    ? force
                    : !this.launcherOpen;

            launcher.classList.toggle(
                "open",
                this.launcherOpen
            );

            launcher.setAttribute(
                "aria-hidden",
                this.launcherOpen
                    ? "false"
                    : "true"
            );
        },

        closeAllWindows() {

            for (
                const id
                of this.windows.keys()
            ) {

                this.closeWindow(id);

            }

        },

        focusWindow(id) {

            const win =
                this.windows.get(id);

            if (!win) {
                return;
            }

            this.zIndex += 1;

            win.element.style.zIndex =
                this.zIndex;

            this.activeWindow = id;
        },

        createWindow(options = {}) {

            const id =
                options.id ||
                (
                    "haldo-window-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2)
                );

            const title =
                options.title ||
                "HalDo App";

            const icon =
                options.icon ||
                "◈";

            const content =
                options.content ||
                "";

            const requestedSize =
                options.size ||
                this.windowSize ||
                "normal";

            const layer =
                document.getElementById(
                    "haldo-window-layer"
                );

            if (!layer) {
                return null;
            }

            /* Already open */
            if (this.windows.has(id)) {

                this.focusWindow(id);

                const existing =
                    this.windows.get(id);

                existing.element
                    .classList
                    .remove("minimized");

                return existing;
            }

            const element =
                document.createElement("article");

            element.className =
                "haldo-window " +
                "window-" +
                requestedSize;

            element.dataset.windowId = id;

            const header =
                document.createElement("div");

            header.className =
                "window-header";

            const titleArea =
                document.createElement("div");

            titleArea.className =
                "window-title-area";

            const iconElement =
                document.createElement("div");

            iconElement.className =
                "window-icon";

            iconElement.textContent =
                icon;

            const titleElement =
                document.createElement("div");

            titleElement.className =
                "window-title";

            titleElement.textContent =
                title;

            titleArea.appendChild(
                iconElement
            );

            titleArea.appendChild(
                titleElement
            );


            const controls =
                document.createElement("div");

            controls.className =
                "window-controls";


            const minimize =
                this.createWindowButton(
                    "−",
                    "Minimieren"
                );

            const maximize =
                this.createWindowButton(
                    "□",
                    "Maximieren"
                );

            const close =
                this.createWindowButton(
                    "×",
                    "Schließen"
                );

            close.classList.add("close");


            controls.appendChild(
                minimize
            );

            controls.appendChild(
                maximize
            );

            controls.appendChild(
                close
            );


            header.appendChild(
                titleArea
            );

            header.appendChild(
                controls
            );


            const body =
                document.createElement("div");

            body.className =
                "window-content";

            if (
                content instanceof Node
            ) {

                body.appendChild(
                    content
                );

            } else {

                body.innerHTML =
                    String(content);

            }


            element.appendChild(
                header
            );

            element.appendChild(
                body
            );

            layer.appendChild(
                element
            );


            const record = {

                id,
                title,
                icon,
                element,
                header,
                body,

                minimize,
                maximize,
                close,

                size: requestedSize,

                minimized: false,
                maximized: false,

                destroy: () => {

                    this.closeWindow(id);

                }

            };


            this.windows.set(
                id,
                record
            );


            this.attachWindowEvents(
                record
            );


            minimize.addEventListener(
                "click",
                (event) => {

                    event.stopPropagation();

                    element
                        .classList
                        .add("minimized");

                    record.minimized = true;

                }
            );


            maximize.addEventListener(
                "click",
                (event) => {

                    event.stopPropagation();

                    record.maximized =
                        !record.maximized;

                    element
                        .classList
                        .toggle(
                            "window-maximized",
                            record.maximized
                        );

                    if (
                        record.maximized
                    ) {

                        element.classList
                            .remove(
                                "window-small",
                                "window-normal",
                                "window-large"
                            );

                    } else {

                        element.classList
                            .add(
                                "window-" +
                                record.size
                            );

                    }

                    this.focusWindow(id);

                }
            );


            close.addEventListener(
                "click",
                (event) => {

                    event.stopPropagation();

                    this.closeWindow(id);

                }
            );


            element.addEventListener(
                "pointerdown",
                () => {

                    this.focusWindow(id);

                }
            );


            this.focusWindow(id);


            if (
                typeof options.onOpen ===
                "function"
            ) {

                try {

                    options.onOpen(
                        record
                    );

                } catch (error) {

                    console.error(
                        "[HalDo] App open error:",
                        error
                    );

                }

            }


            return record;
        },


        createWindowButton(
            text,
            title
        ) {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "window-control";

            button.textContent =
                text;

            button.title =
                title;

            return button;
        },


        attachWindowEvents(
            record
        ) {

            const {
                element,
                header
            } = record;

            let dragging = false;

            let startX = 0;
            let startY = 0;

            let originalLeft = 0;
            let originalTop = 0;


            const startDrag = (
                clientX,
                clientY
            ) => {

                if (
                    record.maximized
                ) {
                    return;
                }

                const rect =
                    element.getBoundingClientRect();

                dragging = true;

                startX = clientX;
                startY = clientY;

                originalLeft =
                    rect.left;

                originalTop =
                    rect.top;

                element.style.transition =
                    "none";
            };


            const moveDrag = (
                clientX,
                clientY
            ) => {

                if (!dragging) {
                    return;
                }

                const deltaX =
                    clientX - startX;

                const deltaY =
                    clientY - startY;

                const workspace =
                    document.getElementById(
                        "haldo-workspace"
                    );

                if (!workspace) {
                    return;
                }

                const workspaceRect =
                    workspace.getBoundingClientRect();

                const rect =
                    element.getBoundingClientRect();

                let left =
                    originalLeft +
                    deltaX -
                    workspaceRect.left;

                let top =
                    originalTop +
                    deltaY -
                    workspaceRect.top;


                const maxLeft =
                    Math.max(
                        0,
                        workspaceRect.width -
                        rect.width
                    );

                const maxTop =
                    Math.max(
                        0,
                        workspaceRect.height -
                        rect.height
                    );


                left =
                    Math.max(
                        0,
                        Math.min(
                            left,
                            maxLeft
                        )
                    );

                top =
                    Math.max(
                        0,
                        Math.min(
                            top,
                            maxTop
                        )
                    );


                element.style.left =
                    left + "px";

                element.style.top =
                    top + "px";

                element.style.transform =
                    "none";
            };


            const endDrag = () => {

                if (!dragging) {
                    return;
                }

                dragging = false;

                element.style.transition =
                    "";

            };


            header.addEventListener(
                "pointerdown",
                (event) => {

                    if (
                        event.target.closest(
                            ".window-control"
                        )
                    ) {
                        return;
                    }

                    this.focusWindow(
                        record.id
                    );

                    startDrag(
                        event.clientX,
                        event.clientY
                    );

                    try {
                        header.setPointerCapture(
                            event.pointerId
                        );
                    } catch (_) {}

                }
            );


            header.addEventListener(
                "pointermove",
                (event) => {

                    moveDrag(
                        event.clientX,
                        event.clientY
                    );

                }
            );


            header.addEventListener(
                "pointerup",
                endDrag
            );

            header.addEventListener(
                "pointercancel",
                endDrag
            );

        },


        closeWindow(id) {

            const record =
                this.windows.get(id);

            if (!record) {
                return;
            }

            if (
                typeof record.onClose ===
                "function"
            ) {

                try {
                    record.onClose();
                } catch (_) {}

            }

            record.element.remove();

            this.windows.delete(id);

            if (
                this.activeWindow === id
            ) {

                this.activeWindow = null;

            }

        },


        setWindowSize(size) {

            const valid =
                [
                    "small",
                    "normal",
                    "large"
                ];

            if (
                !valid.includes(size)
            ) {
                size = "normal";
            }

            this.windowSize =
                size;

            for (
                const record
                of this.windows.values()
            ) {

                if (
                    record.maximized
                ) {
                    continue;
                }

                record.size =
                    size;

                record.element.classList
                    .remove(
                        "window-small",
                        "window-normal",
                        "window-large"
                    );

                record.element.classList
                    .add(
                        "window-" +
                        size
                    );

            }

            try {

                localStorage.setItem(
                    "haldo.window.size",
                    size
                );

            } catch (_) {}

        }

    };


    /* ============================================================
       APP REGISTRY BRIDGE
    ============================================================ */

    window.HalDoAppUI = {

        apps: [],

        normalizeApp(app) {

            if (!app) {
                return null;
            }

            const id =
                app.id ||
                app.appId ||
                app.name ||
                app.key;

            if (!id) {
                return null;
            }

            return {

                id: String(id),

                name:
                    app.name ||
                    app.title ||
                    String(id),

                title:
                    app.title ||
                    app.name ||
                    String(id),

                icon:
                    app.icon ||
                    app.emoji ||
                    "◈",

                description:
                    app.description ||
                    "",

                module:
                    app.module ||
                    app.path ||
                    app.script ||
                    null,

                category:
                    app.category ||
                    "System",

                raw:
                    app

            };

        },


        collectApps() {

            const sources = [];


            if (
                window.HalDoAppRegistry
            ) {

                const registry =
                    window.HalDoAppRegistry;


                if (
                    Array.isArray(
                        registry.apps
                    )
                ) {

                    sources.push(
                        ...registry.apps
                    );

                }


                if (
                    Array.isArray(
                        registry.registry
                    )
                ) {

                    sources.push(
                        ...registry.registry
                    );

                }


                if (
                    registry.apps &&
                    typeof registry.apps ===
                    "object" &&
                    !Array.isArray(
                        registry.apps
                    )
                ) {

                    sources.push(
                        ...Object.values(
                            registry.apps
                        )
                    );

                }

            }


            if (
                window.HalDoAppManifest
            ) {

                const manifest =
                    window.HalDoAppManifest;


                if (
                    Array.isArray(
                        manifest
                    )
                ) {

                    sources.push(
                        ...manifest
                    );

                }


                if (
                    Array.isArray(
                        manifest.apps
                    )
                ) {

                    sources.push(
                        ...manifest.apps
                    );

                }

            }


            if (
                window.HalDoV20AppManifest
            ) {

                const manifest =
                    window.HalDoV20AppManifest;


                if (
                    Array.isArray(
                        manifest.apps
                    )
                ) {

                    sources.push(
                        ...manifest.apps
                    );

                }

            }


            const unique =
                new Map();


            for (
                const source
                of sources
            ) {

                const app =
                    this.normalizeApp(
                        source
                    );

                if (!app) {
                    continue;
                }

                unique.set(
                    app.id,
                    app
                );

            }


            /*
             * These are core UI apps.
             * Existing registered apps are NOT
             * removed.
             */

            const coreApps = [

                {
                    id: "haldo-ai",
                    name: "HalDo AI",
                    title: "HalDo AI",
                    icon: "✦",
                    description:
                        "Intelligenter HalDo AI-Assistent"
                },

                {
                    id: "haldo-home",
                    name: "HalDo Home",
                    title: "HalDo Home",
                    icon: "⌂"
                },

                {
                    id: "haldo-settings",
                    name: "Einstellungen",
                    title: "HalDo Einstellungen",
                    icon: "⚙"
                },

                {
                    id: "ezidi-keyboard",
                    name: "Ezidi Tastatur",
                    title: "Ezidi Tastatur",
                    icon: "⌨"
                }

            ];


            for (
                const app
                of coreApps
            ) {

                if (
                    !unique.has(
                        app.id
                    )
                ) {

                    unique.set(
                        app.id,
                        app
                    );

                }

            }


            this.apps =
                Array.from(
                    unique.values()
                );

            HalDoUI.appDefinitions =
                this.apps;

            return this.apps;
        },


        render(filter = "") {

            const grid =
                document.getElementById(
                    "haldo-app-grid"
                );

            if (!grid) {
                return;
            }

            const normalized =
                String(filter)
                    .trim()
                    .toLowerCase();


            const apps =
                this.apps.filter(
                    app => {

                        if (!normalized) {
                            return true;
                        }

                        return (
                            app.name
                                .toLowerCase()
                                .includes(
                                    normalized
                                ) ||

                            app.title
                                .toLowerCase()
                                .includes(
                                    normalized
                                ) ||

                            app.category
                                .toLowerCase()
                                .includes(
                                    normalized
                                )
                        );

                    }
                );


            grid.innerHTML = "";


            if (!apps.length) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.style.padding =
                    "30px";

                empty.style.color =
                    "var(--haldo-muted)";

                empty.textContent =
                    "Keine App gefunden.";

                grid.appendChild(
                    empty
                );

                return;
            }


            for (
                const app
                of apps
            ) {

                const tile =
                    document.createElement(
                        "button"
                    );

                tile.type = "button";

                tile.className =
                    "app-tile";

                tile.dataset.appId =
                    app.id;


                const icon =
                    document.createElement(
                        "div"
                    );

                icon.className =
                    "app-icon";

                icon.textContent =
                    app.icon;


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "app-name";

                name.textContent =
                    app.name;


                tile.appendChild(
                    icon
                );

                tile.appendChild(
                    name
                );


                tile.addEventListener(
                    "click",
                    () => {

                        this.openApp(
                            app
                        );

                    }
                );


                grid.appendChild(
                    tile
                );

            }

        },


        openApp(app) {

            if (!app) {
                return;
            }


            HalDoUI.toggleLauncher(
                false
            );


            if (
                app.id ===
                "haldo-ai"
            ) {

                this.openHalDoAI();

                return;

            }


            if (
                app.id ===
                "haldo-home"
            ) {

                this.openHome();

                return;

            }


            if (
                app.id ===
                "haldo-settings"
            ) {

                this.openSettings();

                return;

            }


            if (
                app.id ===
                "ezidi-keyboard"
            ) {

                this.openEzidiKeyboard();

                return;

            }


            /*
             * First try the existing App Manager.
             */

            try {

                if (
                    window.HalDoAppManager
                ) {

                    const manager =
                        window.HalDoAppManager;


                    if (
                        typeof manager.launchApp ===
                        "function"
                    ) {

                        manager.launchApp(
                            app.id
                        );

                        return;

                    }


                    if (
                        typeof manager.openApp ===
                        "function"
                    ) {

                        manager.openApp(
                            app.id
                        );

                        return;

                    }


                    if (
                        typeof manager.startApp ===
                        "function"
                    ) {

                        manager.startApp(
                            app.id
                        );

                        return;

                    }

                }

            } catch (error) {

                console.warn(
                    "[HalDo] Existing App Manager could not open app:",
                    error
                );

            }


            /*
             * Try Router.
             */

            try {

                if (
                    window.HalDoAppRouter
                ) {

                    const router =
                        window.HalDoAppRouter;


                    if (
                        typeof router.navigate ===
                        "function"
                    ) {

                        router.navigate(
                            app.id
                        );

                        return;

                    }


                    if (
                        typeof router.open ===
                        "function"
                    ) {

                        router.open(
                            app.id
                        );

                        return;

                    }

                }

            } catch (error) {

                console.warn(
                    "[HalDo] Router could not open app:",
                    error
                );

            }


            /*
             * Generic functional application
             * window instead of a dead icon.
             */

            this.openGenericApp(
                app
            );

        },


        openHalDoAI() {

            const existing =
                HalDoUI.windows.get(
                    "haldo-ai-window"
                );

            if (existing) {

                existing.element
                    .classList
                    .remove(
                        "minimized"
                    );

                HalDoUI.focusWindow(
                    "haldo-ai-window"
                );

                return;

            }


            const container =
                document.createElement(
                    "div"
                );

            container.className =
                "ai-app";


            const welcome =
                document.createElement(

            const addMessage =

                    const message =

                    message.className =

                        type;

                    label.textContent =
                        type === "user"

                    const bubble =

                    bubble.className =

                    message.appendChild(
                        label

                    messages.appendChild(
                        message

                    messages.scrollTop =
                        messages.scrollHeight;

                };


            addMessage(
                "Ich bin bereit. Wie kann ich dir helfen?",
                "assistant"
            );


            const speak =
                (text) => {

                    if (
                        !(
                            "speechSynthesis"
                            in window
                        )
                    ) {
                        return;
                    }

                    try {

                        window.speechSynthesis
                            .cancel();


                        const utterance =
                            new SpeechSynthesisUtterance(
                                text
                            );

                        utterance.lang =
                            this.getSpeechLanguage();

                        utterance.rate =
                            0.95;

                        utterance.pitch =
                            1.0;

                        utterance.volume =
                            1.0;


                        const voices =
                            window.speechSynthesis
                                .getVoices();


                        const matching =
                            voices.find(
                                v =>
                                    v.lang
                                        .toLowerCase()
                                        .startsWith(
                                            utterance.lang
                                                .split("-")[0]
                                                .toLowerCase()
                                        )
                            );


                        if (matching) {
                            utterance.voice =
                                matching;
                        }


                        window.speechSynthesis
                            .speak(
                                utterance
                            );

                    } catch (error) {

                        console.warn(
                            "[HalDo] Speech error:",
                            error
                        );

                    }

                };


            const processMessage =
                async () => {

                    const text =
                        input.value.trim();

                    if (!text) {
                        return;
                    }


                    input.value = "";

                    addMessage(
                        text,
                        "user"
                    );


                    /*
                     * Existing HalDo AI engine first.
                     */

                    let answer = null;


                    try {

                        if (
                            window.HalDoAI
                        ) {

                            const ai =
                                window.HalDoAI;


                            if (
                                typeof ai.ask ===
                                "function"
                            ) {

                                answer =
                                    await ai.ask(
                                        text
                                    );

                            } else if (
                                typeof ai.chat ===
                                "function"
                            ) {

                                answer =
                                    await ai.chat(
                                        text
                                    );

                            } else if (
                                typeof ai.respond ===
                                "function"
                            ) {

                                answer =
                                    await ai.respond(
                                        text
                                    );

                            }

                        }

                    } catch (error) {

                        console.error(
                            "[HalDo AI] Existing engine error:",
                            error
                        );

                    }


                    /*
                     * Existing AI engine.
                     */

                    if (
                        answer == null
                    ) {

                        try {

                            if (
                                window.HalDoAIEngine
                            ) {

                                const engine =
                                    window.HalDoAIEngine;


                                if (
                                    typeof engine.generate ===
                                    "function"
                                ) {

                                    answer =
                                        await engine.generate(
                                            text
                                        );

                                } else if (
                                    typeof engine.process ===
                                    "function"
                                ) {

                                    answer =
                                        await engine.process(
                                            text
                                        );

                                }

                            }

                        } catch (error) {

                            console.error(
                                "[HalDo AI Engine] Error:",
                                error
                            );

                        }

                    }


                    if (
                        typeof answer ===
                        "object" &&
                        answer !== null
                    ) {

                        answer =
                            answer.text ||
                            answer.message ||
                            answer.content ||
                            JSON.stringify(
                                answer
                            );

                    }


                    /*
                     * Local fallback.
                     *
                     * This is deliberately not
                     * pretending to be a cloud LLM.
                     */

                    if (
                        answer == null ||
                        String(answer).trim() === ""
                    ) {

                        answer =
                            this.localAIResponse(
                                text
                            );

                    }


                    answer =
                        String(answer);


                    addMessage(
                        answer,
                        "assistant"
                    );


                    speak(
                        answer
                    );

                };


            send.addEventListener(
                "click",
                processMessage
            );


            input.addEventListener(
                "keydown",

                    if (
                        event.key === "Enter" &&

                }
            );

                }

        localAIResponse(text) {

            const normalized =
                text
                    .toLowerCase()
                    .trim();


            if (
                normalized.includes(
                    "hallo"
                ) ||
                normalized.includes(
                    "hi"
                ) ||
                normalized.includes(
                    "hey"
                )
            ) {

                return (
                    "Hallo! ❤️ Ich bin HalDo AI. "
                    +
                    "Was möchtest du machen?"
                );

            }


            if (
                normalized.includes(
                    "wer bist du"
                )
            ) {

                return (
                    "Ich bin HalDo AI, der intelligente "
                    +
                    "Assistent innerhalb von HalDo AI OS 20."
                );

            }


            if (
                normalized.includes(
                    "danke"
                )
            ) {

                return (
                    "Sehr gerne. ❤️"
                );

            }


            return (
                "Ich habe deine Nachricht erhalten: "
                +
                "\"" +
                text +
                "\"\n\n"
                +
                "Die Verbindung zum vollständigen "
                +
                "HalDo-AI-Backend kann über das vorhandene "
                +
                "AI-Core/AI-Engine-System erweitert werden."
            );

        },


        getSpeechLanguage() {

            try {

                const saved =
                    localStorage.getItem(
                        "haldo.language"
                    );

                if (saved) {

                    if (
                        saved === "de" ||
                        saved === "de-DE"
                    ) {
                        return "de-DE";
                    }

                    if (
                        saved === "en" ||
                        saved === "en-US"
                    ) {
                        return "en-US";
                    }

                    if (
                        saved === "ar" ||
                        saved === "ar-SA"
                    ) {
                        return "ar-SA";
                    }

                    if (
                        saved === "tr" ||
                        saved === "tr-TR"
                    ) {
                        return "tr-TR";
                    }

                }

            } catch (_) {}

            return "de-DE";

        },


        startSpeechRecognition(
            input,
            button
        ) {

            const Recognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;


            if (!Recognition) {

                alert(
                    "Die Spracheingabe wird von diesem Browser nicht unterstützt."
                );

                return;

            }


            if (
                this.activeRecognition
            ) {

                try {
                    this.activeRecognition.stop();
                } catch (_) {}

                this.activeRecognition =
                    null;

                button.classList
                    .remove(
                        "active"
                    );

                return;

            }


            const recognition =
                new Recognition();


            recognition.lang =
                this.getSpeechLanguage();

            recognition.continuous =
                false;

            recognition.interimResults =
                true;


            recognition.onstart =
                () => {

                    button.classList
                        .add(
                            "active"
                        );

                    button.textContent =
                        "⏹";

                };


            recognition.onresult =
                event => {

                    let transcript =
                        "";

                    for (
                        let i =
                            event.resultIndex;
                        i <
                            event.results.length;
                        i++
                    ) {

                        transcript +=
                            event.results[i][0]
                                .transcript;

                    }

                    input.value =
                        transcript;

                };


            recognition.onerror =
                error => {

                    console.warn(
                        "[HalDo] Recognition error:",
                        error
                    );

                };


            recognition.onend =
                () => {

                    button.classList
                        .remove(
                            "active"
                        );

                    button.textContent =
                        "🎙";

                    this.activeRecognition =
                        null;

                };


            this.activeRecognition =
                recognition;


            try {

                recognition.start();

            } catch (error) {

                console.warn(
                    "[HalDo] Could not start speech recognition:",
                    error
                );

            }

        },
