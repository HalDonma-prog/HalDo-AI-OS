        /*

        const HD =

        /*

        /*

        HD.config = {

        /*

        HD.system = {

            id:

            name:
                "HalDo AI OS",

            version:
                "22.0.0",

            codename:
                "Cosmic World",

            status:
                "online",

            mode:
                "desktop",

            initialized:
                true,

            startTime:
                Date.now(),

            getUptime:
                function() {

                    return (
                        Date.now() -
                        this.startTime
                    );

                },

            getStatus:
                function() {

                    return this.status;

                },

            setStatus:
                function(status) {

                    this.status =
                        status;

                    HD.state.status =
                        status;

                    if (
                        typeof HD.emit ===
                        "function"
                    ) {

                        HD.emit(
                            "system:status",
                            {
                                status
                            }
                        );

                    }

                }

        /*

        HD.device = {

            type:

            touch:

                ) ||

            online:
                navigator.onLine,

            standalone:
                (
                    window.matchMedia &&
                    window.matchMedia(
                        "(display-mode: standalone)"
                    ).matches
                ),

            update:
                function() {

                    this.width =
                        window.innerWidth;

                    this.height =
                        window.innerHeight;

                    this.pixelRatio =
                        window.devicePixelRatio || 1;

                    this.touch =
                        (
                            "ontouchstart" in window
                        ) ||
                        navigator.maxTouchPoints > 0;

                    this.online =
                        navigator.onLine;

                    this.standalone =
                        (
                            window.matchMedia &&
                            window.matchMedia(
                                "(display-mode: standalone)"
                            ).matches
                        );


                    if (
                        this.width < 600
                    ) {

                        this.type =
                            "mobile";

                    }

                    else if (
                        this.width < 1000
                    ) {

                        this.type =
                            "tablet";

                    }

                    else {

                        this.type =
                            "desktop";

                    }

                }

        };


        HD.device.update();


        /*
         * ========================================================
         * GLOBAL ERROR HANDLING
         * ========================================================
         */

        HD.errors = {

            history:
                [],

            report:
                function(
                    error,
                    source = "unknown"
                ) {

                    const entry = {

                        source,

                        message:
                            error &&
                            error.message
                                ? error.message
                                : String(error),

                        time:
                            Date.now()

                    };


                    this.history.push(
                        entry
                    );


                    console.error(
                        "[HalDo]",
                        source,
                        error
                    );


                    if (
                        typeof HD.emit ===
                        "function"
                    ) {

                        HD.emit(
                            "system:error",
                            entry
                        );

                    }

                }

        };


        /*
         * ========================================================
         * GLOBAL WINDOW EVENTS
         * ========================================================
         */

        window.addEventListener(
            "online",
            function() {

                HD.online =
                    true;

                HD.device.online =
                    true;


                HD.system.setStatus(
                    "online"
                );


                if (
                    typeof HD.emit ===
                    "function"
                ) {

                    HD.emit(
                        "network:online"
                    );

                }

            }
        );


        window.addEventListener(
            "offline",
            function() {

                HD.online =
                    false;

                HD.device.online =
                    false;


                HD.system.setStatus(
                    "offline"
                );


                if (
                    typeof HD.emit ===
                    "function"
                ) {

                    HD.emit(
                        "network:offline"
                    );

                }

            }
        );


        window.addEventListener(
            "resize",
            function() {

                HD.device.update();

                if (
                    typeof HD.emit ===
                    "function"
                ) {

                    HD.emit(
                        "device:resize",
                        {
                            width:
                                HD.device.width,

                            height:
                                HD.device.height,

                            type:
                                HD.device.type
                        }
                    );

                }

            }
        );


        /*
         * ========================================================
         * PAGE VISIBILITY
         * ========================================================
         */

        document.addEventListener(
            "visibilitychange",
            function() {

                const visible =
                    document.visibilityState ===
                    "visible";


                if (
                    typeof HD.emit ===
                    "function"
                ) {

                    HD.emit(
                        visible
                            ? "system:visible"
                            : "system:hidden"
                    );

                }

            }
        );


        /*
         * ========================================================
         * DEBUG / BUILD INFORMATION
         * ========================================================
         */

        HD.buildInfo = {

            product:
                "HalDo AI OS 22",

            version:
                "22.0.0",

            codename:
                "Cosmic World",

            architecture:
                "Integrated Modular AI Operating System",

            shell:
                "index.html",

            generated:
                "HalDo Master Architecture",

            status:
                "START · ONLINE"

        };

    </script>

    <script>

        HD.pwa = {

            enabled:
                true,

            supported:
                "serviceWorker" in navigator,

            installed:
                false,

            standalone:
                HD.device.standalone,

            registration:
                null,

            status:
                "online",

            updateAvailable:
                false,

            offline:
                !navigator.onLine,


            setStatus:
                function(
                    status
                ) {

                    this.status =
                        status;

                    HD.emit(
                        "pwa:status",
                        {
                            status
                        }
                    );

                },


            check:
                function()
                {

                    this.offline =
                        !navigator.onLine;

                    this.standalone =
                        (
                            window.matchMedia &&
                            window.matchMedia(
                                "(display-mode: standalone)"
                            ).matches
                        );

                    this.setStatus(
                        this.offline
                            ? "offline"
                            : "online"
                    );

                },


            registerServiceWorker:
                async function()
                {

                    if (
                        !this.supported
                    ) {

                        return null;

                    }

                    /*
                     * Die tatsächliche Registrierung wird
                     * in der finalen PWA-Systemintegration
                     * ausgeführt.
                     */

                    return null;

                }

        };


        HD.pwa.check();

    </script>

    <script>

        "use strict";


        /*
         * ========================================================
         * NETWORK FOUNDATION
         * ========================================================
         */

        HD.network =
            HD.network ||
            {};


        HD.network.online =
            navigator.onLine;


        HD.network.status =
            navigator.onLine
                ? "online"
                : "offline";


        HD.network.updatedAt =
            Date.now();


        HD.network.update =
            function(
                online
            ) {

                this.online =
                    Boolean(
                        online
                    );

                this.status =
                    this.online
                        ? "online"
                        : "offline";

                this.updatedAt =
                    Date.now();


                HD.online =
                    this.online;


                if (
                    HD.device
                ) {

                    HD.device.online =
                        this.online;

                }


                HD.emit(
                    "network:status",
                    {
                        online:
                            this.online,

                        status:
                            this.status,

                        time:
                            this.updatedAt
                    }
                );


                return this.status;

            };


        HD.network.isOnline =
            function() {

                return Boolean(
                    this.online
                );

            };


        /*
         * ========================================================
         * NETWORK EVENTS
         * ========================================================
         */

        window.addEventListener(
            "online",
            function() {

                HD.network.update(
                    true
                );

            }
        );


        window.addEventListener(
            "offline",
            function() {

                HD.network.update(
                    false
                );

            }
        );


        /*
         * ========================================================
         * RUNTIME FOUNDATION
         * ========================================================
         */

        HD.runtime =
            HD.runtime ||
            {};


        HD.runtime.initialized =
            Boolean(
                HD.runtime.initialized
            );


        HD.runtime.started =
            Boolean(
                HD.runtime.started
            );


        HD.runtime.startedAt =
            HD.runtime.startedAt ||
            null;


        HD.runtime.modules =
            HD.runtime.modules ||
            new Map();


        HD.runtime.register =
            function(
                name,
                module
            ) {

                const id =
                    String(
                        name || ""
                    )
                        .trim()
                        .toLowerCase();


                if (
                    !id ||
                    !module
                ) {

                    return false;

                }


                this.modules.set(
                    id,
                    module
                );


                HD.emit(
                    "runtime:module-registered",
                    {
                        name:
                            id,

                        module
                    }
                );


                return true;

            };


        HD.runtime.get =
            function(
                name
            ) {

                const id =
                    String(
                        name || ""
                    )
                        .trim()
                        .toLowerCase();


                return (
                    this.modules.get(
                        id
                    ) ||
                    null
                );

            };


        HD.runtime.has =
            function(
                name
            ) {

                const id =
                    String(
                        name || ""
                    )
                        .trim()
                        .toLowerCase();


                return this.modules.has(
                    id
                );

            };


        HD.runtime.list =
            function() {

                return Array.from(
                    this.modules.keys()
                );

            };


        HD.runtime.unregister =
            function(
                name
            ) {

                const id =
                    String(
                        name || ""
                    )
                        .trim()
                        .toLowerCase();


                return this.modules.delete(
                    id
                );

            };


        HD.runtime.start =
            async function() {

                if (
                    this.started
                ) {

                    return true;

                }


                this.startedAt =
                    Date.now();


                HD.emit(
                    "runtime:start"
                );


                this.initialized =
                    true;


                this.started =
                    true;


                HD.emit(
                    "runtime:started",
                    {
                        startedAt:
                            this.startedAt
                    }
                );


                return true;

            };


        HD.runtime.stop =
            async function() {

                if (
                    !this.started
                ) {

                    return true;

                }


                this.started =
                    false;


                this.initialized =
                    false;


                HD.emit(
                    "runtime:stopped"
                );


                return true;

            };


        /*
         * ========================================================
         * RUNTIME SYSTEM REGISTRATION
         * ========================================================
         */

        HD.runtime.register(
            "core",
            {
                name:
                    "HalDo Core",

                version:
                    HD.config.version,

                initialized:
                    true
            }
        );


        /*
         * ========================================================
         * SYSTEM STATE FOUNDATION
         * ========================================================
         */

        HD.systemState =
            HD.systemState ||
            {};


        HD.systemState.bootStage =
            HD.systemState.bootStage ||
            "foundation";


        HD.systemState.online =
            navigator.onLine;


        HD.systemState.ready =
            false;


        HD.systemState.updatedAt =
            Date.now();


        HD.systemState.error =
            null;


        HD.systemState.setStage =
            function(
                stage
            ) {

                this.bootStage =
                    String(
                        stage ||
                        "unknown"
                    );


                this.updatedAt =
                    Date.now();


                HD.emit(
                    "system:boot-stage",
                    {
                        stage:
                            this.bootStage,

                        time:
                            this.updatedAt
                    }
                );


                return this.bootStage;

            };


        HD.systemState.setReady =
            function(
                ready = true
            ) {

                this.ready =
                    Boolean(

/* =========================================================
   COSMIC PLANET POSITION
   ========================================================= */

HD.cosmic.updatePlanetPositions =
    function(
        timestamp
    ) {

        const width =
            window.innerWidth;


        const height =
            window.innerHeight;


        const centerX =
            width /
            2;


        const centerY =
            height /
            2;


        const base =
            Math.min(
                width,
                height
            );


        this.planets.forEach(
            planet => {

                const definition =
                    planet.definition;


                planet.angle +=
                    definition.speed *
                    16;


                const radius =
                    base *
                    (
                        0.08 +
                        definition.orbit *
                        0.045
                    );


                if (
                    definition.moon
                ) {

                    const earth =
                        this.planets.find(
                            item =>
                                item.definition.id ===
                                "earth"
                        );


                    if (
                        earth
                    ) {

                        const earthRadius =
                            base *
                            (
                                0.08 +
                                3 *
                                0.045
                            );


                        const earthX =
                            centerX +
                            Math.cos(
                                earth.angle
                            ) *
                            earthRadius;


                        const earthY =
                            centerY +
                            Math.sin(
                                earth.angle
                            ) *
                            earthRadius;


                        const moonRadius =
                            24;


                        planet.element.style.transform =
                            "translate(-50%,-50%) translate(" +
                            (
                                earthX +
                                Math.cos(
                                    planet.angle * 12
                                ) *
                                moonRadius
                            ) +
                            "px," +
                            (
                                earthY +
                                Math.sin(
                                    planet.angle * 12
                                ) *
                                moonRadius
                            ) +
                            "px)";


                        return;

                    }

                }


                const x =
                    centerX +
                    Math.cos(
                        planet.angle
                    ) *
                    radius;


                const y =
                    centerY +
                    Math.sin(
                        planet.angle
                    ) *
                    radius;


                planet.element.style.left =
                    x +
                    "px";


                planet.element.style.top =
                    y +
                    "px";


                planet.element.style.transform =
                    "translate(-50%,-50%)";

            }
        );

    };


/* =========================================================
   COSMIC ANIMATION
   ========================================================= */

HD.cosmic.animate =
    function(
        timestamp
    ) {

        if (
            !this.running
        ) {

            return;

        }


        this.updatePlanetPositions(
            timestamp
        );


        this.animationFrame =
            requestAnimationFrame(
                time =>
                    this.animate(
                        time
                    )
            );

    };


/* =========================================================
   COSMIC START
   ========================================================= */

HD.cosmic.start =
    function() {

        if (
            this.running
        ) {

            return true;

        }


        this.initialized =
            true;


        this.running =
            true;


        this.startedAt =
            Date.now();


        this.createStars();


        this.createOrbits();


        this.createPlanets();


        this.animationFrame =
            requestAnimationFrame(
                time =>
                    this.animate(
                        time
                    )
            );


        HD.emit(
            "cosmic:started",
            {
                planets:
                    this.planets.length,

                stars:
                    this.stars.length
            }
        );


        return true;

    };


/* =========================================================
   COSMIC STOP
   ========================================================= */

HD.cosmic.stop =
    function() {

        this.running =
            false;


        if (
            this.animationFrame
        ) {

            cancelAnimationFrame(
                this.animationFrame
            );


            this.animationFrame =
                null;

        }


        HD.emit(
            "cosmic:stopped"
        );


        return true;

    };


/* =========================================================
   COSMIC RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (
            HD.cosmic.running
        ) {

            HD.cosmic.updatePlanetPositions(
                performance.now()
            );

        }

    }
);


/* =========================================================
   COSMIC FOUNDATION READY
   ========================================================= */

HD.emit(
    "cosmic:foundation-ready",
    {
        planets:
            HD.cosmic.planetDefinitions.length,

        stars:
            HD.cosmic.starCount
    }
);

</script>

        )
        .trim()
        .toLowerCase();

    if (
        !id ||
        !module
    ) {

            false,

    }

/* =========================================================
   STORAGE FOUNDATION
   ========================================================= */

HD6.storage =
    HD6.storage ||
    {};


HD6.storage.prefix =
    HD6.storage.prefix ||
    (
        HD6.constants &&
        HD6.constants.storagePrefix
            ? HD6.constants.storagePrefix
            : "haldo-ai-os-22:"
    );


HD6.storage.available =
    false;


HD6.storage.memory =
    HD6.storage.memory ||
    new Map();


HD6.storage.check =
function() {

    try {

        const testKey =
            this.prefix +
            "__test__";


        localStorage.setItem(
            testKey,
            "ok"
        );


        const value =
            localStorage.getItem(
                testKey
            );


        localStorage.removeItem(
            testKey
        );


        this.available =
            value === "ok";


    }
    catch(error) {

        this.available =
            false;


        console.warn(
            "[HalDo Storage] localStorage nicht verfügbar:",
            error
        );

    }


    return this.available;

};


HD6.storage.check();


/* =========================================================
   STORAGE KEY
   ========================================================= */

HD6.storage.key =
function(
    key
) {

    return (
        this.prefix +
        String(
            key || ""
        )
    );

};


/* =========================================================
   STORAGE SET
   ========================================================= */

HD6.storage.set =
function(
    key,
    value
) {

    if (
        !key
    ) {

        return false;

    }


    const id =
        String(
            key
        );


    this.memory.set(
        id,
        value
    );


    if (
        !this.available
    ) {

        return false;

    }


    try {

        localStorage.setItem(
            this.key(
                id
            ),
            JSON.stringify(
                value
            )
        );


        HD6.emit(
            "storage:set",
            {

                key:
                    id,

                value

            }
        );


        return true;

    }
    catch(error) {

        console.warn(
            "[HalDo Storage] Set failed:",
            error
        );


        return false;

    }

};


/* =========================================================
   STORAGE GET
   ========================================================= */

HD6.storage.get =
function(
    key,
    fallback = null
) {

    if (
        !key
    ) {

        return fallback;

    }


    const id =
        String(
            key
        );


    if (
        !this.available
    ) {

        return this.memory.has(
            id
        )
            ? this.memory.get(
                id
            )
            : fallback;

    }


    try {

        const raw =
            localStorage.getItem(
                this.key(
                    id
                )
            );


        if (
            raw === null
        ) {

            return this.memory.has(
                id
            )
                ? this.memory.get(
                    id
                )
                : fallback;

        }


        const value =
            JSON.parse(
                raw
            );


        this.memory.set(
            id,
            value
        );


        return value;

    }
    catch(error) {

        console.warn(
            "[HalDo Storage] Get failed:",
            error
        );


        return this.memory.has(
            id
        )
            ? this.memory.get(
                id
            )
            : fallback;

    }

};


/* =========================================================
   STORAGE REMOVE
   ========================================================= */

HD6.storage.remove =
function(
    key
) {

    if (
        !key
    ) {

        return false;

    }


    const id =
        String(
            key
        );


    this.memory.delete(
        id
    );


    if (
        this.available
    ) {

        try {

            localStorage.removeItem(
                this.key(
                    id
                )
            );

        }
        catch(error) {

            console.warn(
                "[HalDo Storage] Remove failed:",
                error
            );

        }

    }


    HD6.emit(
        "storage:removed",
        {

            key:
                id

        }
    );


    return true;

};


/* =========================================================
   STORAGE HAS
   ========================================================= */

HD6.storage.has =
function(
    key
) {

    if (
        !key
    ) {

        return false;

    }


    const id =
        String(
            key
        );


    if (
        this.memory.has(
            id
        )
    ) {

        return true;

    }


    if (
        !this.available
    ) {

        return false;

    }


    try {

        return (
            localStorage.getItem(
                this.key(
                    id
                )
            ) !== null
        );

    }
    catch(error) {

        return false;

    }

};


/* =========================================================
   STORAGE CLEAR HALDO DATA
   ========================================================= */

HD6.storage.clear =
function() {

    this.memory.clear();


    if (
        !this.available
    ) {

        return true;

    }


    try {

        const keys = [];


        for (
            let index = 0;
            index <
            localStorage.length;
            index++
        ) {

            const key =
                localStorage.key(
                    index
                );


            if (
                key &&
                key.startsWith(
                    this.prefix
                )
            ) {

                keys.push(
                    key
                );

            }

        }


        keys.forEach(
            key => {

                localStorage.removeItem(
                    key
                );

            }
        );


        HD6.emit(
            "storage:cleared"
        );


        return true;

    }
    catch(error) {

        console.warn(
            "[HalDo Storage] Clear failed:",
            error
        );


        return false;

    }

};


/* =========================================================
   STORAGE LIST
   ========================================================= */

HD6.storage.list =
function() {

    const result =
        new Set(
            this.memory.keys()
        );


    if (
        this.available
    ) {

        try {

            for (
                let index = 0;
                index <
                localStorage.length;
                index++
            ) {

                const key =
                    localStorage.key(
                        index
                    );


                if (
                    key &&
                    key.startsWith(
                        this.prefix
                    )
                ) {

                    result.add(
                        key.slice(
                            this.prefix.length
                        )
                    );

                }

            }

        }
        catch(error) {

            console.warn(
                "[HalDo Storage] List failed:",
                error
            );

        }

    }


    return Array.from(
        result
    );

};


/* =========================================================
   STORAGE MANAGER
   ========================================================= */

HD6.storage.manager =
HD6.storage.manager ||
{};


HD6.storage.manager.saveState =
function() {

    return HD6.storage.set(
        "system-state",
        {

            state:
                HD6.state,

            system:
                HD6.system,

            savedAt:
                Date.now()

        }
    );

};


HD6.storage.manager.loadState =
function() {

    const data =
        HD6.storage.get(
            "system-state",
            null
        );


    if (
        !data
    ) {

        return false;

    }


    if (
        data.state &&
        typeof data.state ===
        "object"
    ) {

        Object.assign(
            HD6.state,
            data.state
        );

    }


    if (
        data.system &&
        typeof data.system ===
        "object"
    ) {

        Object.assign(
            HD6.system,
            data.system
        );

    }


    HD6.emit(
        "storage:state-loaded",
        data
    );


    return true;

};


/* =========================================================
   CONFIGURATION STORAGE
   ========================================================= */

HD6.configStorage =
HD6.configStorage ||
{};


HD6.configStorage.save =
function() {

    return HD6.storage.set(
        "configuration",
        {

            config:
                HD6.config,

            savedAt:
                Date.now()

        }
    );

};


HD6.configStorage.load =
function() {

    const data =
        HD6.storage.get(
            "configuration",
            null
        );


    if (
        !data ||
        !data.config
    ) {

        return false;

    }


    Object.assign(
        HD6.config,
        data.config
    );


    HD6.emit(
        "config:loaded",
        HD6.config
    );


    return true;

};


/* =========================================================
   USER PREFERENCES
   ========================================================= */

HD6.preferences =
HD6.preferences ||
{};


HD6.preferences.defaults =
{

    language:
        "de",

    theme:
        "cosmic",

    sound:
        true,

    voice:
        true,

    speech:
        true,

    animations:
        true,

    notifications:
        true,

    reducedMotion:
        false

};


HD6.preferences.values =
HD6.preferences.values ||
{};


Object.keys(
    HD6.preferences.defaults
)
.forEach(
    key => {

        if (
            HD6.preferences.values[
                key
            ] === undefined
        ) {

            const stored =
                HD6.storage.get(
                    "preference:" +
                    key,
                    undefined
                );


            HD6.preferences.values[
                key
            ] =
                stored === undefined
                    ? HD6.preferences.defaults[
                        key
                    ]
                    : stored;

        }

    }
);


HD6.preferences.get =
function(
    key,
    fallback = null
) {

    if (
        Object.prototype.hasOwnProperty.call(
            this.values,
            key
        )
    ) {

        return this.values[
            key
        ];

    }


    return fallback;

};


HD6.preferences.set =
function(
    key,
    value
) {

    if (
        !key
    ) {

        return false;

    }


    this.values[
        key
    ] =
        value;


    HD6.storage.set(
        "preference:" +
        key,
        value
    );


    HD6.emit(
        "preference:changed",
        {

            key,

            value

        }
    );


    return true;

};


/* =========================================================
   THEME FOUNDATION
   ========================================================= */

HD6.theme =
HD6.theme ||
{};


HD6.theme.current =
HD6.preferences.get(
    "theme",
    "cosmic"
);


HD6.theme.available =
[
    "cosmic",
    "dark",
    "light",
    "midnight"
];


HD6.theme.isAvailable =
function(
    theme
) {

    return this.available.includes(
        String(
            theme
        )
    );

};


HD6.theme.apply =
function(
    theme
) {

    const value =
        String(
            theme || ""
        )
        .trim()
        .toLowerCase();


    if (
        !this.isAvailable(
            value
        )
    ) {

        return false;

    }


    this.current =
        value;


    HD6.state.theme =
        value;


    document.documentElement
        .setAttribute(
            "data-haldo-theme",
            value
        );


    HD6.preferences.set(
        "theme",
        value
    );


    HD6.emit(
        "theme:changed",
        {

            theme:
                value

        }
    );


    return true;

};


/* =========================================================
   LANGUAGE FOUNDATION
   ========================================================= */

HD6.language =
HD6.language ||
{};


HD6.language.current =
HD6.preferences.get(
    "language",
    "de"
);


HD6.language.available =
[
    "de",
    "en",
    "ku",
    "ar",
    "tr",
    "fr",
    "es"
];


HD6.language.isAvailable =
function(
    language
) {

    return this.available.includes(
        String(
            language
        )
    );

};


HD6.language.set =
function(
    language
) {

    const value =
        String(
            language || ""
        )
        .trim()
        .toLowerCase();


    if (
        !this.isAvailable(
            value
        )
    ) {

        return false;

    }


    this.current =
        value;


    HD6.state.language =
        value;


    document.documentElement
        .setAttribute(
            "lang",
            value
        );


    HD6.preferences.set(
        "language",
        value
    );


    HD6.emit(
        "language:changed",
        {

            language:
                value

        }
    );


    return true;

};


/* =========================================================
   STORAGE DIAGNOSTIC
   ========================================================= */

HD6.storage.diagnostic =
function() {

    return {

        available:
            this.available,

        prefix:
            this.prefix,

        keys:
            this.list(),

        memoryEntries:
            this.memory.size,

        timestamp:
            Date.now()

    };

};


HD6.emit(
    "storage:foundation-ready",
    HD6.storage.diagnostic()
);


/* =========================================================
   APPLY INITIAL PREFERENCES
   ========================================================= */

HD6.theme.apply(
    HD6.theme.current
);


HD6.language.set(
    HD6.language.current
);

</script>

<script>

"use strict";

const HD7 =
    window.HalDo ||
    window.HD ||
    {};

HD7.aiChat =
    HD7.aiChat ||
    {};


/* =========================================================
   AI CHAT STATE
   ========================================================= */

HD7.aiChat.state =
    HD7.aiChat.state ||
    {

        open:
            false,

        initialized:
            false,

        processing:
            false,

        messages:
            [],

        conversationId:
            null,

        messagesElement:
            null,

        input:
            null,

        sendButton:
            null,

        typingElement:
            null,

        statusElement:
            null,

        windowElement:
            null

    };


/* =========================================================
   CHAT EVENT BRIDGE
   ========================================================= */

HD7.aiChat.emit =
function(
    event,
    payload
) {

    try {

        if (
            typeof HD7.emit ===
            "function"
        ) {

            HD7.emit(
                event,
                payload
            );

        }

    }
    catch(error) {

        console.warn(
            "[HalDo AI Chat] Event failed:",
            error
        );

    }

};


/* =========================================================
   CHAT WINDOW CREATION
   ========================================================= */

HD7.aiChat.create =
function() {

    if (
        this.state.windowElement &&
        document.body.contains(
            this.state.windowElement
        )
    ) {

        return this.state.windowElement;

    }


    const existing =
        document.getElementById(
            "haldo-ai-chat-window"
        );


    if (existing) {

        this.state.windowElement =
            existing;

        this.cacheElements();

        return existing;

    }


    const windowElement =
        document.createElement(
            "section"
        );


    windowElement.id =
        "haldo-ai-chat-window";

    windowElement.className =
        "haldo-ai-chat-window";

    windowElement.setAttribute(
        "role",
        "dialog"
    );

    windowElement.setAttribute(
        "aria-label",
        "HalDo AI Chat"
    );


    windowElement.innerHTML = `

        <div
            class="haldo-ai-chat-header"
        >

            <div
                class="haldo-ai-chat-identity"
            >

                <div
                    class="haldo-ai-chat-avatar"
                >

                    <img
                        src="logo.png"
                        alt="HalDo AI"
                    >

                </div>

                <div
                    class="haldo-ai-chat-title-area"
                >

                    <div
                        class="haldo-ai-chat-title"
                    >
                        HalDo AI
                    </div>

                    <div
                        class="haldo-ai-chat-status"
                        data-ai-status
                    >
                        bereit
                    </div>

                </div>

            </div>


            <div
                class="haldo-ai-chat-actions"
            >

                <button
                    type="button"
                    data-ai-action="new"
                    aria-label="Neuer Chat"
                    title="Neuer Chat"
                >
                    +
                </button>

                <button
                    type="button"
                    data-ai-action="clear"
                    aria-label="Chat löschen"
                    title="Chat löschen"
                >
                    ×
                </button>

                <button
                    type="button"
                    data-ai-action="close"
                    aria-label="Chat schließen"
                    title="Chat schließen"
                >
                    −
                </button>

            </div>

        </div>


        <div
            class="haldo-ai-chat-messages"
            data-ai-messages
        >

            <div
                class="haldo-ai-empty"
                data-ai-empty
            >

                <div
                    class="haldo-ai-empty-inner"
                >

                    <img
                        class="haldo-ai-empty-logo"
                        src="logo.png"
                        alt="HalDo"
                    >

                    <div
                        class="haldo-ai-empty-title"
                    >
                        Hallo, ich bin HalDo AI.
                    </div>

                    <div
                        class="haldo-ai-empty-text"
                    >
                        Wie kann ich dir helfen?
                    </div>

                </div>

            </div>

        </div>


        <div
            class="haldo-ai-chat-composer"
        >

            <button
                type="button"
                class="haldo-ai-voice-button"
                data-ai-action="voice"
                aria-label="Spracheingabe"
                title="Spracheingabe"
            >
                🎙
            </button>


            <textarea
                class="haldo-ai-input"
                data-ai-input
                rows="1"
                maxlength="12000"
                placeholder="Schreib HalDo AI..."
                aria-label="Nachricht an HalDo AI"
            ></textarea>


            <button
                type="button"
                class="haldo-ai-send-button"
                data-ai-action="send"
                aria-label="Nachricht senden"
                title="Nachricht senden"
            >
                ➤
            </button>

        </div>

    `;


    const root =
        document.getElementById(
            "haldo-window-root"
        ) ||
        document.getElementById(
            "haldo-ui"
        ) ||
        document.body;


    root.appendChild(
        windowElement
    );


    this.state.windowElement =
        windowElement;


    this.cacheElements();

    this.bindEvents();

    this.state.initialized =
        true;


    this.emit(
        "ai:chat-created",
        {
            element:
                windowElement
        }
    );


    return windowElement;

};


/* =========================================================
   CACHE ELEMENTS
   ========================================================= */

HD7.aiChat.cacheElements =
function() {

    const root =
        this.state.windowElement ||
        document;


    this.state.messagesElement =
        root.querySelector(
            "[data-ai-messages]"
        );


    this.state.input =
        root.querySelector(
            "[data-ai-input]"
        );


    this.state.sendButton =
        root.querySelector(
            '[data-ai-action="send"]'
        );


    this.state.statusElement =
        root.querySelector(
            "[data-ai-status]"
        );

};


/* =========================================================
   EVENT BINDING
   ========================================================= */

HD7.aiChat.bindEvents =
function() {

    const root =
        this.state.windowElement;


    if (!root) {

        return;

    }


    if (
        root.dataset.aiBound ===
        "true"
    ) {

        return;

    }


    root.dataset.aiBound =
        "true";


    root.addEventListener(
        "click",
        event => {

            const button =
                event.target.closest(
                    "[data-ai-action]"
                );


            if (!button) {

                return;

            }


            const action =
                button.getAttribute(
                    "data-ai-action"
                );


            if (
                action ===
                "send"
            ) {

                this.send();

            }

            else if (
                action ===
                "close"
            ) {

                this.close();

            }

            else if (
                action ===
                "clear"
            ) {

                this.clear();

            }

            else if (
                action ===
                "new"
            ) {

                this.clear();

                this.open();

            }

            else if (
                action ===
                "voice"
            ) {

                this.startVoice();

            }

        }
    );


    if (
        this.state.input
    ) {

        this.state.input.addEventListener(
            "input",
            () => {

                this.autoResize();

            }
        );


        this.state.input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    this.send();

                }

            }
        );

    }


    this.emit(
        "ai:chat-events-bound"
    );

};


/* =========================================================
   OPEN CHAT
   ========================================================= */

HD7.aiChat.open =
function() {

    if (
        !this.state.windowElement
    ) {

        this.create();

    }


    const element =
        this.state.windowElement;


    if (!element) {

        return false;

    }


    element.classList.add(
        "is-open"
    );


    element.setAttribute(
        "aria-hidden",
        "false"
    );


    this.state.open =
        true;


    this.setStatus(
        "bereit"
    );


    if (
        this.state.input
    ) {

        setTimeout(
            () => {

                try {

                    this.state.input.focus();

                }
                catch(error) {}

            },
            50
        );

    }


    this.emit(
        "ai:chat-opened"
    );


    return true;

};


/* =========================================================
   CLOSE CHAT
   ========================================================= */

HD7.aiChat.close =
function() {

    const element =
        this.state.windowElement;


    if (!element) {

        return false;

    }


    element.classList.remove(
        "is-open"
    );


    element.setAttribute(
        "aria-hidden",
        "true"
    );


    this.state.open =
        false;


    this.emit(
        "ai:chat-closed"
    );


    return true;

};


/* =========================================================
   TOGGLE CHAT
   ========================================================= */

HD7.aiChat.toggle =
function() {

    return this.state.open
        ? this.close()
        : this.open();

};


/* =========================================================
   STATUS
   ========================================================= */

HD7.aiChat.setStatus =
function(
    status
) {

    if (
        this.state.statusElement
    ) {

        this.state.statusElement.textContent =
            String(
                status ||
                ""
            );

    }


    this.emit(
        "ai:chat-status",
        {
            status:
                String(
                    status ||
                    ""
                )
        }
    );

};


/* =========================================================
   AUTO RESIZE
   ========================================================= */

HD7.aiChat.autoResize =
function() {

    const input =
        this.state.input;


    if (!input) {

        return;

    }


    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) +
        "px";

};


/* =========================================================
   SCROLL TO BOTTOM
   ========================================================= */

HD7.aiChat.scrollToBottom =
function() {

    if (
        !this.state.messagesElement
    ) {

        return;

    }


    requestAnimationFrame(
        () => {

            this.state.messagesElement.scrollTop =
                this.state.messagesElement.scrollHeight;

        }
    );

};


/* =========================================================
   ADD MESSAGE
   ========================================================= */

HD7.aiChat.addMessage =
function(
    role,
    text
) {

    const message =
    {

        id:
            "msg-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2),

        role:
            role === "user"
                ? "user"
                : "assistant",

        text:
            String(
                text ||
                ""
            ),

        createdAt:
            new Date()
                .toISOString()

    };


    this.state.messages.push(
        message
    );


    const container =
        this.state.messagesElement;


    if (!container) {

        return message;

    }


    const empty =
        container.querySelector(
            "[data-ai-empty]"
        );


    if (empty) {

        empty.remove();

    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "haldo-ai-message " +
        (
            message.role === "user"
                ? "user"
                : "assistant"
        );


    const avatar =

/* =========================================================
   COSMIC ANIMATION
   ========================================================= */

HD9.cosmic.animate =
function(
    timestamp
) {

    if (
        !this.state.running
    ) {

        return;

    }


    const previous =
        this.state.lastFrame ||
        timestamp;


    const delta =
        Math.min(
            50,
            timestamp -
            previous
        );


    this.state.lastFrame =
        timestamp;


    this.state.rotation +=
        delta *
        this.config.rotationSpeed;


    this.state.planets.forEach(
        planet => {

            planet.angle +=
                delta *
                0.00018 *
                planet.data.speed;


            const angle =
                planet.angle;


            const radiusX =
                (
                    planet.data.distance *
                    window.innerWidth /
                    100
                );


            const radiusY =
                radiusX *
                0.575;


            const x =
                Math.cos(angle) *
                radiusX;


            const y =
                Math.sin(angle) *
                radiusY;


            planet.orbit.style.transform =
                "translate3d(" +
                x +
                "px," +
                y +
                "px,0)";

        }
    );


    this.state.animationFrame =
        requestAnimationFrame(
            this.animate.bind(
                this
            )
        );

};

   START COSMIC WORLD
   ========================================================= */

HD9.cosmic.start =
function() {

    if (
        this.state.running
    ) {

        return true;

    }


    this.createStars();

    this.createPlanets();

    this.bindSun();


    this.state.running =
        true;


    this.state.initialized =
        true;


    this.state.lastFrame =
        performance.now();


    this.state.animationFrame =
        requestAnimationFrame(
            this.animate.bind(
                this
            )
        );


    if (
        typeof HD9.emit ===
        "function"
    ) {

        HD9.emit(
            "cosmic:started"
        );

    }


    return true;

};


/* =========================================================
   STOP COSMIC WORLD
   ========================================================= */

HD9.cosmic.stop =
function() {

    this.state.running =
        false;


    if (
        this.state.animationFrame
    ) {

        cancelAnimationFrame(
            this.state.animationFrame
        );

        this.state.animationFrame =
            null;

    }


    if (
        typeof HD9.emit ===
        "function"
    ) {

        HD9.emit(
            "cosmic:stopped"
        );

    }


    return true;

};

    /* ========================================================

    HD10.menu.openApp =
        function(
            appId
        ) {

            if (
                !appId
            ) {

                return;

            }


            this.close();


            /*
             * Existing central app system.
             */

            if (
                HD10.apps?.open
            ) {

                try {

                    return HD10.apps.open(
                        appId
                    );

                }

                catch(error) {

                    console.warn(
                        "[HalDo] Could not open app:",
                        appId,
                        error
                    );

                }

            }


            /*
             * Existing launcher fallback.
             */

            if (
                HD10.launcher?.open
            ) {

                try {

                    return HD10.launcher.open(
                        appId
                    );

                }

                catch(error) {

                    console.warn(
                        "[HalDo] Launcher could not open app:",
                        appId,
                        error
                    );

                }

            }


            HD10.emit(
                "menu:app-open-failed",
                {
                    appId
                }
            );

        };


    /* ========================================================
       CREATE MENU ITEM
       ======================================================== */

    HD10.menu.createItem =
        function(
            config
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "haldo-menu-item";


            const icon =
                config.icon ||
                "•";


            let iconMarkup =
                icon;


            if (
                typeof icon ===
                "string" &&
                (
                    icon.endsWith(
                        ".png"
                    ) ||
                    icon.endsWith(
                        ".jpg"
                    ) ||
                    icon.endsWith(
                        ".jpeg"
                    ) ||
                    icon.endsWith(
                        ".webp"
                    ) ||
                    icon.includes(
                        "/"
                    )
                )
            ) {

                iconMarkup =
                    `
                    <img
                        src="${icon}"
                        alt=""
                    >
                    `;

            }


            button.innerHTML = `

                <span
                    class="haldo-menu-item-icon"
                >
                    ${iconMarkup}
                </span>

                <span
                    class="haldo-menu-item-text"
                >

                    <span
                        class="haldo-menu-item-title"
                    >
                        ${config.title || config.name || "App"}
                    </span>

                    ${
                        config.description
                            ? `
                                <span
                                    class="haldo-menu-item-description"
                                >
                                    ${config.description}
                                </span>
                              `
                            : ""
                    }

                </span>

            `;


            button.addEventListener(
                "click",
                () => {

                    if (
                        typeof config.action ===
                        "function"
                    ) {

                        config.action();
                        return;

                    }


                    if (
                        config.appId
                    ) {

                        this.openApp(
                            config.appId
                        );

                    }

                }
            );


            return button;

        };


    /* ========================================================
       GET REGISTERED APPS
       ======================================================== */

    HD10.menu.getApps =
        function() {

            const registry =
                HD10.apps?.registry;


            if (
                registry instanceof Map
            ) {

                return Array.from(
                    registry.values()
                );

            }


            if (
                Array.isArray(
                    HD10.apps?.list
                )
            ) {

                return HD10.apps.list;

            }


            if (
                typeof HD10.apps?.getAll ===
                "function"
            ) {

                try {

                    const result =
                        HD10.apps.getAll();


                    if (
                        Array.isArray(
                            result
                        )
                    ) {

                        return result;

                    }

                }

                catch {}

            }


            return [];

        };

    HD10.menu.populate =
        function(
            overlay
        ) {

            const main =
                overlay.querySelector(

                );


            const apps =
                overlay.querySelector(
                    "[data-menu-apps]"
                );


            const system =
                overlay.querySelector(

                );


            const ai =
                overlay.querySelector(

                );


            /*
             * Main menu.
             */

            main.appendChild(
                this.createItem(
                    {

                        title:

                        description:
                            "Mit HalDo AI sprechen",

                        icon:
                            "logo.png",

                        appId:
                            "haldo-ai"

            main.appendChild(
                this.createItem(

                            "Einstellungen",

                        description:
                            "HalDo-Welt und System",

                        icon:
                            "⚙️",

                        appId:
                            "settings"

                )
            );


            main.appendChild(

                        icon:
                            "▦",

                        action:
                            () =>
                                this.show(
                                    "apps"
                                )

                    }
                )
            );


            main.appendChild(
                this.createItem(
                    {

                        title:
                            "System",

                        description:
                            "Systemstatus und Werkzeuge",

                        icon:
                            "◉",

                        action:
                            () =>
                                this.show(
                                    "system"
                                )

                    }
                )
            );


            /*
             * AI menu.
             */

            ai.appendChild(
                this.createItem(
                    {

                        title:
                            "HalDo AI Chat",

                        description:
                            "Unterhalten, schreiben und antworten",

                        icon:
                            "logo.png",

                        appId:
                            "haldo-ai"

                    }
                )
            );


            ai.appendChild(
                this.createItem(
                    {

                        title:
                            "Voice",

                        description:
                            "Spracheingabe und Sprachausgabe",

                        icon:
                            "🎙️",

                        action:
                            () => {

                                this.close();


                                if (
                                    HD10.chat?.open
                                ) {

                                    HD10.chat.open();

                                }

                                else if (
                                    HD10.aiChat?.open
                                ) {

                                    HD10.aiChat.open();

                                }

                            }

                    }
                )
            );


            ai.appendChild(
                this.createItem(
                    {

                        title:
                            "AI-Sprache",

                        description:
                            "Sprach- und Spracheinstellungen",

                        icon:
                            "🗣️",

                        appId:
                            "language"

                    }
                )
            );


            /*
             * System menu.
             */

            system.appendChild(
                this.createItem(
                    {

                        title:
                            "Einstellungen",

                        description:
                            "System und HalDo-Welt konfigurieren",

                        icon:
                            "⚙️",

                        appId:
                            "settings"

                    }
                )
            );


            system.appendChild(
                this.createItem(
                    {

                        title:
                            "Status",

                        description:
                            "Systemstatus anzeigen",

                        icon:
                            "📊",

                        appId:
                            "system-status"

                    }
                )
            );


            system.appendChild(
                this.createItem(
                    {

                        title:
                            "Speicher",

                        description:
                            "Lokale Daten und Persistenz",

                        icon:
                            "💾",

                        appId:
                            "storage"

                    }
                )
            );


            /*
             * Registered apps.
             */

            const registered =
                this.getApps();


            const known =
                new Set();


            registered.forEach(
                app => {

                    if (
                        !app ||
                        !app.id ||
                        known.has(
                            app.id
                        )
                    ) {

                        return;

                    }


                    known.add(
                        app.id
                    );


                    /*
                     * Don't duplicate the
                     * primary menu entries.
                     */

                    if (
                        app.id ===
                        "haldo-ai" ||
                        app.id ===
                        "settings"
                    ) {

                        return;

                    }


                    apps.appendChild(
                        this.createItem(
                            {

                                title:
                                    app.title ||
                                    app.name ||
                                    app.id,

                                description:
                                    app.description ||
                                    "HalDo Anwendung",

                                icon:
                                    app.icon ||
                                    "•",

                                appId:
                                    app.id

                            }
                        )
                    );

                }
            );


            /*
             * Always make sure the apps screen
             * has something useful even if the
             * registry is still loading.
             */

            if (
                apps.children.length ===
                0
            ) {

                apps.appendChild(
                    this.createItem(
                        {

                            title:
                                "Keine Apps geladen",

                            description:
                                "Die App-Registrierung wird noch initialisiert.",

                            icon:
                                "•"

                        }
                    )
                );

            }

        };


    /* ========================================================

       ======================================================== */

    HD10.menu.bindNavigation =
        function(
            overlay
        ) {

            overlay
                .querySelectorAll(
                    "[data-menu-nav]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                this.show(
                                    button.dataset
                                        .menuNav
                                );

                            }
                        );

                    }
                );

        };


    HD10.menu.show =
        function(
            section
        ) {

            const overlay =
                this.state.root;


            if (
                !overlay
            ) {

                return;

            }


            overlay
                .querySelectorAll(
                    "[data-menu-section]"
                )
                .forEach(
                    element => {

                        element.classList.toggle(
                            "active",
                            element.dataset
                                .menuSection ===
                            section
                        );

                    }
                );


            overlay
                .querySelectorAll(
                    "[data-menu-nav]"
                )
                .forEach(
                    button => {

                        button.classList.toggle(
                            "active",
                            button.dataset
                                .menuNav ===
                            section
                        );

                    }
                );


            this.state.activeSection =
                section;


            HD10.emit(
                "menu:section",
                {
                    section
                }
            );

        };


    /* ========================================================
       OPEN
       ======================================================== */

    HD10.menu.open =
        function() {

            if (
                !this.state.root
            ) {

                this.create();

            }


            if (
                !this.state.root
            ) {

                return;

            }


            this.state.open =
                true;


            this.state.root.classList.add(
                "open"
            );


            HD10.emit(
                "menu:open"
            );

        };


    /* ========================================================
       CLOSE
       ======================================================== */

    HD10.menu.close =
        function() {

            if (
                !this.state.root
            ) {

                return;

            }


            this.state.open =
                false;


            this.state.root.classList.remove(
                "open"
            );


            HD10.emit(
                "menu:close"
            );

        };


    /* ========================================================
       TOGGLE
       ======================================================== */

    HD10.menu.toggle =
        function() {

            if (
                this.state.open
            ) {

                this.close();

            }

            else {

                this.open();

            }

        };


    /* ========================================================
       KEYBOARD
       ======================================================== */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape" &&
                HD10.menu.state.open
            ) {

                HD10.menu.close();

            }

        }
    );


    /* ========================================================
       MENU BUTTON CONNECTION
       ======================================================== */

    HD10.menu.bindExternalButton =
        function(
            element
        ) {

            if (
                !element
            ) {

                return;

            }


            if (
                element.dataset
                    .haldoMenuBound ===
                "true"
            ) {

                return;

            }


            element.dataset
                .haldoMenuBound =
                "true";


            element.addEventListener(
                "click",
                event => {

                    event.preventDefault();
                    event.stopPropagation();

                    this.toggle();

                }
            );

        };


    HD10.menu.bindExistingButtons =
        function() {

            const selectors = [

                "[data-haldo-menu]",

                "#haldo-menu-button",

                "#menu-button",

                ".haldo-menu-button",

                ".menu-button"

            ];


            selectors.forEach(
                selector => {

                    document
                        .querySelectorAll(
                            selector
                        )
                        .forEach(
                            element => {

                                this.bindExternalButton(
                                    element
                                );

                            }
                        );

                }
            );

        };


    /* ========================================================
       GLOBAL MENU API
       ======================================================== */

    window.HalDoMenu =
        {

            open:
                () =>
                    HD10.menu.open(),

            close:
                () =>
                    HD10.menu.close(),

            toggle:
                () =>
                    HD10.menu.toggle(),

            show:
                section =>
                    HD10.menu.show(
                        section
                    )

        };


    /* ========================================================
       INITIALIZATION
       ======================================================== */

    HD10.menu.injectStyles();

    HD10.menu.create();

    HD10.menu.bindExistingButtons();


    HD10.menu.state.initialized =
        true;


    HD10.emit(
        "menu:ready"
    );

</script>

/* =========================================================
   BIND EVENTS
   ========================================================= */

HD11.aiChat.bind =
function() {

    const root =
        this.state.root;

    if (
        !root
    ) {
        return;
    }


    const close =
        root.querySelector(
            "[data-ai-close]"
        );

    const newChat =
        root.querySelector(
            "[data-ai-new]"
        );

    const voice =
        root.querySelector(
            "[data-ai-voice]"
        );

    const form =
        root.querySelector(
            "[data-ai-form]"
        );


    close?.addEventListener(
        "click",
        () => this.close()
    );


    newChat?.addEventListener(
        "click",
        () => this.clear()
    );


    voice?.addEventListener(
        "click",
        () => this.startVoice()
    );


    form?.addEventListener(
        "submit",
        event => {

            event.preventDefault();

            this.send();

        }
    );


    this.state.input?.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                this.send();

            }

        }
    );


    this.state.input?.addEventListener(
        "input",
        () => this.autoResize()
    );


    root.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                root
            ) {

                this.close();

            }

        }
    );

};

HD11.aiChat.open =
function() {

    if (
        !this.state.root

        this.create();

    if (
        !this.state.root
    ) {
        return;
    }

    this.state.open =
        true;

    this.state.root.classList.add(
        "open"
    );

    this.setStatus(
        "bereit"

    setTimeout(
        () => {

        80

    HD11.emit(

};

function() {

    this.state.root.classList.remove(
