<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
HalDo AI OS v2.0
</title>


<meta name="description"
content="HalDo AI OS - Personal AI Operating System">


<link rel="manifest" href="manifest.json">


<link rel="stylesheet" href="css/main.css">

<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet" href="css/apps.css">


</head>



<body>


<!-- =====================================
     HALDO BOOT SYSTEM
===================================== -->


<div id="haldoBoot">


    <div class="boot-logo">

        <img
        src="images/haldo-logo.png"
        alt="HalDo AI Logo">

    </div>


    <h1>
        HalDo AI OS
    </h1>


    <p data-i18n="system_loading">
        System wird gestartet...
    </p>


    <div class="boot-progress">

        <div class="boot-bar"></div>

    </div>


</div>









<!-- =====================================
     MAIN HALDO SYSTEM
===================================== -->


<div id="haldoSystem">



<!-- =====================================
     TOP HEADER
===================================== -->


<header class="haldo-header">


<div class="brand">


<img
src="images/haldo-logo.png"
class="main-logo"
alt="HalDo">


<div>


<h1>
HalDo AI OS
</h1>


<p>
Personal AI System
</p>


</div>


</div>







<div class="header-tools">


<div class="online-status">

🟢
<span data-i18n="online">
Online
</span>


</div>





<select id="languageSelect">


<option value="de">

🇩🇪 Deutsch

</option>


<option value="ku">

🏳️ Kurmancî

</option>


<option value="tr">

🇹🇷 Türkçe

</option>


<option value="en">

🇬🇧 English

</option>


</select>



</div>



</header>









<!-- =====================================
     SYSTEM LAYOUT
===================================== -->


<div class="os-layout">



<!-- SIDEBAR -->


<aside class="sidebar">



<div class="sidebar-logo">


<div class="ai-symbol">

H★AI

</div>



<h3>

HalDo

</h3>


<p>

AI OS v2.0

</p>


</div>









<nav class="navigation">



<button
class="nav-item active"
data-app="dashboard">


🏠
<span data-i18n="home">
Start
</span>


</button>





<button
class="nav-item"
data-app="chat">


🤖
<span data-i18n="chat">
AI Chat
</span>


</button>





<button
class="nav-item"
data-app="mail">


📧
<span data-i18n="mail">
E-Mail
</span>


</button>





<button
class="nav-item"
data-app="files">


📁
<span data-i18n="files">
Dateien
</span>


</button>





<button
class="nav-item"
data-app="music">


🎵
<span data-i18n="music">
Musik
</span>


</button>





<button
class="nav-item"
data-app="video">


🎬
<span data-i18n="video">
Video
</span>


</button>





<button
class="nav-item"
data-app="images">


🖼️
<span data-i18n="images">
Bilder
</span>


</button>





<button
class="nav-item"
data-app="navigation">


🚗
<span data-i18n="navigation">
Navigation
</span>


</button>



</nav>


</aside>
