            this.initialized
        ) {

            return;
        }


        this.initialized =
            true;
    },


    /* =====================================================
       CREATE
       ===================================================== */

    create()
    {

        const root =
            document.createElement(
                "div"
            );


        root.className =
            "haldo-ai-shell";


        root.innerHTML = `

            <header
                class="haldo-ai-header"
            >

                <img
                    class="haldo-ai-avatar"
                    src="assets/logo/logo.png"
                    alt="HalDo AI"
                >


                <div
                    class="haldo-ai-heading"
                >

                    <div
                        class="haldo-ai-name"
                    >
                        HalDo AI
                    </div>

                    <div
                        class="haldo-ai-status online"
                        data-ai-status
                    >
                        Bereit
                    </div>

                </div>


                <select
                    class="haldo-ai-language"
                    data-ai-language
                    aria-label="Sprache"
                ></select>

            </header>


            <main
                class="haldo-ai-messages"
                data-ai-messages
            ></main>


            <div
                class="haldo-ai-quick"
            >

                <button
                    type="button"
                    data-ai-quick="Hallo HalDo"
                >
                    👋 Hallo
                </button>

                <button
                    type="button"
                    data-ai-quick="Was kannst du alles?"
                >
                    ✦ Fähigkeiten
                </button>

                <button
                    type="button"
                    data-ai-quick="Öffne meine Apps"
                >
                    Apps
                </button>

                <button
                    type="button"
                    data-ai-quick="Öffne Einstellungen"
                >
                    Einstellungen
                </button>

            </div>


            <form
                class="haldo-ai-composer"
                data-ai-form
            >

                <textarea
                    class="haldo-ai-input"
                    data-ai-input
                    rows="1"
                    placeholder="Schreibe etwas an HalDo AI …"
                    aria-label="Nachricht"
                ></textarea>


                <button
                    type="button"
                    class="haldo-ai-button"
                    data-ai-voice
                    aria-label="Sprache"
                >
                    ◉
                </button>


                <button
                    type="submit"
                    class="haldo-ai-button primary"
                    aria-label="Senden"
                >
                    ➤
                </button>

            </form>
        `;


        this.root =
            root;


        this.messages =
            root.querySelector(
                "[data-ai-messages]"
            );


        this.input =
            root.querySelector(
                "[data-ai-input]"
            );


        this.status =
            root.querySelector(
                "[data-ai-status]"
            );


        this.createLanguageList();


        this.bind();


        this.addMessage(
            "ai",
            this.welcomeText()
        );


        return root;
    },


    /* =====================================================
       LANGUAGE LIST
       ===================================================== */

    createLanguageList()
    {

        const select =
            this.root.querySelector(
                "[data-ai-language]"
            );


        if (
            !select
        ) {

            return;
        }


        select.innerHTML =
            this.languages
                .map(
                    language =>
                        `
                        <option
                            value="${this.escape(
                                language.code
                            )}"
                        >
                            ${this.escape(
                                language.name
                            )}
                        </option>
                        `
                )
                .join(
                    ""
                );


        select.value =
            this.language;
    },


    /* =====================================================
       EVENTS
       ===================================================== */

    bind()
    {

        this.root
            .querySelector(
                "[data-ai-form]"
            )
            ?.addEventListener(
                "submit",
                event => {

                    event.preventDefault();

                    this.sendCurrent();
                }
            );


        this.root
            .querySelector(
                "[data-ai-language]"
            )
            ?.addEventListener(
                "change",
                event => {

                    this.language =
                        event.target.value;

                    this.setStatus(
                        "Sprache geändert"
                    );
                }
            );


        this.root
            .querySelector(
                "[data-ai-voice]"
            )
            ?.addEventListener(
                "click",
                () => {

                    this.startVoiceInput();

                }
            );


        this.root
            .querySelectorAll(
                "[data-ai-quick]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            this.input.value =
                                button.dataset.aiQuick;

                            this.sendCurrent();
                        }
                    );
                }
            );
    },


    /* =====================================================
       SEND
       ===================================================== */

    sendCurrent()
    {

        if (
            this.typing
        ) {

            return;
        }


        const text =
            String(
                this.input?.value ||
                ""
            )
            .trim();


        if (
            !text
        ) {

            return;
        }


        this.input.value =
            "";


        this.addMessage(
            "user",
            text
        );


        this.history.push(
            {
                role:
                    "user",

                content:
                    text
            }
        );


        this.process(
            text
        );
    },


    /* =====================================================
       PROCESS
       ===================================================== */

    async process(
        text
    )
    {

        this.typing =
            true;


        this.setStatus(
            "Denkt …"
        );


        const typing =
            this.showTyping();


        try {

            await this.delay(
                350
            );


            const commandResult =
                this.handleCommand(
                    text
                );


            let response;


            if (
                commandResult !==
                null
            ) {

                response =
                    commandResult;

            }

            else {

                response =
                    this.localIntelligence(
                        text
                    );
            }


            typing.remove();


            this.addMessage(
                "ai",
                response
            );


            this.history.push(
                {
                    role:
                        "assistant",

                    content:
                        response
                }
            );


            this.setStatus(
                "Bereit"
            );


            this.speakIfEnabled(
                response
            );

        }

        catch (
            error
        ) {

            typing.remove();


            console.error(
                "[HalDo AI]",
                error
            );


            this.addMessage(
                "ai",
                "Entschuldigung. Beim Verarbeiten ist ein Fehler aufgetreten."
            );


            this.setStatus(
                "Bereit"
            );
        }


        finally {

            this.typing =
                false;
        }
    },


    /* =====================================================
       COMMANDS
       ===================================================== */

    handleCommand(
        text
    )
    {

        const value =
            text
                .toLowerCase()
                .trim();


        if (
            value.includes(
                "öffne einstellungen"
            ) ||
            value.includes(
                "open settings"
            )
        ) {

            document.dispatchEvent(
                new CustomEvent(
                    "haldo:command",
                    {
                        detail:
                        {
                            command:
                                "open-settings"
                        }
                    }
                )
            );


            return "Natürlich. Ich öffne die Einstellungen.";
        }


        if (
            value.includes(
                "öffne meine apps"
            ) ||
            value.includes(
                "öffne apps"
            ) ||
            value.includes(
                "open apps"
            )
        ) {

            document.dispatchEvent(
                new CustomEvent(
                    "haldo:command",
                    {
                        detail:
                        {
                            command:
                                "open-apps"
                        }
                    }
                )
            );


            return "Gerne. Das App-Menü wird geöffnet.";
        }


        if (
            value.includes(
                "öffne cosmic"
            ) ||
            value.includes(
                "cosmic world"
            )
        ) {

            window.HalDo
                .openCosmicWorld?.();


            return "Ich öffne die Cosmic World für dich.";
        }


        if (
            value ===
            "hallo" ||
            value.startsWith(
                "hallo "
            ) ||
            value.includes(
                "guten morgen"
            ) ||
            value.includes(
                "guten abend"
            )
        ) {

            return this.greeting();
        }


        return null;
    },


    /* =====================================================
       LOCAL INTELLIGENCE
       ===================================================== */

    localIntelligence(
        text
    )
    {

        const value =
            text
                .toLowerCase()
                .trim();


        if (
            value.includes(
                "was kannst du"
            ) ||
            value.includes(
                "fähigkeiten"
            )
        ) {

            return [
                "Ich bin HalDo AI.",
                "",
                "Ich kann dich beim Bedienen des Systems unterstützen, Fragen beantworten, Gespräche führen, Texte formulieren, Apps öffnen und mit den verschiedenen HalDo-Systemen zusammenarbeiten.",
                "",
                "Meine Architektur ist dafür vorbereitet, später auch echte externe KI-Dienste, Spracheingabe, Sprachausgabe, Langzeitgedächtnis und weitere Systemdienste einzubinden."
            ].join(
                "\n"
            );
        }


        if (
            value.includes(
                "wer bist du"
            )
        ) {

            return [
                "Ich bin HalDo AI — der intelligente digitale Begleiter von HalDo AI OS.",
                "",
                "Mein Ziel ist es, nicht nur ein Chatfenster zu sein, sondern mit dem gesamten Betriebssystem zusammenzuarbeiten."
            ].join(
                "\n"
            );
        }


        if (
            value.endsWith(
                "?"
            )
        ) {

            return [
                "Ich habe deine Frage verstanden.",
                "",
                "In dieser lokalen Systemversion kann ich bereits Gespräche führen und Systemaktionen auslösen. Für Antworten auf beliebige Wissensfragen kann später der echte KI-Dienst über den vorhandenen AI-Core angebunden werden.",
                "",
                "Wenn du möchtest, kannst du mir auch direkt sagen, welche HalDo-App oder Systemfunktion ich öffnen soll."
            ].join(
                "\n"
            );
        }


        return [
            "Ich höre dir zu. 💙",
            "",
            "Erzähl mir mehr oder sag mir direkt, was ich für dich im HalDo AI OS tun soll."
        ].join(
            "\n"
        );
    },


    /* =====================================================
       GREETING
       ===================================================== */

    greeting()
    {

        const greetings =
            {

                "de-DE":
                    "Hallo. Ich bin HalDo AI. Schön, dass du da bist. 💙",

                "en-US":
                    "Hello. I am HalDo AI. It is wonderful to have you here. 💙",

                "ku":
                    "Silav. Ez HalDo AI me. Bi xêr hatî. 💙",

                "ar":
                    "مرحباً. أنا HalDo AI. سعيد بوجودك هنا. 💙",

                "tr-TR":
                    "Merhaba. Ben HalDo AI. Burada olduğun için mutluyum. 💙"

            };


        return greetings[
            this.language
        ] ||
        greetings[
            "en-US"
        ];
    },


    /* =====================================================
       WELCOME
       ===================================================== */

    welcomeText()
    {

        return this.greeting();
    },


    /* =====================================================
       MESSAGE
       ===================================================== */

    addMessage(
        role,
        text
    )
    {

        const message =
            document.createElement(
                "article"
            );


        message.className =
            `haldo-ai-message ${role}`;


        message.textContent =
            text;


        const time =
            document.createElement(
                "div"
            );


        time.className =
            "haldo-ai-time";


        time.textContent =
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit"
                    }
                );


        message.appendChild(
            time
        );


        this.messages?.appendChild(
            message
        );


        if (
            this.messages
        ) {

            this.messages.scrollTop =
                this.messages.scrollHeight;
        }
    },


    /* =====================================================
       TYPING
       ===================================================== */

    showTyping()
    {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "haldo-ai-message ai";


        element.innerHTML = `

            <div
                class="haldo-ai-typing"
                aria-label="HalDo AI denkt"
            >

                <span></span>
                <span></span>
                <span></span>

            </div>
        `;


        this.messages?.appendChild(
            element
        );


        this.messages.scrollTop =
            this.messages.scrollHeight;


        return element;
    },


    /* =====================================================
       VOICE INPUT
       ===================================================== */

    startVoiceInput()
    {

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (
            !Recognition
        ) {

            this.setStatus(
                "Spracheingabe nicht verfügbar"
            );

            return;
        }


        const recognition =
            new Recognition();


        recognition.lang =
            this.language;


        recognition.interimResults =
            false;


        recognition.maxAlternatives =
            1;


        this.setStatus(
            "Ich höre zu …"
        );


        recognition.onresult =
            event => {

                const transcript =
                    event
                        .results?.[0]?.[0]
                        ?.transcript ||
                    "";


                this.input.value =
                    transcript;


                this.setStatus(
                    "Bereit"
                );


                this.sendCurrent();
            };


        recognition.onerror =
            error => {

                console.warn(
                    "[HalDo Voice Input]",
                    error
                );


                this.setStatus(
                    "Bereit"
                );
            };


        recognition.onend =
            () => {

                this.setStatus(
                    "Bereit"
                );
            };


        try {

            recognition.start();

        }

        catch (
            error
        ) {

            console.warn(
                "[HalDo Voice Input]",
                error
            );
        }
    },


    /* =====================================================
       SPEECH OUTPUT
       ===================================================== */

    speakIfEnabled(
        text
    )
    {

        /*
         * Speech is opt-in through the existing browser/system
         * speech layer. No sound is forced.
         */

        if (
            !window.speechSynthesis
        ) {

            return;
        }


        if (
            window.HalDo
                .settings
                ?.voiceOutput ===
            false
        ) {

            return;
        }


        /*
         * Do not automatically speak every message unless
         * explicitly enabled by the system.
         */

        if (
            window.HalDo
                .settings
                ?.voiceOutput !==
            true
        ) {

            return;
        }


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        utterance.lang =
            this.language;


        utterance.rate =
            .96;


        utterance.pitch =
            1.02;


        window.speechSynthesis.cancel();


        window.speechSynthesis.speak(
            utterance
        );
    },


    /* =====================================================
       STATUS
       ===================================================== */

    setStatus(
        text
    )
    {

        if (
            this.status
        ) {

            this.status.textContent =
                text;
        }
    },


    /* =====================================================
       OPEN
       ===================================================== */

    open()
    {

        this.init();


        const content =
            this.create();


        return window.HalDo
            .UniversalWindows
            .open(
                {

                    id:
                        "haldo-ai",

                    appId:
                        "haldo-ai",

                    title:
                        "HalDo AI",

                    icon:
                        "✦",

                    element:
                        content

                }
            );
    },


    /* =====================================================
       UTILITIES
       ===================================================== */

    delay(
        milliseconds
    )
    {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    milliseconds
                )
        );
    },


    escape(
        value
    )
    {

        return String(
            value
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
    }

};


/* =========================================================
   GLOBAL AI API
   ========================================================= */

window.HalDo.openProfessionalAI =
function()
{

    return window.HalDo
        .ProfessionalAI
        .open();
};


/* =========================================================
   COSMIC SUN → AI
   ========================================================= */

document.addEventListener(
    "haldo:window:opened",
    event => {

        if (
            event.detail?.appId !==
            "cosmic-world"
        ) {

            return;
        }


        const sun =
            document.querySelector(
                "[data-cosmic-sun]"
            );


        sun?.addEventListener(
            "click",
            () => {

                window.HalDo
                    .openProfessionalAI?.();

            },
            {
                once:
                    false
            }
        );
    }
);


/* =========================================================
   INITIALIZATION
   ========================================================= */

function haldoInitializeProfessionalAI()
{

    try {

        window.HalDo
            .ProfessionalAI
            .init();

    }

    catch (
        error
    ) {

        console.error(
            "[HalDo Professional AI] Initialization failed:",
            error
        );
    }
}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoInitializeProfessionalAI,
        {
            once:
                true
        }
    );

}

else {

    haldoInitializeProfessionalAI();

}

</script>

<script>

"use strict";


window.HalDo =
    window.HalDo ||
    {};


/* =========================================================
   UNIVERSAL WINDOWS
   ========================================================= */

window.HalDo.UniversalWindows =
{

    initialized:
        false,

    layer:
        null,

    windows:
        new Map(),

    zIndex:
        100000,


    /* =====================================================
       INIT
       ===================================================== */

    init()
    {

        if (
            this.initialized
        ) {

            return;
        }


        this.initialized =
            true;


        this.layer =
            document.createElement(
                "div"
            );


        this.layer.className =
            "haldo-universal-window-layer";


        this.layer.id =
            "haldo-universal-window-layer";


        document.body.appendChild(
            this.layer
        );


        this.installEscapeHandler();

    },


    /* =====================================================
       OPEN
       ===================================================== */

    open(
        options = {}
    )
    {

        this.init();


        const id =
            String(
                options.id ||
                `window-${Date.now()}`
            );


        /*
         * Existing window:
         * bring it forward instead of creating duplicates.
         */

        if (
            this.windows.has(
                id
            )
        ) {

            const existing =
                this.windows.get(
                    id
                );


            this.focus(
                existing
            );


            return existing;
        }


        const windowElement =
            document.createElement(
                "section"
            );


        windowElement.className =
            "haldo-universal-window";


        windowElement.dataset.windowId =
            id;


        windowElement.dataset.appId =
            String(
                options.appId ||
                id
            );


        const header =
            document.createElement(
                "header"
            );


        header.className =
            "haldo-window-header";


        const icon =
            document.createElement(
                "div"
            );


        icon.className =
            "haldo-window-icon";


        icon.textContent =
            options.icon ||
            "✦";


        const title =
            document.createElement(
                "div"
            );


        title.className =
            "haldo-window-title";


        title.textContent =
            options.title ||
            "HalDo";


        const controls =
            document.createElement(
                "div"
            );


        controls.className =
            "haldo-window-controls";


        const minimize =
            this.createControl(
                "−",
                "Minimieren"
            );


        const maximize =
            this.createControl(
                "□",
                "Maximieren"
            );


        const close =
            this.createControl(
                "×",
                "Schließen"
            );


        controls.appendChild(
            minimize
        );

        controls.appendChild(
            maximize
        );

        controls.appendChild(
            close
        );


        header.appendChild(
            icon
        );

        header.appendChild(
            title
        );

        header.appendChild(
            controls
        );


        const content =
            document.createElement(
                "main"
            );


        content.className =
            "haldo-window-content";


        /*
         * Accept either:
         *
         * element
         * Node
         * HTML string
         */

        if (
            options.element instanceof
            Node
        ) {

            content.appendChild(
                options.element
            );

        }

        else if (
            typeof options.element ===
            "string"
        ) {

            content.innerHTML =
                options.element;

        }

        else if (
            options.html
        ) {

            content.innerHTML =
                String(
                    options.html
                );

        }


        windowElement.appendChild(
            header
        );


        windowElement.appendChild(
            content
        );


        this.layer.appendChild(
            windowElement
        );


        this.windows.set(
            id,
            windowElement
        );


        this.focus(
            windowElement
        );


        this.makeDraggable(
            windowElement,
            header
        );


        close.addEventListener(
            "click",
            () => {

                this.close(
                    id
                );
            }
        );


        minimize.addEventListener(
            "click",
            () => {

                this.minimize(
                    windowElement
                );
            }
        );


        maximize.addEventListener(
            "click",
            () => {

                this.toggleMaximize(
                    windowElement
                );
            }
        );


        windowElement.addEventListener(
            "pointerdown",
            () => {

                this.focus(
                    windowElement
                );

            },
            true
        );


        document.dispatchEvent(
            new CustomEvent(
                "haldo:window:opened",
                {
                    detail:
                    {
                        id:
                            id,

                        appId:
                            windowElement
                                .dataset
                                .appId,

                        window:
                            windowElement
                    }
                }
            )
        );


        return windowElement;
    },


    /* =====================================================
       CONTROL
       ===================================================== */

    createControl(
        text,
        label
    )
    {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "haldo-window-control";


        button.textContent =
            text;


        button.title =
            label;


        button.setAttribute(
            "aria-label",
            label
        );


        return button;
    },


    /* =====================================================
       FOCUS
       ===================================================== */

    focus(
        windowElement
    )
    {

        if (
            !windowElement
        ) {

            return;
        }


        this.zIndex += 1;


        windowElement.style.zIndex =
            String(
                this.zIndex
            );


        windowElement.classList.remove(
            "minimized"
        );
    },


    /* =====================================================
       MINIMIZE
       ===================================================== */

    minimize(
        windowElement
    )
    {

        if (
            !windowElement
        ) {

            return;
        }


        windowElement.style.display =
            "none";


        document.dispatchEvent(
            new CustomEvent(
                "haldo:window:minimized",
                {
                    detail:
                    {
                        window:
                            windowElement,

                        id:
                            windowElement
                                .dataset
                                .windowId
                    }
                }
            )
        );
    },


    /* =====================================================
       RESTORE
       ===================================================== */

    restore(
        id
    )
    {

        const windowElement =
            this.windows.get(
                String(id)
            );


        if (
            !windowElement
        ) {

            return null;
        }


        windowElement.style.display =
            "flex";


        this.focus(
            windowElement
        );


        return windowElement;
    },


    /* =====================================================
       MAXIMIZE
       ===================================================== */

    toggleMaximize(
        windowElement
    )
    {

        if (
            !windowElement
        ) {

            return;
        }


        windowElement.classList.toggle(
            "maximized"
        );


        this.focus(
            windowElement
        );
    },


    /* =====================================================
       CLOSE
       ===================================================== */

    close(
        id
    )
    {

        const key =
            String(
                id
            );


        const windowElement =
            this.windows.get(
                key
            );


        if (
            !windowElement
        ) {

            return;
        }


        windowElement.dispatchEvent(
            new CustomEvent(
                "haldo:window:beforeclose",
                {
                    detail:
                    {
                        id:
                            key,

                        window:
                            windowElement
                    }
                }
            )
        );


        windowElement.remove();


        this.windows.delete(
            key
        );


        document.dispatchEvent(
            new CustomEvent(
                "haldo:window:closed",
                {
                    detail:
                    {
                        id:
                            key
                    }
                }
            )
        );
    },


    /* =====================================================
       DRAG
       ===================================================== */

    makeDraggable(
        windowElement,
        header
    )
    {

        if (
            !windowElement ||
            !header
        ) {

            return;
        }


        let dragging =
            false;

        let pointerId =
            null;

        let startX =
            0;

        let startY =
            0;

        let originalLeft =
            0;

        let originalTop =
            0;


        header.addEventListener(
            "pointerdown",
            event => {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {

                    return;
                }


                if (
                    windowElement
                        .classList
                        .contains(
                            "maximized"
                        )
                ) {

                    return;
                }


                dragging =
                    true;


                pointerId =
                    event.pointerId;


                const rect =
                    windowElement
                        .getBoundingClientRect();


                startX =
                    event.clientX;

                startY =
                    event.clientY;


                originalLeft =
                    rect.left;

                originalTop =
                    rect.top;


                windowElement.style.left =
                    `${rect.left}px`;


                windowElement.style.top =
                    `${rect.top}px`;


                windowElement.style.transform =
                    "none";


                header.setPointerCapture(
                    pointerId
                );


                this.focus(
                    windowElement
                );


                event.preventDefault();
            }
        );


        header.addEventListener(
            "pointermove",
            event => {

                if (
                    !dragging ||
                    event.pointerId !==
                    pointerId
                ) {

                    return;
                }


                const dx =
                    event.clientX -
                    startX;


                const dy =
                    event.clientY -
                    startY;


                const width =
                    windowElement
                        .offsetWidth;


                const height =
                    windowElement
                        .offsetHeight;


                const maxLeft =
                    Math.max(
                        0,
                        window.innerWidth -
                        Math.min(
                            width,
                            window.innerWidth
                        )
                    );


                const maxTop =
                    Math.max(
                        0,
                        window.innerHeight -
                        Math.min(
                            height,
                            window.innerHeight
                        )
                    );


                const nextLeft =
                    Math.min(
                        Math.max(
                            originalLeft +
                            dx,
                            0
                        ),
                        maxLeft
                    );


                const nextTop =
                    Math.min(
                        Math.max(
                            originalTop +
                            dy,
                            0
                        ),
                        maxTop
                    );


                windowElement.style.left =
                    `${nextLeft}px`;


                windowElement.style.top =
                    `${nextTop}px`;
            }
        );


        const stop =
            event => {

                if (
                    event.pointerId ===
                    pointerId
                ) {

                    dragging =
                        false;

                    pointerId =
                        null;
                }
            };


        header.addEventListener(
            "pointerup",
            stop
        );


        header.addEventListener(
            "pointercancel",
            stop
        );
    },


    /* =====================================================
       ESCAPE
       ===================================================== */

    installEscapeHandler()
    {

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key !==
                    "Escape"
                ) {

                    return;
                }


                const visible =
                    Array.from(
                        this.windows.values()
                    )
                    .filter(
                        element =>
                            element.style
                                .display !==
                            "none"
                    )
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            Number(
                                b.style.zIndex ||
                                0
                            ) -
                            Number(
                                a.style.zIndex ||
                                0
                            )
                    );


                const top =
                    visible[0];


                if (
                    top
                ) {

                    this.close(
                        top.dataset.windowId
                    );
                }
            }
        );
    },


    /* =====================================================
       CLOSE ALL
       ===================================================== */

    closeAll()
    {

        Array.from(
            this.windows.keys()
        )
        .forEach(
            id =>
                this.close(
                    id
                )
        );
    }

};


/* =========================================================
   GLOBAL WINDOW API
   ========================================================= */

window.HalDo.openWindow =
function(
    options
)
{

    return window.HalDo
        .UniversalWindows
        .open(
            options
        );
};


window.HalDo.closeWindow =
function(
    id
)
{

    return window.HalDo
        .UniversalWindows
        .close(
            id
        );
};


window.HalDo.restoreWindow =
function(
    id
)
{

    return window.HalDo
        .UniversalWindows
        .restore(
            id
        );
};


/* =========================================================
   INITIALIZATION
   ========================================================= */

function haldoInitializeUniversalWindows()
{

    try {

        window.HalDo
            .UniversalWindows
            .init();

    }

    catch (
        error
    ) {

        console.error(
            "[HalDo Universal Windows] Initialization failed:",
            error
        );
    }
}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoInitializeUniversalWindows,
        {
            once:
                true
        }
    );

}

else {

    haldoInitializeUniversalWindows();

}

</script>
