<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
HalDo AI OS 18 Professional Ultimate Foundation
</title>


<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#090D18">


</head>


<body>


<!-- =========================
BOOT SCREEN
========================= -->


<section id="startup-screen" class="screen">


<img
src="assets/logo/logo.svg"
class="logo"
alt="HalDo AI OS Logo">


<h1>
HalDo AI OS 18
</h1>


<p id="system-status">
🟡 HalDo AI OS startet...
</p>


</section>







<!-- =========================
WELCOME SCREEN
========================= -->


<section id="welcome-screen"
class="screen hidden">


<img
src="assets/logo/logo.svg"
class="logo"
alt="HalDo AI OS Logo">


<h1>
👋 Willkommen bei
<br>
HalDo AI OS 18
</h1>


<p>
Professional Ultimate Foundation
</p>


<p id="clock">
Systemzeit
</p>


<button onclick="openMainMenu()">

🚀 Hauptmenü öffnen

</button>


</section>








<!-- =========================
MAIN MENU
========================= -->


<section id="main-menu"
class="hidden">



<header class="header">


<img
src="assets/logo/logo.svg"
class="logo small"
alt="HalDo AI OS">


<h1>
HalDo AI OS 18
</h1>


<p>
Professional Ultimate Foundation
</p>


</header>







<main class="menu-container">


<h2>
🚀 Hauptmenü
</h2>



<div class="menu-grid">



<button onclick="openPage('dashboard.html')">
📊 Dashboard
<br>
System Übersicht
</button>



<button onclick="openPage('ai-core.html')">
🤖 AI Core
<br>
KI Zentrale
</button>



<button onclick="openPage('modules.html')">
🧩 Module
<br>
System Erweiterungen
</button>



<button onclick="openPage('apps.html')">
📱 Apps
<br>
App Center
</button>



<button onclick="openPage('settings.html')">
⚙️ Einstellungen
<br>
System Kontrolle
</button>



<button onclick="openPage('status.html')">
📡 Status
<br>
Monitor
</button>



<button onclick="openPage('health.html')">
🏥 Health Center
<br>
Gesundheit Lernen
</button>



<button onclick="openPage('learning.html')">
📚 Learning Center
<br>
Wissen
</button>



<button onclick="openPage('developer.html')">
💻 Developer Center
<br>
Software Entwicklung
</button>



<button onclick="openPage('language.html')">
🌍 Language Center
<br>
Mehrsprachig
</button>



</div>



</main>



</section>









<script>


function openMainMenu(){


document
.getElementById("welcome-screen")
.style.display="none";


document
.getElementById("main-menu")
.classList.remove("hidden");


}







function openPage(page){


window.location.href = page;


}







function updateClock(){


const clock =
document.getElementById("clock");


if(clock){


clock.innerHTML =
"🕒 " +
new Date()
.toLocaleTimeString("de-DE");


}


}



setInterval(updateClock,1000);


updateClock();



</script>






<script src="js/boot.js"></script>

<script src="js/startup.js"></script>



</body>

</html>
