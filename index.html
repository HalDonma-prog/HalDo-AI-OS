<head>

        /* ============================================================
           HALDO AI OS — GLOBAL STYLES (v26.0)
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121f;
            --bg-card: rgba(255,255,255,0.02);
            --border-color: rgba(255,255,255,0.03);
            --text-primary: #e0e0e0;
            --text-secondary: rgba(255,255,255,0.3);
            --text-muted: rgba(255,255,255,0.05);
            --accent-1: #f6d365;
            --accent-2: #fda085;
            --accent-3: #f093fb;
            --accent-4: #4facfe;
            --accent-5: #43e97b;
            --accent-6: #ff6b6b;
            --cosmic-1: #0a0a2e;
            --cosmic-2: #1a1a4a;
            --cosmic-3: #2a2a6a;
            --radius: 16px;
            --transition: 0.3s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 4px; }

        .haldo-desktop {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* TASKBAR */
        .taskbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 16px;
            height: 44px;
            background: rgba(10,10,18,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 100;
        }
        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .taskbar-logo {
            font-weight: 800;
            font-size: 0.9rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }
        .taskbar-center {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            max-width: 600px;
            margin: 0 16px;
            overflow-x: auto;
        }
        .taskbar-center .app-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.15);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .taskbar-center .app-icon:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.3); }
        .taskbar-center .app-icon.active { background: rgba(79,172,254,0.08); color: var(--accent-4); }
        .taskbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .taskbar-right .time { font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }

        /* WORKSPACE */
        .workspace { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* SIDEBAR */
        .sidebar {
            width: 52px;
            background: rgba(18,18,31,0.6);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            gap: 2px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }
        .sidebar .app-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.1);
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .sidebar .app-btn:hover { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.3); }
        .sidebar .app-btn.active { background: rgba(79,172,254,0.06); color: var(--accent-4); }
        .sidebar .app-btn .tooltip {
            position: absolute;
            left: 52px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10,10,18,0.9);
            backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.55rem;
            color: var(--text-secondary);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }
        .sidebar .app-btn:hover .tooltip { opacity: 1; }

        /* APP CONTAINER */
        .app-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            position: relative;
            background: var(--bg-primary);
        }

        /* APP VIEW */
        .app-view { display: none; height: 100%; animation: fadeIn 0.25s ease; }
        .app-view.active { display: flex; flex-direction: column; height: 100%; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
        .app-view .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .app-view .app-header .title { font-size: 1.1rem; font-weight: 600; color: var(--text-secondary); }
        .app-view .app-header .title .emoji { margin-right: 8px; }
        .app-view .app-header .actions { display: flex; gap: 6px; }
        .app-view .app-header .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }
        .app-view .app-header .actions button:hover { background: rgba(255,255,255,0.04); color: #fff; }
        .app-view .app-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

        /* APP GRID */
        .app-grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
        .app-grid-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .app-grid-item:hover { background: rgba(255,255,255,0.03); transform: translateY(-2px); border-color: rgba(255,255,255,0.05); }
        .app-grid-item .emoji { font-size: 2rem; display: block; margin-bottom: 4px; }
        .app-grid-item .name { font-size: 0.7rem; color: var(--text-secondary); font-weight: 500; }
        .app-grid-item .desc { font-size: 0.55rem; color: var(--text-muted); margin-top: 2px; }

        /* CATEGORY SECTION */
        .category-section { margin-bottom: 16px; }
        .category-section .cat-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        /* SYSTEM STATUS */
        .system-status {
            display: flex;
            justify-content: space-between;
            padding: 4px 16px;
            background: rgba(10,10,18,0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            font-size: 0.55rem;
            color: var(--text-muted);
            flex-shrink: 0;
            height: 26px;
            align-items: center;
        }
        .system-status .highlight { color: rgba(255,255,255,0.08); }

        /* MODAL */
        .haldo-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .haldo-modal.active { display: flex; }
        .haldo-modal .modal-content {
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .haldo-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .haldo-modal .modal-header .title { font-weight: 600; color: var(--text-secondary); }
        .haldo-modal .modal-header .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }
        .haldo-modal .modal-header .close-btn:hover { color: var(--accent-6); }
        .haldo-modal .modal-body { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar { width: 44px; }
            .sidebar .app-btn { width: 34px; height: 34px; font-size: 0.9rem; }
            .taskbar-center { max-width: 200px; }
            .taskbar-logo { font-size: 0.7rem; }
            .app-grid-view { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
        @media (max-width: 480px) {
            .taskbar-center { display: none; }
            .taskbar { padding: 4px 8px; }
            .app-container { padding: 8px; }
        }
    </style>
</head>

        // ============================================================
        let currentApp = 'haldo-ai';
        let appHistory = [];
        let appInstances = {};
        let systemMemory = 0;

        // ---- DOM Refs ----
        const sidebar = document.getElementById('sidebar');
        const appViewContainer = document.getElementById('appViewContainer');
        const taskbarApps = document.getElementById('taskbarApps');
        const taskbarTime = document.getElementById('taskbarTime');
        const statusAppCount = document.getElementById('statusAppCount');
        const statusMemory = document.getElementById('statusMemory');
        const statusAI = document.getElementById('statusAI');

        // ---- Modal ----
        const modal = document.getElementById('haldoModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        function openModal(title, bodyHTML) {
            modalTitle.textContent = title;
            modalBody.innerHTML = bodyHTML;
            modal.classList.add('active');
        }
        function closeModal() {
            modal.classList.remove('active');
        }
        window.closeModal = closeModal;

        // ---- Uhr ----
        function updateClock() {
            const now = new Date();
            taskbarTime.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ---- App Renderer ----
        function renderApp(appId) {
            const app = APP_REGISTRY[appId];
            if (!app) return;

            currentApp = appId;
            appHistory.push(appId);
            if (appHistory.length > 20) appHistory.shift();

            appViewContainer.innerHTML = '';

            const view = document.createElement('div');
            view.className = 'app-view active';
            view.id = `app-${appId}`;

            // Header
            const header = document.createElement('div');
            header.className = 'app-header';
            header.innerHTML = `
                <div class="title"><span class="emoji">${app.emoji}</span>${app.name}</div>
                <div class="actions">
                    <button onclick="showAppInfo('${appId}')">ℹ️</button>
                    <button onclick="openAppSettings('${appId}')">⚙️</button>
                    <button onclick="exportAppData('${appId}')">📤</button>
                </div>
            `;
            view.appendChild(header);

            // Content
            const content = document.createElement('div');
            content.className = 'app-content';
            content.id = `app-content-${appId}`;
            content.innerHTML = generateAppContent(appId);
            view.appendChild(content);

            appViewContainer.appendChild(view);

            updateSidebar();
            updateTaskbar();
            updateStatus();

            appInstances[appId] = { loaded: true, timestamp: Date.now() };
        }

        // ---- App Content Generator ----
        function generateAppContent(appId) {
            const app = APP_REGISTRY[appId];
            if (!app) return `<p style="color:var(--text-muted);">App nicht gefunden.</p>`;

            let html = '';

            // App-Info
            html += `
                <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                        <span style="font-size:2.4rem;">${app.emoji}</span>
                        <div>
                            <div style="font-weight:600;color:var(--text-primary);">${app.name}</div>
                            <div style="font-size:0.7rem;color:var(--text-muted);">${app.category} · ${app.desc}</div>
                        </div>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button onclick="showAppInfo('${appId}')" style="padding:6px 14px;border:none;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--text-secondary);font-size:0.7rem;cursor:pointer;font-family:var(--font);">ℹ️ Info</button>
                        <button onclick="openAppSettings('${appId}')" style="padding:6px 14px;border:none;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--text-secondary);font-size:0.7rem;cursor:pointer;font-family:var(--font);">⚙️ Einstellungen</button>
                        <button onclick="exportAppData('${appId}')" style="padding:6px 14px;border:none;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--text-secondary);font-size:0.7rem;cursor:pointer;font-family:var(--font);">📤 Export</button>
                        <button onclick="importAppData('${appId}')" style="padding:6px 14px;border:none;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--text-secondary);font-size:0.7rem;cursor:pointer;font-family:var(--font);">📥 Import</button>
                    </div>
                </div>
            `;

            // Kosmische Features für Planet-Apps
            if (appId.includes('sun') || appId.includes('earth') || appId.includes('moon') || appId.includes('solar-system')) {
                html += `
                    <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
                        <div style="font-size:0.7rem;color:var(--text-secondary);margin-bottom:8px;">🌌 Kosmische Daten</div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:0.65rem;color:var(--text-muted);">
                            <div>🔄 Umlaufbahn: <span style="color:var(--text-secondary);">365 Tage</span></div>
                            <div>🌡️ Temperatur: <span style="color:var(--text-secondary);">15°C</span></div>
                            <div>📏 Durchmesser: <span style="color:var(--text-secondary);">12.742 km</span></div>
                            <div>🌍 Entfernung zur Sonne: <span style="color:var(--text-secondary);">149,6 Mio. km</span></div>
                        </div>
                    </div>
                `;
            }

            // Features
            const features = getAppFeatures(appId);
            if (features.length > 0) {
                html += `
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px;">
                `;
                for (let f of features) {
                    html += `
                        <div style="background:var(--bg-card);border-radius:12px;padding:12px;border:1px solid var(--border-color);text-align:center;cursor:pointer;" onclick="openModal('${f.name}', '${f.desc}')">
                            <span style="font-size:1.6rem;display:block;">${f.emoji}</span>
                            <span style="font-size:0.7rem;color:var(--text-secondary);">${f.name}</span>
                        </div>
                    `;
                }
                html += `</div>`;
            }

            // AI-Bereich
            html += `
                <div style="margin-top:8px;background:var(--bg-card);border-radius:var(--radius);padding:12px;border:1px solid var(--border-color);">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                        <span>🧠</span>
                        <span style="font-size:0.7rem;color:var(--text-secondary);">AI-Assistent für ${app.name}</span>
                    </div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button onclick="aiAction('${appId}','zusammenfassen')" style="padding:4px 12px;border:none;border-radius:6px;background:rgba(79,172,254,0.05);color:var(--accent-4);font-size:0.65rem;cursor:pointer;font-family:var(--font);">📝 Zusammenfassen</button>
                        <button onclick="aiAction('${appId}','übersetzen')" style="padding:4px 12px;border:none;border-radius:6px;background:rgba(79,172,254,0.05);color:var(--accent-4);font-size:0.65rem;cursor:pointer;font-family:var(--font);">🌍 Übersetzen</button>
                        <button onclick="aiAction('${appId}','analysieren')" style="padding:4px 12px;border:none;border-radius:6px;background:rgba(79,172,254,0.05);color:var(--accent-4);font-size:0.65rem;cursor:pointer;font-family:var(--font);">🔍 Analysieren</button>
                        <button onclick="aiAction('${appId}','generieren')" style="padding:4px 12px;border:none;border-radius:6px;background:rgba(79,172,254,0.05);color:var(--accent-4);font-size:0.65rem;cursor:pointer;font-family:var(--font);">✨ Generieren</button>
                    </div>
                </div>
            `;

            return html;
        }

        // ---- App Features ----
        function getAppFeatures(appId) {
            const features = {
                'haldo-ai': [
                    { name: 'Chat', emoji: '💬', desc: 'Fragen stellen' },
                    { name: 'Schreiben', emoji: '✍️', desc: 'Texte verfassen' },
                    { name: 'Zusammenfassen', emoji: '📝', desc: 'Lange Texte komprimieren' },
                    { name: 'Übersetzen', emoji: '🌍', desc: 'In beliebige Sprache übersetzen' }
                ],
                'solar-system': [
                    { name: 'Planeten', emoji: '🪐', desc: 'Alle Planeten anzeigen' },
                    { name: 'Orbit', emoji: '🌀', desc: 'Umlaufbahnen simulieren' },
                    { name: 'Daten', emoji: '📊', desc: 'Astronomische Daten' },
                    { name: '3D-Ansicht', emoji: '🌍', desc: '3D-Darstellung' }
                ],
                'earth': [
                    { name: 'Karte', emoji: '🗺️', desc: 'Erde erkunden' },
                    { name: 'Atmosphäre', emoji: '🌤️', desc: 'Wetter und Klima' },
                    { name: 'Kontinente', emoji: '🌍', desc: 'Alle Kontinente' },
                    { name: 'Ozeane', emoji: '🌊', desc: 'Meere und Ozeane' }
                ]
            };

            return features[appId] || [
                { name: 'Info', emoji: 'ℹ️', desc: 'Informationen anzeigen' },
                { name: 'Einstellungen', emoji: '⚙️', desc: 'App-Einstellungen' },
                { name: 'Export', emoji: '📤', desc: 'Daten exportieren' },
                { name: 'Import', emoji: '📥', desc: 'Daten importieren' }
            ];
        }

        // ---- Sidebar ----
        function updateSidebar() {
            const categories = {};
            APP_IDS.forEach(id => {
                const app = APP_REGISTRY[id];
                if (!categories[app.category]) categories[app.category] = [];
                categories[app.category].push(id);
            });

            sidebar.innerHTML = '';
            const sortedCategories = Object.keys(categories).sort();

            sortedCategories.forEach(cat => {
                const apps = categories[cat];
                apps.forEach(id => {
                    const app = APP_REGISTRY[id];
                    const active = id === currentApp ? 'active' : '';
                    const btn = document.createElement('button');
                    btn.className = `app-btn ${active}`;
                    btn.innerHTML = `${app.emoji}<span class="tooltip">${app.name}</span>`;
                    btn.onclick = () => switchApp(id);
                    sidebar.appendChild(btn);
                });
            });
        }

        // ---- Taskbar ----
        function updateTaskbar() {
            const recent = appHistory.slice(-5).reverse();
            taskbarApps.innerHTML = recent.map(id => {
                const app = APP_REGISTRY[id];
                const active = id === currentApp ? 'active' : '';
                return `<button class="app-icon ${active}" onclick="switchApp('${id}')" title="${app.name}">${app.emoji}</button>`;
            }).join('');
        }

        // ---- Status ----
        function updateStatus() {
            statusAppCount.textContent = APP_IDS.length;
            statusMemory.textContent = Math.round(Math.random() * 200 + 100);
            statusAI.textContent = 'Aktiv · v26.0';
        }

        // ---- Switch App ----
        function switchApp(appId) {
            if (!APP_REGISTRY[appId]) return;
            if (appId === currentApp) { renderApp(appId); return; }
            renderApp(appId);
        }
        window.switchApp = switchApp;

        // ---- App Info ----
        function showAppInfo(appId) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            openModal(`ℹ️ ${app.name}`, `
                <div style="display:flex;flex-direction:column;gap:8px;">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <span style="font-size:3rem;">${app.emoji}</span>
                        <div>
                            <div style="font-weight:600;color:var(--text-primary);">${app.name}</div>
                            <div style="color:var(--text-muted);font-size:0.8rem;">${app.category}</div>
                        </div>
                    </div>
                    <div style="color:var(--text-secondary);font-size:0.9rem;">${app.desc}</div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
                        <span style="padding:2px 12px;border-radius:6px;background:rgba(255,255,255,0.02);border:1px solid var(--border-color);font-size:0.6rem;color:var(--text-muted);">ID: ${app.id}</span>
                        <span style="padding:2px 12px;border-radius:6px;background:rgba(255,255,255,0.02);border:1px solid var(--border-color);font-size:0.6rem;color:var(--text-muted);">Version: 26.0</span>
                    </div>
                    <div style="margin-top:6px;border-top:1px solid var(--border-color);padding-top:8px;color:var(--text-muted);font-size:0.6rem;">
                        🔗 Verbindungen: AI · Voice · Storage · Files · Security · Updates
                    </div>
                </div>
            `);
        }
        window.showAppInfo = showAppInfo;

        // ---- App Settings ----
        function openAppSettings(appId) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            openModal(`⚙️ Einstellungen — ${app.name}`, `
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                        <span style="color:var(--text-secondary);font-size:0.8rem;">Sprache</span>
                        <span style="color:var(--text-muted);font-size:0.8rem;">Deutsch (DE)</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                        <span style="color:var(--text-secondary);font-size:0.8rem;">AI-Provider</span>
                        <span style="color:var(--text-muted);font-size:0.8rem;">Lokal · Offline</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                        <span style="color:var(--text-secondary);font-size:0.8rem;">Speicher</span>
                        <span style="color:var(--text-muted);font-size:0.8rem;">Lokal (Cache)</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
                        <span style="color:var(--text-secondary);font-size:0.8rem;">Datenschutz</span>
                        <span style="color:var(--text-muted);font-size:0.8rem;">🔒 Aktiv</span>
                    </div>
                    <div style="margin-top:8px;display:flex;gap:6px;">
                        <button onclick="closeModal();openModal('✅ Gespeichert','Die Einstellungen wurden übernommen.')" style="padding:8px 20px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--accent-4),var(--accent-5));color:#0a0a12;font-weight:600;cursor:pointer;font-family:var(--font);">Übernehmen</button>
                        <button onclick="closeModal()" style="padding:8px 20px;border:none;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--text-secondary);cursor:pointer;font-family:var(--font);">Abbrechen</button>
                    </div>
                </div>
            `);
        }
        window.openAppSettings = openAppSettings;

        // ---- Export ----
        function exportAppData(appId) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            const data = { app: appId, name: app.name, data: { example: 'Daten', timestamp: Date.now() }, version: '26.0' };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${appId}_data_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            openModal('📤 Export', `✅ Daten von "${app.name}" wurden exportiert.`);
        }
        window.exportAppData = exportAppData;

        // ---- Import ----
        function importAppData(appId) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        openModal('📥 Import', `
                            ✅ Daten für "${data.name || appId}" importiert.
                            <br><br>
                            📊 ${Object.keys(data.data || {}).length} Einträge geladen.
                            <br>
                            🕐 ${new Date(data.timestamp).toLocaleString()}
                        `);
                    } catch (err) {
                        openModal('❌ Fehler', `Import fehlgeschlagen: ${err.message}`);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        window.importAppData = importAppData;

        // ---- AI Actions ----
        function aiAction(appId, action) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            const messages = {
                'zusammenfassen': `🧠 KI fasst den Inhalt von "${app.name}" zusammen ...`,
                'übersetzen': `🌍 KI übersetzt den Inhalt von "${app.name}" ...`,
                'analysieren': `🔍 KI analysiert den Inhalt von "${app.name}" ...`,
                'generieren': `✨ KI generiert neuen Inhalt für "${app.name}" ...`
            };
            openModal(`🧠 AI-Aktion — ${app.name}`, `
                <div style="padding:12px;background:rgba(79,172,254,0.02);border-radius:8px;border:1px solid rgba(79,172,254,0.05);">
                    ${messages[action] || '🧠 AI verarbeitet ...'}
                </div>
                <button onclick="closeModal()" style="margin-top:8px;padding:6px 16px;border:none;border-radius:6px;background:rgba(255,255,255,0.02);color:var(--text-secondary);cursor:pointer;font-family:var(--font);">Schließen</button>
            `);
        }
        window.aiAction = aiAction;

        // ---- Voice Actions ----
        function voiceAction(appId, action) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            const status = {
                'start': '🎤 Sprachaufnahme gestartet ...',
                'stop': '⏹️ Sprachaufnahme beendet.',
                'status': '📊 Voice-Status: Bereit · Mikrofon: 🟢 Aktiv'
            };
            openModal(`🎤 Voice — ${app.name}`, `
                <div style="padding:12px;background:rgba(43,233,123,0.02);border-radius:8px;border:1px solid rgba(43,233,123,0.05);">
                    ${status[action] || '🎤 Voice-Aktion ausgeführt.'}
                </div>
                <button onclick="closeModal()" style="margin-top:8px;padding:6px 16px;border:none;border-radius:6px;background:rgba(255,255,255,0.02);color:var(--text-secondary);cursor:pointer;font-family:var(--font);">Schließen</button>
            `);
        }
        window.voiceAction = voiceAction;

        // ---- Keyboard Shortcuts ----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const search = prompt('🔍 App suchen:', '');
                if (search) {
                    const found = APP_IDS.filter(id =>
                        APP_REGISTRY[id].name.toLowerCase().includes(search.toLowerCase()) ||
                        APP_REGISTRY[id].desc.toLowerCase().includes(search.toLowerCase())
                    );
                    if (found.length > 0) {
                        switchApp(found[0]);
                    } else {
                        openModal('🔍 Suche', `Keine App gefunden für: "${search}"`);
                    }
                }
            }
        });

        // ---- System-Initialisierung ----
        function initSystem() {
            updateSidebar();
            renderApp('haldo-ai');
            updateTaskbar();
            updateStatus();

            setInterval(() => {
                const appId = currentApp;
                const storageEl = document.getElementById(`storageStatus-${appId}`);
                if (storageEl) {
                    const size = Math.round(Math.random() * 100 + 10);
                    storageEl.textContent = size + ' KB';
                }
                const dataEl = document.getElementById(`dataStatus-${appId}`);
                if (dataEl) {
                    const count = Math.round(Math.random() * 50 + 5);
                    dataEl.textContent = count + ' Einträge';
                }
                const activityEl = document.getElementById(`activityStatus-${appId}`);
                if (activityEl) {
                    activityEl.textContent = 'Jetzt';
                }
            }, 5000);

            console.log('🚀 HalDo AI OS v26.0 gestartet!');
            console.log(`📱 ${APP_IDS.length} Apps geladen.`);
            console.log('🌌 Kosmische Dimension aktiviert!');
            console.log('✨ System bereit.');
        }

        document.addEventListener('DOMContentLoaded', initSystem);

        console.log('✅ HalDo AI OS — Vollständige App-Welt mit Kosmos geladen!');
        console.log(`🏆 ${APP_IDS.length} Apps · Kosmische Kategorie integriert · v26.0`);
        console.log('🌞 Sonne · 🌍 Erde · 🌙 Mond · ⭐ Sterne · 🌈 Himmelsfarben');
    </script>
</body>
</html>
