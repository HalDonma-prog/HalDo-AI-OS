<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HalDo AI OS — Cosmic Intelligent OS</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a1a;
            --surface: rgba(16, 16, 40, 0.92);
            --text: #e0e0ff;
            --primary: #00d4ff;
            --secondary: #7b2ffc;
            --radius: 14px;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== BOOT ===== */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.2s ease;
            padding: 20px;
        }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo {
            font-size: clamp(3rem, 12vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 60px rgba(123, 47, 252, 0.5));
                transform: scale(1.05);
            }
        }
        #boot-status {
            margin-top: 16px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COSMIC CANVAS ===== */
        #cosmic {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ===== DISPLAY ===== */
        #display {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* ===== TOPBAR ===== */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            min-height: 40px;
            flex-shrink: 0;
        }
        #topbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #topbar-left .haldo-icon {
            font-weight: 700;
            color: var(--primary);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #topbar-left .haldo-icon img {
            width: clamp(28px, 5vw, 36px);
            height: clamp(28px, 5vw, 36px);
            border-radius: 50%;
            border: 2px solid var(--primary);
        }
        #topbar-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== APP CONTAINER ===== */
        #app-container {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow: hidden;
            touch-action: none;
        }

        /* ===== WINDOW ===== */
        .window {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.3s;
            min-width: 200px;
            min-height: 150px;
            max-width: 98vw;
            max-height: 90vh;
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.15);
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            cursor: grab;
            flex-shrink: 0;
            min-height: 36px;
            touch-action: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .win-btn {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.2s;
            touch-action: manipulation;
            min-width: 28px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .win-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        .win-btn.close:active {
            background: #ff4444;
            color: #fff;
        }
        .window-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }
        .window-body input,
        .window-body textarea,
        .window-body select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            margin-bottom: 10px;
            -webkit-appearance: none;
            appearance: none;
        }
        .window-body button {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
            min-height: 44px;
        }
        .window-body button:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
        .window-body .ai-quick {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            font-size: clamp(0.7rem, 1.4vw, 0.8rem);
            min-height: 36px;
        }
        .window-body .ai-quick:active {
            background: rgba(255, 255, 255, 0.15);
        }
        .window-body .moderation-warning {
            background: rgba(255, 200, 0, 0.1);
            border-left: 4px solid #ffcc00;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .window-body .moderation-danger {
            background: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #ff4444;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        /* ===== DOCK ===== */
        #dock {
            position: absolute;
            bottom: clamp(8px, 2vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: clamp(4px, 1vw, 10px);
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 18px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: nowrap;
            max-width: 98vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .dock-item {
            width: clamp(40px, 9vw, 52px);
            height: clamp(40px, 9vw, 52px);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3.5vw, 1.6rem);
            cursor: pointer;
            transition: 0.2s;
            border: none;
            color: #fff;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .dock-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: clamp(50px, 10vh, 70px);
            right: clamp(8px, 2vw, 20px);
            left: clamp(8px, 2vw, 20px);
            z-index: 999;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 14px 18px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: var(--shadow);
            animation: slideIn 0.4s ease;
            border-left: 4px solid var(--primary);
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
        }
        .notification.success {
            border-left-color: #44ff88;
        }
        .notification.error {
            border-left-color: #ff4444;
        }
        .notification.warning {
            border-left-color: #ffcc00;
        }
        @keyframes slideIn {
            from {
                transform: translateY(-120%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ===== LOGIN OVERLAY ===== */
        #login-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
        }
        #login-overlay.hidden {
            display: none;
        }
        #login-box {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 30px 24px;
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow);
        }
        #login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #login-box input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
        }
        #login-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            min-height: 48px;
        }
        #login-box button:active {
            transform: scale(0.97);
        }
        #login-box .login-error {
            color: #ff6666;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
        }
        #login-box .login-toggle {
            text-align: center;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #8899bb;
            cursor: pointer;
        }
        #login-box .login-toggle span {
            color: var(--primary);
        }

        /* ===== SCROLLBAR ===== */
        .window-body::-webkit-scrollbar {
            width: 4px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .window {
                border-radius: 12px;
                min-width: 160px;
                min-height: 120px;
            }
            .window-header {
                padding: 6px 10px;
                min-height: 32px;
            }
            .window-body {
                padding: 10px;
            }
            #topbar {
                padding: 4px 10px;
                min-height: 34px;
            }
            .win-btn {
                min-width: 24px;
                min-height: 24px;
                padding: 2px 6px;
            }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .window {
                max-height: 80vh;
            }
            #dock {
                bottom: 4px;
                padding: 4px 10px;
                gap: 4px;
            }
            .dock-item {
                width: 34px;
                height: 34px;
                font-size: 1rem;
                border-radius: 10px;
            }
            #topbar {
                min-height: 28px;
                padding: 2px 10px;
            }
            .window-header {
                min-height: 28px;
                padding: 4px 10px;
            }
            .window-body {
                padding: 8px;
            }
            .window-body button {
                min-height: 32px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- BOOT -->
        <div id="boot">
            <div id="boot-logo">⟡ HalDo</div>
            <div class="boot-spinner"></div>
            <div id="boot-status">⟡ System initialisiert ...</div>
        </div>

        <!-- LOGIN OVERLAY -->
        <div id="login-overlay">
            <div id="login-box">
                <h2>⟡ HalDo AI OS</h2>
                <input type="text" id="login-username" placeholder="Benutzername" />
                <input type="password" id="login-password" placeholder="Passwort" />
                <button id="login-btn">Anmelden / Registrieren</button>
                <div id="login-error" class="login-error"></div>
                <div class="login-toggle" id="login-toggle">⬇️ <span>Demo-Modus</span> (ohne Konto)</div>
            </div>
        </div>

        <!-- COSMIC CANVAS -->
        <canvas id="cosmic"></canvas>

        <!-- DISPLAY -->
        <div id="display">
            <!-- TOPBAR -->
            <div id="topbar">
                <div id="topbar-left">
                    <div class="haldo-icon" id="menu-system">
                        <span>⟡</span>
                        <span id="clock-display">--:--</span>
                    </div>
                </div>
                <div id="topbar-right">
                    <button class="top-btn" id="btn-appworld" aria-label="App World">📱</button>
                    <button class="top-btn" id="btn-theme" aria-label="Theme">🎨</button>
                    <button class="top-btn" id="btn-about" aria-label="Info">ℹ️</button>
                    <button class="top-btn" id="btn-logout" aria-label="Abmelden">🚪</button>
                </div>
            </div>

            <!-- APP CONTAINER -->
            <div id="app-container"></div>

            <!-- DOCK -->
            <div id="dock">
                <button class="dock-item" data-app="ai">🤖</button>
                <button class="dock-item" data-app="files">📁</button>
                <button class="dock-item" data-app="settings">⚙️</button>
                <button class="dock-item" data-app="cosmic">🌌</button>
                <button class="dock-item" data-app="notes">📝</button>
                <button class="dock-item" data-app="terminal">⌨️</button>
                <button class="dock-item" data-app="calendar">📅</button>
                <button class="dock-item" data-app="music">🎵</button>
                <button class="dock-item" data-app="security">🛡️</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  HALDO AI OS — ERWEITERTE VERSION
        //  Mit: Login/Registrierung, 2 Menüs, Moderation, 9 Apps
        //  Mobile-optimiert für alle Geräte
        // ================================================================

        (function() {
            'use strict';

            // ===== STATE =====
            const state = {
                apps: {},
                windows: [],
                windowZIndex: 100,
                activeWindow: null,
                theme: 'cosmic',
                language: 'de',
                booted: false,
                loggedIn: false,
                user: null,
                aiMemory: [],
                settings: {
                    theme: 'cosmic',
                    language: 'de',
                    voiceEnabled: false,
                    notifications: true,
                    moderationLevel: 'normal' // 'strict' | 'normal' | 'lenient'
                },
                moderationLog: []
            };

            // ===== DOM HELPERS =====
            const $ = (id) => document.getElementById(id);
            const boot = $('boot');
            const bootStatus = $('boot-status');
            const cosmicCanvas = $('cosmic');
            const appContainer = $('app-container');
            const dock = $('dock');
            const loginOverlay = $('login-overlay');
            const loginUsername = $('login-username');
            const loginPassword = $('login-password');
            const loginBtn = $('login-btn');
            const loginError = $('login-error');
            const loginToggle = $('login-toggle');

            // ===== COSMIC WORLD =====
            let stars = [];
            let particles = [];
            let cosmicRunning = false;
            let cosmicCtx = null;
            let cosmicW = 0,
                cosmicH = 0;

            function initCosmic() {
                const ctx = cosmicCanvas.getContext('2d');
                cosmicCtx = ctx;

                function resize() {
                    cosmicW = cosmicCanvas.width = window.innerWidth;
                    cosmicH = cosmicCanvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                stars = [];
                for (let i = 0; i < 150; i++) {
                    stars.push({
                        x: Math.random() * cosmicW,
                        y: Math.random() * cosmicH,
                        r: Math.random() * 2 + 0.5,
                        speed: Math.random() * 0.3 + 0.1,
                        brightness: Math.random() * 0.8 + 0.2,
                        phase: Math.random() * Math.PI * 2
                    });
                }

                particles = [];
                for (let i = 0; i < 35; i++) {
                    particles.push({
                        x: Math.random() * cosmicW,
                        y: Math.random() * cosmicH,
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: (Math.random() - 0.5) * 0.2,
                        r: Math.random() * 35 + 15,
                        alpha: Math.random() * 0.025 + 0.008,
                        hue: Math.random() * 60 + 220
                    });
                }

                cosmicRunning = true;
                animateCosmic();
            }

            function animateCosmic() {
                if (!cosmicRunning || !cosmicCtx) return;
                const ctx = cosmicCtx;
                const w = cosmicW,
                    h = cosmicH;

                ctx.clearRect(0, 0, w, h);

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
                    grad.addColorStop(0, `hsla(${p.hue}, 80%, 60%, ${p.alpha})`);
                    grad.addColorStop(1, `hsla(${p.hue}, 80%, 40%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                const time = Date.now() / 2000;
                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > h) { s.y = 0;
                        s.x = Math.random() * w; }
                    const bright = s.brightness * (0.7 + 0.3 * Math.sin(time + s.phase));
                    ctx.fillStyle = `rgba(255,255,255,${bright})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
                grad.addColorStop(0, 'rgba(0,212,255,0.015)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                requestAnimationFrame(animateCosmic);
            }

            // ===== BOOT =====
            function bootSequence() {
                const statuses = [
                    '⟡ Kernel lädt ...',
                    '⟡ System initialisiert ...',
                    '⟡ Cosmic World startet ...',
                    '⟡ Living AI wird geweckt ...',
                    '⟡ HalDo AI OS ist READY 🚀'
                ];

                let i = 0;
                const interval = setInterval(() => {
                    if (i < statuses.length) {
                        bootStatus.textContent = statuses[i];
                        i++;
                    } else {
                        clearInterval(interval);
                        boot.classList.add('hidden');
                        state.booted = true;
                        if (state.loggedIn) {
                            notify('🚀 HalDo AI OS erfolgreich gestartet!');
                            setTimeout(() => launchApp('ai'), 400);
                        }
                    }
                }, 500);
            }

            // ===== LOGIN / AUTH =====
            function initAuth() {
                const savedUser = localStorage.getItem('haldo_user');
                if (savedUser) {
                    try {
                        const user = JSON.parse(savedUser);
                        state.user = user;
                        state.loggedIn = true;
                        loginOverlay.classList.add('hidden');
                        bootSequence();
                        return;
                    } catch (e) {}
                }
                loginOverlay.classList.remove('hidden');
            }

            function handleLogin() {
                const username = loginUsername.value.trim();
                const password = loginPassword.value.trim();

                if (!username || !password) {
                    loginError.textContent = '❌ Bitte Benutzername und Passwort eingeben.';
                    return;
                }

                // Einfache Authentifizierung (Demo)
                const users = JSON.parse(localStorage.getItem('haldo_users') || '{}');
                if (users[username]) {
                    if (users[username] === password) {
                        // Login erfolgreich
                        state.user = { username };
                        state.loggedIn = true;
                        localStorage.setItem('haldo_user', JSON.stringify({ username }));
                        loginOverlay.classList.add('hidden');
                        loginError.textContent = '';
                        notify('👋 Willkommen, ' + username + '!');
                        bootSequence();
                    } else {
                        loginError.textContent = '❌ Falsches Passwort.';
                    }
                } else {
                    // Registrierung
                    users[username] = password;
                    localStorage.setItem('haldo_users', JSON.stringify(users));
                    state.user = { username };
                    state.loggedIn = true;
                    localStorage.setItem('haldo_user', JSON.stringify({ username }));
                    loginOverlay.classList.add('hidden');
                    loginError.textContent = '';
                    notify('✅ Konto erstellt! Willkommen, ' + username + '!');
                    bootSequence();
                }
            }

            function logout() {
                state.loggedIn = false;
                state.user = null;
                localStorage.removeItem('haldo_user');
                // Fenster schließen
                state.windows.forEach(w => { if (w.element) w.element.remove(); });
                state.windows = [];
                state.activeWindow = null;
                loginOverlay.classList.remove('hidden');
                loginUsername.value = '';
                loginPassword.value = '';
                loginError.textContent = '';
                notify('👋 Abgemeldet.');
            }

            // ===== WINDOW MANAGEMENT =====
            function getSafeWindowPosition() {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const w = Math.min(500, vw - 40);
                const h = Math.min(400, vh - 160);
                const x = Math.max(10, (vw - w) / 2);
                const y = Math.max(40, (vh - h) / 2 - 20);
                return { x, y, w, h };
            }

            function launchApp(id) {
                if (!state.loggedIn) {
                    notify('❌ Bitte zuerst anmelden.', 'warning');
                    return;
                }
                const app = state.apps[id];
                if (!app) {
                    notify(`❌ App "${id}" nicht gefunden`, 'error');
                    return;
                }

                const existing = state.windows.find(w => w.appId === id);
                if (existing) {
                    focusWindow(existing.id);
                    return;
                }

                const pos = getSafeWindowPosition();
                const winId = 'win-' + Date.now();
                const win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x + Math.random() * 20,
                    y: pos.y + Math.random() * 20,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null
                };

                state.windows.push(win);
                renderWindow(win);
                focusWindow(winId);

                if (app.render) {
                    const body = win.element.querySelector('.window-body');
                    app.render(body, win);
                }

                notify(`🔄 ${app.title || id} geöffnet`);
            }

            function renderWindow(win) {
                const existing = document.getElementById(win.id);
                if (existing) existing.remove();

                const el = document.createElement('div');
                el.id = win.id;
                el.className = 'window';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;

                el.innerHTML = `
                    <div class="window-header">
                        <span class="window-title">${win.icon} ${win.title}</span>
                        <div class="window-controls">
                            <button class="win-btn" data-action="minimize" aria-label="Minimieren">─</button>
                            <button class="win-btn" data-action="maximize" aria-label="Maximieren">⧉</button>
                            <button class="win-btn close" data-action="close" aria-label="Schließen">✕</button>
                        </div>
                    </div>
                    <div class="window-body"></div>
                `;

                appContainer.appendChild(el);
                win.element = el;

                // Controls
                el.querySelectorAll('.win-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        if (action === 'close') closeWindow(win.id);
                        else if (action === 'minimize') minimizeWindow(win.id);
                        else if (action === 'maximize') maximizeWindow(win.id);
                    });
                });

                // Drag
                const header = el.querySelector('.window-header');
                let drag = false,
                    startX, startY, origX, origY, isTouch = false;

                function startDrag(clientX, clientY) {
                    if (header.querySelector('.win-btn') && document.activeElement?.tagName === 'BUTTON') return;
                    drag = true;
                    startX = clientX;
                    startY = clientY;
                    origX = win.x;
                    origY = win.y;
                    focusWindow(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(clientX, clientY) {
                    if (!drag) return;
                    const dx = clientX - startX;
                    const dy = clientY - startY;
                    win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
                    win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() {
                    if (drag) { drag = false;
                        el.style.cursor = ''; }
                }

                header.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.win-btn')) return;
                    startDrag(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    moveDrag(e.clientX, e.clientY);
                });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    if (e.target.closest('.win-btn')) return;
                    isTouch = true;
                    startDrag(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', (e) => {
                    if (!drag || !isTouch) return;
                    const touch = e.touches[0];
                    moveDrag(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchend', () => {
                    if (isTouch) { isTouch = false;
                        endDrag(); }
                }, { passive: true });

                // Resize
                const resizeHandle = document.createElement('div');
                resizeHandle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:24px;height:24px;cursor:se-resize;touch-action:none;';
                el.appendChild(resizeHandle);

                let resize = false,
                    startW, startH, startX2, startY2;

                function startResize(clientX, clientY) {
                    resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = clientX;
                    startY2 = clientY;
                }

                function moveResize(clientX, clientY) {
                    if (!resize) return;
                    const dw = clientX - startX2,
                        dh = clientY - startY2;
                    win.width = Math.max(200, Math.min(window.innerWidth - win.x - 10, startW + dw));
                    win.height = Math.max(120, Math.min(window.innerHeight - win.y - 80, startH + dh));
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                resizeHandle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    startResize(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', (e) => {
                    if (!resize) return;
                    moveResize(e.clientX, e.clientY);
                });
                document.addEventListener('mouseup', endResize);

                resizeHandle.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    const touch = e.touches[0];
                    startResize(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', (e) => {
                    if (!resize) return;
                    const touch = e.touches[0];
                    moveResize(touch.clientX, touch.clientY);
                }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            }

            function closeWindow(winId) {
                const idx = state.windows.findIndex(w => w.id === winId);
                if (idx === -1) return;
                const win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) {
                    focusWindow(state.windows[state.windows.length - 1].id);
                }
            }

            function focusWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    state.windows.forEach(w => {
                        if (w.id !== winId && w.element) w.element.classList.remove('active');
                    });
                }
            }

            function minimizeWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (win && win.element) {
                    win.element.style.display = 'none';
                    notify(`⏬ ${win.title} minimiert`);
                }
            }

            function maximizeWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (!win || !win.element) return;
                if (win.width === window.innerWidth - 20) {
                    win.width = win._prevWidth || 500;
                    win.height = win._prevHeight || 400;
                    win.x = win._prevX || 20;
                    win.y = win._prevY || 40;
                } else {
                    win._prevWidth = win.width;
                    win._prevHeight = win.height;
                    win._prevX = win.x;
                    win._prevY = win.y;
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            }

            // ===== NOTIFICATION =====
            function notify(message, type = 'info') {
                const el = document.createElement('div');
                el.className = `notification ${type}`;
                el.textContent = message;
                document.body.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(-120%)';
                    setTimeout(() => el.remove(), 400);
                }, 2800);
            }

            // ===== THEME =====
            function applyTheme(theme) {
                const root = document.documentElement;
                if (theme === 'cosmic') {
                    root.style.setProperty('--bg', '#0a0a1a');
                    root.style.setProperty('--text', '#e0e0ff');
                    root.style.setProperty('--surface', 'rgba(16,16,40,0.92)');
                } else if (theme === 'dark') {
                    root.style.setProperty('--bg', '#0a0a0a');
                    root.style.setProperty('--text', '#ffffff');
                    root.style.setProperty('--surface', 'rgba(30,30,40,0.92)');
                } else if (theme === 'light') {
                    root.style.setProperty('--bg', '#e8e8f0');
                    root.style.setProperty('--text', '#1a1a2e');
                    root.style.setProperty('--surface', 'rgba(255,255,255,0.92)');
                }
                state.settings.theme = theme;
                localStorage.setItem('haldo_theme', theme);
            }

            function toggleTheme() {
                const themes = ['cosmic', 'dark', 'light'];
                const current = state.settings.theme;
                const next = themes[(themes.indexOf(current) + 1) % themes.length];
                applyTheme(next);
                notify(`🎨 Theme: ${next}`);
            }

            // ===== MODERATION =====
            function moderateContent(text) {
                const warnings = [];
                const patterns = [
                    { regex: /(?:hass|rassismus|antisemitismus|diskriminierung|bedrohung|gewaltaufruf)/i,
                        level: 'danger' },
                    { regex: /(?:beleidigung|beschimpfung|entmenschlichung)/i, level: 'warning' },
                    { regex: /(?:nazi|hitler|ss|fuck|scheiße)/i, level: 'warning' }
                ];

                patterns.forEach(p => {
                    if (p.regex.test(text)) {
                        warnings.push({ pattern: p.regex.source, level: p.level });
                    }
                });

                if (warnings.length > 0) {
                    const logEntry = {
                        timestamp: new Date().toISOString(),
                        text: text.substring(0, 200),
                        warnings: warnings,
                        user: state.user?.username || 'unknown'
                    };
                    state.moderationLog.push(logEntry);
                    localStorage.setItem('haldo_moderation_log', JSON.stringify(state.moderationLog));

                    if (warnings.some(w => w.level === 'danger')) {
                        notify('⚠️ Inhalt wurde moderiert. Bitte respektvoll bleiben.', 'error');
                        return { blocked: true, warnings };
                    } else {
                        notify('⚠️ Achtung: problematischer Inhalt erkannt.', 'warning');
                        return { blocked: false, warnings };
                    }
                }
                return { blocked: false, warnings: [] };
            }

            // ===== APP REGISTRATION =====

                state.apps[id] = { ...config, id, instance: null };

                                    <select id="settings-theme" style="width:100%;">
                                        <option value="cosmic" ${state.settings.theme === 'cosmic' ? 'selected' : ''}>🌌 Cosmic</option>
                                        <option value="dark" ${state.settings.theme === 'dark' ? 'selected' : ''}>🌙 Dark</option>
                                        <option value="light" ${state.settings.theme === 'light' ? 'selected' : ''}>☀️ Light</option>
                                    </select>
                                </div>
                                <div><label style="display:block;font-size:0.8rem;color:#8899bb;">Sprache</label>
                                    <select id="settings-language" style="width:100%;">
                                        <option value="de" ${state.settings.language === 'de' ? 'selected' : ''}>🇩🇪 Deutsch</option>
                                        <option value="en" ${state.settings.language === 'en' ? 'selected' : ''}>🇬🇧 English</option>
                                        <option value="ezidi" ${state.settings.language === 'ezidi' ? 'selected' : ''}>𒀭 Êzîdî</option>
                                        <option value="ku" ${state.settings.language === 'ku' ? 'selected' : ''}>🇰🇲 Kurmancî</option>
                                    </select>
                                </div>
                                <div><label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;">
                                    <input type="checkbox" id="settings-voice" ${state.settings.voiceEnabled ? 'checked' : ''} /> Sprachsteuerung
                                </label></div>
                                <div><label style="display:block;font-size:0.8rem;color:#8899bb;">Moderation</label>
                                    <select id="settings-moderation" style="width:100%;">
                                        <option value="strict" ${state.settings.moderationLevel === 'strict' ? 'selected' : ''}>🛡️ Streng</option>
                                        <option value="normal" ${state.settings.moderationLevel === 'normal' ? 'selected' : ''}>⚖️ Normal</option>
                                        <option value="lenient" ${state.settings.moderationLevel === 'lenient' ? 'selected' : ''}>🌿 Locker</option>
                                    </select>
                                </div>
                                <button id="settings-save" style="margin-top:6px;">💾 Speichern</button>
                                <div style="font-size:0.7rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px;">
                                    HalDo AI OS v20.0.0 · Benutzer: ${state.user?.username || 'Gast'}
                                </div>
                            </div>
                        `;
                        body.querySelector('#settings-save').addEventListener('click', () => {
                            state.settings.theme = body.querySelector('#settings-theme').value;
                            state.settings.language = body.querySelector('#settings-language').value;
                            state.settings.voiceEnabled = body.querySelector('#settings-voice').checked;
                            state.settings.moderationLevel = body.querySelector('#settings-moderation').value;
                            applyTheme(state.settings.theme);
                            notify('✅ Einstellungen gespeichert!');
                        });
                    }
                });

                // 4. Cosmic World
                registerApp('cosmic', {
                    title: 'Cosmic World',
                    icon: '🌌',
                    render: (body) => {
                        body.innerHTML = `
                            <div style="text-align:center;padding:10px;">
                                <div style="font-size:2.5rem;">🌌</div>
                                <h3 style="margin:6px 0;font-size:clamp(0.9rem,2vw,1.1rem);">Cosmic World</h3>
                                <p style="color:#8899bb;font-size:0.8rem;">Sterne & Nebel tanzen</p>
                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;">
                                    <button id="cosmic-stars">⭐ Sterne</button>
                                    <button id="cosmic-nebula">🌫️ Nebel</button>
                                    <button id="cosmic-rainbow">🌈 Regenbogen</button>
                                    <button id="cosmic-reset">🔄 Reset</button>
                                </div>
                                <div style="margin-top:10px;font-size:0.7rem;color:#8899bb;">
                                    🌠 ${stars.length} Sterne · ${particles.length} Partikel
                                </div>
                            </div>
                        `;
                        body.querySelector('#cosmic-stars').addEventListener('click', () => {
                            stars.forEach(s => s.brightness = 1.0);
                            notify('⭐ Sterne heller');
                        });
                        body.querySelector('#cosmic-nebula').addEventListener('click', () => {
                            particles.forEach(p => p.alpha = 0.06);
                            notify('🌫️ Nebel intensiv');
                        });
                        body.querySelector('#cosmic-rainbow').addEventListener('click', () => {
                            particles.forEach((p, i) => p.hue = (i * 10) % 360);
                            notify('🌈 Regenbogen');
                        });
                        body.querySelector('#cosmic-reset').addEventListener('click', () => {
                            location.reload();
                        });
                    }
                });

                // 5. Notes
                registerApp('notes', {
                    title: 'Notizen',
                    icon: '📝',
                    render: (body) => {
                        let notes = JSON.parse(localStorage.getItem('haldo_notes') || '[]');
                        body.innerHTML = `
                            <div style="display:flex;gap:6px;margin-bottom:10px;">
                                <input type="text" id="note-input" placeholder="📝 Notiz ..." style="flex:1;" />
                                <button id="note-add">➕</button>
                            </div>
                            <div id="note-list" style="display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;">
                                ${notes.map((n, i) => `
                                    <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.04);padding:6px 10px;border-radius:8px;font-size:0.85rem;">
                                        <span style="word-break:break-word;flex:1;">${n}</span>
                                        <button class="note-del" data-idx="${i}" style="background:none;border:none;color:#ff6666;cursor:pointer;padding:4px 8px;">✕</button>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        const input = body.querySelector('#note-input');

                        function renderNotes() {
                            const list = body.querySelector('#note-list');
                            list.innerHTML = notes.map((n, i) => `
                                <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.04);padding:6px 10px;border-radius:8px;font-size:0.85rem;">
                                    <span style="word-break:break-word;flex:1;">${n}</span>
                                    <button class="note-del" data-idx="${i}" style="background:none;border:none;color:#ff6666;cursor:pointer;padding:4px 8px;">✕</button>
                                </div>
                            `).join('');
                            list.querySelectorAll('.note-del').forEach(btn => {
                                btn.addEventListener('click', () => {
                                    const idx = parseInt(btn.dataset.idx);
                                    notes.splice(idx, 1);
                                    localStorage.setItem('haldo_notes', JSON.stringify(notes));
                                    renderNotes();
                                    notify('🗑️ Gelöscht');
                                });
                            });
                        }

                        body.querySelector('#note-add').addEventListener('click', () => {
                            const val = input.value.trim();
                            if (!val) return;
                            const mod = moderateContent(val);
                            if (mod.blocked) {
                                notify('⚠️ Notiz enthält problematischen Inhalt.', 'error');
                                return;
                            }
                            notes.push(val);
                            localStorage.setItem('haldo_notes', JSON.stringify(notes));
                            input.value = '';
                            renderNotes();
                        });
                        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') body.querySelector('#note-add')
                                .click(); });
                    }
                });

                // 6. Terminal
                registerApp('terminal', {
                    title: 'Terminal',
                    icon: '⌨️',
                    render: (body) => {
                        body.innerHTML = `
                            <div style="background:#050510;border-radius:8px;padding:10px;font-family:'Courier New',monospace;font-size:0.75rem;min-height:80px;max-height:200px;overflow-y:auto;" id="terminal-output">
                                <div style="color:#44ff88;">$ HalDo AI OS v20.0.0</div>
                                <div style="color:#8899bb;">$ ${navigator.platform}</div>
                                <div style="color:#8899bb;">$ Benutzer: ${state.user?.username || 'Gast'}</div>
                                <div style="color:#44ff88;">$ ready ></div>
                            </div>
                            <div style="display:flex;gap:6px;margin-top:6px;">
                                <input type="text" id="terminal-input" placeholder="$ Befehl ..." style="flex:1;font-family:'Courier New',monospace;font-size:0.75rem;" />
                                <button id="terminal-exec" style="padding:6px 12px;">⏎</button>
                            </div>
                        `;
                        const output = body.querySelector('#terminal-output');
                        const input = body.querySelector('#terminal-input');

                        function exec(cmd) {
                            const line = document.createElement('div');
                            line.style.color = '#44ff88';
                            line.textContent = `$ ${cmd}`;
                            output.appendChild(line);

                            const mod = moderateContent(cmd);
                            if (mod.blocked) {
                                const respLine = document.createElement('div');
                                respLine.style.color = '#ff6666';
                                respLine.textContent = '⚠️ Befehl aus Moderationsgründen abgelehnt.';
                                output.appendChild(respLine);
                                output.scrollTop = output.scrollHeight;
                                return;
                            }

                            let response = '';
                            if (cmd === 'help') response =
                                'help, version, apps, theme, clear, echo, date, whoami, user, sysinfo, ezidi, kurdish';
                            else if (cmd === 'version') response = 'HalDo AI OS 20.0.0 | Kernel 5.2.1';
                            else if (cmd === 'apps') response = 'Apps: ' + Object.keys(state.apps).join(', ');
                            else if (cmd === 'theme') response = `Theme: ${state.settings.theme}`;
                            else if (cmd === 'clear') { output.innerHTML = ''; return; }
                            else if (cmd.startsWith('echo ')) response = cmd.substring(5);
                            else if (cmd === 'date') response = new Date().toLocaleString();
                            else if (cmd === 'whoami') response = `Benutzer: ${state.user?.username || 'Gast'}`;
                            else if (cmd === 'user') response = `👤 ${state.user?.username || 'Nicht angemeldet'}`;
                            else if (cmd === 'sysinfo') response =
                                `OS: HalDo AI OS 20.0.0\nPlatform: ${navigator.platform}\nRAM: ${navigator.deviceMemory || '?'} GB\nTheme: ${state.settings.theme}`;
                            else if (cmd === 'ezidi') response =
                                '🟡 Êzîdî: Eine der ältesten monotheistischen Religionen. Sprache: Kurmanji (Kurdisch). Kultur: reich an Traditionen, Musik und Poesie.';
                            else if (cmd === 'kurdish') response =
                                '🇰🇲 Kurdisch (Kurmanji) wird von Êzîdî und Kurden gesprochen. Die Sprache hat mehrere Dialekte und eine reiche literarische Tradition.';
                            else if (cmd === '') return;
                            else response = `❌ Unbekannt: "${cmd}". Tipp: help`;
                            const respLine = document.createElement('div');
                            respLine.style.color = '#8899bb';
                            respLine.textContent = response;
                            output.appendChild(respLine);
                            output.scrollTop = output.scrollHeight;
                        }

                        body.querySelector('#terminal-exec').addEventListener('click', () => {
                            const val = input.value.trim();
                            if (val) exec(val);
                            input.value = '';
                        });
                        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') body.querySelector('#terminal-exec')
                                .click(); });
                    }
                });

                // 7. Calendar
                registerApp('calendar', {
                    title: 'Kalender',
                    icon: '📅',
                    render: (body) => {
                        const now = new Date();
                        const today = now.getDate();
                        const month = now.toLocaleString('de', { month: 'long' });
                        const year = now.getFullYear();
                        const days = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
                        body.innerHTML = `
                            <div style="text-align:center;">
                                <div style="font-size:1.2rem;font-weight:600;">${month} ${year}</div>
                                <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;font-size:0.7rem;color:#8899bb;">
                                    ${days.map(d => `<div style="text-align:center;">${d}</div>`).join('')}
                                </div>
                                <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px;">
                                    ${Array.from({length: 30}, (_, i) => i + 1).map(d => `
                                        <div style="text-align:center;padding:6px 0;border-radius:8px;${d === today ? 'background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;' : ''}font-size:0.85rem;">
                                            ${d}
                                        </div>
                                    `).join('')}
                                </div>
                                <div style="margin-top:8px;font-size:0.75rem;color:#8899bb;">📌 Heute: ${today}.${now.getMonth()+1}.${year}</div>
                                <div style="margin-top:4px;font-size:0.7rem;color:#8899bb;">🟡 Êzîdî-Feiertage: Çarşema Sor (Mittwoch der Roten) - 12. April</div>
                            </div>
                        `;
                    }
                });

                // 8. Music
                registerApp('music', {
                    title: 'Musik',
                    icon: '🎵',
                    render: (body) => {
                        const songs = [
                            '🌌 Cosmic Dreams - HalDo',
                            '🚀 Space Odyssey - HalDo',
                            '💫 Starlight - HalDo',
                            '🌙 Lunar Echo - HalDo',
                            '☀️ Solar Flare - HalDo',
                            '🟡 Ezidi Melody - Traditional',
                            '🇰🇲 Kurdish Dance - HalDo'
                        ];
                        body.innerHTML = `
                            <div style="display:flex;flex-direction:column;gap:6px;">
                                <div style="display:flex;gap:10px;justify-content:center;font-size:1.8rem;padding:8px 0;">
                                    <span style="cursor:pointer;">⏮</span>
                                    <span style="cursor:pointer;">▶️</span>
                                    <span style="cursor:pointer;">⏭</span>
                                    <span style="cursor:pointer;">🔊</span>
                                </div>
                                <div style="text-align:center;font-size:0.8rem;color:#8899bb;">🎵 Jetzt spielt: ${songs[0]}</div>
                                <div style="margin-top:6px;">
                                    ${songs.map(s => `
                                        <div style="padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:8px;margin:3px 0;font-size:0.8rem;display:flex;justify-content:space-between;cursor:pointer;" onclick="HalDo.notify('▶️ ${s}')">
                                            <span>${s}</span>
                                            <span style="color:#8899bb;">▶</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                });

                // 9. Security / Moderation Center
                registerApp('security', {
                    title: 'Sicherheit & Moderation',
                    icon: '🛡️',
                    render: (body) => {
                        const logs = JSON.parse(localStorage.getItem('haldo_moderation_log') || '[]');
                        body.innerHTML = `
                            <div style="display:flex;flex-direction:column;gap:10px;">
                                <div style="display:flex;align-items:center;gap:10px;">
                                    <span style="font-size:1.5rem;">🛡️</span>
                                    <div>
                                        <div style="font-weight:600;">Sicherheitscenter</div>
                                        <div style="font-size:0.75rem;color:#8899bb;">Moderation: ${state.settings.moderationLevel}</div>
                                    </div>
                                </div>
                                <div style="background:rgba(255,255,255,0.03);border-radius:8px;padding:10px;">
                                    <div style="font-size:0.8rem;color:#8899bb;">📋 Moderation-Log (${logs.length} Einträge)</div>
                                    ${logs.slice(-5).reverse().map(log => `
                                        <div style="font-size:0.7rem;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
                                            <span style="color:#8899bb;">${new Date(log.timestamp).toLocaleString()}</span>
                                            <span style="color:#ffcc00;">⚠️</span>
                                            <span>${log.user}</span>
                                            <span style="color:#8899bb;">: "${log.text.substring(0,40)}..."</span>
                                        </div>
                                    `).join('') || '<div style="font-size:0.8rem;color:#8899bb;">Keine Einträge</div>'}
                                </div>
                                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                    <button id="sec-clear" style="flex:1;">🗑️ Log leeren</button>
                                    <button id="sec-export" style="flex:1;">📤 Exportieren</button>
                                </div>
                                <div style="font-size:0.7rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px;">
                                    🔒 Geschützte Daten · Nur für autorisierte Nutzer
                                </div>
                            </div>
                        `;
                        body.querySelector('#sec-clear').addEventListener('click', () => {
                            if (confirm('Moderation-Log wirklich leeren?')) {
                                localStorage.removeItem('haldo_moderation_log');
                                state.moderationLog = [];
                                notify('🗑️ Log geleert.');
                                body.querySelector('#sec-clear').closest('.window-body').innerHTML =
                                    body.innerHTML;
                            }
                        });
                        body.querySelector('#sec-export').addEventListener('click', () => {
                            const data = JSON.stringify(state.moderationLog, null, 2);
                            const blob = new Blob([data], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'haldo_moderation_log.json';
                            a.click();
                            notify('📤 Export gestartet');
                        });
                    }
                });
            }

            // ===== CLOCK =====
            function updateClock() {
                const el = document.getElementById('clock-display');
                if (el) {
                    el.textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                }
            }

            // ===== MENUS =====
            function showSystemMenu() {
                if (!state.loggedIn) { notify('❌ Bitte zuerst anmelden.', 'warning'); return; }
                notify('⚙️ System-Menü: Dateien · Einstellungen · Apps · Suche · AI · Sprache · Tastatur · Theme · Benutzer · Datenschutz · Sicherheit · Speicher · Benachrichtigungen · Updates · Backup · Wiederherstellung · Systeminfo');
                launchApp('settings');
            }

            function showAppWorld() {
                if (!state.loggedIn) { notify('❌ Bitte zuerst anmelden.', 'warning'); return; }
                const appList = Object.keys(state.apps).map(id =>
                    `${state.apps[id].icon} ${state.apps[id].title}`).join('\n');
                notify('📱 App World: ' + appList);
                // App World als Fenster öffnen
                if (!state.windows.find(w => w.appId === 'appworld')) {
                    launchApp('appworld');
                }
            }

            // App World als eigene App registrieren
            registerApp('appworld', {
                title: 'App World',
                icon: '📱',
                render: (body) => {
                    const apps = Object.entries(state.apps).filter(([id]) => id !== 'appworld');
                    body.innerHTML = `
                        <h3 style="margin-bottom:10px;">📱 HalDo App World</h3>
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;">
                            ${apps.map(([id, app]) => `
                                <div style="background:rgba(255,255,255,0.04);padding:12px;border-radius:10px;text-align:center;cursor:pointer;" onclick="HalDo.launchApp('${id}')">
                                    <div style="font-size:1.8rem;">${app.icon}</div>
                                    <div style="font-size:0.7rem;margin-top:4px;">${app.title}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div style="margin-top:12px;font-size:0.7rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px;">
                            ${apps.length} Apps installiert · HalDo AI OS v20.0.0
                        </div>
                    `;
                }
            });

            // ===== ABOUT =====
            function showAbout() {
                notify(
                    '⟡ HalDo AI OS v20.0.0 — Cosmic Intelligent OS\n💙 Für alle Geräte optimiert\n🛡️ Mit Moderation & Schutz für Minderheiten\n🌍 Êzîdî · Kurdisch · Deutsch · Englisch');
            }

            // ===== INIT =====
            function init() {
                // Theme laden
                const savedTheme = localStorage.getItem('haldo_theme') || 'cosmic';
                applyTheme(savedTheme);

                // Apps definieren
                defineApps();

                // Cosmic starten
                initCosmic();

                // Uhr
                updateClock();
                setInterval(updateClock, 10000);

                // Auth
                initAuth();

                // Dock-Events
                dock.querySelectorAll('.dock-item').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const appId = btn.dataset.app;
                        launchApp(appId);
                    });
                });

                // Topbar Buttons
                document.getElementById('menu-system').addEventListener('click', showSystemMenu);
                document.getElementById('btn-appworld').addEventListener('click', showAppWorld);
                document.getElementById('btn-theme').addEventListener('click', toggleTheme);
                document.getElementById('btn-about').addEventListener('click', showAbout);
                document.getElementById('btn-logout').addEventListener('click', logout);

                // Login
                loginBtn.addEventListener('click', handleLogin);
                loginUsername.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginPassword.focus(); });
                loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
                loginToggle.addEventListener('click', () => {
                    // Demo-Modus: Gast-Login
                    state.user = { username: 'Gast' };
                    state.loggedIn = true;
                    localStorage.setItem('haldo_user', JSON.stringify({ username: 'Gast' }));
                    loginOverlay.classList.add('hidden');
                    loginError.textContent = '';
                    notify('👋 Willkommen, Gast!');
                    bootSequence();
                });

                // Globale API
                window.HalDo = {
                    notify,
                    toggleTheme,
                    showAbout,
                    launchApp,
                    state,
                    moderateContent,
                    logout,
                    showSystemMenu,
                    showAppWorld
                };

                console.log('⟡ HalDo AI OS v20.0.0');
                console.log('🌌 Cosmic Intelligent OS');
                console.log('🛡️ Mit Schutz vor Hass & Diskriminierung');
                console.log('🌍 Êzîdî · Kurdisch · Deutsch · Englisch');
                console.log('💡 HalDo.launchApp("ai")');
            }

            // ===== START =====
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
