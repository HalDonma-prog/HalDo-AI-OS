<script>

"use strict";


(function () {

    const HD =
        window.HalDo ||
        {};


    /* =========================================================
       FULLSCREEN FOUNDATION
       ========================================================= */

    HD.fullscreen =
        HD.fullscreen ||
        {};


    HD.fullscreen.active =
        !!document.fullscreenElement;


    HD.fullscreen.supported =
        !!(
            document.documentElement
                ?.requestFullscreen ||
            document.documentElement
                ?.webkitRequestFullscreen
        );


    HD.fullscreen.enter =
        async function () {

            if (
                !this.supported
            ) {

                return false;

            }


            try {

                if (
                    document.documentElement
                        .requestFullscreen
                ) {

                    await document.documentElement
                        .requestFullscreen();

                }
                else if (
                    document.documentElement
                        .webkitRequestFullscreen
                ) {

                    document.documentElement
                        .webkitRequestFullscreen();

                }


                this.active =
                    true;


                HD.eventBridge?.emit(
                    "fullscreen:changed",
                    {
                        active:
                            true
                    }
                );


                return true;

            }
            catch (
                error
            ) {

                HD.system?.log?.(
                    "warn",
                    "Fullscreen konnte nicht aktiviert werden.",
                    error
                );


                return false;

            }

        };


    HD.fullscreen.exit =
        async function () {

            try {

                if (
                    document.exitFullscreen
                ) {

                    await document.exitFullscreen();

                }
                else if (
                    document.webkitExitFullscreen
                ) {

                    document.webkitExitFullscreen();

                }


                this.active =
                    false;


                HD.eventBridge?.emit(
                    "fullscreen:changed",
                    {
                        active:
                            false
                    }
                );


                return true;

            }
            catch (
                error
            ) {

                return false;

            }

        };


    HD.fullscreen.toggle =
        async function () {

            if (
                document.fullscreenElement
            ) {

                return this.exit();

            }


            return this.enter();

        };


    document.addEventListener(
        "fullscreenchange",
        function () {

            HD.fullscreen.active =
                !!document.fullscreenElement;


            HD.eventBridge?.emit(
                "fullscreen:changed",
                {
                    active:
                        HD.fullscreen.active
                }
            );

        }
    );


    /* =========================================================
       RESPONSIVE DISPLAY FOUNDATION
       ========================================================= */

    HD.display =
        HD.display ||
        {};


    HD.display.update =
        function () {

            const root =
                document.documentElement;


            if (
                !root
            ) {

                return;

            }


            const width =
                window.innerWidth ||
                document.documentElement
                    .clientWidth ||
                0;


            const height =
                window.innerHeight ||
                document.documentElement
                    .clientHeight ||
                0;


            const orientation =
                width >= height
                    ? "landscape"
                    : "portrait";


            let device =
                "desktop";


            if (
                width <= 600
            ) {

                device =
                    "phone";

            }
            else if (
                width <= 1024
            ) {

                device =
                    "tablet";

            }


            root.dataset.haldoWidth =
                String(
                    width
                );


            root.dataset.haldoHeight =
                String(
                    height
                );


            root.dataset.haldoOrientation =
                orientation;


            root.dataset.haldoDevice =
                device;


            root.classList.toggle(
                "haldo-phone",
                device ===
                "phone"
            );


            root.classList.toggle(
                "haldo-tablet",
                device ===
                "tablet"
            );


            root.classList.toggle(
                "haldo-desktop",
                device ===
                "desktop"
            );


            root.classList.toggle(
                "haldo-landscape",
                orientation ===
                "landscape"
            );


            root.classList.toggle(
                "haldo-portrait",
                orientation ===
                "portrait"
            );


            HD.eventBridge?.emit(
                "display:changed",
                {
                    width:
                        width,

                    height:
                        height,

                    orientation:
                        orientation,

                    device:
                        device
                }
            );

        };


    window.addEventListener(
        "resize",
        HD.display.update,
        {
            passive:
                true
        }
    );


    window.addEventListener(
        "orientationchange",
        HD.display.update,
        {
            passive:
                true
        }
    );


    HD.display.update();


    /* =========================================================
       VIEWPORT NORMALIZATION
       ========================================================= */

    HD.display.viewport =
        function () {

            const visualViewport =
                window.visualViewport;


            if (
                visualViewport
            ) {

                document.documentElement
                    .style.setProperty(
                        "--haldo-viewport-width",
                        visualViewport.width +
                        "px"
                    );


                document.documentElement
                    .style.setProperty(
                        "--haldo-viewport-height",
                        visualViewport.height +
                        "px"
                    );

            }
            else {

                document.documentElement
                    .style.setProperty(
                        "--haldo-viewport-width",
                        window.innerWidth +
                        "px"
                    );


                document.documentElement
                    .style.setProperty(
                        "--haldo-viewport-height",
                        window.innerHeight +
                        "px"
                    );

            }

        };


    HD.display.viewport();


    if (
        window.visualViewport
    ) {

        window.visualViewport.addEventListener(
            "resize",
            function () {

                HD.display.viewport();

            },
            {
                passive:
                    true
            }
        );

    }


    /* =========================================================
       APP VIEWPORT BRIDGE
       ========================================================= */

    HD.display.fit =
        function (
            element
        ) {

            if (
                !element
            ) {

                return false;

            }


            element.style.maxWidth =
                "100%";


            element.style.maxHeight =
                "100%";


            element.style.boxSizing =
                "border-box";


            return true;

        };


    /* =========================================================
       FINAL UI STATE
       ========================================================= */

    HD.ui =
        HD.ui ||
        {};


    HD.ui.ready =
        true;


    HD.ui.setBusy =
        function (
            busy
        ) {

            document.documentElement
                .classList.toggle(
                    "haldo-busy",
                    busy ===
                    true
                );


            HD.eventBridge?.emit(
                "ui:busy",
                {
                    busy:
                        busy ===
                        true
                }
            );

        };


    /* =========================================================
       FINAL BOOT PROGRESS
       ========================================================= */

    HD.boot?.setProgress?.(
        99,
        "final-ui"
    );


    HD.eventBridge?.emit(
        "ui:ready",
        {
            fullscreen:
                HD.fullscreen.supported,

            display:
                true,

            responsive:
                true
        }
    );


})();

</script>

<script>

"use strict";


(function () {

    const HD =
        window.HalDo ||
        {};


    /* =========================================================
       FINAL SYSTEM STATE
       ========================================================= */

    HD.systemState =
        HD.systemState ||
        {};


    HD.systemState.booted =
        false;


    HD.systemState.ready =
        false;


    HD.systemState.version =
        HD.version ||
        "22.0.0";


    HD.systemState.startedAt =
        Date.now();


    /* =========================================================
       FINAL DISPLAY UPDATE
       ========================================================= */

    if (
        HD.display?.update
    ) {

        HD.display.update();

    }


    if (
        HD.display?.viewport
    ) {

        HD.display.viewport();

    }


    /* =========================================================
       FINAL THEME UPDATE
       ========================================================= */

    if (
        HD.theme?.apply
    ) {

        HD.theme.apply(
            HD.theme.current ||
            "cosmic"
        );

    }


    /* =========================================================
       FINAL LANGUAGE UPDATE
       ========================================================= */

    if (
        HD.language?.set
    ) {

        HD.language.set(
            HD.language.current ||
            "de-DE"
        );

    }


    /* =========================================================
       FINAL BOOT FUNCTION
       ========================================================= */

    HD.finalBoot =
        async function () {

            if (
                this.systemState.ready
            ) {

                return true;

            }


            HD.eventBridge?.emit(
                "system:final-boot-start",
                {}
            );


            try {

                /*
                 * App Registry aktualisieren
                 */

                if (
                    HD.appRegistry?.initialize
                ) {

                    await HD.appRegistry.initialize();

                }


                /*
                 * Launcher vorbereiten
                 */

                if (
                    HD.launcher?.initialize
                ) {

                    await HD.launcher.initialize();

                }


                /*
                 * Router vorbereiten
                 */

                if (
                    HD.router?.initialize
                ) {

                    await HD.router.initialize();

                }


                /*
                 * AI vorbereiten
                 */

                if (
                    HD.ai?.ready ===
                    false &&
                    HD.aiCore?.initialize
                ) {

                    await HD.aiCore.initialize();

                }


                /*
                 * Service Worker Update prüfen
                 */

                if (
                    HD.pwa?.registered &&
                    HD.pwa?.checkUpdate
                ) {

                    HD.pwa.checkUpdate();

                }


                /*
                 * Endgültiger Display-Refresh
                 */

                HD.display?.update?.();

                HD.display?.viewport?.();


                /*
                 * Systemstatus
                 */

                this.systemState.booted =
                    true;


                this.systemState.ready =
                    true;


                /*
                 * Fortschritt 100 %
                 */

                HD.boot?.setProgress?.(
                    100,
                    "ready"
                );


                HD.eventBridge?.emit(
                    "system:ready",
                    {
                        version:
                            this.systemState.version,

                        startedAt:
                            this.systemState.startedAt,

                        ready:
                            true
                    }
                );


                /*
                 * DOM Ready Marker
                 */

                document.documentElement
                    .setAttribute(
                        "data-haldo-ready",
                        "true"
                    );


                document.body?.setAttribute(
                    "data-haldo-ready",
                    "true"
                );


                return true;

            }
            catch (
                error
            ) {

                HD.system?.log?.(
                    "error",
                    "Finaler HalDo AI OS Boot fehlgeschlagen.",
                    error
                );


                HD.eventBridge?.emit(
                    "system:ready-error",
                    {
                        error:
                            error
                    }
                );


                return false;

            }

        };


    /* =========================================================
       START AFTER DOM READY
       ========================================================= */

    const start =
        function () {

            HD.finalBoot();

        };


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            start,
            {
                once:
                    true
            }
        );

    }
    else {

        setTimeout(
            start,
            0
        );

    }


    /* =========================================================
       VISIBILITY RECOVERY
       ========================================================= */

    document.addEventListener(
        "visibilitychange",
        function () {

            if (
                document.visibilityState ===
                "visible"
            ) {

                HD.display?.update?.();

                HD.display?.viewport?.();

                HD.eventBridge?.emit(
                    "system:resume",
                    {}
                );

            }

        }
    );


    /* =========================================================
       ONLINE / OFFLINE STATE
       ========================================================= */

    window.addEventListener(
        "online",
        function () {

            document.documentElement
                .classList.remove(
                    "haldo-offline"
                );


            HD.eventBridge?.emit(
                "network:online",
                {}
            );

        }
    );


    window.addEventListener(
        "offline",
        function () {

            document.documentElement
                .classList.add(
                    "haldo-offline"
                );


            HD.eventBridge?.emit(
                "network:offline",
                {}
            );

        }
    );


    /* =========================================================
       INITIAL NETWORK STATE
       ========================================================= */

    document.documentElement
        .classList.toggle(
            "haldo-offline",
            navigator.onLine ===
            false
        );


    /* =========================================================
       FINAL GLOBAL API
       ========================================================= */

    window.HalDo =
        HD;


    window.HalDoOS =
        window.HalDoOS ||
        {};


    window.HalDoOS.version =
        HD.version ||
        "22.0.0";


    window.HalDoOS.ready =
        function () {

            return (
                HD.systemState?.ready ===
                true
            );

        };


    /* =========================================================
       FINAL EVENT
       ========================================================= */

    HD.eventBridge?.emit(
        "index:complete",
        {
            version:
                HD.version ||
                "22.0.0"
        }
    );


})();

</script>
