<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalDo AI OS — Masterplan A–Z</title>
    <style>
        /* ============================================================
           HALDO AI OS — GLOBAL STYLES
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121f;
            --bg-card: rgba(255,255,255,0.02);
            --border-color: rgba(255,255,255,0.03);
            --text-primary: #e0e0e0;
            --text-secondary: rgba(255,255,255,0.3);
            --text-muted: rgba(255,255,255,0.05);
            --accent-1: #f6d365;
            --accent-2: #fda085;
            --accent-3: #f093fb;
            --accent-4: #4facfe;
            --accent-5: #43e97b;
            --radius: 16px;
            --transition: 0.3s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.1); }

        /* ============================================================
           LAYOUT: DESKTOP
           ============================================================ */
        .haldo-desktop {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
           TASKBAR
           ============================================================ */
        .taskbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 16px;
            height: 44px;
            background: rgba(10,10,18,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 100;
        }
        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .taskbar-logo {
            font-weight: 800;
            font-size: 0.9rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }
        .taskbar-logo span { color: rgba(255,255,255,0.05); -webkit-text-fill-color: rgba(255,255,255,0.05); }
        .taskbar-center {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            max-width: 500px;
            margin: 0 16px;
        }
        .taskbar-center .app-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.15);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .taskbar-center .app-icon:hover {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.3);
        }
        .taskbar-center .app-icon.active {
            background: rgba(79,172,254,0.08);
            color: var(--accent-4);
        }
        .taskbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .taskbar-right .time {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           WORKSPACE
           ============================================================ */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
           SIDEBAR (App Drawer / Launcher)
           ============================================================ */
        .sidebar {
            width: 52px;
            background: rgba(18,18,31,0.6);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            gap: 2px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }
        .sidebar .app-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.1);
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .sidebar .app-btn:hover {
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.3);
        }
        .sidebar .app-btn.active {
            background: rgba(79,172,254,0.06);
            color: var(--accent-4);
        }
        .sidebar .app-btn .tooltip {
            position: absolute;
            left: 52px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10,10,18,0.9);
            backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.6rem;
            color: var(--text-secondary);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }
        .sidebar .app-btn:hover .tooltip { opacity: 1; }

        /* ============================================================
           APP CONTAINER
           ============================================================ */
        .app-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            position: relative;
            background: var(--bg-primary);
        }

        /* ============================================================
           APP VIEW (Die aktuelle App)
           ============================================================ */
        .app-view {
            display: none;
            height: 100%;
            animation: fadeIn 0.25s ease;
        }
        .app-view.active {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .app-view .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .app-view .app-header .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .app-view .app-header .title .emoji { margin-right: 8px; }
        .app-view .app-header .actions {
            display: flex;
            gap: 6px;
        }
        .app-view .app-header .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }
        .app-view .app-header .actions button:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }
        .app-view .app-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ============================================================
           APP CARD (für Dashboard / App-Übersicht)
           ============================================================ */
        .app-grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .app-grid-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .app-grid-item:hover {
            background: rgba(255,255,255,0.03);
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.05);
        }
        .app-grid-item .emoji { font-size: 2.4rem; display: block; margin-bottom: 4px; }
        .app-grid-item .name { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }
        .app-grid-item .desc { font-size: 0.6rem; color: var(--text-muted); margin-top: 2px; }

        /* ============================================================
           SYSTEM-STATUS / FOOTER
           ============================================================ */
        .system-status {
            display: flex;
            justify-content: space-between;
            padding: 4px 16px;
            background: rgba(10,10,18,0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            font-size: 0.55rem;
            color: var(--text-muted);
            flex-shrink: 0;
            height: 26px;
            align-items: center;
        }
        .system-status .highlight { color: rgba(255,255,255,0.08); }

        /* ============================================================
           WINDOW MANAGER (für modale Fenster innerhalb der App)
           ============================================================ */
        .haldo-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .haldo-modal.active { display: flex; }
        .haldo-modal .modal-content {
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .haldo-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .haldo-modal .modal-header .title { font-weight: 600; color: var(--text-secondary); }
        .haldo-modal .modal-header .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }
        .haldo-modal .modal-header .close-btn:hover { color: #ff6b6b; }
        .haldo-modal .modal-body { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .sidebar { width: 44px; }
            .sidebar .app-btn { width: 34px; height: 34px; font-size: 0.9rem; }
            .taskbar-center { max-width: 200px; }
            .taskbar-logo { font-size: 0.7rem; }
            .app-grid-view { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }
        @media (max-width: 480px) {
            .taskbar-center { display: none; }
            .taskbar { padding: 4px 8px; }
            .app-container { padding: 8px; }
        }
    </style>
</head>
<body>

        <div class="taskbar">

                category: 'System',

                icon: '⚙️',
                color: '#f6d365'
            }
        };

        // ---- App IDs für die Sidebar ----
        const APP_IDS = Object.keys(APP_REGISTRY);

        // ---- State ----
        let currentApp = 'system';
        let appHistory = [];
        let systemMemory = 0;
        let appInstances = {};

        // ---- DOM Refs ----
        const sidebar = document.getElementById('sidebar');
        const appContainer = document.getElementById('appContainer');
        const appViewContainer = document.getElementById('appViewContainer');
        const taskbarApps = document.getElementById('taskbarApps');
        const taskbarTime = document.getElementById('taskbarTime');
        const statusAppCount = document.getElementById('statusAppCount');
        const statusMemory = document.getElementById('statusMemory');

        // ---- Modal ----
        const modal = document.getElementById('haldoModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        function openModal(title, bodyHTML) {
            modalTitle.textContent = title;
            modalBody.innerHTML = bodyHTML;
            modal.classList.add('active');
        }
        function closeModal() {
            modal.classList.remove('active');
        }
        window.closeModal = closeModal;

        // ---- Uhr ----
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            taskbarTime.textContent = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ---- App Renderer ----
        function renderApp(appId) {
            const app = APP_REGISTRY[appId];
            if (!app) return;

            currentApp = appId;
            appHistory.push(appId);
            if (appHistory.length > 20) appHistory.shift();

            // App-View Container leeren
            appViewContainer.innerHTML = '';

            // App-View erstellen
            const view = document.createElement('div');
            view.className = 'app-view active';
            view.id = `app-${appId}`;

            // Header
            const header = document.createElement('div');
            header.className = 'app-header';
            header.innerHTML = `
                <div class="title"><span class="emoji">${app.emoji}</span>${app.name}</div>
                <div class="actions">
                    <button onclick="showAppInfo('${appId}')">ℹ️</button>
                    <button onclick="openAppSettings('${appId}')">⚙️</button>
                </div>
            `;
            view.appendChild(header);

            // Content
            const content = document.createElement('div');
            content.className = 'app-content';
            content.id = `app-content-${appId}`;
            content.innerHTML = generateAppContent(appId);
            view.appendChild(content);

            appViewContainer.appendChild(view);

            // Sidebar aktualisieren
            updateSidebar();
            updateTaskbar();
            updateStatus();

                return `

                app: appId,
                name: app.name,
                data: { example: 'Daten', timestamp: Date.now() },
                version: '1.0'
            };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${appId}_data_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            openModal('📤 Export', `✅ Daten von "${app.name}" wurden exportiert.`);
        }
        window.exportAppData = exportAppData;

        // ---- Import ----
        function importAppData(appId) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        openModal('📥 Import', `
                            ✅ Daten für "${data.name || appId}" importiert.
                            <br><br>
                            📊 ${Object.keys(data.data || {}).length} Einträge geladen.
                            <br>
                            🕐 ${new Date(data.timestamp).toLocaleString()}
                        `);
                    } catch (err) {
                        openModal('❌ Fehler', `Import fehlgeschlagen: ${err.message}`);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        window.importAppData = importAppData;

        // ---- AI Actions ----
        function aiAction(appId, action) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            const messages = {
                'zusammenfassen': `🧠 KI fasst den Inhalt von "${app.name}" zusammen ...`,
                'übersetzen': `🌍 KI übersetzt den Inhalt von "${app.name}" ...`,
                'analysieren': `🔍 KI analysiert den Inhalt von "${app.name}" ...`,
                'generieren': `✨ KI generiert neuen Inhalt für "${app.name}" ...`
            };
            openModal(`🧠 AI-Aktion — ${app.name}`, `
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <div style="padding:12px;background:rgba(79,172,254,0.02);border-radius:8px;border:1px solid rgba(79,172,254,0.05);">
                        ${messages[action] || '🧠 AI verarbeitet ...'}
                    </div>
                    <div style="color:var(--text-muted);font-size:0.7rem;">
                        ⏳ Verarbeitung abgeschlossen.
                    </div>
                    <button onclick="closeModal()" style="padding:6px 16px;border:none;border-radius:6px;background:rgba(255,255,255,0.02);color:var(--text-secondary);cursor:pointer;font-family:var(--font);">Schließen</button>
                </div>
            `);
        }
        window.aiAction = aiAction;

        // ---- Voice Actions ----
        function voiceAction(appId, action) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            const status = {
                'start': '🎤 Sprachaufnahme gestartet ...',
                'stop': '⏹️ Sprachaufnahme beendet.',
                'status': '📊 Voice-Status: Bereit · Mikrofon: 🟢 Aktiv'
            };
            openModal(`🎤 Voice — ${app.name}`, `
                <div style="padding:12px;background:rgba(43,233,123,0.02);border-radius:8px;border:1px solid rgba(43,233,123,0.05);">
                    ${status[action] || '🎤 Voice-Aktion ausgeführt.'}
                </div>
                <button onclick="closeModal()" style="margin-top:8px;padding:6px 16px;border:none;border-radius:6px;background:rgba(255,255,255,0.02);color:var(--text-secondary);cursor:pointer;font-family:var(--font);">Schließen</button>
            `);
        }
        window.voiceAction = voiceAction;

        // ---- System-Initialisierung ----
        function initSystem() {
            updateSidebar();
            renderApp('system');
            updateTaskbar();
            updateStatus();

            // Speicher-Status simulieren
            setInterval(() => {
                const appId = currentApp;
                const storageEl = document.getElementById(`storageStatus-${appId}`);
                if (storageEl) {
                    const size = Math.round(Math.random() * 100 + 10);
                    storageEl.textContent = size + ' KB';
                }
                const dataEl = document.getElementById(`dataStatus-${appId}`);
                if (dataEl) {
                    const count = Math.round(Math.random() * 50 + 5);
                    dataEl.textContent = count + ' Einträge';
                }
                const activityEl = document.getElementById(`activityStatus-${appId}`);
                if (activityEl) {
                    activityEl.textContent = 'Jetzt';
                }
            }, 5000);

            console.log('🚀 HalDo AI OS v26.0 gestartet!');
            console.log(`📱 ${Object.keys(APP_REGISTRY).length} Apps geladen.`);
            console.log('✨ System bereit.');
        }

        // ---- Starte das System ----
        document.addEventListener('DOMContentLoaded', initSystem);

        // ---- Tastatur-Shortcuts ----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const search = prompt('🔍 App suchen:', '');
                if (search) {
                    const found = APP_IDS.filter(id =>
                        APP_REGISTRY[id].name.toLowerCase().includes(search.toLowerCase()) ||
                        APP_REGISTRY[id].description.toLowerCase().includes(search.toLowerCase())
                    );
                    if (found.length > 0) {
                        switchApp(found[0]);
                    } else {
                        openModal('🔍 Suche', `Keine App gefunden für: "${search}"`);
                    }
                }
            }
        });

        console.log('✅ HalDo AI OS — Masterplan A–Z geladen!');
        console.log('🏆 26 Kern-Apps · Vollständige Systemstruktur');
        console.log('🔗 Alle Apps haben: UI, Navigation, Funktionen, AI, Voice, Storage, Import/Export, Einstellungen, Berechtigungen, Fehlerbehandlung');
    </script>
</body>
</html>
