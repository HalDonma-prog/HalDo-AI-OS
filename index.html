<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050816">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HalDo AI OS v22.1.1</title>

    <style>
        /* =========================================================
           HALDO AI OS v22.1.1 — MASTER STYLES
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --haldo-primary: #ffd54b;
            --haldo-secondary: #ff9f1c;
            --haldo-bg: #02030a;
            --haldo-surface: rgba(10,14,30,0.92);
            --haldo-border: rgba(255,255,255,.08);
            --haldo-text: #ffffff;
            --haldo-radius: 16px;
            --haldo-shadow: 0 20px 60px rgba(0,0,0,.5);
            --haldo-font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--haldo-bg);
            color: var(--haldo-text);
            font-family: var(--haldo-font);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button, input, textarea, select {
            font: inherit;
        }

        button {
            border: 0;
            outline: none;
            cursor: pointer;
        }

        /* =========================================================
           SCROLLBAR
           ========================================================= */

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.15);
            border-radius: 10px;
        }

        /* =========================================================
           MASTER DISPLAY
           ========================================================= */

        #haldo-os {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, rgba(35,73,150,.16), transparent 30%),
                        radial-gradient(circle at 20% 20%, rgba(70,110,255,.08), transparent 30%),
                        radial-gradient(circle at 80% 80%, rgba(150,70,255,.07), transparent 32%),
                        var(--haldo-bg);
        }

        /* =========================================================
           COSMIC BACKGROUND
           ========================================================= */

        .haldo-cosmic-world {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(circle at center, rgba(15,30,75,.28), transparent 42%);
        }

        .haldo-space {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.025), transparent 52%);
        }

        /* =========================================================
           STARS
           ========================================================= */

        .haldo-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .haldo-star {
            position: absolute;
            display: block;
            border-radius: 50%;
            background: rgba(255,255,255,.95);
            box-shadow: 0 0 5px rgba(255,255,255,.9);
            animation: haldo-star-twinkle 4s ease-in-out infinite;
        }

        @keyframes haldo-star-twinkle {
            0%, 100% { opacity: .25; transform: scale(.75); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* =========================================================
           COSMIC CENTER
           ========================================================= */

        .haldo-cosmic-center {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(88vw, 900px);
            height: min(88vw, 900px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* =========================================================
           ORBIT SYSTEM
           ========================================================= */

        .haldo-orbit-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .haldo-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(120,175,255,.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(70,150,255,.05);
            animation: haldo-orbit-pulse 7s ease-in-out infinite;
        }

        @keyframes haldo-orbit-pulse {
            0%, 100% { opacity: .45; }
            50% { opacity: .85; }
        }

        .haldo-planet {
            position: absolute;
            left: 50%;
            top: -7px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            background: radial-gradient(circle at 30% 25%, #ffffff, #8fc8ff 28%, #3263bd 62%, #0d1c43 100%);
            box-shadow: 0 0 10px rgba(80,170,255,.8);
            animation: haldo-planet-glow 3s ease-in-out infinite;
        }

        @keyframes haldo-planet-glow {
            0%, 100% { box-shadow: 0 0 8px rgba(80,170,255,.55); }
            50% { box-shadow: 0 0 18px rgba(120,200,255,.95); }
        }

        .haldo-planet-earth {
            background: radial-gradient(circle at 35% 30%, #dff8ff, #4ca9ff 20%, #1267bd 48%, #06325e 70%, #020a18 100%);
            box-shadow: 0 0 14px rgba(50,160,255,.95);
        }

        .haldo-moon-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(255,255,255,.12);
            border-radius: 50%;
            animation: haldo-moon-orbit 4s linear infinite;
        }

        .haldo-moon {
            position: absolute;
            left: 50%;
            top: -3px;
            width: 6px;
            height: 6px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #aeb8c7 55%, #525a68 100%);
            box-shadow: 0 0 7px rgba(255,255,255,.7);
        }

        @keyframes haldo-moon-orbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* =========================================================
           SUN — LEBENDIGES HALDO LOGO
           ========================================================= */

        .haldo-sun-container {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(200px, 26vw, 340px);
            height: clamp(200px, 26vw, 340px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
            cursor: pointer;
        }

        .haldo-sun-core {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 25px rgba(255,220,70,.95), 0 0 70px rgba(255,165,40,.72), 0 0 130px rgba(255,100,20,.38);
            animation: haldo-sun-breathe 4s ease-in-out infinite;
        }

        @keyframes haldo-sun-breathe {
            0%, 100% { transform: scale(.98); }
            50% { transform: scale(1.035); }
        }

        .haldo-solar-rays {
            position: absolute;
            inset: -42%;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, rgba(255,246,180,.0) 0deg, rgba(255,246,180,.0) .75deg, rgba(255,224,94,.72) 1deg, rgba(255,160,35,.12) 2deg, rgba(255,246,180,.0) 3deg, rgba(255,246,180,.0) 5deg);
            filter: blur(1px);
            animation: haldo-solar-rays 26s linear infinite;
            pointer-events: none;
        }

        @keyframes haldo-solar-rays {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .haldo-solar-aura {
            position: absolute;
            inset: -25%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,240,130,.28), rgba(255,174,35,.13) 38%, rgba(255,100,30,.05) 58%, transparent 72%);
            filter: blur(18px);
            animation: haldo-solar-breathe 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes haldo-solar-breathe {
            0%, 100% { transform: scale(.94); opacity: .72; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* =========================================================
           LEBENDIGES HALDO LOGO IM SUN-ZENTRUM
           ========================================================= */

        .haldo-living-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 52%;
            height: 52%;
            transform: translate(-50%, -50%);
            z-index: 30;
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .haldo-living-logo .logo-aura {
            position: absolute;
            inset: -10%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.3), rgba(255,220,100,.2) 35%, rgba(100,190,255,.1) 55%, transparent 75%);
            filter: blur(10px);
            animation: haldo-logo-aura 3.5s ease-in-out infinite;
        }

        @keyframes haldo-logo-aura {
            0%, 100% { opacity: .5; transform: scale(.92); }
            50% { opacity: 1; transform: scale(1.08); }
        }

        .haldo-living-logo img {
            position: relative;
            z-index: 4;
            width: 85%;
            height: 85%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            filter: drop-shadow(0 0 8px rgba(255,255,255,.85)) drop-shadow(0 0 22px rgba(255,205,70,.72));
            animation: haldo-logo-living 4.2s ease-in-out infinite;
            border-radius: 50%;
        }

        @keyframes haldo-logo-living {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(-3px) scale(1.015) rotate(0.5deg); }
            50% { transform: translateY(0) scale(1.025) rotate(0deg); }
            75% { transform: translateY(2px) scale(1.01) rotate(-0.5deg); }
        }

        .haldo-living-logo .hand {
            position: absolute;
            width: 22%;
            height: 22%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.5), rgba(255,200,100,.2) 50%, transparent 70%);
            filter: blur(1px);
            opacity: .6;
            animation: haldo-hand-move 3.8s ease-in-out infinite;
        }

        .haldo-living-logo .hand-left {
            left: -8%;
            top: 30%;
            animation-delay: 0s;
        }

        .haldo-living-logo .hand-right {
            right: -8%;
            top: 30%;
            animation-delay: 1.9s;
        }

        @keyframes haldo-hand-move {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(0, -8px) scale(1.1); }
        }

        .haldo-living-logo[data-state="listening"] img {
            animation: haldo-logo-listening 1.6s ease-in-out infinite;
        }

        .haldo-living-logo[data-state="thinking"] img {
            animation: haldo-logo-thinking 2.2s ease-in-out infinite;
        }

        .haldo-living-logo[data-state="speaking"] img {
            animation: haldo-logo-speaking .6s ease-in-out infinite;
        }

        .haldo-living-logo[data-state="happy"] img {
            animation: haldo-logo-happy .7s ease-out 1;
        }

        @keyframes haldo-logo-listening {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes haldo-logo-thinking {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }

        @keyframes haldo-logo-speaking {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.045); }
        }

        @keyframes haldo-logo-happy {
            0% { transform: scale(.92); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* =========================================================
           MENÜ BUTTONS
           ========================================================= */

        .haldo-menu-button {
            position: fixed;
            z-index: 9500;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(8,12,30,0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all .25s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,.3);
        }

        .haldo-menu-button:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,.12);
            border-color: rgba(255,200,80,.3);
        }

        .haldo-menu-button img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-menu-button.system {
            top: 16px;
            left: 16px;
        }

        .haldo-menu-button.apps {
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
        }

        .haldo-menu-button.apps:hover {
            transform: translateX(-50%) scale(1.05);
        }

        /* =========================================================
           MENÜ PANELS
           ========================================================= */

        .haldo-menu-panel {
            position: fixed;
            z-index: 9600;
            width: min(420px, calc(100vw - 24px));
            max-height: min(75vh, calc(100dvh - 100px));
            overflow-y: auto;
            padding: 16px;
            border-radius: 20px;
            background: var(--haldo-surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--haldo-border);
            box-shadow: var(--haldo-shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(.96);
            transition: all .3s ease;
            color: #fff;
        }

        .haldo-menu-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .haldo-menu-panel.system-panel {
            top: 72px;
            left: 16px;
        }

        .haldo-menu-panel.apps-panel {
            bottom: 76px;
            left: 50%;
            transform: translateX(-50%) translateY(12px) scale(.96);
        }

        .haldo-menu-panel.apps-panel.open {
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .haldo-menu-panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--haldo-border);
            margin-bottom: 12px;
        }

        .haldo-menu-panel-header img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-menu-panel-header .title {
            font-size: 16px;
            font-weight: 700;
            flex: 1;
        }

        .haldo-menu-panel-header .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,.06);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .haldo-menu-panel-header .close-btn:hover {
            background: rgba(255,80,80,.2);
        }

        /* =========================================================
           MENÜ ITEMS
           ========================================================= */

        .haldo-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.04);
            color: rgba(255,255,255,.85);
            cursor: pointer;
            transition: all .2s ease;
            margin-bottom: 6px;
        }

        .haldo-menu-item:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,200,80,.15);
            transform: translateX(3px);
        }

        .haldo-menu-item .icon {
            font-size: 20px;
            width: 32px;
            text-align: center;
        }

        .haldo-menu-item .info {
            flex: 1;
            min-width: 0;
        }

        .haldo-menu-item .info .name {
            font-size: 13px;
            font-weight: 600;
        }

        .haldo-menu-item .info .desc {
            font-size: 10px;
            opacity: .5;
            margin-top: 2px;
        }

        /* =========================================================
           AI CHAT WINDOW
           ========================================================= */

        .haldo-ai-chat-window {
            position: fixed;
            z-index: 9000;
            width: min(540px, calc(100vw - 24px));
            height: min(620px, calc(100vh - 40px));
            right: 18px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 24px;
            background: var(--haldo-surface);
            backdrop-filter: blur(28px);
            box-shadow: var(--haldo-shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(18px) scale(.97);
            transition: opacity .25s ease, transform .25s ease, visibility .25s;
            color: #fff;
        }

        .haldo-ai-chat-window.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .haldo-ai-chat-window.minimized {
            height: 60px;
            min-height: 60px;
        }

        .haldo-ai-chat-window.minimized .haldo-chat-body,
        .haldo-ai-chat-window.minimized .haldo-chat-footer {
            display: none;
        }

        .haldo-chat-header {
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px 8px 18px;
            cursor: grab;
            user-select: none;
            border-bottom: 1px solid var(--haldo-border);
        }

        .haldo-chat-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .haldo-chat-title img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-chat-subtitle {
            font-size: 11px;
            opacity: .55;
            margin-top: 2px;
        }

        .haldo-chat-controls {
            display: flex;
            gap: 4px;
        }

        .haldo-chat-control {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 9px;
            background: rgba(255,255,255,.07);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        .haldo-chat-control:hover {
            background: rgba(255,255,255,.14);
        }

        .haldo-chat-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .haldo-chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .haldo-chat-message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            word-break: break-word;
            animation: haldoMessageIn .25s ease-out;
        }

        .haldo-chat-message-user {
            align-self: flex-end;
            background: rgba(255,255,255,.12);
            border-bottom-right-radius: 4px;
        }

        .haldo-chat-message-ai {
            align-self: flex-start;
            background: rgba(255,220,140,.10);
            border: 1px solid rgba(255,255,255,.07);
            border-bottom-left-radius: 4px;
        }

        .haldo-chat-typing {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 0 16px 8px;
        }

        .haldo-chat-typing.active {
            display: flex;
        }

        .haldo-chat-typing span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: .35;
            animation: haldoTypingDot 1s ease-in-out infinite;
        }

        .haldo-chat-typing span:nth-child(2) { animation-delay: .12s; }
        .haldo-chat-typing span:nth-child(3) { animation-delay: .24s; }

        @keyframes haldoTypingDot {
            0%, 100% { transform: translateY(0); opacity: .3; }
            50% { transform: translateY(-4px); opacity: .9; }
        }

        @keyframes haldoMessageIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .haldo-chat-footer {
            padding: 10px 12px 14px;
            border-top: 1px solid var(--haldo-border);
        }

        .haldo-chat-input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .haldo-chat-input {
            flex: 1;
            min-height: 44px;
            max-height: 150px;
            resize: none;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            padding: 11px 14px;
            background: rgba(255,255,255,.06);
            color: #fff;
            font: inherit;
            outline: none;
            line-height: 1.4;
        }

        .haldo-chat-input:focus {
            border-color: rgba(255,255,255,.25);
        }

        .haldo-chat-input::placeholder {
            color: rgba(255,255,255,.3);
        }

        .haldo-chat-send,
        .haldo-chat-voice {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            border: 0;
            border-radius: 13px;
            background: rgba(255,255,255,.08);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            transition: all .2s ease;
        }

        .haldo-chat-send:hover,
        .haldo-chat-voice:hover {
            background: rgba(255,255,255,.15);
        }

        .haldo-chat-voice.listening {
            background: rgba(255,80,80,.25);
            box-shadow: 0 0 20px rgba(255,80,80,.15);
        }

        /* =========================================================
           APP WINDOWS
           ========================================================= */

        .haldo-app-window {
            position: fixed;
            z-index: 9999;
            width: min(500px, 92vw);
            max-height: 75vh;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--haldo-surface);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: var(--haldo-shadow);
            overflow: auto;
            color: #fff;
            animation: haldoAppWindowIn .25s ease-out;
        }

        @keyframes haldoAppWindowIn {
            from { opacity: 0; transform: translate(-50%, -45%) scale(.96); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .haldo-app-window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--haldo-border);
        }

        .haldo-app-window-header .title {

    ========================================================= -->

    <script>
        // =========================================================
        // HALDO AI OS v22.1.1 — TEIL 2: CORE + EVENT + CONFIG + STORAGE
        // =========================================================

        "use strict";

        console.log("🧠 Teil 2 wird geladen — Core + Event + Config + Storage");

        // =========================================================
        // 1. EVENT BUS (Zentrale Kommunikation)
        // =========================================================

        if (!window.HalDo) window.HalDo = {};

        window.HalDo.events = window.HalDo.events || new EventTarget();

        window.HalDo.emit = function(name, detail = {}) {
            window.HalDo.events.dispatchEvent(new CustomEvent(name, { detail }));
        };

        window.HalDo.on = function(name, callback) {
            if (typeof callback !== "function") return;
            window.HalDo.events.addEventListener(name, callback);
        };

        window.HalDo.off = function(name, callback) {
            window.HalDo.events.removeEventListener(name, callback);
        };

        window.HalDo.once = function(name, callback) {
            const wrapper = function(e) {
                callback(e);
                window.HalDo.off(name, wrapper);
            };
            window.HalDo.on(name, wrapper);
        };

        // =========================================================
        // 2. CONFIG SYSTEM
        // =========================================================

        window.HalDo.Config = {
            defaults: {
                version: window.HALDO_VERSION,
                language: 'de',
                theme: 'dark',
                voiceEnabled: true,
                voiceLanguage: 'de-DE',
                autoStartChat: true,
                animations: true,
                notifications: true,
                aiModel: 'haldo-local',
                windowOpacity: 0.92,
                fontSize: 'medium',
                accentColor: '#ffd54b'
            },

            get(key) {
                return this._getFromStorage(key) || this.defaults[key];
            },

            set(key, value) {
                this._setToStorage(key, value);
                window.HalDo.emit("config:changed", { key, value });
                return true;
            },

            getAll() {
                const result = {};
                Object.keys(this.defaults).forEach(key => {
                    result[key] = this.get(key);
                });
                return result;
            },

            reset(key) {
                if (key) {
                    this._removeFromStorage(key);
                    return this.defaults[key];
                }
                Object.keys(this.defaults).forEach(k => this.reset(k));
                return true;
            },

            _getFromStorage(key) {
                try {
                    const val = localStorage.getItem('haldo_config_' + key);
                    if (val === null) return null;
                    try { return JSON.parse(val); } catch(e) { return val; }
                } catch(e) { return null; }
            },

            _setToStorage(key, value) {
                try {
                    localStorage.setItem('haldo_config_' + key, JSON.stringify(value));
                } catch(e) {}
            },

            _removeFromStorage(key) {
                try {
                    localStorage.removeItem('haldo_config_' + key);
                } catch(e) {}
            }
        };

        // =========================================================
        // 3. STORAGE SYSTEM (PERSISTENZ)
        // =========================================================

        window.HalDo.Storage = {
            prefix: "haldo_",

            get(key, defaultValue = null) {
                try {
                    const value = localStorage.getItem(this.prefix + key);
                    if (value === null) return defaultValue;
                    try { return JSON.parse(value); } catch(e) { return value; }
                } catch(e) { return defaultValue; }
            },

            set(key, value) {
                try {
                    localStorage.setItem(this.prefix + key, JSON.stringify(value));
                    return true;
                } catch(e) { return false; }
            },

            remove(key) {
                try {
                    localStorage.removeItem(this.prefix + key);
                    return true;
                } catch(e) { return false; }
            },

            clear() {
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
                    return true;
                } catch(e) { return false; }
            },

            getAll() {
                const result = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try {
                            result[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k));
                        } catch(e) {
                            result[k.replace(this.prefix, '')] = localStorage.getItem(k);
                        }
                    });
                } catch(e) {}
                return result;
            },

            has(key) {
                try {
                    return localStorage.getItem(this.prefix + key) !== null;
                } catch(e) { return false; }
            }
        };

        // =========================================================
        // 4. HALDO CORE
        // =========================================================

        window.HalDo.Core = {
            initialized: false,
            version: window.HALDO_VERSION,
            build: window.HALDO_BUILD,
            releaseDate: window.HALDO_RELEASE,
            startTime: Date.now(),

            init() {
                if (this.initialized) return this;
                this.initialized = true;
                this.startTime = Date.now();
                console.log("🧠 HalDo Core v" + this.version + " initialisiert");
                window.HalDo.emit("core:ready", { version: this.version });
                return this;
            },

            getUptime() {
                return Math.floor((Date.now() - this.startTime) / 1000);
            },

            getStatus() {
                return {
                    version: this.version,
                    build: this.build,
                    releaseDate: this.releaseDate,
                    uptime: this.getUptime(),
                    initialized: this.initialized
                };
            },

            restart() {
                console.log("🔄 Core wird neu gestartet...");
                window.HalDo.emit("core:restart");
                this.startTime = Date.now();
                return true;
            }
        };

        // =========================================================
        // 5. BOOT — TEIL 2
        // =========================================================

        function haldoBootPart2() {
            window.HalDo.Core.init();

            // Lade Config
            const config = window.HalDo.Config.getAll();
            console.log("⚙️ Config geladen:", config);

            window.HalDo.emit("haldo:part2:ready", { version: window.HALDO_VERSION });

            console.log("✅ Teil 2 geladen — Core + Event + Config + Storage");
            console.log("📌 Warte auf Teil 3 (App Registry + App Manager + Window Manager + Router)");
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", haldoBootPart2, { once: true });
        } else {
            haldoBootPart2();
        }
    </script>

<!-- =========================================================
    HALDO AI OS v22.1.1 — TEIL 2: APP REGISTRY + APP MANAGER + WINDOW MANAGER + ROUTER
    ========================================================= -->

    <script>
        "use strict";

        console.log("📦 Teil 2 wird geladen — App Registry + App Manager + Window Manager + Router");

        // =========================================================
        // 1. APP REGISTRY (ALLE APPS REGISTRIEREN)
        // =========================================================

        if (!window.HalDo) window.HalDo = {};

        window.HalDo.AppRegistry = {
            apps: new Map(),
            categories: {},
            installed: new Set(),

            register(app) {
                if (!app || !app.id) {
                    console.warn("[HalDo AppRegistry] App ohne ID", app);
                    return false;
                }

                // Prüfe ob bereits registriert
                if (this.apps.has(app.id)) {
                    console.warn(`[HalDo AppRegistry] App "${app.id}" bereits registriert`);
                    return false;
                }

                const normalized = {
                    ...app,
                    registeredAt: Date.now(),
                    status: 'registered',
                    version: app.version || '1.0.0',
                    category: app.category || 'Allgemein'
                };

                this.apps.set(app.id, normalized);

                // Kategorie-Index
                if (!this.categories[normalized.category]) {
                    this.categories[normalized.category] = [];
                }
                this.categories[normalized.category].push(app.id);

                console.log(`✅ App "${normalized.name || app.id}" registriert`);
                window.HalDo.emit("app:registered", { appId: app.id, app: normalized });
                return true;
            },

            get(id) {
                return this.apps.get(id) || null;
            },

            getAll() {
                return Array.from(this.apps.values());
            },

            getByCategory(category) {
                return (this.categories[category] || []).map(id => this.apps.get(id)).filter(Boolean);
            },

            getCategories() {
                return Object.keys(this.categories);
            },

            search(query) {
                const q = query.toLowerCase().trim();
                if (!q) return this.getAll();
                return this.getAll().filter(app =>
                    app.id.toLowerCase().includes(q) ||
                    (app.name && app.name.toLowerCase().includes(q)) ||
                    (app.description && app.description.toLowerCase().includes(q)) ||
                    (app.category && app.category.toLowerCase().includes(q))
                );
            },

            install(id) {
                const app = this.get(id);
                if (!app) return false;
                if (this.installed.has(id)) return true;

                app.status = 'installed';
                app.installedAt = Date.now();
                this.installed.add(id);
                window.HalDo.Storage.set('app_installed_' + id, true);
                window.HalDo.emit("app:installed", { appId: id, app });
                console.log(`📦 App "${app.name || id}" installiert`);
                return true;
            },

            uninstall(id) {
                const app = this.get(id);
                if (!app) return false;
                if (!this.installed.has(id)) return true;

                app.status = 'registered';
                this.installed.delete(id);
                window.HalDo.Storage.remove('app_installed_' + id);
                window.HalDo.emit("app:uninstalled", { appId: id, app });
                console.log(`🗑️ App "${app.name || id}" deinstalliert`);
                return true;
            },

            isInstalled(id) {
                return this.installed.has(id) || window.HalDo.Storage.get('app_installed_' + id, false);
            },

            loadInstalled() {
                this.getAll().forEach(app => {
                    if (window.HalDo.Storage.get('app_installed_' + app.id, false)) {
                        app.status = 'installed';
                        this.installed.add(app.id);
                    }
                });
                console.log(`📂 ${this.installed.size} Apps geladen`);
                return this.installed.size;
            },

            getInstalled() {
                return this.getAll().filter(app => this.installed.has(app.id));
            }
        };

        // =========================================================
        // 2. APP MANAGER (EINZIGER APP MANAGER)
        // =========================================================

        window.HalDo.AppManager = {
            activeApps: new Map(),
            recentApps: [],
            maxRecent: 20,

            open(appId, options = {}) {
                const app = window.HalDo.AppRegistry.get(appId);
                if (!app) {
                    console.warn(`[HalDo AppManager] App "${appId}" nicht gefunden`);
                    return null;
                }

                // Installiere wenn nötig
                if (!window.HalDo.AppRegistry.isInstalled(appId)) {
                    window.HalDo.AppRegistry.install(appId);
                }

                // Wenn bereits offen, fokussieren
                if (this.activeApps.has(appId)) {
                    this.focus(appId);
                    return this.activeApps.get(appId);
                }

                const instance = {
                    appId: appId,
                    app: app,
                    openedAt: Date.now(),
                    window: null,
                    data: options.data || {},
                    status: 'starting'
                };

                this.activeApps.set(appId, instance);

                // Recent Apps aktualisieren
                this.recentApps = this.recentApps.filter(id => id !== appId);
                this.recentApps.unshift(appId);
                if (this.recentApps.length > this.maxRecent) this.recentApps.pop();
                window.HalDo.Storage.set('recent_apps', this.recentApps);

                window.HalDo.emit("app:opened", { appId, instance });
                console.log(`🚀 App "${app.name}" geöffnet`);

                // Spezialfall: Chat / AI
                if (appId === 'haldo-ai' || appId === 'ai-chat' || appId === 'chat') {
                    if (window.HalDo.Chat) window.HalDo.Chat.open();
                    instance.status = 'running';
                    return instance;
                }

                // App als Fenster öffnen
                this.openAppWindow(app, instance);
                instance.status = 'running';

                return instance;
            },

            openAppWindow(app, instance) {
                const content = this.getAppContent(app.id);
                const title = app.name || app.id;
                const icon = app.icon || '📱';

                const win = document.createElement("div");
                win.className = "haldo-app-window";
                win.dataset.appWindow = app.id;
                win.dataset.instanceId = instance.appId;
                win.style.zIndex = "99999";

                win.innerHTML = `
                    <div class="haldo-app-window-header">
                        <span class="title">
                            <span style="font-size:20px;">${icon}</span>
                            ${title}
                        </span>
                        <button class="haldo-app-window-close">×</button>
                    </div>
                    <div class="haldo-app-window-body">
                        ${content}
                    </div>
                `;

                document.body.appendChild(win);
                instance.window = win;

                // Schließen-Button
                win.querySelector(".haldo-app-window-close").addEventListener("click", () => {
                    this.close(app.id);
                });

                // Klick außerhalb schließt nicht (nur Button)
                win.addEventListener("click", (e) => {
                    if (e.target === win) this.close(app.id);
                });

                // App-spezifische Logik initialisieren
                this.initAppLogic(app.id, win);

                return instance;

                // Fallback für nicht definierte Apps

                // Generische App-Ansicht
                return `
                    <div style="padding:20px;text-align:center;">
                        <div style="font-size:48px;margin-bottom:12px;">📱</div>
                        <div style="font-size:20px;font-weight:700;">${appId.charAt(0).toUpperCase() + appId.slice(1)}</div>
                        <div style="opacity:.5;margin-top:8px;">Diese App wird vorbereitet.</div>
                        <div style="margin-top:16px;opacity:.3;font-size:12px;">Version: 1.0.0</div>
                        <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                            <button onclick="window.HalDo.AppManager.close('${appId}')" style="padding:8px 16px;border-radius:8px;background:rgba(255,80,80,.15);color:#ff6b6b;cursor:pointer;">Schließen</button>

                        </div>
                    </div>
                `;
            },

            initAppLogic(appId, win) {
                // === CALCULATOR ===
                if (appId === 'calculator') {
                    let display = win.querySelector("#calc-display");
                    let expression = "";
                    win.querySelectorAll("[data-calc]").forEach(btn => {
                        btn.addEventListener("click", () => {
                            const val = btn.dataset.calc;
                            if (val === "C") { expression = ""; display.textContent = "0"; }
                            else if (val === "⌫") { expression = expression.slice(0,-1); display.textContent = expression || "0"; }
                            else if (val === "=") {
                                try {
                                    const result = Function('"use strict"; return (' + expression.replace('×','*').replace('÷','/').replace('−','-') + ')')();
                                    display.textContent = result;
                                    expression = String(result);
                                } catch(e) { display.textContent = "Fehler"; expression = ""; }
                            }
                            else { expression += val; display.textContent = expression; }
                        });
                    });
                }

                // === NOTES ===
                if (appId === 'notes') {
                    let notes = window.HalDo.Storage.get('notes', []);
                    const list = win.querySelector("#note-list");
                    const titleInput = win.querySelector("#note-title");
                    const contentInput = win.querySelector("#note-content");
                    const saveBtn = win.querySelector("#note-save");

                    function renderNotes() {
                        if (!list) return;
                        list.innerHTML = notes.map((n, i) => `
                            <div style="padding:8px 12px;background:rgba(255,255,255,.05);border-radius:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,.05);">
                                <div style="flex:1;cursor:pointer;" onclick="document.getElementById('note-title').value='${n.title.replace(/'/g,"\\'")}';document.getElementById('note-content').value='${n.content.replace(/'/g,"\\'")}'">
                                    <strong style="color:white;font-size:13px;">${n.title || 'Ohne Titel'}</strong>
                                    <div style="color:rgba(255,255,255,.5);font-size:11px;">${n.content?.substring(0,60) || ''}</div>
                                </div>
                                <button data-index="${i}" class="note-delete" style="padding:3px 10px;border:none;border-radius:6px;background:rgba(255,87,87,.2);color:#ff5f57;cursor:pointer;font-size:12px;">✕</button>
                            </div>
                        `).join('');

                        list.querySelectorAll(".note-delete").forEach(btn => {
                            btn.addEventListener("click", (e) => {
                                const idx = parseInt(e.target.dataset.index);
                                notes.splice(idx, 1);
                                window.HalDo.Storage.set('notes', notes);
                                renderNotes();
                            });
                        });
                    }

                    if (saveBtn) {
                        saveBtn.addEventListener("click", () => {
                            const title = titleInput?.value?.trim() || "Ohne Titel";

                        en: ['q','w','e','r','t','y','u','i','o','p','a','s','d','f','g','h','j','k','l','z','x','c','v','b','n','m'],
                        ku: ['q','w','e','r','t','y','u','i','o','p','a','s','d','f','g','h','j','k','l','ê','î','û','ş','ẍ','ç','ɛ','ə','ḧ','']

            close(appId) {
                const instance = this.activeApps.get(appId);
                if (!instance) return false;

                if (instance.window) {
                    instance.window.remove();

                this.activeApps.delete(appId);
                window.HalDo.emit("app:closed", { appId });

            focus(appId) {

                if (!instance) return false;
                if (instance.window) {
                    instance.window.style.zIndex = "99999";
                }
                window.HalDo.emit("app:focused", { appId });
                return true;
            },

            getActiveApps() {
                return Array.from(this.activeApps.values());
            },

            isRunning(appId) {
                return this.activeApps.has(appId);
            },

            closeAll() {
                const ids = Array.from(this.activeApps.keys());
                ids.forEach(id => this.close(id));
                return ids.length;
            }

        // =========================================================
        // 3. WINDOW MANAGER (EINZIGER WINDOW MANAGER)
        // =========================================================

        window.HalDo.WindowManager = {
            windows: [],
            zIndex: 9000,
            maxWindows: 20,

            create(options = {}) {
                const id = options.id || `window-${Date.now()}`;

                // Maximale Fenster begrenzen
                if (this.windows.length >= this.maxWindows) {
                    const oldest = this.windows[0];
                    if (oldest) this.close(oldest.id);
                }

                const win = {
                    id: id,
                    title: options.title || 'Fenster',
                    content: options.content || '',
                    appId: options.appId || null,
                    x: options.x || (50 + this.windows.length * 24),
                    y: options.y || (50 + this.windows.length * 18),
                    width: options.width || 480,
                    height: options.height || 400,
                    zIndex: ++this.zIndex,
                    minimized: false,
                    maximized: false,
                    element: null,
                    created: Date.now()
                };

                this.windows.push(win);
                this.render(win);
                window.HalDo.emit("window:created", { window: win });
                return win;
            },

            render(win) {
                const el = document.createElement("div");
                el.className = "haldo-window";
                el.dataset.windowId = win.id;
                el.style.cssText = `
                    position: fixed;
                    z-index: ${win.zIndex};
                    left: ${win.x}px;
                    top: ${win.y}px;
                    width: ${win.width}px;
                    height: ${win.height}px;
                    background: rgba(10,14,30,0.95);
                    backdrop-filter: blur(20px);
                    border: 1px solid rgba(255,255,255,.1);
                    border-radius: 16px;
                    box-shadow: 0 20px 60px rgba(0,0,0,.5);
                    display: flex;
                    flex-direction: column;
                    overflow: hidden;
                    color: #fff;
                    min-width: 280px;
                    min-height: 180px;
                    animation: haldoWindowIn .25s ease-out;
                `;

                el.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);cursor:grab;user-select:none;" class="window-header">
                        <span style="font-weight:600;font-size:14px;">${win.title}</span>
                        <div style="display:flex;gap:4px;">
                            <button class="window-minimize" style="width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer;">−</button>
                            <button class="window-maximize" style="width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer;">□</button>
                            <button class="window-close" style="width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer;">×</button>
                        </div>
                    </div>
                    <div style="flex:1;overflow:auto;padding:16px;" class="window-content">
                        ${win.content}
                    </div>
                `;

                document.body.appendChild(el);
                win.element = el;

                // Events
                el.querySelector(".window-close").addEventListener("click", () => this.close(win.id));
                el.querySelector(".window-minimize").addEventListener("click", () => this.minimize(win.id));
                el.querySelector(".window-maximize").addEventListener("click", () => this.maximize(win.id));

                // Drag
                const header = el.querySelector(".window-header");
                let dragging = false, startX, startY, startLeft, startTop;
                header.addEventListener("mousedown", (e) => {
                    if (e.target.closest("button")) return;
                    if (win.maximized) return;
                    dragging = true;
                    const rect = el.getBoundingClientRect();
                    startX = e.clientX - rect.left;
                    startY = e.clientY - rect.top;
                    startLeft = rect.left;
                    startTop = rect.top;
                    el.style.cursor = "grabbing";
                    el.style.transition = "none";
                });

                document.addEventListener("mousemove", (e) => {
                    if (!dragging) return;
                    let left = e.clientX - startX;
                    let top = e.clientY - startY;
                    left = Math.max(0, Math.min(left, window.innerWidth - el.offsetWidth));
                    top = Math.max(0, Math.min(top, window.innerHeight - el.offsetHeight));
                    el.style.left = left + "px";
                    el.style.top = top + "px";
                    win.x = left;
                    win.y = top;
                });

                document.addEventListener("mouseup", () => {
                    if (dragging) {
                        dragging = false;
                        el.style.cursor = "default";
                        el.style.transition = "";
                    }
                });

                // Touch-Drag
                let touchDrag = false, touchStartX, touchStartY, touchStartLeft, touchStartTop;
                header.addEventListener("touchstart", (e) => {
                    if (e.target.closest("button")) return;
                    if (win.maximized) return;
                    const touch = e.touches[0];
                    touchDrag = true;
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    const rect = el.getBoundingClientRect();
                    touchStartLeft = rect.left;
                    touchStartTop = rect.top;
                }, { passive: true });

                header.addEventListener("touchmove", (e) => {
                    if (!touchDrag) return;
                    const touch = e.touches[0];
                    let left = touchStartLeft + (touch.clientX - touchStartX);
                    let top = touchStartTop + (touch.clientY - touchStartY);
                    left = Math.max(0, Math.min(left, window.innerWidth - el.offsetWidth));
                    top = Math.max(0, Math.min(top, window.innerHeight - el.offsetHeight));
                    el.style.left = left + "px";
                    el.style.top = top + "px";
                    win.x = left;
                    win.y = top;
                }, { passive: true });

                header.addEventListener("touchend", () => {
                    touchDrag = false;
                }, { passive: true });
            },

            close(id) {
                const win = this.windows.find(w => w.id === id);
                if (!win) return;
                if (win.element) win.element.remove();
                this.windows = this.windows.filter(w => w.id !== id);
                window.HalDo.emit("window:closed", { windowId: id });
                if (win.appId && window.HalDo.AppManager) {
                    window.HalDo.AppManager.close(win.appId);
                }
            },

            minimize(id) {
                const win = this.windows.find(w => w.id === id);
                if (!win) return;
                win.minimized = !win.minimized;
                if (win.element) {
                    win.element.style.display = win.minimized ? "none" : "flex";
                    win.element.style.height = win.minimized ? "48px" : win.height + "px";
                }
            },

            maximize(id) {
                const win = this.windows.find(w => w.id === id);
                if (!win) return;
                win.maximized = !win.maximized;
                if (win.element) {
                    if (win.maximized) {
                        win.element.style.left = "0";
                        win.element.style.top = "0";
                        win.element.style.width = "100vw";
                        win.element.style.height = "100vh";
                        win.element.style.borderRadius = "0";
                    } else {
                        win.element.style.left = win.x + "px";
                        win.element.style.top = win.y + "px";
                        win.element.style.width = win.width + "px";
                        win.element.style.height = win.height + "px";
                        win.element.style.borderRadius = "16px";
                    }
                }
            },

            getWindows() {
                return this.windows;
            },

            getWindow(id) {
                return this.windows.find(w => w.id === id) || null;
            },

            closeAll() {
                this.windows.forEach(w => this.close(w.id));
            },

            bringToFront(id) {
                const win = this.windows.find(w => w.id === id);
                if (!win) return;
                win.zIndex = ++this.zIndex;
                if (win.element) win.element.style.zIndex = win.zIndex;
            }
        };

        window.HalDo.Router = {
            routes: new Map(),
            currentRoute: null,

            register(path, handler, options = {}) {
                this.routes.set(path, {
                    handler: handler,
                    options: options
                });
                return true;
            },

            navigate(path, data = {}) {
                const route = this.routes.get(path);
                if (!route) {
                    console.warn(`[HalDo Router] Route "${path}" nicht gefunden`);
                    return false;
                }

                this.currentRoute = path;
                try {
                    route.handler(data);
                    window.HalDo.emit("route:navigated", { path, data });
                    return true;
                } catch(e) {
                    console.error(`[HalDo Router] Fehler bei Route "${path}":`, e);
                    return false;
                }
            },

            getCurrent() {
                return this.currentRoute;
            },

            getRoutes() {
                return Array.from(this.routes.keys());
            }
        };

                el.innerHTML = `

                    const phase = this.phases[i];
                    console.log(`📌 Boot-Phase ${i+1}/${this.phases.length}: ${phase.name}`);
                    window.HalDo.emit("boot:phase", { phase: phase.name, index: i, total: this.phases.length });

                    try {
                        await phase.callback();

                        console.error(`❌ Boot-Fehler in Phase "${phase.name}":`, e);
                        window.HalDo.emit("boot:error", { phase: phase.name, error: e });

        function defineBootPhases() {

                if (window.HalDo.Core) window.HalDo.Core.init();
            });

            // Phase 2: Config & Storage
            boot.register('Config & Storage', async () => {
                if (window.HalDo.Config) window.HalDo.Config.init();
                if (window.HalDo.Storage) window.HalDo.Storage.getAll();
            });

            // Phase 3: App Registry
            boot.register('App Registry', async () => {
                if (window.HalDo.AppRegistry) {
                    window.HalDo.AppRegistry.loadInstalled();
                }
            });

            // Phase 4: AI Core
            boot.register('AI Core', async () => {
                if (window.HalDo.AICore) window.HalDo.AICore.init();
            });

            // Phase 5: Language
            boot.register('Language', async () => {
                if (window.HalDo.Language) window.HalDo.Language.init();
            });

            // Phase 6: Voice
            boot.register('Voice', async () => {
                if (window.HalDo.Voice) window.HalDo.Voice.init();
            });

            // Phase 7: Settings
            boot.register('Settings', async () => {
                if (window.HalDo.Settings) window.HalDo.Settings.init();
            });

            // Phase 8: Notifications
            boot.register('Notifications', async () => {
                if (window.HalDo.Notifications) window.HalDo.Notifications.init();
            });

            // Phase 9: Menüs
            boot.register('Menüs', async () => {
                if (window.HalDo.Menu) window.HalDo.Menu.init();
            });

            // Phase 10: Chat

                if (window.HalDo.LivingLogo) window.HalDo.LivingLogo.init();

                console.log("📱 " + (window.HalDo.AppRegistry ? window.HalDo.AppRegistry.getAll().length : 0) + " Apps verfügbar");

                setTimeout(() => {

            // === FALLBACK ===
            'fallback': `
                <div style="padding:30px;text-align:center;">
                    <div style="font-size:56px;margin-bottom:12px;">📱</div>
                    <div style="font-size:20px;font-weight:700;">App wird vorbereitet</div>
