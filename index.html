                            storage.set(
                                this.storageKey,
                                values
                            );

                            return true;

                        }


                        if (
                            typeof storage.save ===
                            "function"
                        ) {

                            storage.save(
                                this.storageKey,
                                values
                            );

                            return true;

                        }

                    }

                    catch(error) {

                        console.warn(
                            "[HalDo Settings] Storage write failed:",
                            error
                        );

                    }

                }


                try {

                    localStorage.setItem(
                        this.storageKey,
                        JSON.stringify(
                            values
                        )
                    );


                    return true;

                }

                catch(error) {

                    console.warn(
                        "[HalDo Settings] localStorage write failed:",
                        error
                    );

                }


                return false;

            };


        /* ========================================================
           LOAD SETTINGS
           ======================================================== */

        HD12.settings.load =
            function() {

                const saved =
                    this.readStorage();


                this.state.values =
                    {

                        ...this.defaults,

                        ...(saved || {})

                    };


                this.applyAll();


                HD12.emit(
                    "settings:loaded",
                    {
                        values:
                            this.state.values
                    }
                );


                return this.state.values;

            };


        /* ========================================================
           GET
           ======================================================== */

        HD12.settings.get =
            function(
                key,
                fallback = null
            ) {

                if (
                    Object.prototype.hasOwnProperty.call(
                        this.state.values,
                        key
                    )
                ) {

                    return this.state.values[
                        key
                    ];

                }


                return fallback;

            };


        /* ========================================================
           SET
           ======================================================== */

        HD12.settings.set =
            function(
                key,
                value,
                persist = true
            ) {

                this.state.values[
                    key
                ] =
                    value;


                this.apply(
                    key,
                    value
                );


                if (
                    persist &&
                    this.get(
                        "autoSave",
                        true
                    )
                ) {

                    this.save();

                }


                HD12.emit(
                    "settings:changed",
                    {

                        key,

                        value

                    }
                );


                return value;

            };


        /* ========================================================
           SAVE
           ======================================================== */

        HD12.settings.save =
            function() {

                const success =
                    this.writeStorage(
                        this.state.values
                    );


                HD12.emit(
                    "settings:saved",
                    {

                        success,

                        values:
                            this.state.values

                    }
                );


                return success;

            };


        /* ========================================================
           RESET
           ======================================================== */

        HD12.settings.reset =
            function() {

                this.state.values =
                    {

                        ...this.defaults

                    };


                this.applyAll();

                this.save();


                HD12.emit(
                    "settings:reset"
                );


                return this.state.values;

            };


        /* ========================================================
           APPLY SINGLE SETTING
           ======================================================== */

        HD12.settings.apply =
            function(
                key,
                value
            ) {

                switch (
                    key
                ) {


                    /* --------------------------------------------
                       WORLD VISIBILITY
                       -------------------------------------------- */

                    case "sunVisible":

                        this.applyWorldFlag(
                            "sun",
                            value
                        );

                        break;


                    case "starsVisible":

                        this.applyWorldFlag(
                            "stars",
                            value
                        );

                        break;


                    case "starlight":

                        this.applyWorldFlag(
                            "starlight",
                            value
                        );

                        break;


                    case "planetsVisible":

                        this.applyWorldFlag(
                            "planets",
                            value
                        );

                        break;


                    case "orbitsVisible":

                        this.applyWorldFlag(
                            "orbits",
                            value
                        );

                        break;


                    case "sunRays":

                        this.applyWorldFlag(
                            "sunRays",
                            value
                        );

                        break;


                    case "glow":

                        this.applyWorldFlag(
                            "glow",
                            value
                        );

                        break;


                    /* --------------------------------------------
                       NUMBERS
                       -------------------------------------------- */

                    case "starCount":

                        this.applyWorldValue(
                            "starCount",
                            Number(
                                value
                            )
                        );

                        break;


                    case "planetCount":

                        this.applyWorldValue(
                            "planetCount",
                            Number(
                                value
                            )
                        );

                        break;


                    /* --------------------------------------------
                       SPEED
                       -------------------------------------------- */

                    case "rotationSpeed":

                        this.applyWorldValue(
                            "rotationSpeed",
                            value
                        );

                        break;


                    /* --------------------------------------------
                       SKY
                       -------------------------------------------- */

                    case "skyMode":

                        this.applyWorldValue(
                            "skyMode",
                            value
                        );

                        break;


                    case "skyColor":

                        this.applyWorldValue(
                            "skyColor",
                            value
                        );

                        break;


                    /* --------------------------------------------
                       MOTION
                       -------------------------------------------- */

                    case "reducedMotion":

                        this.applyMotion(
                            value
                        );

                        break;


                    case "animations":

                        this.applyMotion(
                            !value
                        );

                        break;


                    /* --------------------------------------------
                       VOICE
                       -------------------------------------------- */

                    case "voiceEnabled":

                        this.applyVoice(
                            value
                        );

                        break;


                    case "voiceLanguage":

                        this.applyVoiceLanguage(
                            value
                        );

                        break;


                    default:

                        break;

                }

            };


        /* ========================================================
           APPLY ALL
           ======================================================== */

        HD12.settings.applyAll =
            function() {

                Object.entries(
                    this.state.values
                )
                    .forEach(
                        (
                            [
                                key,
                                value
                            ]
                        ) => {

                            this.apply(
                                key,
                                value
                            );

                        }
                    );


                this.applyWorld();

            };


        /* ========================================================
           WORLD API BRIDGE
           ======================================================== */

        HD12.settings.getWorldSystem =
            function() {

                return (

                    HD12.haldoLightSystem ||

                    HD12.lightSystem ||

                    HD12.world ||

                    HD12.haldoWorld ||

                    HD12.sky ||

                    null

                );

            };


        HD12.settings.applyWorldFlag =
            function(
                name,
                value
            ) {

                const world =
                    this.getWorldSystem();


                if (
                    !world
                ) {

                    HD12.emit(
                        "world:setting",
                        {
                            name,
                            value
                        }
                    );

                    return;

                }


                try {

                    if (
                        typeof world.setVisible ===
                        "function"
                    ) {

                        world.setVisible(
                            name,
                            Boolean(
                                value
                            )
                        );

                    }


                    if (
                        typeof world.setFlag ===
                        "function"
                    ) {

                        world.setFlag(
                            name,
                            Boolean(
                                value
                            )
                        );

                    }


                    if (
                        world.settings
                    ) {

                        world.settings[
                            name
                        ] =
                            Boolean(
                                value
                            );

                    }

                }

                catch(error) {

                    console.warn(
                        "[HalDo Settings] World flag failed:",
                        name,
                        error
                    );

                }


                HD12.emit(
                    "world:setting",
                    {

                        name,

                        value:
                            Boolean(
                                value
                            )

                    }
                );

            };


        /* ========================================================
           WORLD VALUE BRIDGE
           ======================================================== */

        HD12.settings.applyWorldValue =
            function(
                name,
                value
            ) {

                const world =
                    this.getWorldSystem();


                if (
                    !world
                ) {

                    HD12.emit(
                        "world:value",
                        {
                            name,
                            value
                        }
                    );

                    return;

                }


                try {

                    if (
                        typeof world.setSetting ===
                        "function"
                    ) {

                        world.setSetting(
                            name,
                            value
                        );

                    }


                    if (
                        typeof world.set ===
                        "function"
                    ) {

                        world.set(
                            name,
                            value
                        );

                    }


                    if (
                        world.settings
                    ) {

                        world.settings[
                            name
                        ] =
                            value;

                    }

                }

                catch(error) {

                    console.warn(
                        "[HalDo Settings] World value failed:",
                        name,
                        error
                    );

                }


                HD12.emit(
                    "world:value",
                    {

                        name,

                        value

                    }
                );

            };


        /* ========================================================
           APPLY WORLD
           ======================================================== */

        HD12.settings.applyWorld =
            function() {

                const worldSettings = {

                    sunVisible:
                        this.get(
                            "sunVisible"
                        ),

                    starsVisible:
                        this.get(
                            "starsVisible"
                        ),

                    starlight:
                        this.get(
                            "starlight"
                        ),

                    planetsVisible:
                        this.get(
                            "planetsVisible"
                        ),

                    orbitsVisible:
                        this.get(
                            "orbitsVisible"
                        ),

                    skyMode:
                        this.get(
                            "skyMode"
                        ),

                    skyColor:
                        this.get(
                            "skyColor"
                        ),

                    starCount:
                        this.get(
                            "starCount"
                        ),

                    planetCount:
                        this.get(
                            "planetCount"
                        ),

                    rotationSpeed:
                        this.get(
                            "rotationSpeed"
                        ),

                    sunRays:
                        this.get(
                            "sunRays"
                        ),

                    glow:
                        this.get(
                            "glow"
                        ),

                    dayYearCycle:
                        this.get(
                            "dayYearCycle"
                        )

                };


                Object.entries(
                    worldSettings
                )
                    .forEach(
                        (
                            [
                                key,
                                value
                            ]
                        ) => {

                            if (
                                typeof value ===
                                "boolean"
                            ) {

                                this.applyWorldFlag(
                                    key,
                                    value
                                );

                            }

                            else {

                                this.applyWorldValue(
                                    key,
                                    value
                                );

                            }

                        }
                    );


                HD12.emit(
                    "world:apply",
                    {
                        settings:
                            worldSettings
                    }
                );

            };


        /* ========================================================
           MOTION
           ======================================================== */

        HD12.settings.applyMotion =
            function(
                disabled
            ) {

                document.documentElement
                    .classList.toggle(
                        "haldo-reduced-motion",
                        Boolean(
                            disabled
                        )
                    );


                HD12.emit(
                    "motion:changed",
                    {
                        disabled:
                            Boolean(
                                disabled
                            )
                    }
                );

            };


        /* ========================================================
           VOICE
           ======================================================== */

        HD12.settings.applyVoice =
            function(
                enabled
            ) {

                if (
                    HD12.voice
                ) {

                    HD12.voice.enabled =
                        Boolean(
                            enabled
                        );

                }


                HD12.emit(
                    "voice:setting",
                    {

                        enabled:
                            Boolean(
                                enabled
                            )

                    }
                );

            };


        HD12.settings.applyVoiceLanguage =
            function(
                language
            ) {

                if (
                    HD12.voice
                ) {

                    HD12.voice.language =
                        language;

                    HD12.voice.lang =
                        language;

                }


                if (
                    HD12.aiVoice
                ) {

                    HD12.aiVoice.language =
                        language;

                }


                HD12.emit(
                    "voice:language",
                    {
                        language
                    }
                );

            };

            function() {

                if (

                    false;


                this.state.root.classList.remove(
                    "open"
                );


                HD12.emit(
                    "settings:close"

                const managers = [

                for (
                    const manager of
                    managers
                ) {

                        continue;

                    }


                    try {

                        const methods = [

                            "openApp",

                            "launch",

                            "open",

                            "start",

                            "activate"

                        ];


                        for (
                            const method of
                            methods
                        ) {

                            if (
                                typeof manager[
                                    method
                                ] ===
                                "function"
                            ) {

                                manager[
                                    method
                                ](
                                    appId
                                );


                                this.close();

                                HD13.emit(
                                    "menu:app-open",
                                    {
                                        appId
                                    }
                                );


                                return true;

                            }

                        }

                    }

                    catch(error) {

                        console.warn(
                            "[HalDo Menu] App open failed:",
                            appId,
                            error
                        );

                    }

                }


                /*
                 * Final event bridge.
                 */

                HD13.emit(
                    "app:open-request",
                    {
                        appId
                    }
                );


                this.close();


                return false;

            };

                    .forEach(

        HD14.aiWindow.addMessage =
            function(
                role,
                text
            ) {

                if (
                    !this.state.root
                ) {

                    return;

                }


                const messages =
                    this.state.root.querySelector(
                        ".haldo-ai-messages"
                    );


                if (
                    !messages
                ) {

                    return;

                }


                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "haldo-ai-message " +
                    (
                        role === "user"
                            ? "user"
                            : "ai"
                    );


                const bubble =
                    document.createElement(
                        "div"
                    );


                bubble.className =
                    "haldo-ai-bubble";


                bubble.textContent =
                    String(
                        text ?? ""
                    );


                wrapper.appendChild(
                    bubble
                );


                messages.appendChild(
                    wrapper
                );


                messages.scrollTop =
                    messages.scrollHeight;


                this.state.messages.push(
                    {

                        role,

                        text:
                            String(
                                text ?? ""
                            ),

                        timestamp:
                            Date.now()

                    }
                );

            };

                    this.state.root.querySelector(

                const wrapper =
                    document.createElement(

                wrapper.className =
                    "haldo-ai-message ai";


                wrapper.dataset.aiTyping =

                wrapper.innerHTML = `

                        <span></span>

        HD14.aiWindow.hideTyping =
            function() {

                if (
                    !this.state.root

                    return;

        /* ========================================================
           AI RESPONSE BRIDGE
           ======================================================== */

        HD14.aiWindow.askAI =
            async function(
                text
            ) {

                const input =
                    String(
                        text ?? ""
                    )
                    .trim();


                if (
                    !input
                ) {

                    return;

                }


                this.addMessage(
                    "user",
                    input
                );


                this.showTyping();


                try {

                    const candidates = [

                        HD14.aiCore,

                        HD14.aiEngine,

                        HD14.ai,

                        HD14.chat

                    ];


                    for (
                        const system of
                        candidates
                    ) {

                        if (
                            !system
                        ) {

                            continue;

                        }


                        const methods = [

                            "respond",

                            "answer",

                            "chat",

                            "ask",

                            "process",

                            "generate",

                            "handleMessage"

                        ];


                        for (
                            const method of
                            methods
                        ) {

                            if (
                                typeof system[
                                    method
                                ] !==
                                "function"
                            ) {

                                continue;

                            }


                            const result =
                                await system[
                                    method
                                ](
                                    input
                                );


                            this.hideTyping();


                            let answer =
                                result;


                            if (
                                result &&
                                typeof result ===
                                "object"
                            ) {

                                answer =
                                    result.text ??
                                    result.message ??
                                    result.response ??
                                    result.answer ??
                                    result.content ??
                                    "";

                            }


                            if (
                                String(
                                    answer
                                ).trim()
                            ) {

                                this.addMessage(
                                    "ai",
                                    answer
                                );

                                return answer;

                            }

                        }

                    }


                    /*
                     * Fallback:
                     * The UI remains functional even when
                     * the AI engine is temporarily unavailable.
                     */

                    this.hideTyping();


                    const fallback =
                        "Ich bin hier. 💙❤️ " +
                        "Meine AI-Verbindung wird gerade vorbereitet. " +
                        "Schreib mir einfach weiter.";


                    this.addMessage(
                        "ai",
                        fallback
                    );


                    return fallback;

                }

                catch(error) {

                    console.error(
                        "[HalDo AI Window]",
                        error
                    );


                    this.hideTyping();


                    const errorText =
                        "Entschuldigung, beim Antworten ist gerade ein Fehler aufgetreten.";


                    this.addMessage(
                        "ai",
                        errorText
                    );


                    HD14.emit(
                        "ai:error",
                        {
                            error
                        }
                    );


                    return null;

                }

            };

                const greeting =
                    "Willkommen bei HalDo AI. 💙❤️\n" +
                    "Ich bin für dich da. " +
                    "Du kannst mit mir schreiben, " +
                    "fragen und dich mit mir unterhalten.";

        HD14.aiWindow.playWelcomeSound =
            function() {

                const settings =
                    HD14.settings;


                const enabled =
                    settings &&
                    typeof settings.get ===
                    "function"
                        ? settings.get(
                            "appOpenSound",
                            true
                        )
                        : true;


                if (
                    !enabled
                ) {

                    return;

                }


                /*
                 * No external audio file is required.
                 * A very soft WebAudio tone is generated.
                 */

                try {

                    const AudioContext =
                        window.AudioContext ||
                        window.webkitAudioContext;


                    if (
                        !AudioContext
                    ) {

                        return;

                    }


                    const context =
                        new AudioContext();


                    const oscillator =
                        context.createOscillator();


                    const gain =
                        context.createGain();


                    oscillator.type =
                        "sine";


                    oscillator.frequency.setValueAtTime(
                        523.25,
                        context.currentTime
                    );


                    oscillator.frequency.exponentialRampToValueAtTime(
                        659.25,
                        context.currentTime +
                        .18
                    );


                    gain.gain.setValueAtTime(
                        0.0001,
                        context.currentTime
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        0.045,
                        context.currentTime +
                        .025
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        0.0001,
                        context.currentTime +
                        .32
                    );


                    oscillator.connect(
                        gain
                    );


                    gain.connect(
                        context.destination
                    );


                    oscillator.start();


                    oscillator.stop(
                        context.currentTime +
                        .34
                    );


                    oscillator.addEventListener(
                        "ended",
                        () => {

                            try {

                                context.close();

                            }

                            catch(error) {

                                /* ignored */

                            }

                        }
                    );

                }

                catch(error) {

                    console.warn(
                        "[HalDo AI] Soft sound unavailable:",
                        error

        <!-- =========================================================

    <script>

        "use strict";

        const HD15 =
            window.HalDo;


        /* ========================================================
           INTERACTION FOUNDATION
           ======================================================== */

        HD15.interaction =
            HD15.interaction ||
            {};


        HD15.interaction.state =
            HD15.interaction.state ||
            {

                initialized:
                    false,

                keyboardBound:
                    false,

                appSoundLock:
                    false,

                lastApp:
                    null

            };


        /* ========================================================
           SOUND HELPER
           ======================================================== */

        HD15.interaction.isSoundEnabled =
            function() {

                if (
                    HD15.settings &&
                    typeof HD15.settings.get ===
                    "function"
                ) {

                    return Boolean(
                        HD15.settings.get(
                            "appOpenSound",
                            true
                        )
                    );

                }


                return true;

            };


        /* ========================================================
           SOFT APP OPEN SOUND
           ======================================================== */

        HD15.interaction.playAppOpenSound =
            function() {

                if (
                    !this.isSoundEnabled()
                ) {

                    return;

                }


                if (
                    this.state.appSoundLock
                ) {

                    return;

                }


                this.state.appSoundLock =
                    true;


                setTimeout(
                    () => {

                        this.state.appSoundLock =
                            false;

                    },
                    350
                );


                try {

                    const AudioContext =
                        window.AudioContext ||
                        window.webkitAudioContext;


                    if (
                        !AudioContext
                    ) {

                        return;

                    }


                    const context =
                        new AudioContext();


                    const gain =
                        context.createGain();


                    const oscillator =
                        context.createOscillator();


                    oscillator.type =
                        "sine";


                    oscillator.frequency.setValueAtTime(
                        587.33,
                        context.currentTime
                    );


                    oscillator.frequency.exponentialRampToValueAtTime(
                        783.99,
                        context.currentTime +
                        .16
                    );


                    oscillator.frequency.exponentialRampToValueAtTime(
                        659.25,
                        context.currentTime +
                        .29
                    );


                    gain.gain.setValueAtTime(
                        0.0001,
                        context.currentTime
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        0.035,
                        context.currentTime +
                        .025
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        0.0001,
                        context.currentTime +
                        .34
                    );


                    oscillator.connect(
                        gain
                    );


                    gain.connect(
                        context.destination
                    );


                    oscillator.start();


                    oscillator.stop(
                        context.currentTime +
                        .36
                    );


                    oscillator.addEventListener(
                        "ended",
                        () => {

                            try {

                                context.close();

                            }

                            catch(error) {

                                /* ignored */

                            }

                        }
                    );

                }

                catch(error) {

                    console.warn(
                        "[HalDo Interaction] App sound failed:",
                        error
                    );

                }

            };


        /* ========================================================
           WELCOME VOICE
           ======================================================== */

        HD15.interaction.speakWelcome =
            function(
                appId
            ) {

                const enabled =
                    HD15.settings &&
                    typeof HD15.settings.get ===
                    "function"
                        ? HD15.settings.get(
                            "aiWelcome",
                            true
                        )
                        : true;


                const voiceEnabled =
                    HD15.settings &&
                    typeof HD15.settings.get ===
                    "function"
                        ? HD15.settings.get(
                            "voiceEnabled",
                            true
                        )
                        : true;


                if (
                    !enabled ||
                    !voiceEnabled
                ) {

                    return;

                }


                const text =
                    appId === "ai"
                        ? "Willkommen bei HalDo AI."
                        : "Willkommen.";


                /*
                 * Prefer existing HalDo voice systems.
                 */

                const voiceSystems = [

                    HD15.voice,

                    HD15.aiVoice,

                    HD15.speech,

                    HD15.aiSpeech

                ];


                for (
                    const voice of
                    voiceSystems
                ) {

                    if (
                        !voice
                    ) {

                        continue;

                    }


                    try {

                        const methods = [

                            "speak",

                            "say",

                            "synthesize",

                            "speakText"

                        ];


                        for (
                            const method of
                            methods
                        ) {

                            if (
                                typeof voice[
                                    method
                                ] ===
                                "function"
                            ) {

                                voice[
                                    method
                                ](
                                    text
                                );


                                return;

                            }

                        }

                    }

                    catch(error) {

                        console.warn(
                            "[HalDo Interaction] Existing voice failed:",
                            error
                        );

                    }

                }


                /*
                 * Browser fallback.
                 */

                if (
                    "speechSynthesis" in
                    window
                ) {

                    try {

                        window.speechSynthesis
                            .cancel();


                        const utterance =
                            new SpeechSynthesisUtterance(
                                text
                            );


                        utterance.lang =
                            HD15.settings &&
                            typeof HD15.settings.get ===
                            "function"
                                ? HD15.settings.get(
                                    "voiceLanguage",
                                    "de-DE"
                                )
                                : "de-DE";


                        utterance.rate =
                            .92;


                        utterance.pitch =
                            1.04;


                        utterance.volume =
                            .82;


                        window.speechSynthesis
                            .speak(
                                utterance
                            );

                    }

                    catch(error) {

                        console.warn(
                            "[HalDo Interaction] Browser voice failed:",
                            error
                        );

                    }

                }

            };


        /* ========================================================
           APP OPENED HANDLER
           ======================================================== */

        HD15.interaction.handleAppOpened =
            function(
                appId
            ) {

                this.state.lastApp =
                    appId;


                this.playAppOpenSound();


                setTimeout(
                    () => {

                        this.speakWelcome(
                            appId

                    },
                    220
                );


                HD15.emit(
                    "interaction:app-opened",
                    {

                        appId

                    }
                );

            };


        /* ========================================================
           APP EVENT BRIDGE
           ======================================================== */

        HD15.interaction.bindAppEvents =
            function() {

                if (
                    typeof HD15.on !==
                    "function"
                ) {

                    return;

                }


                HD15.on(
                    "app:opened",
                    event => {

                        const appId =
                            event &&
                            (
                                event.appId ??
                                event.id ??
                                event.name
                            );


                        if (
                            appId
                        ) {

                            this.handleAppOpened(
                                appId
                            );

                        }

                    }
                );


                HD15.on(
                    "app:open",
                    event => {

                        const appId =
                            event &&
                            (
                                event.appId ??
                                event.id ??
                                event.name
                            );


                        if (
                            appId
                        ) {

                            this.handleAppOpened(
                                appId
                            );

                        }

                    }
                );


                HD15.on(
                    "app:open-request",
                    event => {

                        const HD =
                            this.ensureCore();


                        if (
                            document.hidden
                        ) {

                            this.emit(
                                "haldo:background"
                            );

                        }

                        else {

                            this.emit(
                                "haldo:foreground"
                            );


                            this.applyWorldSettings();

                        }

                    }
                );

            };


        /* ========================================================
           BEFORE UNLOAD
           ======================================================== */

        HD16.final.bindUnload =
            function() {

                window.addEventListener(
                    "beforeunload",
                    () => {

                        this.emit(
                            "haldo:shutdown"
                        );

                    }
                );

            };


        /* ========================================================
           FINAL INITIALIZATION
           ======================================================== */

        HD16.final.bindVisibility();

        HD16.final.bindUnload();

        HD16.final.state.initialized =
            true;


        HD16.final.emit(
            "haldo:final-layer-ready"
        );


        /*
         * Start the complete repaired index.
         */

        HD16.final.domStart();


    </script>

</body>
