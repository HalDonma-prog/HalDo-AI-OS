                'vertrag': 'Ein Vertrag ist eine rechtlich bindende Vereinbarung zwischen zwei oder mehreren Parteien. Er kommt durch Angebot und Annahme zustande. Ein wirksamer Vertrag erfordert: Geschäftsfähigkeit, Willenserklärung, bestimmter oder bestimmbarer Inhalt, und Einhaltung von Formvorschriften.',

                'untersuchung': 'Eine ärztliche Untersuchung ist die systematische Überprüfung des Gesundheitszustands eines Patienten. Sie umfasst die Anamnese, die körperliche Untersuchung, und gegebenenfalls apparative Diagnostik.',

                'brief': 'Ein Brief ist eine schriftliche Nachricht, die an eine bestimmte Person oder Institution gerichtet ist. Ein guter Brief hat: eine Anrede, einen Einleitungssatz, einen Hauptteil, einen Schluss und eine Grußformel.',

                'ezidi': 'Die Êzîdî sind eine der ältesten monotheistischen Religionen der Welt. Ihre Wurzeln reichen Jahrtausende zurück in Mesopotamien. Die Êzîdî haben eine reiche Kultur mit eigener Musik, Poesie und einer eigenen Sprache – Kurmanji.',

            ask: function(question, language) {
                language = language || 'de';
                var self = this;

                // Prüfe auf lokales Wissen
                var lower = question.toLowerCase();
                for (var key in this.knowledge) {
                    if (lower.includes(key) || key.includes(lower)) {
                        var answer = this.knowledge[key];
                        this.conversationHistory.push({ role: 'user', content: question });
                        this.conversationHistory.push({ role: 'assistant', content: answer });
                        if (this.conversationHistory.length > 20) {
                            this.conversationHistory.splice(0, this.conversationHistory.length - 20);
                        }
                        return Promise.resolve(answer);
                    }
                }

                // Prüfe auf Befehle (App öffnen)
                var cmd = this.handleCommand(question);
                if (cmd && cmd.command === 'open') {
                    var appName = cmd.app;
                    if (state.apps[appName]) {
                        launchApp(appName);
                        return Promise.resolve('✅ ' + state.apps[appName].title + ' wurde geöffnet!');
                    }
                }

                // Groq API
                var systemPrompt =
                    'Du bist HalDo, ein intelligenter Assistent. Du hilfst bei allen Themen. Du antwortest auf ' +
                    language +
                    '. Du kannst Apps öffnen, wenn der Benutzer sagt: "Öffne [App-Name]" oder "HalDo öffne [App-Name]". Du kannst Texte schreiben, korrigieren, formulieren. Du bist freundlich und hilfsbereit. Du hast Wissen in Recht, Medizin, Wissenschaft, Geschichte, Kultur und Philosophie.';

                return new Promise(function(resolve, reject) {
                    fetch(CONFIG.apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + CONFIG.apiKey
                        },
                        body: JSON.stringify({
                            model: CONFIG.model,
                            messages: [
                                { role: 'system', content: systemPrompt },
                                { role: 'user', content: question }
                            ],
                            temperature: 0.7,
                            max_tokens: 800
                        })
                    }).then(function(response) {
                        if (!response.ok) {
                            return response.text().then(function(err) {
                                reject(new Error('API-Fehler: ' + response.status));
                            });
                        }
                        return response.json();
                    }).then(function(data) {
                        var answer = data.choices[0].message.content;
                        self.conversationHistory.push({ role: 'user', content: question });
                        self.conversationHistory.push({ role: 'assistant', content: answer });
                        resolve(answer);
                    }).catch(function(error) {
                        var fallback = self.getFallback(question);
                        resolve(fallback);
                    });
                });
            },

            // ===== FALLBACK MIT ALLEN BEFEHLEN (TEIL 4) =====
            getFallback: function(cmd) {

                // === ALLE APP-BEFEHLE FÜR FALLBACK (TEIL 4) ===
                var appCommands = {
                    'fahrschule': ['fahrschule', 'fahrschule app', 'fahrschule öffnen', 'auto fahren', 'führerschein',
                        'auto', 'fahren lernen', 'verkehr'
                    ],
                    'ai': ['ai', 'haldo ai', 'chat', 'assistent', 'haldo', 'ki'],
                    'settings': ['einstellungen', 'settings', 'optionen', 'system', 'konfiguration', 'einstellung'],
                    'files': ['dateien', 'files', 'ordner', 'dokumente', 'downloads', 'datei'],
                    'notes': ['notizen', 'notes', 'zettel', 'memo', 'erinnerung', 'notiz'],
                    'cosmic': ['cosmic', 'weltraum', 'space', 'galaxie', 'sonne', 'planeten', 'stern', 'kosmos'],
                    'appworld': ['app world', 'apps', 'anwendungen', 'alle apps', 'appstore', 'app'],
                    'mail': ['mail', 'e-mail', 'email', 'post', 'brief'],
                    'messages': ['chat', 'nachricht', 'message', 'schreiben', 'sms', 'unterhaltung'],
                    'contacts': ['kontakte', 'adressbuch', 'contacts', 'telefonbuch', 'telefon'],
                    'calendar': ['kalender', 'calendar', 'termin', 'datum', 'zeit'],
                    'music': ['musik', 'music', 'lieder', 'playlist', 'song'],
                    'terminal': ['terminal', 'konsole', 'command', 'befehle', 'cmd'],
                    'calculator': ['rechner', 'calculator', 'mathe', 'zahlen', 'plus', 'minus'],
                    'documents': ['dokumente', 'documents', 'text', 'word', 'schreiben'],
                    'tasks': ['aufgaben', 'tasks', 'to-do', 'todo', 'arbeit']
                };

                // Prüfe ob Befehl enthalten ist
                for (var appId in appCommands) {
                    var keywords = appCommands[appId];
                    for (var i = 0; i < keywords.length; i++) {
                        if (lower.includes(keywords[i]) || lower.includes('öffne ' + keywords[i]) || lower
                            .includes('haldo öffne ' + keywords[i])) {
                            if (state.apps[appId]) {
                                launchApp(appId);
                                return '✅ ' + state.apps[appId].title + ' wurde geöffnet!';
                            }
                        }
                    }
                }

                // Schreibbefehle
                if (lower.includes('schreib mir') || lower.includes('brief') || lower.includes('schreiben') || lower
                    .includes('klageschrift') || lower.includes('gutachten')) {
                    return '✍️ Hier ist dein Text:\n\n' +
                        'Sehr geehrte Damen und Herren,\n\n' +
                        'hiermit möchte ich Sie über folgendes informieren...\n\n' +
                        'Mit freundlichen Grüßen\n' +
                        'Ihr HalDo AI';
                }

                // Hallo
                if (lower.includes('hallo') || lower.includes('hi') || lower.includes('hey')) {
                    return '👋 Hallo! Ich bin HalDo. Wie kann ich dir helfen? Sag "Öffne Fahrschule" oder "Öffne Einstellungen".';
                }

                // Hilfe
                if (lower.includes('hilfe') || lower.includes('help')) {
                    return '❓ Ich kann: Apps öffnen ("Öffne Fahrschule", "Öffne Einstellungen"), Texte schreiben, Fragen beantworten. Was möchtest du tun?';
                }

                return '💡 Ich habe verstanden: "' + cmd +
                    '". Ich kann Apps öffnen, Texte schreiben und Fragen beantworten. Sag "Öffne Fahrschule" oder "Hilfe".';
            },

            // ===== ALLE APP-BEFEHLE (TEIL 1) =====
            handleCommand: function(text) {
                var lower = text.toLowerCase();

                var commands = {
                    'fahrschule': ['fahrschule', 'fahrschule app', 'auto fahren', 'führerschein', 'fahrschule öffnen',
                        'auto'
                    ],
                    'ai': ['ai', 'haldo ai', 'chat', 'assistent', 'haldo'],
                    'settings': ['einstellungen', 'settings', 'optionen', 'system', 'konfiguration'],
                    'files': ['dateien', 'files', 'ordner', 'dokumente', 'downloads'],
                    'notes': ['notizen', 'notes', 'zettel', 'memo', 'erinnerung'],
                    'cosmic': ['cosmic', 'weltraum', 'space', 'galaxie', 'sonne', 'planeten', 'stern'],
                    'appworld': ['app world', 'apps', 'anwendungen', 'alle apps', 'appstore'],
                    'mail': ['mail', 'e-mail', 'email', 'post', 'brief'],
                    'messages': ['chat', 'nachricht', 'message', 'schreiben', 'sms'],
                    'contacts': ['kontakte', 'adressbuch', 'contacts', 'telefonbuch'],
                    'calendar': ['kalender', 'calendar', 'termin', 'datum'],
                    'music': ['musik', 'music', 'lieder', 'playlist'],
                    'terminal': ['terminal', 'konsole', 'command', 'befehle', 'cmd'],
                    'calculator': ['rechner', 'calculator', 'mathe', 'zahlen'],
                    'documents': ['dokumente', 'documents', 'text', 'word'],
                    'tasks': ['aufgaben', 'tasks', 'to-do', 'todo']
                };

                for (var appId in commands) {
                    var keywords = commands[appId];
                    for (var i = 0; i < keywords.length; i++) {
                        if (lower.includes('öffne ' + keywords[i]) ||
                            lower.includes('starte ' + keywords[i]) ||
                            lower.includes('haldo öffne ' + keywords[i]) ||
                            lower.includes('zeige ' + keywords[i])) {
                            return { command: 'open', app: appId };
                        }
                    }
                }

                // Schreibbefehle
                if (lower.includes('schreib mir') || lower.includes('brief') || lower.includes('schreiben')) {
                    return { command: 'write', text: text };
                }

                return null;
            },

            getConversationContext: function() {
                var context = [];
                var history = this.conversationHistory;
                var start = Math.max(0, history.length - 4);
                for (var i = start; i < history.length; i++) {
                    if (history[i]) {
                        context.push((history[i].role === 'user' ? '👤 ' : '🤖 ') + history[i].content);
                    }
                }
                return context;
            }
        };

        // ============================================================
        //  VOICE
        // ============================================================
        var voice = {
            isListening: false,
            recognition: null,
            synthesis: window.speechSynthesis,

            init: function() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    this.recognition.lang = 'de-DE';
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;
                    this.recognition.onresult = this.onResult.bind(this);
                    this.recognition.onerror = this.onError.bind(this);
                    this.recognition.onend = this.onEnd.bind(this);
                    console.log('[Voice] Speech Recognition bereit');
                }

                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(function(stream) {
                            stream.getTracks().forEach(function(track) { track.stop(); });
                            console.log('[Voice] Mikrofon-Zugriff gewährt');
                        })
                        .catch(function() {
                            console.log('[Voice] Mikrofon-Zugriff verweigert');
                        });
                }
            },

            startListening: function() {
                if (!this.recognition) {
                    notify('❌ Sprachsteuerung nicht unterstützt', 'error');
                    return;
                }
                if (this.isListening) {
                    this.recognition.stop();
                    return;
                }
                try {
                    this.recognition.start();
                    this.isListening = true;
                    notify('🎤 Höre zu ...', 'info');
                    this.updateAIStatus('listening', '🎤 hört zu ...');
                } catch (e) {
                    notify('❌ Mikrofon konnte nicht gestartet werden', 'error');
                }
            },

            onResult: function(event) {
                var text = event.results[0][0].transcript;
                console.log('[Voice] Verstanden:', text);
                this.isListening = false;
                notify('🎤 "' + text + '"', 'success');
                this.updateAIStatus('thinking', '🧠 denkt ...');

                var cmd = aiEngine.handleCommand(text);
                if (cmd && cmd.command === 'open') {
                    if (state.apps[cmd.app]) {
                        launchApp(cmd.app);
                        notify('✅ ' + state.apps[cmd.app].title + ' geöffnet!', 'success');
                        this.updateAIStatus('idle', '● bereit');
                        this.speak('✅ ' + state.apps[cmd.app].title + ' wurde geöffnet!');
                        return;
                    }
                }

                var input = document.getElementById('ai-input');
                if (input) {
                    input.value = text;
                    var sendBtn = document.getElementById('ai-send');
                    if (sendBtn) sendBtn.click();
                }
            },

            onError: function(event) {
                console.log('[Voice] Fehler:', event.error);
                this.isListening = false;
                this.updateAIStatus('idle', '● bereit');
                if (event.error === 'not-allowed') {
                    notify('❌ Mikrofon-Zugriff verweigert.', 'error');
                }
            },

            onEnd: function() {
                this.isListening = false;
                this.updateAIStatus('idle', '● bereit');
            },

            speak: function(text, language) {
                language = language || 'de-DE';
                if (!('speechSynthesis' in window)) return;
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = language;
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.volume = 1;
                this.synthesis.speak(utterance);
            },

            updateAIStatus: function(state, text) {
                var aiState = document.getElementById('ai-state');
                if (aiState) {
                    aiState.textContent = text || '● bereit';
                    aiState.style.color = state === 'thinking' ? '#ffcc00' : state === 'listening' ?
                        '#44aaff' : '#44ff88';
                }
            }
        };

        // ============================================================
        //  WINDOW MANAGER
        // ============================================================
        function getSafePosition() {
            var vw = window.innerWidth,
                vh = window.innerHeight;
            var w = Math.min(420, vw - 30);
            var h = Math.min(320, vh - 140);
            return { x: Math.max(10, (vw - w) / 2), y: Math.max(40, (vh - h) / 2 - 20), w: w, h: h };
        }

        function launchApp(id) {
            var app = state.apps[id];
            if (!app) { notify('❌ App "' + id + '" nicht gefunden', 'error'); return; }

            for (var i = 0; i < state.windows.length; i++) {
                if (state.windows[i].appId === id) {
                    focusWindow(state.windows[i].id);
                    return;
                }
            }

            var pos = getSafePosition();
            var winId = 'win-' + Date.now();
            var win = {
                id: winId,
                appId: id,
                title: app.title || id,
                icon: app.icon || '📦',
                x: pos.x + Math.random() * 20,
                y: pos.y + Math.random() * 20,
                width: pos.w,
                height: pos.h,
                zIndex: state.windowZIndex++,
                element: null
            };

            state.windows.push(win);
            renderWindow(win);
            focusWindow(winId);
            if (app.render) { app.render(win.element.querySelector('.window-body'), win); }
            notify('🔄 ' + (app.title || id) + ' geöffnet');
            return win;
        }

        function renderWindow(win) {
            var existing = document.getElementById(win.id);
            if (existing) existing.remove();

            var el = document.createElement('div');
            el.id = win.id;
            el.className = 'window';
            el.style.left = win.x + 'px';
            el.style.top = win.y + 'px';
            el.style.width = win.width + 'px';
            el.style.height = win.height + 'px';
            el.style.zIndex = win.zIndex;
            el.dataset.appId = win.appId;

            el.innerHTML =
                '<div class="window-header"><span class="window-title">' + win.icon + ' ' + win.title +
                '</span><div class="window-controls"><button class="win-btn" data-action="minimize">─</button><button class="win-btn" data-action="maximize">⧉</button><button class="win-btn close" data-action="close">✕</button></div></div><div class="window-body"></div>';

            appContainer.appendChild(el);
            win.element = el;

            var btns = el.querySelectorAll('.win-btn');
            for (var i = 0; i < btns.length; i++) {
                (function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var action = btn.dataset.action;
                        if (action === 'close') closeWindow(win.id);
                        else if (action === 'minimize') minimizeWindow(win.id);
                        else if (action === 'maximize') maximizeWindow(win.id);
                    });
                })(btns[i]);
            }

            var header = el.querySelector('.window-header');
            var drag = false,
                startX, startY, origX, origY, isTouch = false;

            function startDrag(cx, cy) {
                if (header.querySelector('.win-btn')) return;
                drag = true;
                startX = cx;
                startY = cy;
                origX = win.x;
                origY = win.y;
                focusWindow(win.id);
                el.style.cursor = 'grabbing';
            }

            function moveDrag(cx, cy) {
                if (!drag) return;
                var dx = cx - startX,
                    dy = cy - startY;
                win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
                win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
            }

            function endDrag() { if (drag) { drag = false;
                    el.style.cursor = ''; } }

            header.addEventListener('mousedown', function(e) { if (!e.target.closest('.win-btn')) startDrag(e.clientX, e
                    .clientY); });
            document.addEventListener('mousemove', function(e) { if (drag) moveDrag(e.clientX, e.clientY); });
            document.addEventListener('mouseup', endDrag);

            header.addEventListener('touchstart', function(e) {
                var t = e.touches[0];
                if (!e.target.closest('.win-btn')) { isTouch = true;
                    startDrag(t.clientX, t.clientY); }
            }, { passive: true });
            document.addEventListener('touchmove', function(e) {
                if (drag && isTouch) { var t = e.touches[0];
                    moveDrag(t.clientX, t.clientY); }
            }, { passive: true });
            document.addEventListener('touchend', function() { if (isTouch) { isTouch = false;
                    endDrag(); } }, { passive: true });

            var resizeHandle = document.createElement('div');
            resizeHandle.style.cssText =
                'position:absolute;bottom:0;right:0;width:20px;height:20px;cursor:se-resize;touch-action:none;';
            el.appendChild(resizeHandle);

            var resize = false,
                startW, startH, startX2, startY2;

            function startResize(cx, cy) { resize = true;
                startW = win.width;
                startH = win.height;
                startX2 = cx;
                startY2 = cy; }

            function moveResize(cx, cy) {
                if (!resize) return;
                var dw = cx - startX2,
                    dh = cy - startY2;
                win.width = Math.max(160, Math.min(window.innerWidth - win.x - 10, startW + dw));
                win.height = Math.max(100, Math.min(window.innerHeight - win.y - 70, startH + dh));
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
            }

            function endResize() { resize = false; }

            resizeHandle.addEventListener('mousedown', function(e) { e.stopPropagation();
                startResize(e.clientX, e.clientY); });
            document.addEventListener('mousemove', function(e) { if (resize) moveResize(e.clientX, e.clientY); });
            document.addEventListener('mouseup', endResize);

            resizeHandle.addEventListener('touchstart', function(e) { var t = e.touches[0];
                e.stopPropagation();
                startResize(t.clientX, t.clientY); }, { passive: true });
            document.addEventListener('touchmove', function(e) { if (resize) { var t = e.touches[0];
                    moveResize(t.clientX, t.clientY); } }, { passive: true });
            document.addEventListener('touchend', endResize, { passive: true });
        }

        function closeWindow(winId) {
            var idx = -1;
            for (var i = 0; i < state.windows.length; i++) {
                if (state.windows[i].id === winId) { idx = i; break; }
            }
            if (idx === -1) return;
            var win = state.windows[idx];
            if (win.element) win.element.remove();
            state.windows.splice(idx, 1);
            if (state.activeWindow === winId) state.activeWindow = null;
            if (state.windows.length > 0) focusWindow(state.windows[state.windows.length - 1].id);
        }

        function focusWindow(winId) {
            var win = null;
            for (var i = 0; i < state.windows.length; i++) {
                if (state.windows[i].id === winId) { win = state.windows[i]; break; }
            }
            if (!win) return;
            state.activeWindow = winId;
            win.zIndex = state.windowZIndex++;
            if (win.element) {
                win.element.style.zIndex = win.zIndex;
                win.element.classList.add('active');
                for (var j = 0; j < state.windows.length; j++) {
                    if (state.windows[j].id !== winId && state.windows[j].element) {
                        state.windows[j].element.classList.remove('active');
                    }
                }
            }
        }

        function minimizeWindow(winId) {
            var win = null;
            for (var i = 0; i < state.windows.length; i++) {
                if (state.windows[i].id === winId) { win = state.windows[i]; break; }
            }
            if (win && win.element) { win.element.style.display = 'none';
                notify('⏬ ' + win.title + ' minimiert'); }
        }

        function maximizeWindow(winId) {
            var win = null;
            for (var i = 0; i < state.windows.length; i++) {
                if (state.windows[i].id === winId) { win = state.windows[i]; break; }
            }
            if (!win || !win.element) return;
            if (win.width === window.innerWidth - 20) {
                win.width = win._prevWidth || 420;
                win.height = win._prevHeight || 320;
                win.x = win._prevX || 20;
                win.y = win._prevY || 40;
            } else {
                win._prevWidth = win.width;
                win._prevHeight = win.height;
                win._prevX = win.x;
                win._prevY = win.y;
                win.width = window.innerWidth - 20;
                win.height = window.innerHeight - 90;
                win.x = 10;
                win.y = 30;
            }
            win.element.style.width = win.width + 'px';
            win.element.style.height = win.height + 'px';
            win.element.style.left = win.x + 'px';
            win.element.style.top = win.y + 'px';
        }

        // ============================================================
        //  COSMIC WORLD
        // ============================================================
        function initCosmic() {
            var ctx = cosmicCanvas.getContext('2d');
            var W, H;

            function resize() {
                W = cosmicCanvas.width = window.innerWidth;
                H = cosmicCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            var stars = [];
            for (var i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.5 + 0.5,
                    speed: Math.random() * 0.02 + 0.005,
                    bright: Math.random() * 0.6 + 0.4,
                    phase: Math.random() * Math.PI * 2
                });
            }

            var sun = { x: W / 2, y: H / 2, radius: 40, glow: 100, phase: 0 };

            var planets = [];
            var planetData = [
                { name: 'Merkur', r: 4, color: '#aaa', orbit: 50, speed: 0.03 },
                { name: 'Venus', r: 6, color: '#fa4', orbit: 75, speed: 0.022 },
                { name: 'Erde', r: 8, color: '#48f', orbit: 105, speed: 0.015 },
                { name: 'Mars', r: 5, color: '#f64', orbit: 135, speed: 0.012 },
                { name: 'Jupiter', r: 12, color: '#da7', orbit: 175, speed: 0.008 },
                { name: 'Saturn', r: 9, color: '#dc8', orbit: 215, speed: 0.006 },
                { name: 'Uranus', r: 8, color: '#8df', orbit: 255, speed: 0.0045 },
                { name: 'Neptun', r: 7, color: '#46f', orbit: 295, speed: 0.0035 },
                { name: 'Pluto', r: 3, color: '#cb9', orbit: 330, speed: 0.0025 },
                { name: 'HalDo-1', r: 6, color: '#f8d', orbit: 365, speed: 0.002 },
                { name: 'HalDo-2', r: 7, color: '#8fa', orbit: 400, speed: 0.0015 },
                { name: 'HalDo-3', r: 5, color: '#fa8', orbit: 435, speed: 0.001 }
            ];

            for (var p = 0; p < planetData.length; p++) {
                var pd = planetData[p];
                planets.push({
                    name: pd.name,
                    r: pd.r,
                    color: pd.color,
                    orbit: pd.orbit,
                    speed: pd.speed,
                    angle: Math.random() * Math.PI * 2,
                    cx: W / 2,
                    cy: H / 2
                });
            }

            var moon = { x: 0, y: 0, r: 3, color: '#ccc', orbit: 18, speed: 0.08, angle: 0, ex: 0, ey: 0 };

            function animate() {
                var time = Date.now() / 2000;
                ctx.clearRect(0, 0, W, H);

                var grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.8);
                grad.addColorStop(0, '#0a0a2a');
                grad.addColorStop(0.6, '#050515');
                grad.addColorStop(1, '#000005');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                for (var s = 0; s < stars.length; s++) {
                    var st = stars[s];
                    st.y += st.speed;
                    if (st.y > H) { st.y = 0;
                        st.x = Math.random() * W; }
                    var b = st.bright * (0.6 + 0.4 * Math.sin(time + st.phase));
                    ctx.globalAlpha = b;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                sun.phase += 0.02;
                var pulse = 1 + 0.05 * Math.sin(sun.phase);
                var r = sun.radius * pulse;

                for (var g = 5; g > 0; g--) {
                    var gr = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * g * 0.15);
                    gr.addColorStop(0, 'rgba(255,220,68,' + (0.05 / g) + ')');
                    gr.addColorStop(1, 'rgba(255,220,68,0)');
                    ctx.fillStyle = gr;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, sun.glow * g * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                }

                var sg = ctx.createRadialGradient(sun.x - r * 0.3, sun.y - r * 0.3, 0, sun.x, sun.y, r);
                sg.addColorStop(0, '#ffeeaa');
                sg.addColorStop(0.4, '#ffdd44');
                sg.addColorStop(0.8, '#ff8800');
                sg.addColorStop(1, '#ff4400');
                ctx.fillStyle = sg;
                ctx.shadowColor = '#ffdd44';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold ' + (r * 0.45) + 'px system-ui, sans-serif';
                ctx.shadowColor = 'rgba(255,255,255,0.4)';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ffffff';
                ctx.fillText('⟡', sun.x, sun.y - r * 0.05);
                ctx.shadowBlur = 0;

                for (var pl = 0; pl < planets.length; pl++) {
                    var p2 = planets[pl];
                    p2.angle += p2.speed;
                    var px = p2.cx + Math.cos(p2.angle) * p2.orbit;
                    var py = p2.cy + Math.sin(p2.angle) * p2.orbit;

                    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([2, 4]);
                    ctx.beginPath();
                    ctx.arc(p2.cx, p2.cy, p2.orbit, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.shadowColor = p2.color;
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = p2.color;
                    ctx.beginPath();
                    ctx.arc(px, py, p2.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.font = '5px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(p2.name, px, py + p2.r + 2);

                    if (p2.name === 'Erde') { moon.ex = px;
                        moon.ey = py; }
                }

                if (moon.ex !== undefined) {
                    moon.angle += moon.speed;
                    moon.x = moon.ex + Math.cos(moon.angle) * moon.orbit;
                    moon.y = moon.ey + Math.sin(moon.angle) * moon.orbit;

                    ctx.shadowColor = '#ccc';
                    ctx.shadowBlur = 4;
                    ctx.fillStyle = '#ccc';
                    ctx.beginPath();
                    ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.font = '4px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText('🌙', moon.x, moon.y + moon.r + 2);
                }

                var now = new Date();
                var hh = String(now.getHours()).padStart(2, '0');
                var mm = String(now.getMinutes()).padStart(2, '0');
                var ss = String(now.getSeconds()).padStart(2, '0');
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText('🕐 ' + hh + ':' + mm + ':' + ss, 12, H - 40);

                requestAnimationFrame(animate);
            }

            animate();

            cosmicCanvas.addEventListener('click', function(e) {
                var rect = cosmicCanvas.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var dx = x - sun.x,
                    dy = y - sun.y;
                if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 1.5) {
                    launchApp('ai');
                    notify('☀️ HalDo AI geöffnet!');
                }
            });

            cosmicCanvas.addEventListener('touchstart', function(e) {
                var t = e.touches[0];
                var rect = cosmicCanvas.getBoundingClientRect();
                var x = t.clientX - rect.left;
                var y = t.clientY - rect.top;
                var dx = x - sun.x,
                    dy = y - sun.y;
                if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 2) {
                    launchApp('ai');
                    notify('☀️ HalDo AI geöffnet!');
                }
            }, { passive: true });

            window.addEventListener('resize', function() {
                for (var rp = 0; rp < planets.length; rp++) {
                    planets[rp].cx = W / 2;
                    planets[rp].cy = H / 2;
                }
                sun.x = W / 2;
                sun.y = H / 2;
            });
        }

            render: function(body) {
                body.innerHTML =
                    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;text-align:center;padding:12px;"><div style="font-size:2.5rem;">🚗</div><h3 style="font-size:0.85rem;">🚦 Fahrschule</h3><p style="color:#8899bb;font-size:0.7rem;">Lerne alles rund ums Autofahren</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;max-width:260px;">' +
                    '<button onclick="HalDo.notify(\'🚦 Verkehrsregeln werden geladen...\',\'success\')" style="padding:6px;font-size:0.65rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;">🚦 Verkehrsregeln</button>' +
                    '<button onclick="HalDo.notify(\'🛑 Verkehrsschilder werden geladen...\',\'success\')" style="padding:6px;font-size:0.65rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;">🛑 Schilder</button>' +
                    '<button onclick="HalDo.notify(\'🚗 Praktische Übung startet...\',\'success\')" style="padding:6px;font-size:0.65rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;">🚗 Übung</button>' +
                    '<button onclick="HalDo.notify(\'📝 Theorieprüfung startet...\',\'success\')" style="padding:6px;font-size:0.65rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;">📝 Prüfung</button>' +
                    '</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">' +
                    '<button onclick="HalDo.notify(\'🚦 Ampel: Rot → Halt, Gelb → Bereit, Grün → Fahren\',\'info\')" style="padding:4px 8px;font-size:0.55rem;background:rgba(255,255,255,0.04);border:none;border-radius:6px;color:#8899bb;cursor:pointer;">🚦 Ampel</button>' +
                    '<button onclick="HalDo.notify(\'🛑 Stoppschild: Immer anhalten und Vorfahrt gewähren\',\'info\')" style="padding:4px 8px;font-size:0.55rem;background:rgba(255,255,255,0.04);border:none;border-radius:6px;color:#8899bb;cursor:pointer;">🛑 Stopp</button>' +
                    '<button onclick="HalDo.notify(\'📝 30 Fragen zur Theorieprüfung\',\'info\')" style="padding:4px 8px;font-size:0.55rem;background:rgba(255,255,255,0.04);border:none;border-radius:6px;color:#8899bb;cursor:pointer;">📝 Theorie</button>' +
                    '</div><div style="font-size:0.45rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;width:100%;">🚗 Fahrschule · HalDo OS 24</div></div>';
            }
        });

        // ===== App World =====
        registerApp('appworld', {
            title: 'App World',
            icon: '📱',
            render: function(body) {
                var apps = [];
                for (var key in state.apps) {
                    if (key !== 'appworld') {
                        apps.push({ id: key, title: state.apps[key].title, icon: state.apps[key].icon });
                    }
                }
                var html = '<h3 style="margin-bottom:4px;font-size:0.75rem;">📱 Alle ' + apps.length +
                    ' Apps</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:4px;max-height:220px;overflow-y:auto;">';
                for (var i = 0; i < apps.length; i++) {
                    var a = apps[i];
                    html +=
                        '<div style="background:rgba(255,255,255,0.04);padding:6px;border-radius:4px;text-align:center;cursor:pointer;" onclick="launchApp(\'' +
                        a.id + '\')"><div style="font-size:1.2rem;">' + a.icon +
                        '</div><div style="font-size:0.45rem;margin-top:2px;">' + a.title +
                        '</div></div>';
                }
                html +=
                    '</div><div style="font-size:0.4rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;margin-top:4px;">📱 ' +
                    apps.length + ' Apps · HalDo OS ' + CONFIG.version + '</div>';
                body.innerHTML = html;
            }
        });

        // ============================================================
        //  SYSTEM INIT
        // ============================================================

        function updateClock() {
            var now = new Date();
            clockDisplay.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            state.system.uptime = Math.floor((Date.now() - state.system.started) / 1000);
        }

        function initDock() {
            var dockItems = dock.querySelectorAll('.dock-item');
            for (var i = 0; i < dockItems.length; i++) {
                (function(btn) {
                    btn.addEventListener('click', function() {
                        launchApp(btn.dataset.app);
                    });
                })(dockItems[i]);
            }
        }

        function initMenus() {
            document.getElementById('menu-apps').addEventListener('click', function() { launchApp('appworld'); });
            document.getElementById('menu-ai').addEventListener('click', function() { launchApp('ai'); });
            document.getElementById('menu-fahrschule').addEventListener('click', function() { launchApp('fahrschule'); });
            document.getElementById('menu-system').addEventListener('click', function() { launchApp('settings'); });
            document.getElementById('menu-settings').addEventListener('click', function() { launchApp('settings'); });
            document.getElementById('menu-help').addEventListener('click', function() {
                notify('❓ Hilfe: Sag "Öffne Fahrschule" oder klicke auf die Apps');
            });
        }

        function bootSequence() {
            var statuses = [
                '⟡ Kernel wird geladen ...',
                '⟡ System initialisiert ...',
                '⟡ Cosmic World startet ...',
                '⟡ HalDo AI wird aktiviert ...',
                '⟡ HalDo OS 24 ist READY 🚀'
            ];
            var i = 0;
            var interval = setInterval(function() {
                if (i < statuses.length) {
                    bootStatus.textContent = statuses[i];
                    i++;
                } else {
                    clearInterval(interval);
                    boot.classList.add('hidden');
                    notify('🚀 HalDo OS 24 gestartet!', 'success');
                    setTimeout(function() { launchApp('ai'); }, 400);
                    setTimeout(function() { launchApp('cosmic'); }, 700);
                }
            }, 400);
        }

        function init() {
            voice.init();
            initCosmic();
            updateClock();
            setInterval(updateClock, 10000);
            initDock();
            initMenus();

            document.getElementById('btn-ai').addEventListener('click', function() { launchApp('ai'); });
            document.getElementById('btn-apps').addEventListener('click', function() { launchApp('appworld'); });
            document.getElementById('btn-about').addEventListener('click', function() {
                notify('⟡ HalDo OS ' + CONFIG.version + '\n💙❤️🚀 ' + Object.keys(state.apps).length +
                    ' Apps\n✅ Groq AI verbunden\n🚗 Fahrschule funktioniert!');
            });

            window.HalDo = {
                launchApp: launchApp,
                notify: notify,
                state: state,
                CONFIG: CONFIG,
                aiEngine: aiEngine,
                voice: voice,
                get apps() { return state.apps; }
            };

            bootSequence();

            console.log('⟡ HalDo OS ' + CONFIG.version + ' — Komplett Version');
            console.log('📱 ' + Object.keys(state.apps).length + ' Apps geladen');
            console.log('🚗 Sag "Öffne Fahrschule" oder klicke auf 🚗');
            console.log('☀️ Klicke auf die Sonne für HalDo AI');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>
