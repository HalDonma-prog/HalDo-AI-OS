<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
    <meta name="theme-color" content="#0a0a1a" />
    <title>HalDo AI OS 26.0.0 – Lite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== BASIS-STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0a0a1a;
            color: #fff;
            user-select: none;
        }
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --secondary: #00D4FF;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(20px);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.35);
            --taskbar-height: 48px;
            --menu-top-height: 40px;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== BOOT ===== */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
            flex-direction: column;
            gap: 12px;
        }
        #boot-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .boot-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .boot-logo {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 100px rgba(108, 60, 225, 0.6);
            }
        }
        .boot-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .boot-status {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            min-height: 20px;
        }
        .boot-progress {
            width: 240px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .boot-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }
        .boot-version {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #0a0a1a;
        }
        #living-ai-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            z-index: 10;
            pointer-events: none;
            border-radius: 50%;
            overflow: hidden;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.15), transparent 70%);
            display: none;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.2);
        }
        #living-ai-container canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            mix-blend-mode: screen;
        }

        /* ===== MENU, TASKBAR, WINDOWS (wie gehabt) ===== */
        #top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--menu-top-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            z-index: 90;
        }
        .menu-left {
            display: flex;
            gap: 2px;
            overflow-x: auto;
            flex: 1;
        }
        .menu-left::-webkit-scrollbar {
            height: 0;
        }
        .menu-item {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: transparent;
            white-space: nowrap;
            transition: 0.2s;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .menu-item.active {
            background: var(--primary);
            color: #fff;
        }
        .menu-right {
            display: flex;
            gap: 4px;
        }
        .menu-right .menu-item {
            font-size: 9px;
            padding: 2px 6px;
        }

        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--taskbar-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 6px;
            z-index: 100;
            gap: 6px;
        }
        #taskbar-logo {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            font-size: 14px;
            color: #fff;
            font-weight: 900;
        }
        #taskbar-time {
            font-size: 11px;
            color: var(--text-secondary);
            min-width: 50px;
        }
        .taskbar-center {
            flex: 1;
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }
        .taskbar-center::-webkit-scrollbar {
            height: 0;
        }
        .taskbar-app-btn {
            padding: 2px 8px;
            height: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-radius: 5px;
            color: var(--text-secondary);
            font-size: 9px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .taskbar-app-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--glass-border);
        }
        .taskbar-app-btn.active {
            background: rgba(108, 60, 225, 0.2);
            border-color: var(--primary);
            color: #fff;
        }
        .taskbar-right {
            display: flex;
            gap: 4px;
        }
        .taskbar-right .tb-icon {
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 4px;
            transition: 0.2s;
        }
        .taskbar-right .tb-icon:hover {
            color: #fff;
        }

        #window-container {
            position: fixed;
            top: var(--menu-top-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--menu-top-height) - var(--taskbar-height));
            z-index: 10;
            pointer-events: none;
            padding: 6px;
        }
        .window {
            position: absolute;
            min-width: 220px;
            min-height: 150px;
            max-width: 85vw;
            max-height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--glass-shadow);
            pointer-events: all;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowOpen 0.2s ease;
            resize: both;
        }
        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .window.minimized {
            transform: scale(0.8) translateY(40px);
            opacity: 0;
            pointer-events: none;
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
            max-width: 100vw;
            max-height: 100vh;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid var(--glass-border);
            cursor: grab;
            min-height: 32px;
            flex-shrink: 0;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
        }
        .window-controls {
            display: flex;
            gap: 5px;
        }
        .window-controls button {
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 7px;
            line-height: 12px;
            text-align: center;
            color: transparent;
            transition: 0.2s;
        }
        .window-controls .btn-close {
            background: #FF5F57;
        }
        .window-controls .btn-close:hover {
            background: #FF3B30;
            transform: scale(1.1);
        }
        .window-controls .btn-minimize {
            background: #FFBD2E;
        }
        .window-controls .btn-minimize:hover {
            background: #FFA500;
            transform: scale(1.1);
        }
        .window-controls .btn-maximize {
            background: #28C840;
        }
        .window-controls .btn-maximize:hover {
            background: #00A020;
            transform: scale(1.1);
        }
        .window-body {
            flex: 1;
            padding: 10px;
            overflow: auto;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .window-body h2 {
            color: var(--text-primary);
            font-size: 15px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .window-body textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            padding: 6px 8px;
            font-family: inherit;
            font-size: 12px;
            resize: vertical;
        }
        .window-body textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .window-body input[type="text"],
        .window-body input[type="password"],
        .window-body select {
            width: 100%;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            font-size: 11px;
            outline: none;
            transition: 0.2s;
        }
        .window-body input:focus,
        .window-body select:focus {
            border-color: var(--primary);
        }

        #desktop-icons {
            position: fixed;
            top: calc(var(--menu-top-height) + 8px);
            left: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 64px);
            gap: 8px;
            z-index: 1;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 72px;
            padding: 4px;
            border-radius: 12px;
            background: var(--glass-bg);
            border: 1px solid transparent;
            cursor: pointer;
            text-align: center;
            gap: 2px;
            backdrop-filter: var(--glass-blur);
            transition: 0.2s;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
            transform: translateY(-3px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .desktop-icon .icon-img {
            font-size: 24px;
        }
        .desktop-icon .icon-label {
            font-size: 9px;
            color: var(--text-secondary);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            max-width: 56px;
            word-wrap: break-word;
            line-height: 1.2;
        }

        #ai-floating-btn {
            position: fixed;
            bottom: 64px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 30px rgba(108, 60, 225, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            border: none;
            overflow: hidden;
            transition: 0.3s;
            font-size: 18px;
            color: #fff;
            font-weight: 900;
        }
        #ai-floating-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 40px rgba(108, 60, 225, 0.6);
        }

        .haldo-input {
            width: 100%;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            font-size: 11px;
            outline: none;
            transition: 0.2s;
        }
        .haldo-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
        }
        .haldo-btn {
            padding: 5px 14px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .haldo-btn:hover {
            background: var(--primary-light);
            transform: scale(1.02);
        }
        .haldo-btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
        }
        .haldo-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 768px) {
            :root {
                --taskbar-height: 40px;
                --menu-top-height: 34px;
            }
            .menu-item {
                font-size: 9px;
                padding: 2px 6px;
            }
            .boot-title {
                font-size: 20px;
            }
            .boot-logo {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
            .window {
                min-width: 70vw;
                min-height: 30vh;
            }
            .desktop-icon {
                width: 52px;
                height: 60px;
            }
            .desktop-icon .icon-img {
                font-size: 20px;
            }
            .desktop-icon .icon-label {
                font-size: 8px;
                max-width: 44px;
            }
            #living-ai-container {
                width: 130px;
                height: 130px;
            }
            #ai-floating-btn {
                width: 40px;
                height: 40px;
                bottom: 54px;
                right: 10px;
                font-size: 14px;
            }
        }
        @media (max-width: 480px) {
            .window {
                min-width: 85vw;
                min-height: 35vh;
            }
            #living-ai-container {
                width: 100px;
                height: 100px;
            }
        }
        @media (min-width: 1200px) {
            .window {
                min-width: 400px;
                min-height: 280px;
            }
            #living-ai-container {
                width: 220px;
                height: 220px;
            }
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f5;
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(0, 0, 0, 0.06);
        }
        [data-theme="cosmic"] {
            --bg-primary: #050510;
            --text-primary: #ffffff;
            --glass-bg: rgba(108, 60, 225, 0.08);
            --glass-border: rgba(108, 60, 225, 0.12);
            --primary: #8B5CF6;
            --secondary: #00D4FF;
        }
        [data-theme="aurora"] {
            --bg-primary: #0a0a20;
            --text-primary: #ffffff;
            --glass-bg: rgba(0, 200, 150, 0.06);
            --glass-border: rgba(0, 200, 150, 0.1);
            --primary: #00C896;
            --secondary: #00D4FF;
        }
        [data-theme="midnight"] {
            --bg-primary: #080812;
            --text-primary: #e0e0ff;
            --glass-bg: rgba(30, 20, 60, 0.2);
            --glass-border: rgba(80, 60, 160, 0.12);
            --primary: #7C5CFE;
            --secondary: #6C3CE1;
        }
    </style>
</head>

<body>

    <!-- ===== BOOT SCREEN ===== -->
    <div id="boot-screen">
        <div class="boot-container">
            <div class="boot-logo">☀</div>
            <h1 class="boot-title">HalDo AI OS</h1>
            <p class="boot-status" id="boot-status">Initializing Cosmic Core...</p>
            <div class="boot-progress"><div class="boot-progress-bar" id="boot-progress"></div></div>
            <p class="boot-version">v26.0.0 Lite</p>
        </div>
    </div>

    <!-- ===== DESKTOP ===== -->
    <div id="desktop">
        <div id="living-ai-container"></div>
        <div id="desktop-icons"></div>
        <div id="window-container"></div>

        <div id="top-menu">
            <div class="menu-left">
                <button class="menu-item active" data-menu="apps">📱 Apps</button>
                <button class="menu-item" data-menu="system">⚙️ System</button>
                <button class="menu-item" data-menu="tools">🔧 Tools</button>
                <button class="menu-item" data-menu="media">🎬 Medien</button>
                <button class="menu-item" data-menu="communication">💬 Kommunikation</button>
                <button class="menu-item" data-menu="health">🏥 Gesundheit</button>
                <button class="menu-item" data-menu="settings">⚙️ Einstellungen</button>
            </div>
            <div class="menu-right">
                <button class="menu-item" id="menu-theme">🌙</button>
                <button class="menu-item" id="menu-voice">👩</button>
                <button class="menu-item" id="menu-lang">DE</button>
                <button class="menu-item" id="menu-status">●</button>
            </div>
        </div>

        <div id="taskbar">
            <div class="taskbar-left">
                <div id="taskbar-logo">☀</div>
                <span id="taskbar-time">00:00:00</span>
            </div>
            <div class="taskbar-center" id="taskbar-apps"></div>
            <div class="taskbar-right">
                <button class="tb-icon" id="tb-notifications">🔔</button>
                <button class="tb-icon" id="tb-status">●</button>
            </div>
        </div>

        <button id="ai-floating-btn">☀</button>
    </div>

    <script>
        // ============================================================
        //  HALDO AI OS 26.0.0 LITE – KOMPLETT & FEHLERFREI
        //  ============================================================

        // ===== STORAGE =====
        const Storage = {
            prefix: 'haldo_',
            get(key, fallback = null) {
                try { const d = localStorage.getItem(this.prefix + key); return d ? JSON.parse(d) : fallback; } catch { return fallback; }
            },
            set(key, value) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); return true; } catch { return false; }
            },
            remove(key) { localStorage.removeItem(this.prefix + key); },
            clear() {
                Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
            }
        };
        window.Storage = Storage;

        // ===== EVENT BUS =====
        class EventBus {
            constructor() { this.events = {}; }
            on(event, fn) { if (!this.events[event]) this.events[event] = [];
                this.events[event].push(fn); }
            emit(event, data) { if (this.events[event]) this.events[event].forEach(fn => fn(data)); }
        }
        const bus = new EventBus();

        // ===== KERNEL =====
        const Kernel = {
            version: '26.0.0',
            name: 'HalDo AI OS',
            uptime: 0,
            init() {
                this.uptime = Date.now();
                console.log(`🔧 ${this.name} ${this.version} gestartet`);
                return this;
            },
            getUptime() { return Math.floor((Date.now() - this.uptime) / 1000); }
        };

        // ===== BOOT =====
        const Boot = {
            statusEl: document.getElementById('boot-status'),
            progressBar: document.getElementById('boot-progress'),

            async start() {
                const steps = [
                    'Initializing Cosmic Core...',
                    'Loading Kernel...',
                    'Loading AI Engine...',
                    'Loading Applications...',
                    'Loading System...',
                    'System Ready 🚀'
                ];
                for (let i = 0; i < steps.length; i++) {
                    this.statusEl.textContent = steps[i];
                    this.progressBar.style.width = ((i + 1) / steps.length * 100) + '%';
                    await new Promise(r => setTimeout(r, 300));
                    if (i === 2) AICore.init();
                    if (i === 3) AppManager.init();
                }
                document.getElementById('boot-screen').classList.add('hidden');
                document.getElementById('desktop').style.display = 'block';
                document.getElementById('ai-floating-btn').style.display = 'flex';
                document.getElementById('living-ai-container').style.display = 'block';
                setTimeout(() => LivingAI.init('living-ai-container'), 400);
                this.setupUI();
                bus.emit('system:ready');
            },

            setupUI() {
                document.querySelectorAll('.menu-item[data-menu]').forEach(el => {
                    el.addEventListener('click', function() {
                        document.querySelectorAll('.menu-item[data-menu]').forEach(e => e.classList.remove('active'));
                        this.classList.add('active');
                        AppManager.openCategory(this.dataset.menu);
                    });
                });
                document.getElementById('menu-theme').addEventListener('click', () => {
                    const themes = ['dark', 'light', 'cosmic', 'aurora', 'midnight'];
                    const current = document.documentElement.getAttribute('data-theme') || 'dark';
                    const next = themes[(themes.indexOf(current) + 1) % themes.length];
                    document.documentElement.setAttribute('data-theme', next);
                    const icons = { dark: '🌙', light: '☀️', cosmic: '🌌', aurora: '🌠', midnight: '🌃' };
                    document.getElementById('menu-theme').textContent = icons[next] || '🌙';
                    Storage.set('theme', next);
                });
                document.getElementById('menu-voice').addEventListener('click', () => {
                    const voices = ['👩', '👨', '🧑', '👧', '👦'];
                    const current = document.getElementById('menu-voice').textContent;

        // ===== LIVING AI =====
        const LivingAI = {
            width: 400,

            container: null,
            canvas: null,

            emotion: 'idle',
            isSpeaking: false,
            isThinking: false,

            blinkTimer: 0,
            eyeState: 'open',
            emotionData: {
                idle: { label: '💙 Bereit', eyeWidth: 1.0, eyeHeight: 1.0, mouthType: 'neutral', browY: 0, blush: 0.05,
                    light: 0.3 },
                thinking: { label: '🧠 Denkend', eyeWidth: 0.85, eyeHeight: 0.85, mouthType: 'thinking', browY: -6,

                speaking: { label: '🗣️ Sprechend', eyeWidth: 0.95, eyeHeight: 0.95, mouthType: 'speaking', browY: 0,
                    blush: 0.1, light: 0.9 },
                happy: { label: '😊 Glücklich', eyeWidth: 0.9, eyeHeight: 0.85, mouthType: 'smile', browY: -4, blush: 0.25,

                this.animate();
                bus.on('ai:processing', (p) => { this.isThinking = p;
                    this.emotion = p ? 'thinking' : 'idle'; });
                bus.on('ai:response', (data) => {
                    if (data && data.content) {

            },

            animate() {
                requestAnimationFrame(() => this.animate());
                this.breath += 0.02;
                this.blinkTimer += 0.01;
                if (this.blinkTimer > 3 + Math.random() * 2) {
                    this.eyeState = 'closed';
                    setTimeout(() => { this.eyeState = 'open';
                        this.blinkTimer = 0; }, 150);
                }
                this.draw();
            },

            wave() {
                this.emotion = 'happy';
                setTimeout(() => { if (!this.isSpeaking) this.emotion = 'idle'; }, 800);
            },

            draw() {
                const ctx = this.ctx,
                    w = this.width,
                    h = this.height;
                ctx.clearRect(0, 0, w, h);
                const cx = w / 2,
                    cy = h / 2 - 10;
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 220);
                const emotion = this.emotionData[this.emotion] || this.emotionData.idle;
                const lightIntensity = emotion.light || 0.3;
                grad.addColorStop(0, `rgba(108,60,225,${0.2 * lightIntensity})`);
                grad.addColorStop(0.5, `rgba(0,212,255,${0.08 * lightIntensity})`);
                grad.addColorStop(1, 'rgba(10,10,30,0.95)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.fillStyle = '#2a1a3a';
                ctx.beginPath();
                ctx.ellipse(cx, h * 0.78, 80, 50, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3a2a1a';
                ctx.fillRect(cx - 20, h * 0.55, 40, 50);
                ctx.shadowBlur = 0;

                const headX = cx + Math.sin(this.breath * 0.5) * 3;
                const headY = cy + Math.sin(this.breath * 0.3) * 2;
                const headR = 90;
                ctx.shadowBlur = 25;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(headX, headY, headR, 0, Math.PI * 2);
                const skinGrad = ctx.createRadialGradient(headX - 20, headY - 20, 10, headX, headY, headR);
                skinGrad.addColorStop(0, '#f5e0c8');
                skinGrad.addColorStop(0.6, '#e8c9a0');
                skinGrad.addColorStop(1, '#d4b08a');
                ctx.fillStyle = skinGrad;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Logo als Gesicht (Platzhalter: ☀, du kannst hier dein logo.png einbinden)
                ctx.fillStyle = 'rgba(108,60,225,0.15)';
                ctx.font = '60px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('☀', headX, headY + 4);

                if (emotion.blush > 0) {
                    ctx.globalAlpha = emotion.blush;
                    ctx.fillStyle = '#ff6b8a';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'rgba(255,107,138,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(headX - 55, headY + 18, 22, 16, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(headX + 55, headY + 18, 22, 16, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }

                const eyeY = headY - 12,
                    spacing = 38,
                    eyeR = 18;
                const isClosed = this.eyeState === 'closed';
                const eyeW = emotion.eyeWidth || 1;
                const eyeH = emotion.eyeHeight || 1;

                for (let side of [-1, 1]) {
                    const ex = headX + side * spacing;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(0,0,0,0.1)';
                    ctx.beginPath();
                    ctx.ellipse(ex, eyeY, eyeR * eyeW, isClosed ? 3 : eyeR * eyeH, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    if (!isClosed) {
                        const irisGrad = ctx.createRadialGradient(ex + 4, eyeY + 2, 2, ex, eyeY, eyeR - 4);
                        irisGrad.addColorStop(0, '#6bc5ff');
                        irisGrad.addColorStop(0.5, '#2a6a9a');
                        irisGrad.addColorStop(1, '#0a1a3a');
                        ctx.beginPath();
                        ctx.arc(ex + 3, eyeY + 2, eyeR - 4, 0, Math.PI * 2);
                        ctx.fillStyle = irisGrad;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex + 4, eyeY + 3, 6, 0, Math.PI * 2);
                        ctx.fillStyle = '#0a0a1a';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex + 8, eyeY - 5, 3.5, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex + 4, eyeY - 2, 1.5, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.fill();
                    }
                }

                ctx.strokeStyle = '#3a2a1a';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                const browOffset = emotion.browY || 0;
                for (let side of [-1, 1]) {
                    const bx = headX + side * spacing;
                    ctx.beginPath();
                    ctx.moveTo(bx - 16, eyeY - 28 + browOffset);
                    ctx.quadraticCurveTo(bx, eyeY - 34 + browOffset * 0.6, bx + 16, eyeY - 28 + browOffset * 1.2);
                    ctx.stroke();
                }

                ctx.strokeStyle = '#c4a080';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(headX, headY + 8);
                ctx.quadraticCurveTo(headX + 10, headY + 22, headX, headY + 30);
                ctx.quadraticCurveTo(headX - 10, headY + 22, headX, headY + 8);
                ctx.stroke();
                ctx.fillStyle = '#c4a080';
                ctx.beginPath();
                ctx.arc(headX - 8, headY + 18, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(headX + 8, headY + 18, 4, 0, Math.PI * 2);
                ctx.fill();

                const mouthX = headX,
                    mouthY = headY + 52,
                    mouthType = emotion.mouthType || 'neutral';
                ctx.shadowBlur = 0;

                if (this.isSpeaking) {
                    const breath = Math.sin(this.breath * 2) * 0.3 + 0.5;
                    ctx.fillStyle = '#aa3355';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(170,51,85,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(mouthX, mouthY + 5, 20 * (0.6 + breath * 0.4), 8 * (0.4 + breath * 0.6), 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#cc5566';
                    ctx.beginPath();
                    ctx.ellipse(mouthX, mouthY + 9, 10 * (0.4 + breath * 0.3), 5 * (0.3 + breath * 0.3), 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (mouthType === 'smile') {
                    ctx.strokeStyle = '#cc4466';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(mouthX, mouthY - 2, 20, 0.1, Math.PI - 0.1);
                    ctx.stroke();
                    ctx.fillStyle = '#cc4466';
                    ctx.beginPath();
                    ctx.arc(mouthX, mouthY + 10, 16, 0, Math.PI);
                    ctx.fill();
                } else if (mouthType === 'thinking') {
                    ctx.strokeStyle = '#cc4466';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(mouthX, mouthY + 6, 14, 0.1, Math.PI - 0.1);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#cc4466';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(204,68,102,0.1)';
                    ctx.beginPath();
                    ctx.ellipse(mouthX, mouthY + 2, 18, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#aa3355';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.ellipse(mouthX, mouthY + 2, 14, 5, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                const status = this.isSpeaking ? '🔊' : this.isThinking ? '🧠' : '●';
                ctx.fillStyle = this.isSpeaking ? '#00ff88' : this.isThinking ? '#6666ff' : '#00ff88';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(status, w - 14, 24);

                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '12px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(emotion.label || '💙 Bereit', cx, h - 12);

                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                ctx.font = '10px Inter, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('💙 HalDo AI', 14, h - 12);
            },

            speak(text) {
                this.isSpeaking = true;
                this.emotion = 'speaking';
                const duration = Math.min(text.length * 25, 3500);
                setTimeout(() => {
                    this.isSpeaking = false;
                    if (!this.isThinking) this.emotion = 'idle';
                }, duration);
            }
        };

            async chat(messages) {
                if (this.isProcessing) return '⏳ Einen Moment, Bruder... Ich überlege gerade.';
                this.isProcessing = true;
                bus.emit('ai:processing', true);

                try {
                    const userMessage = messages[messages.length - 1]?.content || '';
                    this.conversationHistory.push({ role: 'user', content: userMessage });
                    if (this.conversationHistory.length > this.maxHistory * 2) {
                        this.conversationHistory = this.conversationHistory.slice(-this.maxHistory * 2);
                    }

                    if (!this.useLocal && this.apiKey) {
                        try {
                            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${this.apiKey}`
                                },
                                body: JSON.stringify({
                                    model: 'mixtral-8x7b-32768',
                                    messages: [
                                        { role: 'system',
                                            content: 'Du bist HalDo, eine freundliche, hilfsbereite KI. Antworte auf Deutsch, professionell, einfühlsam und abwechslungsreich.' },
                                        ...messages
                                    ],
                                    temperature: 0.8,
                                    max_tokens: 500
                                })
                            });
                            if (response.ok) {
                                const data = await response.json();
                                const content = data.choices[0]?.message?.content || this.generateLocalReply(userMessage);
                                this.conversationHistory.push({ role: 'assistant', content: content });
                                Storage.set('conversation_history', this.conversationHistory);
                                this.isProcessing = false;
                                bus.emit('ai:processing', false);
                                bus.emit('ai:response', { content });
                                return content;
                            }
                        } catch (e) {
                            console.warn('⚠️ Groq API Fehler, fallback auf lokal:', e);
                        }
                    }

                    const reply = this.generateLocalReply(userMessage);
                    this.conversationHistory.push({ role: 'assistant', content: reply });
                    Storage.set('conversation_history', this.conversationHistory);

                    this.isProcessing = false;
                    bus.emit('ai:processing', false);
                    bus.emit('ai:response', { content: reply });
                    return reply;
                } catch (e) {
                    this.isProcessing = false;
                    bus.emit('ai:processing', false);
                    return 'Entschuldigung, Bruder! 💙 Da ist etwas schiefgelaufen. Versuch es nochmal.';
                }

            generateLocalReply(userText) {

                for (const [key, variants] of Object.entries(this.knowledge)) {
                    if (lower.includes(key) && Array.isArray(variants)) {

                    }

                if (lower.includes('?') || lower.includes('wie') || lower.includes('was') || lower.includes('warum')) {
                    return 'Das ist eine gute Frage, Bruder! 💙 Ich kann dir gerne mehr dazu erzählen. Worauf genau möchtest du hinaus?';
                }

                const standards = this.knowledge['standard'];
                return standards[Math.floor(Math.random() * standards.length)];
            },

            async simpleChat(message) {

            openApp(appId) {
                const app = this.apps.find(a => a.id === appId);
                if (!app) { alert('App nicht gefunden, Bruder!'); return; }
                if (!this.installedApps.includes(appId)) {
                    this.installedApps.push(appId);
                    Storage.set('installed_apps', this.installedApps);
                    this.renderDesktopIcons();
                }
                if (appId === 'cosmic-world') {
                    alert('🌌 Cosmic World ist in der Lite-Version deaktiviert.');
                    return;
                }
                if (appId === 'haldo-ai' || appId === 'ai-chat') {
                    this.openAIChat(app);
                    return;
                }
                if (appId === 'settings') {
                    this.openSettings(app);
                    return;
                }
                const content = this.getAppContent(appId);
                const win = this.createWindow(app.name, app.icon, content);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            createWindow(title, icon, content, width = 400, height = 320) {
                const win = document.createElement('div');
                win.className = 'window';
                const w = Math.min(width, window.innerWidth - 60);
                const h = Math.min(height, window.innerHeight - 120);
                const windows = document.querySelectorAll('#window-container .window');
                const offset = windows.length * 20;
                const x = 20 + (windows.length % 5) * 25 + offset * 0.04;
                const y = 15 + (windows.length % 4) * 20 + offset * 0.04;
                win.style.cssText =
                    `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${Date.now()%1000+100};`;
                win.innerHTML = `
                    <div class="window-header">
                        <div class="window-title"><span>${icon}</span> ${title}</div>
                        <div class="window-controls">
                            <button class="btn-minimize">−</button>
                            <button class="btn-maximize">⛶</button>
                            <button class="btn-close">✕</button>
                        </div>
                    </div>
                    <div class="window-body">${content}</div>
                `;
                win.querySelector('.btn-close').onclick = () => { win.remove();
                    this.updateTaskbar(); };
                win.querySelector('.btn-minimize').onclick = () => win.classList.toggle('minimized');
                win.querySelector('.btn-maximize').onclick = () => win.classList.toggle('maximized');
                const header = win.querySelector('.window-header');
                let drag = false,
                    ox, oy, sx, sy;
                header.addEventListener('mousedown', (e) => {
                    if (win.classList.contains('maximized')) return;
                    drag = true;
                    const rect = win.getBoundingClientRect();
                    ox = rect.left;
                    oy = rect.top;
                    sx = e.clientX;
                    sy = e.clientY;
                    win.style.cursor = 'grabbing';
                    win.style.zIndex = Date.now() % 1000 + 200;
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    win.style.left = (ox + e.clientX - sx) + 'px';
                    win.style.top = (oy + e.clientY - sy) + 'px';
                });
                document.addEventListener('mouseup', () => { drag = false;
                    win.style.cursor = ''; });
                const resize = document.createElement('div');
                resize.style.cssText =
                    'position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;z-index:1000;';
                win.appendChild(resize);
                let rs = false,
                    rsx, rsy, rsw, rsh;
                resize.addEventListener('mousedown', (e) => {
                    if (win.classList.contains('maximized')) return;
                    rs = true;
                    rsx = e.clientX;
                    rsy = e.clientY;
                    rsw = win.offsetWidth;
                    rsh = win.offsetHeight;
                    e.preventDefault();
                });
                document.addEventListener('mousemove', (e) => {
                    if (!rs) return;
                    win.style.width = Math.max(180, rsw + e.clientX - rsx) + 'px';
                    win.style.height = Math.max(120, rsh + e.clientY - rsy) + 'px';
                });
                document.addEventListener('mouseup', () => { rs = false; });
                return win;
            },

            calcInput(v) {
                const d = document.getElementById('calc-display');
                if (!d) return;
                if (v === '=') {
                    try { d.textContent = eval(d.textContent.replace('×', '*').replace('÷', '/')); } catch { d.textContent =
                            'Error'; }
                } else if (v === 'C') d.textContent = '0';
                else if (v === '⌫') d.textContent = d.textContent.length > 1 ? d.textContent.slice(0, -1) : '0';
                else {
                    if (d.textContent === '0' && v !== '.') d.textContent = v;
                    else d.textContent += v;
                }
            },

            runCommand() {
                const input = document.getElementById('terminal-input');
                const output = document.getElementById('terminal-output');
                if (!input || !output) return;
                const cmd = input.value.trim();
                if (!cmd) return;
                output.textContent += `\n$ ${cmd}`;
                input.value = '';
                const parts = cmd.split(' ');
                const command = parts[0].toLowerCase();
                switch (command) {
                    case 'help':
                        output.textContent += '\n> help, version, apps, clear, echo, date, uptime, ai <frage>';
                        break;
                    case 'version':
                        output.textContent += `\n> HalDo AI OS ${Kernel.version}`;
                        break;
                    case 'apps':
                        output.textContent += `\n> Apps: ${this.apps.length} installiert`;
                        break;
                    case 'clear':
                        output.textContent = '> Terminal gelöscht';
                        break;
                    case 'echo':
                        output.textContent += `\n> ${parts.slice(1).join(' ')}`;
                        break;
                    case 'date':
                        output.textContent += `\n> ${new Date().toLocaleString()}`;
                        break;
                    case 'uptime':
                        output.textContent += `\n> ${Kernel.getUptime()}s`;
                        break;
                    case 'ai':
                        const question = parts.slice(1).join(' ');
                        if (!question) { output.textContent += '\n> Bitte Frage: ai <frage>'; break; }
                        output.textContent += '\n> 🤖 Frage wird gesendet...';
                        AICore.simpleChat(question).then(reply => {
                            output.textContent += `\n> 💙 ${reply}`;
                            output.scrollTop = output.scrollHeight;
                        });
                        break;
                    default:
                        output.textContent += `\n> Unbekannt: ${cmd}`;
                }
                output.scrollTop = output.scrollHeight;
            },

                            <div style="display:flex;flex-wrap:wrap;gap:4px;">
                                ${this.apps.filter(a=>a.category===cat).map(app => `
                                    <div onclick="AppManager.openApp('${app.id}')" style="padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;border:1px solid var(--glass-border);cursor:pointer;font-size:10px;">
                                        ${app.icon} ${app.name}
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            // ===== AI CHAT =====
            openAIChat(app) {
                const content = `
                    <div style="display:flex;flex-direction:column;height:100%;padding:0;">
                        <div id="ai-chat-messages" style="flex:1;overflow-y:auto;padding:8px;">
                            <div style="text-align:center;color:var(--text-muted);padding:12px;">
                                💙 Hallo Bruder! Ich bin HalDo.<br>
                                Frag mich alles!
                            </div>
                        </div>
                        <div style="display:flex;gap:4px;padding:4px 8px;border-top:1px solid var(--glass-border);">
                            <input id="ai-chat-input" class="haldo-input" placeholder="Nachricht..." style="flex:1;" onkeydown="if(event.key==='Enter')AppManager.sendAIMessage()">
                            <button onclick="AppManager.sendAIMessage()" class="haldo-btn">📤</button>
                            <button onclick="AppManager.voiceInput()" class="haldo-btn haldo-btn-secondary">🎤</button>
                        </div>
                    </div>
                `;
                const win = this.createWindow(app.name, app.icon, content, 420, 380);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            sendAIMessage() {
                const input = document.getElementById('ai-chat-input');
                const messagesDiv = document.getElementById('ai-chat-messages');
                if (!input || !messagesDiv || !input.value.trim()) return;
                const text = input.value.trim();
                input.value = '';
                const userMsg = document.createElement('div');
                userMsg.style.cssText =
                    'text-align:right;margin:3px 0;padding:5px 10px;background:var(--primary);border-radius:6px;color:#fff;max-width:85%;margin-left:auto;font-size:11px;';
                userMsg.textContent = '🧑 ' + text;
                messagesDiv.appendChild(userMsg);
                const loading = document.createElement('div');
                loading.style.cssText =
                    'text-align:left;margin:3px 0;padding:5px 10px;background:rgba(255,255,255,0.03);border-radius:6px;color:var(--text-secondary);max-width:85%;font-size:11px;';
                loading.textContent = '💭 HalDo denkt...';
                messagesDiv.appendChild(loading);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                AICore.simpleChat(text).then(reply => {
                    loading.remove();
                    const aiMsg = document.createElement('div');
                    aiMsg.style.cssText =
                        'text-align:left;margin:3px 0;padding:5px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:6px;color:var(--text-primary);max-width:85%;font-size:11px;';
                    aiMsg.textContent = '💙 ' + reply;
                    messagesDiv.appendChild(aiMsg);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    if ('speechSynthesis' in window) {
                        const utter = new SpeechSynthesisUtterance(reply);
                        utter.lang = 'de-DE';
                        window.speechSynthesis.speak(utter);
                    }
                });
            },

            voiceInput() {
                if (!('webkitSpeechRecognition' in window)) { alert('🎤 Speech Recognition nicht unterstützt.'); return; }
                const rec = new webkitSpeechRecognition();
                rec.lang = 'de-DE';
                rec.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const input = document.getElementById('ai-chat-input');
                    if (input) { input.value = text;
                        this.sendAIMessage(); }
                };
                rec.start();
            },

            // ===== EINSTELLUNGEN =====
            openSettings(app) {
                const apiKey = Storage.get('groq_api_key', '');
                const content = `
                    <div style="height:100%;padding:8px;overflow-y:auto;">
                        <h2>⚙️ Einstellungen</h2>
                        <div style="margin-top:12px;">
                            <h3 style="font-size:12px;color:var(--text-secondary);">🧠 AI & Memory</h3>
                            <p style="font-size:11px;color:var(--text-muted);">🔒 Aktuell: ${AICore.useLocal ? 'Lokale KI' : 'Groq API aktiv'}</p>
                            <div style="margin-top:4px;">
                                <label style="font-size:10px;color:var(--text-secondary);">🔑 Groq API Key</label>
                                <input id="api-key-input" class="haldo-input" type="password" value="${apiKey}" placeholder="gsk_..." style="margin-top:2px;">
                                <button onclick="AppManager.saveAPIKey()" class="haldo-btn" style="margin-top:4px;">💾 Speichern</button>
                            </div>
                            <div style="margin-top:8px;">
                                <p style="font-size:11px;color:var(--text-secondary);">🧠 Memory: ${Storage.get('ai_memory',[]).length} Einträge</p>
                                <button onclick="Storage.set('ai_memory',[]);alert('Memory gelöscht!');" class="haldo-btn haldo-btn-secondary" style="margin-top:4px;">🧹 Löschen</button>
                            </div>
                        </div>
                        <div style="margin-top:16px;">
                            <h3 style="font-size:12px;color:var(--text-secondary);">📊 System</h3>
                            <p style="font-size:11px;color:var(--text-secondary);">Version: ${Kernel.version}</p>
                            <p style="font-size:11px;color:var(--text-secondary);">Uptime: ${Kernel.getUptime()}s</p>
                            <p style="font-size:11px;color:var(--text-secondary);">Apps: ${this.apps.length}</p>
                            <button onclick="Kernel.reboot()" class="haldo-btn haldo-btn-secondary" style="margin-top:4px;">🔄 Neustart</button>
                        </div>
                    </div>
                `;
                const win = this.createWindow(app.name, app.icon, content, 400, 480);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            saveAPIKey() {
                const input = document.getElementById('api-key-input');
                if (!input) return;
                const key = input.value.trim();
                AICore.setApiKey(key);
                alert(key ? '✅ API Key gespeichert!' : '⚠️ Key entfernt, lokale KI aktiv.');
                const body = document.querySelector('.window .window-body');
                if (body) {
                    const app = this.apps.find(a => a.id === 'settings');
                    if (app) this.openSettings(app);
                }
            },

            openSettingsPlaceholder() {
                return `<div style="padding:8px;">⚙️ Einstellungen – öffne die App über das Menü.</div>`;
            },

            // ===== KATEGORIEN =====
            openCategory(category) {
                const apps = this.apps.filter(a => a.category === category);
                if (!apps.length) { alert(`Keine Apps in "${category}"`); return; }
                const content = `
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                        ${apps.map(app => `<div onclick="AppManager.openApp('${app.id}')" style="padding:6px 12px;background:rgba(255,255,255,0.03);border-radius:6px;border:1px solid var(--glass-border);cursor:pointer;">${app.icon} ${app.name}</div>`).join('')}
                    </div>
                `;
                const win = this.createWindow(category.toUpperCase(), '📂', content, 400, 300);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            updateTaskbar() {
                const container = document.getElementById('taskbar-apps');
                if (!container) return;
                const windows = document.querySelectorAll('#window-container .window');
                container.innerHTML = '';
                windows.forEach(win => {
                    const title = win.querySelector('.window-title')?.textContent?.trim() || 'App';
                    const btn = document.createElement('button');
                    btn.className = 'taskbar-app-btn';
                    btn.textContent = title;
                    btn.onclick = () => {
                        win.classList.toggle('minimized');
                        this.updateTaskbar();
                    };
                    container.appendChild(btn);
                });
            },

            renderDesktopIcons() {
                const container = document.getElementById('desktop-icons');
                if (!container) return;
                const apps = this.apps.filter(a => this.installedApps.includes(a.id));
                container.innerHTML = apps.slice(0, 12).map(app => `
                    <div class="desktop-icon" onclick="AppManager.openApp('${app.id}')">
                        <div class="icon-img">${app.icon}</div>
                        <div class="icon-label">${app.name}</div>
                    </div>
                `).join('');
            }
        };

        // ============================================================
        //  START
        // ============================================================
        window.onload = function() {
            Kernel.init();
            Boot.start();
        };

        window.onerror = function(msg, url, line) {
            console.error('❌ Fehler:', msg, url, line);
            const logs = Storage.get('logs', []);
            logs.push({ level: 'error', message: `${msg} (${url}:${line})`, time: Date.now() });
            if (logs.length > 100) logs.shift();
            Storage.set('logs', logs);
        };

        console.log('💙❤️🚀 HalDo AI OS 26.0.0 Lite geladen, Bruder!');
        console.log('📱 ' + AppManager.apps.length + ' Apps installiert – alle funktionsfähig!');
        console.log('⚙️ API-Key in den Einstellungen (⚙️ → AI & Memory) eintragen!');
    </script>
</body>
</html>
