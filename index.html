                .haldo-app-card {

                    min-height: 135px;

                    padding: 13px;

                }

            }

        `;


        document.head.append(
            style
        );

    }


    /* =====================================================
       CREATE LAUNCHER
       ===================================================== */

    function createLauncher() {

        ensureStyles();


        const layer =
            getLayer();


        if (!layer) {

            return null;

        }


        if (
            state.container
        ) {

            return state.container;

        }


        const container =
            document.createElement(
                "section"
            );


        container.className =
            "haldo-app-launcher";


        container.setAttribute(
            "role",
            "dialog"
        );


        container.setAttribute(
            "aria-label",
            "HalDo Apps"
        );


        container.innerHTML = `

            <header
                class="haldo-app-launcher-header"
            >

                <div
                    class="haldo-app-launcher-title"
                >

                    <strong>
                        HalDo Apps
                    </strong>

                    <span>
                        Anwendungen und Systemmodule
                    </span>

                </div>


                <button
                    type="button"
                    class="haldo-app-launcher-close"
                    aria-label="Apps schließen"
                >
                    ×
                </button>

            </header>


            <div
                class="haldo-app-launcher-search"
            >

                <input
                    type="search"
                    placeholder="Apps suchen ..."
                    aria-label="Apps suchen"
                    autocomplete="off"
                >

            </div>


            <div
                class="haldo-app-launcher-categories"
                aria-label="App Kategorien"
            ></div>


            <div
                class="haldo-app-launcher-grid"
                aria-live="polite"
            ></div>

        `;


        const closeButton =
            container.querySelector(
                ".haldo-app-launcher-close"
            );


        const search =
            container.querySelector(
                "input"
            );


        closeButton.addEventListener(
            "click",
            closeLauncher
        );


        search.addEventListener(
            "input",
            event => {

                state.searchQuery =
                    event.target.value;

                renderApps();

            }
        );


        layer.append(
            container
        );


        state.container =
            container;


        return container;

    }


    /* =====================================================
       RENDER CATEGORIES
       ===================================================== */

    function renderCategories() {

        if (
            !state.container
        ) {

            return;

        }


        const element =
            state.container.querySelector(
                ".haldo-app-launcher-categories"
            );


        if (!element) {

            return;

        }


        element.innerHTML =
            "";


        getCategories()
            .forEach(
                category => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "haldo-app-launcher-category";


                    if (
                        category ===
                        state.selectedCategory
                    ) {

                        button.classList.add(
                            "is-active"
                        );

                    }


                    button.textContent =
                        category;


                    button.addEventListener(
                        "click",
                        () => {

                            state.selectedCategory =
                                category;

                            renderApps();

                        }
                    );


                    element.append(
                        button
                    );

                }
            );

    }


    /* =====================================================
       RENDER APPS
       ===================================================== */

    function renderApps() {

        refreshCatalog();


        const container =
            createLauncher();


        if (!container) {

            return;

        }


        renderCategories();


        const grid =
            container.querySelector(
                ".haldo-app-launcher-grid"
            );


        if (!grid) {

            return;

        }


        const apps =
            getFilteredApps();


        grid.innerHTML =
            "";


        if (
            apps.length ===
            0
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "haldo-app-empty";


            empty.innerHTML = `
                <div>
                    <strong>Keine Apps gefunden</strong>
                    <br>
                    <span>
                        Passe deine Suche oder Kategorie an.
                    </span>
                </div>
            `;


            grid.append(
                empty
            );


            return;

        }


        apps.forEach(
            app => {

                const card =
                    document.createElement(
                        "button"
                    );


                card.type =
                    "button";


                card.className =
                    "haldo-app-card";


                card.title =
                    `App öffnen: ${app.title}`;


                card.innerHTML = `

                    <span
                        class="haldo-app-card-icon"
                        aria-hidden="true"
                    >
                        ${escapeHTML(app.icon)}
                    </span>


                    <span
                        class="haldo-app-card-title"
                    >
                        ${escapeHTML(app.title)}
                    </span>


                    <span
                        class="haldo-app-card-description"
                    >
                        ${
                            escapeHTML(
                                app.description ||
                                "HalDo Anwendung"
                            )
                        }
                    </span>


                    <span
                        class="haldo-app-card-meta"
                    >
                        ${escapeHTML(app.category)}
                        ·
                        v${escapeHTML(app.version)}
                    </span>

                `;


                card.addEventListener(
                    "click",
                    () => {

                        launch(
                            app.id
                        );

                    }
                );


                grid.append(
                    card
                );

            }
        );

    }


    /* =====================================================
       OPEN LAUNCHER
       ===================================================== */

    function openLauncher() {

        createLauncher();

        renderApps();


        if (
            state.container
        ) {

            state.container.style.display =
                "flex";

        }


        state.menuOpen =
            true;


        emit(
            "app:launcher:opened",
            {
                timestamp:
                    Date.now()
            }
        );

    }


    /* =====================================================
       CLOSE LAUNCHER
       ===================================================== */

    function closeLauncher() {

        if (
            state.container
        ) {

            state.container.style.display =
                "none";

        }


        state.menuOpen =
            false;


        emit(
            "app:launcher:closed",
            {
                timestamp:
                    Date.now()
            }
        );

    }


    /* =====================================================
       LAUNCH APP
       ===================================================== */

    async function launch(
        appId,
        options = {}
    ) {

        const system =
            getAppSystem();


        if (
            !system ||
            typeof system.launchApp !==
            "function"
        ) {

            console.warn(
                "[HalDo Launcher] App-System nicht verfügbar."
            );


            return null;

        }


        const instance =
            await system.launchApp(
                appId,
                options
            );


        if (instance) {

            state.launchCount++;


            closeLauncher();


            emit(
                "app:launcher:launched",
                {
                    appId,
                    instance
                }
            );

        }


        return instance;

    }


    /* =====================================================
       PUBLIC API
       ===================================================== */

    const api = {

        state,

        open:
            openLauncher,

        close:
            closeLauncher,

        toggle() {

            if (
                state.menuOpen
            ) {

                closeLauncher();

            } else {

                openLauncher();

            }

        },

        render:
            renderApps,

        launch,

        refresh:
            refreshCatalog,

        getCatalog() {

            return [
                ...state.catalog
            ];

        },

        diagnostics() {

            return {

                initialized:
                    state.initialized,

                menuOpen:
                    state.menuOpen,

                apps:
                    state.catalog.length,

                visibleApps:
                    state.renderedApps.length,

                launchCount:
                    state.launchCount,

                category:
                    state.selectedCategory,

                search:
                    state.searchQuery,

                timestamp:
                    Date.now()

            };

        }

    };


    window.HalDoOS.appLauncher =
        api;


    window.HalDoAppLauncher =
        api;


    /* =====================================================
       INITIALIZATION
       ===================================================== */

    function initialize() {

        if (
            state.initialized
        ) {

            return;

        }


        ensureStyles();


        refreshCatalog();


        state.initialized =
            true;


        emit(
            "app:launcher:ready",
            api.diagnostics()
        );


        console.info(
            "%cHalDo AI OS 20%c App Launcher bereit",
            "color:#42e6ff;font-weight:800;",
            "color:#ffffff;"
        );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once:
                    true
            }
        );

    } else {

        initialize();

    }


})();

    <script>

    (() => {

        "use strict";


        /* =====================================================
           EVENT BRIDGE
           ===================================================== */

        const bridge = {

            listeners:
                new Map(),


            on(
                eventName,
                handler
            ) {

                if (
                    typeof eventName !==
                    "string" ||
                    typeof handler !==
                    "function"
                ) {

                    return () => {};

                }


                if (
                    !this.listeners.has(
                        eventName
                    )
                ) {

                    this.listeners.set(
                        eventName,
                        new Set()
                    );

                }


                const handlers =
                    this.listeners.get(
                        eventName
                    );


                handlers.add(
                    handler
                );


                return () => {

                    handlers.delete(
                        handler
                    );

                };

            },


            off(
                eventName,
                handler
            ) {

                const handlers =
                    this.listeners.get(
                        eventName
                    );


                if (!handlers) {

                    return;

                }


                handlers.delete(
                    handler
                );


                if (
                    handlers.size ===
                    0
                ) {

                    this.listeners.delete(
                        eventName
                    );

                }

            },


            emit(
                eventName,
                detail = {}
            ) {

                const handlers =
                    this.listeners.get(
                        eventName
                    );


                if (!handlers) {

                    return;

                }


                handlers.forEach(
                    handler => {

                        try {

                            handler(
                                detail
                            );

                        } catch (error) {

                            console.error(
                                "[HalDo EventBridge]",
                                eventName,
                                error
                            );

                        }

                    }
                );

            }

        };


        /* =====================================================
           GLOBAL HALDO EVENT API
           ===================================================== */

        if (
            !window.HalDoOS
        ) {

            window.HalDoOS = {};

        }


        window.HalDoOS.events =
            bridge;


        window.HalDoEventBus =
            bridge;


        /* =====================================================
           KERNEL CONNECTION
           ===================================================== */

        function connectKernel() {

            const kernel =
                window.HalDoKernel ||
                window.HalDoOS?.kernel;


            if (
                !kernel ||
                typeof kernel.on !==
                "function"
            ) {

                return false;

            }


            const kernelEvents = [

                "kernel:ready",
                "kernel:error",
                "module:ready",
                "module:error",
                "app:open",
                "app:close",
                "app:error",
                "system:ready",
                "system:error"

            ];


            kernelEvents.forEach(
                eventName => {

                    try {

                        kernel.on(
                            eventName,
                            detail => {

                                bridge.emit(
                                    eventName,
                                    detail
                                );

                            }
                        );

                    } catch (error) {

                        console.warn(
                            "[HalDo EventBridge]",
                            "Kernel event konnte nicht verbunden werden:",
                            eventName,
                            error
                        );

                    }

                }
            );


            return true;

        }


        /* =====================================================
           DOM EVENT BRIDGE
           ===================================================== */

        document.addEventListener(
            "haldo:app-open",
            event => {

                bridge.emit(
                    "app:open",
                    event.detail ||
                    {}
                );

            }
        );


        document.addEventListener(
            "haldo:app-close",
            event => {

                bridge.emit(
                    "app:close",
                    event.detail ||
                    {}
                );

            }
        );


        document.addEventListener(
            "haldo:app-error",
            event => {

                bridge.emit(
                    "app:error",
                    event.detail ||
                    {}
                );

            }
        );


        /* =====================================================
           PUBLIC DISPATCH FUNCTION
           ===================================================== */

        window.HalDoDispatch =
            function (
                eventName,
                detail = {}
            ) {

                bridge.emit(
                    eventName,
                    detail
                );


                try {

                    document.dispatchEvent(
                        new CustomEvent(
                            `haldo:${eventName}`,
                            {
                                detail
                            }
                        )
                    );

                } catch (error) {

                    console.warn(
                        "[HalDo Dispatch]",
                        error
                    );

                }

            };


        /* =====================================================
           APPLICATION STATE
           ===================================================== */

        const applicationState = {

            activeApp:
                null,

            openApps:
                [],

            lastEvent:
                null,

            initialized:
                false

        };


        window.HalDoOS.applicationState =
            applicationState;


        /* =====================================================
           APPLICATION STATE EVENTS
           ===================================================== */

        bridge.on(
            "app:open",
            detail => {

                const appId =
                    detail?.id ||
                    detail?.appId ||
                    detail?.name;


                if (!appId) {

                    return;

                }


                if (
                    !applicationState.openApps.includes(
                        appId
                    )
                ) {

                    applicationState.openApps.push(
                        appId
                    );

                }


                applicationState.activeApp =
                    appId;

                applicationState.lastEvent =
                    "app:open";

            }
        );


        bridge.on(
            "app:close",
            detail => {

                const appId =
                    detail?.id ||
                    detail?.appId ||
                    detail?.name;


                if (!appId) {

                    return;

                }


                applicationState.openApps =
                    applicationState.openApps.filter(
                        id =>
                            id !== appId
                    );


                if (
                    applicationState.activeApp ===
                    appId
                ) {

                    applicationState.activeApp =
                        applicationState.openApps.length
                            ? applicationState.openApps[
                                applicationState.openApps.length - 1
                              ]
                            : null;

                }


                applicationState.lastEvent =
                    "app:close";

            }
        );


        /* =====================================================
           INITIALIZE BRIDGE
           ===================================================== */

        function initializeEventBridge() {

            if (
                applicationState.initialized
            ) {

                return;

            }


            applicationState.initialized =
                true;


            connectKernel();


            bridge.emit(
                "ui:ready",
                {
                    version:
                        "20.0.0",

                    timestamp:
                        Date.now()
                }
            );


            console.info(
                "%cHalDo AI OS 20%c Event Bridge bereit",
                "color:#42e6ff;font-weight:800;",

            );

        if (

            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeEventBridge,
                {
                    once:
                        true
                }
            );

        } else {

            initializeEventBridge();

        }


    })();

    <script>

    (() => {

        "use strict";


        /* =====================================================
           STORAGE
           ===================================================== */

        const STORAGE_KEY =
            "haldo-ai-os-20-session";


        function safeRead() {

            try {

                const raw =
                    localStorage.getItem(
                        STORAGE_KEY
                    );


                if (!raw) {

                    return {};

                }


                const parsed =
                    JSON.parse(
                        raw
                    );


                return (
                    parsed &&
                    typeof parsed ===
                    "object"
                )
                    ? parsed
                    : {};

            } catch (error) {

                console.warn(
                    "[HalDo Session]",
                    "Session konnte nicht gelesen werden.",
                    error
                );

                return {};

            }

        }


        function safeWrite(
            data
        ) {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        data
                    )
                );


                return true;

            } catch (error) {

                console.warn(
                    "[HalDo Session]",
                    "Session konnte nicht gespeichert werden.",
                    error
                );

                return false;

            }

        }


        /* =====================================================
           DEFAULT SESSION
           ===================================================== */

        const defaults = {

            version:
                "20.0.0",

            createdAt:
                Date.now(),

            lastActiveAt:
                Date.now(),

            activeApp:
                null,

            openApps:
                [],

            appStates:
                {},

            preferences:
                {},

            workspace:
                {

                    mode:
                        "desktop",

                    maximized:
                        false

                }

        };


        const stored =
            safeRead();


        const session = {

            ...defaults,

            ...stored,

            appStates:
                {
                    ...defaults.appStates,
                    ...(stored.appStates || {})
                },

            preferences:
                {
                    ...defaults.preferences,
                    ...(stored.preferences || {})
                },

            workspace:
                {
                    ...defaults.workspace,
                    ...(stored.workspace || {})
                }

        };


        /* =====================================================
           SESSION MANAGER
           ===================================================== */

        const manager = {

            get() {

                return {
                    ...session,

                    openApps:
                        [
                            ...session.openApps
                        ],

                    appStates:
                        {
                            ...session.appStates
                        },

                    preferences:
                        {
                            ...session.preferences
                        },

                    workspace:
                        {
                            ...session.workspace
                        }

                };

            },


            save() {

                session.lastActiveAt =
                    Date.now();

                return safeWrite(
                    session
                );

            },


            reset() {

                Object.keys(
                    session
                ).forEach(
                    key => {

                        delete session[
                            key
                        ];

                    }
                );


                Object.assign(
                    session,
                    JSON.parse(
                        JSON.stringify(
                            defaults

                    )
                );


                this.save();


                dispatch(
                    "session:reset",
                    this.get()
                );

            },

                appId

                session.activeApp =
                    appId || null;


                session.lastActiveAt =
                    Date.now();


                this.save();


                dispatch(

                        appId:
                            session.activeApp

                if (!appId) {

                    return;

                }


                if (
                    !session.openApps.includes(

                    )

                    session.openApps.push(
                        appId
                    );

                }


                session.activeApp =
                    appId;


                this.save();


                dispatch(
                    "session:app-open",
                    {
                        appId,
                        openApps:
                            [
                                ...session.openApps
                            ]
                    }
                );

            closeApp(

                if (!appId) {

                    return;

                }


                session.openApps =
                    session.openApps.filter(
                        id =>
                            id !== appId
                    );


                if (
                    session.activeApp ===
                    appId
                ) {

                    session.activeApp =
                        session.openApps.length
                            ? session.openApps[
                                session.openApps.length - 1
                              ]
                            : null;

                }


                this.save();


                dispatch(
                    "session:app-close",
                    {
                        appId,
                        activeApp:
                            session.activeApp,

                        openApps:
                            [
                                ...session.openApps
                            ]
                    }
                );

            },


            setAppState(
                appId,

                if (!appId) {

                    return;

                }


                session.appStates[
                    appId
                ] =
                    (
                        state &&
                        typeof state ===
                        "object"

                        ? {
                            ...state

                        : state;


                this.save();


                dispatch(
                    "session:app-state",
                    {
                        appId,
                        state:
                            session.appStates[
                                appId
                            ]
                    }
                );

            },


            getAppState(
                appId
            ) {

                if (!appId) {

                    return null;

                }


                return (
                    session.appStates[
                        appId
                    ] ??
                    null
                );

            },


            setPreference(
                key,
                value

                if (!key) {

                    return;

                }


                session.preferences[
                    key
                ] =
                    value;


                this.save();


                dispatch(
                    "session:preference",
                    {
                        key,
                        value
                    }
                );

            },


            getPreference(
                key,
                fallback = null
            ) {

                if (!key) {

                    return fallback;

                }


                return (
                    session.preferences[
                        key
                    ] ??
                    fallback
                );

            },


            setWorkspace(
                patch
            ) {

                if (
                    !patch ||
                    typeof patch !==
                    "object"
                ) {

                    return;

                }


                Object.assign(
                    session.workspace,
                    patch
                );


                this.save();


                dispatch(
                    "session:workspace",
                    {
                        workspace:
                            {
                                ...session.workspace
                            }
                    }
                );

            }

        };


        /* =====================================================
           EVENT DISPATCH
           ===================================================== */

        function dispatch(
            name,
            detail = {}
        ) {

            if (
                typeof window.HalDoDispatch ===
                "function"
            ) {

                window.HalDoDispatch(
                    name,
                    detail
                );

                return;

            }


            try {

                document.dispatchEvent(
                    new CustomEvent(
                        `haldo:${name}`,
                        {
                            detail
                        }
                    )
                );

            } catch (error) {

                console.warn(
                    "[HalDo Session]",
                    error
                );

            }

        }


        /* =====================================================
           PUBLIC API
           ===================================================== */

        window.HalDoSession =
            manager;


        if (
            !window.HalDoOS
        ) {

            window.HalDoOS = {};

        }


        window.HalDoOS.session =
            manager;


        /* =====================================================
           CONNECT APPLICATION EVENTS
           ===================================================== */

        document.addEventListener(
            "haldo:app-open",
            event => {

                const appId =
                    event.detail?.id ||
                    event.detail?.appId ||
                    event.detail?.name;


                if (appId) {

                        appId
                    );

            "haldo:app-close",
            event => {

                const appId =
                    event.detail?.id ||
                    event.detail?.appId ||
                    event.detail?.name;


                if (appId) {

                    manager.closeApp(
                        appId
                    );

                }

            }
        );


        /* =====================================================
           BEFORE UNLOAD
           ===================================================== */

        window.addEventListener(
            "beforeunload",
            () => {

                manager.save();

            }
        );


        /* =====================================================
           INITIALIZATION
           ===================================================== */

        function initializeSession() {

            session.lastActiveAt =
                Date.now();


            manager.save();


            dispatch(
                "session:ready",
                manager.get()
            );


            console.info(
                "%cHalDo AI OS 20%c Session Manager bereit",
                "color:#42e6ff;font-weight:800;",
                "color:#ffffff;"
            );

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeSession,
                {
                    once:
                        true
                }
            );

        } else {

            initializeSession();

        }


    })();

                }

                    this.apps.get(

                        definition.name ||

    <script>

    (() => {

        "use strict";


        /* =====================================================
           STORAGE
           ===================================================== */

        const STORAGE_KEY =
            "haldo-os-20-app-state";


        function getStorage() {

            try {

                return (
                    window.HalDoStorage ||
                    window.HalDoOS?.storage ||
                    window.localStorage
                );

            } catch (error) {

                console.warn(
                    "[HalDo App State]",
                    error
                );

                return null;

            }

        }


        /* =====================================================
           SAFE READ
           ===================================================== */

        function readState() {

            const storage =
                getStorage();


            if (!storage) {

                return {};

            }


            try {

                const raw =
                    typeof storage.getItem ===
                    "function"
                        ? storage.getItem(
                            STORAGE_KEY
                        )
                        : null;


                if (!raw) {

                    return {};

                }


                const parsed =
                    JSON.parse(
                        raw
                    );


                return (
                    parsed &&
                    typeof parsed === "object"
                        ? parsed
                        : {}
                );

            } catch (error) {

                console.warn(
                    "[HalDo App State] Lesen fehlgeschlagen",
                    error
                );

                return {};

            }

        }


        /* =====================================================
           SAFE WRITE
           ===================================================== */

        function writeState(
            state
        ) {

            const storage =
                getStorage();


            if (!storage) {

                return false;

            }


            try {

                const serialized =
                    JSON.stringify(
                        state
                    );


                if (
                    typeof storage.setItem ===
                    "function"
                ) {

                    storage.setItem(
                        STORAGE_KEY,
                        serialized
                    );

                    return true;

                }

            } catch (error) {

                console.warn(
                    "[HalDo App State] Speichern fehlgeschlagen",
                    error
                );

            }


            return false;

        }


        /* =====================================================
           INTERNAL STATE
           ===================================================== */

        let state =
            readState();


        /* =====================================================
           GET
           ===================================================== */

        function get(
            appId,
            key,
            fallback = null
        ) {

            if (!appId) {

                return fallback;

            }


            const appState =
                state[
                    appId
                ];


            if (
                !appState ||
                typeof appState !==
                "object"
            ) {

                return fallback;

            }


            if (
                typeof key ===
                "undefined"
            ) {

                return {
                    ...appState
                };

            }


            return (
                Object.prototype.hasOwnProperty.call(
                    appState,
                    key
                )
                    ? appState[key]
                    : fallback
            );

        }


        /* =====================================================
           SET
           ===================================================== */

        function set(
            appId,
            key,
            value
        ) {

            if (
                !appId ||
                !key
            ) {

                return false;

            }


            if (
                !state[appId] ||
                typeof state[appId] !==
                "object"
            ) {

                state[appId] =
                    {};

            }


            state[appId][key] =
                value;


            state[appId].updatedAt =
                Date.now();


            const saved =
                writeState(
                    state
                );


            emit(
                "app-state:changed",
                {
                    appId,

                    key,

                    value,

                    saved
                }
            );


            return saved;

        }


        /* =====================================================
           SET MULTIPLE
           ===================================================== */

        function setMany(
            appId,
            values
        ) {

            if (
                !appId ||
                !values ||
                typeof values !==
                "object"
            ) {

                return false;

            }


            if (
                !state[appId] ||
                typeof state[appId] !==
                "object"
            ) {

                state[appId] =
                    {};

            }


            Object.assign(
                state[appId],
                values
            );


            state[appId].updatedAt =
                Date.now();


            const saved =
                writeState(
                    state
                );


            emit(
                "app-state:changed",
                {
                    appId,

                    values: {
                        ...values
                    },

                    saved
                }
            );


            return saved;

        }


        /* =====================================================
           REMOVE KEY
           ===================================================== */

        function remove(
            appId,
            key
        ) {

            if (
                !state[appId] ||
                !Object.prototype.hasOwnProperty.call(
                    state[appId],
                    key
                )
            ) {

                return false;

            }


            delete state[
                appId
            ][
                key
            ];


            state[
                appId
            ].updatedAt =
                Date.now();


            const saved =
                writeState(
                    state
                );


            emit(
                "app-state:removed",
                {
                    appId,

                    key,

                    saved
                }
            );


            return saved;

        }


        /* =====================================================
           CLEAR APP
           ===================================================== */

        function clear(
            appId
        ) {

            if (
                !appId
            ) {

                return false;

            }


            delete state[
                appId
            ];


            const saved =
                writeState(
                    state
                );


            emit(
                "app-state:cleared",
                {
                    appId,

                    saved
                }
            );


            return saved;

        }


        /* =====================================================
           EXPORT
           ===================================================== */

        function exportState() {

            return JSON.stringify(
                state,
                null,
                2
            );

        }


        /* =====================================================
           IMPORT
           ===================================================== */

        function importState(
            input
        ) {

            try {

                const parsed =
                    typeof input ===
                    "string"
                        ? JSON.parse(
                            input
                        )
                        : input;


                if (
                    !parsed ||
                    typeof parsed !==
                    "object"
                ) {

                    return false;

                }


                state =
                    parsed;


                const saved =
                    writeState(
                        state
                    );


                emit(
                    "app-state:imported",
                    {
                        saved
                    }
                );


                return saved;

            } catch (error) {

                console.error(
                    "[HalDo App State] Import fehlgeschlagen",
                    error
                );

                return false;

            }

        }


        /* =====================================================
           EVENT DISPATCH
           ===================================================== */

        function emit(
            eventName,
            detail = {}
        ) {

            if (
                typeof window.HalDoDispatch ===
                "function"
            ) {

                window.HalDoDispatch(
                    eventName,
                    detail
                );

                return;

            }


            try {

                document.dispatchEvent(
                    new CustomEvent(
                        `haldo:${eventName}`,
                        {
                            detail
                        }
                    )
                );

            } catch (error) {

                console.warn(
                    "[HalDo App State]",
                    error
                );

            }

        }


        /* =====================================================
           PUBLIC API
           ===================================================== */

        const appState = {

            get,

            set,

            setMany,

            remove,

            clear,

            export:
                exportState,

            import:
                importState

        };


        window.HalDoAppState =
            appState;


        if (
            !window.HalDoOS
        ) {

            window.HalDoOS =
                {};

        }


        window.HalDoOS.appState =
            appState;


        /* =====================================================
           INITIALIZATION
           ===================================================== */

        function initializeAppState() {

            emit(
                "app-state:ready",
                {

                    version:
                        "20.0.0",

                    timestamp:
                        Date.now()

                }
            );


            console.info(
                "%cHalDo AI OS 20%c App State bereit",
                "color:#42e6ff;font-weight:800;",
                "color:#ffffff;"
            );

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeAppState,
                {
                    once:
                        true
                }
            );

        } else {

            initializeAppState();

        }


    })();

    </script>

    <script>

    (() => {

        "use strict";


        /* =====================================================
           INTERNAL LISTENERS
           ===================================================== */

        const listeners =
            new Map();


        /* =====================================================
           SUBSCRIBE
           ===================================================== */

        function on(
            eventName,
            callback
        ) {

            if (
                typeof eventName !==
                "string" ||
                !eventName ||
                typeof callback !==
                "function"
            ) {

                return () => {};

            }


            if (
                !listeners.has(
                    eventName
                )
            ) {

                listeners.set(
                    eventName,
                    new Set()
                );

            }


            const collection =
                listeners.get(
                    eventName
                );


            collection.add(
                callback
            );


            return () => {

                off(
                    eventName,
                    callback
                );

            };

        }


        /* =====================================================
           UNSUBSCRIBE
           ===================================================== */

        function off(
            eventName,
            callback
        ) {

            const collection =
                listeners.get(
                    eventName
                );


            if (!collection) {

                return false;

            }


            const removed =
                collection.delete(
                    callback
                );


            if (
                collection.size ===
                0
            ) {

                listeners.delete(
                    eventName
                );

            }


            return removed;

        }


        /* =====================================================
           EMIT
           ===================================================== */

        function emit(
            eventName,
            payload = {}
        ) {

            if (
                typeof eventName !==
                "string" ||
                !eventName
            ) {

                return false;

            }


            const collection =
                listeners.get(
                    eventName
                );


            if (
                collection
            ) {

                for (
                    const callback
                    of Array.from(
                        collection
                    )
                ) {

                    try {

                        callback(
                            payload
                        );

                    } catch (error) {

                        console.error(
                            "[HalDo EventBus]",
                            eventName,
                            error
                        );

                    }

                }

            }


            try {

                document.dispatchEvent(
                    new CustomEvent(
                        `haldo:${eventName}`,
                        {
                            detail:
                                payload
                        }
                    )
                );

            } catch (error) {

                console.warn(
                    "[HalDo EventBus]",
                    error
                );

            }


            return true;

        }


        /* =====================================================
           ONCE
           ===================================================== */

        function once(
            eventName,
            callback
        ) {

            if (
                typeof callback !==
                "function"
            ) {

                return () => {};

            }


            const wrapper =
                payload => {

                    off(
                        eventName,
                        wrapper
                    );


                    callback(
                        payload
                    );

                };


            return on(
                eventName,
                wrapper
            );

        }


        /* =====================================================
           WAIT FOR EVENT
           ===================================================== */

        function waitFor(
            eventName,
            timeout = 10000
        ) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    let timer =
                        null;


                    const unsubscribe =
                        once(
                            eventName,
                            payload => {

                                if (
                                    timer
                                ) {

                                    clearTimeout(
                                        timer
                                    );

                                }


                                resolve(
                                    payload
                                );

                            }
                        );


                    if (
                        timeout > 0
                    ) {

                        timer =
                            setTimeout(
                                () => {

                                    unsubscribe();


                                    reject(
                                        new Error(
                                            `Timeout waiting for event: ${eventName}`
                                        )
                                    );

                                },
                                timeout
                            );

                    }

                }
            );

        }


        /* =====================================================
           CLEAR
           ===================================================== */

        function clear(
            eventName
        ) {

            if (
                typeof eventName ===
                "undefined"
            ) {

                listeners.clear();

                return true;

            }


            return listeners.delete(
                eventName
            );

        }


        /* =====================================================
           LIST EVENTS
           ===================================================== */

        function getEvents() {

            return Array.from(
                listeners.keys()
            );

        }


        /* =====================================================
           PUBLIC EVENT BUS
           ===================================================== */

        const eventBus = {

            on,

            off,

            once,

            emit,

            waitFor,

            clear,

            getEvents

        };


        /* =====================================================
           GLOBAL API
           ===================================================== */

        window.HalDoEventBus =
            eventBus;


        if (
            !window.HalDoOS
        ) {

            window.HalDoOS =
                {};

        }


        window.HalDoOS.eventBus =
            eventBus;


        /* =====================================================
           GLOBAL DISPATCH BRIDGE
           ===================================================== */

        window.HalDoDispatch =
            function (
                eventName,
                payload
            ) {

                return eventBus.emit(
                    eventName,
                    payload
                );

            };


        /* =====================================================
           CROSS-APP REQUESTS
           ===================================================== */

        function requestApp(
            appId,
            action,
            payload = {}
        ) {

            if (
                !appId ||
                !action
            ) {

                return false;

            }


            return emit(
                "app:request",
                {

                    appId,

                    action,

                    payload,

                    timestamp:
                        Date.now()

                }
            );

        }


        function broadcast(
            message,
            payload = {}
        ) {

            return emit(
                "app:broadcast",
                {

                    message,

                    payload,

                    timestamp:
                        Date.now()

                }
            );

        }


        window.HalDoOS.requestApp =
            requestApp;


        window.HalDoOS.broadcast =
            broadcast;


        /* =====================================================
           INITIALIZATION
           ===================================================== */

        function initializeEventBus() {

            emit(
                "event-bus:ready",
                {

                    version:
                        "20.0.0",

                    timestamp:
                        Date.now()

                }
            );


            console.info(
                "%cHalDo AI OS 20%c Event Bus bereit",
                "color:#42e6ff;font-weight:800;",
                "color:#ffffff;"
            );

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeEventBus,
                {
                    once:
                        true
                }
            );

        } else {

            initializeEventBus();

        }


    })();

    </script>

    <script>

    (() => {

        "use strict";


        /* =====================================================
           DEFAULT CAPABILITIES
           ===================================================== */

        const DEFAULT_CAPABILITIES = [

            "ui",

            "storage",

            "notifications",

            "ai",

            "voice",

            "network",

            "files",

            "clipboard",

            "system"

        ];


        /* =====================================================
           STATE
           ===================================================== */

        const permissions =
            new Map();


        /* =====================================================
           NORMALIZE
           ===================================================== */

        function normalize(
            value
        ) {

            if (
                Array.isArray(
                    value
                )
            ) {

                return Array.from(
                    new Set(
                        value
                            .map(
                                item =>
                                    String(
                                        item
                                    )
                                    .trim()
                                    .toLowerCase()
                            )
                            .filter(
                                Boolean
                            )
                    )
                );

            }


            if (
                typeof value ===
                "string"
            ) {

                return normalize(
                    value.split(
                        ","
                    )
                );

            }


            return [];

        }


        /* =====================================================
           REGISTER APP
           ===================================================== */

        function register(
            appId,
            capabilities = []
        ) {

            if (!appId) {

                return false;

            }


            const requested =
                normalize(
                    capabilities
                );


            permissions.set(
                appId,
                {

                    requested,

                    granted:
                        requested.filter(
                            capability =>
                                DEFAULT_CAPABILITIES.includes(
                                    capability
                                )
                        ),

                    denied:
                        requested.filter(
                            capability =>
                                !DEFAULT_CAPABILITIES.includes(
                                    capability
                                )
                        ),

                    updatedAt:
                        Date.now()

                }
            );


            emit(
                "permission:registered",
                {

                    appId,

                    capabilities:
                        requested

                }

            return true;

           GRANT

        function grant(

        ) {

                permissions.get(

            if (

                    capability

                record.requested.push(
                    capability

        /* =====================================================

        function has(
            appId,
            capability
        ) {

            const record =
                permissions.get(
                    appId
                );


            if (
                !record
            ) {

                return false;

            }


            capability =
                String(
                    capability
                )
                .trim()
                .toLowerCase();


            return record.granted.includes(
                capability
            );

        /* =====================================================
           GET APP PERMISSIONS

            const record =
                permissions.get(
                    appId

            if (
                !record

                return null;

            }


            return {

                requested:
                    [

                    ],

                granted:

                    ],

                        appId
                    }
                );

            }

                );

           NORMALIZE ROUTE
           ===================================================== */

        function normalizeRoute(
            route
        ) {

            if (
                typeof route ===
                "string"
            ) {

                return {

                    appId:
                        route
                            .replace(
                                /^#/,
                                ""
                            )
                            .trim(),

                    params:
                        {}

                };

            }

                            route.appId ||
                            route.id ||
                            ""
                        )
                        .replace(
                            /^#/,
                            ""
                        )
                        .trim(),

                    params:
                        {
                            ...(route.params || {})
                        }

                };

            }


            return {

                appId:
                    "",

                params:
                    {}

            };

        }

           NAVIGATE

        ) {

            }

                state.current;


            if (

                    {
                        ...previous
                    }

                    state.maxHistory
                ) {

                    state.history.shift();

                }

            }

                target;

                "router:navigate",
                {

                    from:

                            ...target

                previous;

                    from:
                        current,

                    to:
                        previous,

                    timestamp:
                        Date.now()

            return navigate(

            console.warn(
                "[HalDo App Host] App Layer fehlt."
            );

            return;

        }


        /* =====================================================
           INTERNAL APP HOSTS
           ===================================================== */

        const hosts =
            new Map();


        /* =====================================================
           EVENT DISPATCH
           ===================================================== */

        function emit(
            eventName,
            detail = {}
        ) {

            if (
                typeof window.HalDoDispatch ===
                "function"
            ) {

                window.HalDoDispatch(
                    eventName,
                    detail
                );

                return;

            }


            try {

                document.dispatchEvent(
                    new CustomEvent(
                        `haldo:${eventName}`,
                        {
                            detail
                        }
                    )
                );

            } catch (error) {

                console.warn(
                    "[HalDo App Host]",
                    error
                );

            }

        }


        /* =====================================================
           CREATE HOST
           ===================================================== */

        function createHost(
            appId,
            options = {}
        ) {

            if (
                !appId
            ) {

                return null;

            }


            const existing =
                hosts.get(
                    appId
                );


            if (
                existing
            ) {

                return existing;

            }


            const host =
                document.createElement(
                    "section"
                );


            host.className =
                "haldo-app-host";


            host.dataset.appId =
                appId;


            host.setAttribute(
                "role",
                "application"
            );


            host.setAttribute(
                "aria-label",
                String(
                    options.title ||
                    appId
                )
            );


            host.style.position =
                "absolute";


            host.style.inset =
                "0";


            host.style.display =
                "none";


            host.style.overflow =
                "auto";


            host.style.background =
                "rgba(5,7,13,0.94)";


            host.style.backdropFilter =
                "blur(18px)";


            host.style.webkitBackdropFilter =
                "blur(18px)";


            appLayer.appendChild(
                host
            );


            const record = {

                appId,

                element:
                    host,

                mounted:
                    false,

                visible:
                    false,

                createdAt:
                    Date.now(),

                updatedAt:
                    Date.now()

            };


            hosts.set(
                appId,
                record
            );


            emit(
                "app-host:created",
                {

                    appId,

                    element:
                        host

                }
            );


            return record;

        }


        /* =====================================================
           MOUNT
           ===================================================== */

        function mount(
            appId,
            content
        ) {

            const record =
                hosts.get(
                    appId
                ) ||
                createHost(
                    appId
                );


            if (!record) {

                return false;

            }


            const element =
                record.element;


            try {

                if (
                    content instanceof
                    Node
                ) {

                    element.replaceChildren(
                        content
                    );

                } else if (
                    typeof content ===
                    "string"
                ) {

                    element.innerHTML =
                        content;

                } else if (
                    content &&
                    typeof content.render ===
                    "function"
                ) {

                    const rendered =
                        content.render();


                    if (
                        rendered instanceof
                        Node
                    ) {

                        element.replaceChildren(
                            rendered
                        );

                    } else {

                        element.innerHTML =
                            String(
                                rendered ||
                                ""
                            );

                    }

                } else {

                    element.innerHTML =
                        "";

                }


                record.mounted =
                    true;


                record.updatedAt =
                    Date.now();


                emit(
                    "app-host:mounted",
                    {
                        appId
                    }
                );


                return true;

            } catch (error) {

                console.error(
                    "[HalDo App Host] Mount",
                    error
                );


                emit(

                        appId,

                );

        function show(
            appId

                hosts.get(
                    appId
                );


            if (!record) {

                return false;

            }


            for (
                const item
                of hosts.values()
            ) {

                item.visible =
                    false;

                item.element.style.display =
                    "none";

                item.element.setAttribute(
                    "aria-hidden",
                    "true"
                );

            record.visible =
                true;


            record.element.style.display =
                "block";


            record.element.removeAttribute(
                "aria-hidden"
            );


            record.updatedAt =

            emit(

                    appId
                }
            );


            return true;

        }

        function hide(
            appId
        ) {

            const record =
                hosts.get(
                    appId
                );


            if (!record) {

                return false;

            }


            record.visible =
                false;


            record.element.style.display =
                "none";


            record.element.setAttribute(
                "aria-hidden",
                "true"
            );


            record.updatedAt =
                Date.now();


            emit(
                "app-host:hidden",
                {
                    appId
                }
            );


            return true;

        }


        /* =====================================================
           CLEAR
           ===================================================== */

        function clear(
            appId
        ) {

            const record =
                hosts.get(
                    appId
                );


            if (!record) {

                return false;

            }


            record.element.replaceChildren();


            record.mounted =
                false;


            record.updatedAt =
                Date.now();


            emit(
                "app-host:cleared",
                {
                    appId
                }
            );


            return true;

        }


        /* =====================================================
           DESTROY
           ===================================================== */

        function destroy(
            appId
        ) {

            const record =
                hosts.get(
                    appId
                );


            if (!record) {

                return false;

            }


            record.element.remove();


            hosts.delete(
                appId
            );


            emit(
                "app-host:destroyed",
                {
                    appId
                }
            );


            return true;

        }


        /* =====================================================
           GET
           ===================================================== */

        function get(
            appId
        ) {

            const record =
                hosts.get(
                    appId
                );


            if (!record) {

                return null;

            }


            return {

                appId,

                    record.element,

                mounted:
                    record.mounted,

                visible:
                    record.visible,

                    record.createdAt,

                updatedAt:
                    record.updatedAt

           GET ALL
           ===================================================== */

        function getAll() {

            return Array.from(
                hosts.keys()
            ).map(
                get
            );

           PUBLIC API
           ===================================================== */

           GLOBAL API
           ===================================================== */

        window.HalDoAppHost =

        if (

        ) {

            window.HalDoOS =
                {};

        window.HalDoOS.appHost =

           ===================================================== */

            new Map();

           EVENT DISPATCH
           ===================================================== */

        function emit(
            eventName,
            detail = {}
        ) {

            if (
                typeof window.HalDoDispatch ===
                "function"
            ) {

                window.HalDoDispatch(
                    eventName,
                    detail
                );

            }

                        }
                    )

                );

           ===================================================== */

        function register(

            service,
            options = {}
        ) {

            ) {

                return false;

            }


            services.set(
                name,
                {

                    name,

                    service,

                    singleton:
                        options.singleton !==
                        false,

                    dependencies:
                        Array.isArray(
                            options.dependencies
                        )
                            ? [
                                ...options.dependencies
                            ]
                            : [],

                    state:
                        "registered",

                    createdAt:
                        Date.now(),

                    updatedAt:
                        Date.now()

                }
            );

                    name
                }
            );

        }

           GET SERVICE
           ===================================================== */

            name
        ) {

                services.get(

                );

           GET RECORD
           ===================================================== */

        function getRecord(
            name
        ) {

            const record =
                services.get(
                    name
                );


            if (!record) {

                return null;

            }


            return {

                name:
                    record.name,

                service:
                    record.service,

                singleton:
                    record.singleton,

                dependencies:
                    [

                    record.state,

                createdAt:
                    record.createdAt,

                updatedAt:
                    record.updatedAt

            };

        }


        /* =====================================================
           RESOLVE DEPENDENCIES
           ===================================================== */

        function resolveDependencies(
            name,
            stack = []
        ) {

            const record =
                services.get(
                    name
                );


            if (!record) {

                return {

                    success:
                        false,

                    missing:
                        [
                            name
                        ]

                };

            }


            if (
                stack.includes(
                    name
                )
            ) {

                return {

                    success:
                        false,

                    circular:
                        [
                            ...stack,
                            name
                        ]

                };

            }


            const resolved =
                {};


            for (
                const dependency
                of record.dependencies
            ) {

                const dependencyRecord =
                    services.get(
                        dependency
                    );


                if (
                    !dependencyRecord
                ) {

                    return {

                        success:
                            false,

                        missing:
                            [
                                dependency
                            ]

                    };

                }


                const result =
                    resolveDependencies(
                        dependency,
                        [
                            ...stack,
                            name
                        ]
                    );


                if (
                    !result.success
                ) {

                    return result;

                }


                resolved[
                    dependency
                ] =
                    dependencyRecord.service;

                success:

                dependencies:

                        name

                emit(

                        name
                    }

                            )

                );

                    error
                );


                return false;

            }

        }

           INITIALIZE ALL
           ===================================================== */

                Array.from(
                    services.keys()
                );

                    );

                    }
                );

            );
