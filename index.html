<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apps Web 3.0</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1f6feb">

<link rel="apple-touch-icon" href="icon.png">

</head>


<body>


<div class="app">


<header>

<h1>Apps Web 3.0</h1>

<p id="subtitle">Login</p>

</header>



<!-- LOGIN -->

<section id="loginPage" class="page">

<h2>Anmelden</h2>

<input id="loginName" placeholder="Benutzername">

<input id="loginPassword" type="password" placeholder="Passwort">


<button onclick="login()">
Anmelden
</button>


</section>




<!-- DASHBOARD -->

<section id="dashboard" class="page hidden">


<h2>
Dashboard
</h2>


<div class="profile-box">


<div class="avatar">
👤
</div>


<p>
Benutzer:
<span id="activeUser"></span>
</p>


<p>
Status:
🟢 Online
</p>


</div>



<div class="dashboard-grid">


<button onclick="openChat()">
💬
<span>KI Chat</span>
</button>


<button onclick="openProfile()">
👤
<span>Profil</span>
</button>


<button>
☁️
<span>Cloud</span>
</button>


<button>
🔔
<span>Info</span>
</button>


</div>


</section>





<!-- CHAT -->


<section id="chatPage" class="page hidden">


<h2>KI Chat</h2>


<div id="chatBox" class="chat"></div>


<div class="input-area">


<input id="messageInput"
placeholder="Frage eingeben...">


<button onclick="sendMessage()">
➤
</button>


</div>


</section>





<!-- PROFIL -->


<section id="profilePage" class="page hidden">


<h2>Mein Profil</h2>


<div class="avatar big">
👤
</div>


<input id="profileName"
placeholder="Neuer Name">


<button onclick="changeName()">
Speichern
</button>


</section>





<nav>


<button onclick="goDashboard()">
🏠
<br>
Home
</button>


<button onclick="openChat()">
🤖
<br>
KI
</button>


<button onclick="openProfile()">
👤
<br>
Profil
</button>


</nav>



</div>



<script src="script.js"></script>


</body>

</html>
