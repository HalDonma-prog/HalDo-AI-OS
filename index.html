    <style>

        /* =====================================================
           GLOBAL RESET
           ===================================================== */

        *,
        *::before,
        *::after {

            box-sizing:
                border-box;

        }


        html,
        body {

            width:
                100%;

            height:
                100%;

            margin:
                0;

            padding:
                0;

            overflow:
                hidden;

            background:
                #050816;

            color:
                #ffffff;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing:
                antialiased;

            text-rendering:
                optimizeLegibility;

        }


        body {

            min-width:
                320px;

            min-height:
                100dvh;

            user-select:
                none;

            -webkit-user-select:
                none;

        }


        button,
        input,
        textarea,
        select {

            font:
                inherit;

        }


        button {

            border:
                0;

            outline:
                none;

        }


        img {

            max-width:
                100%;

            display:
                block;

        }


        /* =====================================================
           MAIN OS ROOT
           ===================================================== */

        #haldo-os {

            position:
                fixed;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            background:
                #050816;

        }


        #haldo-root {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

        }


        /* =====================================================
           COSMIC WORLD LAYER
           ===================================================== */

        .haldo-cosmic-world {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            z-index:
                0;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(255,180,50,.08),
                    rgba(10,18,45,.34) 32%,
                    #030611 78%,
                    #010208 100%
                );

        }


        .haldo-cosmic-stars {

            position:
                absolute;

            inset:
                0;

            overflow:
                hidden;

            pointer-events:
                none;

        }


        .haldo-cosmic-planets {

            position:
                absolute;

            inset:
                0;

            overflow:
                hidden;

            pointer-events:
                none;

        }


        .haldo-cosmic-sun {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                clamp(
                    90px,
                    16vw,
                    180px
                );

            height:
                clamp(
                    90px,
                    16vw,
                    180px
                );

            transform:
                translate(
                    -50%,
                    -50%
                );

            border-radius:
                50%;

            cursor:
                pointer;

            z-index:
                10;

            background:
                radial-gradient(
                    circle,
                    #fffbe8 0%,
                    #fff0a0 20%,
                    #ffc84d 42%,
                    #ff9d22 62%,
                    rgba(255,130,20,.18) 78%,
                    transparent 100%
                );

            box-shadow:
                0 0 25px
                    rgba(255,220,100,.95),
                0 0 70px
                    rgba(255,180,40,.72),
                0 0 150px
                    rgba(255,130,20,.40);

            animation:
                haldoSunPulse
                4.5s
                ease-in-out
                infinite;

        }


        .haldo-cosmic-sun::before {

            content:
                "";

            position:
                absolute;

            inset:
                -28%;

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,245,180,.38),
                    rgba(255,180,40,.12) 45%,
                    transparent 72%
                );

            filter:
                blur(8px);

            animation:
                haldoSunGlow
                5s
                ease-in-out
                infinite;

        }


        @keyframes haldoSunPulse {

            0%,
            100% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1);

            }

            50% {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1.035);

            }

        }


        @keyframes haldoSunGlow {

            0%,
            100% {

                opacity:
                    .55;

                transform:
                    scale(.96);

            }

            50% {

                opacity:
                    .95;

                transform:
                    scale(1.05);

            }

        }


        /* =====================================================
           MAIN UI LAYER
           ===================================================== */

        .haldo-ui-layer {

            position:
                absolute;

            inset:
                0;

            z-index:
                100;

            pointer-events:
                none;

        }


        .haldo-ui-layer > * {

            pointer-events:
                auto;

        }


        /* =====================================================
           MENU BUTTON – HALDO LOGO
           ===================================================== */

        .haldo-main-menu-button {

            position:
                fixed;

            top:
                max(
                    14px,
                    env(
                        safe-area-inset-top
                    )
                );

            right:
                max(
                    14px,
                    env(
                        safe-area-inset-right
                    )
                );

            z-index:
                1000;

            width:
                58px;

            min-height:
                64px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                3px;

            padding:
                4px;

            border-radius:
                12px;

            background:
                rgba(
                    5,
                    10,
                    25,
                    .38
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            cursor:
                pointer;

        }


        .haldo-main-menu-button
        img {

            width:
                36px;

            height:
                36px;

            object-fit:
                contain;

            filter:
                drop-shadow(
                    0 0 9px
                    rgba(
                        255,
                        220,
                        100,
                        .45
                    )
                );

        }


        .haldo-main-menu-button
        span {

            font-size:
                9px;

            line-height:
                1;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .82
                );

        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (
            max-width: 600px
        ) {

            .haldo-main-menu-button {

                width:
                    52px;

                min-height:
                    58px;

                border-radius:
                    11px;

            }


            .haldo-main-menu-button
            img {

                width:
                    32px;

                height:
                    32px;

            }


            .haldo-main-menu-button
            span {

                font-size:
                    8px;

            }

        }


        @media (
            min-width: 1200px
        ) {

            .haldo-main-menu-button {

                width:
                    68px;

                min-height:
                    74px;

            }


            .haldo-main-menu-button
            img {

                width:
                    42px;

                height:
                    42px;

            }

        }

    </style>

</head>

    <!-- =========================================================
         HALDO GLOBAL FOUNDATION
         ========================================================= -->

    <script>

        "use strict";


        window.HalDo =
            window.HalDo ||
            {};


        const HD =
            window.HalDo;


        /*
         * ========================================================
         * SYSTEM IDENTITY
         * ========================================================
         */

        HD.name =
            "HalDo AI OS";

        HD.product =
            "HalDo AI OS 22";

        HD.version =
            "22.0.0";

        HD.versionMajor =
            22;

        HD.codename =
            "Cosmic World";

        HD.build =
            "HALDO-OS-22-MASTER";

        HD.platform =
            "web-pwa";


        /*
         * ========================================================
         * GLOBAL FLAGS
         * ========================================================
         */

        HD.started =
            false;

        HD.ready =
            false;

        HD.booted =
            false;

        HD.online =
            navigator.onLine;

        HD.initialized =
            false;

        HD.shutdownRequested =
            false;


        /*
         * ========================================================
         * TIMING
         * ========================================================
         */

        HD.createdAt =
            Date.now();

        HD.bootTime =
            Date.now();


        /*
         * ========================================================
         * GLOBAL SYSTEM CONTAINERS
         * ========================================================
         */

        HD.config =
            HD.config ||
            {};

        HD.state =
            HD.state ||
            {};

        HD.system =
            HD.system ||
            {};

        HD.runtime =
            HD.runtime ||
            {};

        HD.events =
            HD.events ||
            {};

        HD.services =
            HD.services ||
            {};

        HD.apps =
            HD.apps ||
            {};

        HD.storage =
            HD.storage ||
            {};

        HD.persistence =
            HD.persistence ||
            {};

        HD.ai =
            HD.ai ||
            {};

        HD.language =
            HD.language ||
            {};

        HD.voice =
            HD.voice ||
            {};

        HD.speech =
            HD.speech ||
            {};

        HD.keyboard =
            HD.keyboard ||
            {};

        HD.cosmic =
            HD.cosmic ||
            {};

        HD.windows =
            HD.windows ||
            {};

        HD.update =
            HD.update ||
            {};

        HD.backup =
            HD.backup ||
            {};

        HD.migration =
            HD.migration ||
            {};

        HD.recovery =
            HD.recovery ||
            {};

        HD.pwa =
            HD.pwa ||
            {};

        HD.network =
            HD.network ||
            {};

        HD.security =
            HD.security ||
            {};

        HD.ui =
            HD.ui ||
            {};


        /*
         * ========================================================
         * GLOBAL CONSTANTS
         * ========================================================
         */

        HD.constants = {

            version:
                "22.0.0",

            storagePrefix:
                "haldo-ai-os-22:",

            defaultLanguage:
                "de",

            defaultTheme:
                "cosmic",

            defaultWindowWidth:
                720,

            defaultWindowHeight:
                480,

            minimumWindowWidth:
                320,

            minimumWindowHeight:
                220,

            maximumWindowWidth:
                1920,

            maximumWindowHeight:
                1200,

            animationEnabled:
                true,

            persistenceEnabled:
                true,

            cosmicWorldEnabled:
                true,

            aiEnabled:
                true,

            voiceEnabled:
                true,

            speechEnabled:
                true,

            offlineEnabled:
                true,

            pwaEnabled:
                true

        };


        /*
         * ========================================================
         * SYSTEM CONFIGURATION
         * ========================================================
         */

        HD.config = {

            ...HD.config,

            product:
                "HalDo AI OS",

            version:
                "22.0.0",

            codename:
                "Cosmic World",

            language:
                "de",

            theme:
                "cosmic",

            responsive:
                true,

            compactWindows:
                true,

            cosmicWorld:
                true,

            ai:
                true,

            voice:
                true,

            speech:
                true,

            persistence:
                true

        };


        /*
         * ========================================================
         * DEVICE INFORMATION
         * ========================================================
         */

        HD.device = {

            width:
                window.innerWidth,

            height:
                window.innerHeight,

            type:
                "desktop",

            online:
                navigator.onLine,

            touch:
                "ontouchstart"
                in window,

            update:
                function() {

                    this.width =
                        window.innerWidth;

                    this.height =
                        window.innerHeight;

                    this.online =
                        navigator.onLine;


                    if (
                        this.width < 700
                    ) {

                        this.type =
                            "mobile";

                    }

                    else if (
                        this.width < 1000
                    ) {

                        this.type =
                            "tablet";

                    }

                    else {

                        this.type =
                            "desktop";

                    }

                }

        };


        HD.device.update();


        /*
         * ========================================================
         * GLOBAL ERROR HANDLING
         * ========================================================
         */

        HD.errors = {

            history:
                [],

            report:
                function(
                    error,
                    source = "unknown"
                ) {

                    const entry = {

                        source,

                        message:
                            error &&
                            error.message
                                ? error.message
                                : String(
                                    error
                                ),

                        time:
                            Date.now()

                    };


                    this.history.push(
                        entry
                    );


                    console.error(
                        "[HalDo]",
                        source,
                        error
                    );


                    if (
                        typeof HD.emit ===
                        "function"
                    ) {

                        HD.emit(
                            "system:error",
                            entry
                        );

                    }

                }

        };


        /*
         * ========================================================
         * BASIC EVENT BUS
         * ========================================================
         */

        HD.events =
            HD.events ||
            {};


        HD.events.listeners =
            HD.events.listeners ||
            new Map();


        HD.on =
            function(
                event,
                handler
            ) {

                if (
                    typeof handler !==
                    "function"
                ) {

                    return () => {};

                }


                if (
                    !this.events.listeners.has(
                        event
                    )
                ) {

                    this.events.listeners.set(
                        event,
                        new Set()
                    );

                }


                this.events.listeners
                    .get(event)
                    .add(handler);


                return () => {

                    this.events.listeners
                        .get(event)
                        ?.delete(
                            handler
                        );

                };

            };


        HD.emit =
            function(
                event,
                detail
            ) {

                const listeners =
                    this.events.listeners
                        .get(event);


                if (
                    !listeners
                ) {

                    return;

                }


                listeners.forEach(
                    handler => {

                        try {

                            handler(
                                detail
                            );

                        }

                        catch(error) {

                            this.errors.report(
                                error,
                                "event:" +
                                event
                            );

                        }

                    }
                );

            };


        /*
         * ========================================================
         * GLOBAL WINDOW EVENTS
         * ========================================================
         */

        window.addEventListener(
            "online",
            function() {

                HD.online =
                    true;

                HD.device.online =
                    true;


                if (
                    HD.system &&
                    typeof HD.system.setStatus ===
                    "function"
                ) {

                    HD.system.setStatus(
                        "online"
                    );

                }


                HD.emit(
                    "network:online"
                );

            }
        );


        window.addEventListener(
            "offline",
            function() {

                HD.online =
                    false;

                HD.device.online =
                    false;


                if (
                    HD.system &&
                    typeof HD.system.setStatus ===
                    "function"
                ) {

                    HD.system.setStatus(
                        "offline"
                    );

                }


                HD.emit(
                    "network:offline"
                );

            }
        );


        window.addEventListener(
            "resize",
            function() {

                HD.device.update();


                HD.emit(
                    "device:resize",
                    {
                        width:
                            HD.device.width,

                        height:
                            HD.device.height,

                        type:
                            HD.device.type
                    }
                );

            }
        );


        /*
         * ========================================================
         * PAGE VISIBILITY
         * ========================================================
         */

        document.addEventListener(
            "visibilitychange",
            function() {

                const visible =
                    document.visibilityState ===
                    "visible";


                HD.emit(
                    visible
                        ? "system:visible"
                        : "system:hidden"
                );

            }
        );


        /*
         * ========================================================
         * BUILD INFORMATION
         * ========================================================
         */

        HD.buildInfo = {

            product:
                "HalDo AI OS 22",

            version:
                "22.0.0",

            codename:
                "Cosmic World",

            architecture:
                "Integrated Modular AI Operating System",

            shell:
                "index.html",

            generated:
                "HalDo Master Architecture",

            status:
                "START · ONLINE"

        };


        HD.emit(
            "foundation:ready"
        );

    </script>
        <!-- =========================================================

         PART 2 / 16
         CORE STATE + SETTINGS + PERSISTENCE FOUNDATION
         ========================================================= -->

    <script>

        "use strict";

        const HD2 =
            window.HalDo;


        /* ========================================================
           SAFE OBJECT HELPERS
           ======================================================== */

        HD2.utils =
            HD2.utils ||
            {};

        HD2.utils.isObject =
            function(value) {

                return (
                    value !== null &&
                    typeof value === "object" &&
                    !Array.isArray(value)
                );

            };


        HD2.utils.merge =
            function(
                target,
                source
            ) {

                if (
                    !HD2.utils.isObject(
                        target
                    )
                ) {

                    target = {};

                }

                if (
                    !HD2.utils.isObject(
                        source
                    )
                ) {

                    return target;

                }

                Object.keys(
                    source
                ).forEach(
                    key => {

                        const value =
                            source[key];

                        if (
                            HD2.utils.isObject(
                                value
                            )
                        ) {

                            target[key] =
                                HD2.utils.merge(
                                    HD2.utils.isObject(
                                        target[key]
                                    )
                                        ? target[key]
                                        : {},
                                    value
                                );

                        }

                        else {

                            target[key] =
                                value;

                        }

                    }
                );

                return target;

            };


        HD2.utils.clone =
            function(value) {

                try {

                    return JSON.parse(
                        JSON.stringify(
                            value
                        )
                    );

                }

                catch {

                    return value;

                }

            };


        /* ========================================================
           DEFAULT HALDO WORLD SETTINGS
           ======================================================== */

        HD2.worldDefaults = {

            sun: {

                enabled:
                    true,

                rays:
                    true,

                glow:
                    true,

                intensity:
                    1,

                size:
                    1

            },


            sky: {

                enabled:
                    true,

                starlight:
                    true,

                automaticColor:
                    true,

                color:
                    "#050816",

                stars:
                    365,

                brightness:
                    1

            },


            planets: {

                enabled:
                    true,

                count:
                    12,

                earth:
                    true,

                moon:
                    true,

                orbits:
                    true,

                individualRotation:
                    true,

                individualDirection:
                    true,

                glow:
                    true,

                speed:
                    "normal"

            },


            year: {

                enabled:
                    true,

                automatic:
                    true,

                days:
                    365,

                highlightToday:
                    true,

                pastDays:
                    true,

                futureDays:
                    true

            },


            audio: {

                appOpenSound:
                    true,

                volume:
                    0.55

            },


            ai: {

                enabled:
                    true,

                greeting:
                    true,

                greetingText:
                    "Willkommen bei HalDo AI. Schön, dass du da bist.",

                voice:
                    true,

                autoOpen:
                    true

            },


            interface: {

                compactWindows:
                    true,

                responsive:
                    true,

                centeredWindows:
                    true,

                animations:
                    true

            }

        };


        /* ========================================================
           USER SETTINGS
           ======================================================== */

        HD2.settings =
            HD2.settings ||
            HD2.utils.clone(
                HD2.worldDefaults
            );


        HD2.settings.world =
            HD2.settings.world ||
            HD2.utils.clone(
                HD2.worldDefaults
            );


        /* ========================================================
           STORAGE FOUNDATION
           ======================================================== */

        HD2.persistence =
            HD2.persistence ||
            {};


        HD2.persistence.key =
            "haldo-ai-os-22:settings";


        HD2.persistence.available =
            typeof window.localStorage !==
            "undefined";


        HD2.persistence.load =
            function() {

                if (
                    !this.available
                ) {

                    return null;

                }


                try {

                    const raw =
                        window.localStorage.getItem(
                            this.key
                        );


                    if (
                        !raw
                    ) {

                        return null;

                    }


                    return JSON.parse(
                        raw
                    );

                }

                catch(error) {

                    HD2.errors?.report(
                        error,
                        "persistence:load"
                    );

                    return null;

                }

            };


        HD2.persistence.save =
            function(
                data
            ) {

                if (
                    !this.available
                ) {

                    return false;

                }


                try {

                    window.localStorage.setItem(
                        this.key,
                        JSON.stringify(
                            data
                        )
                    );


                    return true;

                }

                catch(error) {

                    HD2.errors?.report(
                        error,
                        "persistence:save"
                    );

                    return false;

                }

            };


        /* ========================================================
           RESTORE SAVED SETTINGS
           ======================================================== */

        const savedHalDoSettings =
            HD2.persistence.load();


        if (
            savedHalDoSettings &&
            HD2.utils.isObject(
                savedHalDoSettings
            )
        ) {

            HD2.settings =
                HD2.utils.merge(
                    HD2.utils.clone(
                        HD2.worldDefaults
                    ),
                    savedHalDoSettings
                );

        }


        /* ========================================================
           SETTING GETTER
           ======================================================== */

        HD2.getSetting =
            function(
                path,
                fallback = undefined
            ) {

                if (
                    typeof path !==
                    "string"
                ) {

                    return fallback;

                }


                const parts =
                    path
                        .split(".")
                        .filter(
                            Boolean
                        );


                let current =
                    HD2.settings;


                for (
                    const part of parts
                ) {

                    if (
                        current === null ||
                        current === undefined
                    ) {

                        return fallback;

                    }


                    current =
                        current[part];

                }


                return (
                    current === undefined
                        ? fallback
                        : current
                );

            };


        /* ========================================================
           SETTING SETTER
           ======================================================== */

        HD2.setSetting =
            function(
                path,
                value,
                options = {}
            ) {

                if (
                    typeof path !==
                    "string"
                ) {

                    return false;

                }


                const parts =
                    path
                        .split(".")
                        .filter(
                            Boolean
                        );


                if (
                    !parts.length
                ) {

                    return false;

                }


                let current =
                    HD2.settings;


                for (
                    let i = 0;
                    i < parts.length - 1;
                    i++
                ) {

                    const part =
                        parts[i];


                    if (
                        !HD2.utils.isObject(
                            current[part]
                        )
                    ) {

                        current[part] =
                            {};

                    }


                    current =
                        current[part];

                }


                current[
                    parts[
                        parts.length - 1
                    ]
                ] =
                    value;


                if (
                    options.save !== false
                ) {

                    HD2.persistence.save(
                        HD2.settings
                    );

                }


                HD2.emit(
                    "settings:changed",
                    {
                        path,
                        value
                    }
                );


                HD2.emit(
                    "world:settingsChanged",
                    {
                        path,
                        value
                    }
                );


                return true;

            };


        /* ========================================================
           RESET SETTINGS
           ======================================================== */

        HD2.resetSettings =
            function() {

                HD2.settings =
                    HD2.utils.clone(
                        HD2.worldDefaults
                    );


                HD2.persistence.save(
                    HD2.settings
                );


                HD2.emit(
                    "settings:reset",
                    HD2.settings
                );


                HD2.emit(
                    "world:settingsChanged",
                    HD2.settings
                );


                return true;

            };


        /* ========================================================
           HALDO WORLD STATE
           ======================================================== */

        HD2.world =
            HD2.world ||
            {};


        HD2.world.state =
            HD2.world.state ||
            {

                initialized:
                    false,

                running:
                    false,

                paused:

                    ),

                    HD2.getSetting(
                        "planets.enabled",
                        true
                    ),

                sunVisible:
                    HD2.getSetting(
                        "sun.enabled",
                        true
                    )

            };


        /* ========================================================
           DAY OF YEAR
           ======================================================== */

        HD2.world.getDayOfYear =
            function(
                date = new Date()
            ) {

                const start =
                    new Date(
                        date.getFullYear(),
                        0,
                        0
                    );


                const difference =
                    date -
                    start;


                const oneDay =
                    1000 *
                    60 *
                    60 *
                    24;


                return Math.floor(
                    difference /
                    oneDay
                );

            };


        HD2.world.updateCalendar =
            function() {

                const now =
                    new Date();


                this.state.dayOfYear =
                    this.getDayOfYear(
                        now
                    );


                this.state.year =
                    now.getFullYear();


                HD2.emit(
                    "world:calendarChanged",
                    {
                        dayOfYear:
                            this.state.dayOfYear,

                        year:
                            this.state.year
                    }
                );

            };


        /* ========================================================
           APPLY WORLD SETTINGS
           ======================================================== */

        HD2.world.applySettings =
            function() {

                this.state.sunVisible =
                    !!HD2.getSetting(
                        "sun.enabled",

                if (

                            rgba(10,18,45,.34) 32%,

                            #010208 100%

                HD2.emit(

                    }

        /* ========================================================
           INITIAL CALENDAR STATE

        /* ========================================================
           FOUNDATION READY

        HD2.emit(
            "settings:ready",
            HD2.settings
        );


        HD2.emit(
            "persistence:ready"

        HD3.cosmic.updateCenter =

                this.engine.centerX =
                    width / 2;


                this.engine.centerY =

        /* ========================================================
           STAR CREATION
           ======================================================== */

        HD3.cosmic.createStars =
            function() {

                const container =
                    document.getElementById(
                        "haldo-cosmic-stars"
                    );


                if (
                    !container
                ) {

                    return;

                }


                container.innerHTML =
                    "";


                this.engine.stars =
                    [];

                this.engine.starElements =
                    [];


                const requested =
                    Math.max(
                        1,
                        Math.min(
                            365,
                            Number(
                                HD3.getSetting(
                                    "sky.stars",
                                    365
                                )
                            )
                        )
                    );


                const today =
                    HD3.world.getDayOfYear();


                for (
                    let i = 0;
                    i < requested;
                    i++
                ) {

                    const star =
                        document.createElement(
                            "span"
                        );


                    star.className =
                        "haldo-star";


                    const x =
                        Math.random() *
                        100;


                    const y =
                        Math.random() *
                        100;


                    const brightness =
                        0.25 +
                        Math.random() *
                        0.75;


                    const hue =
                        185 +
                        Math.random() *
                        55;


                    star.style.left =
                        x + "%";


                    star.style.top =
                        y + "%";


                    star.style.opacity =
                        brightness;


                    star.style.color =
                        `hsl(
                            ${hue},
                            35%,
                            92%
                        )`;


                    /*
                     * The first stars represent
                     * the beginning of the year,
                     * while later stars represent
                     * future days.
                     */

                    if (
                        i ===
                        today - 1
                    ) {

                        star.classList.add(
                            "haldo-today"
                        );

                    }


                    if (
                        i <
                        today - 1
                    ) {

                        star.style.opacity =
                            Math.min(
                                1,
                                brightness +
                                0.22
                            );

                        star.style.transform =
                            "translate(-50%, -50%) scale(1.18)";

                    }


                    container.appendChild(
                        star
                    );


                    this.engine.stars.push(
                        {
                            index:
                                i,

                            x,

                            y,

                            brightness,

                            hue,

                            element:
                                star
                        }
                    );


                    this.engine.starElements.push(
                        star
                    );

                }

            };


        /* ========================================================

        HD3.cosmic.createOrbits =

                            );

                        orbit.style.height =

                                );

                                orbit,

                            planetElement:

                            radius:
                                diameter / 2,

                            angle:
                                definition.phase

                        ) {

                                document.createElement(

                                );

                            );

                            .push(
                                orbit
                            );


                        this.engine.planetElements
                            .push(
                                planet
                            );


                        this.engine.planets
                            .push(
                                data
                            );

                    }
                );

            };


        /* ========================================================
           PLANET POSITION UPDATE
           ======================================================== */

        HD3.cosmic.updatePlanets =
            function(
                delta
            ) {

                const centerX =
                    this.engine.centerX;


                const centerY =
                    this.engine.centerY;


                const speedSetting =
                    HD3.getSetting(
                        "planets.speed",
                        "normal"
                    );


                let multiplier =
                    1;


                if (
                    speedSetting ===
                    "slow"
                ) {

                    multiplier =
                        0.45;

                }

                else if (
                    speedSetting ===
                    "fast"
                ) {

                    multiplier =
                        2;

                }


                this.engine.planets.forEach(
                    planet => {

                        planet.angle +=
                            delta *
                            0.00025 *
                            planet.speed *
                            planet.direction *
                            multiplier;


                        const x =
                            centerX +
                            Math.cos(
                                planet.angle
                            ) *
                            planet.radius;


                        const y =
                            centerY +
                            Math.sin(
                                planet.angle
                            ) *
                            planet.radius *
                            0.62;


                        planet.planetElement.style.left =
                            x + "px";


                        planet.planetElement.style.top =
                            y + "px";


                        if (
                            planet.moonElement
                        ) {

                            planet.moonAngle +=
                                delta *
                                0.0018;


                            const moonRadius =
                                planet.size *
                                1.45;


                            planet.moonElement.style.left =
                                (
                                    50 +
                                    Math.cos(
                                        planet.moonAngle
                                    ) *
                                    100
                                ) + "%";


                            planet.moonElement.style.top =
                                (
                                    50 +
                                    Math.sin(
                                        planet.moonAngle
                                    ) *
                                    70
                                ) + "%";

                        }

                    }
                );

            };


        /* ========================================================
           STAR ANIMATION
           ======================================================== */

        HD3.cosmic.updateStars =
            function(
                time
            ) {

                const animationEnabled =
                    HD3.getSetting(
                        "interface.animations",
                        true
                    );


                if (
                    !animationEnabled
                ) {

                    return;

                }


                this.engine.stars.forEach(
                    (star, index) => {

                        const wave =
                            Math.sin(
                                time *
                                0.0012 +
                                index *
                                0.73
                            );


                        const base =
                            star.brightness;


                        star.element.style.opacity =
                            Math.max(
                                0.12,
                                Math.min(
                                    1,
                                    base +
                                    wave *
                                    0.12
                                )
                            );

                    }
                );

            };


        /* ========================================================
           COSMIC ANIMATION LOOP
           ======================================================== */

        HD3.cosmic.animate =
            function(
                time
            ) {

                if (
                    !this.engine.running
                ) {

                    return;

                }


                const delta =
                    this.engine.lastTime
                        ? time -
                          this.engine.lastTime
                        : 16;


                this.engine.lastTime =
                    time;


                this.updateStars(
                    time
                );


                this.updatePlanets(
                    delta
                );


                this.engine.frame =
                    requestAnimationFrame(
                        this.animate.bind(
                            this
                        )
                    );

            };


        /* ========================================================
           START COSMIC WORLD
           ======================================================== */

        HD3.cosmic.start =
            function() {

                if (
                    this.engine.running
                ) {

                    return;

                }


                this.updateCenter();

                this.injectStyles();

                this.createStars();

                this.createOrbits();


                this.engine.initialized =
                    true;

                this.engine.running =
                    true;


                this.engine.lastTime =
                    0;


                this.engine.frame =
                    requestAnimationFrame(
                        this.animate.bind(
                            this
                        )
                    );


                HD3.world.applySettings();


                HD3.emit(
                    "cosmic:started"
                );

            };


        /* ========================================================
           STOP COSMIC WORLD
           ======================================================== */

        HD3.cosmic.stop =
            function() {

                this.engine.running =
                    false;


                if (
                    this.engine.frame
                ) {

                    cancelAnimationFrame(
                        this.engine.frame
                    );

                }


                this.engine.frame =
                    null;


                HD3.emit(
                    "cosmic:stopped"
                );

            };


        /* ========================================================
           REFRESH COSMIC WORLD
           ======================================================== */

        HD3.cosmic.refresh =
            function() {

                this.updateCenter();

                this.createStars();

                this.createOrbits();

                HD3.world.updateCalendar();

                HD3.world.applySettings();


                HD3.emit(
                    "cosmic:refreshed"
                );

            };

        HD3.on(

                HD3.cosmic.createStars();

        window.addEventListener(

                if (

                ) {

                    HD3.cosmic.refresh();

                }

            }

        /* ========================================================

        HD3.on(

            function() {

                HD3.cosmic.start();

        if (

                    once: true

           ======================================================== */

        HD5.apps.unregister =
            function(
                appId
            ) {

                const id =
                    String(
                        appId
                    );


                if (
                    this.state.running.has(
                        id
                    )
                ) {

                    this.close(
                        id
                    );

                }


                const removed =
                    this.state.registry.delete(
                        id
                    );


                if (
                    removed
                ) {

                    HD5.emit(
                        "app:unregistered",
                        id
                    );

                }


                return removed;

            };


        /* ========================================================
           GET APP
           ======================================================== */

        HD5.apps.get =
            function(
                appId
            ) {

                return this.state.registry.get(
                    String(
                        appId
                    )
                ) || null;

            };


        /* ========================================================
           LIST APPS
           ======================================================== */

        HD5.apps.list =
            function(
                filter = {}
            ) {

                let apps =
                    Array.from(
                        this.state.registry.values()
                    );


                if (
                    filter.category
                ) {

                    apps =
                        apps.filter(
                            app =>
                                app.category ===
                                filter.category
                        );

                }


                if (
                    filter.enabledOnly
                ) {

                    apps =
                        apps.filter(
                            app =>
                                app.enabled
                        );

                }


                apps.sort(
                    (
                        a,
                        b
                    ) =>
                        a.order -
                        b.order
                );


                return apps;

            };


        /* ========================================================
           CHECK RUNNING
           ======================================================== */

        HD5.apps.isRunning =
            function(
                appId
            ) {

                return this.state.running.has(
                    String(
                        appId
                    )
                );

            };


        /* ========================================================
           GET RUNNING INSTANCE
           ======================================================== */

        HD5.apps.getRunning =
            function(
                appId
            ) {

                return this.state.running.get(
                    String(
                        appId
                    )
                ) || null;

            };


        /* ========================================================
           CREATE APP CONTENT
           ======================================================== */

        HD5.apps.createContent =
            function(
                app,
                context
            ) {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "haldo-app-view";


                if (
                    app.factory
                ) {

                    try {

                        const result =
                            app.factory(
                                {
                                    app,
                                    context,
                                    root:
                                        wrapper,
                                    HD:
                                        HD5
                                }
                            );


                        if (
                            result instanceof
                            HTMLElement
                        ) {

                            wrapper.innerHTML =
                                "";


                            wrapper.appendChild(
                                result
                            );

                        }

                        else if (
                            typeof result ===
                            "string"
                        ) {

                            wrapper.innerHTML =
                                result;

                        }

                    }

                    catch(error) {

                        console.error(
                            "[HalDo] App factory error:",
                            app.id,
                            error
                        );


                        wrapper.innerHTML = `

                            <div
                                style="
                                    padding:24px;
                                    text-align:center;
                                    color:#fff;
                                "
                            >

                                <h2>
                                    ${app.title}
                                </h2>

                                <p
                                    style="
                                        opacity:.7;
                                    "
                                >
                                    Diese App konnte
                                    nicht geöffnet werden.
                                </p>

                            </div>

                        `;

                    }

                }

                else {

                    wrapper.innerHTML = `

                        <div
                            style="
                                padding:24px;
                                color:#fff;
                            "
                        >

                            <h2>
                                ${app.title}
                            </h2>

                            <p
                                style="
                                    opacity:.7;
                                "
                            >
                                ${app.description}
                            </p>

                        </div>

                    `;

                }


                return wrapper;

            };


        /* ========================================================
           OPEN APP
           ======================================================== */

        HD5.apps.open =
            function(
                appId,
                options = {}
            ) {

                const id =
                    String(
                        appId
                    );


                const app =
                    this.get(
                        id
                    );


                if (
                    !app
                ) {

                    console.warn(
                        "[HalDo] App not found:",
                        id
                    );


                    HD5.emit(
                        "app:error",
                        {
                            appId:
                                id,

                            reason:
                                "not-found"
                        }
                    );


                    return null;

                }


                if (
                    !app.enabled
                ) {

                    HD5.emit(
                        "app:error",
                        {
                            appId:
                                id,

                            reason:
                                "disabled"
                        }
                    );


                    return null;

                }


                /*
                 * Singleton apps reuse their existing
                 * window instead of creating duplicates.
                 */

                if (
                    app.singleton &&
                    this.isRunning(
                        id
                    )
                ) {

                    const running =
                        this.getRunning(
                            id
                        );


                    if (
                        running &&
                        running.window
                    ) {

                        HD5.windows.focus(
                            running.window.id
                        );

                    }


                    HD5.emit(
                        "app:focused",
                        running
                    );


                    return running;

                }


                const content =
                    this.createContent(
                        app,
                        options.context ||
                        {}
                    );


                const windowRecord =
                    HD5.windows.open(
                        {

                            appId:
                                id,

                            title:
                                app.title,

                            width:
                                options.width ||
                                app.width,

                            height:
                                options.height ||
                                app.height,

                            content

                        }
                    );


                if (
                    !windowRecord
                ) {

                    return null;

                }


                const instance = {

                    id,

                    appId:
                        id,

                    app,

                    window:
                        windowRecord,

                    content,

                    context:
                        options.context ||
                        {},

                    openedAt:
                        Date.now(),

                    state:
                        {},

                    close:
                        () =>
                            this.close(
                                id,
                                instance
                            )

                };


                this.state.running.set(
                    id,
                    instance
                );


                this.state.lastOpened =
                    instance;


                /*
                 * Give the app a chance to initialize.
                 */

                if (
                    app.open
                ) {

                    try {

                        app.open(
                            instance
                        );

                    }

                    catch(error) {

                        console.error(
                            "[HalDo] App open error:",
                            id,
                            error
                        );

                    }

                }


                HD5.emit(
                    "app:opened",
                    instance
                );


                return instance;

            };


        /* ========================================================
           CLOSE APP
           ======================================================== */

        HD5.apps.close =
            function(
                appId,
                instance = null
            ) {

                const id =
                    String(
                        appId
                    );


                const running =
                    instance ||
                    this.getRunning(
                        id
                    );


                if (
                    !running
                ) {

                    return false;

                }


                const app =
                    running.app;


                if (
                    app.close
                ) {

                    try {

                        app.close(
                            running
                        );

                    }

                    catch(error) {

                        console.error(
                            "[HalDo] App close error:",
                            id,
                            error
                        );

                    }

                }


                if (
                    running.window
                ) {

                    HD5.windows.close(
                        running.window.id
                    );

                }


                this.state.running.delete(
                    id
                );


                if (
                    app.destroy
                ) {

                    try {

                        app.destroy(
                            running
                        );

                    }

                    catch(error) {

                        console.error(
                            "[HalDo] App destroy error:",
                            id,
                            error
                        );

                    }

                }


                HD5.emit(
                    "app:closed",
                    running
                );


                return true;

            };


        /* ========================================================
           CLOSE ALL APPS
           ======================================================== */

        HD5.apps.closeAll =
            function() {

                Array.from(
                    this.state.running.keys()
                ).forEach(
                    id => {

                        this.close(
                            id
                        );

                    }
                );

            };


        /* ========================================================
           APP SEARCH
           ======================================================== */

        HD5.apps.search =
            function(
                query
            ) {

                const value =
                    String(
                        query ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                if (
                    !value
                ) {

                    return this.list();

                }


                return this.list().filter(
                    app => {

                        return (

                            app.id
                                .toLowerCase()
                                .includes(
                                    value
                                )

                            ||

                            app.name
                                .toLowerCase()
                                .includes(
                                    value
                                )

                            ||

                            app.title
                                .toLowerCase()
                                .includes(
                                    value
                                )

                            ||

                            app.description
                                .toLowerCase()
                                .includes(
                                    value
                                )

                        );

                    }
                );

            };


        /* ========================================================
           APP LAUNCHER
           ======================================================== */

        HD5.launcher =
            HD5.launcher ||
            {};


        HD5.launcher.open =
            function(
                appId,
                options = {}
            ) {

                return HD5.apps.open(
                    appId,
                    options
                );

            };


        HD5.launcher.close =
            function(
                appId
            ) {

                return HD5.apps.close(
                    appId
                );

            };


        HD5.launcher.toggle =
            function(
                appId,
                options = {}
            ) {

                if (
                    HD5.apps.isRunning(
                        appId
                    )
                ) {

                    HD5.apps.close(
                        appId
                    );


                    return null;

                }


                return HD5.apps.open(
                    appId,
                    options
                );

            };


        /* ========================================================
           PUBLIC COMPATIBILITY ALIASES
           ======================================================== */

        HD5.appRegistry =
            HD5.apps;


        HD5.appManager =
            HD5.apps;


        HD5.appLauncher =
            HD5.launcher;


        window.HalDoApps =
            HD5.apps;


        window.HalDoAppLauncher =
            HD5.launcher;


        /* ========================================================
           WINDOW → APP CONNECTION
           ======================================================== */

        HD5.on(
            "window:closed",
            function(
                record
            ) {

                if (
                    !record ||
                    !record.appId
                ) {

                    return;

                }


                if (
                    HD5.apps.isRunning(
                        record.appId
                    )
                ) {

                    HD5.apps.close(
                        record.appId
                    );

                }

            }
        );


        /* ========================================================
           APP SYSTEM READY
           ======================================================== */

        HD5.apps.state.initialized =
            true;


        HD5.emit(
            "apps:ready"
        );

        /* ========================================================
