                reload: true
            }
        );

    }

    /* ============================================================
       APP STATE
       ============================================================ */

    function getAppState(
        appId
    ) {

        const instance =
            HalDo.appRuntimeState.instances.get(
                safeId(
                    appId
                )
            );

        if (!instance) {
            return null;
        }

        return instance.state;

    }

    function setAppState(
        appId,
        patch
    ) {

        const id =
            safeId(
                appId
            );

        const instance =
            HalDo.appRuntimeState.instances.get(
                id
            );

        if (!instance) {
            return false;
        }

        if (
            patch &&
            typeof patch ===
            "object"
        ) {

            Object.assign(
                instance.state,
                patch
            );

        }

        emit(
            "app:state-changed",
            {
                appId: id,
                state:
                    instance.state
            }
        );

        return true;

    }

    /* ============================================================
       APP EVENT BRIDGE
       ============================================================ */

    function emitAppEvent(
        appId,
        event,
        detail = {}
    ) {

        const id =
            safeId(
                appId
            );

        emit(
            "app:" + event,
            {
                appId: id,
                ...detail
            }
        );

        emit(
            "app:event",
            {
                appId: id,
                event,
                detail
            }
        );

    }

    /* ============================================================
       PUBLIC RUNTIME API
       ============================================================ */

    HalDo.appRuntime = {

        version:
            RUNTIME_VERSION,

        register:
            registerApp,

        registerMany:
            registerApps,

        registerModule,

        registerRenderer,

        resolve:
            resolveApp,

        open:
            openApp,

        close:
            closeApp,

        destroy:
            destroyApp,

        reload:
            reloadApp,

        getState:
            getAppState,

        setState:
            setAppState,

        emit:
            emitAppEvent,

        getInstance(
            appId
        ) {

            return (
                HalDo.appRuntimeState.instances.get(
                    safeId(appId)
                ) ||
                null
            );

        },

        getModule(
            appId
        ) {

            return (
                HalDo.appRuntimeState.modules.get(
                    safeId(appId)
                ) ||
                null
            );

        },

        getAllApps() {

            return Array.from(
                HalDo.appRuntimeState.apps.values()
            );

        },

        getOpenApps() {

            return Array.from(
                HalDo.appRuntimeState.instances.values()
            );

        },

        getLaunchHistory() {

            return [
                ...HalDo.appRuntimeState.launchHistory
            ];

        }

    };

    /* ============================================================
       COMPATIBILITY BRIDGE
       ============================================================ */

    HalDo.openApp =
        openApp;

    HalDo.closeApp =
        closeApp;

    HalDo.reloadApp =
        reloadApp;

    /* ============================================================
       CONNECT TO APP MANAGER
       ============================================================ */

    if (
        HalDo.appManager
    ) {

        const existingOpen =
            HalDo.appManager.open;

        /*
         * Only wrap once.
         */

        if (
            !HalDo.appManager.__haldoRuntimeWrapped
        ) {

            HalDo.appManager.__haldoRuntimeWrapped =
                true;

            HalDo.appManager.open =
                async function (
                    id,
                    options = {}
                ) {

                    /*
                     * If the Window Engine already
                     * created the window, use it.
                     */

                    const existing =
                        HalDo.windows &&
                        typeof HalDo.windows.get ===
                        "function"
                            ? HalDo.windows.get(
                                id
                            )
                            : null;

                    if (existing) {

                        if (
                            typeof HalDo.windows.focus ===
                            "function"
                        ) {

                            HalDo.windows.focus(
                                id
                            );

                        }

                        return existing;

                    }

                    /*
                     * Otherwise use the runtime.
                     */

                    if (
                        typeof existingOpen ===
                        "function"
                    ) {

                        try {

                            const result =
                                await existingOpen.call(
                                    this,
                                    id,
                                    options
                                );

                            if (
                                result &&
                                typeof result ===
                                "object" &&
                                result.nodeType
                            ) {

                                return result;

                            }

                        } catch (error) {

                            console.warn(
                                "[HalDo App Manager] Legacy open failed:",
                                id,
                                error
                            );

                        }

                    }

                    return openApp(
                        id,
                        options
                    );

                };

            HalDo.appManager.close =
                async function (
                    id
                ) {

                    return closeApp(
                        id
                    );

                };

        }

    }

    /* ============================================================
       AUTOMATIC REGISTRY SYNCHRONIZATION
       ============================================================ */

    function syncRegistry() {

        const registry =
            getRegistry();

        if (!registry) {
            return 0;
        }

        let count = 0;

        try {

            /*
             * Standard Map-like registry
             */

            if (
                registry.apps instanceof Map
            ) {

                registry.apps.forEach(
                    app => {

                        if (
                            registerApp(
                                app
                            )
                        ) {

                            count += 1;

                        }

                    }
                );

            }

            /*
             * Registry exposing all()
             */

            else if (
                typeof registry.all ===
                "function"
            ) {

                const apps =
                    registry.all();

                count =
                    registerApps(
                        apps
                    );

            }

            /*
             * Registry exposing getAll()
             */

            else if (
                typeof registry.getAll ===
                "function"
            ) {

                const apps =
                    registry.getAll();

                count =
                    registerApps(
                        apps
                    );

            }

        } catch (error) {

            console.warn(
                "[HalDo App Runtime] Registry sync failed:",
                error
            );

        }

        return count;

    }

    /* ============================================================
       REGISTRY EVENTS
       ============================================================ */

    if (
        typeof HalDo.on ===
        "function"
    ) {

        HalDo.on(
            "app:registered",
            payload => {

                const app =
                    payload?.app ||
                    payload;

                registerApp(
                    app
                );

            }
        );

        HalDo.on(
            "registry:app-registered",
            payload => {

                const app =
                    payload?.app ||
                    payload;

                registerApp(
                    app
                );

            }
        );

    }

    /* ============================================================
       GLOBAL APP LAUNCH EVENTS
       ============================================================ */

    document.addEventListener(
        "click",
        event => {

            const launcher =
                event.target.closest(
                    "[data-open-app]"
                );

            if (!launcher) {
                return;
            }

            const appId =
                launcher.dataset.openApp;

            if (!appId) {
                return;
            }

            event.preventDefault();

            openApp(
                appId
            );

        }
    );

    /* ============================================================
       KEYBOARD APP LAUNCH
       ============================================================ */

    document.addEventListener(
        "keydown",
        event => {

            /*
             * Escape:
             * do not globally close applications.
             * Apps themselves may handle Escape.
             */

            if (
                event.key === "Escape"
            ) {

                const activeId =
                    HalDo.state &&
                    HalDo.state.activeApp;

                if (
                    activeId &&
                    HalDo.windows &&
                    typeof HalDo.windows.get ===
                    "function"
                ) {

                    const activeWindow =
                        HalDo.windows.get(
                            activeId
                        );

                    if (activeWindow) {

                        const focused =
                            document.activeElement;

                        /*
                         * Keep text fields usable.
                         */

                        const editable =
                            focused &&
                            (
                                focused.tagName ===
                                "INPUT" ||
                                focused.tagName ===
                                "TEXTAREA" ||
                                focused.isContentEditable
                            );

                        if (!editable) {

                            event.preventDefault();

                        }

                    }

                }

            }

        }
    );

    /* ============================================================
       RESPONSIVE APP EVENT
       ============================================================ */

    let lastViewport = {

        width:
            window.innerWidth,

        height:
            window.innerHeight

    };

    window.addEventListener(
        "resize",
        () => {

            const current = {

                width:
                    window.innerWidth,

                height:
                    window.innerHeight

            };

            const mobile =
                current.width <= 760;

            const previousMobile =
                lastViewport.width <= 760;

            if (
                mobile !==
                previousMobile
            ) {

                emit(
                    "device:mode-changed",
                    {
                        mobile,
                        width:
                            current.width,
                        height:
                            current.height
                    }
                );

            }

            emit(
                "viewport:changed",
                {
                    ...current,
                    previous:
                        lastViewport
                }
            );

            lastViewport =
                current;

        }
    );

    /* ============================================================
       STORAGE BRIDGE
       ============================================================ */

    HalDo.appStorage = {

        get(
            appId,
            key,
            fallback = null
        ) {

            const id =
                safeId(
                    appId
                );

            const fullKey =
                "app." +
                id +
                "." +
                safeString(
                    key
                );

            try {

                if (
                    HalDo.storage &&
                    typeof HalDo.storage.get ===
                    "function"
                ) {

                    return HalDo.storage.get(
                        fullKey,
                        fallback
                    );

                }

            } catch (error) {

                console.warn(
                    "[HalDo App Storage] get failed:",
                    error
                );

            }

            return fallback;

        },

        set(
            appId,
            key,
            value
        ) {

            const id =
                safeId(
                    appId
                );

            const fullKey =
                "app." +
                id +
                "." +
                safeString(
                    key
                );

            try {

                if (
                    HalDo.storage &&
                    typeof HalDo.storage.set ===
                    "function"
                ) {

                    return HalDo.storage.set(
                        fullKey,
                        value
                    );

                }

            } catch (error) {

                console.warn(
                    "[HalDo App Storage] set failed:",
                    error
                );

            }

            return false;

        },

        remove(
            appId,
            key
        ) {

            const id =
                safeId(
                    appId
                );

            const fullKey =
                "app." +
                id +
                "." +
                safeString(
                    key
                );

            try {

                if (
                    HalDo.storage &&
                    typeof HalDo.storage.remove ===
                    "function"
                ) {

                    return HalDo.storage.remove(
                        fullKey
                    );

                }

                if (
                    HalDo.storage &&
                    typeof HalDo.storage.delete ===
                    "function"
                ) {

                    return HalDo.storage.delete(
                        fullKey
                    );

                }

            } catch (error) {

                console.warn(
                    "[HalDo App Storage] remove failed:",
                    error
                );

            }

            return false;

        }

    };

    /* ============================================================
       APP PERMISSION FOUNDATION
       ============================================================ */

    HalDo.appPermissions = {

        has(
            appId,
            permission
        ) {

            const app =
                resolveApp(
                    appId
                );

            if (!app) {
                return false;
            }

            if (
                app.system === true
            ) {

                return true;

            }

            return app.permissions.includes(
                permission
            );

        },

        request(
            appId,
            permission
        ) {

            const allowed =
                this.has(
                    appId,
                    permission
                );

            emit(
                "permission:checked",
                {
                    appId:
                        safeId(appId),
                    permission,
                    allowed
                }
            );

            return Promise.resolve(
                allowed
            );

        }

    };

    /* ============================================================
       STARTUP SYNCHRONIZATION
       ============================================================ */

    function initializeRuntime() {

        if (
            HalDo.appRuntimeState.initialized
        ) {

            return;

        }

        const synced =
            syncRegistry();

        HalDo.appRuntimeState.initialized =
            true;

        emit(
            "app-runtime:ready",
            {
                version:
                    RUNTIME_VERSION,
                registeredApps:
                    HalDo.appRuntimeState.apps.size,
                synchronized:
                    synced
            }
        );

        console.log(
            "[HalDo App Runtime] Teil 5/8 bereit.",
            {
                version:
                    RUNTIME_VERSION,
                apps:
                    HalDo.appRuntimeState.apps.size
            }
        );

    }

    /*
     * Wait until foundation is ready when possible.
     */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeRuntime,
            {
                once: true
            }
        );

    } else {

        initializeRuntime();

    }

})();

<script>
"use strict";

/* ================================================================
   HALDO AI OS 20
   INDEX SHELL
   PART 6 / 8
   HALDO APP STORE + APP CATALOG + LAUNCHER BRIDGE
   ================================================================ */

(function HalDoAppStoreFoundation() {

    const HalDo = window.HalDo;

    if (!HalDo) {
        console.error("[HalDo App Store] Foundation fehlt.");
        return;
    }

    const STORE_VERSION = "20.0.0";

    /* ============================================================
       STORE STATE
       ============================================================ */

    HalDo.appStoreState =
        HalDo.appStoreState || {

            initialized: false,

            catalog: new Map(),

            installed: new Set(),

            enabled: new Set(),

            favorites: new Set(),

            categories: new Set(),

            searchQuery: "",

            activeCategory: "all",

            selectedApp: null,

            history: [],

            maxHistory: 100

        };

    /* ============================================================
       HELPERS
       ============================================================ */

    function normalizeId(
        value
    ) {

        return String(
            value ??
            ""
        )
        .trim()
        .toLowerCase();

    }

    function escape(
        value
    ) {

        if (
            HalDo.utils &&
            typeof HalDo.utils.escape ===
            "function"
        ) {

            return HalDo.utils.escape(
                value
            );

        }

        return String(
            value ??
            ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }

    function emit(
        event,
        detail = {}
    ) {

        try {

            if (
                typeof HalDo.emit ===
                "function"
            ) {

                HalDo.emit(
                    event,
                    detail
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo App Store] Event:",
                event,
                error
            );

        }

    }

    function storageGet(
        key,
        fallback
    ) {

        try {

            if (
                HalDo.storage &&
                typeof HalDo.storage.get ===
                "function"
            ) {

                return HalDo.storage.get(
                    key,
                    fallback
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo App Store] Storage get failed:",
                error
            );

        }

        return fallback;

    }

    function storageSet(
        key,
        value
    ) {

        try {

            if (
                HalDo.storage &&
                typeof HalDo.storage.set ===
                "function"
            ) {

                return HalDo.storage.set(
                    key,
                    value
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo App Store] Storage set failed:",
                error
            );

        }

        return false;

    }

    /* ============================================================
       APP NORMALIZATION
       ============================================================ */

    function normalizeApp(
        app
    ) {

        if (
            !app ||
            typeof app !==
            "object"
        ) {

            return null;

        }

        const id =
            normalizeId(
                app.id ||
                app.appId ||
                app.slug
            );

        if (!id) {
            return null;
        }

        const category =
            String(
                app.category ||
                "system"
            )
            .trim()
            .toLowerCase();

        return {

            ...app,

            id,

            name:
                String(
                    app.name ||
                    app.title ||
                    id
                ),

            title:
                String(
                    app.title ||
                    app.name ||
                    id
                ),

            description:
                String(
                    app.description ||
                    ""
                ),

            icon:
                String(
                    app.icon ||
                    "◈"
                ),

            category,

            version:
                String(
                    app.version ||
                    "1.0.0"
                ),

            enabled:
                app.enabled !== false,

            installed:
                app.installed !== false,

            system:
                app.system === true,

            featured:
                app.featured === true,

            premium:
                app.premium === true,

            searchable:
                app.searchable !== false,

            tags:
                Array.isArray(
                    app.tags
                )
                    ? app.tags.map(
                        tag =>
                            String(
                                tag
                            ).toLowerCase()
                    )
                    : [],

            permissions:
                Array.isArray(
                    app.permissions
                )
                    ? [
                        ...app.permissions
                    ]
                    : []

        };

    }

    /* ============================================================
       REGISTER STORE APP
       ============================================================ */

    function register(
        app
    ) {

        const normalized =
            normalizeApp(
                app
            );

        if (!normalized) {
            return false;
        }

        HalDo.appStoreState.catalog.set(
            normalized.id,
            normalized
        );

        HalDo.appStoreState.categories.add(
            normalized.category
        );

        if (
            normalized.installed ||
            normalized.system
        ) {

            HalDo.appStoreState.installed.add(
                normalized.id
            );

        }

        if (
            normalized.enabled
        ) {

            HalDo.appStoreState.enabled.add(
                normalized.id
            );

        }

        /*
         * Keep App Runtime synchronized.
         */

        if (
            HalDo.appRuntime &&
            typeof HalDo.appRuntime.register ===
            "function"
        ) {

            HalDo.appRuntime.register(
                normalized
            );

        }

        emit(
            "store:app-registered",
            {
                app:
                    normalized
            }
        );

        return true;

    }

    /* ============================================================
       REGISTER MANY
       ============================================================ */

    function registerMany(
        apps
    ) {

        if (
            !Array.isArray(
                apps
            )
        ) {

            return 0;

        }

        let count = 0;

        apps.forEach(
            app => {

                if (
                    register(
                        app
                    )
                ) {

                    count += 1;

                }

            }
        );

        return count;

    }

    /* ============================================================
       DISCOVER EXISTING APPS
       ============================================================ */

    function discoverApps() {

        let count = 0;

        /*
         * App Runtime
         */

        if (
            HalDo.appRuntime &&
            typeof HalDo.appRuntime.getAllApps ===
            "function"
        ) {

            const apps =
                HalDo.appRuntime.getAllApps();

            count +=
                registerMany(
                    apps
                );

        }

        /*
         * Registry Map
         */

        const registry =
            HalDo.registry;

        if (
            registry &&
            registry.apps instanceof Map
        ) {

            registry.apps.forEach(
                app => {

                    if (
                        register(
                            app
                        )
                    ) {

                        count += 1;

                    }

                }
            );

        }

        /*
         * Manifest
         */

        const manifestCandidates = [

            HalDo.appManifest,

            HalDo.appsManifest,

            window.HalDoAppManifest,

            window.HalDoV20AppManifest

        ];

        manifestCandidates.forEach(
            manifest => {

                if (
                    Array.isArray(
                        manifest
                    )
                ) {

                    count +=
                        registerMany(
                            manifest
                        );

                }

                else if (
                    manifest &&
                    Array.isArray(
                        manifest.apps
                    )
                ) {

                    count +=
                        registerMany(
                            manifest.apps
                        );

                }

            }
        );

        return count;

    }

    /* ============================================================
       PERSISTENT STORE STATE
       ============================================================ */

    function loadPersistentState() {

        const installed =
            storageGet(
                "appstore.installed",
                []
            );

        const enabled =
            storageGet(
                "appstore.enabled",
                []
            );

        const favorites =
            storageGet(
                "appstore.favorites",
                []
            );

        if (
            Array.isArray(
                installed
            )
        ) {

            installed.forEach(
                id => {

                    HalDo.appStoreState.installed.add(
                        normalizeId(id)
                    );

                }
            );

        }

        if (
            Array.isArray(
                enabled
            )
        ) {

            enabled.forEach(
                id => {

                    HalDo.appStoreState.enabled.add(
                        normalizeId(id)
                    );

                }
            );

        }

        if (
            Array.isArray(
                favorites
            )
        ) {

            favorites.forEach(
                id => {

                    HalDo.appStoreState.favorites.add(
                        normalizeId(id)
                    );

                }
            );

        }

    }

    function savePersistentState() {

        storageSet(
            "appstore.installed",
            Array.from(
                HalDo.appStoreState.installed
            )
        );

        storageSet(
            "appstore.enabled",
            Array.from(
                HalDo.appStoreState.enabled
            )
        );

        storageSet(
            "appstore.favorites",
            Array.from(
                HalDo.appStoreState.favorites
            )
        );

    }

    /* ============================================================
       GET APP
       ============================================================ */

    function get(
        appId
    ) {

        return (
            HalDo.appStoreState.catalog.get(
                normalizeId(
                    appId
                )
            ) ||
            null
        );

    }

    /* ============================================================
       GET ALL
       ============================================================ */

    function all() {

        return Array.from(
            HalDo.appStoreState.catalog.values()
        );

    }

    /* ============================================================
       SEARCH
       ============================================================ */

    function search(
        query = "",
        options = {}
    ) {

        const text =
            String(
                query
            )
            .trim()
            .toLowerCase();

        const category =
            String(
                options.category ||
                "all"
            )
            .trim()
            .toLowerCase();

        return all().filter(
            app => {

                if (
                    category !==
                    "all" &&
                    app.category !==
                    category
                ) {

                    return false;

                }

                if (!text) {
                    return true;
                }

                const haystack =
                    [
                        app.id,
                        app.name,
                        app.title,
                        app.description,
                        app.category,
                        ...(app.tags || [])
                    ]
                    .join(" ")
                    .toLowerCase();

                return haystack.includes(
                    text
                );

            }
        );

    }

    /* ============================================================
       CATEGORIES
       ============================================================ */

    function categories() {

        return [
            "all",
            ...Array.from(
                HalDo.appStoreState.categories
            )
            .sort();

        ];

    }

    /* ============================================================
       INSTALL
       ============================================================ */

    async function install(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        const app =
            get(
                id
            );

        if (!app) {

            emit(
                "store:install-failed",
                {
                    appId:
                        id,
                    reason:
                        "not-found"
                }
            );

            return false;

        }

        if (
            app.system
        ) {

            HalDo.appStoreState.installed.add(
                id
            );

            HalDo.appStoreState.enabled.add(
                id
            );

            savePersistentState();

            return true;

        }

        /*
         * Optional app module installation hook.
         */

        const module =
            HalDo.appRuntime &&
            typeof HalDo.appRuntime.getModule ===
            "function"
                ? HalDo.appRuntime.getModule(
                    id
                )
                : null;

        if (
            module &&
            typeof module.install ===
            "function"
        ) {

            try {

                await module.install(
                    {
                        app,
                        HalDo
                    }
                );

            } catch (error) {

                console.error(
                    "[HalDo App Store] Install failed:",
                    id,
                    error
                );

                emit(
                    "store:install-failed",
                    {
                        app,
                        error
                    }
                );

                return false;

            }

        }

        HalDo.appStoreState.installed.add(
            id
        );

        HalDo.appStoreState.enabled.add(
            id
        );

        savePersistentState();

        emit(
            "store:installed",
            {
                app
            }
        );

        return true;

    }

    /* ============================================================
       UNINSTALL
       ============================================================ */

    async function uninstall(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        const app =
            get(
                id
            );

        if (!app) {
            return false;
        }

        /*
         * System applications cannot be removed.
         */

        if (
            app.system
        ) {

            emit(
                "store:uninstall-denied",
                {
                    app,
                    reason:
                        "system-app"
                }
            );

            return false;

        }

        if (
            HalDo.windows &&
            typeof HalDo.windows.get ===
            "function" &&
            HalDo.windows.get(
                id
            )
        ) {

            if (
                typeof HalDo.windows.close ===
                "function"
            ) {

                HalDo.windows.close(
                    id
                );

            }

        }

        const module =
            HalDo.appRuntime &&
            typeof HalDo.appRuntime.getModule ===
            "function"
                ? HalDo.appRuntime.getModule(
                    id
                )
                : null;

        if (
            module &&
            typeof module.uninstall ===
            "function"
        ) {

            try {

                await module.uninstall(
                    {
                        app,
                        HalDo
                    }
                );

            } catch (error) {

                console.warn(
                    "[HalDo App Store] Uninstall hook failed:",
                    error
                );

            }

        }

        HalDo.appStoreState.installed.delete(
            id
        );

        HalDo.appStoreState.enabled.delete(
            id
        );

        HalDo.appStoreState.favorites.delete(
            id
        );

        savePersistentState();

        emit(
            "store:uninstalled",
            {
                app
            }
        );

        return true;

    }

    /* ============================================================
       ENABLE
       ============================================================ */

    function enable(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        if (
            !HalDo.appStoreState.installed.has(
                id
            )
        ) {

            return false;

        }

        HalDo.appStoreState.enabled.add(
            id
        );

        const app =
            get(
                id
            );

        if (app) {

            app.enabled =
                true;

        }

        savePersistentState();

        emit(
            "store:enabled",
            {
                app
            }
        );

        return true;

    }

    /* ============================================================
       DISABLE
       ============================================================ */

    function disable(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        const app =
            get(
                id
            );

        if (
            app &&
            app.system
        ) {

            return false;

        }

        HalDo.appStoreState.enabled.delete(
            id
        );

        if (app) {

            app.enabled =
                false;

        }

        /*
         * Close if running.
         */

        if (
            HalDo.windows &&
            typeof HalDo.windows.get ===
            "function" &&
            HalDo.windows.get(
                id
            )
        ) {

            if (
                typeof HalDo.windows.close ===
                "function"
            ) {

                HalDo.windows.close(
                    id
                );

            }

        }

        savePersistentState();

        emit(
            "store:disabled",
            {
                app
            }
        );

        return true;

    }

    /* ============================================================
       FAVORITES
       ============================================================ */

    function toggleFavorite(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        if (
            HalDo.appStoreState.favorites.has(
                id
            )
        ) {

            HalDo.appStoreState.favorites.delete(
                id
            );

            savePersistentState();

            emit(
                "store:favorite-removed",
                {
                    appId:
                        id
                }
            );

            return false;

        }

        HalDo.appStoreState.favorites.add(
            id
        );

        savePersistentState();

        emit(
            "store:favorite-added",
            {
                appId:
                    id
            }
        );

        return true;

    }

    function isFavorite(
        appId
    ) {

        return HalDo.appStoreState.favorites.has(
            normalizeId(
                appId
            )
        );

    }

    /* ============================================================
       IS INSTALLED / ENABLED
       ============================================================ */

    function isInstalled(
        appId
    ) {

        return HalDo.appStoreState.installed.has(
            normalizeId(
                appId
            )
        );

    }

    function isEnabled(
        appId
    ) {

        return HalDo.appStoreState.enabled.has(
            normalizeId(
                appId
            )
        );

    }

    /* ============================================================
       OPEN APP
       ============================================================ */

    async function open(
        appId,
        options = {}
    ) {

        const id =
            normalizeId(
                appId
            );

        const app =
            get(
                id
            );

        if (!app) {
            return null;
        }

        if (
            !isInstalled(
                id
            )
        ) {

            const installed =
                await install(
                    id
                );

            if (!installed) {
                return null;
            }

        }

        if (
            !isEnabled(
                id
            )
        ) {

            enable(
                id
            );

        }

        if (
            HalDo.appRuntime &&
            typeof HalDo.appRuntime.open ===
            "function"
        ) {

            const result =
                await HalDo.appRuntime.open(
                    id,
                    options
                );

            HalDo.appStoreState.history.push(
                {
                    appId:
                        id,
                    timestamp:
                        Date.now()
                }
            );

            if (
                HalDo.appStoreState.history.length >
                HalDo.appStoreState.maxHistory
            ) {

                HalDo.appStoreState.history.shift();

            }

            return result;

        }

        if (
            HalDo.windows &&
            typeof HalDo.windows.open ===
            "function"
        ) {

            return HalDo.windows.open(
                id,
                options
            );

        }

        return null;

    }

    /* ============================================================
       STORE RENDERER
       ============================================================ */

    function renderStore(
        container,
        options = {}
    ) {

        if (!container) {
            return;
        }

        injectStyles();

        let query =
            String(
                options.query ||
                HalDo.appStoreState.searchQuery ||
                ""
            );

        let category =
            String(
                options.category ||
                HalDo.appStoreState.activeCategory ||
                "all"
            );

        function draw() {

            HalDo.appStoreState.searchQuery =
                query;

            HalDo.appStoreState.activeCategory =
                category;

            const apps =
                search(
                    query,
                    {
                        category
                    }
                );

            container.innerHTML = `

                <div class="haldo-store">

                    <div class="haldo-store-header">

                        <div class="haldo-store-title">

                            <div
                                class="haldo-store-title-icon"
                                aria-hidden="true"
                            >
                                🛍️
                            </div>

                            <div>

                                <h2>
                                    HalDo App Store
                                </h2>

                                <p>
                                    ${apps.length}
                                    Apps verfügbar
                                </p>

                            </div>

                        </div>

                        <input
                            class="haldo-store-search"
                            type="search"
                            placeholder="Apps suchen…"
                            aria-label="Apps suchen"
                            value="${escape(
                                query
                            )}"
                        >

                    </div>

                    <div
                        class="haldo-store-categories"
                        data-store-categories
                    >

                        ${categories()
                            .map(
                                item => `
                                    <button
                                        type="button"
                                        class="
                                            haldo-store-category
                                            ${
                                                item === category
                                                    ? "active"
                                                    : ""
                                            }
                                        "
                                        data-store-category="${escape(
                                            item
                                        )}"
                                    >
                                        ${escape(
                                            item === "all"
                                                ? "Alle"
                                                : item
                                        )}
                                    </button>
                                `
                            )
                            .join("")
                        }

                    </div>

                    ${
                        apps.length
                            ? `
                                <div
                                    class="haldo-store-grid"
                                    data-store-grid
                                >
                                    ${apps
                                        .map(
                                            renderCard
                                        )
                                        .join("")
                                    }
                                </div>
                            `
                            : `
                                <div
                                    class="haldo-store-empty"
                                >
                                    Keine passende App gefunden.
                                </div>
                            `
                    }

                </div>

            `;

            const searchInput =
                container.querySelector(
                    ".haldo-store-search"
                );

            if (searchInput) {

                searchInput.addEventListener(
                    "input",
                    event => {

                        query =
                            event.target.value;

                        draw();

                        const input =
                            container.querySelector(
                                ".haldo-store-search"
                            );

                        if (input) {

                            input.focus();

                            try {

                                input.setSelectionRange(
                                    query.length,
                                    query.length
                                );

                            } catch (_) {}

                        }

                    }
                );

            }

            container
                .querySelectorAll(
                    "[data-store-category]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                category =
                                    button.dataset.storeCategory ||
                                    "all";

                                draw();

                            }
                        );

                    }
                );

            container
                .querySelectorAll(
                    "[data-store-open]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            async () => {

                                await open(
                                    button.dataset.storeOpen
                                );

                            }
                        );

                    }
                );

            container
                .querySelectorAll(
                    "[data-store-favorite]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                toggleFavorite(
                                    button.dataset.storeFavorite
                                );

                                draw();

                            }
                        );

                    }
                );

        }

        draw();

    }

    /* ============================================================
       STORE CARD
       ============================================================ */

    function renderCard(
        app
    ) {

        const installed =
            isInstalled(
                app.id
            );

        const favorite =
            isFavorite(
                app.id
            );

        return `

            <article
                class="haldo-store-card"
                data-app-id="${escape(
                    app.id
                )}"
            >

                <div
                    class="haldo-store-card-top"
                >

                    <div
                        class="haldo-store-app-icon"
                        aria-hidden="true"
                    >
                        ${escape(
                            app.icon
                        )}
                    </div>

                    <div
                        class="haldo-store-card-name"
                    >

                        <strong>
                            ${escape(
                                app.name
                            )}
                        </strong>

                        <span>
                            ${escape(
                                app.category
                            )}
                            ·
                            v${escape(
                                app.version
                            )}
                        </span>

                    </div>

                </div>

                <div
                    class="haldo-store-card-description"
                >
                    ${escape(
                        app.description ||
                        "HalDo System App"
                    )}
                </div>

                <div
                    class="haldo-store-card-actions"
                >

                    <button
                        type="button"
                        class="
                            haldo-store-button
                            primary
                        "
                        data-store-open="${escape(
                            app.id
                        )}"
                    >
                        ${
                            installed
                                ? "Öffnen"
                                : "Installieren"
                        }
                    </button>

                    <button
                        type="button"
                        class="haldo-store-button"
                        data-store-favorite="${escape(
                            app.id
                        )}"
                        aria-label="${
                            favorite
                                ? "Favorit entfernen"
                                : "Als Favorit markieren"
                        }"
                    >
                        ${
                            favorite
                                ? "★"
                                : "☆"
                        }
                    </button>

                </div>

            </article>

        `;

    }

    /* ============================================================
       REGISTER STORE APP RENDERER
       ============================================================ */

    if (
        typeof HalDo.registerAppRenderer ===
        "function"
    ) {

        HalDo.registerAppRenderer(
            "app-store",
            (
                content,
                context
            ) => {

                renderStore(
                    content,
                    context.options || {}
                );

            }
        );

        /*
         * Compatibility IDs.
         */

        HalDo.registerAppRenderer(
            "store",
            (
                content,
                context
            ) => {

                renderStore(
                    content,
                    context.options || {}
                );

            }
        );

    }

    /* ============================================================
       APP STORE PUBLIC API
       ============================================================ */

    HalDo.appStore = {

        version:
            STORE_VERSION,

        register,

        registerMany,

        discover:
            discoverApps,

        get,

        all,

        search,

        categories,

        install,

        uninstall,

        enable,

        disable,

        open,

        toggleFavorite,

        isFavorite,

        isInstalled,

        isEnabled,

        render:
            renderStore,

        getFavorites() {

            return all().filter(
                app =>
                    isFavorite(
                        app.id
                    )
            );

        },

        getInstalled() {

            return all().filter(
                app =>
                    isInstalled(
                        app.id
                    )
            );

        },

        getEnabled() {

            return all().filter(
                app =>
                    isEnabled(
                        app.id
                    )
            );

        },

        getHistory() {

            return [
                ...HalDo.appStoreState.history
            ];

        }

    };

    /* ============================================================
       APP STORE LAUNCHER BRIDGE
       ============================================================ */

    function bindLauncher(
        root = document
    ) {

        if (!root) {
            return;
        }

        root
            .querySelectorAll(
                "[data-app-launch], [data-open-app]"
            )
            .forEach(
                element => {

                    if (
                        element.dataset.haldoStoreBound ===
                        "true"
                    ) {

                        return;

                    }

                    element.dataset.haldoStoreBound =
                        "true";

                    element.addEventListener(
                        "click",
                        async event => {

                            const appId =
                                element.dataset.appLaunch ||
                                element.dataset.openApp;

                            if (!appId) {
                                return;
                            }

                            event.preventDefault();

                            await open(
                                appId
                            );

                        }
                    );

                }
            );

    }

    bindLauncher();

    if (
        typeof HalDo.on ===
        "function"
    ) {

        HalDo.on(
            "dom:ready",
            () => {

                bindLauncher();

            }
        );

        HalDo.on(
            "app:registered",
            payload => {

                if (
                    payload?.app
                ) {

                    register(
                        payload.app
                    );

                }

            }
        );

    }

    /* ============================================================
       AUTOMATIC STORE DISCOVERY
       ============================================================ */

    loadPersistentState();

    injectStyles();

    const discovered =
        discoverApps();

    /*
     * Make sure the Store itself exists
     * as a system application.
     */

    if (
        !get("app-store")
    ) {

        register({

            id:
                "app-store",

            name:
                "HalDo App Store",

            title:
                "HalDo App Store",

            description:
                "Zentrale Verwaltung, Suche und Startzentrale für HalDo Apps.",

            icon:
                "🛍️",

            category:
                "system",

            version:
                STORE_VERSION,

            system:
                true,

            installed:
                true,

            enabled:
                true,

            searchable:
                true,

            tags:
                [
                    "store",
                    "apps",
                    "applications",
                    "verwaltung"
                ]

        });

    }

    /* ============================================================
       READY EVENT
       ============================================================ */

    HalDo.appStoreState.initialized =
        true;

    emit(
        "app-store:ready",
        {
            version:
                STORE_VERSION,

            apps:
                HalDo.appStoreState.catalog.size,

            discovered
        }
    );

    console.log(
        "[HalDo App Store] Teil 6/8 bereit.",
        {
            apps:
                HalDo.appStoreState.catalog.size,
            categories:
                HalDo.appStoreState.categories.size
        }
    );

})();
</script>
