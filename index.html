<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050816">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HalDo AI OS — Complete Universe</title>

    <style>
        /* =========================================================
           HALDO AI OS — KOMPLETTE STYLES (TEIL 1)
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --haldo-gold: #ffd54b;
            --haldo-gold-dark: #ff9f1c;
            --haldo-bg: #02030a;
            --haldo-surface: rgba(10,14,30,0.92);
            --haldo-border: rgba(255,255,255,.08);
            --haldo-text: #ffffff;
            --haldo-radius: 16px;
            --haldo-shadow: 0 20px 60px rgba(0,0,0,.5);
            --haldo-font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            --planet-speed: 1s;
            --galaxy-count: 12;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--haldo-bg);
            color: var(--haldo-text);
            font-family: var(--haldo-font);
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea, select { font: inherit; }
        button { border: 0; outline: none; cursor: pointer; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }

        /* =========================================================
           MASTER DISPLAY
           ========================================================= */

        #haldo-os {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, rgba(35,73,150,.16), transparent 30%),
                        radial-gradient(circle at 20% 20%, rgba(70,110,255,.08), transparent 30%),
                        radial-gradient(circle at 80% 80%, rgba(150,70,255,.07), transparent 32%),
                        var(--haldo-bg);
        }

        .haldo-cosmic-world {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(circle at center, rgba(15,30,75,.28), transparent 42%);
        }

        .haldo-space {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.025), transparent 52%);
        }

        /* =========================================================
           STARS — 365 TAGE
           ========================================================= */

        .haldo-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .haldo-star {
            position: absolute;
            display: block;
            border-radius: 50%;
            background: rgba(255,255,255,.95);
            box-shadow: 0 0 5px rgba(255,255,255,.9);
            animation: haldo-star-twinkle var(--star-speed, 4s) ease-in-out infinite;
            animation-delay: var(--star-delay, 0s);
        }

        @keyframes haldo-star-twinkle {
            0%, 100% { opacity: .2; transform: scale(.7); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        /* =========================================================
           COSMIC CENTER
           ========================================================= */

        .haldo-cosmic-center {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(92vw, 950px);
            height: min(92vw, 950px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* =========================================================
           GALAXIE / ORBIT SYSTEM — 12 PLANETEN
           ========================================================= */

        .haldo-galaxy-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .haldo-orbit-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(120,175,255,.12);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(70,150,255,.04);
            animation: haldo-ring-pulse 8s ease-in-out infinite;
        }

        @keyframes haldo-ring-pulse {
            0%, 100% { opacity: .4; }
            50% { opacity: .8; }
        }

        /* 12 ORBIT-RINGE für 12 Galaxien/Planeten */
        .haldo-orbit-ring-1 { width: 10%; height: 10%; }
        .haldo-orbit-ring-2 { width: 17%; height: 17%; transform: translate(-50%, -50%) rotate(15deg); }
        .haldo-orbit-ring-3 { width: 24%; height: 24%; transform: translate(-50%, -50%) rotate(-10deg); }
        .haldo-orbit-ring-4 { width: 32%; height: 32%; transform: translate(-50%, -50%) rotate(22deg); }
        .haldo-orbit-ring-5 { width: 40%; height: 40%; transform: translate(-50%, -50%) rotate(-8deg); }
        .haldo-orbit-ring-6 { width: 48%; height: 48%; transform: translate(-50%, -50%) rotate(30deg); }
        .haldo-orbit-ring-7 { width: 56%; height: 56%; transform: translate(-50%, -50%) rotate(-14deg); }
        .haldo-orbit-ring-8 { width: 64%; height: 64%; transform: translate(-50%, -50%) rotate(20deg); }
        .haldo-orbit-ring-9 { width: 72%; height: 72%; transform: translate(-50%, -50%) rotate(-25deg); }
        .haldo-orbit-ring-10 { width: 80%; height: 80%; transform: translate(-50%, -50%) rotate(12deg); }
        .haldo-orbit-ring-11 { width: 88%; height: 88%; transform: translate(-50%, -50%) rotate(-18deg); }
        .haldo-orbit-ring-12 { width: 96%; height: 96%; transform: translate(-50%, -50%) rotate(28deg); }

        /* =========================================================
           PLANETEN — 12 GALAXIEN
           ========================================================= */

        .haldo-planet-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .haldo-planet-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: haldo-orbit-spin var(--orbit-speed, 20s) linear infinite;
            animation-direction: var(--orbit-direction, normal);
        }

        @keyframes haldo-orbit-spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .haldo-planet {
            position: absolute;
            left: 50%;
            top: 0;
            width: var(--planet-size, 14px);
            height: var(--planet-size, 14px);
            margin-left: calc(var(--planet-size, 14px) / -2);
            margin-top: calc(var(--planet-size, 14px) / -2);
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            background: var(--planet-bg, radial-gradient(circle at 35% 30%, #ffffff, #8fc8ff 28%, #3263bd 62%, #0d1c43 100%));
            box-shadow: 0 0 var(--planet-glow-size, 10px) var(--planet-glow, rgba(80,170,255,.6));
            animation: haldo-planet-pulse 3s ease-in-out infinite;
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .haldo-planet:hover {
            transform: scale(1.3);
            box-shadow: 0 0 25px var(--planet-glow, rgba(80,170,255,.8));
            z-index: 100;
        }

        @keyframes haldo-planet-pulse {
            0%, 100% { filter: brightness(.9); }
            50% { filter: brightness(1.15); }
        }

        /* 12 PLANETEN/GALAXIEN */
        .haldo-planet-1 { --planet-size: 10px; --planet-bg: radial-gradient(circle at 35% 30%, #ddd, #8a8a8a 55%, #444); --planet-glow: rgba(200,200,200,.4); --planet-glow-size: 8px; }
        .haldo-planet-2 { --planet-size: 14px; --planet-bg: radial-gradient(circle at 35% 30%, #ffecb3, #d4a843 50%, #8a5a1a); --planet-glow: rgba(255,200,100,.5); --planet-glow-size: 12px; }
        .haldo-planet-3 { --planet-size: 18px; --planet-bg: radial-gradient(circle at 35% 30%, #b8f2ff 0%, #2b91df 23%, #1264ad 58%, #062b61 100%); --planet-glow: rgba(50,180,255,.8); --planet-glow-size: 16px; }
        .haldo-planet-3::after { content: ''; position: absolute; width: 40%; height: 22%; left: 20%; top: 28%; border-radius: 60% 40% 55% 45%; background: rgba(60,200,100,.7); transform: rotate(-15deg); }
        .haldo-planet-3 .moon-orbit { position: absolute; left: 50%; top: 50%; width: 220%; height: 220%; transform: translate(-50%, -50%); border-radius: 50%; animation: moon-orbit-spin 3.8s linear infinite; }
        .haldo-planet-3 .moon { position: absolute; left: 50%; top: -4px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b0b8c5 55%, #666); box-shadow: 0 0 6px rgba(255,255,255,.5); }
        @keyframes moon-orbit-spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .haldo-planet-4 { --planet-size: 14px; --planet-bg: radial-gradient(circle at 35% 30%, #ffc4a0, #c94a2a 50%, #6b1a10); --planet-glow: rgba(255,100,60,.6); --planet-glow-size: 12px; }
        .haldo-planet-5 { --planet-size: 32px; --planet-bg: repeating-linear-gradient(0deg, #e8c8a0 0 6px, #b0885a 6px 10px, #d8b888 10px 14px); --planet-glow: rgba(255,200,150,.4); --planet-glow-size: 18px; }
        .haldo-planet-6 { --planet-size: 28px; --planet-bg: radial-gradient(circle at 35% 30%, #f5e0b0, #c8a050 55%, #7a5a2a); --planet-glow: rgba(255,210,120,.4); --planet-glow-size: 16px; }
        .haldo-planet-6::before { content: ''; position: absolute; left: 50%; top: 50%; width: 200%; height: 35%; transform: translate(-50%, -50%) rotate(-18deg); border: 2px solid rgba(200,180,140,.6); border-radius: 50%; box-shadow: 0 0 10px rgba(200,180,140,.2); }
        .haldo-planet-7 { --planet-size: 22px; --planet-bg: radial-gradient(circle at 35% 30%, #c8f5ff, #5ab0c8 50%, #1a5a6a); --planet-glow: rgba(100,220,255,.5); --planet-glow-size: 14px; }
        .haldo-planet-8 { --planet-size: 22px; --planet-bg: radial-gradient(circle at 35% 30%, #8ab8ff, #3a5ab8 50%, #1a2a5a); --planet-glow: rgba(80,120,255,.6); --planet-glow-size: 14px; }
        .haldo-planet-9 { --planet-size: 10px; --planet-bg: radial-gradient(circle at 35% 30%, #ddd8c8, #9a8a7a 55%, #4a3a2a); --planet-glow: rgba(200,180,160,.3); --planet-glow-size: 8px; }
        .haldo-planet-10 { --planet-size: 16px; --planet-bg: radial-gradient(circle at 35% 30%, #ffd8e8, #c85a8a 50%, #6a1a3a); --planet-glow: rgba(255,100,180,.5); --planet-glow-size: 12px; }
        .haldo-planet-11 { --planet-size: 12px; --planet-bg: radial-gradient(circle at 35% 30%, #aaffd0, #3a9a6a 50%, #1a4a2a); --planet-glow: rgba(80,255,150,.4); --planet-glow-size: 10px; }
        .haldo-planet-12 { --planet-size: 14px; --planet-bg: radial-gradient(circle at 35% 30%, #e8d0ff, #8a5ac8 50%, #3a1a6a); --planet-glow: rgba(180,120,255,.5); --planet-glow-size: 12px; }

        /* =========================================================
           SONNE — MIT LEBENDIGEM LOGO
           ========================================================= */

        .haldo-sun-container {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(220px, 28vw, 360px);
            height: clamp(220px, 28vw, 360px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: auto;
            cursor: pointer;
        }

        .haldo-sun-core {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 30px rgba(255,220,70,.95), 0 0 80px rgba(255,165,40,.72), 0 0 150px rgba(255,100,20,.38), 0 0 250px rgba(255,80,0,.15);
            animation: haldo-sun-pulse 4s ease-in-out infinite;
        }

        @keyframes haldo-sun-pulse {
            0%, 100% { transform: scale(.98); box-shadow: 0 0 25px rgba(255,220,70,.9); }
            50% { transform: scale(1.035); box-shadow: 0 0 40px rgba(255,220,70,1), 0 0 100px rgba(255,165,40,.8); }
        }

        /* 365 SONNENSTRAHLEN */
        .haldo-sun-rays {
            position: absolute;
            inset: -45%;
            border-radius: 50%;
            pointer-events: none;
            background: repeating-conic-gradient(from 0deg,
                rgba(255,246,180,.0) 0deg,
                rgba(255,246,180,.0) .65deg,
                rgba(255,224,94,.7) .9deg,
                rgba(255,160,35,.15) 1.2deg,
                rgba(255,246,180,.0) 1.8deg,
                rgba(255,246,180,.0) 2.2deg
            );
            mask-image: radial-gradient(circle, transparent 0 48%, #000 49% 53%, transparent 55%);
            -webkit-mask-image: radial-gradient(circle, transparent 0 48%, #000 49% 53%, transparent 55%);
            animation: haldo-sun-rays-spin 35s linear infinite;
        }

        @keyframes haldo-sun-rays-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .haldo-sun-aura {
            position: absolute;
            inset: -20%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,240,130,.25), rgba(255,174,35,.1) 38%, rgba(255,100,30,.04) 58%, transparent 72%);
            filter: blur(20px);
            animation: haldo-sun-aura-pulse 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes haldo-sun-aura-pulse {
            0%, 100% { transform: scale(.92); opacity: .6; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        /* =========================================================
           HALDO LOGO — LEBENDIG IN DER SONNE
           ========================================================= */

        .haldo-logo-in-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 42%;
            height: 42%;
            transform: translate(-50%, -50%);
            z-index: 60;
            border-radius: 50%;
            pointer-events: none;
        }

        .haldo-logo-in-sun img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px rgba(255,255,255,.85)) drop-shadow(0 0 30px rgba(255,205,70,.9));
            animation: haldo-logo-living 4.2s ease-in-out infinite;
        }

        @keyframes haldo-logo-living {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.02) rotate(0.5deg); }
            50% { transform: scale(1.035) rotate(0deg); }
            75% { transform: scale(1.01) rotate(-0.5deg); }
        }

        /* =========================================================
           LEBENDIGES HALDO AI — MENSCHLICHE PRÄSENZ
           ========================================================= */

        .haldo-living-avatar {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 55%;
            height: 55%;
            transform: translate(-50%, -50%);
            z-index: 40;
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .haldo-living-avatar .avatar-aura {
            position: absolute;
            inset: -12%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.2), rgba(255,220,100,.12) 35%, rgba(100,190,255,.06) 55%, transparent 75%);
            filter: blur(10px);
            animation: haldo-avatar-aura 3.5s ease-in-out infinite;
        }

        @keyframes haldo-avatar-aura {
            0%, 100% { opacity: .4; transform: scale(.9); }
            50% { opacity: .9; transform: scale(1.08); }
        }

        .haldo-living-avatar img {
            position: relative;
            z-index: 4;
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 0 8px rgba(255,255,255,.7)) drop-shadow(0 0 22px rgba(255,205,70,.6));
            transition: all .3s ease;
        }

        /* AVATAR ZUSTÄNDE */
        .haldo-living-avatar[data-state="idle"] img { animation: haldo-avatar-idle 4.8s ease-in-out infinite; }
        .haldo-living-avatar[data-state="listening"] img { animation: haldo-avatar-listening 1.6s ease-in-out infinite; }
        .haldo-living-avatar[data-state="thinking"] img { animation: haldo-avatar-thinking 2.2s ease-in-out infinite; }
        .haldo-living-avatar[data-state="speaking"] img { animation: haldo-avatar-speaking .6s ease-in-out infinite; }
        .haldo-living-avatar[data-state="happy"] img { animation: haldo-avatar-happy .7s ease-out 1; }

        @keyframes haldo-avatar-idle {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(-2px) scale(1.01) rotate(0.3deg); }
            50% { transform: translateY(0) scale(1.015) rotate(0deg); }
            75% { transform: translateY(1px) scale(1.005) rotate(-0.3deg); }
        }

        @keyframes haldo-avatar-listening {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes haldo-avatar-thinking {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }

        @keyframes haldo-avatar-speaking {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.045); }
        }

        @keyframes haldo-avatar-happy {
            0% { transform: scale(.92); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* HÄNDE */
        .haldo-living-avatar .hand {
            position: absolute;
            width: 16%;
            height: 16%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.35), rgba(255,200,100,.12) 50%, transparent 70%);
            filter: blur(1px);
            opacity: .4;
            animation: haldo-hand-move 3.8s ease-in-out infinite;
        }

        .haldo-living-avatar .hand-left { left: -2%; top: 35%; animation-delay: 0s; }
        .haldo-living-avatar .hand-right { right: -2%; top: 35%; animation-delay: 1.9s; }

        @keyframes haldo-hand-move {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(0, -6px) scale(1.08); }
        }

        /* MUND (LIP-SYNC) */
        .haldo-living-avatar .mouth {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 20%;
            height: 5%;
            border-radius: 50%;
            background: rgba(255,200,150,.25);
            border: 1px solid rgba(255,255,255,.08);
            transition: all .1s ease;
        }

        .haldo-living-avatar[data-state="speaking"] .mouth {
            animation: haldo-mouth-speak .3s ease-in-out infinite alternate;
        }

        @keyframes haldo-mouth-speak {
            0% { height: 4%; transform: translateX(-50%) scaleY(.7); }
            100% { height: 11%; transform: translateX(-50%) scaleY(1.2); }
        }

        /* AUGEN */
        .haldo-living-avatar .eyes {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 11%;
            display: flex;
            justify-content: space-between;
        }

        .haldo-living-avatar .eye {
            width: 28%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.06);
            position: relative;
        }

        .haldo-living-avatar .eye::after {
            content: '';
            position: absolute;
            width: 32%;
            height: 32%;
            border-radius: 50%;
            background: rgba(255,220,100,.5);
            top: 30%;
            left: 30%;
            transition: all .3s ease;
        }

        .haldo-living-avatar[data-state="listening"] .eye::after {
            animation: haldo-eye-listen 1.2s ease-in-out infinite;
        }

        .haldo-living-avatar[data-state="thinking"] .eye::after {
            animation: haldo-eye-think 1.8s ease-in-out infinite;
        }

        @keyframes haldo-eye-listen {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        @keyframes haldo-eye-think {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(4px, -3px); }
        }

        /* =========================================================
           HALDO AI OS — LEUCHTENDES SCHRIFT-LOGO
           ========================================================= */

        .haldo-os-logo-text {
            position: absolute;
            left: 50%;
            top: 62%;
            transform: translateX(-50%);
            z-index: 70;
            font-size: clamp(14px, 2vw, 28px);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffd54b, #ff9f1c, #ffd54b, #ff6b00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: haldo-logo-text-glow 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255,200,80,.3), 0 0 60px rgba(255,200,80,.15);
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes haldo-logo-text-glow {
            0%, 100% { background-position: 0% 50%; filter: drop-shadow(0 0 10px rgba(255,200,80,.2)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 25px rgba(255,200,80,.5)); }
        }

        .haldo-os-logo-text .haldo-highlight {
            color: #fff;
            -webkit-text-fill-color: #fff;
            background: none;
            text-shadow: 0 0 20px rgba(255,255,255,.5), 0 0 40px rgba(255,200,80,.3);
        }

        /* =========================================================
           GEHEIME PLANETEN-UHR
           ========================================================= */

        .haldo-secret-clock {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 80;
            font-size: 11px;
            font-family: monospace;
            opacity: .4;
            text-align: right;
            pointer-events: none;
            color: rgba(255,200,80,.6);
            text-shadow: 0 0 10px rgba(255,200,80,.1);
            transition: opacity .3s ease;
        }

        .haldo-secret-clock:hover {
            opacity: .8;
        }

        .haldo-secret-clock .planet-time {
            font-size: 9px;
            opacity: .6;
            margin-top: 2px;
        }

        /* =========================================================
           MENÜ BUTTONS
           ========================================================= */

        .haldo-menu-button {
            position: fixed;
            z-index: 9500;
            width: 48px;
            height: 48px;

            background: rgba(8,12,30,0.8);

            border-color: rgba(255,200,80,.3);

        .haldo-menu-button img {

            height: 30px;
            border-radius: 50%;
            object-fit: contain;

        /* =========================================================
           MENÜ PANELS
           ========================================================= */

            z-index: 9600;

            max-height: min(75vh, calc(100dvh - 100px));
            overflow-y: auto;
            padding: 16px;
            border-radius: 20px;
            background: var(--haldo-surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--haldo-border);
            box-shadow: var(--haldo-shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(.96);
            transition: all .3s ease;
            color: #fff;
        }

        .haldo-menu-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .haldo-menu-panel.system-panel { top: 72px; left: 16px; }
        .haldo-menu-panel.apps-panel { bottom: 76px; left: 50%; transform: translateX(-50%) translateY(12px) scale(.96); }
        .haldo-menu-panel.apps-panel.open { transform: translateX(-50%) translateY(0) scale(1); }

        .haldo-menu-panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--haldo-border);
            margin-bottom: 12px;
        }

        .haldo-menu-panel-header img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-menu-panel-header .title { font-size: 16px; font-weight: 700; flex: 1; }

        .haldo-menu-panel-header .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,.06);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .haldo-menu-panel-header .close-btn:hover { background: rgba(255,80,80,.2); }

        .haldo-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.04);
            color: rgba(255,255,255,.85);
            cursor: pointer;
            transition: all .2s ease;
            margin-bottom: 6px;
        }

        .haldo-menu-item:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,200,80,.15);
            transform: translateX(3px);
        }

        .haldo-menu-item .icon { font-size: 20px; width: 32px; text-align: center; }
        .haldo-menu-item .info { flex: 1; min-width: 0; }
        .haldo-menu-item .info .name { font-size: 13px; font-weight: 600; }
        .haldo-menu-item .info .desc { font-size: 10px; opacity: .5; margin-top: 2px; }

        /* =========================================================
           AI CHAT WINDOW
           ========================================================= */

        .haldo-ai-chat-window {
            position: fixed;
            z-index: 9000;
            width: min(580px, calc(100vw - 24px));
            height: min(660px, calc(100vh - 40px));
            right: 18px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 24px;
            background: var(--haldo-surface);
            backdrop-filter: blur(28px);
            box-shadow: var(--haldo-shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(18px) scale(.97);
            transition: opacity .25s ease, transform .25s ease, visibility .25s;
            color: #fff;
        }

        .haldo-ai-chat-window.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .haldo-ai-chat-window.minimized { height: 60px; min-height: 60px; }
        .haldo-ai-chat-window.minimized .haldo-chat-body,
        .haldo-ai-chat-window.minimized .haldo-chat-footer { display: none; }

        .haldo-chat-header {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px 8px 18px;
            cursor: grab;
            user-select: none;
            border-bottom: 1px solid var(--haldo-border);
        }

        .haldo-chat-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .haldo-chat-title img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-chat-title .haldo-title-glow {
            background: linear-gradient(135deg, #ffd54b, #ff9f1c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255,200,80,.3);
        }

        .haldo-chat-subtitle { font-size: 11px; opacity: .55; margin-top: 2px; }

        .haldo-chat-controls { display: flex; gap: 4px; }

        .haldo-chat-control {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 9px;
            background: rgba(255,255,255,.07);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        .haldo-chat-control:hover { background: rgba(255,255,255,.14); }

        .haldo-chat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

        .haldo-chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .haldo-chat-message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            word-break: break-word;
            animation: haldoMessageIn .25s ease-out;
        }

        .haldo-chat-message-user {
            align-self: flex-end;
            background: rgba(255,255,255,.12);
            border-bottom-right-radius: 4px;
        }

        .haldo-chat-message-ai {
            align-self: flex-start;
            background: rgba(255,220,140,.10);
            border: 1px solid rgba(255,255,255,.07);
            border-bottom-left-radius: 4px;
        }

        .haldo-chat-typing {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 0 16px 8px;
        }

        .haldo-chat-typing.active { display: flex; }

        .haldo-chat-typing span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: .35;
            animation: haldoTypingDot 1s ease-in-out infinite;
        }

        .haldo-chat-typing span:nth-child(2) { animation-delay: .12s; }
        .haldo-chat-typing span:nth-child(3) { animation-delay: .24s; }

        @keyframes haldoTypingDot {
            0%, 100% { transform: translateY(0); opacity: .3; }
            50% { transform: translateY(-4px); opacity: .9; }
        }

        @keyframes haldoMessageIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .haldo-chat-footer {
            padding: 10px 12px 14px;
            border-top: 1px solid var(--haldo-border);
        }

        .haldo-chat-input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .haldo-chat-input {
            flex: 1;
            min-height: 44px;
            max-height: 150px;
            resize: none;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            padding: 11px 14px;
            background: rgba(255,255,255,.06);
            color: #fff;
            font: inherit;
            outline: none;
            line-height: 1.4;
        }

        .haldo-chat-input:focus { border-color: rgba(255,255,255,.25); }
        .haldo-chat-input::placeholder { color: rgba(255,255,255,.3); }

        .haldo-chat-send,
        .haldo-chat-voice {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            border: 0;
            border-radius: 13px;
            background: rgba(255,255,255,.08);
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            transition: all .2s ease;
        }

        .haldo-chat-send:hover,
        .haldo-chat-voice:hover { background: rgba(255,255,255,.15); }

        .haldo-chat-voice.listening {
            background: rgba(255,80,80,.25);
            box-shadow: 0 0 20px rgba(255,80,80,.15);
        }

        /* =========================================================
           APP WINDOWS
           ========================================================= */

        .haldo-app-window {
            position: fixed;
            z-index: 9999;
            width: min(540px, 92vw);
            max-height: 75vh;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--haldo-surface);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: var(--haldo-shadow);
            overflow: auto;
            color: #fff;
            animation: haldoAppWindowIn .25s ease-out;
        }

        @keyframes haldoAppWindowIn {
            from { opacity: 0; transform: translate(-50%, -45%) scale(.96); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .haldo-app-window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--haldo-border);
        }

        .haldo-app-window-header .title {
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .haldo-app-window-header .title img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-app-window-header .title .app-glow {
            background: linear-gradient(135deg, #ffd54b, #ff9f1c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .haldo-app-window-close {
            background: rgba(255,255,255,.08);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all .2s ease;
        }

        .haldo-app-window-close:hover { background: rgba(255,80,80,.3); }

        .haldo-app-window-body {
            padding: 16px;
            overflow-y: auto;
            max-height: 60vh;
        }

        /* =========================================================
           STATUS BAR
           ========================================================= */

        .haldo-status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9400;
            height: 24px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--haldo-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 10px;
            color: rgba(255,255,255,.4);
            font-family: monospace;
        }

        .haldo-status-bar .version { color: rgba(255,200,80,.6); }
        .haldo-status-bar .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .haldo-status-bar .status-dot.online {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76,175,80,.4);
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 700px) {
            .haldo-cosmic-center { width: 96vw; height: 96vw; }
            .haldo-orbit-system { transform: translate(-50%, -50%) scale(.72); }
            .haldo-sun-container { width: 190px; height: 190px; }

            .haldo-menu-button { width: 44px; height: 44px; font-size: 18px; }
            .haldo-menu-button.system { top: 12px; left: 12px; }
            .haldo-menu-button.apps { bottom: 12px; }

            .haldo-menu-panel.system-panel { top: 64px; left: 12px; width: calc(100vw - 24px); }
            .haldo-menu-panel.apps-panel { bottom: 68px; width: calc(100vw - 24px); }

            .haldo-ai-chat-window {
                right: 8px;
                bottom: 8px;
                width: calc(100vw - 16px);
                height: min(600px, calc(100vh - 16px));
                border-radius: 18px;
            }
            .haldo-chat-message { max-width: 90%; }

            .haldo-app-window {
                width: calc(100vw - 16px);
                max-height: 80vh;
                border-radius: 18px;
            }

            .haldo-status-bar { font-size: 8px; height: 20px; padding: 0 8px; }
            .haldo-os-logo-text { font-size: clamp(10px, 1.5vw, 18px); top: 65%; }
            .haldo-secret-clock { bottom: 20px; right: 16px; font-size: 9px; }
        }

        @media (max-width: 420px) {
            .haldo-ai-chat-window {
                right: 0;
                bottom: 0;
                width: 100vw;
                height: 100dvh;
                border-radius: 0;
            }
            .haldo-sun-container { width: 145px; height: 145px; }
            .haldo-cosmic-center { width: 100vw; height: 100vw; }
            .haldo-menu-panel { width: calc(100vw - 12px); left: 6px; right: 6px; }
            .haldo-menu-panel.system-panel { top: 60px; }
            .haldo-menu-panel.apps-panel { bottom: 62px; }
            .haldo-os-logo-text { font-size: clamp(8px, 1.2vw, 14px); top: 68%; letter-spacing: 2px; }
            .haldo-secret-clock { bottom: 16px; right: 12px; font-size: 8px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

        function generateStars() {
            const stars = document.getElementById("haldo-stars");
            if (!stars) return;
            stars.innerHTML = "";
            const count = Math.min(400, Math.max(200, Math.floor(window.innerWidth * window.innerHeight / 6000)));
            for (let i = 0; i < count; i++) {
                const star = document.createElement("span");
                star.className = "haldo-star";
                const size = Math.random() * 3 + 0.5;
                star.style.width = size + "px";
                star.style.height = size + "px";
                star.style.left = Math.random() * 100 + "%";
                star.style.top = Math.random() * 100 + "%";
                star.style.setProperty('--star-speed', (2 + Math.random() * 6) + 's');
                star.style.setProperty('--star-delay', (Math.random() * 6) + 's');
                stars.appendChild(star);
            }
            console.log("⭐ " + count + " Sterne generiert (365+ Tage)");
        }

        // =========================================================
        // 2. TIME DISPLAY
        // =========================================================

        function updateTimeDisplay() {
            const el = document.getElementById("haldo-time-display");
            if (el) el.textContent = new Date().toLocaleTimeString();
        }

        // =========================================================
        // 3. GEHEIME PLANETEN-UHR
        // =========================================================

        function updatePlanetClock() {
            const clockEl = document.getElementById("haldo-clock-display");
            const planetEl = document.getElementById("haldo-planet-time");
            if (!clockEl) return;

            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            // Planetare Zeit (simuliert)
            const planetSeconds = (now.getTime() / 1000) % 86400;
            const planetHours = Math.floor(planetSeconds / 3600);
            const planetMinutes = Math.floor((planetSeconds % 3600) / 60);
            const planetSecs = Math.floor(planetSeconds % 60);

            const ph = String(planetHours).padStart(2, '0');
            const pm = String(planetMinutes).padStart(2, '0');
            const ps = String(planetSecs).padStart(2, '0');

            clockEl.textContent = `${h}:${m}:${s}`;

            // Planeten-Zeit mit Tagesfortschritt
            const dayProgress = ((planetSeconds / 86400) * 100).toFixed(1);
            const planetNames = ['Merkur', 'Venus', 'Erde', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptun', 'Pluto', 'HalDo', 'Nova', 'Astra'];
            const currentPlanet = planetNames[Math.floor(planetSeconds / 7200) % 12];

            if (planetEl) {
                planetEl.textContent = `🌍 ${currentPlanet} · ${ph}:${pm}:${ps} · Tag ${Math.floor(dayProgress)}%`;
            }

        // =========================================================

            window.HalDo.events.dispatchEvent(new CustomEvent(name, { detail }));
        };

        window.HalDo.on = function(name, callback) {
            if (typeof callback !== "function") return;
            window.HalDo.events.addEventListener(name, callback);
        };

        // =========================================================
        // 5. STORAGE
        // =========================================================

        window.HalDo.Storage = {
            prefix: "haldo_",

            get(key, defaultValue = null) {
                try {
                    const value = localStorage.getItem(this.prefix + key);
                    if (value === null) return defaultValue;
                    try { return JSON.parse(value); } catch(e) { return value; }
                } catch(e) { return defaultValue; }
            },

            set(key, value) {
                try {
                    localStorage.setItem(this.prefix + key, JSON.stringify(value));
                    return true;
                } catch(e) { return false; }
            },

            remove(key) {
                try {
                    localStorage.removeItem(this.prefix + key);
                    return true;
                } catch(e) { return false; }
            },

            getAll() {
                const result = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try {
                            result[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k));
                        } catch(e) {
                            result[k.replace(this.prefix, '')] = localStorage.getItem(k);
                        }
                    });
                } catch(e) {}
                return result;
            }
        };

        // =========================================================
        // 6. BOOT — TEIL 1
        // =========================================================

        function haldoBootPart1() {
            generateStars();
            updateTimeDisplay();
            setInterval(updateTimeDisplay, 1000);
            updatePlanetClock();
            setInterval(updatePlanetClock, 1000);

            // Version anzeigen
            document.getElementById("haldo-version-display").textContent = "✦ v" + window.HALDO_VERSION + " " + window.HALDO_BUILD;

                    chat.classList.add("open");
                    chat.removeAttribute("aria-hidden");
                    const input = document.getElementById("haldo-chat-input");
                    if (input) setTimeout(() => input.focus(), 100);
                }
                const avatar = document.getElementById("haldo-living-avatar");
                if (avatar) avatar.dataset.state = "happy";
                setTimeout(() => { if (avatar) avatar.dataset.state = "idle"; }, 800);
            });

                if (avatar) avatar.dataset.state = "happy";
                setTimeout(() => { if (avatar) avatar.dataset.state = "idle"; }, 800);
            });

            // Planet click

                planet.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = planet.dataset.planet || 'Planet';

                            setTimeout(() => {
                                const event = new Event('input', { bubbles: true });
                                input.dispatchEvent(event);
                            }, 100);
                        }
                    }
                });
            });

            console.log("✅ TEIL 1 geladen — Oberfläche + Animationen + Uhr");
            console.log("📌 Warte auf TEIL 2 — HalDo AI Core + Apps + Einstellungen");
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", haldoBootPart1, { once: true });
        } else {
            haldoBootPart1();
        }
    </script>

            correctText(text, lang = 'de') {
                const corrections = {
                    'Apfel': 'Äpfel', 'apfel': 'Äpfel',
                    'hause': 'Hause', 'Hause': 'Haus',
                    'gehen': 'gehen', 'komme': 'komme',
                    'ich habe': 'Ich habe', 'ich bin': 'Ich bin',
                    'sie sind': 'Sie sind', 'sie haben': 'Sie haben',
                    'das ist': 'Das ist', 'das war': 'Das war',
                    'er hat': 'Er hat', 'sie hat': 'Sie hat',
                    'wir haben': 'Wir haben', 'ihr habt': 'Ihr habt'
                };

                let corrected = text;
                for (const [wrong, right] of Object.entries(corrections)) {
                    corrected = corrected.replace(new RegExp(wrong, 'g'), right);
                }

                const suggestions = [];
                if (text.includes('  ')) suggestions.push('• Doppelte Leerzeichen entfernen');
                if (text.split('.').length > 2) suggestions.push('• Satzzeichen prüfen (Punkt am Satzende)');
                if (text.length > 0 && text[0] !== text[0].toUpperCase()) suggestions.push('• Großschreibung am Satzanfang prüfen');

                let result = this.translate(`📝 Korrigierter Text:\n"${corrected}"`, lang);
                if (suggestions.length > 0) {
                    result += this.translate(`\n\n💡 Vorschläge:\n${suggestions.join('\n')}`, lang);
                } else {
                    result += this.translate('\n\n✅ Der Text sieht grammatikalisch korrekt aus.', lang);
                }
                return result;
            },

            summarizeText(text, lang = 'de') {
                const words = text.split(' ');
                if (words.length <= 20) {
                    return this.translate(`📄 Zusammenfassung:\n"${text}"\n\n💡 Der Text ist bereits kurz und prägnant.`, lang);
                }

                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
                const summary = sentences.slice(0, Math.min(3, sentences.length)).join('. ') + '.';

                return this.translate(
                    `📄 Zusammenfassung:\n"${summary}"\n\n` +
                    `📊 Statistik:\n• Wörter: ${words.length}\n• Sätze: ${sentences.length}\n• Zeichen: ${text.length}`,
                    lang
                );
            }
        };

            get(id) { return this.apps.get(id) || null; },

            install(id) {
                const app = this.get(id);
                if (!app) return false;
                if (this.installed.has(id)) return true;
                app.status = 'installed';
                app.installed = true;
                this.installed.add(id);
                window.HalDo.Storage.set('app_installed_' + id, true);
                console.log(`📦 App "${app.name || id}" installiert`);

            isInstalled(id) {

                this.history.forEach(msg => this.renderMessage(msg.role, msg.content));
                if (this.history.length === 0) {
                    this.renderMessage("ai", "🌌 Guten Tag! Ich bin HalDo AI im Universe-Modus. 💙❤️ Ich beantworte ALLE Ihre Fragen — von A bis Z! Wie kann ich Ihnen helfen?");
                }

                window.HalDo.AICore.init();
                this.setupVoice();

                // Sun click from Part 1 is already set, but we add chat open
                document.addEventListener("haldo:ai:open", () => this.open());
            },

            open() {
                this.window.classList.add("open");
                this.window.removeAttribute("aria-hidden");
                setTimeout(() => this.input.focus(), 100);
                window.HalDo.AICore.reactAvatar('happy');
                setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 800);
            },

            close() {
                this.window.classList.remove("open");
                this.window.setAttribute("aria-hidden", "true");
            },

            toggleMinimize() {
                this.window.classList.toggle("minimized");
            },

            renderMessage(role, content) {
                const div = document.createElement("div");
                div.className = `haldo-chat-message ${role === "user" ? "haldo-chat-message-user" : "haldo-chat-message-ai"}`;
                div.textContent = content;
                this.messages.appendChild(div);
                this.messages.scrollTop = this.messages.scrollHeight;
            },

            setStatus(text) {
                this.status.textContent = text;
            },

            showTyping() {
                this.typing.classList.add("active");
                this.setStatus("HalDo AI denkt …");
                window.HalDo.AICore.reactAvatar('thinking');
            },

            hideTyping() {
                this.typing.classList.remove("active");
                this.setStatus("🌌 Bereit für alle Fragen");
                window.HalDo.AICore.reactAvatar('idle');
            },

            async send() {
                const text = this.input.value.trim();
                if (!text || this._sending) return;

                this.input.value = "";
                this.input.style.height = "auto";
                this.renderMessage("user", text);
                this.history.push({ role: "user", content: text });
                window.HalDo.Storage.set('chat_history', this.history.slice(-200));

                this._sending = true;
                this.showTyping();

                try {
                    const response = await window.HalDo.AICore.ask(text);
                    this.hideTyping();
                    this.renderMessage("ai", response);
                    this.history.push({ role: "ai", content: response });
                    window.HalDo.Storage.set('chat_history', this.history.slice(-200));

                    window.HalDo.AICore.reactAvatar('speaking');
                    setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 1000);
                    this.speak(response);

                } catch(e) {
                    this.hideTyping();
                    this.renderMessage("ai", "🌌 Entschuldigung, ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.");
                    console.error(e);
                }

                this._sending = false;
            },

            speak(text) {
                if (!window.speechSynthesis) return;
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = "de-DE";
                    utterance.rate = 0.92;
                    utterance.pitch = 1.0;
                    utterance.volume = 0.85;
                    utterance.onstart = () => window.HalDo.AICore.reactAvatar('speaking');
                    utterance.onend = () => window.HalDo.AICore.reactAvatar('idle');
                    utterance.onerror = () => window.HalDo.AICore.reactAvatar('idle');
                    window.speechSynthesis.speak(utterance);
                } catch(e) {}
            },

            setupVoice() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) return;

                this.recognition = new Recognition();
                this.recognition.lang = "de-DE";
                this.recognition.continuous = false;
                this.recognition.interimResults = true;

                this.recognition.onstart = () => {
                    this.voiceBtn.classList.add("listening");
                    this.setStatus("🎙️ Ich höre zu …");
                    window.HalDo.AICore.reactAvatar('listening');
                };

                this.recognition.onresult = (event) => {
                    let final = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    }
                    if (final) {
                        this.input.value = final;
                        this.stopVoice();
                        setTimeout(() => this.send(), 100);
                    }
                };

                this.recognition.onerror = () => {
                    this.stopVoice();
                    this.setStatus("Bereit");
                };

                this.recognition.onend = () => {
                    this.voiceBtn.classList.remove("listening");
                    if (this.status.textContent === "🎙️ Ich höre zu …") {
                        this.setStatus("🌌 Bereit für alle Fragen");
                    }
                    window.HalDo.AICore.reactAvatar('idle');
                };
            },

            toggleVoice() {
                if (this.recognition?.listening) {
                    this.stopVoice();
                } else {
                    this.startVoice();
                }
            },

            startVoice() {
                if (!this.recognition) return;
                try { this.recognition.start(); } catch(e) {}
            },

            stopVoice() {
                try { this.recognition?.stop(); } catch(e) {}
                this.voiceBtn.classList.remove("listening");
                window.HalDo.AICore.reactAvatar('idle');
                this.setStatus("🌌 Bereit für alle Fragen");
            }
        };

                this.editProject(projectId);

        window.HalDo.UpdateSystem = {
            currentVersion: window.HALDO_VERSION,
            updateAvailable: false,
            updateData: null,
            history: [],

            init() {
                this.loadHistory();
                console.log("↻ Update-System initialisiert — Version " + this.currentVersion);
                return this;
            },

            loadHistory() {
                this.history = window.HalDo.Storage.get('update_history', []);
                return this.history;
            },

            saveHistory() {
                window.HalDo.Storage.set('update_history', this.history);
                return true;
            },

            check() {
                console.log("🔍 Suche nach Updates...");
                // Simuliere Update-Check mit neuerer Version
                const mockUpdate = {
                    version: "22.1.2",
                    releaseDate: new Date().toISOString(),
                    changes: [
                        "🐛 Bugfixes und Stabilitätsverbesserungen",
                        "⚡ Performance-Optimierungen für alle Apps",
                        "✨ Neue Video-Effekte (4K/8K)",
                        "🌍 Weitere Sprachen hinzugefügt",
                        "🔒 Sicherheitsupdates",
                        "📱 Verbesserte Mobile-Ansicht"
                    ],
                    size: "3.2 MB",
                    requiresRestart: true
                };

                // Prüfe ob neuer als aktuelle Version
                const current = parseFloat(this.currentVersion);
                const available = parseFloat(mockUpdate.version);
                if (available > current) {
                    this.updateAvailable = true;
                    this.updateData = mockUpdate;
                    window.HalDo.emit("update:available", { update: mockUpdate });
                    console.log(`↻ Update verfügbar: v${mockUpdate.version}`);
                    return mockUpdate;
                } else {
                    this.updateAvailable = false;
                    console.log("✅ System ist auf dem neuesten Stand");
                    return null;
                }
            },

            install() {
                if (!this.updateAvailable || !this.updateData) {
                    alert('❌ Kein Update verfügbar.');
                    return false;
                }

                const update = this.updateData;
                console.log(`📦 Installiere Update auf Version ${update.version}...`);

                // Simuliere Installation mit Fortschritt
                alert(`↻ Update wird installiert...\n\n` +
                    `Version: ${update.version}\n` +
                    `Größe: ${update.size}\n` +
                    `Änderungen:\n${update.changes.map(c => `• ${c}`).join('\n')}\n\n` +
                    `⏳ Installation läuft...`);

                setTimeout(() => {
                    this.currentVersion = update.version;
                    this.updateAvailable = false;
                    window.HALDO_VERSION = update.version;
                    window.HalDo.OS.version = update.version;

                    this.history.push({
                        version: update.version,
                        installedAt: new Date().toISOString(),
                        changes: update.changes
                    });
                    this.saveHistory();

                    window.HalDo.emit("update:installed", { version: update.version });
                    console.log(`✅ Update auf Version ${update.version} installiert!`);

                    alert(`✅ Update erfolgreich installiert!\n\n` +
                        `Version: ${update.version}\n` +
                        `Installiert: ${new Date().toLocaleString()}\n\n` +
                        `🔄 Starte System neu...`);

                    setTimeout(() => {
                        location.reload();
                    }, 1500);
                }, 2000);
                return true;
            },

            getStatus() {
                return {
                    current: this.currentVersion,
                    available: this.updateAvailable,
                    data: this.updateData,
                    history: this.history
                };
            },

            renderUI(container) {
                if (!container) return;

                const status = this.getStatus();

                let html = `
                    <div style="padding:16px;">
                        <div style="font-size:24px;font-weight:700;margin-bottom:6px;">↻ Updates</div>
                        <div style="opacity:.6;font-size:13px;margin-bottom:12px;">Systemupdates & Versionen</div>
                        <div style="background:rgba(255,200,80,.08);border-radius:12px;padding:14px;border:1px solid ${status.available ? 'rgba(255,200,80,.3)' : 'rgba(255,255,255,.1)'};">
                            <div style="display:flex;align-items:center;gap:12px;">
                                <span style="font-size:28px;">${status.available ? '⬇️' : '✅'}</span>
                                <div style="flex:1;">
                                    <div style="font-weight:700;font-size:16px;">HalDo AI OS v${status.current}</div>
                                    <div style="opacity:.6;font-size:12px;">${status.available ? `Update v${status.data.version} verfügbar!` : 'Neueste Version'}</div>
                                </div>
                                <button id="update-check-btn" style="padding:8px 16px;border-radius:8px;background:rgba(255,200,80,.2);color:#fff;cursor:pointer;">${status.available ? '📦 Installieren' : '🔍 Prüfen'}</button>
                            </div>
                        </div>
                        <div style="margin-top:10px;display:flex;flex-direction:column;gap:4px;">
                            ${this.history.slice(-5).reverse().map(h =>
                                `<div style="padding:6px 12px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                                    <span>v${h.version}</span>
                                    <span style="opacity:.4;">${new Date(h.installedAt).toLocaleDateString()}</span>
                                    <span style="opacity:.3;font-size:10px;">${h.changes?.length || 0} Änderungen</span>
                                </div>`
                            ).join('') || '<div style="opacity:.3;font-size:11px;text-align:center;padding:8px;">Keine Update-Historie</div>'}
                        </div>
                    </div>
                `;

                container.innerHTML = html;

                document.getElementById('update-check-btn')?.addEventListener('click', () => {
                    if (status.available) {
                        this.install();
                    } else {
                        const result = this.check();
                        if (result) {
                            alert(`🔍 Update gefunden!\n\nVersion: ${result.version}\nGröße: ${result.size}\n\nÄnderungen:\n${result.changes.map(c => `• ${c}`).join('\n')}`);
                            this.renderUI(container);
                        } else {
                            alert('✅ System ist auf dem neuesten Stand!');
                        }
                    }
                });
            }
        };

        window.HalDo.BackupSystem = {
            backups: [],
            maxBackups: 10,

            init() {
                this.loadBackups();
                console.log("◫ Backup-System initialisiert — " + this.backups.length + " Backups");
                return this;
            },

            loadBackups() {
                this.backups = window.HalDo.Storage.get('backup_list', []);
                return this.backups;
            },

            saveBackups() {
                window.HalDo.Storage.set('backup_list', this.backups);
                return true;
            },

            create() {
                const backup = {
                    id: 'backup_' + Date.now(),
                    timestamp: new Date().toISOString(),
                    version: window.HALDO_VERSION,
                    data: {
                        settings: window.HalDo.Settings ? window.HalDo.Settings.getAll() : {},
                        notes: window.HalDo.Storage.get('notes', []),
                        chat: window.HalDo.Storage.get('chat_history', []),
                        apps: window.HalDo.AppRegistry ? window.HalDo.AppRegistry.getInstalled().map(a => a.id) : [],
                        projects: window.HalDo.VideoEditor ? window.HalDo.VideoEditor.projects : []
                    },
                    size: Math.floor(Math.random() * 50 + 10) + ' MB'
                };

                this.backups.unshift(backup);
                if (this.backups.length > this.maxBackups) {
                    this.backups = this.backups.slice(0, this.maxBackups);
                }
                this.saveBackups();

                window.HalDo.emit("backup:created", { backup });
                console.log("💾 Backup erstellt: " + new Date(backup.timestamp).toLocaleString());
                return backup;
            },

            restore(backupId) {
                const backup = this.backups.find(b => b.id === backupId);
                if (!backup) {
                    alert('❌ Backup nicht gefunden!');
                    return false;
                }

                if (!confirm(`Backup vom ${new Date(backup.timestamp).toLocaleString()} wiederherstellen?`)) {
                    return false;
                }

                console.log("↩️ Backup wird wiederhergestellt...", backup);

                // Simuliere Wiederherstellung
                alert(`↩️ Backup wird wiederhergestellt...\n\n` +
                    `Zeitpunkt: ${new Date(backup.timestamp).toLocaleString()}\n` +
                    `Version: ${backup.version}\n` +
                    `Größe: ${backup.size}\n\n` +
                    `⏳ Wiederherstellung läuft...`);

                setTimeout(() => {
                    if (backup.data.notes) {
                        window.HalDo.Storage.set('notes', backup.data.notes);
                    }
                    if (backup.data.chat) {
                        window.HalDo.Storage.set('chat_history', backup.data.chat);
                    }
                    window.HalDo.emit("backup:restored", { backup });
                    alert(`✅ Backup erfolgreich wiederhergestellt!\n\n` +
                        `Zeitpunkt: ${new Date(backup.timestamp).toLocaleString()}\n` +
                        `Version: ${backup.version}\n` +
                        `Notizen: ${backup.data.notes?.length || 0}\n` +
                        `Chat: ${backup.data.chat?.length || 0}`);
                }, 1500);
                return true;
            },

            deleteBackup(backupId) {
                this.backups = this.backups.filter(b => b.id !== backupId);
                this.saveBackups();
                return true;
            },

            renderUI(container) {
                if (!container) return;

                let html = `
                    <div style="padding:16px;">
                        <div style="font-size:24px;font-weight:700;margin-bottom:6px;">◫ Backup</div>
                        <div style="opacity:.6;font-size:13px;margin-bottom:12px;">Sichern & Wiederherstellen</div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
                            <button id="backup-create-btn" style="padding:14px;border-radius:12px;background:rgba(255,200,80,.12);border:1px solid rgba(255,200,80,.15);color:#fff;cursor:pointer;text-align:center;">
                                <div style="font-size:24px;">💾</div>
                                <div style="font-weight:700;font-size:12px;">Backup erstellen</div>
                            </button>
                            <button id="backup-restore-latest" style="padding:14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);color:#fff;cursor:pointer;text-align:center;">
                                <div style="font-size:24px;">↩️</div>
                                <div style="font-weight:700;font-size:12px;">Letztes Backup</div>
                            </button>
                        </div>
                        <div style="display:flex;flex-direction:column;gap:6px;">
                            ${this.backups.length === 0 ? '<div style="opacity:.4;font-size:12px;text-align:center;padding:12px;">Keine Backups vorhanden</div>' : ''}
                            ${this.backups.map(b => `
                                <div style="padding:10px 14px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;">
                                    <div>
                                        <div style="font-weight:600;">💾 ${new Date(b.timestamp).toLocaleString()}</div>
                                        <div style="font-size:10px;opacity:.5;">v${b.version} · ${b.size} · ${b.data.apps?.length || 0} Apps</div>
                                    </div>
                                    <div style="display:flex;gap:6px;">
                                        <button onclick="window.HalDo.BackupSystem.restore('${b.id}')" style="padding:4px 12px;border-radius:6px;background:rgba(255,200,80,.15);color:#fff;cursor:pointer;font-size:11px;">↩️</button>
                                        <button onclick="window.HalDo.BackupSystem.deleteBackup('${b.id}');window.HalDo.BackupSystem.renderUI(document.querySelector('.haldo-app-window-body'))" style="padding:4px 12px;border-radius:6px;background:rgba(255,80,80,.1);color:#ff6b6b;cursor:pointer;font-size:11px;">✕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                container.innerHTML = html;

                document.getElementById('backup-create-btn')?.addEventListener('click', () => {

                        `Version: ${backup.version}\n` +
                        `Größe: ${backup.size}`);

                    if (this.backups.length > 0) {

                        alert('❌ Kein Backup vorhanden!');

            init() {
                this.loadSettings();

            },

            loadSettings() {
                this.settings = window.HalDo.Storage.get('app_settings', {});

                return defaultValue;
            },

            set(appId, key, value) {
                if (!this.settings[appId]) this.settings[appId] = {};
                this.settings[appId][key] = value;
                this.saveSettings();
                window.HalDo.emit("app:setting:changed", { appId, key, value });

                return this.settings[appId] || {};

        function haldoBootPart3() {
            console.log("🎬 TEIL 3 wird initialisiert...");

            // Video Editor
            window.HalDo.VideoEditor.init();

            // Update System
            window.HalDo.UpdateSystem.init();

            // Backup System
            window.HalDo.BackupSystem.init();

            // App Settings
            window.HalDo.AppSettings.init();

            // Update-Check (automatisch)
            setTimeout(() => {
                const update = window.HalDo.UpdateSystem.check();
                if (update) {
                    console.log("↻ Update verfügbar: v" + update.version);
                    // Notification
                    const chat = document.getElementById('haldo-chat-window');
                    if (chat) {
                        const status = document.getElementById('haldo-chat-status');
                        if (status) status.textContent = '↻ Update verfügbar!';
                    }
                }
            }, 2000);

            // App Registry erweitern mit Video-Editor und Update Apps
            const extraApps = [
                { id: 'video-editor', name: 'Video Editor', icon: '🎬', category: 'Medien', description: '4K/8K Videobearbeitung' },
                { id: 'updates', name: 'Updates', icon: '↻', category: 'System', description: 'Systemupdates & Versionen' },
                { id: 'backup', name: 'Backup', icon: '◫', category: 'System', description: 'Sichern & Wiederherstellen' }
            ];

            extraApps.forEach(app => {
                if (!window.HalDo.AppRegistry.get(app.id)) {
                    window.HalDo.AppRegistry.register(app);
