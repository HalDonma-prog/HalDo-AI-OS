<script>

"use strict";

/* =========================================================
   HALDO COSMIC WORLD ENGINE
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.Cosmic =
{

    initialized:
        false,

    world:
        null,

    starField:
        null,

    sun:
        null,

    init()
    {

        if (
            this.initialized
        ) {
            return;
        }

        this.world =
            document.getElementById(
                "haldo-cosmic-world"
            );

        this.starField =
            document.getElementById(
                "haldo-star-field"
            );

        this.sun =
            document.getElementById(
                "haldo-sun"
            );

        if (
            !this.world ||
            !this.starField ||
            !this.sun
        ) {
            return;
        }

        this.createStars();

        this.bindSun();

        this.bindPlanets();

        this.initialized =
            true;

        if (
            typeof window.HalDo.emit ===
            "function"
        ) {

            window.HalDo.emit(
                "cosmic:ready",
                {
                    cosmic:
                        this
                }
            );
        }
    },


    /* =====================================================
       STARS
       ===================================================== */

    createStars()
    {

        const count =
            window.innerWidth < 600
                ? 90
                : 180;

        const fragment =
            document.createDocumentFragment();

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const star =
                document.createElement(
                    "span"
                );

            star.className =
                "haldo-star";

            star.style.setProperty(
                "--x",
                `${Math.random() * 100}%`
            );

            star.style.setProperty(
                "--y",
                `${Math.random() * 100}%`
            );

            star.style.setProperty(
                "--size",
                `${(
                    Math.random() * 2 +
                    .5
                ).toFixed(2)}px`
            );

            star.style.setProperty(
                "--opacity",
                (
                    .25 +
                    Math.random() * .75
                ).toFixed(2)
            );

            star.style.setProperty(
                "--duration",
                `${
                    2 +
                    Math.random() * 4
                }s`
            );

            star.style.setProperty(
                "--delay",
                `${
                    Math.random() * -5
                }s`
            );

            fragment.appendChild(
                star
            );
        }

        this.starField.appendChild(
            fragment
        );
    },


    /* =====================================================
       SUN
       ===================================================== */

    bindSun()
    {

        this.sun.addEventListener(
            "click",
            () => {

                this.activateAI();

            }
        );

        this.sun.addEventListener(
            "pointerdown",
            () => {

                window.HalDo.Avatar?.react(
                    "sun-click"
                );

            }
        );
    },


    activateAI()
    {

        window.HalDo.Avatar?.react(
            "greeting"
        );

        if (
            typeof window.HalDo.openAIChat ===
            "function"
        ) {

            window.HalDo.openAIChat();

        }

        if (
            typeof window.HalDo.emit ===
            "function"
        ) {

            window.HalDo.emit(
                "ai:activated",
                {
                    source:
                        "sun"
                }
            );
        }
    },


    /* =====================================================
       PLANETS
       ===================================================== */

    bindPlanets()
    {

        const planets =
            this.world.querySelectorAll(
                ".haldo-planet"
            );

        planets.forEach(
            planet => {

                planet.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        const name =
                            planet.getAttribute(
                                "aria-label"
                            );

                        window.HalDo.Avatar?.react(
                            "point-right"
                        );

                        if (
                            typeof window.HalDo.emit ===
                            "function"
                        ) {

                            window.HalDo.emit(
                                "cosmic:planet-selected",
                                {
                                    planet:
                                        name
                                }
                            );
                        }
                    }
                );
            }
        );
    }
};


/* =========================================================
   START COSMIC WORLD
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            window.HalDo.Cosmic.init();

        },
        {
            once:
                true
        }
    );

}

else {

    window.HalDo.Cosmic.init();

}

</script>

<script>

"use strict";

/* =========================================================
   HALDO AI CORE BRIDGE
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.AIInterface =
{

    initialized:
        false,

    record:
        null,

    conversation:
        null,

    input:
        null,

    send:
        null,

    mic:
        null,

    status:
        null,

    busy:
        false,

    init(
        record
    )
    {

        if (
            this.initialized &&
            this.record === record
        ) {
            return;
        }

        this.record =
            record;

        if (
            !record ||
            !record.body
        ) {
            return;
        }

        this.conversation =
            record.body.querySelector(
                "#haldo-ai-conversation"
            );

        this.input =
            record.body.querySelector(
                "#haldo-ai-input"
            );

        this.send =
            record.body.querySelector(
                "#haldo-ai-send"
            );

        this.mic =
            record.body.querySelector(
                "#haldo-ai-mic"
            );

        this.status =
            record.body.querySelector(
                "#haldo-ai-status"
            );

        if (
            !this.conversation ||
            !this.input ||
            !this.send
        ) {
            return;
        }

        this.bind();

        this.initialized =
            true;

        this.setStatus(
            "Bereit"
        );
    },


    /* =====================================================
       BIND EVENTS
       ===================================================== */

    bind()
    {

        this.send.addEventListener(
            "click",
            () => {

                this.submit();

            }
        );

        this.input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    this.submit();
                }
            }
        );

        if (
            this.mic
        ) {

            this.mic.addEventListener(
                "click",
                () => {

                    this.toggleVoice();

                }
            );
        }

        const quickActions =
            this.record.body.querySelectorAll(
                "[data-ai-prompt]"
            );

        quickActions.forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const prompt =
                            button.dataset.aiPrompt;

                        if (
                            prompt
                        ) {

                            this.input.value =
                                prompt;

                            this.submit();
                        }
                    }
                );
            }
        );
    },


    /* =====================================================
       USER MESSAGE
       ===================================================== */

    submit()
    {

        if (
            this.busy
        ) {
            return;
        }

        const text =
            this.input.value.trim();

        if (
            !text
        ) {
            return;
        }

        this.input.value =
            "";

        this.addMessage(
            text,
            "user"
        );

        this.process(
            text
        );
    },


    /* =====================================================
       PROCESS
       ===================================================== */

    async process(
        text
    )
    {

        this.busy =
            true;

        this.setStatus(
            "Denke nach …"
        );

        window.HalDo.Avatar?.setState(
            "thinking"
        );

        this.showTyping();

        try {

            const command =
                this.detectCommand(
                    text
                );

            if (
                command
            ) {

                this.hideTyping();

                const result =
                    await this.executeCommand(
                        command
                    );

                this.addMessage(
                    result,
                    "ai"
                );

                window.HalDo.Avatar?.setState(
                    "happy"
                );

                this.setStatus(
                    "Bereit"
                );

                return;
            }


            const answer =
                await this.askCore(
                    text
                );

            this.hideTyping();

            this.addMessage(
                answer,
                "ai"
            );

            window.HalDo.Avatar?.setState(
                "speaking"
            );

            this.setStatus(
                "Bereit"
            );

        }

        catch (
            error
        ) {

            console.error(
                "[HalDo AI Interface]",
                error
            );

            this.hideTyping();

            this.addMessage(
                "Entschuldigung, dabei ist ein Fehler aufgetreten.",
                "ai"
            );

            window.HalDo.Avatar?.setState(
                "idle"
            );

            this.setStatus(
                "Bereit"
            );
        }

        finally {

            this.busy =
                false;
        }
    },


    /* =====================================================
       AI CORE
       ===================================================== */

    async askCore(
        text
    )
    {

        const candidates = [

            window.HalDo?.AI?.chat,

            window.HalDo?.AI?.ask,

            window.HalDo?.AICore?.chat,

            window.HalDo?.AICore?.ask,

            window.HalDo?.AIEngine?.chat,

            window.HalDo?.AIEngine?.generate

        ];

        for (
            const candidate of candidates
        ) {

            if (
                typeof candidate !==
                "function"
            ) {
                continue;
            }

            try {

                const response =
                    await candidate.call(
                        window.HalDo.AI ||
                        window.HalDo.AICore ||
                        window.HalDo.AIEngine,
                        text
                    );

                const answer =
                    this.normalizeResponse(
                        response
                    );

                if (
                    answer
                ) {
                    return answer;
                }

            }

            catch (
                error
            ) {

                console.warn(
                    "[HalDo AI] Core candidate failed",
                    error
                );
            }
        }


        return this.localIntelligence(
            text
        );
    },


    /* =====================================================
       RESPONSE NORMALIZATION
       ===================================================== */

    normalizeResponse(
        response
    )
    {

        if (
            typeof response ===
            "string"
        ) {

            return response;
        }

        if (
            !response
        ) {
            return "";
        }

        return (
            response.text ||
            response.answer ||
            response.response ||
            response.message ||
            response.content ||
            ""
        );
    },


    /* =====================================================
       LOCAL INTELLIGENCE FALLBACK
       ===================================================== */

    localIntelligence(
        text
    )
    {

        const value =
            text.toLowerCase();

        if (
            /hallo|hi|hey|guten morgen|guten abend/
                .test(
                    value
                )
        ) {

            return "Hallo. Ich bin HalDo AI. Schön, dass du da bist. Was möchtest du gemeinsam mit mir machen?";
        }

        if (
            /wer bist du|was bist du/
                .test(
                    value
                )
        ) {

            return "Ich bin HalDo AI – die zentrale intelligente Assistenz deines HalDo AI OS. Ich kann dich beim Arbeiten, Schreiben, Organisieren, Suchen und Bedienen des Systems unterstützen.";
        }

        if (
            /danke|thanks/
                .test(
                    value
                )
        ) {

            return "Sehr gerne. Ich bin jederzeit für dich da.";
        }

        if (
            /hilfe|help/
                .test(
                    value
                )
        ) {

            return "Natürlich. Du kannst mich etwas fragen, Texte schreiben lassen, Apps öffnen lassen oder mit mir über Aufgaben und Ideen sprechen.";
        }

        return "Ich habe deine Nachricht verstanden. Der zentrale HalDo-AI-Core kann diese Unterhaltung übernehmen, sobald seine entsprechende Schnittstelle verfügbar ist.";
    },


    /* =====================================================
       COMMAND DETECTION
       ===================================================== */

    detectCommand(
        text
    )
    {

        const value =
            text
                .toLowerCase()
                .trim();

        const patterns = [

            {
                regex:
                    /öffne (?:die )?einstellungen|open settings/,

                command:
                    "settings"
            },

            {
                regex:
                    /öffne (?:meine )?dateien|öffne den dateimanager|open files/,

                command:
                    "files"
            },

            {
                regex:
                    /öffne chat|öffne haldo ai|open chat/,

                command:
                    "chat"
            },

            {
                regex:
                    /öffne apps|app.?menü|zeige apps/,

                command:
                    "apps"
            }
        ];

        return (
            patterns.find(
                item =>
                    item.regex.test(
                        value
                    )
            )?.command ||
            null
        );
    },


    /* =====================================================
       COMMAND EXECUTION
       ===================================================== */

    async executeCommand(
        command
    )
    {

        switch (
            command
        ) {

            case "settings":

                return this.openApp(
                    "settings",
                    "Einstellungen"
                );

            case "files":

                return this.openApp(
                    "file-manager",
                    "Dateien"
                );

            case "apps":

                return this.openApp(
                    "app-menu",
                    "Apps"
                );

            case "chat":

                return "Du bist bereits im HalDo-AI-Fenster.";

            default:

                return "Der Befehl wurde erkannt.";
        }
    },


    /* =====================================================
       UNIVERSAL APP OPENER
       ===================================================== */

    openApp(
        id,
        title
    )
    {

        try {

            if (
                window.HalDo?.AppManager &&
                typeof window.HalDo.AppManager.open ===
                "function"
            ) {

                window.HalDo.AppManager.open(
                    id
                );

                return (
                    title +
                    " wird geöffnet."
                );
            }

            if (
                typeof window.HalDo?.openApp ===
                "function"
            ) {

                window.HalDo.openApp(
                    id
                );

                return (
                    title +
                    " wird geöffnet."
                );
            }

            if (
                typeof window.HalDo?.openWindow ===
                "function"
            ) {

                window.HalDo.openWindow(
                {
                    id:
                        "app-" +
                        id,

                    title:
                        title,

                    content:
                        `
                        <div class="haldo-app-content">

                            <h1 class="haldo-app-heading">
                                ${title}
                            </h1>

                            <p class="haldo-app-description">
                                HalDo AI bereitet die Anwendung vor.
                            </p>

                        </div>
                        `
                });

                return (
                    title +
                    " wird geöffnet."
                );
            }

        }

        catch (
            error
        ) {

            console.error(
                "[HalDo App Open]",
                error
            );
        }

        return (
            title +
            " ist im aktuellen App-System noch nicht erreichbar."
        );
    },


    /* =====================================================
       MESSAGE
       ===================================================== */

    addMessage(
        text,
        type
    )
    {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "haldo-ai-row " +
            type;

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "haldo-ai-message";

        message.textContent =
            String(
                text
            );

        row.appendChild(
            message
        );

        this.conversation.appendChild(
            row
        );

        this.conversation.scrollTop =
            this.conversation.scrollHeight;
    },


    /* =====================================================
       TYPING
       ===================================================== */

    showTyping()
    {

        if (
            this.record.body.querySelector(
                ".haldo-ai-typing-row"
            )
        ) {
            return;
        }

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "haldo-ai-row ai haldo-ai-typing-row";

        row.innerHTML = `

            <div
                class="haldo-ai-message"
            >

                <span
                    class="haldo-ai-typing"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </span>

            </div>
        `;

        this.conversation.appendChild(
            row
        );

        this.conversation.scrollTop =
            this.conversation.scrollHeight;
    },


    hideTyping()
    {

        this.record.body
            .querySelector(
                ".haldo-ai-typing-row"
            )
            ?.remove();
    },


    /* =====================================================
       STATUS
       ===================================================== */

    setStatus(
        value
    )
    {

        if (
            this.status
        ) {

            this.status.textContent =
                value;
        }
    },


    /* =====================================================
       VOICE
       ===================================================== */

    toggleVoice()
    {

        if (
            window.HalDo?.Voice &&
            typeof window.HalDo.Voice.toggle ===
            "function"
        ) {

            window.HalDo.Voice.toggle();

            return;
        }

        if (
            window.HalDo?.Speech &&
            typeof window.HalDo.Speech.start ===
            "function"
        ) {

            window.HalDo.Speech.start();

            return;
        }

        if (
            "webkitSpeechRecognition" in
            window ||
            "SpeechRecognition" in
            window
        ) {

            this.startBrowserRecognition();

            return;
        }

        this.addMessage(
            "Die Sprachfunktion ist auf diesem Gerät momentan nicht verfügbar.",
            "ai"
        );
    },


    /* =====================================================
       BROWSER SPEECH RECOGNITION
       ===================================================== */

    startBrowserRecognition()
    {

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (
            !Recognition
        ) {
            return;
        }

        const recognition =
            new Recognition();

        recognition.lang =
            document.documentElement.lang ||
            "de-DE";

        recognition.interimResults =
            false;

        recognition.continuous =
            false;

        this.setStatus(
            "Ich höre zu …"
        );

        window.HalDo.Avatar?.setState(
            "listening"
        );

        recognition.onresult =
            event => {

                const transcript =
                    event.results?.[0]?.[0]?.transcript ||
                    "";

                if (
                    transcript
                ) {

                    this.input.value =
                        transcript;

                    this.submit();
                }
            };

        recognition.onerror =
            () => {

                this.setStatus(
                    "Bereit"
                );

                window.HalDo.Avatar?.setState(
                    "idle"
                );
            };

        recognition.onend =
            () => {

                if (
                    !this.busy
                ) {

                    this.setStatus(
                        "Bereit"
                    );
                }
            };

        recognition.start();
    }
};

<script>

"use strict";

/* =========================================================
   COSMIC WORLD ENGINE
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.CosmicWorld =
{

    initialized:
        false,

    root:
        null,

    sun:
        null,

    rays:
        null,

    planets:
        [],

    timers:
        [],


    init()
    {

        if (
            this.initialized
        ) {
            return;
        }

        this.root =
            document.querySelector(
                ".haldo-cosmic-world"
            );

        if (
            !this.root
        ) {
            return;
        }

        this.sun =
            this.root.querySelector(
                ".haldo-sun"
            );

        this.rays =
            this.root.querySelector(
                ".haldo-sun-rays"
            );

        this.createSunRays();

        this.createPlanets();

        this.bindSun();

        this.initialized =
            true;
    },


    /* =====================================================
       CREATE 365 RAYS
       ===================================================== */

    createSunRays()
    {

        if (
            !this.rays
        ) {
            return;
        }

        if (
            this.rays.children.length >=
            365
        ) {
            return;
        }

        const fragment =
            document.createDocumentFragment();

        for (
            let i = 0;
            i < 365;
            i++
        ) {

            const ray =
                document.createElement(
                    "span"
                );

            ray.className =
                "haldo-sun-ray";

            ray.style.transform =
                `
                translateX(-50%)
                rotate(${i}deg)
                `;
            
            ray.style.opacity =
                String(
                    .22 +
                    (
                        i %
                        7
                    ) *
                    .055
                );

            fragment.appendChild(
                ray
            );
        }

        this.rays.appendChild(
            fragment
        );
    },


    /* =====================================================
       PLANET CONFIGURATION
       ===================================================== */

    createPlanets()
    {

        const system =
            this.root.querySelector(
                ".haldo-orbit-system"
            );

        if (
            !system
        ) {
            return;
        }

        const definitions = [

            {
                name:
                    "Mercury",

                className:
                    "mercury",

                radius:
                    "12%",

                size:
                    "10px",

                time:
                    "7s",

                direction:
                    "normal",

                tilt:
                    "-7deg"
            },

            {
                name:
                    "Venus",

                className:
                    "venus",

                radius:
                    "17%",

                size:
                    "14px",

                time:
                    "11s",

                direction:
                    "reverse",

                tilt:

                    `;

                        document.createElement(

                        );

                    moon.className =
                        "haldo-moon";

                    moonOrbit.appendChild(
                        moon
                    );

                    planet.appendChild(
                        moonOrbit
                    );
                }


                orbit.appendChild(
                    planet
                );

                system.appendChild(
                    orbit
                );

                this.planets.push(
                    {
                        orbit,
                        planet,
                        name:
                            definition.name
                    }
                );

    /* =====================================================
       SUN INTERACTION
       ===================================================== */

    bindSun()
    {

        if (
            !this.sun
        ) {
            return;
        }

        this.sun.addEventListener(
            "click",
            event => {

                event.preventDefault();

                this.activateAI();
            }
        );

        this.sun.addEventListener(
            "pointerdown",
            () => {

                this.sun.classList.add(
                    "is-pressed"
                );
            }
        );

        this.sun.addEventListener(
            "pointerup",
            () => {

                this.sun.classList.remove(
                    "is-pressed"
                );
            }
        );
    },


    /* =====================================================
       OPEN HALDO AI
       ===================================================== */

    activateAI()
    {

        const avatar =
            this.root.querySelector(
                ".haldo-living-avatar"
            );

        avatar?.classList.add(
            "visible"
        );


        if (
            window.HalDo?.Avatar &&
            typeof window.HalDo.Avatar.react ===
            "function"
        ) {

            window.HalDo.Avatar.react(
                "greeting"
            );
        }


        if (
            typeof window.HalDo?.openProfessionalAI ===
            "function"
        ) {

            window.HalDo.openProfessionalAI();

            return;
        }


        if (
            typeof window.HalDo?.say ===
            "function"
        ) {

            window.HalDo.say(
                "Hallo, ich bin HalDo AI."
            );
        }
    }
};

/* =========================================================
   AUTO INITIALIZATION
   ========================================================= */

function haldoInitializeCosmicWorld()
{

    const targets =
        document.querySelectorAll(
            "[data-haldo-cosmic-world]"
        );

    targets.forEach(
        target => {

            if (
                target.dataset.haldoCosmicReady ===
                "true"
            ) {
                return;
            }

            target.dataset.haldoCosmicReady =
                "true";

            window.HalDo.buildCosmicWorld(
                target
            );
        }
    );
}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoInitializeCosmicWorld,
        {
            once:
                true
        }
    );

}

else {

    haldoInitializeCosmicWorld();

}
