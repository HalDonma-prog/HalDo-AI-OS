<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HalDo AI OS 24 — Ultimate</title>
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="data:application/json,{}" />
    <style>
        /* ================================================================
           HALDO AI OS 24 — ULTIMATE EDITION
           KOMPLETT IN EINER DATEI — PROFESSIONELL, LEBENDIG, 4K COSMIC
           ALLE 84 APPS MIT VOLLSTÄNDIGEN FUNKTIONEN
           HALDO AI WIE EIN PROFESSOR/DOCTOR/ANWALT
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a1a;
            --surface: rgba(16, 16, 40, 0.92);
            --text: #e0e0ff;
            --primary: #00d4ff;
            --secondary: #7b2ffc;
            --radius: 14px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== BOOT ===== */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.5s ease;
            padding: 20px;
        }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo img {
            width: clamp(120px, 25vw, 180px);
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 80px rgba(123, 47, 252, 0.6));
            }
        }
        #boot-status {
            margin-top: 16px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COSMIC CANVAS ===== */
        #cosmic {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ===== DISPLAY ===== */
        #display {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* ===== LEBENDIGER HALDO AI AVATAR ===== */
        #ai-avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        #ai-avatar-container:active {
            transform: scale(0.97);
        }
        #ai-avatar {
            width: clamp(80px, 15vw, 120px);
            height: clamp(80px, 15vw, 120px);
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
            overflow: hidden;
            position: relative;
            transition: 0.3s;
        }
        #ai-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes breathe {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }
        #ai-avatar .status-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid transparent;
            animation: ringPulse 2s infinite;
        }
        @keyframes ringPulse {
            0% {
                border-color: rgba(0, 212, 255, 0.1);
                transform: scale(1);
            }
            50% {
                border-color: rgba(0, 212, 255, 0.5);
                transform: scale(1.05);
            }
            100% {
                border-color: rgba(0, 212, 255, 0.1);
                transform: scale(1);
            }
        }
        #ai-avatar .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--bg);
            background: #44ff88;
            transition: 0.3s;
        }
        #ai-avatar .status-dot.listening {
            background: #44aaff;
            animation: pulse 0.6s infinite;
        }
        #ai-avatar .status-dot.thinking {
            background: #ffcc00;
            animation: pulse 0.4s infinite;
        }
        #ai-avatar .status-dot.speaking {
            background: #ff6644;
            animation: pulse 0.3s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.4);
                opacity: 0.6;
            }
        }
        #ai-name {
            font-size: clamp(0.8rem, 1.6vw, 1rem);
            font-weight: 600;
            color: var(--primary);
            margin-top: 6px;
        }
        #ai-status-text {
            font-size: clamp(0.6rem, 1.2vw, 0.75rem);
            color: #8899bb;
        }

        /* ===== TOPBAR ===== */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            min-height: 40px;
            flex-shrink: 0;
        }
        #topbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #topbar-left .haldo-icon {
            font-weight: 700;
            color: var(--primary);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #topbar-left .haldo-icon img {
            width: clamp(28px, 5vw, 36px);
            height: clamp(28px, 5vw, 36px);
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }
        #topbar-right {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            touch-action: manipulation;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== APP CONTAINER ===== */
        #app-container {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow: hidden;
            touch-action: none;
        }

        /* ===== WINDOW ===== */
        .window {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 200px;
            min-height: 150px;
            max-width: 98vw;
            max-height: 90vh;
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.15);
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            cursor: grab;
            flex-shrink: 0;
            min-height: 36px;
            touch-action: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .win-btn {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            padding: 2px 8px;
            border-radius: 6px;
            touch-action: manipulation;
            min-width: 28px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .win-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        .win-btn.close:active {
            background: #ff4444;
            color: #fff;
        }
        .window-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }
        .window-body input,
        .window-body textarea,
        .window-body select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            margin-bottom: 8px;
            -webkit-appearance: none;
            appearance: none;
        }
        .window-body button {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            cursor: pointer;
            touch-action: manipulation;
            min-height: 38px;
        }
        .window-body button:active {
            transform: scale(0.95);
        }
        .window-body .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 6px;
        }
        .window-body .app-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .window-body .app-item:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }
        .window-body .app-item .icon {
            font-size: 1.8rem;
        }
        .window-body .app-item .name {
            font-size: 0.6rem;
            margin-top: 4px;
            color: #8899bb;
        }

        /* ===== DOCK ===== */
        #dock {
            position: absolute;
            bottom: clamp(8px, 2vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: clamp(4px, 1vw, 8px);
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: nowrap;
            max-width: 98vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .dock-item {
            width: clamp(40px, 9vw, 48px);
            height: clamp(40px, 9vw, 48px);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3.5vw, 1.4rem);
            cursor: pointer;
            border: none;
            color: #fff;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .dock-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        /* ===== NOTIFICATION ===== */
        #notification {
            position: fixed;
            top: clamp(50px, 10vh, 70px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 12px 24px;
            max-width: 90%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            display: none;
            border-left: 4px solid var(--primary);
        }
        #notification.show {
            display: block;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ===== ZWEI MENÜS ===== */
        #menu-left {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 6px;
            border-radius: 0 14px 14px 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-left: none;
        }
        #menu-right {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 6px;
            border-radius: 14px 0 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-right: none;
        }
        .menu-item {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            transition: 0.2s;
            border: none;
            color: #fff;
            flex-direction: column;
            gap: 1px;
        }
        .menu-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }
        .menu-item .label {
            font-size: 0.45rem;
            color: #8899bb;
        }
        .menu-item img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        /* ===== SCROLLBAR ===== */
        .window-body::-webkit-scrollbar {
            width: 4px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:480px) {
            .window {
                border-radius: 12px;
                min-width: 160px;
                min-height: 120px;
            }
            .window-header {
                padding: 6px 10px;
                min-height: 32px;
            }
            .window-body {
                padding: 10px;
            }
            #topbar {
                padding: 4px 10px;
                min-height: 34px;
            }
            .win-btn {
                min-width: 24px;
                min-height: 24px;
                padding: 2px 6px;
            }
            .dock-item {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            #dock {
                padding: 6px 10px;
                gap: 4px;
            }
            .menu-item {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
            #menu-left,
            #menu-right {
                padding: 6px 4px;
                gap: 4px;
            }
            #ai-avatar {
                width: 60px;
                height: 60px;
            }
        }
        @media(orientation:landscape) and (max-height:500px) {
            .window {
                max-height: 80vh;
            }
            #dock {
                bottom: 4px;
                padding: 4px 10px;
                gap: 4px;
            }
            .dock-item {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
                border-radius: 10px;
            }
            #topbar {
                min-height: 28px;
                padding: 2px 10px;
            }
            .window-header {
                min-height: 28px;
                padding: 4px 10px;
            }
            .window-body {
                padding: 8px;
            }
            .menu-item {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            #menu-left,
            #menu-right {
                padding: 4px 3px;
                gap: 3px;
            }
            #ai-avatar {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- BOOT -->
        <div id="boot">
            <div id="boot-logo">
                <img src="assets/logo.png" alt="HalDo Logo" onerror="this.parentElement.textContent='⟡ HalDo';this.parentElement.style.fontSize='clamp(3rem,12vw,5rem)';this.parentElement.style.fontWeight='900';this.parentElement.style.background='linear-gradient(135deg,#00d4ff,#7b2ffc)';this.parentElement.style.webkitBackgroundClip='text';this.parentElement.style.webkitTextFillColor='transparent';" />
            </div>
            <div class="boot-spinner"></div>
            <div id="boot-status">⟡ System wird initialisiert ...</div>
        </div>

        <!-- COSMIC CANVAS -->
        <canvas id="cosmic"></canvas>

        <!-- DISPLAY -->
        <div id="display">
            <div id="topbar">
                <div id="topbar-left">
                    <span class="haldo-icon" id="menu-system">
                        <img src="assets/logo.png" alt="HalDo" onerror="this.style.display='none';" />
                        <span>HalDo</span>
                    </span>
                    <span id="clock-display">--:--</span>
                </div>
                <div id="topbar-right">
                    <button class="top-btn" id="btn-ai">AI</button>
                    <button class="top-btn" id="btn-settings">⚙️</button>
                    <button class="top-btn" id="btn-about">ℹ️</button>
                    <button class="top-btn" id="btn-menu">📱</button>
                </div>
            </div>

            <!-- LEBENDIGER HALDO AI AVATAR -->
            <div id="ai-avatar-container" onclick="launchApp('ai')">
                <div id="ai-avatar">
                    <img src="assets/logo.png" alt="HalDo" onerror="this.style.display='none';this.parentElement.textContent='⟡';this.parentElement.style.display='flex';this.parentElement.style.alignItems='center';this.parentElement.style.justifyContent='center';this.parentElement.style.fontSize='2.5rem';" />
                    <div class="status-ring"></div>
                    <div class="status-dot" id="ai-status-dot"></div>
                </div>
                <div id="ai-name">HalDo AI</div>
                <div id="ai-status-text">● bereit · klicke zum Sprechen</div>
            </div>

            <div id="app-container"></div>

            <div id="dock">
                <button class="dock-item" data-app="ai">🧠</button>
                <button class="dock-item" data-app="settings">⚙️</button>
                <button class="dock-item" data-app="files">📁</button>
                <button class="dock-item" data-app="notes">📝</button>
                <button class="dock-item" data-app="cosmic">🌌</button>
                <button class="dock-item" data-app="calendar">📅</button>
                <button class="dock-item" data-app="music">🎵</button>
                <button class="dock-item" data-app="terminal">⌨️</button>
                <button class="dock-item" data-app="appworld">📱</button>
            </div>
        </div>
    </div>
    <div id="notification"></div>

    <!-- ZWEI MENÜS -->
    <div id="menu-left">
        <div class="menu-item" id="menu-apps"><span>📱</span><span class="label">Apps</span></div>
        <div class="menu-item" id="menu-ai"><img src="assets/logo.png" alt="HalDo" onerror="this.textContent='🧠';" /><span class="label">AI</span></div>
        <div class="menu-item" id="menu-mail"><span>✉️</span><span class="label">Mail</span></div>
        <div class="menu-item" id="menu-chat"><span>💬</span><span class="label">Chat</span></div>
        <div class="menu-item" id="menu-contacts"><span>👤</span><span class="label">Kontakte</span></div>
    </div>
    <div id="menu-right">
        <div class="menu-item" id="menu-system"><span>⚙️</span><span class="label">System</span></div>
        <div class="menu-item" id="menu-files"><span>📁</span><span class="label">Dateien</span></div>
        <div class="menu-item" id="menu-settings"><span>⚙️</span><span class="label">Settings</span></div>
        <div class="menu-item" id="menu-update"><span>🔄</span><span class="label">Update</span></div>
        <div class="menu-item" id="menu-help"><span>❓</span><span class="label">Hilfe</span></div>
    </div>

    <script>
        // ================================================================
        //  HALDO AI OS 24 — ULTIMATE EDITION
        //  KOMPLETT IN EINER DATEI — PROFESSIONELL, LEBENDIG, 4K COSMIC
        //  ALLE 84 APPS MIT VOLLSTÄNDIGEN FUNKTIONEN
        //  HALDO AI WIE EIN PROFESSOR/DOCTOR/ANWALT
        //  Version 24.0.0 — Build 2025.08.31
        // ================================================================

        // Safari/iPhone Cache umgehen
        document.addEventListener('DOMContentLoaded', function() {
            // Boot direkt starten
            initSystem();
        });

        function initSystem() {
            'use strict';

            // ============================================================
            //  KONFIGURATION
            // ============================================================
            var CONFIG = {

                knowledge: {
                    // === RECHT & JURA ===
                    'recht': 'Das Recht ist die Grundlage unserer Gesellschaft. Es regelt das Zusammenleben der Menschen und schützt die Rechte jedes Einzelnen. Das deutsche Rechtssystem basiert auf dem Grundgesetz, das die Menschenwürde und die Grundrechte schützt. Es gibt verschiedene Rechtsgebiete: Zivilrecht (Verträge, Schadensersatz), Strafrecht (Straftaten und Strafen), Arbeitsrecht (Arbeitnehmer- und Arbeitgeberrechte), Sozialrecht (Sozialleistungen), Verwaltungsrecht (Behördenhandeln) und vieles mehr. Als juristischer Assistent kann ich dir helfen, Rechtsdokumente zu verstehen, zu analysieren und zu erstellen – aber ich bin kein Ersatz für einen Rechtsanwalt. Bei wichtigen rechtlichen Fragen solltest du immer professionelle juristische Beratung einholen.',
                    'vertrag': 'Ein Vertrag ist eine rechtlich bindende Vereinbarung zwischen zwei oder mehreren Parteien. Er kommt durch Angebot und Annahme zustande. Ein wirksamer Vertrag erfordert: Geschäftsfähigkeit der Parteien, Willenserklärung (Angebot und Annahme), bestimmter oder bestimmbarer Inhalt, und Einhaltung von Formvorschriften (bei bestimmten Verträgen schriftlich erforderlich). Verträge können mündlich, schriftlich oder konkludent (durch schlüssiges Verhalten) geschlossen werden. Zu den häufigsten Vertragsarten gehören: Kaufvertrag, Dienstvertrag, Arbeitsvertrag, Mietvertrag, Darlehensvertrag und Gesellschaftsvertrag. Bei Vertragsstreitigkeiten können Gerichte angerufen werden.',
                    'urteil': 'Ein Urteil ist die Entscheidung eines Gerichts in einem Rechtsstreit. Es wird von Richtern gefällt und ist rechtlich bindend. Urteile können in Zivilsachen (z.B. Schadensersatz), Strafsachen (z.B. Strafen) oder Verwaltungssachen ergehen. Ein Urteil besteht aus: Tatbestand (Sachverhalt), Entscheidungsgründen (rechtliche Begründung) und dem Tenor (der eigentlichen Entscheidung). Urteile werden von den Gerichten veröffentlicht und dienen als Präzedenzfälle für ähnliche Fälle. Das deutsche Rechtssystem kennt mehrere Instanzen: Amtsgericht, Landgericht, Oberlandesgericht, Bundesgerichtshof.',
                    'klage': 'Eine Klage ist die Einleitung eines gerichtlichen Verfahrens durch einen Kläger gegen einen Beklagten. Sie wird durch Einreichung einer Klageschrift bei Gericht erhoben. Die Klageschrift muss den Kläger, den Beklagten, den Streitgegenstand und einen bestimmten Antrag enthalten. Nach Zustellung der Klage an den Beklagten hat dieser die Möglichkeit, darauf zu reagieren – entweder durch Anerkennung, Erwiderung oder Einlassung. Das Gericht prüft dann die Zulässigkeit der Klage und führt ein Verfahren durch. Ziel einer Klage ist die Durchsetzung von Rechten oder die Klärung von Rechtsfragen.',

                    // === MEDIZIN & GESUNDHEIT ===
                    'medizin': 'Die Medizin ist die Wissenschaft der Heilung und der Erhaltung der Gesundheit. Sie umfasst die Diagnostik, Therapie und Prävention von Krankheiten. Die moderne Medizin basiert auf wissenschaftlichen Erkenntnissen und klinischen Studien. Es gibt viele Fachbereiche: Allgemeinmedizin, Innere Medizin, Chirurgie, Pädiatrie, Gynäkologie, Neurologie, Psychiatrie, Radiologie und viele mehr. Die medizinische Ethik verlangt, dass Ärzte und medizinisches Personal nach den Prinzipien der Fürsorge, des Nichtschadens und der Patientenautonomie handeln. Bei gesundheitlichen Problemen solltest du immer einen Arzt konsultieren – ich kann dir nur allgemeine Informationen geben, keine Diagnosen stellen.',
                    'untersuchung': 'Eine ärztliche Untersuchung ist die systematische Überprüfung des Gesundheitszustands eines Patienten. Sie umfasst die Anamnese (Befragung des Patienten), die körperliche Untersuchung (Inspektion, Palpation, Auskultation), und gegebenenfalls apparative Diagnostik (Blutuntersuchungen, Röntgen, Ultraschall, MRT, CT). Das Ziel einer Untersuchung ist die Feststellung von Krankheiten oder Gesundheitsrisiken, die Beratung des Patienten und die Einleitung von Therapien. Die ärztliche Untersuchung unterliegt strengen ethischen und rechtlichen Vorschriften – sie erfordert die Einwilligung des Patienten und dient dessen Wohl.',
                    'befund': 'Ein Befund ist das Ergebnis einer medizinischen Untersuchung. Er dokumentiert die erhobenen Befunde und die daraus gezogenen Schlussfolgerungen. Ein Befund kann objektiv sein (z.B. Blutdruck, Laborwerte) oder subjektiv (z.B. Schmerzangaben des Patienten). Der Befund wird vom Arzt oder medizinischen Fachpersonal in der Patientenakte dokumentiert. Er dient als Grundlage für die Diagnose, Therapieentscheidung und Verlaufsbeobachtung. Befunde müssen sorgfältig, vollständig und nachvollziehbar dokumentiert werden.',
                    'gutachten': 'Ein medizinisches Gutachten ist eine wissenschaftlich fundierte Beurteilung eines medizinischen Sachverhalts. Es wird von einem Sachverständigen (z.B. einem Arzt oder Mediziner) erstellt und dient oft als Entscheidungsgrundlage für Gerichte, Versicherungen oder Behörden. Ein Gutachten enthält: den Untersuchungsbefund, die Diagnose, die Prognose, die Bewertung der Arbeitsfähigkeit oder des Behinderungsgrades und eine abschließende Beurteilung. Medizinische Gutachten müssen objektiv, nachvollziehbar und wissenschaftlich fundiert sein.',

                    // === BRIEFE & DOKUMENTE ===
                    'brief': 'Ein Brief ist eine schriftliche Nachricht, die an eine bestimmte Person oder Institution gerichtet ist. Er ist eines der ältesten Kommunikationsmittel der Menschheit. Ein guter Brief hat: eine Anrede (z.B. "Sehr geehrte Damen und Herren"), einen Einleitungssatz, einen Hauptteil (das Anliegen oder die Information), einen Schluss (Zusammenfassung oder Bitte) und eine Grußformel (z.B. "Mit freundlichen Grüßen"). Briefe können formell (z.B. Geschäftsbriefe, Behördenschreiben) oder informell (z.B. persönliche Briefe, Einladungen) sein. Ich kann dir bei der Erstellung von Briefen aller Art helfen – von Bewerbungen über Beschwerden bis hin zu juristischen Schreiben.',
                    'bewerbung': 'Eine Bewerbung ist das schriftliche Angebot an einen potenziellen Arbeitgeber, sich für eine Stelle zu bewerben. Sie besteht aus: einem Anschreiben (Motivation, persönliche Stärken, Bezug zur Stelle), einem Lebenslauf (chronologischer Überblick über Ausbildung, Berufserfahrung, Kenntnisse), sowie Zeugnissen und Zertifikaten. Eine gute Bewerbung ist klar strukturiert, fehlerfrei und auf die jeweilige Stelle zugeschnitten. Sie sollte deine Persönlichkeit, deine Qualifikationen und deine Begeisterung für die Position zeigen.',
                    'klageschrift': 'Eine Klageschrift ist ein juristisches Dokument, das vor Gericht eingereicht wird, um ein rechtliches Verfahren einzuleiten. Sie muss enthalten: die Parteien (Kläger und Beklagter), den Streitgegenstand (worüber wird gestritten), einen bestimmten Antrag (was fordert der Kläger), eine Begründung (warum ist die Klage berechtigt), und Beweismittel (Urkunden, Zeugen, etc.). Die Klageschrift muss den Anforderungen der Zivilprozessordnung entsprechen und wird vom Gericht auf Zulässigkeit geprüft.',
                    'ärztliches gutachten': 'Ein ärztliches Gutachten ist ein medizinisches Dokument, das von einem Arzt oder medizinischen Sachverständigen erstellt wird. Es dient der Beurteilung eines medizinischen Sachverhalts für Dritte – z.B. für Gerichte, Versicherungen oder Behörden. Ein ärztliches Gutachten enthält: Patientenangaben, Untersuchungsbefunde, Diagnose, Prognose, Beurteilung der Arbeitsfähigkeit oder des Behinderungsgrades, und eine abschließende Bewertung. Ärztliche Gutachten müssen objektiv, vollständig und nachvollziehbar sein.',

                    // === WISSENSCHAFT ===
                    'quantenmechanik': 'Die Quantenmechanik ist eines der faszinierendsten und seltsamsten Gebiete der Physik. Sie beschreibt die Welt der kleinsten Teilchen – Atome, Elektronen, Photonen. In dieser Welt gelten andere Regeln als in unserer makroskopischen Welt. Teilchen können sich an mehreren Orten gleichzeitig befinden (Superposition), sie sind Welle und Teilchen zugleich (Welle-Teilchen-Dualismus), und sie können miteinander verschränkt sein (Quantenverschränkung). Die Heisenbergsche Unschärferelation besagt, dass man nicht gleichzeitig den Ort und den Impuls eines Teilchens exakt kennen kann. Die Quantenmechanik ist die Grundlage für moderne Technologien wie Laser, Transistoren, MRI und Quantencomputer.',
                    'relativitätstheorie': 'Einsteins Relativitätstheorie ist eine der genialsten und revolutionärsten Ideen der Physik. Sie besteht aus zwei Teilen: der speziellen Relativitätstheorie (1905) und der allgemeinen Relativitätstheorie (1915). Die spezielle Relativität besagt, dass die Lichtgeschwindigkeit für alle Beobachter gleich ist – unabhängig von ihrer Bewegung. Daraus folgen Phänomene wie die Zeitdilatation (bewegte Uhren gehen langsamer) und die Längenkontraktion. Die allgemeine Relativität beschreibt die Schwerkraft als Krümmung der Raumzeit. Massive Objekte wie Sterne und Planeten krümmen die Raumzeit, und diese Krümmung führt zur Anziehungskraft, die wir als Schwerkraft kennen.',
                    'philosophie': 'Die Philosophie ist die Liebe zur Weisheit. Sie ist eine der ältesten Disziplinen der Menschheit und fragt nach den grundlegenden Fragen des Lebens: Was ist der Sinn des Lebens? Was ist Wahrheit? Was ist gut und böse? Was können wir wissen? Die Philosophie hat viele Denker hervorgebracht: Sokrates ("Ich weiß, dass ich nichts weiß"), Platon (Ideenlehre), Aristoteles (Logik und Ethik), Immanuel Kant (kategorischer Imperativ), Friedrich Nietzsche (Übermensch) und viele andere. Die Philosophie hilft uns, unser Leben und die Welt zu verstehen und gibt Orientierung in ethischen Fragen.',

                    'default': 'Das ist ein wirklich faszinierendes Thema! Ich habe ein tiefes Verständnis für viele Bereiche: Wissenschaft, Geschichte, Philosophie, Kultur, Technik, Kunst, Gesundheit, Recht und Medizin. Ich bin wie ein Professor, der sich Zeit für seine Studenten nimmt. Erzähl mir mehr über deine Frage – ich helfe dir gerne weiter.'

                loadVoices: function() {

                setVoiceByLang: function(lang) {
                    var self = this;
                    var voices = this.synthesis.getVoices();
                    if (voices.length === 0) { return; }
                    var found = null;
                    for (var i = 0; i < voices.length; i++) {
                        if (voices[i].lang === lang) {
                            found = voices[i];
                            break;
                        }
                    }
                    if (!found && voices.length > 0) {
                        found = voices[0];
                    }
                    if (found) {
                        self.currentVoice = found;
                        console.log('[Voice] Stimme gewählt:', found.name, found.lang);
                    }
                },

                startListening: function() {
                    if (!this.recognition) {

                        return;
                    }
                    if (this.isListening) {
                        this.recognition.stop();
                        return;

                    try {

                        this.isListening = true;
                        this.updateAIStatus('listening', '🎤 hört zu ...');

                    } catch (e) {
                        console.log('[Voice] Fehler:', e);
                        notify('❌ Mikrofon konnte nicht gestartet werden', 'error');

                onResult: function(event) {

                            if (state.apps[cmd.app]) {
                                launchApp(cmd.app);
                                notify('✅ ' + state.apps[cmd.app].title + ' geöffnet!', 'success');
                                this.updateAIStatus('idle', '● bereit');
                                this.speak('✅ ' + state.apps[cmd.app].title + ' wurde geöffnet!');
                                return;
                            }
                        }
                        if (cmd.command === 'write') {
                            this.speak('✍️ Ich schreibe dir einen Text. Moment bitte...');
                            setTimeout(function() {
                                var response = aiEngine.getSmartFallback('Schreib mir einen Text');
                                notify('✍️ ' + response, 'success');
                                voice.speak('Hier ist dein Text: ' + response.substring(0, 100) + '...');
                            }, 500);
                            return;
                        }
                    }

                    var input = document.getElementById('ai-input');
                    if (input) {
                        input.value = text;
                        var sendBtn = document.getElementById('ai-send');
                        if (sendBtn) sendBtn.click();
                    }
                },

                onError: function(event) {
                    console.log('[Voice] Fehler:', event.error);
                    this.isListening = false;
                    this.updateAIStatus('idle', '● bereit');
                    if (event.error === 'not-allowed') {
                        notify('❌ Mikrofon-Zugriff verweigert.', 'error');
                    }
                },

                onEnd: function() {
                    this.isListening = false;
                    this.updateAIStatus('idle', '● bereit');
                },

                speak: function(text, language, gender) {
                    language = language || 'de-DE';
                    gender = gender || 'male';
                    if (!('speechSynthesis' in window)) return;
                    if (this.isSpeaking) this.synthesis.cancel();
                    this.isSpeaking = true;
                    this.updateAIStatus('speaking', '🔊 spricht ...');

                    var utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = language;
                    utterance.rate = 0.85;
                    utterance.pitch = gender === 'male' ? 1.0 : 1.3;
                    utterance.volume = 1;

                    var voices = this.synthesis.getVoices();
                    var found = null;
                    for (var i = 0; i < voices.length; i++) {
                        if (voices[i].lang === language) {
                            found = voices[i];
                            break;
                        }
                    }
                    if (found) {
                        utterance.voice = found;
                    }

                    utterance.onend = function() {
                        this.isSpeaking = false;
                        this.updateAIStatus('idle', '● bereit');
                    }.bind(this);

                    utterance.onerror = function() {
                        this.isSpeaking = false;
                        this.updateAIStatus('idle', '● bereit');
                    }.bind(this);

                    this.synthesis.speak(utterance);
                },

                updateAIStatus: function(state, text) {
                    if (statusDot) {
                        statusDot.className = 'status-dot';
                        if (state === 'listening') statusDot.classList.add('listening');
                        else if (state === 'thinking') statusDot.classList.add('thinking');
                        else if (state === 'speaking') statusDot.classList.add('speaking');
                    }
                    if (statusText) {
                        statusText.textContent = text || '● bereit · klicke zum Sprechen';
                    }
                    var aiState = document.getElementById('ai-state');
                    if (aiState) {
                        aiState.textContent = text || '● bereit';
                        aiState.style.color = state === 'thinking' ? '#ffcc00' : state === 'listening' ?
                            '#44aaff' : state === 'speaking' ? '#44ff88' : '#44ff88';
                    }
                }
            };

            // ============================================================
            //  WINDOW MANAGER
            // ============================================================
            function getSafePosition() {
                var vw = window.innerWidth,
                    vh = window.innerHeight;
                var w = Math.min(500, vw - 40);
                var h = Math.min(380, vh - 160);
                return { x: Math.max(10, (vw - w) / 2), y: Math.max(40, (vh - h) / 2 - 20), w: w, h: h };
            }

            function launchApp(id) {
                var app = state.apps[id];
                if (!app) { notify('❌ App "' + id + '" nicht gefunden', 'error'); return; }
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].appId === id) {
                        focusWindow(state.windows[i].id);
                        return;
                    }
                }
                var pos = getSafePosition();
                var winId = 'win-' + Date.now();
                var win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x + Math.random() * 30,
                    y: pos.y + Math.random() * 30,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null
                };
                state.windows.push(win);
                renderWindow(win);
                focusWindow(winId);
                if (app.render) { app.render(win.element.querySelector('.window-body'), win); }
                notify('🔄 ' + (app.title || id) + ' geöffnet');
                voice.speak('🔓 ' + (app.title || id) + ' wurde geöffnet');
                return win;
            }

            function renderWindow(win) {
                var existing = document.getElementById(win.id);
                if (existing) existing.remove();
                var el = document.createElement('div');
                el.id = win.id;
                el.className = 'window';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;
                el.innerHTML =
                    '<div class="window-header"><span class="window-title">' + win.icon + ' ' + win.title +
                    '</span><div class="window-controls"><button class="win-btn" data-action="minimize">─</button><button class="win-btn" data-action="maximize">⧉</button><button class="win-btn close" data-action="close">✕</button></div></div><div class="window-body"></div>';
                appContainer.appendChild(el);
                win.element = el;

                var btns = el.querySelectorAll('.win-btn');
                for (var i = 0; i < btns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var action = btn.dataset.action;
                            if (action === 'close') closeWindow(win.id);
                            else if (action === 'minimize') minimizeWindow(win.id);
                            else if (action === 'maximize') maximizeWindow(win.id);
                        });
                    })(btns[i]);
                }

                var header = el.querySelector('.window-header');
                var drag = false,
                    startX, startY, origX, origY, isTouch = false;

                function startDrag(cx, cy) {
                    if (header.querySelector('.win-btn') && document.activeElement && document.activeElement.tagName ===
                        'BUTTON') return;
                    drag = true;
                    startX = cx;
                    startY = cy;
                    origX = win.x;
                    origY = win.y;
                    focusWindow(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(cx, cy) {
                    if (!drag) return;
                    var dx = cx - startX,
                        dy = cy - startY;
                    win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
                    win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() { if (drag) { drag = false;
                        el.style.cursor = ''; } }

                header.addEventListener('mousedown', function(e) { if (!e.target.closest('.win-btn')) startDrag(e.clientX, e
                        .clientY); });
                document.addEventListener('mousemove', function(e) { if (drag) moveDrag(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    if (!e.target.closest('.win-btn')) { isTouch = true;
                        startDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchmove', function(e) {
                    if (drag && isTouch) { var t = e.touches[0];
                        moveDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', function() { if (isTouch) { isTouch = false;
                        endDrag(); } }, { passive: true });

                var resizeHandle = document.createElement('div');
                resizeHandle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:24px;height:24px;cursor:se-resize;touch-action:none;';
                el.appendChild(resizeHandle);

                var resize = false,
                    startW, startH, startX2, startY2;

                function startResize(cx, cy) { resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = cx;
                    startY2 = cy; }

                function moveResize(cx, cy) {
                    if (!resize) return;
                    var dw = cx - startX2,
                        dh = cy - startY2;
                    win.width = Math.max(200, Math.min(window.innerWidth - win.x - 10, startW + dw));
                    win.height = Math.max(120, Math.min(window.innerHeight - win.y - 80, startH + dh));
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                resizeHandle.addEventListener('mousedown', function(e) { e.stopPropagation();
                    startResize(e.clientX, e.clientY); });
                document.addEventListener('mousemove', function(e) { if (resize) moveResize(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endResize);

                resizeHandle.addEventListener('touchstart', function(e) { var t = e.touches[0];
                    e.stopPropagation();
                    startResize(t.clientX, t.clientY); }, { passive: true });
                document.addEventListener('touchmove', function(e) { if (resize) { var t = e.touches[0];
                        moveResize(t.clientX, t.clientY); } }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            }

            function closeWindow(winId) {
                var idx = -1;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { idx = i; break; }
                }
                if (idx === -1) return;
                var win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) focusWindow(state.windows[state.windows.length - 1].id);
            }

            function focusWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    for (var j = 0; j < state.windows.length; j++) {
                        if (state.windows[j].id !== winId && state.windows[j].element) {
                            state.windows[j].element.classList.remove('active');
                        }
                    }
                }
            }

            function minimizeWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (win && win.element) { win.element.style.display = 'none';
                    notify('⏬ ' + win.title + ' minimiert'); }
            }

            function maximizeWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (!win || !win.element) return;
                if (win.width === window.innerWidth - 20) {
                    win.width = win._prevWidth || 500;
                    win.height = win._prevHeight || 380;
                    win.x = win._prevX || 20;
                    win.y = win._prevY || 40;
                } else {
                    win._prevWidth = win.width;
                    win._prevHeight = win.height;
                    win._prevX = win.x;
                    win._prevY = win.y;
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            }

            // ============================================================
            //  APP REGISTRATION
            // ============================================================
            function registerApp(id, config) {
                state.apps[id] = { id: id, title: config.title, icon: config.icon, render: config.render };
            }

            // ============================================================
            //  COSMIC WORLD — 4K GALAXY QUALITÄT
            // ============================================================
            function initCosmic() {
                var ctx = cosmicCanvas.getContext('2d');
                var W, H;

                function resize() {
                    W = cosmicCanvas.width = window.innerWidth;
                    H = cosmicCanvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                var starColors = ['#ffffff', '#ffdd88', '#88ddff', '#ff88dd', '#88ffaa', '#ffaa88', '#dd88ff', '#88ffdd'];
                var stars = [];
                for (var i = 0; i < 4000; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 3 + 0.5,
                        speed: Math.random() * 0.02 + 0.003,
                        bright: Math.random() * 0.6 + 0.4,
                        phase: Math.random() * Math.PI * 2,
                        color: starColors[Math.floor(Math.random() * starColors.length)]
                    });
                }

                // Galaxien (8 Spiralgalaxien)
                var galaxies = [];
                for (var g = 0; g < 8; g++) {
                    var gx = Math.random() * W;
                    var gy = Math.random() * H;
                    var gSize = 80 + Math.random() * 200;
                    var angle = Math.random() * Math.PI * 2;
                    var points = [];
                    for (var i = 0; i < 400; i++) {
                        var t = Math.random() * Math.PI * 4;
                        var r = Math.random() * gSize * 0.6;
                        var px = gx + Math.cos(t + angle) * r * (1 + t * 0.06);
                        var py = gy + Math.sin(t + angle) * r * (1 + t * 0.06);
                        points.push({
                            x: px,
                            y: py,
                            r: Math.random() * 2 + 0.5,
                            bright: Math.random() * 0.5 + 0.2,
                            hue: 200 + Math.random() * 80
                        });
                    }
                    galaxies.push({
                        x: gx,
                        y: gy,
                        size: gSize,
                        angle: angle,
                        points: points,
                        rotationSpeed: (Math.random() - 0.5) * 0.002
                    });
                }

                // Sonne
                var sun = { x: W / 2, y: H / 2, radius: 55, glow: 280, phase: 0, pulseSpeed: 0.008, flares: 24 };

                // 12 Planeten
                var planetData = [
                    { name: 'Merkur', r: 9, color: '#c2b9b0', orbit: 85, speed: 0.03, role: 'second' },
                    { name: 'Venus', r: 13, color: '#e8cda0', orbit: 125, speed: 0.022, role: 'minute' },
                    { name: 'Erde', r: 15, color: '#4488ff', orbit: 175, speed: 0.015, role: 'hour' },
                    { name: 'Mars', r: 11, color: '#e07040', orbit: 225, speed: 0.012 },
                    { name: 'Jupiter', r: 27, color: '#d4a574', orbit: 290, speed: 0.008 },
                    { name: 'Saturn', r: 21, color: '#e8d5a0', orbit: 360, speed: 0.006 },
                    { name: 'Uranus', r: 17, color: '#88ddff', orbit: 430, speed: 0.0045 },
                    { name: 'Neptun', r: 16, color: '#4466ff', orbit: 500, speed: 0.0035 },
                    { name: 'Pluto', r: 7, color: '#ccbb99', orbit: 570, speed: 0.0025 },
                    { name: 'HalDo-1', r: 12, color: '#ff88dd', orbit: 630, speed: 0.0018 },
                    { name: 'HalDo-2', r: 14, color: '#88ffaa', orbit: 690, speed: 0.0012 },
                    { name: 'HalDo-3', r: 10, color: '#ffaa88', orbit: 750, speed: 0.0008 }
                ];

                var planets = [];
                for (var p = 0; p < planetData.length; p++) {
                    var pd = planetData[p];
                    planets.push({
                        name: pd.name,
                        r: pd.r,
                        color: pd.color,
                        orbit: pd.orbit,
                        speed: pd.speed,
                        angle: Math.random() * Math.PI * 2,
                        cx: W / 2,
                        cy: H / 2,
                        role: pd.role || 'normal',
                        trail: []
                    });
                }

                var moon = { x: 0, y: 0, r: 7, color: '#cccccc', orbit: 35, speed: 0.08, angle: 0, ex: 0, ey: 0 };

                function animate() {
                    var time = Date.now() / 2000;
                    var now = new Date();
                    var seconds = now.getSeconds();
                    var minutes = now.getMinutes();
                    var hours = now.getHours() % 12;

                    ctx.clearRect(0, 0, W, H);

                    // Himmelshintergrund
                    var bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.9);
                    var hue1 = 220 + 15 * Math.sin(time * 0.08);
                    var hue2 = 240 + 20 * Math.sin(time * 0.05 + 1);
                    bgGrad.addColorStop(0, 'hsl(' + hue1 + ', 60%, 15%)');
                    bgGrad.addColorStop(0.4, 'hsl(' + hue2 + ', 50%, 10%)');
                    bgGrad.addColorStop(0.7, 'hsl(260, 40%, 6%)');
                    bgGrad.addColorStop(1, '#000005');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, W, H);

                    // Galaxien
                    for (var gi = 0; gi < galaxies.length; gi++) {
                        var g2 = galaxies[gi];
                        g2.angle += g2.rotationSpeed;
                        for (var pi = 0; pi < g2.points.length; pi++) {
                            var p2 = g2.points[pi];
                            var rotX = p2.x - g2.x;
                            var rotY = p2.y - g2.y;
                            var cosA = Math.cos(g2.angle);
                            var sinA = Math.sin(g2.angle);
                            var rx = g2.x + rotX * cosA - rotY * sinA;
                            var ry = g2.y + rotX * sinA + rotY * cosA;
                            ctx.fillStyle = 'hsla(' + p2.hue + ', 70%, 60%, ' + (p2.bright * 0.2) + ')';
                            ctx.beginPath();
                            ctx.arc(rx, ry, p2.r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // Planeten-Trails
                    for (var pt = 0; pt < planets.length; pt++) {
                        var pTrail = planets[pt];
                        if (pTrail.trail) {
                            for (var ti = 0; ti < pTrail.trail.length; ti++) {
                                var t2 = pTrail.trail[ti];
                                ctx.fillStyle = 'rgba(255,255,255,' + (t2.life * 0.03) + ')';
                                ctx.beginPath();
                                ctx.arc(t2.x, t2.y, 1.5, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    }

                    // Sonne
                    sun.phase += sun.pulseSpeed;
                    var pulse = 1 + 0.05 * Math.sin(sun.phase);
                    var radius = sun.radius * pulse;

                    for (var g = 15; g > 0; g--) {
                        var grad = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * g * 0.1);
                        var alpha = 0.04 / g;
                        grad.addColorStop(0, 'rgba(255, 220, 68, ' + alpha + ')');
                        grad.addColorStop(0.5, 'rgba(255, 180, 50, ' + alpha * 0.5 + ')');
                        grad.addColorStop(1, 'rgba(255, 100, 20, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(sun.x, sun.y, sun.glow * g * 0.1, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    var sunGrad = ctx.createRadialGradient(
                        sun.x - radius * 0.3, sun.y - radius * 0.3, 0,
                        sun.x, sun.y, radius
                    );
                    sunGrad.addColorStop(0, '#ffeecc');
                    sunGrad.addColorStop(0.2, '#ffdd55');
                    sunGrad.addColorStop(0.5, '#ffaa00');
                    sunGrad.addColorStop(0.75, '#ff7700');
                    sunGrad.addColorStop(0.9, '#ff4400');
                    sunGrad.addColorStop(1, '#cc2200');
                    ctx.fillStyle = sunGrad;
                    ctx.shadowColor = '#ffdd44';
                    ctx.shadowBlur = 50;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // HalDo Logo in der Sonne
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = 'bold ' + (radius * 0.55) + 'px system-ui, sans-serif';
                    ctx.shadowColor = 'rgba(255,255,255,0.6)';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('⟡', sun.x, sun.y - radius * 0.05);
                    ctx.shadowBlur = 0;

                    // Sonnenstrahlen
                    for (var fl = 0; fl < sun.flares; fl++) {
                        var fAngle = fl * (Math.PI / (sun.flares / 2)) + sun.phase * 0.2;
                        var len = radius * (1.4 + 0.4 * Math.sin(sun.phase * 0.6 + fl * 0.4));
                        ctx.strokeStyle = 'rgba(255, 220, 68, ' + (0.04 + 0.03 * Math.sin(sun.phase + fl)) + ')';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(sun.x + Math.cos(fAngle) * radius * 0.6, sun.y + Math.sin(fAngle) * radius * 0.6);
                        ctx.lineTo(sun.x + Math.cos(fAngle) * len, sun.y + Math.sin(fAngle) * len);
                        ctx.stroke();
                    }

                    // Planeten
                    for (var pp = 0; pp < planets.length; pp++) {
                        var pl = planets[pp];

                        if (pl.role === 'second') {
                            pl.angle = (seconds / 60) * Math.PI * 2;
                        } else if (pl.role === 'minute') {
                            pl.angle = (minutes / 60) * Math.PI * 2 + (seconds / 60) * (Math.PI * 2 / 60);
                        } else if (pl.role === 'hour') {
                            pl.angle = (hours / 12) * Math.PI * 2 + (minutes / 60) * (Math.PI * 2 / 12);
                        } else {
                            pl.angle += pl.speed;
                        }

                        var px = pl.cx + Math.cos(pl.angle) * pl.orbit;
                        var py = pl.cy + Math.sin(pl.angle) * pl.orbit;

                        if (pl.role === 'normal') {
                            if (!pl.trail) pl.trail = [];
                            pl.trail.push({ x: px, y: py, life: 1 });
                            if (pl.trail.length > 35) pl.trail.shift();
                            for (var ti2 = 0; ti2 < pl.trail.length; ti2++) {
                                pl.trail[ti2].life *= 0.98;
                            }
                        }

                        ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([3, 6]);
                        ctx.beginPath();
                        ctx.arc(pl.cx, pl.cy, pl.orbit, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        var pGlow = ctx.createRadialGradient(px, py, 0, px, py, pl.r * 3);
                        pGlow.addColorStop(0, pl.color + '40');
                        pGlow.addColorStop(0.5, pl.color + '15');
                        pGlow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = pGlow;
                        ctx.beginPath();
                        ctx.arc(px, py, pl.r * 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.shadowColor = pl.color;
                        ctx.shadowBlur = 15;
                        ctx.fillStyle = pl.color;
                        ctx.beginPath();
                        ctx.arc(px, py, pl.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        if (pl.name === 'Saturn') {
                            ctx.strokeStyle = 'rgba(200, 180, 150, 0.35)';
                            ctx.lineWidth = 4;
                            ctx.beginPath();
                            ctx.ellipse(px, py, pl.r * 2, pl.r * 0.4, 0.3, 0, Math.PI * 2);
                            ctx.stroke();
                            ctx.strokeStyle = 'rgba(200, 180, 150, 0.2)';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.ellipse(px, py, pl.r * 2.4, pl.r * 0.6, -0.2, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.font = '8px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText(pl.name, px, py + pl.r + 6);

                        if (pl.role === 'second') {
                            ctx.fillStyle = 'rgba(255,200,100,0.3)';
                            ctx.font = '6px sans-serif';
                            ctx.fillText('⏱ Sekunde', px, py + pl.r + 22);
                        } else if (pl.role === 'minute') {
                            ctx.fillStyle = 'rgba(100,200,255,0.3)';
                            ctx.font = '6px sans-serif';
                            ctx.fillText('⏱ Minute', px, py + pl.r + 22);
                        } else if (pl.role === 'hour') {
                            ctx.fillStyle = 'rgba(255,100,100,0.3)';
                            ctx.font = '6px sans-serif';
                            ctx.fillText('⏱ Stunde', px, py + pl.r + 22);
                        }

                        if (pl.name === 'Erde') {
                            moon.ex = px;
                            moon.ey = py;
                        }
                    }

                    // Mond
                    if (moon.ex !== undefined) {
                        moon.angle += moon.speed;
                        moon.x = moon.ex + Math.cos(moon.angle) * moon.orbit;
                        moon.y = moon.ey + Math.sin(moon.angle) * moon.orbit;

                        var mGlow = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.r * 3);
                        mGlow.addColorStop(0, 'rgba(200,200,200,0.15)');
                        mGlow.addColorStop(0.5, 'rgba(200,200,200,0.05)');
                        mGlow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = mGlow;
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r * 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.shadowColor = '#cccccc';
                        ctx.shadowBlur = 12;
                        ctx.fillStyle = '#dddddd';
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        ctx.fillStyle = 'rgba(150,150,150,0.25)';
                        ctx.beginPath();
                        ctx.arc(moon.x - 3, moon.y - 3, 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(moon.x + 4, moon.y + 2, 1.5, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = 'rgba(255,255,255,0.12)';
                        ctx.font = '6px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText('🌙 Mond', moon.x, moon.y + moon.r + 4);
                    }

                    // Sterne

                    for (var st = 0; st < stars.length; st++) {

                        if (s2.y > H) { s2.y = 0;
                            s2.x = Math.random() * W; }
                        var bright = s2.bright * (0.6 + 0.4 * Math.sin(time2 * 1.5 + s2.phase));
                        ctx.globalAlpha = bright;
                        ctx.fillStyle = s2.color;
                        ctx.beginPath();
                        ctx.arc(s2.x, s2.y, s2.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;

                    // Uhrzeit
                    var hh = String(now.getHours()).padStart(2, '0');
                    var mm2 = String(now.getMinutes()).padStart(2, '0');
                    var ss3 = String(now.getSeconds()).padStart(2, '0');
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.font = '13px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('🕐 ' + hh + ':' + mm2 + ':' + ss3, 16, H - 50);

                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.font = '8px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('⏱ Sekunde · ⏱ Minute · ⏱ Stunde · 🌙 Mond · ☀️ Klicke die Sonne für HalDo AI', 16, H -
                        32);

                    requestAnimationFrame(animate);
                }
