<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalDo AI OS — Professional Edition</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --haldo-gold: #ffd54b;
            --haldo-gold-dark: #ff9f1c;
            --haldo-bg: #0a0e1a;
            --haldo-surface: rgba(16, 22, 42, 0.95);
            --haldo-border: rgba(255, 255, 255, 0.08);
            --haldo-text: #e8edf5;
            --haldo-radius: 14px;
            --haldo-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            --haldo-font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--haldo-bg);
            color: var(--haldo-text);
            font-family: var(--haldo-font);
        }

        #haldo-os {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(30, 60, 140, 0.15), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(80, 40, 160, 0.1), transparent 50%),
                var(--haldo-bg);
        }

        .haldo-cosmic-world {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .haldo-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .haldo-star {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            animation: twinkle var(--speed, 4s) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .haldo-main-layout {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            overflow: hidden;
        }

        .haldo-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--haldo-radius);
            border: 1px solid var(--haldo-border);
            flex-shrink: 0;
        }

        .haldo-top-bar .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd54b, #ff9f1c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .haldo-top-bar .time {
            font-size: 13px;
            opacity: 0.5;
            font-family: monospace;
        }

        .haldo-content {
            flex: 1;
            display: flex;
            gap: 12px;
            min-height: 0;
            overflow: hidden;
        }

        .haldo-sidebar {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--haldo-radius);
            border: 1px solid var(--haldo-border);
            padding: 10px;
            overflow-y: auto;
        }

        .haldo-sidebar .app-btn {
            padding: 10px 14px;
            border-radius: 10px;
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .haldo-sidebar .app-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .haldo-sidebar .app-btn.active {
            background: rgba(255, 200, 80, 0.12);
            border-color: rgba(255, 200, 80, 0.2);
            color: #ffd54b;
        }

        .haldo-sidebar .app-btn .icon {
            font-size: 18px;
            width: 28px;
            text-align: center;
        }

        .haldo-main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--haldo-radius);
            border: 1px solid var(--haldo-border);
            overflow: hidden;
            min-width: 0;
        }

        .haldo-app-header {
            padding: 12px 18px;
            border-bottom: 1px solid var(--haldo-border);
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .haldo-app-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* ===== WARNUNGEN ===== */
        .warning-card {
            background: rgba(255, 80, 80, 0.08);
            border-left: 4px solid #ff6b6b;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: warningPulse 2s ease-in-out infinite;
        }

        .warning-card.baustelle {
            border-left-color: #ffa94d;
            background: rgba(255, 169, 77, 0.08);
        }
        .warning-card.sperrung {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.08);
        }
        .warning-card.gefahr {
            border-left-color: #ff0000;
            background: rgba(255, 0, 0, 0.12);
        }
        .warning-card.blitzer {
            border-left-color: #ffd93d;
            background: rgba(255, 217, 61, 0.08);
        }

        @keyframes warningPulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.85;
            }
        }

        .warning-card .w-icon {
            font-size: 28px;
            flex-shrink: 0;
        }
        .warning-card .w-info {
            flex: 1;
        }
        .warning-card .w-info .w-title {
            font-weight: 700;
            font-size: 15px;
        }
        .warning-card .w-info .w-desc {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .warning-card .w-time {
            font-size: 12px;
            opacity: 0.4;
            flex-shrink: 0;
        }

        /* ===== FRAGEBOGEN ===== */
        .question-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .question-item .q-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .question-item .q-image {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            min-height: 100px;
        }

        .question-item .q-video {
            width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            min-height: 80px;
            cursor: pointer;
        }

        .question-item .q-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .question-item .q-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: background 0.2s;
        }

        .question-item .q-options label:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .question-item .q-options input[type="radio"],
        .question-item .q-options input[type="checkbox"] {
            accent-color: #ffd54b;
            width: 16px;
            height: 16px;
        }

        .question-item .q-textarea {
            width: 100%;
            min-height: 60px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            resize: vertical;
            font-family: inherit;
            margin-top: 8px;
        }

        .question-item .q-textarea:focus {
            outline: none;
            border-color: rgba(255, 200, 80, 0.3);
        }

        .btn-primary {
            padding: 10px 24px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffd54b, #ff9f1c);
            color: #0a0e1a;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(255, 200, 80, 0.25);
        }

        .btn-secondary {
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* ===== CHAT ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .chat-msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            animation: msgIn 0.2s ease-out;
        }

        .chat-msg.user {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.08);
            border-bottom-right-radius: 4px;
        }

        .chat-msg.ai {
            align-self: flex-start;
            background: rgba(255, 200, 80, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-bottom-left-radius: 4px;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            padding: 10px 12px 14px;
            border-top: 1px solid var(--haldo-border);
            flex-shrink: 0;
        }

        .chat-input-row textarea {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
        }

        .chat-input-row textarea:focus {
            border-color: rgba(255, 200, 80, 0.2);
        }

        .chat-input-row button {
            padding: 0 18px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 200, 80, 0.15);
            color: #ffd54b;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
        }

        .chat-input-row button:hover {
            background: rgba(255, 200, 80, 0.25);
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 4px 16px 8px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: dot 1s ease-in-out infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes dot {
            0%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-4px);
                opacity: 0.9;
            }
        }

        /* ===== DOKUMENTE ===== */
        .doc-item {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .doc-item .doc-name {
            font-weight: 600;
        }

        .doc-item .doc-size {
            font-size: 12px;
            opacity: 0.4;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }

        @media (max-width: 700px) {
            .haldo-sidebar {
                width: 60px;
                padding: 6px;
            }
            .haldo-sidebar .app-btn span:not(.icon) {
                display: none;
            }
            .haldo-sidebar .app-btn {
                justify-content: center;
                padding: 10px;
            }
            .haldo-content {
                gap: 6px;
            }
            .haldo-main-layout {
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            .haldo-sidebar {
                width: 50px;
            }
            .haldo-sidebar .app-btn .icon {
                font-size: 16px;
                width: 24px;
            }
            .haldo-app-header {
                font-size: 13px;
                padding: 8px 12px;
            }
            .haldo-app-body {
                padding: 10px;
            }
            .question-item .q-image {
                font-size: 32px;
                min-height: 60px;
            }
        }
    </style>
</head>
<body>

    <div id="haldo-os">
        <div class="haldo-cosmic-world">
            <div class="haldo-stars" id="haldo-stars"></div>

            <div class="haldo-main-layout">
                <!-- Top Bar -->
                <div class="haldo-top-bar">
                    <div class="logo">✦ HalDo AI OS</div>
                    <div class="time" id="haldo-top-time">--:--:--</div>
                </div>

                <!-- Content -->
                <div class="haldo-content">
                    <!-- Sidebar -->
                    <nav class="haldo-sidebar" id="haldo-sidebar">
                        <button class="app-btn active" data-app="dashboard">
                            <span class="icon">📊</span>
                            <span>Dashboard</span>
                        </button>
                        <button class="app-btn" data-app="warnings">
                            <span class="icon">🚨</span>
                            <span>Warnungen</span>
                        </button>
                        <button class="app-btn" data-app="survey">
                            <span class="icon">📋</span>
                            <span>Fragebogen</span>
                        </button>
                        <button class="app-btn" data-app="documents">
                            <span class="icon">📄</span>
                            <span>Dokumente</span>
                        </button>
                        <button class="app-btn" data-app="chat">
                            <span class="icon">💬</span>
                            <span>HalDo AI</span>
                        </button>
                        <button class="app-btn" data-app="settings">
                            <span class="icon">⚙️</span>
                            <span>Einstellungen</span>
                        </button>
                    </nav>

                    <!-- Main Area -->
                    <div class="haldo-main-area" id="haldo-main-area">
                        <div class="haldo-app-header" id="haldo-app-header">
                            <span>📊 Dashboard</span>
                            <span style="font-size:12px;opacity:0.4;">v23.0.0</span>
                        </div>
                        <div class="haldo-app-body" id="haldo-app-body">
                            <!-- Wird dynamisch befüllt -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio für Warnungen -->
    <audio id="sound-blitzer" preload="auto">
        <source src="data:audio/wav;base64,U3RlcmVvIGlzIGR1bW15" type="audio/wav">
    </audio>
    <audio id="sound-baustelle" preload="auto">
        <source src="data:audio/wav;base64,U3RlcmVvIGlzIGR1bW15" type="audio/wav">
    </audio>
    <audio id="sound-sperrung" preload="auto">
        <source src="data:audio/wav;base64,U3RlcmVvIGlzIGR1bW15" type="audio/wav">
    </audio>
    <audio id="sound-gefahr" preload="auto">
        <source src="data:audio/wav;base64,U3RlcmVvIGlzIGR1bW15" type="audio/wav">
    </audio>

    <script>
        "use strict";

        // =========================================================
        // VERSION & INIT
        // =========================================================
        window.HALDO_VERSION = "23.0.0";
        window.HALDO_BUILD = "PROFESSIONAL";
        window._haldoStartTime = Date.now();

        // =========================================================
        // STARS
        // =========================================================
        function generateStars() {
            const container = document.getElementById("haldo-stars");
            if (!container) return;
            container.innerHTML = "";
            const count = Math.min(300, Math.max(150, Math.floor(window.innerWidth * window.innerHeight / 8000)));
            for (let i = 0; i < count; i++) {
                const star = document.createElement("span");
                star.className = "haldo-star";
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = size + "px";
                star.style.height = size + "px";
                star.style.left = Math.random() * 100 + "%";
                star.style.top = Math.random() * 100 + "%";
                star.style.setProperty('--speed', (2 + Math.random() * 5) + 's');
                container.appendChild(star);
            }
        }

        // =========================================================
        // TIME
        // =========================================================
        function updateTime() {
            const el = document.getElementById("haldo-top-time");
            if (el) el.textContent = new Date().toLocaleTimeString();
        }

        // =========================================================
        // WARNUNGEN SYSTEM mit TÖNEN
        // =========================================================
        window.HalDoWarnings = {
            warnings: [],
            listeners: [],

            addWarning(type, title, description, location = "Unbekannt") {
                const types = {
                    blitzer: { icon: '📸', tone: 'blitzer', color: 'blitzer' },
                    baustelle: { icon: '🚧', tone: 'baustelle', color: 'baustelle' },
                    sperrung: { icon: '🚫', tone: 'sperrung', color: 'sperrung' },
                    gefahr: { icon: '⚠️', tone: 'gefahr', color: 'gefahr' }
                };

                const t = types[type] || types['gefahr'];
                const warning = {
                    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    type,
                    icon: t.icon,
                    tone: t.tone,
                    color: t.color,
                    title,
                    description,
                    location,
                    timestamp: new Date().toISOString(),
                    active: true
                };

                this.warnings.unshift(warning);
                this.playTone(t.tone);
                this.notifyListeners(warning);
                this.renderWarnings();

                // Automatische Ansage
                this.speakWarning(warning);

                return warning;
            },

            playTone(tone) {
                try {
                    const audioMap = {
                        blitzer: document.getElementById('sound-blitzer'),
                        baustelle: document.getElementById('sound-baustelle'),
                        sperrung: document.getElementById('sound-sperrung'),
                        gefahr: document.getElementById('sound-gefahr')
                    };

                    const audio = audioMap[tone];
                    if (audio) {
                        audio.currentTime = 0;
                        audio.volume = 0.8;
                        audio.play().catch(() => {});
                    }

                    // Fallback: Web Audio Töne
                    this.playBeepTone(tone);
                } catch (e) { console.warn("Ton-Fehler:", e); }
            },

            playBeepTone(tone) {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    const freqs = {
                        blitzer: 1200,
                        baustelle: 800,
                        sperrung: 600,
                        gefahr: 400
                    };

                    osc.frequency.value = freqs[tone] || 800;
                    osc.type = 'square';
                    gain.gain.value = 0.15;

                    osc.start();
                    setTimeout(() => {
                        osc.stop();
                        ctx.close();
                    }, 300);

                    // Drei kurze Pieps für Blitzer
                    if (tone === 'blitzer') {
                        setTimeout(() => {
                            const ctx2 = new(window.AudioContext || window.webkitAudioContext)();
                            const o2 = ctx2.createOscillator();
                            const g2 = ctx2.createGain();
                            o2.connect(g2);
                            g2.connect(ctx2.destination);
                            o2.frequency.value = 1400;
                            o2.type = 'square';
                            g2.gain.value = 0.12;
                            o2.start();
                            setTimeout(() => { o2.stop();
                                ctx2.close(); }, 200);
                        }, 200);
                        setTimeout(() => {
                            const ctx3 = new(window.AudioContext || window.webkitAudioContext)();
                            const o3 = ctx3.createOscillator();
                            const g3 = ctx3.createGain();
                            o3.connect(g3);
                            g3.connect(ctx3.destination);
                            o3.frequency.value = 1600;
                            o3.type = 'square';
                            g3.gain.value = 0.12;
                            o3.start();
                            setTimeout(() => { o3.stop();
                                ctx3.close(); }, 200);
                        }, 400);
                    }
                } catch (e) {}
            },

            speakWarning(warning) {
                const text =
                    `Achtung! ${warning.title} in ${warning.location}. ${warning.description}`;
                this.speak(text);
            },

            speak(text) {
                if (!window.speechSynthesis) return;
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = "de-DE";
                    utterance.rate = 0.9;
                    utterance.pitch = 1.0;
                    utterance.volume = 0.9;
                    window.speechSynthesis.speak(utterance);
                } catch (e) {}
            },

            notifyListeners(warning) {
                this.listeners.forEach(fn => fn(warning));
            },

            onWarning(callback) {
                if (typeof callback === 'function') this.listeners.push(callback);
            },

            renderWarnings() {
                const container = document.getElementById('warnings-container');
                if (!container) return;

                const active = this.warnings.filter(w => w.active);
                if (active.length === 0) {
                    container.innerHTML =
                        `<div style="text-align:center;opacity:0.4;padding:30px;">✅ Keine aktiven Warnungen</div>`;
                    return;
                }

                container.innerHTML = active.map(w => `
                    <div class="warning-card ${w.color}">
                        <span class="w-icon">${w.icon}</span>
                        <div class="w-info">
                            <div class="w-title">${w.title}</div>
                            <div class="w-desc">${w.description} · 📍 ${w.location}</div>
                        </div>
                        <span class="w-time">${new Date(w.timestamp).toLocaleTimeString()}</span>
                        <button onclick="window.HalDoWarnings.dismiss('${w.id}')" style="background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:18px;">✕</button>
                    </div>
                `).join('');
            },

            dismiss(id) {

            initChat() {
                const input = document.getElementById('chat-input');
                const send = document.getElementById('chat-send');
                const voice = document.getElementById('chat-voice');
                const messages = document.getElementById('chat-messages');
                const typing = document.getElementById('chat-typing');

                if (!input || !send) return;

                const sendMsg = async () => {
                    const text = input.value.trim();
                    if (!text) return;

                    // User Message
                    const userDiv = document.createElement('div');
                    userDiv.className = 'chat-msg user';
                    userDiv.textContent = text;
                    messages.appendChild(userDiv);
                    input.value = '';
                    messages.scrollTop = messages.scrollHeight;

                    // Typing
                    typing.classList.add('active');

                    // AI Antwort
                    try {
                        const response = await window.HalDoAI.ask(text);
                        typing.classList.remove('active');

                        const aiDiv = document.createElement('div');
                        aiDiv.className = 'chat-msg ai';
                        aiDiv.textContent = response;
                        messages.appendChild(aiDiv);

                        // Sprachausgabe
                        window.HalDoWarnings.speak(response);

                        messages.scrollTop = messages.scrollHeight;
                    } catch (e) {
                        typing.classList.remove('active');
                        const errDiv = document.createElement('div');
                        errDiv.className = 'chat-msg ai';
                        errDiv.textContent = '❌ Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.';
                        messages.appendChild(errDiv);
                    }
                };

                send.addEventListener('click', sendMsg);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMsg();
                    }
                });

                // Voice
                if (voice) {
                    voice.addEventListener('click', () => {
                        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                        if (!Recognition) {
                            alert('Spracherkennung nicht unterstützt.');
                            return;
                        }
                        const rec = new Recognition();
                        rec.lang = 'de-DE';
                        rec.onresult = (e) => {
                            const text = e.results[0][0].transcript;
                            input.value = text;
                            sendMsg();
                        };
                        rec.start();
                        voice.textContent = '⏳';
                        setTimeout(() => { voice.textContent = '🎙️'; }, 5000);
                    });
                }

                // Höhe anpassen
                input.addEventListener('input', () => {
                    input.style.height = 'auto';
                    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
                });
            }

                    'Bericht': 'Zusammenfassung: Der Bericht deckt alle relevanten Themen ab. Die Daten sind plausibel und gut strukturiert.',
                    'Daten': 'Analyse: Die Daten sind vollständig und fehlerfrei. Empfehlung: Visualisierung für bessere Übersicht.',
                    'Präsentation': 'Bewertung: Klare Struktur, gute visuelle Unterstützung. Optimierungspotenzial bei der Tiefe.',
                    'Brief': 'Korrektur: Formell korrekt. Inhaltlich präzise. Empfehlung: Zielgruppenanpassung prüfen.',
                    'Vertrag': 'Prüfung: Alle Klauseln enthalten. Rechtlich einwandfrei. Keine Auffälligkeiten.'
                };

                const summary = summaries[doc.type] ||
                    'Analyse abgeschlossen. Das Dokument ist in Ordnung. Bei spezifischen Fragen kontaktieren Sie mich bitte.';

                analysis.innerHTML = `
                    <div style="background:rgba(76,175,80,0.06);border-radius:8px;padding:14px;border:1px solid rgba(76,175,80,0.1);">
                        <div style="font-weight:700;">📄 Analyse: ${doc.name}</div>
                        <div style="font-size:13px;margin-top:6px;">${summary}</div>
                        <div style="font-size:12px;opacity:0.4;margin-top:4px;">${doc.type} · ${doc.size}</div>
                        <button onclick="window.HalDoWarnings.speak('Analyse abgeschlossen. ${summary.substring(0,50)}')" class="btn-secondary" style="margin-top:8px;">🔊 Ausgabe</button>
                    </div>
                `;

                window.HalDoWarnings.speak(`Analyse von "${doc.name}" abgeschlossen.`);
            }
        };

        // =========================================================
        // BOOT
        // =========================================================
        function boot() {
            console.log("🌌 HalDo AI OS v" + window.HALDO_VERSION + " " + window.HALDO_BUILD);

            generateStars();
            updateTime();
            setInterval(updateTime, 1000);

            window.HalDoApp.init();

            // Begrüßung
            setTimeout(() => {
                window.HalDoWarnings.speak(
                    'HalDo AI OS Professional Edition wurde gestartet. System bereit. Verkehrswarnungen, Fragebögen, Dokumente und AI-Assistent verfügbar.'
                );
            }, 1000);

            console.log("✅ System bereit");
            console.log("📊 Warnungen:", window.HalDoWarnings.getActive().length);
            console.log("📋 Fragen:", window.HalDoSurvey.questions.length);
            console.log("📄 Dokumente:", window.HalDoDocs.documents.length);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", boot);
        } else {
            boot();
        }
    </script>

</body>
</html>
