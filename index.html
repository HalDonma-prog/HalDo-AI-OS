<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
HalDo AI OS 18
</title>


<link rel="stylesheet"
href="style.css">


<link rel="manifest"
href="manifest.json">


<meta name="theme-color"
content="#101522">


</head>


<body>


<!-- =====================
START SYSTEM
===================== -->


<section id="startup-screen"
class="screen">



<img

src="assets/logo/logo.svg"

id="system-logo"

class="logo"

alt="HalDo AI OS">



<h1>
HalDo AI OS 18
</h1>



<p id="system-status">

🟡 System startet...

</p>



</section>






<!-- =====================
WELCOME
===================== -->


<section id="welcome-screen"
class="screen hidden">



<img

src="assets/logo/logo.svg"

class="logo"

alt="HalDo AI OS">



<h1>

👋 Willkommen bei

<br>

HalDo AI OS 18

</h1>



<p>

Professional Ultimate Foundation

</p>



<p id="clock">

</p>



<button onclick="openMenu()">

🚀 Hauptmenü öffnen

</button>



</section>








<!-- =====================
MAIN MENU
===================== -->


<section id="main-menu"
class="hidden">



<header class="header">


<img

src="assets/logo/logo.svg"

class="logo small"

alt="HalDo AI OS">


<h1>

HalDo AI OS 18

</h1>



<p>

Professional Ultimate Foundation

</p>


</header>







<main class="menu-container">



<h2>

🚀 Hauptmenü

</h2>




<div class="menu-grid">



<button onclick="openPage('dashboard.html')">

📊 Dashboard

</button>



<button onclick="openPage('ai-core.html')">

🤖 AI Core

</button>



<button onclick="openPage('modules.html')">

🧩 Module

</button>



<button onclick="openPage('apps.html')">

📱 Apps

</button>



<button onclick="openPage('settings.html')">

⚙️ Einstellungen

</button>



<button onclick="openPage('status.html')">

📡 System Status

</button>



</div>



</main>



</section>







<script src="js/boot.js"></script>

<script src="js/startup.js"></script>



<script>


function openMenu(){


document
.getElementById("welcome-screen")
.classList.add("hidden");



document
.getElementById("main-menu")
.classList.remove("hidden");


}





function openPage(page){


window.location.href = page;


}





function updateClock(){


let time =
new Date()
.toLocaleTimeString(
"de-DE"
);



let clock =
document.getElementById(
"clock"
);



if(clock){

clock.innerHTML =
"🕒 " + time;

}


}



setInterval(
updateClock,
1000
);


updateClock();



</script>



</body>

</html>
