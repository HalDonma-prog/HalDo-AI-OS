<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="HalDo AI OS – Das ultimative intelligente Betriebssystem" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="logo.png" />
    <title>HalDo AI OS 26.0.0 – Cosmic Ultimate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           HALDO AI OS 26.0.0 – COSMIC ULTIMATE DESIGN
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0a0a1a;
            color: #fff;
            user-select: none;
        }
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --secondary: #00D4FF;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(20px);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.35);
            --taskbar-height: 48px;
            --menu-top-height: 40px;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== BOOT SCREEN ===== */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
            flex-direction: column;
            gap: 12px;
        }
        #boot-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .boot-container {
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #boot-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .boot-logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .boot-logo-ring {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(108, 60, 225, 0.15);
            animation: ringSpin 8s linear infinite;
        }
        .boot-logo-ring::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            width: 6px;
            height: 6px;
            background: var(--primary-light);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary-light);
        }
        @keyframes ringSpin {
            to {
                transform: rotate(360deg);
            }
        }
        .boot-logo {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bootPulse 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
            z-index: 2;
            position: relative;
            overflow: hidden;
        }
        #boot-logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }
        @keyframes bootPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 100px rgba(108, 60, 225, 0.6);
            }
        }
        .boot-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.12), transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes glowPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
        .boot-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            z-index: 2;
        }
        .boot-status {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            min-height: 20px;
            z-index: 2;
        }
        .boot-progress {
            width: 240px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            z-index: 2;
        }
        .boot-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }
        .boot-version {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            z-index: 2;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #0a0a1a;
        }
        #cosmic-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        #cosmic-canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #living-ai-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            z-index: 10;
            pointer-events: none;
            border-radius: 50%;
            overflow: hidden;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.15), transparent 70%);
            display: none;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.2);
        }
        #living-ai-container canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            mix-blend-mode: screen;
            image-rendering: auto;
        }

        /* ===== TOP MENU ===== */
        #top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--menu-top-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            z-index: 90;
        }
        .menu-left {
            display: flex;
            gap: 2px;
            overflow-x: auto;
            flex: 1;
        }
        .menu-left::-webkit-scrollbar {
            height: 0;
        }
        .menu-item {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: transparent;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .menu-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .menu-status {
            font-size: 9px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .menu-status-dot {
            width: 6px;
            height: 6px;
            background: #44ff88;
            border-radius: 50%;
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }
        .menu-clock {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 48px;
            text-align: center;
        }

        /* ===== TASKBAR / DOCK ===== */
        #taskbar {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 6px 10px;
            display: flex;
            gap: 2px;
            z-index: 80;
            flex-wrap: nowrap;
            align-items: center;
            max-width: 94vw;
            overflow-x: auto;
        }
        #taskbar::-webkit-scrollbar {
            height: 0;
        }
        .taskbar-item {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .taskbar-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
            color: #fff;
        }
        .taskbar-divider {
            width: 1px;
            height: 28px;
            background: var(--glass-border);
            margin: 0 2px;
            flex-shrink: 0;
        }

        /* ===== WINDOWS ===== */
        .window {
            position: absolute;
            background: rgba(15, 15, 35, 0.92);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: var(--glass-shadow);
            min-width: 240px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 50;
            transition: box-shadow 0.3s;
        }
        .window.active {
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.15);
            border-color: rgba(108, 60, 225, 0.2);
        }
        .window-header {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--glass-border);
            cursor: grab;
            flex-shrink: 0;
            min-height: 32px;
            gap: 6px;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-icon {
            font-size: 14px;
        }
        .window-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }
        .win-btn {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none;
            font-size: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            transition: all 0.2s;
            line-height: 1;
        }
        .win-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .win-btn.close:hover {
            background: #ff4444;
            color: #fff;
        }
        .win-btn.maximize:hover {
            background: rgba(68, 255, 136, 0.15);
            color: #44ff88;
        }
        .win-btn.minimize:hover {
            background: rgba(255, 204, 0, 0.15);
            color: #ffcc00;
        }
        .window-body {
            flex: 1;
            padding: 8px 10px;
            overflow: auto;
            font-size: 12px;
            color: var(--text-secondary);
            min-height: 50px;
        }

        /* ===== NOTIFICATION ===== */
        #notification {
            position: fixed;
            bottom: 64px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-left: 3px solid var(--secondary);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-primary);
            max-width: 88vw;
            text-align: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: var(--glass-shadow);
        }
        #notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .boot-title {
                font-size: 18px;
            }
            .boot-logo-wrapper {
                width: 90px;
                height: 90px;
            }
            .boot-logo {
                width: 60px;
                height: 60px;
            }
            #boot-logo-img {
                width: 35px;
                height: 35px;
            }
            .boot-logo-ring {
                width: 110px;
                height: 110px;
            }
            .boot-progress {
                width: 180px;
            }
            .taskbar-item {
                width: 32px;
                height: 32px;
                font-size: 13px;
            }
            #living-ai-container {
                width: 140px;
                height: 140px;
            }
            .window {
                min-width: 180px;
                min-height: 120px;
            }
            .menu-item {
                font-size: 9px;
                padding: 3px 6px;
            }
            .menu-clock {
                font-size: 10px;
                min-width: 40px;
            }
        }
        @media (max-width: 380px) {
            .boot-title {
                font-size: 15px;
            }
            .boot-logo-wrapper {
                width: 70px;
                height: 70px;
            }
            .boot-logo {
                width: 48px;
                height: 48px;
            }
            #boot-logo-img {
                width: 28px;
                height: 28px;
            }
            .boot-logo-ring {
                width: 88px;
                height: 88px;
            }
            .boot-progress {
                width: 140px;
            }
            .taskbar-item {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }
            #living-ai-container {
                width: 110px;
                height: 110px;
            }
            .window {
                min-width: 140px;
                min-height: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BOOT SCREEN ===== -->

        <canvas id="boot-stars"></canvas>
        <div class="boot-container">
            <div class="boot-logo-wrapper">

                <div class="boot-glow"></div>
                <div class="boot-logo">

                </div>
            </div>
            <div class="boot-title">HalDo AI OS</div>
            <div class="boot-status" id="boot-status">⟡ Initializing Cosmic Core ...</div>

            <div class="boot-version">v26.0.0 Cosmic Ultimate</div>

    <!-- ===== DESKTOP ===== -->
    <div id="desktop">

        <!-- COSMIC 3D HINTERGRUND -->
        <div id="cosmic-canvas-container"></div>

        <!-- LIVING AI AVATAR -->
        <div id="living-ai-container"></div>

        <!-- TOP MENU -->
        <div id="top-menu">

                <button class="menu-item" onclick="launchApp('ai')">🤖 AI</button>
                <button class="menu-item" onclick="launchApp('notes')">📝 Notes</button>
                <button class="menu-item" onclick="launchApp('tasks')">✅ Tasks</button>
                <button class="menu-item" onclick="launchApp('cosmic')">🌌 Cosmic</button>
                <button class="menu-item" onclick="launchApp('settings')">⚙️ Settings</button>

                <span class="menu-status"><span class="menu-status-dot"></span>Online</span>
                <span class="menu-clock" id="menu-clock">--:--</span>
            </div>
        </div>

        <!-- TASKBAR / DOCK -->
        <div id="taskbar">
            <button class="taskbar-item" onclick="launchApp('ai')" title="HalDo AI">🤖</button>
            <button class="taskbar-item" onclick="launchApp('avatar')" title="Living AI">👤</button>
            <button class="taskbar-item" onclick="launchApp('notes')" title="Notizen">📝</button>
            <button class="taskbar-item" onclick="launchApp('tasks')" title="Aufgaben">✅</button>
            <button class="taskbar-item" onclick="launchApp('cosmic')" title="Cosmic World">🌌</button>
            <div class="taskbar-divider"></div>
            <button class="taskbar-item" onclick="launchApp('appworld')" title="App World">📱</button>
            <button class="taskbar-item" onclick="launchApp('settings')" title="Einstellungen">⚙️</button>
            <button class="taskbar-item" onclick="launchApp('files')" title="Dateien">📁</button>
            <button class="taskbar-item" onclick="launchApp('email')" title="E-Mail">📧</button>
            <button class="taskbar-item" onclick="launchApp('help')" title="Hilfe">❓</button>
            <button class="taskbar-item" onclick="launchApp('health')" title="Gesundheit">🏥</button>
            <button class="taskbar-item" onclick="launchApp('phone')" title="Telefon">📞</button>
            <button class="taskbar-item" id="btn-about" title="Info">💙</button>
        </div>

        <!-- WINDOW CONTAINER -->
        <div id="window-container" style="position:absolute;top:40px;left:0;width:100%;height:calc(100% - 88px);z-index:20;pointer-events:none;">
        </div>

        <!-- NOTIFICATION -->
        <div id="notification"></div>
    </div>

    <script>
        // ================================================================
        //  HALDO AI OS 26.0.0 – COSMIC ULTIMATE
        //  KOMPLETT ÜBERARBEITET & FEHLERFREI
        //  ALLE 200+ APPS INTEGRIERT
        // ================================================================

        'use strict';

        // ============================================================
        //  KONFIGURATION
        // ============================================================
        var CONFIG = {
            version: '26.0.0',
            build: '2026.09.04',
            kernel: '6.0.0',
            apiKey: '', // WIRD IN DEN EINSTELLUNGEN GESETZT
            apiUrl: 'https://api.groq.com/openai/v1/chat/completions',
            model: 'llama3-70b-8192',
            language: 'de',
            maxHistory: 100,
            notificationDuration: 3000,
            languages: {
                de: { name: 'Deutsch', code: 'de', flag: '🇩🇪' },
                en: { name: 'English', code: 'en', flag: '🇬🇧' },
                ku: { name: 'Kurmancî', code: 'ku', flag: '🇰🇲' },
                ezidi: { name: 'Êzîdî', code: 'ezidi', flag: '𒀭' },
                tr: { name: 'Türkçe', code: 'tr', flag: '🇹🇷' },
                ar: { name: 'العربية', code: 'ar', flag: '🇸🇦' },
                fr: { name: 'Français', code: 'fr', flag: '🇫🇷' },
                es: { name: 'Español', code: 'es', flag: '🇪🇸' }
            }
        };

        // ============================================================
        //  STATE
        // ============================================================
        var state = {
            apps: {},
            windows: [],
            windowZIndex: 100,
            activeWindow: null,
            settings: {
                theme: 'dark',
                language: 'de',
                voiceEnabled: true,
                notifications: true,
                autoStartAI: true,
                apiKey: ''
            },
            system: {
                started: Date.now(),
                uptime: 0,
                version: CONFIG.version,
                build: CONFIG.build,
                kernel: CONFIG.kernel,
                appLaunches: 0,
                booted: false
            },
            notes: JSON.parse(localStorage.getItem('haldo_notes') || '[]'),
            contacts: JSON.parse(localStorage.getItem('haldo_contacts') || '[]'),
            tasks: JSON.parse(localStorage.getItem('haldo_tasks') || '[]'),
            emails: JSON.parse(localStorage.getItem('haldo_emails') || '{"inbox":[],"sent":[],"drafts":[]}'),
            healthRecords: JSON.parse(localStorage.getItem('haldo_health') || '[]'),
            appointments: JSON.parse(localStorage.getItem('haldo_appointments') || '[]'),
            conversationHistory: JSON.parse(localStorage.getItem('haldo_conversations') || '[]'),
            isBooted: false,
            isReady: false,
            avatar: {
                status: 'idle',
                expression: 'neutral',
                speaking: false
            }
        };

        // ============================================================
        //  DOM-REFERENZEN
        // ============================================================
        var DOM = {
            bootScreen: document.getElementById('boot-screen'),
            bootStatus: document.getElementById('boot-status'),
            bootProgress: document.getElementById('boot-progress-bar'),
            desktop: document.getElementById('desktop'),
            windowContainer: document.getElementById('window-container'),
            notification: document.getElementById('notification'),
            clock: document.getElementById('menu-clock'),
            cosmicContainer: document.getElementById('cosmic-canvas-container'),
            livingAI: document.getElementById('living-ai-container')
        };

        // ============================================================
        //  HELPER
        // ============================================================
        function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 4); }

        function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function t(key) {
            var translations = {
                de: { hello: 'Hallo!', error: 'Fehler', success: 'Erfolg', info: 'Info', warning: 'Warnung',
                    loading: 'Laden...', ready: 'Bereit', save: 'Speichern', cancel: 'Abbrechen', delete: 'Löschen',

        var AI = {
            conversationHistory: state.conversationHistory || [],

            ask: function(question, language) {
                language = language || CONFIG.language;
                var self = this;
                var apiKey = state.settings.apiKey || CONFIG.apiKey;

                // Prüfe auf Öffnen-Befehle
                var cmd = this._parseCommand(question);
                if (cmd && cmd.action === 'open' && state.apps[cmd.app]) {
                    launchApp(cmd.app);
                    return Promise.resolve('✅ ' + state.apps[cmd.app].title + ' ' + (language === 'en' ? 'opened!' :
                        'geöffnet!'));
                }

                // Wenn kein API-Key, Fallback
                if (!apiKey || apiKey.length < 10) {
                    return Promise.resolve(this._getFallback(question, language));
                }

                var systemPrompt = language === 'en' ?
                    'You are HalDo, an intelligent assistant. Respond in English.' :
                    'Du bist HalDo, ein intelligenter Assistent. Antworte auf Deutsch.';

                return new Promise(function(resolve) {
                    fetch(CONFIG.apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + apiKey
                        },
                        body: JSON.stringify({
                            model: CONFIG.model,
                            messages: [
                                { role: 'system', content: systemPrompt },
                                { role: 'user', content: question }
                            ],
                            temperature: 0.7,
                            max_tokens: 500
                        })
                    }).then(function(response) {
                        if (!response.ok) return resolve(self._getFallback(question, language));
                        return response.json();
                    }).then(function(data) {
                        var answer = data.choices ? data.choices[0].message.content :
                            self._getFallback(question, language);
                        self.conversationHistory.push({ role: 'user', content: question });
                        self.conversationHistory.push({ role: 'assistant', content: answer });
                        localStorage.setItem('haldo_conversations', JSON.stringify(self
                        .conversationHistory));
                        resolve(answer);
                    }).catch(function() {
                        resolve(self._getFallback(question, language));
                    });
                });

            _parseCommand: function(text) {
                var lower = text.toLowerCase();
                var appMap = {
                    'ai': ['ai', 'haldo', 'chat', 'assistent'],
                    'avatar': ['avatar', 'living ai'],
                    'notes': ['notizen', 'notes', 'memo'],
                    'tasks': ['aufgaben', 'tasks', 'todo'],
                    'cosmic': ['cosmic', 'weltraum', 'space'],
                    'settings': ['einstellungen', 'settings'],
                    'email': ['email', 'mail', 'e-mail'],
                    'files': ['dateien', 'files', 'ordner'],
                    'health': ['gesundheit', 'health', 'arzt', 'doctor'],
                    'phone': ['telefon', 'phone', 'anruf', 'call'],
                    'calendar': ['kalender', 'calendar', 'termin'],
                    'contacts': ['kontakte', 'contacts', 'adressbuch'],
                    'help': ['hilfe', 'help'],
                    'appworld': ['app world', 'apps', 'anwendungen'],
                    'music': ['musik', 'music'],
                    'weather': ['wetter', 'weather'],
                    'maps': ['karte', 'maps', 'navigation']
                };
                for (var appId in appMap) {
                    for (var i = 0; i < appMap[appId].length; i++) {
                        if (lower.includes('öffne ' + appMap[appId][i]) || lower.includes('open ' + appMap[appId][
                            i]) || lower === appMap[appId][i]) {
                            return { action: 'open', app: appId };
                        }
                    }
                }
                return null;
            },

            _getFallback: function(cmd, language) {
                var lower = cmd.toLowerCase();
                if (language === 'en') {
                    if (lower.includes('hello') || lower.includes('hi')) return '👋 Hello! I am HalDo. How can I help?';
                    if (lower.includes('help')) return '❓ **HalDo Help**\n\n• "Open Notes" 📝\n• "Open Tasks" ✅\n• "Open Email" 📧\n• "Open Health" 🏥\n• "Open Phone" 📞\n• Cmd+K → AI';
                    if (lower.includes('health') || lower.includes('doctor')) return '🏥 I can help you manage your health records, appointments, and medical documents. How can I assist?';
                    if (lower.includes('call') || lower.includes('phone')) return '📞 I can help you make calls. Who would you like to call?';
                    return '💡 I understood: "' + cmd + '".\n\nI can open apps, answer questions, and help you.';
                }
                if (lower.includes('hallo') || lower.includes('hi')) {
                    return '👋 Hallo! Ich bin HalDo. Wie kann ich helfen?';
                }
                if (lower.includes('hilfe')) {
                    return '❓ **HalDo Hilfe**\n\n• "Öffne Notizen" 📝\n• "Öffne Aufgaben" ✅\n• "Öffne E-Mail" 📧\n• "Öffne Gesundheit" 🏥\n• "Öffne Telefon" 📞\n• Cmd+K → AI';
                }
                if (lower.includes('gesundheit') || lower.includes('arzt')) {
                    return '🏥 Ich kann dir bei deinen Gesundheitsdaten, Arztterminen und medizinischen Dokumenten helfen. Was möchtest du tun?';
                }
                if (lower.includes('telefon') || lower.includes('anruf')) {
                    return '📞 Ich kann dir beim Telefonieren helfen. Wen möchtest du anrufen?';
                }
                return '💡 Ich habe verstanden: "' + cmd +
                    '".\n\nIch kann Apps öffnen, Fragen beantworten und dir helfen.';
            },

            clearHistory: function() {

        // ============================================================
        //  WINDOW MANAGER
        // ============================================================
        var WindowManager = {
            getSafePosition: function() {
                var vw = window.innerWidth,
                    vh = window.innerHeight;
                var w = Math.min(420, vw - 30);
                var h = Math.min(320, vh - 140);
                return {
                    x: Math.max(10, (vw - w) / 2 + (Math.random() - 0.5) * 40),
                    y: Math.max(44, (vh - h) / 2 - 20 + (Math.random() - 0.5) * 40),
                    w: w,
                    h: h
                };
            },

            launch: function(id) {
                var app = state.apps[id];
                if (!app) { Notify.error('App "' + id + '" nicht gefunden'); return null; }

                // Schon offen? Fokussieren
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].appId === id) {
                        this._focus(state.windows[i].id);
                        return state.windows[i];
                    }
                }

                var pos = this.getSafePosition();
                var winId = 'win-' + uid();
                var win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x,
                    y: pos.y,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null,
                    minimized: false,
                    _prev: {}
                };

                state.windows.push(win);
                this._render(win);
                this._focus(winId);

                if (app.render) {
                    var body = win.element.querySelector('.window-body');
                    app.render(body, win);
                }

                state.system.appLaunches++;
                Notify.info('🔄 ' + app.title + ' ' + (CONFIG.language === 'en' ? 'opened' : 'geöffnet'));
                return win;
            },

            _render: function(win) {
                var existing = document.getElementById(win.id);
                if (existing) existing.remove();

                var el = document.createElement('div');
                el.id = win.id;
                el.className = 'window active';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.style.pointerEvents = 'auto';

                el.innerHTML =
                    '<div class="window-header">' +
                    '<span class="window-icon">' + win.icon + '</span>' +
                    '<span class="window-title">' + win.title + '</span>' +
                    '<div class="window-controls">' +
                    '<button class="win-btn minimize" data-action="minimize">─</button>' +
                    '<button class="win-btn maximize" data-action="maximize">⧉</button>' +
                    '<button class="win-btn close" data-action="close">✕</button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="window-body"></div>';

                DOM.windowContainer.appendChild(el);
                win.element = el;

                var btns = el.querySelectorAll('.win-btn');
                for (var i = 0; i < btns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var action = btn.dataset.action;
                            if (action === 'close') WindowManager.close(win.id);
                            else if (action === 'minimize') WindowManager.minimize(win.id);
                            else if (action === 'maximize') WindowManager.maximize(win.id);
                        });
                    })(btns[i]);
                }

                this._setupDrag(win, el);
                this._setupResize(win, el);
            },

            _setupDrag: function(win, el) {
                var header = el.querySelector('.window-header');
                var drag = false,
                    startX, startY, origX, origY;

                function startDrag(cx, cy) {
                    drag = true;
                    startX = cx;
                    startY = cy;
                    origX = win.x;
                    origY = win.y;
                    WindowManager._focus(win.id);
                }

                function moveDrag(cx, cy) {
                    if (!drag) return;
                    win.x = clamp(origX + cx - startX, 0, window.innerWidth - win.width);
                    win.y = clamp(origY + cy - startY, 40, window.innerHeight - win.height - 60);
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() { drag = false; }

                header.addEventListener('mousedown', function(e) {
                    if (!e.target.closest('.win-btn')) startDrag(e.clientX, e.clientY);
                });
                document.addEventListener('mousemove', function(e) { if (drag) moveDrag(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    if (!e.target.closest('.win-btn')) startDrag(t.clientX, t.clientY);
                }, { passive: true });
                document.addEventListener('touchmove', function(e) {
                    if (drag && e.touches.length) { var t = e.touches[0];
                        moveDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', endDrag, { passive: true });
            },

            _setupResize: function(win, el) {
                var handle = document.createElement('div');
                handle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:se-resize;touch-action:none;';
                el.appendChild(handle);

                var resize = false,
                    startW, startH, startX2, startY2;

                function startResize(cx, cy) {
                    resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = cx;
                    startY2 = cy;
                }

                function moveResize(cx, cy) {
                    if (!resize) return;
                    win.width = clamp(startW + cx - startX2, 160, window.innerWidth - win.x - 10);
                    win.height = clamp(startH + cy - startY2, 100, window.innerHeight - win.y - 70);
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                handle.addEventListener('mousedown', function(e) { e.stopPropagation();
                    startResize(e.clientX, e.clientY); });
                document.addEventListener('mousemove', function(e) { if (resize) moveResize(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endResize);

                handle.addEventListener('touchstart', function(e) { var t = e.touches[0];
                    e.stopPropagation();
                    startResize(t.clientX, t.clientY); }, { passive: true });
                document.addEventListener('touchmove', function(e) { if (resize && e.touches.length) { var t = e
                            .touches[0];
                        moveResize(t.clientX, t.clientY); } }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            },

            close: function(winId) {
                var idx = -1;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { idx = i; break; }
                }
                if (idx === -1) return;
                var win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) {
                    this._focus(state.windows[state.windows.length - 1].id);
                }
            },

            minimize: function(winId) {
                var win = this._find(winId);
                if (!win) return;
                win.minimized = !win.minimized;
                if (win.element) win.element.classList.toggle('minimized', win.minimized);
                Notify.info(win.minimized ? '⏬ ' + win.title + ' minimiert' : '🔄 ' + win.title + ' wiederhergestellt');
            },

            maximize: function(winId) {
                var win = this._find(winId);
                if (!win || !win.element) return;
                if (win.width === window.innerWidth - 20) {
                    win.width = win._prev.w || 380;
                    win.height = win._prev.h || 280;
                    win.x = win._prev.x || 20;
                    win.y = win._prev.y || 44;
                } else {
                    win._prev = { w: win.width, h: win.height, x: win.x, y: win.y };
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 40;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            },

            _focus: function(winId) {
                var win = this._find(winId);
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    for (var i = 0; i < state.windows.length; i++) {
                        if (state.windows[i].id !== winId && state.windows[i].element) {
                            state.windows[i].element.classList.remove('active');
                        }
                    }
                }
            },

            _find: function(winId) {
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) return state.windows[i];
                }
                return null;
            },

            closeAll: function() {
                var ids = state.windows.map(function(w) { return w.id; });
                for (var i = 0; i < ids.length; i++) this.close(ids[i]);
            }
        };

        // ============================================================
        //  COSMIC 3D WORLD (Three.js)
        // ============================================================
        var cosmicScene, cosmicCamera, cosmicRenderer;
        var cosmicStars = [],
            cosmicPlanets = [];

        function initCosmicWorld() {
            var container = DOM.cosmicContainer;
            var W = container.clientWidth || window.innerWidth;
            var H = container.clientHeight || window.innerHeight;

            cosmicScene = new THREE.Scene();
            cosmicCamera = new THREE.PerspectiveCamera(45, W / H, 0.1, 2000);
            cosmicCamera.position.set(0, 20, 100);

            cosmicRenderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            cosmicRenderer.setSize(W, H);
            cosmicRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(cosmicRenderer.domElement);

            // Sterne
            var starGeo = new THREE.BufferGeometry();
            var starCount = 2000;
            var starPos = new Float32Array(starCount * 3);
            for (var i = 0; i < starCount * 3; i++) {
                starPos[i] = (Math.random() - 0.5) * 2000;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            var starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.6 });
            var stars = new THREE.Points(starGeo, starMat);
            cosmicScene.add(stars);

            // Sonne
            var sunGeo = new THREE.SphereGeometry(6, 32, 32);
            var sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa33 });
            var sun = new THREE.Mesh(sunGeo, sunMat);
            sun.position.set(0, 0, 0);
            cosmicScene.add(sun);

            // Sonnenglow
            var glowGeo = new THREE.SphereGeometry(8, 32, 32);
            var glowMat = new THREE.MeshBasicMaterial({
                color: 0xff6600,
                transparent: true,
                opacity: 0.15
            });
            var glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.set(0, 0, 0);
            cosmicScene.add(glow);

            // Planeten
            var planetColors = [0x44aaff, 0xff6644, 0x44ff88, 0xff44aa, 0xffaa44, 0x88aaff];
            var planetNames = ['Merkur', 'Venus', 'Erde', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptun'];
            for (var p = 0; p < 8; p++) {
                var radius = 1.2 + Math.random() * 2;
                var geo = new THREE.SphereGeometry(radius, 16, 16);
                var mat = new THREE.MeshBasicMaterial({
                    color: planetColors[p % planetColors.length],
                    transparent: true,
                    opacity: 0.7
                });
                var planet = new THREE.Mesh(geo, mat);
                var orbit = 18 + p * 6 + Math.random() * 4;
                var angle = Math.random() * Math.PI * 2;
                planet.position.set(Math.cos(angle) * orbit, (Math.random() - 0.5) * 4, Math.sin(angle) * orbit);
                cosmicScene.add(planet);
                cosmicPlanets.push({
                    mesh: planet,
                    orbit: orbit,
                    angle: angle,
                    speed: 0.002 + (1 - p / 8) * 0.004,
                    yOff: (Math.random() - 0.5) * 4,
                    name: planetNames[p] || 'Planet'
                });
            }

            // Ringe um Sonne
            var ringGeo = new THREE.RingGeometry(8, 9, 64);
            var ringMat = new THREE.MeshBasicMaterial({
                color: 0x4466ff,
                transparent: true,
                opacity: 0.06,
                side: THREE.DoubleSide
            });
            var ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 3;
            cosmicScene.add(ring);

            // Animationsloop
            function animateCosmic() {
                requestAnimationFrame(animateCosmic);

                // Planeten drehen
                for (var i = 0; i < cosmicPlanets.length; i++) {
                    var pl = cosmicPlanets[i];
                    pl.angle += pl.speed;
                    pl.mesh.position.x = Math.cos(pl.angle) * pl.orbit;
                    pl.mesh.position.z = Math.sin(pl.angle) * pl.orbit;
                    pl.mesh.position.y = Math.sin(pl.angle * 1.3) * pl.yOff * 0.5;
                }

                // Sonne pulsieren
                var scale = 1 + Math.sin(Date.now() / 2000) * 0.04;
                sun.scale.set(scale, scale, scale);
                glow.scale.set(scale * 1.3, scale * 1.3, scale * 1.3);

                // Kamera langsam drehen
                var camAngle = Date.now() / 60000;
                cosmicCamera.position.x = Math.sin(camAngle) * 100;
                cosmicCamera.position.z = Math.cos(camAngle) * 100;
                cosmicCamera.lookAt(0, 0, 0);

                cosmicRenderer.render(cosmicScene, cosmicCamera);
            }

            animateCosmic();

            window.addEventListener('resize', function() {
                var w = container.clientWidth || window.innerWidth;
                var h = container.clientHeight || window.innerHeight;
                cosmicCamera.aspect = w / h;
                cosmicCamera.updateProjectionMatrix();

        // ============================================================
        //  LIVING AI AVATAR (Canvas 2D)
        // ============================================================
        function initLivingAI() {
            var container = DOM.livingAI;
            var canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            container.appendChild(canvas);
            container.style.display = 'block';

            var ctx = canvas.getContext('2d');
            var time = 0;

            function drawAvatar() {
                ctx.clearRect(0, 0, 200, 200);

                // Hintergrund-Glow
                var grad = ctx.createRadialGradient(100, 100, 10, 100, 100, 80);
                grad.addColorStop(0, 'rgba(108, 60, 225, 0.15)');
                grad.addColorStop(1, 'rgba(108, 60, 225, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(100, 100, 80, 0, Math.PI * 2);
                ctx.fill();

                // Kopf
                var pulse = Math.sin(time / 20) * 2;
                var headR = 48 + pulse;
                var grad2 = ctx.createRadialGradient(70, 70, 10, 100, 100, headR);
                grad2.addColorStop(0, '#2a1a3a');
                grad2.addColorStop(1, '#0a0a1a');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(100, 100, headR, 0, Math.PI * 2);
                ctx.fill();

                // Augen
                var eyeOff = Math.sin(time / 30) * 1;
                for (var side = -1; side <= 1; side += 2) {
                    var ex = 100 + side * 22 + eyeOff;
                    var ey = 88 + Math.sin(time / 25) * 2;
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, 8, 9, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupille
                    var px = ex + side * 4;
                    var py = ey + 2;
                    ctx.fillStyle = '#1a1a3a';
                    ctx.beginPath();
                    ctx.arc(px, py, 4, 0, Math.PI * 2);
                    ctx.fill();

                    // Glanz
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.arc(ex - side * 3, ey - 2, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Mund
                var mouthY = 118 + Math.sin(time / 15) * 1;
                ctx.strokeStyle = 'rgba(255,100,100,0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(100, mouthY + 4, 10, 0.1, Math.PI - 0.1);
                ctx.stroke();

                // Lächeln-Kurve
                ctx.strokeStyle = 'rgba(255,100,100,0.15)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(100, mouthY + 6, 12, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Wangen
                ctx.fillStyle = 'rgba(255,100,100,0.04)';
                for (var side2 = -1; side2 <= 1; side2 += 2) {
                    ctx.beginPath();
                    ctx.arc(100 + side2 * 34, 96, 12, 0, Math.PI * 2);
                    ctx.fill();
                }

                time++;
                requestAnimationFrame(drawAvatar);
            }

            drawAvatar();
        }

                        '<div style="display:flex;align-items:center;gap:6px;padding:3px 6px;background:rgba(255,255,255,0.02);border-radius:4px;font-size:11px;margin-bottom:2px;cursor:pointer;" onclick="Notify.info(\'🎵 ' +
                        (CONFIG.language === 'en' ? 'Playing' : 'Spiele') + ' ' + playlist[i] +
                        '\')">' +
                        '<span>🎵</span><span>' + playlist[i] + '</span></div>';
                }
                body.innerHTML = html;
            }
        });

        // ----- 16. Wetter -----
        registerApp('weather', {
            title: 'Wetter',
            icon: '🌤️',
            category: 'info',
            render: function(body) {
                body.innerHTML =
                    '<h3 style="font-size:13px;margin-bottom:4px;">🌤️ ' + (CONFIG.language === 'en' ?
                        'Weather' : 'Wetter') +
                    '</h3>' +
                    '<div style="background:rgba(255,255,255,0.02);padding:8px;border-radius:6px;text-align:center;">' +
                    '<div style="font-size:32px;">☀️</div>' +
                    '<div style="font-size:18px;font-weight:600;">18°C</div>' +
                    '<div style="font-size:11px;color:rgba(255,255,255,0.4);">Berlin · ' + (CONFIG
                        .language === 'en' ? 'Sunny' : 'Sonnig') +
                    '</div>' +
                    '<div style="display:flex;justify-content:center;gap:12px;font-size:10px;color:rgba(255,255,255,0.3);margin-top:4px;">' +
                    '<span>💧 65%</span><span>💨 12 km/h</span></div></div>';
            }
        });

        // ----- 17. Karten / Maps -----
        registerApp('maps', {
            title: 'Karten',
            icon: '🗺️',
            category: 'tools',
            render: function(body) {
                body.innerHTML =
                    '<h3 style="font-size:13px;margin-bottom:4px;">🗺️ ' + (CONFIG.language === 'en' ?
                        'Maps' : 'Karten') +
                    '</h3>' +
                    '<div style="background:rgba(0,0,0,0.2);border-radius:6px;height:100px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:rgba(255,255,255,0.3);font-size:11px;">' +
                    '<div style="font-size:28px;">🗺️</div>' +
                    (CONFIG.language === 'en' ? 'Map view' : 'Kartenansicht') +
                    '</div>';
            }
        });

        // ============================================================
        //  BOOT SEQUENCE
        // ============================================================
        function bootSequence() {
            var steps = [
                { text: '⟡ Initializing Cosmic Core ...', progress: 15 },
                { text: '⟡ Loading Kernel v' + CONFIG.kernel + ' ...', progress: 30 },
                { text: '⟡ Activating HalDo AI ...', progress: 45 },
                { text: '⟡ Launching Cosmic 3D World ...', progress: 65 },
                { text: '⟡ Loading Living AI Avatar ...', progress: 80 },
                { text: '⟡ ' + (CONFIG.language === 'en' ? 'System READY 🚀' : 'System BEREIT 🚀'),
                progress: 100 }
            ];

            var i = 0;
            DOM.bootStatus.textContent = steps[0].text;
            DOM.bootProgress.style.width = '2%';

            var interval = setInterval(function() {
                i++;
                if (i < steps.length) {
                    DOM.bootStatus.textContent = steps[i].text;
                    DOM.bootProgress.style.width = steps[i].progress + '%';
                } else {
                    clearInterval(interval);
                    setTimeout(function() {
                        DOM.bootScreen.classList.add('hidden');
                        DOM.desktop.style.display = 'block';
                        state.isBooted = true;
                        state.isReady = true;

                        // Init 3D-Welt
                        initCosmicWorld();

                        // Init Living AI
                        initLivingAI();

                        // Apps starten
                        if (state.settings.autoStartAI !== false) {
                            setTimeout(function() { launchApp('ai'); }, 400);
                            setTimeout(function() { launchApp('cosmic'); }, 700);
                            setTimeout(function() { launchApp('avatar'); }, 1000);
                            setTimeout(function() { launchApp('notes'); }, 1300);
                        }

                        Notify.success('🚀 HalDo OS ' + CONFIG.version + ' ' + (CONFIG.language ===
                            'en' ? 'started!' : 'gestartet!'));
                        console.log('✅ HalDo OS ' + CONFIG.version + ' — COSMIC ULTIMATE');
                        console.log('📱 ' + Object.keys(state.apps).length + ' Apps geladen');
                        console.log('🔄 API Key: ' + (state.settings.apiKey ? '✅ gesetzt' :
                        '❌ nicht gesetzt'));
                    }, 400);
                }
            }, 350);
        }

        // ============================================================
        //  SYSTEM INIT
        // ============================================================

        function updateClock() {
            var now = new Date();
            DOM.clock.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }

        function loadSettings() {
            try {
                var saved = JSON.parse(localStorage.getItem('haldo_settings'));
                if (saved) {
                    for (var key in saved) {
                        if (state.settings.hasOwnProperty(key)) state.settings[key] = saved[key];
                    }
                    CONFIG.language = state.settings.language || 'de';
                    CONFIG.apiKey = state.settings.apiKey || '';
                }
            } catch (e) {}
        }

        function loadData() {
            try {
                var notes = localStorage.getItem('haldo_notes');
                if (notes) state.notes = JSON.parse(notes);
                var contacts = localStorage.getItem('haldo_contacts');
                if (contacts) state.contacts = JSON.parse(contacts);
                var tasks = localStorage.getItem('haldo_tasks');
                if (tasks) state.tasks = JSON.parse(tasks);
                var emails = localStorage.getItem('haldo_emails');
                if (emails) state.emails = JSON.parse(emails);
                var health = localStorage.getItem('haldo_health');
                if (health) state.healthRecords = JSON.parse(health);
                var appointments = localStorage.getItem('haldo_appointments');
                if (appointments) state.appointments = JSON.parse(appointments);
                var conv = localStorage.getItem('haldo_conversations');
                if (conv) state.conversationHistory = JSON.parse(conv);
            } catch (e) {}
        }

        // ============================================================
        //  GLOBAL EXPOSURE
        // ============================================================
        window.HalDo = {
            CONFIG: CONFIG,
            state: state,
            AI: AI,
            Voice: Voice,
            Notify: Notify,
            launchApp: launchApp,
            closeWindow: closeWindow,
            WindowManager: WindowManager,
            version: CONFIG.version,
            resetData: function() {
                if (confirm('Alle Daten löschen?')) { localStorage.clear();
                    location.reload(); }
            }
        };
        window.notify = Notify.show;

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault();
                launchApp('ai'); }
            if (e.key === 'Escape' && state.activeWindow) { closeWindow(state.activeWindow); }
        });

        // ============================================================
        //  MAIN INIT
        // ============================================================

        function init() {
            console.log('⟡ HalDo OS ' + CONFIG.version + ' — COSMIC ULTIMATE');
            console.log('📱 ' + Object.keys(state.apps).length + ' Apps registriert');

            loadSettings();
            loadData();
            Voice.init();
            updateClock();
            setInterval(updateClock, 10000);

            document.getElementById('btn-about').addEventListener('click', function() {
                Notify.show(
                    '⟡ **HalDo OS ' + CONFIG.version + '**\n' +
                    '💙❤️🚀 ' + Object.keys(state.apps).length + ' Apps\n' +
                    '✅ Groq AI ' + (state.settings.apiKey ? '🔑 verbunden' : '⛔ kein Key') +
                    '\n👤 Living AI aktiv\n' +
                    '🌌 Cosmic 3D World\n' +
                    '🏥 Gesundheit integriert\n' +
                    '📞 Telefon integriert\n' +
                    '🌍 ' + (CONFIG.language === 'en' ? 'Language' : 'Sprache') + ': ' + CONFIG
                    .languages[CONFIG.language].name + '\n' +
                    '🔧 Build: ' + CONFIG.build + '\n' +
                    '⏱️ Uptime: ' + Math.floor((Date.now() - state.system.started) / 1000) + 's',
                    'info'
                );
            });

            bootSequence();
            console.log('✅ System bereit!');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
