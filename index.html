    <script>

    (() => {

        "use strict";


        /* =====================================================
           HALDO UI NAMESPACE
           ===================================================== */

        if (!window.HalDoOS) {
            window.HalDoOS = {};
        }


        const UI = {

            version:
                "20.0.0",

            ready:
                false,

            menuOpen:
                false,

            systemOpen:
                false,

            activeApp:
                null,

            activeWindow:
                null

        };


        window.HalDoUI =
            window.HalDoUI ||
            UI;


        window.HalDoOS.ui =
            window.HalDoUI;


        /* =====================================================
           DOM HELPERS
           ===================================================== */

        function $(id) {

            return document.getElementById(id);

        }


        function createElement(
            tag,
            className = "",
            text = ""
        ) {

            const element =
                document.createElement(tag);


            if (className) {

                element.className =
                    className;

            }


            if (text) {

                element.textContent =
                    text;

            }


            return element;

        }


        /* =====================================================
           NOTIFICATION SYSTEM
           ===================================================== */

        function notify(
            title,
            message,
            options = {}
        ) {

            const layer =
                $("haldo-notification-layer");


            if (!layer) {
                return null;
            }


            const notification =
                createElement(
                    "article",
                    "haldo-notification"
                );


            notification.setAttribute(
                "role",
                "status"
            );


            const header =
                createElement(
                    "div",
                    "haldo-notification-header"
                );


            const titleElement =
                createElement(
                    "strong",
                    "haldo-notification-title",
                    String(title || "HalDo")
                );


            const closeButton =
                createElement(
                    "button",
                    "haldo-notification-close",
                    "×"
                );


            closeButton.type =
                "button";


            closeButton.setAttribute(
                "aria-label",
                "Benachrichtigung schließen"
            );


            header.append(
                titleElement,
                closeButton
            );


            const body =
                createElement(
                    "div",
                    "haldo-notification-message",
                    String(message || "")
                );


            notification.append(
                header,
                body
            );


            layer.appendChild(
                notification
            );


            requestAnimationFrame(
                () => {

                    notification.classList.add(
                        "is-visible"
                    );

                }
            );


            const remove =
                () => {

                    notification.classList.remove(
                        "is-visible"
                    );


                    setTimeout(
                        () => {

                            notification.remove();

                        },
                        250
                    );

                };


            closeButton.addEventListener(
                "click",
                remove
            );


            const duration =
                Number.isFinite(
                    Number(options.duration)
                )
                ? Number(options.duration)
                : 4000;


            if (duration > 0) {

                setTimeout(
                    remove,
                    duration
                );

            }


            return notification;

        }


        UI.notify =
            notify;


        /* =====================================================
           APP LAYER
           ===================================================== */

        function getAppLayer() {

            return $(
                "haldo-app-layer"
            );

        }


        function clearAppLayer() {

            const layer =
                getAppLayer();


            if (!layer) {
                return;
            }


            layer
                .querySelectorAll(
                    ".haldo-ui-window"
                )
                .forEach(
                    windowElement => {

                        windowElement.remove();

                    }
                );

        }


        /* =====================================================
           WINDOW SYSTEM FOUNDATION
           ===================================================== */

        let windowSequence =
            0;


        function openAppWindow(
            title,
            content,
            options = {}
        ) {

            const layer =
                getAppLayer();


            if (!layer) {

                console.warn(
                    "[HalDo UI] App-Layer fehlt."
                );

                return null;

            }


            windowSequence += 1;


            const windowId =
                options.id ||
                `haldo-window-${windowSequence}`;


            const windowElement =
                createElement(
                    "section",
                    "haldo-ui-window"
                );


            windowElement.id =
                windowId;


            windowElement.dataset.title =
                title || "HalDo App";


            windowElement.dataset.app =
                options.app ||
                "";


            windowElement.setAttribute(
                "role",
                "dialog"
            );


            windowElement.setAttribute(
                "aria-label",
                title || "HalDo App"
            );


            const header =
                createElement(
                    "header",
                    "haldo-ui-window-header"
                );


            const titleElement =
                createElement(
                    "div",
                    "haldo-ui-window-title",
                    title || "HalDo App"
                );


            const controls =
                createElement(
                    "div",
                    "haldo-ui-window-controls"
                );


            const minimize =
                createElement(
                    "button",
                    "haldo-ui-window-button",
                    "−"
                );


            const maximize =
                createElement(
                    "button",
                    "haldo-ui-window-button",
                    "□"
                );


            const close =
                createElement(
                    "button",
                    "haldo-ui-window-button",
                    "×"
                );


            minimize.type =
                "button";


            maximize.type =
                "button";


            close.type =
                "button";


            minimize.setAttribute(
                "aria-label",
                "Fenster minimieren"
            );


            maximize.setAttribute(
                "aria-label",
                "Fenster maximieren"
            );


            close.setAttribute(
                "aria-label",
                "Fenster schließen"
            );


            controls.append(
                minimize,
                maximize,
                close
            );


            header.append(
                titleElement,
                controls
            );


            const contentElement =
                createElement(
                    "div",
                    "haldo-ui-window-content"
                );


            if (
                content instanceof
                HTMLElement
            ) {

                contentElement.append(
                    content
                );

            } else {

                contentElement.innerHTML =
                    String(
                        content || ""
                    );

            }


            windowElement.append(
                header,
                contentElement
            );


            layer.appendChild(
                windowElement
            );


            UI.activeWindow =
                windowElement;


            UI.activeApp =
                options.app ||
                title ||
                null;


            function activate() {

                layer
                    .querySelectorAll(
                        ".haldo-ui-window"
                    )
                    .forEach(
                        item => {

                            item.classList.remove(
                                "is-active"
                            );

                        }
                    );


                windowElement.classList.add(
                    "is-active"
                );


                UI.activeWindow =
                    windowElement;


                UI.activeApp =
                    options.app ||
                    title ||
                    null;

            }


            windowElement.addEventListener(
                "pointerdown",
                activate
            );


            minimize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    windowElement.classList.toggle(
                        "is-minimized"
                    );

                }
            );


            maximize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    windowElement.classList.toggle(
                        "is-maximized"
                    );

                }
            );


            close.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    closeAppWindow(
                        windowElement
                    );

                }
            );


            activate();


            return windowElement;

        }


        function closeAppWindow(
            windowElement
        ) {

            if (
                !windowElement
            ) {
                return;
            }


            const appName =
                windowElement.dataset.app ||
                windowElement.dataset.title ||
                "";


            windowElement.remove();


            if (
                UI.activeWindow ===
                windowElement
            ) {

                UI.activeWindow =
                    null;

                UI.activeApp =
                    null;

            }


            try {

                const router =
                    window.HalDoAppRouter ||
                    window.HalDoOS?.appRouter;


                if (
                    router &&
                    typeof router.close ===
                    "function"
                ) {

                    router.close(
                        appName
                    );

                }

            } catch (error) {

                console.warn(
                    "[HalDo UI] Router close:",
                    error
                );

            }

        }


        UI.openAppWindow =
            openAppWindow;


        UI.closeAppWindow =
            closeAppWindow;


        /* =====================================================
           SYSTEM PANEL
           ===================================================== */

        function openSystem() {

            UI.systemOpen =
                true;


            let panel =
                $("haldo-system-panel");


            if (!panel) {

                panel =
                    createElement(
                        "section",
                        "haldo-system-panel"
                    );


                panel.id =
                    "haldo-system-panel";


                panel.setAttribute(
                    "role",
                    "dialog"
                );


                panel.setAttribute(
                    "aria-label",
                    "HalDo Systemstatus"
                );


                panel.innerHTML = `

                    <div class="haldo-system-panel-header">

                        <div>

                            <strong>
                                HalDo System
                            </strong>

                            <span>
                                Live Systemstatus
                            </span>

                        </div>

                        <button
                            type="button"
                            id="haldo-system-close"
                            aria-label="System schließen"
                        >
                            ×
                        </button>

                    </div>


                    <div
                        class="haldo-system-panel-grid"
                    >

                        <div
                            class="haldo-system-status-card"
                        >
                            <span>System</span>
                            <strong id="status-system">
                                Prüfe ...
                            </strong>
                        </div>


                        <div
                            class="haldo-system-status-card"
                        >
                            <span>Kernel</span>
                            <strong id="status-kernel">
                                Prüfe ...
                            </strong>
                        </div>


                        <div
                            class="haldo-system-status-card"
                        >
                            <span>AI</span>
                            <strong id="status-ai">
                                Prüfe ...
                            </strong>
                        </div>


                        <div
                            class="haldo-system-status-card"
                        >
                            <span>Apps</span>
                            <strong id="status-apps">
                                Prüfe ...
                            </strong>
                        </div>


                        <div
                            class="haldo-system-status-card"
                        >
                            <span>Netzwerk</span>
                            <strong id="status-network">
                                Prüfe ...
                            </strong>
                        </div>

                    </div>

                `;


                const modalLayer =
                    $("haldo-modal-layer");


                if (modalLayer) {

                    modalLayer.appendChild(
                        panel
                    );

                }


                const closeButton =
                    $("haldo-system-close");


                if (closeButton) {

                    closeButton.addEventListener(
                        "click",
                        closeSystem
                    );

                }

            }


            panel.classList.add(
                "is-open"
            );


            updateSystemStatus();

        }


        function closeSystem() {

            UI.systemOpen =
                false;


            const panel =
                $("haldo-system-panel");


            if (panel) {

                panel.classList.remove(
                    "is-open"
                );

            }

        }


        function updateSystemStatus() {

            const kernel =
                !!(
                    window.HalDoKernel ||
                    window.HalDoOS?.kernel
                );


            const system =
                !!(
                    window.HalDoSystem ||
                    window.HalDoOS?.system
                );


            const appManager =
                !!(
                    window.HalDoAppManager ||
                    window.HalDoOS?.appManager
                );


            const ai =
                !!(
                    window.HalDoAI ||
                    window.HalDoOS?.ai ||
                    window.HalDoAIEngine
                );


            const network =
                navigator.onLine;


            const values = {

                "status-system":
                    system
                    ? "Verbunden"
                    : "Warten",

                "status-kernel":
                    kernel
                    ? "Verbunden"
                    : "Warten",

                "status-ai":
                    ai
                    ? "Verbunden"
                    : "Warten",

                "status-apps":
                    appManager
                    ? "Verbunden"
                    : "Warten",

                "status-network":
                    network
                    ? "Online"
                    : "Offline"

            };


            Object.entries(
                values
            ).forEach(
                ([id, value]) => {

                    const element =
                        $(id);


                    if (element) {

                        element.textContent =
                            value;

                    }

                }
            );


            const homeValues = {

                "home-status-system":
                    system
                    ? "Verbunden"
                    : "Startet",

                "home-status-ai":
                    ai
                    ? "Verbunden"
                    : "Bereit",

                "home-status-network":
                    network
                    ? "Online"
                    : "Offline"

            };


            Object.entries(
                homeValues
            ).forEach(
                ([id, value]) => {

                    const element =
                        $(id);


                    if (element) {

                        element.textContent =
                            value;

                    }

                }
            );

        }


        UI.openSystem =
            openSystem;


        UI.closeSystem =
            closeSystem;


        UI.updateSystemStatus =
            updateSystemStatus;


        /* =====================================================
           HOME / MENU
           ===================================================== */

        function openMenu() {

            UI.menuOpen =
                true;


            const home =
                $("haldo-home");


            if (home) {

                home.classList.add(
                    "is-menu-active"
                );

            }

        }


        function closeMenu() {

            UI.menuOpen =
                false;


            const home =
                $("haldo-home");


            if (home) {

                home.classList.remove(
                    "is-menu-active"
                );

            }

        }


        UI.openMenu =
            openMenu;


        UI.closeMenu =
            closeMenu;


        /* =====================================================
           NETWORK EVENTS
           ===================================================== */

        window.addEventListener(
            "online",
            () => {

                updateSystemStatus();

                notify(
                    "Netzwerk",
                    "HalDo AI OS ist wieder online."
                );

            }
        );


        window.addEventListener(
            "offline",
            () => {

                updateSystemStatus();

                notify(
                    "Netzwerk",
                    "HalDo AI OS arbeitet momentan offline."
                );

            }
        );


        /* =====================================================
           ESCAPE
           ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key !==
                    "Escape"
                ) {
                    return;
                }


                closeSystem();


                const activeWindow =
                    UI.activeWindow;


                if (
                    activeWindow
                ) {

                    closeAppWindow(
                        activeWindow
                    );

                }

            }
        );


        /* =====================================================
           UI READY EVENT
           ===================================================== */

        function markUIReady() {

            UI.ready =
                true;


            window.HalDoOS.ui =
                UI;


            window.dispatchEvent(
                new CustomEvent(
                    "haldo:ui-ready",
                    {
                        detail: UI
                    }
                )
            );


            try {

                const kernel =
                    window.HalDoKernel ||
                    window.HalDoOS?.kernel;


                if (
                    kernel &&
                    typeof kernel.emit ===
                    "function"
                ) {

                    kernel.emit(
                        "ui:ready",
                        UI
                    );

                }

            } catch (error) {

                console.warn(
                    "[HalDo UI] Kernel event:",
                    error
                );

            }

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                markUIReady,
                {
                    once: true
                }
            );

        } else {

            markUIReady();

        }


        console.log(
            "%cHalDo AI OS 20%c UI Foundation geladen.",
            "color:#42e6ff;font-weight:800;",
            "color:#fff;"
        );


    })();

    </script>
        <!-- =========================================================
         HALDO AI OS 20
         AI INTERFACE
         ========================================================= -->

    <script>

    (() => {

        "use strict";


        const UI =
            window.HalDoUI ||
            window.HalDoOS?.ui;


        if (!UI) {

            console.warn(
                "[HalDo AI] UI Foundation noch nicht verfügbar."
            );

            return;

        }


        /* =====================================================
           AI STATE
           ===================================================== */

        const aiState = {

            mode:
                "ready",

            listening:
                false,

            thinking:
                false,

            speaking:
                false,

            busy:
                false

        };


        /* =====================================================
           AI PANEL
           ===================================================== */

        function createAIPanel() {

            let panel =
                document.getElementById(
                    "haldo-ai-panel"
                );


            if (panel) {

                return panel;

            }


            panel =
                document.createElement(
                    "section"
                );


            panel.id =
                "haldo-ai-panel";


            panel.className =
                "haldo-ai-panel";


            panel.setAttribute(
                "role",
                "dialog"
            );


            panel.setAttribute(
                "aria-label",
                "HalDo AI"
            );


            panel.innerHTML = `

                <div
                    class="haldo-ai-panel-header"
                >

                    <div
                        class="haldo-ai-identity"
                    >

                        <div
                            class="haldo-ai-avatar"
                        >

                            <img
                                src="assets/logo/logo.png"
                                alt="HalDo AI"
                                draggable="false"
                            >

                        </div>


                        <div>

                            <strong>
                                HalDo AI
                            </strong>

                            <span
                                id="haldo-ai-state-text"
                            >
                                Bereit · HalDo AI wartet
                            </span>

                        </div>

                    </div>


                    <button
                        id="haldo-ai-close"
                        type="button"
                        aria-label="HalDo AI schließen"
                    >
                        ×
                    </button>

                </div>


                <div
                    id="haldo-ai-messages"
                    class="haldo-ai-messages"
                    aria-live="polite"
                    aria-label="HalDo AI Unterhaltung"
                ></div>


                <div
                    id="haldo-ai-typing"
                    class="haldo-ai-typing"
                    aria-hidden="true"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <form
                    id="haldo-ai-form"
                    class="haldo-ai-form"
                >

                    <textarea
                        id="haldo-ai-input"
                        rows="1"
                        maxlength="12000"
                        placeholder="Sprich mit HalDo AI ..."
                        autocomplete="off"
                        spellcheck="true"
                    ></textarea>


                    <div
                        class="haldo-ai-actions"
                    >

                        <button
                            id="haldo-ai-mic"
                            type="button"
                            aria-label="Spracherkennung starten"
                            title="Mikrofon"
                        >
                            ◉
                        </button>


                        <button
                            id="haldo-ai-send"
                            type="submit"
                            aria-label="Nachricht senden"
                            title="Senden"
                        >
                            ➤
                        </button>

                    </div>

                </form>


                <div
                    class="haldo-ai-footer"
                >

                    <span>
                        HalDo AI OS 20
                    </span>

                    <span>
                        ●
                    </span>

                    <span>
                        AI Interface
                    </span>

                </div>

            `;


            const modalLayer =
                document.getElementById(
                    "haldo-modal-layer"
                );


            if (modalLayer) {

                modalLayer.appendChild(
                    panel
                );

            }


            return panel;

        }


        /* =====================================================
           ELEMENTS
           ===================================================== */

        function getPanel() {

            return createAIPanel();

        }


        function getMessages() {

            return document.getElementById(
                "haldo-ai-messages"
            );

        }


        function getInput() {

            return document.getElementById(
                "haldo-ai-input"
            );

        }


        function getStateText() {

            return document.getElementById(
                "haldo-ai-state-text"
            );

        }


        /* =====================================================
           MESSAGE RENDERING
           ===================================================== */

        function addMessage(
            sender,
            text,
            options = {}
        ) {

            const messages =
                getMessages();


            if (!messages) {
                return null;
            }


            const message =
                document.createElement(
                    "article"
                );


            message.className =
                `haldo-ai-message ${sender}`;


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "haldo-ai-message-content";


            if (
                options.html === true
            ) {

                content.innerHTML =
                    String(text || "");

            } else {

                content.textContent =
                    String(text || "");

            }


            message.appendChild(
                content
            );


            messages.appendChild(
                message
            );


            requestAnimationFrame(
                () => {

                    message.classList.add(
                        "is-visible"
                    );


                    messages.scrollTop =
                        messages.scrollHeight;

                }
            );


            return message;

        }


        /* =====================================================
           AI STATE
           ===================================================== */

        function setAIState(
            mode,
            text
        ) {

            aiState.mode =
                mode ||
                "ready";


            aiState.listening =
                mode ===
                "listening";


            aiState.thinking =
                mode ===
                "thinking";


            aiState.speaking =
                mode ===
                "speaking";


            aiState.busy =
                aiState.listening ||
                aiState.thinking ||
                aiState.speaking;


            const stateText =
                getStateText();


            if (stateText) {

                stateText.textContent =
                    text ||
                    "Bereit · HalDo AI wartet";

            }


            const panel =
                document.getElementById(
                    "haldo-ai-panel"
                );


            if (panel) {

                panel.dataset.state =
                    aiState.mode;

            }


            const typing =
                document.getElementById(
                    "haldo-ai-typing"
                );


            if (typing) {

                typing.classList.toggle(
                    "is-visible",
                    aiState.thinking
                );

            }


            const mic =
                document.getElementById(
                    "haldo-ai-mic"
                );


            if (mic) {

                mic.classList.toggle(
                    "is-active",
                    aiState.listening
                );

            }


            window.dispatchEvent(
                new CustomEvent(
                    "haldo:ai-state",
                    {
                        detail: {
                            ...aiState
                        }
                    }
                )
            );

        }


        /* =====================================================
           OPEN AI
           ===================================================== */

        function openAI() {

            const panel =
                getPanel();


            panel.classList.add(
                "is-open"
            );


            const input =
                getInput();


            if (input) {

                setTimeout(
                    () => input.focus(),
                    150
                );

            }


            setAIState(
                "ready",
                "Bereit · HalDo AI wartet auf dich"
            );

        }


        /* =====================================================
           CLOSE AI
           ===================================================== */

        function closeAI() {

            const panel =
                document.getElementById(
                    "haldo-ai-panel"
                );


            if (panel) {

                panel.classList.remove(
                    "is-open"
                );

            }

        }


        /* =====================================================
           FIND EXISTING AI MODULE
           ===================================================== */

        function findAI() {

            return (

                window.HalDoAI ||

                window.HalDoOS?.ai ||

                window.HalDoAIEngine ||

                window.HalDoAIEngine?.instance ||

                window.HalDoAICore ||

                window.HalDoOS?.aiCore ||

                null

            );

        }


        /* =====================================================
           SEND TO EXISTING AI
           ===================================================== */

        async function sendToHalDoAI(
            text
        ) {

            const ai =
                findAI();


            if (!ai) {

                return null;

            }


            try {

                const methods = [

                    "process",

                    "ask",

                    "chat",

                    "respond",

                    "generate",

                    "handleMessage",

                    "sendMessage"

                ];


                for (
                    const method
                    of methods
                ) {

                    if (
                        typeof ai[method] !==
                        "function"
                    ) {

                        continue;

                    }


                    const result =
                        await ai[method](
                            text
                        );


                    if (
                        typeof result ===
                        "string"
                    ) {

                        return result;

                    }


                    if (
                        result &&
                        typeof result.text ===
                        "string"
                    ) {

                        return result.text;

                    }


                    if (
                        result &&
                        typeof result.response ===
                        "string"
                    ) {

                        return result.response;

                    }

                }

            } catch (error) {

                console.error(
                    "[HalDo AI]",
                    error
                );


                try {

                    if (
                        typeof UI.notify ===
                        "function"
                    ) {

                        UI.notify(
                            "HalDo AI",
                            "Beim Verarbeiten der Anfrage ist ein Fehler aufgetreten."
                        );

                    }

                } catch (_) {}

            }


            return null;

        }


        /* =====================================================
           COMMAND CONNECTION
           ===================================================== */

        async function executeHalDoCommand(
            text
        ) {

            const commands = [

                window.HalDoAICommands,

                window.HalDoCommands,

                window.HalDoOS?.commands

            ];


            for (
                const commandAPI
                of commands
            ) {

                if (!commandAPI) {
                    continue;
                }


                const methods = [

                    "execute",

                    "run",

                    "handle",

                    "process",

                    "executeCommand"

                ];


                for (
                    const method
                    of methods
                ) {

                    if (
                        typeof commandAPI[method] !==
                        "function"
                    ) {

                        continue;

                    }


                    try {

                        const result =
                            await commandAPI[method](
                                text
                            );


                        if (
                            typeof result ===
                            "string" &&
                            result.trim()
                        ) {

                            return result;

                        }


                        if (
                            result &&
                            typeof result.message ===
                            "string"
                        ) {

                            return result.message;

                        }

                    } catch (error) {

                        console.warn(
                            "[HalDo AI Command]",
                            error
                        );

                    }

                }

            }


            return null;

        }


        /* =====================================================
           MESSAGE HANDLER
           ===================================================== */

        async function handleMessage(
            text
        ) {

            text =
                String(
                    text || ""
                ).trim();


            if (!text) {

                return;

            }


            openAI();


            addMessage(
                "user",
                text
            );


            const input =
                getInput();


            if (input) {

                input.value =
                    "";

            }


            setAIState(
                "thinking",
                "HalDo AI denkt ..."
            );


            const commandResult =
                await executeHalDoCommand(
                    text
                );


            if (commandResult) {

                addMessage(
                    "ai",
                    commandResult
                );


                setAIState(
                    "speaking",
                    "HalDo AI antwortet ..."
                );


                speak(
                    commandResult
                );


                return;

            }


            let response =
                await sendToHalDoAI(
                    text
                );


            if (!response) {

                response =
                    "Ich habe deine Nachricht erhalten. " +
                    "Die HalDo-AI-Schnittstelle ist bereit, " +
                    "aber momentan ist noch kein Antwortdienst verbunden.";

            }


            addMessage(
                "ai",
                response
            );


            setAIState(
                "speaking",
                "HalDo AI antwortet ..."
            );


            speak(
                response
            );

        }


        /* =====================================================
           SPEECH RECOGNITION
           ===================================================== */

        let recognition =
            null;


        function setupSpeechRecognition() {

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;


            if (!SpeechRecognition) {

                return false;

            }


            recognition =
                new SpeechRecognition();


            recognition.lang =
                "de-DE";


            recognition.continuous =
                false;


            recognition.interimResults =
                true;


            recognition.onstart =
                () => {

                    setAIState(
                        "listening",
                        "Ich höre zu ..."
                    );

                };


            recognition.onresult =
                event => {

                    let text =
                        "";


                    for (
                        let index =
                            event.resultIndex;

                        index <
                        event.results.length;

                        index++
                    ) {

                        text +=
                            event.results[index][0]
                                .transcript;

                    }


                    const input =
                        getInput();


                    if (input) {

                        input.value =
                            text;

                    }


                    const lastResult =
                        event.results[
                            event.results.length - 1
                        ];


                    if (
                        lastResult &&
                        lastResult.isFinal
                    ) {

                        handleMessage(
                            text
                        );

                    }

                };


            recognition.onerror =
                error => {

                    console.warn(
                        "[HalDo Voice]",
                        error
                    );


                    setAIState(
                        "ready",
                        "Voice bereit"
                    );

                };


            recognition.onend =
                () => {

                    if (
                        !aiState.thinking &&
                        !aiState.speaking
                    ) {

                        setAIState(
                            "ready",
                            "Bereit · HalDo AI wartet"
                        );

                    }

                };


            return true;

        }


        function startListening() {

            if (!recognition) {

                if (
                    !setupSpeechRecognition()
                ) {

                    UI.notify(
                        "Voice",
                        "Die Spracherkennung wird von diesem Browser nicht unterstützt."
                    );


                    return;

                }

            }


            try {

                recognition.start();

            } catch (error) {

                console.warn(
                    "[HalDo Voice]",
                    error
                );

            }

        }


        /* =====================================================
           TEXT TO SPEECH
           ===================================================== */

        function speak(
            text
        ) {

            if (
                !(
                    "speechSynthesis"
                    in window
                )
            ) {

                setAIState(
                    "ready",
                    "Bereit · HalDo AI wartet"
                );


                return;

            }


            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    String(text || "")
                );


            utterance.lang =
                "de-DE";


            utterance.rate =
                0.98;


            utterance.pitch =
                1;


            utterance.onstart =
                () => {

                    setAIState(
                        "speaking",
                        "HalDo AI spricht ..."
                    );

                };


            utterance.onend =
                () => {

                    setAIState(
                        "ready",
                        "Bereit · HalDo AI wartet"
                    );

                };


            utterance.onerror =
                () => {

                    setAIState(
                        "ready",
                        "Bereit · HalDo AI wartet"
                    );

                };


            window.speechSynthesis.speak(
                utterance
            );

        }


        /* =====================================================
           EVENTS
           ===================================================== */

        document.addEventListener(
            "click",
            event => {

                const target =
                    event.target;


                if (
                    target.closest(
                        "#sidebar-ai"
                    ) ||
                    target.closest(
                        "#top-ai"
                    )
                ) {

                    openAI();

                }


                if (
                    target.closest(
                        "#haldo-ai-close"
                    )
                ) {

                    closeAI();

                }


                if (
                    target.closest(
                        "#haldo-ai-mic"
                    )
                ) {

                    startListening();

                }

            }
        );


        document.addEventListener(
            "submit",
            event => {

                if (
                    event.target.id !==
                    "haldo-ai-form"
                ) {

                    return;

                }


                event.preventDefault();


                const input =
                    getInput();


                if (input) {

                    handleMessage(
                        input.value
                    );

                }

            }
        );


        /* =====================================================
           KEYBOARD
           ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "/" &&
                    !event.ctrlKey &&
                    !event.metaKey &&
                    document.activeElement !==
                    getInput()
                ) {

                    event.preventDefault();

                    openAI();

                }


                if (
                    event.key === "Escape"
                ) {

                    closeAI();

                }

            }
        );


        /* =====================================================
           PUBLIC AI API
           ===================================================== */

        UI.openAI =
            openAI;


        UI.closeAI =
            closeAI;


        UI.addMessage =
            addMessage;


        UI.handleMessage =
            handleMessage;


        UI.setAIState =
            setAIState;


        UI.startListening =
            startListening;


        UI.speak =
            speak;


        UI.findAI =
            findAI;


        UI.sendToHalDoAI =
            sendToHalDoAI;


        window.HalDoAIUI =
            UI;


        window.HalDoOS.aiUI =
            UI;


        /* =====================================================
           INITIAL MESSAGE
           ===================================================== */

        function initializeAI() {

            createAIPanel();


            addMessage(
                "ai",
                "Willkommen bei HalDo AI OS 20. " +
                "Ich bin bereit. Wie kann ich dir helfen?"
            );


            setAIState(
                "ready",
                "Bereit · HalDo AI wartet auf dich"
            );


            console.log(
                "%cHalDo AI%c Interface bereit.",
                "color:#42e6ff;font-weight:800;",
                "color:#fff;"
            );

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeAI,
                {
                    once: true
                }
            );

        } else {

            initializeAI();

        }


    })();

    </script>
