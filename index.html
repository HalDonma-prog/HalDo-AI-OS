<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050816">
    <title>HalDo AI OS — Professional Universe</title>

    <style>
        /* =========================================================
           HALDO AI OS — KOMPLETTE STYLES (dein Original + Erweiterungen)
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --haldo-gold: #ffd54b;
            --haldo-gold-dark: #ff9f1c;
            --haldo-bg: #02030a;
            --haldo-surface: rgba(10,14,30,0.92);
            --haldo-border: rgba(255,255,255,.08);
            --haldo-text: #ffffff;
            --haldo-radius: 16px;
            --haldo-shadow: 0 20px 60px rgba(0,0,0,.5);
            --haldo-font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--haldo-bg);
            color: var(--haldo-text);
            font-family: var(--haldo-font);
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea, select { font: inherit; }
        button { border: 0; outline: none; cursor: pointer; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }

        #haldo-os {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, rgba(35,73,150,.16), transparent 30%),
                        radial-gradient(circle at 20% 20%, rgba(70,110,255,.08), transparent 30%),
                        radial-gradient(circle at 80% 80%, rgba(150,70,255,.07), transparent 32%),
                        var(--haldo-bg);
        }

        .haldo-cosmic-world {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(circle at center, rgba(15,30,75,.28), transparent 42%);
        }

        .haldo-space {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.025), transparent 52%);
        }

        .haldo-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .haldo-star {
            position: absolute;
            display: block;
            border-radius: 50%;
            background: rgba(255,255,255,.95);
            box-shadow: 0 0 5px rgba(255,255,255,.9);
            animation: haldo-star-twinkle var(--star-speed, 4s) ease-in-out infinite;
            animation-delay: var(--star-delay, 0s);
        }

        @keyframes haldo-star-twinkle {
            0%, 100% { opacity: .2; transform: scale(.7); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        .haldo-cosmic-center {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(92vw, 950px);
            height: min(92vw, 950px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .haldo-galaxy-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .haldo-orbit-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(120,175,255,.12);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(70,150,255,.04);
            animation: haldo-ring-pulse 8s ease-in-out infinite;
        }

        @keyframes haldo-ring-pulse {
            0%, 100% { opacity: .4; }
            50% { opacity: .8; }
        }

        .haldo-orbit-ring-1 { width: 10%; height: 10%; }
        .haldo-orbit-ring-2 { width: 17%; height: 17%; transform: translate(-50%, -50%) rotate(15deg); }
        .haldo-orbit-ring-3 { width: 24%; height: 24%; transform: translate(-50%, -50%) rotate(-10deg); }
        .haldo-orbit-ring-4 { width: 32%; height: 32%; transform: translate(-50%, -50%) rotate(22deg); }
        .haldo-orbit-ring-5 { width: 40%; height: 40%; transform: translate(-50%, -50%) rotate(-8deg); }
        .haldo-orbit-ring-6 { width: 48%; height: 48%; transform: translate(-50%, -50%) rotate(30deg); }
        .haldo-orbit-ring-7 { width: 56%; height: 56%; transform: translate(-50%, -50%) rotate(-14deg); }
        .haldo-orbit-ring-8 { width: 64%; height: 64%; transform: translate(-50%, -50%) rotate(20deg); }
        .haldo-orbit-ring-9 { width: 72%; height: 72%; transform: translate(-50%, -50%) rotate(-25deg); }
        .haldo-orbit-ring-10 { width: 80%; height: 80%; transform: translate(-50%, -50%) rotate(12deg); }
        .haldo-orbit-ring-11 { width: 88%; height: 88%; transform: translate(-50%, -50%) rotate(-18deg); }
        .haldo-orbit-ring-12 { width: 96%; height: 96%; transform: translate(-50%, -50%) rotate(28deg); }

        .haldo-planet-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .haldo-planet-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: haldo-orbit-spin var(--orbit-speed, 20s) linear infinite;
            animation-direction: var(--orbit-direction, normal);
        }

        @keyframes haldo-orbit-spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .haldo-planet {
            position: absolute;
            left: 50%;
            top: 0;
            width: var(--planet-size, 14px);
            height: var(--planet-size, 14px);
            margin-left: calc(var(--planet-size, 14px) / -2);
            margin-top: calc(var(--planet-size, 14px) / -2);
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            background: var(--planet-bg, radial-gradient(circle at 35% 30%, #ffffff, #8fc8ff 28%, #3263bd 62%, #0d1c43 100%));
            box-shadow: 0 0 var(--planet-glow-size, 10px) var(--planet-glow, rgba(80,170,255,.6));
            animation: haldo-planet-pulse 3s ease-in-out infinite;
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .haldo-planet:hover {
            transform: scale(1.3);
            box-shadow: 0 0 25px var(--planet-glow, rgba(80,170,255,.8));
            z-index: 100;
        }

        @keyframes haldo-planet-pulse {
            0%, 100% { filter: brightness(.9); }
            50% { filter: brightness(1.15); }
        }

        .haldo-planet-1 { --planet-size: 10px; --planet-bg: radial-gradient(circle at 35% 30%, #ddd, #8a8a8a 55%, #444); --planet-glow: rgba(200,200,200,.4); --planet-glow-size: 8px; }
        .haldo-planet-2 { --planet-size: 14px; --planet-bg: radial-gradient(circle at 35% 30%, #ffecb3, #d4a843 50%, #8a5a1a); --planet-glow: rgba(255,200,100,.5); --planet-glow-size: 12px; }
        .haldo-planet-3 { --planet-size: 18px; --planet-bg: radial-gradient(circle at 35% 30%, #b8f2ff 0%, #2b91df 23%, #1264ad 58%, #062b61 100%); --planet-glow: rgba(50,180,255,.8); --planet-glow-size: 16px; }
        .haldo-planet-3::after { content: ''; position: absolute; width: 40%; height: 22%; left: 20%; top: 28%; border-radius: 60% 40% 55% 45%; background: rgba(60,200,100,.7); transform: rotate(-15deg); }
        .haldo-planet-3 .moon-orbit { position: absolute; left: 50%; top: 50%; width: 220%; height: 220%; transform: translate(-50%, -50%); border-radius: 50%; animation: moon-orbit-spin 3.8s linear infinite; }
        .haldo-planet-3 .moon { position: absolute; left: 50%; top: -4px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b0b8c5 55%, #666); box-shadow: 0 0 6px rgba(255,255,255,.5); }
        @keyframes moon-orbit-spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .haldo-planet-4 { --planet-size: 14px; --planet-bg: radial-gradient(circle at 35% 30%, #ffc4a0, #c94a2a 50%, #6b1a10); --planet-glow: rgba(255,100,60,.6); --planet-glow-size: 12px; }
        .haldo-planet-5 { --planet-size: 32px; --planet-bg: repeating-linear-gradient(0deg, #e8c8a0 0 6px, #b0885a 6px 10px, #d8b888 10px 14px); --planet-glow: rgba(255,200,150,.4); --planet-glow-size: 18px; }
        .haldo-planet-6 { --planet-size: 28px; --planet-bg: radial-gradient(circle at 35% 30%, #f5e0b0, #c8a050 55%, #7a5a2a); --planet-glow: rgba(255,210,120,.4); --planet-glow-size: 16px; }
        .haldo-planet-6::before { content: ''; position: absolute; left: 50%; top: 50%; width: 200%; height: 35%; transform: translate(-50%, -50%) rotate(-18deg); border: 2px solid rgba(200,180,140,.6); border-radius: 50%; box-shadow: 0 0 10px rgba(200,180,140,.2); }
        .haldo-planet-7 { --planet-size: 22px; --planet-bg: radial-gradient(circle at 35% 30%, #c8f5ff, #5ab0c8 50%, #1a5a6a); --planet-glow: rgba(100,220,255,.5); --planet-glow-size: 14px; }
        .haldo-planet-8 { --planet-size: 22px; --planet-bg: radial-gradient(circle at 35% 30%, #8ab8ff, #3a5ab8 50%, #1a2a5a); --planet-glow: rgba(80,120,255,.6); --planet-glow-size: 14px; }
        .haldo-planet-9 { --planet-size: 10px; --planet-bg: radial-gradient(circle at 35% 30%, #ddd8c8, #9a8a7a 55%, #4a3a2a); --planet-glow: rgba(200,180,160,.3); --planet-glow-size: 8px; }
        .haldo-planet-10 { --planet-size: 16px; --planet-bg: radial-gradient(circle at 35% 30%, #ffd8e8, #c85a8a 50%, #6a1a3a); --planet-glow: rgba(255,100,180,.5); --planet-glow-size: 12px; }
        .haldo-planet-11 { --planet-size: 12px; --planet-bg: radial-gradient(circle at 35% 30%, #aaffd0, #3a9a6a 50%, #1a4a2a); --planet-glow: rgba(80,255,150,.4); --planet-glow-size: 10px; }
        .haldo-planet-12 { --planet-size: 14px; --planet-bg: radial-gradient(circle at 35% 30%, #e8d0ff, #8a5ac8 50%, #3a1a6a); --planet-glow: rgba(180,120,255,.5); --planet-glow-size: 12px; }

        .haldo-sun-container {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(220px, 28vw, 360px);
            height: clamp(220px, 28vw, 360px);
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: auto;
            cursor: pointer;
        }

        .haldo-sun-core {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 30px rgba(255,220,70,.95), 0 0 80px rgba(255,165,40,.72), 0 0 150px rgba(255,100,20,.38), 0 0 250px rgba(255,80,0,.15);
            animation: haldo-sun-pulse 4s ease-in-out infinite;
        }

        @keyframes haldo-sun-pulse {
            0%, 100% { transform: scale(.98); box-shadow: 0 0 25px rgba(255,220,70,.9); }
            50% { transform: scale(1.035); box-shadow: 0 0 40px rgba(255,220,70,1), 0 0 100px rgba(255,165,40,.8); }
        }

        .haldo-sun-rays {
            position: absolute;
            inset: -45%;
            border-radius: 50%;
            pointer-events: none;
            background: repeating-conic-gradient(from 0deg,
                rgba(255,246,180,.0) 0deg,
                rgba(255,246,180,.0) .65deg,
                rgba(255,224,94,.7) .9deg,
                rgba(255,160,35,.15) 1.2deg,
                rgba(255,246,180,.0) 1.8deg,
                rgba(255,246,180,.0) 2.2deg
            );
            mask-image: radial-gradient(circle, transparent 0 48%, #000 49% 53%, transparent 55%);
            -webkit-mask-image: radial-gradient(circle, transparent 0 48%, #000 49% 53%, transparent 55%);
            animation: haldo-sun-rays-spin 35s linear infinite;
        }

        @keyframes haldo-sun-rays-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .haldo-sun-aura {
            position: absolute;
            inset: -20%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,240,130,.25), rgba(255,174,35,.1) 38%, rgba(255,100,30,.04) 58%, transparent 72%);
            filter: blur(20px);
            animation: haldo-sun-aura-pulse 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes haldo-sun-aura-pulse {
            0%, 100% { transform: scale(.92); opacity: .6; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        .haldo-logo-in-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 42%;
            height: 42%;
            transform: translate(-50%, -50%);
            z-index: 60;
            border-radius: 50%;
            pointer-events: none;
        }

        .haldo-logo-in-sun img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px rgba(255,255,255,.85)) drop-shadow(0 0 30px rgba(255,205,70,.9));
            animation: haldo-logo-living 4.2s ease-in-out infinite;
        }

        @keyframes haldo-logo-living {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.02) rotate(0.5deg); }
            50% { transform: scale(1.035) rotate(0deg); }
            75% { transform: scale(1.01) rotate(-0.5deg); }
        }

        .haldo-living-avatar {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 55%;
            height: 55%;
            transform: translate(-50%, -50%);
            z-index: 40;
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .haldo-living-avatar .avatar-aura {
            position: absolute;
            inset: -12%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.2), rgba(255,220,100,.12) 35%, rgba(100,190,255,.06) 55%, transparent 75%);
            filter: blur(10px);
            animation: haldo-avatar-aura 3.5s ease-in-out infinite;
        }

        @keyframes haldo-avatar-aura {
            0%, 100% { opacity: .4; transform: scale(.9); }
            50% { opacity: .9; transform: scale(1.08); }
        }

        .haldo-living-avatar img {
            position: relative;
            z-index: 4;
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 0 8px rgba(255,255,255,.7)) drop-shadow(0 0 22px rgba(255,205,70,.6));
            transition: all .3s ease;
        }

        .haldo-living-avatar[data-state="idle"] img { animation: haldo-avatar-idle 4.8s ease-in-out infinite; }
        .haldo-living-avatar[data-state="listening"] img { animation: haldo-avatar-listening 1.6s ease-in-out infinite; }
        .haldo-living-avatar[data-state="thinking"] img { animation: haldo-avatar-thinking 2.2s ease-in-out infinite; }
        .haldo-living-avatar[data-state="speaking"] img { animation: haldo-avatar-speaking .6s ease-in-out infinite; }
        .haldo-living-avatar[data-state="happy"] img { animation: haldo-avatar-happy .7s ease-out 1; }

        @keyframes haldo-avatar-idle {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            25% { transform: translateY(-2px) scale(1.01) rotate(0.3deg); }
            50% { transform: translateY(0) scale(1.015) rotate(0deg); }
            75% { transform: translateY(1px) scale(1.005) rotate(-0.3deg); }
        }

        @keyframes haldo-avatar-listening {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes haldo-avatar-thinking {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }

        @keyframes haldo-avatar-speaking {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.045); }
        }

        @keyframes haldo-avatar-happy {
            0% { transform: scale(.92); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .haldo-living-avatar .hand {
            position: absolute;
            width: 16%;
            height: 16%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.35), rgba(255,200,100,.12) 50%, transparent 70%);
            filter: blur(1px);
            opacity: .4;
            animation: haldo-hand-move 3.8s ease-in-out infinite;
        }

        .haldo-living-avatar .hand-left { left: -2%; top: 35%; animation-delay: 0s; }
        .haldo-living-avatar .hand-right { right: -2%; top: 35%; animation-delay: 1.9s; }

        @keyframes haldo-hand-move {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(0, -6px) scale(1.08); }
        }

        .haldo-living-avatar .mouth {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 20%;
            height: 5%;
            border-radius: 50%;
            background: rgba(255,200,150,.25);
            border: 1px solid rgba(255,255,255,.08);
            transition: all .1s ease;
        }

        .haldo-living-avatar[data-state="speaking"] .mouth {
            animation: haldo-mouth-speak .3s ease-in-out infinite alternate;
        }

        @keyframes haldo-mouth-speak {
            0% { height: 4%; transform: translateX(-50%) scaleY(.7); }
            100% { height: 11%; transform: translateX(-50%) scaleY(1.2); }
        }

        .haldo-living-avatar .eyes {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 11%;
            display: flex;
            justify-content: space-between;
        }

        .haldo-living-avatar .eye {
            width: 28%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.06);
            position: relative;
        }

        .haldo-living-avatar .eye::after {
            content: '';
            position: absolute;
            width: 32%;
            height: 32%;
            border-radius: 50%;
            background: rgba(255,220,100,.5);
            top: 30%;
            left: 30%;
            transition: all .3s ease;
        }

        .haldo-living-avatar[data-state="listening"] .eye::after {
            animation: haldo-eye-listen 1.2s ease-in-out infinite;
        }

        .haldo-living-avatar[data-state="thinking"] .eye::after {
            animation: haldo-eye-think 1.8s ease-in-out infinite;
        }

        @keyframes haldo-eye-listen {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        @keyframes haldo-eye-think {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(4px, -3px); }
        }

        .haldo-os-logo-text {
            position: absolute;
            left: 50%;
            top: 62%;
            transform: translateX(-50%);
            z-index: 70;
            font-size: clamp(14px, 2vw, 28px);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffd54b, #ff9f1c, #ffd54b, #ff6b00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: haldo-logo-text-glow 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255,200,80,.3), 0 0 60px rgba(255,200,80,.15);
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes haldo-logo-text-glow {
            0%, 100% { background-position: 0% 50%; filter: drop-shadow(0 0 10px rgba(255,200,80,.2)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 25px rgba(255,200,80,.5)); }
        }

        .haldo-os-logo-text .haldo-highlight {
            color: #fff;
            -webkit-text-fill-color: #fff;
            background: none;
            text-shadow: 0 0 20px rgba(255,255,255,.5), 0 0 40px rgba(255,200,80,.3);
        }

        .haldo-secret-clock {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 80;
            font-size: 11px;
            font-family: monospace;
            opacity: .4;
            text-align: right;
            pointer-events: none;
            color: rgba(255,200,80,.6);
            text-shadow: 0 0 10px rgba(255,200,80,.1);
            transition: opacity .3s ease;
        }

        .haldo-secret-clock:hover { opacity: .8; }

        .haldo-menu-button {
            position: fixed;
            z-index: 9500;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(8,12,30,0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all .25s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,.3);
        }

        .haldo-menu-button:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,.12);
            border-color: rgba(255,200,80,.3);
        }

        .haldo-menu-button img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
        }

        .haldo-menu-button.system { top: 16px; left: 16px; }
        .haldo-menu-button.apps { bottom: 16px; left: 50%; transform: translateX(-50%); }
        .haldo-menu-button.apps:hover { transform: translateX(-50%) scale(1.05); }

        .haldo-menu-panel {
            position: fixed;
            z-index: 9600;
            width: min(420px, calc(100vw - 24px));
            max-height: min(75vh, calc(100dvh - 100px));
            overflow-y: auto;
            padding: 16px;
            border-radius: 20px;
            background: var(--haldo-surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--haldo-border);
            box-shadow: var(--haldo-shadow);
            opacity: 0;

        // =========================================================
        // 1. STARS GENERATOR
        // =========================================================

        function generateStars() {
            const stars = document.getElementById("haldo-stars");
            if (!stars) return;
            stars.innerHTML = "";
            const count = Math.min(400, Math.max(200, Math.floor(window.innerWidth * window.innerHeight / 6000)));
            for (let i = 0; i < count; i++) {
                const star = document.createElement("span");
                star.className = "haldo-star";
                const size = Math.random() * 3 + 0.5;
                star.style.width = size + "px";
                star.style.height = size + "px";
                star.style.left = Math.random() * 100 + "%";
                star.style.top = Math.random() * 100 + "%";
                star.style.setProperty('--star-speed', (2 + Math.random() * 6) + 's');
                star.style.setProperty('--star-delay', (Math.random() * 6) + 's');
                stars.appendChild(star);
            }
        }

        // =========================================================
        // 2. TIME DISPLAY
        // =========================================================

        function updateTimeDisplay() {
            const el = document.getElementById("haldo-time-display");
            if (el) el.textContent = new Date().toLocaleTimeString();
        }

        function updatePlanetClock() {
            const clockEl = document.getElementById("haldo-clock-display");
            const planetEl = document.getElementById("haldo-planet-time");
            if (!clockEl) return;

            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            const planetSeconds = (now.getTime() / 1000) % 86400;
            const planetHours = Math.floor(planetSeconds / 3600);
            const planetMinutes = Math.floor((planetSeconds % 3600) / 60);
            const planetSecs = Math.floor(planetSeconds % 60);

            const ph = String(planetHours).padStart(2, '0');
            const pm = String(planetMinutes).padStart(2, '0');
            const ps = String(planetSecs).padStart(2, '0');

            clockEl.textContent = `${h}:${m}:${s}`;
            const dayProgress = ((planetSeconds / 86400) * 100).toFixed(1);
            const planetNames = ['Merkur', 'Venus', 'Erde', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptun', 'Pluto', 'HalDo', 'Nova', 'Astra'];
            const currentPlanet = planetNames[Math.floor(planetSeconds / 7200) % 12];

            if (planetEl) {
                planetEl.textContent = `🌍 ${currentPlanet} · ${ph}:${pm}:${ps} · Tag ${Math.floor(dayProgress)}%`;
            }
        }

        window.HalDo = window.HalDo || {};
        window.HalDo.events = window.HalDo.events || new EventTarget();

        window.HalDo.emit = function(name, detail = {}) {
            window.HalDo.events.dispatchEvent(new CustomEvent(name, { detail }));
        };

        window.HalDo.on = function(name, callback) {
            if (typeof callback !== "function") return;
            window.HalDo.events.addEventListener(name, callback);
        };

        // =========================================================
        // 4. STORAGE
        // =========================================================

        window.HalDo.Storage = {
            prefix: "haldo_",

            get(key, defaultValue = null) {
                try {
                    const value = localStorage.getItem(this.prefix + key);
                    if (value === null) return defaultValue;
                    try { return JSON.parse(value); } catch(e) { return value; }
                } catch(e) { return defaultValue; }
            },

            set(key, value) {
                try {
                    localStorage.setItem(this.prefix + key, JSON.stringify(value));
                    return true;
                } catch(e) { return false; }
            },

            remove(key) {
                try {
                    localStorage.removeItem(this.prefix + key);
                    return true;
                } catch(e) { return false; }
            },

            getAll() {
                const result = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try {
                            result[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k));
                        } catch(e) {
                            result[k.replace(this.prefix, '')] = localStorage.getItem(k);
                        }
                    });
                } catch(e) {}
                return result;
            }
        };

            getKnowledge(topic, lang = 'de') {
                const topicLower = topic.toLowerCase();
                if (this.knowledgeBase[topicLower] && this.knowledgeBase[topicLower][lang]) {
                    return this.knowledgeBase[topicLower][lang];
                }
                for (const [key, value] of Object.entries(this.knowledgeBase)) {
                    if (topicLower.includes(key) || key.includes(topicLower)) {
                        if (value[lang]) return value[lang];
                        if (value['de']) return value['de'];
                    }
                }
                return null;
            },

            detectLanguage(text) {
                const lower = text.toLowerCase();
                if (/[äöüß]/.test(lower) || /\b(der|die|das|und|ich|nicht|ist|mir|dir)\b/.test(lower)) return 'de';
                if (/\b(the|and|you|are|what|how|can|please|would|could|should)\b/.test(lower)) return 'en';
                if (/[ەێڵگڕۆ]/.test(lower) || /\b(silav|rojbaş|spas|kurdî|ezidi|çi|tu|ez|em|hûn|malbat|heval|xwendin|nivîsîn|gotin|jîyan|xewn|bi xatirê te|roja baş|şev baş)\b/.test(lower)) return 'ku';
                if (/[بتثجحخ]/.test(lower) || /\b(مرحبا|شكرا|كيف|سلام|السلام|هل|ما)\b/.test(lower)) return 'ar';
                if (/\b(merhaba|nasılsın|teşekkür|iyi|günaydın|hoş|ben|sen|o)\b/.test(lower)) return 'tr';
                if (/\b(bonjour|merci|comment|français|ça|oui|non|je|tu|il|elle)\b/.test(lower)) return 'fr';
                if (/\b(hola|gracias|cómo|español|buenos|días|yo|tú|él|ella)\b/.test(lower)) return 'es';
                if (/\b(ciao|grazie|come|italiano|buongiorno|io|tu|lui|lei)\b/.test(lower)) return 'it';
                if (/[А-Яа-я]/.test(lower) || /\b(привет|спасибо|как|дела|я|ты|он|она)\b/.test(lower)) return 'ru';
                if (/[آابپتثجچ]/.test(lower) || /\b(سلام|خوب|مرسی|من|تو|او|ما)\b/.test(lower)) return 'fa';
                return 'de';
            },

                    };
                    const dict = simpleDict[targetLang] || {};
                    for (const [key, value] of Object.entries(dict)) {

            startLipSync(audioElement) {
                if (!audioElement) return;
                const avatar = document.getElementById('haldo-living-avatar');
                if (!avatar) return;

                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const source = ctx.createMediaElementSource(audioElement);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                analyser.connect(ctx.destination);

                const data = new Uint8Array(analyser.frequencyBinCount);
                let frameId = null;
                let isActive = true;

                function animateMouth() {
                    if (!isActive) return;
                    analyser.getByteFrequencyData(data);
                    const avg = data.reduce((a, b) => a + b, 0) / data.length;
                    const intensity = Math.min(1, avg / 128);
                    const mouth = avatar.querySelector('.mouth');
                    if (mouth) {
                        const scaleY = 0.7 + intensity * 1.1;
                        const height = 4 + intensity * 12;
                        mouth.style.transform = `translateX(-50%) scaleY(${scaleY})`;
                        mouth.style.height = height + '%';
                    }
                    frameId = requestAnimationFrame(animateMouth);
                }

                animateMouth();

                audioElement.addEventListener('ended', () => {
                    isActive = false;
                    if (frameId) cancelAnimationFrame(frameId);
                    const mouth = avatar.querySelector('.mouth');
                    if (mouth) {
                        mouth.style.transform = 'translateX(-50%) scaleY(1)';
                        mouth.style.height = '5%';
                    }
                    avatar.dataset.state = 'idle';
                });

                avatar.dataset.state = 'speaking';
                return () => {
                    isActive = false;
                    if (frameId) cancelAnimationFrame(frameId);
                };
            },

            async ask(text, options = {}) {
                this.init();
                const clean = String(text || "").trim();
                if (!clean) return this.translate("🌌 Bitte sag mir, was ich für dich tun kann.", options.lang || 'de');

                const lower = clean.toLowerCase();
                const detectedLang = this.detectLanguage(clean);
                const lang = options.lang || detectedLang || 'de';

                // === CACHE ===
                const cacheKey = clean + '_' + lang;
                if (this.responseCache[cacheKey]) {
                    return this.responseCache[cacheKey];
                }

                // === WISSEN ===
                const knowledge = this.getKnowledge(clean, lang);
                if (knowledge) {
                    this.responseCache[cacheKey] = knowledge;
                    if (Object.keys(this.responseCache).length > this.maxCacheSize) {
                        const keys = Object.keys(this.responseCache);
                        delete this.responseCache[keys[0]];
                    }
                    this.reactAvatar('thinking');
                    setTimeout(() => this.reactAvatar('idle'), 1000);
                    return knowledge;
                }

                // === APP ÖFFNEN ===
                if (lower.includes("öffne") || lower.includes("open") || lower.includes("starte") || lower.includes("zeige")) {
                    const match = lower.match(/(?:öffne|open|starte|zeige)\s+(.+)/);
                    if (match) {
                        const appName = match[1].trim();
                        const app = window.HalDo.AppRegistry?.getAll().find(a =>
                            (a.name && a.name.toLowerCase().includes(appName)) ||
                            (a.id && a.id.toLowerCase().includes(appName))
                        );
                        if (app) {
                            window.HalDo.AppManager?.open(app.id);
                            this.reactAvatar('happy');
                            setTimeout(() => this.reactAvatar('idle'), 800);
                            const response = this.translate(`🌌 Ich öffne "${app.name || app.id}" für dich.`, lang);
                            this.responseCache[cacheKey] = response;
                            return response;
                        }
                        const available = window.HalDo.AppRegistry?.getAll().map(a => a.name || a.id).join(', ') || 'Keine';
                        const response = this.translate(`🌌 Ich konnte "${appName}" nicht finden. Verfügbare Apps: ${available}`, lang);
                        this.responseCache[cacheKey] = response;
                        return response;
                    }
                }

                // === APP SCHLIESSEN ===
                if (lower.includes("schließe") || lower.includes("close") || lower.includes("beende")) {
                    const match = lower.match(/(?:schließe|close|beende)\s+(.+)/);
                    if (match) {
                        const appName = match[1].trim();
                        const app = window.HalDo.AppRegistry?.getAll().find(a =>
                            (a.name && a.name.toLowerCase().includes(appName)) ||
                            (a.id && a.id.toLowerCase().includes(appName))
                        );
                        if (app && window.HalDo.AppManager?.activeApps.has(app.id)) {
                            window.HalDo.AppManager?.close(app.id);
                            const response = this.translate(`🌌 Ich schließe "${app.name || app.id}".`, lang);
                            this.responseCache[cacheKey] = response;
                            return response;
                        }
                        const response = this.translate(`🌌 Die App "${appName}" ist nicht geöffnet.`, lang);
                        this.responseCache[cacheKey] = response;
                        return response;
                    }
                }

                // === HILFE ===
                if (lower.includes("hilfe") || lower.includes("help") || lower.includes("was kannst du") || lower.includes("fähigkeiten")) {
                    const response = this.translate(
                        `🌌 Ich bin HalDo AI (Professional Universe Edition) und kann dir helfen mit:\n\n` +
                        `📱 Apps öffnen und schließen\n` +
                        `🗣️ ALLE Fragen beantworten (egal was!)\n` +
                        `🌍 ${this.languages.length} Sprachen sprechen\n` +
                        `✍️ Texte schreiben, korrigieren und verbessern\n` +
                        `🌍 Übersetzen in alle Sprachen\n` +
                        `🎙️ Spracheingabe und Sprachausgabe\n` +
                        `📊 Systemstatus abfragen\n` +
                        `🧮 Rechnen und Mathematik\n` +
                        `😂 Witze erzählen\n` +
                        `🎬 Video-Bearbeitung (4K, 8K, HD, 3D)\n` +
                        `📚 Wissen über ALLES!\n\n` +
                        `💡 Frag mich einfach was du willst – ich beantworte ALLES! 🌌`,
                        lang
                    );
                    this.responseCache[cacheKey] = response;
                    return response;
                }

                // === STATUS ===
                if (lower.includes("status") || lower.includes("system") || lower.includes("info") || lower.includes("version")) {
                    const apps = window.HalDo.AppRegistry?.getAll().length || 0;
                    const response = this.translate(
                        `📊 Systemstatus:\n` +
                        `• Version: ${window.HALDO_VERSION} ${window.HALDO_BUILD}\n` +
                        `• Apps: ${apps} registriert\n` +
                        `• AI Core: ✅ Aktiv (Professional)\n` +
                        `• Sprachen: ${this.languages.length} unterstützt\n` +
                        `• Wissen: ${Object.keys(this.knowledgeBase).length} Einträge\n` +
                        `• Uptime: ${Math.floor((Date.now() - window._haldoStartTime) / 1000)}s`,
                        lang
                    );
                    this.responseCache[cacheKey] = response;
                    return response;
                }

                // === ZEIT ===
                if (lower.includes("zeit") || lower.includes("uhr") || lower.includes("wie spät")) {
                    const response = this.translate(`🕐 Es ist ${new Date().toLocaleTimeString()}`, lang);
                    this.responseCache[cacheKey] = response;
                    return response;
                }

                if (lower.includes("datum") || lower.includes("welcher tag") || lower.includes("heute")) {
                    const response = this.translate(`📅 Heute ist ${new Date().toLocaleDateString('de-DE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`, lang);

                // === WETTER ===
                if (lower.includes("wetter") || lower.includes("temperatur")) {

                    const response = this.translate(
                        `🌤️ Wetter heute:\n${conditions[Math.floor(Math.random() * conditions.length)]}\n🌡️ ${Math.floor(Math.random()*15+15)}°C\n💨 Wind: ${Math.floor(Math.random()*20+5)} km/h`,
                        lang
                    );
                    this.responseCache[cacheKey] = response;
                    return response;
                }

                // === RECHNEN ===
                if (lower.includes("rechne") || lower.includes("berechnen") || lower.includes("plus") || lower.includes("minus") ||
                    lower.includes("mal") || lower.includes("geteilt") || lower.includes("durch")) {
                    try {
                        let math = lower.replace(/rechne|berechnen|ist|gleich|ergibt/g, '')
                            .replace(/plus/g, '+').replace(/minus/g, '-')
                            .replace(/mal|×/g, '*').replace(/geteilt|durch|÷/g, '/')
                            .replace(/[^0-9+\-*/().]/g, '').trim();
                        if (math && /[0-9]/.test(math)) {
                            const result = Function('"use strict"; return (' + math + ')')();
                            const response = this.translate(`🧮 ${math} = ${result}`, lang);
                            this.responseCache[cacheKey] = response;
                            return response;
                        }
                    } catch(e) {}
                }

                // === WITZ ===
                if (lower.includes("witz") || lower.includes("lachen") || lower.includes("spaß")) {
                    const jokes = [
                        "Warum können Geister so gut programmieren? Weil sie keinen Speicher haben! 👻",
                        "Was sagt ein Programmierer, wenn er seine Wohnung verlässt? 'Ich geh mal den Stack leeren!' 😄",
                        "Warum ist ein Computer so schlau? Weil er so viele Bits hat! 💻"
                    ];
                    this.reactAvatar('happy');
                    setTimeout(() => this.reactAvatar('idle'), 800);
                    const response = this.translate(`😂 ${jokes[Math.floor(Math.random() * jokes.length)]}`, lang);
                    this.responseCache[cacheKey] = response;
                    return response;
                }

                // === ÊZÎDÎ ===
                if (lower.includes("silav") || lower.includes("rojbaş") || lower.includes("salam") || lower.includes("êzîdî") || lower.includes("kurdî") ||
                    lower.includes("spas") || lower.includes("şev baş") || lower.includes("tu çawa yî") || lower.includes("ez baş im") ||
                    lower.includes("navê min") || lower.includes("ez hez dikim") || lower.includes("malbat") || lower.includes("heval") ||
                    lower.includes("xwendin") || lower.includes("nivîsîn") || lower.includes("gotin") || lower.includes("jîyan") || lower.includes("xewn")) {
                    const response = this.translate(
                        "Silav! Ez HalDo AI me. 💙❤️\n\n" +
                        "Ez dikarim alîkariya te bikim bi:\n" +
                        "• Vekirina sepanan\n" +
                        "• Bersivdana pirsan (li ser her mijarê)\n" +
                        "• Wergerandin (bi " + this.languages.length + " zimanan)\n" +

                        "• Zanyariya li ser cîhanê, AI, bernamekirin, û hêj bêhtir\n\n" +
                        "Tu çi dixwazî?",
                        'ku'
                    );
                    this.responseCache[cacheKey] = response;
                    return response;
                }

                // === STANDARD ===
                this.reactAvatar('thinking');
                setTimeout(() => this.reactAvatar('idle'), 1000);
                const response = this.professionalResponse(clean, lang);
                this.responseCache[cacheKey] = response;
                return response;

            professionalResponse(text, lang = 'de') {
                const lower = text.toLowerCase();

                if (lower.includes("hallo") || lower.includes("hi") || lower.includes("hey") ||

                    setTimeout(() => this.reactAvatar('idle'), 800);

                    `💡 Du kannst mich ALLES fragen:\n` +

                    `• Apps öffnen („Öffne Rechner“)\n` +

                    `• Witze, Unterhaltung\n` +
                    `• Wissen über ALLES\n\n` +
                    `Was darf ich für dich tun? 🌌`,
                    lang
                );
            },

            correctText(text, lang = 'de') {
                const corrections = {
                    'Apfel': 'Äpfel', 'apfel': 'Äpfel', 'hause': 'Hause', 'Hause': 'Haus',
                    'gehen': 'gehen', 'komme': 'komme', 'ich habe': 'Ich habe', 'ich bin': 'Ich bin',
                    'sie sind': 'Sie sind', 'sie haben': 'Sie haben', 'das ist': 'Das ist', 'das war': 'Das war'
                };
                let corrected = text;
                for (const [wrong, right] of Object.entries(corrections)) {
                    corrected = corrected.replace(new RegExp(wrong, 'g'), right);
                }
                let result = this.translate(`📝 Korrigierter Text:\n"${corrected}"`, lang);
                result += this.translate('\n\n✅ Der Text wurde korrigiert.', lang);
                return result;
            },

            summarizeText(text, lang = 'de') {
                const words = text.split(' ');
                if (words.length <= 20) {
                    return this.translate(`📄 Zusammenfassung:\n"${text}"\n\n💡 Der Text ist bereits kurz.`, lang);
                }
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
                const summary = sentences.slice(0, Math.min(3, sentences.length)).join('. ') + '.';
                return this.translate(
                    `📄 Zusammenfassung:\n"${summary}"\n\n📊 ${words.length} Wörter · ${sentences.length} Sätze`,
                    lang
                );
            }
        };

        // =========================================================
        // 6. UPDATE SYSTEM
        // =========================================================

        window.HalDo.UpdateSystem = {
            currentVersion: window.HALDO_VERSION,
            updateAvailable: false,
            updateData: null,
            history: [],

            init() {
                this.loadHistory();
                console.log("↻ Update-System initialisiert — Version " + this.currentVersion);
                return this;
            },

            loadHistory() {
                this.history = window.HalDo.Storage.get('update_history', []);
                return this.history;
            },

            saveHistory() {
                window.HalDo.Storage.set('update_history', this.history);
                return true;
            },

            check() {
                console.log("🔍 Suche nach Updates...");
                const mockUpdate = {
                    version: "23.0.1",
                    releaseDate: new Date().toISOString(),
                    changes: [
                        "🐛 Bugfixes und Stabilitätsverbesserungen",
                        "⚡ Performance-Optimierungen für alle Apps",
                        "✨ Neue Video-Effekte (4K/8K)",
                        "🌍 Weitere Sprachen hinzugefügt",
                        "🔒 Sicherheitsupdates",
                        "📱 Verbesserte Mobile-Ansicht"
                    ],
                    size: "3.2 MB"
                };
                const current = parseFloat(this.currentVersion);
                const available = parseFloat(mockUpdate.version);
                if (available > current) {
                    this.updateAvailable = true;
                    this.updateData = mockUpdate;
                    window.HalDo.emit("update:available", { update: mockUpdate });
                    console.log(`↻ Update verfügbar: v${mockUpdate.version}`);
                    return mockUpdate;
                } else {
                    this.updateAvailable = false;
                    console.log("✅ System ist auf dem neuesten Stand");
                    return null;
                }
            },

            install() {
                if (!this.updateAvailable || !this.updateData) {
                    alert('❌ Kein Update verfügbar.');
                    return false;
                }
                const update = this.updateData;
                console.log(`📦 Installiere Update auf Version ${update.version}...`);
                alert(`↻ Update wird installiert...\n\nVersion: ${update.version}\nGröße: ${update.size}\nÄnderungen:\n${update.changes.map(c => `• ${c}`).join('\n')}`);
                setTimeout(() => {
                    this.currentVersion = update.version;
                    this.updateAvailable = false;
                    window.HALDO_VERSION = update.version;
                    window.HalDo.OS.version = update.version;
                    this.history.push({ version: update.version, installedAt: new Date().toISOString(), changes: update.changes });
                    this.saveHistory();
                    window.HalDo.emit("update:installed", { version: update.version });
                    console.log(`✅ Update auf Version ${update.version} installiert!`);
                    alert(`✅ Update erfolgreich installiert!\n\nVersion: ${update.version}\nInstalliert: ${new Date().toLocaleString()}\n\n🔄 Starte System neu...`);
                    setTimeout(() => { location.reload(); }, 1500);
                }, 2000);
                return true;
            },

            renderUI(container) {

                            </div>
                        </div>
                        <div style="margin-top:10px;display:flex;flex-direction:column;gap:4px;">
                            ${this.history.slice(-5).reverse().map(h =>
                                `<div style="padding:6px 12px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;font-size:12px;">

                });

            getStatus() {
                return { current: this.currentVersion, available: this.updateAvailable, data: this.updateData, history: this.history };

        window.HalDo.AppRegistry = {
            apps: new Map(),

            register(app) {
                if (!app || !app.id) return false;

                this.apps.set(app.id, { ...app, registeredAt: Date.now(), status: 'registered', installed: false });
                console.log(`✅ App "${app.name || app.id}" registriert`);
                return true;
            },

            get(id) { return this.apps.get(id) || null; },
            getAll() { return Array.from(this.apps.values()); },

            install(id) {
                const app = this.get(id);
                if (!app) return false;
                if (this.installed.has(id)) return true;
                app.status = 'installed';
                app.installed = true;
                this.installed.add(id);
                window.HalDo.Storage.set('app_installed_' + id, true);
                console.log(`📦 App "${app.name || id}" installiert`);
                return true;
            },

            isInstalled(id) {
                return this.installed.has(id) || window.HalDo.Storage.get('app_installed_' + id, false);
            },

            loadInstalled() {
                this.getAll().forEach(app => {
                    if (window.HalDo.Storage.get('app_installed_' + app.id, false)) {
                        app.status = 'installed';
                        app.installed = true;
                        this.installed.add(app.id);
                    }
                });
            },

            getInstalled() {
                return this.getAll().filter(app => this.installed.has(app.id));
            }

                    'galaxy-explorer': `<div style="text-align:center;padding:20px;"><div style="font-size:24px;font-weight:700;">🌌 Galaxy Explorer</div><div style="font-size:48px;">🌌</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;">${['Milchstraße', 'Andromeda', 'Dreiecksgalaxie', 'Whirlpool', 'Sombrero', 'Schwarzes Auge'].map(g => `<div style="padding:6px;background:rgba(255,255,255,.04);border-radius:6px;text-align:center;font-size:10px;">${g}</div>`).join('')}</div></div>`
                };

                // Standard-Fallback für alle anderen Apps
                return contents[appId] || `
                    <div style="padding:30px;text-align:center;">
                        <div style="font-size:48px;margin-bottom:12px;">📱</div>
                        <div style="font-size:24px;font-weight:700;background:linear-gradient(135deg,#ffd54b,#ff9f1c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${appId.charAt(0).toUpperCase() + appId.slice(1)}</div>
                        <div style="opacity:.5;">App ist bereit</div>
                        <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                            <button onclick="window.HalDo.AppManager.open('haldo-ai')" style="padding:6px 14px;border-radius:6px;background:rgba(255,200,80,.1);color:#fff;cursor:pointer;font-size:11px;">✦ HalDo AI</button>
                            <button onclick="window.HalDo.AICore.ask('Was kann die App ${appId} tun?').then(r=>alert(r))" style="padding:6px 14px;border-radius:6px;background:rgba(255,200,80,.1);color:#fff;cursor:pointer;font-size:11px;">💡 Mehr erfahren</button>
                            <button onclick="window.HalDo.AppManager.close('${appId}')" style="padding:6px 14px;border-radius:6px;background:rgba(255,80,80,.1);color:#ff6b6b;cursor:pointer;font-size:11px;">✕ Schließen</button>
                        </div>
                    </div>
                `;
            },

            initAppLogic(appId, win) {
                // CALCULATOR
                if (appId === 'calculator') {
                    let display = win.querySelector("#calc-display");
                    let expression = "";
                    win.querySelectorAll("[data-calc]").forEach(btn => {
                        btn.addEventListener("click", () => {
                            const val = btn.dataset.calc;
                            if (val === "C") { expression = ""; display.textContent = "0"; }
                            else if (val === "⌫") { expression = expression.slice(0,-1); display.textContent = expression || "0"; }
                            else if (val === "=") {
                                try {
                                    const result = Function('"use strict"; return (' + expression.replace('×','*').replace('÷','/').replace('−','-') + ')')();
                                    display.textContent = result;
                                    expression = String(result);
                                } catch(e) { display.textContent = "Fehler"; expression = ""; }
                            }
                            else { expression += val; display.textContent = expression; }
                        });
                    });
                }

                // NOTES
                if (appId === 'notes') {
                    let notes = window.HalDo.Storage.get('notes', []);
                    const list = win.querySelector("#note-list");
                    const titleInput = win.querySelector("#note-title");
                    const contentInput = win.querySelector("#note-content");
                    const saveBtn = win.querySelector("#note-save");

                    function renderNotes() {
                        if (!list) return;
                        list.innerHTML = notes.map((n, i) => `
                            <div style="padding:6px 10px;background:rgba(255,255,255,.04);border-radius:6px;display:flex;justify-content:space-between;align-items:center;">
                                <div style="flex:1;cursor:pointer;" onclick="document.getElementById('note-title').value='${n.title.replace(/'/g,"\\'")}';document.getElementById('note-content').value='${n.content.replace(/'/g,"\\'")}'">
                                    <strong style="font-size:12px;">${n.title || 'Ohne Titel'}</strong>
                                    <div style="font-size:10px;opacity:.5;">${n.content?.substring(0,40) || ''}</div>
                                </div>
                                <button data-index="${i}" class="note-delete" style="padding:2px 8px;border:none;border-radius:4px;background:rgba(255,87,87,.2);color:#ff5f57;cursor:pointer;font-size:10px;">✕</button>
                            </div>
                        `).join('');

                        list.querySelectorAll(".note-delete").forEach(btn => {
                            btn.addEventListener("click", (e) => {
                                const idx = parseInt(e.target.dataset.index);
                                notes.splice(idx, 1);
                                window.HalDo.Storage.set('notes', notes);
                                renderNotes();
                            });
                        });
                    }

                    if (saveBtn) {
                        saveBtn.addEventListener("click", () => {
                            const title = titleInput?.value?.trim() || "Ohne Titel";
                            const content = contentInput?.value?.trim();
                            if (!content) return;
                            notes.push({ title, content, createdAt: new Date().toISOString() });
                            window.HalDo.Storage.set('notes', notes);
                            titleInput.value = "";
                            contentInput.value = "";
                            renderNotes();
                        });
                    }
                    renderNotes();
                }

                // CLOCK
                if (appId === 'clock') {
                    function updateClock() {
                        const display = win.querySelector("#clock-display");
                        if (display) display.textContent = new Date().toLocaleTimeString();
                    }
                    updateClock();
                    const interval = setInterval(updateClock, 1000);
                    win.addEventListener("remove", () => clearInterval(interval));
                }

                // TRANSLATE
                if (appId === 'translate') {
                    const translateBtn = win.querySelector("#translate-btn");
                    const textArea = win.querySelector("#translate-text");
                    const resultDiv = win.querySelector("#translate-result");
                    const fromSelect = win.querySelector("#translate-from");
                    const toSelect = win.querySelector("#translate-to");
                    if (translateBtn && textArea && resultDiv) {
                        translateBtn.addEventListener("click", () => {
                            const text = textArea.value.trim();
                            const from = fromSelect?.value || 'de';
                            const to = toSelect?.value || 'en';
                            if (!text) {
                                resultDiv.style.display = 'block';
                                resultDiv.textContent = '⚠️ Bitte Text eingeben.';
                                resultDiv.style.color = '#ff6b6b';
                                return;
                            }
                            const translated = window.HalDo.AICore.translateText(text, to);
                            resultDiv.style.display = 'block';
                            resultDiv.textContent = `🌍 ${translated}`;
                            resultDiv.style.color = '#fff';
                        });
                    }
                }

                // STORAGE
                if (appId === 'storage') {
                    const clearBtn = win.querySelector("#clear-cache");
                    if (clearBtn) {
                        clearBtn.addEventListener("click", () => {
                            if (confirm("Cache wirklich leeren?")) {
                                window.HalDo.Storage.clear();
                                alert("✅ Cache geleert!");
                                const bar = win.querySelector("#storage-bar");
                                const usage = win.querySelector("#storage-usage");
                                if (bar) bar.style.width = "10%";
                                if (usage) usage.textContent = "10% verwendet";
                            }
                        });
                    }
                }

                // BACKUP
                if (appId === 'backup') {
                    const createBtn = win.querySelector("#backup-create");
                    const restoreBtn = win.querySelector("#backup-restore");
                    if (createBtn) {
                        createBtn.addEventListener("click", () => {
                            const backup = { timestamp: new Date().toISOString(), version: window.HALDO_VERSION, data: window.HalDo.Storage.getAll() };
                            window.HalDo.Storage.set('last_backup', backup);
                            alert(`✅ Backup erstellt!\nZeit: ${new Date().toLocaleString()}`);
                        });
                    }
                    if (restoreBtn) {
                        restoreBtn.addEventListener("click", () => {
                            const backup = window.HalDo.Storage.get('last_backup');
                            if (!backup) { alert("❌ Kein Backup gefunden!"); return; }
                            if (confirm(`Backup vom ${new Date(backup.timestamp).toLocaleString()} wiederherstellen?`)) {
                                alert("✅ Backup wiederhergestellt!");
                            }
                        });
                    }
                }

                // DIAGNOSTICS
                if (appId === 'diagnostics') {
                    const diagBtn = win.querySelector("#run-diagnostics");
                    if (diagBtn) {
                        diagBtn.addEventListener("click", () => {
                            alert(`📊 Diagnose:\n\nSystem: ✅ Aktiv\nVersion: ${window.HALDO_VERSION}\nAI: ${window.HalDo.AICore ? '✅' : '❌'}\nApps: ${window.HalDo.AppRegistry?.getAll().length || 0}`);
                        });
                    }
                }
            },

            close(appId) {
                const instance = this.activeApps.get(appId);
                if (!instance) return false;
                if (instance.window) instance.window.remove();
                this.activeApps.delete(appId);
                window.HalDo.emit("app:closed", { appId });
                return true;
            },

            focus(appId) {
                const instance = this.activeApps.get(appId);
                if (!instance) return false;
                if (instance.window) instance.window.style.zIndex = "99999";
                return true;
            },

            getActiveApps() {
                return Array.from(this.activeApps.values());
            }
        };

        // =========================================================
        // 9. MENÜ CONTROLLER
        // =========================================================

        window.HalDo.Menu = {
            init() {
                const systemBtn = document.getElementById("haldo-system-menu-btn");
                const appsBtn = document.getElementById("haldo-apps-menu-btn");
                const systemPanel = document.getElementById("haldo-system-panel");
                const appsPanel = document.getElementById("haldo-apps-panel");

                if (systemBtn) {
                    systemBtn.addEventListener("click", () => {
                        systemPanel.classList.toggle("open");
                        appsPanel.classList.remove("open");
                    });
                }

                if (appsBtn) {
                    appsBtn.addEventListener("click", () => {
                        appsPanel.classList.toggle("open");
                        systemPanel.classList.remove("open");
                    });
                }

                document.getElementById("haldo-system-close")?.addEventListener("click", () => {
                    systemPanel.classList.remove("open");
                });

                document.getElementById("haldo-apps-close")?.addEventListener("click", () => {
                    appsPanel.classList.remove("open");
                });

                document.addEventListener("click", (e) => {
                    if (!e.target.closest(".haldo-menu-panel") && !e.target.closest(".haldo-menu-button")) {
                        systemPanel.classList.remove("open");
                        appsPanel.classList.remove("open");
                    }
                });

                this.renderSystemMenu();
                this.renderAppsMenu();
            },

            renderSystemMenu() {
                const list = document.getElementById("haldo-system-list");
                if (!list) return;

                const items = [
                    { id: 'settings', icon: '⚙️', name: 'Einstellungen', desc: 'System & Geräte' },
                    { id: 'updates', icon: '↻', name: 'Updates', desc: 'Systemupdates' },
                    { id: 'storage', icon: '💾', name: 'Speicher', desc: 'Daten & Speicher' },
                    { id: 'security', icon: '🛡️', name: 'Sicherheit', desc: 'Datenschutz' },
                    { id: 'backup', icon: '◫', name: 'Backup', desc: 'Sichern & Wiederherstellen' },
                    { id: 'diagnostics', icon: '⌁', name: 'Diagnose', desc: 'Systemstatus' },
                    { id: 'system', icon: '◈', name: 'System', desc: 'Systeminformationen' },
                    { id: 'terminal', icon: '⌨️', name: 'Terminal', desc: 'Befehle & System' }
                ];

                list.innerHTML = items.map(item => `
                    <div class="haldo-menu-item" data-app="${item.id}">
                        <span class="icon">${item.icon}</span>
                        <div class="info">
                            <div class="name">${item.name}</div>
                            <div class="desc">${item.desc}</div>
                        </div>
                    </div>
                `).join('');

                list.querySelectorAll('[data-app]').forEach(el => {
                    el.addEventListener('click', () => {
                        const app = el.dataset.app;
                        document.getElementById("haldo-system-panel").classList.remove("open");
                        document.getElementById("haldo-apps-panel").classList.remove("open");
                        window.HalDo.AppManager.open(app);
                    });
                });
            },

            renderAppsMenu() {
                const list = document.getElementById("haldo-apps-list");
                if (!list) return;

                const apps = window.HalDo.AppRegistry.getAll();
                apps.sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));

                list.innerHTML = apps.map(app => `
                    <div class="haldo-menu-item" data-app="${app.id}">
                        <span class="icon">${app.icon || '📱'}</span>
                        <div class="info">
                            <div class="name">${app.name || app.id}</div>
                            <div class="desc">${app.description || app.category || 'App'}</div>
                        </div>
                        <span class="badge">${app.status === 'installed' ? '✅' : ''}</span>
                    </div>
                `).join('');

                list.querySelectorAll('[data-app]').forEach(el => {
                    el.addEventListener('click', () => {
                        const app = el.dataset.app;
                        document.getElementById("haldo-system-panel").classList.remove("open");
                        document.getElementById("haldo-apps-panel").classList.remove("open");
                        window.HalDo.AppManager.open(app);
                    });
                });
            }
        };

        // =========================================================
        // 10. CHAT CONTROLLER (mit Voice, TTS, LipSync)
        // =========================================================

        window.HalDo.Chat = {
            init() {
                this.window = document.getElementById("haldo-chat-window");
                this.messages = document.getElementById("haldo-chat-messages");
                this.input = document.getElementById("haldo-chat-input");
                this.sendBtn = document.getElementById("haldo-chat-send");
                this.voiceBtn = document.getElementById("haldo-chat-voice");
                this.status = document.getElementById("haldo-chat-status");
                this.typing = document.getElementById("haldo-chat-typing");
                this.history = window.HalDo.Storage.get('chat_history', []);
                this._sending = false;
                this._lipSyncCleanup = null;
                this._currentUtterance = null;

                if (!this.window) return;

                document.getElementById("haldo-chat-close").addEventListener("click", () => this.close());
                document.getElementById("haldo-chat-minimize").addEventListener("click", () => this.toggleMinimize());
                this.sendBtn.addEventListener("click", () => this.send());
                this.voiceBtn.addEventListener("click", () => this.toggleVoice());

                this.input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        this.send();
                    }
                });

                this.input.addEventListener("input", () => {
                    this.input.style.height = "auto";
                    this.input.style.height = Math.min(this.input.scrollHeight, 150) + "px";
                });

                this.history.forEach(msg => this.renderMessage(msg.role, msg.content));
                if (this.history.length === 0) {
                    this.renderMessage("ai", "🌌 Hallo! Ich bin HalDo AI (Professional Edition). 💙❤️ Ich beantworte ALLE deine Fragen in ALLEN Sprachen! Was möchtest du wissen?");
                }

                window.HalDo.AICore.init();
                window.HalDo.UpdateSystem.init();
                this.setupVoice();

                document.addEventListener("haldo:ai:open", () => this.open());

                // Startanimation mit Sprachausgabe
                setTimeout(() => {
                    const startupMsg = "HalDo AI wird gestartet. Dein intelligenter Partner für heute, für morgen, für dich.";
                    this.speak(startupMsg);
                }, 800);
            },

            open() {
                this.window.classList.add("open");
                this.window.removeAttribute("aria-hidden");
                setTimeout(() => this.input.focus(), 100);
                window.HalDo.AICore.reactAvatar('happy');
                setTimeout(() => window.HalDo.AICore.reactAvatar('idle'), 800);
            },

            close() {
                this.window.classList.remove("open");
                this.window.setAttribute("aria-hidden", "true");
                if (this._lipSyncCleanup) {
                    this._lipSyncCleanup();
                    this._lipSyncCleanup = null;
                }
            },

            toggleMinimize() {
                this.window.classList.toggle("minimized");
            },

            renderMessage(role, content) {
                const div = document.createElement("div");
                div.className = `haldo-chat-message ${role === "user" ? "haldo-chat-message-user" : "haldo-chat-message-ai"}`;
                div.textContent = content;
                this.messages.appendChild(div);
                this.messages.scrollTop = this.messages.scrollHeight;
            },

            setStatus(text) {
                this.status.textContent = text;
            },

            showTyping() {
                this.typing.classList.add("active");
                this.setStatus("HalDo AI denkt …");
                window.HalDo.AICore.reactAvatar('thinking');
            },

            hideTyping() {
                this.typing.classList.remove("active");
                this.setStatus("🌌 Bereit für ALLE Fragen");
                window.HalDo.AICore.reactAvatar('idle');
            },

            async send() {
                const text = this.input.value.trim();
                if (!text || this._sending) return;

                this.input.value = "";
                this.input.style.height = "auto";
                this.renderMessage("user", text);
                this.history.push({ role: "user", content: text });
                window.HalDo.Storage.set('chat_history', this.history.slice(-200));

                this._sending = true;
                this.showTyping();

                try {
                    const response = await window.HalDo.AICore.ask(text);
                    this.hideTyping();
                    this.renderMessage("ai", response);
                    this.history.push({ role: "ai", content: response });
                    window.HalDo.Storage.set('chat_history', this.history.slice(-200));

                    this.speak(response);

                } catch(e) {
                    this.hideTyping();
                    this.renderMessage("ai", "🌌 Entschuldigung, ein Fehler ist aufgetreten.");
                    console.error(e);
                }

                this._sending = false;
            },

            speak(text) {
                if (!window.speechSynthesis) {
                    window.HalDo.AICore.reactAvatar('idle');
                    return;
                }
                try {
                    // Vorherige Sprachausgabe beenden
                    if (this._currentUtterance) {
                        window.speechSynthesis.cancel();
                        this._currentUtterance = null;
                    }
                    if (this._lipSyncCleanup) {
                        this._lipSyncCleanup();
                        this._lipSyncCleanup = null;
                    }

                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = "de-DE";
                    utterance.rate = 0.92;
                    utterance.pitch = 1.0;
                    utterance.volume = 0.85;

                    utterance.onstart = () => {
                        window.HalDo.AICore.reactAvatar('speaking');
                        // LipSync über Audio-Volume (wird über AnalyserNode gemacht)
                        this._lipSyncCleanup = window.HalDo.AICore.startLipSync(utterance);
                    };

                    utterance.onend = () => {
                        window.HalDo.AICore.reactAvatar('idle');
                        if (this._lipSyncCleanup) {
                            this._lipSyncCleanup();
                            this._lipSyncCleanup = null;
                        }
                        this._currentUtterance = null;
                    };

                    utterance.onerror = () => {
                        window.HalDo.AICore.reactAvatar('idle');
                        if (this._lipSyncCleanup) {
                            this._lipSyncCleanup();
                            this._lipSyncCleanup = null;
                        }
                        this._currentUtterance = null;
                    };

                    this._currentUtterance = utterance;
                    window.speechSynthesis.speak(utterance);

                } catch(e) {
                    console.warn("Speech synthesis error:", e);
                    window.HalDo.AICore.reactAvatar('idle');
                }
            },

            setupVoice() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) return;

                this.recognition = new Recognition();
                this.recognition.lang = "de-DE";
                this.recognition.continuous = false;
                this.recognition.interimResults = true;

                this.recognition.onstart = () => {
                    this.voiceBtn.classList.add("listening");
                    this.setStatus("🎙️ Ich höre zu …");
                    window.HalDo.AICore.reactAvatar('listening');
                };

                this.recognition.onresult = (event) => {
                    let final = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    }
                    if (final) {
                        this.input.value = final;
                        this.stopVoice();
                        setTimeout(() => this.send(), 100);
                    }
                };

                this.recognition.onerror = () => {
                    this.stopVoice();
                    this.setStatus("Bereit");
                };

                this.recognition.onend = () => {
                    this.voiceBtn.classList.remove("listening");
                    if (this.status.textContent === "🎙️ Ich höre zu …") {
                        this.setStatus("🌌 Bereit für ALLE Fragen");
                    }
                    window.HalDo.AICore.reactAvatar('idle');
                };
            },

            toggleVoice() {
                if (this.recognition?.listening) {
                    this.stopVoice();
                } else {
                    this.startVoice();
                }
            },

            startVoice() {
                if (!this.recognition) return;
                try { this.recognition.start(); } catch(e) {}
            },

            stopVoice() {
                try { this.recognition?.stop(); } catch(e) {}
                this.voiceBtn.classList.remove("listening");
                window.HalDo.AICore.reactAvatar('idle');
                this.setStatus("🌌 Bereit für ALLE Fragen");
            }
        };
