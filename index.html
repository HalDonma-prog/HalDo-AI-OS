<html lang="de">

<head>

    <!-- =========================================================

         INDEX.HTML

         ========================================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

        name="theme-color"
        content="#020612"
    >

    <meta
        name="color-scheme"
        content="dark"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – Cosmic Artificial Intelligence Operating System"
    >

    <meta
        name="application-name"
        content="HalDo AI OS"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS"
    >

    <title>
        HalDo AI OS 20
    </title>

    <link

    <!-- =========================================================
         EXISTING HALDO LOGO ENGINE
         ========================================================= -->

    <link
        rel="stylesheet"
        href="haldo-logo-engine.css"
    >


    <!-- =========================================================
         HALDO AI OS 20 GLOBAL STYLE
         ========================================================= -->

    <style>

        /* =====================================================
           ROOT
           ===================================================== */

        :root {

            --haldo-bg:
                #02040b;

            --haldo-bg-deep:
                #010208;

            --haldo-space:
                #030817;

            --haldo-space-blue:
                #06132b;

            --haldo-space-purple:
                #100a2c;

            --haldo-panel:
                rgba(7, 14, 34, 0.78);

            --haldo-panel-strong:
                rgba(5, 10, 25, 0.94);

            --haldo-panel-light:
                rgba(255,255,255,0.055);

            --haldo-border:
                rgba(255,255,255,0.12);

            --haldo-border-light:
                rgba(255,255,255,0.075);

            --haldo-text:
                #ffffff;

            --haldo-text-soft:
                rgba(255,255,255,0.78);

            --haldo-text-muted:
                rgba(255,255,255,0.52);

            --haldo-blue:
                #72b8ff;

            --haldo-blue-soft:
                rgba(114,184,255,0.35);

            --haldo-cyan:
                #7be7ff;

            --haldo-purple:
                #a68cff;

            --haldo-sun:
                #ffd76b;

            --haldo-green:
                #65e5a0;

            --haldo-red:
                #ff6f7d;

            --haldo-radius:
                22px;

            --haldo-window-radius:
                20px;

            --haldo-topbar-height:
                68px;

            --haldo-dock-height:
                76px;

            --haldo-transition:
                180ms cubic-bezier(.2,.8,.2,1);

            --haldo-window-width:
                min(780px, 92vw);

            --haldo-window-height:
                min(620px, 78vh);

        }


        /* =====================================================
           GLOBAL RESET
           ===================================================== */

        *,
        *::before,
        *::after {

            box-sizing:
                border-box;

        }


        html,
        body {

            width:
                100%;

            height:
                100%;

            margin:
                0;

            padding:
                0;

            overflow:
                hidden;

            background:
                var(--haldo-bg);

            color:
                var(--haldo-text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing:
                antialiased;

            text-rendering:
                optimizeLegibility;

        }


        body {

            position:
                relative;

            user-select:
                none;

            -webkit-user-select:
                none;

            -webkit-tap-highlight-color:
                transparent;

        }


        button,
        input,
        textarea,
        select {

            font:
                inherit;

        }


        button {

            border:
                0;

            outline:
                0;

            color:
                inherit;

        }


        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {

            outline:
                2px solid
                rgba(114,184,255,0.65);

            outline-offset:
                2px;

        }


        /* =====================================================
           MAIN OS ROOT
           ===================================================== */

        #haldo-os {

            position:
                fixed;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            background:

                radial-gradient(
                    ellipse at 50% 45%,
                    rgba(35,74,145,0.18),
                    transparent 42%
                ),

                radial-gradient(
                    ellipse at 15% 15%,
                    rgba(70,80,180,0.12),
                    transparent 35%
                ),

                radial-gradient(
                    ellipse at 85% 80%,
                    rgba(100,50,180,0.10),
                    transparent 40%
                ),

                linear-gradient(
                    135deg,
                    #010208 0%,
                    #030817 45%,
                    #02030b 100%
                );

        }


        /* =====================================================
           OS BACKGROUND LIGHT
           ===================================================== */

        #haldo-os::before {

            content:
                "";

            position:
                absolute;

            inset:
                -20%;

            pointer-events:
                none;

            background:

                radial-gradient(
                    ellipse at center,
                    rgba(80,130,255,0.08),
                    transparent 50%
                );

            filter:
                blur(55px);

            animation:
                haldoBackgroundBreath
                12s
                ease-in-out
                infinite
                alternate;

        }


        @keyframes haldoBackgroundBreath {

            from {

                transform:
                    scale(1);

                opacity:
                    0.55;

            }

            to {

                transform:
                    scale(1.08);

                opacity:
                    0.9;

            }

        }


        /* =====================================================
           COSMIC WORLD
           ===================================================== */

        #haldo-cosmic-world {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            pointer-events:
                none;

            z-index:
                1;

        }


        /* =====================================================
           COSMIC NEBULA
           ===================================================== */

        .haldo-nebula {

            position:
                absolute;

            inset:
                -35%;

            background:

                radial-gradient(
                    ellipse at 25% 30%,
                    rgba(82,108,255,0.13),
                    transparent 34%
                ),

                radial-gradient(
                    ellipse at 75% 45%,
                    rgba(170,75,255,0.10),
                    transparent 35%
                ),

                radial-gradient(
                    ellipse at 50% 80%,
                    rgba(45,170,255,0.07),
                    transparent 32%
                );

            filter:
                blur(50px);

            opacity:
                0.9;

            animation:
                haldoNebulaMovement
                24s
                ease-in-out
                infinite
                alternate;

        }


        @keyframes haldoNebulaMovement {

            0% {

                transform:
                    translate3d(0,0,0)
                    scale(1);

            }

            50% {

                transform:
                    translate3d(-2%,1%,0)
                    scale(1.04);

            }

            100% {

                transform:
                    translate3d(2%,-1%,0)
                    scale(1.08);

            }

        }


        /* =====================================================
           STAR FIELD
           ===================================================== */

        #haldo-star-field {

            position:
                absolute;

            inset:
                0;

            overflow:
                hidden;

            pointer-events:
                none;

        }


        .haldo-stars-layer {

            position:
                absolute;

            inset:
                -5%;

            background-repeat:
                repeat;

        }


        .haldo-stars-small {

            opacity:
                0.72;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.85) 0 1px,
                    transparent 1.5px
                );

            background-size:
                83px 91px;

            background-position:
                11px 7px;

            animation:
                haldoStarsMoveSmall
                90s
                linear
                infinite;

        }


        .haldo-stars-medium {

            opacity:
                0.52;

            background-image:

                radial-gradient(
                    circle,
                    rgba(170,215,255,0.88) 0 1.1px,
                    transparent 1.8px
                );

            background-size:
                137px 149px;

            background-position:
                33px 51px;

            animation:
                haldoStarsMoveMedium
                130s
                linear
                infinite;

        }


        .haldo-stars-large {

            opacity:
                0.38;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,235,190,0.95) 0 1.25px,
                    transparent 2px
                );

            background-size:
                211px 227px;

            background-position:
                91px 71px;

            animation:
                haldoStarsMoveLarge
                180s
                linear
                infinite;

        }


        @keyframes haldoStarsMoveSmall {

            from {

                transform:
                    translate3d(0,0,0);

            }

            to {

                transform:
                    translate3d(-90px,60px,0);

            }

        }


        @keyframes haldoStarsMoveMedium {

            from {

                transform:
                    translate3d(0,0,0);

            }

            to {

                transform:
                    translate3d(120px,-80px,0);

            }

        }


        @keyframes haldoStarsMoveLarge {

            from {

                transform:
                    translate3d(0,0,0);

            }

            to {

                transform:
                    translate3d(-150px,-100px,0);

            }

        }


        /* =====================================================
           STAR GLOW
           ===================================================== */

        #haldo-star-glow {

            position:
                absolute;

            inset:
                0;

            background:

                radial-gradient(
                    ellipse at center,
                    rgba(255,255,255,0.045),
                    transparent 55%
                );

            filter:
                blur(10px);

            pointer-events:
                none;

        }


        /* =====================================================
           PLANET SYSTEM
           ===================================================== */

        #haldo-planet-system {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                min(940px, 108vw);

            height:
                min(940px, 108vw);

            transform:
                translate(-50%, -50%);

            pointer-events:
                none;

        }


        /* =====================================================
           ORBITS
           ===================================================== */

        .haldo-orbit {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            border:
                1px solid
                rgba(145,195,255,0.12);

            border-radius:
                50%;

            transform:
                translate(-50%, -50%);

            box-shadow:
                0 0 24px
                rgba(100,170,255,0.025);

        }


        .haldo-orbit-1 {

            width:
                25%;

            height:
                25%;

        }


        .haldo-orbit-2 {

            width:
                39%;

            height:
                39%;

        }


        .haldo-orbit-3 {

            width:
                56%;

            height:
                56%;

        }


        .haldo-orbit-4 {

            width:
                74%;

            height:
                74%;

        }


        .haldo-orbit-5 {

            width:
                91%;

            height:
                91%;

        }


        /* =====================================================
           ORBIT LIGHT
           ===================================================== */

        .haldo-orbit::after {

            content:
                "";

            position:
                absolute;

            left:
                50%;

            top:
                0;

            width:
                4px;

            height:
                4px;

            border-radius:
                50%;

            background:
                rgba(185,225,255,0.8);

            box-shadow:
                0 0 10px
                rgba(120,190,255,0.75);

        }


        /* =====================================================
           HALDO SUN
           ===================================================== */

        #haldo-sun {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                138px;

            height:
                138px;

            transform:
                translate(-50%, -50%);

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 34% 28%,
                    #fffde4 0%,
                    #fff1a8 15%,
                    #ffd76b 38%,
                    #ffba45 62%,
                    #ff9430 82%,
                    #ff7b20 100%
                );

            box-shadow:

                0 0 24px
                rgba(255,221,125,0.95),

                0 0 55px
                rgba(255,196,72,0.78),

                0 0 105px
                rgba(255,170,45,0.48),

                0 0 190px
                rgba(255,155,35,0.22);

            cursor:
                pointer;

            pointer-events:
                auto;

            animation:
                haldoSunPulse
                4.5s
                ease-in-out
                infinite;

            z-index:
                10;

        }


        #haldo-sun::before {

            content:
                "";

            position:
                absolute;

            inset:
                -24px;

            border-radius:
                50%;

            border:
                1px solid
                rgba(255,226,130,0.25);

            box-shadow:
                0 0 35px
                rgba(255,200,75,0.16);

        }


        #haldo-sun::after {

            content:
                "";

            position:
                absolute;

            inset:
                -48px;

            border-radius:
                50%;

            border:
                1px solid
                rgba(255,220,130,0.09);

        }


        @keyframes haldoSunPulse {

            0%,
            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(1.045);

            }

        }


        /* =====================================================
           PLANETS
           ===================================================== */

        .haldo-planet {

            position:
                absolute;

            border-radius:
                50%;

            pointer-events:
                auto;

            cursor:
                pointer;

            border:
                0;

            transition:
                transform
                var(--haldo-transition);

        }


        .haldo-planet:hover {

            transform:
                scale(1.12);

        }


        /* =====================================================
           EARTH
           ===================================================== */

        #haldo-earth {

            left:
                17%;

            top:
                48%;

            width:
                64px;

            height:
                64px;

            background:

                radial-gradient(
                    circle at 30% 26%,
                    #9ee8ff 0%,
                    #4ba4df 26%,
                    #2172bb 50%,
                    #123c76 74%,
                    #06162d 100%
                );

            box-shadow:

                inset -12px -14px 18px
                rgba(0,0,0,0.34),

                0 0 20px
                rgba(80,180,255,0.45);

        }


        #haldo-earth::after {

            content:
                "";

            position:
                absolute;

            left:
                12px;

            top:
                18px;

            width:
                28px;

            height:
                18px;

            border-radius:
                60% 40% 45% 55%;

            background:
                rgba(103,220,145,0.78);

            transform:
                rotate(-18deg);

            filter:
                blur(.3px);

        }


        /* =====================================================
           MOON
           ===================================================== */

        #haldo-moon {

            left:
                29%;

            top:
                27%;

            width:
                28px;

            height:
                28px;

            background:

                radial-gradient(
                    circle at 31% 27%,
                    #ffffff 0%,
                    #d6d6d6 35%,
                    #8e8e8e 70%,
                    #4d4d4d 100%
                );

            box-shadow:

                0 0 12px
                rgba(220,230,255,0.32),

                inset -5px -5px 7px
                rgba(0,0,0,0.28);

        }


        /* =====================================================
           BLUE PLANET
           ===================================================== */

        #haldo-blue-planet {

            left:
                71%;

            top:
                22%;

            width:
                46px;

            height:
                46px;

            background:

                radial-gradient(
                    circle at 31% 25%,
                    #d5e4ff,
                    #7d9be8 32%,
                    #4056ad 62%,
                    #202d75 100%
                );

            box-shadow:

                inset -8px -8px 12px
                rgba(0,0,0,.35),

                0 0 18px
                rgba(100,135,255,.35);

        }


        /* =====================================================
           RINGED PLANET
           ===================================================== */

        #haldo-ringed-planet {

            left:
                78%;

            top:
                66%;

            width:
                58px;

            height:
                58px;

            background:

                radial-gradient(
                    circle at 31% 25%,
                    #fff0c9,
                    #d1a766 42%,
                    #98703c 72%,
                    #4d341c 100%
                );

            box-shadow:

                inset -9px -11px 14px
                rgba(0,0,0,.35),

                0 0 18px
                rgba(255,206,130,.22);

        }


        #haldo-ringed-planet::after {

            content:
                "";

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                106px;

            height:
                28px;

            border:
                3px solid
                rgba(224,197,153,0.55);

            border-radius:
                50%;

            transform:
                translate(-50%, -50%)
                rotate(-16deg);

            box-shadow:
                0 0 10px
                rgba(255,210,145,0.12);

        }


        /* =====================================================
           OUTER PLANET
           ===================================================== */

        #haldo-outer-planet {

            left:
                15%;

            top:
                73%;

            width:
                34px;

            height:
                34px;

            background:

                radial-gradient(
                    circle at 30% 25%,
                    #d7c6ff,
                    #7562bd 50%,
                    #34275d 100%
                );

            box-shadow:
                0 0 15px
                rgba(155,130,255,0.22);

        }


        /* =====================================================
           HALDO LOGO STAGE
           ===================================================== */

        #haldo-logo-stage {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                210px;

            height:
                210px;

            transform:
                translate(-50%, -50%);

            display:
                grid;

            place-items:
                center;

            pointer-events:
                auto;

            z-index:
                25;

        }


        #haldo-logo-stage img {

            width:
                118px;

            height:
                118px;

            object-fit:
                contain;

            pointer-events:
                auto;

            cursor:
                pointer;

            filter:

                drop-shadow(
                    0 0 12px
                    rgba(120,190,255,0.65)
                )

                drop-shadow(
                    0 0 32px
                    rgba(90,150,255,0.35)
                );

            animation:
                haldoLogoFloat
                5s
                ease-in-out
                infinite;

        }


        @keyframes haldoLogoFloat {

            0%,
            100% {

                transform:
                    translateY(0)
                    scale(1);

            }

            50% {

                transform:
                    translateY(-7px)
                    scale(1.018);

            }

        }


        /* =====================================================
           LOGO AURA
           ===================================================== */

        #haldo-logo-stage::before {

            content:
                "";

            position:
                absolute;

            width:
                145px;

            height:
                145px;

            border-radius:
                50%;

            background:
                rgba(80,150,255,0.06);

            filter:
                blur(24px);

            pointer-events:
                none;

        }


        /* =====================================================
           TOP SYSTEM BAR
           ===================================================== */

        #haldo-topbar {

            position:
                absolute;

            left:
                16px;

            right:
                16px;

            top:
                16px;

            height:
                var(--haldo-topbar-height);

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 14px 0 16px;

            background:
                rgba(4,9,23,0.66);

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                22px;

            backdrop-filter:
                blur(24px);

            -webkit-backdrop-filter:
                blur(24px);

            box-shadow:
                0 16px 55px
                rgba(0,0,0,0.28);

            z-index:
                100;

        }


        /* =====================================================
           BRAND
           ===================================================== */

        #haldo-brand {

            display:
                flex;

            align-items:
                center;

            gap:
                11px;

            min-width:
                0;

        }


        #haldo-brand-logo {

            width:
                40px;

            height:
                40px;

            object-fit:
                contain;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(110,180,255,.55)
                );

        }


        #haldo-brand-text {

            display:
                flex;

            flex-direction:
                column;

            min-width:
                0;

        }


        #haldo-brand-name {

            font-size:
                15px;

            font-weight:
                750;

            letter-spacing:
                .1px;

            white-space:
                nowrap;

        }


        #haldo-brand-version {

            margin-top:
                4px;

            color:
                var(--haldo-text-muted);

            font-size:
                10px;

            letter-spacing:
                .3px;

        }


        /* =====================================================
           TOP ACTIONS
           ===================================================== */

        #haldo-top-actions {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

        }


        .haldo-top-button {

            width:
                42px;

            height:
                42px;

            display:
                grid;

            place-items:
                center;

            border:
                1px solid
                var(--haldo-border-light);

            border-radius:
                13px;

            background:
                rgba(255,255,255,0.045);

            color:
                var(--haldo-text-soft);

            cursor:
                pointer;

            transition:
                transform var(--haldo-transition),
                background var(--haldo-transition),
                border-color var(--haldo-transition);

        }


        .haldo-top-button:hover {

            transform:
                translateY(-1px);

            background:
                rgba(255,255,255,0.085);

            border-color:
                rgba(255,255,255,0.18);

        }


        /* =====================================================
           APP / WINDOW LAYER
           ===================================================== */

        #haldo-window-layer {

            position:
                absolute;

            inset:
                0;

            pointer-events:
                none;

            z-index:
                500;

        }


        /* =====================================================
           SYSTEM STATUS
           ===================================================== */

        #haldo-system-status {

            position:
                absolute;

            left:
                22px;

            bottom:
                101px;

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            padding:
                9px 13px;

            background:
                rgba(4,9,23,0.58);

            border:
                1px solid
                var(--haldo-border-light);

            border-radius:
                15px;

            backdrop-filter:
                blur(16px);

            color:
                var(--haldo-text-muted);

            font-size:
                10px;

            z-index:
                90;

        }


        #haldo-status-dot {

            width:
                8px;

            height:
                8px;

            flex:
                0 0 auto;

            border-radius:
                50%;

            background:
                var(--haldo-green);

            box-shadow:
                0 0 12px
                rgba(101,229,160,0.75);

        }


        /* =====================================================
           BOTTOM DOCK

window.HalDo.domReady =

<script>

"use strict";


/* =========================================================
   HALDO CORE
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};


window.HalDo.core =
    window.HalDo.core ||
    {

        name:
            "HalDo Core",

        version:
            "20.0.0",

        initialized:
            false,

        state:
            "created",

        components:
            new Map(),

        services:
            new Map(),

        modules:
            new Map(),

        dependencies:
            new Map(),

        register:
            function (
                name,
                component
            ) {

                if (!name || !component) {

                    return false;

                }

                this.components.set(
                    name,
                    component
                );

                return true;

            },


        get:
            function (name) {

                return this.components.get(
                    name
                );

            },


        has:
            function (name) {

                return this.components.has(
                    name
                );

            },


        remove:
            function (name) {

                return this.components.delete(
                    name
                );

            },


        registerService:
            function (
                name,
                service
            ) {

                if (!name || !service) {

                    return false;

                }

                this.services.set(
                    name,
                    service
                );

                return true;

            },


        getService:
            function (name) {

                return this.services.get(
                    name
                );

            },


        registerModule:
            function (
                name,
                module
            ) {

                if (!name || !module) {

                    return false;

                }

                this.modules.set(
                    name,
                    module
                );

                return true;

            },


        getModule:
            function (name) {

                return this.modules.get(
                    name
                );

            },


        initialize:
            function () {

                if (this.initialized) {

                    return true;

                }

                this.state =
                    "initializing";

                this.initialized =
                    true;

                this.state =
                    "ready";

                window.HalDo.setStatus(
                    "HalDo Core bereit"
                );

                return true;

            }

    };


/* =========================================================
   CORE REGISTER
   ========================================================= */

window.HalDo.core.register(
    "global",
    window.HalDo
);


/* =========================================================
   EVENT BUS
   ========================================================= */

window.HalDo.events =
    window.HalDo.events ||
    {

        listeners:
            new Map(),

        history:
            [],

        maxHistory:
            500,


        on:
            function (
                event,
                handler,
                options = {}
            ) {

                if (
                    !event ||
                    typeof handler !==
                    "function"
                ) {

                    return function () {};

                }

                if (
                    !this.listeners.has(
                        event
                    )
                ) {

                    this.listeners.set(
                        event,
                        new Set()
                    );

                }

                const listeners =
                    this.listeners.get(
                        event
                    );

                listeners.add(
                    handler
                );

                const unsubscribe =
                    function () {

                        listeners.delete(
                            handler
                        );

                    };

                if (
                    options.once
                ) {

                    const original =
                        handler;

                    const onceHandler =
                        function (
                            ...args
                        ) {

                            unsubscribe();

                            return original(
                                ...args
                            );

                        };

                    listeners.delete(
                        handler
                    );

                    listeners.add(
                        onceHandler
                    );

                    return function () {

                        listeners.delete(
                            onceHandler
                        );

                    };

                }

                return unsubscribe;

            },


        off:
            function (
                event,
                handler
            ) {

                const listeners =
                    this.listeners.get(
                        event
                    );

                if (!listeners) {

                    return false;

                }

                return listeners.delete(
                    handler
                );

            },


        emit:
            function (
                event,
                payload = {},
                options = {}
            ) {

                if (!event) {

                    return false;

                }

                const record =
                    {

                        event:
                            event,

                        payload:
                            payload,

                        timestamp:
                            Date.now(),

                        source:
                            options.source ||
                            "HalDo"

                    };

                this.history.push(
                    record
                );

                if (
                    this.history.length >
                    this.maxHistory
                ) {

                    this.history.shift();

                }

                const listeners =
                    this.listeners.get(
                        event
                    );

                if (!listeners) {

                    return true;

                }

                [
                    ...listeners
                ].forEach(
                    function (
                        handler
                    ) {

                        try {

                            handler(
                                payload,
                                record
                            );

                        }

                        catch (error) {

                            window.HalDo.reportError(
                                error,
                                "EventBus:" +
                                event
                            );

                        }

                    }
                );

                return true;

            },


        once:
            function (
                event,
                handler
            ) {

                return this.on(
                    event,
                    handler,
                    {
                        once:
                            true
                    }
                );

            },


        clear:
            function (event) {

                if (event) {

                    this.listeners.delete(
                        event
                    );

                    return;

                }

                this.listeners.clear();

            },


        getHistory:
            function (
                event
            ) {

                if (!event) {

                    return [
                        ...this.history
                    ];

                }

                return this.history.filter(
                    function (entry) {

                        return (
                            entry.event ===
                            event
                        );

                    }
                );

            }

    };

   GLOBAL EVENT SHORTCUTS
   ========================================================= */

window.HalDo.on =
    function (
        event,
        handler,
        options
    ) {

        return window.HalDo.events.on(
            event,
            handler,
            options
        );

    };

    function (
        event,

                        source:

            function (
                source,
                target,
                handler
            ) {

                if (
                    !source ||
                    !target ||
                    typeof handler !==
                    "function"
                ) {

                    return false;

                }

                const channel =
                    source +
                    ":" +
                    target;

                if (
                    !this.channels.has(
                        channel
                    )
                ) {

                    this.channels.set(
                        channel,
                        new Set()
                    );

                }

                this.channels
                    .get(channel)
                    .add(handler);

                return true;

            },


        disconnect:
            function (
                source,
                target,
                handler
            ) {

                const channel =
                    source +
                    ":" +
                    target;

                const listeners =
                    this.channels.get(
                        channel
                    );

                if (!listeners) {

                    return false;

                }

                return listeners.delete(
                    handler
                );

            },


        send:
            function (
                source,
                target,
                payload = {}
            ) {

                const channel =
                    source +
                    ":" +
                    target;

                const listeners =
                    this.channels.get(
                        channel
                    );

                    "service:message",

                        source:
                            source,

                        target:
                            target,

                        payload:
                            payload

                    {
                        source:
                            "service-bridge"
                    }

                if (!listeners) {

                    return false;

                }

                [
                    ...listeners
                ].forEach(
                    function (
                        handler
                    ) {

                        try {

                            handler(
                                payload,
                                {

                                    source:
                                        source,

                                    target:
                                        target

                            );

                            window.HalDo.reportError(
                                error,
                                "serviceBridge.send"
                            );

                        }

                    }
                );

                return true;

            }

<script>

/* =========================================================

   ========================================================= */

window.HalDo.appContract = {

    version: "20.0.0",

    required: [
        "id",
        "name",
        "version"
    ],

    validate(app) {

        if (!app || typeof app !== "object") {
            return {
                valid: false,
                errors: ["App muss ein Objekt sein."]
            };
        }

        const errors = [];

        this.required.forEach(key => {
            if (!app[key]) {
                errors.push(
                    "Fehlendes App-Feld: " + key
                );
            }
        });

        return {
            valid: errors.length === 0,
            errors
        };
    },

    normalize(app) {

        const normalized = {
            id: app.id,
            name: app.name,
            version: app.version || "1.0.0",
            description: app.description || "",
            category: app.category || "system",
            icon: app.icon || "assets/logo/logo.png",
            width: app.width || "min(760px, 92vw)",
            height: app.height || "min(600px, 78vh)",
            minWidth: app.minWidth || 320,
            minHeight: app.minHeight || 240,
            singleton: app.singleton !== false,
            resizable: app.resizable !== false,
            minimizable: app.minimizable !== false,
            maximizable: app.maximizable !== false,
            closable: app.closable !== false,
            movable: app.movable !== false,
            launchable: app.launchable !== false,
            permissions: Array.isArray(app.permissions)
                ? [...app.permissions]
                : [],
            tags: Array.isArray(app.tags)
                ? [...app.tags]
                : [],
            metadata: {
                ...(app.metadata || {})
            },
            lifecycle: {
                ...(app.lifecycle || {})
            },
            actions: {
                ...(app.actions || {})
            }
        };

        return normalized;
    }
};


/* =========================================================
   APP FOUNDATION
   ========================================================= */

window.HalDo.appFoundation = {

    initialized: false,

    instances: new Map(),

    create(appDefinition) {

        const validation =
            window.HalDo.appContract
                .validate(appDefinition);

        if (!validation.valid) {
            throw new Error(
                validation.errors.join(" ")
            );
        }

        const app =
            window.HalDo.appContract
                .normalize(appDefinition);

        const instance = {

            id: app.id,

            definition: app,

            state: "created",

            createdAt: Date.now(),

            startedAt: null,

            stoppedAt: null,

            context:
                window.HalDo.runtime
                    .createContext(
                        "app:" + app.id,
                        {
                            appId: app.id
                        }
                    ),

            start: async function() {

                if (
                    this.state === "running"
                ) {
                    return true;
                }

                this.state = "starting";

                if (
                    typeof app.lifecycle.start ===
                    "function"
                ) {
                    await app.lifecycle.start(
                        this
                    );
                }

                this.startedAt =
                    Date.now();

                this.state = "running";

                window.HalDo.emit(
                    "app:started",
                    {
                        id: this.id,
                        app: this

                        source:

                if (
                    this.state === "stopped"

                    return true;

                this.state = "stopping";

                if (
                    typeof app.lifecycle.stop ===
                    "function"
                ) {
                    await app.lifecycle.stop(
                        this
                    );
                }

                this.stoppedAt =
                    Date.now();

                this.state = "stopped";

                window.HalDo.emit(
                    "app:stopped",
                    {
                        id: this.id,
                        app: this
                    },
                    {
                        source:
                            "app-foundation"
                    }
                );

                return true;
            },

            destroy: async function() {

                if (
                    this.state === "running"
                ) {
                    await this.stop();
                }

                window.HalDo.runtime
                    .destroyContext(
                        this.context.id
                    );

                this.state =
                    "destroyed";

                window.HalDo.emit(
                    "app:destroyed",
                    {
                        id: this.id
                    },
                    {
                        source:
                            "app-foundation"
                    }
                );

                return true;
            }

        };

        this.instances.set(
            app.id,
            instance
        );

        return instance;
    },

    get(id) {
        return this.instances.get(id);
    },

    remove(id) {
        return this.instances.delete(id);
    },

    list() {
        return [...this.instances.values()];
    },

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        window.HalDo.core.register(
            "appFoundation",
            this
        );

        return true;
    }
};

            },

            }
        );

        return normalized;
    },

    get(id) {

    },

    has(id) {

    },

/* =========================================================
   APP REGISTRY
   ========================================================= */

window.HalDo.appRegistry = {

    initialized: false,

    apps: new Map(),

    aliases: new Map(),

    categories: new Map(),

    register(app) {

        const validation =
            window.HalDo.appContract
                .validate(app);

        if (!validation.valid) {
            throw new Error(
                validation.errors.join(" ")
            );
        }

        const normalized =
            window.HalDo.appContract
                .normalize(app);

        this.apps.set(
            normalized.id,
            normalized
        );

        if (
            normalized.category
        ) {

            if (
                !this.categories.has(
                    normalized.category
                )
            ) {

                this.categories.set(
                    normalized.category,
                    new Set()
                );

            }

            this.categories
                .get(normalized.category)
                .add(normalized.id);
        }

        window.HalDo.emit(
            "app:registered",
            {
                id: normalized.id,
                app: normalized
            },
            {
                source:
                    "app-registry"
            }
        );

        return normalized;
    },

    unregister(id) {

        const app =
            this.apps.get(id);

        if (!app) {
            return false;
        }

        this.apps.delete(id);

        if (
            this.categories.has(
                app.category
            )
        ) {

            this.categories
                .get(app.category)
                .delete(id);
        }

        return true;
    },

    get(id) {
        return this.apps.get(id);
    },

    has(id) {
        return this.apps.has(id);
    },

    alias(name, id) {

        if (
            !this.apps.has(id)
        ) {
            return false;
        }

        this.aliases.set(
            name,
            id
        );

        return true;
    },

    resolve(idOrAlias) {

        if (
            this.apps.has(idOrAlias)
        ) {
            return this.apps.get(
                idOrAlias
            );
        }

        const id =
            this.aliases.get(
                idOrAlias
            );

        if (!id) {
            return null;
        }

        return this.apps.get(id) || null;
    },

    byCategory(category) {

        const ids =
            this.categories.get(
                category
            );

        if (!ids) {
            return [];
        }

        return [...ids]
            .map(id => this.apps.get(id))
            .filter(Boolean);
    },

    search(query) {

        const text =
            String(query || "")
                .toLowerCase()
                .trim();

        if (!text) {
            return this.list();
        }

        return this.list().filter(
            app => {

                const haystack = [
                    app.id,
                    app.name,
                    app.description,
                    app.category,
                    ...(app.tags || [])
                ]
                    .join(" ")
                    .toLowerCase();

                return haystack.includes(text);
            }
        );
    },

    list() {
        return [...this.apps.values()];
    },

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        window.HalDo.core.register(
            "appRegistry",
            this
        );

        return true;
    }
};


/* =========================================================
   APP RUNTIME
   ========================================================= */

window.HalDo.appRuntime = {

    initialized: false,

    running: new Map(),

    start: async function(id) {

        const definition =
            window.HalDo.appRegistry
                .resolve(id);

        if (!definition) {
            throw new Error(
                "App nicht registriert: " + id
            );
        }

        if (
            definition.singleton &&
            this.running.has(
                definition.id
            )
        ) {

            return this.running.get(
                definition.id
            );
        }

        const instance =
            window.HalDo.appFoundation
                .create(
                    definition
                );

        await instance.start();

        this.running.set(
            definition.id,
            instance
        );

        window.HalDo.stateManager.set(
            "os.activeApp",
            definition.id,
            {
                source:
                    "app-runtime"
            }
        );

        window.HalDo.emit(
            "app:opened",
            {
                id:
                    definition.id,

                name:
                    definition.name,

                instance:
                    instance
            },
            {
                source:
                    "app-runtime"
            }
        );

        return instance;
    },

    stop: async function(id) {

        const instance =
            this.running.get(id);

        if (!instance) {
            return false;
        }

        await instance.stop();

        this.running.delete(id);

        window.HalDo.emit(
            "app:closed",
            {
                id
            },
            {
                source:
                    "app-runtime"
            }
        );

        return true;
    },

    restart: async function(id) {

        await this.stop(id);

        return this.start(id);
    },

    get(id) {
        return this.running.get(id);
    },

    isRunning(id) {
        return this.running.has(id);
    },

    listRunning() {
        return [
            ...this.running.values()
        ];
    },

    stopAll: async function() {

        const ids =
            [...this.running.keys()];

        for (
            const id of ids
        ) {

            await this.stop(id);
        }

        return true;
    },

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        window.HalDo.core.register(
            "appRuntime",
            this
        );

        return true;
    }
};

window.HalDo.windowManager = {

    initialized: false,

    windows: new Map(),

    zIndex: 100,

    activeWindow: null,

    defaultWidth:
        "min(760px, 92vw)",

    defaultHeight:
        "min(600px, 78vh)",

    createId(appId) {

        return window.HalDo.runtime
            .createId(
                "window-" + appId
            );
    },

    create(app, options = {}) {

        const id =
            this.createId(
                app.id
            );

        const width =
            options.width ||
            app.width ||
            this.defaultWidth;

        const height =
            options.height ||
            app.height ||
            this.defaultHeight;

        const win = {

            id,

            appId:
                app.id,

            title:
                options.title ||
                app.name,

            width,

            height,

            minWidth:
                options.minWidth ||
                app.minWidth ||
                320,

            minHeight:
                options.minHeight ||
                app.minHeight ||
                240,

            x:
                options.x ??
                Math.max(
                    20,
                    (
                        window.innerWidth -
                        760
                    ) / 2
                ),

            y:
                options.y ??
                Math.max(
                    60,
                    (
                        window.innerHeight -
                        600
                    ) / 2
                ),

            zIndex:
                ++this.zIndex,

            state:
                "normal",

            minimized:
                false,

            maximized:
                false,

            createdAt:
                Date.now(),

            element:
                null
        };

        this.windows.set(
            id,
            win
        );

        this.activeWindow =
            id;

        window.HalDo.stateManager.set(
            "os.activeWindow",
            id,
            {
                source:
                    "window-manager"
            }
        );

        window.HalDo.emit(
            "window:created",
            win,
            {
                source:
                    "window-manager"
            }
        );

        return win;
    },

    get(id) {
        return this.windows.get(id);
    },

    focus(id) {

        const win =
            this.windows.get(id);

        if (!win) {
            return false;
        }

        win.zIndex =
            ++this.zIndex;

        this.activeWindow =
            id;

        window.HalDo.stateManager.set(
            "os.activeWindow",
            id,
            {
                source:
                    "window-manager"
            }
        );

        window.HalDo.emit(
            "window:focused",
            win,
            {
                source:
                    "window-manager"
            }
        );

        return true;
    },

    minimize(id) {

        const win =
            this.windows.get(id);

        if (!win) {
            return false;
        }

        win.minimized =
            true;

        win.state =
            "minimized";

        window.HalDo.emit(
            "window:minimized",
            win,
            {
                source:
                    "window-manager"
            }
        );

        return true;
    },

    restore(id) {

        const win =
            this.windows.get(id);

        if (!win) {
            return false;
        }

        win.minimized =
            false;

        win.maximized =
            false;

        win.state =
            "normal";

        this.focus(id);

        window.HalDo.emit(
            "window:restored",
            win,
            {
                source:
                    "window-manager"
            }
        );

        return true;
    },

    maximize(id) {

        const win =
            this.windows.get(id);

        if (!win) {
            return false;
        }

        win.maximized =
            true;

        win.minimized =
            false;

        win.state =
            "maximized";

        this.focus(id);

        window.HalDo.emit(
            "window:maximized",
            win,
            {
                source:
                    "window-manager"
            }
        );

        return true;
    },

    close(id) {

        const win =
            this.windows.get(id);

        if (!win) {
            return false;
        }

        if (
            win.element &&
            win.element.parentNode
        ) {

            win.element.parentNode
                .removeChild(
                    win.element
                );
        }

        this.windows.delete(id);

        if (
            this.activeWindow === id
        ) {

            this.activeWindow =
                null;

            window.HalDo.stateManager.set(
                "os.activeWindow",
                null,
                {
                    source:
                        "window-manager"
                }
            );
        }

        window.HalDo.emit(
            "window:closed",
            win,
            {
                source:
                    "window-manager"
            }
        );

        return true;
    },

    list() {
        return [...this.windows.values()];
    },

    closeAll() {

        const ids =
            [...this.windows.keys()];

        ids.forEach(
            id => this.close(id)
        );

        return true;
    },

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        window.HalDo.core.register(
            "windowManager",
            this
        );

        return true;
    }
};


/* =========================================================
   APP MANAGER
   ========================================================= */

window.HalDo.appManager = {

    initialized: false,

    install(app) {

        const registered =
            window.HalDo.appRegistry
                .register(app);

        window.HalDo.appManifest
            .register(registered);

        return registered;
    },

    uninstall(id) {

        const runtime =
            window.HalDo.appRuntime;

        if (
            runtime.isRunning(id)
        ) {
            runtime.stop(id);
        }

        return window.HalDo.appRegistry
            .unregister(id);
    },

    get(id) {

        return window.HalDo.appRegistry
            .resolve(id);
    },

    list() {

        return window.HalDo.appRegistry
            .list();
    },

    search(query) {

        return window.HalDo.appRegistry
            .search(query);
    },

    async open(id, options = {}) {

        const app =
            this.get(id);

        if (!app) {
            throw new Error(
                "App nicht gefunden: " + id
            );
        }

        const instance =
            await window.HalDo.appRuntime
                .start(id);

        let win =
            window.HalDo.windowManager
                .list()
                .find(
                    item =>
                        item.appId === id &&
                        item.state !== "closed"
                );

        if (!win) {

            win =
                window.HalDo.windowManager
                    .create(
                        app,
                        options
                    );
        }

        window.HalDo.windowManager
            .focus(win.id);

        window.HalDo.emit(
            "app:window-opened",
            {
                app,
                instance,
                window:
                    win
            },
            {
                source:
                    "app-manager"
            }
        );

        return {
            app,
            instance,
            window:
                win
        };
    },

    async close(id) {

        const windows =
            window.HalDo.windowManager
                .list()
                .filter(
                    win =>
                        win.appId === id
                );

        windows.forEach(
            win =>
                window.HalDo.windowManager
                    .close(win.id)
        );

        return window.HalDo.appRuntime
            .stop(id);
    },

    async restart(id) {

        await this.close(id);

        return this.open(id);
    },

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        window.HalDo.core.register(
            "appManager",
            this
        );

        return true;
    }
};


/* =========================================================
   APP ROUTER
   ========================================================= */

window.HalDo.appRouter = {

    initialized: false,

    current:
        null,

    history: [],

    navigate: async function(
        id,
        options = {}
    ) {

        const app =
            window.HalDo.appRegistry
                .resolve(id);

        if (!app) {

            window.HalDo.emit(
                "router:not-found",
                {
                    id
                },
                {
                    source:
                        "app-router"
                }
            );

            return null;
        }

        const result =
            await window.HalDo.appManager
                .open(
                    app.id,
                    options
                );

        this.history.push(
            app.id
        );

        this.current =
            app.id;

        window.HalDo.emit(
            "router:navigate",
            {
                app:
                    app.id,

                result
            },
            {
                source:
                    "app-router"
            }
        );

        return result;
    },

    back: async function() {

        if (
            this.history.length < 2
        ) {
            return null;
        }

        this.history.pop();

        const previous =
            this.history[
                this.history.length - 1
            ];

        return this.navigate(
            previous
        );
    },

    home: async function() {

        const home =
            window.HalDo.appRegistry
                .resolve(
                    "haldo-home"
                );

        if (!home) {
            return null;
        }

        return this.navigate(
            home.id
        );
    },

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        window.HalDo.core.register(
            "appRouter",
            this
        );

        return true;
    }
};

window.HalDo.initializeAppSystem =
    async function() {

        try {

            window.HalDo.setStatus(
                "HalDo App-System wird gestartet …"
            );

            window.HalDo.appFoundation
                .initialize();

            window.HalDo.appManifest
                .apps;

            window.HalDo.appRegistry
                .initialize();

            window.HalDo.appRuntime
                .initialize();

            window.HalDo.windowManager
                .initialize();

            window.HalDo.appManager
                .initialize();

            window.HalDo.appRouter
                .initialize();

            window.HalDo.stateManager.set(
                "apps.ready",
                true,
                {
                    source:
                        "app-system"
                }
            );

            window.HalDo.emit(
                "apps:ready",
                {
                    count:
                        window.HalDo.appRegistry
                            .list()
                            .length
                },
                {
                    source:
                        "app-system"
                }
            );

            window.HalDo.setStatus(
                "HalDo App-System bereit"
            );

            return true;

        }

        catch (error) {

            window.HalDo.reportError(
                error,
                "initializeAppSystem"
            );

            window.HalDo.setStatus(
                "HalDo App-System Fehler"
            );

            return false;
        }
    };
