<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
HalDo AI OS v10.1
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =====================================
     HALDO HEADER
===================================== -->


<header class="haldo-header">


<div class="haldo-logo">

<div class="logo-circle">
🤖
</div>


<div>

<h1>
HalDo AI
</h1>


<p>
AI Operating System
</p>


</div>


</div>



<div class="system-status">

<span>
🟢 Online
</span>

</div>


</header>









<!-- =====================================
     MAIN LAYOUT
===================================== -->


<div class="os-layout">









<!-- =====================================
     LEFT NAVIGATION
===================================== -->


<aside class="left-sidebar">


<nav class="main-navigation">


<h3>
🚀 Hauptmenü
</h3>



<button class="nav-button active"
data-page="homePage">

🏠 Start

</button>



<button class="nav-button"
data-page="chatPage">

🤖 AI Chat

</button>



<button class="nav-button"
data-page="filesPage">

📁 Dateien

</button>



<button class="nav-button"
data-page="writingPage">

📝 Schreiben

</button>



<button class="nav-button"
data-page="settingsPage">

⚙️ Einstellungen

</button>



</nav>









<div class="sidebar-bottom">


<button class="nav-button">

🌙 Dark Mode

</button>


<button class="nav-button">

❓ Hilfe

</button>


</div>


</aside>









<!-- =====================================
     MAIN CONTENT
===================================== -->


<main class="main-content">









<!-- =====================================
     HOME PAGE
===================================== -->


<section id="homePage"
class="page active">


<div class="welcome-box">


<h2>

Willkommen bei HalDo AI

</h2>


<p>

Dein persönliches AI Betriebssystem.

</p>


<div class="welcome-actions">


<button class="primary-button">

🚀 Start AI

</button>



<button class="primary-button">

💬 Chat öffnen

</button>


</div>


</div>



</section>









<!-- =====================================
     CHAT PAGE PLACEHOLDER
===================================== -->


<section id="chatPage"
class="page">


<h2>
🤖 HalDo AI Chat
</h2>



<div class="chat-container">


</div>



<div class="chat-input-area">


<input

id="chatInput"

placeholder="Nachricht an HalDo..."

>


<button id="sendMessage">

Senden

</button>


</div>


</section>









</main>


</div>








<!-- =====================================
     FILE SYSTEM PAGE
===================================== -->


<section id="filesPage"
class="page">


<h2>
📁 Dateien
</h2>


<div class="app-card">


<input
type="file"
id="fileUpload"
>



<div id="fileList">


<p>
Keine Dateien geladen.
</p>


</div>


</div>


</section>









<!-- =====================================
     WRITING PAGE
===================================== -->


<section id="writingPage"
class="page">


<h2>
📝 Schreiben
</h2>



<div class="app-card">


<textarea

id="writerText"

placeholder="Hier schreiben..."

></textarea>



<button id="saveDocument"
class="primary-button">

💾 Speichern

</button>


</div>


</section>









<!-- =====================================
     PDF CREATOR
===================================== -->


<section id="pdfPage"
class="page">


<h2>
📄 PDF Creator
</h2>



<div class="app-card">


<input

id="pdfTitle"

placeholder="Titel"

>



<textarea

id="pdfText"

placeholder="PDF Inhalt..."

></textarea>



<button

id="createPDF"

class="primary-button">

📄 PDF erstellen

</button>


</div>


</section>









<!-- =====================================
     NOTES PAGE
===================================== -->


<section id="notesPage"
class="page">


<h2>
📒 Notizen
</h2>



<div class="app-card">


<textarea

id="noteInput"

placeholder="Neue Notiz..."

></textarea>



<button

id="addNote"

class="primary-button">

➕ Hinzufügen

</button>



<div id="noteList">

</div>


</div>


</section>









<!-- =====================================
     CALENDAR PAGE
===================================== -->


<section id="calendarPage"
class="page">


<h2>
📅 Kalender
</h2>



<div class="app-card">


<input

type="date"

id="calendarDate"

>



<textarea

id="calendarEvent"

placeholder="Termin..."

></textarea>



<button

id="saveEvent"

class="primary-button">

📅 Speichern

</button>



<div id="calendarList">

</div>


</div>


</section>









<!-- =====================================
     MAIL PAGE
===================================== -->


<section id="mailPage"
class="page">


<h2>
📧 Mail
</h2>



<div class="app-card">


<input

id="mailReceiver"

placeholder="Empfänger"

>



<input

id="mailSubject"

placeholder="Betreff"

>



<textarea

id="mailText"

placeholder="Nachricht..."

></textarea>



<button

id="sendMail"

class="primary-button">

📨 Senden

</button>


</div>


</section>
<script src="script.js"></script>


</body>

</html>
