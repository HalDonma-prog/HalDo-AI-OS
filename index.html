<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>HalDo AI OS 22</title>

<meta
    name="description"
    content="HalDo AI OS 22 – intelligentes, lebendiges und erweiterbares AI-Betriebssystem"
/>

<style>
/* ============================================================
   HALDO AI OS 22
   CENTRAL INDEX
   STABLE START FOUNDATION
   ============================================================ */

:root {
    --bg: #020611;
    --bg2: #071226;
    --panel: rgba(7, 18, 40, .94);
    --panel2: rgba(13, 30, 60, .92);

    --text: #f4f8ff;
    --muted: rgba(225,235,255,.62);

    --green: #38ff9b;
    --green2: #10c978;

    --blue: #65a9ff;
    --cyan: #52eaff;

    --danger: #ff637c;
    --warning: #ffd65c;

    --border: rgba(255,255,255,.11);

    --radius: 18px;

    --topbar-height: 58px;
    --dock-height: 64px;

    --shadow:
        0 30px 90px rgba(0,0,0,.55);

    --font:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    font-family: var(--font);
    color: var(--text);
    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(35,90,180,.18),
            transparent 38%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(20,180,120,.08),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #01040c,
            #030918 48%,
            #02050d
        );
}

/* ============================================================
   BOOT
   ============================================================ */

#haldo-boot {
    position: fixed;
    inset: 0;
    z-index: 999999;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(50,120,255,.13),
            transparent 35%
        ),
        #01040b;
}

.boot-stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.boot-star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    opacity: .7;
    box-shadow: 0 0 8px rgba(255,255,255,.8);
}

.boot-card {
    position: relative;
    width: min(92vw, 620px);

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 34px 26px;

    border: 1px solid var(--border);
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(10,26,55,.96),
            rgba(3,9,21,.97)
        );

    box-shadow:
        0 40px 120px rgba(0,0,0,.65),
        0 0 70px rgba(65,145,255,.10);

    backdrop-filter: blur(25px);
}

.boot-logo {
    width: min(210px, 52vw);
    height: min(210px, 52vw);

    object-fit: contain;

    filter:
        drop-shadow(0 0 20px rgba(100,180,255,.30))
        drop-shadow(0 0 60px rgba(80,150,255,.18));

    animation:
        bootLogoFloat 4s ease-in-out infinite;
}

@keyframes bootLogoFloat {
    0%,100% {
        transform: translateY(0) scale(1);
    }

    50% {
        transform: translateY(-8px) scale(1.025);
    }
}

.boot-title {
    margin-top: 12px;

    font-size: clamp(26px, 6vw, 42px);
    font-weight: 800;
    letter-spacing: -.04em;

    text-align: center;
}

.boot-subtitle {
    margin-top: 8px;

    color: var(--muted);
    text-align: center;
}

.boot-status {
    margin-top: 18px;

    min-height: 22px;

    color: rgba(220,235,255,.72);
    font-size: 13px;

    text-align: center;
}

.boot-start {
    margin-top: 22px;

    min-width: 220px;
    min-height: 52px;

    padding: 0 26px;

    border: 1px solid rgba(80,255,170,.45);
    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            rgba(56,255,155,.24),
            rgba(16,201,120,.14)
        );

    color: #dffff0;

    font-size: 15px;
    font-weight: 800;
    letter-spacing: .04em;

    cursor: pointer;

    box-shadow:
        0 0 30px rgba(56,255,155,.10);

    transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
}

.boot-start:hover {
    transform: translateY(-2px);

    background:
        linear-gradient(
            135deg,
            rgba(56,255,155,.34),
            rgba(16,201,120,.22)
        );

    box-shadow:
        0 0 45px rgba(56,255,155,.20);
}

.boot-start:active {
    transform: scale(.97);
}

.boot-start.hidden {
    display: none;
}

/* ============================================================
   OS ROOT
   ============================================================ */

#haldo-os {
    position: fixed;
    inset: 0;

    display: none;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(40,100,190,.12),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #020611,
            #01040b
        );
}

#haldo-os.visible {
    display: block;
}

/* ============================================================
   GALAXY
   ============================================================ */

.galaxy {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.galaxy-stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 7px rgba(255,255,255,.75);

    animation:
        starPulse var(--pulse, 4s) ease-in-out infinite;
}

@keyframes starPulse {
    0%,100% {
        opacity: .25;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* ============================================================
   LIVING SOLAR SYSTEM
   ============================================================ */

.solar-system {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(560px, 82vw);
    height: min(560px, 82vw);

    transform: translate(-50%, -50%);

    pointer-events: auto;
}

.sun {
    position: absolute;

    left: 50%;
    top: 50%;

    width: clamp(110px, 18vw, 180px);
    height: clamp(110px, 18vw, 180px);

    transform: translate(-50%, -50%);

    border-radius: 50%;

    cursor: pointer;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffef1 0%,
            #fff3a1 12%,
            #ffd33d 30%,
            #ff9e1c 56%,
            #ff6614 76%,
            rgba(255,80,0,.15) 100%
        );

    box-shadow:
        0 0 25px rgba(255,220,80,.95),
        0 0 70px rgba(255,170,30,.65),
        0 0 150px rgba(255,120,20,.38),
        0 0 250px rgba(255,90,0,.18);

    animation:
        sunBreath 4s ease-in-out infinite;
}

@keyframes sunBreath {
    0%,100% {
        filter: brightness(1);
        transform: translate(-50%,-50%) scale(1);
    }

    50% {
        filter: brightness(1.14);
        transform: translate(-50%,-50%) scale(1.035);
    }
}

.sun::before,
.sun::after {
    content: "";

    position: absolute;

    inset: -45%;

    border-radius: 50%;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(255,218,80,.16),
            transparent,
            rgba(255,160,20,.12),
            transparent
        );

    animation:
        sunRays 18s linear infinite;
}

.sun::after {
    inset: -75%;
    opacity: .4;
    animation-duration: 28s;
}

@keyframes sunRays {
    to {
        transform: rotate(360deg);
    }
}

.orbit {
    position: absolute;

    left: 50%;
    top: 50%;

    border:
        1px solid
        rgba(130,190,255,.10);

    border-radius: 50%;

    transform: translate(-50%,-50%);

    animation:
        orbitSpin var(--speed) linear infinite;
}

@keyframes orbitSpin {
    to {
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

.orbit-1 {
    width: 36%;
    height: 36%;
    --speed: 9s;
}

.orbit-2 {
    width: 53%;
    height: 53%;
    --speed: 13s;
}

.orbit-3 {
    width: 70%;
    height: 70%;
    --speed: 18s;
}

.orbit-4 {
    width: 88%;
    height: 88%;
    --speed: 25s;
}

.orbit-5 {
    width: 104%;
    height: 104%;
    --speed: 33s;
}

.planet {
    position: absolute;

    left: 100%;
    top: 50%;

    width: 18px;
    height: 18px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    box-shadow:
        0 0 18px var(--planetGlow);
}

.planet-1 {
    --planetGlow: #9fb7ff;
    background:
        radial-gradient(
            circle at 30% 25%,
            #e9eeff,
            #7689c8 55%,
            #3a4774
        );
}

.planet-2 {
    --planetGlow: #ffc96c;
    background:
        radial-gradient(
            circle at 30% 25%,
            #ffe9b1,
            #cf8737 55%,
            #7c3c25
        );
}

.planet-3 {
    --planetGlow: #49d7ff;
    width: 25px;
    height: 25px;

    background:
        radial-gradient(
            circle at 35% 25%,
            #8ef2ff,
            #237fc5 52%,
            #103d79
        );
}

.planet-4 {
    --planetGlow: #ff7c68;
    width: 20px;
    height: 20px;

    background:
        radial-gradient(
            circle at 35% 25%,
            #ffb89e,
            #a94c43 55%,
            #4d2225
        );
}

.planet-5 {
    --planetGlow: #d9c48b;
    width: 30px;
    height: 30px;

    background:
        radial-gradient(
            circle at 35% 25%,
            #fff4cc,
            #b99758 55%,
            #66502c
        );
}

/* ============================================================
   TOP BAR
   ============================================================ */

.os-topbar {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: var(--topbar-height);

    z-index: 8000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        env(safe-area-inset-top)
        12px
        0
        12px;

    background:
        linear-gradient(
            180deg,
            rgba(1,5,15,.86),
            rgba(1,5,15,.48)
        );

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid
        rgba(255,255,255,.05);
}

.os-brand {
    display: flex;
    align-items: center;
    gap: 10px;

    min-width: 0;
}

.os-brand-logo {
    width: 34px;
    height: 34px;

    object-fit: contain;

    filter:
        drop-shadow(0 0 10px rgba(100,180,255,.25));
}

.os-brand-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    font-size: 14px;
    font-weight: 800;
}

.os-brand-status {
    color: var(--green);

    font-size: 10px;
    font-weight: 700;
}

.os-menu-button {
    width: 44px;
    height: 44px;

    border: 1px solid var(--border);
    border-radius: 13px;

    background:
        rgba(8,20,43,.80);

    color: white;

    cursor: pointer;

    font-size: 23px;

    display: grid;
    place-items: center;

    transition:
        transform .18s ease,
        background .18s ease;
}

.os-menu-button:hover {
    transform: scale(1.04);

    background:
        rgba(30,70,120,.78);
}

/* ============================================================
   APP MENU
   ============================================================ */

.app-menu {
    position: absolute;

    top: calc(
        var(--topbar-height) + 8px
    );

    right: 10px;

    width: min(
        390px,
        calc(100vw - 20px)
    );

    max-height:
        calc(
            100vh -
            var(--topbar-height) -
            18px
        );

    z-index: 10000;

    display: none;

    flex-direction: column;

    border:
        1px solid
        rgba(150,210,255,.15);

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(8,24,52,.98),
            rgba(2,8,20,.99)
        );

    box-shadow:
        0 30px 90px rgba(0,0,0,.65);

    backdrop-filter: blur(25px);

    overflow: hidden;
}

.app-menu.open {
    display: flex;
}

.app-menu-head {
    padding: 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom:
        1px solid var(--border);
}

.app-menu-title {
    font-size: 16px;
    font-weight: 800;
}

.app-menu-search {
    margin: 10px 12px 8px;

    width: calc(100% - 24px);

    height: 40px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 12px;

    outline: none;

    padding: 0 13px;

    background:
        rgba(255,255,255,.05);

    color: white;
}

.app-menu-list {
    overflow: auto;

    padding: 6px 8px 12px;
}

.app-menu-item {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 12px;

    min-height: 48px;

    margin: 3px 0;

    padding: 7px 10px;

    border:
        1px solid
        transparent;

    border-radius: 12px;

    background: transparent;

    color: rgba(255,255,255,.90);

    cursor: pointer;

    text-align: left;

    transition:
        background .15s ease,
        border .15s ease;
}

.app-menu-item:hover {
    background:
        rgba(80,150,255,.10);

    border-color:
        rgba(100,170,255,.14);
}

.app-menu-icon {
    width: 32px;
    height: 32px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background:
        rgba(255,255,255,.06);

    flex: 0 0 auto;

    font-size: 17px;
}

.app-menu-text {
    min-width: 0;
}

.app-menu-name {
    display: block;

    font-size: 13px;
    font-weight: 700;
}

.app-menu-category {
    display: block;

    margin-top: 2px;

    color: rgba(255,255,255,.40);

    font-size: 10px;
}

/* ============================================================
   WINDOW LAYER
   ============================================================ */

.window-layer {
    position: absolute;

    inset:
        var(--topbar-height)
        0
        0
        0;

    z-index: 5000;

    pointer-events: none;
}

.haldo-window {
    position: absolute;

    display: flex;
    flex-direction: column;

    width: 720px;
    height: 480px;

    min-width: 320px;
    min-height: 220px;

    max-width: calc(100vw - 20px);
    max-height: calc(100vh - 90px);

    border:
        1px solid
        rgba(180,220,255,.14);

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(8,24,50,.98),
            rgba(2,9,22,.99)
        );

    box-shadow:
        0 35px 100px rgba(0,0,0,.60),
        0 0 50px rgba(80,150,255,.08);

    overflow: hidden;

    pointer-events: auto;

    transition:
        opacity .14s ease,
        transform .14s ease,
        box-shadow .14s ease;
}

.haldo-window.active {
    box-shadow:
        0 40px 110px rgba(0,0,0,.65),
        0 0 70px rgba(80,160,255,.13);

    border-color:
        rgba(140,205,255,.26);
}

.haldo-window.minimized {
    display: none;
}

.haldo-window.maximized {
    left: 10px !important;
    top: 10px !important;

    width: calc(100vw - 20px) !important;
    height: calc(100vh - 80px) !important;

    border-radius: 12px;
}

.window-header {
    height: 48px;
    min-height: 48px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7px 0 14px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    user-select: none;

    cursor: grab;
}

.window-header:active {
    cursor: grabbing;
}

.window-title {
    min-width: 0;

    display: flex;
    align-items: center;
    gap: 9px;
}

.window-icon {
    width: 29px;
    height: 29px;

    display: grid;
    place-items: center;

    border-radius: 9px;

    background:
        rgba(255,255,255,.07);
}

.window-name {
    max-width: 300px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    font-size: 13px;
    font-weight: 750;
}

.window-controls {
    display: flex;
    gap: 3px;
}

.window-control {
    width: 35px;
    height: 34px;

    border: 0;
    border-radius: 9px;

    background: transparent;

    color: rgba(255,255,255,.70);

    cursor: pointer;

    font-size: 16px;
}

.window-control:hover {
    background:
        rgba(255,255,255,.09);

    color: white;
}

.window-control.close:hover {
    background:
        rgba(255,70,90,.28);
}

.window-body {
    min-height: 0;
    flex: 1;

    overflow: hidden;
}

.window-content {
    width: 100%;
    height: 100%;

    overflow: auto;

    padding: 18px;
}

/* ============================================================
   GENERIC APP UI
   ============================================================ */

.app-shell {
    min-height: 100%;

    display: flex;
    flex-direction: column;

    gap: 14px;
}

.app-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 12px;

    padding-bottom: 14px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.app-heading {
    display: flex;
    gap: 12px;
    align-items: center;
}

.app-large-icon {
    width: 52px;
    height: 52px;

    display: grid;
    place-items: center;

    border-radius: 15px;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.18),
            rgba(255,255,255,.04)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    font-size: 25px;
}

.app-title {
    margin: 0;

    font-size: 20px;
}

.app-description {
    margin: 4px 0 0;

    color: var(--muted);

    font-size: 12px;
}

.app-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(150px, 1fr)
        );

    gap: 10px;
}

.app-card {
    min-height: 92px;

    padding: 13px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 14px;

    background:
        rgba(255,255,255,.035);
}

.app-card strong {
    display: block;

    margin-bottom: 6px;

    font-size: 12px;
}

.app-card span {
    color:
        rgba(255,255,255,.50);

    font-size: 11px;

    line-height: 1.5;
}

.app-button {
    min-height: 40px;

    padding: 0 14px;

    border:
        1px solid
        rgba(100,170,255,.18);

    border-radius: 11px;

    background:
        rgba(80,150,255,.09);

    color: white;

    cursor: pointer;
}

.app-button:hover {
    background:
        rgba(80,150,255,.16);
}

.app-input,
.app-textarea,
.app-select {
    width: 100%;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 11px;

    outline: none;

    background:
        rgba(255,255,255,.045);

    color: white;

    padding: 11px 12px;
}

.app-textarea {
    resize: vertical;
    min-height: 110px;
}

/* ============================================================
   HALDO AI
   ============================================================ */

.ai-shell {
    height: 100%;

    display: flex;
    flex-direction: column;
}

.ai-avatar-area {
    display: flex;
    align-items: center;
    gap: 14px;

    padding-bottom: 12px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.ai-avatar {
    width: 62px;
    height: 62px;

    object-fit: contain;

    border-radius: 50%;

    filter:
        drop-shadow(0 0 18px rgba(100,190,255,.25));

    animation:
        aiBreath 3.6s ease-in-out infinite;
}

@keyframes aiBreath {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.035);
    }
}

.ai-status {
    color: var(--green);

    font-size: 11px;
    font-weight: 700;
}

.ai-messages {
    min-height: 0;
    flex: 1;

    overflow: auto;

    padding: 14px 2px;
}

.ai-message {
    max-width: 88%;

    padding: 11px 13px;

    margin-bottom: 9px;

    border-radius: 14px;

    line-height: 1.55;

    font-size: 13px;

    white-space: pre-wrap;
}

.ai-message.ai {
    background:
        rgba(70,130,255,.09);

    border:
        1px solid
        rgba(90,160,255,.12);
}

.ai-message.user {
    margin-left: auto;

    background:
        rgba(50,220,145,.09);

    border:
        1px solid
        rgba(50,220,145,.12);
}

.ai-input-area {
    display: flex;
    gap: 7px;

    padding-top: 10px;

    border-top:
        1px solid
        rgba(255,255,255,.07);
}

.ai-input {
    flex: 1;

    min-width: 0;

    min-height: 44px;

    padding: 0 13px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 12px;

    background:
        rgba(255,255,255,.045);

    color: white;

    outline: none;
}

.ai-send,
.ai-speak {
    width: 45px;
    min-width: 45px;

    border: 0;
    border-radius: 12px;

    background:

<script>
/* ============================================================
   HALDO AI OS 22
   CENTRAL RUNTIME
   ============================================================ */

"use strict";

(() => {

    const HD =
        window.HalDo =
        window.HalDo || {};


    /* ========================================================
       CONFIG
       ======================================================== */

    HD.config =
        Object.assign(
            {
                version: "22.0.0",

                name: "HalDo AI OS 22",

                minimumWindowWidth: 320,
                minimumWindowHeight: 220,

                defaultWindowWidth: 720,
                defaultWindowHeight: 480,

                startupSound: true,

                logoPath:
                    "assets/logo/logo.png",

                storagePrefix:
                    "haldo-ai-os-22:"
            },

            HD.config || {}
        );


    /* ========================================================
       EVENT SYSTEM
       ======================================================== */

    HD.events =
        HD.events ||
        {

            listeners:
                new Map(),

            on(
                event,
                callback
            ) {

                if (
                    typeof callback !==
                    "function"
                ) {

                    return () => {};

                }

                if (
                    !this.listeners.has(
                        event
                    )
                ) {

                    this.listeners.set(
                        event,
                        new Set()
                    );

                }

                this.listeners
                    .get(event)
                    .add(callback);

                return () => {

                    this.off(
                        event,
                        callback
                    );

                };

            },


            off(
                event,
                callback
            ) {

                const set =
                    this.listeners.get(
                        event
                    );

                if (!set) {

                    return;

                }

                set.delete(callback);

            },


            emit(
                event,
                data
            ) {

                const set =
                    this.listeners.get(
                        event
                    );

                if (!set) {

                    return;

                }

                [...set]
                    .forEach(
                        callback => {

                            try {

                                callback(
                                    data
                                );

                            }

                            catch (error) {

                                console.error(
                                    "[HalDo Event]",
                                    event,
                                    error
                                );

                            }

                        }
                    );

            }

        };


    HD.emit =
        function(
            event,
            data
        ) {

            return HD.events.emit(
                event,
                data
            );

        };


    /* ========================================================
       STORAGE
       ======================================================== */

    HD.storage =
        HD.storage ||
        {

            key(
                name
            ) {

                return (
                    HD.config.storagePrefix +
                    name
                );

            },


            set(
                name,
                value
            ) {

                try {

                    localStorage.setItem(
                        this.key(name),
                        JSON.stringify(
                            value
                        )
                    );

                    return true;

                }

                catch (error) {

                    console.warn(
                        "[HalDo Storage]",
                        error
                    );

                    return false;

                }

            },


            get(
                name,
                fallback = null
            ) {

                try {

                    const value =
                        localStorage.getItem(
                            this.key(name)
                        );

                    if (
                        value ===
                        null
                    ) {

                        return fallback;

                    }

                    return JSON.parse(
                        value
                    );

                }

                catch (_) {

                    return fallback;

                }

            },


            remove(
                name
            ) {

                try {

                    localStorage.removeItem(
                        this.key(name)
                    );

                    return true;

                }

                catch (_) {

                    return false;

                }

            }

        };


    HD.appState =
        HD.appState ||
        {

            get(
                appId
            ) {

                return HD.storage.get(
                    "app-state:" + appId,
                    {}
                );

            },


            save(
                appId,
                state
            ) {

                const result =
                    HD.storage.set(
                        "app-state:" + appId,
                        state || {}
                    );

                HD.emit(
                    "app-state:saved",
                    {
                        appId,
                        state
                    }
                );

                return result;

            }

        };


    /* ========================================================
       RUNTIME
       ======================================================== */

    HD.runtime =
        HD.runtime ||
        {

            initialized: false,

            components:
                new Map(),

            register(
                name,
                component
            ) {

                if (!name) {

                    return false;

                }

                this.components.set(
                    name,
                    component
                );

                return true;

            },


            get(
                name
            ) {

                return this.components.get(
                    name
                );

            }

        };


    /* ========================================================
       ROUTER
       ======================================================== */

    HD.router =
        HD.router ||
        {

            current:
                null,

            history:
                [],

            navigate(
                appId,
                params = {}
            ) {

                this.current = {
                    appId,
                    params
                };

                this.history.push(
                    this.current
                );

                HD.emit(
                    "router:navigate",
                    this.current
                );

                return true;

            },


            back() {

                if (
                    this.history.length >
                    1
                ) {

                    this.history.pop();

                    this.current =
                        this.history[
                            this.history.length - 1
                        ];

                    HD.emit(
                        "router:back",
                        this.current
                    );

                    return this.current;

                }

                return null;

            }

        };


    /* ========================================================
       COMPLETE APP REGISTRY
       ======================================================== */

    const APP_LIST = [

        ["haldo-ai", "HalDo AI", "☀️", "AI Core"],
        ["chat", "Chat", "💬", "Kommunikation"],
        ["voice", "Voice", "🎙️", "Sprache"],
        ["mail", "HalDo Mail", "📧", "Kommunikation"],
        ["browser", "HalDo Browser", "🌐", "Internet"],
        ["translator", "Übersetzer", "🌍", "Sprache"],
        ["dictionary", "Wörterbuch", "📖", "Sprache"],
        ["languages", "Sprachen", "🗣️", "Sprache"],
        ["ezidi-keyboard", "Êzîdî-Tastatur", "⌨️", "Eingabe"],

        ["traffic", "Verkehr", "🚗", "Mobilität"],
        ["traffic-warnings", "Verkehrswarnungen", "⚠️", "Mobilität"],
        ["maps", "Karten", "🗺️", "Navigation"],
        ["navigation", "Navigation", "🧭", "Navigation"],
        ["driving-school", "Fahrschule", "🚘", "Verkehr"],
        ["driving-license", "Führerschein / Verkehrslernen", "🚦", "Verkehr"],

        ["health", "Gesundheit", "🏥", "Gesundheit"],
        ["medications", "Medikamente / Erinnerungen", "💊", "Gesundheit"],

        ["learning", "Lernen", "🧠", "Bildung"],
        ["university", "Universität", "🎓", "Bildung"],
        ["school", "Schule", "🏫", "Bildung"],
        ["training", "Ausbildung", "🧑‍🏫", "Bildung"],
        ["library", "Bibliothek", "📚", "Bildung"],

        ["notes", "Notizen", "📝", "Organisation"],
        ["calendar", "Kalender", "📅", "Organisation"],
        ["reminders", "Erinnerungen", "⏰", "Organisation"],

        ["weather", "Wetter", "🌦️", "Umwelt"],
        ["nature", "Natur / Wiesen", "🌱", "Natur"],
        ["environment", "Umwelt", "🌳", "Umwelt"],
        ["science", "Wissenschaft", "🔬", "Wissenschaft"],

        ["code", "Code / Entwicklung", "💻", "Entwicklung"],
        ["files", "Dateien", "📁", "System"],
        ["documents", "Dokumente", "🗂️", "Organisation"],
        ["communication", "Kommunikation", "📧", "Kommunikation"],
        ["notifications", "Benachrichtigungen", "🔔", "System"],

        ["settings", "Einstellungen", "⚙️", "System"],
        ["security", "Sicherheit", "🔐", "System"],
        ["user", "Benutzer", "👤", "System"],
        ["storage", "Speicher", "💾", "System"],
        ["network", "Netzwerk", "🌐", "System"],
        ["updates", "Updates", "🔄", "System"],
        ["system-status", "Systemstatus", "📊", "System"],
        ["system-tools", "Systemtools", "🛠️", "System"],

        ["bluetooth", "Bluetooth", "🔵", "Verbindung"],
        ["vehicle", "Fahrzeug / Android Auto", "🚘", "Verbindung"],

        ["music-studio", "HalDo Music Studio", "🎵", "Creative Studio"],
        ["audio-studio", "HalDo Audio Studio", "🎙️", "Creative Studio"],
        ["video-studio", "HalDo Video Studio", "🎬", "Creative Studio"],
        ["creative-studio", "HalDo Creative Studio", "🖼️", "Creative Studio"],
        ["design-studio", "HalDo Design Studio", "🎨", "Creative Studio"]

    ];


    HD.appRegistry =
        HD.appRegistry ||
        {

            apps:
                new Map(),

            register(
                manifest
            ) {

                if (
                    !manifest ||
                    !manifest.id
                ) {

                    return false;

                }

                this.apps.set(
                    manifest.id,
                    manifest
                );

                return true;

            },


            get(
                appId
            ) {

                return this.apps.get(
                    appId
                ) || null;

            },


            all() {

                return [
                    ...this.apps.values()
                ];

            }

        };


    APP_LIST.forEach(
        item => {

            HD.appRegistry.register(
                {
                    id: item[0],
                    name: item[1],
                    icon: item[2],
                    category: item[3],
                    description:
                        item[1] +
                        " – HalDo AI OS Anwendung.",
                    persistent: false
                }
            );

        }
    );


    /* ========================================================
       APP RUNTIME
       ======================================================== */

    HD.appRuntime =
        HD.appRuntime ||
        {

            instances:
                new Map(),

            get(
                appId
            ) {

                return this.instances.get(
                    appId
                );

            }

        };


    /* ========================================================
       AI ENGINE
       ======================================================== */

    HD.ai =
        HD.ai ||
        {

            history:
                HD.storage.get(
                    "ai-history",
                    []
                ),


            save() {

                HD.storage.set(
                    "ai-history",
                    this.history
                );

            },


            remember(
                role,
                content
            ) {

                this.history.push(
                    {
                        role,
                        content,
                        timestamp:
                            Date.now()
                    }
                );

                if (
                    this.history.length >
                    100
                ) {

                    this.history =
                        this.history.slice(
                            -100
                        );

                }

                this.save();

            },


            respond(
                text
            ) {

                const input =
                    String(
                        text || ""
                    ).trim();

                if (!input) {

                    return "Schreib mir einfach, was du wissen oder machen möchtest.";

                }

                const lower =
                    input.toLowerCase();


                if (
                    /^(hallo|hi|hey|guten morgen|guten tag|guten abend)/i
                        .test(
                            input
                        )
                ) {

                    return (
                        "Hallo! Ich bin HalDo AI. " +
                        "Ich bin bereit, mit dir zu schreiben, " +
                        "Fragen zu beantworten, Ideen zu entwickeln " +
                        "und dich durch HalDo AI OS 22 zu begleiten."
                    );

                }


                if (
                    lower.includes("wer bist du")
                ) {

                    return (
                        "Ich bin HalDo AI – die zentrale intelligente " +
                        "Assistenz von HalDo AI OS 22. " +
                        "Ich kann mit dir kommunizieren und die " +
                        "Funktionen des Systems koordinieren."
                    );

                }


                if (
                    lower.includes("was kannst du")
                ) {

                    return (
                        "Ich kann dir beim Schreiben, Erklären, " +
                        "Übersetzen, Lernen, Planen, Organisieren, " +
                        "Programmieren und bei vielen Aufgaben helfen. " +
                        "Über die Apps kann ich außerdem Systemfunktionen " +
                        "und Arbeitsabläufe anstoßen."
                    );

                }


                if (
                    lower.includes("danke")
                ) {

                    return (
                        "Sehr gerne. 💙❤️ Ich bin da."
                    );

                }


                if (
                    lower.includes("hilfe")
                ) {

                    return (
                        "Natürlich. Sag mir einfach dein Ziel. " +
                        "Du kannst mir eine Frage stellen oder direkt " +
                        "sagen, was du erledigen möchtest."
                    );

                }


                if (
                    lower.includes("zeit")
                ) {

                    return (
                        "Die aktuelle Systemzeit ist " +
                        new Date()
                            .toLocaleTimeString(
                                "de-DE"
                            ) +
                        "."
                    );

                }


                if (
                    lower.includes("datum")
                ) {

                    return (
                        "Heute ist " +
                        new Date()
                            .toLocaleDateString(
                                "de-DE"
                            ) +
                        "."
                    );

                }


                if (
                    lower.includes("öffne") ||
                    lower.includes("oeffne") ||
                    lower.includes("starte")
                ) {

                    const found =
                        HD.appRegistry
                            .all()
                            .find(
                                app =>
                                    lower.includes(
                                        app.name
                                            .toLowerCase()
                                    )
                            );

                    if (found) {

                        setTimeout(
                            () => {

                                HD.appManager.open(
                                    found.id
                                );

                            },
                            150
                        );

                        return (
                            found.name +
                            " wird geöffnet."
                        );

                    }

                }


                /*
                 * Lokale, sichere Antwort,
                 * falls keine externe AI-API verbunden ist.
                 *
                 * Die Architektur bleibt offen für
                 * eine spätere echte AI-Backend-Anbindung.
                 */

                return (
                    "Ich habe deine Nachricht verstanden:\n\n" +
                    "„" +
                    input +
                    "“\n\n" +
                    "Ich bin bereit, daran weiterzuarbeiten. " +
                    "Für eine vollständige externe KI-Antwort " +
                    "kann später ein echtes AI-Backend über " +
                    "den gemeinsamen AI-Core angebunden werden."
                );

            }

        };


    /* ========================================================
       WINDOW MANAGER
       ======================================================== */

    HD.windowManager =
        HD.windowManager ||
        {

            windows:
                new Map(),

            zIndex:
                5100,

            activeWindowId:
                null,


            create(
                instance
            ) {

                if (!instance) {

                    return null;

                }


                const existing =
                    this.windows.get(
                        instance.id
                    );

                if (existing) {

                    return existing;

                }


                const layer =
                    document.getElementById(
                        "window-layer"
                    );


                const record = {

                    id:
                        instance.id,

                    app:
                        instance,

                    x:
                        80 +
                        (
                            this.windows.size *
                            24
                        ),

                    y:
                        70 +
                        (
                            this.windows.size *
                            20
                        ),

                    width:
                        HD.config.defaultWindowWidth,

                    height:
                        HD.config.defaultWindowHeight,

                    maximized:
                        false,

                    minimized:
                        false,

                    element:
                        null

                };


                const saved =
                    HD.storage.get(
                        "window:" +
                        instance.id,
                        null
                    );


                if (saved) {

                    Object.assign(
                        record,
                        saved
                    );

                }


                const windowElement =
                    document.createElement(
                        "section"
                    );

                windowElement.className =
                    "haldo-window";

                windowElement.dataset.appId =
                    instance.id;


                const header =
                    document.createElement(
                        "div"
                    );

                header.className =
                    "window-header";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "window-title";


                const icon =
                    document.createElement(
                        "div"
                    );

                icon.className =
                    "window-icon";

                icon.textContent =
                    instance.manifest.icon;


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "window-name";

                name.textContent =
                    instance.name;


                title.appendChild(
                    icon
                );

                title.appendChild(
                    name
                );


                const controls =
                    document.createElement(
                        "div"
                    );

                controls.className =
                    "window-controls";


                const minimize =
                    this.control(
                        "−",
                        "minimize"
                    );

                const maximize =
                    this.control(
                        "□",
                        "maximize"
                    );

                const close =
                    this.control(
                        "×",
                        "close"
                    );


                controls.appendChild(
                    minimize
                );

                controls.appendChild(
                    maximize
                );

                controls.appendChild(
                    close
                );


                header.appendChild(
                    title
                );

                header.appendChild(
                    controls
                );


                const body =
                    document.createElement(
                        "div"
                    );

                body.className =
                    "window-body";


                const content =
                    document.createElement(
                        "div"
                    );

                content.className =
                    "window-content";


                body.appendChild(
                    content
                );


                windowElement.appendChild(
                    header
                );

                windowElement.appendChild(
                    body
                );


                layer.appendChild(
                    windowElement
                );


                record.element =
                    windowElement;


                this.windows.set(
                    instance.id,
                    record
                );


                this.bindWindowEvents(
                    record,
                    header,
                    minimize,
                    maximize,
                    close
                );


                this.renderApp(
                    record,
                    content
                );


                this.apply(
                    record
                );


                return record;

            },


            control(
                text,
                type
            ) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "window-control " +
                    type;

                button.textContent =
                    text;

                return button;

            },


            bindWindowEvents(
                record,
                header,
                minimize,
                maximize,
                close
            ) {

                let dragging =
                    false;

                let offsetX = 0;
                let offsetY = 0;


                header.addEventListener(
                    "pointerdown",
                    event => {

                        if (
                            event.target.closest(
                                ".window-controls"
                            )
                        ) {

                            return;

                        }

                        if (
                            record.maximized
                        ) {

                            return;

                        }

                        dragging =
                            true;

                        offsetX =
                            event.clientX -
                            record.x;

                        offsetY =
                            event.clientY -
                            record.y;

                        try {

                            header.setPointerCapture(
                                event.pointerId
                            );

                        }

                        catch (_) {}

                        this.focus(
                            record.id
                        );

                    }
                );


                header.addEventListener(
                    "pointermove",
                    event => {

                        if (!dragging) {

                            return;

                        }

                        record.x =
                            event.clientX -
                            offsetX;

                        record.y =
                            event.clientY -
                            offsetY;

                        this.keepInside(
                            record
                        );

                        this.apply(
                            record
                        );

                    }
                );


                header.addEventListener(
                    "pointerup",
                    event => {

                        dragging =
                            false;

                        try {

                            header.releasePointerCapture(
                                event.pointerId
                            );

                        }

                        catch (_) {}

                        this.save(
                            record
                        );

                    }
                );


                record.element.addEventListener(
                    "pointerdown",
                    () => {

                        this.focus(
                            record.id
                        );

                    }
                );


                minimize.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();
                        event.stopPropagation();

                        this.minimize(
                            record.id
                        );

                    }
                );


                maximize.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();
                        event.stopPropagation();

                        if (
                            record.maximized
                        ) {

                            this.restore(
                                record.id
                            );

                        }

                        else {

                            this.maximize(
                                record.id
                            );

                        }

                    }
                );


                /*
                 * WICHTIG:
                 * Ein einziger Klick auf X
                 * schließt das Fenster.
                 */

                close.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();
                        event.stopPropagation();

                        this.close(
                            record.id
                        );

                    }
                );

            },


            open(
                instance
            ) {

                const record =
                    this.windows.get(
                        instance.id
                    ) ||
                    this.create(
                        instance
                    );


                if (!record) {

                    return null;

                }


                record.minimized =
                    false;

                record.element.style.display =
                    "flex";

                instance.opened =
                    true;

                instance.closed =
                    false;

                this.apply(
                    record
                );

                this.focus(
                    record.id
                );


                return record;

            },


            focus(
                id
            ) {

                const record =
                    this.windows.get(
                        id
                    );

                if (!record) {

                    return;

                }

                this.zIndex++;

                record.element.style.zIndex =
                    String(
                        this.zIndex
                    );

                record.element.classList
                    .add(
                        "active"
                    );

                this.windows.forEach(
                    other => {

                        if (
                            other.id !== id
                        ) {

                            other.element
                                .classList
                                .remove(
                                    "active"
                                );

                        }

                    }
                );

                this.activeWindowId =
                    id;

                HD.router.navigate(
                    id
                );

                HD.emit(
                    "window:focused",
                    {
                        window:
                            record
                    }
                );

            },


            minimize(
                id
            ) {

                const record =
                    this.windows.get(
                        id
                    );

                if (!record) {

                    return;

                }

                record.minimized =
                    true;

                record.element.classList
                    .add(
                        "minimized"
                    );

                record.app.minimized =
                    true;

                record.app.active =
                    false;

                this.save(
                    record
                );

                HD.emit(
                    "window:minimized",
                    {
                        window:
                            record
                    }
                );

            },


            restore(
                id
            ) {

                const record =
                    this.windows.get(
                        id
                    );

                if (!record) {

                    return;

                }

                record.minimized =
                    false;

                record.maximized =
                    false;

                record.element.classList
                    .remove(
                        "minimized"
                    );

                record.app.minimized =
                    false;

                record.app.maximized =
                    false;

                this.apply(
                    record
                );

                this.focus(
                    id
                );

                this.save(
                    record
                );

            },


            maximize(
                id
            ) {

                const record =
                    this.windows.get(
                        id
                    );

                if (!record) {

                    return;

                }

                record.maximized =
                    true;

                record.minimized =
                    false;

                record.element.classList
                    .remove(
                        "minimized"
                    );

                record.app.maximized =
                    true;

                this.apply(
                    record
                );

                this.focus(
                    id
                );

                this.save(
                    record
                );

            },


            close(
                id
            ) {

                const record =
                    this.windows.get(
                        id
                    );

                if (!record) {

                    return false;

                }


                /*
                 * Sofort schließen.
                 * Kein zweiter Klick.
                 */

                record.app.opened =
                    false;

                record.app.closed =
                    true;

                record.app.active =
                    false;


                this.save(
                    record
                );


                record.element.remove();


                this.windows.delete(
                    id
                );


                if (
                    this.activeWindowId ===
                    id
                ) {

                    this.activeWindowId =
                        null;

                }


                HD.emit(
                    "window:closed",
                    {
                        window:
                            record
                    }
                );


                HD.emit(
                    "app:closed",
                    {
                        app:
                            record.app
                    }
                );


                return true;

            },


            save(
                record
            ) {

                HD.storage.set(
                    "window:" +
                    record.id,
                    {
                        x:
                            record.x,

                        y:
                            record.y,

                        width:
                            record.width,

                        height:
                            record.height,

                        maximized:
                            record.maximized
                    }
                );

            },


            keepInside(
                record
            ) {

                const maxX =
                    Math.max(
                        8,
                        window.innerWidth -
                        record.width -
                        8
                    );

                const maxY =
                    Math.max(
                        8,
                        window.innerHeight -
                        record.height -
                        70
                    );

                record.x =
                    Math.min(
                        maxX,
                        Math.max(
                            8,
                            record.x
                        )
                    );

                record.y =
                    Math.min(
                        maxY,
                        Math.max(
                            8,
                            record.y
                        )
                    );

            },


            apply(
                record
            ) {

                if (!record.element) {

                    return;

                }

                if (
                    window.innerWidth <=
                    700
                ) {

                    record.element.style.left =
                        "8px";

                    record.element.style.top =
                        "8px";

                    record.element.style.width =
                        "calc(100vw - 16px)";

                    record.element.style.height =
                        "calc(100vh - 74px)";

                }

                else {

                    record.element.style.left =
                        record.x + "px";

                    record.element.style.top =
                        record.y + "px";

                    record.element.style.width =
                        record.width + "px";

                    record.element.style.height =
                        record.height + "px";

                }


                if (
                    record.maximized
                ) {

                    record.element.classList
                        .add(
                            "maximized"
                        );

                }

                else {

                    record.element.classList
                        .remove(
                            "maximized"
                        );

                }

            },


            renderApp(
                record,
                content
            ) {

                const id =
                    record.id;


                content.innerHTML =
                    "";


                if (
                    id ===
                    "haldo-ai"
                ) {

                    this.renderAI(
                        record,
                        content
                    );

                    return;

                }


                if (
                    id ===
                    "mail"
                ) {

                    this.renderMail(
                        record,
                        content
                    );

                    return;

                }


                if (
                    id ===
                    "settings"
                ) {

                    this.renderSettings(
                        record,
                        content
                    );

                    return;

                }


                this.renderGeneric(
                    record,
                    content
                );

            },

                        recognition.interimResults =

                        recognition.maxAlternatives =
                            1;

                            event => {

                                input.value =
                                    event.results[0][0].transcript;

                                submit();

                            };


                        recognition.onerror =
                            () => {

                                addMessage(
                                    "Die Spracheingabe konnte nicht gestartet werden.",

                                );
