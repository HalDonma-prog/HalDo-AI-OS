<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050816"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS 20"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – Cosmic Artificial Intelligence Operating System"
    >

    <title>HalDo AI OS 20</title>

    <!-- ======================================================
         HALDO CSS
         ====================================================== -->

    <link
        rel="stylesheet"
        href="css/haldo-logo-engine.css"
    >

    <style>

        /* ====================================================
           01 — GLOBAL
           ==================================================== */

        :root {

            --haldo-bg:
                #02030b;

            --haldo-panel:
                rgba(8, 13, 32, .82);

            --haldo-panel-strong:
                rgba(7, 12, 30, .94);

            --haldo-border:
                rgba(255, 255, 255, .13);

            --haldo-text:
                #ffffff;

            --haldo-soft:
                rgba(255, 255, 255, .68);

            --haldo-glow:
                rgba(92, 170, 255, .45);

            --haldo-radius:
                22px;

            --sidebar-width:
                86px;

            --rightbar-width:
                320px;

            --top-height:
                70px;

            --bottom-height:
                76px;

        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background:
                var(--haldo-bg);

            color:
                var(--haldo-text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing:
                antialiased;

            text-rendering:
                optimizeLegibility;
        }


        button,
        input,
        textarea,
        select {

            font: inherit;
        }


        button {

            border: 0;
            outline: none;

            color:
                inherit;

            cursor:
                pointer;
        }


        /* ====================================================
           02 — COSMIC WORLD
           ==================================================== */

        #haldo-cosmic-world {

            position: fixed;

            inset: 0;

            z-index: 0;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 42%,
                    rgba(42, 67, 145, .25),
                    transparent 24%
                ),

                radial-gradient(
                    circle at 15% 20%,
                    rgba(72, 44, 165, .20),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 82% 75%,
                    rgba(0, 153, 255, .13),
                    transparent 27%
                ),

                linear-gradient(
                    135deg,
                    #01020a,
                    #030717 45%,
                    #01030d
                );
        }


        #haldo-cosmic-world::before {

            content: "";

            position: absolute;

            width: 55vw;
            height: 55vw;

            max-width: 760px;
            max-height: 760px;

            min-width: 360px;
            min-height: 360px;

            left: 50%;
            top: 46%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(255, 220, 105, .25) 0%,
                    rgba(255, 190, 70, .11) 23%,
                    rgba(90, 140, 255, .05) 43%,
                    transparent 70%
                );

            filter:
                blur(12px);

            animation:
                cosmicPulse 7s ease-in-out infinite;

            pointer-events:
                none;
        }


        @keyframes cosmicPulse {

            0%,
            100% {
                opacity: .70;
                transform:
                    translate(-50%, -50%)
                    scale(.96);
            }

            50% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.05);
            }
        }


        /* ====================================================
           03 — STAR FIELD
           ==================================================== */

        .star-field {

            position: absolute;

            inset: 0;

            pointer-events: none;

            overflow: hidden;
        }


        .star {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background:
                #ffffff;

            box-shadow:
                0 0 7px rgba(255,255,255,.9);

            animation:
                starTwinkle var(--duration)
                ease-in-out infinite;

            animation-delay:
                var(--delay);

            opacity:
                var(--opacity);
        }


        .star.big {

            width: 3px;
            height: 3px;

            box-shadow:
                0 0 12px rgba(255,255,255,.95);
        }


        @keyframes starTwinkle {

            0%,
            100% {
                opacity:
                    .25;
                transform:
                    scale(.65);
            }

            50% {
                opacity:
                    1;
                transform:
                    scale(1.4);
            }
        }


        /* ====================================================
           04 — COSMIC OBJECTS
           ==================================================== */

        .cosmic-object {

            position: absolute;

            pointer-events:
                none;

            user-select:
                none;
        }


        .sun {

            left: 50%;
            top: 48%;

            width: 190px;
            height: 190px;

            transform:
                translate(-50%, -50%);

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 35% 30%,
                    #fffbd1 0%,
                    #fff3a2 13%,
                    #ffd35c 35%,
                    #ff9b27 65%,
                    #ef5d12 100%
                );

            box-shadow:

                0 0 20px
                    rgba(255, 218, 93, .95),

                0 0 60px
                    rgba(255, 177, 50, .72),

                0 0 130px
                    rgba(255, 137, 30, .42),

                0 0 230px
                    rgba(255, 115, 20, .22);

            animation:
                sunFloat 8s ease-in-out infinite;
        }


        .sun::before {

            content: "";

            position: absolute;

            inset: -34px;

            border-radius:
                50%;

            border:
                2px solid
                rgba(255, 220, 110, .18);

            box-shadow:
                0 0 40px
                rgba(255, 191, 74, .22);

            animation:
                sunHalo 5s linear infinite;
        }


        .sun::after {

            content: "";

            position: absolute;

            inset: -72px;

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 210, 90, .15),
                    transparent 67%
                );

            filter:
                blur(15px);
        }


        @keyframes sunFloat {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(.98);
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.04);
            }
        }


        @keyframes sunHalo {

            from {
                transform:
                    rotate(0deg)
                    scale(.96);
            }

            to {
                transform:
                    rotate(360deg)
                    scale(1.04);
            }
        }


        .earth {

            width: 78px;
            height: 78px;

            left: 72%;
            top: 30%;

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 30% 25%,
                    #a9ecff,
                    #197fc7 35%,
                    #075c99 57%,
                    #031d48 100%
                );

            box-shadow:

                0 0 20px
                    rgba(75, 188, 255, .75),

                0 0 45px
                    rgba(44, 137, 255, .35);

            animation:
                earthOrbit 24s linear infinite;
        }


        .earth::after {

            content: "";

            position: absolute;

            inset: 5px;

            border-radius:
                50%;

            background:

                radial-gradient(
                    ellipse at 55% 40%,
                    rgba(72, 184, 96, .8),
                    transparent 18%
                ),

                radial-gradient(
                    ellipse at 32% 68%,
                    rgba(61, 165, 88, .7),
                    transparent 20%
                );
        }


        .moon {

            width: 34px;
            height: 34px;

            left: 83%;
            top: 62%;

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fff,
                    #cfd6df 50%,
                    #777f8d 100%
                );

            box-shadow:
                0 0 18px
                rgba(255,255,255,.55);

            animation:
                moonFloat 9s ease-in-out infinite;
        }


        @keyframes earthOrbit {

            0% {
                transform:
                    translate(-10px, 0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translate(20px, 18px)
                    rotate(180deg);
            }

            100% {
                transform:
                    translate(-10px, 0)
                    rotate(360deg);
            }
        }


        @keyframes moonFloat {

            0%,
            100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(-22px,-16px);
            }
        }


        .planet {

            border-radius:
                50%;

            box-shadow:
                0 0 22px
                var(--planet-glow);

            animation:
                planetFloat var(--planet-speed)
                ease-in-out infinite;
        }


        .planet.p1 {

            width: 42px;
            height: 42px;

            left: 18%;
            top: 30%;

            --planet-glow:
                rgba(158, 100, 255, .7);

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #f2d4ff,
                    #a45fff 50%,
                    #42116e
                );
        }


        .planet.p2 {

            width: 57px;
            height: 57px;

            left: 82%;
            top: 23%;

            --planet-glow:
                rgba(74, 198, 255, .7);

            background:
                radial-gradient(
                    circle at 35% 25%,
                    #d4fbff,
                    #38bce7 42%,
                    #15518c
                );

            --planet-speed:
                7s;
        }


        .planet.p3 {

            width: 32px;
            height: 32px;

            left: 27%;
            top: 73%;

            --planet-glow:
                rgba(255, 108, 168, .7);

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #ffd5e8,
                    #ff5d9f 48%,
                    #6b1643
                );

            --planet-speed:
                5s;
        }


        .planet.p4 {

            width: 68px;
            height: 68px;

            left: 11%;
            top: 66%;

            --planet-glow:
                rgba(255, 190, 81, .65);

            background:
                radial-gradient(
                    circle at 32% 28%,
                    #fff2bb,
                    #d99238 48%,
                    #62350e
                );

            --planet-speed:
                11s;
        }


        @keyframes planetFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-13px)
                    rotate(12deg);
            }
        }


        /* ====================================================
           05 — ORBITS
           ==================================================== */

        .orbit {

            position: absolute;

            left: 50%;
            top: 48%;

            border-radius:
                50%;

            border:
                1px solid
                rgba(255,255,255,.10);

            transform:
                translate(-50%, -50%)
                rotate(-8deg);

            pointer-events:
                none;
        }


        .orbit.o1 {

            width: 340px;
            height: 180px;
        }


        .orbit.o2 {

            width: 530px;
            height: 280px;
        }


        .orbit.o3 {

            width: 720px;
            height: 380px;
        }


        .orbit.o4 {

            width: 940px;
            height: 500px;
        }


        /* ====================================================
           06 — APPLICATION SHELL
           ==================================================== */

        #haldo-os {

            position:
                fixed;

            inset:
                0;

            z-index:
                10;

            display:
                grid;

            grid-template-columns:
                var(--sidebar-width)
                minmax(0, 1fr)
                var(--rightbar-width);

            grid-template-rows:
                var(--top-height)
                minmax(0, 1fr)
                var(--bottom-height);

            grid-template-areas:

                "left top right"

                "left main right"

                "left bottom right";

            pointer-events:
                none;
        }


        /* ====================================================
           07 — LEFT NAVIGATION
           ==================================================== */

        #haldo-left-sidebar {

            grid-area:
                left;

            pointer-events:
                auto;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            padding:
                12px 8px;

            background:
                rgba(2, 6, 20, .76);

            backdrop-filter:
                blur(24px);

            border-right:
                1px solid
                var(--haldo-border);
        }


        #haldo-logo-button {

            width:
                58px;

            height:
                58px;

            margin-bottom:
                20px;

            padding:
                8px;

            border-radius:
                18px;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid
                rgba(255,255,255,.12);

            box-shadow:
                0 0 25px
                rgba(100,170,255,.18);

            transition:
                .25s ease;
        }


        #haldo-logo-button:hover {

            transform:
                scale(1.06);

            box-shadow:
                0 0 35px
                rgba(100,190,255,.42);
        }


        #haldo-logo-button img {

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;
        }


        .nav-stack {

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

            width:
                100%;

            overflow:
                auto;
        }


        .nav-button {

            position:
                relative;

            width:
                100%;

            min-height:
                54px;

            padding:
                6px;

            border-radius:
                16px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            align-items:
                center;

            gap:
                3px;

            background:
                transparent;

            color:
                rgba(255,255,255,.66);

            transition:
                .2s ease;
        }


        .nav-button:hover,
        .nav-button.active {

            background:
                rgba(95,160,255,.14);

            color:
                #fff;

            box-shadow:
                inset 0 0 20px
                rgba(95,160,255,.08);
        }


        .nav-icon {

            font-size:
                20px;
        }


        .nav-label {

            font-size:
                9px;

            white-space:
                nowrap;
        }


        /* ====================================================
           08 — TOP BAR
           ==================================================== */

        #haldo-topbar {

            grid-area:
                top;

            pointer-events:
                auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 18px;

            background:
                rgba(3,7,20,.48);

            backdrop-filter:
                blur(20px);

            border-bottom:
                1px solid
                var(--haldo-border);
        }


        .top-title {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;
        }


        .top-title strong {

            font-size:
                15px;

            letter-spacing:
                .4px;
        }


        .system-status {

            display:
                flex;

            align-items:
                center;

            gap:
                7px;

            color:
                rgba(255,255,255,.68);

            font-size:
                11px;
        }


        .status-dot {

            width:
                8px;

            height:
                8px;

            border-radius:
                50%;

            background:
                #59e391;

            box-shadow:
                0 0 12px
                #59e391;
        }


        .top-actions {

            display:
                flex;

            gap:
                7px;
        }


        .top-action {

            width:
                40px;

            height:
                40px;

            border-radius:
                13px;

            background:
                rgba(255,255,255,.07);

            border:
                1px solid
                rgba(255,255,255,.10);

            transition:
                .2s ease;
        }


        .top-action:hover {

            background:
                rgba(255,255,255,.14);

            transform:
                translateY(-1px);
        }


        /* ====================================================
           09 — MAIN
           ==================================================== */

        #haldo-main {

            grid-area:
                main;

            pointer-events:
                auto;

            position:
                relative;

            overflow:
                hidden;
        }


        #haldo-desktop {

            position:
                absolute;

            inset:
                0;

            overflow:
                hidden;
        }


        /* ====================================================
           10 — WELCOME
           ==================================================== */

        #haldo-welcome {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            transform:
                translate(-50%,-50%);

            width:
                min(650px, 80%);

            text-align:
                center;

            pointer-events:
                none;

            z-index:
                2;
        }


        #haldo-welcome h1 {

            margin:
                0 0 8px;

            font-size:
                clamp(30px,4vw,58px);

            font-weight:
                700;

            letter-spacing:
                -1.5px;

            text-shadow:
                0 0 35px
                rgba(100,190,255,.32);
        }


        #haldo-welcome p {

            margin:
                0;

            color:
                rgba(255,255,255,.68);

            font-size:
                14px;
        }


        /* ====================================================
           11 — APP WINDOWS
           ==================================================== */

        #haldo-window-layer {

            position:
                absolute;

            inset:
                0;

            z-index:
                20;

            pointer-events:
                none;
        }


        .haldo-app-window {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                min(900px, calc(100% - 50px));

            height:
                min(650px, calc(100% - 50px));

            transform:
                translate(-50%,-50%);

            border-radius:
                24px;

            overflow:
                hidden;

            background:
                rgba(5,10,27,.93);

            backdrop-filter:
                blur(28px);

            border:
                1px solid
                rgba(255,255,255,.15);

            box-shadow:

                0 35px 100px
                rgba(0,0,0,.55),

                0 0 50px
                rgba(69,141,255,.10);

            pointer-events:
                auto;

            display:
                none;

            flex-direction:
                column;
        }


        .haldo-app-window.visible {

            display:
                flex;
        }


        .app-window-header {

            height:
                58px;

            flex:
                0 0 58px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 15px;

            background:
                rgba(255,255,255,.045);

            border-bottom:
                1px solid
                rgba(255,255,255,.10);
        }


        .app-window-title {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            font-size:
                14px;

            font-weight:
                600;
        }


        .app-window-controls {

            display:
                flex;

            gap:
                7px;
        }


        .window-control {

            width:
                34px;

            height:
                34px;

            border-radius:
                11px;

            background:
                rgba(255,255,255,.07);
        }


        .window-control:hover {

            background:
                rgba(255,255,255,.15);
        }


        .app-window-content {

            flex:
                1;

            overflow:
                auto;

            padding:
                20px;
        }


        /* ====================================================
           12 — RIGHT APP MENU
           ==================================================== */

        #haldo-right-sidebar {

            grid-area:
                right;

            pointer-events:
                auto;

            display:
                flex;

            flex-direction:
                column;

            padding:
                14px;

            gap:
                12px;

            background:
                rgba(2,6,19,.78);

            backdrop-filter:
                blur(25px);

            border-left:
                1px solid
                var(--haldo-border);

            overflow:
                hidden;
        }


        .side-panel {

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius:
                20px;

            background:
                rgba(255,255,255,.045);

            overflow:
                hidden;
        }


        .side-panel-header {

            padding:
                12px 14px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            border-bottom:
                1px solid
                rgba(255,255,255,.08);
        }


        .side-panel-header strong {

            font-size:
                12px;
        }


        .side-panel-body {

            padding:
                10px;

            overflow:
                auto;
        }


        #app-search {

            width:
                100%;

            height:
                38px;

            padding:
                0 12px;

            border-radius:
                12px;

            border:
                1px solid
                rgba(255,255,255,.10);

            outline:
                none;

            background:
                rgba(0,0,0,.25);

            color:
                #fff;
        }


        #app-search::placeholder {

            color:
                rgba(255,255,255,.42);
        }


        #app-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2,minmax(0,1fr));

            gap:
                8px;

            max-height:
                calc(100vh - 235px);

            overflow:
                auto;

            padding:
                2px;
        }


        .app-tile {

            min-height:
                82px;

            padding:
                9px 5px;

            border-radius:
                15px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                6px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.07);

            transition:
                .2s ease;
        }


        .app-tile:hover {

            transform:
                translateY(-2px);

            background:
                rgba(90,150,255,.13);

            border-color:
                rgba(100,180,255,.30);

            box-shadow:
                0 0 20px
                rgba(80,150,255,.10);
        }


        .app-tile-icon {

            width:
                36px;

            height:
                36px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                11px;

            background:
                rgba(255,255,255,.08);

            font-size:
                18px;
        }


        .app-tile-name {

            width:
                100%;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            text-align:
                center;

            font-size:
                10px;

            color:
                rgba(255,255,255,.78);
        }


        /* ====================================================
           13 — QUICK ACTIONS
           ==================================================== */

        #quick-actions {

            display:
                grid;

            grid-template-columns:
                repeat(2,minmax(0,1fr));

            gap:
                8px;
        }


        .quick-button {

            min-height:
                43px;

            border-radius:
                13px;

            background:
                rgba(255,255,255,.06);

            border:
                1px solid
                rgba(255,255,255,.08);

            font-size:
                11px;

            transition:
                .2s ease;
        }

    <script>

        "use strict";

        window.HalDoOS =
            window.HalDoOS || {};

        window.HalDoOS.ui =
            window.HalDoOS.ui || {};

        window.HalDoOS.ui.shell =
            true;


        /* ====================================================
           STAR GENERATOR
           ==================================================== */

        (function createStars() {

            const container =
                document.getElementById(
                    "haldo-stars"
                );

            if (!container) {
                return;
            }

            const count =
                window.innerWidth < 700
                    ? 95
                    : 190;

            for (
                let i = 0;
                i < count;
                i++
            ) {

                const star =
                    document.createElement(
                        "span"
                    );

                star.className =
                    "star";

                if (
                    Math.random() > .86
                ) {
                    star.classList.add(
                        "big"
                    );
                }

                star.style.left =
                    Math.random() * 100 +
                    "%";

                star.style.top =
                    Math.random() * 100 +
                    "%";

                star.style.setProperty(
                    "--opacity",
                    (
                        .25 +
                        Math.random() * .75
                    ).toFixed(2)
                );

                star.style.setProperty(
                    "--duration",
                    (
                        2.5 +
                        Math.random() * 5
                    ).toFixed(2) +
                    "s"
                );

                star.style.setProperty(
                    "--delay",
                    (
                        Math.random() * -6
                    ).toFixed(2) +
                    "s"
                );

                container.appendChild(
                    star
                );
            }

        })();


        /* ====================================================
           UI HELPERS
           ==================================================== */

        const UI = {

            notify(message) {

                const container =
                    document.getElementById(
                        "haldo-notifications"
                    );

                if (!container) {
                    return;
                }

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "haldo-notification";

                item.textContent =
                    message;

                container.appendChild(
                    item
                );

                setTimeout(
                    () => {

                        item.style.opacity =
                            "0";

                        item.style.transform =
                            "translateY(-8px)";

                        item.style.transition =
                            ".25s ease";

                        setTimeout(
                            () => item.remove(),
                            300
                        );

                    },
                    3200
                );
            },


            setStatus(text, online = true) {

                const status =
                    document.getElementById(
                        "system-status-text"
                    );

                const dot =
                    document.getElementById(
                        "system-status-dot"
                    );

                if (status) {
                    status.textContent =
                        text;
                }

                if (dot) {

                    dot.style.background =
                        online
                            ? "#59e391"
                            : "#ff6464";

                    dot.style.boxShadow =
                        online
                            ? "0 0 12px #59e391"
                            : "0 0 12px #ff6464";
                }
            }

        };


        window.HalDoOS.ui.UI =
            UI;


        /* ====================================================
           AI
           ==================================================== */

        const AIUI = {

            panel:
                document.getElementById(
                    "haldo-ai-panel"
                ),

            messages:
                document.getElementById(
                    "haldo-ai-messages"
                ),

            input:
                document.getElementById(
                    "haldo-ai-input"
                ),


            open() {

                if (!this.panel) {
                    return;
                }

                this.panel.classList.add(
                    "visible"
                );

                setTimeout(
                    () => {
                        if (this.input) {
                            this.input.focus();
                        }
                    },
                    100
                );
            },


            close() {

                if (!this.panel) {
                    return;
                }

                this.panel.classList.remove(
                    "visible"
                );
            },


            addMessage(
                text,
                user = false
            ) {

                if (!this.messages) {
                    return;
                }

                const message =
                    document.createElement(
                        "div"
                    );

                message.className =
                    "ai-message" +
                    (
                        user
                            ? " user"
                            : ""
                    );

                message.textContent =
                    text;

                this.messages.appendChild(
                    message
                );

                this.messages.scrollTop =
                    this.messages.scrollHeight;
            },


            async send() {

                const input =
                    this.input;

                if (!input) {
                    return;
                }

                const text =
                    input.value.trim();

                if (!text) {
                    return;
                }

                input.value = "";

                this.addMessage(
                    text,
                    true
                );

                /*
                 * Bestehende HalDo AI APIs
                 * werden bevorzugt verwendet.
                 */

                const ai =
                    window.HalDoAI ||
                    window.HalDoAICore ||
                    window.HalDoOS.ai ||
                    window.HalDoOS.aiCore ||
                    null;

                try {

                    if (
                        ai &&
                        typeof ai.chat ===
                        "function"
                    ) {

                        const result =
                            await ai.chat(
                                text
                            );

                        this.addMessage(
                            typeof result ===
                            "string"
                                ? result
                                : (
                                    result &&
                                    (
                                        result.text ||
                                        result.response ||
                                        result.message
                                    )
                                ) ||
                                "HalDo AI hat keine Antwort zurückgegeben."
                        );

                        return;
                    }


                    if (
                        ai &&
                        typeof ai.ask ===
                        "function"
                    ) {

                        const result =
                            await ai.ask(
                                text
                            );

                        this.addMessage(
                            typeof result ===
                            "string"
                                ? result
                                : (
                                    result &&
                                    (
                                        result.text ||
                                        result.response ||
                                        result.message
                                    )
                                ) ||
                                "HalDo AI hat keine Antwort zurückgegeben."
                        );

                        return;
                    }


                    this.addMessage(
                        "HalDo AI Core wird gerade mit dem System verbunden. Die Benutzeroberfläche funktioniert bereits."
                    );

                } catch (error) {

                    console.error(
                        "HalDo AI UI:",
                        error
                    );

                    this.addMessage(
                        "HalDo AI konnte die Anfrage gerade nicht verarbeiten."
                    );
                }
            }

        };


        window.HalDoOS.ui.ai =
            AIUI;


        /* ====================================================
           APP MANAGER ACCESS
           ==================================================== */

        function getAppManager() {

            return (
                window.HalDoAppManager ||
                window.HalDoOSAppManager ||
                window.HalDoOS.appManager ||
                null
            );
        }


        function getAppRegistry() {

            return (
                window.HalDoAppRegistry ||
                window.HalDoOS.appRegistry ||
                null
            );
        }


        /* ====================================================
           APP ICON
           ==================================================== */

        function getAppIcon(app) {

            if (!app) {
                return "◈";
            }

            return (
                app.icon ||
                app.emoji ||
                app.symbol ||
                "◈"
            );
        }


        /* ====================================================
           RENDER APP GRID
           ==================================================== */

        function renderApps(
            query = ""
        ) {

            const grid =
                document.getElementById(
                    "app-grid"
                );

            const count =
                document.getElementById(
                    "app-count"
                );

            if (!grid) {
                return;
            }

            const manager =
                getAppManager();

            const registry =
                getAppRegistry();

            let apps = [];


            try {

                if (
                    manager &&
                    typeof manager.search ===
                    "function" &&
                    query
                ) {

                    apps =
                        manager.search(
                            query
                        ) || [];

                } else if (
                    manager &&
                    typeof manager.getAll ===
                    "function"
                ) {

                    apps =
                        manager.getAll() || [];

                } else if (
                    registry &&
                    typeof registry.getAll ===
                    "function"
                ) {

                    apps =
                        registry.getAll() || [];

                }

            } catch (error) {

                console.error(
                    "HalDo App Grid:",
                    error
                );

                apps = [];
            }


            if (!Array.isArray(apps)) {
                apps = [];
            }


            apps =
                apps.filter(
                    app =>
                        app &&
                        app.enabled !== false
                );


            grid.innerHTML = "";


            if (count) {
                count.textContent =
                    apps.length;
            }


            if (!apps.length) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.style.gridColumn =
                    "1 / -1";

                empty.style.padding =
                    "30px 10px";

                empty.style.textAlign =
                    "center";

                empty.style.color =
                    "rgba(255,255,255,.45)";

                empty.style.fontSize =
                    "11px";

                empty.textContent =
                    "Noch keine Apps im App-System geladen.";

                grid.appendChild(
                    empty
                );

                return;
            }


            apps.forEach(app => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "app-tile";

                button.type =
                    "button";

                button.dataset.appId =
                    app.id;


                const icon =
                    document.createElement(
                        "div"
                    );

                icon.className =
                    "app-tile-icon";

                icon.textContent =
                    getAppIcon(app);


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "app-tile-name";

                name.textContent =
                    app.title ||
                    app.name ||
                    app.id;


                button.appendChild(
                    icon
                );

                button.appendChild(
                    name
                );


                button.addEventListener(
                    "click",
                    () => {

                        openApplication(
                            app.id
                        );

                    }
                );


                grid.appendChild(
                    button
                );

            });

        }


        /* ====================================================
           OPEN APPLICATION
           ==================================================== */

        async function openApplication(
            appId
        ) {

            const manager =
                getAppManager();

            if (!manager) {

                UI.notify(
                    "HalDo App Manager ist noch nicht bereit."
                );

                return;
            }


            try {

                let result = null;


                if (
                    typeof manager.openApp ===
                    "function"
                ) {

                    result =
                        await manager.openApp(
                            appId
                        );

                } else if (
                    typeof manager.open ===
                    "function"
                ) {

                    result =
                        await manager.open(
                            appId
                        );

                }


                if (!result) {

                    UI.notify(
                        "Die App „" +
                        appId +
                        "“ konnte nicht geöffnet werden."
                    );

                    return;
                }


                UI.notify(
                    (
                        result.app &&
                        (
                            result.app.title ||
                            result.app.name
                        )
                    ) ||
                    appId +
                    " geöffnet."
                );


                /*
                 * Falls Window Manager oder App
                 * selbst ein eigenes Fenster erstellt,
                 * greifen wir nicht störend ein.
                 */

                return result;

            } catch (error) {

                console.error(
                    "HalDo Application Open:",
                    error
                );

                UI.notify(
                    "Fehler beim Öffnen der App."
                );
            }
        }


        window.HalDoOS.ui.openApplication =
            openApplication;


        /* ====================================================
           NAVIGATION
           ==================================================== */

        function setActiveNav(
            section
        ) {

            document
                .querySelectorAll(
                    ".nav-button"
                )
                .forEach(button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.section ===
                        section
                    );

                });
        }


        function handleSection(
            section
        ) {

            setActiveNav(
                section
            );


            if (section === "home") {

                document
                    .getElementById(
                        "haldo-welcome"
                    )
                    ?.style
                    .setProperty(
                        "display",
                        "block"
                    );

                return;
            }


            if (section === "apps") {

                renderApps();

                const sidebar =
                    document.getElementById(
                        "haldo-right-sidebar"
                    );

                sidebar?.classList.add(
                    "mobile-visible"
                );

                return;
            }


            if (section === "cosmic") {

                UI.notify(
                    "Cosmic World ist aktiv."
                );

                return;
            }


            if (section === "language") {

                openApplication(
                    "language-settings"
                );

                return;
            }


            if (section === "files") {

                openApplication(
                    "file-manager"
                );

                return;
            }


            if (section === "settings") {

                openApplication(
                    "settings"
                );

                return;
            }
        }


        /* ====================================================
           ACTIONS
           ==================================================== */

        function handleAction(
            action
        ) {

            switch (action) {

                case "open-ai":

                    AIUI.open();

                    break;


                case "open-settings":

                    openApplication(
                        "settings"
                    );

                    break;


                case "show-apps":

                    renderApps();

                    document
                        .getElementById(
                            "haldo-right-sidebar"
                        )
                        ?.classList.add(
                            "mobile-visible"
                        );

                    break;


                case "home":

                    handleSection(
                        "home"
                    );

                    break;

            }
        }


        /* ====================================================
           EVENT BINDINGS
           ==================================================== */

        document.addEventListener(
            "click",
            event => {

                const nav =
                    event.target.closest(
                        ".nav-button"
                    );

                if (nav) {

                    if (
                        nav.dataset.action
                    ) {

                        handleAction(
                            nav.dataset.action
                        );

                    } else if (
                        nav.dataset.section
                    ) {

                        handleSection(
                            nav.dataset.section
                        );

                    }

                    return;
                }


                const action =
                    event.target.closest(
                        "[data-action]"
                    );

                if (action) {

                    handleAction(
                        action.dataset.action
                    );

                    return;
                }


                const logo =
                    event.target.closest(
                        "#haldo-logo-button"
                    );

                if (logo) {

                    handleSection(
                        "home"
                    );

                }

            }
        );


        /* ====================================================
           AI EVENTS
           ==================================================== */

        document
            .getElementById(
                "ai-close"
            )
            ?.addEventListener(
                "click",
                () => AIUI.close()
            );


        document
            .getElementById(
                "haldo-ai-send"
            )
            ?.addEventListener(
                "click",
                () => AIUI.send()
            );


        document
            .getElementById(
                "haldo-ai-input"
            )
            ?.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        event.preventDefault();

                        AIUI.send();
                    }

                }
            );


        /* ====================================================
           APP SEARCH
           ==================================================== */

        document
            .getElementById(
                "app-search"
            )
            ?.addEventListener(
                "input",
                event => {

                    renderApps(
                        event.target.value
                    );

                }
            );


        /* ====================================================
           MOBILE APP MENU
           ==================================================== */

        document
            .getElementById(
                "mobile-app-menu"
            )
            ?.addEventListener(
                "click",
                () => {

                    document
                        .getElementById(
                            "haldo-right-sidebar"
                        )
                        ?.classList.toggle(
                            "mobile-visible"
                        );

                }
            );


        /* ====================================================
           APP MANAGER EVENTS
           ==================================================== */

        function connectManagerEvents() {

            const manager =
                getAppManager();

            if (!manager) {
                return false;
            }


            if (
                typeof manager.on ===
                "function"
            ) {

                [
                    "registered",
                    "app-opened",
                    "app-closed",
                    "app-started",
                    "app-stopped",
                    "registry-synchronized",
                    "ready"
                ]
                .forEach(
                    eventName => {

                        try {

                            manager.on(
                                eventName,
                                () => {

                                    renderApps();

                                }
                            );

                        } catch (_) {}

                    }
                );
            }


            return true;
        }


        /* ====================================================
           BOOT CONNECTION
           ==================================================== */

        function connectSystem() {

            const manager =
                getAppManager();


            if (manager) {

                UI.setStatus(
                    "App System bereit",
                    true
                );

                renderApps();

                connectManagerEvents();

                return true;
            }


            /*
             * Manager kann später geladen werden.
             */

            setTimeout(
                connectSystem,
                350
            );

            return false;
        }


        /* ====================================================
           HALDO EVENTS
           ==================================================== */

        window.addEventListener(
            "haldo:app-manager-ready",
            () => {

                UI.setStatus(
                    "HalDo App System bereit",
                    true
                );

                renderApps();

                connectManagerEvents();

            }
        );


        window.addEventListener(
            "haldo:app-opened",
            event => {

                const app =
                    event.detail &&
                    event.detail.app;

                if (app) {

                    UI.notify(
                        (
                            app.title ||
                            app.name ||
                            app.id
                        ) +
                        " geöffnet"
                    );

                }

            }
        );


        window.addEventListener(
            "haldo:app-closed",
            () => {

                renderApps();

            }
        );


        /* ====================================================
           BOOT SCREEN
           ==================================================== */

        window.addEventListener(
            "load",
            () => {

                const boot =
                    document.getElementById(
                        "haldo-boot"
                    );

                const status =
                    document.getElementById(
                        "boot-status"
                    );


                if (status) {

                    status.textContent =
                        "Cosmic World geladen …";

                }


                setTimeout(
                    () => {

                        if (status) {

                            status.textContent =
                                "HalDo AI wird verbunden …";

                        }

                    },
                    500
                );


                setTimeout(
                    () => {

                        boot?.classList.add(
                            "hidden"
                        );

                        connectSystem();

                    },
                    1100
                );

            }
        );


        /* ====================================================
           RESIZE
           ==================================================== */

        window.addEventListener(
            "resize",
            () => {

                /*
                 * Cosmic World bleibt unabhängig
                 * von der App-Shell.
                 */

            }
        );


        /* ====================================================
           INITIAL UI STATE
           ==================================================== */

        window.HalDoOS.ui.renderApps =
            renderApps;

        window.HalDoOS.ui.handleAction =
            handleAction;

        window.HalDoOS.ui.handleSection =
            handleSection;

    </script>
