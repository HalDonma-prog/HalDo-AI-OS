        if (
            /^(merhaba|selam|teşekkür|aç|kapat|başlat|ne|nasıl|kim)/i
                .test(value)
        ) {
            return "tr";
        }

        if (
            /^(مرحبا|السلام|افتح|اغلق)/i
                .test(value)
        ) {
            return "ar";
        }

        return this.current;
    }
};


/* =========================================================
   HALDO AI MEMORY
   ========================================================= */

window.HalDo.ai.memory = {

    initialized: false,

    shortTerm: [],

    longTerm: [],

    maxShortTerm: 50,

    maxLongTerm: 500,

    initialize() {

        if (this.initialized) {
            return true;
        }

        const stored =
            window.HalDo.storage.get(
                "ai.memory",
                null
            );

        if (stored) {

            this.shortTerm =
                Array.isArray(
                    stored.shortTerm
                )
                    ? stored.shortTerm
                    : [];

            this.longTerm =
                Array.isArray(
                    stored.longTerm
                )
                    ? stored.longTerm
                    : [];
        }

        this.initialized = true;

        return true;
    },

    remember(
        content,
        type = "fact",
        importance = 0.5,
        metadata = {}
    ) {

        const item = {

            id:
                window.HalDo.runtime
                    .createId("memory"),

            content:
                String(content),

            type,

            importance:
                Math.max(
                    0,
                    Math.min(
                        1,
                        Number(
                            importance
                        ) || 0
                    )
                ),

            metadata,

            createdAt:
                Date.now(),

            accessedAt:
                Date.now()
        };

        this.longTerm.push(
            item
        );

        if (
            this.longTerm.length >
            this.maxLongTerm
        ) {

            this.longTerm.sort(
                (
                    a,
                    b
                ) =>
                    b.importance -
                    a.importance
            );

            this.longTerm =
                this.longTerm.slice(
                    0,
                    this.maxLongTerm
                );
        }

        this.save();

        window.HalDo.emit(
            "ai:memory-added",
            item,
            {
                source: "ai-memory"
            }
        );

        return item;
    },

    rememberShort(
        content,
        metadata = {}
    ) {

        const item = {

            id:
                window.HalDo.runtime
                    .createId(
                        "short-memory"
                    ),

            content:
                String(content),

            metadata,

            createdAt:
                Date.now()
        };

        this.shortTerm.push(
            item
        );

        if (
            this.shortTerm.length >
            this.maxShortTerm
        ) {

            this.shortTerm.shift();
        }

        this.save();

        return item;
    },

    search(
        query,
        limit = 10
    ) {

        const text =
            String(query || "")
                .toLowerCase()
                .trim();

        if (!text) {
            return [];
        }

        const all = [
            ...this.shortTerm,
            ...this.longTerm
        ];

        return all
            .map(item => {

                const content =
                    String(
                        item.content ||
                        ""
                    ).toLowerCase();

                const words =
                    text.split(
                        /\s+/
                    );

                let score = 0;

                words.forEach(
                    word => {

                        if (
                            word &&
                            content.includes(
                                word
                            )
                        ) {

                            score++;
                        }
                    }
                );

                return {
                    ...item,
                    score
                };
            })
            .filter(
                item =>
                    item.score > 0
            )
            .sort(
                (
                    a,
                    b
                ) =>
                    b.score -
                    a.score
            )
            .slice(
                0,
                limit
            );
    },

    recent(limit = 10) {

        return [
            ...this.shortTerm
        ]
            .sort(
                (
                    a,
                    b
                ) =>
                    b.createdAt -
                    a.createdAt
            )
            .slice(
                0,
                limit
            );
    },

    forget(id) {

        this.shortTerm =
            this.shortTerm.filter(
                item =>
                    item.id !== id
            );

        this.longTerm =
            this.longTerm.filter(
                item =>
                    item.id !== id
            );

        this.save();

        return true;
    },

    clear() {

        this.shortTerm = [];
        this.longTerm = [];

        this.save();

        window.HalDo.emit(
            "ai:memory-cleared",
            {},
            {
                source: "ai-memory"
            }
        );

        return true;
    },

    save() {

        window.HalDo.storage.set(
            "ai.memory",
            {
                shortTerm:
                    this.shortTerm,
                longTerm:
                    this.longTerm
            }
        );
    },

    snapshot() {

        return {

            shortTerm: [
                ...this.shortTerm
            ],

            longTerm: [
                ...this.longTerm
            ]
        };
    }
};


/* =========================================================
   HALDO AI COMMANDS
   ========================================================= */

window.HalDo.ai.commands = {

    initialized: false,

    commands: new Map(),

    aliases: new Map(),

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.registerDefaults();

        this.initialized = true;

        return true;
    },

    register(
        name,
        handler,
        options = {}
    ) {

        if (
            !name ||
            typeof handler !==
            "function"
        ) {

            return false;
        }

        this.commands.set(
            name.toLowerCase(),
            {
                name,
                handler,
                description:
                    options.description ||
                    "",
                aliases:
                    Array.isArray(
                        options.aliases
                    )
                        ? options.aliases
                        : [],
                permissions:
                    options.permissions ||
                    []
            }
        );

        (
            options.aliases || []
        ).forEach(
            alias => {

                this.aliases.set(
                    String(
                        alias
                    ).toLowerCase(),
                    name.toLowerCase()
                );
            }
        );

        return true;
    },

    resolve(name) {

        const normalized =
            String(name || "")
                .toLowerCase()
                .trim();

        if (
            this.commands.has(
                normalized
            )
        ) {

            return this.commands.get(
                normalized
            );
        }

        const alias =
            this.aliases.get(
                normalized
            );

        if (!alias) {
            return null;
        }

        return this.commands.get(
            alias
        ) || null;
    },

    async execute(
        name,
        args = [],
        context = {}
    ) {

        const command =
            this.resolve(name);

        if (!command) {

            return {
                success: false,
                error:
                    "Unbekannter Befehl: " +
                    name
            };
        }

        try {

            const result =
                await command.handler(
                    args,
                    context
                );

            window.HalDo.emit(
                "ai:command-executed",
                {
                    name:
                        command.name,

                    args,

                    result
                },
                {
                    source:
                        "ai-commands"
                }
            );

            return {
                success: true,
                result
            };

        }
        catch (error) {

            window.HalDo.reportError(
                error,
                "ai-command:" +
                name
            );

            return {
                success: false,
                error:
                    error.message
            };
        }
    },

    registerDefaults() {

        this.register(
            "open",
            async args => {

                const id =
                    args[0];

                if (!id) {

                    return {
                        message:
                            "Welche App soll ich öffnen?"
                    };
                }

                return window.HalDo.appManager
                    .open(id);
            },
            {
                aliases: [
                    "öffne",
                    "start",
                    "starte"
                ],
                description:
                    "Öffnet eine App."
            }
        );

        this.register(
            "close",
            async args => {

                const id =
                    args[0];

                if (!id) {

                    return {
                        message:
                            "Welche App soll ich schließen?"
                    };
                }

                return window.HalDo.appManager
                    .close(id);
            },
            {
                aliases: [
                    "schließe",
                    "beenden"
                ],
                description:
                    "Schließt eine App."
            }
        );

        this.register(
            "apps",
            async () => {

                return window.HalDo.appManager
                    .list()
                    .map(
                        app => ({
                            id:
                                app.id,
                            name:
                                app.name
                        })
                    );
            },
            {
                aliases: [
                    "apps",
                    "programme"
                ],
                description:
                    "Zeigt installierte Apps."
            }
        );

        this.register(
            "time",
            async () => {

                return new Date()
                    .toLocaleTimeString(
                        "de-DE"
                    );
            },
            {
                aliases: [
                    "uhr",
                    "zeit"
                ]
            }
        );

        this.register(
            "clear",
            async () => {

                window.HalDo.conversation
                    .clear();

                return true;
            },
            {
                aliases: [
                    "löschen",
                    "clear-chat"
                ]
            }
        );

        this.register(
            "theme",
            async args => {

                const theme =
                    args[0];

                if (!theme) {

                    return window.HalDo
                        .configManager
                        .get(
                            "theme",
                            "cosmic"
                        );
                }

                return window.HalDo
                    .configManager
                    .set(
                        "theme",
                        theme
                    );
            }
        );
    },

    list() {

        return [
            ...this.commands.values()
        ];
    }
};


/* =========================================================
   HALDO AI ENGINE
   ========================================================= */

window.HalDo.ai.engine = {

    initialized: false,

    processing: false,

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        return true;
    },

    tokenize(text) {

        return String(
            text || ""
        )
            .toLowerCase()
            .trim()
            .split(
                /\s+/
            )
            .filter(Boolean);
    },

    detectCommand(text) {

        const value =
            String(text || "")
                .trim();

        const match =
            value.match(
                /^(?:\/|!)([^\s]+)(?:\s+(.*))?$/
            );

        if (!match) {
            return null;
        }

        return {

            name:
                match[1],

            args:
                match[2]
                    ? match[2]
                        .split(/\s+/)
                    : []
        };
    },

    detectIntent(text) {

        const value =
            String(text || "")
                .toLowerCase();

        if (
            /öffne|open|starte|start/i
                .test(value)
        ) {

            return "open-app";
        }

        if (
            /schließe|close|beende/i
                .test(value)
        ) {

            return "close-app";
        }

        if (
            /uhrzeit|zeit|wie spät/i
                .test(value)
        ) {

            return "time";
        }

        if (
            /apps|programme|anwendungen/i
                .test(value)
        ) {

            return "list-apps";
        }

        if (
            /wer bist du|was bist du|dein name/i
                .test(value)
        ) {

            return "identity";
        }

        if (
            /hallo|hi|hey|guten morgen|guten abend/i
                .test(value)
        ) {

            return "greeting";
        }

        if (
            /danke|vielen dank/i
                .test(value)
        ) {

            return "thanks";
        }

        return "conversation";
    },

    extractAppId(text) {

        const value =
            String(text || "")
                .toLowerCase();

        const apps =
            window.HalDo.appManager
                .list();

        const found =
            apps.find(
                app => {

                    const id =
                        app.id
                            .toLowerCase();

                    const name =
                        app.name
                            .toLowerCase();

                    return (
                        value.includes(id) ||
                        value.includes(name)
                    );
                }
            );

        return found
            ? found.id
            : null;
    },

    async process(
        text,
        context = {}
    ) {

        this.processing = true;

        const input =
            String(
                text || ""
            ).trim();

        const language =
            window.HalDo.ai.language
                .detect(
                    input
                );

        const intent =
            this.detectIntent(
                input
            );

        const command =
            this.detectCommand(
                input
            );

        let result = {
            type:
                "conversation",

            intent,

            language,

            response:
                null
        };

        try {

            if (command) {

                result.type =
                    "command";

                result.command =
                    command;

                const commandResult =
                    await window.HalDo.ai
                        .commands
                        .execute(
                            command.name,
                            command.args,
                            context
                        );

                result.commandResult =
                    commandResult;

                result.response =
                    commandResult.success
                        ? commandResult.result
                        : commandResult.error;

                return result;
            }

            switch (intent) {

                case "open-app": {

                    const appId =
                        this.extractAppId(
                            input
                        );

                    if (!appId) {

                        result.response =
                            "Welche App möchtest du öffnen?";

                        break;
                    }

                    const opened =
                        await window.HalDo
                            .appManager
                            .open(
                                appId
                            );

                    result.response =
                        opened.app.name +
                        " wurde geöffnet.";

                    result.data =
                        opened;

                    break;
                }

                case "close-app": {

                    const appId =
                        this.extractAppId(
                            input
                        );

                    if (!appId) {

                        result.response =
                            "Welche App möchtest du schließen?";

                        break;
                    }

                    await window.HalDo
                        .appManager
                        .close(
                            appId
                        );

                    result.response =
                        "Die App wurde geschlossen.";

                    break;
                }

                case "list-apps": {

                    const apps =
                        window.HalDo
                            .appManager
                            .list();

                    result.response =
                        apps
                            .map(
                                app =>
                                    app.name
                            )
                            .join(
                                ", "
                            );

                    result.data =
                        apps;

                    break;
                }

                case "time": {

                    result.response =
                        "Es ist " +
                        new Date()
                            .toLocaleTimeString(
                                language === "de"
                                    ? "de-DE"
                                    : language,
                                {
                                    hour:
                                        "2-digit",
                                    minute:
                                        "2-digit"
                                }
                            ) +
                        ".";

                    break;
                }

                case "identity": {

                    result.response =
                        language === "de"
                            ? "Ich bin HalDo AI, die intelligente Assistenz von HalDo AI OS 20."
                            : "I am HalDo AI, the intelligent assistant of HalDo AI OS 20.";

                    break;
                }

                case "greeting": {

                    result.response =
                        language === "de"
                            ? "Hallo! ❤️ Ich bin da. Was möchtest du mit HalDo AI OS machen?"
                            : "Hello! ❤️ I am here. What would you like to do?";

                    break;
                }

                case "thanks": {

                    result.response =
                        language === "de"
                            ? "Sehr gerne. ❤️"
                            : "You're very welcome. ❤️";

                    break;
                }

                default: {

                    result.response =
                        this.generateFallback(
                            input,
                            language,
                            context
                        );
                }
            }

            return result;

        }
        finally {

            this.processing = false;

        }
    },

    generateFallback(
        text,
        language,
        context
    ) {

        const memories =
            window.HalDo.ai.memory
                .search(
                    text,
                    3
                );

        if (
            memories.length
        ) {

            return language === "de"
                ? "Ich berücksichtige den bisherigen Kontext und deine gespeicherten Informationen."
                : "I will consider the existing context and saved information.";
        }

        if (
            language === "de"
        ) {

            return (
                "Ich habe dich verstanden. " +
                "Ich kann Apps öffnen, Apps schließen, " +
                "deine Unterhaltung verwalten und mit " +
                "dem HalDo-System arbeiten. "
            );
        }

        return (
            "I understood you. " +
            "I can work with apps, conversations " +
            "and the HalDo system."
        );
    }
};

   HALDO AI CHAT
   ========================================================= */

window.HalDo.ai.chat = {

    initialized: false,

    busy: false,

    listeners: new Set(),

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.initialized = true;

        return true;
    },

    subscribe(
        listener
    ) {

        if (
            typeof listener !==
            "function"
        ) {

            return false;
        }

        this.listeners.add(
            listener
        );

        return () =>
            this.listeners.delete(
                listener
            );
    },

    notify(event) {

        this.listeners.forEach(
            listener => {

                try {

                    listener(event);

                }
                catch (error) {

                    window.HalDo.reportError(
                        error,
                        "ai-chat.listener"
                    );
                }
            }
        );
    },

    async send(
        text,
        options = {}
    ) {

        if (
            this.busy
        ) {

            return {
                success: false,
                error:
                    "HalDo AI verarbeitet bereits eine Nachricht."
            };
        }

        const input =
            String(
                text || ""
            ).trim();

        if (!input) {

            return {
                success: false,
                error:
                    "Leere Nachricht."
            };
        }

        this.busy = true;

        const userMessage =
            window.HalDo.conversation
                .add(
                    "user",
                    input,
                    {
                        source:
                            "ai-chat"
                    }
                );

        this.notify({
            type:
                "user-message",

            message:
                userMessage
        });

        window.HalDo.ai.memory
            .rememberShort(
                input,
                {
                    role:
                        "user"
                }
            );

        try {

            const result =
                await window.HalDo.ai.engine
                    .process(
                        input,
                        {
                            conversation:
                                window.HalDo
                                    .conversation
                                    .snapshot(),

                            ...options
                        }
                    );

            const responseText =
                typeof result.response ===
                "string"
                    ? result.response
                    : JSON.stringify(
                        result.response
                    );

            const assistantMessage =
                window.HalDo.conversation
                    .add(
                        "assistant",
                        responseText,
                        {
                            type:
                                result.type,

                            intent:
                                result.intent,

                            language:
                                result.language
                        }
                    );

            window.HalDo.ai.memory
                .rememberShort(
                    responseText,
                    {
                        role:
                            "assistant"
                    }
                );

            this.notify({
                type:
                    "assistant-message",

                message:
                    assistantMessage,

                result
            });

            window.HalDo.emit(
                "ai:response",
                {
                    input,
                    response:
                        responseText,
                    result
                },
                {
                    source:
                        "ai-chat"
                }
            );

            return {
                success: true,

                message:
                    assistantMessage,

                result
            };

        }
        finally {

            this.busy = false;

        }
    },

    clear() {

        window.HalDo.conversation
            .clear();

        this.notify({
            type:
                "conversation-cleared"
        });

        return true;
    },

    history() {

        return window.HalDo.conversation
            .getMessages();
    }
};


/* =========================================================
   HALDO AI SPEECH
   ========================================================= */

window.HalDo.ai.speech = {

    initialized: false,

    recognition: null,

    listening: false,

    supported: false,

    initialize() {

        if (this.initialized) {
            return true;
        }

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        this.supported =
            typeof Recognition ===
            "function";

        if (
            this.supported
        ) {

            this.recognition =
                new Recognition();

            this.recognition.continuous =
                false;

            this.recognition.interimResults =
                true;

            this.recognition.lang =
                "de-DE";

            this.recognition.onstart =
                () => {

                    this.listening =
                        true;

                    window.HalDo.emit(
                        "speech:start",
                        {},
                        {
                            source:
                                "ai-speech"
                        }
                    );
                };

            this.recognition.onend =
                () => {

                    this.listening =
                        false;

                    window.HalDo.emit(
                        "speech:end",
                        {},
                        {
                            source:
                                "ai-speech"
                        }
                    );
                };

            this.recognition.onerror =
                event => {

                    this.listening =
                        false;

                    window.HalDo.emit(
                        "speech:error",
                        {
                            error:
                                event.error
                        },
                        {
                            source:
                                "ai-speech"
                        }
                    );
                };

            this.recognition.onresult =
                event => {

                    let finalText =
                        "";

                    let interimText =
                        "";

                    for (
                        let i =
                            event.resultIndex;
                        i <
                            event.results.length;
                        i++
                    ) {

                        const result =
                            event.results[i];

                        const text =
                            result[0]
                                .transcript;

                        if (
                            result.isFinal
                        ) {

                            finalText +=
                                text;

                        }
                        else {

                            interimText +=
                                text;
                        }
                    }

                    window.HalDo.emit(
                        "speech:result",
                        {
                            finalText,
                            interimText
                        },
                        {
                            source:
                                "ai-speech"
                        }
                    );
                };
        }

        this.initialized = true;

        return true;
    },

    setLanguage(
        language
    ) {

        const map = {

            de: "de-DE",
            en: "en-US",
            tr: "tr-TR",
            ar: "ar-SA",
            fr: "fr-FR",
            es: "es-ES",
            it: "it-IT",
            ku: "ku-TR"

        };

        if (
            this.recognition
        ) {

            this.recognition.lang =
                map[language] ||
                "de-DE";
        }
    },

    start() {

        if (
            !this.supported ||
            !this.recognition
        ) {

            return false;
        }

        this.setLanguage(
            window.HalDo.ai.language
                .get()
        );

        try {

            this.recognition.start();

            return true;

        }
        catch (error) {

            window.HalDo.reportError(
                error,
                "speech.start"
            );

            return false;
        }
    },

    stop() {

        if (
            !this.recognition
        ) {

            return false;
        }

        try {

            this.recognition.stop();

            return true;

        }
        catch (error) {

            return false;
        }
    }
};


/* =========================================================
   HALDO AI VOICE
   ========================================================= */

window.HalDo.ai.voice = {

    initialized: false,

    speaking: false,

    enabled: true,

    voices: [],

    initialize() {

        if (this.initialized) {
            return true;
        }

        this.enabled =
            window.HalDo.configManager
                ? window.HalDo.configManager
                    .get(
                        "voice",
                        true
                    )
                : true;

        this.loadVoices();

        if (
            "speechSynthesis" in
            window
        ) {

            window.speechSynthesis
                .addEventListener(
                    "voiceschanged",
                    () => {
                        this.loadVoices();
                    }
                );
        }

        this.initialized = true;

        return true;
    },

    loadVoices() {

        if (
            !("speechSynthesis" in window)
        ) {

            this.voices = [];

            return;
        }

        this.voices =
            window.speechSynthesis
                .getVoices();
    },

    findVoice(
        language
    ) {

        const langMap = {

            de: "de",
            en: "en",
            tr: "tr",
            ar: "ar",
            fr: "fr",
            es: "es",
            it: "it",
            ku: "ku"

        };

        const prefix =
            langMap[language] ||
            "de";

        return this.voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith(
                        prefix
                    )
        ) || this.voices[0] || null;
    },

    speak(
        text,
        options = {}
    ) {

        if (
            !this.enabled ||
            !("speechSynthesis" in window)
        ) {

            return false;
        }

        const value =
            String(
                text || ""
            ).trim();

        if (!value) {
            return false;
        }

        window.speechSynthesis
            .cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                value
            );

        const language =
            options.language ||
            window.HalDo.ai.language
                .get();

        utterance.lang =
            language === "de"
                ? "de-DE"
                : language + "-" +
                    (
                        language === "en"
                            ? "US"
                            : language === "tr"
                                ? "TR"
                                : "FR"
                    );

        const voice =
            options.voice ||
            this.findVoice(
                language
            );

        if (voice) {
            utterance.voice =
                voice;
        }

        utterance.rate =
            options.rate ?? 1;

        utterance.pitch =
            options.pitch ?? 1;

        utterance.volume =
            options.volume ?? 0.85;

        utterance.onstart =
            () => {

                this.speaking =
                    true;

                window.HalDo.emit(
                    "voice:start",
                    {},
                    {
                        source:
                            "ai-voice"
                    }
                );
            };

        utterance.onend =
            () => {

                this.speaking =
                    false;

                window.HalDo.emit(
                    "voice:end",
                    {},
                    {
                        source:
                            "ai-voice"
                    }
                );
            };

        utterance.onerror =
            event => {

                this.speaking =
                    false;

                window.HalDo.emit(
                    "voice:error",
                    {
                        error:
                            event.error
                    },
                    {
                        source:
                            "ai-voice"
                    }
                );
            };

        window.speechSynthesis
            .speak(
                utterance
            );

        return true;
    },

    stop() {

        if (
            !("speechSynthesis" in window)
        ) {

            return false;
        }

        window.speechSynthesis
            .cancel();

        this.speaking =
            false;

        return true;
    },

    toggle() {

        this.enabled =
            !this.enabled;

        if (
            window.HalDo.configManager
        ) {

            window.HalDo.configManager
                .set(
                    "voice",
                    this.enabled
                );
        }

        if (
            !this.enabled
        ) {

            this.stop();
        }

        return this.enabled;
    }
};

/* =========================================================
   OPEN APP THROUGH ONE UNIFIED SYSTEM
   ========================================================= */

window.HalDo.apps.open =
    async function(
        appId,
        options = {}
    ) {

        const definition =
            this.manifest.find(
                app =>
                    app.id === appId
            );

        if (!definition) {

            return {
                success: false,
                error:
                    "App nicht gefunden: " +
                    appId
            };
        }

        /* -------------------------------------------------
           PREFERRED APP MANAGER
           ------------------------------------------------- */

        if (
            window.HalDo.appManager &&
            typeof window.HalDo.appManager
                .open === "function"
        ) {

            try {

                const result =
                    await window.HalDo
                        .appManager
                        .open(
                            appId,
                            options
                        );

                return {
                    success: true,
                    app:
                        definition,
                    result
                };

            }
            catch (error) {

                window.HalDo.reportError(
                    error,
                    "apps.open:" +
                    appId
                );
            }
        }

        /* -------------------------------------------------
           FALLBACK WINDOW CREATION
           ------------------------------------------------- */

        return this.createFallbackWindow(
            definition,
            options
        );
    };


/* =========================================================
   FALLBACK WINDOW SYSTEM
   ========================================================= */

window.HalDo.apps.windows =
    new Map();


window.HalDo.apps.createFallbackWindow =
    function(
        app,
        options = {}
    ) {

        const existing =
            this.windows.get(
                app.id
            );

        if (
            app.singleton &&
            existing
        ) {

            this.focusFallbackWindow(
                existing
            );

            return {
                success: true,
                app,
                window:
                    existing
            };
        }

        const viewportWidth =
            window.innerWidth;

        const viewportHeight =
            window.innerHeight;

        const width =
            Math.min(
                options.width ||
                app.defaultWidth ||
                680,
                Math.max(
                    420,
                    viewportWidth - 80
                )
            );

        const height =
            Math.min(
                options.height ||
                app.defaultHeight ||
                520,
                Math.max(
                    360,
                    viewportHeight - 120
                )
            );

        const left =
            Math.max(
                24,
                (
                    viewportWidth -
                    width
                ) / 2
            );

        const top =
            Math.max(
                50,
                (
                    viewportHeight -
                    height
                ) / 2
            );

        const windowElement =
            document.createElement(
                "section"
            );

        windowElement.className =
            "haldo-window";

        windowElement.dataset.app =
            app.id;

        windowElement.style.width =
            width + "px";

        windowElement.style.height =
            height + "px";

        windowElement.style.left =
            left + "px";

        windowElement.style.top =
            top + "px";

        windowElement.style.zIndex =
            this.nextZ();

        windowElement.innerHTML = `

            <header
                class="haldo-window-titlebar"
            >

                <div
                    class="haldo-window-title"
                >

                    <span
                        class="haldo-window-icon"
                    >
                        ${app.icon || "✦"}
                    </span>

                    <span>
                        ${app.title || app.name}
                    </span>

                </div>

                <div
                    class="haldo-window-controls"
                >

                    <button
                        data-minimize
                        aria-label="Minimieren"
                    >
                        −
                    </button>

                    <button
                        data-maximize
                        aria-label="Maximieren"
                    >
                        □
                    </button>

                    <button
                        data-close
                        aria-label="Schließen"
                    >
                        ×
                    </button>

                </div>

            </header>

            <div
                class="haldo-window-body"
            ></div>

        `;

        const body =
            windowElement.querySelector(
                ".haldo-window-body"
            );

        body.appendChild(
            this.content(app)
        );

        document.body.appendChild(
            windowElement
        );

        const record = {

            id:
                window.HalDo.runtime
                    .createId(
                        "window"
                    ),

            appId:
                app.id,

            element:
                windowElement,

            minimized: false,

            maximized: false,

            original: {
                width,
                height,
                left,
                top
            }

        };

        this.windows.set(
            app.id,
            record
        );

        this.bindFallbackWindow(
            record
        );

        window.HalDo.emit(
            "window:opened",
            {
                appId:
                    app.id,

                windowId:
                    record.id
            },
            {
                source:
                    "app-system"
            }
        );

        return {
            success: true,
            app,
            window:
                record
        };
    };


window.HalDo.apps.nextZ =
    function() {

        this._zIndex =
            Math.max(
                this._zIndex || 100,
                100
            ) + 1;

        return this._zIndex;
    };


/* =========================================================
   WINDOW EVENTS
   ========================================================= */

window.HalDo.apps.bindFallbackWindow =
    function(
        record
    ) {

        const element =
            record.element;

        const close =
            element.querySelector(
                "[data-close]"
            );

        const minimize =
            element.querySelector(
                "[data-minimize]"
            );

        const maximize =
            element.querySelector(
                "[data-maximize]"
            );

        close.onclick =
            () => {

                this.closeFallbackWindow(
                    record.appId
                );
            };

        minimize.onclick =
            () => {

                record.minimized =
                    !record.minimized;

                element.classList.toggle(
                    "is-minimized",
                    record.minimized
                );
            };

        maximize.onclick =
            () => {

                if (
                    record.maximized
                ) {

                    this.restoreFallbackWindow(
                        record
                    );

                }
                else {

                    this.maximizeFallbackWindow(
                        record
                    );
                }
            };

        element.addEventListener(
            "pointerdown",
            () => {

                element.style.zIndex =
                    this.nextZ();

            }
        );
    };


window.HalDo.apps.closeFallbackWindow =
    function(
        appId
    ) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return false;
        }

        record.element.remove();

        this.windows.delete(
            appId
        );

        window.HalDo.emit(
            "window:closed",
            {
                appId
            },
            {
                source:
                    "app-system"
            }
        );

        return true;
    };


window.HalDo.apps.maximizeFallbackWindow =
    function(
        record
    ) {

        record.maximized =
            true;

        record.element.classList.add(
            "is-maximized"
        );

        record.element.style.left =
            "0px";

        record.element.style.top =
            "42px";

        record.element.style.width =
            "100vw";

        record.element.style.height =
            "calc(100vh - 42px)";
    };


window.HalDo.apps.restoreFallbackWindow =
    function(
        record
    ) {

        record.maximized =
            false;

        record.element.classList.remove(
            "is-maximized"
        );

        record.element.style.left =
            record.original.left +
            "px";

        record.element.style.top =
            record.original.top +
            "px";

        record.element.style.width =
            record.original.width +
            "px";

        record.element.style.height =
            record.original.height +
            "px";
    };


window.HalDo.apps.focusFallbackWindow =
    function(
        record
    ) {

        record.element.style.zIndex =
            this.nextZ();

        record.element.classList.remove(
            "is-minimized"
        );

        record.minimized =
            false;
    };


/* =========================================================
   APP SEARCH
   ========================================================= */

window.HalDo.apps.search =
    function(
        query
    ) {

        const text =
            String(
                query || ""
            )
            .toLowerCase()
            .trim();

        if (!text) {

            return [
                ...this.manifest
            ];
        }

        return this.manifest.filter(
            app => {

                return (

                    app.id
                        .toLowerCase()
                        .includes(text)

                    ||

                    app.name
                        .toLowerCase()
                        .includes(text)

                    ||

                    app.description
                        .toLowerCase()
                        .includes(text)

                    ||

                    app.category
                        .toLowerCase()
                        .includes(text)

                );
            }
        );
    };


/* =========================================================
   APP CATEGORY FILTER
   ========================================================= */

window.HalDo.apps.byCategory =
    function(
        category
    ) {

        return this.manifest.filter(
            app =>
                app.category ===
                category
        );
    };


/* =========================================================
   GLOBAL APP API
   ========================================================= */

window.HalDo.api.apps = {

    list() {

        return [
            ...window.HalDo.apps
                .manifest
        ];
    },

    search(
        query
    ) {

        return window.HalDo.apps
            .search(
                query
            );
    },

    open(
        appId,
        options
    ) {

        return window.HalDo.apps
            .open(
                appId,
                options
            );
    },

    close(
        appId
    ) {

        if (
            window.HalDo.appManager &&
            typeof window.HalDo.appManager
                .close === "function"
        ) {

            return window.HalDo.appManager
                .close(
                    appId
                );
        }

        return window.HalDo.apps
            .closeFallbackWindow(
                appId
            );
    },

    categories() {

        return {
            ...window.HalDo.apps
                .categories
        };
    }
};

<script>

/* =========================================================

window.HalDo.cosmic =
    window.HalDo.cosmic ||
    {};

window.HalDo.cosmic.state = {

    initialized: false,

    animationFrame: null,

    stars: [],

    enabled: true,

    intensity: 1,

    motion: true

};


/* =========================================================
   COSMIC CANVAS
   ========================================================= */

window.HalDo.cosmic.createCanvas =
    function() {

        let canvas =
            document.getElementById(
                "haldo-cosmic-canvas"
            );

        if (canvas) {
            return canvas;
        }

        canvas =
            document.createElement(
                "canvas"
            );

        canvas.id =
            "haldo-cosmic-canvas";

        canvas.setAttribute(
            "aria-hidden",
            "true"
        );

        document.body.prepend(
            canvas
        );

        return canvas;
    };


window.HalDo.cosmic.initialize =
    function() {

        if (
            this.state.initialized
        ) {
            return true;
        }

        const canvas =
            this.createCanvas();

        this.canvas =
            canvas;

        this.context =
            canvas.getContext(
                "2d"
            );

        this.resize();

        this.generateStars();

        window.addEventListener(
            "resize",
            () =>
                this.resize()
        );

        this.state.initialized =
            true;

        this.start();

        window.HalDo.emit(
            "cosmic:ready",
            {},
            {
                source:
                    "cosmic-world"
            }
        );

        return true;
    };


window.HalDo.cosmic.resize =
    function() {

        if (!this.canvas) {
            return;
        }

        const ratio =
            Math.min(
                window.devicePixelRatio ||
                1,
                2
            );

        this.canvas.width =
            window.innerWidth *
            ratio;

        this.canvas.height =
            window.innerHeight *
            ratio;

        this.canvas.style.width =
            window.innerWidth +
            "px";

        this.canvas.style.height =
            window.innerHeight +
            "px";

        this.context.setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );
    };


window.HalDo.cosmic.generateStars =
    function() {

        this.state.stars =
            [];

        const count =
            Math.min(
                260,
                Math.max(
                    90,
                    Math.floor(
                        window.innerWidth *
                        window.innerHeight /
                        8500
                    )
                )
            );

        for (
            let i = 0;
            i < count;
            i++
        ) {

            this.state.stars.push({

                x:
                    Math.random() *
                    window.innerWidth,

                y:
                    Math.random() *
                    window.innerHeight,

                radius:
                    Math.random() *
                    1.45 +
                    .25,

                alpha:
                    Math.random() *
                    .7 +
                    .15,

                phase:
                    Math.random() *
                    Math.PI *
                    2,

                speed:
                    Math.random() *
                    .0009 +
                    .00025

            });
        }
    };


window.HalDo.cosmic.start =
    function() {

        if (
            this.state.animationFrame
        ) {
            return;
        }

        const render =
            timestamp => {

                this.render(
                    timestamp
                );

                this.state.animationFrame =
                    requestAnimationFrame(
                        render
                    );
            };

        this.state.animationFrame =
            requestAnimationFrame(
                render
            );
    };


window.HalDo.cosmic.stop =
    function() {

        if (
            this.state.animationFrame
        ) {

            cancelAnimationFrame(
                this.state.animationFrame
            );

            this.state.animationFrame =
                null;
        }
    };


window.HalDo.cosmic.render =
    function(
        timestamp
    ) {

        if (
            !this.context ||
            !this.canvas ||
            !this.state.enabled
        ) {
            return;
        }

        const ctx =
            this.context;

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;

        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        /* -----------------------------------------
           DEEP COSMIC BACKGROUND
           ----------------------------------------- */

        const gradient =
            ctx.createRadialGradient(
                width * .5,
                height * .42,
                0,
                width * .5,
                height * .42,
                Math.max(
                    width,
                    height
                ) * .75
            );

        gradient.addColorStop(
            0,
            "rgba(55,85,180,.10)"
        );

        gradient.addColorStop(
            .5,
            "rgba(20,35,90,.055)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,.22)"
        );

        ctx.fillStyle =
            gradient;

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        /* -----------------------------------------
           STARS
           ----------------------------------------- */

        this.state.stars
            .forEach(
                star => {

                    const pulse =
                        Math.sin(
                            timestamp *
                            star.speed +
                            star.phase
                        ) *
                        .25 +
                        .75;

                    ctx.beginPath();

                    ctx.arc(
                        star.x,
                        star.y,
                        star.radius,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle =
                        `rgba(
                            255,
                            255,
                            255,
                            ${
                                star.alpha *
                                pulse *
                                this.state.intensity
                            }
                        )`;

                    ctx.fill();

                }
            );
    };

window.HalDo.update.check =
    async function() {

        if (
            this.state.checking
        ) {

            return {
                success: false,
                reason:
                    "already-checking"
            };
        }

        this.state.checking =
            true;

        try {

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        250
                    )
            );

            this.state.lastCheck =
                Date.now();

            this.state.available =
                false;

            window.HalDo.emit(
                "update:checked",
                {
                    current:
                        this.version,

                    available:
                        false
                },
                {
                    source:
                        "update-system"
                }
            );

            return {

                success:
                    true,

                current:
                    this.version,

                available:
                    false
            };

        }
        finally {

            this.state.checking =
                false;
        }
    };


window.HalDo.update.download =
    async function(
        version
    ) {

        this.state.downloading =
            true;

        try {

            await new Promise(

                    setTimeout(

                        400
                    )
            );

            this.state.targetVersion =
                version ||
                this.version;

            window.HalDo.emit(
                "update:downloaded",
                {
                    version:
                        this.state
                            .targetVersion
                },
                {
                    source:
                        "update-system"
                }
            );

            return {
                success:
                    true
            };

        }
        finally {

            this.state.downloading =
                false;
        }
    };


window.HalDo.update.validate =
    function(
        version
    ) {

        return Boolean(
            version &&
            String(version)
                .trim()
                .length > 0
        );
    };


window.HalDo.update.install =

    ) {

            !this.validate(
                version
            )
        ) {

            return {
                success:
                    false,

                error:
                    "Ungültige Version"
            };
        }

        this.state.installing =

                    )
            );

            window.HalDo.emit(
                "update:installed",

                    version
                },

                    source:
                        "update-system"
                }
            );

            return {
                success:
                    true,
                version
            };

        }
        finally {

            this.state.installing =
                false;
        }
    };

window.HalDo.backup =

    {};

window.HalDo.backup.create =
    function() {

        const payload = {

            format:
                "haldo-backup",

            version:
                "20.0.0",

            createdAt:
                new Date()
                    .toISOString(),

            state:
                window.HalDo.stateManager
                    .snapshot(),

            storage:
                window.HalDo.storage
                    .export()

        };

        const serialized =
            JSON.stringify(
                payload,
                null,
                2
            );

        window.HalDo.emit(
            "backup:created",
            {
                size:
                    serialized.length
            },
            {
                source:
                    "backup-system"
            }
        );

        return {
            success:
                true,

            payload:
                serialized
        };
    };


window.HalDo.backup.download =
    function() {

        const result =
            this.create();

        if (
            !result.success
        ) {
            return result;
        }

        const blob =
            new Blob(
                [
                    result.payload
                ],
                {
                    type:
                        "application/json"
                }
            );

        const url =
            URL.createObjectURL(
                blob
            );

        const anchor =
            document.createElement(
                "a"
            );

        anchor.href =
            url;

        anchor.download =
            "haldo-ai-os-20-backup.json";

        anchor.click();

        setTimeout(
            () =>
                URL.revokeObjectURL(
                    url
                ),
            1000
        );

        return {
            success:
                true
        };
    };


/* =========================================================
   RESTORE
   ========================================================= */

window.HalDo.backup.restore =
    async function(
        payload
    ) {

        try {

            const data =
                typeof payload ===
                "string"
                    ? JSON.parse(
                        payload
                    )
                    : payload;

            if (
                !data ||
                data.format !==
                "haldo-backup"
            ) {

                throw new Error(
                    "Ungültiges HalDo Backup"
                );
            }

            if (
                data.storage &&
                window.HalDo.storage &&
                typeof window.HalDo.storage
                    .import ===
                    "function"
            ) {

                await window.HalDo.storage
                    .import(
                        data.storage
                    );
            }

            window.HalDo.emit(
                "backup:restored",
                {
                    version:
                        data.version
                },
                {
                    source:
                        "backup-system"
                }
            );

            return {
                success:
                    true
            };

        }
        catch (error) {

            window.HalDo.reportError(
                error,
                "backup.restore"
            );

            return {
                success:
                    false,

                error:
                    error.message
            };
        }
    };

   ========================================================= */

window.HalDo.migration =
    window.HalDo.migration ||
    {};

window.HalDo.migration.currentVersion =
    "20.0.0";


window.HalDo.migration.detect =
    function(
        data
    ) {

        if (
            !data
        ) {

            return {
                required:
                    false
            };
        }

        const version =
            data.version ||
            "0.0.0";

        return {

            required:
                version !==
                this.currentVersion,

            from:
                version,

            to:
                this.currentVersion
        };
    };


window.HalDo.migration.run =
    async function(
        data
    ) {

        const result =
            this.detect(
                data
            );

        if (
            !result.required
        ) {

            return {
                success:
                    true,

                migrated:
                    false
            };
        }

        window.HalDo.emit(
            "migration:start",
            result,
            {
                source:
                    "migration-system"
            }
        );

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    250
                )
        );

        window.HalDo.emit(
            "migration:complete",
            result,
            {
                source:
                    "migration-system"
            }
        );

        return {
            success:
                true,

            migrated:
                true
        };
    };

        ) {

                "recovery:rollback-complete",

window.HalDo.pwa =
    window.HalDo.pwa ||

window.HalDo.pwa.state = {

    supported:
        "serviceWorker" in
        navigator,

    registered:
        false,

    online:
        navigator.onLine
};


window.HalDo.pwa.initialize =
    async function() {

        window.addEventListener(
            "online",
            () => {

                this.state.online =
                    true;

                this.updateStatus(
                    true
                );

                window.HalDo.emit(
                    "network:online",
                    {},
                    {
                        source:
                            "pwa"
                    }
                );
            }
        );

        window.addEventListener(
            "offline",
            () => {

                this.state.online =
                    false;

                this.updateStatus(
                    false
                );

                window.HalDo.emit(
                    "network:offline",
                    {},
                    {
                        source:
                            "pwa"
                    }
                );
            }
        );

        this.updateStatus(
            navigator.onLine
        );

        if (
            !this.state.supported
        ) {

            return {
                success:
                    false,

                reason:
                    "service-worker-not-supported"
            };
        }

        /*
         * Der Service Worker wird nur registriert,
         * wenn die Datei tatsächlich vorhanden ist.
         */

        try {

            const response =
                await fetch(
                    "service-worker.js",
                    {
                        method:
                            "HEAD",

                        cache:
                            "no-store"
                    }
                );

            if (
                !response.ok
            ) {

                return {
                    success:
                        false,

                    reason:
                        "service-worker-file-not-found"
                };
            }

            const registration =
                await navigator.serviceWorker
                    .register(
                        "service-worker.js",
                        {
                            scope:
                                "./"
                        }
                    );

            this.registration =
                registration;

            this.state.registered =
                true;

            window.HalDo.emit(
                "pwa:registered",
                {},
                {
                    source:
                        "pwa"
                }
            );

            return {
                success:
                    true
            };

        }
        catch (error) {

            window.HalDo.reportError(
                error,
                "pwa.initialize"
            );

            return {
                success:
                    false,

                error:
                    error.message
            };
        }
    };


window.HalDo.pwa.updateStatus =

        online

        const indicator =

                "HalDo Core bereit · Online";

        if (
            typeof AI.initialize ===
            "function"
        ) {

            await AI.initialize();

        /*

        if (
            window.HalDo.aiEngine &&
            typeof window.HalDo.aiEngine

            await window.HalDo.aiEngine
                .initialize();
        }


        /*

                .initialize ===

        ) {

            await window.HalDo.aiMemory
                .initialize();
        }


        /*

        if (
            window.HalDo.aiLanguage &&
            typeof window.HalDo.aiLanguage
                .initialize ===
                "function"
        ) {

            await window.HalDo.aiLanguage
                .initialize();
        }


        /*
         * Voice
         */

        if (
            window.HalDo.aiVoice &&
            typeof window.HalDo.aiVoice
                .initialize ===

        ) {

            await window.HalDo.aiVoice

   ========================================================= */

window.HalDo.integration.startConversation =
    function() {

        window.HalDo.conversation =
            window.HalDo.conversation ||
            {};

        window.HalDo.conversation.history =
            window.HalDo.conversation.history ||
            [];


        window.HalDo.conversation.say =
            function(
                text,
                role = "assistant"
            ) {

                const message = {

                    id:
                        "msg-" +
                        Date.now() +
                        "-" +
                        Math.random()
                            .toString(36)
                            .slice(2),

                    role,

                    text:

                        String(
                            text
                        ),

                    timestamp:
                        Date.now()

                };

                this.history.push(
                    message
                );

                window.HalDo.emit(
                    "conversation:message",
                    message,
                    {
                        source:
                            "conversation"
                    }
                );

                return message;
            };


        window.HalDo.conversation.clear =
            function() {

                this.history =
                    [];

                window.HalDo.emit(
                    "conversation:cleared",
                    {},
                    {
                        source:
                            "conversation"
                    }
                );
            };


        return true;
    };

/* =========================================================
   FINAL STARTUP
   ========================================================= */

window.HalDo.integration.start =
    async function() {

        if (
            this.state.started
        ) {

            return;
        }

        this.state.started =
            true;

        this.state.startupTime =
            Date.now();


        this.setStatus(
            "HalDo Core wird vorbereitet …"
        );


        /* -----------------------------------------
           STORAGE
           ----------------------------------------- */

        await this.safe(
            "storage",
            () =>
                this.connectStorage()
        );


        /* -----------------------------------------
           SERVICES
           ----------------------------------------- */

        await this.safe(
            "services",
            () =>
                this.connectServices()
        );


        /* -----------------------------------------
           APPS
           ----------------------------------------- */

        await this.safe(
            "apps",
            () =>
                this.ensureApps()
        );


        /* -----------------------------------------
           ROUTER
           ----------------------------------------- */

        await this.safe(
            "router",
            () =>
                this.connectRouter()
        );


        /* -----------------------------------------
           WINDOWS
           ----------------------------------------- */

        await this.safe(
            "windows",
            () =>
                this.connectWindows()
        );


        /* -----------------------------------------
           AI
           ----------------------------------------- */

        await this.safe(
            "ai",
            () =>
                this.connectAI()
        );


        /* -----------------------------------------
           CONVERSATION
           ----------------------------------------- */

        await this.safe(
            "conversation",
            () =>
                this.startConversation()
        );


        /* -----------------------------------------
           FRIENDLY AI
           ----------------------------------------- */

        await this.safe(
            "ai-persona",
            () =>
                this.enableFriendlyAI()
        );


        /* -----------------------------------------
           COSMIC WORLD
           ----------------------------------------- */

        await this.safe(
            "cosmic",
            () =>
                this.connectCosmic()
        );


        /* -----------------------------------------
           FINAL STATUS
           ----------------------------------------- */

        this.state.ready =
            true;

        this.state.initialized =
            true;


        this.readyMessage();


        window.HalDo.emit(
            "system:ready",
            {

                version:
                    "20.0.0",

                ready:
                    true,

                startupTime:
                    Date.now() -
                    this.state
                        .startupTime,

                errors:
                    this.state
                        .errors
                        .length

            },
            {
                source:
                    "haldo-final-integration"
            }
        );


        window.HalDo.emit(
            "haldo:ready",
            {
                version:
                    "20.0.0"
            },
            {
                source:
                    "haldo-final-integration"
            }
        );
    };

/* =========================================================

   ========================================================= */

window.addEventListener(
    "error",
    function(
        event
    ) {

        if (
            !window.HalDo.integration
        ) {
            return;
        }

        window.HalDo.integration
            .state
            .errors
            .push({

                name:
                    "window-error",

                message:
                    event.message,

                time:
                    Date.now()

            });
    }
);


window.addEventListener(
    "unhandledrejection",
    function(
        event
    ) {

        if (
            !window.HalDo.integration
        ) {
            return;
        }

        const reason =
            event.reason;

        window.HalDo.integration
            .state
            .errors
            .push({

                name:
                    "unhandled-rejection",

                message:
                    reason &&
                    reason.message
                        ? reason.message
                        : String(
                            reason
                        ),

                time:
                    Date.now()

            });
    }
);

/* =========================================================
   GLOBAL HALDO COMMAND HELPER
   ========================================================= */

window.HalDo.ask =
    async function(
        text
    ) {

        const input =
            String(
                text ||
                ""
            ).trim();

        if (!input) {

            return {
                success:
                    false,

                error:
                    "Keine Eingabe"
            };
        }


        /*
         * Bevorzugt den vorhandenen
         * AI-Chat / AI-Engine Stack.
         */

        if (
            window.HalDo.ai &&
            typeof window.HalDo.ai.ask ===
            "function"
        ) {

            return window.HalDo.ai.ask(
                input
            );
        }


        if (
            window.HalDo.aiEngine &&
            typeof window.HalDo.aiEngine
                .process ===
            "function"
        ) {

            return window.HalDo.aiEngine
                .process(
                    input
                );
        }


        /*
         * Fallback:
         * System bleibt benutzbar,
         * auch wenn ein externes
         * AI-Modul noch nicht geladen ist.
         */

        const response =
            "Ich bin HalDo AI OS 20. " +
            "Meine Systemmodule sind verbunden. " +
            "Die vollständige AI-Engine kann " +
            "jetzt über ihre vorhandene Schnittstelle " +
            "angesprochen werden.";

        if (
            window.HalDo.conversation &&
            typeof window.HalDo.conversation
                .say ===
            "function"
        ) {

            window.HalDo.conversation
                .say(
                    input,
                    "user"
                );

            window.HalDo.conversation
                .say(
                    response,
                    "assistant"
                );
        }

        return {

            success:
                true,

            text:
                response,

            fallback:
                true

        };
    };
