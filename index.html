                        ) *
                        orbitRadius;


                    const y =
                        centerY +
                        Math.sin(
                            planet.angle
                        ) *
                        orbitRadius *
                        .58;


                    const size =
                        planet.size;


                    const gradient =
                        ctx.createRadialGradient(
                            x -
                            size *
                            .35,

                            y -
                            size *
                            .35,

                            .5,

                            x,
                            y,
                            size *
                            1.6
                        );


                    const hue =
                        (
                            index *
                            47
                        ) %
                        360;


                    gradient.addColorStop(
                        0,
                        "hsl(" +
                        hue +
                        " 80% 88%)"
                    );


                    gradient.addColorStop(
                        .45,
                        "hsl(" +
                        hue +
                        " 70% 62%)"
                    );


                    gradient.addColorStop(
                        1,
                        "hsl(" +
                        hue +
                        " 70% 28%)"
                    );


                    ctx.fillStyle =
                        gradient;


                    ctx.beginPath();


                    ctx.arc(
                        x,
                        y,
                        size,
                        0,
                        Math.PI *
                        2
                    );


                    ctx.fill();

                }
            );

        };

       FRAME
       ======================================================== */

    HD8.world.render =
        function(
            timestamp
        ) {

            if (
                !this.state.running
            ) {

                return;

            }


            this.drawSky(
                Date.now()
            );


            this.drawStars(
                Date.now()
            );


            this.drawPlanets(
                Date.now()
            );


            this.drawSun(
                Date.now()
            );


            this.state.animationFrame =
                requestAnimationFrame(
                    time =>
                        this.render(
                            time
                        )
                );

        };


    /* ========================================================
       START
       ======================================================== */

    HD8.world.start =
        function() {

            if (
                this.state.running
            ) {

                return;

            }


            this.setupCanvas();


            this.createStars();


            this.createPlanets();


            this.state.running =
                true;


            this.render(
                performance.now()
            );


            HD8.emit(
                "world:started"
            );

        };


    /* ========================================================
       STOP
       ======================================================== */

    HD8.world.stop =
        function() {

            this.state.running =
                false;


            if (
                this.state.animationFrame
            ) {

                cancelAnimationFrame(
                    this.state.animationFrame
                );

            }


            this.state.animationFrame =
                null;


            HD8.emit(
                "world:stopped"
            );

        };


    /* ========================================================
       SETTINGS
       ======================================================== */

    HD8.world.setSettings =
        function(
            settings = {}
        ) {

            Object.assign(
                this.state.settings,
                settings
            );


            this.state.settings.starCount =
                Math.max(
                    20,
                    Math.min(
                        1000,
                        Number(
                            this.state.settings
                                .starCount
                        ) ||
                        365
                    )
                );


            this.state.settings.planetCount =
                Math.max(
                    1,
                    Math.min(
                        16,
                        Number(
                            this.state.settings
                                .planetCount
                        ) ||
                        8
                    )
                );


            this.state.settings.rotationSpeed =
                Math.max(
                    .1,
                    Math.min(
                        5,
                        Number(
                            this.state.settings
                                .rotationSpeed
                        ) ||
                        1
                    )
                );


            this.createStars();


            this.createPlanets();


            HD8.emit(
                "world:settings-changed",
                this.state.settings
            );


            return this.state.settings;

        };


    /* ========================================================
       RESET SETTINGS
       ======================================================== */

    HD8.world.resetSettings =
        function() {

            this.setSettings(
                {
                    ...this.defaults
                }
            );


            return this.state.settings;

        };


    /* ========================================================
       INITIALIZATION
       ======================================================== */

    HD8.world.injectStyles();


    HD8.world.getRoot();


    HD8.world.setupCanvas();


    HD8.world.createStars();


    HD8.world.createPlanets();


    window.addEventListener(
        "resize",
        () => {

            HD8.world.resize();

        }
    );


    HD8.world.state.initialized =
        true;


    HD8.emit(

<script>
"use strict";

window.HalDo = window.HalDo || {};

const HD = window.HalDo;


/* =========================================================
   UNIVERSAL APP DATA SYSTEM
   ========================================================= */

HD.data =
    HD.data || {};


HD.data.collections =
    HD.data.collections || new Map();


/* ---------------------------------------------------------
   CREATE COLLECTION
   --------------------------------------------------------- */

HD.data.createCollection =
    function(appId) {

        if (
            !this.collections.has(
                appId
            )
        ) {

            this.collections.set(
                appId,
                []
            );

        }

        return this.collections.get(
            appId
        );

    };


/* ---------------------------------------------------------
   GET COLLECTION
   --------------------------------------------------------- */

HD.data.getCollection =
    function(appId) {

        if (
            !this.collections.has(
                appId
            )
        ) {

            const stored =
                HD.storage.get(
                    "collection:" +
                    appId,
                    []
                );

            this.collections.set(
                appId,
                Array.isArray(stored)
                    ? stored
                    : []
            );

        }

        return this.collections.get(
            appId
        );

    };


/* ---------------------------------------------------------
   SAVE COLLECTION
   --------------------------------------------------------- */

HD.data.saveCollection =
    function(appId) {

        const collection =
            this.getCollection(
                appId
            );

        HD.storage.set(
            "collection:" +
            appId,
            collection
        );

        HD.emit(
            "data:saved",
            {
                appId,
                collection
            }
        );

        return true;

    };


/* ---------------------------------------------------------
   ADD ITEM
   --------------------------------------------------------- */

HD.data.add =
    function(
        appId,
        data = {}
    ) {

        const collection =
            this.getCollection(
                appId
            );


        const item = {

            id:
                "item-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2, 8),

            createdAt:
                Date.now(),

            updatedAt:
                Date.now(),

            ...data

        };


        collection.push(
            item
        );


        this.saveCollection(
            appId
        );


        HD.emit(
            "data:added",
            {
                appId,
                item
            }
        );


        return item;

    };


/* ---------------------------------------------------------
   UPDATE ITEM
   --------------------------------------------------------- */

HD.data.update =
    function(
        appId,
        itemId,
        changes = {}
    ) {

        const collection =
            this.getCollection(
                appId
            );


        const index =
            collection.findIndex(
                item =>
                    item.id ===
                    itemId
            );


        if (
            index === -1
        ) {

            return null;

        }


        collection[index] = {

            ...collection[index],

            ...changes,

            updatedAt:
                Date.now()

        };


        this.saveCollection(
            appId
        );


        HD.emit(
            "data:updated",
            {
                appId,
                item:
                    collection[index]
            }
        );


        return collection[index];

    };


/* ---------------------------------------------------------
   DELETE ITEM
   --------------------------------------------------------- */

HD.data.remove =
    function(
        appId,
        itemId
    ) {

        const collection =
            this.getCollection(
                appId
            );


        const index =
            collection.findIndex(
                item =>
                    item.id ===
                    itemId
            );


        if (
            index === -1
        ) {

            return false;

        }


        const removed =
            collection.splice(
                index,
                1
            )[0];


        this.saveCollection(
            appId
        );


        HD.emit(
            "data:removed",
            {
                appId,
                item:
                    removed
            }
        );


        return true;

    };


/* ---------------------------------------------------------
   CLEAR COLLECTION
   --------------------------------------------------------- */

HD.data.clear =
    function(appId) {

        this.collections.set(
            appId,
            []
        );


        this.saveCollection(

        );

HD11.aiChat.escape =
    function(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    };

HD11.aiChat.create =

                            <img
                                class="haldo-ai-empty-logo"
                                src="assets/logo/logo.png"
                                alt="HalDo"
                                onerror="

                                    this.src='logo.png';

                            </div>

                                class="haldo-ai-empty-text"

                    class="haldo-ai-composer"

                        class="haldo-ai-input"

                        placeholder="Schreibe HalDo AI eine Nachricht …"

                        data-ai-send
                        aria-label="Nachricht senden"
                    >
                        ➤
                    </button>

                </form>

        document.body.appendChild(
            overlay
        );


        this.state.root =
            overlay;


        this.state.messagesElement =
            overlay.querySelector(
                "[data-ai-messages]"
            );


        this.state.input =
            overlay.querySelector(
                "[data-ai-input]"
            );


        this.state.sendButton =
            overlay.querySelector(
                "[data-ai-send]"
            );


        this.state.status =

        overlay
            .querySelector(

            .addEventListener(

                    this.close();

            );


        overlay.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    overlay
                ) {

                    this.close();

                }

            }
        );


        overlay
            .querySelector(
                "[data-ai-form]"
            )
            .addEventListener(
                "submit",
                event => {

                    event.preventDefault();

                    this.send();

                        "Enter" &&

/* =========================================================
   OPEN
   ========================================================= */

HD11.aiChat.open =
    function() {

        if (
            !this.state.root
        ) {

            this.create();

        }


        this.state.open =
            true;


        this.state.root
            .classList
            .add(
                "open"
            );


        this.setStatus(
            "bereit"
        );


        if (
            this.state.input
        ) {

            setTimeout(
                () => {

                    this.state.input
                        .focus();

                },
                80
            );

        }


        HD11.emit(
            "ai:chat:opened"
        );

    };


/* =========================================================
   CLOSE
   ========================================================= */

HD11.aiChat.close =
    function() {

        if (
            !this.state.root
        ) {

            return;

        }


        this.state.open =
            false;


        this.state.root
            .classList
            .remove(
                "open"
            );


        HD11.emit(
            "ai:chat:closed"
        );

    };

   TOGGLE
   ========================================================= */

HD11.aiChat.toggle =
    function() {

        if (
            this.state.open
        ) {

            this.close();

        }

        else {

            this.open();

        }

    };

/* =========================================================
   ADD MESSAGE
   ========================================================= */

HD11.aiChat.addMessage =
    function(
        role,
        text
    ) {

        const cleanText =
            String(
                text ?? ""
            );


        this.state.messages.push(
            {

                role,

                text:
                    cleanText,

                timestamp:
                    Date.now()

            }
        );


        const empty =
            this.state.root
                ?.querySelector(
                    "[data-ai-empty]"
                );


        if (
            empty
        ) {

            empty.remove();

        }


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "haldo-ai-message " +
            (
                role ===
                "user"
                    ? "user"
                    : "assistant"
            );


        if (
            role !==
            "user"
        ) {

            row.innerHTML = `

                <div
                    class="haldo-ai-message-avatar"
                >

                    <img
                        src="assets/logo/logo.png"
                        alt="HalDo"
                        onerror="
                            this.onerror=null;
                            this.src='logo.png';
                        "
                    >

                </div>

                <div
                    class="haldo-ai-message-bubble"
                >
                    ${this.escape(
                        cleanText
                    )}
                </div>

            `;

        }

        else {

            row.innerHTML = `

                <div
                    class="haldo-ai-message-bubble"
                >
                    ${this.escape(
                        cleanText
                    )}
                </div>

            `;

        }


        this.state.messagesElement
            .appendChild(
                row
            );


        this.scrollToBottom();


        HD11.emit(
            "ai:message",
            {

                role,

                text:
                    cleanText

            }
        );


        return row;

    };

/* =========================================================
   LOCAL FALLBACK
   ========================================================= */

HD11.aiChat.localResponse =
    function(message) {

        const text =
            String(
                message || ""
            )
                .trim()
                .toLowerCase();


        if (
            !text
        ) {

            return
                "Schreib mir einfach etwas. Ich bin hier. 💙❤️";

        }


        if (
            text.includes(
                "hallo"
            ) ||
            text.includes(
                "hey haldo"
            ) ||
            text.includes(
                "hi haldo"
            )
        ) {

            return
                "Hallo 💙❤️ Ich bin HalDo AI. Schön, dass du da bist. Wie kann ich dir helfen?";

        }


        if (
            text.includes(
                "wer bist du"
            ) ||
            text.includes(
                "was bist du"
            )
        ) {

            return
                "Ich bin HalDo AI – die zentrale künstliche Intelligenz deiner HalDo-Welt. 💙❤️🚀";

        }


        if (
            text.includes(
                "danke"
            )
        ) {

            return
                "Sehr gerne. 💙❤️🚀";

        }


        if (
            text.includes(
                "einstellungen"
            )
        ) {

            return
                "Die Einstellungen können über das Hauptmenü geöffnet werden.";

        }


        if (
            text.includes(
                "menü"
            ) ||
            text.includes(
                "menu"
            )
        ) {

            return
                "Öffne das Hauptmenü. Dort findest du Apps, AI und Systemfunktionen.";

        }


        return
            "Ich habe deine Nachricht erhalten. 💙❤️ Die vollständige HalDo-AI-Verbindung wird über die vorhandenen AI-Systeme weitergereicht.";

    };

            ],

            [

                HD11.aiEngine?.respond
            ]

        ];


        for (
            const [
                context,
                candidate
            ]
            of candidates
        ) {

            if (
                typeof candidate !==
                "function"
            ) {

                continue;

            }


            try {

                const result =
                    await candidate.call(
                        context,
                        message
                    );


                if (
                    typeof result ===
                    "string" &&
                    result.trim()
                ) {

                    return result;

                }


                if (
                    result &&
                    typeof result.text ===
                    "string"
                ) {

                    return result.text;

                }

            }

            catch(error) {

                console.warn(
                    "[HalDo AI] Engine connection failed:",
                    error
                );

            }

        }


        return this.localResponse(
            message
        );

    };


/* =========================================================
   SEND MESSAGE
   ========================================================= */

HD11.aiChat.send =
    async function() {

        if (
            this.state.processing
        ) {

            return;

        }


        if (
            !this.state.input
        ) {

            return;

        }


        const message =
            this.state.input.value
                .trim();


        if (
            !message
        ) {

            return;

        }


        this.state.input.value =
            "";


        this.autoResize();


        this.state.processing =
            true;


        if (
            this.state.sendButton
        ) {

            this.state.sendButton
                .disabled =
                true;

        }


        this.addMessage(
            "user",
            message
        );


        this.setStatus(
            "denkt …"
        );


        this.showTyping();


        try {

            const response =
                await this.generateResponse(
                    message
                );


            this.hideTyping();


            this.addMessage(
                "assistant",
                response
            );


            this.setStatus(
                "bereit"
            );

        }

        catch(error) {

            this.hideTyping();


            console.error(
                "[HalDo AI] Chat error:",
                error
            );


            this.addMessage(
                "assistant",
                "Es ist ein interner Fehler aufgetreten. Bitte versuche es erneut."

            this.setStatus(
                "Fehler"
            );


            HD11.emit(

            false;

            HD11.voice?.listen,

            HD11.voice?.start,

            HD11.aiVoice?.listen,

            HD11.aiVoice?.start,

            HD11.aiSpeech?.listen,

            HD11.aiSpeech?.start

        ];


        for (
            const candidate
            of voiceCandidates
        ) {

            if (
                typeof candidate !==
                "function"
            ) {

                continue;

            }


            try {

                const result =
                    await candidate.call(
                        HD11.voice ||
                        HD11.aiVoice ||

                    );


                if (
                    typeof result ===
                    "string" &&
                    result.trim()
                ) {

                            result;

            !this.state.messages.length
        ) {

            return;

HD12.interactions.register =

HD12.navigation.go =
    function(

        options = {}
    ) {

        const destination =
            String(
                target || ""
            )
                .trim();


        if (
            !destination
        ) {

            return false;

        }


        this.history.push(
            {

                target:
                    destination,

                time:
                    Date.now(),

                options

            }
        );


        this.current =
            destination;


        HD12.interactions.state.activePanel =
            destination;


        HD12.interactions.state.lastAction =
            "navigate:" +
            destination;


        HD12.interactions.emit(
            "navigation:change",
            {

                target:
                    destination,

                options

            }
        );


        const element =
            document.querySelector(
                `[data-navigation="${CSS.escape(destination)}"]`
            );


        if (
            element
        ) {

            element.scrollIntoView(
                {

                    behavior:
                        options.instant
                            ? "auto"
                            : "smooth",

                    block:
                        "nearest"

                }
            );

        }


        return true;

    };


HD12.navigation.back =
    function() {

        if (
            this.history.length <
            2
        ) {

            return false;

        }


        this.history.pop();


        const previous =
            this.history[
                this.history.length - 1
            ];


        if (
            previous
        ) {

            this.current =
                previous.target;


            HD12.interactions.emit(
                "navigation:back",
                previous
            );


            return true;

        }


        return false;

    };

        if (

HD12.calculator.calculate =
    function(
        expression
    ) {

        const input =
            String(
                expression ?? ""
            )
                .trim();


        if (
            !input
        ) {

            return "";

        }


        /*
         * Only mathematical characters are accepted.
         * No arbitrary JavaScript execution.
         */

        if (
            !/^[0-9+\-*/().%\s]+$/.test(
                input
            )
        ) {

            throw new Error(
                "Ungültiger mathematischer Ausdruck."
            );

        }


        try {

            const normalized =
                input.replace(
                    /%/g,
                    "/100"
                );


            const result =
                Function(
                    `"use strict"; return (${normalized})`
                )();


            if (
                typeof result !==
                    "number" ||
                !Number.isFinite(
                    result
                )
            ) {

                throw new Error(
                    "Ungültiges Ergebnis."
                );

            }


            HD12.interactions.emit(
                "calculator:result",
                {

                    expression:
                        input,

                    result

                }
            );


            return result;

        }

        catch(error) {

            HD12.interactions.emit(
                "calculator:error",
                {

                    expression:
                        input,

                    error

                }
            );


            throw error;

        }

    };

    function(
        key,
        fallback = null
    ) {

        const parts =
            String(
                key || ""
            ).split(
                "."
            );


        let value =
            this.values;


        for (
            const part of
            parts
        ) {

            if (
                value ===
                null ||
                value ===
                undefined
            ) {

                return fallback;

            }


            value =
                value[
                    part
                ];

        }


        return value ===
            undefined
                ? fallback
                : value;

    };

        let target =
            this.values;


        for (
            let i = 0;
            i <
            parts.length - 1;
            i++
        ) {

            if (
                typeof target[
                    parts[i]
                ] !==
                "object"
            ) {

                target[
                    parts[i]
                ] =
                    {};

            }


            target =
                target[
                    parts[i]
                ];

        }


        target[
            parts[
                parts.length - 1
            ]
        ] =
            value;


        try {

            localStorage.setItem(
                "haldo-os22-settings",
                JSON.stringify(
                    this.values

                return this.open(

                );


            case "back":

            case "close":

                return this.close(

                if (

                        "nav:"

    HD.appState.ensure =
        function (

            const state =

            if (
                !state.initialized
            ) {

                state.initialized =
                    true;

                state.appId =
                    appId;

                state.createdAt =
                    Date.now();

                state.updatedAt =
                    Date.now();


                HD.appState.save(
                    appId,
                    state
                );

            }


            return state;

        };


    HD.appState.patch =
        function (
            appId,
            changes
        ) {

            const state =
                this.ensure(
                    appId
                );


            Object.assign(
                state,
                changes || {}
            );


            state.updatedAt =
                Date.now();


            this.save(
                appId,
                state
            );


            HD.emit(
                "app:state-changed",
                {
                    appId,
                    state
                }
            );


            return state;

        };

                    <button data-key=".">.</button>
                    <button data-key="=">=</button>
                    <button data-key="+">+</button>

                    <button data-key="clear">
                        C
                    </button>

                </div>
                `;


            const input =
                screen.querySelector(
                    ".calculator-input"
                );


            screen
                .querySelectorAll(
                    "[data-key]"
                )
                .forEach(
                    button => {

                        button.onclick =
                            function () {

                                const key =
                                    this.dataset
                                        .key;


                                if (
                                    key ===
                                    "clear"
                                ) {

                                    input.value =
                                        "";

                                    return;

                                }


                                if (
                                    key ===
                                    "="
                                ) {

                                    try {

                                        /*
                                         * Nur einfache
                                         * mathematische
                                         * Ausdrücke.
                                         */

                                        if (
                                            !/^[0-9+\-*/().\s]+$/
                                                .test(
                                                    input.value
                                                )
                                        ) {

                                            throw new Error(
                                                "Ungültiger Ausdruck"
                                            );

                                        }


                                        input.value =
                                            String(
                                                Function(
                                                    "return (" +
                                                    input.value +
                                                    ")"
                                                )()
                                            );

                                    }

                                    catch (
                                        error
                                    ) {

                                        input.value =
                                            "Fehler";

                                    }

                                    return;

                                }


                                input.value +=
                                    key;

                            };

                    }
                );


            container.appendChild(
                screen
            );


            return screen;

        }
    );

    HD.ai =

    HD.ai.send =
        HD.ai.send ||
        function (
            message
        ) {

            const text =
                String(
                    message || ""
                ).trim();


            if (!text) {

                return "";

            }


            const entry = {

                id:
                    Date.now(),

                role:
                    "user",

                content:
                    text,

                timestamp:
                    Date.now()

            };


            this.conversation.push(
                entry
            );


            HD.storage.set(
                "ai-conversation",
                this.conversation
            );


            HD.emit(
                "ai:message",
                entry
            );


            return text;

        };


    HD.ai.restore =
        function () {

            const stored =
                HD.storage.get(
                    "ai-conversation",
                    []
                );


            if (
                Array.isArray(
                    stored
                )
            ) {

                this.conversation =
                    stored;

            }


            return this.conversation;

        };

            const text =
                String(

                ).toLowerCase();


            if (
                text.includes("hallo") ||
                text.includes("hi") ||
                text.includes("hey")
            ) {

                return (
                    "Hallo ❤️ Ich bin HalDo AI. " +
                    "Ich bin hier und höre dir zu."
                );

            }


            if (
                text.includes("wer bist") ||
                text.includes("wer bist du")
            ) {

                return (
                    "Ich bin HalDo AI – der " +
                    "intelligente Assistent von " +
                    "HalDo AI OS 22."

            }


            if (
                text.includes("hilfe")
            ) {

                return (
                    "Natürlich. Sag mir einfach, " +
                    "was du machen möchtest."
                );

                    null
                ) {

                }

                return JSON.parse(
                    raw
                );

            }

            catch (error) {

                HD.errors?.report(
                    error,
                    "storageBridge.get"
                );

                return fallback;

            }

    /* =========================================================
       BACKUP ENGINE
       ========================================================= */

    HD.backup =
        HD.backup ||
        {};

    HD.backup.version =
        "22.0.0";

    HD.backup.create =
        function () {

            const snapshot = {

                product:
                    "HalDo AI OS",

                version:
                    HD.config?.version ||
                    "22.0.0",

                codename:
                    HD.config?.codename ||
                    "Cosmic World",

                createdAt:
                    Date.now(),

                appState:
                    {},

                appData:

                aiConversation:
                    Array.isArray(
                        HD.ai?.conversation

            };


            if (
                HD.appManifest &&
                Array.isArray(
                    HD.appManifest
                )
            ) {

                HD.appManifest.forEach(
                    manifest => {

                        if (!manifest?.id) {
                            return;
                        }

                        if (
                            HD.appState &&
                            typeof HD.appState.get ===
                            "function"
                        ) {

                            snapshot.appState[
                                manifest.id
                            ] =
                                HD.appState.get(
                                    manifest.id
                                );

                        }

                        if (
                            HD.appData?.collections
                        ) {

                            snapshot.appData[
                                manifest.id
                            ] =
                                HD.appData.collections[
                                    manifest.id
                                ] || [];

                        }

                    }
                );

            }


            HD.storageBridge.set(
                "system-backup",
                snapshot
            );


            HD.emit(
                "backup:created",
                snapshot
            );


            return snapshot;

        };


    HD.backup.restore =
        function (
            snapshot = null
        ) {

            const source =
                snapshot ||
                HD.storageBridge.get(
                    "system-backup",
                    null
                );


            if (!source) {

                return false;

            }


            if (
                source.appData &&
                HD.appData
            ) {

                Object.keys(
                    source.appData
                ).forEach(
                    appId => {

                        HD.appData.collections[
                            appId
                        ] =
                            Array.isArray(
                                source.appData[
                                    appId
                                ]
                            )
                                ? source.appData[
                                    appId
                                ]
                                : [];

                    }
                );

            }


            if (
                source.appState &&
                HD.appState &&
                typeof HD.appState.save ===
                "function"
            ) {

                Object.keys(
                    source.appState
                ).forEach(
                    appId => {

                        HD.appState.save(
                            appId,
                            source.appState[
                                appId
                            ]
                        );

                    }
                );

            }


            if (
                Array.isArray(
                    source.aiConversation
                ) &&
                HD.ai
            ) {

                HD.ai.conversation =
                    source.aiConversation;

                HD.storageBridge.set(
                    "ai-conversation",
                    HD.ai.conversation
                );

            }


            HD.emit(
                "backup:restored",
                source
            );


            return true;

        };


    /* =========================================================
       MIGRATION ENGINE
       ========================================================= */

    HD.migration =
        HD.migration ||
        {};

    HD.migration.currentVersion =
        "22.0.0";

    HD.migration.history =
        HD.migration.history ||
        [];


    HD.migration.detect =
        function () {

            const stored =
                HD.storageBridge.get(
                    "system-version",
                    null
                );

            return {

                stored:
                    stored,

                current:
                    this.currentVersion,

                required:
                    stored !==
                    this.currentVersion

            };

        };


    HD.migration.run =
        function () {

            const detection =
                this.detect();


            if (
                !detection.required
            ) {

                return {

                    migrated:
                        false,

                    version:
                        this.currentVersion

                };

            }


            const migration = {

                from:
                    detection.stored,

                to:
                    this.currentVersion,

                time:
                    Date.now()

            };


            this.history.push(
                migration
            );


            HD.storageBridge.set(
                "migration-history",
                this.history
            );


            HD.storageBridge.set(
                "system-version",
                this.currentVersion
            );


            HD.emit(
                "migration:completed",
                migration
            );


            return {

                migrated:
                    true,

                migration

            };

        };


    HD.integration.register(
        "backup",
        HD.backup
    );

    HD.integration.register(
        "migration",
        HD.migration
    );

       ROLLBACK ENGINE

            );


            HD.emit(
                "rollback:checkpoint-created",
                checkpoint
            );


            return checkpoint;

        };


    HD.rollback.restoreCheckpoint =
        function () {

            const checkpoint =
                HD.storageBridge.get(
                    "rollback-checkpoint",
                    null
                );


            if (!checkpoint) {

            }


            const restored =
                HD.backup.restore(

                );


            if (restored) {

                HD.emit(
                    "rollback:restored",
                    checkpoint
                );

            }


            return restored;

        };


    HD.integration.register(
        "rollback",
        HD.rollback
    );


    /* =========================================================
       UPDATE ENGINE
       ========================================================= */

    HD.update =
        HD.update ||
        {};

    HD.update.currentVersion =

        "22.0.0";

    HD.update.check =

            const result = {

                version:
                    this.currentVersion,

                    this.state,

                online:
                    navigator.onLine,

                checkedAt:
                    Date.now()

            HD.emit(
                "update:checked",
                result
            );


            return result;

        };


    HD.update.prepare =
        function () {

            this.state =
                "preparing";


            HD.rollback.createCheckpoint();

                "update:preparing"

                    version:

        };

        "update",
        HD.update

    /* =========================================================
       PWA FOUNDATION

    HD.pwa =

    );

                !this.installPrompt
            ) {

            }


            try {

                await this.installPrompt.prompt();

                    await this.installPrompt.userChoice;

                this.installPrompt =
                    null;

                HD.emit(
                    "pwa:install-result",

                );

                return (
                    result?.outcome ===
                    "accepted"

            }

            catch (error) {

                HD.errors?.report(
                    error,
                    "pwa.install"
                );

                return false;

            }

        };

        "pwa",
        HD.pwa
    );

            const text =
                String(
                    message || ""
                ).trim();


            if (!text) {

                return null;

            }


            const request = {

                id:
                    "ai-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2),

                message:
                    text,

                context:
                    context || {},

                createdAt:
                    Date.now()

            this.history.push(
                request
            );


            HD.emit(
                "ai:request",
                request
            );


            let response = "";

                    HD.ai &&
                    typeof HD.ai.respond ===
                    "function"
                ) {

                    response =
                        await HD.ai.respond(
                            text,
                            context
                        );

            catch (error) {

                HD.errors?.report(
                    error,
                    "aiBridge.send"
                );

                response =
                    "Es ist ein interner AI-Fehler aufgetreten.";

            }

                response:

            if (

                return false;

            }


            try {

                window.speechSynthesis.cancel();


                const utterance =
                    new SpeechSynthesisUtterance(
                        String(
                            text || ""
                        )
                    );


                utterance.lang =
                    HD.config?.language ===
                    "de"
                        ? "de-DE"
                        : "en-US";


                window.speechSynthesis.speak(
                    utterance
                );


                HD.emit(
                    "voice:speak",
                    {
                        text:
                            String(
                                text || ""
                            )
                    }
                );


                return true;

            }

            catch (error) {

                    error,
                    "voiceBridge.speak"

                return false;

            }

        HD.voiceBridge
    );

    HD.notificationBridge =
        HD.notificationBridge ||
        {};


    HD.notificationBridge.send =
        function (
            message,
            options = {}
        ) {

            const text =
                String(
                    message || ""
                ).trim();


            if (!text) {

                return false;

            }


            if (
                typeof HD.notify ===
                "function"
            ) {

                HD.notify(
                    text
                );

            }


            if (
                options.system &&
                "Notification" in window
            ) {

                    if (
                        Notification.permission ===
                        "granted"

                            "HalDo AI OS",
                            {
                                body:
                                    text
                            }
                        );

                    }

                }

                catch (error) {

                    HD.errors?.report(
                        error,
                        "notification.system"
                    );

                }

            }


            HD.emit(
                "notification:sent",

                    message:
                        text,

                }
            );


            return true;

        };


    HD.integration.register(
        "notifications",
        HD.notificationBridge
    );


    /* =========================================================
       APP DISCOVERY API
       ========================================================= */

    HD.discovery =
        HD.discovery ||
        {};


    HD.discovery.apps =
        function (
            query = ""
        ) {

            if (
                HD.appRegistry &&
                typeof HD.appRegistry.search ===
                "function"
            ) {

                return HD.appRegistry.search(
                    query
                );

            }


            if (
                HD.apps &&
                typeof HD.apps.search ===
                "function"
            ) {

                return HD.apps.search(
                    query
                );

            }


            if (
                HD.appRegistry &&
                typeof HD.appRegistry.all ===
                "function"
            ) {

                const apps =
                    HD.appRegistry.all();


                const value =
                    String(
                        query || ""
                    )
                        .trim()
                        .toLowerCase();


                if (!value) {

                    return apps;

                }


                return apps.filter(
                    app =>
                        String(
                            app.name || ""
                        )
                            .toLowerCase()
                            .includes(
                                value
                            ) ||
                        String(
                            app.id || ""
                        )
                            .toLowerCase()
                            .includes(
                                value
                            )
                );

            }


            return [];

        };


    HD.discovery.open =
        function (
            query
        ) {

            const results =
                this.apps(
                    query
                );


            if (
                results.length !==
                1
            ) {

                return null;

            }


            return HD.appRuntime?.open(
                results[0].id
            ) || null;

        };

        "discovery",
        HD.discovery
    );


    /* =========================================================
       GLOBAL SYSTEM COMMAND API
       ========================================================= */

    HD.command =
        HD.command ||
        {};

        async function (

        ) {

            const name =
                String(
                    command || ""
                )
                    .trim()
                    .toLowerCase();


            switch (name) {

                case "open-app":

                    return HD.appRuntime?.open(
                        payload.appId,
                        payload.options || {}
                    );


                case "close-app":

                    return HD.appRuntime?.close(
                        payload.appId
                    );


                case "toggle-app":

                    return HD.appRuntime?.toggle(
                        payload.appId,
                        payload.options || {}
                    );


                case "backup":

                    return HD.backup?.create();

                    return HD.backup?.restore();


                case "rollback":

                    return HD.rollback?.restoreCheckpoint();


                case "update-check":

                    return HD.update?.check();


                case "system-status":

                    return HD.systemBridge?.status();


                case "ai":

                    return HD.aiBridge?.send(
                        payload.message,
                        payload.context || {}
                    );


                default:

                    HD.emit(
                        "command:unknown",
                        {
                            command:
                                name,

                            payload
                        }
                    );

                    return null;

            }

        "commands",
        HD.command
    );


    /* =========================================================
       GLOBAL ALIASES
       ========================================================= */

    window.HalDoSystemBridge =
        HD.systemBridge;

    window.HalDoStorageBridge =
        HD.storageBridge;

    window.HalDoBackup =
        HD.backup;

    window.HalDoMigration =
        HD.migration;

    window.HalDoRollback =
        HD.rollback;

    window.HalDoUpdate =
        HD.update;

    window.HalDoPWA =
        HD.pwa;

    window.HalDoAIBridge =
        HD.aiBridge;

    window.HalDoVoiceBridge =
        HD.voiceBridge;

    window.HalDoNotifications =

       ========================================================= */

    try {

        HD.migration.run();

    }

    catch (error) {

        HD.errors?.report(
            error,
            "migration.start"
        );

    }

       ========================================================= */

    try {

    }

    catch (error) {

        );

    }

       ========================================================= */

    HD.integration.initialized =
        true;

    HD.integration.startedAt =
        Date.now();


    HD.emit(
        "integration:ready",
        {
            components:
                HD.integration.list(),

            version:
                HD.config?.version ||
                "22.0.0"
        }
    );


    /* =========================================================
       RUNTIME REGISTRATION

    if (

    /* =========================================================

    HD.emit(

            storage:
                true,

            backup:
                true,

            migration:
                true,

            rollback:
                true,

            update:
                true,

            pwa:
                true,

            ai:
                true,

            voice:
                true,

            notifications:
                true,

            discovery:
                true,

            commands:
                true

        }

            ) {

                return HD.appRuntime.close(
                    appId
                );

            }


            if (
                HD.apps &&
                typeof HD.apps.close ===
                "function"
            ) {

                return HD.apps.close(
                    appId
                );

            }


            return false;

        };


    /* =========================================================
       GLOBAL APP TOGGLE API
       ========================================================= */

    HD.toggleApp =
        async function (
            appId,
            options = {}
        ) {

            if (
                HD.desktop &&
                typeof HD.desktop.toggleApp ===
                "function"
            ) {

                return HD.desktop.toggleApp(
                    appId,
                    options
                );

            }


            if (
                HD.appRuntime &&
                typeof HD.appRuntime.toggle ===
                "function"
            ) {

                return HD.appRuntime.toggle(
                    appId,
                    options
                );

            }


            return null;

        };


    /* =========================================================
       GLOBAL NOTIFICATION API
       ========================================================= */

    HD.notify =
        HD.notify ||
        function (
            message,
            options = {}
        ) {

            const layer =
                document.getElementById(
                    "haldo-notifications"
                );


            if (!layer) {

                return null;

            }


            const notification =
                document.createElement(
                    "div"
                );


            notification.className =
                "haldo-notification";


            const dot =
                document.createElement(
                    "span"
                );


            dot.className =
                "status-dot online";


            const text =
                document.createElement(
                    "span"
                );


            text.textContent =
                String(
                    message || ""
                );


            notification.appendChild(
                dot
            );


            notification.appendChild(
                text
            );


            layer.appendChild(
                notification
            );


            const duration =
                Number(
                    options.duration
                ) || 2600;


            setTimeout(
                function () {

                    notification
                        .classList
                        .add(
                            "closing"
                        );


                    setTimeout(
                        function () {

                            notification.remove();

                        },
                        300
                    );

                },
                duration
            );


            return notification;

        };


    /* =========================================================
       FINAL APP DISCOVERY
       ========================================================= */

    HD.appsReady =
        function () {

            if (
                !HD.appRegistry ||
                typeof HD.appRegistry.all !==
                "function"
            ) {

                return [];

            }


            return HD.appRegistry.all();

        };


    /* =========================================================
       FINAL SERVICE DISCOVERY
       ========================================================= */

    HD.servicesReady =
        function () {

            if (
                !HD.services?.running
            ) {

                return [];

            }


            return Array.from(
                HD.services.running.keys()
            );

        };


    /* =========================================================
       FINAL BOOT SEQUENCE
       ========================================================= */

    HD.finalSystem.boot =
        async function () {

            if (
                this.initialized
            ) {

                return this.status();

            }


            this.startedAt =
                Date.now();


            this.emit(
                "system:boot-start"
            );


            /*
             * Runtime
             */

            if (
                HD.runtime &&
                !HD.runtime.initialized &&
                typeof HD.runtime.start ===
                "function"
            ) {

                try {

                    await HD.runtime.start();

                }

                catch (error) {

                    if (
                        HD.errors &&
                        typeof HD.errors.report ===
                        "function"
                    ) {

                        HD.errors.report(
                            error,
                            "final-runtime-start"
                        );

                    }

                }

            }


            /*
             * Core services
             */

            if (
                HD.services &&
                typeof HD.services.start ===
                "function"
            ) {

                const services = [
                    "app-runtime",
                    "storage",
                    "ai"
                ];


                for (
                    const service of services
                ) {

                    try {

                        await HD.services.start(
                            service
                        );

                    }

                    catch (error) {

                        if (
                            HD.errors &&
                            typeof HD.errors.report ===
                            "function"
                        ) {

                            HD.errors.report(
                                error,
                                "final-service:" +
                                service
                            );

                        }

                    }

                }

            }


            /*
             * Desktop
             */

            if (
                HD.desktop
            ) {

                HD.desktop.state =
                    HD.desktop.state ||
                    {};

                HD.desktop.state.initialized =
                    true;

            }


            /*
             * System integration
             */

            if (
                HD.systemIntegration
            ) {

                HD.systemIntegration.initialized =
                    true;

            }


            /*
             * Validation
             */

            const validation =
                this.validate();


            this.initialized =
                true;


            this.emit(
                "system:boot-complete",
                {
                    validation
                }
            );


            if (
                validation.valid
            ) {

                this.setReady(
                    true
                );

            }

            else {

                this.setReady(
                    false
                );

            }


            return this.status();

        };


    /* =========================================================
       DOM READY BOOT
       ========================================================= */

    function startFinalSystem() {

        HD.finalSystem.boot()
            .catch(
                function (error) {

                    if (
                        HD.errors &&
                        typeof HD.errors.report ===
                        "function"
                    ) {

                        HD.errors.report(
                            error,
                            "final-system-boot"
                        );

                    }

                }
            );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            startFinalSystem,
            {
                once:
                    true
            }
        );

    }

    else {

        startFinalSystem();

    }


    /* =========================================================
       GLOBAL EVENT CONNECTIONS
       ========================================================= */

    if (
        typeof HD.on ===
        "function"
    ) {

        HD.on(
            "app:opened",
            function (
                instance
            ) {

                if (
                    instance &&
                    instance.appId &&
                    HD.desktop
                ) {

                    HD.desktop.setActiveApp(
                        instance.appId
                    );

                }

            }
        );


        HD.on(
            "app:closed",
            function (
                instance
            ) {

                if (
                    !instance ||
                    !instance.appId ||
                    !HD.desktop
                ) {

                    return;

                }


                if (
                    HD.desktop.state.activeApp ===
                    instance.appId
                ) {

                    HD.desktop.setActiveApp(
                        null
                    );

                }

            }
        );


        HD.on(
            "network:online",
            function () {

                HD.notify(
                    "HalDo AI OS ist wieder online."
                );

            }
        );


        HD.on(
            "network:offline",
            function () {

                HD.notify(
                    "HalDo AI OS ist offline."
                );

            }
        );


        HD.on(
            "system:ready",
            function () {

                HD.notify(
                    "HalDo AI OS 22 ist bereit."
                );

            }
        );

    }


    /* =========================================================
       GLOBAL COMPATIBILITY ALIASES
       ========================================================= */

    window.HalDoSystemInfo =
        HD.systemInfo;

    window.HalDoFinalSystem =
        HD.finalSystem;

    window.HalDoOpenApp =
        HD.openApp;

    window.HalDoCloseApp =
        HD.closeApp;

    window.HalDoToggleApp =
        HD.toggleApp;


    /* =========================================================
       FINAL GLOBAL API
       ========================================================= */

    window.HalDoOS =
        window.HalDoOS ||
        {};

    window.HalDoOS.openApp =
        HD.openApp;

    window.HalDoOS.closeApp =
        HD.closeApp;

    window.HalDoOS.toggleApp =
        HD.toggleApp;

    window.HalDoOS.systemInfo =
        HD.systemInfo;

    window.HalDoOS.finalSystem =
        HD.finalSystem;


    /* =========================================================
       FINAL READY EVENT
       ========================================================= */

    HD.emit(
        "ecosystem:part16-ready",
        {
            final:
                true,

            version:
                HD.finalSystem.version,

            status:
                "START · ONLINE"
        }
    );


    /* =========================================================
       FINAL ARCHITECTURE MARKER
       ========================================================= */

    HD.architecture =
        HD.architecture ||
        {};

    HD.architecture.parts =
        16;

    HD.architecture.complete =
        true;

    HD.architecture.version =
        HD.finalSystem.version;

    HD.architecture.codename =
        HD.config?.codename ||
        "Cosmic World";


    HD.emit(
        "architecture:complete",
        {
            parts:
                16,

            version:
                HD.architecture.version,

            codename:
                HD.architecture.codename
        }
    );


})();
</script>
