<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050711"
>

<meta
    name="description"
    content="HalDo AI OS 20.2 — Cosmic AI Operating System"
>

<link rel="manifest" href="manifest.json">

<title>HalDo AI OS 20.2</title>

<style>

/* ============================================================
   HALDO AI OS 20.2
   COMPLETE COSMIC SYSTEM FOUNDATION
   ============================================================ */

:root {
    --bg:#03050d;
    --panel:rgba(9,13,28,.84);
    --panel2:rgba(16,21,42,.72);
    --panel3:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.10);
    --line2:rgba(255,255,255,.06);
    --text:rgba(255,255,255,.95);
    --muted:rgba(255,255,255,.58);
    --accent:#9caaff;
    --accent2:#d7dcff;
    --good:#8de0ba;
    --danger:#ff8d9b;
    --shadow:rgba(0,0,0,.55);
}

*,
*::before,
*::after {
    box-sizing:border-box;
}

html,
body {
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body {
    overflow:hidden;
    color:var(--text);
    background:var(--bg);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select {
    font:inherit;
}

button {
    cursor:pointer;
}

.hidden {
    display:none !important;
}


/* ============================================================
   ROOT
   ============================================================ */

#haldo-root {
    position:fixed;
    inset:0;
    overflow:hidden;
}


/* ============================================================
   COSMIC DESKTOP
   ============================================================ */

#desktop {
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(112,132,255,.16),
            transparent 17%
        ),
        radial-gradient(
            circle at 14% 25%,
            rgba(120,140,255,.08),
            transparent 24%
        ),
        radial-gradient(
            circle at 85% 70%,
            rgba(180,110,255,.07),
            transparent 25%
        ),
        #03050d;
}


/* ============================================================
   STARS
   ============================================================ */

.cosmic-stars,
.cosmic-stars::before,
.cosmic-stars::after {
    position:absolute;
    inset:0;
    pointer-events:none;
}

.cosmic-stars {
    opacity:.85;
    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.85) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(180,205,255,.65) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.4) 1px,
            transparent 1.5px
        );
    background-size:
        130px 130px,
        190px 190px,
        270px 270px;
    background-position:
        0 0,
        45px 80px,
        120px 30px;
    animation:
        cosmicDrift 100s linear infinite;
}

@keyframes cosmicDrift {
    from {
        transform:translate3d(0,0,0);
    }
    to {
        transform:translate3d(-100px,70px,0);
    }
}


/* ============================================================
   PLANETS
   ============================================================ */

.planet {
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.planet-a {
    width:90px;
    height:90px;
    left:7%;
    top:25%;
    background:
        radial-gradient(
            circle at 32% 27%,
            rgba(255,255,255,.6),
            rgba(130,150,235,.45) 30%,
            rgba(35,48,105,.8) 72%,
            rgba(5,9,25,.95)
        );
    box-shadow:
        0 0 38px rgba(100,130,255,.18);
}

.planet-b {
    width:52px;
    height:52px;
    right:11%;
    top:26%;
    background:
        radial-gradient(
            circle at 32% 28%,
            rgba(255,230,190,.65),
            rgba(170,110,95,.46) 42%,
            rgba(45,20,35,.95)
        );
}

.planet-c {
    width:36px;
    height:36px;
    right:23%;
    bottom:17%;
    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(215,235,255,.7),
            rgba(80,125,190,.45) 52%,
            rgba(15,25,60,.95)
        );
}


/* ============================================================
   ORBITS
   ============================================================ */

.orbit {
    position:absolute;
    left:50%;
    top:48%;
    width:470px;
    height:470px;
    transform:translate(-50%,-50%);
    border:
        1px solid rgba(155,175,255,.10);
    border-radius:50%;
    pointer-events:none;
}

.orbit-inner {
    position:absolute;
    left:50%;
    top:50%;
    width:310px;
    height:310px;
    transform:translate(-50%,-50%);
    border:
        1px solid rgba(155,175,255,.07);
    border-radius:50%;
}


/* ============================================================
   HALDO AI CENTER
   ============================================================ */

#haldo-center {
    position:absolute;
    left:50%;
    top:48%;
    width:190px;
    height:190px;
    transform:translate(-50%,-50%);
    z-index:50;
    display:grid;
    place-items:center;
}

.haldo-glow {
    position:absolute;
    inset:-35px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,226,145,.32),
            rgba(130,150,255,.18) 45%,
            transparent 72%
        );
    filter:blur(8px);
    animation:
        breathe 5s ease-in-out infinite;
}

@keyframes breathe {
    0%,100% {
        transform:scale(1);
        opacity:.82;
    }
    50% {
        transform:scale(1.08);
        opacity:1;
    }
}

.haldo-sun {
    position:relative;
    width:165px;
    height:165px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.98),
            rgba(255,238,182,.94) 18%,
            rgba(255,205,100,.55) 38%,
            rgba(130,145,255,.16) 66%,
            transparent 76%
        );
    box-shadow:
        0 0 40px rgba(255,220,130,.42),
        0 0 95px rgba(125,145,255,.28);
}

#haldo-logo {
    width:105px;
    height:105px;
    object-fit:contain;
    border-radius:50%;
    filter:
        drop-shadow(
            0 0 18px
            rgba(255,255,255,.7)
        );
}

#haldo-logo-fallback {
    display:none;
    font-size:52px;
    font-weight:900;
}


/* ============================================================
   TOP SYSTEM BAR
   ============================================================ */

#topbar {
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:60px;
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:
        rgba(3,5,13,.56);
    backdrop-filter:blur(22px);
    border-bottom:1px solid var(--line);
}

.top-left,
.top-right {
    display:flex;
    align-items:center;
    gap:10px;
}

.brand {
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:800;
}

.brand-mark {
    width:31px;
    height:31px;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
}

.system-pill {
    padding:7px 11px;
    border-radius:11px;
    color:var(--muted);
    font-size:11px;
    background:rgba(255,255,255,.045);
}

.top-button {
    width:35px;
    height:35px;
    border:1px solid var(--line2);
    border-radius:10px;
    color:white;
    background:rgba(255,255,255,.055);
}


/* ============================================================
   MENU PANEL
   ============================================================ */

#side-menu {
    position:absolute;
    top:70px;
    left:14px;
    bottom:92px;
    width:285px;
    z-index:4500;
    display:none;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:22px;
    background:
        rgba(7,10,23,.94);
    backdrop-filter:blur(30px);
    box-shadow:0 30px 90px var(--shadow);
}

#side-menu.open {
    display:flex;
}

.menu-head {
    padding:17px;
    border-bottom:1px solid var(--line2);
}

.menu-title {
    font-weight:800;
}

.menu-subtitle {
    margin-top:4px;
    font-size:11px;
    color:var(--muted);
}

.menu-search {
    margin-top:12px;
    width:100%;
    height:40px;
    border:1px solid var(--line2);
    outline:none;
    border-radius:12px;
    padding:0 12px;
    color:white;
    background:rgba(255,255,255,.05);
}

#menu-list {
    flex:1;
    overflow:auto;
    padding:9px;
}

.menu-item {
    width:100%;
    min-height:46px;
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:4px;
    padding:8px 10px;
    border:0;
    border-radius:12px;
    text-align:left;
    color:white;
    background:transparent;
}

.menu-item:hover {
    background:rgba(255,255,255,.07);
}

.menu-item-icon {
    width:30px;
    text-align:center;
    font-size:19px;
}

.menu-item-name {
    flex:1;
    font-size:13px;
}

.menu-item-category {
    font-size:9px;
    color:var(--muted);
}


/* ============================================================
   WINDOWS
   ============================================================ */

#windows {
    position:absolute;
    inset:60px 0 88px;
    z-index:1000;
    pointer-events:none;
}

.window {
    position:absolute;
    left:50%;
    top:50%;
    width:min(900px,90vw);
    height:min(680px,78vh);
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:23px;
    background:
        rgba(8,12,26,.94);
    backdrop-filter:blur(28px);
    box-shadow:
        0 40px 110px var(--shadow);
    pointer-events:auto;
}

.window-header {
    flex:0 0 54px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px 0 17px;
    background:rgba(255,255,255,.045);
    border-bottom:1px solid var(--line2);
}

.window-title {
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:750;
}

.window-controls {
    display:flex;
    gap:6px;
}

.window-control {
    width:32px;
    height:32px;
    border:0;
    border-radius:9px;
    color:white;
    background:rgba(255,255,255,.06);
}

.window-control:hover {
    background:rgba(255,255,255,.13);
}

.window-body {
    flex:1;
    overflow:auto;
    padding:20px;
}


/* ============================================================
   APP UI
   ============================================================ */

.app-hero {
    padding:22px;
    margin-bottom:13px;
    border:1px solid var(--line2);
    border-radius:19px;
    background:rgba(255,255,255,.035);
}

.app-icon-large {
    font-size:38px;
}

.app-title {
    margin-top:8px;
    font-size:25px;
    font-weight:850;
}

.app-description {
    margin-top:5px;
    color:var(--muted);
    line-height:1.5;
}

.app-grid {
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(190px,1fr));
    gap:10px;
}

.app-section {
    padding:17px;
    border:1px solid var(--line2);
    border-radius:17px;
    background:rgba(255,255,255,.035);
}

.app-section h3 {
    margin:0 0 7px;
}

.muted {
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
}

.status-good {
    color:var(--good);
}

.action-button {
    min-height:42px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:0 14px;
    color:white;
    background:rgba(130,145,255,.16);
}

.action-button:hover {
    background:rgba(130,145,255,.28);
}

.danger-button {
    background:rgba(255,100,120,.13);
}


/* ============================================================
   LAUNCHER
   ============================================================ */

#launcher {
    position:absolute;
    left:50%;
    top:72px;
    width:min(1080px,94vw);
    height:min(78vh,730px);
    transform:translateX(-50%);
    z-index:6000;
    display:none;
    flex-direction:column;
    padding:20px;
    border:1px solid var(--line);
    border-radius:26px;
    background:
        rgba(7,10,23,.96);
    backdrop-filter:blur(35px);
    box-shadow:0 40px 120px var(--shadow);
}

#launcher.open {
    display:flex;
}

.launcher-head {
    display:flex;
    gap:9px;
    margin-bottom:15px;
}

#launcher-search {
    flex:1;
    height:47px;
    border:1px solid var(--line2);
    border-radius:13px;
    outline:none;
    padding:0 14px;
    color:white;
    background:rgba(255,255,255,.05);
}

.launcher-close {
    width:47px;
    border:0;
    border-radius:13px;
    color:white;
    background:rgba(255,255,255,.07);
}

#launcher-grid {
    flex:1;
    overflow:auto;
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(155px,1fr));
    gap:10px;
}

.launcher-card {
    min-height:125px;
    padding:15px;
    border:1px solid var(--line2);
    border-radius:17px;
    color:white;
    text-align:left;
    background:rgba(255,255,255,.035);
}

.launcher-card:hover {
    background:rgba(255,255,255,.08);
    transform:translateY(-2px);
}

.launcher-icon {
    font-size:29px;
    margin-bottom:10px;
}

.launcher-name {
    font-weight:700;
}

.launcher-category {
    margin-top:5px;
    font-size:10px;
    color:var(--muted);
}


/* ============================================================
   DOCK
   ============================================================ */

#dock {
    position:absolute;
    left:50%;
    bottom:17px;
    transform:translateX(-50%);
    z-index:5500;
    display:flex;
    gap:8px;
    padding:9px;
    border:1px solid var(--line);
    border-radius:23px;
    background:
        rgba(7,10,23,.78);
    backdrop-filter:blur(25px);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.dock-button {
    width:49px;
    height:49px;
    border:0;
    border-radius:15px;
    color:white;
    font-size:20px;
    background:rgba(255,255,255,.055);
}

.dock-button:hover {
    transform:translateY(-3px);
    background:rgba(255,255,255,.12);
}


/* ============================================================
   TOAST
   ============================================================ */

#toast {
    position:absolute;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);
    z-index:9000;
    max-width:90vw;
    padding:11px 17px;
    border:1px solid var(--line);
    border-radius:13px;
    color:white;
    background:rgba(8,11,24,.95);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
}

#toast.visible {
    opacity:1;
}


/* ============================================================
   BOOT
   ============================================================ */

#boot {
    position:absolute;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#03050d;
    transition:
        opacity .65s,
        visibility .65s;
}

#boot.finished {
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.boot-content {
    width:min(90vw,520px);
    text-align:center;
}

.boot-logo {
    width:108px;
    height:108px;
    margin:0 auto 22px;
    display:grid;
    place-items:center;
    border-radius:32px;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.96),
            rgba(130,145,255,.4),
            transparent 72%
        );
    box-shadow:
        0 0 65px rgba(130,145,255,.35);
}

.boot-logo img {
    width:72px;
    height:72px;
    object-fit:contain;
}

.boot-fallback {
    font-size:47px;
    font-weight:900;
}

.boot-title {
    margin:0;
    font-size:33px;
}

.boot-subtitle {
    margin:8px 0 27px;
    color:var(--muted);
}

#boot-message {
    min-height:22px;
}

.boot-track {
    height:4px;
    margin-top:14px;
    overflow:hidden;
    border-radius:99px;
    background:rgba(255,255,255,.08);
}

#boot-progress {
    width:0;
    height:100%;
    background:
        linear-gradient(
            90deg,
            #7585ff,
            #fff,
            #7585ff
        );
    transition:width .25s;
}

#boot-detail {
    margin-top:9px;
    font-size:10px;
    color:var(--muted);
}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width:700px) {

    #side-menu {
        width:calc(100vw - 28px);
    }

    #haldo-center {
        top:47%;
    }

    .orbit {
        width:325px;
        height:325px;
    }

    .orbit-inner {
        width:220px;
        height:220px;
    }

    .haldo-sun {
        width:138px;
        height:138px;
    }

    #haldo-logo {
        width:88px;
        height:88px;
    }

    .planet-a {
        width:60px;
        height:60px;
    }

    .window {
        width:94vw;
        height:80vh;
    }

    #launcher {
        top:66px;
        height:82vh;
    }
}

</style>
</head>


<body>

<div id="haldo-root">


<!-- ==========================================================
     BOOT
     ========================================================== -->

<section id="boot">

    <div class="boot-content">

        <div class="boot-logo">

            <img
                src="assets/logo/logo.png"
                alt="HalDo"
                onerror="
                    this.style.display='none';
                    document
                        .getElementById('boot-fallback')
                        .style.display='block';
                "
            >

            <span
                id="boot-fallback"
                class="boot-fallback"
                style="display:none"
            >
                H
            </span>

        </div>

        <h1 class="boot-title">
            HalDo AI OS 20
        </h1>

        <p class="boot-subtitle">
            Professional Cosmic AI Operating System
        </p>

        <div id="boot-message">
            HalDo AI OS wird vorbereitet …
        </div>

        <div class="boot-track">
            <div id="boot-progress"></div>
        </div>

        <div id="boot-detail">
            Foundation · 0%
        </div>

    </div>

</section>


<!-- ==========================================================
     DESKTOP
     ========================================================== -->

<main id="desktop">


    <div class="cosmic-stars"></div>

    <div class="planet planet-a"></div>
    <div class="planet planet-b"></div>
    <div class="planet planet-c"></div>

    <div class="orbit">
        <div class="orbit-inner"></div>
    </div>


    <!-- ======================================================
         TOPBAR
         ====================================================== -->

    <header id="topbar">

        <div class="top-left">

            <button
                id="menu-button"
                class="top-button"
                title="HalDo Menü"
            >
                ☰
            </button>

            <div class="brand">

                <div class="brand-mark">
                    H
                </div>

                <span>
                    HalDo AI OS 20
                </span>

            </div>

        </div>


        <div class="top-right">

            <div
                id="system-status"
                class="system-pill"
            >
                System bereit
            </div>

            <button
                id="search-button"
                class="top-button"
                title="Universelle Suche"
            >
                ⌕
            </button>

            <button
                id="settings-button"
                class="top-button"
                title="Einstellungen"
            >
                ⚙
            </button>

        </div>

    </header>


    <!-- ======================================================
         HALDO AI CENTER
         ====================================================== -->

    <section id="haldo-center">

        <div class="haldo-glow"></div>

        <div class="haldo-sun">

            <img
                id="haldo-logo"
                src="assets/logo/logo.png"
                alt="HalDo AI"
                onerror="
                    this.style.display='none';
                    document
                        .getElementById('haldo-logo-fallback')
                        .style.display='block';
                "
            >

            <span
                id="haldo-logo-fallback"
                style="
                    display:none;
                    font-size:52px;
                    font-weight:900;
                "
            >
                H
            </span>

        </div>

    </section>


    <!-- ======================================================
         SIDE MENU
         ====================================================== -->

    <aside id="side-menu">

        <div class="menu-head">

            <div class="menu-title">
                HalDo AI OS
            </div>

            <div class="menu-subtitle">
                Alle Apps & Systembereiche
            </div>

            <input
                id="menu-search"
                class="menu-search"
                type="search"
                placeholder="Apps suchen …"
                autocomplete="off"
            >

        </div>

        <div id="menu-list"></div>

    </aside>


    <!-- ======================================================
         WINDOWS
         ====================================================== -->

    <section id="windows"></section>


    <!-- ======================================================
         LAUNCHER
         ====================================================== -->

    <section id="launcher">

        <div class="launcher-head">

            <input
                id="launcher-search"
                type="search"
                placeholder="HalDo Apps suchen …"
                autocomplete="off"
            >

            <button
                id="launcher-close"
                class="launcher-close"
            >
                ×
            </button>

        </div>

        <div id="launcher-grid"></div>

    </section>


    <!-- ======================================================
         DOCK
         ====================================================== -->

    <nav id="dock">

        <button
            class="dock-button"
            id="dock-menu"
            title="Menü"
        >
            ☰
        </button>

        <button
            class="dock-button"
            data-open-app="ai"
            title="HalDo AI"
        >
            ☀
        </button>

/* ============================================================
   REGISTRY API
   ============================================================ */

HalDo.registry = {

    list() {
        return Array.from(
            HalDo.apps.values()
        );
    },

    get(id) {
        return HalDo.apps.get(id) || null;
    },

    register(app) {

        if (
            !app ||
            !app.id
        ) {
            return false;
        }

        HalDo.apps.set(
            app.id,
            {
                installed:true,
                enabled:true,
                state:"registered",
                ...app
            }
        );

        renderAllAppLists();

        return true;
    },

    remove(id) {

        return HalDo.apps.delete(id);

    }

};


/* ============================================================
   MODULE CONNECTIONS
   ============================================================ */

window.HalDoApps =
    window.HalDoApps || {};


HalDo.connectAppModule =
    function (
        id,
        module
    ) {

        const app =
            this.registry.get(id);

        if (!app) {
            return false;
        }

        app.module =
            module;

        app.state =
            "connected";

        window.HalDoApps[id] =
            module;

        return true;

    };


/* ============================================================
   WINDOW MANAGER
   ============================================================ */

HalDo.windowManager = {

    windows:new Map(),
    zIndex:100,

    close(id) {

        const win =
            this.windows.get(id);

        if (!win) {
            return;
        }

        win.remove();

        this.windows.delete(id);

    },

    closeAll() {

        this.windows.forEach(
            win => win.remove()
        );

        this.windows.clear();

    }

};

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

/* ============================================================

HalDo.openApp =

        const app =
            this.registry.get(id);

        if (!app) {

            showToast(

            );

            return null;
        }


        /*
         * Wenn ein echtes Modul angeschlossen ist,
         * bekommt dieses Vorrang.
         */

            app.module &&
            typeof app.module.open ===
            "function"
        ) {

            return app.module.open();

        }


        /*
         * Bereits geöffnet?
         */

        const existing =
            this.windowManager.windows.get(id);

        if (existing) {

            existing.style.zIndex =
                ++this.windowManager.zIndex;

            existing.style.display =
                "flex";

            document.createElement("article");

            id;

        win.style.zIndex =
            ++this.windowManager.zIndex;

                            ${escapeHTML(app.category)}

                            Installation:
                            <span class="status-good">
                                aktiv
                            </span>

                            <br>

                            </span>

                    <section class="app-section">

                            System-Verbindungen
                        </h3>

                        <div class="muted">

                            Kernel: vorbereitet<br>
                            Event Bus: aktiv<br>
                            App Registry: aktiv<br>
                            App Manager: aktiv<br>
                            App Router: aktiv<br>
                            Window Manager: aktiv<br>
                            Storage Bridge: vorbereitet<br>
                            AI Bridge: vorbereitet<br>
                            Language Service: vorbereitet

                        </div>

                    </section>

                </div>


                <section class="app-section">

                    <h3>
                        App Runtime
                    </h3>

                    <p class="muted">
                        Diese Oberfläche ist die gemeinsame
                        Runtime-Shell. Das endgültige innere
                        Funktionsmodul dieser App wird über
                        HalDo.connectAppModule() angeschlossen.

                    </button>

                        class="action-button"
                        data-refresh
                    >
                        App aktualisieren
                    </button>

            </div>
        `;


        document

/* ============================================================
   MENU RENDER
   ============================================================ */

function renderMenu(
    filter = ""
) {

    const list =
        document.getElementById(
            "menu-list"
        );

    list.innerHTML =
        "";


    const query =
        filter
            .trim()
            .toLowerCase();


    HalDo.registry
        .list()
        .filter(
            app => {

                if (!query) {
                    return true;
                }

                return (
                    app.name
                        .toLowerCase()
                        .includes(query)
                    ||
                    app.category
                        .toLowerCase()
                        .includes(query)
                    ||
                    app.id
                        .toLowerCase()
                        .includes(query)
                );

            }
        )
        .forEach(
            app => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "menu-item";

                button.innerHTML = `

                    <span class="menu-item-icon">
                        ${escapeHTML(app.icon)}
                    </span>

                    <span class="menu-item-name">
                        ${escapeHTML(app.name)}
                    </span>

                    <span class="menu-item-category">
                        ${escapeHTML(app.category)}
                    </span>

                `;

                button.addEventListener(
                    "click",
                    () => {

                        HalDo.openApp(
                            app.id
                        );

                        closeMenus();

                    }
                );

                list.appendChild(
                    button
                );

            }
        );

}


/* ============================================================
   LAUNCHER RENDER
   ============================================================ */

function renderLauncher(
    filter = ""
) {

    const grid =
        document.getElementById(

        "";


    const query =
        filter
            .trim()

                return (

                    app.category
                        .toLowerCase()
                        .includes(query)
                    ||
                    app.id
                        .toLowerCase()
                        .includes(query)
                );

            }
        )
        .forEach(
            app => {

                const card =
                    document.createElement(
                        "button"
                    );

                card.className =
                    "launcher-card";

                card.innerHTML = `

                    <div class="launcher-icon">
                        ${escapeHTML(app.icon)}
                    </div>

                    <div class="launcher-name">
                        ${escapeHTML(app.name)}
                    </div>

                    <div class="launcher-category">

                            );

            }
        );

}

/* ============================================================

   ============================================================ */

function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "visible"
    );

    clearTimeout(
        toast._timer
    );

    toast._timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "visible"
                );

            },
            2200
        );

}

   BOOT SYSTEM
   ============================================================ */

const bootSteps = [

    [
        10,
        "Foundation wird geladen …",
        "Foundation"
    ],

    [
        24,
        "Kernel-Verbindung wird geprüft …",
        "Kernel"
    ],

    [
        38,
        "App Registry wird aufgebaut …",
        "App Registry"
    ],

    [
        52,
        "App Manager und Router werden verbunden …",
        "Runtime"
    ],

    [
        66,
        "Window Manager wird aktiviert …",
        "Window Manager"
    ],

    [
        78,
        "Cosmic World wird geladen …",
        "Cosmic World"
    ],

    [
        88,
        "HalDo AI wird vorbereitet …",
        "HalDo AI"
    ],

    [
        96,
        "Sprache und Systemdienste werden vorbereitet …",
        "Services"
    ],

    [
        100,
        "HalDo AI OS ist bereit.",
        "Ready"
    ]

];


async function bootSystem() {

    const message =
        document.getElementById(
            "boot-message"
        );

    const progress =
        document.getElementById(
            "boot-progress"
        );

    const detail =
        document.getElementById(
            "boot-detail"
        );


    for (
        const step
        of bootSteps
    ) {

        progress.style.width =
            step[0] + "%";

        message.textContent =
            step[1];

        detail.textContent =
            step[2] +
            " · " +
            step[0] +
            "%";


        HalDo.emit(
            "boot:stage",
            {
                progress:step[0],
                message:step[1],
                stage:step[2]
            }
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    130
                )
        );

    }


    document
        .getElementById(
            "system-status"
        )
        .textContent =
            "HalDo AI OS · Bereit";


    document
        .getElementById(
            "desktop"
        )
        .style.display =
            "block";


    document
        .getElementById(
            "boot"
        )
        .classList.add(
            "finished"
        );


    renderAllAppLists();


    HalDo.emit(
        "system:ready",
        {
            version:
                HalDo.version
        }
    );


    showToast(
        "HalDo AI OS 20 ist bereit."
    );

}


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            document
                .getElementById(
                    "launcher"
                )
                .classList.remove(
                    "open"
                );

            closeMenus();

        }


        if (
            (
                event.metaKey ||
                event.ctrlKey
            )
            &&
            event.key.toLowerCase()
                === "k"
        ) {

            event.preventDefault();

            openLauncher();

        }

    }
);


/* ============================================================
   INITIALIZE
   ============================================================ */

renderAllAppLists();

bootSystem();


/* ============================================================
   SERVICE WORKER
   ============================================================ */

if (
    "serviceWorker"
    in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator
                .serviceWorker
                .register(
                    "service-worker.js"
                )
                .catch(
                    error => {

                        console.warn(
                            "[HalDo Service Worker]",
                            error
                        );

                    }
                );

        }
    );

}

window.HalDoOS =
