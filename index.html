<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS"
    >

    <meta
        name="description"
        content="HalDo AI OS – Cosmic AI Operating System"
    >

    <title>HalDo AI OS</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <!--
        ============================================================
        HALDO AI OS 20
        ZENTRALE STARTDATEI
        ============================================================

        Diese Datei ist bewusst die zentrale Shell.

        Sie enthält:
        - Cosmic Desktop
        - Navigation
        - Hauptmenü
        - App Registry
        - Runtime Bridge
        - PWA-Verbindung
        - Update-Verbindung
        - AI-Verbindung
        - Storage-Verbindung
        - vorhandene HalDo-Systemmodule

        Die eigentlichen Apps bleiben in ihren eigenen Dateien.
        Dadurch bleibt das System erweiterbar und sauber.
    -->

    <style>

        /* =========================================================
           RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 46%,
                    rgba(255, 205, 80, 0.16),
                    transparent 20%
                ),
                radial-gradient(
                    circle at 20% 20%,
                    rgba(70, 130, 255, 0.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 80% 75%,
                    rgba(150, 70, 255, 0.10),
                    transparent 28%
                ),
                linear-gradient(
                    145deg,
                    #030711 0%,
                    #061124 35%,
                    #07182e 65%,
                    #030711 100%
                );
            color: #ffffff;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        /* =========================================================
           ROOT
           ========================================================= */

        #haldo-root {
            position: fixed;
            inset: 0;
            overflow: hidden;
            isolation: isolate;
        }

        /* =========================================================
           COSMIC BACKGROUND
           ========================================================= */

        #cosmic-background {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .cosmic-glow {
            position: absolute;
            inset: -20%;
            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255, 220, 120, 0.06),
                    transparent 35%
                );
            filter: blur(30px);
            animation: cosmicBreathing 9s ease-in-out infinite;
        }

        @keyframes cosmicBreathing {
            0%,
            100% {
                opacity: .55;
                transform: scale(1);
            }

            50% {
                opacity: .9;
                transform: scale(1.04);
            }
        }

        /* =========================================================
           STARS
           ========================================================= */

        #stars-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            box-shadow:
                0 0 5px rgba(255,255,255,.9),
                0 0 12px rgba(255,255,255,.55);
            animation:
                starPulse var(--duration) ease-in-out infinite,
                starFloat var(--float-duration) ease-in-out infinite;
            opacity: var(--opacity);
        }

        .star.blue {
            background: #9fd5ff;
            box-shadow:
                0 0 6px #9fd5ff,
                0 0 15px rgba(80,160,255,.7);
        }

        .star.gold {
            background: #ffe7a0;
            box-shadow:
                0 0 6px #ffe7a0,
                0 0 16px rgba(255,200,80,.65);
        }

        .star.violet {
            background: #d9b6ff;
            box-shadow:
                0 0 6px #d9b6ff,
                0 0 16px rgba(150,90,255,.65);
        }

        .star.cyan {
            background: #aafaff;
            box-shadow:
                0 0 6px #aafaff,
                0 0 16px rgba(40,230,255,.65);
        }

        @keyframes starPulse {
            0%,
            100% {
                transform: scale(.8);
                opacity: .35;
            }

            50% {
                transform: scale(1.35);
                opacity: 1;
            }
        }

        @keyframes starFloat {
            0%,
            100% {
                margin-top: 0;
                margin-left: 0;
            }

            50% {
                margin-top: -4px;
                margin-left: 3px;
            }
        }

        /* =========================================================
           COSMIC SUN
           ========================================================= */

        #sun-system {
            position: absolute;
            left: 50%;
            top: 48%;
            width: min(46vw, 420px);
            height: min(46vw, 420px);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .sun-aura {
            position: absolute;
            inset: -34%;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    rgba(255,240,180,.55) 0%,
                    rgba(255,195,65,.24) 23%,
                    rgba(255,150,30,.08) 43%,
                    transparent 68%
                );
            filter: blur(20px);
            animation: sunAura 6s ease-in-out infinite;
        }

        @keyframes sunAura {
            0%,
            100% {
                transform: scale(.95);
                opacity: .68;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        .sun-rays {
            position: absolute;
            inset: -15%;
            border-radius: 50%;
            background:
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255,230,150,.0) 0deg,
                    rgba(255,230,150,.0) 7deg,
                    rgba(255,225,140,.18) 8deg,
                    rgba(255,230,150,.0) 12deg
                );
            filter: blur(4px);
            animation: sunRayRotate 28s linear infinite;
        }

        @keyframes sunRayRotate {
            to {
                transform: rotate(360deg);
            }
        }

        .sun-core {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 38%;
            height: 38%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fffbe5 0%,
                    #fff1a8 20%,
                    #ffd45e 42%,
                    #ff9c20 72%,
                    #ff6a00 100%
                );
            box-shadow:
                0 0 25px rgba(255,235,150,.95),
                0 0 70px rgba(255,180,45,.78),
                0 0 150px rgba(255,135,20,.45);
            animation: sunCore 5s ease-in-out infinite;
        }

        @keyframes sunCore {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(.97);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.04);
            }
        }

        /* =========================================================
           ORBITS
           ========================================================= */

        .orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255,220,145,.13);
            border-radius: 50%;
            transform-origin: center;
        }

        .orbit.one {
            width: 45%;
            height: 25%;
            transform: translate(-50%, -50%) rotate(-12deg);
        }

        .orbit.two {
            width: 65%;
            height: 38%;
            transform: translate(-50%, -50%) rotate(17deg);
        }

        .orbit.three {
            width: 86%;
            height: 52%;
            transform: translate(-50%, -50%) rotate(-24deg);
        }

        .orbit.four {
            width: 112%;
            height: 68%;
            transform: translate(-50%, -50%) rotate(28deg);
        }

        .orbit.five {
            width: 137%;
            height: 83%;
            transform: translate(-50%, -50%) rotate(-35deg);
        }

        /* =========================================================
           PLANETS
           ========================================================= */

        .planet {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            transform-origin: 0 0;
        }

        .planet-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: 0 0;
            animation: orbitSpin var(--speed) linear infinite;
        }

        .planet-orbit.reverse {
            animation-direction: reverse;
        }

        @keyframes orbitSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .planet-body {
            border-radius: 50%;
            width: var(--size);
            height: var(--size);
            transform:
                translate(
                    calc(var(--distance) * -1),
                    calc(var(--size) * -.5)
                );
            background: var(--planet-background);
            box-shadow:
                inset -8px -8px 16px rgba(0,0,0,.42),
                inset 5px 5px 10px rgba(255,255,255,.18),
                0 0 16px var(--planet-glow);
            position: relative;
        }

        .planet-body::after {
            content: "";
            position: absolute;
            inset: 20%;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 30% 30%,
                    rgba(255,255,255,.4),
                    transparent 35%
                );
            opacity: .7;
        }

        .planet-ring {
            position: absolute;
            width: 160%;
            height: 42%;
            left: -30%;
            top: 29%;
            border: 2px solid rgba(240,220,180,.45);
            border-radius: 50%;
            transform: rotate(-18deg);
        }

        /* =========================================================
           MAIN SHELL
           ========================================================= */

        #shell {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
        }

        /* =========================================================
           TOP BAR
           ========================================================= */

        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding:
                max(14px, env(safe-area-inset-top))
                18px
                12px
                18px;
            pointer-events: none;
        }

        .top-left,
        .top-right {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        /* =========================================================
           HALDO LOGO BUTTON
           ========================================================= */

        #haldo-logo-button {
            width: 54px;
            height: 54px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.16),
                    rgba(255,255,255,.05)
                );
            border: 1px solid rgba(255,255,255,.16);
            box-shadow:
                0 8px 30px rgba(0,0,0,.3),
                0 0 30px rgba(90,150,255,.12);
            backdrop-filter: blur(18px);
            color: white;
            transition: .25s ease;
        }

        #haldo-logo-button:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow:
                0 12px 35px rgba(0,0,0,.35),
                0 0 35px rgba(120,170,255,.24);
        }

        .haldo-mark {
            width: 32px;
            height: 32px;
            position: relative;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 40% 35%,
                    #fff9d0,
                    #ffd55a 26%,
                    #ff9c24 52%,
                    #ff5b18 100%
                );
            box-shadow:
                0 0 12px rgba(255,210,90,.9),
                0 0 26px rgba(255,150,30,.45);
        }

        .haldo-mark::before,
        .haldo-mark::after {
            content: "";
            position: absolute;
            inset: -5px;
            border: 1px solid rgba(255,230,160,.55);
            border-radius: 50%;
            transform: rotate(35deg);
        }

        .haldo-mark::after {
            transform: rotate(-35deg);
        }

        /* =========================================================
           TOP STATUS
           ========================================================= */

        .status-pill {
            min-height: 42px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 15px;
            background: rgba(5,15,30,.38);
            border: 1px solid rgba(255,255,255,.10);
            backdrop-filter: blur(18px);
            color: rgba(255,255,255,.82);
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #76ffba;
            box-shadow: 0 0 12px rgba(100,255,180,.8);
        }

        /* =========================================================
           HOME CONTENT
           ========================================================= */

        #home-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding:
                110px
                22px
                max(105px, env(safe-area-inset-bottom) + 85px);
            pointer-events: none;
        }

        .cosmic-caption {
            text-align: center;
            max-width: 620px;
            pointer-events: auto;
        }

        .cosmic-caption h1 {
            margin: 0;
            font-size: clamp(24px, 5vw, 44px);
            line-height: 1.05;
            font-weight: 650;
            letter-spacing: -.03em;
            text-shadow:
                0 2px 30px rgba(255,210,100,.20);
        }

        .cosmic-caption p {
            margin: 10px 0 0;
            color: rgba(255,255,255,.66);
            font-size: 14px;
        }

        /* =========================================================
           QUICK ACTIONS
           ========================================================= */

        #quick-actions {
            margin-top: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            pointer-events: auto;
        }

        .quick-button {
            min-height: 48px;
            padding: 0 19px;
            border-radius: 17px;
            color: #ffffff;
            background:
                linear-gradient(
                    135deg,
                    rgba(95,145,255,.24),
                    rgba(140,80,255,.18)
                );
            border: 1px solid rgba(170,200,255,.20);
            box-shadow:
                0 8px 30px rgba(0,0,0,.22);
            backdrop-filter: blur(16px);
            transition: .25s ease;
        }

        .quick-button.primary {
            background:
                linear-gradient(
                    135deg,
                    rgba(255,190,70,.30),
                    rgba(255,100,70,.20),
                    rgba(130,80,255,.20)
                );
            border-color: rgba(255,220,130,.28);
            box-shadow:
                0 8px 35px rgba(255,170,60,.12);
        }

        .quick-button:hover {
            transform: translateY(-2px);
        }

        /* =========================================================
           BOTTOM NAVIGATION
           ========================================================= */

        #bottom-nav {
            position: absolute;
            left: 50%;
            bottom: max(18px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: min(94%, 600px);
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 4px;
            padding: 7px;
            border-radius: 24px;
            background: rgba(4,12,25,.52);
            border: 1px solid rgba(255,255,255,.10);
            backdrop-filter: blur(24px);
            box-shadow:
                0 15px 45px rgba(0,0,0,.35);
            z-index: 20;
        }

        .nav-button {
            min-width: 68px;
            height: 50px;
            border-radius: 17px;
            color: rgba(255,255,255,.68);
            background: transparent;
            transition: .2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 11px;
        }

        .nav-button span:first-child {
            font-size: 19px;
        }

        .nav-button.active,
        .nav-button:hover {
            color: #ffffff;
            background: rgba(255,255,255,.08);
        }

        /* =========================================================
           OVERLAY
           ========================================================= */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            background: rgba(1,5,13,.46);
            backdrop-filter: blur(10px);
        }

        .overlay.open {
            display: block;
        }

        /* =========================================================
           MAIN MENU
           ========================================================= */

        #main-menu {
            position: fixed;
            z-index: 110;
            left: 14px;
            top: 14px;
            bottom: 14px;
            width: min(420px, calc(100vw - 28px));
            padding: 18px;
            border-radius: 28px;
            background:
                linear-gradient(
                    150deg,
                    rgba(8,20,42,.94),
                    rgba(5,12,26,.92)
                );
            border: 1px solid rgba(255,255,255,.12);
            box-shadow:
                0 25px 80px rgba(0,0,0,.55);
            backdrop-filter: blur(30px);
            transform: translateX(-110%);
            transition: transform .3s cubic-bezier(.2,.8,.2,1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #main-menu.open {
            transform: translateX(0);
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .menu-brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .menu-brand-text strong {
            display: block;
            font-size: 16px;
        }

        .menu-brand-text small {
            display: block;
            margin-top: 3px;
            color: rgba(255,255,255,.48);
            font-size: 11px;
        }

        .close-button {
            width: 38px;
            height: 38px;
            border-radius: 13px;
            color: white;
            background: rgba(255,255,255,.07);
        }

        /* =========================================================
           APP SEARCH
           ========================================================= */

        #app-search {
            width: 100%;
            margin: 14px 0;
            padding: 13px 15px;
            border-radius: 15px;
            outline: none;
            border: 1px solid rgba(255,255,255,.10);
            background: rgba(0,0,0,.20);
            color: white;
        }

        #app-search::placeholder {
            color: rgba(255,255,255,.38);
        }

        /* =========================================================
           APP LIST
           ========================================================= */

        #app-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        #app-list::-webkit-scrollbar {
            width: 5px;
        }

        #app-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.13);
            border-radius: 10px;
        }

        .app-category {
            margin: 14px 0 7px;
            color: rgba(255,255,255,.38);
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: .12em;
        }

        .app-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px;
            margin-bottom: 5px;
            border-radius: 16px;
            text-align: left;
            color: white;
            background: transparent;
            transition: .18s ease;
        }

        .app-item:hover {
            background: rgba(255,255,255,.075);
        }

        .app-icon {
            flex: 0 0 42px;
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.12),
                    rgba(255,255,255,.04)
                );
            border: 1px solid rgba(255,255,255,.08);
            font-size: 20px;
        }

        .app-info {
            min-width: 0;
        }

        .app-info strong {
            display: block;
            font-size: 13px;
            font-weight: 600;
        }

        .app-info small {
            display: block;
            margin-top: 3px;
            color: rgba(255,255,255,.42);
            font-size: 10px;
        }

        /* =========================================================
           APP WINDOW
           ========================================================= */

        #app-window-layer {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: none;
            pointer-events: none;
        }

        #app-window-layer.open {
            display: block;
        }

        .app-window {
            position: absolute;
            inset:
                76px
                14px
                92px
                14px;
            border-radius: 27px;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(8,20,40,.96),
                    rgba(3,10,22,.96)
                );
            border: 1px solid rgba(255,255,255,.11);
            box-shadow:
                0 25px 90px rgba(0,0,0,.50);
            backdrop-filter: blur(25px);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
        }

        .app-window-header {
            height: 58px;
            flex: 0 0 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 13px 0 17px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .app-window-title {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .app-window-title strong {
            font-size: 14px;
        }

        .app-window-body {
            flex: 1;
            overflow: auto;
            padding: 18px;
        }

        /* =========================================================
           AI WINDOW
           ========================================================= */

        #ai-window {
            position: fixed;
            z-index: 130;
            right: 15px;
            bottom: 90px;
            width: min(430px, calc(100vw - 30px));
            height: min(600px, calc(100vh - 120px));
            border-radius: 26px;
            background:
                linear-gradient(
                    150deg,
                    rgba(8,21,43,.96),
                    rgba(4,10,23,.96)
                );
            border: 1px solid rgba(255,255,255,.11);
            box-shadow:
                0 25px 80px rgba(0,0,0,.55);
            backdrop-filter: blur(30px);
            display: none;
            overflow: hidden;
        }

        #ai-window.open {
            display: flex;
            flex-direction: column;
        }

        .ai-header {
            height: 60px;
            flex: 0 0 60px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .ai-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-orb {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #8ddfff 24%,
                    #7d75ff 55%,
                    #4a35c8 100%
                );
            box-shadow:
                0 0 18px rgba(110,150,255,.65);
            animation: aiOrb 4s ease-in-out infinite;
        }

        @keyframes aiOrb {
            0%,
            100% {
                transform: scale(.96);
            }

            50% {
                transform: scale(1.04);
            }
        }

        #ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .ai-message {
            max-width: 88%;
            padding: 11px 13px;
            margin-bottom: 9px;
            border-radius: 15px;
            line-height: 1.45;
            font-size: 13px;
        }

        .ai-message.system {

        language: "de",

    };

    /* ============================================================
       EVENT BUS
       ============================================================ */

    const EventBus = {

        listeners: new Map(),

        on(event, callback) {

            if (!this.listeners.has(event)) {
                this.listeners.set(event, new Set());
            }

            this.listeners.get(event).add(callback);

            return () => {
                this.listeners.get(event)?.delete(callback);
            };
        },

        emit(event, detail = {}) {

            const listeners =
                this.listeners.get(event);

            if (!listeners) {
                return;
            }

            for (const callback of listeners) {

                try {
                    callback(detail);
                } catch (error) {
                    console.error(
                        "[HalDo EventBus]",
                        event,
                        error
                    );
                }

            }

        }

    };

    window.HalDoOS.events = EventBus;


    /* ============================================================
       STORAGE BRIDGE
       ============================================================ */

    const Storage = {

        prefix: CONFIG.storageKey + ":",

        set(key, value) {

            try {

                localStorage.setItem(
                    this.prefix + key,
                    JSON.stringify(value)
                );

                EventBus.emit(
                    "storage:changed",
                    { key, value }
                );

                return true;

            } catch (error) {

                console.error(
                    "[HalDo Storage]",
                    error
                );

                return false;

            }

        },

        get(key, fallback = null) {

            try {

                const raw =
                    localStorage.getItem(
                        this.prefix + key
                    );

                if (raw === null) {
                    return fallback;
                }

                return JSON.parse(raw);

            } catch {

                return fallback;

            }

        },

        remove(key) {

            localStorage.removeItem(

            $("#toast-container");

        if (!container) {

        const element =
            document.createElement("div");

        element.className = "toast";
        element.textContent = message;

        container.appendChild(element);

        setTimeout(() => {

            element.style.opacity = "0";

            setTimeout(
                () => element.remove(),
                250
            );

        }, 2800);

    }

    window.HalDoOS.toast = toast;

    function renderAppList(filter = "") {

        const container =
            $("#app-list");

        if (!container) {
            return;
        }

        const search =
            filter.trim().toLowerCase();

        container.innerHTML = "";

        const filtered =
            APPS.filter(app => {

                if (!search) {
                    return true;
                }

                return (
                    app.name.toLowerCase().includes(search) ||
                    app.id.toLowerCase().includes(search) ||
                    app.category.toLowerCase().includes(search)
                );

            });

        const groups = {};

        filtered.forEach(app => {

            if (!groups[app.category]) {
                groups[app.category] = [];
            }

            groups[app.category].push(app);

        });

        Object.keys(groups)
            .sort()
            .forEach(category => {

                const title =
                    document.createElement("div");

                title.className =
                    "app-category";

                title.textContent =
                    category;

                container.appendChild(title);

                groups[category].forEach(app => {

                    const button =
                        document.createElement("button");

                    button.className =
                        "app-item";

                    button.type =
                        "button";

                    button.dataset.appId =
                        app.id;

                        () => openApp(app.id)
                    );

                    container.appendChild(button);

                });

            empty.style.textAlign =
                "center";

            empty.style.color =
                "rgba(255,255,255,.45)";

            empty.textContent =
                "Keine App gefunden.";

            container.appendChild(empty);

        }

            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

        EventBus.emit(
            "menu:closed"
        );

    }

    window.HalDoOS.openMenu = openMenu;
    window.HalDoOS.closeMenu = closeMenu;


    /* ============================================================
       APP RUNTIME
       ============================================================ */

    async function openApp(appId) {

        const app =
            AppRegistry.get(appId);

        if (!app) {

            toast(
                "Diese App ist nicht registriert."
            );

            return;

        }

        closeMenu();

        const layer =
            $("#app-window-layer");

        const title =
            $("#app-window-title");

        const icon =
            $("#app-window-icon");

        const body =
            $("#app-window-body");

        title.textContent =
            app.name;

        icon.textContent =
            app.icon;

        body.innerHTML = "";

        layer.classList.add("open");

        /*
         * Zuerst versuchen wir vorhandene globale
         * App-Systeme zu verwenden.
         */

        try {

            if (
                window.HalDoAppManager &&
                typeof window.HalDoAppManager.open === "function"
            ) {

                await window.HalDoAppManager.open(
                    app.id
                );

                EventBus.emit(
                    "app:opened",
                    { app }
                );

                return;

            }

            if (
                window.HalDoAppRouter &&
                typeof window.HalDoAppRouter.navigate === "function"
            ) {

                await window.HalDoAppRouter.navigate(
                    app.id
                );

                EventBus.emit(
                    "app:opened",
                    { app }
                );

                return;

            }

        } catch (error) {

            console.error(
                "[HalDo App Runtime]",
                error
            );

        }

        /*
         * Fallback:
         * Die App erhält zunächst eine eigene
         * Runtime-Fläche.
         *
         * Die eigentliche vollständige App-Logik
         * wird anschließend in ihrer App-Datei
         * verbunden.
         */

        renderAppRuntimeFallback(
            app,
            body
        );

        EventBus.emit(
            "app:opened",
            { app }
        );

    }

    window.HalDoOS.openApp = openApp;


    function closeApp() {

        $("#app-window-layer")
            ?.classList
            .remove("open");

        EventBus.emit(
            "app:closed"
        );

    }

    window.HalDoOS.closeApp = closeApp;


    /* ============================================================
       APP FALLBACK RUNTIME
       ============================================================ */

    function renderAppRuntimeFallback(
        app,
        container
    ) {

        const wrapper =
            document.createElement("div");

        wrapper.style.maxWidth =
            "800px";

        wrapper.style.margin =
            "0 auto";

        wrapper.innerHTML = `

            <div
                style="
                    padding:24px;
                    border-radius:22px;
                    background:rgba(255,255,255,.045);
                    border:1px solid rgba(255,255,255,.08);
                "
            >

                <div
                    style="
                        font-size:40px;
                        margin-bottom:12px;
                    "
                >
                    ${app.icon}
                </div>

                <h2
                    style="
                        margin:0;
                        font-size:22px;
                    "
                >
                    ${escapeHtml(app.name)}
                </h2>

                <p
                    style="
                        color:rgba(255,255,255,.58);
                        line-height:1.55;
                    "
                >
                    ${escapeHtml(app.description)}
                </p>

                <div
                    style="
                        margin-top:20px;
                        padding:15px;
                        border-radius:16px;
                        background:rgba(0,0,0,.18);
                        color:rgba(255,255,255,.62);
                        font-size:12px;
                    "
                >
                    HalDo Runtime:
                    App registriert und verbunden.
                    Die vollständige interne App-Funktion
                    wird über das jeweilige App-Modul geladen.
                </div>

            </div>
        `;

        container.appendChild(wrapper);

    }


    /* ============================================================
       AI SYSTEM
       ============================================================ */

    const AI = {

        language: Storage.get(
            "language",
            "de"
        ),

        async send(text) {

            text =
                String(text || "").trim();

            if (!text) {
                return;
            }

            addAIMessage(
                text,
                "user"
            );

            Storage.set(
                "lastAIMessage",
                text
            );

            /*
             * Vorhandene HalDo AI Systeme bevorzugen.
             */

            try {

                if (
                    window.HalDoAI &&
                    typeof window.HalDoAI.ask === "function"
                ) {

                    const response =
                        await window.HalDoAI.ask(
                            text
                        );

                    addAIMessage(
                        response,
                        "system"
                    );

                    return;

                }

                if (
                    window.HalDoAICore &&
                    typeof window.HalDoAICore.process === "function"
                ) {

                    const response =
                        await window.HalDoAICore.process(
                            text
                        );

                    addAIMessage(
                        response,
                        "system"
                    );

                    return;

                }

            } catch (error) {

                console.error(
                    "[HalDo AI]",
                    error
                );

            }

            /*
             * Basisantwort, solange kein echter
             * AI Provider verbunden ist.
             */

            const response =
                localAIResponse(text);

            addAIMessage(
                response,
                "system"
            );

        }

    };

    window.HalDoOS.ai = AI;


    function addAIMessage(
        message,
        type
    ) {

        const container =
            $("#ai-messages");

        const element =
            document.createElement("div");

        element.className =
            `ai-message ${type}`;

        element.textContent =
            String(message);

        container.appendChild(
            element
        );

        container.scrollTop =
            container.scrollHeight;

    }


    function localAIResponse(text) {

        const lower =
            text.toLowerCase();

        if (
            lower.includes("hallo") ||
            lower.includes("hi") ||
            lower.includes("hey")
        ) {

            return "Hallo 💙 Ich bin HalDo AI. Was möchtest du machen?";

        }

        if (
            lower.includes("wer bist") ||
            lower.includes("was bist")
        ) {

            return "Ich bin HalDo AI – der intelligente Assistent innerhalb von HalDo AI OS.";

        }

        if (
            lower.includes("app")
        ) {

            return "Du kannst über das HalDo-Logo oder „Alle Apps“ das vollständige App-Menü öffnen.";

        }

        if (
            lower.includes("einstellung")
        ) {

            return "Die Einstellungen findest du im Systembereich. Dort werden Sprache, Darstellung, Cosmic World, Sounds, Updates und weitere Systemoptionen verbunden.";

        }

        return (
            "Ich habe deine Nachricht erhalten. " +
            "Sobald das jeweilige HalDo-AI-Modul verbunden ist, " +
            "kann ich darauf mit der vollständigen AI-Logik antworten."
        );

    }


    /* ============================================================
       AI UI
       ============================================================ */

    function openAI() {

        $("#ai-window")
            ?.classList
            .add("open");

        $("#ai-input")
            ?.focus();

        EventBus.emit(
            "ai:opened"
        );

    }


    function closeAI() {

        $("#ai-window")
            ?.classList
            .remove("open");

        EventBus.emit(
            "ai:closed"
        );

    }

    window.HalDoOS.openAI = openAI;
    window.HalDoOS.closeAI = closeAI;


    /* ============================================================
       STAR GENERATOR
       ============================================================ */

    function createStars(count = 115) {

        const layer =
            $("#stars-layer");

        if (!layer) {
            return;
        }

        layer.innerHTML = "";

        const classes = [
            "",
            "blue",
            "gold",
            "violet",
            "cyan"
        ];

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const star =
                document.createElement("span");

            const size =
                Math.random() < .88
                    ? Math.random() * 2.3 + 1
                    : Math.random() * 4 + 2;

            star.className =
                "star " +
                classes[
                    Math.floor(
                        Math.random() *
                        classes.length
                    )
                ];

            star.style.width =
                `${size}px`;

            star.style.height =
                `${size}px`;

            star.style.left =
                `${Math.random() * 100}%`;

            star.style.top =
                `${Math.random() * 100}%`;

            star.style.setProperty(
                "--duration",
                `${2 + Math.random() * 5}s`
            );

            star.style.setProperty(
                "--float-duration",
                `${5 + Math.random() * 10}s`
            );

            star.style.setProperty(
                "--opacity",
                `${.25 + Math.random() * .75}`
            );

            layer.appendChild(
                star
            );

        }

    }


    /* ============================================================
       PWA
       ============================================================ */

    async function registerServiceWorker() {

        if (
            !("serviceWorker" in navigator)
        ) {
            return;
        }

        try {

            const registration =
                await navigator.serviceWorker.register(
                    CONFIG.serviceWorker,
                    {
                        scope: "./"
                    }
                );

            window.HalDoOS.serviceWorker =
                registration;

            EventBus.emit(
                "pwa:registered",
                { registration }
            );

            registration.addEventListener(
                "updatefound",
                () => {

                    toast(
                        "HalDo AI OS prüft auf ein neues Update."
                    );

                    EventBus.emit(
                        "update:found"
                    );

                }
            );

        } catch (error) {

            console.warn(
                "[HalDo PWA]",
                error
            );

        }

    }


    /* ============================================================
       PWA INSTALL PROMPT
       ============================================================ */

    let deferredInstallPrompt =
        null;

    window.addEventListener(
        "beforeinstallprompt",
        event => {

            event.preventDefault();

            deferredInstallPrompt =
                event;

            EventBus.emit(
                "pwa:installavailable"
            );

        }
    );

    async function installPWA() {

        if (!deferredInstallPrompt) {

            toast(
                "Die Installation ist momentan nicht verfügbar."
            );

            return false;

        }

        deferredInstallPrompt.prompt();

        const result =
            await deferredInstallPrompt.userChoice;

        deferredInstallPrompt =
            null;

        EventBus.emit(
            "pwa:installed",
            result
        );

        return result;

    }

    window.HalDoOS.installPWA =
        installPWA;


    /* ============================================================
       SYSTEM BRIDGE
       ============================================================ */

    function connectExistingSystems() {

        /*
         * Bestehende HalDo-Systeme werden bewusst
         * nicht ersetzt.
         */

        const connections = [

            "HalDoSystem",

            "HalDoKernel",

            "HalDoAppManager",

            "HalDoAppRegistry",

            "HalDoAppRouter",

            "HalDoWindowManager",

            "HalDoStorage",

            "HalDoAI",

            "HalDoAICore",

            "HalDoAIEngine",

            "HalDoSpeech",

            "HalDoVoice",

            "HalDoLanguage",

            "HalDoLanguageManager",

            "HalDoUpdateManager",

            "HalDoBackupManager"

        ];

        connections.forEach(
            name => {

                if (window[name]) {

                    EventBus.emit(
                        "system:connected",
                        {
                            name,
                            system: window[name]
                        }
                    );

                }

            }
        );

    }


    /* ============================================================
       SYSTEM STATUS
       ============================================================ */

    function setSystemStatus(
        text
    ) {

        const element =
            $("#system-status-text");

        if (element) {
            element.textContent =
                text;
        }

    }


    /* ============================================================
       CLOCK / RUNTIME HEARTBEAT
       ============================================================ */

    function startHeartbeat() {

        setInterval(
            () => {

                EventBus.emit(
                    "system:heartbeat",
                    {
                        timestamp:
                            Date.now()
                    }
                );

            },
            10000
        );

    }


    /* ============================================================
       EVENT CONNECTIONS
       ============================================================ */

    function bindUI() {

        $("#haldo-logo-button")
            ?.addEventListener(
                "click",
                openMenu
            );

        $("#open-apps-button")
            ?.addEventListener(
                "click",
                openMenu
            );

        $("#open-ai-button")
            ?.addEventListener(
                "click",
                openAI
            );

        $("#close-menu-button")
            ?.addEventListener(
                "click",
                closeMenu
            );

        $("#menu-overlay")
            ?.addEventListener(
                "click",
                closeMenu
            );

        $("#close-app-button")
            ?.addEventListener(
                "click",
                closeApp
            );

        $("#close-ai-button")
            ?.addEventListener(
                "click",
                closeAI
            );

        $("#app-search")
            ?.addEventListener(
                "input",
                event => {

                    renderAppList(
                        event.target.value
                    );

                }
            );

        $("#ai-send")
            ?.addEventListener(
                "click",
                () => {

                    const input =
                        $("#ai-input");

                    AI.send(
                        input.value
                    );

                    input.value =
                        "";

                }
            );

        $("#ai-input")
            ?.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        $("#ai-send")
                            ?.click();

                    }

                }
            );

        $$(".nav-button")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        $$(".nav-button")
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );

                        button.classList.add(
                            "active"
                        );

                        const action =
                            button.dataset.action;

                        if (action === "apps") {
                            openMenu();
                        }

                        if (action === "ai") {
                            openAI();
                        }

                        if (action === "settings") {
                            openApp("settings");
                        }

                    }
                );

            });

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeMenu();
                    closeAI();
                    closeApp();

                }

            }
        );

    }


    /* ============================================================
       INITIALIZATION
       ============================================================ */

    async function initialize() {

        console.log(
            `[HalDo AI OS] Starting ${CONFIG.version}`
        );

        setSystemStatus(
            "HalDo AI OS"
        );

        $("#version-text").textContent =
            `OS ${CONFIG.version}`;

        $("#menu-version").textContent =
            `Version ${CONFIG.version}`;

        createStars(
            window.innerWidth < 700
                ? 80
                : 130
        );

        renderAppList();

        bindUI();

        connectExistingSystems();

        startHeartbeat();

        await registerServiceWorker();

        EventBus.emit(
            "system:ready",
            {
                version:
                    CONFIG.version
            }
        );

        setSystemStatus(
            "HalDo AI OS"
        );

        console.log(
            "[HalDo AI OS] Runtime ready."
        );

    }


    /* ============================================================
       PUBLIC SYSTEM API
       ============================================================ */

    window.HalDoOS.ready =
        initialize;

    window.HalDoOS.getApp =
        id => AppRegistry.get(id);

    window.HalDoOS.getApps =
        () => AppRegistry.all();

    window.HalDoOS.version =
        CONFIG.version;


    /* ============================================================
       START
       ============================================================ */

    if (
        document.readyState === "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once: true
            }
        );

    } else {

        initialize();

    }

})();

</script>
