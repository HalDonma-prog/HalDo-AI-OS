                    true

            };


            /* ===================================================
               MODULE REGISTRY
               =================================================== */

            const modules = [

                /*
                 * STORAGE
                 */

                "storage.js",
                "storage-manager.js",
                "config-manager.js",


                /*
                 * LANGUAGE
                 */

                "language-system.js",
                "language-manager.js",
                "ai-language.js",


                /*
                 * CORE SYSTEM
                 */

                "kernel.js",
                "system.js",
                "system-loader.js",
                "system-status.js",


                /*
                 * MODULE MANAGEMENT
                 */

                "module-manager.js",


                /*
                 * APPLICATION SYSTEM
                 */

                "app-registry.js",
                "app-manager.js",
                "app-router.js",
                "app-launcher.js",
                "launcher.js",


                /*
                 * WINDOW / DESKTOP
                 */

                "window-manager.js",
                "desktop manager.js",
                "shell-manager.js",


                /*
                 * HALDO LIGHT / LOGO
                 */

                "haldo-light-system.js",
                "logo-animation-manager.js",
                "logo-intro-manager.js",


                /*
                 * EZIDI KEYBOARD
                 */

                "ezidi-keyboard.js",


                /*
                 * CONVERSATION / AI MEMORY
                 */

                "conversation-state.js",
                "ai-memory.js",


                /*
                 * AI CORE
                 */

                "ai-core.js",
                "ai-engine.js",
                "ai-commands.js",
                "ai-chat.js",


                /*
                 * VOICE
                 */

                "voice.js",
                "ai-voice.js",
                "ai-speech.js",


                /*
                 * STARTUP
                 */

                "boot.js",
                "startup.js"

            ];


            /* ===================================================
               LOADER STATE
               =================================================== */

            const loaderState = {

                started:
                    false,

                completed:
                    false,

                loading:
                    false,

                loaded:
                    [],

                failed:
                    [],

                promises:
                    new Map()

            };


            /* ===================================================
               BOOT STATUS
               =================================================== */

            function updateBootStatus(
                text,
                progress
            ) {

                const status =
                    document.getElementById(
                        "haldo-boot-status"
                    );

                const progressBar =
                    document.getElementById(
                        "haldo-boot-progress-bar"
                    );

                const progressContainer =
                    progressBar
                    ?.parentElement;


                if (status) {

                    status.textContent =
                        text;

                }


                if (progressBar) {

                    const safeProgress =
                        Math.max(
                            0,
                            Math.min(
                                100,
                                Number(progress) || 0
                            )
                        );


                    progressBar.style.width =
                        safeProgress + "%";


                    if (progressContainer) {

                        progressContainer.setAttribute(
                            "aria-valuenow",
                            String(
                                safeProgress
                            )
                        );

                    }

                }

            }


            /* ===================================================
               LOGGING
               =================================================== */

            function log(
                message,
                ...args
            ) {

                if (
                    window.HalDoBootConfig.debug
                ) {

                    console.log(
                        "[HalDo OS 20]",
                        message,
                        ...args
                    );

                }

            }


            function warn(
                message,
                ...args
            ) {

                console.warn(
                    "[HalDo OS 20]",
                    message,
                    ...args
                );

            }


            function error(
                message,
                ...args
            ) {

                console.error(
                    "[HalDo OS 20]",
                    message,
                    ...args
                );

            }


            /* ===================================================
               SCRIPT LOADER
               =================================================== */

            function loadScript(
                filename
            ) {

                if (
                    loaderState.promises.has(
                        filename
                    )
                ) {

                    return loaderState.promises.get(
                        filename
                    );

                }


                const promise =
                    new Promise(
                        (
                            resolve,
                            reject
                        ) => {

                            const existing =
                                document.querySelector(
                                    `script[data-haldo-module="${filename}"]`
                                );


                            if (existing) {

                                if (
                                    existing.dataset.loaded ===
                                    "true"
                                ) {

                                    resolve(
                                        filename
                                    );

                                    return;

                                }


                                existing.addEventListener(
                                    "load",
                                    () => {

                                        resolve(
                                            filename
                                        );

                                    },
                                    {
                                        once:
                                            true
                                    }
                                );


                                existing.addEventListener(
                                    "error",
                                    () => {

                                        reject(
                                            new Error(
                                                `Modul konnte nicht geladen werden: ${filename}`
                                            )
                                        );

                                    },
                                    {
                                        once:
                                            true
                                    }
                                );


                                return;

                            }


                            const script =
                                document.createElement(
                                    "script"
                                );


                            script.src =
                                window.HalDoBootConfig.modulePath +
                                filename;


                            script.async =
                                false;


                            script.defer =
                                false;


                            script.dataset.haldoModule =
                                filename;


                            script.addEventListener(
                                "load",
                                () => {

                                    script.dataset.loaded =
                                        "true";


                                    loaderState.loaded.push(
                                        filename
                                    );


                                    resolve(
                                        filename
                                    );

                                },
                                {
                                    once:
                                        true
                                }
                            );


                            script.addEventListener(
                                "error",
                                () => {

                                    reject(
                                        new Error(
                                            `Fehler beim Laden von ${filename}`
                                        )
                                    );

                                },
                                {
                                    once:
                                        true
                                }
                            );


                            document.head.appendChild(
                                script
                            );

                        }
                    );


                loaderState.promises.set(
                    filename,
                    promise
                );


                return promise;

            }


            /* ===================================================
               SEQUENTIELLES LADEN
               =================================================== */

            async function loadModules() {

                if (
                    loaderState.loading
                ) {

                    return;

                }


                loaderState.loading =
                    true;


                loaderState.started =
                    true;


                const total =
                    modules.length;


                let current =
                    0;


                updateBootStatus(
                    "HalDo AI OS 20 lädt Kernmodule ...",
                    5
                );


                for (
                    const module
                    of modules
                ) {

                    current++;


                    const progress =
                        5 +
                        (
                            current /
                            total
                        ) *
                        78;


                    updateBootStatus(
                        `Modul wird geladen: ${module}`,
                        progress
                    );


                    try {

                        await loadScript(
                            module
                        );


                        log(
                            `Modul geladen: ${module}`
                        );

                    } catch (
                        moduleError
                    ) {

                        loaderState.failed.push(
                            {
                                file:
                                    module,

                                error:
                                    moduleError
                            }
                        );


                        warn(
                            `Modul konnte nicht geladen werden: ${module}`,
                            moduleError
                        );

                    }

                }


                loaderState.completed =
                    true;


                loaderState.loading =
                    false;


                updateBootStatus(
                    "HalDo AI OS 20 Module geladen.",
                    86
                );


                log(
                    "Modulladevorgang abgeschlossen.",
                    {
                        loaded:
                            loaderState.loaded,

                        failed:
                            loaderState.failed
                    }
                );


                dispatchLoaderEvent();

            }


            /* ===================================================
               LOADER EVENT
               =================================================== */

            function dispatchLoaderEvent() {

                window.dispatchEvent(
                    new CustomEvent(
                        "haldo:modules-ready",
                        {
                            detail: {

                                version:
                                    window.HalDoBootConfig.version,

                                loaded:
                                    [
                                        ...loaderState.loaded
                                    ],

                                failed:
                                    [
                                        ...loaderState.failed
                                    ]

                            }
                        }
                    )
                );


                if (
                    window.HalDoKernel &&
                    typeof
                    window.HalDoKernel.emit ===
                    "function"
                ) {

                    try {

                        window.HalDoKernel.emit(
                            "haldo:modules-ready",
                            {
                                loaded:
                                    loaderState.loaded,

                                failed:
                                    loaderState.failed
                            }
                        );

                    } catch (
                        kernelError
                    ) {

                        warn(
                            "Kernel-Event konnte nicht gesendet werden.",
                            kernelError
                        );

                    }

                }

            }


            /* ===================================================
               PUBLIC LOADER API
               =================================================== */

            window.HalDoModuleLoader = {

                modules,

                state:
                    loaderState,

                load:
                    loadModules,

                loadScript,

                updateBootStatus

            };


            /* ===================================================
               HALDO OS NAMESPACE
               =================================================== */

            window.HalDoOS =
                window.HalDoOS ||
                {};


            window.HalDoOS.version =
                window.HalDoBootConfig.version;


            window.HalDoOS.edition =
                window.HalDoBootConfig.edition;


            window.HalDoOS.name =
                window.HalDoBootConfig.name;


            window.HalDoOS.moduleLoader =
                window.HalDoModuleLoader;


            /* ===================================================
               START AFTER DOM
               =================================================== */

            function startLoader() {

                updateBootStatus(
                    "HalDo AI OS 20 initialisiert ...",
                    2
                );


                /*
                 * Kurze Verzögerung:
                 * Dadurch kann die Shell vollständig
                 * aufgebaut werden, bevor die Module
                 * geladen werden.
                 */

                setTimeout(
                    () => {

                        loadModules()
                            .catch(
                                loaderError => {

                                    error(
                                        "Kritischer Loader-Fehler.",
                                        loaderError
                                    );


                                    updateBootStatus(
                                        "HalDo AI OS 20 – Modulfehler erkannt.",
                                        90
                                    );

                                }
                            );

                    },
                    80
                );

            }


            if (
                document.readyState ===
                "loading"
            ) {

                document.addEventListener(
                    "DOMContentLoaded",
                    startLoader,
                    {
                        once:
                            true
                    }
                );

            } else {

                startLoader();

            }

        })();

    <script>

        (() => {

            "use strict";


            /* =====================================================
               APP SYSTEM ROOT
               ===================================================== */

            const AppSystem = {

                version:
                    "20.0.0",

                initialized:
                    false,

                apps:
                    new Map(),

                windows:
                    new Map(),

                activeApp:
                    null,

                activeWindow:
                    null,

                history:
                    [],

                listeners:
                    new Map(),

                errors:
                    [],

                sequence:
                    0

            };


            window.HalDoOS =
                window.HalDoOS ||
                {};


            window.HalDoOS.apps =
                AppSystem;


            window.HalDoAppSystem =
                AppSystem;


            /* =====================================================
               HELPERS
               ===================================================== */

            function createId(
                prefix
            ) {

                AppSystem.sequence +=
                    1;


                return (
                    prefix +
                    "-" +
                    Date.now() +
                    "-" +
                    AppSystem.sequence
                );

            }


            function safeString(
                value,
                fallback = ""
            ) {

                const result =
                    String(
                        value ?? ""
                    ).trim();


                return result ||
                    fallback;

            }


            function emit(
                event,
                detail = {}
            ) {

                const handlers =
                    AppSystem.listeners.get(
                        event
                    );


                if (handlers) {

                    handlers.forEach(
                        handler => {

                            try {

                                handler(
                                    detail
                                );

                            } catch (
                                error
                            ) {

                                AppSystem.errors.push(
                                    error
                                );

                            }

                        }
                    );

                }


                try {

                    window.dispatchEvent(
                        new CustomEvent(
                            "haldo:app:" + event,
                            {
                                detail
                            }
                        )
                    );

                } catch (
                    error
                ) {

                    AppSystem.errors.push(
                        error
                    );

                }

            }


            function on(
                event,
                handler
            ) {

                if (
                    typeof handler !==
                    "function"
                ) {

                    return () => {};

                }


                if (
                    !AppSystem.listeners.has(
                        event
                    )
                ) {

                    AppSystem.listeners.set(
                        event,
                        new Set()
                    );

                }


                const set =
                    AppSystem.listeners.get(
                        event
                    );


                set.add(
                    handler
                );


                return () => {

                    set.delete(
                        handler
                    );

                };

            }


            /* =====================================================
               APP DEFINITION
               ===================================================== */

            function normalizeApp(
                definition
            ) {

                if (
                    !definition ||
                    typeof definition !==
                    "object"
                ) {

                    throw new Error(
                        "Ungültige App-Definition."
                    );

                }


                const id =
                    safeString(
                        definition.id ||
                        definition.appId ||
                        definition.name
                    ).toLowerCase();


                if (!id) {

                    throw new Error(
                        "App benötigt eine ID."
                    );

                }


                return {

                    id,

                    name:
                        safeString(
                            definition.name,
                            id
                        ),

                    title:
                        safeString(
                            definition.title,
                            definition.name ||
                            id
                        ),

                    version:
                        safeString(
                            definition.version,
                            "1.0.0"
                        ),

                    description:
                        safeString(
                            definition.description,
                            "HalDo Anwendung"
                        ),

                    category:
                        safeString(
                            definition.category,
                            "System"
                        ),

                    icon:
                        safeString(
                            definition.icon,
                            "◈"
                        ),

                    priority:
                        Number(
                            definition.priority
                        ) || 0,

                    enabled:
                        definition.enabled !==
                        false,

                    system:
                        definition.system ===
                        true,

                    singleton:
                        definition.singleton !==
                        false,

                    permissions:
                        Array.isArray(
                            definition.permissions
                        )
                            ? [
                                ...definition.permissions
                            ]
                            : [],

                    dependencies:
                        Array.isArray(
                            definition.dependencies
                        )
                            ? [
                                ...definition.dependencies
                            ]
                            : [],

                    state:
                        definition.state &&
                        typeof definition.state ===
                        "object"
                            ? {
                                ...definition.state
                            }
                            : {},

                    actions:
                        definition.actions &&
                        typeof definition.actions ===
                        "object"
                            ? {
                                ...definition.actions
                            }
                            : {},

                    api:
                        definition.api &&
                        typeof definition.api ===
                        "object"
                            ? {
                                ...definition.api
                            }
                            : {},

                    factory:
                        typeof definition.factory ===
                        "function"
                            ? definition.factory
                            : null,

                    init:
                        typeof definition.init ===
                        "function"
                            ? definition.init
                            : null,

                    start:
                        typeof definition.start ===
                        "function"
                            ? definition.start
                            : null,

                    stop:
                        typeof definition.stop ===
                        "function"
                            ? definition.stop
                            : null,

                    destroy:
                        typeof definition.destroy ===
                        "function"
                            ? definition.destroy
                            : null,

                    render:
                        typeof definition.render ===
                        "function"
                            ? definition.render
                            : null,

                    registeredAt:
                        Date.now(),

                    initialized:
                        false,

                    running:
                        false,

                    instance:
                        null

                };

            }


            /* =====================================================
               REGISTER
               ===================================================== */

            function register(
                definition
            ) {

                let app;


                try {

                    app =
                        normalizeApp(
                            definition
                        );

                } catch (
                    error
                ) {

                    AppSystem.errors.push(
                        error
                    );

                    console.error(
                        "[HalDo AppSystem]",
                        error
                    );

                    return null;

                }


                const existing =
                    AppSystem.apps.get(
                        app.id
                    );


                if (existing) {

                    /*
                     * Bestehende App nicht blind
                     * zerstören.
                     *
                     * Fehlende Eigenschaften werden
                     * ergänzt.
                     */

                    const merged =
                        {
                            ...existing,
                            ...app,
                            state:
                                {
                                    ...existing.state,
                                    ...app.state
                                }
                        };


                    AppSystem.apps.set(
                        app.id,
                        merged
                    );


                    emit(
                        "updated",
                        {
                            app:
                                merged
                        }
                    );


                    return merged;

                }


                AppSystem.apps.set(
                    app.id,
                    app
                );


                emit(
                    "registered",
                    {
                        app
                    }
                );


                return app;

            }


            /* =====================================================
               UNREGISTER
               ===================================================== */

            function unregister(
                appId
            ) {

                const id =
                    safeString(
                        appId
                    ).toLowerCase();


                const app =
                    AppSystem.apps.get(
                        id
                    );


                if (!app) {

                    return false;

                }


                if (
                    app.running
                ) {

                    stop(
                        id
                    );

                }


                AppSystem.apps.delete(
                    id
                );


                emit(
                    "unregistered",
                    {
                        app
                    }
                );


                return true;

            }


            /* =====================================================
               GET APP
               ===================================================== */

            function get(
                appId
            ) {

                const id =
                    safeString(
                        appId
                    ).toLowerCase();


                return AppSystem.apps.get(
                    id
                ) || null;

            }


            function getAll() {

                return [
                    ...AppSystem.apps.values()
                ];

            }


            function has(
                appId
            ) {

                return Boolean(
                    get(
                        appId
                    )
                );

            }


            /* =====================================================
               DEPENDENCY CHECK
               ===================================================== */

            function dependenciesReady(
                app
            ) {

                if (
                    !app ||
                    !app.dependencies.length
                ) {

                    return true;

                }


                return app.dependencies.every(
                    dependency => {

                        const id =
                            safeString(
                                dependency
                            ).toLowerCase();


                        return Boolean(
                            AppSystem.apps.get(
                                id
                            )
                        );

                    }
                );

            }


            /* =====================================================
               APP INIT
               ===================================================== */

            async function initialize(
                appId
            ) {

                const app =
                    get(
                        appId
                    );


                if (!app) {

                    throw new Error(
                        `App "${appId}" wurde nicht gefunden.`
                    );

                }


                if (
                    app.initialized
                ) {

                    return app;

                }


                if (
                    !dependenciesReady(
                        app
                    )
                ) {

                    throw new Error(
                        `Abhängigkeiten von "${app.id}" sind nicht bereit.`
                    );

                }


                try {

                    if (
                        app.factory &&
                        !app.instance
                    ) {

                        app.instance =
                            await app.factory(
                                {
                                    app,
                                    system:
                                        AppSystem,
                                    haldo:
                                        window.HalDoOS
                                }
                            );

                    }


                    if (
                        app.init
                    ) {

                        await app.init(
                            {
                                app,
                                instance:
                                    app.instance,
                                system:
                                    AppSystem,
                                haldo:
                                    window.HalDoOS
                            }
                        );

                    }


                    app.initialized =
                        true;


                    emit(
                        "initialized",
                        {
                            app
                        }
                    );


                    return app;

                } catch (
                    error
                ) {

                    AppSystem.errors.push(
                        error
                    );


                    emit(
                        "error",
                        {
                            app,
                            error
                        }
                    );


                    throw error;

                }

            }


            /* =====================================================
               START APP
               ===================================================== */

            async function start(
                appId,
                options = {}
            ) {

                const app =
                    get(
                        appId
                    );


                if (!app) {

                    throw new Error(
                        `App "${appId}" wurde nicht gefunden.`
                    );

                }


                if (
                    app.enabled === false
                ) {

                    throw new Error(
                        `App "${app.id}" ist deaktiviert.`
                    );

                }


                if (
                    app.singleton &&
                    app.running
                ) {

                    focus(
                        app.id
                    );


                    return app;

                }


                await initialize(
                    app.id
                );


                try {

                    if (
                        app.start
                    ) {

                        await app.start(
                            {
                                app,
                                instance:
                                    app.instance,
                                options,
                                system:
                                    AppSystem,
                                haldo:
                                    window.HalDoOS
                            }
                        );

                    }


                    app.running =
                        true;


                    AppSystem.activeApp =
                        app.id;


                    AppSystem.history.push(
                        {
                            action:
                                "start",

                            appId:
                                app.id,

                            time:
                                Date.now()
                        }
                    );


                    emit(
                        "started",
                        {
                            app,
                            options
                        }
                    );


                    return app;

                } catch (
                    error
                ) {

                    AppSystem.errors.push(
                        error
                    );


                    emit(
                        "error",
                        {
                            app,
                            error
                        }
                    );


                    throw error;

                }

            }


            /* =====================================================
               STOP APP
               ===================================================== */

            async function stop(
                appId
            ) {

                const app =
                    get(
                        appId
                    );


                if (!app) {

                    return false;

                }


                try {

                    if (
                        app.stop
                    ) {

                        await app.stop(
                            {
                                app,
                                instance:
                                    app.instance,
                                system:
                                    AppSystem,
                                haldo:
                                    window.HalDoOS
                            }
                        );

                    }


                    app.running =
                        false;


                    if (
                        AppSystem.activeApp ===
                        app.id
                    ) {

                        AppSystem.activeApp =
                            null;

                    }


                    emit(
                        "stopped",
                        {
                            app
                        }
                    );


                    return true;

                } catch (
                    error
                ) {

                    AppSystem.errors.push(
                        error
                    );


                    emit(
                        "error",
                        {
                            app,
                            error
                        }
                    );


                    return false;

                }

            }


            /* =====================================================
               DESTROY APP
               ===================================================== */

            async function destroy(
                appId
            ) {

                const app =
                    get(
                        appId
                    );


                if (!app) {

                    return false;

                }


                try {

                    if (
                        app.running
                    ) {

                        await stop(
                            app.id
                        );

                    }


                    if (
                        app.destroy
                    ) {

                        await app.destroy(
                            {
                                app,
                                instance:
                                    app.instance,
                                system:
                                    AppSystem,
                                haldo:
                                    window.HalDoOS
                            }
                        );

                    }


                    app.instance =
                        null;

                    app.initialized =
                        false;


                    emit(
                        "destroyed",
                        {
                            app
                        }
                    );


                    return true;

                } catch (
                    error
                ) {

                    AppSystem.errors.push(
                        error
                    );


                    return false;

                }

            }


            /* =====================================================
               FOCUS
               ===================================================== */

            function focus(
                appId
            ) {

                const app =
                    get(
                        appId
                    );


                if (!app) {

                    return false;

                }


                AppSystem.activeApp =
                    app.id;


                emit(
                    "focused",
                    {
                        app
                    }
                );


                /*
                 * Vorhandenen Window Manager benutzen,
                 * wenn er eine passende API anbietet.
                 */

                const manager =
                    window.HalDoOS?.windowManager;


                if (
                    manager
                ) {

                    try {

                        if (
                            typeof manager.focusApp ===
                            "function"
                        ) {

                            manager.focusApp(
                                app.id
                            );

                        } else if (
                            typeof manager.focus ===
                            "function"
                        ) {

                            manager.focus(
                                app.id
                            );

                        }

                    } catch (
                        error
                    ) {

                        AppSystem.errors.push(
                            error
                        );

                    }

                }


                return true;

            }


            /* =====================================================
               ROUTER BRIDGE
               ===================================================== */

            async function route(
                appId,
                options = {}
            ) {

                const router =
                    window.HalDoOS?.appRouter;


                if (
                    router
                ) {

                    try {

                        if (
                            typeof router.open ===
                            "function"
                        ) {

                            return await router.open(
                                appId,
                                options
                            );

                        }


                        if (
                            typeof router.navigate ===
                            "function"
                        ) {

                            return await router.navigate(
                                appId,
                                options
                            );

                        }


                        if (
                            typeof router.route ===
                            "function"
                        ) {

                            return await router.route(
                                appId,
                                options
                            );

                        }

                    } catch (
                        error
                    ) {

                        AppSystem.errors.push(
                            error
                        );

                    }

                }


                return start(
                    appId,
                    options
                );

            }


            /* =====================================================
               LAUNCH
               ===================================================== */

            async function launch(
                appId,
                options = {}
            ) {

                const app =
                    get(
                        appId
                    );


                if (!app) {

                    throw new Error(
                        `Unbekannte App: ${appId}`
                    );

                }


                emit(
                    "launching",
                    {
                        app,
                        options
                    }
                );


                return route(
                    app.id,
                    options
                );

            }


            /* =====================================================
               WINDOW REGISTRATION
               ===================================================== */

            function registerWindow(
                appId,
                element,
                options = {}
            ) {

                const app =
                    get(
                        appId
                    );


                if (!app) {

                    return null;

                }


                const id =
                    options.id ||
                    createId(
                        "window"
                    );


                const record = {

                    id,

                    appId:
                        app.id,

                    element,

                    title:
                        safeString(
                            options.title,
                            app.title
                        ),

                    minimized:
                        false,

                    maximized:
                        false,

                    focused:
                        false,

                    createdAt:
                        Date.now(),

                    metadata:
                        {
                            ...options
                        }

                };


                AppSystem.windows.set(
                    id,
                    record
                );


                AppSystem.activeWindow =
                    id;


                emit(
                    "window-registered",
                    {
                        window:
                            record,

                        app
                    }
                );


                return record;

            }


            /* =====================================================
               WINDOW CLOSE
               ===================================================== */

            function closeWindow(
                windowId
            ) {

                const record =
                    AppSystem.windows.get(
                        windowId
                    );


                if (!record) {

                    return false;

                }


                if (
                    record.element &&
                    record.element.parentNode
                ) {

                    record.element.parentNode
                        .removeChild(
                            record.element
                        );

                }


                AppSystem.windows.delete(
                    windowId
                );


                if (
                    AppSystem.activeWindow ===
                    windowId
                ) {

                    AppSystem.activeWindow =
                        null;

                }


                emit(
                    "window-closed",
                    {
                        window:
                            record
                    }
                );


                return true;

            }


            /* =====================================================
               APP ACTION
               ===================================================== */

            async function action(
                appId,
                actionName,
                payload = {}
            ) {

                const app =
                    get(
                        appId
                    );


                if (!app) {

                    throw new Error(
                        `App "${appId}" wurde nicht gefunden.`
                    );

                }


                const actionHandler =
                    app.actions[
                        actionName
                    ];


                if (
                    typeof actionHandler ===
                    "function"
                ) {

                    return actionHandler(
                        payload,
                        {
                            app,
                            system:
                                AppSystem,
                            haldo:
                                window.HalDoOS
                        }
                    );

                }


                if (
                    app.instance &&
                    typeof app.instance[
                        actionName
                    ] === "function"
                ) {

                    return app.instance[
                        actionName
                    ](
                        payload
                    );

                }


                return null;

            }


            /* =====================================================
               APP SEARCH
               ===================================================== */

            function search(
                query
            ) {

                const text =
                    safeString(
                        query
                    ).toLowerCase();


                if (!text) {

                    return getAll();

                }


                return getAll()
                    .filter(
                        app => {

                            const haystack =
                                [
                                    app.id,
                                    app.name,
                                    app.title,
                                    app.description,
                                    app.category
                                ]
                                    .join(" ")
                                    .toLowerCase();


                            return haystack.includes(
                                text
                            );

                        }
                    )
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            b.priority -
                            a.priority
                    );

            }

                    return {

                        total:

                            apps.filter(

                            ).length,

                            apps.filter(

                                    app.running
                            ).length,

                        active:

                        windows:

            function initializeAppSystem() {

                if (
                    AppSystem.initialized
                ) {

                    return;

                }


                /*

                 */

                const registry =
                    window.HalDoOS?.appRegistry;


                if (
                    registry
                ) {

                    try {

                        if (
                            typeof registry.getAll ===
                            "function"
                        ) {

                            const registered =
                                registry.getAll();


                            if (
                                Array.isArray(

            /* =====================================================

            if (

                document.addEventListener(
                    "DOMContentLoaded",
                    initializeAppSystem,
                    {
                        once:
                            true
                    }
                );

            } else {

                initializeAppSystem();

            }


            /* =====================================================
               GLOBAL APP API
               ===================================================== */

            window.HalDoApps = {

                register,

                unregister,

                get,

                getAll,

                has,

                initialize,

                start,

                stop,

                destroy,

                focus,

                route,

                launch,

                action,

                search,

                registerWindow,

                closeWindow,

                on,

                emit,

                status:
                    () =>
                        AppSystem.status()
