<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalDo AI OS 24.6.0</title>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0b10;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            color: #fff;
        }
        /* ===== SCREENS ===== */
        .screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1), transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform, opacity;
        }
        #wake-screen {
            z-index: 100;
            background: radial-gradient(ellipse at center, #0d111f 0%, #05070c 100%);
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
        }
        #wake-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        #wake-screen.exit {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        #desktop-screen {
            z-index: 50;
            background: #0a0b10;
            opacity: 0;
            pointer-events: none;
            flex-direction: column;
        }
        #desktop-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== WAKE SCREEN AVATAR WRAPPER ===== */
        .avatar-container {
            position: relative;
            width: 320px;
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #wake-canvas {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 60px rgba(0, 180, 255, 0.15));
        }
        .wake-sub {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            font-weight: 300;
            background: rgba(255,255,255,0.03);
            padding: 8px 24px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .wake-sub span { color: #6bc5ff; font-weight: 600; }
        .wake-hint {
            position: absolute;
            bottom: 40px;
            font-size: 12px;
            color: rgba(255,255,255,0.15);
            animation: pulse-hint 3s ease-in-out infinite;
            letter-spacing: 2px;
        }
        @keyframes pulse-hint {
            0%, 100% { opacity: 0.15; transform: translateY(0); }
            50% { opacity: 0.6; transform: translateY(-4px); }
        }

        /* ===== DESKTOP - COSMIC SOLAR SYSTEM ===== */
        #desktop-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
        }
        /* Statusbar */
        .status-bar {
            position: absolute;
            top: 18px; left: 30px; right: 30px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1px;
            z-index: 60;
            pointer-events: none;
            font-weight: 300;
        }
        .status-bar .version { color: rgba(100, 200, 255, 0.6); }
        .status-bar .state-badge {
            background: rgba(0, 200, 255, 0.08);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(0, 200, 255, 0.1);
            color: #6bc5ff;
        }

        /* ===== WINDOW MANAGER ===== */
        #windows-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 70;
        }
        .os-window {
            position: absolute;
            min-width: 260px;
            min-height: 180px;
            background: rgba(16, 20, 34, 0.85);
            backdrop-filter: blur(30px) saturate(1.2);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(0, 100, 255, 0.05);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            resize: both;
        }
        @keyframes windowIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .window-header {
            padding: 14px 18px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            flex-shrink: 0;
        }
        .window-header:active { cursor: grabbing; }
        .window-title {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0.5px;
        }
        .window-close {
            width: 28px; height: 28px;
            border-radius: 40px;
            background: rgba(255,70,70,0.1);
            border: none;
            color: #ff6b6b;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .window-close:hover { background: rgba(255,70,70,0.25); }
        .window-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            line-height: 1.6;
        }
        .window-body h3 { color: #fff; margin-bottom: 8px; font-weight: 400; letter-spacing: 1px; }
        .window-body p { margin-bottom: 6px; }

        /* Scrollbar */
        .window-body::-webkit-scrollbar { width: 3px; }
        .window-body::-webkit-scrollbar-track { background: transparent; }
        .window-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        /* Responsive hint */
        @media (max-width: 600px) {
            .avatar-container { transform: scale(0.7); }
            .status-bar { font-size: 10px; top: 10px; left: 16px; right: 16px; }
        }
    </style>
</head>
<body>

    <!-- ===== WAKE SCREEN (PRESENCE LAYER) ===== -->
    <div id="wake-screen" class="screen active">
        <div class="avatar-container">
            <canvas id="wake-canvas" width="600" height="700"></canvas>
            <div class="wake-sub">HalDo <span>AI</span> · Presence</div>
            <div class="wake-hint">✦ click to enter universe ✦</div>
        </div>
    </div>

    <!-- ===== DESKTOP SCREEN (OS LAYER) ===== -->
    <div id="desktop-screen" class="screen">
        <canvas id="desktop-canvas"></canvas>
        <div class="status-bar">
            <span class="version">HalDo AI OS <span id="os-version">24.6.0</span></span>
            <span class="state-badge" id="os-state">● CORE IDLE</span>
        </div>
        <div id="windows-container"></div>
    </div>

    <script>
        // ===================================================================
        //  HALDO AI OS 24.6.0  –  KERNEL & AVATAR ENGINE
        // ===================================================================

        // ----- VERSION -----
        const VERSION = '24.6.0';
        document.getElementById('os-version').textContent = VERSION;

        // ----- STATE MACHINE -----
        const State = {
            BOOT: 'BOOT',
            IDLE: 'IDLE',
            LISTENING: 'LISTENING',
            THINKING: 'THINKING',
            SPEAKING: 'SPEAKING',
            HAPPY: 'HAPPY',
            CONCERNED: 'CONCERNED'
        };
        let currentState = State.IDLE;

        // ----- DOM REFS -----
        const wakeScreen = document.getElementById('wake-screen');
        const desktopScreen = document.getElementById('desktop-screen');
        const wakeCanvas = document.getElementById('wake-canvas');
        const desktopCanvas = document.getElementById('desktop-canvas');
        const windowsContainer = document.getElementById('windows-container');
        const stateBadge = document.getElementById('os-state');

        // ===================================================================
        //  1. AVATAR ENGINE (CANVAS) – LEBENDIG, KEIN EMOJI
        // ===================================================================
        class Avatar {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.w = canvas.width;
                this.h = canvas.height;
                this.blinkTimer = 0;
                this.isBlinking = false;
                this.breath = 0;
                this.mouthOpen = 0; // 0 = zu, 1 = offen
                this.eyeDirection = { x: 0, y: 0 }; // Blickrichtung zum Mauszeiger
                this.expression = 'neutral';
                this.glowIntensity = 0.3;
                this.targetGlow = 0.3;
                // Animation loop
                this.lastTime = 0;
                this.run = this.run.bind(this);
            }

            setState(state) {
                this.expression = state;
                switch(state) {
                    case State.LISTENING: this.targetGlow = 0.6; break;
                    case State.THINKING: this.targetGlow = 0.8; break;
                    case State.SPEAKING: this.targetGlow = 0.9; break;
                    case State.HAPPY: this.targetGlow = 0.7; break;
                    default: this.targetGlow = 0.3;
                }
            }

            // Mund synchron zur Sprache
            setMouth(open) {
                this.mouthOpen = Math.min(1, Math.max(0, open));
            }

            setEyeDirection(x, y) {
                this.eyeDirection.x = x * 0.6;
                this.eyeDirection.y = y * 0.6;
            }

            run(time) {
                const dt = Math.min(0.05, (time - this.lastTime) / 1000);
                this.lastTime = time;

                // Atmung
                this.breath += dt * 1.2;
                // Blinzeln (alle 3-5 Sekunden)
                this.blinkTimer += dt;
                if (this.blinkTimer > 3 + Math.random() * 2) {
                    this.isBlinking = true;
                    this.blinkTimer = 0;
                }
                if (this.isBlinking && this.blinkTimer > 0.15) {
                    this.isBlinking = false;
                }

                // Glow smoothing
                this.glowIntensity += (this.targetGlow - this.glowIntensity) * dt * 3;

                this.draw();
                requestAnimationFrame(this.run);
            }

            draw() {
                const ctx = this.ctx;
                const w = this.w, h = this.h;
                ctx.clearRect(0, 0, w, h);

                const cx = w/2, cy = h/2 - 20;
                const baseScale = 1 + Math.sin(this.breath) * 0.008; // Atmung

                // ----- GLOW (Cosmic Aura) -----
                const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 220);
                const alpha = 0.3 + this.glowIntensity * 0.4;
                grad.addColorStop(0, `rgba(80, 180, 255, ${alpha})`);
                grad.addColorStop(0.4, `rgba(40, 80, 200, ${alpha * 0.4})`);
                grad.addColorStop(1, `rgba(0,0,0,0)`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Sterne im Hintergrund (nur auf Wake-Screen)
                if (this.canvas.id === 'wake-canvas') {
                    this.drawStars(ctx, w, h);
                }

                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(baseScale, baseScale);

                // ----- KOPF (Cosmic-Stylisiert) -----
                const headR = 120;
                // Schatten / Tiefe
                ctx.shadowColor = 'rgba(0, 180, 255, 0.2)';
                ctx.shadowBlur = 40;

                // Kopf Grundform (abgerundetes Rechteck / Oval)
                ctx.beginPath();
                ctx.ellipse(0, 0, headR * 0.9, headR, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#141a2b';
                ctx.fill();
                ctx.strokeStyle = 'rgba(100, 200, 255, 0.15)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // ----- AUGEN (mit Blickrichtung) -----
                const eyeY = -25;
                const eyeOffsetX = 38;
                const eyeR = 18;
                const pupilR = 9;

                for (let side = -1; side <= 1; side += 2) {
                    const ex = side * eyeOffsetX + this.eyeDirection.x * 6;
                    const ey = eyeY + this.eyeDirection.y * 4;

                    // Augenweiß
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, eyeR, eyeR * 1.1, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#eef3fc';
                    ctx.fill();

                    // Iris (leuchtend)
                    const gradIris = ctx.createRadialGradient(
                        ex + this.eyeDirection.x * 4, ey + this.eyeDirection.y * 3, 2,
                        ex, ey, pupilR + 4
                    );
                    gradIris.addColorStop(0, '#6bc5ff');
                    gradIris.addColorStop(0.7, '#1a4b8c');
                    gradIris.addColorStop(1, '#0a1a3a');
                    ctx.beginPath();
                    ctx.arc(ex, ey, pupilR + 2, 0, Math.PI * 2);
                    ctx.fillStyle = gradIris;
                    ctx.fill();

                    // Pupille
                    ctx.beginPath();
                    ctx.arc(ex + this.eyeDirection.x * 5, ey + this.eyeDirection.y * 4, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#050a14';
                    ctx.fill();

                    // Lichtreflex
                    ctx.beginPath();
                    ctx.arc(ex + this.eyeDirection.x * 3 - 4, ey + this.eyeDirection.y * 2 - 5, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.fill();
                }

                // ----- BLINZELN (Augen zu) -----
                if (this.isBlinking) {
                    ctx.fillStyle = '#141a2b';
                    ctx.shadowBlur = 0;
                    for (let side = -1; side <= 1; side += 2) {
                        const ex = side * eyeOffsetX;
                        ctx.fillRect(ex - eyeR, eyeY - 4, eyeR * 2, 8);
                    }
                }

                // ----- MUND (synchron zur Sprache) -----
                const mouthY = 50;
                const mouthW = 30 + this.mouthOpen * 20;
                const mouthH = 6 + this.mouthOpen * 18;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                if (this.mouthOpen > 0.1) {
                    // Offener Mund (Oval)
                    ctx.ellipse(0, mouthY, mouthW/2, mouthH/2, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#0f1422';
                    ctx.fill();
                    // Unterlippe
                    ctx.strokeStyle = 'rgba(200, 220, 255, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else {
                    // Geschlossener Mund (Linie)
                    ctx.moveTo(-20, mouthY);
                    ctx.quadraticCurveTo(0, mouthY + 4, 20, mouthY);
                    ctx.strokeStyle = 'rgba(200, 220, 255, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // ----- WANGE / HIGHLIGHT (Cosmic) -----
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(100, 200, 255, 0.04)';
                ctx.beginPath();
                ctx.ellipse(-65, 20, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(65, 20, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // ----- HALDO LOGO / KRONE (als Identität) -----
                ctx.save();
                ctx.translate(cx, cy - headR - 20);
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(0, 180, 255, 0.3)';
                ctx.font = '24px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.fillText('◆', 0, 0);
                ctx.restore();
            }

            drawStars(ctx, w, h) {
                if (!this._stars) {
                    this._stars = [];
                    for (let i=0; i<80; i++) {
                        this._stars.push({
                            x: Math.random() * w,
                            y: Math.random() * h,
                            r: Math.random() * 1.5 + 0.5,
                            a: Math.random() * 0.8 + 0.2,
                            speed: 0.2 + Math.random() * 0.5
                        });
                    }
                }
                const time = Date.now() / 1000;
                this._stars.forEach(s => {
                    const flicker = 0.6 + 0.4 * Math.sin(time * s.speed + s.x);
                    ctx.globalAlpha = s.a * flicker;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
        }

        // ===================================================================
        //  2. COSMIC SOLAR SYSTEM (DESKTOP)
        // ===================================================================
        class SolarSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.w = canvas.width;
                this.h = canvas.height;
                this.planets = [];
                this.selectedPlanet = null;
                this.time = 0;

                // Planetendefinitionen (Name, App, Farbe, Distanz, Größe, Geschwindigkeit)
                const defs = [
                    { name: 'Merkur', app: 'system-timing', color: '#b0b8c0', dist: 140, size: 8, speed: 1.8 },
                    { name: 'Venus', app: 'kommunikation', color: '#e6b87e', dist: 190, size: 12, speed: 1.2 },
                    { name: 'Erde', app: 'benutzer', color: '#4d9de0', dist: 250, size: 14, speed: 1.0 },
                    { name: 'Mars', app: 'security', color: '#c45a3a', dist: 310, size: 10, speed: 0.8 },
                    { name: 'Jupiter', app: 'apps', color: '#d4a06a', dist: 380, size: 22, speed: 0.5 },
                    { name: 'Saturn', app: 'storage', color: '#e6d5a3', dist: 460, size: 19, speed: 0.4 },
                    { name: 'Uranus', app: 'automation', color: '#7ec8e3', dist: 540, size: 16, speed: 0.3 },
                    { name: 'Neptun', app: 'internet', color: '#3b5c9e', dist: 610, size: 15, speed: 0.2 },
                    { name: 'Pluto', app: 'recovery', color: '#b7a99a', dist: 680, size: 6, speed: 0.15 }
                ];

                this.planets = defs.map(d => ({
                    ...d,
                    angle: Math.random() * Math.PI * 2,
                    x: 0, y: 0
                }));
            }

            resize() {
                this.w = this.canvas.width = this.canvas.parentElement.clientWidth;
                this.h = this.canvas.height = this.canvas.parentElement.clientHeight;
            }

            getPlanetAt(mx, my) {
                const cx = this.w/2, cy = this.h/2;
                const threshold = 30;
                for (const p of this.planets) {
                    const dx = p.x - mx, dy = p.y - my;
                    if (dx*dx + dy*dy < (p.size + threshold) * (p.size + threshold)) {
                        return p;
                    }
                }
                return null;
            }

            update(time) {
                this.time += 0.01;
                const cx = this.w/2, cy = this.h/2;
                this.planets.forEach(p => {
                    p.angle += 0.01 * p.speed;
                    p.x = cx + Math.cos(p.angle) * p.dist;
                    p.y = cy + Math.sin(p.angle) * p.dist * 0.5; // elliptisch
                });
            }

            draw() {
                const ctx = this.ctx;
                const w = this.w, h = this.h;
                ctx.clearRect(0, 0, w, h);

                // Cosmic Hintergrund (Sterne)
                const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.7);
                grad.addColorStop(0, '#12172b');
                grad.addColorStop(1, '#05070a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // ----- SONNE = HALDO CORE (Mittelpunkt) -----
                const cx = w/2, cy = h/2;
                const sunR = 52;

                // Sonnen-Glow
                const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, sunR * 3);
                glow.addColorStop(0, 'rgba(100, 200, 255, 0.25)');
                glow.addColorStop(0.5, 'rgba(40, 100, 200, 0.08)');
                glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(cx, cy, sunR * 3, 0, Math.PI * 2);
                ctx.fill();

                // Sonnenkörper
                const sunGrad = ctx.createRadialGradient(cx-10, cy-10, 5, cx, cy, sunR);
                sunGrad.addColorStop(0, '#8ad0ff');
                sunGrad.addColorStop(0.5, '#3a8fd4');
                sunGrad.addColorStop(1, '#0a2a4a');
                ctx.shadowColor = 'rgba(0, 180, 255, 0.6)';
                ctx.shadowBlur = 60;
                ctx.beginPath();
                ctx.arc(cx, cy, sunR, 0, Math.PI * 2);
                ctx.fillStyle = sunGrad;
                ctx.fill();
                // HalDo Logo in der Sonne (als zentraler Knoten)
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.font = '28px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('☀', cx, cy-2);
                ctx.font = '10px sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillText('HALDO CORE', cx, cy + 38);

                // ----- ORBITS (dezent) -----
                this.planets.forEach(p => {
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, p.dist, p.dist * 0.5, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                });

                // ----- PLANETEN -----
                this.planets.forEach(p => {
                    // Glow
                    const pGlow = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.size * 2.5);
                    pGlow.addColorStop(0, p.color + '40');
                    pGlow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = pGlow;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Planet
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = p.color + '60';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    const grad = ctx.createRadialGradient(p.x-4, p.y-4, 2, p.x, p.y, p.size);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.3, p.color);
                    grad.addColorStop(1, '#0a0a1a');
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Name
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = '9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(p.name, p.x, p.y - p.size - 6);
                });

                // Interaktions-Hinweis
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('✦ Klick auf Planeten öffnet Apps ✦', cx, h - 30);
            }
        }

        // ===================================================================
        //  3. APP REGISTRY & WINDOW MANAGER
        // ===================================================================
        const AppRegistry = {
            'system-timing': { name: 'System Timing', icon: '⏱', content: '<h3>⏱ System Timing</h3><p>CPU: 2.4 GHz</p><p>RAM: 8.2 GB / 16 GB</p><p>Uptime: 4h 12m</p>' },
            'kommunikation': { name: 'Kommunikation', icon: '✉', content: '<h3>✉ Kommunikation</h3><p>Nachrichten: 3 ungelesen</p><p>Letzte Verbindung: HalDo Core</p>' },
            'benutzer': { name: 'Benutzer', icon: '👤', content: '<h3>👤 Benutzerprofil</h3><p>Willkommen, Bruder.</p><p>Dein digitaler Zwilling ist aktiv.</p>' },
            'security': { name: 'Security', icon: '🛡', content: '<h3>🛡 Security Center</h3><p>Firewall: Aktiv</p><p>Letzter Scan: sauber</p>' },
            'apps': { name: 'App World', icon: '📦', content: '<h3>📦 App World</h3><p>84 Apps installiert.</p><p>Kern-Apps: 12</p>' },
            'storage': { name: 'Storage', icon: '💾', content: '<h3>💾 Speicher</h3><p>Festplatte: 240 GB / 512 GB</p><p>Cloud: 1.2 TB</p>' },
            'automation': { name: 'Automation', icon: '⚙', content: '<h3>⚙ Automation</h3><p>Routinen: 5 aktiv</p><p>KI-Gesteuert: Ja</p>' },
            'internet': { name: 'Internet', icon: '🌐', content: '<h3>🌐 Internet Center</h3><p>Verbindung: 1.2 Gbps</p><p>IPv6: Aktiv</p>' },
            'recovery': { name: 'Recovery', icon: '♻', content: '<h3>♻ Recovery & Archive</h3><p>Letztes Backup: heute 02:00</p><p>Wiederherstellungspunkt: vorhanden</p>' }
        };

        class WindowManager {
            constructor(container) {
                this.container = container;
                this.windows = [];
                this.zIndex = 70;
                this.dragData = null;
                // Globale Event-Listener für Drag
                document.addEventListener('mousemove', this.onDrag.bind(this));
                document.addEventListener('mouseup', this.stopDrag.bind(this));
            }

            open(appKey) {
                const app = AppRegistry[appKey];
                if (!app) return;
                // Zufällige Position
                const w = 300 + Math.random() * 100;
                const h = 220 + Math.random() * 80;
                const x = 60 + Math.random() * (window.innerWidth - w - 120);
                const y = 60 + Math.random() * (window.innerHeight - h - 120);

                const win = document.createElement('div');
                win.className = 'os-window';
                win.style.width = w + 'px';
                win.style.height = h + 'px';
                win.style.left = x + 'px';
                win.style.top = y + 'px';
                win.style.zIndex = this.zIndex++;
                win.dataset.app = appKey;

                win.innerHTML = `
                    <div class="window-header">
                        <span class="window-title">${app.icon} ${app.name}</span>
                        <button class="window-close" data-close="${appKey}">✕</button>
                    </div>
                    <div class="window-body">${app.content}</div>
                `;

                this.container.appendChild(win);
                this.windows.push(win);

                // Close
                win.querySelector('.window-close').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.close(win);
                });

                // Drag
                const header = win.querySelector('.window-header');
                header.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.window-close')) return;
                    this.startDrag(e, win);
                });

                // Fokussieren
                win.addEventListener('mousedown', () => {
                    win.style.zIndex = this.zIndex++;
                });
            }

            close(win) {
                if (win) {
                    win.style.transition = 'opacity 0.25s, transform 0.25s';
                    win.style.opacity = '0';
                    win.style.transform = 'scale(0.9)';
                    setTimeout(() => { win.remove(); }, 300);
                }
            }

            startDrag(e, win) {
                const rect = win.getBoundingClientRect();
                this.dragData = {
                    win: win,
                    offsetX: e.clientX - rect.left,
                    offsetY: e.clientY - rect.top
                };
            }

            onDrag(e) {
                if (!this.dragData) return;
                const { win, offsetX, offsetY } = this.dragData;
                const containerRect = this.container.getBoundingClientRect();
                let nx = e.clientX - containerRect.left - offsetX;
                let ny = e.clientY - containerRect.top - offsetY;
                // Randbegrenzung
                nx = Math.max(0, Math.min(containerRect.width - win.offsetWidth, nx));
                ny = Math.max(0, Math.min(containerRect.height - win.offsetHeight, ny));
                win.style.left = nx + 'px';
                win.style.top = ny + 'px';
            }

            stopDrag() {
                this.dragData = null;
            }
        }

        // ===================================================================
        //  4. INITIALISIERUNG & VOICE
        // ===================================================================

        // ----- AVATAR (WAKE) -----
        const avatar = new Avatar(wakeCanvas);
        // Blick folgt Maus auf Wake-Screen
        wakeCanvas.addEventListener('mousemove', (e) => {
            const rect = wakeCanvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            avatar.setEyeDirection(x * 2 - 1, y * 2 - 1);
        });

        // ----- SOLAR SYSTEM (DESKTOP) -----
        const solar = new SolarSystem(desktopCanvas);
        const winManager = new WindowManager(windowsContainer);

        // ----- RESIZE -----
        function resizeAll() {
            solar.resize();
            // Wake-Canvas bleibt bei 600x700 (CSS skaliert)
        }
        window.addEventListener('resize', resizeAll);

        // ----- INTERAKTION: WAKE -> DESKTOP -----
        wakeScreen.addEventListener('click', () => {
            if (!wakeScreen.classList.contains('active')) return;
            wakeScreen.classList.remove('active');
            wakeScreen.classList.add('exit');
            desktopScreen.classList.add('active');
            // Voice Begrüßung im OS
            setTimeout(() => {
                setOSState(State.HAPPY);
                speakText('Hallo Bruder. Ich bin da. Willkommen im HalDo AI OS.', () => {
                    setOSState(State.IDLE);
                });
            }, 400);
            resizeAll();
            // Solar Animation starten
            animateDesktop();
        });

        // ----- DESKTOP INTERAKTION (Planeten klicken) -----
        desktopCanvas.addEventListener('click', (e) => {
            const rect = desktopCanvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const planet = solar.getPlanetAt(mx, my);
            if (planet) {
                setOSState(State.THINKING);
                const appKey = planet.app;
                const appName = AppRegistry[appKey]?.name || appKey;
                // Avatar reagiert (Mund kurz)
                setTimeout(() => {
                    winManager.open(appKey);
                    setOSState(State.HAPPY);
                    speakText(`Öffne ${appName}.`, () => {
                        setOSState(State.IDLE);
                    });
                }, 300);
            }
        });

        // ----- VOICE ENGINE (Web Speech) -----
        let isSpeaking = false;
        let speechQueue = [];

        function speakText(text, callback) {
            if (!window.speechSynthesis) {
                if (callback) callback();
                return;
            }
            // Avatar Mund bewegt sich
            avatar.setState(State.SPEAKING);
            setOSState(State.SPEAKING);

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;

            // Mund-Synchronisation (simuliert)
            let mouthInterval = setInterval(() => {
                avatar.setMouth(0.3 + Math.random() * 0.6);
            }, 100);

            utterance.onend = () => {
                clearInterval(mouthInterval);
                avatar.setMouth(0);
                avatar.setState(State.IDLE);
                setOSState(State.IDLE);
                if (callback) callback();
            };
            utterance.onerror = () => {
                clearInterval(mouthInterval);
                avatar.setMouth(0);
                avatar.setState(State.IDLE);
                setOSState(State.IDLE);
                if (callback) callback();
            };
            window.speechSynthesis.speak(utterance);
        }

        // ----- VOICE RECOGNITION (Wake Word: "Hallo HalDo") -----
        function initVoiceRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                console.warn('Voice Recognition nicht unterstützt.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const last = event.results.length - 1;
                const transcript = event.results[last][0].transcript.toLowerCase().trim();
                console.log('Gehört:', transcript);
                if (transcript.includes('hallo haldo') || transcript.includes('haldo')) {
                    // Avatar wacht auf / reagiert
                    if (wakeScreen.classList.contains('active')) {
                        // Wenn noch im Wake-Screen
                        avatar.setState(State.LISTENING);
                        speakText('Ja Bruder, ich bin wach.', () => {
                            avatar.setState(State.IDLE);
                            // Automatisch zum Desktop wechseln, falls nicht geschehen
                            if (wakeScreen.classList.contains('active')) {
                                wakeScreen.click();
                            }
                        });
                    } else {
                        // Im Desktop
                        setOSState(State.LISTENING);
                        speakText('Ich höre, Bruder. Was kann ich tun?', () => {
                            setOSState(State.IDLE);
                        });
                    }
                } else if (transcript.includes('öffne')) {
                    // Simple App-Öffnung per Sprache
                    const parts = transcript.split('öffne');
                    if (parts.length > 1) {
                        const query = parts[1].trim();
                        for (const [key, app] of Object.entries(AppRegistry)) {
                            if (query.includes(app.name.toLowerCase()) || query.includes(key)) {
                                setOSState(State.THINKING);
                                setTimeout(() => {
                                    winManager.open(key);
                                    setOSState(State.HAPPY);
                                    speakText(`Öffne ${app.name}.`, () => setOSState(State.IDLE));
                                }, 300);
                                break;
                            }
                        }
                    }
                }
            };

            recognition.onerror = (e) => {
                console.warn('Voice Error:', e.error);
                // Bei Fehler neu starten
                setTimeout(() => recognition.start(), 1000);
            };

            recognition.start();
            console.log('Voice Recognition gestartet. Sag "Hallo HalDo"');
        }

        // ----- OS STATE BADGE -----
        function setOSState(state) {
            currentState = state;
            const label = state.replace('_', ' ');
            stateBadge.textContent = `● ${label}`;
            avatar.setState(state);
            // Farbänderung
            if (state === State.LISTENING || state === State.SPEAKING) {
                stateBadge.style.color = '#6bc5ff';
                stateBadge.style.borderColor = 'rgba(0,200,255,0.3)';
            } else if (state === State.THINKING) {
                stateBadge.style.color = '#ffb347';
                stateBadge.style.borderColor = 'rgba(255,180,70,0.3)';
            } else {
                stateBadge.style.color = 'rgba(255,255,255,0.4)';
                stateBadge.style.borderColor = 'rgba(255,255,255,0.05)';
            }
        }

        // ----- ANIMATION LOOPS -----
        function animateDesktop(time) {
            if (!desktopScreen.classList.contains('active')) return;
            solar.update(time);
            solar.draw();
            requestAnimationFrame(animateDesktop);
        }

        // ----- START -----
        function init() {
            resizeAll();
            // Avatar starten
            avatar.run(performance.now());
            // Wake Screen aktiv setzen
            wakeScreen.classList.add('active');
            // Voice starten
            initVoiceRecognition();

            // Windows initial öffnen (Beispiel)
            setTimeout(() => {
                // Kleiner Hinweis: nach 2 Sekunden öffnet sich die Erde (Benutzer)
                if (desktopScreen.classList.contains('active')) {
                    winManager.open('benutzer');
                }
            }, 3000);
        }

        // Alles starten
        init();

        // Globales Debug
        console.log(`HalDo AI OS ${VERSION} geladen. 💙❤️🚀`);
    </script>
</body>
