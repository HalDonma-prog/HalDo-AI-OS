<script>

"use strict";

/* =========================================================
   HALDO PROFESSIONAL AI UI
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};


window.HalDo.ProfessionalAI =
{

    window:
        null,

    messages:
        null,

    input:
        null,

    avatar:
        null,

    initialized:
        false,

    state:
        "idle",


    /* =====================================================
       INITIALIZE
       ===================================================== */

    init()
    {

        if (
            this.initialized
        ) {

            return;
        }


        this.create();

        this.initialized =
            true;
    },


    /* =====================================================
       CREATE WINDOW
       ===================================================== */

    create()
    {

        if (
            document.querySelector(
                "[data-haldo-ai-window]"
            )
        ) {

            this.window =
                document.querySelector(
                    "[data-haldo-ai-window]"
                );

            this.cache();

            return;
        }


        const element =
            document.createElement(
                "section"
            );

        element.className =
            "haldo-ai-window";

        element.dataset.haldoAiWindow =
            "true";

        element.setAttribute(
            "role",
            "dialog"
        );

        element.setAttribute(
            "aria-modal",
            "true"
        );

        element.setAttribute(
            "aria-label",
            "HalDo AI"
        );


        element.innerHTML = `

            <header
                class="haldo-ai-header"
            >

                <div
                    class="haldo-ai-header-avatar"
                >

                    <img
                        src="assets/logo/logo.png"
                        alt="HalDo AI"
                    >

                </div>


                <div
                    class="haldo-ai-title-area"
                >

                    <h2
                        class="haldo-ai-title"
                    >
                        HalDo AI
                    </h2>

                    <div
                        class="haldo-ai-subtitle"
                        data-haldo-ai-status
                    >
                        Bereit · Ich höre dir zu
                    </div>

                </div>


                <div
                    class="haldo-ai-header-actions"
                >

                    <button
                        class="haldo-ai-header-button"
                        type="button"
                        data-haldo-ai-minimize
                        aria-label="Minimieren"
                    >
                        −
                    </button>

                    <button
                        class="haldo-ai-header-button"
                        type="button"
                        data-haldo-ai-close
                        aria-label="Schließen"
                    >
                        ×
                    </button>

                </div>

            </header>


            <div
                class="haldo-ai-body"
            >

                <aside
                    class="haldo-ai-avatar-panel"
                >

                    <div
                        class="haldo-ai-avatar-stage"
                        data-state="idle"
                    >

                        <div
                            class="haldo-ai-avatar-aura"
                        ></div>

                        <img
                            class="haldo-ai-avatar"
                            src="assets/logo/logo.png"
                            alt="Lebendiger HalDo AI Avatar"
                        >

                    </div>

                </aside>


                <main
                    class="haldo-ai-chat-area"
                >

                    <div
                        class="haldo-ai-messages"
                        data-haldo-ai-messages
                    >

                        <div
                            class="haldo-ai-message ai"
                        >

                            <div
                                class="haldo-ai-message-bubble"
                            >
                                Hallo. Ich bin HalDo AI. 💙❤️
                                <br><br>
                                Du kannst mit mir schreiben,
                                Fragen stellen, Ideen entwickeln
                                oder mich bitten, Apps und
                                Funktionen des Systems zu öffnen.
                            </div>

                        </div>

                    </div>


                    <div
                        class="haldo-ai-input-area"
                    >

                        <div
                            class="haldo-ai-quick-actions"
                        >

                            <button
                                class="haldo-ai-quick"
                                type="button"
                                data-haldo-ai-quick="Öffne die Einstellungen."
                            >
                                Einstellungen
                            </button>

                            <button
                                class="haldo-ai-quick"
                                type="button"
                                data-haldo-ai-quick="Öffne den Dateimanager."
                            >
                                Dateien
                            </button>

                            <button
                                class="haldo-ai-quick"
                                type="button"
                                data-haldo-ai-quick="Zeige mir meine Apps."
                            >
                                Apps
                            </button>

                            <button
                                class="haldo-ai-quick"
                                type="button"
                                data-haldo-ai-quick="Erkläre mir HalDo AI."
                            >
                                Über HalDo
                            </button>

                        </div>


                        <div
                            class="haldo-ai-input-row"
                        >

                            <textarea
                                class="haldo-ai-input"
                                data-haldo-ai-input
                                rows="1"
                                placeholder="Schreibe etwas an HalDo AI …"
                                aria-label="Nachricht an HalDo AI"
                            ></textarea>


                            <button
                                class="haldo-ai-action"
                                type="button"
                                data-haldo-ai-voice
                                aria-label="Spracheingabe"
                                title="Spracheingabe"
                            >
                                🎙
                            </button>


                            <button
                                class="haldo-ai-action haldo-ai-send"
                                type="button"
                                data-haldo-ai-send
                                aria-label="Nachricht senden"
                                title="Senden"
                            >
                                ➤
                            </button>

                        </div>

                    </div>

                </main>

            </div>
        `;


        document.body.appendChild(
            element
        );


        this.window =
            element;

        this.cache();

        this.bind();
    },


    /* =====================================================
       CACHE
       ===================================================== */

    cache()
    {

        if (
            !this.window
        ) {
            return;
        }


        this.messages =
            this.window.querySelector(
                "[data-haldo-ai-messages]"
            );

        this.input =
            this.window.querySelector(
                "[data-haldo-ai-input]"
            );

        this.avatar =
            this.window.querySelector(
                ".haldo-ai-avatar-stage"
            );
    },


    /* =====================================================
       EVENTS
       ===================================================== */

    bind()
    {

        this.window
            .querySelector(
                "[data-haldo-ai-close]"
            )
            ?.addEventListener(
                "click",
                () => this.close()
            );


        this.window
            .querySelector(
                "[data-haldo-ai-minimize]"
            )
            ?.addEventListener(
                "click",
                () => this.minimize()
            );


        this.window
            .querySelector(
                "[data-haldo-ai-send]"
            )
            ?.addEventListener(
                "click",
                () => this.send()
            );


        this.input
            ?.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();

                        this.send();
                    }
                }
            );


        this.window
            .querySelectorAll(
                "[data-haldo-ai-quick]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            this.input.value =
                                button.dataset.haldoAiQuick ||
                                "";

                            this.send();
                        }
                    );
                }
            );


        this.window
            .querySelector(
                "[data-haldo-ai-voice]"
            )
            ?.addEventListener(
                "click",
                () => this.startVoice()
            );


        document.addEventListener(
            "haldo:ai:open",
            () => this.open()
        );
    },


    /* =====================================================
       OPEN
       ===================================================== */

    open()
    {

        this.init();

        this.window.classList.add(
            "is-open"
        );

        this.setState(
            "listening"
        );


        setTimeout(
            () => {

                this.input?.focus();

            },
            250
        );
    },


    /* =====================================================
       CLOSE
       ===================================================== */

    close()
    {

        if (
            !this.window
        ) {
            return;
        }

        this.window.classList.remove(
            "is-open"
        );

        this.setState(
            "idle"
        );
    },


    /* =====================================================
       MINIMIZE
       ===================================================== */

    minimize()
    {

        this.close();
    },


    /* =====================================================
       STATE
       ===================================================== */

    setState(
        state
    )
    {

        this.state =
            state ||
            "idle";

        this.avatar &&
            (
                this.avatar.dataset.state =
                    this.state
            );


        const status =
            this.window
                ?.querySelector(
                    "[data-haldo-ai-status]"
                );


        if (
            !status
        ) {
            return;
        }


        const labels =
        {

            idle:
                "Bereit · HalDo AI",

            listening:
                "Ich höre dir zu …",

            thinking:
                "HalDo AI denkt …",

            speaking:
                "HalDo AI spricht …",

            happy:
                "Freut mich. 💙❤️",

            selecting:
                "Ich öffne die gewünschte Funktion …"

        };


        status.textContent =
            labels[
                this.state
            ] ||
            labels.idle;
    },


    /* =====================================================
       SEND
       ===================================================== */

    send()
    {

        const text =
            String(
                this.input?.value ||
                ""
            ).trim();


        if (
            !text
        ) {
            return;
        }


        this.addMessage(
            "user",
            text
        );


        this.input.value =
            "";


        this.setState(
            "thinking"
        );


        this.routeCommand(
            text
        );
    },


    /* =====================================================
       ADD MESSAGE
       ===================================================== */

    addMessage(
        type,
        text
    )
    {

        if (
            !this.messages
        ) {
            return;
        }


        const message =
            document.createElement(
                "div"
            );

        message.className =
            "haldo-ai-message " +
            (
                type ===
                "user"
                    ?
                "user"
                    :
                "ai"
            );


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "haldo-ai-message-bubble";

        bubble.textContent =
            text;


        message.appendChild(
            bubble
        );


        this.messages.appendChild(
            message
        );


        this.messages.scrollTop =
            this.messages.scrollHeight;
    },


    /* =====================================================
       THINKING
       ===================================================== */

    thinking()
    {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "haldo-ai-message ai";

        message.dataset.haldoThinking =
            "true";


        message.innerHTML = `

            <div
                class="haldo-ai-thinking-indicator"
            >

                <span></span>
                <span></span>
                <span></span>

            </div>
        `;


        this.messages.appendChild(
            message
        );


        this.messages.scrollTop =
            this.messages.scrollHeight;
    },


    /* =====================================================
       COMMAND ROUTER
       ===================================================== */

    routeCommand(
        text
    )
    {

        const normalized =
            text
                .toLowerCase()
                .trim();


        if (
            normalized.includes(
                "einstellung"
            )
        ) {

            this.openApplication(
                [
                    "settings",
                    "haldo-settings",
                    "settings-app"
                ]
            );

            this.respond(
                "Natürlich. Ich öffne die Einstellungen für dich."
            );

            return;
        }


        if (
            normalized.includes(
                "datei"
            ) ||
            normalized.includes(
                "file"
            )
        ) {

            this.openApplication(
                [
                    "file-manager",
                    "files",
                    "filemanager"
                ]
            );

            this.respond(
                "Ich öffne den Dateimanager."
            );

            return;
        }


        if (
            normalized.includes(
                "app"
            ) ||
            normalized.includes(
                "anwendung"
            )
        ) {

            this.openApplication(
                [
                    "app-launcher",
                    "apps",
                    "launcher"
                ]
            );

            this.respond(
                "Ich öffne deine Apps."
            );

            return;
        }


        if (
            normalized.includes(
                "sprache"
            ) ||
            normalized.includes(
                "voice"
            )
        ) {

            this.startVoice();

            this.respond(
                "Die Spracheingabe ist bereit."
            );

            return;
        }


        /*
         * Existing AI systems are preferred.
         */

        if (
            typeof window.HalDo
                ?.AI?.ask ===
            "function"
        ) {

            Promise
                .resolve(
                    window.HalDo.AI.ask(
                        text
                    )
                )
                .then(
                    answer => {

                        this.respond(
                            answer ||
                            "Ich bin für dich da."
                        );
                    }
                )
                .catch(
                    () => {

                        this.respond(
                            this.localResponse(
                                text
                            )
                        );
                    }
                );

            return;
        }


        if (
            typeof window.HalDo
                ?.AI?.chat ===
            "function"
        ) {

            Promise
                .resolve(
                    window.HalDo.AI.chat(
                        text
                    )
                )
                .then(
                    answer => {

                        this.respond(
                            answer ||
                            "Ich bin für dich da."
                        );
                    }
                )
                .catch(
                    () => {

                        this.respond(
                            this.localResponse(
                                text
                            )
                        );
                    }
                );

            return;
        }


        this.respond(
            this.localResponse(
                text
            )
        );
    },


    /* =====================================================
       APPLICATION OPENING
       ===================================================== */

    openApplication(
        names
    )
    {

        this.setState(
            "selecting"
        );


        const candidates =
            Array.isArray(
                names
            )
                ?
            names
                :
            [
                names
            ];


        for (
            const name
            of candidates
        ) {

            if (
                typeof window.HalDo
                    ?.AppManager?.openApp ===
                "function"
            ) {

                try {

                    window.HalDo.AppManager.openApp(
                        name
                    );

                    return;
                }

                catch (
                    error
                ) {

                    console.warn(
                        "[HalDo AI] AppManager open failed:",
                        error
                    );
                }
            }


            if (
                typeof window.HalDo
                    ?.AppRouter?.open ===
                "function"
            ) {

                try {

                    window.HalDo.AppRouter.open(
                        name
                    );

                    return;
                }

                catch (
                    error
                ) {

                    console.warn(
                        "[HalDo AI] AppRouter open failed:",
                        error
                    );
                }
            }


            if (
                typeof window.HalDo
                    ?.Launcher?.open ===
                "function"
            ) {

                try {

                    window.HalDo.Launcher.open(
                        name
                    );

                    return;
                }

                catch (
                    error
                ) {

                    console.warn(
                        "[HalDo AI] Launcher open failed:",
                        error
                    );
                }
            }


            const event =
                new CustomEvent(
                    "haldo:app:open",
                    {
                        detail:
                        {
                            app:
                                name
                        }
                    }
                );


            document.dispatchEvent(
                event
            );
        }
    },


    /* =====================================================
       AI RESPONSE
       ===================================================== */

    respond(
        text
    )
    {

        const thinking =
            this.messages
                ?.querySelector(
                    "[data-haldo-thinking]"
                );


        thinking?.remove();


        this.setState(
            "speaking"
        );


        const answer =
            String(
                text ||
                "Ich bin für dich da."
            );


        this.addMessage(
            "ai",
            answer
        );


        this.speak(
            answer
        );


        setTimeout(
            () => {

                this.setState(
                    "idle"
                );

            },
            900
        );
    },


    /* =====================================================
       LOCAL RESPONSE FALLBACK
       ===================================================== */

    localResponse(
        text
    )
    {

        const normalized =
            String(
                text ||
                ""
            ).toLowerCase();


        if (
            normalized.includes(
                "hallo"
            ) ||
            normalized.includes(
                "hi"
            )
        ) {

            return (
                "Hallo! Schön, dass du da bist. " +
                "Ich bin HalDo AI und begleite dich " +
                "durch dein System."
            );
        }


        if (
            normalized.includes(
                "wer bist"
            )
        ) {

            return (
                "Ich bin HalDo AI – die intelligente " +
                "Assistenz deines HalDo AI OS."
            );
        }


        if (
            normalized.includes(
                "danke"
            )
        ) {

            return (
                "Sehr gerne. 💙❤️ " +
                "Ich bin jederzeit für dich da."
            );
        }


        return (
            "Ich habe deine Nachricht verstanden. " +
            "Die Verbindung zu den vorhandenen HalDo-" +
            "AI-Systemen wird bevorzugt verwendet. " +
            "Du kannst mich fragen, etwas erklären lassen " +
            "oder eine Systemfunktion öffnen lassen."
        );
    },


    /* =====================================================
       SPEECH
       ===================================================== */

    speak(
        text
    )
    {

        if (
            typeof window.speechSynthesis !==
            "undefined"
        ) {

            try {

                window.speechSynthesis.cancel();

                const utterance =
                    new SpeechSynthesisUtterance(
                        text
                    );

                utterance.lang =
                    this.detectLanguage(
                        text
                    );

                utterance.rate =
                    .94;

                utterance.pitch =
                    1.02;

                utterance.volume =
                    .8;


                utterance.onstart =
                    () => {

                        this.setState(
                            "speaking"
                        );
                    };


                utterance.onend =
                    () => {

                        this.setState(
                            "idle"
                        );
                    };


                window.speechSynthesis.speak(
                    utterance
                );
            }

            catch (
                error
            ) {

                console.warn(
                    "[HalDo AI] Speech failed:",
                    error
                );
            }
        }
    },


    /* =====================================================
       LANGUAGE DETECTION
       ===================================================== */

    detectLanguage(
        text
    )
    {

        const value =
            String(
                text ||
                ""
            ).toLowerCase();


        if (
            /[äöüß]/.test(
                value
            )
        ) {

            return "de-DE";
        }


        if (
            /\b(hello|the|and|you|what|how)\b/.test(
                value
            )
        ) {

            return "en-US";
        }


        return (
            document.documentElement
                ?.lang ||
            "de-DE"
        );
    },


    /* =====================================================
       VOICE INPUT
       ===================================================== */

    startVoice()
    {

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (
            !Recognition
        ) {

            this.respond(
                "Die Spracheingabe wird von diesem Browser nicht unterstützt."
            );

            return;
        }


        const recognition =
            new Recognition();


        recognition.lang =
            document.documentElement
                ?.lang ===
                "en"
                    ?
                "en-US"
                    :
                "de-DE";


        recognition.interimResults =
            false;

        recognition.continuous =
            false;


        this.setState(
            "listening"
        );


        recognition.onresult =
            event => {

                const result =
                    event
                        .results?.[0]?.[0]?.transcript ||
                    "";


                if (
                    result
                ) {

                    this.input.value =
                        result;

                    this.send();
                }
            };


        recognition.onerror =
            () => {

                this.setState(
                    "idle"
                );
            };


        recognition.onend =
            () => {

                if (
                    this.state ===
                    "listening"
                ) {

                    this.setState(
                        "idle"
                    );
                }
            };


        try {

            recognition.start();

        }

        catch (
            error
        ) {

            console.warn(
                "[HalDo AI] Recognition failed:",
                error
            );

            this.setState(
                "idle"
            );
        }
    }
};


/* =========================================================
   GLOBAL OPEN API
   ========================================================= */

window.HalDo.openProfessionalAI =
function()
{

    window.HalDo.ProfessionalAI.init();

    window.HalDo.ProfessionalAI.open();
};


/* =========================================================
   CONNECT COSMIC SUN
   ========================================================= */

document.addEventListener(
    "haldo:ai:open",
    () => {

        window.HalDo.openProfessionalAI();

    }
);


/* =========================================================
   AUTO INIT
   ========================================================= */

function haldoInitializeProfessionalAI()
{

    window.HalDo.ProfessionalAI.init();
}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoInitializeProfessionalAI,
        {
            once:
                true
        }
    );

}

else {

    haldoInitializeProfessionalAI();

}

</script>

<script>

"use strict";

/* =========================================================
   COSMIC WORLD CONTROLLER
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};


window.HalDo.CosmicWorld =
{

    root:
        null,

    sun:
        null,

    initialized:
        false,


    /* =====================================================
       INITIALIZE
       ===================================================== */

    init()
    {

        if (
            this.initialized
        ) {

            return;
        }


        this.findRoot();


        if (
            !this.root
        ) {

            this.createFallbackWorld();
        }


        this.sun =
            this.root?.querySelector(
                "[data-haldo-cosmic-sun]"
            );


        this.buildRays();

        this.buildStars();

        this.bindSun();


        this.initialized =
            true;
    },


    /* =====================================================
       FIND EXISTING COSMIC WORLD
       ===================================================== */

    findRoot()
    {

        this.root =
            document.querySelector(
                "[data-haldo-cosmic-world]"
            );
    },


    /* =====================================================
       FALLBACK WORLD
       ===================================================== */

    createFallbackWorld()
    {

        const world =
            document.createElement(
                "section"
            );

        world.className =
            "haldo-cosmic-world";

        world.dataset.haldoCosmicWorld =
            "true";


        world.innerHTML = `

            <div
                class="haldo-cosmic-stars"
                data-haldo-stars
            ></div>

            <div
                class="haldo-sun-rays"
                data-haldo-sun-rays
            ></div>

            <div
                class="haldo-orbit haldo-orbit-1"
            ></div>

            <div
                class="haldo-orbit haldo-orbit-2"
            ></div>

            <div
                class="haldo-orbit haldo-orbit-3"
            ></div>

            <div
                class="haldo-orbit haldo-orbit-4"
            ></div>

            <div
                class="haldo-orbit haldo-orbit-5"
            ></div>

            <div
                class="haldo-planet haldo-planet-1"
            ></div>

            <div
                class="haldo-planet haldo-planet-2"
            ></div>

            <div
                class="haldo-planet haldo-planet-3"
            ></div>

            <div
                class="haldo-earth-system"
            >

                <div
                    class="haldo-earth"
                >

                    <div
                        class="haldo-moon-orbit"
                    >

                        <div
                            class="haldo-moon"
                        ></div>

                    </div>

                </div>

            </div>

            <div
                class="haldo-planet haldo-planet-4"
            ></div>

            <div
                class="haldo-planet haldo-planet-5"
            ></div>

            <button
                class="haldo-cosmic-sun"
                type="button"
                data-haldo-cosmic-sun
                aria-label="HalDo AI öffnen"
            >

                <img
                    class="haldo-sun-logo"
                    src="assets/logo/logo.png"
                    alt="HalDo"
                >

            </button>
        `;


        document.body.prepend(
            world
        );


        this.root =
            world;
    },


    /* =====================================================
       365 SUN RAYS
       ===================================================== */

    buildRays()
    {

        const container =
            this.root?.querySelector(
                "[data-haldo-sun-rays]"
            );


        if (
            !container ||
            container.children.length
        ) {

            return;
        }


        const fragment =
            document.createDocumentFragment();


        for (
            let index = 0;
            index < 365;
            index++
        ) {

            const ray =
                document.createElement(
                    "span"
                );

            ray.className =
                "haldo-sun-ray";

            ray.style.transform =
                `translateX(-50%) rotate(${index}deg)`;


            if (
                index %
                7 ===
                0
            ) {

                ray.style.opacity =
                    ".82";
            }


            fragment.appendChild(
                ray
            );
        }


        container.appendChild(
            fragment
        );
    },


    /* =====================================================
       STARS
       ===================================================== */

    buildStars()
    {

        const container =
            this.root?.querySelector(
                "[data-haldo-stars]"
            );


        if (
            !container ||
            container.children.length
        ) {

            return;
        }


        const fragment =
            document.createDocumentFragment();


        const count =
            window.innerWidth <
            600
                ?
            75
                :
            150;


        for (
            let index = 0;
            index < count;
            index++
        ) {

            const star =
                document.createElement(
                    "span"
                );

            star.className =
                "haldo-cosmic-star";


            const size =
                Math.random() *
                2.2 +
                .5;


            const opacity =
                Math.random() *
                .65 +
                .25;


            const speed =
                Math.random() *
                4 +
                2;


            star.style.left =
                `${Math.random() * 100}%`;

            star.style.top =
                `${Math.random() * 100}%`;

            star.style.setProperty(
                "--star-size",
                `${size}px`
            );

            star.style.setProperty(
                "--star-opacity",
                opacity
            );

            star.style.setProperty(
                "--star-speed",
                `${speed}s`
            );


            fragment.appendChild(
                star
            );
        }


        container.appendChild(
            fragment
        );
    },


    /* =====================================================
       SUN → HALDO AI
       ===================================================== */

    bindSun()
    {

        if (
            !this.sun
        ) {
            return;
        }


        this.sun.addEventListener(
            "click",
            event => {

                event.preventDefault();

                this.openAI();
            }
        );


        this.sun.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" ||
                    event.key ===
                    " "
                ) {

                    event.preventDefault();

                    this.openAI();
                }
            }
        );
    },


    /* =====================================================

       ===================================================== */

    openAI()
    {

        document.dispatchEvent(
            new CustomEvent(
                "haldo:ai:open",
                {
                    detail:
                    {
                        source:
                            "cosmic-sun"
                    }
                }
            )
        );


        if (
            typeof window.HalDo
                ?.openProfessionalAI ===
            "function"
        ) {

            window.HalDo.openProfessionalAI();

            return;
        }


        if (
            typeof window.HalDo
                ?.ProfessionalAI
                ?.open ===
            "function"
        ) {

            window.HalDo.ProfessionalAI.open();
        }
    }
};


/* =========================================================

function haldoInitializeCosmicWorld()
{

    try {

    }

    catch (
        error
    ) {

        console.error(
            "[HalDo Cosmic World] Initialization failed:",
            error
        );

}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoInitializeCosmicWorld,
        {
            once:
                true
        }
    );

}

else {

    haldoInitializeCosmicWorld();

}

    init()

        if (
            this.initialized
        ) {

            return;

        this.apps =
            this.getMergedApps();


        this.createLayer();

        this.createMenus();

        this.initialized =
            true;
    },


    /* =====================================================
       MERGE EXISTING REGISTRIES
       ===================================================== */

    getMergedApps()
    {

        const result =
            new Map();


        this.catalog.forEach(
            app => {

                result.set(
                    app.id,
                    {
                        ...app
                    }
                );
            }
        );


        const registries =
        [

            window.HalDo?.AppRegistry,

            window.HalDo?.appRegistry,

            window.HalDo?.V20?.AppRegistry,

            window.HalDo?.V20AppRegistry

        ];


        for (
            const registry
            of registries
        ) {

            if (
                !registry
            ) {
                continue;
            }


            let list = [];


            if (
                Array.isArray(
                    registry.apps
                )
            ) {

                list =
                    registry.apps;
            }

            else if (
                typeof registry.getAll ===
                "function"
            ) {

                try {

                    list =
                        registry.getAll();

                }

                catch (
                    error
                ) {

                    console.warn(
                        "[HalDo Apps] Registry read failed:",
                        error
                    );
                }
            }


            if (
                !Array.isArray(
                    list
                )
            ) {

                continue;
            }


            list.forEach(
                app => {

                    if (
                        !app
                    ) {
                        return;
                    }


                    const id =
                        app.id ||
                        app.appId ||
                        app.name;


                    if (
                        !id
                    ) {
                        return;
                    }


                    result.set(
                        id,
                        {
                            ...(
                                result.get(
                                    id
                                ) ||
                                {}
                            ),
                            ...app
                        }
                    );
                }
            );
        }


        return Array.from(
            result.values()
        );
    },


    /* =====================================================

        this.layer =

        this.layer.className =
            "haldo-app-window-layer";

        this.layer.dataset.haldoAppWindowLayer =
            "true";


        document.body.appendChild(
            this.layer

       APP MENU
       ===================================================== */

    renderApps()
    {

        const list =
            document.querySelector(
                "[data-haldo-app-list]"
            );


        if (
            !list
        ) {
            return;
        }


        list.innerHTML =
            this.apps
                .map(
                    app => {

                        const icon =
                            app.icon ||
                            "◈";


                        const iconMarkup =
                            String(
                                icon
                            ).includes(
                                "/"
                            )
                                ?
                            `
                                <img
                                    src="${icon}"
                                    alt=""
                                    style="
                                        width:28px;
                                        height:28px;
                                        object-fit:contain;
                                    "
                                >
                            `
                                :
                            icon;


                        return `

                            <button
                                class="haldo-app-card"
                                type="button"
                                data-haldo-open-app="${app.id}"
                            >

                                <div
                                    class="haldo-app-card-icon"
                                >
                                    ${iconMarkup}
                                </div>

                                <div
                                    class="haldo-app-card-title"
                                >
                                    ${this.escape(
                                        app.title ||
                                        app.name ||
                                        app.id
                                    )}
                                </div>

                                <div
                                    class="haldo-app-card-description"
                                >
                                    ${this.escape(
                                        app.description ||
                                        "HalDo Anwendung"
                                    )}
                                </div>

                            </button>

                        `;
                    }
                )
                .join("");
    },


    /* =====================================================
       MENU EVENTS
       ===================================================== */

    bindMenus()
    {

        document
            .querySelectorAll(
                "[data-haldo-system-menu-button]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const type =
                                button.dataset
                                    .haldoSystemMenuButton;


                            this.toggleMenu(
                                type
                            );
                        }
                    );
                }
            );


        document
            .querySelectorAll(
                "[data-haldo-menu-close]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            this.closeMenus();
                        }
                    );
                }
            );


        document.addEventListener(
            "click",
            event => {

                const target =
                    event.target.closest(
                        "[data-haldo-open-app]"
                    );


                if (
                    target
                ) {

                    this.open(
                        target.dataset.haldoOpenApp
                    );

                    this.closeMenus();
                }
            }
        );
    },


    toggleMenu(
        type
    )
    {

        const menu =
            document.querySelector(
                `[data-haldo-system-menu="${type}"]`
            );


        if (
            !menu
        ) {
            return;
        }


        const open =
            menu.classList.contains(
                "open"
            );


        this.closeMenus();


        if (
            !open
        ) {

            menu.classList.add(
                "open"
            );
        }
    },


    closeMenus()
    {

        document
            .querySelectorAll(
                "[data-haldo-system-menu]"
            )
            .forEach(
                menu => {

                    menu.classList.remove(
                        "open"
                    );
                }
            );
    },


    /* =====================================================
       OPEN APP
       ===================================================== */

    open(
        appId
    )
    {

        if (
            !appId
        ) {
            return;
        }


        if (
            appId ===
            "haldo-ai"
        ) {

            window.HalDo?.openProfessionalAI?.();

            return;
        }


        /*
         * Prefer existing real application systems.
         */

        const manager =
            window.HalDo?.AppManager;


        if (
            manager &&
            typeof manager.openApp ===
            "function"
        ) {

            try {

                manager.openApp(
                    appId
                );

                return;

            }

            catch (
                error
            ) {

                console.warn(
                    "[HalDo Apps] AppManager failed:",
                    error
                );
            }
        }


        const router =
            window.HalDo?.AppRouter;


        if (
            router &&
            typeof router.open ===
            "function"
        ) {

            try {

                router.open(
                    appId
                );

                return;

            }

            catch (
                error
            ) {

                console.warn(
                    "[HalDo Apps] AppRouter failed:",
                    error
                );
            }
        }


        /*
         * Universal fallback window.
         */

        this.openFallbackWindow(
            appId
        );
    },


    /* =====================================================
       FALLBACK WINDOW
       ===================================================== */

    openFallbackWindow(
        appId
    )
    {

        const app =
            this.apps.find(
                item =>
                    item.id ===
                    appId
            ) ||
            {
                id:
                    appId,

                title:
                    appId,

                description:
                    "HalDo Anwendung"
            };


        const existing =
            this.windows.get(
                appId
            );


        if (
            existing
        ) {

            existing.classList.add(
                "open"
            );

            return;
        }


        const windowElement =
            document.createElement(
                "section"
            );

        windowElement.className =
            "haldo-app-window open";

        windowElement.dataset.haldoAppId =
            appId;


        const icon =
            app.icon ||
            "◈";


        const iconMarkup =
            String(
                icon
            ).includes(
                "/"
            )
                ?
            `
                <img
                    src="${icon}"
                    alt=""
                >
            `
                :
            icon;


        windowElement.innerHTML = `

            <header
                class="haldo-app-header"
            >

                <div
                    class="haldo-app-icon"
                >
                    ${iconMarkup}
                </div>


                <div
                    class="haldo-app-title"
                >
                    ${this.escape(
                        app.title ||
                        app.id
                    )}
                </div>


                <div
                    class="haldo-app-actions"
                >

                    <button
                        class="haldo-app-action"
                        type="button"
                        data-haldo-app-minimize
                    >
                        −
                    </button>

                    <button
                        class="haldo-app-action"
                        type="button"
                        data-haldo-app-close
                    >
                        ×
                    </button>

                </div>

            </header>


            <main
                class="haldo-app-content"
                data-haldo-app-content
            >

                <div
                    class="haldo-app-placeholder"
                >

                    <div>

                        <strong>
                            ${this.escape(
                                app.title ||
                                app.id
                            )}
                        </strong>

                        <div>
                            ${this.escape(
                                app.description ||
                                "Diese HalDo-App ist vorbereitet."
                            )}
                        </div>

                    </div>

                </div>

            </main>

        `;


        this.layer.appendChild(
            windowElement
        );


        this.windows.set(
            appId,
            windowElement
        );


        windowElement
            .querySelector(
                "[data-haldo-app-close]"
            )
            ?.addEventListener(
                "click",
                () => {

                    windowElement.classList.remove(
                        "open"
                    );
                }
            );


        windowElement
            .querySelector(
                "[data-haldo-app-minimize]"
            )
            ?.addEventListener(
                "click",
                () => {

                    windowElement.classList.remove(
                        "open"
                    );
                }
            );


        /*
         * Tell the existing application architecture
         * that an application was requested.
         */

        document.dispatchEvent(
            new CustomEvent(
                "haldo:app:open",
                {
                    detail:
                    {
                        app:
                            appId,

                        definition:
                            app
                    }
                }
            )
        );
    },


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    escape(
        value
    )
    {

        return String(
            value ??
            ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
    }
};


/* =========================================================
   GLOBAL APP API
   ========================================================= */

window.HalDo.openApp =
function(
    appId
)
{

    window.HalDo.UniversalApps.init();

    window.HalDo.UniversalApps.open(
        appId
    );
};


/* =========================================================
   INITIALIZATION
   ========================================================= */

function haldoInitializeUniversalApps()
{

    try {

        window.HalDo.UniversalApps.init();

    }

    catch (
        error
    ) {

        console.error(
            "[HalDo Universal Apps] Initialization failed:",
            error
        );
    }
}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoInitializeUniversalApps,
        {
            once:
                true
        }
    );

}

else {

    haldoInitializeUniversalApps();

}

</script>

<script>

"use strict";

/* =========================================================
   HALDO UNIVERSAL APP SYSTEM
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};


window.HalDo.UniversalApps =
{

    initialized:
        false,

    apps:
        new Map(),

    menu:
        null,

    activeWindow:
        null,


    /* =====================================================
       INITIALIZE
       ===================================================== */

    init()
    {

        if (
            this.initialized
        ) {

            return;
        }


        this.registerDefaultApps();

        this.createMenu();

        this.bind();

        this.initialized =
            true;
    },


    /* =====================================================
       REGISTER APP
       ===================================================== */

    register(
        definition
    )
    {

        if (
            !definition ||
            !definition.id
        ) {

            return false;
        }


        const app =
        {

            id:
                String(
                    definition.id
                ),

            name:
                definition.name ||
                definition.id,

            icon:
                definition.icon ||
                "◉",

            description:
                definition.description ||
                "",

            action:
                typeof definition.action ===
                "function"
                    ?
                        definition.action
                    :
                        null
        };


        this.apps.set(
            app.id,
            app
        );


        return true;
    },


    /* =====================================================
       DEFAULT APPLICATION LANDSCAPE
       ===================================================== */

    registerDefaultApps()
    {

        const defaults =
        [

            [
                "ai",
                "HalDo AI",

            [

            [

            [

            ],

            [

            ],

            [

            ],

            [
                "network",

            [
                "system",
                "System",
                "◈"
            ]

        ];


        for (
            const [
                id,
                name,
                icon
            ]
            of defaults
        ) {

            this.register(
                {
                    id,
                    name,
                    icon
                }
            );
        }
    },


    /* =====================================================
       CREATE APP MENU
       ===================================================== */

    createMenu()
    {

        if (
            document.querySelector(
                "[data-haldo-app-menu]"
            )
        ) {

            this.menu =
                document.querySelector(
                    "[data-haldo-app-menu]"
                );

            return;
        }


        const menu =
            document.createElement(
                "nav"
            );


        menu.className =
            "haldo-app-menu";


        menu.dataset.haldoAppMenu =
            "true";


        menu.setAttribute(
            "aria-label",
            "HalDo Apps"
        );


        document.body.appendChild(
            menu
        );


        this.menu =
            menu;


        this.renderMenu();
    },


    /* =====================================================
       RENDER MENU
       ===================================================== */

    renderMenu()
    {

        if (
            !this.menu
        ) {
            return;
        }


        this.menu.innerHTML =
            "";


        for (
            const app
            of this.apps.values()
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "haldo-app-item";


            button.dataset.appId =
                app.id;


            button.innerHTML = `

                <span
                    class="haldo-app-icon"
                >
                    ${this.escape(
                        app.icon
                    )}
                </span>

                <span
                    class="haldo-app-label"
                >
                    ${this.escape(
                        app.name
                    )}
                </span>

            `;


            button.addEventListener(
                "click",
                () => {

                    this.openApp(
                        app.id
                    );
                }
            );


            this.menu.appendChild(
                button
            );
        }
    },


    /* =====================================================
       ESCAPE
       ===================================================== */

    escape(
        value
    )
    {

        return String(
            value
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
    },


    /* =====================================================
       OPEN APP
       ===================================================== */

    openApp(
        id
    )
    {

        this.init();


        const app =
            this.apps.get(
                String(
                    id
                )
            );


        if (
            !app
        ) {

            return;
        }


        document.dispatchEvent(
            new CustomEvent(
                "haldo:app:select",
                {
                    detail:
                    {
                        appId:
                            app.id,

                        app
                    }
                }
            )
        );


        window.HalDo.ProfessionalAI
            ?.setState?.(
                "APP_OPENING"
            );


        if (
            app.id ===
            "ai"
        ) {

            window.HalDo
                .openProfessionalAI?.();

            this.closeMenu();

            return;
        }


        if (
            typeof app.action ===
            "function"
        ) {

            try {

                app.action();

            }

            catch (
                error
            ) {

                console.error(
                    "[HalDo App]",
                    error
                );
            }

        }

        else {

            this.openUniversalWindow(
                app
            );
        }


        this.closeMenu();


        setTimeout(
            () => {

                window.HalDo.ProfessionalAI
                    ?.setState?.(
                        "IDLE"
                    );

            },
            350
        );
    },


    /* =====================================================
       UNIVERSAL WINDOW
       ===================================================== */

    openUniversalWindow(
        app
    )
    {

        const existing =
            document.querySelector(
                "[data-haldo-universal-window]"
            );


        if (
            existing
