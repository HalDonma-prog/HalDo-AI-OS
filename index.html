        instances: new Map(),

        launchHistory: [],

        maxHistory: 100,

        busy: new Set(),

        errors: new Map()

    };

    /* ============================================================
       SAFE HELPERS
       ============================================================ */

    function normalizeId(id) {

        if (id === null || id === undefined) {
            return "";
        }

        return String(id).trim();

    }

    function getApp(id) {

        const appId = normalizeId(id);

        if (!appId) {
            return null;
        }

        if (
            HalDo.registry &&
            typeof HalDo.registry.get === "function"
        ) {

            return HalDo.registry.get(appId);

        }

        return null;

    }

    function emit(name, detail = {}) {

        try {

            if (
                typeof HalDo.emit ===
                "function"
            ) {

                HalDo.emit(
                    name,
                    detail
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo Runtime Event]",
                error
            );

        }

    }

    function recordHistory(
        appId,
        action,
        extra = {}
    ) {

        HalDo.appRuntime.launchHistory.push({

            appId,

            action,

            timestamp:
                Date.now(),

            ...extra

        });

        if (
            HalDo.appRuntime.launchHistory.length >
            HalDo.appRuntime.maxHistory
        ) {

            HalDo.appRuntime.launchHistory.shift();

        }

    }

    /* ============================================================
       APP STATE
       ============================================================ */

    function createState(
        app
    ) {

        const appId =
            normalizeId(
                app.id
            );

        if (
            HalDo.appRuntime.states.has(
                appId
            )
        ) {

            return HalDo.appRuntime.states.get(
                appId
            );

        }

        const state = {

            appId,

            status: "registered",

            opened: false,

            minimized: false,

            maximized: false,

            active: false,

            startedAt: null,

            stoppedAt: null,

            lastError: null,

            launchCount: 0,

            updateCount: 0,

            data: {},

            metadata: {

                version:
                    app.version ||
                    "20.0.0",

                name:
                    app.name ||
                    app.id

            }

        };

        HalDo.appRuntime.states.set(
            appId,
            state
        );

        return state;

    }

    function getState(
        appId
    ) {

        return (
            HalDo.appRuntime.states.get(
                normalizeId(appId)
            ) ||
            null
        );

    }

    /* ============================================================
       APP CONTEXT
       ============================================================ */

    function createContext(
        app,
        options = {}
    ) {

        const appId =
            normalizeId(
                app.id
            );

        const state =
            createState(
                app
            );

        const context = {

            app,

            appId,

            HalDo,

            state,

            options,

            runtime:
                HalDo.appRuntime,

            window: null,

            storage: {

                get(
                    key,
                    fallback = null
                ) {

                    try {

                        return HalDo.storage &&
                            typeof HalDo.storage.get ===
                            "function"

                            ? HalDo.storage.get(
                                "app." +
                                appId +
                                "." +
                                key,
                                fallback
                            )

                            : fallback;

                    } catch (_) {

                        return fallback;

                    }

                },

                set(
                    key,
                    value
                ) {

                    try {

                        if (
                            HalDo.storage &&
                            typeof HalDo.storage.set ===
                            "function"
                        ) {

                            return HalDo.storage.set(
                                "app." +
                                appId +
                                "." +
                                key,
                                value
                            );

                        }

                    } catch (error) {

                        console.warn(
                            "[HalDo App Storage]",
                            error
                        );

                    }

                    return false;

                },

                remove(
                    key
                ) {

                    try {

                        if (
                            HalDo.storage &&
                            typeof HalDo.storage.remove ===
                            "function"
                        ) {

                            return HalDo.storage.remove(
                                "app." +
                                appId +
                                "." +
                                key
                            );

                        }

                    } catch (_) {}

                    return false;

                }

            },

            events: {

                emit(
                    event,
                    detail = {}
                ) {

                    emit(
                        "app:" +
                        appId +
                        ":" +
                        event,
                        {
                            appId,
                            app,
                            ...detail
                        }
                    );

                },

                on(
                    event,
                    listener
                ) {

                    if (
                        typeof listener !==
                        "function"
                    ) {

                        return () => {};

                    }

                    const eventName =
                        "app:" +
                        appId +
                        ":" +
                        event;

                    if (
                        typeof HalDo.on ===
                        "function"
                    ) {

                        return HalDo.on(
                            eventName,
                            listener
                        );

                    }

                    return () => {};

                }

            },

            openApp(
                targetId,
                targetOptions = {}
            ) {

                return HalDo.windows &&
                    typeof HalDo.windows.open ===
                    "function"

                    ? HalDo.windows.open(
                        targetId,
                        targetOptions
                    )

                    : null;

            },

            closeApp(
                targetId
            ) {

                return HalDo.windows &&
                    typeof HalDo.windows.close ===
                    "function"

                    ? HalDo.windows.close(
                        targetId
                    )

                    : false;

            }

        };

        return context;

    }

    /* ============================================================
       FIND APP MODULE
       ============================================================ */

    function resolveModule(
        app
    ) {

        if (!app) {
            return null;
        }

        if (
            app.module &&
            typeof app.module ===
            "object"
        ) {

            return app.module;

        }

        if (
            app.runtime &&
            typeof app.runtime ===
            "object"
        ) {

            return app.runtime;

        }

        if (
            app.instance &&
            typeof app.instance ===
            "object"
        ) {

            return app.instance;

        }

        if (
            HalDo.appModules &&
            typeof HalDo.appModules.get ===
            "function"
        ) {

            const module =
                HalDo.appModules.get(
                    app.id
                );

            if (module) {
                return module;
            }

        }

        return null;

    }

    /* ============================================================
       MODULE REGISTRATION
       ============================================================ */

    HalDo.appModules =
        HalDo.appModules ||
        new Map();

    HalDo.registerAppModule =
        function (
            appId,
            module
        ) {

            const id =
                normalizeId(
                    appId
                );

            if (
                !id ||
                !module ||
                typeof module !==
                "object"
            ) {

                return false;

            }

            HalDo.appModules.set(
                id,
                module
            );

            const app =
                getApp(id);

            if (app) {

                app.module =
                    module;

            }

            emit(
                "app:module-registered",
                {
                    appId: id,
                    module
                }
            );

            return true;

        };

    HalDo.unregisterAppModule =
        function (
            appId
        ) {

            return HalDo.appModules.delete(
                normalizeId(appId)
            );

        };

    /* ============================================================
       START APP
       ============================================================ */

    async function startApp(
        app,
        options = {}
    ) {

        const appId =
            normalizeId(
                app.id
            );

        const state =
            createState(
                app
            );

        if (
            HalDo.appRuntime.busy.has(
                appId
            )
        ) {

            return false;

        }

        if (
            HalDo.appRuntime.running.has(
                appId
            )
        ) {

            return true;

        }

        HalDo.appRuntime.busy.add(
            appId
        );

        try {

            state.status =
                "starting";

            state.lastError =
                null;

            emit(
                "app:starting",
                {
                    app,
                    appId,
                    state
                }
            );

            const module =
                resolveModule(
                    app
                );

            const context =
                createContext(
                    app,
                    options
                );

            let instance =
                module;

            /*
             * Factory-Unterstützung
             */

            if (
                module &&
                typeof module.create ===
                "function"
            ) {

                instance =
                    await module.create(
                        context
                    );

            }

            /*
             * init()
             */

            if (
                instance &&
                typeof instance.init ===
                "function"
            ) {

                await instance.init(
                    context
                );

            }

            /*
             * start()
             */

            if (
                instance &&
                typeof instance.start ===
                "function"
            ) {

                await instance.start(
                    context
                );

            }

            HalDo.appRuntime.instances.set(
                appId,
                instance || context
            );

            HalDo.appRuntime.running.set(
                appId,
                {
                    app,
                    instance:
                        instance || context,
                    context,
                    startedAt:
                        Date.now()
                }
            );

            state.status =
                "running";

            state.opened =
                true;

            state.startedAt =
                Date.now();

            state.launchCount += 1;

            recordHistory(
                appId,
                "start"
            );

            emit(
                "app:started",
                {
                    app,
                    appId,
                    state,
                    instance:
                        instance || context
                }
            );

            return true;

        } catch (error) {

            state.status =
                "error";

            state.lastError =
                error?.message ||
                String(error);

            HalDo.appRuntime.errors.set(
                appId,
                error
            );

            emit(
                "app:error",
                {
                    app,
                    appId,
                    error,
                    state
                }
            );

            console.error(
                "[HalDo App Runtime]",
                appId,
                error
            );

            return false;

        } finally {

            HalDo.appRuntime.busy.delete(
                appId
            );

        }

    }

    /* ============================================================
       STOP APP
       ============================================================ */

    async function stopApp(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        const running =
            HalDo.appRuntime.running.get(
                id
            );

        const state =
            getState(
                id
            );

        if (!running) {

            if (state) {

                state.status =
                    "stopped";

                state.opened =
                    false;

            }

            return true;

        }

        try {

            const instance =
                running.instance;

            if (
                instance &&
                typeof instance.stop ===
                "function"
            ) {

                await instance.stop(
                    running.context
                );

            }

            if (
                instance &&
                typeof instance.destroy ===
                "function"
            ) {

                await instance.destroy(
                    running.context
                );

            }

            HalDo.appRuntime.running.delete(
                id
            );

            HalDo.appRuntime.instances.delete(
                id
            );

            if (state) {

                state.status =
                    "stopped";

                state.opened =
                    false;

                state.active =
                    false;

                state.stoppedAt =
                    Date.now();

            }

            recordHistory(
                id,
                "stop"
            );

            emit(
                "app:stopped",
                {
                    appId: id,
                    state
                }
            );

            return true;

        } catch (error) {

            console.error(
                "[HalDo App Stop]",
                id,
                error
            );

            if (state) {

                state.lastError =
                    error?.message ||
                    String(error);

            }

            return false;

        }

    }

    /* ============================================================
       OPEN APP
       ============================================================ */

    async function openApp(
        appId,
        options = {}
    ) {

        const id =
            normalizeId(
                appId
            );

        const app =
            getApp(id);

        if (!app) {

            console.warn(
                "[HalDo App Runtime] App nicht registriert:",
                id
            );

            emit(
                "app:not-found",
                {
                    appId: id
                }
            );

            return null;

        }

        const state =
            createState(
                app
            );

        emit(
            "app:open-request",
            {
                app,
                appId: id,
                options
            }
        );

        const started =
            await startApp(
                app,
                options
            );

        if (!started) {

            return null;

        }

        let windowElement =
            null;

        try {

            if (
                HalDo.windows &&
                typeof HalDo.windows.open ===
                "function"
            ) {

                windowElement =
                    HalDo.windows.open(
                        id,
                        options
                    );

            }

        } catch (error) {

            console.error(
                "[HalDo Window Open]",
                id,
                error
            );

        }

        const running =
            HalDo.appRuntime.running.get(
                id
            );

        if (
            running &&
            running.context
        ) {

            running.context.window =
                windowElement;

        }

        state.opened =
            !!windowElement;

        state.active =
            true;

        recordHistory(
            id,
            "open",
            {
                window:
                    !!windowElement
            }
        );

        emit(
            "app:opened",
            {
                app,
                appId: id,
                state,
                window:
                    windowElement
            }
        );

        return windowElement;

    }

    /* ============================================================
       CLOSE APP
       ============================================================ */

    async function closeApp(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        try {

            if (
                HalDo.windows &&
                typeof HalDo.windows.close ===
                "function"
            ) {

                HalDo.windows.close(
                    id
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo Window Close]",
                error
            );

        }

        await stopApp(
            id
        );

        const state =
            getState(
                id
            );

        if (state) {

            state.opened =
                false;

            state.active =
                false;

        }

        emit(
            "app:closed",
            {
                appId: id,
                state
            }
        );

        return true;

    }

    /* ============================================================
       MINIMIZE / MAXIMIZE
       ============================================================ */

    function minimizeApp(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        const result =
            HalDo.windows &&
            typeof HalDo.windows.minimize ===
            "function"

                ? HalDo.windows.minimize(
                    id
                )

                : false;

        const state =
            getState(
                id
            );

        if (state && result) {

            state.minimized =
                true;

            state.active =
                false;

        }

        return result;

    }

    function maximizeApp(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        const result =
            HalDo.windows &&
            typeof HalDo.windows.maximize ===
            "function"

                ? HalDo.windows.maximize(
                    id
                )

                : false;

        const state =
            getState(
                id
            );

        if (state && result) {

            state.maximized =
                !state.maximized;

            state.minimized =
                false;

        }

        return result;

    }

    /* ============================================================
       FOCUS APP
       ============================================================ */

    function focusApp(
        appId
    ) {

        const id =
            normalizeId(
                appId
            );

        const result =
            HalDo.windows &&
            typeof HalDo.windows.focus ===
            "function"

                ? HalDo.windows.focus(
                    id
                )

                : false;

        HalDo.appRuntime.states.forEach(
            state => {

                state.active =
                    state.appId === id &&
                    !!result;

            }
        );

        return result;

    }

    /* ============================================================
       RENDERER BRIDGE
       ============================================================ */

    HalDo.registerAppRenderer =
        HalDo.registerAppRenderer ||
        function (
            appId,
            renderer
        ) {

            if (
                !appId ||
                typeof renderer !==
                "function"
            ) {

                return false;

            }

            HalDo.appRenderers =
                HalDo.appRenderers ||
                new Map();

            HalDo.appRenderers.set(
                normalizeId(appId),
                renderer
            );

            return true;

        };

    /* ============================================================
       GLOBAL APP API
       ============================================================ */

    HalDo.apps =
        HalDo.apps || {};

    HalDo.apps.open =
        openApp;

    HalDo.apps.close =
        closeApp;

    HalDo.apps.start =
        async function (
            appId,
            options = {}
        ) {

            const app =
                getApp(
                    appId
                );

            if (!app) {
                return false;
            }

            return startApp(
                app,
                options
            );

        };

    HalDo.apps.stop =
        stopApp;

    HalDo.apps.minimize =
        minimizeApp;

    HalDo.apps.maximize =
        maximizeApp;

    HalDo.apps.focus =
        focusApp;

    HalDo.apps.get =
        function (
            appId
        ) {

            return getApp(
                appId
            );

        };

    HalDo.apps.getState =
        function (
            appId
        ) {

            return getState(
                appId
            );

        };

    HalDo.apps.getRunning =
        function () {

            return Array.from(
                HalDo.appRuntime.running.values()
            );

        };

    HalDo.apps.getHistory =
        function () {

            return [
                ...HalDo.appRuntime.launchHistory
            ];

        };

    HalDo.apps.isRunning =
        function (
            appId
        ) {

            return HalDo.appRuntime.running.has(
                normalizeId(appId)
            );

        };

    /* ============================================================
       APP MANAGER BRIDGE
       ============================================================ */

    if (HalDo.appManager) {

        HalDo.appManager.open =
            openApp;

        HalDo.appManager.close =
            closeApp;

        HalDo.appManager.start =
            async function (
                appId,
                options = {}
            ) {

                return HalDo.apps.start(
                    appId,
                    options
                );

            };

        HalDo.appManager.stop =
            stopApp;

    }

    /* ============================================================
       WINDOW EVENTS → APP STATE
       ============================================================ */

    if (
        typeof HalDo.on ===
        "function"
    ) {

        HalDo.on(
            "window:focused",
            detail => {

                const id =
                    normalizeId(
                        detail?.appId
                    );

                HalDo.appRuntime.states.forEach(
                    state => {

                        state.active =
                            state.appId === id;

                    }
                );

            }
        );

        HalDo.on(
            "window:minimized",
            detail => {

                const state =
                    getState(
                        detail?.appId
                    );

                if (state) {

                    state.minimized =
                        true;

                    state.active =
                        false;

                }

            }
        );

        HalDo.on(
            "window:maximize-toggle",
            detail => {

                const state =
                    getState(
                        detail?.appId
                    );

                if (state) {

                    state.maximized =
                        !!detail.maximized;

                    state.minimized =
                        false;

                }

            }
        );

        HalDo.on(
            "window:closed",
            detail => {

                const id =
                    normalizeId(
                        detail?.appId
                    );

                const state =
                    getState(
                        id
                    );

                if (state) {

                    state.opened =
                        false;

                    state.active =
                        false;

                }

            }
        );

    }

    /* ============================================================
       REGISTRY → RUNTIME CONNECTION
       ============================================================ */

    if (
        typeof HalDo.on ===
        "function"
    ) {

        HalDo.on(
            "app:registered",
            detail => {

                if (
                    detail &&
                    detail.app
                ) {

                    createState(
                        detail.app
                    );

                }

            }
        );

    }

    /* ============================================================
       RUNTIME INITIALIZATION
       ============================================================ */

    HalDo.appRuntime.initialized =
        true;

    emit(
        "app-runtime:ready",
        {
            version:
                HalDo.appRuntime.version
        }
    );

    console.log(
        "[HalDo App Runtime] Teil 7/8 bereit."
    );

})();

<script>
"use strict";

/* ================================================================
   HALDO AI OS 20
   INDEX SHELL
   PART 8 / 8
   FINAL INTEGRATION • BOOT • APP BRIDGE • SAFETY • RUNTIME

(function HalDoFinalIntegration() {

    if (!HalDo) {
        console.error("[HalDo] Foundation fehlt.");
        return;

    /* ============================================================
       FINAL RUNTIME STATE
       ============================================================ */

    HalDo.runtime = HalDo.runtime || {

        ready: false,

        booted: false,

        version:
            HalDo.version || "20.0.0",

        startedAt:
            Date.now(),

        services: new Map(),

        integrations: new Map(),

        errors: [],

        warnings: []

    };

    /* ============================================================
       SAFE HELPERS
       ============================================================ */

    function safeString(value, fallback = "") {

        if (
            value === null ||
            value === undefined
        ) {

            return fallback;

        }

        return String(value);

    }

    function escape(value) {

        if (
            HalDo.utils &&
            typeof HalDo.utils.escape ===
            "function"
        ) {

            return HalDo.utils.escape(
                safeString(value)
            );

        }

        return safeString(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

    function emit(name, detail = {}) {

        try {

            if (
                typeof HalDo.emit ===
                "function"
            ) {

                HalDo.emit(
                    name,
                    detail
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo Event]",
                name,
                error
            );

        }

    }

    HalDo.appStore =
        HalDo.appStore || {

            apps: new Map(),

                if (
                    !app ||
                    !app.id
                ) {

                    return false;

                }

                this.apps.set(
                    String(app.id),
                    app
                );

                return true;

            },

            registerMany(apps) {

                if (
                    !Array.isArray(apps)

                    return 0;

                let count = 0;

                apps.forEach(
                    app => {

                        if (
                            this.register(app)

                            count += 1;

                        }

                    }
                );

                return count;

            },

            get(id) {

                return this.apps.get(
                    String(id)
                ) || null;

            },

            has(id) {

                return this.apps.has(
                    String(id)
                );

            },

            list() {

                return Array.from(
                    this.apps.values()
                );

            },

            install(id) {

                const app =
                    this.get(id);

                if (!app) {

                    return false;

                }

                this.installed.add(
                    String(id)
                );

                emit(
                    "app:installed",
                    {
                        app
                    }
                );

                return true;

            },

            uninstall(id) {

                const key =
                    String(id);

                if (
                    !this.apps.has(key)

                    return false;

                }

                this.installed.delete(
                    key
                );

                emit(
                    "app:uninstalled",
                    {
                        appId: key
                    }
                );

                return true;

            },

            isInstalled(id) {

                return this.installed.has(
                    String(id)
                );

            }

        };

    /* ============================================================
       CONNECT REGISTRY
       ============================================================ */

    function connectAppRegistry() {

        const registry =
            HalDo.registry;

        if (!registry) {

            return;

        }

        try {

            if (
                typeof registry.list ===
                "function"
            ) {

                const apps =
                    registry.list();

                if (
                    Array.isArray(apps)
                ) {

                    HalDo.appStore
                        .registerMany(
                            apps
                        );

                }

            }

        } catch (error) {

            console.warn(
                "[HalDo AppStore]",
                error
            );

        }

    }

    /* ============================================================
       APP LAUNCH BRIDGE
       ============================================================ */

    HalDo.launchApp =
        async function (
            appId,
            options = {}
        ) {

            const id =
                String(appId);

            try {

                if (
                    HalDo.appManager &&
                    typeof HalDo.appManager.open ===
                    "function"
                ) {

                    return await HalDo.appManager.open(
                        id,
                        options
                    );

                }

                if (
                    HalDo.windows &&
                    typeof HalDo.windows.open ===
                    "function"
                ) {

                    return !!HalDo.windows.open(
                        id,
                        options
                    );

                }

                return false;

            } catch (error) {

                HalDo.runtime.errors.push({
                    type: "app-launch",
                    appId: id,
                    error:
                        safeString(
                            error?.message,
                            "Unbekannter Fehler"
                        ),
                    timestamp:
                        Date.now()
                });

                console.error(
                    "[HalDo Launch]",
                    id,
                    error
                );

                emit(
                    "app:launch-error",
                    {
                        appId: id,
                        error
                    }
                );

                return false;

            }

        };

    /* ============================================================
       UNIVERSAL MENU BRIDGE
       ============================================================ */

    HalDo.menu =
        HalDo.menu || {

            open: false,

            toggle() {

                this.open =
                    !this.open;

                document.body
                    .classList.toggle(
                        "haldo-menu-open",
                        this.open
                    );

                emit(
                    "menu:toggle",
                    {
                        open:
                            this.open
                    }
                );

                return this.open;

            },

            close() {

                this.open =
                    false;

                document.body
                    .classList.remove(
                        "haldo-menu-open"
                    );

                emit(
                    "menu:closed"
                );

            }

        };

    /* ============================================================
       GLOBAL KEYBOARD CONTROL
       ============================================================ */

    document.addEventListener(
        "keydown",
        event => {

            const target =
                event.target;

            const typing =
                target &&
                (
                    target.matches?.(
                        "input, textarea, select"
                    ) ||
                    target.isContentEditable
                );

            /*
             * ESC
             */

            if (
                event.key ===
                "Escape"
            ) {

                if (
                    HalDo.menu &&
                    HalDo.menu.open
                ) {

                    HalDo.menu.close();

                    event.preventDefault();

                    return;

                }

                return;

            }

            /*
             * Cmd/Ctrl + K
             * Global App Search
             */

            if (
                (
                    event.metaKey ||
                    event.ctrlKey
                ) &&
                event.key.toLowerCase() ===
                "k"
            ) {

                if (!typing) {

                    event.preventDefault();

                    emit(
                        "global:search",
                        {}
                    );

                }

                return;

            }

            /*
             * Cmd/Ctrl + Shift + A
             * App Store
             */

            if (
                (
                    event.metaKey ||
                    event.ctrlKey
                ) &&
                event.shiftKey &&
                event.key.toLowerCase() ===
                "a"
            ) {

                if (!typing) {

                    event.preventDefault();

                    HalDo.launchApp(
                        "app-store"
                    );

                }

            }

        }
    );

    /* ============================================================
       RESPONSIVE DEVICE SYSTEM
       ============================================================ */

    HalDo.device =
        HalDo.device || {

            type: "desktop",

            touch:
                "ontouchstart" in window ||
                navigator.maxTouchPoints > 0,

            update() {

                const width =
                    window.innerWidth;

                if (
                    width <= 600
                ) {

                    this.type =
                        "mobile";

                } else if (
                    width <= 900
                ) {

                    this.type =
                        "tablet";

                } else {

                    this.type =
                        "desktop";

                }

                document.documentElement
                    .dataset.haldoDevice =
                    this.type;

                document.documentElement
                    .dataset.haldoTouch =
                    this.touch
                        ? "true"
                        : "false";

                emit(
                    "device:changed",
                    {
                        type:
                            this.type,
                        touch:
                            this.touch
                    }
                );

            }

        };

    HalDo.device.update();

    window.addEventListener(
        "resize",
        () => {

            HalDo.device.update();

        },
        {
            passive: true
        }
    );

    /* ============================================================
       MOBILE VIEWPORT SAFETY
       ============================================================ */

    function installMobileSafety() {

        const style =
            document.createElement(
                "style"
            );

        style.id =
            "haldo-final-responsive";

        style.textContent = `

            html,
            body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            button,
            input,
            textarea,
            select {
                font: inherit;
            }

            button {
                -webkit-tap-highlight-color:
                    transparent;
            }

            @media (max-width: 760px) {

                .haldo-app-window {
                    max-width:
                        calc(100vw - 12px);

                    max-height:
                        calc(100dvh - 80px);
                }

                .haldo-window-content {
                    -webkit-overflow-scrolling:
                        touch;
                }

            }

            @media (max-width: 480px) {

                .haldo-app-window {
                    min-width:
                        min(
                            280px,
                            calc(100vw - 12px)
                        );

                    min-height:
                        min(
                            200px,
                            calc(100dvh - 90px)
                        );

                    border-radius: 16px;
                }

                .haldo-window-controls {
                    gap: 3px;
                }

            }

        `;

        document.head.appendChild(
            style
        );

    }

    installMobileSafety();

    /* ============================================================
       ACCESSIBILITY
       ============================================================ */

    function installAccessibility() {

        document.documentElement
            .setAttribute(
                "data-haldo-accessibility",
                "enabled"
            );

        document.addEventListener(
            "focusin",
            event => {

                const element =
                    event.target;

                if (
                    element &&
                    element.matches?.(
                        "button,[href],input,textarea,select,[tabindex]"
                    )
                ) {

                    element.classList.add(
                        "haldo-focus-visible"
                    );

                }

            }
        );

        document.addEventListener(
            "focusout",
            event => {

                event.target
                    ?.classList
                    ?.remove(
                        "haldo-focus-visible"
                    );

            }
        );

    }

    installAccessibility();

    /* ============================================================
       ERROR MONITOR
       ============================================================ */

    window.addEventListener(
        "error",
        event => {

            HalDo.runtime.errors.push({

                type: "window-error",

                message:
                    safeString(
                        event.message,
                        "JavaScript-Fehler"
                    ),

                source:
                    safeString(
                        event.filename
                    ),

                line:
                    event.lineno || 0,

                column:
                    event.colno || 0,

                timestamp:
                    Date.now()

            });

            if (
                HalDo.runtime.errors.length >
                100
            ) {

                HalDo.runtime.errors.shift();

            }

        }
    );

    window.addEventListener(
        "unhandledrejection",
        event => {

            HalDo.runtime.errors.push({

                type:
                    "unhandled-rejection",

                message:
                    safeString(
                        event.reason?.message ||
                        event.reason,
                        "Promise-Fehler"
                    ),

                timestamp:
                    Date.now()

            });

            if (
                HalDo.runtime.errors.length >
                100
            ) {

                HalDo.runtime.errors.shift();

            }

        }
    );

    /* ============================================================
       STORAGE SAFETY
       ============================================================ */

    HalDo.persist =
        function (
            key,
            value
        ) {

            try {

                if (
                    HalDo.storage &&
                    typeof HalDo.storage.set ===
                    "function"
                ) {

                    return HalDo.storage.set(
                        key,
                        value
                    );

                }

                localStorage.setItem(
                    "haldo:" + key,
                    JSON.stringify(value)
                );

                return true;

            } catch (error) {

                console.warn(
                    "[HalDo Storage]",
                    error
                );

                return false;

            }

        };

    HalDo.restore =
        function (
            key,
            fallback = null
        ) {

            try {

                if (
                    HalDo.storage &&
                    typeof HalDo.storage.get ===
                    "function"
                ) {

                    return HalDo.storage.get(
                        key,
                        fallback
                    );

                }

                const raw =
                    localStorage.getItem(
                        "haldo:" + key
                    );

                return raw === null
                    ? fallback
                    : JSON.parse(raw);

            } catch (_) {

                return fallback;

            }

        };

    /* ============================================================
       RUNTIME STATUS API
       ============================================================ */

    HalDo.getRuntimeStatus =
        function () {

            return {

                version:
                    HalDo.runtime.version,

                ready:
                    HalDo.runtime.ready,

                booted:
                    HalDo.runtime.booted,

                uptime:
                    Date.now() -
                    HalDo.runtime.startedAt,

                device:
                    HalDo.device.type,

                touch:
                    HalDo.device.touch,

                openWindows:
                    HalDo.windows
                        ? HalDo.windows.all().length
                        : 0,

                registeredApps:
                    HalDo.appStore.apps.size,

                errors:
                    HalDo.runtime.errors.length

            };

        };

    /* ============================================================
       FINAL APP REGISTRY SYNCHRONIZATION
       ============================================================ */

    function synchronizeApps() {

        connectAppRegistry();

        const manifest =
            HalDo.appManifest ||
            HalDo.apps ||
            window.HalDoAppManifest;

        if (
            Array.isArray(manifest)
        ) {

            HalDo.appStore
                .registerMany(
                    manifest
                );

        }

        emit(
            "apps:synchronized",
            {
                count:
                    HalDo.appStore.apps.size
            }
        );

    }

    /* ============================================================
       SYSTEM SERVICE CONNECTIONS
       ============================================================ */

    function connectSystems() {

        const systems = {

            kernel:
                HalDo.kernel,

            system:
                HalDo.system,

            storage:
                HalDo.storage,

            registry:
                HalDo.registry,

            appManager:
                HalDo.appManager,

            router:
                HalDo.router,

            windowManager:
                HalDo.windowManager

        };

        Object.entries(
            systems
        ).forEach(
            ([name, service]) => {

                if (service) {

                    HalDo.runtime.services.set(
                        name,
                        service
                    );

                    HalDo.runtime.integrations.set(
                        name,
                        true
                    );

                }

            }
        );

    }

    /* ============================================================
       DEFAULT SYSTEM ACTIONS
       ============================================================ */

    HalDo.systemActions =
        HalDo.systemActions || {

            openSettings() {

                return HalDo.launchApp(
                    "settings"
                );

            },

            openAppStore() {

                return HalDo.launchApp(
                    "app-store"
                );

            },

            openAI() {

                return HalDo.launchApp(
                    "ai-chat"
                );

            },

            openFiles() {

                return HalDo.launchApp(
                    "file-manager"
                );

            },

            closeAllWindows() {

                if (
                    HalDo.windows
                ) {

                    HalDo.windows.closeAll();

                }

            }

        };

    /* ============================================================
       FINAL READY EVENT
       ============================================================ */

    function finalizeRuntime() {

        synchronizeApps();

        connectSystems();

        HalDo.runtime.ready =
            true;

        HalDo.runtime.booted =
            true;

        document.documentElement
            .dataset.haldoReady =
            "true";

        emit(
            "runtime:ready",
            {
                version:
                    HalDo.runtime.version,

                status:
                    HalDo.getRuntimeStatus()

            }
        );

        emit(
            "haldo:ready",
            {
                HalDo
            }
        );

        console.log(
            "[HalDo AI OS 20] Runtime vollständig verbunden."
        );

    }

    /* ============================================================
       DOM READY
       ============================================================ */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            finalizeRuntime,
            {
                once: true
            }
        );

    } else {

        finalizeRuntime();

    }

    /* ============================================================
       GLOBAL API
       ============================================================ */

    window.HalDoOS =
        window.HalDoOS || {};

    window.HalDoOS.HalDo =
        HalDo;

    window.HalDoOS.launchApp =
        HalDo.launchApp;

    window.HalDoOS.openSettings =
        HalDo.systemActions.openSettings;

    window.HalDoOS.openAppStore =
        HalDo.systemActions.openAppStore;

    window.HalDoOS.openAI =
        HalDo.systemActions.openAI;

    window.HalDoOS.openFiles =
        HalDo.systemActions.openFiles;

    window.HalDoOS.runtime =
        HalDo.runtime;

    /* ============================================================
       FINAL MESSAGE
       ============================================================ */

    console.log(
        "%c HALDO AI OS 20 ",
        "font-weight:900;font-size:16px"
    );

    console.log(
        "Finale Index-Shell-Integration bereit."
    );

})();
</script>
