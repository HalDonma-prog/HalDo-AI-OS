<script>
"use strict";

(function () {

    const HD = window.HalDo;

    if (!HD) {
        console.error("HalDo Core fehlt.");
        return;
    }

    /* =========================================================
       WINDOW MANAGER
       ========================================================= */

    HD.windowManager = HD.windowManager || {

        windows: new Map(),

        zIndex: 100,

        activeWindowId: null,

        initialized: false,

        createId(appId) {

            return (
                "window-" +
                appId +
                "-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2, 7)
            );
        },


        getWindowState(appId) {

            return HD.storage.get(
                "window-state:" + appId,
                {
                    x: null,
                    y: null,
                    width:
                        HD.config.defaultWindowWidth,

                    height:
                        HD.config.defaultWindowHeight,

                    minimized: false,
                    maximized: false
                }
            );
        },


        saveWindowState(window) {

            if (!window || !window.appId) {
                return;
            }

            HD.storage.set(
                "window-state:" + window.appId,
                {
                    x: window.x,
                    y: window.y,
                    width: window.width,
                    height: window.height,
                    minimized: window.minimized,
                    maximized: window.maximized
                }
            );
        },


        open(appId) {

            const manifest =
                HD.appRegistry?.get(appId);

            if (!manifest) {
                console.warn(
                    "App nicht registriert:",
                    appId
                );
                return null;
            }

            /*
             * Bereits geöffnetes Fenster
             */

            for (const window of this.windows.values()) {

                if (
                    window.appId === appId &&
                    !window.closed
                ) {

                    if (window.minimized) {
                        this.restore(window.id);
                    }

                    this.activate(window.id);

                    return window;
                }
            }


            const state =
                this.getWindowState(appId);

            const window = {

                id:
                    this.createId(appId),

                appId,

                title:
                    manifest.name,

                icon:
                    manifest.icon || "○",

                x:
                    state.x,

                y:
                    state.y,

                width:
                    state.width,

                height:
                    state.height,

                minimized:
                    !!state.minimized,

                maximized:
                    !!state.maximized,

                closed:
                    false,

                zIndex:
                    ++this.zIndex,

                element:
                    null,

                content:
                    null,

                createdAt:
                    Date.now()
            };


            this.windows.set(
                window.id,
                window
            );


            this.render(window);

            this.activate(window.id);

            HD.emit(
                "window:opened",
                {
                    window
                }
            );

            return window;
        },


        render(window) {

            const layer =
                HD.ui?.windowLayer ||
                document.getElementById(
                    "haldo-window-layer"
                );

            if (!layer) {
                return;
            }


            const element =
                document.createElement("article");

            element.className =
                "haldo-window";

            element.dataset.windowId =
                window.id;

            element.dataset.appId =
                window.appId;


            /*
             * Fensterposition
             */

            const desktopWidth =
                window.innerWidth ||
                window.parentWidth ||
                window.width;

            const viewportWidth =
                window.innerWidth ||
                document.documentElement.clientWidth;

            const viewportHeight =
                window.innerHeight ||
                document.documentElement.clientHeight;


            if (
                window.x === null ||
                typeof window.x !== "number"
            ) {

                window.x =
                    Math.max(
                        24,
                        (
                            viewportWidth -
                            window.width
                        ) / 2
                    );
            }


            if (
                window.y === null ||
                typeof window.y !== "number"
            ) {

                window.y =
                    Math.max(
                        80,
                        (
                            viewportHeight -
                            window.height
                        ) / 2
                    );
            }


            element.style.left =
                window.x + "px";

            element.style.top =
                window.y + "px";

            element.style.width =
                window.width + "px";

            element.style.height =
                window.height + "px";

            element.style.zIndex =
                String(window.zIndex);


            element.innerHTML = `

                <div class="haldo-window-header">

                    <div class="haldo-window-title">

                        <span
                            class="haldo-window-icon"
                        >
                            ${this.escape(
                                window.icon
                            )}
                        </span>

                        <span
                            class="haldo-window-name"
                        >
                            ${this.escape(
                                window.title
                            )}
                        </span>

                    </div>


                    <div
                        class="haldo-window-controls"
                    >

                        <button
                            type="button"
                            class="window-control minimize"
                            data-action="minimize"
                            title="Minimieren"
                        >
                            −
                        </button>

                        <button
                            type="button"
                            class="window-control maximize"
                            data-action="maximize"
                            title="Maximieren"
                        >
                            □
                        </button>

                        <button
                            type="button"
                            class="window-control close"
                            data-action="close"
                            title="Schließen"
                        >
                            ×
                        </button>

                    </div>

                </div>


                <div class="haldo-window-body">

                    <div
                        class="haldo-app-toolbar"
                    >

                        <span
                            class="app-toolbar-status"
                        >
                            ● ONLINE
                        </span>

                        <span
                            class="app-toolbar-name"
                        >
                            ${this.escape(
                                window.title
                            )}
                        </span>

                    </div>


                    <div
                        class="haldo-app-content"
                    >
                        <div
                            class="app-loading"
                        >
                            ${this.escape(
                                window.title
                            )}
                        </div>
                    </div>

                </div>


                <div
                    class="haldo-window-resize"
                    data-action="resize"
                    aria-hidden="true"
                ></div>

            `;


            layer.appendChild(element);

            window.element =
                element;

            window.content =
                element.querySelector(
                    ".haldo-app-content"
                );


            /*
             * Fenster-Events
             */

            this.bindWindowEvents(
                window
            );


            /*
             * App-Inhalt erzeugen
             */

            this.mountApp(
                window
            );


            /*
             * Minimierter Zustand
             */

            if (window.minimized) {

                element.classList.add(
                    "minimized"
                );

            }


            /*
             * Maximierter Zustand
             */

            if (window.maximized) {

                element.classList.add(
                    "maximized"
                );

                this.applyMaximizedState(
                    window
                );

            }
        },


        bindWindowEvents(window) {

            const element =
                window.element;

            if (!element) {
                return;
            }


            /*
             * Aktivieren
             */

            element.addEventListener(
                "pointerdown",
                () => {

                    this.activate(
                        window.id
                    );

                }
            );


            /*
             * Fenstersteuerung
             */

            element
                .querySelectorAll(
                    "[data-action]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            event => {

                                event.stopPropagation();

                                const action =
                                    button.dataset.action;

                                if (
                                    action ===
                                    "minimize"
                                ) {

                                    this.minimize(
                                        window.id
                                    );

                                }

                                else if (
                                    action ===
                                    "maximize"
                                ) {

                                    this.maximize(
                                        window.id
                                    );

                                }

                                else if (
                                    action ===
                                    "close"
                                ) {

                                    this.close(
                                        window.id
                                    );

                                }

                            }
                        );

                    }
                );


            /*
             * Dragging
             */

            const header =
                element.querySelector(
                    ".haldo-window-header"
                );

            if (header) {

                this.enableDragging(
                    window,
                    header
                );

            }


            /*
             * Resize
             */

            const resizeHandle =
                element.querySelector(
                    ".haldo-window-resize"
                );

            if (resizeHandle) {

                this.enableResize(
                    window,
                    resizeHandle
                );

            }
        },


        enableDragging(
            window,
            header
        ) {

            let dragging =
                false;

            let startX =
                0;

            let startY =
                0;

            let originalX =
                0;

            let originalY =
                0;


            header.addEventListener(
                "pointerdown",
                event => {

                    if (
                        event.button !== 0
                    ) {
                        return;
                    }

                    if (
                        event.target.closest(
                            ".haldo-window-controls"
                        )
                    ) {
                        return;
                    }


                    dragging =
                        true;

                    startX =
                        event.clientX;

                    startY =
                        event.clientY;

                    originalX =
                        window.x;

                    originalY =
                        window.y;


                    header.setPointerCapture(
                        event.pointerId
                    );

                    this.activate(
                        window.id
                    );

                }
            );


            header.addEventListener(
                "pointermove",
                event => {

                    if (!dragging) {
                        return;
                    }


                    const deltaX =
                        event.clientX -
                        startX;

                    const deltaY =
                        event.clientY -
                        startY;


                    window.x =
                        originalX +
                        deltaX;

                    window.y =
                        originalY +
                        deltaY;


                    const maxX =
                        Math.max(
                            0,
                            window.innerWidth -
                            window.width
                        );


                    const maxY =
                        Math.max(
                            50,
                            window.innerHeight -
                            window.height
                        );


                    window.x =
                        Math.max(
                            0,
                            Math.min(
                                window.x,
                                maxX
                            )
                        );


                    window.y =
                        Math.max(
                            50,
                            Math.min(
                                window.y,
                                maxY
                            )
                        );


                    this.applyPosition(
                        window
                    );

                }
            );


            header.addEventListener(
                "pointerup",
                event => {

                    dragging =
                        false;

                    try {

                        header.releasePointerCapture(
                            event.pointerId
                        );

                    }
                    catch (_) {}

                    this.saveWindowState(
                        window
                    );
                }
            );
        },


        enableResize(
            window,
            handle
        ) {

            let resizing =
                false;

            let startX =
                0;

            let startY =
                0;

            let startWidth =
                0;

            let startHeight =
                0;


            handle.addEventListener(
                "pointerdown",
                event => {

                    if (
                        event.button !== 0
                    ) {
                        return;
                    }


                    resizing =
                        true;

                    startX =
                        event.clientX;

                    startY =
                        event.clientY;

                    startWidth =
                        window.width;

                    startHeight =
                        window.height;


                    handle.setPointerCapture(
                        event.pointerId
                    );


                    this.activate(
                        window.id
                    );


                    event.preventDefault();
                }
            );


            handle.addEventListener(
                "pointermove",
                event => {

                    if (!resizing) {
                        return;
                    }


                    const width =
                        startWidth +
                        (
                            event.clientX -
                            startX
                        );

                    const height =
                        startHeight +
                        (
                            event.clientY -
                            startY
                        );


                    window.width =
                        Math.max(
                            HD.config
                                .minimumWindowWidth ||
                            360,
                            width
                        );


                    window.height =
                        Math.max(
                            HD.config
                                .minimumWindowHeight ||
                            240,
                            height
                        );


                    this.applySize(
                        window
                    );
                }
            );


            handle.addEventListener(
                "pointerup",
                event => {

                    resizing =
                        false;

                    try {

                        handle.releasePointerCapture(
                            event.pointerId
                        );

                    }
                    catch (_) {}

                    this.saveWindowState(
                        window
                    );
                }
            );
        },


        applyPosition(window) {

            if (!window.element) {
                return;
            }

            window.element.style.left =
                window.x + "px";

            window.element.style.top =
                window.y + "px";
        },


        applySize(window) {

            if (!window.element) {
                return;
            }

            window.element.style.width =
                window.width + "px";

            window.element.style.height =
                window.height + "px";
        },


        activate(windowId) {

            const window =
                this.windows.get(
                    windowId
                );

            if (!window) {
                return;
            }


            this.zIndex++;

            window.zIndex =
                this.zIndex;

            this.activeWindowId =
                windowId;


            if (window.element) {

                window.element.style.zIndex =
                    String(
                        window.zIndex
                    );

                document
                    .querySelectorAll(
                        ".haldo-window.active"
                    )
                    .forEach(
                        item => {

                            item.classList.remove(
                                "active"
                            );

                        }
                    );

                window.element.classList.add(
                    "active"
                );
            }


            HD.emit(
                "window:activated",
                {
                    window
                }
            );
        },


        minimize(windowId) {

            const window =
                this.windows.get(
                    windowId
                );

            if (!window) {
                return;
            }


            window.minimized =
                true;

            window.active =
                false;


            if (window.element) {

                window.element.classList.add(
                    "minimized"
                );

            }


            this.saveWindowState(
                window
            );


            HD.emit(
                "window:minimized",
                {
                    window
                }
            );
        },


        restore(windowId) {

            const window =
                this.windows.get(
                    windowId
                );

            if (!window) {
                return;
            }


            window.minimized =
                false;


            if (window.element) {

                window.element.classList.remove(
                    "minimized"
                );

            }


            this.activate(
                windowId
            );


            this.saveWindowState(
                window
            );


            HD.emit(
                "window:restored",
                {
                    window
                }
            );
        },


        maximize(windowId) {

            const window =
                this.windows.get(
                    windowId
                );

            if (!window) {
                return;
            }


            if (window.maximized) {

                this.restoreSize(
                    window
                );

                return;
            }


            window.previousGeometry = {

                x:
                    window.x,

                y:
                    window.y,

                width:
                    window.width,

                height:
                    window.height

            };


            window.maximized =
                true;


            this.applyMaximizedState(
                window
            );


            if (window.element) {

                window.element.classList.add(
                    "maximized"
                );

            }


            this.saveWindowState(
                window
            );


            HD.emit(
                "window:maximized",
                {
                    window
                }
            );
        },


        applyMaximizedState(window) {

            if (!window.element) {
                return;
            }


            const topbar =
                document.getElementById(
                    "haldo-topbar"
                );

            const topbarHeight =
                topbar
                    ? topbar.offsetHeight
                    : 64;


            window.x =
                0;

            window.y =
                topbarHeight;

            window.width =
                window.innerWidth;

            window.height =
                Math.max(
                    240,
                    window.innerHeight -
                    topbarHeight
                );


            this.applyPosition(
                window
            );

            this.applySize(
                window
            );
        },


        restoreSize(window) {

            if (
                !window.previousGeometry
            ) {

                window.maximized =
                    false;

                if (window.element) {

                    window.element.classList.remove(
                        "maximized"
                    );

                }

                return;
            }


            const previous =
                window.previousGeometry;


            window.x =
                previous.x;

            window.y =
                previous.y;

            window.width =
                previous.width;

            window.height =
                previous.height;

            window.maximized =
                false;


            if (window.element) {

                window.element.classList.remove(
                    "maximized"
                );

            }


            this.applyPosition(
                window
            );

            this.applySize(
                window
            );


            this.saveWindowState(
                window
            );


            HD.emit(
                "window:restored-size",
                {
                    window
                }
            );
        },


        close(windowId) {

            const window =
                this.windows.get(
                    windowId
                );

            if (!window) {
                return;
            }


            /*
             * App-State sichern
             */

            const instance =
                HD.appRuntime?.get(
                    window.appId
                );

            if (
                instance &&
                typeof instance.close ===
                "function"
            ) {

                try {

                    instance.close();

                }
                catch (error) {

                    console.warn(
                        "App close error:",
                        error
                    );

                }
            }


            this.saveWindowState(
                window
            );


            window.closed =
                true;

            window.minimized =
                false;


            if (window.element) {

                window.element.classList.add(
                    "closing"
                );


                setTimeout(
                    () => {

                        window.element?.remove();

                    },
                    160
                );

            }


            HD.emit(
                "window:closed",
                {
                    window
                }
            );
        },


        closeApp(appId) {

            for (
                const window
                of this.windows.values()
            ) {

                if (
                    window.appId === appId &&
                    !window.closed
                ) {

                    this.close(
                        window.id
                    );
                }
            }
        },


        restoreApp(appId) {

            for (
                const window
                of this.windows.values()
            ) {

                if (
                    window.appId === appId &&
                    !window.closed
                ) {

                    this.restore(
                        window.id
                    );

                    return window;
                }
            }


            return this.open(
                appId
            );
        },


        mountApp(window) {

            if (!window.content) {
                return;
            }


            /*
             * App-System-Hook
             */

            const appManager =
                HD.appManager;


            if (
                appManager &&
                typeof appManager.mount ===
                "function"
            ) {

                try {

                    const result =
                        appManager.mount(
                            window.appId,
                            window.content,
                            window
                        );


                    if (result === true) {
                        return;
                    }

                }
                catch (error) {

                    console.error(
                        "App mount error:",
                        window.appId,
                        error
                    );

                }
            }


            /*
             * Falls eine App noch keinen
             * eigenen Renderer besitzt,
             * erhält sie eine vollständige
             * Systemoberfläche statt einer
             * leeren Fläche.
             */

            this.mountGenericApp(
                window
            );
        },


        mountGenericApp(window) {

            if (!window.content) {
                return;
            }


            const manifest =
                window.manifest ||
                HD.appRegistry?.get(
                    window.appId
                ) ||
                {};


            window.content.innerHTML = `

                <div
                    class="generic-app"
                    data-generic-app="${this.escape(
                        window.appId
                    )}"
                >

                    <div
                        class="generic-app-header"
                    >

                        <div>

                            <strong>
                                ${this.escape(
                                    window.title
                                )}
                            </strong>

                            <small>
                                ${this.escape(
                                    manifest.category ||
                                    "System App"
                                )}
                            </small>

                        </div>

                        <span
                            class="generic-online"
                        >
                            ● ONLINE
                        </span>

                    </div>


                    <div
                        class="generic-app-main"
                    >

                        <div
                            class="generic-app-icon"
                        >
                            ${this.escape(
                                window.icon
                            )}
                        </div>

                        <h2>
                            ${this.escape(
                                window.title
                            )}
                        </h2>

                        <p>
                            ${this.escape(
                                manifest.description ||
                                "HalDo System Application"
                            )}
                        </p>

                        <div
                            class="generic-actions"
                        >

                            <button
                                type="button"
                                data-generic-action="new"
                            >
                                Neu
                            </button>

                            <button
                                type="button"
                                data-generic-action="save"
                            >
                                Speichern
                            </button>

                            <button
                                type="button"
                                data-generic-action="restore"
                            >
                                Wiederherstellen
                            </button>

                        </div>

                    </div>

                </div>
            `;


            /*
             * Generische App-Grundfunktionen
             */

            window.content
                .querySelectorAll(
                    "[data-generic-action]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                const action =
                                    button.dataset
                                        .genericAction;

                                HD.emit(
                                    "app:action",
                                    {
                                        appId:
                                            window.appId,

                                        action,

                                        window
                                    }
                                );

                            }
                        );

                    }
                );
        },


        escape(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        },


        getOpenWindows() {

            return Array.from(
                this.windows.values()
            )
                .filter(
                    window =>
                        !window.closed
                );
        },


        closeAll() {

            this.getOpenWindows()
                .forEach(
                    window => {

                        this.close(
                            window.id
                        );

                    }
                );
        },


        initialize() {

            if (this.initialized) {
                return true;
            }


            /*
             * Bildschirmänderungen
             */

            window.addEventListener(
                "resize",
                () => {

                    this.getOpenWindows()
                        .forEach(
                            window => {

                                if (
                                    window.maximized
                                ) {

                                    this.applyMaximizedState(
                                        window
                                    );

                                }

                            }
                        );

                }
            );


            /*
             * Doppelklick auf App-Fenster
             * Titelbereich = Maximieren
             */

            HD.events?.on(
                "app:open",
                data => {

                    if (
                        data?.app?.id
                    ) {

                        /*
                         * App Runtime und
                         * Window Manager
                         * synchron halten.
                         */

                        const existing =
                            this.getOpenWindows()
                                .find(
                                    window =>
                                        window.appId ===
                                        data.app.id
                                );

                        if (!existing) {

                            this.open(
                                data.app.id
                            );

                        }
                    }
                }
            );


            /*
             * App schließen →
             * Fenster schließen
             */

            HD.events?.on(
                "app:close",
                data => {

                    const appId =
                        data?.app?.id;

                    if (!appId) {
                        return;
                    }

                    this.closeApp(
                        appId
                    );
                }
            );


            this.initialized =
                true;


            HD.runtime?.register(
                "window-manager",
                this
            );


            HD.services?.register(
                "window-manager",
                this
            );


            HD.emit(
                "window-manager:initialized",
                {
                    manager: this
                }
            );


            return true;
        }

    };


    /* =========================================================
       GLOBAL WINDOW MANAGER CONNECTION
       ========================================================= */

    HD.windowManager.initialize();


    /*
     * Kompatibilität zu möglichen
     * älteren Window-Manager-Aufrufen.
     */

    HD.windows =
        HD.windowManager;


})();
</script>

            true;

        instance.closed =
            false;

        instance.active =
            true;


        this.restoreGeometry(
            record
        );


        this.focus(
            instance.id
        );


        return record;
    };


/* =========================================================
   RESTORE GEOMETRY
   ========================================================= */

HD.windowManager.restoreGeometry =
    function(record) {

        if (!record) {
            return;
        }


        const state =
            HD.appState.get(
                record.id
            );


        if (
            state &&
            state.window
        ) {

            record.x =
                Number.isFinite(
                    state.window.x
                )
                    ? state.window.x
                    : record.x;


            record.y =
                Number.isFinite(
                    state.window.y
                )
                    ? state.window.y
                    : record.y;


            record.width =
                Number.isFinite(
                    state.window.width
                )
                    ? state.window.width
                    : record.width;


            record.height =
                Number.isFinite(
                    state.window.height
                )
                    ? state.window.height
                    : record.height;


            record.maximized =
                !!state.window.maximized;

        }


        this.applyGeometry(
            record
        );
    };


/* =========================================================
   FOCUS
   ========================================================= */

HD.windowManager.focus =
    function(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return false;
        }


        this.zIndex++;

        record.element.style.zIndex =
            this.zIndex;


        this.windows.forEach(
            item => {

                if (
                    item.app &&
                    item.app.id ===
                    appId
                ) {

                    item.app.active =
                        true;

                }
                else if (
                    item.app
                ) {

                    item.app.active =
                        false;

                }

            }
        );


        HD.emit(
            "window:focus",
            {
                window:
                    record
            }
        );


        return true;
    };


/* =========================================================
   MINIMIZE WINDOW
   ========================================================= */

HD.windowManager.minimize =
    function(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return false;
        }


        record.minimized =
            true;


        record.element.style.display =
            "none";


        record.app.minimized =
            true;

        record.app.active =
            false;


        this.saveGeometry(
            record
        );


        HD.emit(
            "window:minimize",
            {
                window:
                    record
            }
        );


        return true;
    };


/* =========================================================
   RESTORE WINDOW
   ========================================================= */

HD.windowManager.restore =
    function(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return false;
        }


        record.minimized =
            false;


        record.element.style.display =
            "flex";


        record.app.restore();


        this.applyGeometry(
            record
        );


        this.focus(
            appId
        );


        HD.emit(
            "window:restore",
            {
                window:
                    record
            }
        );


        return true;
    };


/* =========================================================
   MAXIMIZE WINDOW
   ========================================================= */

HD.windowManager.maximize =
    function(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return false;
        }


        record.maximized =
            true;


        record.app.maximize();


        this.applyGeometry(
            record
        );


        this.focus(
            appId
        );


        this.saveGeometry(
            record
        );


        HD.emit(
            "window:maximize",
            {
                window:
                    record
            }
        );


        return true;
    };


/* =========================================================
   CLOSE WINDOW
   ========================================================= */

HD.windowManager.close =
    function(appId) {

        const record =
            this.windows.get(
                appId
            );

        if (!record) {
            return false;
        }


        this.saveGeometry(
            record
        );


        record.element.style.display =
            "none";


        record.app.opened =
            false;

        record.app.closed =
            true;

        record.app.active =
            false;


        const state =
            HD.appState.get(
                appId
            );


        state.wasOpen =
            false;


        HD.appState.save(
            appId,
            state
        );


        HD.emit(
            "window:close",
            {
                window:
                    record
            }
        );


        return true;
    };

   UNIVERSAL APP DATA SYSTEM
   ========================================================= */

HD.data =
    HD.data || {};


HD.data.collections =
    HD.data.collections || new Map();


/* ---------------------------------------------------------
   CREATE COLLECTION
   --------------------------------------------------------- */

HD.data.createCollection =
    function(appId) {

        if (
            !this.collections.has(
                appId
            )
        ) {

            this.collections.set(
                appId,
                []
            );
        }

        return this.collections.get(
            appId
        );
    };


/* ---------------------------------------------------------
   GET COLLECTION
   --------------------------------------------------------- */

HD.data.getCollection =
    function(appId) {

        if (
            !this.collections.has(
                appId
            )
        ) {

            const stored =
                HD.storage.get(
                    "collection:" +
                    appId,
                    []
                );

            this.collections.set(
                appId,
                Array.isArray(stored)
                    ? stored
                    : []
            );
        }

        return this.collections.get(
            appId
        );
    };


/* ---------------------------------------------------------
   SAVE COLLECTION
   --------------------------------------------------------- */

HD.data.saveCollection =
    function(appId) {

        const collection =
            this.getCollection(
                appId
            );

        HD.storage.set(
            "collection:" +
            appId,
            collection
        );

        HD.emit(
            "data:saved",
            {
                appId,
                collection
            }
        );

        return true;
    };


/* ---------------------------------------------------------
   ADD ITEM
   --------------------------------------------------------- */

HD.data.add =
    function(
        appId,
        data = {}
    ) {

        const collection =
            this.getCollection(
                appId
            );


        const item = {

            id:
                "item-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2, 8),

            createdAt:
                Date.now(),

            updatedAt:
                Date.now(),

            ...data

        };


        collection.push(
            item
        );


        this.saveCollection(
            appId
        );


        HD.emit(
            "data:added",
            {
                appId,
                item
            }
        );


        return item;
    };


/* ---------------------------------------------------------
   UPDATE ITEM
   --------------------------------------------------------- */

HD.data.update =
    function(
        appId,
        itemId,
        changes = {}
    ) {

        const collection =
            this.getCollection(
                appId
            );


        const index =
            collection.findIndex(
                item =>
                    item.id ===
                    itemId
            );


        if (
            index === -1
        ) {

            return null;
        }


        collection[index] = {

            ...collection[index],

            ...changes,

            updatedAt:
                Date.now()

        };


        this.saveCollection(
            appId
        );


        HD.emit(
            "data:updated",
            {
                appId,
                item:
                    collection[index]
            }
        );


        return collection[index];
    };


/* ---------------------------------------------------------
   DELETE ITEM
   --------------------------------------------------------- */

HD.data.remove =
    function(
        appId,
        itemId
    ) {

        const collection =
            this.getCollection(
                appId
            );


        const index =
            collection.findIndex(
                item =>
                    item.id ===
                    itemId
            );


        if (
            index === -1
        ) {

            return false;
        }


        const removed =
            collection.splice(
                index,
                1
            )[0];


        this.saveCollection(
            appId
        );


        HD.emit(
            "data:removed",
            {
                appId,
                item:
                    removed
            }
        );


        return true;
    };

   CLEAR COLLECTION
   --------------------------------------------------------- */

        this.collections.set(

                startHeight =
                    record.element
                        .offsetHeight;

                    event.pointerId
                );


                this.focus(
                    record

        );

            "pointermove",

                    !resizing

                            startX
                        )

                    Math.max(
                        this.minimumHeight,
                        startHeight +
                        (
                            event.clientY -
                            startY
                        )
                    );


                record.element.style.width =
                    width +

                    height +
                    "px";

            }
        );


        handle.addEventListener(
            "pointerup",

<!-- ============================================================
     APP INTERACTION ENGINE
     ============================================================ -->

<script>
"use strict";

(function () {

    const HD = window.HalDo;

    if (!HD) {
        return;
    }


    /* ============================================================
       HALDO AI INTERACTION
       ============================================================ */

    HD.appInteractions =
        HD.appInteractions || {};


    HD.appInteractions.bind =
        function (windowElement, app) {

            if (!windowElement || !app) {
                return;
            }


            /* ----------------------------------------------------
               HalDo AI
               ---------------------------------------------------- */

            const aiSend =
                windowElement.querySelector(
                    "#haldo-ai-send"
                );

            const aiInput =
                windowElement.querySelector(
                    "#haldo-ai-input"
                );

            if (aiSend && aiInput) {

                aiSend.addEventListener(
                    "click",
                    function () {

                        const text =
                            aiInput.value.trim();

                        if (!text) {
                            return;
                        }

                        let state =
                            getAppInteractionState(
                                "haldo-ai",
                                {
                                    messages: []
                                }
                            );

                        state.messages.push({
                            role: "user",
                            text
                        });


                        /*
                         * Lokale Antwortschicht.
                         *
                         * Die eigentliche intelligente AI
                         * kann später über ai-core / ai-engine
                         * angeschlossen werden.
                         */

                        const answer =
                            generateLocalAIResponse(
                                text
                            );

                        state.messages.push({
                            role: "assistant",
                            text: answer
                        });


                        saveAppInteractionState(
                            "haldo-ai",
                            state
                        );


                        if (
                            typeof app.render ===
                            "function"
                        ) {

                            app.render();

                        }

                    }
                );

            }


            /* ----------------------------------------------------
               Notes
               ---------------------------------------------------- */

            if (app.id === "notes") {

                bindNotes(
                    windowElement
                );

            }


            /* ----------------------------------------------------
               Calculator
               ---------------------------------------------------- */

            if (app.id === "calculator") {

                bindCalculator(
                    windowElement
                );

            }


            /* ----------------------------------------------------
               Clock
               ---------------------------------------------------- */

            if (app.id === "clock") {

                updateLargeClock(
                    windowElement
                );

                if (
                    !windowElement
                        .dataset
                        .clockBound
                ) {

                    windowElement.dataset
                        .clockBound = "true";

                    const timer =
                        setInterval(
                            function () {

                                if (
                                    !document
                                        .body
                                        .contains(
                                            windowElement
                                        )
                                ) {

                                    clearInterval(
                                        timer
                                    );

                                    return;
                                }

                                updateLargeClock(
                                    windowElement
                                );

                            },
                            1000
                        );

                }

            }


            /* ----------------------------------------------------
               Ezidi Keyboard
               ---------------------------------------------------- */

            if (
                app.id ===
                "ezidi-keyboard"
            ) {

                bindEzidiKeyboard(
                    windowElement
                );

            }


            /* ----------------------------------------------------
               Settings
               ---------------------------------------------------- */

            if (
                app.id ===
                "settings"
            ) {

                bindSettings(
                    windowElement
                );

            }

        };


    /* ============================================================
       STATE
       ============================================================ */

    function getAppInteractionState(
        appId,
        fallback
    ) {

        try {

            return (
                HD.storage?.get(
                    "interaction:" + appId,
                    fallback
                ) ||
                fallback
            );

        }
        catch (error) {

            return fallback;
        }

    }


    function saveAppInteractionState(
        appId,
        state
    ) {

        try {

            HD.storage?.set(
                "interaction:" + appId,
                state
            );

        }
        catch (error) {}

    }


    /* ============================================================
       LOCAL AI RESPONSE
       ============================================================ */

    function generateLocalAIResponse(
        text
    ) {

        const normalized =
            text.toLowerCase();

        if (
            normalized.includes("hallo") ||
            normalized.includes("hi") ||
            normalized.includes("hey")
        ) {

            return "Hallo! ❤️ Ich bin hier und höre dir zu. Was möchtest du wissen oder machen?";

        }


        if (
            normalized.includes("wer bist du")
        ) {

            return "Ich bin HalDo AI, der intelligente Assistent innerhalb von HalDo AI OS 22.";

        }


        if (
            normalized.includes("danke")
        ) {

            return "Sehr gerne. ❤️";

        }


        if (
            normalized.includes("uhrzeit") ||
            normalized.includes("zeit")
        ) {

            return (
                "Die aktuelle Zeit ist " +
                new Date().toLocaleTimeString(
                    "de-DE"
                ) +
                "."
            );

        }


        return (
            "Ich habe deine Nachricht verstanden: „" +
            text +
            "“. Meine vollständige AI-Engine kann diese lokale Antwortschicht später erweitern und mit weiteren HalDo AI-Diensten verbinden."
        );

    }


    /* ============================================================
       NOTES ENGINE
       ============================================================ */

    function bindNotes(
        root
    ) {

        const state =
            getAppInteractionState(
                "notes",
                {
                    notes: []
                }
            );


        const title =
            root.querySelector(
                "[data-notes-title]"
            );

        const text =
            root.querySelector(
                "[data-notes-text]"
            );


        const newButton =
            root.querySelector(
                "[data-notes-new]"
            );


        const saveButton =
            root.querySelector(
                "[data-notes-save]"
            );


        const deleteButton =
            root.querySelector(
                "[data-notes-delete]"
            );


        let selected =
            state.selected ?? null;


        if (newButton) {

            newButton.addEventListener(
                "click",
                function () {

                    selected = null;

                    if (title) {
                        title.value = "";
                    }

                    if (text) {
                        text.value = "";
                    }

                    if (title) {
                        title.focus();
                    }

                }
            );

        }


        if (saveButton) {

            saveButton.addEventListener(
                "click",
                function () {

                    const note = {

                        title:
                            title?.value.trim() ||
                            "Neue Notiz",

                        text:
                            text?.value ||
                            "",

                        updatedAt:
                            Date.now()

                    };


                    if (
                        selected !== null &&
                        state.notes[selected]
                    ) {

                        state.notes[
                            selected
                        ] = note;

                    }
                    else {

                        state.notes.push(
                            note
                        );

                        selected =
                            state.notes.length -
                            1;

                    }


                    state.selected =
                        selected;


                    saveAppInteractionState(
                        "notes",
                        state
                    );


                    if (
                        typeof HD.appManager
                            ?.refresh
                        === "function"
                    ) {

                        HD.appManager.refresh(
                            "notes"
                        );

                    }

                }
            );

        }


        if (deleteButton) {

            deleteButton.addEventListener(
                "click",
                function () {

                    if (
                        selected === null
                    ) {
                        return;
                    }

                    state.notes.splice(
                        selected,
                        1
                    );

                    selected = null;
                    state.selected = null;

                    saveAppInteractionState(
                        "notes",
                        state
                    );

                    if (
                        typeof HD.appManager
                            ?.refresh
                        === "function"
                    ) {

                        HD.appManager.refresh(
                            "notes"
                        );

                    }

                }
            );

        }


        root
            .querySelectorAll(
                "[data-note-index]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        function () {

                            selected =
                                Number(
                                    this.dataset
                                        .noteIndex
                                );

                            const note =
                                state.notes[
                                    selected
                                ];

                            if (!note) {
                                return;
                            }

                            if (title) {
                                title.value =
                                    note.title || "";
                            }

                            if (text) {
                                text.value =
                                    note.text || "";
                            }

                        }
                    );

                }
            );

    }


    /* ============================================================
       CALCULATOR ENGINE
       ============================================================ */

    function bindCalculator(
        root
    ) {

        const display =
            root.querySelector(
                "[data-calculator-display]"
            );

        if (!display) {
            return;
        }

        let expression = "";


        root
            .querySelectorAll(
                "[data-calculator]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        function () {

                            const value =
                                this.dataset
                                    .calculator;


                            if (
                                value ===
                                "clear"
                            ) {

                                expression =
                                    "";

                                display.value =
                                    "0";

                                return;
                            }


                            if (
                                value ===
                                "="
                            ) {

                                try {

                                    /*
                                     * Nur einfache mathematische
                                     * Zeichen werden akzeptiert.
                                     */

                                    if (
                                        !/^[0-9+\-*/.() ]+$/
                                            .test(
                                                expression
                                            )
                                    ) {

                                        throw new Error(
                                            "Ungültiger Ausdruck"
                                        );

                                    }

                                    const result =
                                        Function(
                                            "\"use strict\";return (" +
                                            expression +
                                            ")"
                                        )();

                                    expression =
                                        String(
                                            result
                                        );

                                    display.value =
                                        expression;

                                }
                                catch (
                                    error
                                ) {

                                    expression =
                                        "";

                                    display.value =
                                        "Fehler";

                                }

                                return;
                            }


                            expression +=
                                value;

                            display.value =
                                expression;

                        }
                    );

                }
            );

    }


    /* ============================================================
       CLOCK ENGINE
       ============================================================ */

    function updateLargeClock(
        root
    ) {

        const clock =
            root.querySelector(
                "[data-large-clock]"
            );

        const date =
            root.querySelector(
                "[data-large-date]"
            );

        const now =
            new Date();


        if (clock) {

            clock.textContent =
                now.toLocaleTimeString(
                    "de-DE"
                );

        }


        if (date) {

            date.textContent =
                now.toLocaleDateString(
                    "de-DE",
                    {
                        weekday:
                            "long",

                        day:
                            "2-digit",

                        month:

    function bindEzidiKeyboard(
        root
    ) {

        const input =
            root.querySelector(
                "[data-ezidi-input]"
            );

        if (!input) {
            return;
        }


        root
            .querySelectorAll(
                "[data-ezidi-key]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        function () {

                            const key =
                                this.dataset
                                    .ezidiKey;


                            if (
                                key ===
                                "BACKSPACE"
                            ) {

                                input.value =
                                    input.value
                                        .slice(
                                            0,
                                            -1
                                        );

                                return;
                            }


                            input.value +=
                                key;

                            input.focus();

                        }
                    );

                }
            );

    }


    /* ============================================================

       ============================================================ */

    function bindSettings(
        root
    ) {

        root
            .querySelectorAll(
                "[data-setting]"

            .forEach(
                input => {

                    const key =
                        input.dataset
                            .setting;

                    const stored =
                        HD.storage?.get(
                            "setting:" + key,
                            null
                        );


                    if (
                        typeof stored ===
                        "boolean"
                    ) {

                        input.checked =
                            stored;

                    input.addEventListener(
                        "change",
                        function () {

                            HD.storage?.set(
                                "setting:" + key,
                                this.checked
                            );

                            if (
                                HD.config

                                HD.config[key] =
                                    this.checked;

                            }

                            HD.emit(
                                "settings:changed",
                                {
                                    key,
                                    value:
                                        this.checked
                                }
                            );

                        }
                    );

                }
            );

    }


    HD.runtime?.register(
        "app-interactions",
        HD.appInteractions
    );


    HD.emit(
        "app-interactions:ready"

        return this.collections[appId];

    HD.appData.add = function (appId, data) {

        const collection =
            this.createCollection(appId);

        const record = {
            id:
                "record-" +

                "-" +
                Math.random()
                    .toString(36)
                    .slice(2),

            createdAt:
                Date.now(),

            "collection:" + appId,
            collection
        );

        HD.emit(
            "data:added",
            {
                appId,
                record
            }
        );

        return record;

        recordId,
        data

        const collection =
            this.createCollection(appId);

            collection.find(
                item =>
                    item.id === recordId

        if (!record) {

        }

        record.data =

        const removed =
            collection.splice(

            "collection:" + appId,

                )
                .forEach(

                            "change",

                                let value;

                                if (

                                    "checkbox"
                                ) {

                                    value =
                                        this.checked;

                                }
                                else {

                                    value =
                                        this.value;

                                HD.appState.patch(

                                    }
                                );

                                HD.emit(

                                    {
                                        key:

                                                .setting,

                                    }
                                );

                        );

                );

    /* =========================================================
       AI CHAT FOUNDATION

    HD.ai = HD.ai || {};

    HD.ai.conversation =
        HD.ai.conversation || [];

    HD.ai.send =
        HD.ai.send ||
        function (message) {

            const text =
                String(
                    message || ""
                ).trim();

            if (!text) {
                return "";
            }

            const entry = {

                id:
                    Date.now(),

                role:
                    "user",

                content:
                    text,

                timestamp:
                    Date.now()

            this.conversation.push(
                entry
            );

            HD.storage.set(
                "ai-conversation",
                this.conversation
            );

            HD.emit(
                "ai:message",
                entry
            );

            return text;
        };


    HD.ai.restore =
        function () {

            const stored =
                HD.storage.get(
                    "ai-conversation",
                    []
                );

            if (
                Array.isArray(stored)
            ) {

                this.conversation =
                    stored;

            }

            return this.conversation;
        };


    HD.ai.restore();


    /* =========================================================

       ========================================================= */

    HD.ai.respond =
        HD.ai.respond ||
        function (message) {

            const text =
                String(

                ).toLowerCase();


            if (
                text.includes("hallo") ||
                text.includes("hi") ||
                text.includes("hey")
            ) {

                return (
                    "Hallo ❤️ Ich bin HalDo AI. " +
                    "Ich bin hier und höre dir zu."
                );

            }


            if (
                text.includes("wer bist") ||
                text.includes("wer bist du")
            ) {

                return (
                    "Ich bin HalDo AI – der " +
                    "intelligente Assistent von " +
                    "HalDo AI OS 22."
                );

            }


            if (

            ) {

                return (
                    "Natürlich. Sag mir einfach, " +
                    "was du machen möchtest."
                );

            }


            return (
                "Ich habe deine Nachricht verstanden. " +
                "HalDo AI ist bereit, dir zu helfen."
            );

        };


    /* =========================================================
       REGISTER RUNTIME COMPONENT
       ========================================================= */

    HD.runtime.register(
        "app-data",
        HD.appData
    );

    HD.runtime.register(
        "app-capabilities",
        HD.appCapabilities
    );

    HD.runtime.register(
        "app-content",
        HD.appContent
    );

    HD.runtime.register(
        "ai-foundation",
        HD.ai
    );


    HD.emit(
        "ecosystem:part13-ready",
        {
            apps:
                HD.appRegistry
                    ?.all()
                    .length || 0
        }
    );


})();
