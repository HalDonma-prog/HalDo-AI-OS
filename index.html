<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050914"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – intelligentes, modulares Betriebssystem"
    >

    <title>HalDo AI OS 20</title>

    <!-- =========================================================
         HALDO AI OS 20
         INDEX.HTML
         PART 1 / 8

         KOMPLETTE NEUE SHELL
         ========================================================= -->

    <style>

        /* =====================================================
           ROOT
           ===================================================== */

        :root {

            --haldo-bg:
                #050914;

            --haldo-bg-2:
                #0a1020;

            --haldo-panel:
                rgba(12, 20, 38, 0.82);

            --haldo-panel-strong:
                rgba(15, 25, 47, 0.96);

            --haldo-border:
                rgba(255, 255, 255, 0.10);

            --haldo-border-light:
                rgba(255, 255, 255, 0.16);

            --haldo-text:
                #f7f9ff;

            --haldo-text-soft:
                #b9c3d9;

            --haldo-text-muted:
                #7f8ba5;

            --haldo-accent:
                #8fd8ff;

            --haldo-accent-2:
                #bca7ff;

            --haldo-success:
                #73e6b0;

            --haldo-warning:
                #ffd36e;

            --haldo-danger:
                #ff7d91;

            --haldo-radius:
                20px;

            --haldo-radius-small:
                13px;

            --haldo-shadow:
                0 24px 80px rgba(0, 0, 0, 0.42);

            --haldo-transition:
                180ms ease;

            --haldo-dock-height:
                76px;

            --haldo-topbar-height:
                52px;

            --haldo-font:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        /* =====================================================
           RESET
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        html {
            background:
                var(--haldo-bg);
            color:
                var(--haldo-text);
            font-family:
                var(--haldo-font);
            -webkit-text-size-adjust: 100%;
        }

        body {

            min-height: 100%;

            overflow:
                hidden;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(89, 142, 255, 0.08),
                    transparent 42%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(169, 105, 255, 0.06),
                    transparent 35%
                ),
                var(--haldo-bg);

            color:
                var(--haldo-text);

            -webkit-font-smoothing:
                antialiased;

            text-rendering:
                optimizeLegibility;
        }

        button,
        input,
        textarea,
        select {
            font:
                inherit;
        }

        button {
            color:
                inherit;
        }

        button,
        [role="button"] {
            -webkit-tap-highlight-color:
                transparent;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline:
                2px solid var(--haldo-accent);

            outline-offset:
                2px;
        }

        /* =====================================================
           DESKTOP
           ===================================================== */

        #haldo-os {

            position:
                fixed;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            isolation:
                isolate;
        }

        #haldo-wallpaper {

            position:
                absolute;

            inset:
                0;

            z-index:
                0;

            overflow:
                hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(90, 151, 255, 0.13),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 20% 20%,
                    rgba(183, 133, 255, 0.08),
                    transparent 24%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(75, 218, 255, 0.06),
                    transparent 28%
                ),
                linear-gradient(
                    145deg,
                    #030611 0%,
                    #07101e 48%,
                    #030610 100%
                );
        }

        #haldo-wallpaper::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            opacity:
                0.42;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.8) 0 1px,
                    transparent 1.4px
                );

            background-size:
                83px 83px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 20%,
                    black 75%,
                    transparent
                );

            animation:
                haldoStars 38s linear infinite;
        }

        #haldo-wallpaper::after {

            content:
                "";

            position:
                absolute;

            width:
                70vw;

            height:
                70vw;

            max-width:
                800px;

            max-height:
                800px;

            left:
                50%;

            top:
                47%;

            transform:
                translate(-50%, -50%);

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle,
                    rgba(104, 176, 255, 0.06),
                    rgba(138, 105, 255, 0.025) 40%,
                    transparent 70%
                );

            filter:
                blur(8px);

            pointer-events:
                none;
        }

        @keyframes haldoStars {

            from {
                transform:
                    translateY(0);
            }

            to {
                transform:
                    translateY(83px);
            }
        }

        /* =====================================================
           TOP BAR
           ===================================================== */

        #haldo-topbar {

            position:
                absolute;

            top:
                0;

            left:
                0;

            right:
                0;

            height:
                var(--haldo-topbar-height);

            z-index:
                100;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 14px;

            background:
                rgba(4, 8, 18, 0.64);

            border-bottom:
                1px solid var(--haldo-border);

            backdrop-filter:
                blur(24px);

            -webkit-backdrop-filter:
                blur(24px);
        }

        .haldo-top-left,
        .haldo-top-right {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            min-width:
                0;
        }

        .haldo-brand {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                9px;

            min-width:
                0;

            border:
                0;

            background:
                transparent;

            cursor:
                pointer;

            padding:
                5px 7px;

            border-radius:
                12px;
        }

        .haldo-brand:hover {
            background:
                rgba(255,255,255,0.06);
        }

        .haldo-brand-mark {

            width:
                30px;

            height:
                30px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                50%;

            font-size:
                17px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #a9e8ff 25%,
                    #8f83ff 65%,
                    #32296e
                );

            color:
                #11182d;

            box-shadow:
                0 0 24px rgba(134, 201, 255, 0.35);
        }

        .haldo-brand-name {

            font-size:
                14px;

            font-weight:
                700;

            white-space:
                nowrap;
        }

        .haldo-brand-version {

            font-size:
                10px;

            color:
                var(--haldo-text-muted);

            white-space:
                nowrap;
        }

        .haldo-system-time {

            min-width:
                78px;

            text-align:
                center;

            font-size:
                12px;

            font-weight:
                600;

            color:
                var(--haldo-text-soft);
        }

        .haldo-status-button {

            width:
                34px;

            height:
                34px;

            display:
                grid;

            place-items:
                center;

            border:
                1px solid transparent;

            border-radius:
                11px;

            background:
                transparent;

            cursor:
                pointer;

            transition:
                var(--haldo-transition);
        }

        .haldo-status-button:hover {

            background:
                rgba(255,255,255,0.07);

            border-color:
                var(--haldo-border);
        }

        .haldo-online-dot {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--haldo-success);

            box-shadow:
                0 0 12px rgba(115, 230, 176, 0.75);
        }

        /* =====================================================
           MAIN DESKTOP AREA
           ===================================================== */

        #haldo-main {

            position:
                absolute;

            top:
                var(--haldo-topbar-height);

            left:
                0;

            right:
                0;

            bottom:
                0;

            z-index:
                10;

            overflow:
                hidden;
        }

        #haldo-desktop {

            position:
                absolute;

            inset:
                0;

            padding:
                34px 24px calc(var(--haldo-dock-height) + 26px);

            overflow:
                auto;

            scrollbar-width:
                thin;

            scrollbar-color:
                rgba(255,255,255,0.16)
                transparent;
        }

        /* =====================================================
           HOME
           ===================================================== */

        #haldo-home {

            width:
                min(1120px, 100%);

            min-height:
                100%;

            margin:
                0 auto;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            gap:
                30px;
        }

        .haldo-home-hero {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            text-align:
                center;

            gap:
                10px;
        }

        .haldo-home-logo {

            width:
                94px;

            height:
                94px;

            display:
                grid;

            place-items:
                center;

            border-radius:
                50%;

            font-size:
                42px;

            color:
                #17213d;

            background:
                radial-gradient(
                    circle at 32% 27%,
                    #ffffff,
                    #b7edff 24%,
                    #a58eff 61%,
                    #31255f 100%
                );

            box-shadow:
                0 0 55px rgba(130, 192, 255, 0.22),
                inset 0 0 24px rgba(255,255,255,0.3);

            animation:
                haldoLogoFloat 5s ease-in-out infinite;
        }

        @keyframes haldoLogoFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-7px)
                    scale(1.025);
            }
        }

        .haldo-home-hero h1 {

            margin:
                0;

            font-size:
                clamp(28px, 5vw, 48px);

            line-height:
                1.05;

            letter-spacing:
                -0.035em;
        }

        .haldo-home-hero p {

            margin:
                0;

            color:
                var(--haldo-text-soft);

            font-size:
                14px;
        }

        /* =====================================================
           QUICK ACTIONS
           ===================================================== */

        .haldo-quick-grid {

            display:
                grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap:
                12px;
        }

        .haldo-quick-card {

            min-height:
                116px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                flex-start;

            justify-content:
                center;

            gap:
                6px;

            padding:
                18px;

            border:
                1px solid var(--haldo-border);

            border-radius:
                var(--haldo-radius);

            background:
                rgba(12, 20, 38, 0.62);

            box-shadow:
                0 12px 38px rgba(0,0,0,0.16);

            cursor:
                pointer;

            text-align:
                left;

            transition:
                transform var(--haldo-transition),
                background var(--haldo-transition),
                border-color var(--haldo-transition);
        }

        .haldo-quick-card:hover {

            transform:
                translateY(-2px);

            background:
                rgba(20, 31, 56, 0.8);

            border-color:
                var(--haldo-border-light);
        }

        .haldo-quick-icon {

            font-size:
                24px;

            margin-bottom:
                4px;
        }

        .haldo-quick-card strong {

            font-size:
                14px;
        }

        .haldo-quick-card small {

            color:
                var(--haldo-text-muted);

            font-size:
                11px;
        }

        /* =====================================================
           SYSTEM INFORMATION
           ===================================================== */

        .haldo-system-summary {

            display:
                grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap:
                12px;
        }

        .haldo-summary-card {

            padding:
                16px;

            border:
                1px solid var(--haldo-border);

            border-radius:
                var(--haldo-radius-small);

            background:
                rgba(9, 16, 31, 0.55);
        }

        .haldo-summary-card span {

            display:
                block;

            margin-bottom:
                6px;

            color:
                var(--haldo-text-muted);

            font-size:
                11px;
        }

        .haldo-summary-card strong {

            font-size:
                15px;
        }

        /* =====================================================
           DOCK
           ===================================================== */

        #haldo-dock {

            position:
                absolute;

            left:
                50%;

            bottom:
                14px;

            transform:
                translateX(-50%);

            z-index:
                200;

            height:
                60px;

            max-width:
                calc(100% - 28px);

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            padding:
                7px;

            border:
                1px solid var(--haldo-border-light);

            border-radius:
                20px;

            background:
                rgba(7, 12, 25, 0.78);

            box-shadow:
                var(--haldo-shadow);

            backdrop-filter:
                blur(28px);

            -webkit-backdrop-filter:
                blur(28px);
        }

        .haldo-dock-button {

            width:
                46px;

            height:
                46px;

            display:
                grid;

            place-items:
                center;

            border:
                0;

            border-radius:
                14px;

            background:
                transparent;

            cursor:
                pointer;

            font-size:
                21px;

            transition:
                transform var(--haldo-transition),
                background var(--haldo-transition);
        }

        .haldo-dock-button:hover {

            transform:
                translateY(-4px);

            background:
                rgba(255,255,255,0.08);
        }

        .haldo-dock-separator {

            width:
                1px;

            height:
                30px;

            margin:
                0 3px;

            background:
                var(--haldo-border);
        }

        /* =====================================================
           APP AREA
           ===================================================== */

        #haldo-app-layer {

            position:
                absolute;

            inset:
                0;

            z-index:
                500;

            pointer-events:
                none;
        }

        #haldo-window-layer {

            position:
                absolute;

            inset:
                0;

            pointer-events:
                none;
        }

        /* =====================================================
           GENERIC WINDOW
           ===================================================== */

        .haldo-window {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                min(900px, calc(100vw - 30px));

            height:
                min(650px, calc(100vh - 130px));

            transform:
                translate(-50%, -50%);

            display:
                flex;

            flex-direction:
                column;

            overflow:
                hidden;

            border:
                1px solid var(--haldo-border-light);

            border-radius:
                22px;

            background:
                var(--haldo-panel-strong);

            box-shadow:
                0 32px 100px rgba(0,0,0,0.55);

            backdrop-filter:
                blur(28px);

            -webkit-backdrop-filter:
                blur(28px);

            pointer-events:
                auto;

            animation:
                haldoWindowOpen 180ms ease-out;
        }

        @keyframes haldoWindowOpen {

            from {
                opacity:
                    0;

                transform:
                    translate(-50%, -48%)
                    scale(.985);
            }

            to {
                opacity:
                    1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        .haldo-window-header {

            height:
                54px;

            flex:
                0 0 54px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 12px 0 16px;

            border-bottom:
                1px solid var(--haldo-border);

            background:
                rgba(255,255,255,0.025);
        }

        .haldo-window-title {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            min-width:
                0;
        }

        .haldo-window-title-icon {

            font-size:
                18px;
        }

        .haldo-window-title-text {

            min-width:
                0;
        }

        .haldo-window-title-text strong {

            display:
                block;

            font-size:
                13px;
        }

        .haldo-window-title-text small {

            display:
                block;

            margin-top:
                2px;

            color:
                var(--haldo-text-muted);

            font-size:
                10px;
        }

        .haldo-window-actions {

            display:
                flex;

            align-items:
                center;

            gap:
                4px;
        }

        .haldo-window-action {

            width:
                32px;

            height:
                32px;

            display:
                grid;

            place-items:
                center;

            border:
                0;

            border-radius:
                9px;

            background:
                transparent;

            cursor:
                pointer;

            color:
                var(--haldo-text-soft);
        }

        .haldo-window-action:hover {

            background:
                rgba(255,255,255,0.08);

            color:
                var(--haldo-text);
        }

        .haldo-window-body {

            flex:
                1;

            min-height:
                0;

            overflow:
                auto;

            padding:
                20px;
        }

        /* =====================================================
           APP PLACEHOLDER CONTAINER
           ===================================================== */

        #haldo-app-root {

            position:
                absolute;

            inset:
                0;

            pointer-events:
                none;
        }

        /* =====================================================
           LAUNCHER
           ===================================================== */

        #haldo-launcher {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                min(820px, calc(100vw - 30px));

            max-height:
                min(680px, calc(100vh - 100px));

            transform:
                translate(-50%, -50%)
                scale(.98);

            opacity:
                0;

            visibility:
                hidden;

            display:
                flex;

            flex-direction:
                column;

            overflow:
                hidden;

            border:
                1px solid var(--haldo-border-light);

            border-radius:
                24px;

            background:
                rgba(8, 14, 28, 0.95);

            box-shadow:
                0 36px 120px rgba(0,0,0,0.65);

            backdrop-filter:
                blur(34px);

            -webkit-backdrop-filter:
                blur(34px);

            pointer-events:
                none;

            transition:
                opacity 160ms ease,
                transform 160ms ease,
                visibility 160ms ease;
        }

        #haldo-launcher.is-open {

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity:
                1;

            visibility:
                visible;

            pointer-events:
                auto;
        }

        .haldo-launcher-header {

            padding:
                18px;

            border-bottom:
                1px solid var(--haldo-border);
        }

        .haldo-launcher-search {

            width:
                100%;

            height:
                46px;

            padding:
                0 15px;

            border:
                1px solid var(--haldo-border);

            border-radius:
                13px;

            background:
                rgba(255,255,255,0.05);

            color:
                var(--haldo-text);

            outline:
                none;
        }

        .haldo-launcher-search:focus {

            border-color:
                rgba(143,216,255,.45);

            background:
                rgba(255,255,255,0.07);
        }

        .haldo-launcher-grid {

            flex:
                1;

            overflow:
                auto;

            padding:
                18px;

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(150px, 1fr)
                );

            gap:
                10px;
        }

        /* =====================================================
           TOASTS
           ===================================================== */

        #haldo-notifications {

            position:
                fixed;

            top:
                66px;

            right:
                14px;

            z-index:
                2000;

            width:
                min(360px, calc(100vw - 28px));

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

            pointer-events:
                none;
        }

        .haldo-toast {

            padding:
                13px 14px;

            border:
                1px solid var(--haldo-border-light);

            border-radius:
                14px;

            background:
                rgba(9, 16, 31, 0.94);

            box-shadow:
                0 20px 60px rgba(0,0,0,.4);

            backdrop-filter:
                blur(20px);

            animation:
                haldoToastIn 180ms ease-out;
        }

        .haldo-toast strong {

            display:
                block;

            font-size:
                12px;

            margin-bottom:
                3px;
        }

        .haldo-toast span {

            display:
                block;

            color:
                var(--haldo-text-soft);

            font-size:
                11px;

            line-height:
                1.45;
        }

        @keyframes haldoToastIn {

            from {
                opacity:
                    0;

                transform:
                    translateY(-6px);
            }

            to {
                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            :root {
                --haldo-dock-height:
                    72px;
            }

            #haldo-topbar {
                padding:
                    0 8px;
            }

            .haldo-brand-version {
                display:
                    none;
            }

            .haldo-system-time {
                min-width:
                    auto;
            }

            #haldo-desktop {
                padding:
                    24px 14px 94px;
            }

            .haldo-quick-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .haldo-system-summary {
                grid-template-columns:
                    1fr;
            }

            .haldo-home-logo {
                width:
                    78px;

    <script>

        "use strict";

        /*
         * -------------------------------------------------------
         * HALDO GLOBAL NAMESPACE
         * -------------------------------------------------------
         *
         * Diese neue Shell darf nicht von alten Inline-Teilen
         * abhängig sein.
         *
         * Alle weiteren Teile registrieren ihre Systeme hier.
         * -------------------------------------------------------
         */

        window.HalDo =
            window.HalDo ||
            {};

        const HalDo =
            window.HalDo;

        HalDo.version =
            "20.0.0";

        HalDo.name =
            "HalDo AI OS";

        HalDo.codename =
            "Cosmic";

        HalDo.build =
            "20.0.0-foundation";

        /*
         * -------------------------------------------------------
         * BASIC UTILITIES
         * -------------------------------------------------------
         */

        HalDo.utils =
            HalDo.utils ||
            {};

        HalDo.utils.escape =
            function(value) {

                const text =
                    String(
                        value ??
                        ""
                    );

                return text
                    .replace(
                        /&/g,
                        "&amp;"
                    )
                    .replace(
                        /</g,
                        "&lt;"
                    )
                    .replace(
                        />/g,
                        "&gt;"
                    )
                    .replace(
                        /"/g,
                        "&quot;"
                    )
                    .replace(
                        /'/g,
                        "&#039;"
                    );

            };

        HalDo.utils.id =
            function(prefix = "haldo") {

                return (
                    prefix +
                    "-" +
                    Date.now().toString(36) +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2, 9)
                );

            };

        HalDo.utils.now =
            function() {

                return Date.now();

            };

        HalDo.utils.isObject =
            function(value) {

                return (
                    value !== null &&
                    typeof value ===
                        "object" &&
                    !Array.isArray(
                        value
                    )
                );

            };

        /*
         * -------------------------------------------------------
         * DOM API
         * -------------------------------------------------------
         */

        HalDo.dom =
            HalDo.dom ||
            {};

        HalDo.dom.get =
            function(selector, root = document) {

                return root.querySelector(
                    selector
                );

            };

        HalDo.dom.getAll =
            function(selector, root = document) {

                return [
                    ...root.querySelectorAll(
                        selector
                    )
                ];

            };

        HalDo.dom.create =
            function(
                tag,
                options = {}
            ) {

                const element =
                    document.createElement(
                        tag
                    );

                if (
                    options.className
                ) {

                    element.className =
                        options.className;

                }

                if (
                    options.id
                ) {

                    element.id =
                        options.id;

                }

                if (
                    options.text !==
                    undefined
                ) {

                    element.textContent =
                        String(
                            options.text
                        );

                }

                if (
                    options.html
                ) {

                    element.innerHTML =
                        options.html;

                }

                if (
                    options.attributes
                ) {

                    Object.entries(
                        options.attributes
                    ).forEach(
                        ([key, value]) => {

                            element.setAttribute(
                                key,
                                value
                            );

                        }
                    );

                }

                return element;

            };

        /*
         * -------------------------------------------------------
         * EVENT BUS
         * -------------------------------------------------------
         */

        HalDo.events =
            HalDo.events ||
            {

                listeners:
                    new Map(),

                on(
                    event,
                    callback
                ) {

                    if (
                        typeof callback !==
                        "function"
                    ) {

                        return () => {};

                    }

                    if (
                        !this.listeners.has(
                            event
                        )
                    ) {

                        this.listeners.set(
                            event,
                            new Set()
                        );

                    }

                    const set =
                        this.listeners.get(
                            event
                        );

                    set.add(
                        callback
                    );

                    return () => {

                        set.delete(
                            callback
                        );

                    };

                },

                off(
                    event,
                    callback
                ) {

                    const set =
                        this.listeners.get(
                            event
                        );

                    if (
                        !set
                    ) {

                        return;

                    }

                    set.delete(
                        callback
                    );

                },

                emit(
                    event,
                    detail = {}
                ) {

                    const set =
                        this.listeners.get(
                            event
                        );

                    if (
                        set
                    ) {

                        [
                            ...set
                        ].forEach(
                            callback => {

                                try {

                                    callback(
                                        detail
                                    );

                                } catch (
                                    error
                                ) {

                                    console.error(
                                        "[HalDo Event Error]",
                                        event,
                                        error
                                    );

                                }

                            }
                        );

                    }

                    const wildcard =
                        this.listeners.get(
                            "*"
                        );

                    if (
                        wildcard
                    ) {

                        [
                            ...wildcard
                        ].forEach(
                            callback => {

                                try {

                                    callback(
                                        {
                                            event,
                                            detail
                                        }
                                    );

                                } catch (
                                    error
                                ) {

                                    console.error(
                                        "[HalDo Wildcard Event Error]",
                                        error
                                    );

                                }

                            }
                        );

                    }

                }

            };

        HalDo.on =
            HalDo.events.on.bind(
                HalDo.events
            );

        HalDo.off =
            HalDo.events.off.bind(
                HalDo.events
            );

        HalDo.emit =
            HalDo.events.emit.bind(
                HalDo.events
            );

        /*
         * -------------------------------------------------------
         * STATE
         * -------------------------------------------------------
         */

        HalDo.state =
            HalDo.state ||
            {

                data:
                    {

                        boot:
                            false,

                        ready:
                            false,

                        currentView:
                            "home",

                        currentApp:
                            null

                    },

                get(
                    key,
                    fallback = null
                ) {

                    return (
                        this.data[key] ??
                        fallback
                    );

                },

                set(
                    key,
                    value
                ) {

                    this.data[key] =
                        value;

                    HalDo.emit(
                        "state:changed",
                        {
                            key,
                            value
                        }
                    );

                    return value;

                }

            };

        /*
         * -------------------------------------------------------
         * RUNTIME
         * -------------------------------------------------------
         */

        HalDo.runtime =
            HalDo.runtime ||
            {

                state:
                    "created",

                startedAt:
                    null,

                readyAt:
                    null,

                error:
                    null,

                setState(
                    state
                ) {

                    this.state =
                        state;

                    HalDo.emit(
                        "runtime:state",
                        {
                            state
                        }
                    );

                }

            };

        /*
         * -------------------------------------------------------
         * LOGGING
         * -------------------------------------------------------
         */

        HalDo.log =
            function(
                ...args
            ) {

                console.log(
                    "[HalDo]",
                    ...args
                );

            };

        HalDo.warn =
            function(
                ...args
            ) {

                console.warn(
                    "[HalDo]",
                    ...args
                );

            };

        HalDo.error =
            function(
                ...args
            ) {

                console.error(
                    "[HalDo]",
                    ...args
                );

            };

        /*
         * -------------------------------------------------------
         * BASIC UI OBJECT
         * -------------------------------------------------------
         */

        HalDo.ui =
            HalDo.ui ||
            {};

        HalDo.ui.elements =
            {

                os:
                    document.getElementById(
                        "haldo-os"
                    ),

                desktop:
                    document.getElementById(
                        "haldo-desktop"
                    ),

                home:
                    document.getElementById(
                        "haldo-home"
                    ),

                appRoot:
                    document.getElementById(
                        "haldo-app-root"
                    ),

                windowLayer:
                    document.getElementById(
                        "haldo-window-layer"
                    ),

                launcher:
                    document.getElementById(
                        "haldo-launcher"
                    ),

                launcherGrid:
                    document.getElementById(
                        "haldo-launcher-grid"
                    ),

                launcherSearch:
                    document.getElementById(
                        "haldo-launcher-search"
                    ),

                notifications:
                    document.getElementById(
                        "haldo-notifications"
                    ),

                time:
                    document.getElementById(
                        "haldo-system-time"
                    ),

                online:
                    document.getElementById(
                        "haldo-online-dot"
                    ),

                summaryApps:
                    document.getElementById(
                        "haldo-summary-apps"
                    ),

                summaryStatus:
                    document.getElementById(
                        "haldo-summary-status"
                    )

            };

        HalDo.ui.get =
            function(
                name
            ) {

                return (
                    this.elements[name] ||
                    null
                );

            };

        /*
         * -------------------------------------------------------
         * INITIAL TIME
         * -------------------------------------------------------
         */

        HalDo.ui.updateClock =
            function() {

                const element =
                    this.get(
                        "time"
                    );

                if (
                    !element
                ) {

                    return;

                }

                const now =
                    new Date();

                element.textContent =
                    now.toLocaleTimeString(
                        "de-DE",
                        {
                            hour:
                                "2-digit",

                            minute:
                                "2-digit",

                            second:
                                "2-digit"
                        }
                    );

            };

        HalDo.ui.updateClock();

        window.setInterval(
            () => {

                HalDo.ui.updateClock();

            },
            1000
        );

        /*
         * -------------------------------------------------------
         * NETWORK INDICATOR
         * -------------------------------------------------------
         */

        HalDo.network =
            HalDo.network ||
            {

                online:
                    navigator.onLine,

                updateUI() {

                    const dot =
                        HalDo.ui.get(
                            "online"
                        );

                    if (
                        !dot
                    ) {

                        return;

                    }

                    dot.style.background =
                        this.online
                            ? "var(--haldo-success)"
                            : "var(--haldo-danger)";

                    dot.style.boxShadow =
                        this.online
                            ? "0 0 12px rgba(115,230,176,.75)"
                            : "0 0 12px rgba(255,125,145,.75)";

                    dot.title =
                        this.online
                            ? "Online"
                            : "Offline";

                }

            };

        HalDo.network.updateUI();

        window.addEventListener(
            "online",
            () => {

                HalDo.network.online =
                    true;

                HalDo.network.updateUI();

                HalDo.emit(
                    "network:online"
                );

            }
        );

        window.addEventListener(
            "offline",
            () => {

                HalDo.network.online =
                    false;

                HalDo.network.updateUI();

                HalDo.emit(
                    "network:offline"
                );

            }
        );

        /*
         * -------------------------------------------------------
         * NOTIFICATIONS
         * -------------------------------------------------------
         */

        HalDo.notifications =
            HalDo.notifications ||
            {

                show(
                    title,
                    message,
                    options = {}
                ) {

                    const container =
                        HalDo.ui.get(
                            "notifications"
                        );

                    if (
                        !container
                    ) {

                        return;

                    }

                    const toast =
                        document.createElement(
                            "div"
                        );

                    toast.className =
                        "haldo-toast";

                    toast.innerHTML = `

                        <strong>
                            ${HalDo.utils.escape(
                                title ||
                                "HalDo"
                            )}
                        </strong>

                        <span>
                            ${HalDo.utils.escape(
                                message ||
                                ""
                            )}
                        </span>

                    `;

                    container.appendChild(
                        toast
                    );

                    const duration =
                        Number(
                            options.duration ||
                            3500
                        );

                    window.setTimeout(
                        () => {

                            toast.remove();

                        },
                        duration
                    );

                }

            };

        /*
         * -------------------------------------------------------
         * ERROR RECOVERY
         * -------------------------------------------------------
         */

        window.addEventListener(
            "error",
            event => {

                HalDo.runtime.error =
                    event.error ||
                    new Error(
                        event.message ||
                        "Unbekannter Fehler"
                    );

                HalDo.error(
                    "Runtime Error:",
                    HalDo.runtime.error
                );

                HalDo.emit(
                    "runtime:error",
                    {
                        error:
                            HalDo.runtime.error
                    }
                );

            }
        );

        window.addEventListener(
            "unhandledrejection",
            event => {

                HalDo.runtime.error =
                    event.reason ||
                    new Error(
                        "Unhandled Promise Rejection"
                    );

                HalDo.error(
                    "Promise Error:",
                    HalDo.runtime.error
                );

                HalDo.emit(
                    "runtime:error",
                    {
                        error:
                            HalDo.runtime.error
                    }
                );

            }
        );

        /*
         * -------------------------------------------------------
         * FOUNDATION READY
         * -------------------------------------------------------
         */

        HalDo.runtime.setState(
            "foundation-ready"
        );

        HalDo.emit(
            "foundation:ready",
            {
                version:
                    HalDo.version
            }
        );

        HalDo.log(
            "HalDo AI OS 20 Foundation geladen."
        );

    </script>

<script>
"use strict";

/* =========================================================
   HALDO STORAGE
   ========================================================= */

(function () {

    const HalDo = window.HalDo;

    if (!HalDo) {
        throw new Error(
            "HalDo Foundation wurde vor dem Storage nicht geladen."
        );
    }

    const PREFIX =
        "haldo-ai-os-20:";

    const memoryStore =
        new Map();

    HalDo.storage =
        HalDo.storage ||
        {};

    HalDo.storage.prefix =
        PREFIX;

    HalDo.storage.memory =
        memoryStore;

    HalDo.storage.serialize =
        function (value) {

            try {
                return JSON.stringify(value);
            } catch (error) {

                HalDo.error(
                    "Storage serialize error",
                    error
                );

                return null;
            }

        };

    HalDo.storage.deserialize =
        function (value, fallback = null) {

            if (
                value === null ||
                value === undefined
            ) {
                return fallback;
            }

            try {
                return JSON.parse(value);
            } catch (error) {

                HalDo.warn(
                    "Storage deserialize error",
                    error
                );

                return fallback;
            }

        };

    HalDo.storage.available =
        function () {

            try {

                const testKey =
                    PREFIX +
                    "__test__";

                window.localStorage.setItem(
                    testKey,
                    "1"
                );

                window.localStorage.removeItem(
                    testKey
                );

                return true;

            } catch (error) {

                return false;
            }

        };

    HalDo.storage.set =
        function (
            key,
            value
        ) {

            const fullKey =
                PREFIX +
                String(key);

            memoryStore.set(
                fullKey,

                    "kernel:module-unregistered",
                    {
                        name
                    }
                );

            }

            return result;
        };

        function (
            name
        ) {

            return this.modules.get(
                name
            ) || null;

        };

    HalDo.kernel.has =
        function (
            name
        ) {

            return this.modules.has(
                name
            );

        function () {

       SERVICES

    HalDo.kernel.registerService =
        function (

                );

            }

                name,
                service

                {
                    name,
                    service

                        module
                    }

                return module;

                    name

                    module.autoStart ===
                    true

                "kernel:ready"

        };

       --------------------------------------------------------- */

        "foundation",

            name:
                "Foundation",

            version:
                HalDo.version,

    );

(function () {

                !definition.id

                );

                id:
                    String(
                        definition.id
                    ),

                    definition.name ||
                    definition.id,

                description:
                    definition.description ||
                    "",

                icon:
                    definition.icon ||
                    "◈",

                category:
                    definition.category ||
                    "system",

                    definition.version ||
                    "20.0.0",

                    Number(
                        definition.order ??
                        999
                    ),

                singleton:
                    definition.singleton !==
                    false,

                system:
                    definition.system === true,

                    definition.enabled !==
                    false,

                    typeof definition.factory ===
                    "function"
                        ? definition.factory
                        : null,

                metadata:
                    definition.metadata ||
                    {},

                registeredAt:
                    Date.now()

            const previous =
                registry.apps.get(
                    app.id

            registry.apps.set(
                app.id,
                app

            if (
                !registry.categories.has(
                    app.category

                registry.categories.set(
                    app.category,

                .get(

                    app,

        function (id) {

                registry.apps.get(
                    id

            if (!app) {
                return false;

                id

                registry.categories.get(

                        }

            this.render();

    launcher.open =
        function () {

            if (!this.element) {
                this.initialize();
            }

            if (!this.element) {
                return;
            }

            this.opened =
                true;

            this.element.hidden =
                false;

            this.element.classList.add(
                "is-open"
            );

            if (
                this.searchInput
            ) {

                this.searchInput.value =
                    "";

                this.search(
                    ""
                );

                setTimeout(
                    () => {

                        this.searchInput.focus();

                    },
                    30
                );

            }

            HalDo.emit(
                "launcher:open"
            );

        };

    launcher.close =
        function () {

            if (!this.element) {
                return;
            }

            this.opened =
                false;

            this.element.classList.remove(
                "is-open"
            );

            this.element.hidden =
                true;

            HalDo.emit(
                "launcher:close"
            );

        };

    launcher.toggle =
        function () {

            if (
                this.opened
            ) {

                this.close();

            } else {

                this.open();

            }

        };

    launcher.render =
        function (
            query = ""
        ) {

            if (!this.results) {
                return;
            }

            const normalized =
                String(
                    query
                )
                .trim()
                .toLowerCase();

            const apps =
                HalDo.appRegistry
                    .list({
                        enabledOnly:
                            true
                    })
                    .filter(
                        app => {

                            if (!normalized) {
                                return true;
                            }

                            return (

                                app.name
                                    .toLowerCase()
                                    .includes(
                                        normalized
                                    )

                                ||

                                app.id
                                    .toLowerCase()
                                    .includes(
                                        normalized
                                    )

                                ||

                                app.description
                                    .toLowerCase()
                                    .includes(
                                        normalized
                                    )

                            );

                        }
                    );

            this.results.innerHTML =
                "";

            if (!apps.length) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.className =
                    "haldo-launcher-empty";

                empty.textContent =
                    "Keine passende App gefunden.";

                this.results.appendChild(
                    empty
                );

                return;
            }

            apps.forEach(
                app => {

                    const item =
                        document.createElement(
                            "button"
                        );

                    item.type =
                        "button";

                    item.className =
                        "haldo-launcher-result";

                    item.dataset.appId =
                        app.id;

                    item.innerHTML = `

                        <span
                            class="haldo-launcher-result-icon"
                        >
                            ${HalDo.utils.escape(
                                app.icon
                            )}
                        </span>

                        <span
                            class="haldo-launcher-result-content"
                        >

                            <strong>
                                ${HalDo.utils.escape(
                                    app.name
                                )}
                            </strong>

                            <small>
                                ${HalDo.utils.escape(
                                    app.description
                                )}
                            </small>

                        </span>

                        <span
                            class="haldo-launcher-result-arrow"
                        >
                            ›
                        </span>

                    item.addEventListener(
                        "click",
                        () => {

                            this.launch(
                                app.id
                            );

                        }
                    );

                    this.results.appendChild(
                        item
                    );

                }
            );

        };

    launcher.search =
        function (
            query
        ) {

            this.render(
                query
            );

        };

    launcher.launch =
        async function (
            id
        ) {

            const instance =
                await HalDo.appManager.open(
                    id
                );

            if (
                instance
            ) {

                this.close();

            }

            return instance;
        };


    /* =========================================================
       DESKTOP NAVIGATION
       ========================================================= */

    HalDo.navigation =
        HalDo.navigation ||
        {};

    const navigation =
        HalDo.navigation;

    navigation.initialize =
        function () {

            document.addEventListener(
                "click",
                async event => {

                    const target =
                        event.target.closest(
                            "[data-haldo-action]"
                        );

                    if (!target) {
                        return;
                    }

                    const action =
                        target.dataset.haldoAction;

                    if (!action) {
                        return;
                    }

                    event.preventDefault();

                    switch (
                        action
                    ) {

                        case "launcher":
                            launcher.toggle();
                            break;

                        case "home":
                            await HalDo.router.navigate(
                                "home"
                            );
                            break;

                        case "back":
                            await HalDo.router.back();
                            break;

                        case "apps":
                            await HalDo.appManager.open(
                                "apps"
                            );
                            break;

                        case "settings":
                            await HalDo.appManager.open(
                                "settings"
                            );
                            break;

                        case "ai":
                            await HalDo.appManager.open(
                                "ai"
                            );
                            break;

                        case "close-launcher":
                            launcher.close();
                            break;

                        default:

                            if (
                                action.startsWith(
                                    "open:"
                                )
                            ) {

                                const id =
                                    action.slice(
                                        5
                                    );

                                await HalDo.appManager.open(
                                    id
                                );

                            }

                            break;

                    }

                }
            );

            document.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Escape" &&
                        launcher.opened
                    ) {

                        launcher.close();

                    }

                    if (
                        (
                            event.metaKey ||
                            event.ctrlKey
                        ) &&
                        event.key.toLowerCase() ===
                        "k"
                    ) {

                        event.preventDefault();

                        launcher.toggle();

                    }

                }
            );

        };


    /* =========================================================
       DESKTOP QUICK APP BUTTONS
       ========================================================= */

    navigation.renderQuickApps =
        function () {

            const container =
                HalDo.ui.get(
                    "quickApps"
                );

            if (!container) {
                return;
            }

            const apps =
                HalDo.appRegistry
                    .list({
                        enabledOnly:
                            true
                    })
                    .slice(
                        0,
                        8
                    );

            container.innerHTML =
                "";

            apps.forEach(
                app => {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.type =
                        "button";

                    button.className =
                        "haldo-quick-app";

                    button.dataset.appId =
                        app.id;

                    button.title =
                        app.name;

                    button.innerHTML = `

                        <span>
                            ${HalDo.utils.escape(
                                app.icon
                            )}
                        </span>

                        <small>
                            ${HalDo.utils.escape(
                                app.name
                            )}
                        </small>

                    `;

                    button.addEventListener(
                        "click",
                        () => {

                            HalDo.appManager.open(
                                app.id
                            );

                        }
                    );

                    container.appendChild(
                        button
                    );

                }
            );

        };


    /* =========================================================
       TASKBAR
       ========================================================= */

    HalDo.taskbar =
        HalDo.taskbar ||
        {};

    HalDo.taskbar.render =
        function () {

            const container =
                HalDo.ui.get(
                    "taskbarApps"
                );

            if (!container) {
                return;
            }

            container.innerHTML =
                "";

            HalDo.appManager
                .listOpen()
                .forEach(
                    instance => {

                        const button =
                            document.createElement(
                                "button"
                            );

                        button.type =
                            "button";

                        button.className =
                            "haldo-taskbar-app";

                        button.textContent =
                            instance.app.icon;

                        button.title =
                            instance.app.name;

                        button.addEventListener(
                            "click",
                            () => {

                                if (
                                    instance.element
                                        ?.style.display ===
                                    "none"
                                ) {

                                    wm.restore(
                                        instance
                                    );

                                } else {

                                    wm.focus(
                                        instance
                                    );

                                }

                            }
                        );

                        container.appendChild(
                            button
                        );

                    }
                );

        };


    /* =========================================================
       EVENT CONNECTIONS
       ========================================================= */

    HalDo.on(
        "app:opened",
        () => {

            navigation.renderQuickApps();
            HalDo.taskbar.render();

        }
    );

    HalDo.on(
        "app:closed",
        () => {

            HalDo.taskbar.render();

        }
    );

    HalDo.on(
        "app:registered",
        () => {

            navigation.renderQuickApps();

        }
    );


    /* =========================================================
       KERNEL MODULE
       ========================================================= */

    HalDo.kernel.register(
        "window-manager",
        {

            name:
                "Window Manager",

            version:
                "20.0.0",

            autoStart:
                true,

            async init() {

                HalDo.emit(
                    "window-manager:ready"
                );

            }

        }
    );

    HalDo.kernel.register(
        "launcher",
        {

            name:
                "Launcher",

            version:
                "20.0.0",

            autoStart:
                true,

            async init() {

                launcher.initialize();

                navigation.initialize();

                navigation.renderQuickApps();

                HalDo.taskbar.render();

                HalDo.emit(
                    "launcher:ready"
                );

            }

        }
    );


    /* =========================================================
       COMPATIBILITY
       ========================================================= */

    window.HalDoWindowManager =
        wm;

    window.HalDoLauncher =
        launcher;

    window.HalDoNavigation =
        navigation;

    if (
        window.HalDoOS
    ) {

        window.HalDoOS.windowManager =
            wm;

        window.HalDoOS.launcher =
            launcher;

        window.HalDoOS.navigation =
            navigation;

    }


    HalDo.log(
        "Window Manager, Launcher und Navigation bereit."
    );

})();
