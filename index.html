<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HalDo AI OS 22</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#fff;
    background:#020611;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#haldo-os{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 42%,rgba(48,104,210,.18),transparent 35%),
        radial-gradient(circle at 20% 20%,rgba(80,120,255,.10),transparent 30%),
        linear-gradient(145deg,#020611,#071426 55%,#02050d);
}
#haldo-galaxy{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 25%,rgba(255,255,255,.9) 0 1px,transparent 2px),
        radial-gradient(circle at 70% 18%,rgba(150,200,255,.8) 0 1px,transparent 2px),
        radial-gradient(circle at 35% 72%,rgba(255,255,255,.7) 0 1px,transparent 2px),
        radial-gradient(circle at 82% 65%,rgba(150,190,255,.7) 0 1px,transparent 2px);
    opacity:.45;
    animation:galaxyMove 18s linear infinite;
}
@keyframes galaxyMove{
    0%{transform:scale(1) rotate(0deg)}
    50%{transform:scale(1.04) rotate(1deg)}
    100%{transform:scale(1) rotate(0deg)}
}
#haldo-topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:62px;
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    background:linear-gradient(180deg,rgba(2,7,18,.94),rgba(2,7,18,.55));
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
}
.haldo-menu-button{
    width:46px;
    height:46px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    background:rgba(255,255,255,.06);
    color:#fff;
    display:grid;
    place-items:center;
    font-size:22px;
    overflow:hidden;
}
.haldo-menu-button img{
    width:32px;
    height:32px;
    object-fit:contain;
}
#haldo-status{
    display:flex;
    align-items:center;
    gap:8px;
    color:rgba(255,255,255,.72);
    font-size:12px;
}
.haldo-status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#61ffb0;
    box-shadow:0 0 12px #61ffb0;
}
#haldo-desktop{
    position:absolute;
    inset:62px 0 0;
    display:flex;
    align-items:center;
    justify-content:center;
}
#haldo-living-ai{
    position:relative;
    width:min(48vw,390px);
    height:min(48vw,390px);
    min-width:220px;
    min-height:220px;
    display:grid;
    place-items:center;
}
#haldo-living-ai::before{
    content:"";
    position:absolute;
    inset:10%;
    border-radius:50%;
    background:radial-gradient(circle,rgba(100,170,255,.20),transparent 68%);
    filter:blur(20px);
    animation:livingGlow 4s ease-in-out infinite;
}
@keyframes livingGlow{
    0%,100%{transform:scale(.95);opacity:.65}
    50%{transform:scale(1.08);opacity:1}
}
#haldo-living-logo{
    position:relative;
    z-index:2;
    width:72%;
    height:72%;
    object-fit:contain;
    animation:livingLogo 5s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(120,190,255,.35));
}
@keyframes livingLogo{
    0%,100%{transform:translateY(0) scale(1) rotate(-1deg)}
    50%{transform:translateY(-7px) scale(1.025) rotate(1deg)}
}
#haldo-ai-panel{
    position:absolute;
    left:50%;
    bottom:7%;
    transform:translateX(-50%);
    width:min(720px,90vw);
    z-index:100;
    padding:12px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:20px;
    background:rgba(3,10,24,.68);
    backdrop-filter:blur(20px);
}
#haldo-ai-messages{
    max-height:130px;
    overflow:auto;
    padding:4px 8px 10px;
    font-size:14px;
}
.haldo-ai-message{
    padding:7px 9px;
    margin:3px 0;
    border-radius:12px;
}
.haldo-ai-message.user{
    background:rgba(90,150,255,.16);
    text-align:right;
}
.haldo-ai-message.ai{
    background:rgba(255,255,255,.06);
}
#haldo-ai-form{
    display:flex;
    gap:8px;
}
#haldo-ai-input{
    flex:1;
    min-width:0;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    outline:0;
    padding:11px 13px;
    background:rgba(0,0,0,.24);
    color:#fff;
}
.haldo-ai-send{
    border:0;
    border-radius:14px;
    padding:0 18px;
    background:linear-gradient(135deg,#4b91ff,#7b6cff);
    color:#fff;
}
#haldo-menu{
    position:absolute;
    top:62px;
    left:0;
    bottom:0;
    width:min(380px,88vw);
    z-index:4500;
    transform:translateX(-105%);
    transition:transform .22s ease;
    background:rgba(3,10,23,.96);
    border-right:1px solid rgba(255,255,255,.10);
    box-shadow:30px 0 80px rgba(0,0,0,.38);
    backdrop-filter:blur(24px);
    display:flex;
    flex-direction:column;
}
#haldo-menu.open{transform:translateX(0)}
#haldo-menu-header{
    padding:18px;
    border-bottom:1px solid rgba(255,255,255,.08);
}
#haldo-menu-header strong{display:block;font-size:18px}
#haldo-menu-header small{color:rgba(255,255,255,.45)}
#haldo-app-list{
    flex:1;
    overflow:auto;
    padding:10px;
}
.haldo-app-item{
    width:100%;
    min-height:48px;
    display:flex;
    align-items:center;
    gap:12px;
    margin:4px 0;
    padding:8px 12px;
    border:1px solid transparent;
    border-radius:13px;
    background:rgba(255,255,255,.035);
    color:#fff;
    text-align:left;
}
.haldo-app-item:hover,
.haldo-app-item:focus{
    background:rgba(100,170,255,.12);
    border-color:rgba(150,200,255,.18);
    outline:0;
}
.haldo-app-icon{
    width:30px;
    text-align:center;
    font-size:19px;
}
.haldo-app-label{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
#haldo-window-layer{
    position:absolute;
    inset:62px 0 0;
    z-index:3000;
    pointer-events:none;
    overflow:hidden;
}
.haldo-window{
    position:absolute;
    display:flex;
    flex-direction:column;
    pointer-events:auto;
    min-width:300px;
    min-height:220px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:18px;
    overflow:hidden;
    background:linear-gradient(145deg,rgba(11,24,48,.98),rgba(3,9,22,.99));
    box-shadow:0 30px 80px rgba(0,0,0,.48);
    backdrop-filter:blur(22px);
}
.haldo-window.hidden{display:none}
.haldo-window.maximized{
    inset:0!important;
    width:100%!important;
    height:100%!important;
    border-radius:0;
}
.haldo-window-header{
    height:48px;
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7px 0 14px;
    user-select:none;
    background:rgba(255,255,255,.055);
    border-bottom:1px solid rgba(255,255,255,.08);
}
.haldo-window-title{
    min-width:0;
    display:flex;
    align-items:center;
    gap:9px;
}
.haldo-window-title span:last-child{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.haldo-window-controls{display:flex;gap:4px}
.haldo-window-controls button{
    width:34px;
    height:34px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#fff;
}
.haldo-window-controls button:hover{background:rgba(255,255,255,.10)}
.haldo-window-controls .close:hover{background:rgba(255,70,90,.30)}
.haldo-window-body{
    flex:1;
    min-height:0;
    overflow:auto;
}
.haldo-app-page{
    min-height:100%;
    padding:20px;
}
.haldo-app-page h2{margin:0 0 8px}
.haldo-app-page p{
    color:rgba(255,255,255,.58);
    line-height:1.55;
}
.haldo-card{
    padding:16px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:16px;
    background:rgba(255,255,255,.045);
    margin:10px 0;
}
.haldo-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.haldo-actions button{
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    padding:9px 13px;
    background:rgba(255,255,255,.06);
    color:#fff;
}
#haldo-boot{
    position:absolute;
    inset:0;
    z-index:10000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,rgba(60,120,255,.18),transparent 40%),
        #020611;
    transition:opacity .5s ease,visibility .5s ease;
}
#haldo-boot.done{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}
#haldo-boot-logo{
    width:min(280px,55vw);
    height:min(280px,55vw);
    object-fit:contain;
    animation:bootLogo 3.2s ease-in-out infinite;
    filter:drop-shadow(0 0 35px rgba(100,180,255,.55));
}
@keyframes bootLogo{
    0%{transform:scale(.88) rotate(-3deg);opacity:.75}
    50%{transform:scale(1.04) rotate(3deg);opacity:1}
    100%{transform:scale(.88) rotate(-3deg);opacity:.75}
}
#haldo-boot-text{
    margin-top:18px;
    color:rgba(255,255,255,.72);
    font-size:14px;
}
#haldo-toast{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translate(-50%,20px);
    opacity:0;
    z-index:9000;
    padding:10px 15px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:13px;
    background:rgba(3,10,24,.92);
    transition:.2s;
}
#haldo-toast.show{
    transform:translate(-50%,0);
    opacity:1;
}
@media(max-width:700px){
    #haldo-topbar{height:56px}
    #haldo-desktop{inset:56px 0 0}
    #haldo-window-layer{inset:56px 0 0}
    #haldo-menu{top:56px;width:88vw}
    #haldo-living-ai{
        width:75vw;
        height:75vw;
    }
    #haldo-ai-panel{
        bottom:12px;
        width:94vw;
    }
    .haldo-window{
        min-width:0!important;
        left:8px!important;
        top:8px!important;
        width:calc(100% - 16px)!important;
        height:calc(100% - 16px)!important;
        border-radius:15px;
    }
}
</style>
</head>
<body>
<div id="haldo-os">
    <div id="haldo-galaxy"></div>
<header id="haldo-topbar">
    <button id="haldo-menu-button" class="haldo-menu-button" aria-label="HalDo Menü">
        <img id="haldo-menu-logo" src="assets/logo/logo.png" alt="HalDo">
    </button>
    <div id="haldo-status">
        <span class="haldo-status-dot"></span>
        <span id="haldo-status-text">HalDo AI OS 22</span>
    </div>
</header>
<aside id="haldo-menu" aria-hidden="true">
    <div id="haldo-menu-header">
        <strong>☀️ HalDo AI OS 22</strong>
        <small>Alle Anwendungen</small>
    </div>
    <div id="haldo-app-list"></div>
</aside>
<main id="haldo-desktop">
    <section id="haldo-living-ai">
        <img id="haldo-living-logo"
             src="assets/logo/logo.png"
             alt="Lebendiges HalDo AI Logo">
    </section>
    <section id="haldo-ai-panel">
        <div id="haldo-ai-messages"></div>
        <form id="haldo-ai-form">
            <input id="haldo-ai-input"
                   autocomplete="off"
                   placeholder="Mit HalDo AI schreiben …">
            <button class="haldo-ai-send" type="submit">Senden</button>
        </form>
    </section>
</main>
<section id="haldo-window-layer"></section>
<div id="haldo-toast"></div>
<section id="haldo-boot">
    <img id="haldo-boot-logo"
         src="assets/logo/logo.png"
         alt="HalDo AI">
    <div id="haldo-boot-text">HalDo AI OS 22 wird gestartet …</div>
</section>
</div>
<script>
"use strict";
(function(){
const HD = window.HalDo = window.HalDo || {};
HD.version = "22.0.0";
HD.initialized = HD.initialized || false;
HD.events = HD.events || {};
HD.config = HD.config || {};
HD.config.defaultWindowWidth =
    HD.config.defaultWindowWidth || 720;
HD.config.defaultWindowHeight =
    HD.config.defaultWindowHeight || 480;
HD.config.minimumWindowWidth =
    HD.config.minimumWindowWidth || 300;
HD.config.minimumWindowHeight =
    HD.config.minimumWindowHeight || 220;
/* =========================================================
   EVENT BUS
   ========================================================= */
const listeners = new Map();
HD.emit = function(name,data){
    const list = listeners.get(name);
    if(!list) return;
    [...list].forEach(fn=>{
        try{ fn(data); }
        catch(error){ console.error("HalDo Event:",name,error); }
    });
};
HD.on = function(name,fn){
    if(typeof fn !== "function") return ()=>{};
    if(!listeners.has(name)) listeners.set(name,new Set());
    listeners.get(name).add(fn);
    return ()=>listeners.get(name)?.delete(fn);
};
HD.events.on = HD.on;
/* =========================================================
   STORAGE
   ========================================================= */
HD.storage = HD.storage || {};
HD.storage.get = function(key,fallback=null){
    try{
        const value = localStorage.getItem("haldo:"+key);
        return value === null ? fallback : JSON.parse(value);
    }catch(error){
        console.warn("HalDo Storage get:",error);
        return fallback;
    }
};
HD.storage.set = function(key,value){
    try{
        localStorage.setItem("haldo:"+key,JSON.stringify(value));
        return true;
    }catch(error){
        console.warn("HalDo Storage set:",error);
        return false;
    }
};
HD.storage.remove = function(key){
    try{
        localStorage.removeItem("haldo:"+key);
        return true;
    }catch(_){
        return false;
    }
};
HD.appState = HD.appState || {};
HD.appState.get = function(appId){
    return HD.storage.get("app-state:"+appId,{});
};
HD.appState.save = function(appId,state){
    return HD.storage.set("app-state:"+appId,state || {});
};
/* =========================================================
   RUNTIME
   ========================================================= */
HD.runtime = HD.runtime || {};
HD.runtime.components = HD.runtime.components || new Map();
HD.runtime.register = function(name,value){
    this.components.set(name,value);
    HD.emit("runtime:registered",{name,value});
    return value;
};
HD.runtime.get = function(name){
    return this.components.get(name);
};
/* =========================================================
   APP LIST — KOMPLETTER HALDO AI OS 22 STARTZUSTAND
   ========================================================= */
HD.appDefinitions = [
["haldo-ai","☀️","HalDo AI"],
["chat","💬","Chat"],
["voice","🎙️","Voice"],
["mail","📧","HalDo Mail"],
["browser","🌐","HalDo Browser"],
["translator","🌍","Übersetzer"],
["dictionary","📖","Wörterbuch"],
["languages","🗣️","Sprachen"],
["ezidi-keyboard","⌨️","Êzîdî-Tastatur"],
["traffic","🚗","Verkehr"],
["traffic-warnings","⚠️","Verkehrswarnungen"],
["maps","🗺️","Karten"],
["navigation","🧭","Navigation"],
["driving-school","🚘","Fahrschule"],
["driving-license","🚦","Führerschein / Verkehrslernen"],
["health","🏥","Gesundheit"],
["medications","💊","Medikamente / Erinnerungen"],
["learning","🧠","Lernen"],
["university","🎓","Universität"],
["school","🏫","Schule"],
["training","🧑‍🏫","Ausbildung"],
["library","📚","Bibliothek"],
["notes","📝","Notizen"],
["calendar","📅","Kalender"],
["reminders","⏰","Erinnerungen"],
["weather","🌦️","Wetter"],
["nature","🌱","Natur / Wiesen"],
["environment","🌳","Umwelt"],
["science","🔬","Wissenschaft"],
["code","💻","Code / Entwicklung"],
["files","📁","Dateien"],
["documents","🗂️","Dokumente"],
["communication","📧","Kommunikation"],
["notifications","🔔","Benachrichtigungen"],
["settings","⚙️","Einstellungen"],
["security","🔐","Sicherheit"],
["users","👤","Benutzer"],
["storage","💾","Speicher"],
["network","🌐","Netzwerk"],
["updates","🔄","Updates"],
["system-status","📊","Systemstatus"],
["system-tools","🛠️","Systemtools"],
["bluetooth","🔵","Bluetooth"],
["vehicle","🚘","Fahrzeug / Android Auto"],
["music-studio","🎵","HalDo Music Studio"],
["audio-studio","🎙️","HalDo Audio Studio"],
["video-studio","🎬","HalDo Video Studio"],
["creative-studio","🖼️","HalDo Creative Studio"],
["design-studio","🎨","HalDo Design Studio"]
].map(item=>({
    id:item[0],
    icon:item[1],
    name:item[2],
    description:"HalDo AI OS 22 Anwendung",
    persistent:false
}));
/* =========================================================
   APP REGISTRY
   ========================================================= */
HD.appRegistry = HD.appRegistry || {};
HD.appRegistry.items = new Map(
    HD.appDefinitions.map(app=>[app.id,app])
);
HD.appRegistry.get = function(id){
    return this.items.get(id) || null;
};
HD.appRegistry.all = function(){
    return [...this.items.values()];
};
HD.appRegistry.register = function(app){
    if(!app || !app.id) return false;
    this.items.set(app.id,app);
    return true;
};
/* =========================================================
   WINDOW SYSTEM
   ========================================================= */
HD.windowManager = HD.windowManager || {};
HD.windowManager.windows =
    HD.windowManager.windows || new Map();
HD.windowManager.zIndex = 3100;
HD.windowManager.activeWindowId = null;
const layer =
    document.getElementById("haldo-window-layer");
HD.windowManager.create = function(app){
    if(!app) return null;
    const existing =
        this.windows.get(app.id);
    if(existing){
        this.restore(app.id);
        return existing;
    }
    const definition =
        HD.appRegistry.get(app.id);
    if(!definition) return null;
    const element =
        document.createElement("section");
    element.className = "haldo-window";
    element.dataset.appId = app.id;
    element.style.left =
        `${70 + (this.windows.size % 5) * 25}px`;
    element.style.top =
        `${55 + (this.windows.size % 5) * 25}px`;
    element.style.width =
        `${HD.config.defaultWindowWidth}px`;
    element.style.height =
        `${HD.config.defaultWindowHeight}px`;
    const header =
        document.createElement("header");
    header.className =
        "haldo-window-header";
    const title =
        document.createElement("div");
    title.className =
        "haldo-window-title";
    const icon =
        document.createElement("span");
    icon.textContent =
        definition.icon;
    const name =
        document.createElement("span");
    name.textContent =
        definition.name;
    title.append(icon,name);
    const controls =
        document.createElement("div");
    controls.className =
        "haldo-window-controls";
    const minimize =
        document.createElement("button");
    minimize.textContent = "−";
    const maximize =
        document.createElement("button");
    maximize.textContent = "□";
    const close =
        document.createElement("button");
    close.textContent = "×";
    close.className = "close";
    controls.append(
        minimize,
        maximize,
        close
    );
    header.append(
        title,
        controls
    );
    const body =
        document.createElement("div");
    body.className =
        "haldo-window-body";
    body.innerHTML =
        this.renderApp(definition);
    element.append(
        header,
        body
    );
    layer.appendChild(element);
    const record = {
        id:app.id,
        app,
        definition,
        element,
        header,
        body,
        minimized:false,
        maximized:false,
        x:70,
        y:55,
        width:HD.config.defaultWindowWidth,
        height:HD.config.defaultWindowHeight
    };
    this.windows.set(app.id,record);
    element.addEventListener(
        "pointerdown",
        ()=>this.focus(app.id)
    );
    minimize.addEventListener(
        "click",
        event=>{
            event.preventDefault();
            event.stopPropagation();
            this.minimize(app.id);
        }
    );
    maximize.addEventListener(
        "click",
        event=>{
            event.preventDefault();
            event.stopPropagation();
            this.toggleMaximize(app.id);
        }
    );
    close.addEventListener(
        "click",
        event=>{
            event.preventDefault();
            event.stopPropagation();
            this.close(app.id);
        }
    );
    header.addEventListener(
        "dblclick",
        event=>{
            if(event.target.closest(".haldo-window-controls"))
                return;
            this.toggleMaximize(app.id);
        }
    );
    this.makeDraggable(record);
    this.focus(app.id);
    return record;
};
HD.windowManager.renderApp =
function(definition){
    const safe =
        String(definition.name)
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;");
    return `
        <div class="haldo-app-page">
            <div class="haldo-card">
                <div style="font-size:38px">${definition.icon}</div>
                <h2>${safe}</h2>
                <p>
                    Diese Anwendung ist mit dem zentralen
                    HalDo AI OS 22 App-, Window-, Runtime-,
                    Router- und Storage-System verbunden.
                </p>
            </div>
            <div class="haldo-card">
                <strong>APP STATUS</strong>
                <p>● Online · System verbunden</p>
            </div>

HD.windowManager.focus =
function(appId){
    const record =
        this.windows.get(appId);
    if(!record) return;
    this.zIndex++;
    record.element.style.zIndex =
        String(this.zIndex);
    record.element.classList.remove("hidden");
    record.minimized = false;
    this.activeWindowId =
        appId;
    HD.emit(
        "window:activated",
        {window:record}
    );
};
HD.windowManager.open =
function(app){
    if(!app) return null;
    let record =
        this.windows.get(app.id);
    if(!record){
        record =
            this.create(app);
    }
    if(!record) return null;
    record.element.classList.remove("hidden");
    record.minimized = false;
    app.opened = true;
    app.closed = false;
    app.active = true;
    this.focus(app.id);
    HD.emit(
        "window:opened",
        {window:record,app}
    );
    return record;
};
HD.windowManager.close =
function(appId){
    const record =
        this.windows.get(appId);
    if(!record) return false;
    record.element.remove();
    this.windows.delete(appId);
    if(this.activeWindowId === appId)
        this.activeWindowId = null;
    HD.emit(
        "window:closed",
        {appId}
    );
    return true;
};
HD.windowManager.minimize =
function(appId){
    const record =
        this.windows.get(appId);
    if(!record) return false;
    record.minimized = true;
    record.element.classList.add("hidden");
    HD.emit(
        "window:minimized",
        {window:record}
    );
    return true;
};
HD.windowManager.restore =
function(appId){
    const record =
        this.windows.get(appId);
    if(!record) return false;
    record.minimized = false;
    record.element.classList.remove("hidden");
    this.focus(appId);
    HD.emit(
        "window:restored",
        {window:record}
    );
    return true;
};
HD.windowManager.toggleMaximize =
function(appId){
    const record =
        this.windows.get(appId);
    if(!record) return false;
    record.maximized =
        !record.maximized;
    record.element.classList.toggle(
        "maximized",
        record.maximized
    );
    HD.emit(
        "window:maximized",
        {
            window:record,
            maximized:record.maximized
        }
    );
    return true;
};
HD.windowManager.makeDraggable =
function(record){
    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;
    record.header.addEventListener(
        "pointerdown",
        event=>{
            if(
                event.target.closest(
                    ".haldo-window-controls"
                )
            ) return;
            if(record.maximized) return;
            dragging = true;
            offsetX =
                event.clientX -
                record.element.offsetLeft;
            offsetY =
                event.clientY -
                record.element.offsetTop;
            try{
                record.header.setPointerCapture(
                    event.pointerId
                );
            }catch(_){}
        }
    );
    record.header.addEventListener(
        "pointermove",
        event=>{
            if(!dragging || record.maximized)
                return;
            record.x =
                Math.max(
                    0,
                    event.clientX - offsetX
                );
            record.y =
                Math.max(
                    0,
                    event.clientY - offsetY
                );
            record.element.style.left =
                record.x+"px";
            record.element.style.top =
                record.y+"px";
        }
    );
    record.header.addEventListener(
        "pointerup",
        event=>{
            dragging = false;
            try{
                record.header.releasePointerCapture(
                    event.pointerId
                );
            }catch(_){}
        }
    );
};
HD.runtime.register(

);
/* =========================================================

   ========================================================= */
HD.appManager = HD.appManager || {};
HD.appManager.instances =
    HD.appManager.instances || new Map();
HD.appManager.get =
function(id){
    return this.instances.get(id) || null;
};
HD.appManager.create =
function(id){
    const definition =
        HD.appRegistry.get(id);
    if(!definition) return null;
    let instance =
        this.instances.get(id);
    if(instance) return instance;
    instance = {
        id,
        name:definition.name,
        icon:definition.icon,
        manifest:definition,
        state:HD.appState.get(id),
        opened:false,
        active:false,
        closed:true,
        setState(key,value){
            this.state[key]=value;
            HD.appState.save(this.id,this.state);
            HD.emit(
                "app:state-change",
                {app:this,key,value}
            );
        },
        getState(key,fallback=null){
            return Object.prototype.hasOwnProperty
                .call(this.state,key)
                ? this.state[key]
                : fallback;
        }
    };
    this.instances.set(id,instance);
    return instance;
};
HD.appManager.open =
function(id){
    const app =
        this.create(id);
    if(!app) return null;
    app.opened = true;
    app.closed = false;
    app.active = true;
    HD.windowManager.open(app);
    HD.emit(
        "app:open",
        {app}
    );
    return app;
};
HD.appManager.close =
function(id){
    const app =
        this.instances.get(id);
    if(!app) return false;
    app.opened = false;
    app.closed = true;
    app.active = false;
    HD.windowManager.close(id);
    HD.emit(
        "app:close",
        {app}
    );
    return true;
};
HD.runtime.register(

HD.ai.respond =
function(text){
    const input =
        String(text || "").trim();
    if(!input)
        return "Ich bin hier. Schreib mir einfach, was du möchtest.";
    const lower =
        input.toLowerCase();
    if(
        lower.includes("hallo") ||
        lower.includes("hi") ||
        lower.includes("hey")
    ){
        return "Hallo Bruder ❤️💙. Ich bin HalDo AI. Ich bin bereit, mit dir zu schreiben, Fragen zu beantworten und dich durch HalDo AI OS 22 zu begleiten.";
    }
    if(
        lower.includes("wer bist") ||
        lower.includes("was bist")
    ){
        return "Ich bin HalDo AI – die zentrale intelligente Assistenz von HalDo AI OS 22. Mein Ziel ist, mit den Systemdiensten, Apps, Sprache, Speicher und Benutzeroberfläche zusammenzuarbeiten.";
    }
    if(
        lower.includes("öffne") ||
        lower.includes("open")
    ){
        for(const app of HD.appRegistry.all()){
            if(
                lower.includes(
                    app.name.toLowerCase()
                )
            ){
                HD.router.open(app.id);
                return `${app.name} wurde geöffnet.`;
            }
        }
    }
    if(
        lower.includes("musik")
    ){
        HD.router.open("music-studio");
        return "HalDo Music Studio wurde geöffnet. 🎵";
    }
    if(
        lower.includes("video")
    ){
        HD.router.open("video-studio");
        return "HalDo Video Studio wurde geöffnet. 🎬";
    }
    if(
        lower.includes("mail")
    ){
        HD.router.open("mail");
        return "HalDo Mail wurde geöffnet. 📧";
    }
    if(
        lower.includes("wetter")
    ){
        HD.router.open("weather");
        return "HalDo Wetter wurde geöffnet. 🌦️";
    }
    if(
        lower.includes("verkehr")
    ){
        HD.router.open("traffic");
        return "HalDo Verkehr wurde geöffnet. 🚗";
    }
    return "Ich habe deine Nachricht verstanden. Die vollständige HalDo-AI-Intelligenz kann jetzt über das vorhandene AI-Core-Modul erweitert werden, ohne dass dieses zentrale Startsystem erneut ersetzt werden muss.";
};

/* =========================================================
   GALAXY START SOUND
   ========================================================= */
function startGalaxySound(){
    try{
        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;
        if(!AudioContext)
            return;
        const ctx =
            new AudioContext();
        const osc =
            ctx.createOscillator();
        const gain =
            ctx.createGain();
        osc.type =
            "sine";
        osc.frequency.setValueAtTime(
            110,
            ctx.currentTime
        );
        osc.frequency.exponentialRampToValueAtTime(
            440,
            ctx.currentTime + 1.8
        );
        gain.gain.setValueAtTime(
            0.0001,
            ctx.currentTime
        );
        gain.gain.exponentialRampToValueAtTime(
            0.035,
            ctx.currentTime + .15
        );
        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + 2.1
        );
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 2.1);
    }catch(error){
        console.debug("Galaxy sound unavailable",error);
    }
}

/*
 * Bereits vorhandene Dateien werden nach
 * diesem zentralen Bootstrap geladen.
 *
 * Fehler eines einzelnen Moduls dürfen
 * den gesamten Start nicht zerstören.
 */
function loadExistingModules(){
    const unique =
        [...new Set(existingModules)];
    return unique.reduce(
        (promise,src)=>
            promise.then(
                ()=>new Promise(resolve=>{
                    if(
                        document.querySelector(
                            `script[data-haldo-module="${CSS.escape(src)}"]`
                        )
                    ){
                        resolve();
                        return;
                    }
                    const script =
                        document.createElement("script");
                    script.src = src;
                    script.async = false;
                    script.dataset.haldoModule =
                        src;
                    script.onload =
                        ()=>resolve();
                    script.onerror =
                        error=>{
                            console.warn(
                                "HalDo Modul nicht geladen:",
                                src
                            );
                            resolve();
                        };
                    document.head.appendChild(script);
                })
            ),
        Promise.resolve()
    );
}
/* =========================================================
   START
   ========================================================= */
async function boot(){
    if(HD.initialized)
        return;
    HD.initialized = true;
    const status =
        document.getElementById(
            "haldo-status-text"
        );
    const bootText =
        document.getElementById(
            "haldo-boot-text"
        );
    bootText.textContent =
        "HalDo AI OS 22 wird gestartet …";
    /*
     * Kurze Logo-Intro, danach kontrollierter
     * Modulstart.
     */
    await new Promise(
        resolve=>setTimeout(
            resolve,
            850
        )
    );
    startGalaxySound();
    bootText.textContent =
        "Systemmodule werden verbunden …";
    await loadExistingModules();
    bootText.textContent =
        "App-System wird verbunden …";
    await new Promise(
        resolve=>setTimeout(
            resolve,
            250
        )
    );
    status.textContent =
        "HalDo AI OS 22 · ONLINE";
    bootText.textContent =
        "HalDo AI ist bereit.";
    addAIMessage(
        "ai",
        "Hallo Bruder ❤️💙. HalDo AI OS 22 ist gestartet. Du kannst mir schreiben oder über das Menü eine Anwendung öffnen."
    );
    await new Promise(
        resolve=>setTimeout(
            resolve,
            550
        )
    );
    document
        .getElementById("haldo-boot")
        .classList.add("done");
    HD.emit(
        "os:ready",
        {
            version:HD.version,
            apps:HD.appRegistry.all()
        }
    );
    /*
     * Zentrale HalDo-Komponenten erneut
     * registrieren, falls die vorhandenen
     * Module diese Schnittstellen anbieten.
     */
    try{
        if(window.HalDoSystem)
            HD.runtime.register(
                "system",
                window.HalDoSystem
            );
    }catch(_){}
    /*
     * HalDo AI als zentrale Start-App
     * nicht automatisch als Fenster öffnen.
     */
}
if(
    document.readyState === "loading"
){
    document.addEventListener(
        "DOMContentLoaded",
        boot,
        {once:true}
    );
}else{
    boot();
}
})();
