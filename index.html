<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

</title>


<link rel="stylesheet" href="style.css">

</head>



<body>


<!-- =====================================
     HALDO BOOT EXPERIENCE
===================================== -->


<div id="haldoBoot" class="haldo-boot">


<div class="boot-logo">


<img 
src="assets/haldo-logo.png"
alt="HalDo AI Logo"
>


</div>



<h1>

</p>

</div>

<!-- =====================================
     MAIN SYSTEM
===================================== -->


<div id="haldoSystem"
class="haldo-system hidden">









<!-- =====================================
     HEADER
===================================== -->


<header class="haldo-header">


<div class="brand">


<img
src="assets/haldo-logo.png"
alt="HalDo Logo"
>

HalDo AI
</h1>

AI Operating System
</span>


</div>


</div>

===================================== -->

<h2>

</h2>

HalDo AI OS ist bereit.

</p>

</button>

<section class="quick-grid">

💬

<h3>
AI Chat
</h3>

</p>


</div>





<div class="quick-card">

📁

<h3>
Dateien
</h3>


<p>
Dokumente verwalten
</p>


</div>





<div class="quick-card">

📝

<h3>
Schreiben
</h3>


<p>
Ideen und Texte
</p>


</div>





<div class="quick-card">

⚙️

<h3>
System
</h3>


<p>
Einstellungen
</p>


</div>

</main>









</div>









<script src="script.js"></script>
