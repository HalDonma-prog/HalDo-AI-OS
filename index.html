<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05080f">
    <title>HalDo AI OS 23.1.6 — Ultimative Professionelle Edition</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #05080f;
            --surface: rgba(8, 12, 28, 0.92);
            --border: rgba(255, 255, 255, 0.04);
            --text: #e8edf5;
            --gold: #ffd54b;
            --gold-dark: #ff9f1c;
            --radius: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
        }

        #haldo-os {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 30% 20%, rgba(20, 50, 120, 0.10), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(60, 30, 140, 0.06), transparent 50%),
                var(--bg);
            padding: 6px;
            gap: 4px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex-shrink: 0;
            backdrop-filter: blur(16px);
            height: 34px;
        }

        .top-bar .logo {
            font-size: 13px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .top-bar .time {
            font-size: 10px;
            opacity: 0.5;
            font-family: monospace;
        }

        .top-bar .status {
            font-size: 8px;
            opacity: 0.4;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-bar .status .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .content {
            flex: 1;
            display: flex;
            gap: 4px;
            min-height: 0;
            overflow: hidden;
        }

        /* =========================================================
        SIDEBAR
        ========================================================= */
        .sidebar {
            width: 140px;
            flex-shrink: 0;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 3px;
            overflow-y: auto;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .sidebar .app-btn {
            padding: 3px 6px;
            border-radius: 4px;
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            text-align: left;
            font-size: 9px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
            width: 100%;
            line-height: 1.2;
        }

        .sidebar .app-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
        }

        .sidebar .app-btn.active {
            background: rgba(255, 200, 80, 0.06);
            border-color: rgba(255, 200, 80, 0.10);
            color: var(--gold);
        }

        .sidebar .app-btn .icon {
            font-size: 11px;
            width: 14px;
            text-align: center;
            flex-shrink: 0;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            backdrop-filter: blur(16px);
            min-width: 0;
        }

        .app-header {
            padding: 4px 10px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 11px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 28px;
        }

        .app-header .actions {
            display: flex;
            gap: 2px;
        }

        .app-header .actions button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, 0.4);
            padding: 1px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 8px;
            transition: all 0.2s;
        }

        .app-header .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        ::-webkit-scrollbar {
            width: 2px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }

        .btn-primary {
            padding: 3px 10px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0a0e1a;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 9px;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(255, 200, 80, 0.15);
        }

        .btn-secondary {
            padding: 2px 7px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 8px;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-danger {
            padding: 2px 7px;
            border-radius: 3px;
            background: rgba(255, 80, 80, 0.10);
            color: #ff6b6b;
            border: 1px solid rgba(255, 80, 80, 0.12);
            cursor: pointer;
            font-size: 8px;
            transition: background 0.2s;
        }

        .btn-danger:hover {
            background: rgba(255, 80, 80, 0.18);
        }

        input,
        textarea,
        select {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: #fff;
            padding: 3px 5px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 9px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(255, 200, 80, 0.20);
        }

        textarea {
            resize: vertical;
            min-height: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px 7px;
            margin-bottom: 3px;
            transition: background 0.2s;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .card .card-title {
            font-weight: 600;
            font-size: 10px;
        }

        .card .card-meta {
            font-size: 8px;
            opacity: 0.35;
            margin-top: 1px;
        }

        .card .card-actions {
            margin-top: 3px;
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }

        .flex-row {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            align-items: center;
        }

        .flex-row>* {
            flex: 1;
            min-width: 40px;
        }

        .flex-row .btn-primary,
        .flex-row .btn-secondary,
        .flex-row .btn-danger {
            flex: 0 0 auto;
        }

        /* =========================================================
        COSMIC WORLD
        ========================================================= */
        .cosmic-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 350px;
            overflow: hidden;
            border-radius: 4px;
            background: radial-gradient(circle at 50% 50%, rgba(10, 20, 50, 0.6), #05080f);
            cursor: default;
        }

        .cosmic-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .cosmic-star {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            animation: starTwinkle var(--speed, 3s) ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.7);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .cosmic-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100px;
            height: 100px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 40px rgba(255, 220, 70, 0.9), 0 0 80px rgba(255, 165, 40, 0.6), 0 0 150px rgba(255, 100, 20, 0.3);
            animation: sunPulse 3s ease-in-out infinite;
            z-index: 10;
            cursor: pointer;
        }

        .cosmic-sun:hover {
            box-shadow: 0 0 60px rgba(255, 220, 70, 1), 0 0 120px rgba(255, 165, 40, 0.8);
        }

        @keyframes sunPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.98);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.04);
            }
        }

        .cosmic-sun .logo-in-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 55%;
            height: 55%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: #0a0e1a;
            text-shadow: 0 0 30px rgba(255, 200, 80, 0.6);
            animation: logoPulse 3s ease-in-out infinite;
            border: 2px solid rgba(255, 200, 80, 0.15);
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            overflow: hidden;
        }

        .cosmic-sun .logo-in-sun img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .cosmic-sun .logo-in-sun .logo-text {
            font-size: 18px;
            font-weight: 800;
            color: #0a0e1a;
            text-shadow: 0 0 20px rgba(255, 200, 80, 0.5);
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.06);
            }
        }

        /* Planet Orbits */
        .cosmic-planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 5;
        }

        .cosmic-planet:hover {
            transform: scale(1.2) !important;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2) !important;
            z-index: 20;
        }

        .cosmic-planet .planet-label {
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6px;
            opacity: 0.35;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.6);
            padding: 1px 4px;
            border-radius: 2px;
            pointer-events: none;
            color: #fff;
        }

        .cosmic-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Living Logo */
        .living-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
            width: 80px;
            height: 80px;
        }

        .living-logo .logo-aura {
            position: absolute;
            inset: -30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.12), rgba(255, 200, 80, 0.03) 40%, transparent 70%);
            animation: auraPulse 3s ease-in-out infinite;
        }

        @keyframes auraPulse {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.6;
            }
        }

        .living-logo .logo-mouth {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 22%;
            height: 4%;
            border-radius: 50%;
            background: rgba(255, 200, 150, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.08s ease;
        }

        .living-logo.speaking .logo-mouth {
            animation: mouthSpeak 0.25s ease-in-out infinite alternate;
        }

        @keyframes mouthSpeak {
            0% {
                height: 3%;
                transform: translateX(-50%) scaleY(0.6);
            }
            100% {
                height: 10%;
                transform: translateX(-50%) scaleY(1.2);
            }
        }

        .living-logo .logo-eyes {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 9%;
            display: flex;
            justify-content: space-between;
        }

        .living-logo .logo-eyes .eye {
            width: 28%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .living-logo .logo-eyes .eye::after {
            content: '';
            position: absolute;
            width: 35%;
            height: 35%;
            border-radius: 50%;
            background: rgba(255, 220, 100, 0.3);
            top: 30%;
            left: 30%;
            transition: all 0.3s ease;
        }

        .living-logo.listening .logo-eyes .eye::after {
            animation: eyeListen 1.2s ease-in-out infinite;
        }

        @keyframes eyeListen {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
            }
        }

        .living-logo.thinking .logo-eyes .eye::after {
            animation: eyeThink 1.8s ease-in-out infinite;
        }

        @keyframes eyeThink {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(3px, -2px);
            }
        }

        .living-logo.idle .logo-eyes .eye::after {
            animation: eyeIdle 3.5s ease-in-out infinite;
        }

        @keyframes eyeIdle {
            0%,
            100% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(-1px, -1px);
            }
            75% {
                transform: translate(1px, 1px);
            }
        }

        .living-logo .logo-hands {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .living-logo .logo-hands .hand {
            position: absolute;
            width: 10%;
            height: 10%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.10), rgba(255, 200, 100, 0.03) 50%, transparent 70%);
            animation: handMove 4.5s ease-in-out infinite;
        }

        .living-logo .logo-hands .hand-left {
            left: -6%;
            top: 30%;
            animation-delay: 0s;
        }

        .living-logo .logo-hands .hand-right {
            right: -6%;
            top: 30%;
            animation-delay: 2.2s;
        }

        @keyframes handMove {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(0, -3px) scale(1.06);
            }
        }

        .living-logo .logo-glow {
            position: absolute;
            inset: -8%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.05), transparent 60%);
            animation: glowPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.06);
            }
        }

        .cosmic-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .cosmic-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 200, 80, 0.15);
            animation: particleFloat var(--duration, 5s) ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0.1;
            }
            50% {
                transform: translate(var(--dx, 15px), var(--dy, -15px)) scale(1);
                opacity: 0.5;
            }
        }

        /* =========================================================
        AI CHAT
        ========================================================= */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            margin-bottom: 4px;
            max-height: 250px;
            min-height: 80px;
            font-size: 10px;
        }

        .chat-messages .user {
            padding: 3px 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 3px;
            margin-bottom: 2px;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: #aac;
        }

        .chat-messages .ai {
            padding: 3px 6px;
            background: rgba(255, 200, 80, 0.04);
            border-radius: 3px;
            margin-bottom: 2px;
            border: 1px solid rgba(255, 200, 80, 0.04);
            color: #e8edf5;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .sidebar {
                width: 38px;
                padding: 2px;
            }
            .sidebar .app-btn span:not(.icon) {
                display: none;
            }
            .sidebar .app-btn {
                justify-content: center;
                padding: 4px;
            }
            #haldo-os {
                padding: 3px;
                gap: 3px;
            }
            .app-body {
                padding: 3px;
            }
            .top-bar .status {
                display: none;
            }
            .cosmic-sun {
                width: 70px;
                height: 70px;
            }
            .living-logo {
                width: 56px;
                height: 56px;
            }
            .cosmic-planet .planet-label {
                font-size: 5px;
                bottom: -12px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 30px;
            }
            .sidebar .app-btn .icon {
                font-size: 9px;
                width: 12px;
            }
            .top-bar .logo {
                font-size: 10px;
            }
            .app-header {
                font-size: 9px;
                padding: 2px 6px;
            }
            .app-body {
                padding: 2px;
            }
            .card {
                padding: 3px 5px;
            }
            .cosmic-sun {
                width: 55px;
                height: 55px;
            }
            .living-logo {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body>

    <div id="haldo-os">
        <div class="top-bar">
            <div class="logo">✦ HalDo AI OS 23.1.6</div>
            <div class="status">
                <span class="dot"></span>
                <span id="status-text">Bereit</span>
            </div>
            <div class="time" id="top-time">--:--:--</div>
        </div>
        <div class="content">
            <nav class="sidebar" id="sidebar"></nav>
            <div class="main-area">
                <div class="app-header" id="app-header">
                    <span id="app-title">🌌 Cosmic World</span>
                    <div class="actions" id="app-actions"></div>
                </div>
                <div class="app-body" id="app-body"></div>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        // =========================================================
        // VERSION
        // =========================================================
        const HALDO_VERSION = "23.1.6";
        const HALDO_BUILD = "ULTIMATE-PROFESSIONAL";

        // =========================================================
        // STORAGE
        // =========================================================
        const Storage = {
            prefix: 'haldo_',
            get(key, def = null) {
                try {
                    const val = localStorage.getItem(this.prefix + key);
                    if (val === null) return def;
                    try { return JSON.parse(val); } catch (e) { return val; }
                } catch (e) { return def; }
            },
            set(key, val) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(val)); return true; } catch (e) { return false; }
            },
            remove(key) {
                try { localStorage.removeItem(this.prefix + key); return true; } catch (e) { return false; }
            },
            getAll() {
                const res = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try { res[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k)); } catch (e) { res[
                                k.replace(this.prefix, '')] = localStorage.getItem(k); }
                    });
                } catch (e) {}
                return res;
            }
        };

        // =========================================================
        // TIME
        // =========================================================
        function updateTime() {
            const el = document.getElementById('top-time');
            if (el) el.textContent = new Date().toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        // =========================================================
        // SPEAK
        // =========================================================
        function speak(text) {
            if (!window.speechSynthesis) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 0.85;
                utterance.pitch = 1.0;
                utterance.volume = 0.85;
                window.speechSynthesis.speak(utterance);
            } catch (e) {}
        }

        function setStatus(text) {
            const el = document.getElementById('status-text');
            if (el) el.textContent = text;
        }
        setStatus('System startet...');

        // =========================================================
        // HALDO AI — PROFESSIONELL, INTELLIGENT, WIE EIN MENSCH
        // =========================================================
        const HalDoAI = {
            // Riesige Wissensdatenbank (500+ Einträge)
            knowledge: {
                // === PHYSIK ===
                'physik': 'Die Physik ist die Grundlagenwissenschaft der Natur. Sie beschreibt Bewegung, Energie, Kräfte, Elektrizität, Magnetismus, Wärme, Licht, Schall, Atomkerne, Elementarteilchen und das Universum. Sie ist die älteste und fundamentalste Naturwissenschaft.',

Fragen Sie mich zu jedem Thema – ich habe das Wissen und teile es gerne mit Ihnen.`;

            search(query) {
                const results = [];
                const q = query.toLowerCase().trim();
                if (!q) return results;
                for (const [key, value] of Object.entries(this.knowledge)) {
                    const keyClean = key.replace(/_/g, ' ');

                }

            },

                    { name: 'Saturn', size: 17, color: '#c8a050', orbit: 34, speed: 21 },
                    { name: 'Uranus', size: 14, color: '#5ab0c8', orbit: 40, speed: 26 },
                    { name: 'Neptun', size: 14, color: '#3a5ab8', orbit: 46, speed: 31 },
                    { name: 'Pluto', size: 6, color: '#9a8a7a', orbit: 52, speed: 36 },

                    `<div class="cosmic-orbit" style="width:${p.orbit}%;height:${p.orbit}%;"></div>`
                ).join('');

                const planets = planetData.map((p, i) => {
                    const delay = (i / planetData.length) * 360;
                    const duration = 20 + i * 3;
                    return `<div class="cosmic-planet" style="width:${p.size}px;height:${p.size}px;background:radial-gradient(circle at 35% 30%, #fff, ${p.color});box-shadow:0 0 ${p.size}px rgba(255,255,255,0.1);animation:orbit${i} ${duration}s linear infinite;animation-delay:${delay}s;z-index:${5 - Math.floor(i/3)};">

                    </div>`;
                }).join('');

                const keyframes = planetData.map((p, i) => {
                    const radius = p.orbit / 100;
                    return `@keyframes orbit${i} {
                        from { transform: rotate(0deg) translateX(${radius * 50}%) rotate(0deg); }
                        to { transform: rotate(360deg) translateX(${radius * 50}%) rotate(-360deg); }

                                <span class="hand hand-left"></span>
                                <span class="hand hand-right"></span>
                            </div>
                        </div>

                        <style>
                            ${keyframes}
                            .cosmic-planet {
                                position: absolute;
                                left: 50%;
                                top: 50%;
                                border-radius: 50%;
                                cursor: pointer;
                                transition: transform 0.3s ease, box-shadow 0.3s ease;
                                z-index: 5;
                            }
                            .cosmic-planet:hover {
                                transform: scale(1.2) !important;

                            .cosmic-planet .planet-label {
                                position: absolute;
                                bottom: -14px;
                                left: 50%;
                                transform: translateX(-50%);
                                font-size: 6px;
                                opacity: 0.35;
                                white-space: nowrap;
                                background: rgba(0,0,0,0.6);
                                padding: 1px 4px;
                                border-radius: 2px;

            // =========================================================
            // HALDO AI — Professioneller Chat
            // =========================================================
            renderAI() {
                return `
                    <div style="display:flex;flex-direction:column;height:100%;min-height:200px;">
                        <div style="background:rgba(255,200,80,0.04);border-radius:4px;padding:6px;margin-bottom:4px;border:1px solid rgba(255,200,80,0.06);font-size:9px;opacity:0.6;">
                            🤖 HalDo AI — Professioneller Assistent (${Object.keys(HalDoAI.knowledge).length} Wissensgebiete)
                        </div>
                        <div class="chat-messages" id="ai-chat-messages">
                            <div class="ai">Guten Tag! Ich bin HalDo AI, Ihr professioneller KI-Assistent. Ich kann über alle Themen der Wissenschaft, Philosophie, Technologie, Geschichte, Kunst, Kultur und vieles mehr sprechen. Fragen Sie mich einfach – ich bin bereit!</div>
                        </div>
                        <div class="flex-row">
                            <textarea id="ai-input" rows="1" placeholder="Frage an HalDo AI..." style="flex:1;min-height:28px;font-size:9px;"></textarea>
                            <button onclick="AppRouter.sendAIMessage()" class="btn-primary">Senden</button>
                            <button onclick="AppRouter.voiceInput()" class="btn-secondary">🎙️</button>
                            <button onclick="AppRouter.switchTo('ai-wissen')" class="btn-secondary">📚</button>
                        </div>
                        <div id="ai-thinking" style="display:none;font-size:8px;opacity:0.5;margin-top:2px;">🤔 HalDo AI denkt...</div>
                    </div>
                `;
            },

            sendAIMessage() {
                const input = document.getElementById('ai-input');
                const messages = document.getElementById('ai-chat-messages');
                const thinking = document.getElementById('ai-thinking');
                if (!input || !messages) return;
                const text = input.value.trim();
                if (!text) return;

                const userDiv = document.createElement('div');
                userDiv.className = 'user';
                userDiv.textContent = '👤 ' + text;
                messages.appendChild(userDiv);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
                thinking.style.display = 'block';
                this.setLogoState('thinking');

                setTimeout(() => {
                    thinking.style.display = 'none';
                    const response = HalDoAI.ask(text);
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'ai';
                    aiDiv.textContent = response;
                    messages.appendChild(aiDiv);
                    messages.scrollTop = messages.scrollHeight;
                    this.setLogoState('speaking');
                    speak(response.substring(0, 120) + '...');
                    setTimeout(() => this.setLogoState('idle'), 1000);
                }, 400);
            },

            voiceInput() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) { alert('Spracherkennung nicht unterstützt.'); return; }
                const rec = new Recognition();
                rec.lang = 'de-DE';
                rec.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const input = document.getElementById('ai-input');
                    if (input) input.value = text;
                    this.sendAIMessage();
                };
                rec.start();
                this.setLogoState('listening');
                speak('Ich höre zu.');
                setTimeout(() => this.setLogoState('idle'), 5000);
            },

            // =========================================================
            // AI WISSEN — Themenübersicht
            // =========================================================
            renderAIWissen() {
                const topics = HalDoAI.getAllTopics();
                return `
                    <div style="margin-bottom:4px;">
                        <div class="flex-row">
                            <input id="wissen-search" placeholder="Thema suchen..." style="flex:2;font-size:8px;">
                            <button onclick="AppRouter.searchWissen()" class="btn-primary">🔍</button>
                            <button onclick="AppRouter.randomWissen()" class="btn-secondary">🎲 Zufall</button>
                        </div>
                    </div>
                    <div id="wissen-results" style="margin-bottom:4px;"></div>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;max-height:250px;overflow-y:auto;">
                        ${topics.slice(0, 60).map(t => `
                            <div class="card" style="cursor:pointer;padding:3px 5px;font-size:7px;" onclick="AppRouter.showWissen('${t}')">
                                📚 ${t}
                            </div>
                        `).join('')}
                    </div>
                    <div id="wissen-content" style="margin-top:4px;padding:6px;background:rgba(255,200,80,0.03);border-radius:4px;border:1px solid rgba(255,200,80,0.04);font-size:8px;max-height:100px;overflow-y:auto;"></div>
                `;
            },

            searchWissen() {
                const input = document.getElementById('wissen-search');
                const results = document.getElementById('wissen-results');
                if (!input || !results) return;
                const query = input.value.trim();
                if (!query) { results.innerHTML = ''; return; }
                const found = HalDoAI.search(query);
                if (found.length === 0) {
                    results.innerHTML = '<div style="opacity:0.3;font-size:7px;">Keine Themen gefunden.</div>';
                    return;
                }
                results.innerHTML = found.map(f =>
                    `<div class="card" style="cursor:pointer;padding:2px 5px;font-size:7px;" onclick="AppRouter.showWissen('${f.topic}')">📚 ${f.topic}</div>`
                ).join('');
            },

            randomWissen() {
                const fact = HalDoAI.getRandomFact();
                const content = document.getElementById('wissen-content');
                if (content) content.textContent = fact;
                speak(fact);
            },

            showWissen(topic) {
                const content = document.getElementById('wissen-content');
                if (!content) return;
                const text = HalDoAI.knowledge[topic.replace(/ /g, '_')] || HalDoAI.knowledge[topic];
                if (text) {
                    content.innerHTML = `<strong>📚 ${topic}</strong><br>${text}`;
                    speak(text.substring(0, 120) + '...');
                }
            },

            // =========================================================
            // AI MEMORY
            // =========================================================
            renderAIMemory() {
                const memories = Storage.get('ai_memory', []);
                return `
                    <div style="margin-bottom:4px;">
                        <button onclick="AppRouter.clearAIMemory()" class="btn-danger">🗑️ Memory löschen</button>
                    </div>
                    <div id="memory-list">
                        ${memories.length === 0 ? '<div style="opacity:0.3;text-align:center;padding:12px;font-size:8px;">🧠 Keine Erinnerungen</div>' :
                        memories.map((m, i) => `
                            <div class="card" style="padding:3px 5px;font-size:8px;">
                                <div class="card-title">${m.title || 'Erinnerung'}</div>
                                <div style="font-size:7px;opacity:0.5;">${new Date(m.createdAt).toLocaleString()}</div>
                                <div style="font-size:8px;margin-top:1px;">${m.content}</div>
                                <div class="card-actions">
                                    <button onclick="AppRouter.deleteMemory(${i})" class="btn-danger">Löschen</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="flex-row" style="margin-top:3px;">
                        <input id="memory-title" placeholder="Titel..." style="font-size:8px;">
                        <textarea id="memory-content" placeholder="Inhalt..." rows="2" style="font-size:8px;"></textarea>
                        <button onclick="AppRouter.saveMemory()" class="btn-primary">💾</button>
                    </div>
                `;
            },

            saveMemory() {
                const title = document.getElementById('memory-title');
                const content = document.getElementById('memory-content');
                if (!title || !content) return;
                const memories = Storage.get('ai_memory', []);
                memories.push({ title: title.value || 'Erinnerung', content: content.value, createdAt: new Date()
                        .toISOString() });
                Storage.set('ai_memory', memories);
                title.value = '';
                content.value = '';
                this.renderAIMemory();
                speak('Erinnerung gespeichert.');
            },

            deleteMemory(index) {
                const memories = Storage.get('ai_memory', []);
                memories.splice(index, 1);
                Storage.set('ai_memory', memories);
                this.renderAIMemory();
            },

            clearAIMemory() {
                if (confirm('Alle Erinnerungen löschen?')) {
                    Storage.set('ai_memory', []);
                    this.renderAIMemory();
                    speak('Memory gelöscht.');
                }
            },

                    <div class="card"><div class="card-title">🌐 Sprache</div><select style="margin-top:2px;font-size:8px;"><option>Deutsch</option><option>English</option><option>Kurdî</option><option>Êzîdî</option></select></div>

            renderApps() {

                        ${APP_LIST.map(a => `

            // =========================================================
            // BACKUP
            // =========================================================
            renderBackup() {
                const backups = Storage.get('backups', []);
                return `
                    <div style="margin-bottom:4px;">
                        <button onclick="AppRouter.createBackup()" class="btn-primary">💾 Backup</button>
                        <button onclick="AppRouter.restoreBackup()" class="btn-secondary">↩️ Wiederherstellen</button>
                    </div>
                    <div id="backup-list">
                        ${backups.length === 0 ? '<div style="opacity:0.3;text-align:center;padding:12px;font-size:8px;">Keine Backups</div>' :
                        backups.map((b, i) => `
                            <div class="card" style="padding:3px 5px;font-size:8px;">
                                <div class="card-title">Backup ${i+1}</div>
                                <div class="card-meta">${new Date(b.createdAt).toLocaleString()}</div>
                                <div class="card-actions">
                                    <button onclick="AppRouter.restoreBackup(${i})" class="btn-secondary">↩️</button>
                                    <button onclick="AppRouter.deleteBackup(${i})" class="btn-danger">🗑️</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            createBackup() {
                const data = { version: HALDO_VERSION, createdAt: new Date().toISOString(), data: Storage.getAll() };
                const backups = Storage.get('backups', []);
                backups.push(data);
                Storage.set('backups', backups);
                speak('Backup erstellt.');
                this.renderBackup();
            },

            restoreBackup(index) {
                const backups = Storage.get('backups', []);
                if (index === undefined || index === null) {
                    if (backups.length === 0) { speak('Keine Backups.'); return; }
                    index = backups.length - 1;
                }
                const backup = backups[index];
                if (!backup) { speak('Backup nicht gefunden.'); return; }
                if (confirm(`Backup vom ${new Date(backup.createdAt).toLocaleString()} wiederherstellen?`)) {
                    Object.entries(backup.data).forEach(([key, val]) => Storage.set(key, val));
                    speak('Backup wiederhergestellt.');
                    setTimeout(() => location.reload(), 1000);
                }

                            ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(b =>
                                `<button onclick="AppRouter.calcPress('${b}')" style="padding:6px;border-radius:3px;background:${['C','±','%','÷','×','−','+','='].includes(b)?'rgba(255,200,80,0.10)':'rgba(255,255,255,0.02)'};color:#fff;border:1px solid rgba(255,255,255,0.03);cursor:pointer;font-size:10px;">${b}</button>`

            calcPress(val) {
                const display = document.getElementById('calc-display');
                if (!display) return;
                if (!this._calcExpr) this._calcExpr = '';
                if (val === 'C') { this._calcExpr = '';
                    display.textContent = '0'; return; }
                if (val === '⌫') { this._calcExpr = this._calcExpr.slice(0, -1);
                    display.textContent = this._calcExpr || '0'; return; }
                if (val === '=') {
                    try {
                        const result = Function('"use strict"; return (' + this._calcExpr.replace('×', '*').replace('÷', '/')
                            .replace('−', '-') + ')')();
                        display.textContent = result;
                        this._calcExpr = String(result);
                    } catch (e) { display.textContent = 'Fehler';
                        this._calcExpr = ''; }
                    return;
                }
                this._calcExpr += val;
                display.textContent = this._calcExpr;
            },

                `;

            timerStart() {
                const input = document.getElementById('timer-input');
                const display = document.getElementById('timer-display');
                if (!display) return;
                if (this._timerInterval) return;
                let seconds = parseInt(input?.value) || 30;
                if (seconds < 1) seconds = 1;
                if (seconds > 3600) seconds = 3600;
                this._timerSeconds = seconds;
                this._timerInterval = setInterval(() => {
                    if (this._timerSeconds <= 0) {
                        clearInterval(this._timerInterval);
                        this._timerInterval = null;
                        speak('Timer abgelaufen!');
                        display.textContent = '00:00';
                        return;
                    }
                    this._timerSeconds--;
                    const mins = Math.floor(this._timerSeconds / 60);
                    const secs = this._timerSeconds % 60;
                    display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                }, 1000);
            },

            timerStop() {
                if (this._timerInterval) { clearInterval(this._timerInterval);
                    this._timerInterval = null; }
            },

            timerReset() {
                this.timerStop();
                const display = document.getElementById('timer-display');
                if (display) display.textContent = '00:30';
            },

            translateText() {
                const text = document.getElementById('trans-text');
                const result = document.getElementById('trans-result');
                if (!text || !result) return;
                const input = text.value.trim();
                if (!input) { result.textContent = '⚠️ Bitte Text eingeben.'; return; }
                const to = document.getElementById('trans-to')?.value || 'en';
                const dict = {
                    'en': { 'Hallo': 'Hello', 'Danke': 'Thank you', 'Guten Tag': 'Good day' },
                    'de': { 'Hello': 'Hallo', 'Thank you': 'Danke', 'Good day': 'Guten Tag' },
                    'ku': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' },
                    'esq': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' }
                };
                const d = dict[to] || {};
                let translated = input;
                for (const [key, val] of Object.entries(d)) {
                    if (input.toLowerCase().includes(key.toLowerCase())) {
                        translated = translated.replace(new RegExp(key, 'gi'), val);
                    }
                }
                result.textContent = `🌍 ${translated}`;
            },

            // LIVING LOGO STATE

            setLogoState(state) {

            },

            // =========================================================
            // INIT APP
            // =========================================================
            initApp(appId) {
                if (appId === 'warnings') WarningSystem.render();
                if (appId === 'notes') NoteSystem.render();
                if (appId === 'calendar') CalendarSystem.render();
                if (appId === 'contacts') ContactSystem.render();
                if (appId === 'files') FileSystem.render();
                if (appId === 'tasks') TaskSystem.render();
                if (appId === 'backup') this.renderBackup();
                if (appId === 'updates') this.checkUpdates();
                if (appId === 'cosmic') {
                    this.setLogoState('idle');
                    this.initCosmicStars();
                }
                if (appId === 'ai-wissen') {
                    const content = document.getElementById('wissen-content');
                    if (content) content.textContent = '📚 Wählen Sie ein Thema aus der Liste.';
                }
            },

            initCosmicStars() {
                const container = document.getElementById('cosmic-stars');
                if (!container) return;
                container.innerHTML = '';
                for (let i = 0; i < 365; i++) {
                    const star = document.createElement('span');
                    star.className = 'cosmic-star';
                    const size = Math.random() * 2.5 + 0.5;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.setProperty('--speed', (2 + Math.random() * 5) + 's');
                    star.style.animationDelay = (Math.random() * 5) + 's';
                    container.appendChild(star);
                }
            }
        };

        // =========================================================
        // WARNUNGEN SYSTEM
        // =========================================================
        const WarningSystem = {
            warnings: [],
            tones: { blitzer: { freq: 1400, pattern: 'short' }, baustelle: { freq: 800, pattern: 'long' },
                sperrung: { freq: 600, pattern: 'double' }, gefahr: { freq: 400, pattern: 'triple' } },
            load() { this.warnings = Storage.get('warnings', []); return this; },
            save() { Storage.set('warnings', this.warnings); return this; },
            add(type, title, description, location = 'Unbekannt') {
                const types = { blitzer: { icon: '📸', label: 'Blitzer' }, baustelle: { icon: '🚧', label: 'Baustelle' },
                    sperrung: { icon: '🚫', label: 'Sperrung' }, gefahr: { icon: '⚠️', label: 'Gefahr' } };
                const t = types[type] || types['gefahr'];
                const warning = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), type, icon: t.icon,
                    label: t.label, title, description, location, timestamp: new Date().toISOString(),
                active: true };
                this.warnings.unshift(warning);
                this.save();
                this.playTone(type);
                speak(`Achtung! ${title} in ${location}. ${description}`);
                AppRouter.renderWarnings();
                return warning;
            },
            playTone(type) {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    const tone = this.tones[type] || this.tones['gefahr'];
                    osc.frequency.value = tone.freq;
                    osc.type = 'square';
                    gain.gain.value = 0.06;
                    osc.start();
                    if (tone.pattern === 'short') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 100); } else if (tone.pattern === 'long') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 300); } else if (tone.pattern === 'double') { setTimeout(() => { osc.stop(); },
                            100);
                        setTimeout(() => {
                            const ctx2 = new(window.AudioContext || window.webkitAudioContext)();
                            const o2 = ctx2.createOscillator();
                            const g2 = ctx2.createGain();
                            o2.connect(g2);
                            g2.connect(ctx2.destination);
                            o2.frequency.value = tone.freq;
                            o2.type = 'square';
                            g2.gain.value = 0.06;
                            o2.start();
                            setTimeout(() => { o2.stop();
                                ctx2.close(); }, 100);
                        }, 180);
                    } else if (tone.pattern === 'triple') {
                        for (let i = 0; i < 3; i++) {
                            setTimeout(() => {
                                const ctx3 = new(window.AudioContext || window.webkitAudioContext)();
                                const o3 = ctx3.createOscillator();
                                const g3 = ctx3.createGain();
                                o3.connect(g3);
                                g3.connect(ctx3.destination);
                                o3.frequency.value = tone.freq + i * 150;
                                o3.type = 'square';
                                g3.gain.value = 0.05;
                                o3.start();
                                setTimeout(() => { o3.stop();
                                    ctx3.close(); }, 80);
                            }, i * 150);
                        }
                    }
                } catch (e) {}
            },
            dismiss(id) { const w = this.warnings.find(w => w.id === id); if (w) w.active = false;
                this.save();
                AppRouter.renderWarnings(); },
            clearAll() { this.warnings.forEach(w => w.active = false);
                this.save();
                AppRouter.renderWarnings(); },
            getActive() { return this.warnings.filter(w => w.active); },
            render() {
                const container = document.getElementById('warnings-container');
                if (!container) return;
                const active = this.getActive();
                if (active.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:8px;">✅ Keine aktiven Warnungen</div>`;
                    return; }
                container.innerHTML = active.map(w =>
                    `<div style="padding:4px 8px;border-radius:3px;margin-bottom:3px;display:flex;align-items:center;gap:4px;border-left:2px solid ${w.type === 'blitzer' ? '#ffd93d' : w.type === 'baustelle' ? '#ffa94d' : w.type === 'sperrung' ? '#ff6b6b' : '#ff0000'};background:rgba(255,80,80,0.04);font-size:8px;">
                        <span style="font-size:12px;">${w.icon}</span>
                        <div style="flex:1;"><strong>${w.title}</strong> ${w.description} · 📍 ${w.location}</div>
                        <span style="opacity:0.3;">${new Date(w.timestamp).toLocaleTimeString()}</span>
                        <button onclick="WarningSystem.dismiss('${w.id}')" style="background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:10px;">✕</button>
                    </div>`
                ).join('');
            }
        };
        WarningSystem.load();

        // =========================================================
        // NOTIZEN SYSTEM
        // =========================================================
        const NoteSystem = {
            notes: [],
            load() { this.notes = Storage.get('notes', []); return this; },
            save() { Storage.set('notes', this.notes); return this; },
            create() {
                const title = document.getElementById('note-title');
                const content = document.getElementById('note-content');
                if (!title || !content) return;
                const note = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Ohne Titel', content: content.value || '', createdAt: new Date().toISOString() };
                this.notes.unshift(note);
                this.save();
                title.value = '';
                content.value = '';
                AppRouter.renderNotes();
                speak('Notiz gespeichert.');
            },
            delete(id) { this.notes = this.notes.filter(n => n.id !== id);
                this.save();
                AppRouter.renderNotes(); },
            render() {
                const container = document.getElementById('notes-container');
                if (!container) return;
                if (this.notes.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:8px;">📝 Keine Notizen</div>`;
                    return; }
                container.innerHTML = this.notes.map(n =>
                    `<div class="card" style="padding:3px 5px;font-size:8px;">
                        <div class="card-title">${n.title}</div>
                        <div class="card-meta">${new Date(n.createdAt).toLocaleDateString()}</div>
                        <div style="font-size:7px;opacity:0.6;max-height:20px;overflow:hidden;">${n.content || '(leer)'}</div>
                        <div class="card-actions">
                            <button onclick="NoteSystem.delete('${n.id}')" class="btn-danger">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        NoteSystem.load();

        // =========================================================
        // KALENDER SYSTEM
        // =========================================================
        const CalendarSystem = {
            events: [],
            load() { this.events = Storage.get('events', []); return this; },
            save() { Storage.set('events', this.events); return this; },
            add() {
                const title = document.getElementById('event-title');
                const date = document.getElementById('event-date');
                const desc = document.getElementById('event-desc');
                if (!title || !date) return;
                const event = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Termin', date: date.value || new Date().toISOString().split('T')[0], description: desc?.value ||
                        '', createdAt: new Date().toISOString() };
                this.events.push(event);
                this.save();
                title.value = '';
                if (desc) desc.value = '';
                AppRouter.renderCalendar();
                speak('Termin hinzugefügt.');
            },
            delete(id) { this.events = this.events.filter(e => e.id !== id);
                this.save();
                AppRouter.renderCalendar(); },
            render() {
                const container = document.getElementById('calendar-container');
                if (!container) return;
                const sorted = [...this.events].sort((a, b) => a.date.localeCompare(b.date));
                if (sorted.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:8px;">📅 Keine Termine</div>`;
                    return; }
                container.innerHTML = sorted.map(e =>
                    `<div class="card" style="padding:3px 5px;font-size:8px;">
                        <div class="card-title">${e.title}</div>
                        <div class="card-meta">📅 ${new Date(e.date + 'T00:00:00').toLocaleDateString('de-DE')}</div>
                        ${e.description ? `<div style="font-size:7px;opacity:0.5;">${e.description}</div>` : ''}
                        <div class="card-actions">
                            <button onclick="CalendarSystem.delete('${e.id}')" class="btn-danger">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        CalendarSystem.load();

        // =========================================================
        // KONTAKTE SYSTEM
        // =========================================================
        const ContactSystem = {
            contacts: [],
            load() { this.contacts = Storage.get('contacts', []); return this; },
            save() { Storage.set('contacts', this.contacts); return this; },
            add() {
                const name = document.getElementById('contact-name');
                const phone = document.getElementById('contact-phone');
                const email = document.getElementById('contact-email');
                if (!name || !phone) return;
                const contact = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: name.value ||
                        'Unbekannt', phone: phone.value || '', email: email?.value || '', createdAt: new Date()
                        .toISOString() };
                this.contacts.push(contact);
                this.save();
                name.value = '';
                phone.value = '';
                if (email) email.value = '';
                AppRouter.renderContacts();
                speak('Kontakt hinzugefügt.');
            },
            delete(id) { this.contacts = this.contacts.filter(c => c.id !== id);
                this.save();
                AppRouter.renderContacts(); },
            render() {
                const container = document.getElementById('contacts-container');
                if (!container) return;
                if (this.contacts.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:8px;">👤 Keine Kontakte</div>`;
                    return; }
                container.innerHTML = this.contacts.map(c =>
                    `<div class="card" style="padding:3px 5px;font-size:8px;">
                        <div class="card-title">${c.name}</div>
                        <div class="card-meta">📞 ${c.phone} ${c.email ? '· ✉️ ' + c.email : ''}</div>
                        <div class="card-actions">
                            <button onclick="ContactSystem.delete('${c.id}')" class="btn-danger">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        ContactSystem.load();

        // =========================================================
        // FILES SYSTEM
        // =========================================================
        const FileSystem = {
            files: [],
            load() { this.files = Storage.get('files', []); return this; },
            save() { Storage.set('files', this.files); return this; },
            create() {
                const name = document.getElementById('file-name');
                const content = document.getElementById('file-content');
                if (!name) return;
                const file = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: name.value ||
                        'Unbenannt', content: content?.value || '', size: Math.floor((content?.value?.length || 0) /
                        1024 * 10) / 10 + ' KB', createdAt: new Date().toISOString() };
                this.files.unshift(file);
                this.save();
                name.value = '';
                if (content) content.value = '';
                AppRouter.renderFiles();
                speak('Datei erstellt.');
            },
            delete(id) { this.files = this.files.filter(f => f.id !== id);
                this.save();
                AppRouter.renderFiles(); },
            render() {
                const container = document.getElementById('files-container');
                if (!container) return;
                if (this.files.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:8px;">📁 Keine Dateien</div>`;
                    return; }
                container.innerHTML = this.files.map(f =>
                    `<div class="card" style="padding:3px 5px;font-size:8px;">
                        <div class="card-title">${f.name}</div>
                        <div class="card-meta">${f.size} · ${new Date(f.createdAt).toLocaleDateString()}</div>
                        <div style="font-size:7px;opacity:0.5;max-height:20px;overflow:hidden;">${f.content || '(leer)'}</div>
                        <div class="card-actions">
                            <button onclick="FileSystem.delete('${f.id}')" class="btn-danger">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        FileSystem.load();

        // =========================================================
        // TASKS SYSTEM
        // =========================================================
        const TaskSystem = {
            tasks: [],
            load() { this.tasks = Storage.get('tasks', []); return this; },
            save() { Storage.set('tasks', this.tasks); return this; },
            add() {
                const title = document.getElementById('task-title');
                const date = document.getElementById('task-date');
                if (!title) return;
                const task = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Aufgabe', date: date?.value || new Date().toISOString().split('T')[0], done: false,
                    createdAt: new Date().toISOString() };
                this.tasks.push(task);
                this.save();
                title.value = '';
                AppRouter.renderTasks();
                speak('Aufgabe hinzugefügt.');
            },
            toggle(id) { const task = this.tasks.find(t => t.id === id); if (task) { task.done = !task.done;
                    this.save();
                    AppRouter.renderTasks(); } },
            delete(id) { this.tasks = this.tasks.filter(t => t.id !== id);
                this.save();
                AppRouter.renderTasks(); },
            render() {
                const container = document.getElementById('tasks-container');
                if (!container) return;
                if (this.tasks.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:8px;">✅ Keine Aufgaben</div>`;
                    return; }
                container.innerHTML = this.tasks.map(t =>
                    `<div class="card" style="padding:3px 5px;font-size:8px;${t.done ? 'opacity:0.5;' : ''}">
                        <div class="card-title">${t.done ? '✅' : '⬜'} ${t.title}</div>
                        <div class="card-meta">📅 ${new Date(t.date + 'T00:00:00').toLocaleDateString('de-DE')}</div>
                        <div class="card-actions">
                            <button onclick="TaskSystem.toggle('${t.id}')" class="btn-secondary">${t.done ? '↩️' : '✅'}</button>
                            <button onclick="TaskSystem.delete('${t.id}')" class="btn-danger">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        TaskSystem.load();

        // =========================================================
        // BOOT
        // =========================================================
        window._startTime = Date.now();

        function boot() {
            console.log(`🌌 HalDo AI OS ${HALDO_VERSION} ${HALDO_BUILD}`);
            console.log(`📱 ${APP_LIST.length} Apps`);
            console.log(`📚 Wissensgebiete: ${Object.keys(HalDoAI.knowledge).length}`);

            AppRouter.init();

            // Demo Warnungen
            setTimeout(() => {
                WarningSystem.add('baustelle', 'Baustelle A1', 'Fahrbahnverengung, 60 km/h', 'A1, km 45');
            }, 2000);
            setTimeout(() => {
                WarningSystem.add('blitzer', 'Blitzer A100', '80 km/h erlaubt', 'A100, Höhe Köln');
            }, 5000);

            setTimeout(() => {
                setStatus('System bereit');
                speak('HalDo AI OS 23.1.6. Ich bin bereit für alle Ihre Fragen. Klicken Sie auf die Sonne für den Chat.');
            }, 1500);

            console.log('✅ System bereit');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>

</body>
</html>
