        #haldo-sun::before {

            content:

            position:
                absolute;

            inset:

                        185,
                        55,
                        .16

                    transparent 73%

            z-index:
                -1;

            animation:
                haldoSunGlow
                5.2s
                ease-in-out
                infinite;

        #haldo-sun::after {

            content:

            position:

            left:

            top:

    <script>

        "use strict";


        window.HalDo =
            window.HalDo ||
            {};


        const HD =
            window.HalDo;


        HD.name =
            HD.name ||
            "HalDo AI OS";


        HD.product =
            HD.product ||
            "HalDo AI OS";


        HD.version =
            HD.version ||
            "22.0.0";


        HD.codename =
            HD.codename ||
            "Cosmic World";


        HD.platform =
            HD.platform ||
            "web-pwa";


        HD.started =
            false;


        HD.ready =
            false;


        HD.booted =
            false;


        HD.initialized =
            false;


        HD.online =
            navigator.onLine;


        HD.state =
            HD.state ||
            {};


        HD.config =
            HD.config ||
            {};


        HD.runtime =
            HD.runtime ||
            {};


        HD.apps =
            HD.apps ||
            {};


        HD.system =
            HD.system ||
            {};


        HD.services =
            HD.services ||
            {};


        HD.events =
            HD.events ||
            {};


        HD.cosmic =
            HD.cosmic ||
            {};


        HD.ui =
            HD.ui ||
            {};


        HD.device =
            HD.device ||
            {};


        HD.device.update =
            HD.device.update ||
            function () {

                this.width =
                    window.innerWidth;

                this.height =
                    window.innerHeight;

                this.touch =
                    "ontouchstart"
                    in window;


                if (
                    this.width < 700
                ) {

                    this.type =
                        "mobile";

                }

                else if (
                    this.width < 1200
                ) {

                    this.type =
                        "tablet";

                }

                else {

                    this.type =
                        "desktop";

                }


                this.orientation =
                    this.width >=
                    this.height
                        ? "landscape"
                        : "portrait";

            };


        HD.device.update();


        HD.events.listeners =
            HD.events.listeners ||
            new Map();


        HD.on =
            HD.on ||
            function (
                event,
                handler
            ) {

                if (
                    typeof handler !==
                    "function"
                ) {

                    return function () {};

                }


                if (
                    !this.events.listeners
                        .has(
                            event
                        )
                ) {

                    this.events.listeners
                        .set(
                            event,
                            new Set()
                        );

                }


                this.events.listeners
                    .get(event)
                    .add(handler);


                return function () {

                    HD.events.listeners
                        .get(event)
                        ?.delete(
                            handler
                        );

                };

            };


        HD.emit =
            HD.emit ||
            function (
                event,
                detail
            ) {

                const listeners =
                    this.events.listeners
                        .get(event);


                if (
                    !listeners
                ) {

                    return;

                }


                listeners.forEach(
                    function (
                        handler
                    ) {

                        try {

                            handler(
                                detail
                            );

                        }
                        catch(error) {

                            console.error(
                                "[HalDo]",
                                error
                            );

                        }

                    }
                );

            };


        HD.ui.display =
            document.getElementById(
                "haldo-display"
            );


        HD.ui.appRoot =
            document.getElementById(
                "haldo-app-root"
            );


        HD.ui.windowRoot =
            document.getElementById(
                "haldo-window-root"
            );


        HD.ui.menuRoot =
            document.getElementById(
                "haldo-menu-root"
            );


        HD.ui.notificationRoot =
            document.getElementById(
                "haldo-notification-root"
            );


        HD.cosmic.world =
            document.getElementById(
                "haldo-cosmic-world"
            );


        HD.cosmic.starsRoot =
            document.getElementById(
                "haldo-cosmic-stars"
            );


        HD.cosmic.planetsRoot =
            document.getElementById(
                "haldo-cosmic-planets"
            );


        HD.cosmic.sun =
            document.getElementById(
                "haldo-sun"
            );


        HD.emit(
            "index:display-ready",
            {
                width:
                    HD.device.width,

                height:
                    HD.device.height,

                device:
                    HD.device.type,

                orientation:
                    HD.device.orientation
            }
        );

    </script>

        function (

            detail
        ) {

            if (
                typeof HD.emit ===
                "function"
            ) {

                HD.emit(
                    event,
                    detail
                );

            }


            try {

                window.dispatchEvent(
                    new CustomEvent(

                        {
                            detail:
                                detail
                        }
                    )
                );

            }
            catch (
                error
            ) {

                console.warn(
                    "[HalDo Event Bridge]",
                    error
                );

            }

        };


    HD.eventBridge.listen =
        function (
            event,
            handler
        ) {

            if (
                typeof handler !==
                "function"
            ) {

                return function () {};

            }


            let unsubscribe =
                null;


            if (
                typeof HD.on ===
                "function"
            ) {

                unsubscribe =
                    HD.on(
                        event,
                        handler
                    );

            }


            const browserHandler =
                function (
                    eventObject
                ) {

                    handler(
                        eventObject.detail
                    );

                };


            window.addEventListener(
                "haldo:" + event,
                browserHandler
            );


            return function () {

                if (
                    typeof unsubscribe ===
                    "function"
                ) {

                    unsubscribe();

                }


                window.removeEventListener(
                    "haldo:" + event,
                    browserHandler
                );

            };

        };

                String(
                    route

            const previous =
                this.current;


            this.current =
                normalized;


            this.history.push(
                {
                    route:
                        normalized,

                    previous:
                        previous,

                    data:
                        data ||
                        null,

                    timestamp:
                        Date.now()

            const handler =
                this.routes.get(

                        data ||

            this.current =
                previous.route;


            HD.eventBridge.emit(

                this.routes.get(

            label.className =
                "haldo-app-icon-label";

            );

                "click",

                ) {

                    event.stopPropagation();

                    );

            );

       FIND APP GRID
       ========================================================= */

    HD.launcher.findGrid =
        function () {

            return (
                HD.ui.get(
                    "haldo-app-grid"
                ) ||
                HD.ui.get(

                ) ||

                )
            );

            ) {

            const apps =
                HD.appRegistry?.list
                    ? HD.appRegistry.list()
                    : (
                        typeof HD.getApps ===
                        "function"
                            ? HD.getApps()
                            : []
                    );


            grid.innerHTML =
                "";


            apps
                .filter(
                    function (
                        app
                    ) {

                        return (
                            app &&
                            app.enabled !==
                            false
                        );

                )
                .forEach(

                event.preventDefault();

            }
        );

    }


    /* =========================================================
       CLOSE LAUNCHER OUTSIDE
       ========================================================= */

    document.addEventListener(
        "pointerdown",
        function (
            event
        ) {

            if (
                !HD.ui.launcherOpen
            ) {

                return;

            }


            const root =
                HD.launcher.root();


            if (
                !root
            ) {

                return;

            }


            if (
                !root.contains(

                ) &&

                launcherButton
            ) {

                HD.launcher.close();

            }

        },
        {
            passive:
                true
        }
    );


    /* =========================================================
       ESCAPE KEY
       ========================================================= */

    document.addEventListener(
        "keydown",
        function (
            event
        ) {

            if (
                event.key ===

                HD.ui.launcherOpen
            ) {

                HD.launcher.close();

            }

        }
    );


    /* =========================================================
       APP REGISTRY UPDATES
       ========================================================= */

    HD.eventBridge?.listen(
        "app:registered",
        function () {

            HD.launcher.render();

        }
    );


    HD.eventBridge?.listen(
        "app:unregistered",
        function () {

            HD.launcher.render();

        }
    );

       ========================================================= */

    HD.eventBridge?.listen(
        "app:launching",
        function (
            detail
        ) {

    );

        "window:created",

            detail
        ) {

    );

        ) {

            HD.ui.activeWindow =
                detail?.id ||
                null;

        }
    );


    /* =========================================================
       INITIAL RENDER
       ========================================================= */

    HD.launcher.render();


    HD.ui.ready =
        true;


    HD.boot?.setProgress?.(

        "launcher"
    );


    HD.eventBridge?.emit(
        "ui:ready",
        {
            launcher:
                true,

            apps:
                HD.appRegistry?.list?.()
                    ?.length ||
                0
        }
    );


})();

<script>

"use strict";


(function () {

    const HD =
        window.HalDo ||
        {};


    /* =========================================================
       WINDOW MANAGER
       ========================================================= */

    HD.windowManager =
        HD.windowManager ||
        {};


    HD.windowManager.windows =
        HD.windowManager.windows ||
        new Map();


    HD.windowManager.activeId =
        null;


    HD.windowManager.zIndex =
        500;


    /* =========================================================
       REGISTER WINDOW
       ========================================================= */

    HD.windowManager.register =
        function (
            record
        ) {

            if (
                !record ||
                !record.id ||
                !record.element
            ) {

                return null;

            }


            this.windows.set(
                record.id,
                record
            );


            this.focus(
                record.id
            );


            return record;

        };


    /* =========================================================
       FOCUS
       ========================================================= */

    HD.windowManager.focus =
        function (
            id
        ) {

            const record =
                this.windows.get(
                    id
                );


            if (
                !record
            ) {

                return false;

            }


            this.zIndex += 1;


            record.element.style.zIndex =
                String(
                    this.zIndex
                );


            this.activeId =
                id;


            HD.ui.activeWindow =
                id;


            HD.eventBridge?.emit(
                "window-manager:focus",
                record
            );


            return true;

        };


    /* =========================================================
       CLOSE
       ========================================================= */

    HD.windowManager.close =
        function (
            id
        ) {

            const record =
                this.windows.get(
                    id
                );


            if (
                !record
            ) {

                return false;

            }


            if (
                typeof HD.closeWindow ===
                "function"
            ) {

                HD.closeWindow(
                    id
                );

            }
            else {

                record.element.remove();

            }


            this.windows.delete(
                id
            );


            if (
                this.activeId ===
                id
            ) {

                this.activeId =
                    null;

            }


            HD.eventBridge?.emit(
                "window-manager:close",
                record
            );


            return true;

        };


    /* =========================================================
       REGISTER EXISTING WINDOWS
       ========================================================= */

    HD.eventBridge?.listen(
        "window:created",
        function (
            record
        ) {

            HD.windowManager.register(
                record
            );

        }
    );


    HD.eventBridge?.listen(
        "window:closed",
        function (
            record
        ) {

            if (
                record?.id
            ) {

                HD.windowManager.windows.delete(
                    record.id
                );

            }

        }
    );


    HD.eventBridge?.listen(
        "window:focused",
        function (
            record
        ) {

            if (
                record?.id
            ) {

                HD.windowManager.activeId =
                    record.id;

            }

        }
    );


    /* =========================================================
       TOUCH SUPPORT
       ========================================================= */

    HD.touch =
        HD.touch ||
        {};


    HD.touch.active =
        false;


    HD.touch.startX =
        0;


    HD.touch.startY =
        0;


    HD.touch.startTime =
        0;


    HD.touch.bind =
        function (
            element
        ) {

            if (
                !element ||
                element.dataset
                    .haldoTouchBound ===
                "true"
            ) {

                return;

            }


            element.dataset
                .haldoTouchBound =
                "true";


            element.addEventListener(
                "touchstart",
                function (
                    event
                ) {

                    const touch =
                        event.touches[
                            0
                        ];


                    if (
                        !touch
                    ) {

                        return;

                    }


                    HD.touch.active =
                        true;


                    HD.touch.startX =
                        touch.clientX;


                    HD.touch.startY =
                        touch.clientY;


                    HD.touch.startTime =
                        Date.now();

                },
                {
                    passive:
                        true
                }
            );


            element.addEventListener(
                "touchend",
                function (
                    event
                ) {

                    if (
                        !HD.touch.active
                    ) {

                        return;

                    }


                    const touch =
                        event.changedTouches[
                            0
                        ];


                    if (
                        !touch
                    ) {

                        return;

                    }


                    const dx =
                        touch.clientX -
                        HD.touch.startX;


                    const dy =
                        touch.clientY -
                        HD.touch.startY;


                    const duration =
                        Date.now() -
                        HD.touch.startTime;


                    HD.touch.active =
                        false;


                    const absX =
                        Math.abs(
                            dx
                        );


                    const absY =
                        Math.abs(
                            dy
                        );


                    if (
                        duration <
                        700 &&
                        absX <
                        12 &&
                        absY <
                        12
                    ) {

                        HD.eventBridge?.emit(
                            "touch:tap",
                            {
                                x:
                                    touch.clientX,

                                y:
                                    touch.clientY,

                                duration:
                                    duration
                            }
                        );

                    }


                    if (
                        absX >
                        55 &&
                        absX >
                        absY
                    ) {

                        HD.eventBridge?.emit(
                            dx > 0
                                ? "touch:swipe-right"
                                : "touch:swipe-left",
                            {
                                dx:
                                    dx,

                                dy:
                                    dy,

                                duration:
                                    duration
                            }
                        );

                    }


                    if (
                        absY >
                        55 &&
                        absY >
                        absX
                    ) {

                        HD.eventBridge?.emit(
                            dy > 0
                                ? "touch:swipe-down"
                                : "touch:swipe-up",
                            {
                                dx:
                                    dx,

                                dy:
                                    dy,

                                duration:
                                    duration
                            }
                        );

                    }

                },
                {
                    passive:
                        true
                }
            );

        };


    /* =========================================================
       BIND TOUCH TO OS
       ========================================================= */

    const osRoot =
        document.getElementById(
            "haldo-os"
        );


    if (
        osRoot
    ) {

        HD.touch.bind(
            osRoot
        );

    }


    /* =========================================================
       FULLSCREEN
       ========================================================= */

    HD.fullscreen =
        HD.fullscreen ||
        {};


    HD.fullscreen.active =
        false;


    HD.fullscreen.enter =
        async function () {

            const target =
                document.documentElement;


            try {

                if (
                    document.fullscreenElement
                ) {

                    this.active =
                        true;

                    return true;

                }


                if (
                    target.requestFullscreen
                ) {

                    await target.requestFullscreen();

                    this.active =
                        true;


                    HD.eventBridge?.emit(
                        "fullscreen:entered",
                        {}
                    );


                    return true;

                }

            }
            catch (
                error
            ) {

                HD.system?.log?.(
                    "warn",
                    "Fullscreen konnte nicht aktiviert werden.",
                    error
                );

            }


            return false;

        };


    HD.fullscreen.exit =
        async function () {

            try {

                if (
                    document.fullscreenElement &&
                    document.exitFullscreen
                ) {

                    await document.exitFullscreen();

                }


                this.active =
                    false;


                HD.eventBridge?.emit(
                    "fullscreen:exited",
                    {}
                );


                return true;

            }
            catch (
                error
            ) {

                return false;

            }

        };


    HD.fullscreen.toggle =
        async function () {

            if (
                document.fullscreenElement
            ) {

                return this.exit();

            }


            return this.enter();

        };


    document.addEventListener(
        "fullscreenchange",
        function () {

            HD.fullscreen.active =
                !!document.fullscreenElement;


            HD.eventBridge?.emit(
                "fullscreen:change",
                {
                    active:
                        HD.fullscreen.active
                }
            );

        }
    );


    /* =========================================================
       WINDOW POINTER FOCUS
       ========================================================= */

    document.addEventListener(
        "pointerdown",
        function (
            event
        ) {

            const windowElement =
                event.target.closest?.(
                    ".haldo-window"
                );


            if (
                !windowElement
            ) {

                return;

            }


            const id =
                windowElement.dataset
                    .windowId;


            if (
                id
            ) {

                HD.windowManager.focus(
                    id
                );

            }

        },
        {
            passive:
                true
        }
    );


    /* =========================================================
       RESPONSIVE WINDOW UPDATE
       ========================================================= */

    HD.eventBridge?.listen(
        "display:resize",
        function () {

            HD.windowManager.windows
                .forEach(
                    function (
                        record
                    ) {

                        if (
                            !record?.element
                        ) {

                            return;

                        }


                        if (
                            window.innerWidth <=
                            700
                        ) {

                            record.element.style.maxWidth =
                                "calc(100% - 8px)";

                            record.element.style.maxHeight =
                                "calc(100% - 8px)";

                        }
                        else {

                            record.element.style.maxWidth =
                                "calc(100% - 24px)";

                            record.element.style.maxHeight =
                                "calc(100% - 24px)";

                        }

                    }
                );

        }
    );


    /* =========================================================
       READY
       ========================================================= */

    HD.boot?.setProgress?.(
        60,
        "window-manager"
    );


    HD.eventBridge?.emit(
        "window-manager:ready",
        {
            touch:
                true,

            fullscreen:
                true
        }
    );


})();

</script>

        ) {

                            "2-digit",

                            "2-digit",

                            "2-digit"

                            "long",

                            "2-digit",

                            "long",

                            "numeric"

                        ) {

                                );

                                );

                    )

                        : String(

                }

       NETWORK STATUS

            passive:
                true
        }
    );

            ) {

            this.level =
                Math.round(
                    battery.level *
                    100
                );


            this.charging =
                !!battery.charging;


            HD.statusBar.set(
                "battery",
                this.level +
                "%"
            );


            HD.eventBridge?.emit(
                "battery:changed",
                {
                    level:
                        this.level,

                    charging:
                        this.charging
                }
            );

        };


    if (
        navigator.getBattery
    ) {

        navigator.getBattery()
            .then(
                function (
                    battery

                            );

<script>

"use strict";


(function () {

    const HD =
        window.HalDo ||
        {};


    /* =========================================================
       STORAGE FOUNDATION
       ========================================================= */

    HD.storage =
        HD.storage ||
        {};


    HD.storage.prefix =
        "haldo:";


    HD.storage.memory =
        HD.storage.memory ||
        new Map();


    HD.storage.serialize =
        function (
            value
        ) {

            try {

                return JSON.stringify(
                    value
                );

            }
            catch (
                error
            ) {

                return String(
                    value
                );

            }

        };


    HD.storage.deserialize =
        function (
            value
        ) {

            if (
                value ===
                null ||
                value ===
                undefined
            ) {

                return null;

            }


            try {

                return JSON.parse(
                    value
                );

            }
            catch (
                error
            ) {

                return value;

            }

        };


    /* =========================================================
       SET
       ========================================================= */

    HD.storage.set =
        function (
            key,
            value,
            persistent
        ) {

            if (
                !key
            ) {

                return false;

            }


            const storageKey =
                this.prefix +
                String(
                    key
                );


            this.memory.set(
                storageKey,
                value
            );


            if (
                persistent !== false
            ) {

                try {

                    localStorage.setItem(
                        storageKey,
                        this.serialize(
                            value
                        )
                    );

                }
                catch (
                    error
                ) {

                    HD.system?.log?.(
                        "warn",
                        "Local Storage nicht verfügbar.",
                        error
                    );

                }

            }


            HD.eventBridge?.emit(
                "storage:set",
                {
                    key:
                        key,

                    value:
                        value
                }
            );


            return true;

        };


    /* =========================================================
       GET
       ========================================================= */

    HD.storage.get =
        function (
            key,
            fallback
        ) {

            if (
                !key
            ) {

                return fallback;

            }


            const storageKey =
                this.prefix +
                String(
                    key
                );


            if (
                this.memory.has(
                    storageKey
                )
            ) {

                return this.memory.get(
                    storageKey
                );

            }


            try {

                const raw =
                    localStorage.getItem(
                        storageKey
                    );


                if (
                    raw !==
                    null
                ) {

                    const value =
                        this.deserialize(
                            raw
                        );


                    this.memory.set(
                        storageKey,
                        value
                    );


                    return value;

                }

            }
            catch (
                error
            ) {

                HD.system?.log?.(
                    "warn",
                    "Storage konnte nicht gelesen werden.",
                    error
                );

            }


            return fallback;

        };


    /* =========================================================
       REMOVE
       ========================================================= */

    HD.storage.remove =
        function (
            key
        ) {

            if (
                !key
            ) {

                return false;

            }


            const storageKey =
                this.prefix +
                String(
                    key
                );


            this.memory.delete(
                storageKey
            );


            try {

                localStorage.removeItem(
                    storageKey
                );

            }
            catch (
                error
            ) {}


            HD.eventBridge?.emit(
                "storage:removed",
                {
                    key:
                        key
                }
            );


            return true;

        };


    /* =========================================================
       CLEAR HALDO STORAGE
       ========================================================= */

    HD.storage.clear =
        function () {

            this.memory.clear();


            try {

                const keys =
                    [];


                for (
                    let index = 0;
                    index <
                    localStorage.length;
                    index += 1
                ) {

                    const key =
                        localStorage.key(
                            index
                        );


                    if (
                        key &&
                        key.startsWith(
                            this.prefix
                        )
                    ) {

                        keys.push(
                            key
                        );

                    }

                }


                keys.forEach(
                    function (
                        key
                    ) {

                        localStorage.removeItem(
                            key
                        );

                    }
                );

            }
            catch (
                error
            ) {}


            HD.eventBridge?.emit(
                "storage:cleared",
                {}
            );


            return true;

        };


    /* =========================================================
       NAMESPACE
       ========================================================= */

    HD.storage.namespace =
        function (
            namespace
        ) {

            const base =
                this.prefix +
                String(
                    namespace ||
                    ""
                ) +
                ":";


            return {

                set:
                    function (
                        key,
                        value
                    ) {

                        HD.storage.set(
                            base +
                            key,
                            value
                        );

                    },

                get:
                    function (
                        key,
                        fallback
                    ) {

                        return HD.storage.get(
                            base +
                            key,
                            fallback
                        );

                    },

                remove:
                    function (
                        key
                    ) {

                        return HD.storage.remove(
                            base +
                            key
                        );

                    }

            };

        };


    /* =========================================================
       DATABASE-LIKE APP STORAGE
       ========================================================= */

    HD.appStorage =
        HD.appStorage ||
        {};


    HD.appStorage.for =
        function (
            appId
        ) {

            return HD.storage.namespace(
                "app:" +
                String(
                    appId ||
                    "unknown"
                )
            );

        };


    /* =========================================================
       BACKUP FOUNDATION
       ========================================================= */

    HD.backup =
        HD.backup ||
        {};


    HD.backup.version =
        "1.0";


    HD.backup.create =
        function () {

            const data =
                {

                    format:
                        "haldo-backup",

                    version:
                        this.version,

                    createdAt:
                        new Date()
                            .toISOString(),

                    osVersion:
                        HD.version ||
                        "22.0.0",

                    settings:
                        HD.settings?.values ||
                        {},

                    apps:
                        HD.appRegistry?.list?.() ||
                        [],

                    storage:
                        {},

                    theme:
                        HD.theme?.current ||
                        "cosmic",

                    language:
                        HD.language?.current ||
                        "de-DE"

                };


            try {

                for (
                    let index = 0;
                    index <
                    localStorage.length;
                    index += 1
                ) {

                    const key =
                        localStorage.key(
                            index
                        );


                    if (
                        key &&
                        key.startsWith(
                            HD.storage.prefix
                        )
                    ) {

                        data.storage[
                            key
                        ] =
                            localStorage.getItem(
                                key
                            );

                    }

                }

            }
            catch (
                error
            ) {}


            HD.eventBridge?.emit(
                "backup:created",
                data
            );


            return data;

        };


    /* =========================================================
       BACKUP EXPORT
       ========================================================= */

    HD.backup.export =
        function () {

            const data =
                this.create();


            const blob =
                new Blob(
                    [
                        JSON.stringify(
                            data,
                            null,
                            2
                        )
                    ],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const anchor =
                document.createElement(
                    "a"
                );


            anchor.href =
                url;


            anchor.download =
                "haldo-backup-" +
                Date.now() +
                ".json";


            document.body.appendChild(
                anchor
            );


            anchor.click();


            anchor.remove();


            setTimeout(
                function () {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            HD.eventBridge?.emit(
                "backup:exported",
                data
            );


            return true;

        };


    /* =========================================================
       STORAGE READY
       ========================================================= */

    HD.boot?.setProgress?.(
        86,
        "storage"
    );


    HD.eventBridge?.emit(
        "storage:ready",
        {
            persistent:
                true,

            backup:
                true
        }
    );


})();

</script>

<script>

"use strict";


(function () {

    const HD =
        window.HalDo ||
        {};


    /* =========================================================
       PWA FOUNDATION
       ========================================================= */

    HD.pwa =
        HD.pwa ||
        {};


    HD.pwa.supported =
        "serviceWorker" in
        navigator;


    HD.pwa.registered =
        false;


    HD.pwa.registration =
        null;


    HD.pwa.updateAvailable =
        false;


    HD.pwa.installPrompt =
        null;


    /* =========================================================
       SERVICE WORKER REGISTRATION
       ========================================================= */

    HD.pwa.register =
        async function () {

            if (
                !this.supported
            ) {

                HD.system?.log?.(
                    "warn",
                    "Service Worker wird von diesem Gerät nicht unterstützt."
                );


                return null;

            }


            if (
                location.protocol !==
                    "https:" &&
                location.hostname !==
                    "localhost" &&
                location.hostname !==
                    "127.0.0.1"
            ) {

                HD.system?.log?.(
                    "warn",
                    "Service Worker benötigt HTTPS oder localhost."
                );


                return null;

            }


            try {

                const registration =
                    await navigator.serviceWorker.register(
                        "service-worker.js",
                        {
                            scope:
                                "./"
                        }
                    );


                this.registration =
                    registration;


                this.registered =
                    true;


                this.attachRegistration(
                    registration
                );


                HD.eventBridge?.emit(
                    "pwa:registered",
                    {
                        registration:
                            registration
                    }
                );


                return registration;

            }
            catch (
                error
            ) {

                this.registered =
                    false;


                HD.system?.log?.(
                    "warn",
                    "Service Worker Registrierung fehlgeschlagen.",
                    error
                );


                HD.eventBridge?.emit(
                    "pwa:registration-error",
                    {
                        error:
                            error
                    }
                );


                return null;

            }

        };


    /* =========================================================
       REGISTRATION EVENTS
       ========================================================= */

    HD.pwa.attachRegistration =
        function (
            registration
        ) {

            if (
                !registration
            ) {

                return;

            }


            if (
                registration.waiting
            ) {

                this.markUpdateAvailable(
                    registration.waiting
                );

            }


            registration.addEventListener(
                "updatefound",
                function () {

                    const worker =
                        registration.installing;


                    if (
                        !worker
                    ) {

                        return;

                    }


                    worker.addEventListener(
                        "statechange",
                        function () {

                            if (
                                worker.state ===
                                "installed"
                            ) {

                                if (
                                    navigator.serviceWorker
                                        .controller
                                ) {

                                    HD.pwa
                                        .markUpdateAvailable(
                                            worker
                                        );

                                }
                                else {

                                    HD.eventBridge?.emit(
                                        "pwa:first-install",
                                        {}
                                    );

                                }

                            }

                        }
                    );

                }
            );

        };


    /* =========================================================
       UPDATE AVAILABLE
       ========================================================= */

    HD.pwa.markUpdateAvailable =
        function (
            worker
        ) {

            this.updateAvailable =
                true;


            this.waitingWorker =
                worker ||
                null;


            HD.eventBridge?.emit(
                "pwa:update-available",
                {
                    worker:
                        worker ||
                        null
                }
            );

        };


    /* =========================================================
       CHECK FOR UPDATE
       ========================================================= */

    HD.pwa.checkUpdate =
        async function () {

            if (
                !this.registration
            ) {

                return false;

            }


            try {

                await this.registration.update();


                HD.eventBridge?.emit(
                    "pwa:update-check",
                    {
                        success:
                            true
                    }
                );


                return true;

            }
            catch (
                error
            ) {

                HD.system?.log?.(
                    "warn",
                    "PWA Update-Prüfung fehlgeschlagen.",
                    error
                );


                return false;

            }

        };


    /* =========================================================
       APPLY UPDATE
       ========================================================= */

    HD.pwa.applyUpdate =
        function () {

            const worker =
                this.waitingWorker ||
                this.registration?.waiting;


            if (
                !worker
            ) {

                return false;

            }


            try {

                worker.postMessage(
                    {
                        type:
                            "SKIP_WAITING"
                    }
                );


                HD.eventBridge?.emit(
                    "pwa:update-applying",
                    {}
                );


                return true;

            }
            catch (
                error
            ) {

                return false;

            }

        };


    /* =========================================================
       CONTROLLER CHANGE
       ========================================================= */

    if (
        this &&
        navigator.serviceWorker
    ) {

        navigator.serviceWorker.addEventListener(
            "controllerchange",
            function () {

                HD.eventBridge?.emit(
                    "pwa:controller-changed",
                    {}
                );

            }
        );

    }


    /* =========================================================
       INSTALL PROMPT
       ========================================================= */

    window.addEventListener(
        "beforeinstallprompt",
        function (
            event
        ) {

            event.preventDefault();


            HD.pwa.installPrompt =
                event;


            HD.eventBridge?.emit(
                "pwa:install-available",
                {
                    prompt:
                        event
                }
            );

        }
    );


    HD.pwa.install =
        async function () {

            const prompt =
                this.installPrompt;


            if (
                !prompt
            ) {

                return false;

            }


            try {

                prompt.prompt();


                const result =
                    await prompt.userChoice;


                this.installPrompt =
                    null;


                HD.eventBridge?.emit(
                    "pwa:install-result",
                    {
                        result:
                            result
                    }
                );


                return (
                    result?.outcome ===
                    "accepted"
                );

            }
            catch (
                error
            ) {

                return false;

            }

        };


    /* =========================================================
       APP INSTALLED
       ========================================================= */

    window.addEventListener(
        "appinstalled",
        function () {

            HD.eventBridge?.emit(
                "pwa:installed",
                {}
            );

        }
    );


    /* =========================================================
       UPDATE MANAGER BRIDGE
       ========================================================= */

    HD.updateManager =
        HD.updateManager ||
        {};


    HD.updateManager.version =
        HD.version ||
        "22.0.0";


    HD.updateManager.check =
        function () {

            return HD.pwa.checkUpdate();

        };


    HD.updateManager.apply =
        function () {

            return HD.pwa.applyUpdate();

        };


    HD.updateManager.available =
        function () {

            return HD.pwa.updateAvailable;

        };


    /* =========================================================
       REGISTER PWA
       ========================================================= */

    HD.pwa.register()
        .then(
            function () {

                HD.boot?.setProgress?.(
                    94,
                    "pwa"
                );

            }
        );


    /* =========================================================
       PWA READY BRIDGE
       ========================================================= */

    HD.eventBridge?.emit(
        "pwa:ready",
        {
            supported:
                HD.pwa.supported,

            registered:
                HD.pwa.registered
        }
    );


})();

</script>

<script>

"use strict";


(function () {

    const HD =
        window.HalDo ||

    /* =========================================================
       NOTIFICATION FOUNDATION
       ========================================================= */

    HD.notifications =
        HD.notifications ||
        {};


    HD.notifications.items =
        HD.notifications.items ||
        [];


    HD.notifications.max =
        100;


    HD.notifications.container =
        function () {

            return (
                document.getElementById(
                    "haldo-notifications"
                ) ||
                document.querySelector(
                    ".haldo-notifications"
                )
            );

        };


    /* =========================================================
       CREATE CONTAINER WHEN NEEDED
       ========================================================= */

    HD.notifications.ensureContainer =
        function () {

            let container =
                this.container();


            if (
                container
            ) {

                return container;

            }


            container =
                document.createElement(
                    "div"
                );


            container.id =
                "haldo-notifications";


            container.className =
                "haldo-notifications";


            container.setAttribute(
                "aria-live",
                "polite"
            );


            container.setAttribute(
                "aria-atomic",
                "true"
            );


            document.body.appendChild(
                container
            );


            return container;

        };


    /* =========================================================
       ADD NOTIFICATION
       ========================================================= */

    HD.notifications.add =
        function (
            message,
            options
        ) {

            options =
                options ||
                {};


            const text =
                String(
                    message ||
                    ""
                ).trim();


            if (
                !text
            ) {

                return null;

            }


            const item =
                {

                    id:
                        "notification-" +
                        Date.now() +
                        "-" +
                        Math.random()
                            .toString(
                                36
                            )
                            .slice(
                                2,
                                8
                            ),

                    message:
                        text,

                    type:
                        options.type ||
                        "info",

                    title:
                        options.title ||
                        "",

                    duration:
                        Number.isFinite(
                            options.duration
                        )
                            ? options.duration
                            : 4000,

                    timestamp:
                        Date.now()

                };


            this.items.push(
                item
            );


            if (
                this.items.length >
                this.max
            ) {

                this.items.shift();

            }


            this.render(
                item
            );


            HD.eventBridge?.emit(
                "notification:added",
                item
            );


            return item;

        };


    /* =========================================================
       RENDER TOAST
       ========================================================= */

    HD.notifications.render =
        function (
            item
        ) {

            const container =
                this.ensureContainer();


            if (
                !container ||
                !item
            ) {

                return;

            }


            const toast =
                document.createElement(
                    "div"
                );


            toast.className =
                "haldo-notification " +
                "haldo-notification-" +
                item.type;


            toast.dataset.notificationId =
                item.id;


            toast.setAttribute(
                "role",
                "status"
            );


            if (
                item.title
            ) {

                const title =
                    document.createElement(
                        "strong"
                    );


                title.className =
                    "haldo-notification-title";


                title.textContent =
                    item.title;


                toast.appendChild(
                    title
                );

            }


            const content =
                document.createElement(
                    "span"
                );


            content.className =
                "haldo-notification-message";


            content.textContent =
                item.message;


            toast.appendChild(
                content
            );


            const close =
                document.createElement(
                    "button"
                );


            close.type =
                "button";


            close.className =
                "haldo-notification-close";


            close.setAttribute(
                "aria-label",
                "Schließen"
            );


            close.textContent =
                "×";


            close.addEventListener(
                "click",
                function () {

                    HD.notifications.remove(
                        item.id
                    );

                }
            );


            toast.appendChild(
                close
            );


            container.appendChild(
                toast
            );


            requestAnimationFrame(
                function () {

                    toast.classList.add(
                        "is-visible"
                    );

                }
            );


            if (
                item.duration >
                0
            ) {

                setTimeout(
                    function () {

                        HD.notifications.remove(
                            item.id
                        );

                    },
                    item.duration
                );

            }

        };


    /* =========================================================
       REMOVE NOTIFICATION
       ========================================================= */

    HD.notifications.remove =
        function (
            id
        ) {

            if (
                !id
            ) {

                return false;

            }


            const index =
                this.items.findIndex(
                    function (
                        item
                    ) {

                        return item.id ===
                            id;

                    }
                );


            if (
                index ===
                -1
            ) {

                return false;

            }


            const item =
                this.items[
                    index
                ];


            this.items.splice(
                index,
                1
            );


            const element =
                document.querySelector(
                    `[data-notification-id="${id}"]`
                );


            if (
                element
            ) {

                element.classList.remove(
                    "is-visible"
                );


                setTimeout(
                    function () {

                        element.remove();

                    },
                    200
                );

            }


            HD.eventBridge?.emit(
                "notification:removed",
                item
            );


            return true;

        };


    /* =========================================================
       SHORTCUTS
       ========================================================= */

    HD.notify =
        function (
            message,
            options
        ) {

            return HD.notifications.add(
                message,
                options
            );

        };


    HD.notify.info =
        function (
            message,
            options
        ) {

            return HD.notifications.add(
                message,
                Object.assign(
                    {},
                    options || {},
                    {
                        type:
                            "info"
                    }
                )
            );

        };


    HD.notify.success =
        function (
            message,
            options
        ) {

            return HD.notifications.add(
                message,
                Object.assign(
                    {},
                    options || {},
                    {
                        type:
                            "success"
                    }
                )
            );

        };


    HD.notify.warning =
        function (
            message,
            options
        ) {

            return HD.notifications.add(
                message,
                Object.assign(
                    {},
                    options || {},
                    {
                        type:
                            "warning"
                    }
                )
            );

        };


    HD.notify.error =
        function (
            message,
            options
        ) {

            return HD.notifications.add(
                message,
                Object.assign(
                    {},
                    options || {},
                    {
                        type:
                            "error"
                    }
                )
            );

        };


    /* =========================================================
       GLOBAL ERROR BRIDGE
       ========================================================= */

    window.addEventListener(
        "error",
        function (
            event
        ) {

            const error =
                event.error ||
                event.message ||
                "Unbekannter Fehler";


            HD.system?.log?.(
                "error",
                "Globaler JavaScript-Fehler.",
                {
                    error:
                        String(
                            error
                        ),

                    source:
                        event.filename ||
                        "",

                    line:
                        event.lineno ||
                        0,

                    column:
                        event.colno ||
                        0
                }
            );


            HD.eventBridge?.emit(
                "system:error",
                {
                    error:
                        error,

                    event:
                        event
                }
            );

        }
    );


    window.addEventListener(
        "unhandledrejection",
        function (
            event
        ) {

            const reason =
                event.reason ||
                "Unhandled Promise Rejection";


            HD.system?.log?.(
                "error",
                "Unhandled Promise Rejection.",
                reason
            );


            HD.eventBridge?.emit(
                "system:unhandled-rejection",
                {
                    reason:
                        reason
                }
            );

        }
    );


    /* =========================================================
       SYSTEM ERROR EVENTS
       ========================================================= */

    HD.eventBridge?.listen(
        "system:error",
        function (
            detail
        ) {

            if (
                HD.settings?.get?.(
                    "showSystemErrors",
                    false
                )
            ) {

                HD.notify.error(
                    "Ein Systemfehler wurde erkannt.",
                    {
                        title:
                            "HalDo AI OS",

                        duration:
                            5000
                    }
                );

            }

        }
    );


    HD.eventBridge?.listen(

                {
                    title:
                        "Update verfügbar",

                    duration:
                        6000
                }
            );

        }
    );


    /* =========================================================
       NOTIFICATION READY
       ========================================================= */

    HD.boot?.setProgress?.(
        96,
        "notifications"
    );


    HD.eventBridge?.emit(
        "notifications:ready",
        {
            supported:
                true
        }
    );


})();

<script>

"use strict";


(function () {

    const HD =
        window.HalDo ||
        {};


    /* =========================================================
       COMMAND CENTER
       ========================================================= */

    HD.commandCenter =
        HD.commandCenter ||
        {};


    HD.commandCenter.ready =
        false;


    HD.commandCenter.commands =
        HD.commandCenter.commands ||
        new Map();


    HD.commandCenter.register =
        function (
            id,
            command
        ) {

            if (
                !id ||
                typeof command !==
                "function"
            ) {

                return false;

            }


            this.commands.set(
                String(
                    id
                ),
                command
            );


            return true;

        };


    HD.commandCenter.execute =
        async function (
            id,
            payload
        ) {

            const command =
                this.commands.get(
                    String(
                        id
                    )
                );


            if (
                typeof command !==
                "function"
            ) {

                return false;

            }


            try {

                return await command(
                    payload
                );

            }
            catch (
                error
            ) {

                HD.system?.log?.(
                    "error",
                    "Command konnte nicht ausgeführt werden.",
                    error
                );


                return false;

            }

        };


    /* =========================================================
       APP SEARCH
       ========================================================= */

    HD.appSearch =
        HD.appSearch ||
        {};


    HD.appSearch.query =
        "";


    HD.appSearch.results =
        [];


    HD.appSearch.search =
        function (
            query
        ) {

            const value =
                String(
                    query ||
                    ""
                )
                .trim()
                .toLowerCase();


            this.query =
                value;


            const apps =
                HD.appRegistry?.list?.() ||
                [];


            if (
                !value
            ) {

                this.results =
                    apps.filter(
                        function (
                            app
                        ) {

                            return (
                                app &&
                                app.enabled !==
                                false
                            );

                        }
                    );

                return this.results;

            }


            this.results =
                apps.filter(
                    function (
                        app
                    ) {

                        if (
                            !app ||
                            app.enabled ===
                            false
                        ) {

                            return false;

                        }


                        const text =
                            [

                                app.id,

                                app.name,

                                app.title,

                                app.category,

                                app.type

                            ]
                            .join(
                                " "
                            )
                            .toLowerCase();


                        return text.includes(
                            value
                        );

                    }
                );


            HD.eventBridge?.emit(
                "app-search:results",
                {
                    query:
                        value,

                    results:
                        this.results
                }
            );


            return this.results;

        };


    /* =========================================================
       SEARCH UI
       ========================================================= */

    HD.appSearch.findInput =
        function () {

            return (
                document.getElementById(
                    "haldo-app-search"
                ) ||
                document.querySelector(
                    "[data-haldo-app-search]"
                ) ||
                document.querySelector(
                    ".haldo-app-search"
                )
            );

        };


    HD.appSearch.findResults =
        function () {

            return (
                document.getElementById(
                    "haldo-app-search-results"
                ) ||
                document.querySelector(
                    "[data-haldo-app-search-results]"
                ) ||
                document.querySelector(
                    ".haldo-app-search-results"
                )
            );

        };


    HD.appSearch.render =
        function (
            results
        ) {

            const container =
                this.findResults();


            if (
                !container
            ) {

                return false;

            }


            container.innerHTML =
                "";


            results.forEach(
                function (
                    app
                ) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "haldo-search-result";


                    button.dataset.appId =
                        app.id;


                    const image =
                        document.createElement(
                            "img"
                        );


                    image.src =
                        app.icon ||
                        "logo.png";


                    image.alt =
                        "";


                    const label =
                        document.createElement(
                            "span"
                        );


                    label.textContent =
                        app.title ||
                        app.name ||
                        app.id;


                    button.appendChild(
                        image
                    );


                    button.appendChild(
                        label
                    );


                    button.addEventListener(
                        "click",
                        function () {

                            HD.launchApp(
                                app.id
                            );


                            HD.launcher?.close?.();


                        }
                    );


                    container.appendChild(
                        button
                    );

                }
            );


            return true;

        };


    const searchInput =
        HD.appSearch.findInput();


    if (
        searchInput
    ) {

        searchInput.addEventListener(
            "input",
            function () {

                const results =
                    HD.appSearch.search(
                        searchInput.value
                    );


                HD.appSearch.render(
                    results
                );

            }
        );


        searchInput.addEventListener(
            "keydown",
            function (
                event
            ) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    const results =
                        HD.appSearch.search(
                            searchInput.value
                        );


                    if (
                        results[0]
                    ) {

                        HD.launchApp(
                            results[0].id
                        );


                        HD.launcher?.close?.();

                    }

                }

            }
        );

    }


    /* =========================================================
       QUICK ACTIONS
       ========================================================= */

    HD.quickActions =
        HD.quickActions ||
        {};


    HD.quickActions.register =
        function (
            id,
            action
        ) {

            return HD.commandCenter.register(
                "quick:" + id,
                action
            );

        };


    HD.quickActions.run =
        function (
            id,
            payload
        ) {

            return HD.commandCenter.execute(
                "quick:" + id,
                payload
            );

        };


    HD.quickActions.register(
        "launcher",
        function () {

            return HD.launcher?.toggle?.();

        }
    );


    HD.quickActions.register(
        "fullscreen",
        function () {

            return HD.fullscreen?.toggle?.();

        }
    );


    HD.quickActions.register(
        "backup",
        function () {

            return HD.backup?.export?.();

        }
    );


    HD.quickActions.register(
        "voice",
        function () {

            if (
                HD.voice?.listening
            ) {

                return HD.voice.stopListening();

            }


            return HD.voice?.startListening?.();

        }
    );


    /* =========================================================
       GLOBAL QUICK ACTION EVENTS
       ========================================================= */

    HD.eventBridge?.listen(
        "quick-action",
        function (
            detail
        ) {

            if (
                detail?.id
            ) {

                HD.quickActions.run(
                    detail.id,
                    detail.payload
                );

            }

        }
    );


    /* =========================================================
       COMMANDS
       ========================================================= */

    HD.commandCenter.register(
        "open-app",
        function (
            payload
        ) {

            return HD.launchApp(
                payload?.id ||
                payload
            );

        }
    );


    HD.commandCenter.register(
        "open-launcher",
        function () {

            return HD.launcher?.open?.();

        }
    );


    HD.commandCenter.register(
        "close-launcher",
        function () {

            return HD.launcher?.close?.();

        }
    );


    HD.commandCenter.register(
        "toggle-fullscreen",
        function () {

            return HD.fullscreen?.toggle?.();

        }
    );


    HD.commandCenter.register(
        "create-backup",
        function () {

            return HD.backup?.create?.();

        }
    );


    HD.commandCenter.register(
        "export-backup",
        function () {

            return HD.backup?.export?.();

        }
    );


    HD.commandCenter.register(
        "speak",
        function (
            payload
        ) {

            return HD.voice?.speak?.(
                payload?.text ||
                payload ||
                ""
            );

        }
    );


    /* =========================================================
       COMMAND CENTER READY
       ========================================================= */

    HD.commandCenter.ready =
        true;


    HD.boot?.setProgress?.(
        98,
        "command-center"
    );


    HD.eventBridge?.emit(
        "command-center:ready",
        {
            commands:
                this?.commands
                    ? this.commands.size
                    : HD.commandCenter.commands.size
        }
    );


})();

</script>
