    /* =========================================================
       PLANET PANEL BINDINGS
       ========================================================= */

    cosmic.bindPlanetPanel =
        function (
            panel
        ) {

            if (
                panel.__haldoPlanetPanelBound
            ) {

                return;

            }


            this.stylePlanetPanel(
                panel
            );


            const center =
                panel.querySelector(
                    "[data-cosmic-action='center']"
                );


            const follow =
                panel.querySelector(
                    "[data-cosmic-action='follow']"
                );


            const close =
                panel.querySelector(
                    "[data-cosmic-action='close']"
                );


            if (center) {

                center.addEventListener(
                    "click",
                    function () {

                        cosmic.centerCamera();

                        cosmic.setZoom(
                            1
                        );

                    }
                );

            }


            if (follow) {

                follow.addEventListener(
                    "click",
                    function () {

                        const selected =
                            cosmic.interaction.selectedPlanet;


                        if (
                            selected
                        ) {

                            cosmic.followPlanet(
                                selected
                            );

                        }

                    }
                );

            }


            if (close) {

                close.addEventListener(
                    "click",
                    function () {

                        cosmic.hidePlanetPanel();

                    }
                );

            }


            panel.__haldoPlanetPanelBound =
                true;

        };


    /* =========================================================
       SHOW PLANET PANEL
       ========================================================= */

    cosmic.showPlanetPanel =
        function (
            planet
        ) {

            if (
                typeof planet ===
                "string"
            ) {

                planet =
                    this.getPlanet(
                        planet
                    );

            }


            if (!planet) {

                return false;

            }


            const panel =
                this.createPlanetPanel();


            if (!panel) {

                return false;

            }


            const info =
                this.planetary.get(
                    planet.id
                );


            if (!info) {

                return false;

            }


            const data =
                info.data ||
                {};


            const name =
                panel.querySelector(
                    "[data-cosmic-panel='name']"
                );


            const classification =
                panel.querySelector(
                    "[data-cosmic-panel='classification']"
                );


            const description =
                panel.querySelector(
                    "[data-cosmic-panel='description']"
                );


            if (name) {

                name.textContent =
                    info.name ||
                    "Unbekannte Welt";

            }


            if (classification) {

                classification.textContent =
                    data.classification ||
                    info.type ||
                    "Cosmic World";

            }


            if (description) {

                description.textContent =
                    data.description ||
                    "Keine Beschreibung verfügbar.";

            }


            const fields = {

                type:
                    data.composition ||
                    info.type ||
                    "—",

                atmosphere:
                    data.atmosphere ||
                    "—",

                surface:
                    data.surface ||
                    "—",

                climate:
                    data.climate ||
                    "—",

                moons:
                    String(
                        info.moons ??
                        0
                    ),

                rings:
                    info.rings
                        ? "Ja"
                        : "Nein"

            };


            Object.keys(
                fields
            ).forEach(
                function (
                    key
                ) {

                    const element =
                        panel.querySelector(
                            "[data-cosmic-field='" +
                            key +
                            "']"
                        );


                    if (element) {

                        element.textContent =
                            fields[key];

                    }

                }
            );


            const facts =
                panel.querySelector(
                    "[data-cosmic-panel='facts']"
                );


            if (facts) {

                facts.innerHTML = "";


                const list =
                    Array.isArray(
                        data.facts
                    )
                        ? data.facts
                        : [];


                list.forEach(
                    function (
                        fact
                    ) {

                        const item =
                            document.createElement(
                                "div"
                            );

                        item.textContent =
                            "• " +
                            String(
                                fact
                            );

                        facts.appendChild(
                            item
                        );

                    }
                );

            }


            panel.style.display =
                "block";


            this.planetPanel.visible =
                true;


            this.planetary.selected =
                planet.id;


            this.emit(
                "cosmic:planet-panel-open",
                {
                    planet:
                        info
                }
            );


            return true;

        };


    /* =========================================================
       HIDE PLANET PANEL
       ========================================================= */

    cosmic.hidePlanetPanel =
        function () {

            const panel =
                this.planetPanel.element;


            if (
                panel
            ) {

                panel.style.display =
                    "none";

            }


            this.planetPanel.visible =
                false;


            this.emit(
                "cosmic:planet-panel-close"
            );

        };


    /* =========================================================
       PLANET SELECTION EVENT CONNECTION
       ========================================================= */

    if (
        !cosmic._part5SelectionBound
    ) {

        const handleSelection =
            function (
                payload
            ) {

                const planet =
                    payload &&
                    (
                        payload.planet ||
                        payload
                    );


                if (
                    planet &&
                    planet.id
                ) {

                    cosmic.showPlanetPanel(
                        planet
                    );

                }

            };


        if (
            typeof HD.on ===
            "function"
        ) {

            HD.on(
                "cosmic:planet-selected",
                handleSelection
            );

        }


        cosmic._part5SelectionBound =
            true;

    }


    /* =========================================================
       ESCAPE KEY CLOSES PANEL
       ========================================================= */

    if (
        !cosmic._part5EscapeBound
    ) {

        window.addEventListener(
            "keydown",
            function (
                event
            ) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    if (
                        cosmic.planetPanel &&
                        cosmic.planetPanel.visible
                    ) {

                        cosmic.hidePlanetPanel();

                    }

                }

            },
            {
                passive:
                    true
            }
        );


        cosmic._part5EscapeBound =
            true;

    }


    /* =========================================================
       RESPONSIVE PANEL
       ========================================================= */

    if (
        !cosmic._part5ResponsiveBound
    ) {

        const applyResponsive =
            function () {

                const panel =
                    cosmic.planetPanel &&
                    cosmic.planetPanel.element;


                if (!panel) {

                    return;

                }


                if (
                    window.innerWidth <
                    600
                ) {

                    panel.style.left =
                        "12px";

                    panel.style.right =
                        "12px";

                    panel.style.top =
                        "auto";

                    panel.style.bottom =
                        "12px";

                    panel.style.transform =
                        "none";

                    panel.style.width =
                        "auto";

                    panel.style.maxHeight =
                        "65vh";

                }

                else {

                    panel.style.left =
                        "";

                    panel.style.right =
                        "22px";

                    panel.style.top =
                        "50%";

                    panel.style.bottom =
                        "";

                    panel.style.transform =
                        "translateY(-50%)";

                    panel.style.width =
                        "min(340px, calc(100vw - 44px))";

                    panel.style.maxHeight =
                        "min(650px, calc(100vh - 44px))";

                }

            };


        window.addEventListener(
            "resize",
            applyResponsive,
            {
                passive:
                    true
            }
        );


        cosmic._part5ResponsiveBound =
            true;


        if (
            document.readyState !==
            "loading"
        ) {

            setTimeout(
                applyResponsive,
                0
            );

        }

        else {

            document.addEventListener(
                "DOMContentLoaded",
                applyResponsive,
                {
                    once:
                        true
                }
            );

        }

    }


    /* =========================================================
       PLANETARY STATUS
       ========================================================= */

    cosmic.planetary.status =
        function () {

            return {

                version:
                    this.version,

                initialized:
                    this.initialized,

                selected:
                    this.selected,

                planets:
                    cosmic.planets.length,

                statistics:
                    this.statistics()

            };

        };


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    cosmic.planetary.initialized =
        true;


    cosmic.emit(
        "cosmic:planetary-intelligence-ready",
        {
            planets:
                cosmic.planets.length,

            catalog:
                Object.keys(
                    planetaryCatalog
                ).length,

            panel:
                true,

            selection:
                true

        }
    );


    /* =========================================================
       PART 5 READY
       ========================================================= */

    HD.emit(
        "ecosystem:part5-ready",
        {

            cosmic:
                true,

            planetaryIntelligence:
                true,

            planetaryCatalog:
                true,

            planetPanel:
                true,

            selection:
                true,

            statistics:
                true

        }
    );


})();

/* =========================================================
   APP METADATA NORMALIZATION
   ========================================================= */

HD.menu.normalizeApp =
    function (
        app
    ) {

        if (
            !app
        ) {

            return null;

        }


        const manifest =
            app.manifest ||
            app;


        const id =
            app.id ||
            manifest.id;


        if (
            !id
        ) {

            return null;

        }


        return {

            ...app,

            id,

            manifest:
                {

                    ...manifest,

                    id,

                    name:
                        manifest.name ||
                        id,

                    description:
                        manifest.description ||
                        "",

                    icon:
                        manifest.icon ||
                        "○",

                    category:
                        manifest.category ||
                        "system"

                }

        };

    };

/* =========================================================
   LOAD APPS INTO MENU
   ========================================================= */

HD.menu.loadApps =
    function () {

        const sourceApps =
            HD.appFoundation.getApps();


        const normalized =
            Array.isArray(
                sourceApps
            )
                ? sourceApps
                    .map(
                        app =>
                            this.normalizeApp(
                                app
                            )
                    )
                    .filter(
                        Boolean
                    )
                : [];


        this.state.apps =
            normalized;


        return normalized;

    };


/* =========================================================
   CATEGORY BUILDING
   ========================================================= */

HD.menu.getCategories =
    function () {

        const categories =
            new Map();


        categories.set(
            "all",
            "Alle"
        );


        this.state.apps.forEach(
            app => {

                const category =
                    app.manifest.category ||
                    "system";


                if (
                    !categories.has(
                        category
                    )
                ) {

                    categories.set(
                        category,
                        category
                    );

                }

            }
        );


        return Array.from(
            categories.entries()
        );

    };


/* =========================================================
   RENDER CATEGORIES
   ========================================================= */

HD.menu.renderCategories =
    function () {

        const container =
            this.state.categories;


        if (
            !container
        ) {

            return;

        }


        container.innerHTML =
            "";


        this.getCategories()
            .forEach(
                ([id, label]) => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "haldo-menu-category";


                    if (
                        id ===
                        this.state.activeCategory
                    ) {

                        button.classList.add(
                            "is-active"
                        );

                    }


                    button.textContent =
                        label;


                    button.addEventListener(
                        "click",
                        () => {

                            this.state.activeCategory =
                                id;

                            this.render();

                        }
                    );


                    container.appendChild(
                        button
                    );

                }
            );

    };


/* =========================================================
   FILTER APPS
   ========================================================= */

HD.menu.filterApps =
    function () {

        const query =
            String(
                this.state.searchInput
                    ? this.state.searchInput.value
                    : ""
            )
                .trim()
                .toLowerCase();


        const category =
            this.state.activeCategory;


        const result =
            this.state.apps.filter(
                app => {

                    const manifest =
                        app.manifest ||
                        {};


                    const appCategory =
                        manifest.category ||
                        "system";


                    if (
                        category !==
                        "all" &&
                        appCategory !==
                        category
                    ) {

                        return false;

                    }


                    if (
                        !query
                    ) {

                        return true;

                    }


                    const searchable =
                        [
                            app.id,

                            manifest.name,

                            manifest.description,

                            manifest.category

                        ]
                            .filter(
                                Boolean
                            )
                            .join(
                                " "
                            )
                            .toLowerCase();


                    return searchable.includes(
                        query
                    );

                }
            );


        this.state.filteredApps =
            result;


        return result;

    };

            )
        );


        const icon =
            document.createElement(
                "div"
            );


        icon.className =
            "haldo-app-icon";


        icon.textContent =
            manifest.icon ||
            "○";


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "haldo-app-name";


        name.textContent =
            manifest.name ||
            app.id;


        const description =
            document.createElement(
                "div"
            );


        description.className =
            "haldo-app-description";


        description.textContent =
            manifest.description ||
            "";


        card.appendChild(
            icon
        );


        card.appendChild(
            name
        );


        if (
            manifest.description
        ) {

            card.appendChild(
                description
            );

        }

                    "menu:app-selected",
                    {

                        app:
                            app,

                        appId:
                            app.id,

                        opened:
                            opened

                    }
                );


                this.close();

            }
        );


        return card;

    };


/* =========================================================
   RENDER APP GRID
   ========================================================= */

HD.menu.render =
    function () {

        this.create();


        this.loadApps();


        this.renderCategories();


        const apps =
            this.filterApps();


        const grid =
            this.state.grid;


        if (
            !grid
        ) {

            return;

        }


        grid.innerHTML =
            "";


        if (
            apps.length ===
            0
        ) {

            grid.appendChild(
                HD.appUI.empty(
                    "Keine Apps gefunden."
                )
            );


            grid.lastElementChild
                .classList.add(
                    "haldo-menu-empty"
                );


            return;

        }


        apps.forEach(
            app => {

                grid.appendChild(
                    this.createAppCard(
                        app
                    )
                );

            }
        );

    };


/* =========================================================
   OPEN MENU
   ========================================================= */

HD.menu.open =
    function () {

        this.create();


        this.render();


        this.state.open =
            true;


        this.state.element
            .classList.add(
                "is-open"
            );


        document.body.classList.add(
            "haldo-menu-open"
        );


        if (
            this.state.searchInput
        ) {

            window.setTimeout(
                () => {

                    try {

                        this.state.searchInput
                            .focus();

                    }

                    catch (_) {}

                },
                50
            );

        }


        HD.__part6Emit(
            "menu:opened"
        );


        return true;

    };


/* =========================================================
   CLOSE MENU
   ========================================================= */

HD.menu.close =
    function () {

        if (
            !this.state.element
        ) {

            return false;

        }


        this.state.open =
            false;


        this.state.element
            .classList.remove(
                "is-open"
            );


        document.body.classList.remove(
            "haldo-menu-open"
        );


        HD.__part6Emit(
            "menu:closed"
        );


        return true;

    };


/* =========================================================
   TOGGLE MENU
   ========================================================= */

HD.menu.toggle =
    function () {

        if (
            this.state.open
        ) {

            return this.close();

        }


        return this.open();

    };

        );


        const list =
            document.createElement(
                "div"
            );


        list.className =
            "haldo-note-list";


        let selectedId =
            null;


        function renderList() {

            list.innerHTML =
                "";


            const notes =
                HD.contentStore.get(
                    "notes"
                );


            if (
                notes.length ===
                0
            ) {

                list.appendChild(
                    HD.appUI.empty(
                        "Noch keine Notizen vorhanden."
                    )
                );


                return;

            }


            notes
                .slice()
                .sort(
                    (
                        a,
                        b
                    ) =>
                        Number(
                            b.updatedAt ||
                            0
                        ) -
                        Number(
                            a.updatedAt ||
                            0
                        )
                )
                .forEach(
                    note => {

                        const item =
                            document.createElement(
                                "button"
                            );


                        item.type =
                            "button";


                        item.className =
                            "haldo-note-item";


                        item.innerHTML =
`
<strong>
    ${HD.appUI.escape(
        note.title ||
        "Unbenannte Notiz"
    )}
</strong>

<small>
    ${HD.appUI.escape(
        new Date(
            note.updatedAt ||
            Date.now()
        )
            .toLocaleString(
                "de-DE"
            )
    )}
</small>
`;


                        item.addEventListener(
                            "click",
                            () => {

                                selectedId =
                                    note.id;


                                titleInput.value =
                                    note.title ||
                                    "";


                                editor.value =
                                    note.content ||
                                    "";

                            }
                        );


                        list.appendChild(
                            item
                        );

                    }
                );

        }


        function saveNote() {

            const title =
                titleInput.value
                    .trim() ||
                "Unbenannte Notiz";


            const content =
                editor.value;


            if (
                selectedId
            ) {

                HD.contentStore.update(
                    "notes",
                    selectedId,
                    {

                        title:
                            title,

                        content:
                            content

                    }
                );

            }

            else {

                const note =
                    HD.contentStore.add(
                        "notes",
                        {

                            title:
                                title,

                            content:
                                content

                        }
                    );


                if (
                    note
                ) {

                    selectedId =
                        note.id;

                }

            }


            renderList();


            HD.__part6Emit(
                "notes:saved",
                {

                    id:
                        selectedId

                }
            );

        }


        function deleteNote() {

            if (
                !selectedId
            ) {

                return;

            }


            HD.contentStore.remove(
                "notes",
                selectedId
            );


            selectedId =
                null;


            titleInput.value =
                "";


            editor.value =
                "";


            renderList();


            HD.__part6Emit(
                "notes:deleted"
            );

        }


        shell.content.appendChild(
            toolbar
        );


        shell.content.appendChild(
            titleInput
        );


        shell.content.appendChild(
            editor
        );


        shell.content.appendChild(
            list
        );


        renderList();


        return shell.root;

    };

/* =========================================================

   ========================================================= */

HD.menu.ensureLocalApps =
    function () {

        const registered =
            this.state.apps ||
            [];


        const local =
            HD.appFoundation
                .getLocalSystemApps();


        local.forEach(
            localApp => {

                const exists =
                    registered.some(
                        app =>
                            app.id ===
                            localApp.id
                    );


                if (
                    !exists
                ) {

                    registered.push(
                        localApp
                    );

                }

            }
        );


        this.state.apps =
            registered;

    };

   ========================================================= */

if (
    !HD.menu.__part6KeyboardBound
) {

    window.addEventListener(
        "keydown",
        event => {

            const target =
                event.target;


            const isInput =
                target &&
                (
                    target.tagName ===
                    "INPUT" ||
                    target.tagName ===
                    "TEXTAREA" ||
                    target.isContentEditable
                );


            if (
                isInput
            ) {

                return;

            }


            if (
                event.key ===
                "Escape" &&
                HD.menu.state.open
            ) {

                event.preventDefault();

                HD.menu.close();

                return;

            }


            if (
                event.key ===
                "F10"
            ) {

                event.preventDefault();

                HD.menu.toggle();

            }

        },
        {
            passive:
                false
        }
    );


    HD.menu.__part6KeyboardBound =
        true;

}

function(value) {

        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

};

/* =========================================================

   ========================================================= */

HD7.aiChat.open =
function() {

    this.state.open = true;

    this.state.root.classList.add("open");

    this.state.root.setAttribute(
        "aria-hidden",
        "false"
    );

    this.setStatus("bereit");

    requestAnimationFrame(() => {

        if (this.state.input) {
            this.state.input.focus();
        }

        this.scrollToBottom();

    });

    HD7.emit("ai:opened");

    return true;

};

/* =========================================================
   CLOSE
   ========================================================= */

HD7.aiChat.close =
function() {

    if (!this.state.root) {
        return false;
    }

    this.state.open = false;

    this.state.root.classList.remove("open");

    this.state.root.setAttribute(
        "aria-hidden",
        "true"
    );

    HD7.emit("ai:closed");

    return true;

};

/* =========================================================
   TOGGLE
   ========================================================= */

HD7.aiChat.toggle =
function() {

    if (this.state.open) {
        return this.close();
    }

    return this.open();

};

   AUTO RESIZE
   ========================================================= */

HD7.aiChat.autoResize =
function() {

    if (!this.state.input) {
        return;
    }

    this.state.input.style.height = "auto";

    this.state.input.style.height =
        Math.min(
            this.state.input.scrollHeight,
            140
        ) + "px";

};

   STATUS
   ========================================================= */

HD7.aiChat.setStatus =
function(text) {

        this.state.status.textContent =
            String(text || "bereit");

    }

   ADD MESSAGE
   ========================================================= */

HD7.aiChat.addMessage =
function(role, text) {

    const cleanText =
        String(text ?? "");

    this.state.messages.push({

        role,

        text: cleanText,

        timestamp: Date.now()

    });

    const empty =
        this.state.root?.querySelector(
            "[data-ai-empty]"
        );

    if (empty) {
        empty.remove();
    }

    const row =
        document.createElement("div");

    row.className =
        "haldo-ai-message " +
        (
            role === "user"
                ? "user"
                : "assistant"
        );

    if (role === "user") {

        row.innerHTML = `

            <div class="haldo-ai-message-bubble">
                ${this.escape(cleanText)}
            </div>

        `;

    }

    else {

        row.innerHTML = `

            <div class="haldo-ai-message-avatar">

                <img
                    src="logo.png"
                    alt="HalDo"
                >

            </div>

            <div class="haldo-ai-message-bubble">
                ${this.escape(cleanText)}
            </div>

        `;

    }

    this.state.messagesElement.appendChild(row);

    this.scrollToBottom();

    HD7.emit(
        "ai:message",
        {
            role,
            text: cleanText
        }
    );

    return row;

};

/* =========================================================
   SCROLL
   ========================================================= */

HD7.aiChat.scrollToBottom =
function() {

    if (!this.state.messagesElement) {
        return;
    }

    requestAnimationFrame(() => {

        this.state.messagesElement.scrollTop =
            this.state.messagesElement.scrollHeight;

    });

};

   ========================================================= */

HD7.aiChat.showTyping =
function() {

                <span></span>

    this.state.messagesElement.appendChild(row);

    this.state.typingElement = row;

    this.scrollToBottom();

   HIDE TYPING
   ========================================================= */

HD7.aiChat.hideTyping =
function() {

    if (this.state.typingElement) {

        this.state.typingElement.remove();

        this.state.typingElement = null;

    }

/* =========================================================
   LOCAL FALLBACK
   ========================================================= */

HD7.aiChat.localResponse =
function(message) {

    const text =
        String(message || "")
            .trim()
            .toLowerCase();

    if (!text) {

        return (
            "Schreib mir einfach etwas. " +
            "Ich bin hier. 💙❤️"
        );

    }

    if (
        text.includes("hallo") ||
        text.includes("hi haldo") ||
        text.includes("hey haldo")
    ) {

        return (
            "Hallo 💙❤️ Ich bin HalDo AI. " +
            "Schön, dass du da bist. " +
            "Wie kann ich dir helfen?"
        );

    }

    if (
        text.includes("wer bist du") ||
        text.includes("was bist du")
    ) {

        return (
            "Ich bin HalDo AI – die zentrale " +
            "künstliche Intelligenz deiner " +
            "HalDo-Welt. 💙❤️🚀"
        );

    }

    if (text.includes("danke")) {

        return (
            "Sehr gerne, Bruder. 💙❤️🚀"
        );

    }

    if (
        text.includes("menü") ||
        text.includes("menu")
    ) {

        return (
            "Öffne das Hauptmenü. " +
            "Dort findest du Apps, AI und " +
            "Systemfunktionen."
        );

    }

    if (text.includes("einstellungen")) {

        return (
            "Die Einstellungen können über " +
            "das Hauptmenü geöffnet werden. " +
            "Dort lassen sich die HalDo-System-" +
            "und Cosmic-World-Funktionen konfigurieren."
        );

    }

    return (
        "Ich habe deine Nachricht erhalten. 💙❤️ " +
        "Die Nachricht wird an die vorhandene " +
        "HalDo-AI-Engine weitergereicht."
    );

};

                HD7.ai ||
                HD7.aiCore ||
                HD7.aiEngine ||
                HD7;

            const result =
                await candidate.call(
                    owner,
                    message
                );

            if (
                typeof result === "string" &&
                result.trim()
            ) {

                return result;

            }

            if (
                result &&
                typeof result.text === "string" &&
                result.text.trim()
            ) {

                return result.text;

            }

        }

        catch(error) {

            console.warn(

                error
            );

        }

    }

    return this.localResponse(message);

   SEND MESSAGE
   ========================================================= */

HD7.aiChat.send =
async function() {

    if (this.state.processing) {
        return;
    }

    if (!this.state.input) {
        this.create();
    }

    const message =
        String(
            this.state.input.value || ""
        ).trim();

    if (!message) {
        return;
    }

    this.state.input.value = "";

    this.autoResize();

    this.addMessage("user", message);

    this.state.processing = true;

    if (this.state.sendButton) {
        this.state.sendButton.disabled = true;
    }

    this.setStatus("denkt …");

    this.showTyping();

    try {

        const response =
            await this.generateResponse(message);

        this.hideTyping();

        this.addMessage(
            "assistant",
            response
        );

        this.setStatus("bereit");

    }

    catch(error) {

        this.hideTyping();

        console.error(
            "[HalDo AI] Chat error:",
            error
        );

        this.addMessage(
            "assistant",
            "Beim Verarbeiten der Nachricht ist ein Fehler aufgetreten."
        );

            "ai:error",
            error
        );

    }

    finally {

        this.state.processing = false;

        if (this.state.sendButton) {
            this.state.sendButton.disabled = false;
        }

                0

/* =========================================================
   CREATE PLANETS
   ========================================================= */

HD8.world.createPlanets =
    function() {

        const requested =
            Number(
                this.state.settings
                    .planetCount
            ) ||
            this.constants.minimumPlanets;


        const count =
            this.clamp(
                requested,
                this.constants.minimumPlanets,
                this.constants.maximumPlanets
            );


        const definitions =
            this.planetDefinitions
                .slice(
                    0,
                    Math.max(
                        count,
                        this.constants.minimumPlanets
                    )
                );


        this.state.planets =
            [];


        definitions.forEach(
            (
                definition,
                index
            ) => {

                this.state.planets.push(
                    {

                        ...definition,

                        angle:
                            (
                                index /
                                definitions.length
                            ) *
                            Math.PI *
                            2,

                        rotationAngle:
                            Math.random() *
                            Math.PI *
                            2,

                        phase:
                            Math.random() *
                            Math.PI *
                            2,

                        wobble:
                            this.random(
                                .92,
                                1.08
                            )

                    }
                );

            }
        );

    };

/* =========================================================
   SKY COLOR
   ========================================================= */

HD8.world.getSky =
    function(
        time
    ) {

        const mode =
            this.state.settings
                .skyMode;


        if (
            mode ===
            "night"
        ) {

            return {

                top:
                    "#01030d",

                middle:
                    "#07132d",

                bottom:
                    "#020617"

            };

        }


        if (
            mode ===
            "day"
        ) {

            return {

                top:
                    "#082b62",

                middle:
                    "#06315d",

                bottom:
                    "#02091c"

            };

        }


        const cycle =
            (
                time %
                86400000
            ) /
            86400000;


        const wave =
            (
                Math.sin(
                    cycle *
                    Math.PI *
                    2
                ) +
                1
            ) /
            2;


        if (
            wave >
            .78
        ) {

            return {

                top:
                    "#174b83",

                middle:
                    "#123c70",

                bottom:
                    "#06152f"

            };

        }


        if (
            wave >
            .48
        ) {

            return {

                top:
                    "#0b2f62",

                middle:
                    "#071c45",

                bottom:
                    "#020a20"

            };

        }


        return {

            top:
                "#020718",

            middle:
                "#050d25",

            bottom:
                "#01030d"

        };

    };


/* =========================================================
   DRAW SKY
   ========================================================= */

HD8.world.drawSky =
    function(
        time
    ) {

        const ctx =
            this.state.context;


        if (
            !ctx
        ) {

            return;

        }


        const width =
            this.state.width;


        const height =
            this.state.height;


        const sky =
            this.getSky(
                time
            );


        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                0,
                height
            );


        gradient.addColorStop(
            0,
            sky.top
        );


        gradient.addColorStop(
            .48,
            sky.middle
        );


        gradient.addColorStop(
            1,
            sky.bottom
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        /* Soft atmospheric color zones */

        const atmosphere =
            ctx.createRadialGradient(
                width * .18,
                height * .15,
                0,
                width * .18,
                height * .15,
                width * .7
            );


        atmosphere.addColorStop(
            0,
            "rgba(70,130,255,.10)"
        );


        atmosphere.addColorStop(
            .45,
            "rgba(60,80,210,.045)"
        );


        atmosphere.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            atmosphere;


        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    };


/* =========================================================
   DRAW STARS
   ========================================================= */

HD8.world.drawStars =
    function(
        time
    ) {

        if (
            !this.state.settings
                .stars
        ) {

            return;

        }


        const ctx =
            this.state.context;


        if (
            !ctx
        ) {

            return;

        }


        const width =
            this.state.width;


        const height =
            this.state.height;


        const centerX =
            width *
            .5;


        const centerY =
            height *
            .47;


        const radius =
            Math.max(
                width,
                height
            ) *
            .78;


        this.state.stars.forEach(
            star => {

                const movement =
                    time *
                    .0000015 *
                    star.depth;


                const angle =
                    star.angle +
                    movement;


                const distance =
                    star.distance *
                    radius;


                const x =
                    centerX +
                    Math.cos(
                        angle
                    ) *
                    distance;


                const y =
                    centerY +
                    Math.sin(
                        angle
                    ) *
                    distance *
                    .60;


                if (
                    x <
                        -8 ||
                    x >
                        width + 8 ||
                    y <
                        -8 ||
                    y >
                        height + 8
                ) {

                    return;

                }


                let pulse =
                    .72;


                if (
                    this.state.settings
                        .starLight
                ) {

                    pulse =
                        .62 +
                        .38 *
                        (
                            (
                                Math.sin(
                                    time *
                                    .001 *
                                    star.twinkle +
                                    star.phase
                                ) +
                                1
                            ) /
                            2
                        );

                }


                const alpha =
                    this.clamp(
                        star.alpha *
                        pulse,
                        .05,
                        1
                    );


                const color =
                    star.color;


                /* Larger stars receive a tiny glow */

                if (
                    star.size >
                    1.25
                ) {

                    const glow =
                        ctx.createRadialGradient(
                            x,
                            y,
                            0,
                            x,
                            y,
                            star.size *
                            5
                        );


                    glow.addColorStop(
                        0,
                        `rgba(
                            ${color.r},
                            ${color.g},
                            ${color.b},
                            ${alpha * .22}
                        )`
                    );


                    glow.addColorStop(
                        1,
                        "rgba(0,0,0,0)"
                    );


                    ctx.fillStyle =
                        glow;


                    ctx.beginPath();


                    ctx.arc(
                        x,
                        y,
                        star.size *
                        5,
                        0,
                        Math.PI *
                        2
                    );


                    ctx.fill();

                }


                ctx.beginPath();


                ctx.arc(
                    x,
                    y,
                    star.size,
                    0,
                    Math.PI *
                    2
                );


                ctx.fillStyle =
                    `rgba(
                        ${color.r},
                        ${color.g},
                        ${color.b},
                        ${alpha}
                    )`;


                ctx.fill();

            }
        );

    };

        ) *

    };


/* =========================================================
   DRAW SUN GLOW
   ========================================================= */

HD8.world.drawSunGlow =
    function(
        centerX,
        centerY,
        radius,
        time
    ) {

        if (
            !this.state.settings
                .glow
        ) {

            return;

        }


        const ctx =
            this.state.context;


        const pulse =
            1 +
            Math.sin(
                time *
                .0015
            ) *
            .035;


        const gradient =
            ctx.createRadialGradient(
                centerX,
                centerY,
                radius *
                .08,
                centerX,
                centerY,
                radius *
                5.8
            );


        gradient.addColorStop(
            0,
            "rgba(255,255,225,.80)"
        );


        gradient.addColorStop(
            .12,
            "rgba(255,235,155,.58)"
        );


        gradient.addColorStop(
            .30,
            "rgba(255,196,70,.27)"
        );


        gradient.addColorStop(
            .56,
            "rgba(255,145,35,.09)"
        );


        gradient.addColorStop(
            1,
            "rgba(255,100,20,0)"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.arc(
            centerX,
            centerY,
            radius *
            5.8 *
            pulse,
            0,
            Math.PI *
            2
        );


        ctx.fill();

    };


/* =========================================================
   DRAW SUN RAYS
   ========================================================= */

HD8.world.drawSunRays =
    function(
        centerX,
        centerY,
        radius,
        time
    ) {

        if (
            !this.state.settings
                .sunRays
        ) {

            return;

        }


        const ctx =
            this.state.context;


        const rayCount =
            72;


        ctx.save();


        ctx.translate(
            centerX,
            centerY
        );


        ctx.rotate(
            time *
            .000035
        );


        for (
            let index = 0;
            index < rayCount;
            index += 1
        ) {

            const angle =
                (
                    index /
                    rayCount
                ) *
                Math.PI *
                2;


            const wave =
                (
                    Math.sin(
                        time *
                        .0012 +
                        index *
                        .71
                    ) +
                    1
                ) /
                2;


            const inner =
                radius *
                (
                    1.04 +
                    wave *
                    .06
                );


            const outer =
                radius *
                (
                    1.35 +
                    wave *
                    .28
                );


            const width =
                .6 +
                wave *
                1.4;


            ctx.beginPath();


            ctx.moveTo(
                Math.cos(
                    angle
                ) *
                inner,

                Math.sin(
                    angle
                ) *
                inner
            );


            ctx.lineTo(
                Math.cos(
                    angle
                ) *
                outer,

                Math.sin(
                    angle
                ) *
                outer
            );


            ctx.strokeStyle =
                `rgba(
                    255,
                    222,
                    135,
                    ${.08 + wave * .20}
                )`;


            ctx.lineWidth =
                width;


            ctx.stroke();

        }


        ctx.restore();

    };


/* =========================================================
   DRAW SUN
   ========================================================= */

HD8.world.drawSun =
    function(
        time
    ) {

        if (
            !this.state.settings
                .sun
        ) {

            return;

        }


        const ctx =
            this.state.context;


        if (
            !ctx
        ) {

            return;

        }


        const position =
            this.getSunPosition();


        const radius =
            this.getSunRadius();


        this.drawSunGlow(
            position.x,
            position.y,
            radius,
            time
        );


        this.drawSunRays(
            position.x,
            position.y,
            radius,
            time
        );


        /* Corona */

        const corona =
            ctx.createRadialGradient(
                position.x -
                radius *
                .20,

                position.y -
                radius *
                .25,

                radius *
                .05,

                position.x,
                position.y,
                radius *
                1.3
            );


        corona.addColorStop(
            0,
            "#fffef0"
        );


        corona.addColorStop(
            .25,
            "#fff1b0"
        );


        corona.addColorStop(
            .55,
            "#ffd05e"
        );


        corona.addColorStop(
            .82,
            "#ff9d2e"
        );


        corona.addColorStop(
            1,
            "#d95b18"
        );


        ctx.fillStyle =
            corona;


        ctx.beginPath();


        ctx.arc(
            position.x,
            position.y,
            radius,
            0,
            Math.PI *
            2
        );


        ctx.fill();


        /* Living surface shimmer */

        ctx.save();


        ctx.beginPath();


        ctx.arc(
            position.x,
            position.y,
            radius *
            .94,
            0,
            Math.PI *
            2
        );


        ctx.clip();


        for (
            let index = 0;
            index < 18;
            index += 1
        ) {

            const angle =
                time *
                .00008 *
                (
                    index %
                    2 ===
                    0
                        ? 1
                        : -1
                ) +
                index;


            const x =
                position.x +
                Math.cos(
                    angle
                ) *
                radius *
                .58;


            const y =
                position.y +
                Math.sin(
                    angle *
                    1.7
                ) *
                radius *
                .62;


            const flare =
                ctx.createRadialGradient(
                    x,
                    y,
                    0,
                    x,
                    y,
                    radius *
                    .20
                );


            flare.addColorStop(
                0,
                "rgba(255,255,225,.22)"
            );


            flare.addColorStop(
                1,
                "rgba(255,180,50,0)"
            );


            ctx.fillStyle =
                flare;


            ctx.beginPath();


            ctx.arc(
                x,
                y,
                radius *
                .20,
                0,
                Math.PI *
                2
            );


            ctx.fill();

        }


        ctx.restore();

    };


/* =========================================================
   PLANET ORBIT POSITION
   ========================================================= */

HD8.world.getPlanetPosition =
    function(
        planet
    ) {

        const center =
            this.getSunPosition();


        const baseRadius =
            Math.max(
                this.state.width,
                this.state.height
            ) *
            this.constants.planetOrbitFactor;


        const orbitRadius =
            baseRadius *
            planet.orbit;


        const eccentric =
            1 +
            Math.sin(
                planet.phase
            ) *
            .035;


        return {

            x:
                center.x +
                Math.cos(
                    planet.angle
                ) *
                orbitRadius *
                eccentric,

            y:
                center.y +
                Math.sin(
                    planet.angle
                ) *
                orbitRadius *
                .58 *
                eccentric

        };

    };


/* =========================================================
   DRAW ORBITS
   ========================================================= */

HD8.world.drawOrbits =
    function() {

        if (
            !this.state.settings
                .orbits ||
            !this.state.settings
                .planets
        ) {

            return;

        }


        const ctx =
            this.state.context;


        const center =
            this.getSunPosition();


        const baseRadius =
            Math.max(
                this.state.width,
                this.state.height
            ) *
            this.constants.planetOrbitFactor;


        this.state.planets.forEach(
            planet => {

                const radius =
                    baseRadius *
                    planet.orbit;


                ctx.beginPath();


                ctx.ellipse(
                    center.x,
                    center.y,
                    radius,
                    radius *
                    .58,
                    0,
                    0,
                    Math.PI *
                    2
                );


                ctx.strokeStyle =
                    "rgba(160,205,255,.105)";


                ctx.lineWidth =
                    1;


                ctx.stroke();

            }
        );

    };


/* =========================================================
   PLANET GRADIENT
   ========================================================= */

HD8.world.createPlanetGradient =
    function(
        planet,
        x,
        y,
        size
    ) {

        const ctx =
            this.state.context;


        const lightX =
            x -
            size *
            .38;


        const lightY =
            y -
            size *
            .40;


        const gradient =
            ctx.createRadialGradient(
                lightX,
                lightY,
                .2,
                x,
                y,
                size *
                1.35
            );


        gradient.addColorStop(
            0,
            planet.color
        );


        gradient.addColorStop(
            .42,
            planet.color
        );


        gradient.addColorStop(
            .76,
            planet.secondary
        );


        gradient.addColorStop(
            1,
            "rgba(0,0,0,.78)"
        );


        return gradient;

    };


/* =========================================================
   DRAW EARTH DETAILS
   ========================================================= */

HD8.world.drawEarthDetails =
    function(
        x,
        y,
        size,
        rotation
    ) {

        const ctx =
            this.state.context;


        ctx.save();


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            size *
            .96,
            0,
            Math.PI *
            2
        );


        ctx.clip();


        /* Ocean */

        ctx.fillStyle =
            "#2777d7";


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI *
            2
        );


        ctx.fill();


        /* Continents */

        const continents =
            [

                [
                    -.30,
                    -.12,
                    .27,
                    .20
                ],

                [
                    .20,
                    -.30,
                    .34,
                    .17
                ],

                [
                    .34,
                    .15,
                    .22,
                    .30
                ],

                [
                    -.20,
                    .32,
                    .18,
                    .25
                ]

            ];


        continents.forEach(
            continent => {

                const cx =
                    x +
                    continent[0] *
                    size +
                    Math.sin(
                        rotation
                    ) *
                    size *
                    .06;


                const cy =
                    y +
                    continent[1] *
                    size;


                ctx.fillStyle =
                    "#42b866";


                ctx.beginPath();


                ctx.ellipse(
                    cx,
                    cy,
                    continent[2] *
                    size,
                    continent[3] *
                    size,
                    rotation,
                    0,
                    Math.PI *
                    2
                );


                ctx.fill();

            }
        );


        /* Clouds */

        ctx.globalAlpha =
            .24;


        ctx.fillStyle =
            "#ffffff";


        for (
            let index = 0;
            index < 5;
            index += 1
        ) {

            const cx =
                x +
                Math.cos(
                    rotation +
                    index
                ) *
                size *
                .58;


            const cy =
                y +
                Math.sin(
                    rotation *
                    1.2 +
                    index
                ) *
                size *
                .46;


            ctx.beginPath();


            ctx.ellipse(
                cx,
                cy,
                size *
                .20,
                size *
                .055,
                rotation,
                0,
                Math.PI *
                2
            );


            ctx.fill();

        }


        ctx.restore();

        ctx.globalAlpha =
            1;

    };


/* =========================================================
   DRAW PLANET RINGS
   ========================================================= */

HD8.world.drawPlanetRings =
    function(
        planet,
        x,
        y,
        size
    ) {

        if (
            !planet.rings
        ) {

            return;

        }


        const ctx =
            this.state.context;


        ctx.save();


        ctx.translate(
            x,
            y
        );


        ctx.rotate(
            planet.tilt
        );


        ctx.beginPath();


        ctx.ellipse(
            0,
            0,
            size *
            1.75,
            size *
            .48,
            0,
            0,
            Math.PI *
            2
        );


        ctx.strokeStyle =
            "rgba(236,210,155,.55)";


        ctx.lineWidth =
            1.7;


        ctx.stroke();


        ctx.beginPath();


        ctx.ellipse(
            0,
            0,
            size *
            1.42,
            size *
            .36,
            0,
            0,
            Math.PI *
            2
        );


        ctx.strokeStyle =
            "rgba(180,145,105,.42)";


        ctx.lineWidth =
            1;


        ctx.stroke();


        ctx.restore();

    };


/* =========================================================
   DRAW MOON
   ========================================================= */

HD8.world.drawMoon =
    function(
        moon,
        parentX,
        parentY,
        parentSize,
        parentRotation
    ) {

        moon.angle +=
            moon.speed *
            this.state.settings
                .rotationSpeed *
            moon.direction *
            16;


        const orbitRadius =
            Math.max(
                parentSize *
                2.6,
                Math.min(
                    this.state.width,
                    this.state.height
                ) *
                moon.orbit
            );


        const x =
            parentX +
            Math.cos(
                moon.angle
            ) *
            orbitRadius;


        const y =
            parentY +
            Math.sin(
                moon.angle
            ) *
            orbitRadius *
            .58;


        const size =
            moon.size;


        const gradient =
            this.createPlanetGradient(
                moon,
                x,
                y,
                size
            );


        this.state.context.fillStyle =
            gradient;


        this.state.context.beginPath();


        this.state.context.arc(
            x,
            y,
            size,
            0,
            Math.PI *
            2
        );


        this.state.context.fill();


        /* Moon shadow detail */

        this.state.context.globalAlpha =
            .20;


        this.state.context.fillStyle =
            "#383838";


        this.state.context.beginPath();


        this.state.context.arc(
            x +
            size *
            .28,

            y +
            size *
            .10,

            size *
            .28,

            0,
            Math.PI *
            2
        );


        this.state.context.fill();


        this.state.context.globalAlpha =
            1;


        return {

            x,

            y,

            size

        };

    };


/* =========================================================
   DRAW PLANET GLOW
   ========================================================= */

HD8.world.drawPlanetGlow =
    function(
        planet,
        x,
        y,
        size
    ) {

        if (
            !this.state.settings
                .glow
        ) {

            return;

        }


        if (
            planet.glow <=
            0
        ) {

            return;

        }


        const ctx =
            this.state.context;


        const gradient =
            ctx.createRadialGradient(
                x,
                y,
                size *
                .25,
                x,
                y,
                size *
                3.5
            );


        gradient.addColorStop(
            0,
            `rgba(
                160,
                205,
                255,
                ${planet.glow * .20}
            )`
        );


        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            size *
            3.5,
            0,
            Math.PI *
            2
        );


        ctx.fill();

    };


/* =========================================================
   DRAW PLANET
   ========================================================= */

HD8.world.drawPlanet =
    function(
        planet,
        index,
        delta
    ) {

        planet.angle +=
            planet.speed *
            planet.direction *
            this.state.settings
                .rotationSpeed *
            delta;


        planet.rotationAngle +=
            planet.rotation *
            planet.direction *
            this.state.settings
                .rotationSpeed *
            delta;


        const position =
            this.getPlanetPosition(
                planet
            );


        const sizeScale =
            Math.min(
                this.state.width,
                this.state.height
            ) /
            800;


        const size =
            Math.max(
                2.3,
                planet.size *
                Math.max(
                    .72,
                    sizeScale
                )
            );


        this.drawPlanetGlow(
            planet,
            position.x,
            position.y,
            size
        );


        if (
            planet.rings
        ) {

            this.drawPlanetRings(
                planet,
                position.x,
                position.y,
                size
            );

        }


        const gradient =
            this.createPlanetGradient(
                planet,
                position.x,
                position.y,
                size
            );


        const ctx =
            this.state.context;


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.arc(
            position.x,
            position.y,
            size,
            0,
            Math.PI *
            2
        );


        ctx.fill();


        if (
            planet.type ===
            "earth"
        ) {

            this.drawEarthDetails(
                position.x,
                position.y,
                size,
                planet.rotationAngle
            );

        }


        /* Atmosphere */

        if (
            planet.glow >
            .25
        ) {

            ctx.beginPath();


            ctx.arc(
                position.x,
                position.y,
                size *
                1.12,
                0,
                Math.PI *
                2
            );


            ctx.strokeStyle =
                `rgba(
                    130,
                    205,
                    255,
                    ${planet.glow * .22}
                )`;


            ctx.lineWidth =
                .7;


            ctx.stroke();

        }


        /* Planet moons */

        if (
            Array.isArray(
                planet.moons
            )
        ) {

            planet.moons.forEach(
                moon => {

                    this.drawMoon(
                        moon,
                        position.x,
                        position.y,
                        size,
                        planet.rotationAngle
                    );

                }
            );

        }


        return {

            x:
                position.x,

            y:
                position.y,

            size

        };

    };


/* =========================================================
   DRAW PLANETS
   ========================================================= */

HD8.world.drawPlanets =
    function(
        delta
    ) {

        if (
            !this.state.settings
                .planets
        ) {

        this.drawOrbits();


        this.state.planets.forEach(
            (
                planet,
                index
            ) => {

                this.drawPlanet(
                    planet,
                    index,
                    delta
                );

            }
        );

    };


/* =========================================================

HD8.world.findLogoSource =
    function() {

        const candidates =
            [

                window.HalDoLogoSrc,

                window.HalDo?.config
                    ?.logo,

                window.HalDo?.config
                    ?.logoSrc,

                "assets/HalDo-Logo.png",

                "assets/HalDo-Logo.jpg",

                "assets/HalDo-Logo.webp",

                "assets/HalDo-Logo.svg",

                "assets/HalDo AI Logo.png",

                "HalDo-Logo.png",

                "HalDo AI Logo.png",

                "./assets/logo.png",

                "./logo.png"

            ];


        for (
            const source of
            candidates
        ) {

            if (
                typeof source ===
                "string" &&
                source.trim()
            ) {

                return source;

            }

        }


        const existing =
            document.querySelector(
                'img[alt*="HalDo" i], img[src*="HalDo" i], img[src*="haldo" i]'
            );


        if (
            existing?.src
        ) {

            return existing.src;

        }


        return null;

    };


/* =========================================================
   CREATE LOGO LAYER
   ========================================================= */

HD8.world.prepareLogoLayer =
    function() {

        const layer =
            this.state.logoLayer;


        if (
            !layer
        ) {

            return;

        }


        layer.innerHTML =
            "";


        const source =
            this.findLogoSource();


        if (
            source
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                source;


            image.alt =
                "HalDo";


            image.draggable =
                false;


            image.addEventListener(
                "error",
                () => {

                    layer.innerHTML =
                        "";


                    const placeholder =
                        document.createElement(
                            "div"
                        );


                    placeholder.className =
                        "haldo-world-logo-placeholder";


                    placeholder.textContent =
                        "HD";


                    layer.appendChild(
                        placeholder
                    );

                },
                {
                    once:
                        true
                }
            );


            layer.appendChild(
                image
            );

        }

        else {

            const placeholder =
                document.createElement(
                    "div"
                );


            placeholder.className =
                "haldo-world-logo-placeholder";


            placeholder.textContent =
                "HD";


            layer.appendChild(
                placeholder
            );

        }
