<!DOCTYPE html>
<html lang="de" dir="ltr">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="theme-color" content="#07142b">

<meta name="description"
      content="HalDo AI OS 20 – Cosmic AI Operating System">

<meta name="application-name"
      content="HalDo AI OS">

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/png"
      href="./assets/logo/logo.png">

<link rel="apple-touch-icon"
      href="./assets/logo/logo.png">

<link rel="stylesheet"
      href="./css/haldo-logo-engine.css">


<style>

/* =========================================================
   HALDO AI OS 20
   CENTRAL COSMIC SHELL
   LAYOUT BEIBEHALTEN
   COSMIC DISPLAY ERWEITERT
   ========================================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    background:
        #07142b;

    color: #ffffff;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    min-height: 100dvh;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}


/* =========================================================
   ROOT
   ========================================================= */

#haldo-os {
    position: fixed;
    inset: 0;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 50%,
            rgba(255,185,55,.17) 0%,
            rgba(40,85,190,.13) 18%,
            rgba(16,43,110,.18) 38%,
            rgba(7,20,55,.55) 65%,
            #020817 100%
        );
}


/* =========================================================
   COSMIC WORLD
   ========================================================= */

#cosmic-world {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;

    background:

        radial-gradient(
            ellipse at 50% 50%,
            rgba(255,215,100,.16),
            transparent 17%
        ),

        radial-gradient(
            ellipse at 15% 25%,
            rgba(85,155,255,.18),
            transparent 30%
        ),

        radial-gradient(
            ellipse at 85% 70%,
            rgba(155,75,255,.15),
            transparent 28%
        ),

        radial-gradient(
            ellipse at 72% 18%,
            rgba(40,220,210,.11),
            transparent 25%
        ),

        radial-gradient(
            ellipse at 30% 82%,
            rgba(255,90,130,.10),
            transparent 28%
        );
}


/* =========================================================
   COSMIC NEBULA
   ========================================================= */

#cosmic-sky {
    position: absolute;
    inset: -15%;

    background:

        radial-gradient(
            ellipse at 20% 30%,
            rgba(75,145,255,.14),
            transparent 28%
        ),

        radial-gradient(
            ellipse at 80% 35%,
            rgba(130,70,255,.13),
            transparent 27%
        ),

        radial-gradient(
            ellipse at 45% 75%,
            rgba(20,200,210,.10),
            transparent 30%
        ),

        radial-gradient(
            ellipse at 65% 65%,
            rgba(255,120,70,.07),
            transparent 24%
        );

    filter:
        blur(20px);

    animation:
        cosmic-nebula
        35s
        ease-in-out
        infinite alternate;
}


/* =========================================================
   STARS
   ========================================================= */

#cosmic-stars {
    position: absolute;
    inset: 0;

    opacity: .95;

    background-image:

        radial-gradient(
            circle at 5% 10%,
            rgba(255,255,255,.95) 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 12% 42%,
            rgba(125,205,255,.9) 0 1.5px,
            transparent 3px
        ),

        radial-gradient(
            circle at 21% 17%,
            rgba(255,235,160,.9) 0 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 34% 73%,
            rgba(210,190,255,.85) 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 47% 12%,
            rgba(255,255,255,.9) 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 58% 31%,
            rgba(120,220,255,.9) 0 1.5px,
            transparent 3px
        ),

        radial-gradient(
            circle at 71% 14%,
            rgba(255,220,150,.95) 0 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 83% 47%,
            rgba(190,170,255,.9) 0 1.5px,
            transparent 3px
        ),

        radial-gradient(
            circle at 91% 75%,
            rgba(255,255,255,.9) 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 29% 91%,
            rgba(110,210,255,.85) 0 1.5px,
            transparent 3px
        );

    background-size:
        260px 260px,
        330px 330px,
        410px 410px,
        290px 290px,
        370px 370px,
        440px 440px,
        510px 510px,
        390px 390px,
        310px 310px,
        470px 470px;

    animation:
        star-drift
        55s
        linear
        infinite;
}


/* =========================================================
   LARGE STARS
   ========================================================= */

#cosmic-world::after {
    content: "";

    position: absolute;
    inset: 0;

    background:

        radial-gradient(
            circle at 15% 72%,
            rgba(255,255,255,.95) 0 2px,
            transparent 4px
        ),

        radial-gradient(
            circle at 78% 22%,
            rgba(130,210,255,.95) 0 2px,
            transparent 4px
        ),

        radial-gradient(
            circle at 65% 88%,
            rgba(255,210,130,.9) 0 2px,
            transparent 4px
        ),

        radial-gradient(
            circle at 42% 24%,
            rgba(205,180,255,.9) 0 2px,
            transparent 4px
        );

    opacity: .8;

    animation:
        star-pulse
        5s
        ease-in-out
        infinite alternate;
}


/* =========================================================
   SUN GLOW
   ========================================================= */

#haldo-sun {
    position: absolute;

    left: 50%;
    top: 50%;

    width:
        clamp(115px,18vw,235px);

    height:
        clamp(115px,18vw,235px);

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 38% 35%,
            #ffffff 0%,
            #fffce0 8%,
            #fff0a0 19%,
            #ffc83d 35%,
            #ff8a21 52%,
            #ff4c24 67%,
            rgba(255,80,30,.18) 76%,
            transparent 78%
        );

    box-shadow:

        0 0 18px
        rgba(255,244,170,.95),

        0 0 45px
        rgba(255,205,80,.9),

        0 0 90px
        rgba(255,155,35,.75),

        0 0 160px
        rgba(255,100,35,.5),

        0 0 260px
        rgba(255,80,30,.28);

    z-index: 3;

    animation:
        sun-breathe
        7s
        ease-in-out
        infinite;
}


/* =========================================================
   SUN RAYS
   ========================================================= */

#haldo-sun::before,
#haldo-sun::after {
    content: "";

    position: absolute;

    inset: -55%;

    border-radius: 50%;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(255,220,100,.16),
            transparent 12%,
            rgba(255,170,60,.13),
            transparent 25%,
            rgba(255,230,120,.14),
            transparent 42%,
            rgba(255,150,50,.13),
            transparent 60%,
            rgba(255,220,120,.15),
            transparent
        );

    filter:
        blur(7px);

    animation:
        solar-rays
        25s
        linear
        infinite;
}

#haldo-sun::after {
    animation-direction:
        reverse;

    animation-duration:
        39s;

    opacity: .7;
}


/* =========================================================
   ORBITS
   ========================================================= */

.haldo-orbit {
    position: absolute;

    left: 50%;
    top: 50%;

    border:
        1px solid
        rgba(130,200,255,.22);

    border-radius: 50%;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 18px
        rgba(80,150,255,.08);

    pointer-events: none;
}

.orbit-1 {
    width: 23vw;
    height: 10vw;

    min-width: 180px;
    min-height: 95px;

    transform:
        translate(-50%,-50%)
        rotate(-18deg);
}

.orbit-2 {
    width: 37vw;
    height: 17vw;

    min-width: 270px;
    min-height: 135px;

    transform:
        translate(-50%,-50%)
        rotate(29deg);
}

.orbit-3 {
    width: 53vw;
    height: 26vw;

    min-width: 360px;
    min-height: 190px;

    transform:
        translate(-50%,-50%)
        rotate(-39deg);
}

.orbit-4 {
    width: 72vw;
    height: 38vw;

    min-width: 490px;
    min-height: 260px;

    transform:
        translate(-50%,-50%)
        rotate(15deg);
}


/* =========================================================
   PLANETS
   ========================================================= */

.haldo-planet {
    position: absolute;

    border-radius: 50%;

    box-shadow:
        inset -14px -12px 20px rgba(0,0,0,.55),
        0 0 20px rgba(100,180,255,.35);

    z-index: 4;
}

.planet-1 {
    width: 18px;
    height: 18px;

    left: 24%;
    top: 43%;

    background:
        radial-gradient(
            circle at 32% 28%,
            #ffffff,
            #8799ff 35%,
            #342a92 70%,
            #11102d
        );

    animation:
        planet-one
        13s
        linear
        infinite;
}

.planet-2 {
    width: 29px;
    height: 29px;

    right: 20%;
    top: 37%;

    background:
        radial-gradient(
            circle at 32% 25%,
            #fff0d2,
            #d99053 38%,
            #813f28 70%,
            #24120f
        );

    animation:
        planet-two
        21s
        linear
        infinite;
}

.planet-3 {
    width: 38px;
    height: 38px;

    left: 30%;
    bottom: 22%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #d5fff6,
            #42c3ae 35%,
            #14677c 68%,
            #061b2a
        );

    animation:
        planet-three
        29s
        linear
        infinite;
}

.planet-4 {
    width: 49px;
    height: 49px;

    right: 27%;
    bottom: 18%;

    background:
        radial-gradient(
            circle at 32% 25%,
            #fff3c2,
            #b96dff 35%,
            #5a237d 68%,
            #170d2b
        );

    animation:
        planet-four
        37s
        linear
        infinite;
}


/* =========================================================
   TOP BAR
   ========================================================= */

#haldo-topbar {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    min-height: 64px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        env(safe-area-inset-top)
        18px
        12px
        18px;

    z-index: 100;

    background:
        linear-gradient(
            to bottom,
            rgba(4,14,34,.78),
            rgba(4,14,34,.22),
            transparent
        );

    backdrop-filter:
        blur(8px);
}

.haldo-brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.haldo-brand-logo {
    width: 42px;
    height: 42px;

    object-fit: cover;

    border-radius: 50%;

    box-shadow:
        0 0 20px
        rgba(120,200,255,.75);
}

.haldo-brand-title {
    font-size: 16px;
    font-weight: 700;
}

.haldo-brand-version {
    font-size: 10px;
    opacity: .55;
}

.haldo-system-status {
    display: flex;
    align-items: center;
    gap: 7px;

    font-size: 11px;
    opacity: .8;
}

.status-light {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        #5cf2b1;

    box-shadow:
        0 0 12px
        rgba(92,242,177,.9);
}


/* =========================================================
   DESKTOP
   ========================================================= */

#haldo-desktop {
    position: absolute;
    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#haldo-desktop > * {
    pointer-events: auto;
}


/* =========================================================
   CENTER LOGO
   ========================================================= */

#haldo-center-logo {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    width:
        min(180px,32vw);

    height:
        min(180px,32vw);

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    background: transparent;

    z-index: 20;
}

#haldo-center-logo img {
    width: 58%;
    height: 58%;

    object-fit: contain;

    border-radius: 50%;

    filter:
        drop-shadow(
            0 0 20px
            rgba(130,210,255,.95)
        );

    transition:
        transform .8s ease,
        filter .8s ease;
}

#haldo-center-logo.active img {
    transform: scale(1.13);

    filter:
        drop-shadow(
            0 0 35px
            rgba(255,220,120,1)
        );
}


/* =========================================================
   APP LAUNCHER
   ========================================================= */

#haldo-launcher {
    position: absolute;
    inset: 0;

    z-index: 500;

    display: none;

    padding:
        80px
        20px
        110px;

    overflow-y: auto;

    background:
        linear-gradient(
            135deg,
            rgba(5,20,48,.86),
            rgba(18,10,55,.82)
        );

    backdrop-filter:
        blur(25px);
}

#haldo-launcher.open {
    display: block;
}

.launcher-header {
    max-width: 1200px;

    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.launcher-title {
    font-size: 28px;
    font-weight: 800;
}

.launcher-subtitle {
    margin-top: 4px;

    font-size: 12px;
    opacity: .65;
}

.launcher-close {
    width: 44px;
    height: 44px;

    border: 0;
    border-radius: 14px;

    color: #fff;

    background:
        rgba(255,255,255,.09);
}

#haldo-app-grid {
    max-width: 1200px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(125px,1fr)
        );

    gap: 12px;
}

.app-tile {
    min-height: 125px;

    border:
        1px solid
        rgba(150,210,255,.13);

    border-radius: 22px;

    padding: 15px;

    color: #fff;

    background:
        linear-gradient(
            145deg,
            rgba(70,130,255,.10),
            rgba(150,70,255,.07)
        );

    text-align: left;

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
}

.app-tile:hover,
.app-tile:focus-visible {
    transform:
        translateY(-4px);

    background:
        linear-gradient(
            145deg,
            rgba(90,160,255,.19),
            rgba(170,90,255,.14)
        );

    border-color:
        rgba(140,210,255,.4);

    outline: none;
}

.app-tile-icon {
    font-size: 28px;
    margin-bottom: 13px;
}

.app-tile-name {
    font-size: 14px;
    font-weight: 700;
}

.app-tile-category {
    margin-top: 5px;

    font-size: 10px;
    opacity: .55;
}


/* =========================================================
   WINDOW MANAGER
   ========================================================= */

#haldo-window-layer {
    position: absolute;
    inset: 0;

    z-index: 400;

    pointer-events: none;
}

.haldo-window {
    position: absolute;

    min-width: 280px;
    min-height: 180px;

    max-width: 95vw;
    max-height: 85vh;

    overflow: hidden;

    border:
        1px solid
        rgba(150,210,255,.15);

    border-radius: 20px;

    background:
        rgba(7,18,42,.93);

    backdrop-filter:
        blur(24px);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);

    pointer-events: auto;
}

.haldo-window-header {
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        0 12px 0 16px;

    background:
        rgba(255,255,255,.045);
}

.haldo-window-title {
    font-size: 13px;
    font-weight: 700;
}

.haldo-window-controls {
    display: flex;
    gap: 5px;
}

.window-control {
    width: 28px;
    height: 28px;

    border: 0;
    border-radius: 9px;

    color: #fff;

    background:
        rgba(255,255,255,.08);
}

.haldo-window-content {
    height:
        calc(100% - 48px);

    overflow: auto;
}


/* =========================================================
   DOCK
   ========================================================= */

#haldo-dock {
    position: absolute;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    width:
        min(
            calc(100% - 30px),
            820px
        );

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    padding: 10px;

    border:
        1px solid
        rgba(150,210,255,.13);

    border-radius: 24px;

    background:
        linear-gradient(
            135deg,
            rgba(18,45,90,.64),
            rgba(40,20,85,.58)
        );

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.45);

    overflow-x: auto;

    z-index: 200;
}

.dock-button {
    flex: 0 0 auto;

    min-width: 54px;
    height: 54px;

    border: 0;

    border-radius: 17px;

    color: #fff;

    background:
        rgba(255,255,255,.075);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 3px;

    transition:
        transform .2s ease,
        background .2s ease;
}

.dock-button:hover,
.dock-button:focus-visible {
    transform:
        translateY(-4px);

    background:
        rgba(120,190,255,.16);

    outline: none;
}

.dock-icon {
    font-size: 19px;
}

.dock-label {
    font-size: 8px;
    opacity: .75;
}


/* =========================================================
   BOOT
   ========================================================= */

#haldo-boot {
    position: fixed;
    inset: 0;

    z-index: 5000;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #112c62,
            #06142e 45%,
            #020817 100%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#haldo-boot.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.boot-content {
    text-align: center;
}

.boot-logo {
    width: 120px;
    height: 120px;

    object-fit: contain;

    border-radius: 50%;

    filter:
        drop-shadow(
            0 0 32px
            rgba(120,205,255,.95)
        );

    animation:
        boot-logo
        2s
        ease-in-out
        infinite;
}

.boot-title {
    margin-top: 22px;

    font-size: 22px;
    font-weight: 800;

    letter-spacing: .06em;
}

.boot-status {
    margin-top: 8px;

    font-size: 11px;
    opacity: .6;
}

.boot-loader {
    width: 180px;
    height: 3px;

    margin: 18px auto 0;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.08);
}

.boot-loader::after {
    content: "";

    display: block;

    width: 45%;
    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            transparent,
            #9bd7ff,
            #ffe18a,
            transparent
        );

    animation:
        loader
        1.2s
        linear
        infinite;
}


/* =========================================================
   INSTALL PANEL
   ========================================================= */

#haldo-install-center {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    width:
        min(
            420px,
            calc(100vw - 32px)
        );

    display: none;

    padding: 25px;

    border:
        1px solid
        rgba(150,210,255,.18);

    border-radius: 26px;

    background:
        rgba(7,20,48,.95);

    backdrop-filter:
        blur(30px);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.6);

    z-index: 3000;
}

#haldo-install-center.open {
    display: block;
}

.install-title {
    font-size: 22px;
    font-weight: 800;
}

.install-text {
    margin-top: 10px;

    font-size: 13px;
    line-height: 1.6;

    opacity: .7;
}

.install-actions {
    display: flex;

    gap: 8px;

    margin-top: 20px;
}

.haldo-button {
    border: 0;

    border-radius: 13px;

    padding:
        11px 15px;

    color: #fff;

    background:
        rgba(255,255,255,.09);
}

.haldo-button.primary {
    background:
        linear-gradient(
            135deg,
            #426dff,
            #8b4dff
        );
}


/* =========================================================
   TOAST
   ========================================================= */

#haldo-toast-layer {
    position: fixed;

    left: 50%;
    bottom: 100px;

    transform:
        translateX(-50%);

    z-index: 7000;

    display: flex;
    flex-direction: column;

    gap: 8px;

    width:
        min(
            420px,
            calc(100vw - 30px)
        );

    pointer-events: none;
}

.haldo-toast {
    padding:
        12px 15px;

    border:
        1px solid
        rgba(150,210,255,.14);

    border-radius: 15px;

    background:
        rgba(7,20,48,.92);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    font-size: 12px;

    animation:
        toast-in
        .3s
        ease;
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes cosmic-nebula {

    from {
        transform:
            translate3d(-1%,0,0)
            scale(1);
    }

    to {
        transform:
            translate3d(1%,-1%,0)
            scale(1.06);
    }
}

@keyframes star-drift {

    from {
        transform:
            translate3d(0,0,0);
    }

    to {
        transform:
            translate3d(-18px,12px,0);
    }
}

@keyframes star-pulse {

    from {
        opacity: .55;
        transform: scale(.98);
    }

    to {
        opacity: 1;
        transform: scale(1.03);
    }
}

@keyframes sun-breathe {

    0%,
    100% {
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50% {
        transform:
            translate(-50%,-50%)
            scale(1.045);
    }
}

@keyframes solar-rays {

    from {
        transform:
            rotate(0deg)
            scale(1);
    }

    to {
        transform:
            rotate(360deg)
            scale(1.05);
    }
}

@keyframes planet-one {

    from {
        transform:
            rotate(0deg)
            translateX(70px)
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg)
            translateX(70px)
            rotate(-360deg);
    }
}

@keyframes planet-two {

    from {
        transform:
            rotate(0deg)
            translateX(110px)
            rotate(0deg);
    }

    to {
        transform:
            rotate(-360deg)
            translateX(110px)
            rotate(360deg);
    }
}

@keyframes planet-three {

    from {
        transform:
            rotate(0deg)
            translateX(150px)
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg)
            translateX(150px)
            rotate(-360deg);
    }
}

@keyframes planet-four {

    from {
        transform:
            rotate(0deg)
            translateX(200px)
            rotate(0deg);
    }

    to {
        transform:
            rotate(-360deg)
            translateX(200px)
            rotate(360deg);
    }
}

@keyframes boot-logo {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

@keyframes loader {

    from {
        transform:
            translateX(-130%);
    }

    to {
        transform:
            translateX(330%);
    }
}

@keyframes toast-in {

    from {
        opacity: 0;
        transform:
            translateY(10px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width:600px) {

    #haldo-topbar {
        padding-left: 12px;
        padding-right: 12px;
    }

    .haldo-brand-title {
        font-size: 13px;
    }

    .haldo-system-status {
        display: none;
    }

    #haldo-dock {
        bottom:
            calc(
                8px +

            );
    }

    #haldo-launcher {
        padding:
            75px
            12px
            100px;
    }

    #haldo-app-grid {
        grid-template-columns:
            repeat(3,minmax(0,1fr));

        gap: 8px;
    }

    .app-tile {
        min-height: 105px;
        padding: 11px;
        border-radius: 17px;
    }

    .app-tile-icon {
        font-size: 23px;
    }
}

@media (prefers-reduced-motion:reduce) {

    *::after {
        animation-duration:
            .01ms !important;

        animation-iteration-count:

    }
}

    <!-- =====================================================
         INSTALL
         ===================================================== -->

    <section

    >

        <div
            class="install-title"

        <div class="install-actions">

            <button

    <!-- =====================================================

    <!-- =====================================================

         ===================================================== -->

    <section
        id="haldo-boot"
        aria-label="HalDo wird gestartet"
    >

        <div class="boot-content">

            <img
                class="boot-logo"
                src="./assets/logo/logo.png"
                alt="HalDo AI OS"
            >

            <div class="boot-title">
                HalDo AI OS
            </div>

            <div
                class="boot-status"

        </div>

</div>

     CENTRAL SHELL
     ========================================================= -->

<script>

(function () {

"use strict";


const OS =
window.HalDoOS;


function $(selector) {
    return document.querySelector(selector);
}


function toast(message) {

    const layer =
    $("#haldo-toast-layer");

    if (!layer) return;

    const element =
    document.createElement("div");

    element.className =
    "haldo-toast";

    element.textContent =
    message;

    layer.appendChild(element);

    setTimeout(
        () => element.remove(),
        3500
    );
}


OS.toast =
toast;


function status(message) {

    const top =
    $("#haldo-status-text");

    const boot =
    $("#boot-status");

    if (top)
        top.textContent =
        message;

    if (boot)
        boot.textContent =
        message;
}


OS.setStatus =
status;


/* =========================================================
   APP DEFINITIONS
   ========================================================= */

const apps = [

["ai-chat","HalDo AI","AI","AI"],
["calendar","Kalender","Organisation","◫"],
["contacts","Kontakte","Kommunikation","♙"],
["messages","Nachrichten","Kommunikation","✉"],
["email","E-Mail","Kommunikation","@"],
["notes","Notizen","Organisation","▤"],
["tasks","Aufgaben","Organisation","✓"],
["reminders","Erinnerungen","Organisation","◷"],
["calculator","Rechner","Werkzeuge","＋"],
["weather","Wetter","Umwelt","☼"],
["clock","Uhr","Werkzeuge","◷"],
["files","Dateien","System","▱"],
["gallery","Galerie","Medien","▧"],
["camera","Kamera","Medien","◉"],
["music","Musik","Medien","♫"],
["video","Video","Medien","▶"],
["song-creator","Song Creator","Kreativität","♪"],
["navigation","Navigation","Verkehr","◎"],
["driving-school","Fahrschule","Verkehr","▣"],
["traffic","Verkehr","Verkehr","⚠"],
["traffic-alerts","Verkehrswarnungen","Verkehr","!"],
["speed-camera","Gefahrenwarnungen","Verkehr","!"],
["university","Universität","Bildung","▤"],
["learning","Lernen","Bildung","◇"],
["translator","Übersetzer","Sprache","文"],
["health","Gesundheit","Alltag","+"],
["finance","Finanzen","Alltag","€"],
["travel","Reisen","Reisen","✈"],
["maps","Karten","Navigation","◇"],
["browser","Browser","Internet","◎"],
["environment","Umwelt","Umwelt","♧"],
["documents","Dokumente","Werkzeuge","▤"],
["scanner","Scanner","Werkzeuge","▥"],
["settings","Einstellungen","System","⚙"],
["app-manager","App Manager","System","◈"],
["backup","Backup","System","⬆"],
["update-center","Update Center","System","↻"],
["security-center","Security Center","System","◆"],
["help-center","Help Center","System","?"]

];


OS.appDefinitions =
apps.map(
    ([id,name,category,icon]) => ({
        id,
        name,
        category,
        icon
    })
);


/* =========================================================
   APP GRID
   ========================================================= */

function buildApps() {

    const grid =
    $("#haldo-app-grid");

    if (!grid)
        return;

    grid.innerHTML = "";

    OS.appDefinitions.forEach(
        app => {

            const button =
            document.createElement("button");

            button.type =
            "button";

            button.className =
            "app-tile";

            button.dataset.app =
            app.id;

            button.innerHTML = `

                <div class="app-tile-icon">
                    ${app.icon}
                </div>

                <div class="app-tile-name">
                    ${app.name}
                </div>

                <div class="app-tile-category">
                    ${app.category}
                </div>

            `;

            button.addEventListener(
                "click",
                () => openApp(app.id)
            );

            grid.appendChild(button);

        }
    );

}


/* =========================================================
   APP OPEN
   ========================================================= */

async function openApp(appId) {

    const app =
    OS.appDefinitions.find(
        item => item.id === appId
    );

    if (!app)
        return;


    const launcher =
    $("#haldo-launcher");

    if (launcher)
        launcher.classList.remove("open");


    OS.runtime =
    OS.runtime || {};

    OS.runtime.activeApp =
    appId;


    /*
     * Zuerst die neue Universal Runtime.
     */

    if (
        window.HalDoAppRuntime &&
        typeof window.HalDoAppRuntime.open
        === "function"
    ) {

        await window.HalDoAppRuntime.open(
            app
        );

        return;

    }


    /*
     * Danach bestehende App-Systeme.
     */

    try {

        if (
            window.HalDoAppRouter &&
            typeof window.HalDoAppRouter.open
            === "function"
        ) {

            await window.HalDoAppRouter.open(
                appId
            );

            return;
        }

    } catch (error) {

        console.error(
            "[HalDo] Router error",
            error
        );

    }


    window.dispatchEvent(
        new CustomEvent(
            "haldo:app-open-request",
            {
                detail: {
                    appId
                }
            }
        )
    );

}


OS.openApp =
openApp;


/* =========================================================
   LAUNCHER
   ========================================================= */

function openLauncher() {

    buildApps();

    $("#haldo-launcher")
    ?.classList.add("open");

}

function closeLauncher() {

    $("#haldo-launcher")
    ?.classList.remove("open");

}


document
.querySelector(
    "[data-action='launcher']"
)
?.addEventListener(
    "click",
    openLauncher
);


$("#launcher-close")
?.addEventListener(
    "click",
    closeLauncher
);


/* =========================================================
   DOCK
   ========================================================= */

document
.querySelectorAll(
    "[data-app]"
)
.forEach(
    button => {

        button.addEventListener(
            "click",
            () =>
            openApp(
                button.dataset.app
            )
        );

    }
);


/* =========================================================
   HALDO LOGO → AI
   ========================================================= */

$("#haldo-center-logo")
?.addEventListener(
    "click",
    () => {

        $("#haldo-center-logo")
        ?.classList.add("active");

        setTimeout(
            () =>
            $("#haldo-center-logo")
            ?.classList.remove("active"),
            900
        );

        openApp("ai-chat");

    }
);


/* =========================================================
   SERVICE WORKER
   ========================================================= */

async function registerSW() {

    if (
        !("serviceWorker" in navigator)
    )
        return;

    try {

        const registration =
        await navigator
        .serviceWorker
        .register(
            "./service-worker.js"
        );

        console.log(
            "[HalDo] Service Worker registered",
            registration
        );

        status(
            "HalDo AI OS bereit"
        );

    } catch (error) {

        console.error(
            "[HalDo] Service Worker",
            error
        );

        status(
            "HalDo läuft – Offline Update eingeschränkt"
        );

    }

}


/* =========================================================
   BOOT
   ========================================================= */

async function boot() {

    status(
        "Cosmic World wird gestartet …"
    );

    await new Promise(
        resolve =>
        setTimeout(
            resolve,
            350
        )
    );


    status(
        "System Core wird geladen …"
    );

    await new Promise(
        resolve =>
        setTimeout(
            resolve,
            350
        )
    );


    status(
        "App Runtime wird geladen …"
    );

    buildApps();


    await registerSW();


    OS.runtime =
    OS.runtime || {};

    OS.runtime.booted =
    true;

    OS.runtime.ready =
    true;


    $("#haldo-os")
    ?.setAttribute(
        "data-haldo-state",
        "ready"
    );


    status(
        "HalDo AI OS bereit"
    );


    $("#haldo-boot")
    ?.classList.add(
        "hidden"
    );


    window.dispatchEvent(
        new CustomEvent(
            "haldo:ready"
        )
    );

}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        boot,
        { once:true }
    );

} else {

    boot();

}

})();

</script>

</body>
