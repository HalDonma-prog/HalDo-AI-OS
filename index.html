<script>
"use strict";

(function () {

    const HalDo = window.HalDo;

    if (!HalDo) {
        console.error("HalDo Foundation fehlt.");
        return;
    }

    /* =========================================================
       AI CORE
       ========================================================= */

    HalDo.ai =
        HalDo.ai ||
        {};

    const AI = HalDo.ai;

    AI.version =
        "20.0.0";

    AI.name =
        "HalDo AI";

    AI.state =
        "ready";

    AI.provider =
        "local";

    AI.model =
        null;

    AI.conversationId =
        AI.conversationId ||
        null;

    AI.messages =
        AI.messages ||
        [];

    AI.settings =
        AI.settings ||
        {

            language:
                HalDo.storage.get(
                    "settings:language",
                    "de"
                ),

            voice:
                false,

            autoMemory:
                true

        };


    /* =========================================================
       CONVERSATION ID
       ========================================================= */

    AI.newConversation =
        function () {

            this.conversationId =
                HalDo.utils.id(
                    "conversation"
                );

            this.messages =
                [];

            HalDo.storage.set(
                "ai:lastConversation",
                {
                    id:
                        this.conversationId,

                    messages:
                        []
                }
            );

            HalDo.emit(
                "ai:conversation-created",
                {
                    id:
                        this.conversationId
                }
            );

            return this.conversationId;
        };


    AI.ensureConversation =
        function () {

            if (
                !this.conversationId
            ) {

                const saved =
                    HalDo.storage.get(
                        "ai:lastConversation",
                        null
                    );

                if (
                    saved?.id
                ) {

                    this.conversationId =
                        saved.id;

                    this.messages =
                        Array.isArray(
                            saved.messages
                        )
                            ? saved.messages
                            : [];

                } else {

                    this.newConversation();

                }

            }

            return this.conversationId;
        };


    /* =========================================================
       MEMORY
       ========================================================= */

    AI.memory =
        AI.memory ||
        {

            key:
                "ai:memory",

            entries:
                [],

            load() {

                this.entries =
                    HalDo.storage.get(
                        this.key,
                        []
                    );

                if (
                    !Array.isArray(
                        this.entries
                    )
                ) {

                    this.entries =
                        [];

                }

                return this.entries;

            },

            save() {

                HalDo.storage.set(
                    this.key,
                    this.entries
                );

            },

            add(
                text,
                metadata = {}
            ) {

                const entry = {

                    id:
                        HalDo.utils.id(
                            "memory"
                        ),

                    text:
                        String(
                            text
                        ),

                    metadata:
                        metadata || {},

                    createdAt:
                        Date.now(),

                    updatedAt:
                        Date.now()

                };

                this.entries.push(
                    entry
                );

                this.save();

                HalDo.emit(
                    "ai:memory-added",
                    entry
                );

                return entry;
            },

            remove(
                id
            ) {

                const before =
                    this.entries.length;

                this.entries =
                    this.entries.filter(
                        entry =>
                            entry.id !==
                            id
                    );

                this.save();

                return (
                    before !==
                    this.entries.length
                );

            },

            clear() {

                this.entries =
                    [];

                this.save();

                HalDo.emit(
                    "ai:memory-cleared"
                );

            },

            search(
                query,
                limit = 5
            ) {

                const words =
                    String(
                        query
                    )
                    .toLowerCase()
                    .split(
                        /\s+/
                    )
                    .filter(
                        Boolean
                    );

                if (!words.length) {
                    return [];
                }

                return this.entries
                    .map(
                        entry => {

                            const text =
                                entry.text
                                    .toLowerCase();

                            let score =
                                0;

                            words.forEach(
                                word => {

                                    if (
                                        text.includes(
                                            word
                                        )
                                    ) {

                                        score++;

                                    }

                                }
                            );

                            return {
                                entry,
                                score
                            };

                        }
                    )
                    .filter(
                        result =>
                            result.score >
                            0
                    )
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            b.score -
                            a.score
                    )
                    .slice(
                        0,
                        limit
                    )
                    .map(
                        result =>
                            result.entry
                    );

       MESSAGE CREATION
       ========================================================= */

    AI.createMessage =
        function (
            role,

            metadata = {}

                id:
                    HalDo.utils.id(
                        "message"

                role:
                    role,

                content:
                    String(
                        content ?? ""
                    ),

                metadata:
                    metadata || {},

                timestamp:
                    Date.now()

            };

        };


    AI.addMessage =
        function (
            role,
            content,
            metadata = {}
        ) {

            this.ensureConversation();

            const message =
                this.createMessage(
                    role,
                    content,
                    metadata
                );

            this.messages.push(
                message

            /*
             * Conversationen werden lokal
             * gespeichert.

            HalDo.storage.set(
                "ai:lastConversation",
                {

                    id:
                        this.conversationId,

                    messages:
                        this.messages

            HalDo.emit(
                "ai:message",
                message
            );

            return message;
        };


    /* =========================================================
       LOCAL AI ENGINE
       ========================================================= */

    AI.generateLocalResponse =
        async function (
            input
        ) {

            const text =
                String(
                    input
                )
                .trim();

            if (!text) {

                return {
                    text:
                        "Wie kann ich dir helfen?"
                };

            }

            const lower =
                text.toLowerCase();

            /*
             * Die lokale Engine ist bewusst
             * deterministisch und benötigt
             * keine externe API.
             */

            if (
                lower.includes(
                    "hallo"
                ) ||
                lower.includes(
                    "hi"
                ) ||
                lower.includes(
                    "hey"
                )
            ) {

                return {

                    text:
                        "Hallo! Ich bin HalDo AI. 💙❤️🚀"

                };

            }

            if (
                lower.includes(
                    "wer bist du"
                )
            ) {

                return {

                    text:
                        "Ich bin HalDo AI, die intelligente Assistenzschicht von HalDo AI OS 20."

                };

            }

            if (
                lower.includes(
                    "version"
                )
            ) {

                return {

                    text:
                        "HalDo AI OS befindet sich auf der Version 20.0.0."

                };

            }

            if (
                lower.includes(
                    "status"
                )
            ) {

                const info =
                    HalDo.system.info();

                return {

                    text:
                        `Systemstatus: ${info.state}. Kernel: ${info.kernel}. Online: ${info.online ? "ja" : "nein"}.`

                };

            }

            if (
                lower.includes(
                    "apps"
                ) ||
                lower.includes(
                    "anwendungen"
                )
            ) {

                const apps =
                    HalDo.appRegistry
                        .list({
                            enabledOnly:
                                true
                        })
                        .map(
                            app =>
                                app.name
                        );

                return {

                    text:
                        `Aktuell sind ${apps.length} Apps registriert: ${apps.join(", ")}.`

                };

            }

            if (
                lower.includes(
                    "hilfe"
                )
            ) {

                return {

                    text:
                        "Du kannst mich nach dem Systemstatus, Apps, Einstellungen oder anderen HalDo-Funktionen fragen."

                };

            }

            const memories =
                this.memory.search(
                    text,
                    3
                );

            if (
                memories.length
            ) {

                return {

                    text:
                        `Ich habe dazu gespeicherte Informationen gefunden: ${memories.map(m => m.text).join(" • ")}`

                };

            }

            return {

                text:
                    `Ich habe deine Nachricht verstanden: „${text}“. Die lokale HalDo AI Runtime ist aktiv. Für eine leistungsfähigere Antwort kann später ein externer oder lokaler KI-Provider angeschlossen werden.`

            };

        };


    /* =========================================================
       AI REQUEST PIPELINE
       ========================================================= */

    AI.respond =
        async function (
            input,
            options = {}
        ) {

            const text =
                String(
                    input ?? ""
                )
                .trim();

            if (!text) {
                return null;
            }

            this.state =
                "thinking";

            this.ensureConversation();

            const userMessage =
                this.addMessage(
                    "user",
                    text,
                    {
                        source:
                            options.source ||
                            "user"
                    }
                );

            HalDo.emit(
                "ai:thinking",
                {
                    message:
                        userMessage
                }
            );

            try {

                let result =
                    null;

                /*
                 * Provider-Schnittstelle.
                 * Externe AI-Provider können später
                 * über registerProvider() angeschlossen
                 * werden, ohne die Chat-App umzubauen.
                 */

                if (
                    options.provider &&
                    this.providers.has(
                        options.provider
                    )
                ) {

                    result =
                        await this.providers
                            .get(
                                options.provider
                            )
                            .respond(
                                text,
                                {
                                    messages:
                                        this.messages,

                                    memory:
                                        this.memory.entries
                                }
                            );

                } else {

                    result =
                        await this.generateLocalResponse(
                            text
                        );

                }

                const responseText =
                    typeof result ===
                    "string"
                        ? result
                        : result?.text ||
                          "Ich konnte momentan keine Antwort erzeugen.";

                const assistantMessage =
                    this.addMessage(
                        "assistant",
                        responseText,
                        {
                            provider:
                                options.provider ||
                                this.provider
                        }
                    );

                    "ready";

                HalDo.emit(
                    "ai:response",
                    {
                        message:
                            assistantMessage

                        "assistant",

                                true
                        }
                    );

                    "ai:error",
                    {
                        error,
                        message:
                            errorMessage
                    }

                    "ready";

                "ai:provider-registered",

                }

        };

                name

                        name
                }

        HalDo.storage.get(
            "ai:provider",
            "local"
        );


    /* =========================================================
       CHAT UI
       ========================================================= */

    AI.chat =
        AI.chat ||
        {};

    const chat =
        AI.chat;

    chat.element =
        null;

    chat.messagesElement =
        null;

    chat.input =
        null;

    chat.sendButton =
        null;

    chat.initialized =
        false;

    chat.initialize =
        function (
            root
        ) {

            if (!root) {
                return false;
            }

            this.element =
                root;

            this.messagesElement =
                root.querySelector(
                    "[data-haldo-ai-messages]"

                root.querySelector(

                );

                );

                    "click",

                );

                    "keydown",
                    event => {

                        if (

                            "Enter" &&
                            !event.shiftKey

                            this.send();

                        }

                );

            }

                true;

        };


    chat.renderHistory =
        function () {

            if (
                !this.messagesElement
            ) {

            }

            this.messagesElement.innerHTML =
                "";

            AI.messages.forEach(
                message => {

                    this.renderMessage(
                        message
                    );

            );

                !this.messagesElement

            }

            const row =

                );

            row.className =
                `haldo-ai-message haldo-ai-message-${message.role}`;

            row.dataset.messageId =
                message.id;

            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "haldo-ai-bubble";

            bubble.textContent =
                message.content;

            row.appendChild(
                bubble
            );

            this.messagesElement.appendChild(
                row
            );

            this.scrollToBottom();

            return row;
        };


    chat.send =
        async function () {

            if (!this.input) {
                return;
            }

            const text =
                this.input.value.trim();

            if (!text) {
                return;
            }

            this.input.value =
                "";

            const userMessage =
                AI.addMessage(
                    "user",
                    text,
                    {
                        source:
                            "chat"
                    }
                );

            this.renderMessage(
                userMessage
            );

            if (
                this.sendButton
            ) {

                this.sendButton.disabled =
                    true;

            }

            try {

                const response =
                    await AI.respondWithoutDuplicateUserMessage(
                        text
                    );

                if (
                    response
                ) {

                    this.renderMessage(
                        response
                    );

                }

            } finally {

                if (
                    this.sendButton
                ) {

                    this.sendButton.disabled =
                        false;

                }

            }

        };


    /*
     * Chat.send() hat die User-Nachricht bereits
     * hinzugefügt. Deshalb darf respond() sie
     * nicht noch einmal hinzufügen.
     */

    AI.respondWithoutDuplicateUserMessage =
        async function (
            input,
            options = {}
        ) {

            this.state =
                "thinking";

            HalDo.emit(
                "ai:thinking",
                {
                    input
                }
            );

            try {

                const result =
                    await this.generateLocalResponse(
                        input
                    );

                const text =
                    result?.text ||
                    String(
                        result
                    );

                const message =
                    this.addMessage(
                        "assistant",
                        text,
                        {
                            provider:
                                this.provider
                        }
                    );

                this.state =
                    "ready";

                HalDo.emit(
                    "ai:response",
                    {
                        message
                    }
                );

                return message;

            } catch (error) {

                this.state =
                    "error";

                HalDo.kernel.recordError(
                    error,
                    "ai.chat"
                );

                const message =
                    this.addMessage(
                        "assistant",
                        "Die HalDo AI konnte diese Anfrage momentan nicht verarbeiten."
                    );

                return message;

            } finally {

                this.state =
                    "ready";

            }

        };


    chat.scrollToBottom =
        function () {

            if (
                this.messagesElement
            ) {

                this.messagesElement.scrollTop =
                    this.messagesElement.scrollHeight;

            }

        };


    /* =========================================================
       SPEECH RECOGNITION
       ========================================================= */

    HalDo.voice =
        HalDo.voice ||
        {};

    const voice =
        HalDo.voice;

    voice.recognition =
        null;

    voice.active =
        false;

    voice.supported =
        Boolean(
            window.SpeechRecognition ||
            window.webkitSpeechRecognition
        );

    voice.initialize =
        function () {

            if (
                !this.supported
            ) {

                return false;

            }

            const Recognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            this.recognition =
                new Recognition();

            this.recognition.continuous =
                false;

            this.recognition.interimResults =
                true;

            this.recognition.lang =
                HalDo.storage.get(
                    "settings:language",
                    "de-DE"
                );

            this.recognition.onstart =
                () => {

                    this.active =
                        true;

                    HalDo.emit(
                        "voice:start"
                    );

                };

            this.recognition.onend =
                () => {

                    this.active =
                        false;

                    HalDo.emit(
                        "voice:end"
                    );

                };

            this.recognition.onerror =
                event => {

                    this.active =
                        false;

                    HalDo.kernel.recordError(
                        new Error(
                            event.error ||
                            "Speech Recognition Error"
                        ),
                        "voice"
                    );

                    HalDo.emit(
                        "voice:error",
                        event
                    );

                };

            this.recognition.onresult =
                event => {

                    let transcript =
                        "";

                    for (
                        let index =
                            event.resultIndex;
                        index <
                            event.results.length;
                        index++
                    ) {

                        transcript +=
                            event.results[
                                index
                            ][0].transcript;

                    }

                    HalDo.emit(
                        "voice:result",
                        {
                            transcript
                        }
                    );

                    if (
                        AI.chat.input
                    ) {

                        AI.chat.input.value =
                            transcript;

                    }

                };

            return true;
        };


    voice.start =
        function () {

            if (
                !this.supported
            ) {

                HalDo.notifications.show(
                    "Spracheingabe",
                    "Die Spracheingabe wird von diesem Browser nicht unterstützt."
                );

                return false;
            }

            if (
                !this.recognition
            ) {

                this.initialize();

            }

            try {

                this.recognition.start();

                return true;

            } catch (error) {

                HalDo.kernel.recordError(
                    error,
                    "voice.start"
                );

                return false;

            }

        };


    voice.stop =
        function () {

            if (
                this.recognition &&
                this.active
            ) {

                try {

                    this.recognition.stop();

                } catch (error) {}

            }

        };


    voice.toggle =
        function () {

            if (
                this.active
            ) {

                this.stop();

            } else {

                this.start();

            }

        };


    /* =========================================================
       TEXT TO SPEECH
       ========================================================= */

    voice.speak =
        function (
            text,
            options = {}
        ) {

            if (
                !("speechSynthesis" in window)
            ) {

                return false;
            }

            const utterance =
                new SpeechSynthesisUtterance(
                    String(
                        text
                    )
                );

            utterance.lang =
                options.lang ||
                "de-DE";

            utterance.rate =
                options.rate ||
                1;

            utterance.pitch =
                options.pitch ||
                1;

            window.speechSynthesis.cancel();

            window.speechSynthesis.speak(
                utterance
            );

            return true;
        };


    /* =========================================================
       AI APP REGISTRATION
       ========================================================= */

    if (
        HalDo.appRegistry.has(
            "ai"
        )
    ) {

        const existingAI =
            HalDo.appRegistry.get(
                "ai"
            );

        existingAI.factory =
            async function (
                context
            ) {

                const root =
                    document.createElement(
                        "div"
                    );

                root.className =
                    "haldo-ai-app";

                root.innerHTML = `

                    <div class="haldo-ai-header">

                        <div>

                            <strong>
                                HalDo AI
                            </strong>

                            <small>
                                AI OS 20
                            </small>

                        </div>

                        <button
                            type="button"
                            data-ai-voice
                            title="Spracheingabe"
                        >
                            🎙
                        </button>

                    </div>

                    <div
                        class="haldo-ai-messages"
                        data-haldo-ai-messages
                    ></div>

                    <div class="haldo-ai-composer">

                        <textarea
                            data-haldo-ai-input
                            rows="2"
                            placeholder="Schreibe etwas an HalDo AI …"
                        ></textarea>

                        <button
                            type="button"
                            data-haldo-ai-send
                        >
                            Senden
                        </button>

                    </div>

                `;

                const voiceButton =
                    root.querySelector(
                        "[data-ai-voice]"
                    );

                if (
                    voiceButton
                ) {

                    voiceButton.addEventListener(
                        "click",
                        () => {

                            voice.toggle();

                        }
                    );

                }

                chat.initialize(
                    root
                );

                return {

                    element:
                        root,

                    destroy() {

                        voice.stop();

                    }

                };

            };

    }


    /* =========================================================
       KERNEL MODULE
       ========================================================= */

    HalDo.kernel.register(
        "ai-core",
        {

            name:
                "HalDo AI Core",

            version:
                "20.0.0",

            autoStart:
                true,

            async init() {

                AI.ensureConversation();

                voice.initialize();

                HalDo.emit(
                    "ai:ready",
                    {
                        version:
                            AI.version,

                        provider:
                            AI.provider
                    }
                );

            }

        }
    );

    HalDo.kernel.register(
        "ai-memory",
        {

            name:
                "HalDo AI Memory",

            version:
                "20.0.0",

            autoStart:
                true,

            async init() {

                AI.memory.load();

                HalDo.emit(
                    "ai-memory:ready"
                );

            }

        }
    );

    HalDo.kernel.register(
        "ai-speech",
        {

            name:
                "HalDo AI Speech",

            version:
                "20.0.0",

            autoStart:
                true,

            async init() {

                voice.initialize();

                HalDo.emit(
                    "ai-speech:ready",
                    {
                        supported:
                            voice.supported
                    }
                );

            }

        }
    );


    /* =========================================================
       COMPATIBILITY ALIASES
       ========================================================= */

    window.HalDoAI =
        AI;

    window.HalDoAICore =
        AI;

    window.HalDoAIMemory =
        AI.memory;

    window.HalDoVoice =
        voice;

    if (
        window.HalDoOS
    ) {

        window.HalDoOS.ai =
            AI;

        window.HalDoOS.voice =
            voice;

    }


    HalDo.log(
        "HalDo AI Runtime, Memory und Voice bereit."
    );

})();

HalDo AI OS 20 Terminal

                const output =
                    root.querySelector(
                        "[data-terminal-output]"

                const input =
                    root.querySelector(

                const write =
                    text => {

                        output.textContent +=
                            `\n${text}`;

                        output.scrollTop =
                            output.scrollHeight;

                    };

                const execute =
                    async command => {

                        const value =
                            command.trim();

                        if (!value) {
                            return;
                        }

                        write(
                            `\nhaldo$ ${value}`
                        );

                        const parts =
                            value.split(
                                /\s+/
                            );

                        const name =
                            parts.shift()
                                .toLowerCase();

                        switch (
                            name
                        ) {

                            case "help":

                                write(
                                    [
                                        "help",
                                        "apps",
                                        "status",
                                        "clear",
                                        "open <app>",
                                        "memory"
                                    ].join(
                                        "\n"
                                    )
                                );

                                break;

                            case "apps":

                                write(
                                    HalDo.appRegistry
                                        .list({
                                            enabledOnly:
                                                true
                                        })
                                        .map(
                                            app =>
                                                `${app.icon} ${app.id} — ${app.name}`

                                        .join(
                                            "\n"
                                        )
                                );

                                break;

                            case "status":

                                write(
                                    JSON.stringify(

                                        2
                                    )
                                );

                                break;

                            case "memory":

                                write(
                                    `${HalDo.ai.memory.entries.length} Memory-Einträge`
                                );

                                break;

                            case "clear":

                                output.textContent =
                                    "";

                                break;

                            case "open":

                                if (
                                    parts[0]
                                ) {

                                    await HalDo.appManager.open(
                                        parts[0]
                                    );

                                    write(
                                        `App "${parts[0]}" wird geöffnet.`
                                    );

                                } else {

                                    write(
                                        "Verwendung: open <app>"
                                    );

                                }

                                break;

                            default:

                                write(
                                    `Unbekannter Befehl: ${name}`
                                );

                                break;

                        }

                    };

                input.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            const command =
                                input.value;

                            input.value =
                                "";

                            execute(
                                command
                            );

                        }

                    }
                );

                return {

                    element:
                        root

                };

            }

    });

    const aliases = {

                }
            );

            return true;

        };


    /* =========================================================
       ROLLBACK STATE
       ========================================================= */

    HalDo.rollback =
        HalDo.rollback ||
        {};

    rollback =
        HalDo.rollback;


    rollback.saveCheckpoint =
        function () {

            const checkpoint = {

                version:
                    "20.0.0",

                createdAt:
                    Date.now(),

                state:
                    HalDo.storage.export
                        ? HalDo.storage.export()
                        : null

            };

            HalDo.storage.set(
                "system:checkpoint",
                checkpoint
            );

            HalDo.emit(
                "rollback:checkpoint",
                checkpoint
            );

            return checkpoint;

        };


    rollback.restoreCheckpoint =
        function () {

            const checkpoint =
                HalDo.storage.get(
                    "system:checkpoint",
                    null
                );

            if (
                !checkpoint
            ) {

                return false;

            }

            if (
                checkpoint.state &&
                HalDo.storage.import
            ) {

                HalDo.storage.import(
                    checkpoint.state
                );

            }

            HalDo.emit(
                "rollback:restored",
                checkpoint
            );

            return true;

        };


    /* =========================================================
       SYSTEM READY SCREEN
       ========================================================= */

    boot.showDesktop =
        function () {

            const bootScreen =
                document.querySelector(
                    "[data-haldo-boot]"
                );

            const desktop =
                document.querySelector(
                    "[data-haldo-desktop]"
                );

            if (
                bootScreen
            ) {

                bootScreen.classList.add(
                    "is-finished"
                );

                window.setTimeout(
                    () => {

                        bootScreen.hidden =
                            true;

                    },
                    500
                );

            }

            if (
                desktop
            ) {

                desktop.hidden =
                    false;

                desktop.classList.add(
                    "is-ready"
                );

            }

        };


    /* =========================================================
       SYSTEM START
       ========================================================= */

    boot.start =
        async function () {

            if (
                this.started
            ) {

                return;

            }

            this.started =
                true;

            try {

                this.setStage(
                    "foundation",
                    5
                );

                /*
                 * Alle bereits registrierten Module
                 * bekommen Gelegenheit, sich über den
                 * bestehenden Kernel zu initialisieren.
                 */

                if (
                    HalDo.kernel &&
                    typeof HalDo.kernel.start ===
                    "function"
                ) {

                    await HalDo.kernel.start();

                }


                this.setStage(
                    "storage",
                    15
                );

                if (
                    HalDo.storage &&
                    typeof HalDo.storage.initialize ===
                    "function"
                ) {

                    await HalDo.storage.initialize();

                }


                this.setStage(
                    "registry",
                    25
                );

                /*
                 * Die App Registry ist zu diesem Zeitpunkt
                 * bereits vorhanden.
                 */

                if (
                    HalDo.appRegistry &&
                    typeof HalDo.appRegistry.initialize ===
                    "function"
                ) {

                    await HalDo.appRegistry.initialize();

                }


                this.setStage(
                    "system",
                    35
                );

                if (
                    HalDo.system &&
                    typeof HalDo.system.start ===
                    "function"
                ) {

                    await HalDo.system.start();

                }


                this.setStage(
                    "runtime",
                    45
                );

                if (
                    HalDo.appManager &&
                    typeof HalDo.appManager.initialize ===
                    "function"
                ) {

                    await HalDo.appManager.initialize();

                }


                if (
                    HalDo.router &&
                    typeof HalDo.router.initialize ===
                    "function"
                ) {

                    await HalDo.router.initialize();

                }


                this.setStage(
                    "ai",
                    58
                );

                if (
                    HalDo.ai
                ) {

                    HalDo.ai.ensureConversation();

                    if (
                        HalDo.voice &&
                        typeof HalDo.voice.initialize ===
                        "function"
                    ) {

                        HalDo.voice.initialize();

                    }

                }


                this.setStage(
                    "apps",
                    68
                );

                /*
                 * System-Apps sind bereits registriert.
                 * Jetzt wird nur geprüft, ob die Registry
                 * erreichbar ist.
                 */

                if (
                    HalDo.appRegistry
                ) {

                    HalDo.emit(
                        "apps:ready",
                        {
                            count:
                                HalDo.appRegistry
                                    .list({
                                        enabledOnly:
                                            true
                                    })
                                    .length
                        }
                    );

                }


                this.setStage(
                    "pwa",
                    76
                );

                await pwa.initialize();


                this.setStage(
                    "desktop",
                    88
                );

                migration.run();

                rollback.saveCheckpoint();

                cosmic.initialize();


                /*
                 * Desktop aktualisieren.
                 */

                if (
                    HalDo.navigation &&
                    typeof HalDo.navigation.renderQuickApps ===
                    "function"
                ) {

                    HalDo.navigation.renderQuickApps();

                }

                if (
                    HalDo.taskbar &&
                    typeof HalDo.taskbar.render ===
                    "function"
                ) {

                    HalDo.taskbar.render();

                }


                this.setStage(
                    "ready",
                    100
                );

                this.finished =
                    true;

                HalDo.emit(
                    "system:ready",
                    {
                        version:
                            "20.0.0"
                    }
                );

                HalDo.emit(
                    "boot:complete"
                );

                this.showDesktop();

                /*
                 * Cosmic Welcome erst nach erfolgreichem
                 * Systemstart anzeigen.
                 */

                window.setTimeout(
                    () => {

                        cosmic.show();

                    },
                    150
                );

            } catch (error) {

                this.fail(
                    error
                );

                /*
                 * Kein künstliches "System wird gestartet …"
                 * als Endzustand.
                 */

                return false;

            }

            return true;

        };


    /* =========================================================
       PUBLIC SYSTEM API
       ========================================================= */

    window.HalDoBoot =
        boot;

    window.HalDoPWA =
        pwa;

    window.HalDoBackup =
        backup;

    window.HalDoMigration =
        migration;

    window.HalDoRollback =
        rollback;

    if (
        window.HalDoOS
    ) {

        window.HalDoOS.boot =
            boot;

        window.HalDoOS.pwa =
            pwa;

        window.HalDoOS.backup =
            backup;

        window.HalDoOS.migration =
            migration;

        window.HalDoOS.rollback =
            rollback;

    }


    /* =========================================================
       BOOT MODULE
       ========================================================= */

    if (
        HalDo.kernel &&
        typeof HalDo.kernel.register ===
        "function"
    ) {

        HalDo.kernel.register(
            "boot-orchestrator",
            {

                name:
                    "HalDo Boot Orchestrator",

                version:
                    "20.0.0",

                autoStart:
                    false,

                async init() {

                    /*
                     * Der eigentliche Start wird
                     * zentral unten ausgelöst.
                     */

                    HalDo.emit(
                        "boot-orchestrator:ready"
                    );

                }

            }
        );

    }


    /* =========================================================
       START ONLY AFTER DOM READY
       ========================================================= */

    const start =
        () => {

            /*
             * Verhindert einen mehrfachen Start,
             * auch wenn andere vorhandene Dateien
             * ebenfalls DOMContentLoaded verwenden.
             */

            if (
                boot.started
            ) {

                return;

            }

            boot.start();

        };


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            start,
            {
                once:
                    true
            }
        );

    } else {

        window.setTimeout(
            start,
            0
        );

    }


})();

<script>
"use strict";

(function () {

    const HalDo =
        window.HalDo;

    if (!HalDo) {
        return;
    }


    /* =====================================================
       BOOT UI CONNECTION
       ===================================================== */

    const progress =
        document.querySelector(
            "[data-boot-progress]"
        );

    const message =
        document.querySelector(
            "[data-boot-message]"
        );

    const boot =
        HalDo.boot;


    if (
        boot
    ) {

        HalDo.on(
            "boot:stage",
            ({
                stage,
                progress: value
            }) => {

                if (
                    progress
                ) {

                    progress.style.width =
                        `${Math.max(
                            0,
                            Math.min(
                                100,
                                value
                            )
                        )}%`;

                }

                if (
                    message
                ) {

                    const labels = {

                        foundation:
                            "HalDo Foundation wird geladen …",

                        storage:
                            "Speicher wird initialisiert …",

                        registry:
                            "App Registry wird geladen …",

                        system:
                            "System wird initialisiert …",

                        runtime:
                            "App Runtime wird verbunden …",

                        ai:
                            "HalDo AI wird vorbereitet …",

                        apps:
                            "System-Apps werden aktiviert …",

                        pwa:
                            "PWA-System wird geprüft …",

                        desktop:
                            "Desktop wird vorbereitet …",

                        ready:
                            "HalDo AI OS ist bereit."

                    };

                    message.textContent =
                        labels[stage] ||
                        `HalDo AI OS: ${stage}`;

                }

            }
        );

    }


    /* =====================================================
       SYSTEM STATUS
       ===================================================== */

    HalDo.status =
        HalDo.status ||
        {

            get() {

                return {

                    version:
                        "20.0.0",

                    boot:
                        {

                            stage:
                                HalDo.boot?.stage ||
                                "unknown",

                            progress:
                                HalDo.boot?.progress ||
                                0,

                            finished:
                                Boolean(
                                    HalDo.boot?.finished
                                )

                        },

                    online:
                        navigator.onLine,

                    language:
                        HalDo.storage.get(
                            "settings:language",
                            "de"
                        ),

                    apps:
                        HalDo.appRegistry
                            ?.list({
                                enabledOnly:
                                    true
                            })
                            .length ||
                        0,

                    timestamp:
                        Date.now()

                };

            }

        };


    window.HalDoStatus =
        HalDo.status;


    /* =====================================================
       GLOBAL ERROR BRIDGE
       ===================================================== */

    window.addEventListener(
        "error",
        event => {

            const error =
                event.error ||
                new Error(
                    event.message ||
                    "Unbekannter Browserfehler"
                );

            if (
                HalDo.kernel &&
                typeof HalDo.kernel.recordError ===
                "function"
            ) {

                HalDo.kernel.recordError(
                    error,
                    "window"
                );

            }

            HalDo.emit(
                "runtime:error",
                {
                    error
                }
            );

        }
    );


    window.addEventListener(
        "unhandledrejection",
        event => {

            const reason =
                event.reason ||
                new Error(
                    "Unhandled Promise Rejection"
                );

            if (
                HalDo.kernel &&
                typeof HalDo.kernel.recordError ===
                "function"
            ) {

                HalDo.kernel.recordError(
                    reason,
                    "promise"
                );

            }

            HalDo.emit(
                "runtime:promise-error",
                {
                    reason
                }
            );

        }
    );


    /* =====================================================
       ONLINE / OFFLINE
       ===================================================== */

    window.addEventListener(
        "online",
        () => {

            HalDo.emit(
                "network:online"
            );

        }
    );


    window.addEventListener(
        "offline",
        () => {

            HalDo.emit(
                "network:offline"
            );

        }
    );


    /* =====================================================
       VISIBILITY / APP LIFECYCLE
       ===================================================== */

    document.addEventListener(
        "visibilitychange",
        () => {

            HalDo.emit(
                "system:visibility",
                {
                    visible:
                        !document.hidden
                }
            );

        }
    );


    /* =====================================================
       KEYBOARD SHORTCUTS
       ===================================================== */

    document.addEventListener(
        "keydown",
        event => {

            /*
             * ESC schließt das aktuell geöffnete Fenster,
             * sofern der vorhandene Window Manager dies anbietet.
             */

            if (
                event.key ===
                "Escape"
            ) {

                if (
                    HalDo.windowManager &&
                    typeof HalDo.windowManager.closeActive ===
                    "function"
                ) {

                    HalDo.windowManager.closeActive();

                }

            }


            /*
             * Ctrl/Cmd + K:
             * Launcher bzw. AI-Eingabe.
             */

            if (
                (
                    event.ctrlKey ||
                    event.metaKey
                ) &&
                event.key.toLowerCase() ===
                "k"
            ) {

                event.preventDefault();

                if (
                    HalDo.launcher &&
                    typeof HalDo.launcher.focus ===
                    "function"
                ) {

                    HalDo.launcher.focus();

                } else if (
                    HalDo.ai &&
                    typeof HalDo.ai.focusInput ===
                    "function"
                ) {

                    HalDo.ai.focusInput();

                }

            }

        }
    );


    /* =====================================================
       SAFE OPEN API
       ===================================================== */

    HalDo.openApp =
        async function (
            appId
        ) {

            if (
                !appId
            ) {

                return false;

            }

            if (
                HalDo.appManager &&
                typeof HalDo.appManager.open ===
                "function"
            ) {

                return HalDo.appManager.open(
                    appId
                );

            }

            if (
                HalDo.router &&
                typeof HalDo.router.navigate ===
                "function"
            ) {

                return HalDo.router.navigate(
                    appId
                );

            }

            return false;

        };


    window.openHalDoApp =
        HalDo.openApp;


    /* =====================================================
       SAFE SYSTEM STATUS API
       ===================================================== */

    HalDo.getSystemStatus =
        function () {

            return HalDo.status.get();

        };


    /* =====================================================
       INITIALIZE BOOT UI
       ===================================================== */

    if (
        HalDo.cosmicWelcome &&
        typeof HalDo.cosmicWelcome.initialize ===
        "function"
    ) {

        HalDo.cosmicWelcome.initialize();

    }


    /* =====================================================
       FINAL READY EVENT
       ===================================================== */

    HalDo.on(
        "system:ready",
        () => {

            document.documentElement
                .classList.add(
                    "haldo-system-ready"
                );

            document.body?.classList.add(
                "haldo-system-ready"
            );

        }
    );


    /* =====================================================
       INITIAL HTML FALLBACK
       ===================================================== */

    /*
     * Falls die vorhandene Desktop-Datei keinen eigenen
     * Root erstellt, bleibt der Shell-Container verfügbar.
     */

    const desktop =
        document.querySelector(
            "[data-haldo-desktop]"
        );

    if (
        desktop
    ) {

        desktop.dataset.version =
            "20.0.0";

    }


    /* =====================================================
       FINAL CONNECTION MESSAGE
       ===================================================== */

    HalDo.emit(
        "index:complete",
        {

            version:
                "20.0.0",

            shell:
                true,

            runtime:
                Boolean(
                    HalDo.appManager
                ),

            registry:
                Boolean(
                    HalDo.appRegistry
                ),

            kernel:
                Boolean(
                    HalDo.kernel
                ),

            system:
                Boolean(
                    HalDo.system
                ),

            ai:
                Boolean(
                    HalDo.ai
                )

        }
    );

})();
</script>
