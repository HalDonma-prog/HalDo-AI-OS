<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>

    <!-- =========================================================
         HALDO AI OS 20
         PROFESSIONAL ULTIMATE FOUNDATION
         ========================================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#05070d"
    >

    <meta
        name="color-scheme"
        content="dark"
    >

    <meta
        name="application-name"
        content="HalDo AI OS 20"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS 20"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – Professional Ultimate AI Operating System"
    >

    <title>
        HalDo AI OS 20
    </title>


    <!-- =========================================================
         BOOT / PRELOAD
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         HALDO LOGO
         ========================================================= -->

    <link
        rel="preload"
        as="image"
        href="assets/logo/logo.png"
    >


    <!-- =========================================================
         EXISTING HALDO CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="css/haldo-logo-engine.css"
    >


    <style>

        /* =====================================================
           HALDO AI OS 20
           GLOBAL FOUNDATION
           ===================================================== */

        :root {

            --haldo-bg:
                #05070d;

            --haldo-bg-secondary:
                #090d16;

            --haldo-surface:
                rgba(13, 18, 30, 0.88);

            --haldo-surface-strong:
                rgba(17, 23, 38, 0.96);

            --haldo-border:
                rgba(255, 255, 255, 0.09);

            --haldo-border-strong:
                rgba(255, 255, 255, 0.16);

            --haldo-text:
                #f5f7fb;

            --haldo-text-secondary:
                rgba(245, 247, 251, 0.68);

            --haldo-text-muted:
                rgba(245, 247, 251, 0.45);

            --haldo-cyan:
                #42e6ff;

            --haldo-blue:
                #4d7cff;

            --haldo-purple:
                #9b6cff;

            --haldo-red:
                #ff4d6d;

            --haldo-green:
                #42f5a7;

            --haldo-warning:
                #ffd166;

            --haldo-radius:
                18px;

            --haldo-radius-small:
                12px;

            --haldo-shadow:
                0 24px 80px
                rgba(0, 0, 0, 0.45);

            --haldo-transition:
                180ms ease;

            --haldo-sidebar-width:
                82px;

            --haldo-topbar-height:
                68px;

        }


        /* =====================================================
           RESET
           ===================================================== */

        *,
        *::before,
        *::after {

            box-sizing:
                border-box;

        }


        html {

            width:
                100%;

            height:
                100%;

            margin:
                0;

            padding:
                0;

            background:
                var(--haldo-bg);

            color:
                var(--haldo-text);

            font-family:
                "Inter",
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing:
                antialiased;

            text-rendering:
                optimizeLegibility;

        }


        body {

            width:
                100%;

            min-width:
                320px;

            height:
                100%;

            min-height:
                100%;

            margin:
                0;

            padding:
                0;

            overflow:
                hidden;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(66, 230, 255, 0.055),
                    transparent 34%
                ),
                linear-gradient(
                    145deg,
                    #03050a 0%,
                    #070b13 48%,
                    #04060b 100%
                );

        }


        button,
        input,
        textarea,
        select {

            font:
                inherit;

        }


        button {

            border:
                0;

            outline:
                none;

            cursor:
                pointer;

        }


        img {

            max-width:
                100%;

            display:
                block;

        }


        ::selection {

            background:
                rgba(66, 230, 255, 0.25);

            color:
                #ffffff;

        }


        /* =====================================================
           ROOT SHELL
           ===================================================== */

        #haldo-os {

            position:
                relative;

            width:
                100%;

            height:
                100dvh;

            min-height:
                100vh;

            overflow:
                hidden;

            isolation:
                isolate;

        }


        /* =====================================================
           BACKGROUND LAYER
           ===================================================== */

        .haldo-background {

            position:
                absolute;

            inset:
                0;

            z-index:
                -10;

            pointer-events:
                none;

            overflow:
                hidden;

        }


        .haldo-background::before {

            content:
                "";

            position:
                absolute;

            width:
                70vw;

            height:
                70vw;

            max-width:
                900px;

            max-height:
                900px;

            left:
                50%;

            top:
                42%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle,
                    rgba(66, 230, 255, 0.075)
                    0%,
                    rgba(66, 230, 255, 0.025)
                    32%,
                    transparent
                    70%
                );

            filter:
                blur(8px);

        }


        .haldo-background-grid {

            position:
                absolute;

            inset:
                0;

            opacity:
                0.18;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size:
                48px 48px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 20%,
                    black 80%,
                    transparent
                );

        }


        /* =====================================================
           BOOT SCREEN
           ===================================================== */

        #haldo-boot-screen {

            position:
                fixed;

            inset:
                0;

            z-index:
                10000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #03050a;

            transition:
                opacity 500ms ease,
                visibility 500ms ease;

        }


        #haldo-boot-screen.is-hidden {

            opacity:
                0;

            visibility:
                hidden;

            pointer-events:
                none;

        }


        .haldo-boot-content {

            width:
                min(90vw, 520px);

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

        }


        .haldo-boot-logo {

            position:
                relative;

            width:
                clamp(130px, 30vw, 210px);

            aspect-ratio:
                1 / 1;

            display:
                grid;

            place-items:
                center;

            margin-bottom:
                30px;

        }


        .haldo-boot-logo::before {

            content:
                "";

            position:
                absolute;

            inset:
                -22px;

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle,
                    rgba(66, 230, 255, 0.18),
                    transparent 67%
                );

            filter:
                blur(8px);

            animation:
                haldoBootGlow 2.2s ease-in-out infinite;

        }


        .haldo-boot-logo::after {

            content:
                "";

            position:
                absolute;

            inset:
                -10px;

            border:
                1px solid
                rgba(66, 230, 255, 0.35);

            border-radius:
                50%;

            box-shadow:
                0 0 25px
                rgba(66, 230, 255, 0.18);

            animation:
                haldoBootOrbit 4s linear infinite;

        }


        .haldo-boot-logo img {

            position:
                relative;

            z-index:
                2;

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;

            border-radius:
                50%;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(66, 230, 255, 0.38)
                );

        }


        .haldo-boot-title {

            margin:
                0;

            font-size:
                clamp(24px, 5vw, 38px);

            font-weight:
                800;

            letter-spacing:
                -0.04em;

        }


        .haldo-boot-version {

            margin-top:
                8px;

            color:
                var(--haldo-cyan);

            font-size:
                12px;

            font-weight:
                700;

            letter-spacing:
                0.18em;

            text-transform:
                uppercase;

        }


        .haldo-boot-status {

            margin-top:
                28px;

            min-height:
                22px;

            color:
                var(--haldo-text-secondary);

            font-size:
                13px;

        }


        .haldo-boot-progress {

            width:
                min(360px, 78vw);

            height:
                3px;

            margin-top:
                16px;

            overflow:
                hidden;

            border-radius:
                99px;

            background:
                rgba(255,255,255,0.08);

        }


        .haldo-boot-progress-bar {

            width:
                0%;

            height:
                100%;

            border-radius:
                inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--haldo-cyan),
                    var(--haldo-blue),
                    var(--haldo-purple)
                );

            box-shadow:
                0 0 16px
                rgba(66, 230, 255, 0.45);

            transition:
                width 350ms ease;

        }


        @keyframes haldoBootGlow {

            0%,
            100% {

                transform:
                    scale(0.92);

                opacity:
                    0.55;

            }

            50% {

                transform:
                    scale(1.08);

                opacity:
                    1;

            }

        }


        @keyframes haldoBootOrbit {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =====================================================
           MAIN DESKTOP
           ===================================================== */

        #haldo-desktop {

            position:
                absolute;

            inset:
                0;

            display:
                grid;

            grid-template-columns:
                var(--haldo-sidebar-width)
                1fr;

            grid-template-rows:
                var(--haldo-topbar-height)
                1fr;

            opacity:
                0;

            visibility:
                hidden;

            transition:
                opacity 450ms ease,
                visibility 450ms ease;

        }


        #haldo-desktop.is-ready {

            opacity:
                1;

            visibility:
                visible;

        }


        /* =====================================================
           SIDEBAR
           ===================================================== */

        #haldo-sidebar {

            grid-column:
                1;

            grid-row:
                1 / 3;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            padding:
                14px 10px;

            border-right:
                1px solid
                var(--haldo-border);

            background:
                rgba(5, 8, 15, 0.84);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

        }


        .haldo-sidebar-logo {

            width:
                48px;

            height:
                48px;

            margin-bottom:
                18px;

            padding:
                5px;

            border:
                1px solid
                rgba(66, 230, 255, 0.18);

            border-radius:
                50%;

            background:
                rgba(255,255,255,0.025);

            box-shadow:
                0 0 24px
                rgba(66, 230, 255, 0.08);

        }


        .haldo-sidebar-logo img {

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;

            border-radius:
                50%;

        }


        .haldo-sidebar-nav {

            width:
                100%;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            gap:
                8px;

        }


        .haldo-sidebar-button {

            position:
                relative;

            width:
                52px;

            height:
                52px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                3px;

            border:
                1px solid
                transparent;

            border-radius:
                15px;

            color:
                var(--haldo-text-muted);

            background:
                transparent;

            transition:
                transform var(--haldo-transition),
                color var(--haldo-transition),
                background var(--haldo-transition),
                border-color var(--haldo-transition);

        }


        .haldo-sidebar-button:hover {

            transform:
                translateY(-1px);

            color:
                var(--haldo-text);

            background:
                rgba(255,255,255,0.055);

            border-color:
                var(--haldo-border);

        }


        .haldo-sidebar-button.is-active {

            color:
                var(--haldo-cyan);

            background:
                rgba(66, 230, 255, 0.075);

            border-color:
                rgba(66, 230, 255, 0.14);

        }


        .haldo-sidebar-icon {

            font-size:
                19px;

            line-height:
                1;

        }


        .haldo-sidebar-label {

            font-size:
                8px;

            font-weight:
                600;

            letter-spacing:
                0.02em;

        }


        .haldo-sidebar-spacer {

            flex:
                1;

        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        #haldo-topbar {

            grid-column:
                2;

            grid-row:
                1;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                16px;

            padding:
                0 20px;

            border-bottom:
                1px solid
                var(--haldo-border);

            background:
                rgba(5, 8, 15, 0.64);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

        }


        .haldo-topbar-left,
        .haldo-topbar-right {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .haldo-system-name {

            display:
                flex;

            flex-direction:
                column;

            min-width:
                0;

        }


        .haldo-system-name strong {

            font-size:
                14px;

            font-weight:
                750;

            white-space:
                nowrap;

        }


        .haldo-system-name span {

            margin-top:
                2px;

            color:
                var(--haldo-text-muted);

            font-size:
                10px;

            white-space:
                nowrap;

        }


        .haldo-topbar-button {

            width:
                42px;

            height:
                42px;

            display:
                grid;

            place-items:
                center;

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                13px;

            color:
                var(--haldo-text-secondary);

            background:
                rgba(255,255,255,0.035);

            transition:
                all var(--haldo-transition);

        }


        .haldo-topbar-button:hover {

            color:
                var(--haldo-text);

            border-color:
                var(--haldo-border-strong);

            background:
                rgba(255,255,255,0.07);

        }


        /* =====================================================
           DESKTOP WORKSPACE
           ===================================================== */

        #haldo-workspace {

            position:
                relative;

            grid-column:
                2;

            grid-row:
                2;

            overflow:
                hidden;

        }


        #haldo-app-layer {

            position:
                absolute;

            inset:
                0;

            overflow:
                hidden;

            pointer-events:
                none;

        }


        #haldo-app-layer > * {

            pointer-events:
                auto;

        }


        /* =====================================================
           HOME
           ===================================================== */

        #haldo-home {

            position:
                absolute;

            inset:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                30px;

            overflow:
                auto;

        }


        .haldo-home-content {

            width:
                min(100%, 900px);

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            text-align:
                center;

        }


        .haldo-home-logo {

            position:
                relative;

            width:
                clamp(150px, 28vw, 230px);

            aspect-ratio:
                1 / 1;

            display:
                grid;

            place-items:
                center;

            margin-bottom:
                28px;

        }


        .haldo-home-logo::before {

            content:
                "";

            position:
                absolute;

            inset:
                -35px;

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle,
                    rgba(66, 230, 255, 0.16),
                    transparent 68%
                );

            filter:
                blur(12px);

            animation:
                haldoHomeGlow 3s ease-in-out infinite;

        }


        .haldo-home-logo img {

            position:
                relative;

            z-index:
                2;

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;

            border-radius:
                50%;

            filter:
                drop-shadow(
                    0 0 24px
                    rgba(66, 230, 255, 0.32)
                );

        }


        @keyframes haldoHomeGlow {

            0%,
            100% {

                opacity:
                    0.55;

                transform:
                    scale(0.96);

            }

            50% {

                opacity:
                    1;

                transform:
                    scale(1.05);

            }

        }


        .haldo-home-title {

            margin:
                0;

            font-size:
                clamp(30px, 6vw, 56px);

            line-height:
                1;

            font-weight:
                800;

            letter-spacing:
                -0.055em;

        }


        .haldo-home-subtitle {

            margin:
                14px 0 0;

            color:
                var(--haldo-text-secondary);

            font-size:
                clamp(13px, 2vw, 16px);

        }


        .haldo-home-status {

            display:
                flex;

            flex-wrap:
                wrap;

            justify-content:
                center;

            gap:
                8px;

            margin-top:
                26px;

        }


        .haldo-status-pill {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            min-height:
                30px;

            padding:
                0 11px;

            border:
                1px solid
                var(--haldo-border);

            border-radius:
                99px;

            color:
                var(--haldo-text-secondary);

            background:
                rgba(255,255,255,0.035);

            font-size:
                10px;

        }


        .haldo-status-dot {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--haldo-warning);

            box-shadow:
                0 0 8px
                currentColor;

        }


        .haldo-status-dot.is-online {

            background:
                var(--haldo-green);

        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 720px) {

            :root {

                --haldo-sidebar-width:
                    68px;

                --haldo-topbar-height:
                    60px;

            }


            #haldo-sidebar {

                padding:
                    10px 7px;

            }


            .haldo-sidebar-logo {

                width:
                    42px;

                height:
                    42px;

            }


            .haldo-sidebar-button {

                width:
                    46px;

                height:
                    46px;

                border-radius:
                    13px;

            }


            .haldo-sidebar-label {

                display:
                    none;

            }


            #haldo-topbar {

                padding:
                    0 12px;

            }


            .haldo-system-name span {

                display:
                    none;

            }


            .haldo-topbar-button {

                width:
                    38px;

                height:
                    38px;

            }


            #haldo-home {

                padding:
                    20px;

            }

        }


        @media (max-width: 480px) {

            :root {

                --haldo-sidebar-width:
                    60px;

            }


            .haldo-sidebar-button {

                width:
                    42px;

                height:
                    42px;

            }


            .haldo-sidebar-icon {

                font-size:
                    17px;

            }


            .haldo-home-title {

                font-size:
                    34px;

            }

        }

    </style>

</head>


<body>

    <!-- =========================================================
         HALDO AI OS 20 ROOT
         ========================================================= -->

    <div
        id="haldo-os"
        data-haldo-version="20.0.0"
        data-haldo-edition="Professional Ultimate Foundation"
    >


        <!-- =====================================================
             BACKGROUND
             ===================================================== -->

        <div
            class="haldo-background"
            aria-hidden="true"
        >

            <div
                class="haldo-background-grid"
            ></div>

        </div>


        <!-- =====================================================
             BOOT SCREEN
             ===================================================== -->

        <section
            id="haldo-boot-screen"
            aria-label="HalDo AI OS 20 Startvorgang"
        >

            <div
                class="haldo-boot-content"
            >

                <div
                    class="haldo-boot-logo"
                >

                    <img
                        src="assets/logo/logo.png"
                        alt="HalDo AI"
                        draggable="false"
                    >

                </div>


                <h1
                    class="haldo-boot-title"
                >
                    HalDo AI
                </h1>


                <div
                    class="haldo-boot-version"
                >
                    AI OS 20 · Professional Ultimate
                </div>


                <div
                    id="haldo-boot-status"
                    class="haldo-boot-status"
                >
                    HalDo AI OS 20 wird gestartet ...
                </div>


                <div
                    class="haldo-boot-progress"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >

                    <div
                        id="haldo-boot-progress-bar"
                        class="haldo-boot-progress-bar"
                    ></div>

                </div>

            </div>

        </section>


        <!-- =====================================================
             MAIN DESKTOP
             ===================================================== -->

        <main
            id="haldo-desktop"
            aria-label="HalDo AI OS 20 Desktop"
        >


            <!-- =================================================
                 SIDEBAR
                 ================================================= -->

            <aside
                id="haldo-sidebar"
                aria-label="HalDo Navigation"
            >

                <button
                    id="haldo-home-button"
                    class="haldo-sidebar-logo"
                    type="button"
                    title="HalDo Startseite"
                    aria-label="HalDo Startseite"
                >

                    <img
                        src="assets/logo/logo.png"
                        alt="HalDo"
                        draggable="false"
                    >

                </button>


                <nav
                    class="haldo-sidebar-nav"
                    aria-label="Hauptnavigation"
                >

                    <button
                        id="sidebar-ai"
                        class="haldo-sidebar-button is-active"
                        type="button"
                        title="HalDo AI"
                        aria-label="HalDo AI"

    <script>

    (() => {

        "use strict";


        /* =====================================================
           HALDO UI NAMESPACE
           ===================================================== */

        if (!window.HalDoOS) {
            window.HalDoOS = {};
        }


        const UI = {

            version:
                "20.0.0",

            ready:
                false,

            menuOpen:
                false,

            systemOpen:
                false,

            activeApp:
                null,

            activeWindow:
                null

        };


        window.HalDoUI =
            window.HalDoUI ||
            UI;


        window.HalDoOS.ui =
            window.HalDoUI;


        /* =====================================================
           DOM HELPERS
           ===================================================== */

        function $(id) {

            return document.getElementById(id);

        }


        function createElement(
            tag,
            className = "",
            text = ""
        ) {

            const element =
                document.createElement(tag);


            if (className) {

                element.className =
                    className;

            }


            if (text) {

                element.textContent =
                    text;

            }


            return element;

        }


        /* =====================================================
           NOTIFICATION SYSTEM
           ===================================================== */

        function notify(
            title,
            message,
            options = {}
        ) {

            const layer =
                $("haldo-notification-layer");


            if (!layer) {
                return null;
            }


            const notification =
                createElement(
                    "article",
                    "haldo-notification"
                );


            notification.setAttribute(
                "role",
                "status"
            );


            const header =
                createElement(
                    "div",
                    "haldo-notification-header"
                );


            const titleElement =
                createElement(
                    "strong",
                    "haldo-notification-title",
                    String(title || "HalDo")
                );


            const closeButton =
                createElement(
                    "button",
                    "haldo-notification-close",
                    "×"
                );


            closeButton.type =
                "button";


            closeButton.setAttribute(
                "aria-label",
                "Benachrichtigung schließen"
            );


            header.append(
                titleElement,
                closeButton
            );


            const body =
                createElement(
                    "div",
                    "haldo-notification-message",
                    String(message || "")
                );


            notification.append(
                header,
                body
            );


            layer.appendChild(
                notification
            );


            requestAnimationFrame(
                () => {

                    notification.classList.add(
                        "is-visible"
                    );

                }
            );


            const remove =
                () => {

                    notification.classList.remove(
                        "is-visible"
                    );


                    setTimeout(
                        () => {

                            notification.remove();

                        },
                        250
                    );

                };


            closeButton.addEventListener(
                "click",
                remove
            );


            const duration =
                Number.isFinite(
                    Number(options.duration)
                )
                ? Number(options.duration)
                : 4000;


            if (duration > 0) {

                setTimeout(
                    remove,
                    duration
                );

            }


            return notification;

        }


        UI.notify =
            notify;


        /* =====================================================
           APP LAYER
           ===================================================== */

        function getAppLayer() {

            return $(
                "haldo-app-layer"
            );

        }


        function clearAppLayer() {

            const layer =
                getAppLayer();


            if (!layer) {
                return;
            }


            layer
                .querySelectorAll(
                    ".haldo-ui-window"
                )
                .forEach(
                    windowElement => {

                        windowElement.remove();

                    }
                );

        }


        /* =====================================================
           WINDOW SYSTEM FOUNDATION
           ===================================================== */

        let windowSequence =
            0;


        function openAppWindow(
            title,
            content,
            options = {}
        ) {

            const layer =
                getAppLayer();


            if (!layer) {

                console.warn(
                    "[HalDo UI] App-Layer fehlt."
                );

                return null;

            }


            windowSequence += 1;


            const windowId =
                options.id ||
                `haldo-window-${windowSequence}`;


            const windowElement =
                createElement(
                    "section",
                    "haldo-ui-window"
                );


            windowElement.id =
                windowId;


            windowElement.dataset.title =
                title || "HalDo App";


            windowElement.dataset.app =
                options.app ||
                "";


            windowElement.setAttribute(
                "role",
                "dialog"
            );


            windowElement.setAttribute(
                "aria-label",
                title || "HalDo App"
            );


            const header =
                createElement(
                    "header",
                    "haldo-ui-window-header"
                );


            const titleElement =
                createElement(
                    "div",
                    "haldo-ui-window-title",
                    title || "HalDo App"
                );


            const controls =
                createElement(
                    "div",
                    "haldo-ui-window-controls"
                );


            const minimize =
                createElement(
                    "button",
                    "haldo-ui-window-button",
                    "−"
                );


            const maximize =
                createElement(
                    "button",
                    "haldo-ui-window-button",
                    "□"
                );


            const close =
                createElement(
                    "button",
                    "haldo-ui-window-button",
                    "×"
                );


            minimize.type =
                "button";


            maximize.type =
                "button";


            close.type =
                "button";


            minimize.setAttribute(
                "aria-label",
                "Fenster minimieren"
            );


            maximize.setAttribute(
                "aria-label",
                "Fenster maximieren"
            );


            close.setAttribute(
                "aria-label",
                "Fenster schließen"
            );


            controls.append(
                minimize,
                maximize,
                close
            );


            header.append(
                titleElement,
                controls
            );


            const contentElement =
                createElement(
                    "div",
                    "haldo-ui-window-content"
                );


            if (
                content instanceof
                HTMLElement
            ) {

                contentElement.append(
                    content
                );

            } else {

                contentElement.innerHTML =
                    String(
                        content || ""
                    );

            }


            windowElement.append(
                header,
                contentElement
            );


            layer.appendChild(
                windowElement
            );


            UI.activeWindow =
                windowElement;


            UI.activeApp =
                options.app ||
                title ||
                null;


            function activate() {

                layer
                    .querySelectorAll(
                        ".haldo-ui-window"
                    )
                    .forEach(
                        item => {

                            item.classList.remove(
                                "is-active"
                            );

                        }
                    );


                windowElement.classList.add(
                    "is-active"
                );


                UI.activeWindow =
                    windowElement;


                UI.activeApp =
                    options.app ||
                    title ||
                    null;

            }


            windowElement.addEventListener(
                "pointerdown",
                activate
            );


            minimize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    windowElement.classList.toggle(
                        "is-minimized"
                    );

                }
            );


            maximize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    windowElement.classList.toggle(
                        "is-maximized"
                    );

                }
            );


            close.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    closeAppWindow(
                        windowElement
                    );

                }
            );


            activate();


            return windowElement;

        }


        function closeAppWindow(
            windowElement
        ) {

            if (
                !windowElement
            ) {
                return;
            }


            const appName =
                windowElement.dataset.app ||
                windowElement.dataset.title ||
                "";


            windowElement.remove();


            if (
                UI.activeWindow ===
                windowElement
            ) {

                UI.activeWindow =
                    null;

                UI.activeApp =
                    null;

            }


            try {

                const router =
                    window.HalDoAppRouter ||
                    window.HalDoOS?.appRouter;


                if (
                    router &&
                    typeof router.close ===
                    "function"
                ) {

                    router.close(
                        appName
                    );

                }

            } catch (error) {

                console.warn(
                    "[HalDo UI] Router close:",
                    error
                );

            }

        }


        UI.openAppWindow =
            openAppWindow;


        UI.closeAppWindow =
            closeAppWindow;


        /* =====================================================
           SYSTEM PANEL
           ===================================================== */

        function openSystem() {

            UI.systemOpen =
                true;


            let panel =
                $("haldo-system-panel");


            if (!panel) {

                panel =
                    createElement(
                        "section",
                        "haldo-system-panel"
                    );


                panel.id =
                    "haldo-system-panel";


                panel.setAttribute(
                    "role",
                    "dialog"
                );


                panel.setAttribute(
                    "aria-label",
                    "HalDo Systemstatus"
                );


                panel.innerHTML = `

                    <div class="haldo-system-panel-header">

                        <div>

                            <strong>
                                HalDo System
                            </strong>

                            <span>
                                Live Systemstatus
                            </span>

                        </div>

                        <button
                            type="button"
                            id="haldo-system-close"
                            aria-label="System schließen"
                        >
                            ×
                        </button>

                    </div>


                    <div
                        class="haldo-system-panel-grid"
                    >

                        <div
                            class="haldo-system-status-card"
                        >
                            <span>System</span>
                            <strong id="status-system">
                                Prüfe ...
                            </strong>
                        </div>


                        <div
                            class="haldo-system-status-card"
                        >
                            <span>Kernel</span>
                            <strong id="status-kernel">
                                Prüfe ...
                            </strong>
                        </div>


                        <div
                            class="haldo-system-status-card"
                        >
                            <span>AI</span>
                            <strong id="status-ai">
                                Prüfe ...
                            </strong>
                        </div>


                        <div
                            class="haldo-system-status-card"
                        >
                            <span>Apps</span>
                            <strong id="status-apps">
                                Prüfe ...
                            </strong>
                        </div>


                        <div
                            class="haldo-system-status-card"
                        >
                            <span>Netzwerk</span>
                            <strong id="status-network">
                                Prüfe ...
                            </strong>
                        </div>

                    </div>

                `;


                const modalLayer =
                    $("haldo-modal-layer");


                if (modalLayer) {

                    modalLayer.appendChild(
                        panel
                    );

                }


                const closeButton =
                    $("haldo-system-close");


                if (closeButton) {

                    closeButton.addEventListener(
                        "click",
                        closeSystem
                    );

                }

            }


            panel.classList.add(
                "is-open"
            );


            updateSystemStatus();

        }


        function closeSystem() {

            UI.systemOpen =
                false;


            const panel =
                $("haldo-system-panel");


            if (panel) {

                panel.classList.remove(
                    "is-open"
                );

            }

        }


        function updateSystemStatus() {

            const kernel =
                !!(
                    window.HalDoKernel ||
                    window.HalDoOS?.kernel
                );


            const system =
                !!(
                    window.HalDoSystem ||
                    window.HalDoOS?.system
                );


            const appManager =
                !!(
                    window.HalDoAppManager ||
                    window.HalDoOS?.appManager
                );


            const ai =
                !!(
                    window.HalDoAI ||
                    window.HalDoOS?.ai ||
                    window.HalDoAIEngine
                );


            const network =
                navigator.onLine;


            const values = {

                "status-system":
                    system
                    ? "Verbunden"
                    : "Warten",

                "status-kernel":
                    kernel
                    ? "Verbunden"
                    : "Warten",

                "status-ai":
                    ai
                    ? "Verbunden"
                    : "Warten",

                "status-apps":
                    appManager
                    ? "Verbunden"
                    : "Warten",

                "status-network":
                    network
                    ? "Online"
                    : "Offline"

            };


            Object.entries(
                values
            ).forEach(
                ([id, value]) => {

                    const element =
                        $(id);


                    if (element) {

                        element.textContent =
                            value;

                    }

                }
            );


            const homeValues = {

                "home-status-system":
                    system
                    ? "Verbunden"
                    : "Startet",

                "home-status-ai":
                    ai
                    ? "Verbunden"
                    : "Bereit",

                "home-status-network":
                    network
                    ? "Online"
                    : "Offline"

            };


            Object.entries(
                homeValues
            ).forEach(
                ([id, value]) => {

                    const element =
                        $(id);


                    if (element) {

                        element.textContent =
                            value;

                    }

                }
            );

        }


        UI.openSystem =
            openSystem;


        UI.closeSystem =
            closeSystem;


        UI.updateSystemStatus =
            updateSystemStatus;


        /* =====================================================
           HOME / MENU
           ===================================================== */

        function openMenu() {

            UI.menuOpen =
                true;


            const home =
                $("haldo-home");


            if (home) {

                home.classList.add(
                    "is-menu-active"
                );

            }

        }


        function closeMenu() {

            UI.menuOpen =
                false;


            const home =
                $("haldo-home");


            if (home) {

                home.classList.remove(
                    "is-menu-active"
                );

            }

        }


        UI.openMenu =
            openMenu;


        UI.closeMenu =
            closeMenu;


        /* =====================================================
           NETWORK EVENTS
           ===================================================== */

        window.addEventListener(
            "online",
            () => {

                updateSystemStatus();

                notify(
                    "Netzwerk",
                    "HalDo AI OS ist wieder online."
                );

            }
        );


        window.addEventListener(
            "offline",
            () => {

                updateSystemStatus();

                notify(
                    "Netzwerk",
                    "HalDo AI OS arbeitet momentan offline."
                );

            }
        );


        /* =====================================================
           ESCAPE
           ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key !==
                    "Escape"
                ) {
                    return;
                }


                closeSystem();


                const activeWindow =
                    UI.activeWindow;


                if (
                    activeWindow
                ) {

                    closeAppWindow(
                        activeWindow
                    );

                getMessages();


            if (!messages) {
                return null;

            const message =
                document.createElement(
                    "article"

            message.className =
                `haldo-ai-message ${sender}`;

                document.createElement(
                    "div"

                "haldo-ai-message-content";


            if (
                options.html === true

                content.innerHTML =
                    String(text || "");

            } else {

                content.textContent =
                    String(text || "");

            }


            message.appendChild(
                content
            );


            messages.appendChild(
                message
            );


            requestAnimationFrame(
                () => {

                    message.classList.add(
                        "is-visible"
                    );


                    messages.scrollTop =
                        messages.scrollHeight;

                }
            );


            return message;

        function setAIState(

                "ready";


            aiState.listening =
                mode ===
                "listening";


            aiState.thinking =
                mode ===
                "thinking";


            aiState.speaking =
                mode ===
                "speaking";


            aiState.busy =
                aiState.listening ||

                window.HalDoAICore ||

                window.HalDoOS?.aiCore ||

        /* =====================================================
           SEND TO EXISTING AI
           ===================================================== */

        async function sendToHalDoAI(
            text
        ) {

            const ai =
                findAI();


            if (!ai) {

                return null;

            }


            try {

                const methods = [

                    "process",

                    "ask",

                    "chat",

                    "respond",

                    "generate",

                    "handleMessage",

                    "sendMessage"

                ];


                for (
                    const method
                    of methods
                ) {

                    if (
                        typeof ai[method] !==
                        "function"
                    ) {

                        continue;

                    }


                    const result =
                        await ai[method](
                            text
                        );


                    if (
                        typeof result ===
                        "string"
                    ) {

                        return result;

                    }


                    if (
                        result &&
                        typeof result.text ===
                        "string"
                    ) {

                        return result.text;

                    }


                    if (
                        result &&
                        typeof result.response ===
                        "string"
                    ) {

                        return result.response;

                    }

                }

            } catch (error) {

                console.error(
                    "[HalDo AI]",
                    error
                );


                try {

                    if (
                        typeof UI.notify ===
                        "function"
                    ) {

                        UI.notify(
                            "HalDo AI",
                            "Beim Verarbeiten der Anfrage ist ein Fehler aufgetreten."
                        );

            return null;

        /* =====================================================
           COMMAND CONNECTION

        async function executeHalDoCommand(
            text
        ) {

            const commands = [

                window.HalDoAICommands,

                window.HalDoCommands,

                window.HalDoOS?.commands

            ];


            for (
                const commandAPI
                of commands
            ) {

                if (!commandAPI) {
                    continue;
                }


                const methods = [

                    "execute",

                    "run",

                    "handle",

                    "process",

                    "executeCommand"

                ];


                for (
                    const method
                    of methods
                ) {

                    if (
                        typeof commandAPI[method] !==
                        "function"
                    ) {

                        continue;

                    }


                    try {

                        const result =
                            await commandAPI[method](
                                text
                            );


                        if (
                            typeof result ===
                            "string" &&
                            result.trim()
                        ) {

                            return result;

                        }


                        if (
                            result &&
                            typeof result.message ===
                            "string"
                        ) {

                            return result.message;

                        }

                    } catch (error) {

                        console.warn(
                            "[HalDo AI Command]",
                            error

                    }

                }

            }


            return null;

            text

            text =
                String(
                    text || ""

            if (!text) {

                return;

            openAI();


            addMessage(
                "user",
                text

            const input =
                getInput();


            if (input) {

            setAIState(
                "thinking",

            const commandResult =
                await executeHalDoCommand(

            if (commandResult) {

                addMessage(
                    "ai",
                    commandResult

                setAIState(
                    "speaking",
                    "HalDo AI antwortet ..."

                speak(

            let response =
                await sendToHalDoAI(

        /* =====================================================

            if (!SpeechRecognition) {

                return false;

            }


            recognition =
                new SpeechRecognition();


            recognition.lang =
                "de-DE";


            recognition.continuous =
                false;


            recognition.interimResults =
                true;


            recognition.onstart =
                () => {

                    setAIState(
                        "listening",

            recognition.onresult =

                        "";


                    for (
                        let index =
                            event.resultIndex;

                        index <
                        event.results.length;

                        index++
                    ) {

                        text +=
                            event.results[index][0]

                    }


                    const input =
                        getInput();


                    if (input) {

                        input.value =
                            text;

                    }


                    const lastResult =
                        event.results[
                            event.results.length - 1
                        ];


                    if (
                        lastResult &&
                        lastResult.isFinal
                    ) {

                        handleMessage(
                            text
                        );

                    }

                };


            recognition.onerror =
                error => {

                    console.warn(
                        "[HalDo Voice]",
                        error
                    );


                    setAIState(
                        "ready",
                        "Voice bereit"
                    );

                };


            recognition.onend =
                () => {

                    if (
                        !aiState.thinking &&
                        !aiState.speaking

                        setAIState(
                            "ready",
                            "Bereit · HalDo AI wartet"
                        );

                    }

            return true;

        function startListening() {

            if (!recognition) {

                if (
                    !setupSpeechRecognition()

                    UI.notify(
                        "Voice",
                        "Die Spracherkennung wird von diesem Browser nicht unterstützt."
                    );


                    return;

                }

            }


            try {

                recognition.start();

            } catch (error) {

                console.warn(
                    "[HalDo Voice]",
                    error
                );

            }

        }


        /* =====================================================

           ===================================================== */

        function speak(
            text

            if (
                !(
                    "speechSynthesis"

            ) {

                setAIState(
                    "ready",
                    "Bereit · HalDo AI wartet"
                );


                return;

            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    String(text || "")
                );


            utterance.lang =
                "de-DE";


            utterance.rate =
                0.98;


            utterance.pitch =
                1;


            utterance.onstart =
                () => {

                    setAIState(
                        "speaking",
                        "HalDo AI spricht ..."
                    );

                };


            utterance.onend =
                () => {

                    setAIState(
                        "ready",
                        "Bereit · HalDo AI wartet"
                    );

                };


            utterance.onerror =
                () => {

                    setAIState(
                        "ready",
                        "Bereit · HalDo AI wartet"
                    );

                };


            window.speechSynthesis.speak(
                utterance
            );

        }


        /* =====================================================
           EVENTS
           ===================================================== */

        document.addEventListener(
            "click",
            event => {

                const target =
                    event.target;


                if (
                    target.closest(
                        "#sidebar-ai"
                    ) ||
                    target.closest(
                        "#top-ai"

                    openAI();

                }


                if (
                    target.closest(
                        "#haldo-ai-close"
                    )
                ) {

                    closeAI();

                }


                if (
                    target.closest(
                        "#haldo-ai-mic"
                    )

                    startListening();

                }

            }
        );


        document.addEventListener(
            "submit",
            event => {

                if (
                    event.target.id !==
                    "haldo-ai-form"
                ) {

                    return;

                }


                event.preventDefault();


                const input =
                    getInput();


                if (input) {

                    handleMessage(
                        input.value
                    );

                }

            }
        );


        /* =====================================================
           KEYBOARD
           ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "/" &&
                    !event.ctrlKey &&
                    !event.metaKey &&
                    document.activeElement !==
                    getInput()
                ) {

                    event.preventDefault();

                    openAI();

                }


                if (
                    event.key === "Escape"

                    closeAI();

                }

            }
        );


        /* =====================================================
           PUBLIC AI API
           ===================================================== */

        UI.openAI =
            openAI;


        UI.closeAI =
            closeAI;


        UI.addMessage =
            addMessage;


        UI.handleMessage =
            handleMessage;


        UI.setAIState =
            setAIState;


        UI.startListening =
            startListening;


        UI.speak =
            speak;


        UI.findAI =
            findAI;


        UI.sendToHalDoAI =
            sendToHalDoAI;


        window.HalDoAIUI =
            UI;


        window.HalDoOS.aiUI =
            UI;


        /* =====================================================
           INITIAL MESSAGE
           ===================================================== */

        function initializeAI() {

            createAIPanel();


            addMessage(
                "ai",
                "Willkommen bei HalDo AI OS 20. " +
                "Ich bin bereit. Wie kann ich dir helfen?"
            );


            setAIState(
                "ready",
                "Bereit · HalDo AI wartet auf dich"
            );


            console.log(
                "%cHalDo AI%c Interface bereit.",
                "color:#42e6ff;font-weight:800;",
                "color:#fff;"
            );

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeAI,
                {
                    once: true
                }
            );

        } else {

            initializeAI();

        }


    })();

        (() => {

            /* ===================================================

                version:
                    "20.0.0",

                edition:
                    "Professional Ultimate Foundation",

                name:
                    "HalDo AI OS",

                logo:
                    "assets/logo/logo.png",

                modulePath:
                    "js/",

                cssPath:
                    "css/",

                    true,
