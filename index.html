<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Web 3.0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>Apps Web 3.0</h1>
        <p id="subtitle">Startseite</p>
    </header>


    <section id="home" class="page">

        <h2>Meine Apps</h2>

        <div class="apps">

            <button class="card" onclick="openChat()">
                💬
                <span>Chat</span>
            </button>


            <button class="card">
                ⚙️
                <span>Einstellungen</span>
            </button>


            <button class="card">
                📁
                <span>Dateien</span>
            </button>


        </div>

    </section>


    <section id="chatPage" class="page hidden">

        <button class="back" onclick="goHome()">
            ← Zurück
        </button>


        <div id="chatBox" class="chat">

            <div class="message bot">
                Willkommen im Chat 👋
            </div>

        </div>


        <div class="input-area">

            <input 
            id="messageInput"
            type="text"
            placeholder="Nachricht schreiben..."
            >


            <button onclick="sendMessage()">
                Senden
            </button>

        </div>

    </section>


</div>


<script src="script.js"></script>

</body>
</html>
