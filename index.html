<script>
"use strict";

/* ============================================================
   UNIVERSAL APP FOUNDATION
   ============================================================ */

HD.appFoundation =
    HD.appFoundation || {};


/* ============================================================
   SAFE ELEMENT
   ============================================================ */

HD.appFoundation.el =
    function(
        tag,
        className,
        text
    ) {

        const element =
            document.createElement(
                tag
            );


        if (
            className
        ) {

            element.className =
                className;

        }


        if (
            text !== undefined
        ) {

            element.textContent =
                text;

        }


        return element;

    };


/* ============================================================
   BUTTON
   ============================================================ */

HD.appFoundation.button =
    function(
        label,
        action,
        className = ""
    ) {

        const button =
            this.el(
                "button",
                "haldo-app-button " +
                className,
                label
            );


        button.type =
            "button";


        if (
            typeof action ===
            "function"
        ) {

            button.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    action(
                        event
                    );

                }
            );

        }


        return button;

    };


/* ============================================================
   CARD
   ============================================================ */

HD.appFoundation.card =
    function(
        title,
        content
    ) {

        const card =
            this.el(
                "article",
                "haldo-app-card"
            );


        if (
            title
        ) {

            const heading =
                this.el(
                    "h3",
                    "haldo-app-card-title",
                    title
                );


            card.append(
                heading
            );

        }


        if (
            content instanceof
            Node
        ) {

            card.append(
                content
            );

        }

        else if (
            content !== undefined
        ) {

            const body =
                this.el(
                    "div",
                    "haldo-app-card-body"
                );


            body.textContent =
                String(
                    content
                );


            card.append(
                body
            );

        }


        return card;

    };


/* ============================================================
   INPUT
   ============================================================ */

HD.appFoundation.input =
    function(
        options = {}
    ) {

        const input =
            this.el(
                "input",
                "haldo-app-input"
            );


        input.type =
            options.type ||
            "text";


        input.placeholder =
            options.placeholder ||
            "";


        input.value =
            options.value ||
            "";


        input.autocomplete =
            options.autocomplete ||
            "off";


        if (
            options.name
        ) {

            input.name =
                options.name;

        }


        return input;

    };


/* ============================================================
   TEXTAREA
   ============================================================ */

HD.appFoundation.textarea =
    function(
        options = {}
    ) {

        const textarea =
            this.el(
                "textarea",
                "haldo-app-textarea"
            );


        textarea.placeholder =
            options.placeholder ||
            "";


        textarea.value =
            options.value ||
            "";


        textarea.rows =
            Number(
                options.rows ||
                5
            );


        return textarea;

    };


/* ============================================================
   APP STORAGE
   ============================================================ */

HD.appFoundation.storage =
    HD.appFoundation.storage ||
    {};


HD.appFoundation.storage.key =
    function(
        appId
    ) {

        return (
            "haldo-app-" +
            String(
                appId
            ) +
            "-data"
        );

    };


HD.appFoundation.storage.read =
    function(
        appId,
        fallback = {}
    ) {

        try {

            if (
                HD.storage &&
                typeof HD.storage.get ===
                "function"
            ) {

                const value =
                    HD.storage.get(
                        this.key(
                            appId
                        )
                    );


                if (
                    value !==
                    null &&
                    value !==
                    undefined
                ) {

                    return value;

                }

            }


            const raw =
                localStorage.getItem(
                    this.key(
                        appId
                    )
                );


            if (
                !raw
            ) {

                return fallback;

            }


            return JSON.parse(
                raw
            );

        }

        catch(error) {

            HD.errors.report(
                error,
                "appStorage:read"
            );


            return fallback;

        }

    };


HD.appFoundation.storage.write =
    function(
        appId,
        value
    ) {

        try {

            if (
                HD.storage &&
                typeof HD.storage.set ===
                "function"
            ) {

                HD.storage.set(
                    this.key(
                        appId
                    ),
                    value
                );

                return true;

            }


            localStorage.setItem(
                this.key(
                    appId
                ),
                JSON.stringify(
                    value
                )
            );


            return true;

        }

        catch(error) {

            HD.errors.report(
                error,
                "appStorage:write"
            );


            return false;

        }

    };


HD.appFoundation.storage.remove =
    function(
        appId
    ) {

        try {

            localStorage.removeItem(
                this.key(
                    appId
                )
            );


            return true;

        }

        catch(error) {

            return false;

        }

    };


/* ============================================================
   APP SETTINGS
   ============================================================ */

HD.appFoundation.settings =
    HD.appFoundation.settings ||
    {};


HD.appFoundation.settings.get =
    function(
        app
    ) {

        return (
            this.storage.read(
                app.id +
                "-settings",
                {
                    ...(
                        app.settings ||
                        {}
                    )
                }
            )
        );

    };


HD.appFoundation.settings.set =
    function(
        app,
        settings
    ) {

        const current =
            this.get(
                app
            );


        const next =
            {
                ...current,
                ...(settings || {})
            };


        this.storage.write(
            app.id +
            "-settings",
            next
        );


        HD.emit(
            "app:settings-changed",
            {
                app,
                settings:
                    next
            }
        );


        return next;

    };


/* ============================================================
   SETTINGS PANEL
   ============================================================ */

HD.appFoundation.createSettingsPanel =
    function(
        app,
        context
    ) {

        const panel =
            this.el(
                "div",
                "haldo-app-settings-panel"
            );


        const title =
            this.el(
                "h3",
                "haldo-app-settings-title",
                app.name +
                " Einstellungen"
            );


        panel.append(
            title
        );


        const settings =
            this.settings.get(
                app
            );


        const fields =
            [
                {
                    key:
                        "notifications",

                    label:
                        "Benachrichtigungen",

                    type:
                        "checkbox",

                    default:
                        true
                },

                {
                    key:
                        "sound",

                    label:
                        "Töne",

                    type:
                        "checkbox",

                    default:
                        true
                },

                {
                    key:
                        "compact",

                    label:
                        "Kompakte Darstellung",

                    type:
                        "checkbox",

                    default:
                        false
                }
            ];


        fields.forEach(
            field => {

                const row =
                    this.el(
                        "label",
                        "haldo-setting-row"
                    );


                const input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    field.type;


                input.checked =
                    settings[
                        field.key
                    ] !== undefined
                        ? Boolean(
                            settings[
                                field.key
                            ]
                        )
                        : field.default;


                const text =
                    this.el(
                        "span",
                        "",
                        field.label
                    );


                input.addEventListener(
                    "change",
                    () => {

                        this.settings.set(
                            app,
                            {
                                [field.key]:
                                    input.checked
                            }
                        );


                        if (
                            context &&
                            typeof context.setState ===
                            "function"
                        ) {

                            context.setState(
                                {
                                    settings:
                                        this.settings.get(
                                            app
                                        )
                                }
                            );

                        }

                    }
                );


                row.append(
                    input,
                    text
                );


                panel.append(
                    row
                );

            }
        );


        return panel;

    };


/* ============================================================
   APP STATUS
   ============================================================ */

HD.appFoundation.search =
    function(
        placeholder,
        callback
    ) {

        const input =
            this.input(
                {
                    type:
                        "search",

                    placeholder:
                        placeholder ||
                        "Suchen…"
                }
            );


        input.addEventListener(
            "input",
            () => {

                if (
                    typeof callback ===
                    "function"
                ) {

                    callback(
                        input.value
                    );

                }

            }
        );


        return input;

    };


/* ============================================================
   APP NAVIGATION TABS
   ============================================================ */

HD.appFoundation.tabs =
    function(
        items,
        onChange
    ) {

        const navigation =
            this.el(
                "nav",
                "haldo-app-tabs"
            );


        const buttons =
            new Map();


        items.forEach(
            item => {

                const button =
                    this.button(
                        item.label,
                        () => {

                            buttons.forEach(
                                (
                                    value,
                                    key
                                ) => {

                                    value.classList.toggle(
                                        "active",
                                        key ===
                                        item.id
                                    );

                                }
                            );


                            if (
                                typeof onChange ===
                                "function"
                            ) {

                                onChange(
                                    item.id
                                );

                            }

                        }
                    );


                button.dataset.tab =
                    item.id;


                buttons.set(
                    item.id,
                    button
                );


                navigation.append(
                    button
                );

            }
        );


        if (
            items.length
        ) {

            const first =
                buttons.get(
                    items[0].id
                );


            if (
                first
            ) {

                first.classList.add(
                    "active"
                );

            }

        }


        return navigation;

    };

<script>
"use strict";

   HALDO AI APP

HD.apps =

HD.apps.haldoAI =

HD.apps.haldoAI.id =
    "haldo-ai";


HD.apps.haldoAI.name =
    "HalDo AI";


HD.apps.haldoAI.initialized =
    false;


/* ============================================================
   AI STATE
   ============================================================ */

HD.apps.haldoAI.state =
    HD.apps.haldoAI.state ||
    {
        messages: [],
        thinking: false,
        listening: false,
        voiceEnabled: true
    };


/* ============================================================
   STORAGE
   ============================================================ */

HD.apps.haldoAI.load =
    function() {

        const saved =
            HD.appFoundation.storage.read(
                this.id,
                {
                    messages: []
                }
            );


        if (
            Array.isArray(
                saved.messages
            )
        ) {

            this.state.messages =
                saved.messages.slice(
                    -100
                );

        }


        return this.state;

    };


HD.apps.haldoAI.save =
    function() {

        HD.appFoundation.storage.write(
            this.id,
            {
                messages:
                    this.state.messages
            }
        );

    };


/* ============================================================
   ADD MESSAGE
   ============================================================ */

HD.apps.haldoAI.addMessage =
    function(
        role,
        text
    ) {

        const message =
            {
                id:
                    "msg-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2),

                role:
                    role,

                text:
                    String(
                        text ||
                        ""
                    ),

                time:
                    new Date()
                        .toISOString()
            };


        this.state.messages.push(
            message
        );


        if (
            this.state.messages.length >
            100
        ) {

            this.state.messages.shift();

        }


        this.save();


        HD.emit(
            "ai:message",
            message
        );


        return message;

    };


/* ============================================================
   CREATE AI WINDOW
   ============================================================ */

HD.apps.haldoAI.open =
    async function() {

        this.load();


        const instance =
            await HD.router.openApp(

                    width:
                        380,

                    height:
                        540,

                    minWidth:
                        300,

                    minHeight:

   AI RESPONSE
   ============================================================ */

HD.apps.haldoAI.generateResponse =
    async function(
        text
    ) {

        const input =
            String(
                text ||
                ""
            )
            .trim();


        if (
            !input
        ) {

            return "";

        }


        /*
         * Vorhandene AI-Engine zuerst verwenden.
         */

        try {

            if (
                HD.ai &&
                typeof HD.ai.respond ===
                "function"
            ) {

                return await HD.ai.respond(
                    input
                );

            }


            if (
                HD.aiCore &&
                typeof HD.aiCore.respond ===
                "function"
            ) {

                return await HD.aiCore.respond(
                    input
                );

            }


            if (
                HD.aiEngine &&
                typeof HD.aiEngine.respond ===
                "function"
            ) {

                return await HD.aiEngine.respond(
                    input
                );

            }


            if (
                window.HalDoAI &&
                typeof window.HalDoAI.respond ===
                "function"
            ) {

                return await window.HalDoAI.respond(
                    input
                );

            }

        }

        catch(error) {

            HD.errors.report(
                error,
                "haldoAI:engine"
            );

        }


        /*
         * Sicherer lokaler Fallback.
         */

        return this.localResponse(
            input
        );

    };


/* ============================================================

   ============================================================ */

HD.apps.haldoAI.localResponse =
    function(

    ) {

                "künstliche Intelligenz von HalDo AI OS 22."
            );

        }


        if (
            lower.includes(
                "danke"
            )
        ) {

            return (
                "Sehr gerne. ❤️"
            );

        }


        if (
            lower.includes(
                "zeit"
            ) ||
            lower.includes(
                "uhr"
            )
        ) {

            return (
                "Die aktuelle Uhrzeit ist " +
                new Date()
                    .toLocaleTimeString(

            );

        ) {

            return (

                    .toLocaleDateString(

                    ) +

            );

                    `;


                messages.append(
                    welcome
                );


                return;

            }


            app.state.messages.forEach(
                message => {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "haldo-ai-message-row " +
                        (
                            message.role ===
                            "user"

                        );


                    const bubble =

                        );


                    bubble.className =

                    bubble.textContent =

                    row.append(

                    messages.append(

                );

            }

            finally {

                app.state.thinking =
                    false;


                status.textContent =
                    "Bereit";


                send.disabled =
                    false;


                renderMessages();

            }

        }


        send.addEventListener(
            "click",
            sendMessage
        );


        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        voice.addEventListener(
            "click",
            () => {

                app.listen(
                    input,
                    status
                );

            }
        );


        renderMessages();


        setTimeout(
            () => {

                input.focus();

            },
            80
        );

/* ============================================================
   SPEECH OUTPUT
   ============================================================ */

HD.apps.haldoAI.speak =
    function(
        text
    ) {

        if (
            !text
        ) {

            return;

        }


        try {

            if (
                HD.voice &&
                typeof HD.voice.speak ===
                "function"
            ) {

                HD.voice.speak(
                    text
                );

                return;

            }


            if (
                window.speechSynthesis
            ) {

                window.speechSynthesis.cancel();


                const utterance =
                    new SpeechSynthesisUtterance(
                        text
                    );


                utterance.lang =
                    "de-DE";


                utterance.rate =
                    1;


                utterance.pitch =
                    1;


                window.speechSynthesis.speak(
                    utterance
                );

            }

        }

        catch(error) {

            HD.errors.report(
                error,
                "haldoAI:speak"
            );

        }

    };


/* ============================================================
   SPEECH INPUT
   ============================================================ */

HD.apps.haldoAI.listen =
    function(
        input,
        status
    ) {

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (
            !Recognition
        ) {

            status.textContent =
                "Sprache nicht verfügbar";


            return;

        }


        const recognition =
            new Recognition();


        recognition.lang =
            "de-DE";


        recognition.interimResults =
            true;


        recognition.continuous =
            false;


        this.state.listening =
            true;


        status.textContent =
            "Hört zu…";


        recognition.onresult =
            event => {

                let transcript =
                    "";


                for (
                    let i =
                        event.resultIndex;

                    i <
                        event.results.length;

                    i++
                ) {

                    transcript +=
                        event.results[i][0]
                            .transcript;

                }


                input.value =
                    transcript;

            };


        recognition.onerror =
            () => {

                this.state.listening =
                    false;


                status.textContent =
                    "Bereit";

            };


        recognition.onend =
            () => {

                this.state.listening =
                    false;


                status.textContent =
                    "Bereit";

            };


        try {

            recognition.start();

        }

        catch(error) {

            this.state.listening =
                false;


            status.textContent =
                "Bereit";

        }

    };

<!-- =========================================================
     HALDO AI OS 22
     PART 16 / 16
     FINAL BOOT + SYSTEM CONNECTION + ERROR GUARD
     ========================================================= -->

<script>
"use strict";

/* ============================================================
   HALDO FINAL SYSTEM
   ============================================================ */

HD.finalSystem =
    HD.finalSystem || {

        initialized: false,

        started: false,

        ready: false,

        errors: [],

        startTime: null

    };


/* ============================================================
   SAFE LOG
   ============================================================ */

HD.finalSystem.log =
    function(
        message,
        type = "info"
    ) {

        try {

            console.log(
                "[HalDo AI OS 22]",
                message
            );

        }

        catch (_) {}

        HD.emit(
            "system:log",
            {
                message,
                type
            }
        );

    };


/* ============================================================
   ERROR GUARD
   ============================================================ */

HD.finalSystem.reportError =
    function(
        error,
        source = "unknown"
    ) {

        const entry =
            {
                source,

                message:
                    error &&
                    error.message
                        ? error.message
                        : String(
                            error
                        ),

                time:
                    new Date()
                        .toISOString()
            };


        this.errors.push(
            entry
        );


        if (
            this.errors.length >
            100
        ) {

            this.errors.shift();

        }


        try {

            console.error(
                "[HalDo]",
                source,
                error
            );

        }

        catch (_) {}


        HD.emit(
            "system:error",
            entry
        );

    };


/* ============================================================
   GLOBAL ERROR HANDLER
   ============================================================ */

window.addEventListener(
    "error",
    event => {

        HD.finalSystem.reportError(
            event.error ||
            event.message,
            "window"
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        HD.finalSystem.reportError(
            event.reason,
            "promise"
        );

    }
);


/* ============================================================
   SAFE CALL
   ============================================================ */

HD.finalSystem.safe =
    async function(
        callback,
        source = "safe"
    ) {

        try {

            return await callback();

        }

        catch(error) {

            this.reportError(
                error,
                source
            );


            return null;

        }

    };


/* ============================================================
   ENSURE ROOT
   ============================================================ */

HD.finalSystem.ensureRoot =
    function() {

        let root =
            document.querySelector(
                "#haldo-os"
            );


        if (
            !root
        ) {

            root =
                document.querySelector(
                    "#haldo-root"
                );

        }


        if (
            !root
        ) {

            root =
                document.querySelector(
                    ".haldo-os"
                );

        }


        if (
            !root
        ) {

            root =
                document.body;

        }


        return root;

    };


/* ============================================================
   START BUTTON
   ============================================================ */

HD.finalSystem.createStartButton =
    function() {

        let button =
            document.querySelector(
                "[data-haldo-start]"
            );


        if (
            button
        ) {

            return button;

        }


        button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.dataset.haldoStart =
            "true";


        button.className =
            "haldo-start-button";


        button.textContent =
            "START HALDO AI";


        const root =
            this.ensureRoot();


        root.appendChild(
            button
        );


        return button;

    };


/* ============================================================
   START BUTTON ACTION
   ============================================================ */

HD.finalSystem.bindStartButton =
    function() {

        const buttons =
            document.querySelectorAll(
                [
                    "[data-haldo-start]",
                    "#haldo-start-button",
                    ".haldo-start-button"
                ]
                .join(",")
            );


        buttons.forEach(
            button => {

                if (
                    button.dataset.haldoStartBound ===
                    "true"
                ) {

                    return;

                }


                button.dataset.haldoStartBound =
                    "true";


                button.addEventListener(
                    "click",
                    async event => {

                        event.preventDefault();

                        await this.start();

                    }
                );

            }
        );

    };


/* ============================================================
   CONNECT CENTRAL AI
   ============================================================ */

HD.finalSystem.bindCentralAI =
    function() {

        const selectors =
            [
                "[data-haldo-ai]",
                "[data-haldo-ai-avatar]",
                "#haldo-ai-avatar",
                "#haldo-sun",
                ".haldo-sun",
                ".haldo-ai-avatar",
                ".haldo-logo-center",
                ".haldo-sun-center"
            ];


        document
            .querySelectorAll(
                selectors.join(",")
            )
            .forEach(
                element => {

                    if (
                        element.dataset.haldoFinalAIBound ===
                        "true"
                    ) {

                        return;

                    }


                    element.dataset.haldoFinalAIBound =
                        "true";


                    element.addEventListener(
                        "click",
                        async event => {

                            event.preventDefault();

                            event.stopPropagation();


                            if (
                                HD.apps &&
                                HD.apps.haldoAI
                            ) {

                                await HD.apps.haldoAI.open();

                            }

                        }
                    );

                }
            );

    };


/* ============================================================
   CONNECT MENU
   ============================================================ */

HD.finalSystem.bindMenu =
    function() {

        const selectors =
            [
                "[data-haldo-menu]",
                "#haldo-menu-button",
                ".haldo-menu-button",
                ".haldo-menu"
            ];


        document
            .querySelectorAll(
                selectors.join(",")
            )
            .forEach(
                button => {

                    if (
                        button.dataset.haldoFinalMenuBound ===
                        "true"
                    ) {

                        return;

                    }


                    button.dataset.haldoFinalMenuBound =
                        "true";


                    button.addEventListener(
                        "click",
                        event => {

                            event.preventDefault();

                            event.stopPropagation();


                            if (
                                HD.launcher &&
                                typeof HD.launcher.toggle ===
                                "function"
                            ) {

                                HD.launcher.toggle();

                            }

                        }
                    );

                }
            );

    };


/* ============================================================
   ENSURE LAUNCHER
   ============================================================ */

HD.finalSystem.ensureLauncher =
    function() {

        if (
            HD.launcher &&
            typeof HD.launcher.create ===
            "function"
        ) {

            HD.launcher.create();

            HD.launcher.bindMenuButton();

        }

    };


/* ============================================================
   CONNECT WINDOW SYSTEM
   ============================================================ */

HD.finalSystem.connectWindows =
    function() {

        if (
            !HD.windows
        ) {

            return;

        }


        if (
            typeof HD.windows.updateAll ===
            "function"
        ) {

            HD.windows.updateAll();

        }


        HD.emit(
            "windows:connected"
        );

    };


/* ============================================================
   CONNECT APPS
   ============================================================ */

HD.finalSystem.connectApps =
    function() {

        if (
            HD.appRegistry &&
            typeof HD.appRegistry.all ===
            "function"
        ) {

            const apps =
                HD.appRegistry.all();


            HD.emit(
                "apps:connected",
                {
                    count:
                        apps.length
                }
            );

        }

    };


/* ============================================================
   SYSTEM STATUS
   ============================================================ */

HD.finalSystem.status =
    function() {

        return {

            os:
                "HalDo AI OS 22",

            initialized:
                this.initialized,

            started:
                this.started,

            ready:
                this.ready,

            uptime:
                this.startTime
                    ? Date.now() -
                      this.startTime
                    : 0,

            errors:
                this.errors.length,

            ai:
                Boolean(
                    HD.apps &&
                    HD.apps.haldoAI
                ),

            launcher:
                Boolean(
                    HD.launcher
                ),

            router:
                Boolean(
                    HD.router
                ),

            appSystem:
                Boolean(
                    HD.appManager
                ),

            windowSystem:
                Boolean(
                    HD.windows
                ),

            storage:
                Boolean(
                    HD.storage
                )

        };

    };


/* ============================================================
   START SYSTEM
   ============================================================ */

HD.finalSystem.start =
    async function() {

        if (
            this.started
        ) {

            return this.status();

        }


        this.started =
            true;


        this.startTime =
            Date.now();


        this.log(
            "HalDo AI OS 22 startet.",
            "startup"
        );


        await this.safe(
            async () => {

                this.ensureLauncher();

            },
            "launcher"
        );


        await this.safe(
            async () => {

                this.bindMenu();

            },
            "menu"
        );


        await this.safe(
            async () => {

                this.bindCentralAI();

            },
            "ai"
        );


        await this.safe(
            async () => {

                this.connectWindows();

            },
            "windows"
        );


        await this.safe(
            async () => {

                this.connectApps();

            },
            "apps"
        );


        this.ready =
            true;


        this.initialized =
            true;


        HD.emit(
            "haldo:ready",
            this.status()
        );


        this.log(
            "HalDo AI OS 22 ist bereit.",
            "ready"
        );


        return this.status();

    };


/* ============================================================
   START WHEN DOM IS READY
   ============================================================ */

async function haldoFinalBoot() {

    await HD.finalSystem.safe(
        async () => {

            HD.finalSystem.bindStartButton();

        },
        "start-button"
    );


    /*
     * Falls ein vorhandener Start-Button
     * vorhanden ist, wartet HalDo auf den
     * Benutzer.
     *
     * Ohne Start-Button startet das System
     * automatisch.
     */

    const startButton =
        document.querySelector(
            [
                "[data-haldo-start]",
                "#haldo-start-button",
                ".haldo-start-button"
            ]
            .join(",")
        );


    if (
        startButton
    ) {

        HD.finalSystem.log(
            "Start-Button erkannt.",
            "startup"
        );


        return;

    }


    await HD.finalSystem.start();

}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoFinalBoot,
        {
            once:
                true
        }
    );

}

else {

    haldoFinalBoot();

}


/* ============================================================
   FINAL SYSTEM REGISTRATION
   ============================================================ */

if (
    HD.runtime &&
    typeof HD.runtime.register ===
    "function"
) {

    HD.runtime.register(
        "final-system",
        HD.finalSystem,
        {
            priority:
                999,

            required:
                true,

            service:
                true
        }
    );

}


/* ============================================================
   FINAL CSS
   ============================================================ */

if (
    !document.getElementById(
        "haldo-final-style"
    )
) {

    const style =
        document.createElement(
            "style"
        );


    style.id =
        "haldo-final-style";


    style.textContent = `

        .haldo-start-button {
            position:
                fixed;
            left:
                50%;
            top:
                50%;
            transform:
                translate(-50%, -50%);
            z-index:
                99999;
            padding:
                12px 22px;
            border:
                1px solid
                rgba(70,255,130,.55);
            border-radius:
                12px;
            color:
                #fff;
            background:
                rgba(20,170,80,.18);
            box-shadow:
                0 0 25px
                rgba(50,255,120,.18);
            cursor:
                pointer;
            font:
                inherit;
            font-weight:
                700;
            letter-spacing:
                .03em;
        }


        .haldo-start-button:hover {
            background:
                rgba(30,210,100,.28);
            box-shadow:
                0 0 35px
                rgba(50,255,120,.30);
        }


        .haldo-start-button:active {
            transform:
                translate(-50%, -50%)
                scale(.97);
        }


        @media (
            max-width: 600px
        ) {

            .haldo-start-button {
                max-width:
                    calc(100vw - 40px);
                font-size:
                    12px;
            }

        }

    `;


    document.head.appendChild(
        style
    );

}


/* ============================================================
   FINAL READY EVENT
   ============================================================ */

HD.emit(
    "haldo-final:ready"
);

</script>
