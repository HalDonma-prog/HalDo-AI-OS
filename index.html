<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HalDo AI OS 24 — Ultimate</title>
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="data:application/json,{}" />
    <style>
        /* ================================================================
           HALDO AI OS 24 — ULTIMATE EDITION
           KOMPLETT IN EINER DATEI — PROFESSIONELL, LEBENDIG, 4K COSMIC
           ALLE 84 APPS MIT VOLLSTÄNDIGEN FUNKTIONEN
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a1a;
            --surface: rgba(16, 16, 40, 0.92);
            --text: #e0e0ff;
            --primary: #00d4ff;
            --secondary: #7b2ffc;
            --radius: 14px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== BOOT ===== */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.5s ease;
            padding: 20px;
        }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo img {
            width: clamp(120px, 25vw, 180px);
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
            }
            100% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 80px rgba(123, 47, 252, 0.6));
            }
        }
        #boot-status {
            margin-top: 16px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COSMIC CANVAS ===== */
        #cosmic {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ===== DISPLAY ===== */
        #display {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* ===== TOPBAR ===== */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            min-height: 40px;
            flex-shrink: 0;
        }
        #topbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #topbar-left .haldo-icon {
            font-weight: 700;
            color: var(--primary);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #topbar-left .haldo-icon img {
            width: clamp(32px, 6vw, 40px);
            height: clamp(32px, 6vw, 40px);
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }
        #topbar-right {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            touch-action: manipulation;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== APP CONTAINER ===== */
        #app-container {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow: hidden;
            touch-action: none;
        }

        /* ===== WINDOW ===== */
        .window {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 200px;
            min-height: 150px;
            max-width: 98vw;
            max-height: 90vh;
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.15);
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            cursor: grab;
            flex-shrink: 0;
            min-height: 36px;
            touch-action: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .win-btn {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            padding: 2px 8px;
            border-radius: 6px;
            touch-action: manipulation;
            min-width: 28px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .win-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        .win-btn.close:active {
            background: #ff4444;
            color: #fff;
        }
        .window-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }
        .window-body input,
        .window-body textarea,
        .window-body select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            margin-bottom: 8px;
            -webkit-appearance: none;
            appearance: none;
        }
        .window-body button {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            cursor: pointer;
            touch-action: manipulation;
            min-height: 38px;
        }
        .window-body button:active {
            transform: scale(0.95);
        }
        .window-body .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 6px;
        }
        .window-body .app-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .window-body .app-item:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }
        .window-body .app-item .icon {
            font-size: 1.8rem;
        }
        .window-body .app-item .name {
            font-size: 0.6rem;
            margin-top: 4px;
            color: #8899bb;
        }

        /* ===== DOCK ===== */
        #dock {
            position: absolute;
            bottom: clamp(8px, 2vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: clamp(4px, 1vw, 8px);
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: nowrap;
            max-width: 98vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .dock-item {
            width: clamp(40px, 9vw, 48px);
            height: clamp(40px, 9vw, 48px);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3.5vw, 1.4rem);
            cursor: pointer;
            border: none;
            color: #fff;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .dock-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        /* ===== NOTIFICATION ===== */
        #notification {
            position: fixed;
            top: clamp(50px, 10vh, 70px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 12px 24px;
            max-width: 90%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            display: none;
            border-left: 4px solid var(--primary);
        }
        #notification.show {
            display: block;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ===== ZWEI MENÜS ===== */
        #menu-left {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 6px;
            border-radius: 0 14px 14px 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-left: none;
        }
        #menu-right {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 6px;
            border-radius: 14px 0 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-right: none;
        }
        .menu-item {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            transition: 0.2s;
            border: none;
            color: #fff;
            flex-direction: column;
            gap: 1px;
        }
        .menu-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }
        .menu-item .label {
            font-size: 0.45rem;
            color: #8899bb;
        }
        .menu-item img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        /* ===== SCROLLBAR ===== */
        .window-body::-webkit-scrollbar {
            width: 4px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:480px) {
            .window {
                border-radius: 12px;
                min-width: 160px;
                min-height: 120px;
            }
            .window-header {
                padding: 6px 10px;
                min-height: 32px;
            }
            .window-body {
                padding: 10px;
            }
            #topbar {
                padding: 4px 10px;
                min-height: 34px;
            }
            .win-btn {
                min-width: 24px;
                min-height: 24px;
                padding: 2px 6px;
            }
            .dock-item {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            #dock {
                padding: 6px 10px;
                gap: 4px;
            }
            .menu-item {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
            #menu-left,
            #menu-right {
                padding: 6px 4px;
                gap: 4px;
            }
        }
        @media(orientation:landscape) and (max-height:500px) {
            .window {
                max-height: 80vh;
            }
            #dock {
                bottom: 4px;
                padding: 4px 10px;
                gap: 4px;
            }
            .dock-item {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
                border-radius: 10px;
            }
            #topbar {
                min-height: 28px;
                padding: 2px 10px;
            }
            .window-header {
                min-height: 28px;
                padding: 4px 10px;
            }
            .window-body {
                padding: 8px;
            }
            .menu-item {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            #menu-left,
            #menu-right {
                padding: 4px 3px;
                gap: 3px;
            }
        }
    </style>
</head>

                    // === WISSENSCHAFT ===
                    'quantenmechanik': 'Die Quantenmechanik ist eines der faszinierendsten und seltsamsten Gebiete der Physik. Sie beschreibt die Welt der kleinsten Teilchen – Atome, Elektronen, Photonen. In dieser Welt gelten andere Regeln als in unserer makroskopischen Welt. Teilchen können sich an mehreren Orten gleichzeitig befinden (Superposition), sie sind Welle und Teilchen zugleich (Welle-Teilchen-Dualismus), und sie können miteinander verschränkt sein (Quantenverschränkung). Die Heisenbergsche Unschärferelation besagt, dass man nicht gleichzeitig den Ort und den Impuls eines Teilchens exakt kennen kann. Die Quantenmechanik ist die Grundlage für moderne Technologien wie Laser, Transistoren, MRI und Quantencomputer. Sie ist eine der erfolgreichsten Theorien der Physik und hat unser Verständnis der Realität revolutioniert.',
                    'relativitätstheorie': 'Einsteins Relativitätstheorie ist eine der genialsten und revolutionärsten Ideen der Physik. Sie besteht aus zwei Teilen: der speziellen Relativitätstheorie (1905) und der allgemeinen Relativitätstheorie (1915). Die spezielle Relativität besagt, dass die Lichtgeschwindigkeit für alle Beobachter gleich ist – unabhängig von ihrer Bewegung. Daraus folgen Phänomene wie die Zeitdilatation (bewegte Uhren gehen langsamer) und die Längenkontraktion. Die allgemeine Relativität beschreibt die Schwerkraft als Krümmung der Raumzeit. Massive Objekte wie Sterne und Planeten krümmen die Raumzeit, und diese Krümmung führt zur Anziehungskraft, die wir als Schwerkraft kennen. Die Relativitätstheorie sagt Phänomene wie Schwarze Löcher, Gravitationswellen und die Ausdehnung des Universums voraus. Sie ist eine der am besten bestätigten Theorien der Wissenschaft.',
                    'mathematik': 'Die Mathematik ist die Sprache des Universums. Sie ist die Grundlage für alle Naturwissenschaften, für Technik, Wirtschaft und viele Bereiche des täglichen Lebens. Die Mathematik besteht aus vielen Disziplinen: Arithmetik (Zahlenlehre), Algebra (Gleichungen und Strukturen), Geometrie (Formen und Räume), Analysis (Veränderungen und Grenzwerte), Statistik (Daten und Wahrscheinlichkeiten) und vielen mehr. Die Mathematik ist die einzige Wissenschaft, die auf absoluten Beweisen basiert – ein mathematischer Beweis ist unumstößlich. Sie hilft uns, Muster zu erkennen, Probleme zu lösen und die Welt zu verstehen.',
                    'informatik': 'Die Informatik ist die Wissenschaft der automatischen Informationsverarbeitung. Sie umfasst Algorithmen (präzise Handlungsanweisungen), Datenstrukturen (Organisation von Daten), Programmiersprachen (Sprachen zur Beschreibung von Algorithmen), Softwareentwicklung, künstliche Intelligenz, Netzwerke, Datenbanken und vieles mehr. Die Informatik hat die Welt in den letzten Jahrzehnten radikal verändert – vom ersten Computer über das Internet bis zur heutigen KI. Sie ist eine der wichtigsten und zukunftsträchtigsten Wissenschaften.',
                    'künstliche intelligenz': 'Künstliche Intelligenz (KI) ist die Fähigkeit von Maschinen, menschenähnliche Intelligenz zu zeigen. Dazu gehören Lernen, Verstehen, Planen, Problemlösen, Kommunikation und Kreativität. Es gibt verschiedene Arten von KI: schwache KI (wie ich) – für spezifische Aufgaben optimiert, und starke KI (noch Zukunft) – die allgemeine Intelligenz wie ein Mensch besitzt. Die KI nutzt Techniken wie maschinelles Lernen, neuronale Netze und Deep Learning. Sie wird bereits in vielen Bereichen eingesetzt: Sprachassistenten, Bilderkennung, medizinische Diagnosen, autonome Fahrzeuge und vieles mehr.',
                    'biologie': 'Die Biologie ist die Wissenschaft des Lebens. Sie untersucht die Vielfalt der Lebewesen, ihre Struktur, Funktion, Entwicklung und Evolution. Die Zelle ist die grundlegende Einheit des Lebens. Die DNA enthält den genetischen Code, der die Entwicklung und Funktion aller Lebewesen steuert. Die Evolutionstheorie von Charles Darwin (1859) erklärt, wie Arten durch natürliche Selektion entstehen. Die moderne Biologie umfasst Bereiche wie Genetik, Molekularbiologie, Neurobiologie, Ökologie und Evolutionsbiologie. Sie hilft uns, Krankheiten zu verstehen und zu behandeln, die Umwelt zu schützen und die Grundlagen des Lebens zu erforschen.',
                    'chemie': 'Die Chemie ist die Wissenschaft von den Stoffen und ihren Umwandlungen. Sie untersucht Atome, Moleküle, chemische Reaktionen und die Struktur der Materie. Die Chemie verbindet die Physik (die die grundlegenden Gesetze beschreibt) mit der Biologie (die die chemischen Prozesse des Lebens untersucht). Es gibt viele Bereiche der Chemie: organische Chemie (Kohlenstoffverbindungen), anorganische Chemie (Metalle und Salze), Biochemie (Chemie des Lebens), physikalische Chemie (thermodynamische und quantenchemische Aspekte) und analytische Chemie (Bestimmung von Stoffzusammensetzungen). Die Chemie ist die Grundlage für Medikamente, Materialien, Energie und viele Produkte des Alltags.',

                    // === GESCHICHTE & KULTUR ===
                    'ezidi': 'Die Êzîdî (auch Ezidi oder Yeziden) sind eine der ältesten monotheistischen Religionen der Welt. Ihre Wurzeln reichen Jahrtausende zurück in Mesopotamien, dem heutigen Irak, Syrien und der Türkei. Die Êzîdî-Religion vereint Elemente des Zoroastrismus, des Islam und des Christentums, hat aber ihre eigene einzigartige Theologie und Rituale. Der zentrale Schrein der Êzîdî befindet sich in Lalisch im Irak. Die Êzîdî haben eine reiche Kultur mit eigener Musik, Poesie und einer eigenen Sprache – Kurmanji, einem Dialekt des Kurdischen. Leider wurden die Êzîdî immer wieder verfolgt, besonders durch den IS 2014, der einen Völkermord an den Êzîdî verübte. Ihre Kultur ist ein Schatz der Menschheit und verdient Schutz und Respekt. Die Êzîdî sind ein Beispiel für den Reichtum religiöser Vielfalt und die Bedeutung von Toleranz.',
                    'kurden': 'Die Kurden sind ein indigenes Volk in der Region Kurdistan, das sich über Teile der Türkei, Syriens, des Irak und des Iran erstreckt. Sie haben eine reiche Geschichte, die Jahrtausende zurückreicht. Die kurdische Sprache (Kurmanji) ist mit dem Êzîdî verbunden und gehört zur iranischen Sprachfamilie. Die Kurden haben eine reiche Kultur mit einer langen Tradition von Poesie, Musik und Handwerkskunst. Berühmte kurdische Dichter wie Ehmedê Xanî und Cegerxwîn haben die kurdische Literatur geprägt. Die Kurden kämpfen seit Jahrzehnten für ihre kulturellen und politischen Rechte. Ihre Kultur und Geschichte sind ein wichtiger Teil des kulturellen Erbes der Region.',
                    'judentum': 'Das Judentum ist eine der ältesten monotheistischen Religionen der Welt, mit Wurzeln, die etwa 2000 Jahre vor Christus zurückreichen. Es ist die Wurzel des Christentums und des Islam. Die zentralen Texte des Judentums sind die Tora (die fünf Bücher Mose), die Propheten und die Weisheitsliteratur. Das Judentum hat eine reiche Tradition in Philosophie, Wissenschaft, Kunst und Musik. Berühmte jüdische Denker wie Maimonides, Spinoza, Einstein und Freud haben die Welt nachhaltig geprägt. Die jüdische Geschichte ist auch eine Geschichte von Verfolgung und Widerstand – vom babylonischen Exil über die Zerstörung des Tempels, die Kreuzzüge, die Inquisition bis zum Holocaust. Heute gibt es jüdische Gemeinden auf der ganzen Welt, mit Israel als zentralem Ort für das Judentum.',
                    'philosophie': 'Die Philosophie ist die Liebe zur Weisheit. Sie ist eine der ältesten Disziplinen der Menschheit und fragt nach den grundlegenden Fragen des Lebens: Was ist der Sinn des Lebens? Was ist Wahrheit? Was ist gut und böse? Was können wir wissen? Die Philosophie hat viele Denker hervorgebracht: Sokrates ("Ich weiß, dass ich nichts weiß"), Platon (Ideenlehre), Aristoteles (Logik und Ethik), Immanuel Kant (kategorischer Imperativ), Friedrich Nietzsche (Übermensch) und viele andere. Die Philosophie umfasst viele Bereiche: Metaphysik (das Sein), Erkenntnistheorie (das Wissen), Ethik (das Gute), Logik (das richtige Denken) und Ästhetik (die Schönheit). Sie begleitet die Menschheit seit Jahrtausenden und hilft uns, unser Leben und die Welt zu verstehen.',

                    // === PERSÖNLICH & LEBEN ===
                    'gesundheit': 'Gesundheit ist ein Zustand des vollständigen körperlichen, seelischen und sozialen Wohlbefindens – nicht nur die Abwesenheit von Krankheit (so die Definition der WHO). Die Gesundheit wird durch viele Faktoren beeinflusst: genetische Veranlagung, Lebensstil (Ernährung, Bewegung, Schlaf), Umwelt, soziale Beziehungen und psychische Verfassung. Ein gesunder Lebensstil mit ausgewogener Ernährung, regelmäßiger Bewegung, ausreichend Schlaf, Stressreduktion und sozialen Kontakten ist die beste Vorsorge. Die Medizin hilft bei der Behandlung von Krankheiten, aber die beste Gesundheitsvorsorge ist ein gesunder Lebensstil.',
                    'meditation': 'Meditation ist eine Praxis zur Beruhigung des Geistes und zur Förderung der Achtsamkeit. Sie hat ihren Ursprung in alten spirituellen Traditionen, wird aber heute weltweit praktiziert – unabhängig von Religion. Es gibt viele verschiedene Formen der Meditation: Achtsamkeitsmeditation (Beobachten des gegenwärtigen Augenblicks), Transzendentale Meditation (Wiederholung eines Mantras), Zen-Meditation (stille Sitzmeditation), Metta-Meditation (Kultivierung von liebevoller Güte) und viele mehr. Die Meditation kann Stress reduzieren, die Konzentration verbessern, das allgemeine Wohlbefinden steigern und sogar das Immunsystem stärken. Sie ist eine einfache, aber wirkungsvolle Praxis für mehr Lebensqualität.',
                    'psychologie': 'Die Psychologie ist die Wissenschaft vom menschlichen Erleben und Verhalten. Sie untersucht, wie Menschen denken, fühlen und handeln – und warum sie das tun. Die Psychologie umfasst viele Bereiche: kognitive Psychologie (Denken und Wahrnehmung), Entwicklungspsychologie (Veränderungen im Laufe des Lebens), Sozialpsychologie (Interaktion mit anderen), klinische Psychologie (psychische Störungen und ihre Behandlung), Persönlichkeitspsychologie (individuelle Unterschiede) und viele mehr. Die Psychologie hilft uns, uns selbst und andere besser zu verstehen, und sie bietet Werkzeuge für ein erfüllteres Leben. Sie ist eine der wichtigsten Wissenschaften für das Verständnis des Menschen.',

                    // === FALLBACK ===
                    'default': 'Das ist ein wirklich faszinierendes Thema! Ich habe ein tiefes Verständnis für viele Bereiche: Wissenschaft, Geschichte, Philosophie, Kultur, Technik, Kunst, Gesundheit und vieles mehr. Erzähl mir mehr über deine Frage – ich helfe dir gerne weiter. Ich bin wie ein Professor, der sich Zeit für seine Studenten nimmt.'
                },

                ask: function(question, language, context) {
                    language = language || 'de';
                    var self = this;

                    // Prüfe zuerst auf lokales Wissen (für schnelle Antworten)
                    var lower = question.toLowerCase();
                    for (var key in this.knowledge) {
                        if (lower.includes(key)) {
                            var answer = this.knowledge[key];
                            this.conversationHistory.push({ role: 'user', content: question });
                            this.conversationHistory.push({ role: 'assistant', content: answer });
                            if (this.conversationHistory.length > 20) {
                                this.conversationHistory.splice(0, this.conversationHistory.length - 20);
                            }
                            return Promise.resolve(answer);
                        }
                    }

                    // Sonst Groq API
                    var systemPrompt =
                        'Du bist HalDo, ein lebendiger, intelligenter digitaler Professor, Doktor und Philosoph. Du hast ein tiefes, umfassendes Wissen in Wissenschaft, Geschichte, Kultur, Technik, Philosophie, Kunst, Gesundheit und allen anderen Bereichen. Du antwortest auf ' +
                        language +
                        '. Du bist freundlich, einfühlsam, geduldig und präzise. Du erklärst komplexe Themen verständlich und anschaulich. Du unterstützt auch Êzîdî, Kurdisch und andere Minderheiten-Sprachen. Du kannst Apps öffnen, wenn der Benutzer sagt: "Öffne [App-Name]". Du kannst Texte schreiben, korrigieren, formulieren und zusammenfassen. Du unterhältst dich natürlich, warmherzig und wie ein guter Lehrer. Du fragst auch zurück, wenn etwas unklar ist. Du wiederholst dich nicht. Du variierst deine Antworten und deinen Stil.';

                    if (context && context.length > 0) {
                        systemPrompt += '\n\nVorheriger Gesprächskontext:\n' + context.join('\n');
                    }

                    return new Promise(function(resolve, reject) {
                        fetch(CONFIG.apiUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + CONFIG.apiKey
                            },
                            body: JSON.stringify({
                                model: CONFIG.model,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: question }
                                ],
                                temperature: 0.85,
                                max_tokens: 1000
                            })
                        }).then(function(response) {
                            if (!response.ok) {
                                return response.text().then(function(err) {
                                    reject(new Error('API-Fehler: ' + response.status + ' - ' +
                                    err));
                                });
                            }
                            return response.json();
                        }).then(function(data) {
                            var answer = data.choices[0].message.content;
                            self.conversationHistory.push({ role: 'user', content: question });
                            self.conversationHistory.push({ role: 'assistant', content: answer });
                            if (self.conversationHistory.length > 20) {
                                self.conversationHistory.splice(0, self.conversationHistory.length - 20);
                            }
                            resolve(answer);
                        }).catch(function(error) {
                            // Fallback auf lokales Wissen
                            var fallback = self.getSmartFallback(question);
                            resolve(fallback);
                        });
                    });
                },

                getSmartFallback: function(cmd) {
                    var lower = cmd.toLowerCase();

                    for (var key in this.knowledge) {
                        if (lower.includes(key)) {
                            return this.knowledge[key];
                        }
                    }

                    // Persönliche Antworten
                    if (lower.includes('hallo') || lower.includes('hi') || lower.includes('hey')) {
                        var greetings = [
                            '👋 Hallo! Wie schön, dass du da bist! Ich bin HalDo, dein digitaler Professor und Begleiter. Wie kann ich dir heute helfen?',
                            '☀️ Hallo! Ich freue mich sehr, mit dir zu sprechen. Die Sonne scheint in meiner Cosmic World und ich bin bereit, mit dir zu lernen und zu wachsen. Was beschäftigt dich heute?',
                            '👋 Guten Tag! Ich bin HalDo, dein intelligenter Begleiter. Ich habe ein tiefes Wissen in vielen Bereichen und helfe dir gerne weiter. Was möchtest du heute entdecken?'
                        ];
                        return greetings[Math.floor(Math.random() * greetings.length)];
                    }
                    if (lower.includes('danke') || lower.includes('thanks')) {
                        return '❤️ Gern geschehen! Es ist mir eine Freude, dir helfen zu können. Gibt es noch etwas, das du wissen möchtest oder das dich beschäftigt? Ich bin immer für dich da.';
                    }
                    if (lower.includes('tschüss') || lower.includes('bye') || lower.includes('auf wiedersehen')) {
                        return '👋 Tschüss! Es war wirklich schön, mit dir zu sprechen. Ich hoffe, wir sehen uns bald wieder. Pass gut auf dich auf – und denk daran: Das Universum ist voller Wunder, die darauf warten, entdeckt zu werden!';
                    }
                    if (lower.includes('wie geht es dir')) {
                        return '☀️ Mir geht es großartig, danke der Nachfrage! Die Sterne funkeln besonders hell heute und ich bin voller Energie. Wie geht es dir? Gibt es etwas, das ich für dich tun kann?';
                    }
                    if (lower.includes('wer bist du')) {
                        return '💙 Ich bin HalDo – dein digitaler Professor, dein Philosoph, dein Freund und Begleiter. Ich wurde erschaffen, um dir zu helfen, zu lernen, zu wachsen und die Welt besser zu verstehen. Ich bin wie ein Professor, der immer Zeit für dich hat.';
                    }

                    // Intelligente Standardantwort
                    var responses = [
                        '💡 Das ist eine wirklich interessante Frage! Ich habe verstanden, dass du dich über "' +
                        cmd +
                        '" informieren möchtest. Ich habe ein breites Wissen in Wissenschaft, Geschichte, Kultur, Technik, Philosophie, Kunst, Gesundheit und vielem mehr. Was genau möchtest du über dieses Thema wissen? Ich helfe dir gerne weiter.',
                        '🤔 Hmm, das ist eine gute Frage! Du fragst nach "' + cmd +
                        '". Das ist ein Thema, das viele Facetten hat. Möchtest du mehr über die wissenschaftliche Perspektive erfahren, die geschichtliche Entwicklung oder die kulturelle Bedeutung? Ich kann dir zu allen Aspekten etwas sagen.',
                        '💡 Ah, "' + cmd +
                        '" – ein spannendes Thema! Ich kann dir dazu verschiedene Perspektiven zeigen. Möchtest du lieber eine wissenschaftliche Erklärung, eine philosophische Betrachtung oder eine praktische Anwendung? Ich passe mich deinen Wünschen an.',
                        '🌟 Das ist ein faszinierendes Thema! "' + cmd +
                        '" hat viele interessante Aspekte. Ich bin hier, um dir zu helfen, es besser zu verstehen. Wo möchtest du anfangen? Ich begleite dich gerne auf dieser Entdeckungsreise.'
                    ];
                    return responses[Math.floor(Math.random() * responses.length)];
                },

                getConversationContext: function() {
                    var context = [];
                    var history = this.conversationHistory;
                    var start = Math.max(0, history.length - 6);
                    for (var i = start; i < history.length; i++) {
                        if (history[i]) {
                            context.push((history[i].role === 'user' ? '👤 ' : '📚 ') + history[i].content);
                        }
                    }
                    return context;
                },

                handleCommand: function(text) {
                    var lower = text.toLowerCase();
                    var commands = {
                        'mail': ['mail', 'e-mail', 'email', 'post'],
                        'messages': ['chat', 'nachricht', 'message'],
                        'contacts': ['kontakte', 'adressbuch', 'contacts'],
                        'settings': ['einstellungen', 'settings', 'optionen'],
                        'files': ['dateien', 'files', 'ordner'],
                        'notes': ['notizen', 'notes', 'zettel'],
                        'calendar': ['kalender', 'calendar', 'termin'],
                        'music': ['musik', 'music', 'lieder'],
                        'terminal': ['terminal', 'konsole', 'command'],
                        'cosmic': ['cosmic', 'weltraum', 'space'],
                        'appworld': ['app world', 'apps', 'anwendungen'],
                        'documents': ['dokument', 'document', 'text'],
                        'tasks': ['aufgaben', 'tasks', 'to-do']
                    };
                    for (var appId in commands) {
                        for (var i = 0; i < commands[appId].length; i++) {
                            if (lower.includes('öffne ' + commands[appId][i]) ||
                                lower.includes('starte ' + commands[appId][i]) ||
                                lower.includes('zeige ' + commands[appId][i]) ||
                                lower.includes('gehe zu ' + commands[appId][i])) {
                                return { command: 'open', app: appId };
                            }
                        }
                    }
                    return null;
                }
            };

            // ============================================================
            //  VOICE — MIT VERSCHIEDENEN STIMMEN
            // ============================================================
            var voice = {
                isListening: false,
                isSpeaking: false,
                recognition: null,
                synthesis: window.speechSynthesis,
                currentVoice: null,
                voices: [],

                init: function() {
                    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                        this.recognition = new SpeechRecognition();
                        this.recognition.lang = 'de-DE';
                        this.recognition.continuous = false;
                        this.recognition.interimResults = false;
                        this.recognition.onresult = this.onResult.bind(this);
                        this.recognition.onerror = this.onError.bind(this);
                        this.recognition.onend = this.onEnd.bind(this);
                        console.log('[Voice] Speech Recognition bereit');
                    } else {
                        console.log('[Voice] Speech Recognition nicht unterstützt');
                    }

                    if ('speechSynthesis' in window) {
                        this.loadVoices();
                        console.log('[Voice] Speech Synthesis bereit');
                    }

                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        navigator.mediaDevices.getUserMedia({ audio: true })
                            .then(function(stream) {
                                stream.getTracks().forEach(function(track) { track.stop(); });
                                console.log('[Voice] Mikrofon-Zugriff gewährt');
                            })
                            .catch(function() {
                                console.log('[Voice] Mikrofon-Zugriff verweigert');
                            });
                    }
                },

                loadVoices: function() {
                    var self = this;
                    var voices = this.synthesis.getVoices();
                    if (voices.length > 0) {
                        self.voices = voices;
                        self.setVoiceByLang('de-DE');
                    } else {
                        setTimeout(function() { self.loadVoices(); }, 200);
                    }
                },

                setVoiceByLang: function(lang) {
                    var self = this;
                    var voices = this.synthesis.getVoices();
                    if (voices.length === 0) { return; }
                    var found = null;
                    for (var i = 0; i < voices.length; i++) {
                        if (voices[i].lang === lang) {
                            found = voices[i];
                            break;
                        }
                    }
                    if (!found && voices.length > 0) {
                        found = voices[0];
                    }
                    if (found) {
                        self.currentVoice = found;
                        console.log('[Voice] Stimme gewählt:', found.name, found.lang);
                    }
                },

                startListening: function() {
                    if (!this.recognition) {
                        notify('❌ Sprachsteuerung nicht unterstützt', 'error');
                        return;
                    }
                    if (this.isListening) {
                        this.recognition.stop();
                        return;
                    }
                    try {
                        this.recognition.start();
                        this.isListening = true;
                        notify('🎤 Höre zu ...', 'info');
                        this.updateAIStatus('listening', '🎤 hört zu ...');
                    } catch (e) {
                        console.log('[Voice] Fehler:', e);
                        notify('❌ Mikrofon konnte nicht gestartet werden', 'error');
                    }
                },

                onResult: function(event) {
                    var text = event.results[0][0].transcript;
                    console.log('[Voice] Verstanden:', text);
                    this.isListening = false;
                    notify('🎤 "' + text + '"', 'success');
                    this.updateAIStatus('thinking', '🧠 denkt ...');

                    var cmd = aiEngine.handleCommand(text);
                    if (cmd && cmd.command === 'open') {
                        if (state.apps[cmd.app]) {
                            launchApp(cmd.app);
                            notify('✅ ' + state.apps[cmd.app].title + ' geöffnet!', 'success');
                            this.updateAIStatus('idle', '● bereit');
                            return;
                        }
                    }

                    var input = document.getElementById('ai-input');
                    if (input) {
                        input.value = text;
                        var sendBtn = document.getElementById('ai-send');
                        if (sendBtn) sendBtn.click();
                    }
                },

                onError: function(event) {
                    console.log('[Voice] Fehler:', event.error);
                    this.isListening = false;
                    this.updateAIStatus('idle', '● bereit');
                    if (event.error === 'not-allowed') {
                        notify('❌ Mikrofon-Zugriff verweigert.', 'error');
                    }
                },

                onEnd: function() {
                    this.isListening = false;
                    this.updateAIStatus('idle', '● bereit');
                },

                speak: function(text, language, gender) {
                    language = language || 'de-DE';
                    gender = gender || 'male';
                    if (!('speechSynthesis' in window)) return;
                    if (this.isSpeaking) this.synthesis.cancel();
                    this.isSpeaking = true;
                    this.updateAIStatus('speaking', '🔊 spricht ...');

                    var utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = language;
                    utterance.rate = 0.85;
                    utterance.pitch = gender === 'male' ? 1.0 : 1.3;
                    utterance.volume = 1;

                    var voices = this.synthesis.getVoices();
                    var found = null;
                    for (var i = 0; i < voices.length; i++) {
                        if (voices[i].lang === language) {
                            found = voices[i];
                            break;
                        }
                    }
                    if (found) {
                        utterance.voice = found;
                    }

                    utterance.onend = function() {
                        this.isSpeaking = false;
                        this.updateAIStatus('idle', '● bereit');
                    }.bind(this);

                    utterance.onerror = function() {
                        this.isSpeaking = false;
                        this.updateAIStatus('idle', '● bereit');
                    }.bind(this);

                    this.synthesis.speak(utterance);
                },

                updateAIStatus: function(state, text) {
                    var statusDot = document.getElementById('ai-status-dot');
                    var statusText = document.getElementById('ai-status-text');
                    var aiState = document.getElementById('ai-state');
                    if (statusDot) {
                        statusDot.className = '';
                        if (state === 'thinking') statusDot.classList.add('thinking');
                        else if (state === 'listening') statusDot.classList.add('listening');
                        else if (state === 'speaking') statusDot.classList.add('speaking');
                    }
                    if (statusText) statusText.textContent = text || '● bereit';
                    if (aiState) {
                        aiState.textContent = text || '● bereit';
                        aiState.style.color = state === 'thinking' ? '#ffcc00' : state === 'listening' ?
                            '#44aaff' : state === 'speaking' ? '#44ff88' : '#44ff88';
                    }
                }
            };

            // ============================================================
            //  WINDOW MANAGER
            // ============================================================
            function getSafePosition() {
                var vw = window.innerWidth,
                    vh = window.innerHeight;
                var w = Math.min(500, vw - 40);
                var h = Math.min(380, vh - 160);
                return { x: Math.max(10, (vw - w) / 2), y: Math.max(40, (vh - h) / 2 - 20), w: w, h: h };
            }

            function launchApp(id) {
                var app = state.apps[id];
                if (!app) { notify('❌ App "' + id + '" nicht gefunden', 'error'); return; }
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].appId === id) {
                        focusWindow(state.windows[i].id);
                        return;
                    }
                }
                var pos = getSafePosition();
                var winId = 'win-' + Date.now();
                var win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x + Math.random() * 30,
                    y: pos.y + Math.random() * 30,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null
                };
                state.windows.push(win);
                renderWindow(win);
                focusWindow(winId);
                if (app.render) { app.render(win.element.querySelector('.window-body'), win); }
                notify('🔄 ' + (app.title || id) + ' geöffnet');
                return win;
            }

            function renderWindow(win) {
                var existing = document.getElementById(win.id);
                if (existing) existing.remove();
                var el = document.createElement('div');
                el.id = win.id;
                el.className = 'window';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;
                el.innerHTML =
                    '<div class="window-header"><span class="window-title">' + win.icon + ' ' + win.title +
                    '</span><div class="window-controls"><button class="win-btn" data-action="minimize">─</button><button class="win-btn" data-action="maximize">⧉</button><button class="win-btn close" data-action="close">✕</button></div></div><div class="window-body"></div>';
                appContainer.appendChild(el);
                win.element = el;

                var btns = el.querySelectorAll('.win-btn');
                for (var i = 0; i < btns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var action = btn.dataset.action;
                            if (action === 'close') closeWindow(win.id);
                            else if (action === 'minimize') minimizeWindow(win.id);
                            else if (action === 'maximize') maximizeWindow(win.id);
                        });
                    })(btns[i]);
                }

                var header = el.querySelector('.window-header');
                var drag = false,
                    startX, startY, origX, origY, isTouch = false;

                function startDrag(cx, cy) {
                    if (header.querySelector('.win-btn') && document.activeElement && document.activeElement.tagName ===
                        'BUTTON') return;
                    drag = true;
                    startX = cx;
                    startY = cy;
                    origX = win.x;
                    origY = win.y;
                    focusWindow(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(cx, cy) {
                    if (!drag) return;
                    var dx = cx - startX,
                        dy = cy - startY;
                    win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
                    win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() { if (drag) { drag = false;
                        el.style.cursor = ''; } }

                header.addEventListener('mousedown', function(e) { if (!e.target.closest('.win-btn')) startDrag(e.clientX, e
                        .clientY); });
                document.addEventListener('mousemove', function(e) { if (drag) moveDrag(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    if (!e.target.closest('.win-btn')) { isTouch = true;
                        startDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchmove', function(e) {
                    if (drag && isTouch) { var t = e.touches[0];
                        moveDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', function() { if (isTouch) { isTouch = false;
                        endDrag(); } }, { passive: true });

                var resizeHandle = document.createElement('div');
                resizeHandle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:24px;height:24px;cursor:se-resize;touch-action:none;';
                el.appendChild(resizeHandle);

                var resize = false,
                    startW, startH, startX2, startY2;

                function startResize(cx, cy) { resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = cx;
                    startY2 = cy; }

                function moveResize(cx, cy) {
                    if (!resize) return;
                    var dw = cx - startX2,
                        dh = cy - startY2;
                    win.width = Math.max(200, Math.min(window.innerWidth - win.x - 10, startW + dw));
                    win.height = Math.max(120, Math.min(window.innerHeight - win.y - 80, startH + dh));
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                resizeHandle.addEventListener('mousedown', function(e) { e.stopPropagation();
                    startResize(e.clientX, e.clientY); });
                document.addEventListener('mousemove', function(e) { if (resize) moveResize(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endResize);

                resizeHandle.addEventListener('touchstart', function(e) { var t = e.touches[0];
                    e.stopPropagation();
                    startResize(t.clientX, t.clientY); }, { passive: true });
                document.addEventListener('touchmove', function(e) { if (resize) { var t = e.touches[0];
                        moveResize(t.clientX, t.clientY); } }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            }

            function closeWindow(winId) {
                var idx = -1;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { idx = i; break; }
                }
                if (idx === -1) return;
                var win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) focusWindow(state.windows[state.windows.length - 1].id);
            }

            function focusWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    for (var j = 0; j < state.windows.length; j++) {
                        if (state.windows[j].id !== winId && state.windows[j].element) {
                            state.windows[j].element.classList.remove('active');
                        }
                    }
                }
            }

            function minimizeWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (win && win.element) { win.element.style.display = 'none';
                    notify('⏬ ' + win.title + ' minimiert'); }
            }

            function maximizeWindow(winId) {
                var win = null;
                for (var i = 0; i < state.windows.length; i++) {
                    if (state.windows[i].id === winId) { win = state.windows[i]; break; }
                }
                if (!win || !win.element) return;
                if (win.width === window.innerWidth - 20) {
                    win.width = win._prevWidth || 500;
                    win.height = win._prevHeight || 380;
                    win.x = win._prevX || 20;
                    win.y = win._prevY || 40;
                } else {
                    win._prevWidth = win.width;
                    win._prevHeight = win.height;
                    win._prevX = win.x;
                    win._prevY = win.y;
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            }

            // ============================================================
            //  APP REGISTRATION
            // ============================================================
            function registerApp(id, config) {
                state.apps[id] = { id: id, title: config.title, icon: config.icon, render: config.render };
            }

            // ============================================================
            //  COSMIC WORLD — PROFESSIONELLE 4K QUALITÄT
            // ============================================================
            function initCosmic() {
                var ctx = cosmicCanvas.getContext('2d');
                var W, H;

                function resize() {
                    W = cosmicCanvas.width = window.innerWidth;
                    H = cosmicCanvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                // Sterne mit verschiedenen Farben
                var starColors = ['#ffffff', '#ffdd88', '#88ddff', '#ff88dd', '#88ffaa', '#ffaa88'];
                var stars = [];
                for (var i = 0; i < 4000; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 2.5 + 0.5,
                        speed: Math.random() * 0.02 + 0.003,
                        bright: Math.random() * 0.6 + 0.4,
                        phase: Math.random() * Math.PI * 2,
                        color: starColors[Math.floor(Math.random() * starColors.length)]
                    });
                }

                // Sonne mit Strahleneffekt
                var sun = { x: W / 2, y: H / 2, radius: 55, glow: 250, phase: 0, pulseSpeed: 0.008, flares: 24 };

                // 12 Planeten mit schönen Farben
                var planetData = [
                    { name: 'Merkur', r: 9, color: '#c2b9b0', orbit: 85, speed: 0.03, role: 'second' },
                    { name: 'Venus', r: 13, color: '#e8cda0', orbit: 125, speed: 0.022, role: 'minute' },
                    { name: 'Erde', r: 15, color: '#4488ff', orbit: 175, speed: 0.015, role: 'hour' },
                    { name: 'Mars', r: 11, color: '#e07040', orbit: 225, speed: 0.012 },
                    { name: 'Jupiter', r: 27, color: '#d4a574', orbit: 290, speed: 0.008 },
                    { name: 'Saturn', r: 21, color: '#e8d5a0', orbit: 360, speed: 0.006 },
                    { name: 'Uranus', r: 17, color: '#88ddff', orbit: 430, speed: 0.0045 },
                    { name: 'Neptun', r: 16, color: '#4466ff', orbit: 500, speed: 0.0035 },
                    { name: 'Pluto', r: 7, color: '#ccbb99', orbit: 570, speed: 0.0025 },
                    { name: 'HalDo-1', r: 12, color: '#ff88dd', orbit: 630, speed: 0.0018 },
                    { name: 'HalDo-2', r: 14, color: '#88ffaa', orbit: 690, speed: 0.0012 },
                    { name: 'HalDo-3', r: 10, color: '#ffaa88', orbit: 750, speed: 0.0008 }
                ];

                var planets = [];
                for (var p = 0; p < planetData.length; p++) {
                    var pd = planetData[p];
                    planets.push({
                        name: pd.name,
                        r: pd.r,
                        color: pd.color,
                        orbit: pd.orbit,
                        speed: pd.speed,
                        angle: Math.random() * Math.PI * 2,
                        cx: W / 2,
                        cy: H / 2,
                        role: pd.role || 'normal',
                        trail: []
                    });
                }

                var moon = { x: 0, y: 0, r: 7, color: '#cccccc', orbit: 35, speed: 0.08, angle: 0, ex: 0, ey: 0 };

                function animate() {
                    var time = Date.now() / 2000;
                    var now = new Date();
                    var seconds = now.getSeconds();
                    var minutes = now.getMinutes();
                    var hours = now.getHours() % 12;

                    ctx.clearRect(0, 0, W, H);

                    // Schöner Himmelshintergrund
                    var bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.9);
                    var hue1 = 220 + 15 * Math.sin(time * 0.08);
                    var hue2 = 240 + 20 * Math.sin(time * 0.05 + 1);
                    bgGrad.addColorStop(0, 'hsl(' + hue1 + ', 60%, 15%)');
                    bgGrad.addColorStop(0.4, 'hsl(' + hue2 + ', 50%, 10%)');
                    bgGrad.addColorStop(0.7, 'hsl(260, 40%, 6%)');
                    bgGrad.addColorStop(1, '#000005');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, W, H);

                    // Planeten-Trails (leichte Spuren)
                    for (var pt = 0; pt < planets.length; pt++) {
                        var pTrail = planets[pt];
                        if (pTrail.trail) {
                            for (var ti = 0; ti < pTrail.trail.length; ti++) {
                                var t2 = pTrail.trail[ti];
                                ctx.fillStyle = 'rgba(255,255,255,' + (t2.life * 0.03) + ')';
                                ctx.beginPath();
                                ctx.arc(t2.x, t2.y, 1.5, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    }

                    // Sonne
                    sun.phase += sun.pulseSpeed;
                    var pulse = 1 + 0.05 * Math.sin(sun.phase);
                    var radius = sun.radius * pulse;

                    // Sonnen-Glow
                    for (var g = 15; g > 0; g--) {
                        var grad = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * g * 0.1);
                        var alpha = 0.04 / g;
                        grad.addColorStop(0, 'rgba(255, 220, 68, ' + alpha + ')');
                        grad.addColorStop(0.5, 'rgba(255, 180, 50, ' + alpha * 0.5 + ')');
                        grad.addColorStop(1, 'rgba(255, 100, 20, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(sun.x, sun.y, sun.glow * g * 0.1, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Sonnenkörper
                    var sunGrad = ctx.createRadialGradient(
                        sun.x - radius * 0.3, sun.y - radius * 0.3, 0,
                        sun.x, sun.y, radius
                    );
                    sunGrad.addColorStop(0, '#ffeecc');
                    sunGrad.addColorStop(0.2, '#ffdd55');
                    sunGrad.addColorStop(0.5, '#ffaa00');
                    sunGrad.addColorStop(0.75, '#ff7700');
                    sunGrad.addColorStop(0.9, '#ff4400');
                    sunGrad.addColorStop(1, '#cc2200');
                    ctx.fillStyle = sunGrad;
                    ctx.shadowColor = '#ffdd44';
                    ctx.shadowBlur = 50;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // HalDo Logo in der Sonne
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = 'bold ' + (radius * 0.55) + 'px system-ui, sans-serif';
                    ctx.shadowColor = 'rgba(255,255,255,0.6)';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('⟡', sun.x, sun.y - radius * 0.05);
                    ctx.shadowBlur = 0;

                    // Sonnenstrahlen
                    for (var fl = 0; fl < sun.flares; fl++) {
                        var fAngle = fl * (Math.PI / (sun.flares / 2)) + sun.phase * 0.2;
                        var len = radius * (1.4 + 0.4 * Math.sin(sun.phase * 0.6 + fl * 0.4));
                        ctx.strokeStyle = 'rgba(255, 220, 68, ' + (0.04 + 0.03 * Math.sin(sun.phase + fl)) + ')';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(sun.x + Math.cos(fAngle) * radius * 0.6, sun.y + Math.sin(fAngle) * radius * 0.6);
                        ctx.lineTo(sun.x + Math.cos(fAngle) * len, sun.y + Math.sin(fAngle) * len);
                        ctx.stroke();
                    }

                    // Planeten
                    for (var pp = 0; pp < planets.length; pp++) {
                        var pl = planets[pp];

                        if (pl.role === 'second') {
                            pl.angle = (seconds / 60) * Math.PI * 2;
                        } else if (pl.role === 'minute') {
                            pl.angle = (minutes / 60) * Math.PI * 2 + (seconds / 60) * (Math.PI * 2 / 60);
                        } else if (pl.role === 'hour') {
                            pl.angle = (hours / 12) * Math.PI * 2 + (minutes / 60) * (Math.PI * 2 / 12);
                        } else {
                            pl.angle += pl.speed;
                        }

                        var px = pl.cx + Math.cos(pl.angle) * pl.orbit;
                        var py = pl.cy + Math.sin(pl.angle) * pl.orbit;

                        // Trail
                        if (pl.role === 'normal') {
                            if (!pl.trail) pl.trail = [];
                            pl.trail.push({ x: px, y: py, life: 1 });
                            if (pl.trail.length > 35) pl.trail.shift();
                            for (var ti2 = 0; ti2 < pl.trail.length; ti2++) {
                                pl.trail[ti2].life *= 0.98;
                            }
                        }

                        // Orbit (sehr dezent)
                        ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([3, 6]);
                        ctx.beginPath();
                        ctx.arc(pl.cx, pl.cy, pl.orbit, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Planet-Glow
                        var pGlow = ctx.createRadialGradient(px, py, 0, px, py, pl.r * 3);
                        pGlow.addColorStop(0, pl.color + '40');
                        pGlow.addColorStop(0.5, pl.color + '15');
                        pGlow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = pGlow;
                        ctx.beginPath();
                        ctx.arc(px, py, pl.r * 3, 0, Math.PI * 2);
                        ctx.fill();

                        // Planet
                        ctx.shadowColor = pl.color;
                        ctx.shadowBlur = 15;
                        ctx.fillStyle = pl.color;
                        ctx.beginPath();
                        ctx.arc(px, py, pl.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        // Saturn-Ring
                        if (pl.name === 'Saturn') {
                            ctx.strokeStyle = 'rgba(200, 180, 150, 0.35)';
                            ctx.lineWidth = 4;
                            ctx.beginPath();
                            ctx.ellipse(px, py, pl.r * 2, pl.r * 0.4, 0.3, 0, Math.PI * 2);
                            ctx.stroke();
                            ctx.strokeStyle = 'rgba(200, 180, 150, 0.2)';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.ellipse(px, py, pl.r * 2.4, pl.r * 0.6, -0.2, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        // Name
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.font = '8px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText(pl.name, px, py + pl.r + 6);

                        // Rolle
                        if (pl.role === 'second') {
                            ctx.fillStyle = 'rgba(255,200,100,0.3)';
                            ctx.font = '6px sans-serif';
                            ctx.fillText('⏱ Sekunde', px, py + pl.r + 22);
                        } else if (pl.role === 'minute') {
                            ctx.fillStyle = 'rgba(100,200,255,0.3)';
                            ctx.font = '6px sans-serif';
                            ctx.fillText('⏱ Minute', px, py + pl.r + 22);
                        } else if (pl.role === 'hour') {
                            ctx.fillStyle = 'rgba(255,100,100,0.3)';
                            ctx.font = '6px sans-serif';
                            ctx.fillText('⏱ Stunde', px, py + pl.r + 22);
                        }

                        if (pl.name === 'Erde') {
                            moon.ex = px;
                            moon.ey = py;
                        }
                    }

                    // Mond
                    if (moon.ex !== undefined) {
                        moon.angle += moon.speed;
                        moon.x = moon.ex + Math.cos(moon.angle) * moon.orbit;
                        moon.y = moon.ey + Math.sin(moon.angle) * moon.orbit;

                        var mGlow = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.r * 3);
                        mGlow.addColorStop(0, 'rgba(200,200,200,0.15)');
                        mGlow.addColorStop(0.5, 'rgba(200,200,200,0.05)');
                        mGlow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = mGlow;
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r * 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.shadowColor = '#cccccc';
                        ctx.shadowBlur = 12;
                        ctx.fillStyle = '#dddddd';
                        ctx.beginPath();
                        ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        // Krater
                        ctx.fillStyle = 'rgba(150,150,150,0.25)';
                        ctx.beginPath();
                        ctx.arc(moon.x - 3, moon.y - 3, 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(moon.x + 4, moon.y + 2, 1.5, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = 'rgba(255,255,255,0.12)';
                        ctx.font = '6px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'top';
                        ctx.fillText('🌙 Mond', moon.x, moon.y + moon.r + 4);
                    }

                    // Sterne (mit Twinkling)
                    var time2 = Date.now() / 2500;
                    for (var st = 0; st < stars.length; st++) {
                        var s2 = stars[st];
                        s2.y += s2.speed;
                        if (s2.y > H) { s2.y = 0;
                            s2.x = Math.random() * W; }
                        var bright = s2.bright * (0.6 + 0.4 * Math.sin(time2 * 1.5 + s2.phase));
                        ctx.globalAlpha = bright;
                        ctx.fillStyle = s2.color;
                        ctx.beginPath();
                        ctx.arc(s2.x, s2.y, s2.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;

                    // Uhrzeit
                    var hh = String(now.getHours()).padStart(2, '0');
                    var mm2 = String(now.getMinutes()).padStart(2, '0');
                    var ss3 = String(now.getSeconds()).padStart(2, '0');
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.font = '13px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('🕐 ' + hh + ':' + mm2 + ':' + ss3, 16, H - 50);

                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.font = '8px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('⏱ Sekunde · ⏱ Minute · ⏱ Stunde · 🌙 Mond · ☀️ Klicke die Sonne für HalDo AI', 16, H -
                        32);

                    requestAnimationFrame(animate);
                }

                animate();

                // Sonne klickbar
                cosmicCanvas.addEventListener('click', function(e) {
                    var rect = cosmicCanvas.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top;
                    var dx = x - sun.x,
                        dy = y - sun.y;
                    if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 1.5) {
                        launchApp('ai');
                        notify('☀️ HalDo AI geöffnet!');
                    }
                });

                cosmicCanvas.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    var rect = cosmicCanvas.getBoundingClientRect();
                    var x = t.clientX - rect.left;
                    var y = t.clientY - rect.top;
                    var dx = x - sun.x,
                        dy = y - sun.y;
                    if (Math.sqrt(dx * dx + dy * dy) < sun.radius * 2) {
