<script>

    HD.events = HD.events || {};


    HD.events.listeners =
        HD.events.listeners || {};


    HD.events.history =
        HD.events.history || [];


    HD.events.maxHistory =
        500;


    HD.events.on =
        function(
            event,
            callback,
            options = {}
        ) {

            if (
                typeof event !==
                "string"
            ) {

                return function(){};

            }


            if (
                typeof callback !==
                "function"
            ) {

                return function(){};

            }


            if (
                !Array.isArray(
                    this.listeners[event]
                )
            ) {

                this.listeners[event] =
                    [];

            }


            const listener = {

                callback,

                once:
                    options.once === true,

                priority:
                    Number(
                        options.priority || 0
                    )

            };


            this.listeners[event]
                .push(
                    listener
                );


            this.listeners[event]
                .sort(
                    (
                        a,
                        b
                    ) =>
                        b.priority -
                        a.priority
                );


            return function unsubscribe() {

                HD.events.off(
                    event,
                    callback
                );

            };

        };


    HD.events.once =
        function(
            event,
            callback,
            options = {}
        ) {

            return this.on(
                event,
                callback,
                {
                    ...options,
                    once:
                        true
                }
            );

        };


    HD.events.off =
        function(
            event,
            callback
        ) {

            const list =
                this.listeners[event];


            if (
                !Array.isArray(
                    list
                )
            ) {

                return;

            }


            this.listeners[event] =
                list.filter(
                    listener =>
                        listener.callback !==
                        callback
                );

        };


    HD.events.emit =
        function(
            event,
            data = {}
        ) {

            if (
                typeof event !==
                "string"
            ) {

                return false;

            }


            const record = {

                event,

                data,

                time:
                    Date.now()

            };


            this.history.push(
                record
            );


            if (
                this.history.length >
                this.maxHistory
            ) {

                this.history.shift();

            }


            const list =
                this.listeners[event];


            if (
                !Array.isArray(
                    list
                )
            ) {

                return true;

            }


            list
                .slice()
                .forEach(
                    listener => {

                        try {

                            listener.callback(
                                data
                            );

                        }
                        catch (
                            error
                        ) {

                            HD.errors.report(
                                error,
                                "EventBus:" +
                                event
                            );

                        }


                        if (
                            listener.once
                        ) {

                            this.off(
                                event,
                                listener.callback
                            );

                        }

                    }
                );


            return true;

        };


    HD.events.clear =
        function(
            event = null
        ) {

            if (
                event === null
            ) {

                this.listeners =
                    {};

                return;

            }


            delete this.listeners[
                event
            ];

        };


    HD.events.getHistory =
        function(
            event = null
        ) {

            if (
                !event
            ) {

                return [
                    ...this.history
                ];

            }


            return this.history.filter(
                item =>
                    item.event ===
                    event
            );

        };


    /*
     * Globale Kurzform.
     */

    HD.on =
        function(
            event,
            callback,
            options
        ) {

            return HD.events.on(
                event,
                callback,
                options
            );

        };


    HD.once =
        function(
            event,
            callback,
            options
        ) {

            return HD.events.once(
                event,
                callback,
                options
            );

        };


    HD.off =
        function(
            event,
            callback
        ) {

            return HD.events.off(
                event,
                callback
            );

        };


    HD.emit =
        function(
            event,
            data
        ) {

            return HD.events.emit(
                event,
                data
            );

        };


</script>

<script>

    HD.runtime =
        HD.runtime || {};


    HD.runtime.initialized =
        false;


    HD.runtime.modules =
        HD.runtime.modules ||
        new Map();


    HD.runtime.dependencies =
        HD.runtime.dependencies ||
        new Map();


    HD.runtime.startOrder =
        HD.runtime.startOrder ||
        [];


    HD.runtime.register =
        function(
            name,
            module,
            options = {}
        ) {

            if (
                !name ||
                !module
            ) {

                return false;

            }


            const entry = {

                name,

                module,

                initialized:
                    false,

                started:
                    false,

                priority:
                    Number(
                        options.priority || 0
                    ),

                dependencies:
                    Array.isArray(
                        options.dependencies
                    )
                        ? [
                            ...options.dependencies
                        ]
                        : []

            };


            this.modules.set(
                name,
                entry
            );


            this.dependencies.set(
                name,
                entry.dependencies
            );


            HD.emit(
                "runtime:module-registered",
                {
                    name,
                    module,
                    dependencies:
                        entry.dependencies
                }
            );


            return true;

        };


    HD.runtime.has =
        function(
            name
        ) {

            return this.modules.has(
                name
            );

        };


    HD.runtime.get =
        function(
            name
        ) {

            const entry =
                this.modules.get(
                    name
                );

            return entry
                ? entry.module
                : undefined;

        };


    HD.runtime.getEntry =
        function(
            name
        ) {

            return this.modules.get(
                name
            );

        };


    HD.runtime.unregister =
        function(
            name
        ) {

            if (
                !this.modules.has(
                    name
                )
            ) {

                return false;

            }


            this.modules.delete(
                name
            );

            this.dependencies.delete(
                name
            );


            HD.emit(
                "runtime:module-unregistered",
                {
                    name
                }
            );


            return true;

        };


    HD.runtime.list =
        function()
        {

            return Array.from(
                this.modules.values()
            );

        };


    HD.runtime.resolveOrder =
        function()
        {

            const visited =
                new Set();

            const visiting =
                new Set();

            const result =
                [];


            const visit =
                function(
                    name
                ) {

                    if (
                        visited.has(
                            name
                        )
                    ) {

                        return;

                    }


                    if (
                        visiting.has(
                            name
                        )
                    ) {

                        throw new Error(
                            "Runtime dependency cycle: " +
                            name
                        );

                    }


                    visiting.add(
                        name
                    );


                    const dependencies =
                        HD.runtime.dependencies
                            .get(
                                name
                            ) ||
                        [];


                    dependencies.forEach(
                        dependency => {

                            if (
                                HD.runtime.has(
                                    dependency
                                )
                            ) {

                                visit(
                                    dependency
                                );

                            }

                        }
                    );


                    visiting.delete(
                        name
                    );

                    visited.add(
                        name
                    );

                    result.push(
                        name
                    );

                };


            const modules =
                HD.runtime.list()
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            a.priority -
                            b.priority
                    );


            modules.forEach(
                entry => {

                    visit(
                        entry.name
                    );

                }
            );


            this.startOrder =
                result;


            return [
                ...result
            ];

        };


    HD.runtime.initialize =
        async function()
        {

            if (
                this.initialized
            ) {

                return true;

            }


            const order =
                this.resolveOrder();


            for (
                const name of order
            ) {

                const entry =
                    this.modules.get(
                        name
                    );


                if (
                    !entry
                ) {

                    continue;

                }


                const module =
                    entry.module;


                try {

                    if (
                        typeof module
                            .initialize ===
                        "function"
                    ) {

                        await module.initialize(
                            HD
                        );

                    }


                    entry.initialized =
                        true;


                    HD.emit(
                        "runtime:module-initialized",
                        {
                            name
                        }
                    );

                }
                catch (
                    error
                ) {

                    HD.errors.report(
                        error,
                        "Runtime.initialize:" +
                        name
                    );

                }

            }


            this.initialized =
                true;


            HD.emit(
                "runtime:initialized"
            );


            return true;

        };


    HD.runtime.start =
        async function()
        {

            const order =
                this.startOrder.length
                    ? this.startOrder
                    : this.resolveOrder();


            for (
                const name of order
            ) {

                const entry =
                    this.modules.get(
                        name
                    );


                if (
                    !entry ||
                    entry.started
                ) {

                    continue;

                }


                const module =
                    entry.module;


                try {

                    if (
                        typeof module.start ===
                        "function"
                    ) {

                        await module.start(
                            HD
                        );

                    }


                    entry.started =
                        true;


                    HD.emit(
                        "runtime:module-started",
                        {
                            name
                        }
                    );

                }
                catch (
                    error
                ) {

<script>

    HD.systemLoader = {

        loaded:
            false,

        components:
            [],

        queue:
            [],


        add:
            function(
                name,
                loader,
                options = {}
            ) {

                if (
                    typeof loader !==
                    "function"
                ) {

                    return false;

                }


                this.queue.push({

                    name,

                    loader,

                    priority:
                        Number(
                            options.priority ||
                            0
                        ),

                    required:
                        options.required !==
                        false

                });


                this.queue.sort(
                    (
                        a,
                        b
                    ) =>
                        a.priority -
                        b.priority
                );


                return true;

            },


        load:
            async function()
            {

                if (
                    this.loaded
                ) {

                    return true;

                }


                for (
                    const item
                    of this.queue
                ) {

                    try {

                        await item.loader(
                            HD
                        );


                        this.components.push(
                            item.name
                        );


                        HD.emit(
                            "loader:component-loaded",
                            {
                                name:
                                    item.name
                            }
                        );

                    }
                    catch (
                        error
                    ) {

                        HD.errors.report(
                            error,
                            "SystemLoader:" +
                            item.name
                        );


                        if (
                            item.required
                        ) {

                            throw error;

                        }

                    }

                }


                this.loaded =
                    true;


                HD.emit(
                    "loader:complete",
                    {
                        components:
                            [
                                ...this.components
                            ]
                    }
                );


                return true;

            }

    };


    HD.runtime.register(
        "system-loader",
        HD.systemLoader,
        {
            priority:
                20
        }
    );

</script>

<script>

    HD.storage =
        HD.storage || {};


    HD.storage.prefix =
        HD.constants.storagePrefix;


    HD.storage.memory =
        HD.storage.memory ||
        new Map();


    HD.storage.available =
        function()
        {

            try {

                const testKey =
                    this.prefix +
                    "__test__";

                localStorage.setItem(
                    testKey,
                    "1"
                );

                localStorage.removeItem(
                    testKey
                );

                return true;

            }
            catch (
                error
            ) {

                return false;

            }

        };


    HD.storage.key =
        function(
            key
        ) {

            return (
                this.prefix +
                String(key)
            );

        };


    HD.storage.serialize =
        function(
            value
        ) {

            try {

                return JSON.stringify(
                    value
                );

            }
            catch (
                error
            ) {

                HD.errors.report(
                    error,
                    "Storage.serialize"
                );

                return null;

            }

        };


    HD.storage.deserialize =
        function(
            value,
            fallback = null
        ) {

            try {

                return JSON.parse(
                    value
                );

            }
            catch (
                error
            ) {

                return fallback;

            }

        };


    HD.storage.set =
        function(
            key,
            value
        ) {

            const storageKey =
                this.key(
                    key
                );


            this.memory.set(
                storageKey,
                value
            );


            try {

                const serialized =
                    this.serialize(
                        value
                    );


                if (
                    serialized !==
                    null
                ) {

                    localStorage.setItem(
                        storageKey,
                        serialized
                    );

                }

            }
            catch (
                error
            ) {

                HD.errors.report(
                    error,
                    "Storage.set"
                );

            }


            HD.emit(
                "storage:set",
                {
                    key,
                    value
                }
            );


            return true;

        };


    HD.storage.get =
        function(
            key,
            fallback = null
        ) {

            const storageKey =
                this.key(
                    key
                );


            if (
                this.memory.has(
                    storageKey
                )
            ) {

                return this.memory.get(
                    storageKey
                );

            }


            try {

                const stored =
                    localStorage.getItem(
                        storageKey
                    );


                if (
                    stored ===
                    null
                ) {

                    return fallback;

                }


                const parsed =
                    this.deserialize(
                        stored,
                        fallback
                    );


                this.memory.set(
                    storageKey,
                    parsed
                );


                return parsed;

            }
            catch (
                error
            ) {

                return fallback;

            }

        };


    HD.storage.has =
        function(
            key
        ) {

            const storageKey =
                this.key(
                    key
                );


            if (
                this.memory.has(
                    storageKey
                )
            ) {

                return true;

            }


            try {

                return (
                    localStorage.getItem(
                        storageKey
                    ) !== null
                );

            }
            catch (
                error
            ) {

                return false;

            }

        };


    HD.storage.remove =
        function(
            key
        ) {

            const storageKey =
                this.key(
                    key
                );


            this.memory.delete(
                storageKey
            );


            try {

                localStorage.removeItem(
                    storageKey
                );

            }
            catch (
                error
            ) {}


            HD.emit(
                "storage:remove",
                {
                    key
                }
            );


            return true;

        };


    HD.storage.clear =
        function()
        {

            const prefix =
                this.prefix;


            this.memory.clear();


            try {

                const keys =
                    [];


                for (
                    let index = 0;
                    index <
                    localStorage.length;
                    index++
                ) {

                    const key =
                        localStorage.key(
                            index
                        );


                    if (
                        key &&
                        key.startsWith(
                            prefix
                        )
                    ) {

                        keys.push(
                            key
                        );

                    }

                }


                keys.forEach(
                    key => {

                        localStorage.removeItem(
                            key
                        );

                    }
                );

            }
            catch (
                error
            ) {

                HD.errors.report(
                    error,
                    "Storage.clear"
                );

            }


            HD.emit(
                "storage:clear"
            );


            return true;

        };


    HD.storage.keys =
        function()
        {

            const result =
                [];


            try {

                for (
                    let index = 0;
                    index <
                    localStorage.length;
                    index++
                ) {

                    const key =
                        localStorage.key(
                            index
                        );


                    if (
                        key &&
                        key.startsWith(
                            this.prefix
                        )
                    ) {

                        result.push(
                            key.slice(
                                this.prefix.length
                            )
                        );

                    }

                }

            }
            catch (
                error
            ) {}


            return result;

        };


    HD.storage.snapshot =
        function()
        {

            const snapshot =
                {};


            this.keys()
                .forEach(
                    key => {

                        snapshot[key] =
                            this.get(
                                key
                            );

                    }
                );


            return snapshot;

        };


    HD.services.register(
        "storage",
        HD.storage
    );


    HD.runtime.register(
        "storage",
        HD.storage,
        {
            priority:
                40,

            dependencies:
                [
                    "services"
                ]
        }
    );


    /*
     * Storage-Verfügbarkeit sofort feststellen.
     */

    HD.storage.available();

</script>

<script>

HD.appFoundation = {

    version: "22.0.0",

    createDefinition(manifest) {

        if (!manifest || !manifest.id) {
            throw new Error(
                "HalDo App Foundation: ungültiges Manifest."
            );
        }

        return {

            id: manifest.id,

            name:
                manifest.name ||
                manifest.id,

            category:
                manifest.category ||
                "System",

            icon:
                manifest.icon ||
                "○",

            description:
                manifest.description ||
                "",

            persistent:

                false,

            opened:
                false,

                false,

            active:
                false,

            destroyed:
                false

    },


    initialize(instance) {

        if (!instance) {

        instance.initialized = true;

            "app:initialized",
            {
                app: instance
            }
        );

        return true;
    },


    destroy(instance) {

        if (!instance) {

        instance.destroyed = true;
        instance.active = false;

        HD.emit(
            "app:destroyed",
            {
                app: instance
            }
        );

        return true;
    }

};


HD.runtime.register(
    "app-foundation",
    HD.appFoundation
);


/* =========================================================
   APP STATE SYSTEM
   ========================================================= */

HD.appState = HD.appState || {};

HD.appState.cache =
    HD.appState.cache ||
    new Map();


HD.appState.storagePrefix =
    "app-state:";


HD.appState.load = function(appId) {

    if (!appId) {
        return {};
    }

    if (
        this.cache.has(appId)
    ) {

        return this.cache.get(
            appId
        );
    }

    let state = {};

    try {

        state =
            HD.storage.get(
                this.storagePrefix +
                appId,
                {}
            ) || {};

    }
    catch (error) {

        console.warn(
            "HalDo App State Load:",
            error
        );

    }

    this.cache.set(
        appId,
        state
    );

    return state;
};


HD.appState.save = function(
    appId,
    state
) {

    if (!appId) {
        return false;
    }

    const safeState =
        state || {};

    this.cache.set(
        appId,
        safeState
    );

    try {

        HD.storage.set(
            this.storagePrefix +
            appId,
            safeState
        );

    }
    catch (error) {

        console.warn(
            "HalDo App State Save:",
            error
        );

        return false;
    }

    HD.emit(
        "app:state:saved",
        {
            appId,
            state: safeState
        }
    );

    return true;
};


HD.appState.get = function(
    appId
) {

    return this.load(
        appId
    );
};


HD.appState.update = function(
    appId,
    changes
) {

    const state =
        this.load(appId);

    Object.assign(
        state,
        changes || {}
    );

    return this.save(
        appId,
        state
    );
};


HD.appState.clear = function(
    appId
) {

    if (!appId) {
        return false;
    }

    this.cache.delete(
        appId
    );

    try {

        HD.storage.remove(
            this.storagePrefix +
            appId
        );

    }
    catch (error) {}

    HD.emit(
        "app:state:cleared",
        {
            appId
        }
    );

    return true;
};


HD.runtime.register(
    "app-state",
    HD.appState
);

        const layer =

    bindWindow(record) {

        if (!record) {
            return;

        const element =
            record.element;


        element.addEventListener(
            "mousedown",
            () => {

                this.activate(
                    record
                );

            }
        );


        const controls =
            element.querySelectorAll(
                "[data-window-action]"

        controls.forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        const action =
                            button.dataset
                                .windowAction;


                        if (
                            action ===
                            "close"
                        ) {

                            this.close(
                                record.app.id
                            );

                        }


                        else if (
                            action ===
                            "minimize"
                        ) {

                            this.minimize(
                                record.app.id
                            );

                        }


                        else if (
                            action ===
                            "maximize"
                        ) {

                            this.toggleMaximize(
                                record.app.id
                            );

                        }

                    }
                );

            }
        );


        this.makeDraggable(

        this.makeResizable(
            record
        );

    activate(record) {

        if (!record) {
            return;
        }


        this.windows.forEach(
            item => {

                if (
                    item === record
                ) {

                    item.app.activate();

                }
                else {

                    item.app.deactivate();

                }

            }
        );


        record.element.style.zIndex =
            ++this.zIndex;


        this.activeWindow =
            record;


        HD.emit(
            "window:activated",
            {
                window:
                    record
            }
        );
    },


    close(appId) {

        if (!record) {

        }


        this.saveGeometry(

        );


        record.app.close();


        record.element.remove();


        this.windows.delete(
            appId
        );


        if (
            this.activeWindow ===
            record

            this.activeWindow =

        HD.emit(
            "window:closed",
            {
                appId
            }
        );

    },


    minimize(appId) {

        const record =
            this.windows.get(
                appId

        if (!record) {

        HD.emit(

            }

    restore(appId) {

        record.minimized =

        record.element.classList

        record.app.restore();


        this.activate(

        HD.emit(

            }

    toggleMaximize(appId) {

        if (

        else {

                    "maximized"

            record.maximized =

        this.activate(

        );


        HD.emit(
            "window:maximized",

                appId,

        return true;

    saveGeometry(record) {

        if (!record) {
            return;
        }


        const element =
            record.element;


        const geometry = {

            width:
                element.offsetWidth,

            height:
                element.offsetHeight,

            left:
                parseFloat(
                    element.style.left
                ) || 0,

            top:
                parseFloat(
                    element.style.top

        if (
            !record.maximized

            HD.storage.set(
                "window:" +
                record.app.id,
                geometry
            );

        }


        record.savedGeometry =
            geometry;

    restoreGeometry(record) {

        if (!record) {
            return;

        const geometry =
            record.savedGeometry ||
            HD.storage.get(
                "window:" +
                record.app.id,
                null
            );


        if (!geometry) {
            return;
        }


        record.element.style.width =
            geometry.width +
            "px";


        record.element.style.height =
            geometry.height +
            "px";


        record.element.style.left =
            geometry.left +
            "px";


        record.element.style.top =
            geometry.top +
            "px";
    },


    makeDraggable(record) {

        const element =
            record.element;


        const header =
            element.querySelector(
                ".haldo-window-header"
            );


        if (!header) {
            return;
        }


        let dragging =
            false;

        let startX =
            0;

        let startY =
            0;

        let originalLeft =
            0;

        let originalTop =
            0;


        header.addEventListener(
            "pointerdown",
            event => {

                if (
                    record.maximized
                ) {

                    return;
                }


                if (
                    event.target.closest(
                        ".haldo-window-controls"
                    )
                ) {

                    return;
                }


                dragging =
                    true;


                startX =
                    event.clientX;

                startY =
                    event.clientY;


                originalLeft =
                    parseFloat(
                        element.style.left
                    ) || 0;


                originalTop =
                    parseFloat(
                        element.style.top
                    ) || 0;


                header.setPointerCapture(
                    event.pointerId
                );


                this.activate(
                    record
                );

            }
        );


        header.addEventListener(
            "pointermove",
            event => {

                if (!dragging) {
                    return;
                }


                const deltaX =
                    event.clientX -
                    startX;


                const deltaY =
                    event.clientY -
                    startY;


                element.style.left =
                    (
                        originalLeft +
                        deltaX
                    ) + "px";


                element.style.top =
                    (
                        originalTop +
                        deltaY
                    ) + "px";

            }
        );


        header.addEventListener(
            "pointerup",
            event => {

                if (!dragging) {
                    return;
                }


                dragging =
                    false;


                try {

                    header.releasePointerCapture(
                        event.pointerId
                    );

                }
                catch (error) {}


                this.saveGeometry(
                    record
                );

            }
        );

    },


    makeResizable(record) {

        const element =
            record.element;


        let resizeHandle =
            element.querySelector(
                ".haldo-window-resize"
            );


        if (!resizeHandle) {

            resizeHandle =
                document.createElement(
                    "div"
                );


            resizeHandle.className =
                "haldo-window-resize";


            element.appendChild(
                resizeHandle
            );

        }


        let resizing =
            false;


        let startX =
            0;

        let startY =
            0;

        let startWidth =
            0;

        let startHeight =
            0;


        resizeHandle.addEventListener(
            "pointerdown",
            event => {

                if (
                    record.maximized
                ) {

                    return;
                }


                resizing =
                    true;


                startX =
                    event.clientX;

                startY =
                    event.clientY;


                startWidth =
                    element.offsetWidth;

                startHeight =
                    element.offsetHeight;


                resizeHandle.setPointerCapture(
                    event.pointerId
                );


                this.activate(
                    record
                );

            }
        );


        resizeHandle.addEventListener(
            "pointermove",
            event => {

                if (!resizing) {
                    return;
                }


                const width =
                    Math.max(
                        HD.config
                            .minimumWindowWidth ||
                        360,

                        startWidth +
                        (
                            event.clientX -
                            startX
                        )
                    );


                const height =
                    Math.max(
                        HD.config
                            .minimumWindowHeight ||
                        240,

                        startHeight +
                        (
                            event.clientY -
                            startY
                        )
                    );


                element.style.width =
                    width + "px";


                element.style.height =
                    height + "px";

            }
        );


        resizeHandle.addEventListener(
            "pointerup",
            event => {

                if (!resizing) {
                    return;
                }


                resizing =
                    false;


                try {

                    resizeHandle.releasePointerCapture(
                        event.pointerId
                    );

                }
                catch (error) {}


                this.saveGeometry(
                    record
                );

            }
        );

    },


    get(appId) {

        return this.windows.get(
            appId
        );
    },


    all() {

        return Array.from(
            this.windows.values()
        );
    },


    escape(value) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }

};

HD.appManager = {

        "22.0.0",


    open(appId, options = {}) {

        if (!appId) {
            return null;

        const manifest =
            HD.appRegistry.get(

        if (!manifest) {

                .getOrCreate(
                    appId

        if (
            app.opened &&
            !app.minimized
        ) {

                HD.windowManager.get(

                );


            if (existing) {

            return app;

            );

            );

            return;
        }


        const customRenderer =
            HD.appRouter.resolve(
                app.id
            );


        if (
            typeof customRenderer ===
            "function"
        ) {

            customRenderer(
                content,
                app,
                options
            );

            return;
        }


        content.innerHTML = `

            <div class="haldo-generic-app">

                <div class="haldo-generic-app-icon">
                    ${HD.windowManager.escape(
                        app.manifest.icon ||
                        "○"
                    )}
                </div>

                    )}
                </p>

                <div
                    class="haldo-generic-app-status"
                >
                    ● APP ONLINE
                </div>

            </div>

        `;

    },


    closeAll() {

        const ids =
            Array.from(
                HD.windowManager
                    .windows
                    .keys()
            );

                );

        HD.appRegistry
            .all()
            .forEach(
                manifest => {

                    if (
                        !manifest

                        return;
                    }

                            );


                    if (
                        state &&
                        state.wasOpen
                    ) {

                        this.open(
                            manifest.id
                        );

                    }

                }
            );

    }

};

<script>

/* =========================================================

HD.contentSystem = {

    version: "22.0.0",

    collections: new Map(),

    createId(prefix = "item") {

        return (
            prefix +
            "-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2, 9)
        );
    },


    getCollection(appId, name = "default") {

        const key =
            appId +
            ":" +
            name;

        if (
            !this.collections.has(key)
        ) {

            const stored =
                HD.storage.get(
                    "collection:" + key,
                    []
                );

            this.collections.set(
                key,
                Array.isArray(stored)
                    ? stored
                    : []
            );
        }

        return this.collections.get(key);
    },


    saveCollection(
        appId,
        name,
        collection
    ) {

        const key =
            appId +
            ":" +
            name;

        const safeCollection =
            Array.isArray(collection)
                ? collection
                : [];

        this.collections.set(
            key,
            safeCollection
        );

        HD.storage.set(
            "collection:" + key,
            safeCollection
        );

        HD.emit(
            "content:collection:saved",
            {
                appId,
                name,
                collection:
                    safeCollection
            }
        );

        return true;
    },


    add(
        appId,
        name,
        data = {}
    ) {

        const collection =
            this.getCollection(
                appId,
                name
            );

        const item = {

            id:
                data.id ||
                this.createId(
                    appId
                ),

            createdAt:
                data.createdAt ||
                Date.now(),

            updatedAt:
                Date.now(),

            ...data

        };

        collection.push(
            item
        );

        this.saveCollection(
            appId,
            name,
            collection
        );

        HD.emit(
            "content:created",
            {
                appId,
                name,
                item
            }
        );

        return item;
    },


    update(
        appId,
        name,
        id,
        changes = {}
    ) {

        const collection =
            this.getCollection(
                appId,
                name
            );

        const index =
            collection.findIndex(
                item =>
                    item.id === id
            );

        if (index < 0) {
            return null;
        }

        collection[index] = {

            ...collection[index],

            ...changes,

            updatedAt:
                Date.now()

        };

        this.saveCollection(
            appId,
            name,
            collection
        );

        HD.emit(
            "content:updated",
            {
                appId,
                name,
                item:
                    collection[index]
            }
        );

        return collection[index];
    },


    remove(
        appId,
        name,
        id
    ) {

        const collection =
            this.getCollection(
                appId,
                name
            );

        const index =
            collection.findIndex(
                item =>
                    item.id === id
            );

        if (index < 0) {
            return false;
        }

        const removed =
            collection.splice(
                index,
                1
            )[0];

        this.saveCollection(
            appId,
            name,
            collection
        );

        HD.emit(
            "content:deleted",
            {
                appId,
                name,
                item:
                    removed
            }
        );

        return true;
    },


    clear(
        appId,
        name
    ) {

        this.saveCollection(
            appId,
            name,
            []
        );

        HD.emit(
            "content:cleared",
            {
                appId,
                name
            }
        );

        return true;
    },


    all(
        appId,
        name
    ) {

        return [
            ...this.getCollection(
                appId,
                name
            )
        ];
    }

};


HD.runtime.register(

        );

    restore(

    ) {

            this.get(

            );

        const index =
            trash.findIndex(
                item =>

        if (index < 0) {
            return null;
        }

        const item =
            trash.splice(
                index,
                1
            )[0];

        this.save(
            appId,
            trash
        );

        delete item.deletedAt;
        delete item.source;

        return HD.contentSystem.add(
            appId,
            collectionName,
            item
        );
    },


    empty(appId) {

        this.save(
            appId,
            []
        );

        return true;
    }

};

HD.notes = {

    appId:
        "notes",

    collection:
        "notes",


    list() {

        return HD.contentSystem.all(
            this.appId,
            this.collection
        );
    },


    create(
        title = "Neue Notiz",
        text = ""
    ) {

        return HD.contentSystem.add(
            this.appId,
            this.collection,
            {

                title,

                text,

                pinned:
                    false

            }
        );
    },


    update(
        id,
        changes
    ) {

        return HD.contentSystem.update(
            this.appId,
            this.collection,
            id,
            changes
        );
    },


    delete(id) {

        const note =
            this.list()
                .find(
                    item =>
                        item.id === id
                );

        if (!note) {
            return false;
        }

        HD.recycleBin.move(
            this.appId,
            note,
            this.collection
        );

        return HD.contentSystem.remove(
            this.appId,
            this.collection,
            id
        );
    },


    restore(id) {

        return HD.recycleBin.restore(
            this.appId,
            id,
            this.collection
        );
    }

};

HD.appRouter.register(
    "notes",
    function(
        container,
        app
    ) {

        let selectedId =
            app.getState(
                "selectedNote",
                null
            );


        function render() {

            const notes =
                HD.notes.list();


            container.innerHTML = `

                <div class="haldo-notes-app">

                    <div class="haldo-app-toolbar">

                        <button
                            type="button"
                            class="haldo-app-button"

                        </button>

                        <button
                            type="button"
                            class="haldo-app-button"
                            id="notes-delete"
                        >
                            Löschen
                        </button>

                        <button
                            type="button"
                            class="haldo-app-button"
                            id="notes-restore"
                        >
                            Wiederherstellen
                        </button>

                    </div>


                    <div class="haldo-notes-layout">

                        <aside
                            class="haldo-notes-list"
                        >

                            <div class="haldo-section-title">
                                Meine Notizen
                            </div>

                            <div
                                class="haldo-notes-items"
                            ></div>

                        </aside>


                        <section
                            class="haldo-note-editor"
                        >

                            <input
                                id="haldo-note-title"
                                class="haldo-note-title"
                                type="text"
                                placeholder="Titel"
                            >

                            <textarea
                                id="haldo-note-text"
                                class="haldo-note-text"
                                placeholder="Schreibe hier deine Notiz ..."
                            ></textarea>

                        </section>

                    </div>

                </div>

            `;


            const listElement =
                container.querySelector(
                    ".haldo-notes-items"
                );


            notes.forEach(
                note => {

                    const item =
                        document.createElement(
                            "button"
                        );

                    item.type =
                        "button";

                    item.className =
                        "haldo-note-item";


                    if (
                        note.id ===
                        selectedId
                    ) {

                        item.classList
                            .add(
                                "selected"
                            );
                    }


                    item.innerHTML = `

                        <strong>
                            ${HD.appUI.escape(
                                note.title ||
                                "Ohne Titel"
                            )}
                        </strong>

                        <small>
                            ${HD.appUI.escape(
                                (
                                    note.text ||
                                    ""
                                )
                                .slice(
                                    0,
                                    80
                                )
                            )}
                        </small>

                    `;


                    item.addEventListener(
                        "click",
                        function() {

                            selectedId =
                                note.id;

                            app.setState(
                                "selectedNote",
                                selectedId
                            );

                            render();

                        }
                    );


                    listElement.appendChild(
                        item
                    );

                }
            );


            let selected =
                notes.find(
                    note =>
                        note.id ===
                        selectedId
                );


            if (
                !selected &&
                notes.length
            ) {

                selected =
                    notes[0];

                selectedId =
                    selected.id;

                app.setState(
                    "selectedNote",
                    selectedId
                );

            }


            const titleInput =
                container.querySelector(
                    "#haldo-note-title"
                );


            const textInput =
                container.querySelector(
                    "#haldo-note-text"
                );


            if (selected) {

                titleInput.value =
                    selected.title ||
                    "";

                textInput.value =
                    selected.text ||
                    "";

            }


            container
                .querySelector(
                    "#notes-new"
                )
                .addEventListener(
                    "click",
                    function() {

                        const note =
                            HD.notes.create();

                        selectedId =
                            note.id;

                        app.setState(
                            "selectedNote",
                            selectedId
                        );

                        render();

                        titleInput?.focus();

                    }
                );


            container
                .querySelector(
                    "#notes-save"
                )
                .addEventListener(
                    "click",
                    function() {

                        if (!selected) {

                            const note =
                                HD.notes.create(
                                    titleInput
                                        .value ||
                                    "Neue Notiz",

                                    textInput
                                        .value ||
                                    ""
                                );

                            selectedId =
                                note.id;

                        }
                        else {

                            HD.notes.update(
                                selected.id,

                                {

                                    title:
                                        titleInput
                                            .value,

                                    text:
                                        textInput
                                            .value

                                }
                            );

                        }

                        app.setState(
                            "selectedNote",
                            selectedId
                        );

                        render();

                    }
                );


            container
                .querySelector(
                    "#notes-delete"
                )
                .addEventListener(
                    "click",
                    function() {

                        if (!selected) {
                            return;
                        }

                        HD.notes.delete(
                            selected.id
                        );

                        selectedId =
                            null;

                        app.setState(
                            "selectedNote",
                            null
                        );

                        render();

                    }
                );


            container
                .querySelector(
                    "#notes-restore"
                )
                .addEventListener(
                    "click",
                    function() {

                        const trash =
                            HD.recycleBin.get(
                                "notes"
                            );


                        if (
                            !trash.length
                        ) {

                            return;
                        }


                        const latest =
                            trash[
                                trash.length - 1
                            ];


                        const restored =
                            HD.notes.restore(
                                latest.id
                            );


                        if (
                            restored
                        ) {

                            selectedId =
                                restored.id;

                            app.setState(
                                "selectedNote",
                                selectedId
                            );

                            render();

                        }

                    }
                );

        }


        render();

    }
);

HD.appRouter.register(
    "calculator",
    function(
        container,
        app
    ) {

        let expression =
            app.getState(
                "expression",
                ""
            );


        container.innerHTML = `

            <div class="haldo-calculator">

                <input
                    class="haldo-calculator-display"
                    id="haldo-calculator-display"
                    type="text"
                    value="${HD.appUI.escape(
                        expression
                    )}"
                    inputmode="decimal"
                    autocomplete="off"
                >


                <div
                    class="haldo-calculator-grid"
                >

                    ${[
                        "7","8","9","/",
                        "4","5","6","*",
                        "1","2","3","-",
                        "0",".","=","+"
                    ]
                    .map(
                        value => `

                            <button
                                type="button"
                                class="haldo-calc-button"
                                data-value="${value}"
                            >
                                ${value}
                            </button>

                        `
                    )
                    .join("")}

                </div>


                <button
                    type="button"
                    class="haldo-app-button"
                    id="calculator-clear"
                >
                    Löschen
                </button>

            </div>

        `;


        const display =
            container.querySelector(
                "#haldo-calculator-display"
            );


        container
            .querySelectorAll(
                ".haldo-calc-button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        function() {

                            const value =
                                this.dataset
                                    .value;


                            if (
                                value ===
                                "="
                            ) {

                                try {

                                    /*
                                     * Nur einfache
                                     * mathematische
                                     * Zeichen zulassen.
                                     */

                                    if (
                                        !/^[0-9+\-*/().\s]+$/
                                            .test(
                                                display
                                                    .value
                                            )
                                    ) {

                                        throw new Error(
                                            "Ungültiger Ausdruck"
                                        );

                                    }


                                    display.value =
                                        Function(
                                            '"use strict";return (' +
                                            display.value +
                                            ')'
                                        )();


                                }
                                catch (error) {

                                    display.value =
                                        "Fehler";

                                }

                            }
                            else {

                                display.value +=
                                    value;

                            }


                            expression =
                                display.value;

                            app.setState(
                                "expression",
                                expression
                            );

                        }
                    );

                }
            );


        container
            .querySelector(
                "#calculator-clear"
            )
            .addEventListener(
                "click",
                function() {

                    display.value =
                        "";

                    expression =
                        "";

                    app.setState(
                        "expression",
                        ""
                    );

                }
            );

    }
);

HD.appRouter.register(
    "clock",
    function(
        container,
        app
    ) {

        container.innerHTML = `

            <div class="haldo-clock-app">

                <div
                    class="haldo-clock-time"
                    id="app-clock-time"
                >
                    --:--:--
                </div>

                <div
                    class="haldo-clock-date"
                    id="app-clock-date"
                >
                    --
                </div>

                <div
                    class="haldo-clock-status"
                >
                    ● LIVE
                </div>

            </div>

        `;


        function update() {

            const now =
                new Date();


            const time =
                now.toLocaleTimeString(
                    "de-DE",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit"
                    }
                );


            const date =
                now.toLocaleDateString(
                    "de-DE",
                    {
                        weekday:
                            "long",

                        day:
                            "2-digit",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );


            const timeElement =
                container.querySelector(
                    "#app-clock-time"
                );


            const dateElement =
                container.querySelector(
                    "#app-clock-date"
                );


            if (timeElement) {
                timeElement.textContent =
                    time;
            }


            if (dateElement) {
                dateElement.textContent =
                    date;
            }

        }


        update();


        const timer =
            setInterval(
                update,
                1000
            );


        app.setState(
            "clockActive",
            true
        );


        HD.on(
            "window:closed",
            event => {

                if (
                    event &&
                    event.appId ===
                    "clock"
                ) {

                    clearInterval(
                        timer
                    );

                }

            }
        );

    }
);

    },


    saveState(appId, state) {

        if (!appId || !state) {
            return;
        }

        state.updatedAt = Date.now();

        HD.storage?.set(
            "app-runtime-state:" + appId,
            state
        );

    },


    restoreState(app) {

        return this.createState(app);

    }

};

HD.runtime?.register(
    "app-foundation",
    HD.appFoundation
);


/* =========================================================
   COMPLETE APP DATA MODEL
   ========================================================= */

HD.appData = HD.appData || {};


/*
 * Jeder App wird ein eigener persistenter
 * Datenbereich gegeben.
 */

HD.appData.get = function(appId) {

    const key =
        "app-data:" + appId;

    return HD.storage?.get(
        key,
        {
            records: [],
            settings: {},
            state: {},
            createdAt: Date.now(),
            updatedAt: Date.now()
        }
    ) || {
        records: [],
        settings: {},
        state: {}
    };

};


HD.appData.save = function(
    appId,
    data
) {

    if (!appId) {
        return false;
    }

    data =
        data ||
        {
            records: [],
            settings: {},
            state: {}
        };

    data.updatedAt =
        Date.now();

    HD.storage?.set(
        "app-data:" + appId,
        data
    );

    HD.emit?.(
        "app:data:saved",
        {
            appId,
            data
        }
    );

    return true;

};


HD.appData.clear = function(
    appId
) {

    if (!appId) {
        return;
    }

    HD.storage?.remove(
        "app-data:" + appId
    );

};


/* =========================================================
   APP CONTENT ENGINE
   ========================================================= */

HD.contentEngine = HD.contentEngine || {

    create(appId, content = {}) {

        return {

            id:
                content.id ||
                (
                    appId +
                    "-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2, 8)
                ),

            title:
                content.title ||
                "Neuer Inhalt",

            text:
                content.text ||
                "",

            type:
                content.type ||
                "content",

            createdAt:
                content.createdAt ||
                Date.now(),

            updatedAt:
                Date.now(),

            metadata:
                content.metadata ||
                {}

        };

    },


    add(
        appId,
        content
    ) {

        const data =
            HD.appData.get(
                appId
            );

        const item =
            this.create(
                appId,
                content
            );

        data.records =
            Array.isArray(
                data.records
            )
                ? data.records
                : [];

        data.records.push(
            item
        );

        HD.appData.save(
            appId,
            data
        );

        HD.emit?.(
            "content:created",
            {
                appId,
                item
            }
        );

        return item;

    },


    update(
        appId,
        id,
        changes
    ) {

        const data =
            HD.appData.get(
                appId
            );

        const item =
            data.records.find(
                record =>
                    record.id === id
            );

        if (!item) {
            return null;
        }

        Object.assign(
            item,
            changes || {},
            {
                updatedAt:
                    Date.now()
            }
        );

        HD.appData.save(
            appId,
            data
        );

        HD.emit?.(
            "content:updated",
            {
                appId,
                item
            }
        );

        return item;

    },


    remove(
        appId,
        id
    ) {

        const data =
            HD.appData.get(
                appId
            );

        const before =
            data.records.length;

        data.records =
            data.records.filter(
                record =>
                    record.id !== id
            );

        if (
            data.records.length !==
            before
        ) {

            HD.appData.save(
                appId,
                data
            );

            HD.emit?.(
                "content:deleted",
                {
                    appId,
                    id
                }
            );

            return true;
        }

        return false;

    },


    list(appId) {

        const data =
            HD.appData.get(
                appId
            );

        return Array.isArray(
            data.records
        )
            ? data.records
            : [];

    }

};


/* =========================================================
   APP INSTANCE FACTORY
   ========================================================= */

HD.appFactory = HD.appFactory || {

    create(manifest) {

        if (!manifest) {
            return null;
        }

        const existing =
            HD.appRuntime?.get(
                manifest.id
            );

        if (existing) {
            return existing;
        }

        const state =
            HD.appFoundation
                .restoreState(
                    manifest
                );

        const data =
            HD.appData.get(
                manifest.id
            );

        const instance = {

            id:
                manifest.id,

            manifest,

            state,

            data,

            element:
                null,

            windowElement:
                null,

            createdAt:
                Date.now(),


            refreshData() {

                this.data =
                    HD.appData.get(
                        this.id
                    );

                return this.data;

            },


            save() {

                HD.appFoundation
                    .saveState(
                        this.id,
                        this.state
                    );

                HD.appData.save(
                    this.id,
                    this.data
                );

            },


            open() {

                this.state.opened =
                    true;

                this.state.minimized =
                    false;

                this.state.active =
                    true;

                this.save();

                HD.emit?.(
                    "app:instance:open",
                    {
                        app:
                            this
                    }
                );

                return this;

            },


            close() {

                this.state.opened =
                    false;

                this.state.active =
                    false;

                this.save();

                HD.emit?.(
                    "app:instance:close",
                    {
                        app:
                            this
                    }
                );

                return this;

            },


            minimize() {

                this.state.minimized =
                    true;

                this.state.active =
                    false;

                this.save();

                HD.emit?.(
                    "app:instance:minimize",
                    {
                        app:
                            this
                    }
                );

                return this;

            },


            maximize() {

                this.state.maximized =
                    !this.state.maximized;

                this.save();

                HD.emit?.(
                    "app:instance:maximize",
                    {
                        app:
                            this
                    }
                );

                return this;

            },


            move(
                x,
                y
            ) {

                this.state.x =
                    Number(x) || 0;

                this.state.y =
                    Number(y) || 0;

                this.save();

            },


            resize(
                width,
                height
            ) {

                this.state.width =
                    Math.max(
                        HD.config
                            ?.minimumWindowWidth ||
                        320,
                        Number(width) ||
                        320
                    );

                this.state.height =
                    Math.max(
                        HD.config
                            ?.minimumWindowHeight ||
                        220,
                        Number(height) ||
                        220
                    );

                this.save();

            },


            addContent(
                content
            ) {

                const item =
                    HD.contentEngine.add(
                        this.id,
                        content
                    );

                this.refreshData();

                return item;

            },


            updateContent(
                id,
                changes
            ) {

                const item =
                    HD.contentEngine.update(
                        this.id,
                        id,
                        changes
                    );

                this.refreshData();

                return item;

            },


            deleteContent(
                id
            ) {

                const result =
                    HD.contentEngine.remove(
                        this.id,
                        id
                    );

                this.refreshData();

                return result;

            }

        };


        if (
            HD.appRuntime
        ) {

            HD.appRuntime.instances.set(
                manifest.id,
                instance
            );

        }

        return instance;

    }

};

HD.runtime?.register(
    "app-factory",
    HD.appFactory
);


/* =========================================================
   WINDOW SYSTEM FOUNDATION

HD.windowSystem =
    HD.windowSystem || {

        windows:
            new Map(),

        zIndex:
            1000,

        activeWindow:
            null,


        create(
            app
        ) {

            if (!app) {
                return null;
            }

            const existing =
                this.windows.get(
                    app.id
                );

            if (existing) {

                );

            }

                );

            windowElement.style.position =

            windowElement.style.left =
