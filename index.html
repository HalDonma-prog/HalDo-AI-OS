<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ============================================================
           HALDO AI OS — GLOBAL STYLES
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121f;
            --bg-card: rgba(255,255,255,0.02);
            --bg-hover: rgba(255,255,255,0.04);
            --border-color: rgba(255,255,255,0.03);
            --text-primary: #e0e0e0;
            --text-secondary: rgba(255,255,255,0.3);
            --text-muted: rgba(255,255,255,0.05);
            --accent-1: #f6d365;
            --accent-2: #fda085;
            --accent-3: #f093fb;
            --accent-4: #4facfe;
            --accent-5: #43e97b;
            --accent-6: #ff6b6b;
            --radius: 16px;
            --transition: 0.3s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.1); }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .haldo-desktop {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
           TASKBAR
           ============================================================ */
        .taskbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 16px;
            height: 52px;
            background: rgba(10,10,18,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 100;
        }
        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .taskbar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        .taskbar-logo img {
            height: 28px;
            width: auto;
            border-radius: 6px;
        }
        .taskbar-logo .gradient-text {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .taskbar-center {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            max-width: 600px;
            margin: 0 16px;
            overflow-x: auto;
            padding: 2px 0;
        }
        .taskbar-center .app-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.15);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .taskbar-center .app-icon:hover {
            background: var(--bg-hover);
            color: rgba(255,255,255,0.3);
        }
        .taskbar-center .app-icon.active {
            background: rgba(79,172,254,0.08);
            color: var(--accent-4);
        }
        .taskbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .taskbar-right .time { font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
        .taskbar-right .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-5);
            display: inline-block;
        }

        /* ============================================================
           WORKSPACE
           ============================================================ */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            width: 60px;
            background: rgba(18,18,31,0.6);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            gap: 2px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }
        .sidebar .app-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.08);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .sidebar .app-btn:hover {
            background: var(--bg-hover);
            color: rgba(255,255,255,0.25);
        }
        .sidebar .app-btn.active {
            background: rgba(79,172,254,0.06);
            color: var(--accent-4);
        }
        .sidebar .app-btn .tooltip {
            position: absolute;
            left: 54px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10,10,18,0.92);
            backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.6rem;
            color: var(--text-secondary);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }
        .sidebar .app-btn:hover .tooltip { opacity: 1; }

        /* ============================================================
           APP CONTAINER
           ============================================================ */
        .app-container {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            position: relative;
            background: var(--bg-primary);
        }

        /* ============================================================
           APP VIEW
           ============================================================ */
        .app-view { display: none; height: 100%; animation: fadeIn 0.3s ease; }
        .app-view.active { display: flex; flex-direction: column; height: 100%; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .app-view .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .app-view .app-header .title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .app-view .app-header .title .emoji { margin-right: 8px; }
        .app-view .app-header .actions { display: flex; gap: 6px; }
        .app-view .app-header .actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }
        .app-view .app-header .actions button:hover {
            background: var(--bg-hover);
            color: #fff;
        }
        .app-view .app-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ============================================================
           APP GRID
           ============================================================ */
        .app-grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px;
        }
        .app-grid-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .app-grid-item:hover {
            background: var(--bg-hover);
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.06);
        }
        .app-grid-item .emoji { font-size: 2.4rem; display: block; margin-bottom: 4px; }
        .app-grid-item .name { font-size: 0.75rem; color: var(--text-secondary); font-weight: 500; }
        .app-grid-item .desc { font-size: 0.55rem; color: var(--text-muted); margin-top: 2px; }

        /* ============================================================
           CATEGORY SECTION
           ============================================================ */
        .category-section { margin-bottom: 20px; }
        .category-section .cat-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        /* ============================================================
           SYSTEM STATUS
           ============================================================ */
        .system-status {
            display: flex;
            justify-content: space-between;
            padding: 4px 16px;
            background: rgba(10,10,18,0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            font-size: 0.55rem;
            color: var(--text-muted);
            flex-shrink: 0;
            height: 28px;
            align-items: center;
        }
        .system-status .highlight { color: rgba(255,255,255,0.08); }

        /* ============================================================
           MODAL
           ============================================================ */
        .haldo-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .haldo-modal.active { display: flex; }
        .haldo-modal .modal-content {
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .haldo-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .haldo-modal .modal-header .title { font-weight: 600; color: var(--text-secondary); }
        .haldo-modal .modal-header .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }
        .haldo-modal .modal-header .close-btn:hover { color: var(--accent-6); }
        .haldo-modal .modal-body { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.7; }

        /* ============================================================
           EINSTELLUNGEN MENÜ
           ============================================================ */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .settings-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }
        .settings-item:hover {
            background: var(--bg-hover);
        }
        .settings-item .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .settings-item .value {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.02);
            padding: 2px 12px;
            border-radius: 10px;
        }
        .settings-item .toggle {
            width: 40px;
            height: 22px;
            border-radius: 11px;
            background: rgba(255,255,255,0.05);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .settings-item .toggle.active {
            background: var(--accent-5);
        }
        .settings-item .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: var(--transition);
        }
        .settings-item .toggle.active::after {
            left: 20px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .sidebar { width: 50px; }
            .sidebar .app-btn { width: 38px; height: 38px; font-size: 1rem; }
            .taskbar-center { max-width: 200px; }
            .taskbar-logo { font-size: 0.7rem; }
            .taskbar-logo img { height: 22px; }
            .app-grid-view { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .settings-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .taskbar-center { display: none; }
            .taskbar { padding: 4px 8px; }
            .app-container { padding: 10px; }
            .app-grid-view { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>

                    const active = id === currentApp ? 'active' : '';
                    const btn = document.createElement('button');
                    btn.className = `app-btn ${active}`;
                    btn.innerHTML = `${app.emoji}<span class="tooltip">${app.name}</span>`;
                    btn.onclick = () => switchApp(id);
                    sidebar.appendChild(btn);
                });
            });
        }

        // ---- Taskbar ----
        function updateTaskbar() {
            const recent = appHistory.slice(-5).reverse();
            taskbarApps.innerHTML = recent.map(id => {
                const app = APP_REGISTRY[id];
                const active = id === currentApp ? 'active' : '';
                return `<button class="app-icon ${active}" onclick="switchApp('${id}')" title="${app.name}">${app.emoji}</button>`;
            }).join('');
        }

        // ---- Status ----
        function updateStatus() {
            statusAppCount.textContent = APP_IDS.length;
            statusMemory.textContent = Math.round(Math.random() * 200 + 100);
            statusAI.textContent = 'Aktiv · v26.0';
        }

        // ---- Switch App ----
        function switchApp(appId) {
            if (!APP_REGISTRY[appId]) return;
            if (appId === currentApp) { renderApp(appId); return; }
            renderApp(appId);
        }
        window.switchApp = switchApp;

        // ---- App Info ----
        function showAppInfo(appId) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            openModal(`ℹ️ ${app.name}`, `
                <div style="display:flex;flex-direction:column;gap:8px;">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <span style="font-size:3rem;">${app.emoji}</span>
                        <div>
                            <div style="font-weight:600;color:var(--text-primary);">${app.name}</div>
                            <div style="color:var(--text-muted);font-size:0.8rem;">${app.category}</div>
                        </div>
                    </div>
                    <div style="color:var(--text-secondary);font-size:0.9rem;">${app.desc}</div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
                        <span style="padding:2px 12px;border-radius:6px;background:rgba(255,255,255,0.02);border:1px solid var(--border-color);font-size:0.6rem;color:var(--text-muted);">ID: ${app.id}</span>
                        <span style="padding:2px 12px;border-radius:6px;background:rgba(255,255,255,0.02);border:1px solid var(--border-color);font-size:0.6rem;color:var(--text-muted);">Version: 26.0</span>
                    </div>
                    <div style="margin-top:6px;border-top:1px solid var(--border-color);padding-top:8px;color:var(--text-muted);font-size:0.6rem;">
                        🔗 Verbindungen: AI · Voice · Storage · Files · Security · Updates
                    </div>
                </div>
            `);
        }
        window.showAppInfo = showAppInfo;

        // ---- App Settings (Einstellungen) ----
        function openAppSettings(appId) {
            const app = APP_REGISTRY[appId];
            if (!app) return;

            const settingsHTML = `
                <div style="display:flex;flex-direction:column;gap:12px;">
                    <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;">⚙️ Einstellungen für <strong style="color:var(--text-primary);">${app.name}</strong></div>
                    <div class="settings-grid">
                        <div class="settings-item">
                            <span class="label">🌐 Sprache</span>
                            <span class="value">Deutsch</span>
                        </div>
                        <div class="settings-item">
                            <span class="label">🧠 AI-Provider</span>
                            <span class="value">Lokal</span>
                        </div>
                        <div class="settings-item">
                            <span class="label">💾 Speicher</span>
                            <span class="value">Lokal</span>
                        </div>
                        <div class="settings-item">
                            <span class="label">🔒 Datenschutz</span>
                            <span class="value">Aktiv</span>
                        </div>
                        <div class="settings-item">
                            <span class="label">🎤 Voice</span>
                            <button class="toggle active" onclick="this.classList.toggle('active')"></button>
                        </div>
                        <div class="settings-item">
                            <span class="label">🔔 Benachrichtigungen</span>
                            <button class="toggle active" onclick="this.classList.toggle('active')"></button>
                        </div>
                        <div class="settings-item" style="grid-column:1/-1;">
                            <span class="label">📊 Daten exportieren</span>
                            <button onclick="exportAppData('${appId}')" style="padding:4px 16px;border:none;border-radius:6px;background:rgba(79,172,254,0.1);color:var(--accent-4);cursor:pointer;font-family:var(--font);font-size:0.7rem;">📤 Export</button>
                        </div>
                        <div class="settings-item" style="grid-column:1/-1;">
                            <span class="label">📥 Daten importieren</span>
                            <button onclick="importAppData('${appId}')" style="padding:4px 16px;border:none;border-radius:6px;background:rgba(67,233,123,0.1);color:var(--accent-5);cursor:pointer;font-family:var(--font);font-size:0.7rem;">📥 Import</button>
                        </div>
                    </div>
                    <div style="display:flex;gap:6px;margin-top:4px;">
                        <button onclick="closeModal();openModal('✅ Gespeichert','Die Einstellungen wurden übernommen.')" style="padding:8px 20px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--accent-4),var(--accent-5));color:#0a0a12;font-weight:600;cursor:pointer;font-family:var(--font);">Übernehmen</button>
                        <button onclick="closeModal()" style="padding:8px 20px;border:none;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--text-secondary);cursor:pointer;font-family:var(--font);">Abbrechen</button>
                    </div>
                </div>
            `;

            openModal(`⚙️ Einstellungen — ${app.name}`, settingsHTML);
        }
        window.openAppSettings = openAppSettings;

        // ---- Export ----
        function exportAppData(appId) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            const data = { app: appId, name: app.name, data: { example: 'Daten', timestamp: Date.now() }, version: '26.0' };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${appId}_data_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            openModal('📤 Export', `✅ Daten von "${app.name}" wurden exportiert.`);
        }
        window.exportAppData = exportAppData;

        // ---- Import ----
        function importAppData(appId) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        openModal('📥 Import', `
                            ✅ Daten für "${data.name || appId}" importiert.
                            <br><br>
                            📊 ${Object.keys(data.data || {}).length} Einträge geladen.
                            <br>
                            🕐 ${new Date(data.timestamp).toLocaleString()}
                        `);
                    } catch (err) {
                        openModal('❌ Fehler', `Import fehlgeschlagen: ${err.message}`);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        window.importAppData = importAppData;

        // ---- AI Actions ----
        function aiAction(appId, action) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            const messages = {
                'zusammenfassen': `🧠 KI fasst den Inhalt von "${app.name}" zusammen ...`,
                'übersetzen': `🌍 KI übersetzt den Inhalt von "${app.name}" ...`,
                'analysieren': `🔍 KI analysiert den Inhalt von "${app.name}" ...`,
                'generieren': `✨ KI generiert neuen Inhalt für "${app.name}" ...`
            };
            openModal(`🧠 AI-Aktion — ${app.name}`, `
                <div style="padding:12px;background:rgba(79,172,254,0.02);border-radius:8px;border:1px solid rgba(79,172,254,0.05);">
                    ${messages[action] || '🧠 AI verarbeitet ...'}
                </div>
                <button onclick="closeModal()" style="margin-top:8px;padding:6px 16px;border:none;border-radius:6px;background:rgba(255,255,255,0.02);color:var(--text-secondary);cursor:pointer;font-family:var(--font);">Schließen</button>
            `);
        }
        window.aiAction = aiAction;

        // ---- Voice Actions ----
        function voiceAction(appId, action) {
            const app = APP_REGISTRY[appId];
            if (!app) return;
            const status = {
                'start': '🎤 Sprachaufnahme gestartet ...',
                'stop': '⏹️ Sprachaufnahme beendet.',
                'status': '📊 Voice-Status: Bereit · Mikrofon: 🟢 Aktiv'
            };
            openModal(`🎤 Voice — ${app.name}`, `
                <div style="padding:12px;background:rgba(43,233,123,0.02);border-radius:8px;border:1px solid rgba(43,233,123,0.05);">
                    ${status[action] || '🎤 Voice-Aktion ausgeführt.'}
                </div>
                <button onclick="closeModal()" style="margin-top:8px;padding:6px 16px;border:none;border-radius:6px;background:rgba(255,255,255,0.02);color:var(--text-secondary);cursor:pointer;font-family:var(--font);">Schließen</button>
            `);
        }
        window.voiceAction = voiceAction;

        // ---- Keyboard Shortcuts ----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const search = prompt('🔍 App suchen:', '');
                if (search) {
                    const found = APP_IDS.filter(id =>
                        APP_REGISTRY[id].name.toLowerCase().includes(search.toLowerCase()) ||
                        APP_REGISTRY[id].desc.toLowerCase().includes(search.toLowerCase())
                    );
                    if (found.length > 0) {
                        switchApp(found[0]);
                    } else {
                        openModal('🔍 Suche', `Keine App gefunden für: "${search}"`);
                    }
                }
            }
        });

        // ---- System-Initialisierung ----
        function initSystem() {
            updateSidebar();
            renderApp('haldo-ai');
            updateTaskbar();
            updateStatus();

            setInterval(() => {
                const appId = currentApp;
                const storageEl = document.getElementById(`storageStatus-${appId}`);
                if (storageEl) {
                    const size = Math.round(Math.random() * 100 + 10);
                    storageEl.textContent = size + ' KB';
                }
                const dataEl = document.getElementById(`dataStatus-${appId}`);
                if (dataEl) {
                    const count = Math.round(Math.random() * 50 + 5);
                    dataEl.textContent = count + ' Einträge';
                }
                const activityEl = document.getElementById(`activityStatus-${appId}`);
                if (activityEl) {
                    activityEl.textContent = 'Jetzt';
                }
            }, 5000);

            console.log('🚀 HalDo AI OS v26.0 gestartet!');
            console.log(`📱 ${APP_IDS.length} Apps geladen.`);
            console.log('🌌 Kosmische Dimension aktiviert!');
            console.log('✨ System bereit.');
        }

        document.addEventListener('DOMContentLoaded', initSystem);

        console.log('✅ HalDo AI OS — Vollständige App-Welt mit Kosmos geladen!');
        console.log(`🏆 ${APP_IDS.length} Apps · Kosmische Kategorie integriert · v26.0`);
        console.log('🌞 Sonne · 🌍 Erde · 🌙 Mond · ⭐ Sterne · 🌈 Himmelsfarben');
    </script>
</body>
</html>
