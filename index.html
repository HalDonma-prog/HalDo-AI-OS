/* =========================================================
   WINDOW SIZE CALCULATOR
   ========================================================= */

HD15.display.getDefaultWindowSize =
    function(
        appId
    ) {

        const width =
            window.innerWidth;


        const height =
            window.innerHeight;


        let windowWidth =
            Math.min(
                680,
                width - 40
            );


        let windowHeight =
            Math.min(
                540,
                height - 100
            );


        if (
            width <= 600
        ) {

            windowWidth =
                Math.max(
                    280,
                    width - 20
                );


            windowHeight =
                Math.max(
                    220,
                    height - 35
                );

        }


        if (
            width <= 1024 &&
            width > 600
        ) {

            windowWidth =
                Math.min(
                    700,
                    width - 30
                );


            windowHeight =
                Math.min(
                    620,
                    height - 70
                );

        }


        return {

            width:
                windowWidth,

            height:
                windowHeight,

            appId

        };

    };


/* =========================================================
   CENTER WINDOW
   ========================================================= */

HD15.display.centerWindow =
    function(
        element
    ) {

        if (
            !element
        ) {

            return false;

        }


        const rect =
            element.getBoundingClientRect();


        const width =
            rect.width;


        const height =
            rect.height;


        const left =
            Math.max(
                8,
                (
                    window.innerWidth -
                    width
                ) / 2
            );


        const top =
            Math.max(
                8,
                (
                    window.innerHeight -
                    height
                ) / 2
            );


        element.style.left =
            left + "px";


        element.style.top =
            top + "px";


        return true;

    };


/* =========================================================
   KEEP WINDOW ON SCREEN
   ========================================================= */

HD15.display.keepWindowVisible =
    function(
        element
    ) {

        if (
            !element
        ) {

            return false;

        }


        const rect =
            element.getBoundingClientRect();


        let left =
            parseFloat(
                element.style.left
            );


        let top =
            parseFloat(
                element.style.top
            );


        if (
            !Number.isFinite(left)
        ) {

            left =
                rect.left;

        }


        if (
            !Number.isFinite(top)
        ) {

            top =
                rect.top;

        }


        const margin =
            6;


        const maxLeft =
            Math.max(
                margin,
                window.innerWidth -
                rect.width -
                margin
            );


        const maxTop =
            Math.max(
                margin,
                window.innerHeight -
                rect.height -
                margin
            );


        left =
            Math.min(
                Math.max(
                    margin,
                    left
                ),
                maxLeft
            );


        top =
            Math.min(
                Math.max(
                    margin,
                    top
                ),
                maxTop
            );


        element.style.left =
            left + "px";


        element.style.top =
            top + "px";


        return true;

    };


/* =========================================================
   RESIZE OBSERVER
   ========================================================= */

HD15.display.observeWindows =
    function() {

        if (
            HD15.display
                .resizeObserver
        ) {

            return;

        }


        if (
            typeof ResizeObserver ===
            "undefined"
        ) {

            return;

        }


        HD15.display.resizeObserver =
            new ResizeObserver(
                entries => {

                    entries.forEach(
                        entry => {

                            const element =
                                entry.target;


                            HD15.display
                                .keepWindowVisible(
                                    element
                                );

                        }
                    );

                }
            );


        document
            .querySelectorAll(
                ".haldo-app-window"
            )
            .forEach(
                element => {

                    HD15.display
                        .resizeObserver
                        .observe(
                            element
                        );

                }
            );

    };


/* =========================================================
   WINDOW REGISTRATION
   ========================================================= */

HD15.display.registerWindow =
    function(
        element
    ) {

        if (
            !element
        ) {

            return;

        }


        element.dataset
            .haldoResponsive =
            "true";


        const size =
            HD15.display
                .getDefaultWindowSize(
                    element.dataset.appId ||
                    ""
                );


        if (
            !element.style.width
        ) {

            element.style.width =
                size.width + "px";

        }


        if (
            !element.style.height
        ) {

            element.style.height =
                size.height + "px";

        }


        requestAnimationFrame(
            () => {

                HD15.display
                    .keepWindowVisible(
                        element
                    );

            }
        );


        if (
            HD15.display.resizeObserver
        ) {

            HD15.display
                .resizeObserver
                .observe(
                    element
                );

        }

    };


/* =========================================================
   WINDOW DRAGGING
   ========================================================= */

HD15.windowDrag =
    HD15.windowDrag ||
    {

        active:
            null,

        pointerId:
            null,

        offsetX:
            0,

        offsetY:
            0

    };


/* =========================================================
   START DRAG
   ========================================================= */

HD15.display.startWindowDrag =
    function(
        event,
        windowElement,
        handle
    ) {

        if (
            !windowElement
        ) {

            return;

        }


        if (
            event.button !== undefined &&
            event.button !== 0
        ) {

            return;

        }


        /*
         * Auf mobilen Geräten darf
         * der Header weiterhin normal
         * bedienbar bleiben.
         */

        if (
            window.innerWidth <= 600 &&
            event.pointerType ===
            "touch"
        ) {

            return;

        }


        const rect =
            windowElement
                .getBoundingClientRect();


        HD15.windowDrag.active =
            windowElement;


        HD15.windowDrag.pointerId =
            event.pointerId;


        HD15.windowDrag.offsetX =
            event.clientX -
            rect.left;


        HD15.windowDrag.offsetY =
            event.clientY -
            rect.top;


        try {

            handle?.setPointerCapture(
                event.pointerId
            );

        }

        catch {}

    };


/* =========================================================
   MOVE DRAG
   ========================================================= */

HD15.display.moveWindowDrag =
    function(
        event
    ) {

        const element =
            HD15.windowDrag.active;


        if (
            !element
        ) {

            return;

        }


        if (
            HD15.windowDrag.pointerId !==
            event.pointerId
        ) {

            return;

        }


        const left =
            event.clientX -
            HD15.windowDrag.offsetX;


        const top =
            event.clientY -
            HD15.windowDrag.offsetY;


        element.style.left =
            left + "px";


        element.style.top =
            top + "px";


        HD15.display
            .keepWindowVisible(
                element
            );

    };


/* =========================================================
   END DRAG
   ========================================================= */

HD15.display.endWindowDrag =
    function(
        event
    ) {

        if (
            HD15.windowDrag.pointerId !==
            event.pointerId
        ) {

            return;

        }


        HD15.windowDrag.active =
            null;


        HD15.windowDrag.pointerId =
            null;

    };


/* =========================================================
   CONNECT WINDOW DRAGGING
   ========================================================= */

HD15.display.bindWindowDrag =
    function(
        element
    ) {

        if (
            !element ||
            element.dataset.haldoDragBound ===
            "true"
        ) {

            return;

        }


        const handle =
            element.querySelector(
                ".haldo-window-header"
            );


        if (
            !handle
        ) {

            return;

        }


        element.dataset
            .haldoDragBound =
            "true";


        handle.addEventListener(
            "pointerdown",
            event => {

                HD15.display
                    .startWindowDrag(
                        event,
                        element,
                        handle
                    );

            }
        );


        handle.addEventListener(
            "pointermove",
            event => {

                HD15.display
                    .moveWindowDrag(
                        event
                    );

            }
        );


        handle.addEventListener(
            "pointerup",
            event => {

                HD15.display
                    .endWindowDrag(
                        event
                    );

            }
        );


        handle.addEventListener(
            "pointercancel",
            event => {

                HD15.display
                    .endWindowDrag(
                        event
                    );

            }
        );

    };


/* =========================================================
   BIND EXISTING WINDOWS
   ========================================================= */

HD15.display.bindAllWindows =
    function() {

        document
            .querySelectorAll(
                ".haldo-app-window"
            )
            .forEach(
                element => {

                    HD15.display
                        .registerWindow(
                            element
                        );


                    HD15.display
                        .bindWindowDrag(
                            element
                        );

                }
            );

    };


/* =========================================================
   WINDOW BUTTONS
   ========================================================= */

HD15.display.bindWindowControls =
    function() {

        document
            .addEventListener(
                "click",
                event => {

                    const closeButton =
                        event.target.closest(
                            "[data-window-close]"
                        );


                    if (
                        closeButton
                    ) {

                        const windowElement =
                            closeButton.closest(
                                ".haldo-app-window"
                            );


                        if (
                            windowElement
                        ) {

                            /*
                             * Ein Klick reicht.
                             */

                            windowElement
                                .remove();

                            HD15.systemBridge
                                ?.emit(
                                    "window:closed",
                                    {
                                        appId:
                                            windowElement
                                                .dataset
                                                .appId ||
                                            null
                                    }
                                );

                        }


                        return;

                    }


                    const minimizeButton =
                        event.target.closest(
                            "[data-window-minimize]"
                        );


                    if (
                        minimizeButton
                    ) {

                        const windowElement =
                            minimizeButton.closest(
                                ".haldo-app-window"
                            );


                        if (
                            windowElement
                        ) {

                            windowElement.classList
                                .toggle(
                                    "haldo-window-minimized"
                                );

                        }


                        return;

                    }


                    const maximizeButton =
                        event.target.closest(
                            "[data-window-maximize]"
                        );


                    if (
                        maximizeButton
                    ) {

                        const windowElement =
                            maximizeButton.closest(
                                ".haldo-app-window"
                            );


                        if (
                            windowElement
                        ) {

                            windowElement.classList
                                .toggle(
                                    "haldo-window-maximized"
                                );

                        }

                    }

                }
            );

    };


/* =========================================================
   MOBILE VIEWPORT
   ========================================================= */

HD15.display.bindViewport =
    function() {

        const update =
            () => {

                HD15.display.detect();

                HD15.display
                    .bindAllWindows();

            };


        window.addEventListener(
            "resize",
            update,
            {
                passive: true
            }
        );


        window.addEventListener(
            "orientationchange",
            update,
            {
                passive: true
            }
        );


        if (
            window.visualViewport
        ) {

            window.visualViewport.addEventListener(
                "resize",
                update,
                {
                    passive: true
                }
            );

        }

    };


/* =========================================================
   REDUCED MOTION
   ========================================================= */

HD15.display.applyAccessibility =
    function() {

        const reduced =
            HD14?.settings?.get
                ? HD14.settings.get(
                    "reducedMotion",
                    false
                )
                : false;


        document.documentElement
            .dataset
            .halDoReducedMotion =
            reduced
                ? "true"
                : "false";

    };


/* =========================================================
   INITIALIZE
   ========================================================= */

HD15.display.init =
    function() {

        if (
            HD15.display.initialized
        ) {

            return;

        }


        HD15.display.injectStyles();

        HD15.display.detect();

        HD15.display
            .bindViewport();

        HD15.display
            .bindWindowControls();

        HD15.display
            .observeWindows();

        HD15.display
            .bindAllWindows();

        HD15.display
            .applyAccessibility();


        HD15.display.initialized =
            true;


        HD15.systemBridge
            ?.emit(
                "display:ready",
                HD15.display.detect()
            );


        console.info(
            "HalDo Responsive Display bereit."
        );
