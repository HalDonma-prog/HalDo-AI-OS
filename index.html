<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>HalDo AI OS 20</title>

  <meta
    name="description"
    content="HalDo AI OS 20 – professionelles AI-Betriebssystem"
  >
  <meta name="theme-color" content="#050914">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HalDo AI OS">

  <link rel="manifest" href="manifest.json">

  <!-- =========================================================
       HALDO AI OS 20
       ZENTRALE DESIGN-/SHELL-VARIABLEN
       ========================================================= -->
  <style>
    :root {
      --haldo-bg: #030611;
      --haldo-bg-2: #071022;
      --haldo-panel: rgba(10, 18, 38, .78);
      --haldo-panel-strong: rgba(8, 15, 32, .94);
      --haldo-border: rgba(255, 255, 255, .12);
      --haldo-text: #f7f9ff;
      --haldo-muted: rgba(230, 237, 255, .68);
      --haldo-accent: #9fd8ff;
      --haldo-accent-2: #d9f1ff;
      --haldo-shadow: 0 24px 80px rgba(0, 0, 0, .48);

      --topbar-height: 58px;
      --dock-height: 74px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--haldo-bg);
      color: var(--haldo-text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      position: relative;
      min-width: 280px;
      min-height: 100dvh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button,
    [role="button"] {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       ROOT
       ========================================================= */

    #haldo-os {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(77, 139, 255, .13),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(112, 176, 255, .08),
          transparent 42%
        ),
        linear-gradient(
          145deg,
          #02040c 0%,
          #050a17 48%,
          #02040c 100%
        );
    }

    /* =========================================================
       COSMIC BACKGROUND
       ========================================================= */

    .haldo-cosmic {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .haldo-cosmic__stars,
    .haldo-cosmic__stars::before,
    .haldo-cosmic__stars::after {
      position: absolute;
      inset: -20%;
      content: "";
      background-image:
        radial-gradient(circle, rgba(255,255,255,.82) 0 1px, transparent 1.7px),
        radial-gradient(circle, rgba(184,224,255,.58) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,244,205,.5) 0 1px, transparent 1.6px);
      background-size:
        97px 113px,
        151px 137px,
        211px 193px;
      background-position:
        0 0,
        35px 60px,
        90px 20px;
      opacity: .48;
      animation: haldoStars 55s linear infinite;
    }

    .haldo-cosmic__stars::before {
      opacity: .24;
      transform: scale(1.25);
      animation-duration: 90s;
    }

    .haldo-cosmic__stars::after {
      opacity: .16;
      transform: scale(1.5);
      animation-duration: 125s;
    }

    @keyframes haldoStars {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(-120px, 80px, 0);
      }
    }

    .haldo-cosmic__nebula {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(154, 216, 255, .11) 0%,
          rgba(90, 130, 255, .06) 27%,
          transparent 68%
        );
      filter: blur(18px);
    }

    .haldo-sun-system {
      position: absolute;
      left: 50%;
      top: 47%;
      width: min(62vmin, 620px);
      height: min(62vmin, 620px);
      transform: translate(-50%, -50%);
    }

    .haldo-sun {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(17vmin, 170px);
      height: min(17vmin, 170px);
      min-width: 92px;
      min-height: 92px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 37% 32%,
          #ffffff 0%,
          #e9f7ff 17%,
          #bde8ff 37%,
          #79c9ff 63%,
          rgba(95, 173, 255, .42) 76%,
          transparent 100%
        );
      box-shadow:
        0 0 30px rgba(187, 232, 255, .8),
        0 0 75px rgba(113, 196, 255, .55),
        0 0 145px rgba(91, 152, 255, .35);
      animation: haldoSunPulse 4.8s ease-in-out infinite;
    }

    @keyframes haldoSunPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.045);
      }
    }

    .haldo-orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      border: 1px solid rgba(182, 224, 255, .18);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .haldo-orbit--1 {
      width: 42%;
      height: 42%;
      animation: haldoOrbit 22s linear infinite;
    }

    .haldo-orbit--2 {
      width: 68%;
      height: 68%;
      animation: haldoOrbit 38s linear infinite reverse;
    }

    .haldo-orbit--3 {
      width: 94%;
      height: 94%;
      animation: haldoOrbit 58s linear infinite;
    }

    @keyframes haldoOrbit {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    .haldo-planet {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 15px;
      height: 15px;
      margin: -7.5px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 35% 30%,
        #fff,
        #b7ddff 24%,
        #629ee9 58%,
        #244e99
      );
      box-shadow:
        0 0 10px rgba(152, 211, 255, .9),
        0 0 22px rgba(96, 165, 255, .55);
    }

    .haldo-orbit--1 .haldo-planet {
      transform: translateX(calc(min(21vmin, 210px)));
    }

    .haldo-orbit--2 .haldo-planet {
      transform: translateX(calc(min(34vmin, 340px)));
      width: 11px;
      height: 11px;
      margin: -5.5px;
    }

    .haldo-orbit--3 .haldo-planet {
      transform: translateX(calc(min(47vmin, 470px)));
      width: 8px;
      height: 8px;
      margin: -4px;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .haldo-topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 500;
      height: calc(var(--topbar-height) + var(--safe-top));
      padding:
        var(--safe-top)
        max(12px, var(--safe-right))
        0
        max(12px, var(--safe-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(
        180deg,
        rgba(2, 5, 14, .9),
        rgba(2, 5, 14, .54)
      );
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .haldo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .haldo-brand__logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 50%;
      filter:
        drop-shadow(0 0 10px rgba(151, 213, 255, .5));
    }

    .haldo-brand__fallback {
      display: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 35% 30%, #fff, #a8ddff 38%, #397fd0);
      box-shadow: 0 0 22px rgba(116, 192, 255, .45);
      font-weight: 800;
    }

    .haldo-brand__text {
      min-width: 0;
    }

    .haldo-brand__title {
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .haldo-brand__status {
      color: var(--haldo-muted);
      font-size: 10px;
      margin-top: 2px;
      white-space: nowrap;
    }

    .haldo-top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .haldo-icon-button {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 13px;
      background: rgba(255,255,255,.06);
      cursor: pointer;
      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
    }

    .haldo-icon-button:hover,
    .haldo-icon-button:focus-visible {
      transform: translateY(-1px);
      background: rgba(255,255,255,.11);
      border-color: rgba(183, 224, 255, .3);
      outline: none;
    }

    /* =========================================================
       DESKTOP / WORKSPACE
       ========================================================= */

    .haldo-workspace {
      position: absolute;
      inset: 0;
      z-index: 20;
      padding:
        calc(var(--topbar-height) + var(--safe-top) + 8px)
        max(8px, var(--safe-right))
        calc(var(--dock-height) + var(--safe-bottom) + 8px)
        max(8px, var(--safe-left));
      overflow: hidden;
    }

    #haldo-window-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 100;
    }

    #haldo-window-layer > * {
      pointer-events: auto;
    }

    /* =========================================================
       CENTRAL AI AVATAR
       ========================================================= */

    .haldo-center-avatar {
      position: absolute;
      left: 50%;
      top: 47%;
      width: min(260px, 42vw);
      height: min(260px, 42vw);
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .haldo-avatar-glow {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(178, 226, 255, .17),
        rgba(85, 157, 255, .08) 35%,
        transparent 70%
      );
      filter: blur(8px);
      animation: haldoAvatarGlow 3.8s ease-in-out infinite;
    }

    @keyframes haldoAvatarGlow {
      0%, 100% {
        opacity: .72;
        transform: scale(.97);
      }
      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    .haldo-avatar-image {
      position: relative;
      z-index: 2;
      width: 58%;
      height: 58%;
      object-fit: contain;
      filter:
        drop-shadow(0 0 18px rgba(179, 227, 255, .72))
        drop-shadow(0 0 48px rgba(81, 151, 255, .34));
      animation: haldoAvatarFloat 4.5s ease-in-out infinite;
    }

    @keyframes haldoAvatarFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-6px) scale(1.015);
      }
    }

    /* =========================================================
       APP LAUNCHER
       ========================================================= */

    #haldo-app-menu {
      position: absolute;
      top: calc(var(--topbar-height) + var(--safe-top) + 10px);
      left: max(10px, var(--safe-left));
      width: min(430px, calc(100vw - 20px));
      max-height: calc(100dvh - var(--topbar-height) - var(--dock-height) - 30px);
      z-index: 600;
      display: none;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background: rgba(7, 13, 29, .94);
      box-shadow: var(--haldo-shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    #haldo-app-menu.is-open {
      display: flex;
      flex-direction: column;
    }

    .haldo-menu-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .haldo-menu-title {
      font-size: 16px;
      font-weight: 800;
    }

    .haldo-menu-subtitle {
      color: var(--haldo-muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .haldo-app-search {
      margin: 10px 12px;
      width: calc(100% - 24px);
      height: 42px;
      padding: 0 13px;
      color: var(--haldo-text);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 13px;
      outline: none;
    }

    .haldo-app-search:focus {
      border-color: rgba(174, 224, 255, .34);
    }

    #haldo-app-list {
      padding: 4px 10px 12px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .haldo-app-item {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition:
        background .16s ease,
        transform .16s ease;
    }

    .haldo-app-item:hover,
    .haldo-app-item:focus-visible {
      background: rgba(255,255,255,.075);
      transform: translateX(2px);
      outline: none;
    }

    .haldo-app-item__icon {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background:
        linear-gradient(
          145deg,
          rgba(185,225,255,.18),
          rgba(89,139,224,.12)
        );
      border: 1px solid rgba(255,255,255,.1);
      font-size: 20px;
    }

    .haldo-app-item__name {
      font-size: 13px;
      font-weight: 700;
    }

    .haldo-app-item__description {
      margin-top: 3px;
      color: var(--haldo-muted);
      font-size: 10px;
    }

    /* =========================================================
       BOTTOM DOCK
       ========================================================= */

    .haldo-dock {
      position: absolute;
      left: 50%;
      bottom: max(8px, var(--safe-bottom));
      transform: translateX(-50%);
      z-index: 500;
      width: min(760px, calc(100vw - 20px));
      min-height: var(--dock-height);
      padding: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      background: rgba(5, 10, 24, .82);
      box-shadow:
        0 18px 55px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .haldo-dock-button {
      flex: 1 1 0;
      max-width: 88px;
      min-width: 54px;
      height: 54px;
      border: 1px solid transparent;
      border-radius: 16px;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition:
        background .16s ease,
        transform .16s ease,
        border-color .16s ease;
    }

    .haldo-dock-button:hover,
    .haldo-dock-button:focus-visible {
      background: rgba(255,255,255,.075);
      border-color: rgba(255,255,255,.08);
      transform: translateY(-2px);
      outline: none;
    }

    .haldo-dock-button__icon {
      font-size: 20px;
      line-height: 1;
    }

    .haldo-dock-button__label {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--haldo-muted);
      font-size: 8px;
    }

    /* =========================================================
       SYSTEM STATUS
       ========================================================= */

    #haldo-status {
      position: absolute;
      left: 50%;
      bottom: calc(var(--dock-height) + var(--safe-bottom) + 18px);
      transform: translateX(-50%);
      z-index: 300;
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(3, 7, 17, .62);
      color: var(--haldo-muted);
      font-size: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
      backdrop-filter: blur(12px);
    }

    #haldo-status.is-visible {
      opacity: 1;
    }

    /* =========================================================
       BOOT / FALLBACK
       ========================================================= */

    #haldo-boot {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(103, 175, 255, .15),
          transparent 28%
        ),
        #02050d;
      transition:
        opacity .35s ease,
        visibility .35s ease;
    }

    #haldo-boot.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .haldo-boot-inner {
      width: min(420px, calc(100vw - 40px));
      text-align: center;
    }

    .haldo-boot-logo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      animation: haldoBootPulse 2s ease-in-out infinite;
      filter:
        drop-shadow(0 0 22px rgba(164, 222, 255, .72));
    }

    @keyframes haldoBootPulse {
      0%, 100% {
        transform: scale(.96);
        opacity: .84;
      }
      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .haldo-boot-title {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -.02em;
    }

    .haldo-boot-text {
      margin-top: 8px;
      color: var(--haldo-muted);
      font-size: 12px;
    }

    .haldo-boot-progress {
      width: 100%;
      height: 3px;
      margin-top: 22px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }

    .haldo-boot-progress span {
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        transparent,
        #d8f1ff,
        transparent
      );
      animation: haldoBootProgress 1.35s ease-in-out infinite;
    }

    @keyframes haldoBootProgress {
      from {
        transform: translateX(-130%);
      }
      to {
        transform: translateX(360%);
      }
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 600px) {
      :root {
        --topbar-height: 54px;
        --dock-height: 66px;
      }

      .haldo-brand__title {
        font-size: 12px;
      }

      .haldo-brand__status {
        font-size: 9px;
      }

      .haldo-icon-button {
        width: 37px;
        height: 37px;
        border-radius: 12px;
      }

      .haldo-center-avatar {
        width: min(220px, 64vw);
        height: min(220px, 64vw);
        top: 43%;
      }

      .haldo-sun-system {
        width: 92vw;
        height: 92vw;
      }

      .haldo-dock {
        width: calc(100vw - 12px);
        padding: 6px;
        border-radius: 18px;
      }

      .haldo-dock-button {
        min-width: 45px;
        height: 51px;
      }

      .haldo-dock-button__icon {
        font-size: 18px;
      }

      .haldo-dock-button__label {
        font-size: 7px;
      }

      #haldo-status {
        bottom: calc(var(--dock-height) + var(--safe-bottom) + 11px);
      }
    }

    @media (max-height: 620px) {
      .haldo-sun-system {
        width: 72vh;
        height: 72vh;
      }

      .haldo-center-avatar {
        width: min(190px, 40vh);
        height: min(190px, 40vh);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       HALDO AI OS ROOT
       ========================================================= -->
  <div id="haldo-os">

    <!-- COSMIC BACKGROUND -->
    <div class="haldo-cosmic" aria-hidden="true">
      <div class="haldo-cosmic__stars"></div>
      <div class="haldo-cosmic__nebula"></div>

      <div class="haldo-sun-system">
        <div class="haldo-orbit haldo-orbit--1">
          <span class="haldo-planet"></span>
        </div>

        <div class="haldo-orbit haldo-orbit--2">
          <span class="haldo-planet"></span>
        </div>

        <div class="haldo-orbit haldo-orbit--3">
          <span class="haldo-planet"></span>
        </div>

        <div class="haldo-sun"></div>
      </div>
    </div>

    <!-- TOP SYSTEM BAR -->
    <header class="haldo-topbar">

      <div class="haldo-brand">

        <img
          id="haldo-brand-logo"
          class="haldo-brand__logo"
          src="assets/logo/logo.png"
          alt="HalDo"
          onerror="
            this.style.display='none';
            document.getElementById('haldo-brand-fallback').style.display='flex';
          "
        >

        <div
          id="haldo-brand-fallback"
          class="haldo-brand__fallback"

    <!-- WORKSPACE -->

      <button

      >

      <button

  <!-- =========================================================
       BOOT SCREEN
       ========================================================= -->
  <div id="haldo-boot">

    <div class="haldo-boot-inner">

      <img
        class="haldo-boot-logo"
        src="assets/logo/logo.png"

      <div class="haldo-boot-title">
        HalDo AI OS 20
      </div>

      <div
        id="haldo-boot-text"
        class="haldo-boot-text"
      >
        HalDo AI OS wird gestartet …
      </div>

      <div class="haldo-boot-progress">
        <span></span>
      </div>

    </div>

  </div>

  <!-- =========================================================
       KERN-/BESTANDS-SCRIPTS
       =========================================================

       Der bestehende Kernel bleibt erhalten.
       Die Runtime-Schicht wird danach separat ersetzt.
       ========================================================= -->

  <script src="js/kernel.js"></script>

  <!-- =========================================================
       HALDO AI OS 20 BOOTSTRAP
       ========================================================= -->
  <script src="js/haldo-bootstrap.js"></script>

  <!-- =========================================================
       FALLBACK-START
       Falls der Bootstrap noch nicht vorhanden/komplett ist,
       bleibt die Shell sichtbar und zeigt keinen Fake-Status.
       ========================================================= -->
  <script>
    (function () {
      "use strict";

      const boot = document.getElementById("haldo-boot");
      const bootText = document.getElementById("haldo-boot-text");
      const systemStatus =
        document.getElementById("haldo-system-status");

      const menu = document.getElementById("haldo-app-menu");
      const menuButton =
        document.getElementById("haldo-menu-button");
      const menuClose =
        document.getElementById("haldo-menu-close");
      const dockApps =
        document.getElementById("haldo-dock-apps");
      const searchButton =
        document.getElementById("haldo-search-button");
      const searchInput =
        document.getElementById("haldo-app-search");

      const status = document.getElementById("haldo-status");

      function setStatus(text, temporary) {
        if (systemStatus) {
          systemStatus.textContent = text;
        }

        if (bootText) {
          bootText.textContent = text;
        }

        if (temporary && status) {
          status.textContent = text;
          status.classList.add("is-visible");

          window.clearTimeout(setStatus._timer);

          setStatus._timer = window.setTimeout(function () {
            status.classList.remove("is-visible");
          }, 1800);
        }
      }

      function openMenu() {
        if (!menu) return;

        menu.classList.add("is-open");
        menu.setAttribute("aria-hidden", "false");

        if (menuButton) {
          menuButton.setAttribute("aria-expanded", "true");
        }
      }

      function closeMenu() {
        if (!menu) return;

        menu.classList.remove("is-open");
        menu.setAttribute("aria-hidden", "true");

        if (menuButton) {
          menuButton.setAttribute("aria-expanded", "false");
        }
      }

      function toggleMenu() {
        if (!menu) return;

        if (menu.classList.contains("is-open")) {
          closeMenu();
        } else {
          openMenu();
        }
      }

      function launchApp(appId) {
        /*
         * Die eigentliche App-Eröffnung übernimmt später
         * App Manager / Runtime.
         *
         * Wir verwenden absichtlich keine Fake-Meldung
         * wie „App geöffnet“.
         */

        if (
          window.HalDoAppManager &&
          typeof window.HalDoAppManager.open === "function"
        ) {
          window.HalDoAppManager.open(appId);
          closeMenu();
          return;
        }

        if (
          window.HalDoRuntime &&
          typeof window.HalDoRuntime.openApp === "function"
        ) {
          window.HalDoRuntime.openApp(appId);
          closeMenu();
          return;
        }

        if (
          window.HalDoOS &&
          window.HalDoOS.appManager &&
          typeof window.HalDoOS.appManager.open === "function"
        ) {
          window.HalDoOS.appManager.open(appId);
          closeMenu();
          return;
        }

        setStatus(
          "App Runtime wird noch verbunden.",
          true
        );
      }

      if (menuButton) {
        menuButton.addEventListener("click", toggleMenu);
      }

      if (menuClose) {
        menuClose.addEventListener("click", closeMenu);
      }

      if (dockApps) {
        dockApps.addEventListener("click", openMenu);
      }

      if (searchButton) {
        searchButton.addEventListener("click", function () {
          openMenu();

          window.setTimeout(function () {
            if (searchInput) {
              searchInput.focus();
            }
          }, 60);
        });
      }

      document.querySelectorAll(
        "[data-launch-app]"
      ).forEach(function (button) {
        button.addEventListener("click", function () {
          const appId =
            button.getAttribute("data-launch-app");

          if (appId) {
            launchApp(appId);
          }
        });
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeMenu();
        }
      });

      document.addEventListener("click", function (event) {
        if (!menu || !menu.classList.contains("is-open")) {
          return;
        }

        if (
          menu.contains(event.target) ||
          menuButton?.contains(event.target) ||
          dockApps?.contains(event.target) ||
          searchButton?.contains(event.target)
        ) {
          return;
        }

        closeMenu();
      });

      /*
       * Öffentliche Shell-API.
       * Die Runtime kann diese API verwenden, ohne
       * index.html erneut umzuschreiben.
       */
      window.HalDoShell = {
        version: "20.0.0",
        openAppMenu: openMenu,
        closeAppMenu: closeMenu,
        toggleAppMenu: toggleMenu,
        launchApp: launchApp,
        setStatus: setStatus,
        getWindowLayer: function () {
          return document.getElementById(
            "haldo-window-layer"
          );
        }
      };

      /*
       * Bootscreen nicht endlos anzeigen.
       * Die echte Runtime kann später
       * window.HalDoShellReady() aufrufen.
       */
      window.HalDoShellReady = function () {
        setStatus(
          "HalDo AI OS 20 ist bereit."
        );

        if (boot) {
          boot.classList.add("is-hidden");
        }
      };

      /*
       * Kurzer Sicherheits-Fallback:
       * Falls der Bootstrap keine Ready-Meldung sendet,
       * wird nach maximal 4 Sekunden die Shell trotzdem
       * freigegeben.
       */
      window.setTimeout(function () {
        if (boot && !boot.classList.contains("is-hidden")) {
          setStatus(
            "HalDo AI OS 20 Shell bereit."
          );

          boot.classList.add("is-hidden");
        }
      }, 4000);

      /*
       * Sichtbarer Startzustand.
       */
      setStatus("HalDo AI OS 20 wird initialisiert …");
    })();
  </script>

</body>
