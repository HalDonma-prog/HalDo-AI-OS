<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050816"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – Cosmic AI Operating System"
    >

    <title>HalDo AI OS 20</title>

    <!-- =========================================================
         PWA
         ========================================================= -->

    <link
        rel="manifest"
        href="manifest.json"
    >

    <!-- =========================================================
         HALDO ASSETS
         ========================================================= -->

    <link
        rel="icon"
        type="image/png"
        href="assets/logo/logo.png"
    >

    <!-- =========================================================
         EXISTING HALDO STYLES
         ========================================================= -->

    <link
        rel="stylesheet"
        href="haldo-logo-engine.css"
    >

    <!-- =========================================================
         HALDO AI OS 20 SHELL STYLE
         ========================================================= -->

    <style>

        :root {
            --hd-bg: #030611;
            --hd-bg-2: #071126;
            --hd-panel: rgba(8, 16, 38, 0.72);
            --hd-panel-strong: rgba(8, 15, 32, 0.92);

            --hd-border: rgba(255, 255, 255, 0.13);
            --hd-text: #ffffff;
            --hd-muted: rgba(255,255,255,0.68);

            --hd-glow: rgba(95, 170, 255, 0.45);
            --hd-sun: #ffd86b;

            --hd-radius: 22px;
            --hd-window-radius: 18px;

            --hd-menu-height: 72px;
            --hd-dock-height: 76px;

            --hd-window-width: min(760px, 92vw);
            --hd-window-height: min(620px, 78vh);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--hd-bg);
            color: var(--hd-text);
        }

        body {
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            color: inherit;
        }

        /* =====================================================
           MAIN OS
           ===================================================== */

        #haldo-os {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(42, 80, 150, 0.24),
                    transparent 42%
                ),
                radial-gradient(
                    circle at 80% 20%,
                    rgba(100, 60, 180, 0.15),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #02040d,
                    #050a1c 48%,
                    #02030b
                );
        }

        /* =====================================================
           COSMIC SKY
           ===================================================== */

        #cosmic-world {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .cosmic-nebula {
            position: absolute;
            inset: -25%;
            background:
                radial-gradient(
                    ellipse at 30% 35%,
                    rgba(79, 111, 255, 0.13),
                    transparent 35%
                ),
                radial-gradient(
                    ellipse at 70% 55%,
                    rgba(157, 79, 255, 0.11),
                    transparent 36%
                );
            filter: blur(35px);
            animation: nebulaFloat 18s ease-in-out infinite alternate;
        }

        @keyframes nebulaFloat {
            from {
                transform: scale(1) translate3d(0,0,0);
            }

            to {
                transform: scale(1.08) translate3d(-1%, 1%, 0);
            }
        }

        /* =====================================================
           STARS
           ===================================================== */

        .stars,
        .stars::before,
        .stars::after {
            position: absolute;
            inset: 0;
            content: "";
            pointer-events: none;
        }

        .stars {
            opacity: 0.9;

            background-image:
                radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1.6px),
                radial-gradient(circle, rgba(180,215,255,.75) 1px, transparent 1.7px),
                radial-gradient(circle, rgba(255,235,190,.65) 1px, transparent 1.8px);

            background-size:
                97px 113px,
                151px 137px,
                211px 191px;

            background-position:
                12px 8px,
                53px 39px,
                97px 71px;

            animation: starsDrift 50s linear infinite;
        }

        .stars::before {
            opacity: 0.55;

            background-image:
                radial-gradient(circle, white 1.2px, transparent 2px),
                radial-gradient(circle, rgba(150,200,255,.8) 1px, transparent 1.7px);

            background-size:
                173px 149px,
                257px 227px;

            animation: starsTwinkle 4s ease-in-out infinite alternate;
        }

        .stars::after {
            opacity: 0.25;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255,255,255,.22),
                    transparent 65%
                );

            filter: blur(25px);
        }

        @keyframes starsDrift {
            from {
                transform: translate3d(0,0,0);
            }

            to {
                transform: translate3d(-90px,55px,0);
            }
        }

        @keyframes starsTwinkle {
            from {
                opacity: .25;
            }

            to {
                opacity: .8;
            }
        }

        /* =====================================================
           PLANET SYSTEM
           ===================================================== */

        #planet-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(900px, 96vw);
            height: min(900px, 96vw);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 0 18px rgba(100,160,255,.05);
        }

        .orbit-1 {
            width: 28%;
            height: 28%;
        }

        .orbit-2 {
            width: 44%;
            height: 44%;
        }

        .orbit-3 {
            width: 62%;
            height: 62%;
        }

        .orbit-4 {
            width: 82%;
            height: 82%;
        }

        /* =====================================================
           SUN
           ===================================================== */

        #haldo-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 130px;
            height: 130px;

            transform:
                translate(-50%, -50%);

            border: 0;
            border-radius: 50%;

            cursor: pointer;
            pointer-events: auto;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fff8ca 0%,
                    #ffe994 18%,
                    #ffd15c 46%,
                    #ffad36 72%,
                    rgba(255,150,30,.1) 100%
                );

            box-shadow:
                0 0 30px rgba(255,210,100,.85),
                0 0 75px rgba(255,190,70,.55),
                0 0 140px rgba(255,170,40,.30);

            animation: sunPulse 4s ease-in-out infinite;
        }

        #haldo-sun::before,
        #haldo-sun::after {
            content: "";
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            border: 1px solid rgba(255,215,110,.22);
        }

        #haldo-sun::after {
            inset: -44px;
            border-color: rgba(255,215,110,.10);
        }

        @keyframes sunPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.045);
            }
        }

        /* =====================================================
           PLANETS
           ===================================================== */

        .planet {
            position: absolute;
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            box-shadow:
                inset -8px -10px 15px rgba(0,0,0,.35),
                0 0 20px rgba(120,170,255,.18);
        }

        .planet-earth {
            width: 58px;
            height: 58px;
            left: 24%;
            top: 48%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #7fd4ff,
                    #2878bc 45%,
                    #123a75 72%,
                    #06162d
                );
        }

        .planet-earth::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 12px;
            left: 13px;
            top: 18px;
            border-radius: 60% 30% 60% 30%;
            background: rgba(110,220,150,.75);
            transform: rotate(-20deg);
        }

        .planet-moon {
            width: 25px;
            height: 25px;
            left: 32%;
            top: 28%;

            background:
                radial-gradient(
                    circle at 32% 28%,
                    #eeeeee,
                    #9f9f9f 60%,
                    #4b4b4b
                );
        }

        .planet-blue {
            width: 42px;
            height: 42px;
            left: 73%;
            top: 23%;

            background:
                radial-gradient(
                    circle at 30% 28%,
                    #c7d8ff,
                    #6079d9 48%,
                    #273c94
                );
        }

        .planet-ringed {
            width: 52px;
            height: 52px;
            left: 78%;
            top: 66%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #f5dcaa,
                    #b9874b 62%,
                    #604522
                );
        }

        .planet-ringed::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 90px;
            height: 25px;
            border: 3px solid rgba(220,190,140,.55);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-16deg);
        }

        /* =====================================================
           LOGO
           ===================================================== */

        #haldo-logo-stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 190px;
            height: 190px;
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            pointer-events: none;
            z-index: 20;
        }

        #haldo-logo-stage img {
            width: 115px;
            height: 115px;
            object-fit: contain;

            filter:
                drop-shadow(0 0 15px rgba(120,190,255,.65))
                drop-shadow(0 0 35px rgba(90,150,255,.28));

            animation: logoFloat 5s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        /* =====================================================
           TOP MENU
           ===================================================== */

        #topbar {
            position: absolute;
            left: 16px;
            right: 16px;
            top: 16px;

            height: var(--hd-menu-height);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 16px;

            background: rgba(5,10,25,.62);
            border: 1px solid var(--hd-border);
            border-radius: 24px;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 15px 50px rgba(0,0,0,.28);

            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 700;
        }

        .brand-version {
            margin-top: 4px;
            color: var(--hd-muted);
            font-size: 11px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hd-icon-button {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border: 1px solid var(--hd-border);
            border-radius: 14px;

            background: rgba(255,255,255,.055);

            cursor: pointer;

            transition:
                transform .18s ease,
                background .18s ease;
        }

        .hd-icon-button:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,.10);
        }

        /* =====================================================
           SYSTEM STATUS
           ===================================================== */

        #system-status {
            position: absolute;
            left: 24px;
            bottom: calc(var(--hd-dock-height) + 24px);

            display: flex;
            align-items: center;
            gap: 9px;

            padding: 10px 14px;

            background: rgba(5,10,24,.60);
            border: 1px solid var(--hd-border);
            border-radius: 16px;

            color: var(--hd-muted);
            font-size: 11px;

            backdrop-filter: blur(15px);

            z-index: 80;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #65e39a;

            box-shadow:
                0 0 12px rgba(80,230,150,.8);
        }

        /* =====================================================
           DOCK
           ===================================================== */

        #dock {
            position: absolute;
            left: 50%;
            bottom: 16px;

            transform: translateX(-50%);

            min-width: min(620px, calc(100vw - 32px));
            height: var(--hd-dock-height);

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 10px 14px;

            background: rgba(5,10,25,.76);
            border: 1px solid var(--hd-border);
            border-radius: 24px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 18px 70px rgba(0,0,0,.40);

            z-index: 100;
        }

        .dock-button {
            min-width: 50px;
            height: 50px;

            border: 1px solid transparent;
            border-radius: 16px;

            background: rgba(255,255,255,.055);

            cursor: pointer;

            transition:
                transform .18s ease,
                background .18s ease;
        }

        .dock-button:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,.12);
        }

        /* =====================================================
           APP WINDOWS
           ===================================================== */

        #window-layer {
            position: absolute;
            inset: 0;
            z-index: 500;
            pointer-events: none;
        }

        .haldo-window {
            position: absolute;

            width: var(--hd-window-width);
            height: var(--hd-window-height);

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    145deg,
                    rgba(13,23,50,.96),
                    rgba(5,10,25,.94)
                );

            border: 1px solid rgba(255,255,255,.14);
            border-radius: var(--hd-window-radius);

            box-shadow:
                0 35px 100px rgba(0,0,0,.55),
                0 0 40px rgba(70,130,255,.10);

            overflow: hidden;

            pointer-events: auto;

            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);

            animation: windowOpen .22s ease-out;
        }

        @keyframes windowOpen {
            from {
                opacity: 0;
                transform:
                    translate(-50%, -48%)
                    scale(.97);
            }

            to {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        .window-header {
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 14px 0 18px;

            border-bottom: 1px solid rgba(255,255,255,.09);

            background: rgba(255,255,255,.025);
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 10px;

            font-weight: 650;
            font-size: 14px;
        }

        .window-controls {
            display: flex;
            gap: 7px;
        }

        .window-control {
            width: 32px;
            height: 32px;

            border: 1px solid rgba(255,255,255,.10);
            border-radius: 10px;

            background: rgba(255,255,255,.05);

            cursor: pointer;
        }

        .window-body {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }

        /* =====================================================
           HALDO AI
           ===================================================== */

        .ai-shell {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .ai-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ai-avatar {
            width: 48px;
            height: 48px;
            object-fit: contain;

            filter:
                drop-shadow(0 0 14px rgba(110,180,255,.6));
        }

        .ai-title {
            font-weight: 700;
        }

        .ai-subtitle {
            margin-top: 4px;
            color: var(--hd-muted);
            font-size: 12px;
        }

        .ai-messages {
            flex: 1;
            min-height: 0;

            padding: 0 20px 20px;

            overflow: auto;
        }

        .ai-message {
            max-width: 85%;
            margin-bottom: 12px;
            padding: 12px 14px;

            border-radius: 16px;

            background: rgba(255,255,255,.055);

            color: rgba(255,255,255,.92);

            line-height: 1.45;
            font-size: 13px;
        }

        .ai-message.user {
            margin-left: auto;
            background: rgba(80,140,255,.17);
        }

        .ai-input-area {
            display: flex;
            gap: 8px;
            padding: 14px;

            border-top: 1px solid rgba(255,255,255,.08);
        }

        .ai-input {
            flex: 1;

            min-width: 0;

            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;

            outline: none;

            padding: 12px 14px;

            color: white;

            background: rgba(255,255,255,.045);
        }

        .ai-send {
            width: 48px;
            border: 0;
            border-radius: 14px;
            background: rgba(90,150,255,.22);
            cursor: pointer;
        }

        /* =====================================================
           APP MENU
           ===================================================== */

        #app-menu {
            position: absolute;

            left: 18px;
            top: 94px;

            width: min(420px, calc(100vw - 36px));
            max-height: min(650px, calc(100vh - 130px));

            padding: 16px;

            overflow: auto;

            background: rgba(5,10,25,.91);
            border: 1px solid var(--hd-border);
            border-radius: 22px;

            backdrop-filter: blur(28px);

            box-shadow:
                0 25px 80px rgba(0,0,0,.45);

            z-index: 400;

            opacity: 0;
            pointer-events: none;

            transform:
                translateY(-8px)
                scale(.98);

            transition:
                opacity .18s ease,
                transform .18s ease;
        }

        #app-menu.open {
            opacity: 1;
            pointer-events: auto;

            transform:
                translateY(0)
                scale(1);
        }

        .menu-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0,1fr));
            gap: 8px;
        }

        .app-launcher {
            min-height: 82px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px;

            background: rgba(255,255,255,.035);

            cursor: pointer;

            transition:
                transform .18s ease,
                background .18s ease;
        }

        .app-launcher:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.08);
        }

        .app-icon {
            font-size: 22px;
        }

        .app-name {
            font-size: 11px;
            color: rgba(255,255,255,.78);
            text-align: center;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 700px) {

            :root {
                --hd-menu-height: 62px;
                --hd-dock-height: 68px;
            }

            #topbar {
                left: 10px;
                right: 10px;
                top: 10px;
            }

            .brand-version {
                display: none;
            }

            #planet-system {
                width: 720px;
                height: 720px;
            }

            #haldo-sun {
                width: 105px;
                height: 105px;
            }

            #haldo-logo-stage img {
                width: 90px;
                height: 90px;
            }

            #system-status {
                display: none;
            }

            #dock {
                bottom: 10px;
                gap: 6px;
                padding: 8px;
            }

            .dock-button {
                min-width: 45px;
                height: 45px;
            }

            .haldo-window {
                width: calc(100vw - 22px);
                height: calc(100vh - 150px);
            }

            .app-grid {
                grid-template-columns: repeat(2, minmax(0,1fr));
            }
        }

    </style>
</head>

<body>

<!-- =========================================================
     HALDO AI OS 20
     CENTRAL APPLICATION SHELL
     ========================================================= -->

<div id="haldo-os">

    <!-- =====================================================
         COSMIC WORLD
         ===================================================== -->

    <section id="cosmic-world" aria-label="HalDo Cosmic World">

        <div class="cosmic-nebula"></div>

        <div class="stars"></div>

        <div id="planet-system">

            <div class="orbit orbit-1"></div>
            <div class="orbit orbit-2"></div>
            <div class="orbit orbit-3"></div>
            <div class="orbit orbit-4"></div>

            <!-- SUN -->
            <button
                id="haldo-sun"
                type="button"
                aria-label="HalDo AI öffnen"
                title="HalDo AI öffnen"
            ></button>

            <!-- PLANETS -->
            <button
                class="planet planet-earth"
                id="haldo-earth"
                type="button"
                aria-label="Erde"
                title="Erde"
            ></button>

            <button
                class="planet planet-moon"
                id="haldo-moon"
                type="button"
                aria-label="Mond"
                title="Mond"
            ></button>

            <button
                class="planet planet-blue"
                id="haldo-planet-blue"
                type="button"
                aria-label="Planet"
                title="Planet"
            ></button>

            <button
                class="planet planet-ringed"
                id="haldo-planet-ringed"
                type="button"
                aria-label="Planet mit Ring"
                title="Planet"
            ></button>

        </div>

        <!-- HALDO LOGO -->
        <div id="haldo-logo-stage">

            <img
                src="assets/logo/logo.png"
                alt="HalDo"
                id="haldo-logo"
            >

        </div>

    </section>

    <!-- =====================================================
         TOP MENU
         ===================================================== -->

    <header id="topbar">

        <div class="brand">

            <img
                src="assets/logo/logo.png"
                alt="HalDo"
            >

            <div class="brand-text">

                <div class="brand-name">
                    HalDo AI OS
                </div>

                <div class="brand-version">
                    Version 20
                </div>

            </div>

        </div>

        <div class="top-actions">

            <button
                class="hd-icon-button"
                id="menu-button"
                type="button"
                aria-label="Apps öffnen"
                title="Apps"
            >
                ☰
            </button>

            <button
                class="hd-icon-button"
                id="ai-button"
                type="button"
                aria-label="HalDo AI öffnen"
                title="HalDo AI"
            >
                AI
            </button>

            <button
                class="hd-icon-button"
                id="settings-button"
                type="button"
                aria-label="Einstellungen"
                title="Einstellungen"
            >
                ⚙
            </button>

        </div>

    </header>

    <!-- =====================================================
         APP MENU
         ===================================================== -->

    <aside
        id="app-menu"
        aria-label="HalDo Apps"
    >

        <div class="menu-title">
            HalDo AI OS Apps
        </div>

        <div
            class="app-grid"
            id="app-grid"
        >

            <!-- CORE -->
            <button
                class="app-launcher"
                data-app="system"
                type="button"
            >
                <span class="app-icon">◉</span>
                <span class="app-name">System</span>
            </button>

            <!-- AI -->
            <button
                class="app-launcher"
                data-app="ai"
                type="button"
            >
                <span class="app-icon">✦</span>
                <span class="app-name">HalDo AI</span>
            </button>

            <!-- UPDATE -->
            <button
                class="app-launcher"
                data-app="update"
                type="button"
            >
                <span class="app-icon">↻</span>
                <span class="app-name">Software Update</span>
            </button>

            <!-- BACKUP -->
            <button
                class="app-launcher"
                data-app="backup"
                type="button"
            >
                <span class="app-icon">▣</span>
                <span class="app-name">Backup</span>
            </button>

            <!-- STORAGE -->
            <button
                class="app-launcher"
                data-app="storage"
                type="button"
            >
                <span class="app-icon">▤</span>
                <span class="app-name">Storage</span>
            </button>

            <!-- SETTINGS -->
            <button
                class="app-launcher"
                data-app="settings"
                type="button"
            >
                <span class="app-icon">⚙</span>
                <span class="app-name">Einstellungen</span>
            </button>

        </div>

    </aside>

    <!-- =====================================================
         SYSTEM STATUS
         ===================================================== -->

    <div id="system-status">

        <span class="status-dot"></span>

        <span id="status-text">
            HalDo Core wird vorbereitet …
        </span>

    </div>

    <!-- =====================================================
         WINDOW LAYER
         ===================================================== -->

    <main
        id="window-layer"
        aria-live="polite"
    ></main>

    <!-- =====================================================
         DOCK
         ===================================================== -->

    <nav
        id="dock"
        aria-label="HalDo Dock"
    >

        <button
            class="dock-button"
            id="dock-home"
            type="button"
            title="Home"
        >
            ◉
        </button>

        <button
            class="dock-button"
            id="dock-ai"
            type="button"
            title="HalDo AI"
        >
            ✦
        </button>

        <button
            class="dock-button"
            id="dock-apps"
            type="button"
            title="Apps"
        >
            ▦
        </button>

        <button
            class="dock-button"
            id="dock-update"
            type="button"
            title="Software Update"
        >
            ↻
        </button>

        <button
            class="dock-button"
            id="dock-settings"
            type="button"
            title="Einstellungen"
        >
            ⚙
        </button>

    </nav>

</div>

<!-- =========================================================
     HALDO INTERNAL SHELL CONTROLLER
     ========================================================= -->

<script>

"use strict";

(function () {

    const state = {
        windows: new Map(),
        windowCounter: 0,
        appMenuOpen: false,
        booted: false
    };

    const $ = (selector, root = document) =>
        root.querySelector(selector);

    const $$ = (selector, root = document) =>
        [...root.querySelectorAll(selector)];

    /* ========================================================
       HALDO GLOBAL
       ======================================================== */

    window.HalDo = window.HalDo || {};

    window.HalDo.OS = window.HalDo.OS || {
        version: "20.0.0",
        name: "HalDo AI OS",
        initialized: false
    };

    window.HalDo.UI = window.HalDo.UI || {};

    /* ========================================================
       EVENT BUS FALLBACK
       ======================================================== */

    window.HalDo.events =
        window.HalDo.events ||
        new EventTarget();

    window.HalDo.emit = function (name, detail = {}) {

        this.events.dispatchEvent(
            new CustomEvent(name, {
                detail
            })
        );

    };

    window.HalDo.on = function (name, callback) {

        this.events.addEventListener(
            name,
            event => callback(event.detail)
        );

    };

    /* ========================================================
       STATUS
       ======================================================== */

    function setStatus(text) {

        const status = $("#status-text");

        if (status) {
            status.textContent = text;
        }

    }

    /* ========================================================
       APP MENU
       ======================================================== */

    function toggleAppMenu(force) {

        const menu = $("#app-menu");

        if (!menu) {
            return;
        }

        state.appMenuOpen =
            typeof force === "boolean"
                ? force
                : !state.appMenuOpen;

        menu.classList.toggle(
            "open",
            state.appMenuOpen
        );

    }

    /* ========================================================
       WINDOW MANAGER FALLBACK
       ======================================================== */

    function createWindow(options = {}) {

        const {

            id =
                "haldo-window-" +
                (++state.windowCounter),

            title = "HalDo",

            content = "",

            width,

            height

        } = options;

        const layer = $("#window-layer");

        if (!layer) {
            return null;
        }

        const existing =
            document.getElementById(id);

        if (existing) {

            existing.style.zIndex =
                String(++state.windowCounter);

            return existing;

        }

        const windowElement =
            document.createElement("section");

        windowElement.className =
            "haldo-window";

        windowElement.id = id;

        if (width) {
            windowElement.style.width = width;
        }

        if (height) {
            windowElement.style.height = height;
        }

        windowElement.innerHTML = `

            <div class="window-header">

                <div class="window-title">

                    <img
                        src="assets/logo/logo.png"
                        alt=""
                        style="
                            width:26px;
                            height:26px;
                            object-fit:contain;
                        "
                    >

                    <span>
                        ${escapeHTML(title)}
                    </span>

                </div>

                <div class="window-controls">

                    <button
                        class="window-control"
                        data-window-action="minimize"
                        type="button"
                        title="Minimieren"
                    >
                        −
                    </button>

                    <button
                        class="window-control"
                        data-window-action="close"
                        type="button"
                        title="Schließen"
                    >
                        ×
                    </button>

                </div>

            </div>

            <div class="window-body">
                ${content}
            </div>

        `;

        layer.appendChild(windowElement);

        state.windows.set(
            id,
            windowElement
        );

        windowElement.addEventListener(
            "pointerdown",
            () => {

                windowElement.style.zIndex =
                    String(++state.windowCounter);

            }
        );

        windowElement
            .querySelector(
                '[data-window-action="close"]'
            )
            ?.addEventListener(
                "click",
                () => closeWindow(id)
            );

        windowElement
            .querySelector(
                '[data-window-action="minimize"]'
            )
            ?.addEventListener(
                "click",
                () => minimizeWindow(id)
            );

        return windowElement;

    }

    function closeWindow(id) {

        const element =
            document.getElementById(id);

        if (!element) {
            return;
        }

        element.remove();

        state.windows.delete(id);

    }

    function minimizeWindow(id) {

        const element =
            document.getElementById(id);

        if (!element) {
            return;
        }

        element.style.display =
            element.style.display === "none"
                ? "flex"
                : "none";

    }

    /* ========================================================
       HALDO AI WINDOW
       ======================================================== */

    function openAI() {

        toggleAppMenu(false);

        const id = "haldo-ai-window";

        const existing =
            document.getElementById(id);

        if (existing) {

            existing.style.display = "flex";
            existing.style.zIndex =
                String(++state.windowCounter);

            return;

        }

        const windowElement =
            createWindow({

                id,

                title: "HalDo AI",

                content: `

                    <div class="ai-shell">

                        <div class="ai-header">

                            <img
                                class="ai-avatar"
                                src="assets/logo/logo.png"
                                alt="HalDo"
                            >

                            <div>

                                <div class="ai-title">
                                    HalDo AI
                                </div>

                                <div class="ai-subtitle">
                                    Dein intelligenter System-Assistent
                                </div>

                            </div>

                        </div>

                        <div
                            class="ai-messages"
                            id="haldo-ai-messages"
                        >

                            <div class="ai-message">

                                Hallo ❤️💙
                                Ich bin HalDo AI.
                                Wie kann ich dir helfen?

                            </div>

                        </div>

                        <div class="ai-input-area">

                            <input
                                class="ai-input"
                                id="haldo-ai-input"
                                type="text"
                                autocomplete="off"
                                placeholder="Schreibe an HalDo AI …"
                            >

                            <button
                                class="ai-send"
                                id="haldo-ai-send"
                                type="button"
                                aria-label="Senden"
                            >
                                ➤
                            </button>

                        </div>

                    </div>

                `

            });

        if (!windowElement) {
            return;
        }

        const input =
            $("#haldo-ai-input");

        const send =
            $("#haldo-ai-send");

        const messages =
            $("#haldo-ai-messages");

        function addMessage(
            text,
            user = false
        ) {

            const message =
                document.createElement("div");

            message.className =
                "ai-message" +
                (user ? " user" : "");

            message.textContent = text;

            messages.appendChild(message);

            messages.scrollTop =
                messages.scrollHeight;

        }

        function submit() {

            const value =
                input.value.trim();

            if (!value) {
                return;
            }

            addMessage(value, true);

            input.value = "";

            /*
             * Zuerst versuchen wir das echte
             * HalDo-AI-System zu verwenden.
             */

            if (
                window.HalDo &&
                window.HalDo.ai &&
                typeof window.HalDo.ai.respond === "function"
            ) {

                Promise.resolve(
                    window.HalDo.ai.respond(value)
                )
                .then(response => {

                    addMessage(
                        String(
                            response ||
                            "Ich bin bereit."
                        )
                    );

                })
                .catch(() => {

                    addMessage(
                        "HalDo AI ist verbunden, aber der aktuelle AI-Dienst konnte diese Anfrage noch nicht verarbeiten."
                    );

                });

                return;
            }

            /*
             * Fallback bis das echte AI-Modul
             * initialisiert wurde.
             */

            addMessage(
                "HalDo Core wird noch initialisiert. Einen Moment bitte."
            );

        }

        send?.addEventListener(
            "click",
            submit
        );

        input?.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {
                    submit();
                }

            }
        );

    }

    /* ========================================================
       GENERIC SYSTEM WINDOW
       ======================================================== */

    function openSystemWindow(
        title,
        text
    ) {

        createWindow({

            title,

            content: `

                <div
                    style="
                        padding:24px;
                        line-height:1.6;
                        color:rgba(255,255,255,.78);
                    "
                >

                    ${escapeHTML(text)}

                </div>

            `

        });

    }

    /* ========================================================
       APP ROUTING
       ======================================================== */

    function launchApp(appId) {

        toggleAppMenu(false);

        /*
         * Zuerst echtes App-System versuchen.
         */

        if (
            window.HalDo &&
            window.HalDo.apps &&
            typeof window.HalDo.apps.open === "function"
        ) {

            try {

                window.HalDo.apps.open(appId);

                return;

            } catch (error) {

                console.warn(
                    "HalDo App System:",
                    error
                );

            }

        }

        switch (appId) {

            case "ai":
                openAI();
                break;

            case "system":
                openSystemWindow(
                    "HalDo System",
                    "HalDo Core, System und Runtime werden über die zentrale OS-Architektur verwaltet."
                );
                break;

            case "update":
                openSystemWindow(
                    "Software Update",
                    "Update Manager, Versionierung, Validierung, Installation und Rollback werden über das Update-System verwaltet."
                );
                break;

            case "backup":
                openSystemWindow(
                    "Backup & Restore",
                    "Backup, Restore, Migration und Recovery gehören zum HalDo-System."
                );
                break;

            case "storage":
                openSystemWindow(
                    "Storage",
                    "HalDo Storage verwaltet lokale System- und App-Daten."
                );
                break;

            case "settings":
                openSystemWindow(
                    "Einstellungen",
                    "HalDo AI OS Einstellungen werden über das zentrale System verwaltet."
                );
                break;

            default:

                openSystemWindow(
                    "HalDo App",
                    "Diese App ist im zentralen App-System vorgesehen und wird geöffnet, sobald ihr Modul registriert ist."
                );

        }

    }

    /* ========================================================
       COSMIC SUN
       ======================================================== */

    function bindCosmicActions() {

        $("#haldo-sun")
            ?.addEventListener(
                "click",
                () => {

                    window.HalDo.emit(
                        "cosmic:sun:activated",
                        {
                            source: "sun"
                        }
                    );

                    openAI();

                }
            );

        $("#haldo-logo-stage")
            ?.addEventListener(
                "click",
                openAI
            );

        $("#haldo-earth")
            ?.addEventListener(
                "click",
                () => {

                    window.HalDo.emit(
                        "cosmic:earth:selected"
                    );

                }
            );

        $("#haldo-moon")
            ?.addEventListener(
                "click",
                () => {

                    window.HalDo.emit(
                        "cosmic:moon:selected"
                    );

                }
            );

    }

    /* ========================================================
       UI EVENTS
       ======================================================== */

    function bindUI() {

        $("#menu-button")
            ?.addEventListener(
                "click",
                () => toggleAppMenu()
            );

        $("#ai-button")
            ?.addEventListener(
                "click",
                openAI
            );

        $("#settings-button")
            ?.addEventListener(
                "click",
                () => launchApp("settings")
            );

        $("#dock-home")
            ?.addEventListener(
                "click",
                () => toggleAppMenu(false)
            );

        $("#dock-ai")
            ?.addEventListener(
                "click",
                openAI
            );

        $("#dock-apps")
            ?.addEventListener(
                "click",
                () => toggleAppMenu()
            );

        $("#dock-update")
            ?.addEventListener(
                "click",
                () => launchApp("update")
            );

        $("#dock-settings")
            ?.addEventListener(
                "click",
                () => launchApp("settings")
            );

        $$(".app-launcher")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        launchApp(
                            button.dataset.app
                        );

                    }
                );

            });

        bindCosmicActions();

    }

    /* ========================================================
       SCRIPT LOADER
       ======================================================== */

    const HALDO_MODULES = [

        /* CORE */
        "js/boot.js",
        "js/kernel.js",
        "js/system.js",
        "js/system-loader.js",

        /* DATA */
        "js/storage.js",
        "js/storage-manager.js",
        "js/config-manager.js",
        "js/conversation-state.js",

        /* EXISTING SYSTEM */
        "js/module-manager.js",
        "js/system-status.js",

        /* SERVICES / V20 */
        "js/service-manager.js",
        "js/haldo-v20-service-bridge.js",

        /* APP FOUNDATION */
        "js/app-contract.js",
        "js/app-foundation.js",

        /* APP SYSTEM */
        "js/haldo-v20-app-manifest.js",
        "js/app-registry.js",
        "js/haldo-v20-app-registry.js",
        "js/app-runtime.js",
        "js/haldo-v20-app-runtime.js",
        "js/app-manager.js",
        "js/app-router.js",
        "js/window-manager.js",

        /* HALDO AI */
        "js/ai-core.js",
        "js/ai-engine.js",
        "js/ai-language.js",
        "js/ai-memory.js",
        "js/ai-commands.js",
        "js/ai-chat.js",
        "js/ai-speech.js",
        "js/ai-voice.js",

        /* OTHER EXISTING AI / VOICE */
        "js/voice.js",

        /* COSMIC */
        "js/haldo-light-system.js",
        "js/logo-animation-manager.js",
        "js/logo-intro-manager.js",

        /* V20 */
        "js/haldo-v20-bridge.js",
        "js/haldo-v20-integration.js",

        /* OPTIONAL FINAL CONNECTOR */
        "js/haldo-v20-loader.js"

    ];

    /*
     * Nur tatsächlich vorhandene Dateien laden.
     * Dadurch können wir die Shell bereits verwenden,
     * während weitere Module später ergänzt werden.
     */

    async function loadModule(path) {

        try {

            const response =
                await fetch(
                    path,
                    {
                        method: "HEAD",
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                return false;
            }

            await new Promise(
                (resolve, reject) => {

                    const script =
                        document.createElement("script");

                    script.src = path;
                    script.defer = false;

                    script.onload =
                        resolve;

                    script.onerror =
                        reject;

                    document.head.appendChild(
                        script
                    );

                }
            );

            return true;

        } catch (error) {

            console.info(
                "HalDo optional module not available:",
                path
            );

            return false;

        }

    }

    async function loadHalDoModules() {

        let loaded = 0;

        for (
            const modulePath
            of HALDO_MODULES
        ) {

            const success =
                await loadModule(
                    modulePath
                );

            if (success) {
                loaded++;
            }

        }

        return loaded;

    }

    /* ========================================================
       BOOT
       ======================================================== */

    async function boot() {

        if (state.booted) {
            return;
        }

        state.booted = true;

        setStatus(
            "HalDo Core wird vorbereitet …"
        );

        bindUI();

        /*
         * UI ist sofort verfügbar.
         * Danach werden die echten Systemmodule
         * nacheinander initialisiert.
         */

        const loaded =
            await loadHalDoModules();

        window.HalDo.OS.initialized = true;

        window.HalDo.OS.loadedModules =
            loaded;

        setStatus(
            "HalDo AI OS 20 bereit"
        );

        window.HalDo.emit(
            "os:ready",
            {
                version:
                    window.HalDo.OS.version,

                loadedModules:
                    loaded
            }
        );

        /*
         * Vorhandene HalDo-Integrationen
         * dürfen ihren eigenen Start übernehmen.
         */

        if (
            window.HalDo &&
            window.HalDo.boot &&
            typeof window.HalDo.boot.start ===
                "function"
        ) {

            try {
                await window.HalDo.boot.start();
            } catch (error) {
                console.warn(
                    "HalDo boot integration:",
                    error
                );
            }

        }

    }

    /* ========================================================
       UTILITIES
       ======================================================== */

    function escapeHTML(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }

    /* ========================================================
       PUBLIC UI API
       ======================================================== */

    window.HalDo.UI.openAI =
        openAI;

    window.HalDo.UI.openWindow =
        createWindow;

    window.HalDo.UI.closeWindow =
        closeWindow;

    window.HalDo.UI.minimizeWindow =
        minimizeWindow;

    window.HalDo.UI.launchApp =
        launchApp;

    window.HalDo.UI.toggleAppMenu =
        toggleAppMenu;

    /* ========================================================
       START
       ======================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            boot,
            {
                once: true
            }
        );

    } else {

        boot();

    }

})();

</script>

</body>
</html>
