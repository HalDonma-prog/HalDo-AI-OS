<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050812"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – Professional Ultimate Foundation"
    >

    <title>HalDo AI OS 20</title>

    <!-- =========================================================
         HALDO AI OS 20
         MASTER SYSTEM SHELL
         ========================================================= -->

    <style>

        :root {
            --haldo-bg: #050812;
            --haldo-bg-2: #0a1020;
            --haldo-panel: rgba(13, 20, 38, 0.92);
            --haldo-panel-light: rgba(26, 36, 61, 0.88);

            --haldo-border: rgba(255,255,255,0.10);
            --haldo-border-light: rgba(255,255,255,0.18);

            --haldo-text: #f5f7ff;
            --haldo-text-soft: #aeb8cf;

            --haldo-blue: #4da3ff;
            --haldo-blue-2: #7dc2ff;

            --haldo-red: #ff5368;
            --haldo-green: #52e0a0;

            --haldo-shadow:
                0 30px 80px rgba(0,0,0,0.45);

            --haldo-radius: 18px;

            --desktop-scale: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(44, 93, 160, 0.18),
                    transparent 45%
                ),
                linear-gradient(
                    145deg,
                    #02040a,
                    #070d1b 50%,
                    #03050b
                );

            color: var(--haldo-text);
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        /* =====================================================
           BOOT
           ===================================================== */

        #haldo-boot {
            position: fixed;
            inset: 0;

            z-index: 999999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle,
                    #101b35 0%,
                    #050812 45%,
                    #010207 100%
                );

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        #haldo-boot.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .boot-content {
            text-align: center;
        }

        .boot-logo {
            width: 130px;
            height: 130px;

            object-fit: contain;

            filter:
                drop-shadow(0 0 25px rgba(77,163,255,0.65));

            animation:
                haldoLogoSpin 4s linear infinite,
                haldoLogoGlow 1.8s ease-in-out infinite alternate;
        }

        @keyframes haldoLogoSpin {
            from {
                transform: rotateY(0deg);
            }

            to {
                transform: rotateY(360deg);
            }
        }

        @keyframes haldoLogoGlow {
            from {
                filter:
                    drop-shadow(
                        0 0 12px rgba(77,163,255,0.35)
                    );
            }

            to {
                filter:
                    drop-shadow(
                        0 0 38px rgba(125,194,255,0.95)
                    );
            }
        }

        .boot-title {
            margin-top: 28px;

            font-size: 28px;
            font-weight: 700;

            letter-spacing: 1px;
        }

        .boot-status {
            margin-top: 10px;

            color: var(--haldo-text-soft);

            font-size: 14px;
        }

        .boot-progress {
            width: 240px;
            height: 4px;

            margin:
                24px auto 0;

            overflow: hidden;

            border-radius: 999px;

            background: rgba(255,255,255,0.08);
        }

        .boot-progress-bar {
            width: 0%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    var(--haldo-blue),
                    var(--haldo-blue-2)
                );

            transition: width 0.25s ease;
        }

        /* =====================================================
           DESKTOP
           ===================================================== */

        #haldo-os {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        #haldo-desktop {
            position: relative;

            flex: 1;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(58,110,190,0.12),
                    transparent 40%
                );
        }

        .desktop-background-grid {
            position: absolute;
            inset: 0;

            pointer-events: none;

            opacity: 0.14;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.04) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.04) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;
        }

        .desktop-center {
            position: absolute;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            pointer-events: none;
        }

        .desktop-brand {
            text-align: center;

            opacity: 0.28;
        }

        .desktop-brand img {
            width: 100px;
            height: 100px;

            object-fit: contain;
        }

        .desktop-brand-title {
            margin-top: 15px;

            font-size: 30px;
            font-weight: 700;

            letter-spacing: 2px;
        }

        .desktop-brand-subtitle {
            margin-top: 5px;

            color: var(--haldo-text-soft);

            font-size: 13px;
        }

        /* =====================================================
           TOP BAR
           ===================================================== */

        #haldo-topbar {
            position: relative;

            z-index: 5000;

            height: 58px;

            display: flex;
            align-items: center;

            padding: 0 15px;

            border-bottom:
                1px solid var(--haldo-border);

            background:
                rgba(5,8,18,0.86);

            backdrop-filter: blur(25px);
        }

        .topbar-left {
            display: flex;
            align-items: center;

            gap: 10px;

            min-width: 220px;
        }

        .haldo-menu-button {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            color: white;

            background:
                rgba(255,255,255,0.07);

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .haldo-menu-button:hover {
            background:
                rgba(77,163,255,0.18);

            transform: translateY(-1px);
        }

        .haldo-mini-logo {
            width: 34px;
            height: 34px;

            object-fit: contain;
        }

        .topbar-title {
            font-size: 15px;
            font-weight: 650;
        }

        .topbar-version {
            margin-left: 5px;

            color: var(--haldo-text-soft);

            font-size: 11px;
        }

        .topbar-center {
            flex: 1;

            display: flex;
            justify-content: center;
        }

        .topbar-status {
            display: flex;
            align-items: center;

            gap: 8px;

            color: var(--haldo-text-soft);

            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--haldo-green);

            box-shadow:
                0 0 12px rgba(82,224,160,0.75);
        }

        .topbar-right {
            min-width: 220px;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            gap: 8px;
        }

        .topbar-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            color: var(--haldo-text-soft);

            background:
                rgba(255,255,255,0.05);

            transition:
                0.2s ease;
        }

        .topbar-icon:hover {
            color: white;

            background:
                rgba(255,255,255,0.10);
        }

        /* =====================================================
           DOCK
           ===================================================== */

        #haldo-dock {
            position: absolute;

            left: 50%;
            bottom: 18px;

            z-index: 4500;

            transform: translateX(-50%);

            display: flex;
            align-items: center;

            gap: 8px;

            padding: 9px;

            border:
                1px solid var(--haldo-border-light);

            border-radius: 20px;

            background:
                rgba(8,13,26,0.82);

            backdrop-filter: blur(25px);

            box-shadow:
                var(--haldo-shadow);
        }

        .dock-app {
            position: relative;

            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            color: white;

            background:
                rgba(255,255,255,0.07);

            font-size: 22px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .dock-app:hover {
            transform:
                translateY(-8px)
                scale(1.05);

            background:
                rgba(77,163,255,0.20);
        }

        .dock-app.active::after {
            content: "";

            position: absolute;

            bottom: -5px;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: var(--haldo-blue);
        }

        /* =====================================================
           APP WINDOW LAYER
           ===================================================== */

        #haldo-window-layer {
            position: absolute;

            inset: 0;

            z-index: 3000;

            pointer-events: none;
        }

        .haldo-window {
            position: absolute;

            width: 720px;
            height: 520px;

            min-width: 360px;
            min-height: 250px;

            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 100px);

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border:
                1px solid var(--haldo-border-light);

            border-radius:
                var(--haldo-radius);

            background:
                var(--haldo-panel);

            backdrop-filter: blur(30px);

            box-shadow:
                0 35px 100px rgba(0,0,0,0.55);

            pointer-events: auto;

            animation:
                windowOpen 0.18s ease;
        }

        @keyframes windowOpen {

            from {
                opacity: 0;
                transform:
                    translateY(12px)
                    scale(0.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .haldo-window.maximized {
            left: 12px !important;
            top: 12px !important;

            width: calc(100% - 24px) !important;
            height: calc(100% - 24px) !important;
        }

        .haldo-window.minimized {
            display: none;
        }

        .haldo-window-header {
            height: 48px;

            flex-shrink: 0;

            display: flex;
            align-items: center;

            padding: 0 12px;

            border-bottom:
                1px solid var(--haldo-border);

            background:
                rgba(255,255,255,0.025);

            cursor: grab;
        }

        .haldo-window-header:active {
            cursor: grabbing;
        }

        .window-app-icon {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 9px;

            border-radius: 8px;

            background:
                rgba(255,255,255,0.07);
        }

        .window-title {
            flex: 1;

            font-size: 13px;
            font-weight: 650;
        }

        .window-controls {
            display: flex;
            gap: 5px;
        }

        .window-control {
            width: 29px;
            height: 29px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            color: var(--haldo-text-soft);

            background:
                rgba(255,255,255,0.05);
        }

        .window-control:hover {
            color: white;

            background:
                rgba(255,255,255,0.12);
        }

        .window-control.close:hover {
            background:
                rgba(255,83,104,0.25);
        }

        .haldo-window-content {
            flex: 1;

            overflow: auto;

            min-height: 0;
        }

        /* =====================================================
           APP MENU
           ===================================================== */

        #haldo-app-menu {
            position: fixed;

            top: 67px;
            left: 12px;

            z-index: 9000;

            width: 390px;
            max-width: calc(100vw - 24px);

            max-height:
                calc(100vh - 90px);

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border:
                1px solid var(--haldo-border-light);

            border-radius: 20px;

            background:
                rgba(7,12,25,0.96);

            backdrop-filter: blur(35px);

            box-shadow:
                0 35px 100px rgba(0,0,0,0.65);

            transform-origin: top left;

            animation:
                menuOpen 0.18s ease;
        }

        #haldo-app-menu.hidden {
            display: none;
        }

        @keyframes menuOpen {

            from {
                opacity: 0;
                transform:
                    scale(0.96)
                    translateY(-5px);
            }

            to {
                opacity: 1;
                transform:
                    scale(1)
                    translateY(0);
            }
        }

        .menu-header {
            padding: 20px 20px 14px;
        }

        .menu-header-title {
            font-size: 20px;
            font-weight: 700;
        }

        .menu-header-subtitle {
            margin-top: 4px;

            color: var(--haldo-text-soft);

            font-size: 12px;
        }

        .menu-search {
            margin: 0 15px 15px;

            padding: 0 12px;

            height: 42px;

            border:
                1px solid var(--haldo-border);

            border-radius: 11px;

            outline: none;

            color: white;

            background:
                rgba(255,255,255,0.06);
        }

        .menu-search:focus {
            border-color:
                rgba(77,163,255,0.5);
        }

        #app-menu-grid {
            flex: 1;

            overflow-y: auto;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            padding: 0 15px 15px;
        }

        .menu-app {
            min-height: 88px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 7px;

            border-radius: 13px;

            color: white;

            background:
                rgba(255,255,255,0.045);

            transition:
                0.2s ease;
        }

        .menu-app:hover {
            background:
                rgba(77,163,255,0.15);

            transform:
                translateY(-2px);
        }

        .menu-app-icon {
            font-size: 24px;
        }

        .menu-app-name {
            max-width: 100%;

            padding: 0 4px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 11px;

            color:
                var(--haldo-text-soft);
        }

        /* =====================================================
           HALDO AI
           ===================================================== */

        .ai-app {
            height: 100%;

            display: flex;
            flex-direction: column;
        }

        .ai-header {
            padding: 20px;

            border-bottom:
                1px solid var(--haldo-border);
        }

        .ai-title {
            font-size: 22px;
            font-weight: 700;
        }

        .ai-subtitle {
            margin-top: 5px;

            color: var(--haldo-text-soft);

            font-size: 12px;
        }

        .ai-messages {
            flex: 1;

            overflow-y: auto;

            padding: 20px;
        }

        .ai-message {
            max-width: 80%;

            margin-bottom: 15px;

            padding: 13px 15px;

            border-radius: 15px;

            line-height: 1.5;

            font-size: 14px;
        }

        .ai-message.user {
            margin-left: auto;

            background:
                rgba(77,163,255,0.16);

            border:
                1px solid rgba(77,163,255,0.18);
        }

        .ai-message.assistant {
            margin-right: auto;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid var(--haldo-border);
        }

        .ai-input-area {
            padding: 12px;

            border-top:
                1px solid var(--haldo-border);

            background:
                rgba(0,0,0,0.10);
        }

        .ai-input-row {
            display: flex;

            align-items: flex-end;

            gap: 8px;
        }

        .ai-textarea {
            flex: 1;

            min-height: 45px;
            max-height: 130px;

            resize: none;

            padding: 12px;

            border:
                1px solid var(--haldo-border);

            border-radius: 12px;

            outline: none;

            color: white;

            background:
                rgba(255,255,255,0.055);
        }

        .ai-textarea:focus {
            border-color:
                rgba(77,163,255,0.5);
        }

        .ai-action {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border-radius: 12px;

            color: white;

            background:
                rgba(255,255,255,0.07);
        }

        .ai-action:hover {
            background:
                rgba(77,163,255,0.20);
        }

        .ai-action.primary {
            background:
                rgba(77,163,255,0.22);
        }

        /* =====================================================
           GENERIC APP
           ===================================================== */

        .generic-app {
            height: 100%;

            padding: 24px;

            overflow: auto;
        }

        .generic-title {
            font-size: 22px;
            font-weight: 700;
        }

        .generic-subtitle {
            margin-top: 6px;

            color: var(--haldo-text-soft);

            font-size: 13px;
        }

        .app-card-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 12px;

            margin-top: 22px;
        }

        .app-card {
            padding: 18px;

            border:
                1px solid var(--haldo-border);

            border-radius: 14px;

            background:
                rgba(255,255,255,0.04);
        }

        .app-card-icon {
            font-size: 28px;
        }

        .app-card-title {
            margin-top: 12px;

            font-weight: 650;
        }

        .app-card-text {
            margin-top: 5px;

            color: var(--haldo-text-soft);

            font-size: 12px;

            line-height: 1.5;
        }

        /* =====================================================
           EZIDI KEYBOARD
           ===================================================== */

        .ezidi-keyboard {
            padding: 20px;
        }

        .ezidi-output {
            width: 100%;

            min-height: 130px;

            resize: vertical;

            padding: 15px;

            border:
                1px solid var(--haldo-border);

            border-radius: 14px;

            outline: none;

            color: white;

            background:
                rgba(255,255,255,0.045);

            direction: rtl;

            font-size: 20px;
        }

        .ezidi-key-grid {
            display: grid;

            grid-template-columns:
                repeat(8, 1fr);

            gap: 5px;

            margin-top: 12px;
        }

        .ezidi-key {
            min-height: 42px;

            border-radius: 8px;

            color: white;

            background:
                rgba(255,255,255,0.07);

            font-size: 18px;
        }

        .ezidi-key:hover {
            background:
                rgba(77,163,255,0.20);
        }

        /* =====================================================
           SETTINGS
           ===================================================== */

        .settings-list {
            margin-top: 22px;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .setting-row {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 15px;

            border:
                1px solid var(--haldo-border);

            border-radius: 12px;

            background:
                rgba(255,255,255,0.04);
        }

        .setting-name {
            font-weight: 600;
        }

        .setting-description {
            margin-top: 3px;

            color: var(--haldo-text-soft);

            font-size: 11px;
        }

        .setting-select {
            padding: 8px 10px;

            border:
                1px solid var(--haldo-border);

            border-radius: 8px;

            color: white;

            background:
                #111a2e;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 700px) {

            .topbar-left {
                min-width: auto;
            }

            .topbar-center {
                display: none;
            }

            .topbar-right {
                min-width: auto;
            }

            .topbar-title {
                display: none;
            }

            .haldo-window {
                left: 10px !important;
                top: 70px !important;

                width:
                    calc(100vw - 20px) !important;

                height:
                    calc(100vh - 140px) !important;
            }

            #haldo-dock {
                max-width:
                    calc(100vw - 20px);

                overflow-x: auto;
            }

            .dock-app {
                width: 45px;
                height: 45px;

                flex-shrink: 0;
            }

            #haldo-app-menu {
                width:
                    calc(100vw - 20px);
            }

            .ezidi-key-grid {
                grid-template-columns:
                    repeat(5, 1fr);
            }
        }

    </style>
</head>

<body>

<!-- =========================================================
     BOOT SCREEN
     ========================================================= -->

<div id="haldo-boot">

    <div class="boot-content">

        <img
            class="boot-logo"
            src="assets/logo/logo.png"
            alt="HalDo AI"
            onerror="
                this.style.display='none';
            "
        >

        <div class="boot-title">
            HalDo AI OS
        </div>

        <div
            class="boot-status"
            id="boot-status"
        >
            Initialisiere HalDo AI OS 20…
        </div>

        <div class="boot-progress">
            <div
                class="boot-progress-bar"
                id="boot-progress"
            ></div>
        </div>

    </div>

</div>


<!-- =========================================================
     HALDO OS
     ========================================================= -->

<div id="haldo-os">

    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header id="haldo-topbar">

        <div class="topbar-left">

            <button
                class="haldo-menu-button"
                id="menu-button"
                title="HalDo Menü"
                aria-label="HalDo Menü"
            >
                ☰
            </button>

            <img
                class="haldo-mini-logo"
                src="assets/logo/logo.png"
                alt="HalDo"
                onerror="
                    this.style.display='none';
                "
            >

            <div class="topbar-title">
                HalDo AI
                <span class="topbar-version">
                    OS 20
                </span>
            </div>

        </div>


        <div class="topbar-center">

            <div class="topbar-status">

                <span class="status-dot"></span>

                <span id="system-status-text">
                    System bereit
                </span>

            </div>

        </div>


        <div class="topbar-right">

            <button
                class="topbar-icon"
                id="quick-ai"
                title="HalDo AI"
            >
                ✦
            </button>

            <button
                class="topbar-icon"
                id="quick-keyboard"
                title="Êzîdî Tastatur"
            >
                ⌨
            </button>

            <button
                class="topbar-icon"
                id="quick-settings"
                title="Einstellungen"

        listeners: {},

        on(name, callback) {

            if (!this.listeners[name]) {
                this.listeners[name] = [];
            }

            this.listeners[name].push(callback);

            return () => {

                this.listeners[name] =
                    this.listeners[name].filter(
                        fn => fn !== callback
                    );

        emit(name, detail) {

            const list =
                this.listeners[name] || [];

            list.forEach(
                callback => {

                    try {
                        callback(detail);
                    }
                    catch (error) {

                        console.error(
                            "[HalDo Event]",

function getWindowPosition() {

    const openCount =
        Object.keys(
            window.HalDoOS.windows
        ).length;

    const offset =
        Math.min(
            openCount * 28,
            160
        );

    return {

        left:
            Math.max(
                20,
                (
                    window.innerWidth -
                    720
                ) / 2 +
                offset
            ),

        top:
            Math.max(
                75,
                (
                    window.innerHeight -
                    520
                ) / 2 +
                offset
            )

    };

}


function createWindow(
    app
) {

    const id =
        "window-" +
        window.HalDoOS.state.nextWindowId++;

    const position =
        getWindowPosition();

    const win =
        document.createElement(
            "section"
        );

    win.className =
        "haldo-window";

    win.dataset.windowId =
        id;

    win.dataset.appId =
        app.id;

    win.style.left =
        position.left + "px";

    win.style.top =
        position.top + "px";

    win.style.width =
        (app.width || 680) +
        "px";

    win.style.height =
        (app.height || 480) +
        "px";

    win.style.zIndex =
        ++window.HalDoOS.state.zIndex;

    win.innerHTML = `

    );

        );

    );

    setupWindowControls(

    );

    setupWindowDragging(

    );

    win.addEventListener(

        () => focusWindow(win)
    );

    focusWindow(win);

    window.HalDoOS.windows[id] =
        {
            id,
            appId: app.id,

        };

    return win;

}


function focusWindow(
    win
) {

    win.style.zIndex =
        ++window.HalDoOS.state.zIndex;

    window.HalDoOS.state.activeWindow =
        win;

    document
        .querySelectorAll(
            ".dock-app"

            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.app ===

            }
        );

}


function closeWindow(
    win
) {

    const id =
        win.dataset.windowId;

    delete window.HalDoOS.windows[
        id
    ];

    win.remove();

    window.HalDoOS.events.emit(
        "window:closed",
        {
            id
        }
    );

}


function setupWindowControls(
    win
) {

    const minimize =
        win.querySelector(
            ".minimize"
        );

    const maximize =
        win.querySelector(
            ".maximize"
        );

    const close =
        win.querySelector(
            ".close"
        );


    minimize.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            win.classList.add(
                "minimized"
            );

        }
    );


    maximize.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            win.classList.toggle(
                "maximized"
            );

        }
    );


    close.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            closeWindow(
                win
            );

        }
    );

}


function setupWindowDragging(
    win
) {

    const header =
        win.querySelector(
            ".haldo-window-header"
        );

    let dragging =
        false;

    let startX = 0;
    let startY = 0;

    let startLeft = 0;
    let startTop = 0;


    header.addEventListener(
        "pointerdown",
        event => {

            if (
                event.target.closest(
                    ".window-controls"
                )
            ) {
                return;
            }

            if (
                win.classList.contains(
                    "maximized"
                )
            ) {
                return;
            }

            dragging = true;

            header.setPointerCapture(
                event.pointerId
            );

            startX =
                event.clientX;

            startY =
                event.clientY;

            startLeft =
                win.offsetLeft;

            startTop =
                win.offsetTop;

        }
    );


    header.addEventListener(
        "pointermove",
        event => {

            if (!dragging) {
                return;
            }

            let left =
                startLeft +
                (
                    event.clientX -
                    startX
                );

            let top =
                startTop +
                (
                    event.clientY -
                    startY
                );


            left =
                Math.max(
                    5,
                    Math.min(
                        left,
                        window.innerWidth -
                        win.offsetWidth -
                        5
                    )
                );


            top =
                Math.max(
                    58,
                    Math.min(
                        top,
                        window.innerHeight -
                        win.offsetHeight -
                        5
                    )
                );


            win.style.left =
                left + "px";

            win.style.top =
                top + "px";

        }
    );


    header.addEventListener(
        "pointerup",
        () => {

            dragging = false;

        }
    );

}

        return;

        Object.values(
            window.HalDoOS.windows

        .find(

                entry.appId === appId

    if (existing) {

        existing.element.classList.remove(

            existing.element

        );

    const input =
        container.querySelector(
            "[data-ai-input]"
        );

    const send =
        container.querySelector(
            '[data-ai-action="send"]'
        );

    const clear =
        container.querySelector(
            '[data-ai-action="clear"]'
        );

    const voice =
        container.querySelector(
            '[data-ai-action="voice"]'
        );


    function addMessage(
        role,
        text
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "ai-message " +
            role;

        message.textContent =
            text;

        messages.appendChild(
            message
        );

        messages.scrollTop =
            messages.scrollHeight;

    }


    function sendMessage() {

        const text =
            input.value.trim();

        if (!text) {
            return;
        }


        addMessage(
            "user",
            text
        );

        input.value = "";


        /*
         * -------------------------------------------------------
         * ZENTRALER AI-BRIDGE-PUNKT
         * -------------------------------------------------------
         *
         * Wenn HalDo AI Engine / Backend vorhanden ist,
         * wird hier die echte KI angesprochen.
         */

        if (
            window.HalDoAI &&
            typeof
            window.HalDoAI.ask ===
            "function"
        ) {

            Promise.resolve(
                window.HalDoAI.ask(
                    text
                )
            )
            .then(
                answer => {

                    addMessage(
                        "assistant",
                        String(
                            answer ||
                            "HalDo AI hat keine Antwort erhalten."
                        )
                    );

                }
            )
            .catch(
                error => {

                    console.error(
                        error
                    );

                    addMessage(
                        "assistant",
                        "Die HalDo-AI-Engine konnte gerade nicht antworten."
                    );

                }
            );

            return;

        }


        /*
         * Lokale Foundation-Antwort.
         * Sie ist KEIN Ersatz für eine echte LLM-Engine.
         */

        addMessage(
            "assistant",
            "Ich bin bereit. Die HalDo-AI-Oberfläche ist aktiv. Für echte intelligente Antworten wird die vorhandene HalDo-AI-Engine über die zentrale AI-Bridge angeschlossen."
        );

    }


    send.addEventListener(
        "click",
        sendMessage
    );


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    clear.addEventListener(
        "click",
        () => {

            input.value = "";

            input.focus();

        }
    );


    voice.addEventListener(
        "click",
        () => {

            if (
                window.HalDoAISpeech &&
                typeof
                window.HalDoAISpeech.start ===
                "function"
            ) {

                window.HalDoAISpeech.start(
                    text => {

                        input.value =
                            text;

                    }
                );

                return;

            }


            if (
                "webkitSpeechRecognition"
                in window
            ) {

                const Recognition =
                    window
                        .webkitSpeechRecognition;

                const recognition =
                    new Recognition();

                recognition.lang =
                    "de-DE";

                recognition.interimResults =
                    false;

                recognition.onresult =
                    event => {

                        input.value =
                            event
                                .results[0][0]
                                .transcript;

                    };

                recognition.start();

            }

        }
    );

}

function initializeEzidiKeyboard(

        "Ç",
        "D",
        "E",
        "Ê",
        "G",

        "I",
        "Î",
        "J",
        "K",
        "L",
        "M",

        "ئ",
        "ێ",
        "ە",
        "ۆ",
        "ڕ",
        "ڵ",
        "ڤ",
        "ژ"

    ];


    keys.forEach(
        character => {

            const key =
                document.createElement(
                    "button"
                );

            key.className =
                "ezidi-key";

            key.textContent =
                character;

            key.type =
                "button";

            key.addEventListener(
                "click",
                () => {

                    output.value +=
                        character;

                    output.focus();

                }
            );

            grid.appendChild(
                key
            );

        }
    );


    const space =
        document.createElement(
            "button"
        );

    space.className =
        "ezidi-key";

    space.textContent =
        "␠";

    space.type =
        "button";

    space.addEventListener(
        "click",
        () => {

            output.value += " ";

            output.focus();

        }
    );

    grid.appendChild(
        space
    );


    const backspace =
        document.createElement(
            "button"
        );

    backspace.className =
        "ezidi-key";

    backspace.textContent =
        "⌫";

    backspace.type =
        "button";

    backspace.addEventListener(
        "click",
        () => {

            output.value =
                output.value.slice(
                    0,
                    -1
                );

            output.focus();

        }
    );

    grid.appendChild(
        backspace
    );

}

function setSystemStatus(

        document.getElementById(
            "system-status-text"
        );

    if (element) {
        element.textContent =
            text;
    }

/* =============================================================
   BOOT
   ============================================================= */

async function bootHalDoOS() {

    const boot =
        document.getElementById(
            "haldo-boot"
        );

    const status =
        document.getElementById(
            "boot-status"
        );

    const progress =
        document.getElementById(
            "boot-progress"
        );


    const stages = [

        [
            10,
            "HalDo Kernel wird initialisiert…"
        ],

        [
            25,
            "System Manager wird gestartet…"
        ],

        [
            40,
            "Event Bus wird verbunden…"
        ],

        [
            55,
            "Service Bridge wird vorbereitet…"
        ],

        [
            70,
            "App Registry wird geladen…"
        ],

        [
            82,
            "App Runtime wird vorbereitet…"
        ],

        [
            92,
            "Window Manager wird aktiviert…"
        ],

        [
            100,
            "HalDo AI OS ist bereit."
        ]

    ];


    for (
        const [
            percentage,
            text
        ]
        of stages
    ) {

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    120
                )
        );

        progress.style.width =
            percentage + "%";

        status.textContent =
            text;

    }


    window.HalDoOS.state.booted =
        true;

    setSystemStatus(
        "System bereit"
    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                350
            )
    );


    boot.classList.add(
        "hidden"
    );


    window.HalDoOS.events.emit(
        "system:ready"
    );

}


document.addEventListener(
    "DOMContentLoaded",
    bootHalDoOS
);


/* =============================================================
   EXTERNAL SYSTEM CONNECTION
   ============================================================= */

/*
 * Die vorhandenen HalDo-Systemdateien können sich an diese
 * zentrale Foundation anschließen.
 */

window.HalDoOS.openApp =
    openApp;

window.HalDoOS.closeWindow =
    closeWindow;

window.HalDoOS.focusWindow =
    focusWindow;

window.HalDoOS.registerApp =
    function registerApp(
        app
    ) {

        if (
            !app ||
            !app.id
        ) {
            return false;
        }

        window.HalDoOS.apps[
            app.id
        ] = app;

        if (
            !HALDO_APPS.some(
                item =>
                    item.id === app.id
            )
        ) {

            HALDO_APPS.push(
                app
            );

        }

        renderAppMenu();

        return true;

    };


window.HalDoOS.getApps =
    function getApps() {

        return [
            ...HALDO_APPS
        ];

    };


/* =============================================================
   ESC = CLOSE MENU / ACTIVE WINDOW
   ============================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key !== "Escape"
        ) {
            return;
        }


        if (
            window.HalDoOS.state.menuOpen
        ) {

            closeMenu();

            return;

        }


        const active =
            window.HalDoOS.state
                .activeWindow;

        if (active) {

            closeWindow(
                active
            );

        }

    }
);


/* =============================================================
   OUTSIDE CLICK
   ============================================================= */

document.addEventListener(
    "mousedown",
    event => {

        if (
            !window.HalDoOS.state.menuOpen
        ) {
            return;
        }


        if (
            event.target.closest(
                "#haldo-app-menu"
            ) ||
            event.target.closest(
                "#menu-button"
            )
        ) {
            return;
        }


        closeMenu();

    }
);


/* =============================================================
   GLOBAL ERROR BRIDGE
   ============================================================= */

window.addEventListener(
    "error",
    event => {

        console.error(
            "[HalDo OS Error]",
            event.error ||
            event.message
        );

        window.HalDoOS.events.emit(
            "system:error",
            {
                error:
                    event.error ||
                    event.message
            }
        );

    }
);


/* =============================================================
   FINAL FOUNDATION SIGNAL
   ============================================================= */

window.HalDoOS.events.emit(
    "shell:loaded"
);

</script>
