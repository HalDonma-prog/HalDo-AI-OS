    <style>

        /* =====================================================
           01 — RESET
           ===================================================== */

        *,
        *::before,
        *::after {

            box-sizing: border-box;

            -webkit-tap-highlight-color:
                transparent;

        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background:
                #010209;

            color:
                #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            overscroll-behavior:
                none;

        }


        body {

            min-height:
                100dvh;

            position:
                relative;

            isolation:
                isolate;

        }


        button,
        input,
        textarea {

            font:
                inherit;

        }


        button {

            border:
                0;

            outline:
                none;

            cursor:
                pointer;

        }


        /* =====================================================
           02 — ROOT
           ===================================================== */

        #haldo-os {

            position:
                fixed;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            background:
                #010209;

        }


        /* =====================================================
           03 — COSMIC BACKGROUND
           ===================================================== */

        #cosmic-space {

            position:
                absolute;

            inset:
                0;

            overflow:
                hidden;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(40, 80, 160, 0.13),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 50% 50%,
                    rgba(15, 35, 80, 0.12),
                    transparent 60%
                ),

                linear-gradient(
                    180deg,
                    #00020a 0%,
                    #01030d 50%,
                    #000107 100%
                );

            z-index:
                0;

        }


        /* =====================================================
           04 — STAR FIELD
           ===================================================== */

        #star-field {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            pointer-events:
                none;

        }


        .star {

            position:
                absolute;

            display:
                block;

            width:
                var(--size);

            height:
                var(--size);

            left:
                var(--x);

            top:
                var(--y);

            border-radius:
                50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    var(--opacity)
                );

            box-shadow:
                0 0 calc(
                    var(--glow) * 1px
                )
                rgba(
                    255,
                    255,
                    255,
                    var(--opacity)
                );

            animation:
                starPulse
                var(--duration)
                ease-in-out
                var(--delay)
                infinite alternate;

        }


        @keyframes starPulse {

            from {

                opacity:
                    0.25;

                transform:
                    scale(0.75);

            }

            to {

                opacity:
                    1;

                transform:
                    scale(1.35);

            }

        }


        /* =====================================================
           05 — COSMIC SYSTEM
           ===================================================== */

        #solar-system {

            position:
                absolute;

            width:
                min(95vw, 950px);

            height:
                min(95vw, 950px);

            left:
                50%;

            top:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            pointer-events:
                none;

        }


        .orbit {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                var(--orbit);

            height:
                var(--orbit);

            transform:
                translate(
                    -50%,
                    -50%
                );

            border:
                1px solid
                rgba(
                    120,
                    170,
                    255,
                    0.055
                );

            border-radius:
                50%;

            animation:
                orbitRotation
                var(--speed)
                linear
                infinite;

        }


        @keyframes orbitRotation {

            from {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    rotate(0deg);

            }

            to {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    rotate(360deg);

            }

        }


        .planet-holder {

            position:
                absolute;

            left:
                50%;

            top:
                0;

            width:
                100%;

            height:
                100%;

            transform:
                translateX(-50%);

        }


        .planet {

            position:
                absolute;

            left:
                50%;

            top:
                0;

            width:
                var(--planet-size);

            height:
                var(--planet-size);

            margin-left:
                calc(
                    var(--planet-size)
                    / -2
                );

            margin-top:
                calc(
                    var(--planet-size)
                    / -2
                );

            border-radius:
                50%;

            background:
                var(--planet-background);

            box-shadow:
                0 0
                calc(
                    var(--planet-glow)
                )
                var(--planet-glow-color);

            animation:
                planetSpin
                var(--planet-speed)
                linear
                infinite;

        }


        @keyframes planetSpin {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =====================================================
           06 — SUN
           ===================================================== */

        #sun {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                clamp(
                    110px,
                    18vw,
                    190px
                );

            height:
                clamp(
                    110px,
                    18vw,
                    190px
                );

            transform:
                translate(
                    -50%,
                    -50%
                );

            border-radius:
                50%;

            background:

                radial-gradient(
                    circle at 35% 30%,
                    #fffce0 0%,
                    #fff2a8 12%,
                    #ffd447 35%,
                    #ff9d00 62%,
                    #ff5a00 82%,
                    rgba(
                        255,
                        70,
                        0,
                        0.15
                    ) 100%
                );

            box-shadow:

                0 0 25px
                rgba(
                    255,
                    232,
                    120,
                    0.9
                ),

                0 0 60px
                rgba(
                    255,
                    160,
                    30,
                    0.7
                ),

                0 0 120px
                rgba(
                    255,
                    90,
                    0,
                    0.4
                );

            z-index:
                10;

            animation:
                sunPulse
                5s
                ease-in-out
                infinite alternate;

        }


        @keyframes sunPulse {

            from {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(0.97);

            }

            to {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1.04);

            }

        }


        /* =====================================================
           07 — HALDO MAIN DISPLAY
           ===================================================== */

        #display {

            position:
                absolute;

            inset:
                0;

            z-index:
                20;

            pointer-events:

        #display-content {

<script>

"use strict";


/* =========================================================
   HALDO AI OS 20
   SHELL RUNTIME
   ========================================================= */

(function () {


    /* =====================================================
       01 — SHORTCUTS
       ===================================================== */

    const $ =
        selector =>
            document.querySelector(selector);


    const $$ =
        selector =>
            Array.from(
                document.querySelectorAll(selector)
            );


    /* =====================================================
       02 — ELEMENTS
       ===================================================== */

    const menuButton =
        $("#menu-button");

    const menu =
        $("#side-menu");

    const menuClose =
        $("#menu-close");

    const menuAppList =
        $("#dynamic-app-list");

    const appView =
        $("#app-view");

    const appBody =
        $("#app-body");

    const appTitle =
        $("#app-title");

    const appBack =
        $("#app-back");

    const aiView =
        $("#ai-view");

    const aiClose =
        $("#ai-close");

    const aiInput =
        $("#ai-input");

    const aiSend =
        $("#ai-send");

    const aiMessages =
        $("#ai-messages");

    const systemTime =
        $("#system-time");

    const bootScreen =
        $("#boot-screen");


    /* =====================================================
       03 — MENU
       ===================================================== */

    function openMenu() {

        menu.classList.add(
            "open"
        );

        menu.setAttribute(
            "aria-hidden",
            "false"
        );

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

    }


    function closeMenu() {

        menu.classList.remove(
            "open"
        );

        menu.setAttribute(
            "aria-hidden",
            "true"
        );

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

    }


    menuButton.addEventListener(
        "click",
        function () {

            if (
                menu.classList.contains(
                    "open"
                )
            ) {

                closeMenu();

            } else {

                openMenu();

            }

        }
    );


    menuClose.addEventListener(
        "click",
        closeMenu
    );


    /* =====================================================
       04 — CLOCK
       ===================================================== */

    function updateClock() {

        const now =
            new Date();

        systemTime.textContent =
            now.toLocaleTimeString(
                undefined,
                {
                    hour:
                        "2-digit",

                    minute:
                        "2-digit"
                }
            );

    }


    updateClock();

    setInterval(
        updateClock,
        1000
    );


    /* =====================================================
       05 — STAR GENERATOR
       ===================================================== */

    function createStars() {

        const field =
            $("#star-field");

        if (!field) {
            return;
        }

        field.innerHTML = "";

        const count =
            Math.min(
                180,
                Math.max(
                    90,
                    Math.floor(
                        (
                            window.innerWidth *
                            window.innerHeight
                        ) /
                        7000
                    )
                )
            );


        for (
            let index = 0;
            index < count;
            index++
        ) {

            const star =
                document.createElement(
                    "span"
                );

            star.className =
                "star";


            const size =
                (
                    Math.random() *
                    3.5
                ) + 0.7;


            const opacity =
                (
                    Math.random() *
                    0.75
                ) + 0.2;


            const glow =
                (
                    Math.random() *
                    8
                ) + 2;


            const duration =
                (
                    Math.random() *
                    5
                ) + 2;


            const delay =
                Math.random() *
                -8;


            star.style.setProperty(
                "--size",
                size + "px"
            );


            star.style.setProperty(
                "--x",
                (
                    Math.random() *
                    100
                ) + "%"
            );


            star.style.setProperty(
                "--y",
                (
                    Math.random() *
                    100
                ) + "%"
            );


            star.style.setProperty(
                "--opacity",
                opacity
            );


            star.style.setProperty(
                "--glow",
                glow
            );


            star.style.setProperty(
                "--duration",
                duration + "s"
            );


            star.style.setProperty(
                "--delay",
                delay + "s"
            );


            field.appendChild(
                star
            );

        }

    }


    createStars();


    window.addEventListener(
        "resize",
        function () {

            clearTimeout(
                window.__haldoStarTimer
            );

            window.__haldoStarTimer =
                setTimeout(
                    createStars,
                    250
                );

        }
    );


    /* =====================================================
       06 — APP MANAGER
       ===================================================== */

    function getAppManager() {

        return (
            window.HalDoAppManager ||
            window.HalDoOSAppManager ||
            (
                window.HalDoOS &&
                window.HalDoOS.appManager
            ) ||
            null
        );

    }


    function getApps() {

        const manager =
            getAppManager();

        if (!manager) {
            return [];
        }


        try {

            if (
                typeof manager.getApps ===
                "function"
            ) {

                const apps =
                    manager.getApps();

                if (
                    Array.isArray(apps)
                ) {
                    return apps;
                }

            }


            if (
                typeof manager.getAll ===
                "function"
            ) {

                const apps =
                    manager.getAll();

                if (
                    Array.isArray(apps)
                ) {
                    return apps;
                }

            }

        } catch (error) {

            console.error(
                "[HalDo Shell]",
                error
            );

        }


        return [];

    }


    /* =====================================================
       07 — APP MENU
       ===================================================== */

    function renderApps() {

        if (!menuAppList) {
            return;
        }


        const apps =
            getApps();


        menuAppList.innerHTML = "";


        if (!apps.length) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "menu-item";


            item.innerHTML = `

                <span class="menu-icon">
                    …
                </span>

                <span class="menu-text">

                    <span class="menu-name">
                        Apps werden geladen
                    </span>

                    <span class="menu-description">
                        App Registry wartet auf Verbindung
                    </span>

                </span>

            `;


            menuAppList.appendChild(
                item
            );

            return;

        }


        const sorted =
            apps
                .filter(
                    app =>
                        app &&
                        app.id
                )
                .sort(
                    (a, b) =>
                        String(
                            a.name ||
                            a.title ||
                            a.id
                        ).localeCompare(
                            String(
                                b.name ||
                                b.title ||
                                b.id
                            ),
                            undefined,
                            {
                                sensitivity:
                                    "base"
                            }
                        )
                );


        sorted.forEach(
            app => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "menu-item";


                button.dataset.appId =
                    app.id;


                const icon =
                    app.icon ||
                    "◈";


                const name =
                    app.title ||
                    app.name ||
                    app.id;


                const description =
                    app.description ||
                    app.category ||
                    "HalDo Anwendung";


                button.innerHTML = `

                    <span class="menu-icon">
                        ${escapeHTML(icon)}
                    </span>

                    <span class="menu-text">

                        <span class="menu-name">
                            ${escapeHTML(name)}
                        </span>

                        <span class="menu-description">
                            ${escapeHTML(description)}
                        </span>

                    </span>

                `;


                button.addEventListener(
                    "click",
                    function () {

                        openRegisteredApp(
                            app.id
                        );

                    }
                );


                menuAppList.appendChild(
                    button
                );

            }
        );

    }


    /* =====================================================
       08 — SAFE TEXT
       ===================================================== */

    function escapeHTML(value) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =====================================================
       09 — OPEN REGISTERED APP
       ===================================================== */

    async function openRegisteredApp(
        appId
    ) {

        const manager =
            getAppManager();


        if (!manager) {

            showAppMessage(
                "App Manager",
                "Der HalDo App Manager ist noch nicht bereit."
            );

            return;

        }


        closeMenu();


        try {

            const result =
                await manager.openApp(
                    appId
                );


            const app =
                (
                    result &&
                    result.app
                ) ||
                (
                    typeof manager.get ===
                    "function"
                        ? manager.get(
                            appId
                        )
                        : null
                );


            if (app) {

                showAppShell(
                    app,
                    result
                );

            } else {

                showAppMessage(
                    "App",
                    "Die App konnte nicht geöffnet werden."
                );

            }

        } catch (error) {

            console.error(
                "[HalDo Shell] App Open",
                error
            );


            showAppMessage(
                "App-Fehler",
                error.message ||
                "Die App konnte nicht geöffnet werden."
            );

        }

    }


    /* =====================================================
       10 — APP SHELL
       ===================================================== */

    function showAppShell(
        app,
        result
    ) {

        appView.classList.add(
            "open"
        );


        appView.setAttribute(
            "aria-hidden",
            "false"
        );


        appTitle.textContent =
            app.title ||
            app.name ||
            app.id;


        /*
         * Wenn die App selbst einen UI-Container
         * bereitstellt, verwenden wir diesen.
         *
         * Dadurch bleibt die index.html
         * eine Shell und übernimmt nicht
         * die komplette App-Logik.
         */

        if (
            result &&
            result.element
        ) {

            appBody.innerHTML = "";

            appBody.appendChild(
                result.element
            );

            return;

        }


        if (
            typeof app.render ===
            "function"
        ) {

            try {

                appBody.innerHTML = "";

                const rendered =
                    app.render({
                        container:
                            appBody,
                        app,
                        manager:
                            getAppManager()
                    });


                if (
                    rendered instanceof
                    Node
                ) {

                    appBody.appendChild(
                        rendered
                    );

                }

                return;

            } catch (error) {

                console.error(
                    "[HalDo Shell] App Render",
                    error
                );

            }

        }


        showAppMessage(
            app.title ||
            app.name ||
            app.id,
            "Diese App ist registriert, aber ihre eigene Benutzeroberfläche ist noch nicht mit der Shell verbunden."
        );

    }


    /* =====================================================
       11 — APP MESSAGE
       ===================================================== */

    function showAppMessage(
        title,
        message
    ) {

        appView.classList.add(
            "open"
        );


        appView.setAttribute(
            "aria-hidden",
            "false"
        );


        appTitle.textContent =
            title;


        appBody.innerHTML = `

            <div class="app-empty">

                <img
                    class="app-empty-logo"
                    src="assets/logo/logo.png"
                    alt="HalDo"
                >

                <strong>
                    ${escapeHTML(title)}
                </strong>

                <span>
                    ${escapeHTML(message)}
                </span>

            </div>

        `;

    }


    /* =====================================================
       12 — CLOSE APP
       ===================================================== */

    async function closeCurrentApp() {

        const manager =
            getAppManager();


        if (
            manager &&
            typeof manager.getActiveAppId ===
            "function"
        ) {

            const activeId =
                manager.getActiveAppId();


            if (
                activeId &&
                typeof manager.closeApp ===
                "function"
            ) {

                try {

                    await manager.closeApp(
                        activeId
                    );

                } catch (_) {}

            }

        }


        appView.classList.remove(
            "open"
        );


        appView.setAttribute(
            "aria-hidden",
            "true"
        );


        appBody.innerHTML = `

            <div class="app-empty">

                <img
                    class="app-empty-logo"
                    src="assets/logo/logo.png"
                    alt="HalDo"
                >

                <strong>
                    HalDo AI OS
                </strong>

                <span>
                    Wähle eine Anwendung aus dem Menü.
                </span>

            </div>

        `;

    }


    appBack.addEventListener(
        "click",
        closeCurrentApp
    );


    /* =====================================================
       13 — SYSTEM ACTIONS
       ===================================================== */

    $$(".menu-item[data-system-action]")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function () {

                        const action =
                            button.dataset
                                .systemAction;


                        closeMenu();


                        handleSystemAction(
                            action
                        );

                    }
                );

            }
        );


    function handleSystemAction(
        action
    ) {

        switch (action) {

            case "home":

                closeCurrentApp();

                closeAI();

                break;


            case "ai":

                openAI();

                break;


            case "settings":

                openKnownApp(
                    [
                        "settings",
                        "einstellungen",
                        "system-settings"
                    ]
                );

                break;


            case "diagnostics":

                showDiagnostics();

                break;


            case "language":

                openKnownApp(
                    [
                        "language",
                        "languages",
                        "language-manager"
                    ]
                );

                break;


            case "voice":

                openKnownApp(
                    [
                        "voice",
                        "speech",
                        "audio"
                    ]
                );

                break;


            case "keyboard":

                openKnownApp(
                    [
                        "keyboard",
                        "ezidi-keyboard"
                    ]
                );

                break;

        }

    }


    /* =====================================================
       14 — KNOWN APP
       ===================================================== */

    async function openKnownApp(
        ids
    ) {

        const manager =
            getAppManager();


        if (!manager) {

            showAppMessage(
                "HalDo AI OS",
                "App Manager ist noch nicht verfügbar."
            );

            return;

        }


        for (
            const id of ids
        ) {

            try {

                if (
                    typeof manager.has ===
                    "function" &&
                    manager.has(id)
                ) {

                    await openRegisteredApp(
                        id
                    );

                    return;

                }

            } catch (_) {}

        }


        showAppMessage(
            "HalDo AI OS",
            "Die gewünschte Anwendung ist in der aktuellen Registry noch nicht registriert."
        );

    }


    /* =====================================================
       15 — DIAGNOSTICS
       ===================================================== */

    function showDiagnostics() {

        const manager =
            getAppManager();


        let data = null;


        try {

            if (
                manager &&
                typeof manager.diagnostics ===
                "function"
            ) {

                data =
                    manager.diagnostics();

            }

        } catch (error) {

            data = {
                error:
                    error.message
            };

        }


        const formatted =
            JSON.stringify(
                data || {},
                null,
                2
            );


        showAppMessage(
            "HalDo Diagnose",
            formatted
        );

    }


    /* =====================================================
       16 — HALDO AI
       ===================================================== */

    function openAI() {

        aiView.classList.add(
            "open"
        );


        aiView.setAttribute(
            "aria-hidden",
            "false"
        );


        setTimeout(
            () =>
                aiInput.focus(),
            50
        );

    }


    function closeAI() {

        aiView.classList.remove(
            "open"
        );


        aiView.setAttribute(
            "aria-hidden",
            "true"
        );

    }


    aiClose.addEventListener(
        "click",
        closeAI
    );


    /* =====================================================
       17 — AI MESSAGE
       ===================================================== */

    function appendAIMessage(
        role,
        text
    ) {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            "ai-message " +
            role;


        message.textContent =
            text;


        aiMessages.appendChild(
            message
        );


        aiMessages.scrollTop =
            aiMessages.scrollHeight;

    }


    /* =====================================================
       18 — AI CONNECTION
       ===================================================== */

    function getAI() {

        return (
            window.HalDoAI ||
            (
                window.HalDoOS &&
                window.HalDoOS.ai
            ) ||
            window.HalDoAICore ||
            (
                window.HalDoOS &&
                window.HalDoOS.aiCore
            ) ||
            null
        );

    }


    /* =====================================================
       19 — AI PROCESS
       ===================================================== */

    async function processAI(
        text
    ) {

        const ai =
            getAI();


        if (!ai) {

            return null;

        }


        const methods = [

            "chat",

            "ask",

            "respond",

            "process",

            "send",

            "generate"

        ];


        for (
            const method of methods
        ) {

            if (
                typeof ai[method] ===
                "function"
            ) {

                try {

                    const result =
                        await ai[method](
                            text
                        );


                    if (
                        typeof result ===
                        "string"
                    ) {

                        return result;

                    }


                    if (
                        result &&
                        typeof result.text ===
                        "string"
                    ) {

                        return result.text;

                    }


                    if (
                        result &&
                        typeof result.response ===
                        "string"
                    ) {

                        return result.response;

                    }

                } catch (error) {

                    console.error(
                        "[HalDo AI]",
                        error
                    );

                }

            }

        }


        return null;

    }


    /* =====================================================
       20 — AI COMMAND BRIDGE
       ===================================================== */

    async function processAICommand(
        text
    ) {

        const normalized =
            text
                .trim()
                .toLowerCase();


        /*
         * Einfache Systembefehle werden zuerst
         * an den App Manager weitergegeben.
         */

        if (
            normalized.includes(
                "öffne einstellungen"
            ) ||
            normalized.includes(
                "open settings"
            )
        ) {

            await openKnownApp(
                [
                    "settings",
                    "einstellungen",
                    "system-settings"
                ]
            );

            return true;

        }


        if (
            normalized.includes(
                "öffne tastatur"
            )
        ) {

            await openKnownApp(
                [
                    "keyboard",
                    "ezidi-keyboard"
                ]
            );

            return true;

        }


        if (
            normalized ===
            "menü"
            ||
            normalized ===
            "menu"
        ) {

            openMenu();

            return true;

        }


        if (
            normalized.includes(
                "startseite"
            )
            ||
            normalized ===
            "home"
        ) {

            closeCurrentApp();

            return true;

        }


        return false;

    }


    /* =====================================================
       21 — AI SEND
       ===================================================== */

    async function sendAI() {

        const text =
            aiInput.value.trim();


        if (!text) {
            return;
        }


        aiInput.value = "";


        appendAIMessage(
            "user",
            text
        );


        const handled =
            await processAICommand(
                text
            );


        if (handled) {

            appendAIMessage(
                "assistant",
                "Ich habe den gewünschten HalDo-Vorgang ausgeführt."
            );

            return;

        }


        const response =
            await processAI(
                text
            );


        if (response) {

            appendAIMessage(
                "assistant",
                response
            );

            return;

        }


        appendAIMessage(
            "assistant",
            "Ich bin bereit. Die HalDo-AI-Runtime wird gerade mit den vorhandenen AI-, Memory-, Language- und Systemmodulen verbunden."
        );

    }


    aiSend.addEventListener(
        "click",
        sendAI
    );


    aiInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key ===
                "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendAI();

            }

        }
    );


    /* =====================================================
       22 — APP EVENTS
       ===================================================== */

    function connectAppEvents() {

        window.addEventListener(
            "haldo:app-manager-ready",
            function () {

                renderApps();

            }
        );


        window.addEventListener(
            "haldo:app-opened",
            function () {

                renderApps();

            }
        );


        window.addEventListener(
            "haldo:app-closed",
            function () {

                renderApps();

            }
        );


        window.addEventListener(
            "haldo:app-manager:registered",
            function () {

                renderApps();

            }
        );


        window.addEventListener(
            "haldo:app-manager:registry-synchronized",
            function () {

                renderApps();

            }
        );

    }


    connectAppEvents();


    /* =====================================================
       23 — INITIAL APP LOAD
       ===================================================== */

    function waitForAppManager(
        attempts = 0
    ) {

        const manager =
            getAppManager();


        if (manager) {

            renderApps();

            return;

        }


        if (
            attempts >= 100
        ) {

            renderApps();

            return;

        }


        setTimeout(
            function () {

                waitForAppManager(
                    attempts + 1
                );

            },
            100
        );

    }


    waitForAppManager();


    /* =====================================================
       24 — ESCAPE
       ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key !==
                "Escape"
            ) {
                return;
            }


            if (
                menu.classList.contains(
                    "open"
                )
            ) {

                closeMenu();

                return;

            }


            if (
                aiView.classList.contains(
                    "open"
                )
            ) {

                closeAI();

                return;

            }


            if (
                appView.classList.contains(
                    "open"
                )
            ) {

                closeCurrentApp();

            }

        }
    );


    /* =====================================================
       25 — OUTSIDE MENU
       ===================================================== */

    document.addEventListener(
        "pointerdown",
        function (event) {

            if (
                !menu.classList.contains(
                    "open"
                )
            ) {
                return;
            }


            if (
                menu.contains(
                    event.target
                )
                ||
                menuButton.contains(
                    event.target
                )
            ) {
                return;
            }


            closeMenu();

        }
    );


    /* =====================================================
       26 — BOOT COMPLETE
       ===================================================== */

    function finishBoot() {

        setTimeout(
            function () {

                bootScreen.classList.add(
                    "hidden"
                );

            },
            600
        );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            finishBoot,
            {
                once: true
            }
        );

    } else {

        finishBoot();

    }


    /* =====================================================
       27 — GLOBAL SHELL API
       ===================================================== */

    window.HalDoShell = {

        openMenu,

        closeMenu,

        openAI,

        closeAI,

        openApp:
            openRegisteredApp,

        closeApp:
            closeCurrentApp,

        refreshApps:
            renderApps,

        getAppManager

    };


    if (
        window.HalDoOS
    ) {

        window.HalDoOS.shell =
            window.HalDoShell;

    }


    /* =====================================================
       END SHELL RUNTIME
       ===================================================== */

})();

</script>
