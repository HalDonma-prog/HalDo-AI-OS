                        '<button onclick="notify(\'🚦 Verkehrsregeln werden geladen...\',\'success\')" style="padding:8px;font-size:0.6rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;font-weight:500;">🚦 Regeln</button>' +
                        '<button onclick="notify(\'🛑 Verkehrsschilder werden geladen...\',\'success\')" style="padding:8px;font-size:0.6rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;font-weight:500;">🛑 Schilder</button>' +
                        '<button onclick="notify(\'🚗 Praktische Übung startet...\',\'success\')" style="padding:8px;font-size:0.6rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;font-weight:500;">🚗 Übung</button>' +
                        '<button onclick="notify(\'📝 Theorieprüfung startet...\',\'success\')" style="padding:8px;font-size:0.6rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;font-weight:500;">📝 Prüfung</button>' +
                        '</div>' +
                        '<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;">' +
                        '<button onclick="notify(\'🚦 Ampel: Rot → Halt, Gelb → Bereit, Grün → Fahren\',\'info\')" style="padding:4px 10px;font-size:0.5rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);border-radius:10px;color:#8899bb;cursor:pointer;">🚦 Ampel</button>' +
                        '<button onclick="notify(\'🛑 Stoppschild: Immer anhalten und Vorfahrt gewähren\',\'info\')" style="padding:4px 10px;font-size:0.5rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);border-radius:10px;color:#8899bb;cursor:pointer;">🛑 Stopp</button>' +
                        '<button onclick="notify(\'📝 30 Fragen zur Theorieprüfung\',\'info\')" style="padding:4px 10px;font-size:0.5rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);border-radius:10px;color:#8899bb;cursor:pointer;">📝 Theorie</button>' +
                        '</div>' +
                        '<div style="font-size:0.4rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;width:100%;">🚗 Fahrschule · HalDo OS ' +
                        CONFIG.version + '</div>' +
                        '</div>';
                }
            });

            // ----- App World -----
            registerApp('appworld', {
                title: 'App World',
                icon: '📱',
                category: 'system',
                render: function(body) {
                    var apps = [];
                    for (var key in state.apps) {
                        if (key !== 'appworld') {
                            apps.push({ id: key, title: state.apps[key].title, icon: state.apps[key].icon,
                                category: state.apps[key].category || 'all' });
                        }
                    }
                    // Sort by title
                    apps.sort(function(a, b) { return a.title.localeCompare(b.title); });

                    var html = '<h3 style="margin-bottom:6px;font-size:0.75rem;">📱 ' + apps.length +
                        ' Apps installiert</h3>' +
                        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;max-height:200px;overflow-y:auto;">';

                    for (var i = 0; i < apps.length; i++) {
                        var a = apps[i];
                        html +=
                            '<div style="background:rgba(255,255,255,0.03);padding:8px 4px;border-radius:6px;text-align:center;cursor:pointer;transition:all 0.2s;border:1px solid transparent;" onclick="launchApp(\'' +
                            a.id + '\')" onmouseenter="this.style.background=\'rgba(255,255,255,0.06)\';" onmouseleave="this.style.background=\'rgba(255,255,255,0.03)\';">' +
                            '<div style="font-size:1.4rem;">' + a.icon + '</div>' +
                            '<div style="font-size:0.45rem;margin-top:3px;color:#8899bb;">' + a.title + '</div>' +
                            '</div>';
                    }
                    html += '</div>' +
                        '<div style="font-size:0.4rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;margin-top:4px;">📱 ' +
                        apps.length + ' Apps · HalDo OS ' + CONFIG.version + '</div>';

                    body.innerHTML = html;
                }
            });

            // ----- Files App -----
            registerApp('files', {
                title: 'Datei-Manager',
                icon: '📁',
                category: 'system',
                render: function(body) {
                    var files = [
                        { name: 'Dokumente', type: 'folder' },
                        { name: 'Bilder', type: 'folder' },
                        { name: 'Musik', type: 'folder' },
                        { name: 'Downloads', type: 'folder' },
                        { name: 'HalDo_System.pdf', type: 'pdf' },
                        { name: 'README.txt', type: 'txt' },
                        { name: 'Config.json', type: 'json' }
                    ];
                    var html =
                        '<div style="display:flex;gap:4px;margin-bottom:6px;">' +
                        '<input type="text" placeholder="🔍 Suche ..." style="flex:1;font-size:0.65rem;padding:5px 8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;color:#fff;outline:none;" />' +
                        '<button onclick="Notify.info(\'📁 Neuer Ordner erstellt\')" style="padding:4px 10px;font-size:0.65rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:6px;color:#fff;cursor:pointer;">➕</button>' +
                        '</div>' +
                        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px;">';

                    for (var i = 0; i < files.length; i++) {
                        var f = files[i];
                        var icon = f.type === 'folder' ? '📁' : '📄';
                        html +=
                            '<div style="background:rgba(255,255,255,0.02);padding:6px;border-radius:4px;text-align:center;cursor:pointer;transition:all 0.2s;border:1px solid transparent;" onclick="Notify.info(\'📄 ' +
                            f.name + ' geöffnet\')" onmouseenter="this.style.background=\'rgba(255,255,255,0.05)\';" onmouseleave="this.style.background=\'rgba(255,255,255,0.02)\';">' +
                            '<div style="font-size:1.3rem;">' + icon + '</div>' +
                            '<div style="font-size:0.45rem;color:#8899bb;word-break:break-word;">' + f.name +
                            '</div>' +
                            '</div>';
                    }
                    html += '</div>' +
                        '<div style="font-size:0.4rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;margin-top:4px;">📊 ' +
                        files.length + ' Elemente · 💾 24 GB frei</div>';

                    body.innerHTML = html;
                }
            });

            // ----- Tasks App -----
            registerApp('tasks', {
                title: 'Aufgaben',
                icon: '✅',
                category: 'productivity',
                render: function(body) {
                    var tasks = state.tasks || [];
                    var html =
                        '<div style="display:flex;gap:4px;margin-bottom:6px;">' +
                        '<input type="text" id="task-input" placeholder="➕ Neue Aufgabe ..." style="flex:1;font-size:0.65rem;padding:5px 8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;color:#fff;outline:none;" />' +
                        '<button id="task-add" style="padding:4px 10px;font-size:0.65rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;">➕</button>' +
                        '</div>' +
                        '<div id="task-list" style="display:flex;flex-direction:column;gap:3px;max-height:170px;overflow-y:auto;">';

                    for (var i = 0; i < tasks.length; i++) {
                        var done = tasks[i].done ? '✅' : '⬜';
                        html +=
                            '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;font-size:0.65rem;">' +
                            '<span style="display:flex;align-items:center;gap:6px;cursor:pointer;" class="task-toggle" data-idx="' +
                            i + '">' +
                            '<span>' + done + '</span>' +
                            '<span style="' + (tasks[i].done ? 'text-decoration:line-through;color:#556688;' : '') +
                            '">' + tasks[i].text + '</span>' +
                            '</span>' +
                            '<button class="task-del" data-idx="' + i +
                            '" style="background:none;border:none;color:#ff6666;cursor:pointer;font-size:0.6rem;padding:2px 6px;">✕</button>' +
                            '</div>';
                    }
                    html += '</div>' +
                        '<div style="font-size:0.4rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;margin-top:4px;">✅ ' +
                        tasks.filter(function(t) { return t.done; }).length + '/' + tasks.length +
                        ' erledigt · Lokal gespeichert</div>';

                    body.innerHTML = html;

                    var input = body.querySelector('#task-input');
                    var addBtn = body.querySelector('#task-add');

                    function renderTasks() {
                        var list = body.querySelector('#task-list');
                        list.innerHTML = '';
                        for (var i = 0; i < tasks.length; i++) {
                            var done = tasks[i].done ? '✅' : '⬜';
                            var div = document.createElement('div');
                            div.style.cssText =
                                'display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;font-size:0.65rem;';
                            div.innerHTML =
                                '<span style="display:flex;align-items:center;gap:6px;cursor:pointer;" class="task-toggle" data-idx="' +
                                i + '">' +
                                '<span>' + done + '</span>' +
                                '<span style="' + (tasks[i].done ? 'text-decoration:line-through;color:#556688;' :
                                    '') + '">' + tasks[i].text + '</span>' +
                                '</span>' +
                                '<button class="task-del" data-idx="' + i +
                                '" style="background:none;border:none;color:#ff6666;cursor:pointer;font-size:0.6rem;padding:2px 6px;">✕</button>';
                            list.appendChild(div);
                        }

                        list.querySelectorAll('.task-toggle').forEach(function(el) {
                            el.addEventListener('click', function() {
                                var idx = parseInt(this.dataset.idx);
                                tasks[idx].done = !tasks[idx].done;
                                localStorage.setItem('haldo_tasks', JSON.stringify(tasks));
                                state.tasks = tasks;
                                renderTasks();
                                Notify.info(tasks[idx].done ? '✅ Aufgabe erledigt!' :
                                '🔄 Aufgabe wieder offen');
                            });
                        });

                        list.querySelectorAll('.task-del').forEach(function(btn) {
                            btn.addEventListener('click', function() {
                                var idx = parseInt(this.dataset.idx);
                                tasks.splice(idx, 1);
                                localStorage.setItem('haldo_tasks', JSON.stringify(tasks));
                                state.tasks = tasks;
                                renderTasks();
                                Notify.info('🗑️ Aufgabe gelöscht');
                            });
                        });

                        // Update counter
                        var counter = body.querySelector('div:last-child');
                        if (counter) {
                            var doneCount = tasks.filter(function(t) { return t.done; }).length;
                            counter.textContent = '✅ ' + doneCount + '/' + tasks.length +
                                ' erledigt · Lokal gespeichert';
                        }
                    }

                    addBtn.addEventListener('click', function() {
                        var val = input.value.trim();
                        if (!val) return;
                        tasks.push({ text: val, done: false, created: now() });
                        localStorage.setItem('haldo_tasks', JSON.stringify(tasks));
                        state.tasks = tasks;
                        input.value = '';
                        renderTasks();
                        Notify.success('✅ Aufgabe hinzugefügt');
                    });

                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') addBtn.click();
                    });
                }
            });

            // ----- Contacts App -----
            registerApp('contacts', {
                title: 'Kontakte',
                icon: '👤',
                category: 'communication',
                render: function(body) {
                    var contacts = state.contacts || [];
                    var html =
                        '<div style="display:flex;gap:4px;margin-bottom:6px;">' +
                        '<input type="text" id="contact-input" placeholder="👤 Name ..." style="flex:1;font-size:0.65rem;padding:5px 8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;color:#fff;outline:none;" />' +
                        '<button id="contact-add" style="padding:4px 10px;font-size:0.65rem;background:linear-gradient(135deg,#00d4ff,#7b2ffc);border:none;border-radius:6px;color:#fff;cursor:pointer;">➕</button>' +
                        '</div>' +
                        '<div id="contact-list" style="display:flex;flex-direction:column;gap:3px;max-height:170px;overflow-y:auto;">';

                    for (var i = 0; i < contacts.length; i++) {
                        html +=
                            '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;font-size:0.65rem;">' +
                            '<span>👤 ' + contacts[i] + '</span>' +
                            '<button class="contact-del" data-idx="' + i +
                            '" style="background:none;border:none;color:#ff6666;cursor:pointer;font-size:0.6rem;padding:2px 6px;">✕</button>' +
                            '</div>';
                    }
                    html += '</div>' +
                        '<div style="font-size:0.4rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:4px;margin-top:4px;">👤 ' +
                        contacts.length + ' Kontakte · Lokal gespeichert</div>';

                    body.innerHTML = html;

                    var input = body.querySelector('#contact-input');
                    var addBtn = body.querySelector('#contact-add');

                    function renderContacts() {
                        var list = body.querySelector('#contact-list');
                        list.innerHTML = '';
                        for (var i = 0; i < contacts.length; i++) {
                            var div = document.createElement('div');
                            div.style.cssText =
                                'display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;font-size:0.65rem;';
                            div.innerHTML = '<span>👤 ' + contacts[i] +
                                '</span><button class="contact-del" data-idx="' + i +
                                '" style="background:none;border:none;color:#ff6666;cursor:pointer;font-size:0.6rem;padding:2px 6px;">✕</button>';
                            list.appendChild(div);
                        }
                        list.querySelectorAll('.contact-del').forEach(function(btn) {
                            btn.addEventListener('click', function() {
                                var idx = parseInt(this.dataset.idx);
                                contacts.splice(idx, 1);
                                localStorage.setItem('haldo_contacts', JSON.stringify(contacts));
                                state.contacts = contacts;
                                renderContacts();
                                Notify.info('🗑️ Kontakt gelöscht');
                            });
                        });
                        var counter = body.querySelector('div:last-child');
                        if (counter) {
                            counter.textContent = '👤 ' + contacts.length + ' Kontakte · Lokal gespeichert';
                        }
                    }

                    addBtn.addEventListener('click', function() {
                        var val = input.value.trim();
                        if (!val) return;
                        contacts.push(val);
                        localStorage.setItem('haldo_contacts', JSON.stringify(contacts));
                        state.contacts = contacts;
                        input.value = '';
                        renderContacts();
                        Notify.success('👤 Kontakt hinzugefügt');
                    });

                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') addBtn.click();
                    });
                }
            });

            // ============================================================
            //  SYSTEM INIT
            // ============================================================

            function updateClock() {
                var now = new Date();
                DOM.clock.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                state.system.uptime = Math.floor((now() - state.system.started) / 1000);
            }

            function initDock() {
                var items = DOM.dock.querySelectorAll('.dock-item');
                for (var i = 0; i < items.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function() {
                            var app = btn.dataset.app;
                            if (app) launchApp(app);
                        });
                    })(items[i]);
                }
            }

            function initMenus() {
                var menuMap = {
                    'menu-apps': 'appworld',
                    'menu-ai': 'ai',
                    'menu-fahrschule': 'fahrschule',
                    'menu-system': 'settings'
                };
                for (var id in menuMap) {
                    var el = document.getElementById(id);
                    if (el) {
                        (function(appId) {
                            el.addEventListener('click', function() { launchApp(appId); });
                        })(menuMap[id]);
                    }
                }

                document.getElementById('menu-help').addEventListener('click', function() {
                    Notify.info(
                        '❓ Hilfe:\n• "Öffne Fahrschule" - Fahrschule App\n• "Schreib mir einen Brief" - Text erstellen\n• Klicke auf die Sonne für AI\n• Alle Apps im Dock oder Menü');
                });
            }

            function bootSequence() {
                var steps = [
                    { text: '⟡ Kernel v' + CONFIG.kernel + ' wird geladen ...', progress: 15 },
                    { text: '⟡ System initialisiert ...', progress: 30 },
                    { text: '⟡ Cosmic World startet ...', progress: 55 },
                    { text: '⟡ HalDo AI wird aktiviert ...', progress: 75 },
                    { text: '⟡ ' + Object.keys(state.apps).length + ' Apps geladen ...', progress: 90 },
                    { text: '⟡ HalDo OS ' + CONFIG.version + ' ist READY 🚀', progress: 100 }
                ];

                var i = 0;
                DOM.bootStatus.textContent = steps[0].text;
                DOM.bootProgress.style.width = '5%';

                var interval = setInterval(function() {
                    i++;
                    if (i < steps.length) {
                        DOM.bootStatus.textContent = steps[i].text;
                        DOM.bootProgress.style.width = steps[i].progress + '%';
                    } else {
                        clearInterval(interval);
                        setTimeout(function() {
                            DOM.boot.classList.add('hidden');
                            state.isBooted = true;
                            state.isReady = true;
                            Notify.success('🚀 HalDo OS ' + CONFIG.version + ' gestartet!');
                            // Auto-start AI
                            if (state.settings.autoStartAI !== false) {
                                setTimeout(function() { launchApp('ai'); }, 400);
                            }
                            setTimeout(function() { launchApp('cosmic'); }, 700);
                        }, 300);
                    }
                }, 350);
            }

            function loadSettings() {
                try {
                    var saved = JSON.parse(localStorage.getItem('haldo_settings'));
                    if (saved) {
                        for (var key in saved) {
                            if (state.settings.hasOwnProperty(key)) {
                                state.settings[key] = saved[key];
                            }
                        }
                        CONFIG.language = state.settings.language || 'de';
                    }
                } catch (e) {}
            }

            function loadData() {
                try {
                    var notes = localStorage.getItem('haldo_notes');
                    if (notes) state.notes = JSON.parse(notes);

                    var contacts = localStorage.getItem('haldo_contacts');
                    if (contacts) state.contacts = JSON.parse(contacts);

                    var tasks = localStorage.getItem('haldo_tasks');
                    if (tasks) state.tasks = JSON.parse(tasks);

                    var conv = localStorage.getItem('haldo_conversations');
                    if (conv) {
                        var parsed = JSON.parse(conv);
                        if (Array.isArray(parsed)) AI.conversationHistory = parsed;
                    }

                    var memory = localStorage.getItem('haldo_ai_memory');
                    if (memory) state.aiMemory = JSON.parse(memory);
                } catch (e) {
                    console.log('[Storage] Fehler beim Laden', e);
                }
            }

            // ============================================================
            //  GLOBAL EXPOSURE
            // ============================================================
            window.HalDo = {
                CONFIG: CONFIG,
                state: state,
                AI: AI,
                Voice: Voice,
                Notify: Notify,
                launchApp: launchApp,
                closeWindow: closeWindow,
                minimizeWindow: minimizeWindow,
                maximizeWindow: maximizeWindow,
                get apps() { return state.apps; },
                get windows() { return state.windows; },
                version: CONFIG.version,
                booted: function() { return state.isBooted; }
            };

            // Alias für einfachere Nutzung in Apps
            window.notify = Notify.show;

            // ============================================================
            //  MAIN INIT
            // ============================================================

            function init() {
                console.log('⟡ HalDo OS ' + CONFIG.version + ' — Professionelle Software');
                console.log('📱 ' + Object.keys(state.apps).length + ' Apps registriert');
                console.log('🔧 Build: ' + CONFIG.build);

                loadSettings();
                loadData();

                Voice.init();
                initCosmic();
                updateClock();
                setInterval(updateClock, 10000);
                initDock();
                initMenus();

                // About button
                document.getElementById('btn-about').addEventListener('click', function() {
                    Notify.show(
                        '⟡ HalDo OS ' + CONFIG.version +
                        '\n💙❤️🚀 ' + Object.keys(state.apps).length + ' Apps' +
                        '\n✅ Groq AI verbunden' +
                        '\n🚗 Fahrschule aktiv' +
                        '\n📝 Notizen & Tasks lokal' +
                        '\n🔧 Build: ' + CONFIG.build,
                        'info'
                    );
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', function(e) {
                    // Cmd/Ctrl + K → AI
                    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                        e.preventDefault();
                        launchApp('ai');
                    }
                    // Escape → close active window
                    if (e.key === 'Escape' && state.activeWindow) {
                        closeWindow(state.activeWindow);
                    }
                });

                bootSequence();

                console.log('✅ System bereit — Viel Spaß mit HalDo OS!');
            }

            // Start wenn DOM bereit
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
