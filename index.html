<script>
"use strict";

(function () {

    const HD = window.HalDo;

    if (!HD) {
        console.error("HalDo Core fehlt.");
        return;
    }

    /* =========================================================
       WINDOW MANAGER FOUNDATION
       ========================================================= */

    HD.windowManager = HD.windowManager || {

        windows:
            new Map(),

        zIndex:
            1000,

        activeWindow:
            null,

        initialized:
            false

    };


    /* =========================================================
       WINDOW ID
       ========================================================= */

    HD.windowManager.createId =
        function (appId) {

            return (
                "haldo-window-" +
                appId +
                "-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2, 8)
            );

        };


    /* =========================================================
       WINDOW POSITION
       ========================================================= */

    HD.windowManager.getPosition =
        function (appId) {

            const state =
                HD.appState.ensure(
                    appId
                );

            return {

                x:
                    Number.isFinite(
                        state.windowX
                    )
                        ? state.windowX
                        : 80,

                y:
                    Number.isFinite(
                        state.windowY
                    )
                        ? state.windowY
                        : 90,

                width:
                    Number.isFinite(
                        state.windowWidth
                    )
                        ? state.windowWidth
                        : (
                            HD.config
                                ?.defaultWindowWidth
                            || 720
                        ),

                height:
                    Number.isFinite(
                        state.windowHeight
                    )
                        ? state.windowHeight
                        : (
                            HD.config
                                ?.defaultWindowHeight
                            || 480
                        )

            };

        };


    /* =========================================================
       CLAMP WINDOW
       ========================================================= */

    HD.windowManager.clamp =
        function (
            position
        ) {

            const width =
                Math.max(
                    HD.config
                        ?.minimumWindowWidth
                    || 360,
                    position.width
                );

            const height =
                Math.max(
                    HD.config
                        ?.minimumWindowHeight
                    || 240,
                    position.height
                );

            const viewportWidth =
                window.innerWidth;

            const viewportHeight =
                window.innerHeight;


            const maxX =
                Math.max(
                    0,
                    viewportWidth -
                    Math.min(
                        width,
                        viewportWidth
                    )
                );


            const maxY =
                Math.max(
                    0,
                    viewportHeight -
                    Math.min(
                        height,
                        viewportHeight
                    )
                );


            return {

                x:
                    Math.min(
                        Math.max(
                            0,
                            position.x
                        ),
                        maxX
                    ),

                y:
                    Math.min(
                        Math.max(
                            0,
                            position.y
                        ),
                        maxY
                    ),

                width:
                    Math.min(
                        width,
                        viewportWidth
                    ),

                height:
                    Math.min(
                        height,
                        viewportHeight
                    )

            };

        };


    /* =========================================================
       SAVE WINDOW STATE
       ========================================================= */

    HD.windowManager.saveState =
        function (
            appId,
            position,
            flags = {}
        ) {

            HD.appState.patch(
                appId,
                {

                    windowX:
                        position.x,

                    windowY:
                        position.y,

                    windowWidth:
                        position.width,

                    windowHeight:
                        position.height,

                    minimized:
                        !!flags.minimized,

                    maximized:
                        !!flags.maximized,

                    closed:
                        !!flags.closed,

                    updatedAt:
                        Date.now()

                }
            );

        };


    /* =========================================================
       FOCUS WINDOW
       ========================================================= */

    HD.windowManager.focus =
        function (windowElement) {

            if (!windowElement) {
                return;
            }

            this.zIndex += 1;

            windowElement.style.zIndex =
                String(
                    this.zIndex
                );

            this.activeWindow =
                windowElement;

            document
                .querySelectorAll(
                    ".haldo-window.active"
                )
                .forEach(
                    element => {

                        if (
                            element !==
                            windowElement
                        ) {

                            element.classList
                                .remove(
                                    "active"
                                );

                        }

                    }
                );

            windowElement.classList
                .add(
                    "active"
                );

            const appId =
                windowElement.dataset
                    .appId;

            if (appId) {

                HD.emit(
                    "window:focus",
                    {
                        appId,
                        window:
                            windowElement
                    }
                );

            }

        };


    /* =========================================================
       CREATE WINDOW
       ========================================================= */

    HD.windowManager.create =
        function (
            appId
        ) {

            const manifest =
                HD.appRegistry
                    ?.get(appId);

            if (!manifest) {

                console.warn(
                    "Unbekannte App:",
                    appId
                );

                return null;
            }


            const existing =
                this.get(appId);

            if (existing) {

                this.restore(
                    existing
                );

                this.focus(
                    existing
                );

                return existing;
            }


            const layer =
                HD.ui
                    ?.windowLayer ||
                document.getElementById(
                    "haldo-window-layer"
                );

            if (!layer) {
                return null;
            }


            const position =
                this.clamp(
                    this.getPosition(
                        appId
                    )
                );


            const windowElement =
                document.createElement(
                    "section"
                );

            windowElement.className =
                "haldo-window active";

            windowElement.dataset.appId =
                appId;

            windowElement.dataset.windowId =
                this.createId(
                    appId
                );

            windowElement.style.left =
                position.x + "px";

            windowElement.style.top =
                position.y + "px";

            windowElement.style.width =
                position.width + "px";

            windowElement.style.height =
                position.height + "px";

            windowElement.style.zIndex =
                String(
                    ++this.zIndex
                );


            /* =================================================
               WINDOW HEADER
               ================================================= */

            const header =
                document.createElement(
                    "header"
                );

            header.className =
                "haldo-window-header";


            const titleArea =
                document.createElement(
                    "div"
                );

            titleArea.className =
                "haldo-window-title-area";


            const icon =
                document.createElement(
                    "span"
                );

            icon.className =
                "haldo-window-icon";

            icon.textContent =
                manifest.icon ||
                "○";


            const title =
                document.createElement(
                    "strong"
                );

            title.textContent =
                manifest.name;


            const online =
                document.createElement(
                    "span"
                );

            online.className =
                "status-dot online";


            titleArea.appendChild(
                icon
            );

            titleArea.appendChild(
                title
            );

            titleArea.appendChild(
                online
            );


            /* =================================================
               WINDOW CONTROLS
               ================================================= */

            const controls =
                document.createElement(
                    "div"
                );

            controls.className =
                "haldo-window-controls";


            const minimize =
                document.createElement(
                    "button"
                );

            minimize.type =
                "button";

            minimize.className =
                "window-control minimize";

            minimize.title =
                "Minimieren";

            minimize.textContent =
                "−";


            const maximize =
                document.createElement(
                    "button"
                );

            maximize.type =
                "button";

            maximize.className =
                "window-control maximize";

            maximize.title =
                "Vergrößern";

            maximize.textContent =
                "□";


            const close =
                document.createElement(
                    "button"
                );

            close.type =
                "button";

            close.className =
                "window-control close";

            close.title =
                "Schließen";

            close.textContent =
                "×";


            controls.appendChild(
                minimize
            );

            controls.appendChild(
                maximize
            );

            controls.appendChild(
                close
            );


            header.appendChild(
                titleArea
            );

            header.appendChild(
                controls
            );


            /* =================================================
               WINDOW BODY
               ================================================= */

            const body =
                document.createElement(
                    "div"
                );

            body.className =
                "haldo-window-body";


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "haldo-window-content";


            body.appendChild(
                content
            );


            windowElement.appendChild(
                header
            );

            windowElement.appendChild(
                body
            );


            /* =================================================
               RESIZE HANDLE
               ================================================= */

            const resizeHandle =
                document.createElement(
                    "div"
                );

            resizeHandle.className =
                "haldo-window-resize";

            resizeHandle.setAttribute(
                "aria-label",
                "Fenstergröße ändern"
            );


            windowElement.appendChild(
                resizeHandle
            );


            layer.appendChild(
                windowElement
            );


            /* =================================================
               WINDOW INSTANCE
               ================================================= */

            const instance = {

                id:
                    windowElement
                        .dataset
                        .windowId,

                appId,

                manifest,

                element:
                    windowElement,

                content,

                minimized:
                    false,

                maximized:
                    false,

                previous:
                    null,

                destroyed:
                    false

            };


            this.windows.set(
                appId,
                instance
            );


            /* =================================================
               FOCUS
               ================================================= */

            windowElement.addEventListener(
                "pointerdown",
                () => {

                    this.focus(
                        windowElement
                    );

                }
            );


            /* =================================================
               MINIMIZE
               ================================================= */

            minimize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    this.minimize(
                        instance
                    );

                }
            );


            /* =================================================
               MAXIMIZE
               ================================================= */

            maximize.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    this.toggleMaximize(
                        instance
                    );

                }
            );


            /* =================================================
               CLOSE
               ================================================= */

            close.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    this.close(
                        instance
                    );

                }
            );


            /* =================================================
               DRAGGING
               ================================================= */

            this.enableDragging(
                instance,
                header
            );


            /* =================================================
               RESIZING
               ================================================= */

            this.enableResizing(
                instance,
                resizeHandle
            );


            /* =================================================
               RENDER APP
               ================================================= */

            HD.appContent
                ?.render(
                    appId,
                    content,
                    {
                        window:
                            instance
                    }
                );


            HD.emit(
                "window:created",
                {
                    appId,
                    window:
                        instance
                }
            );


            this.focus(
                windowElement
            );


            return instance;

        };


    /* =========================================================
       GET WINDOW
       ========================================================= */

    HD.windowManager.get =
        function (appId) {

            const instance =
                this.windows.get(
                    appId
                );

            if (!instance) {
                return null;
            }

            if (
                instance.destroyed
            ) {

                this.windows.delete(
                    appId
                );

                return null;
            }

            return instance;

        };


    /* =========================================================
       OPEN / RESTORE
       ========================================================= */

    HD.windowManager.open =
        function (appId) {

            let instance =
                this.get(
                    appId
                );

            if (!instance) {

                instance =
                    this.create(
                        appId
                    );

            }

            if (!instance) {
                return null;
            }

            this.restore(
                instance
            );

            this.focus(
                instance.element
            );

            return instance;

        };


    HD.windowManager.restore =
        function (instance) {

            if (!instance) {
                return;
            }

            instance.minimized =
                false;

            instance.element
                .classList
                .remove(
                    "minimized"
                );

            instance.element
                .style.display =
                "flex";


            const state =
                HD.appState.ensure(
                    instance.appId
                );


            if (
                state.maximized
            ) {

                instance.maximized =
                    true;

                this.applyMaximized(
                    instance
                );

            }


            HD.emit(
                "window:restored",
                {
                    appId:
                        instance.appId
                }
            );

        };


    /* =========================================================
       MINIMIZE
       ========================================================= */

    HD.windowManager.minimize =
        function (instance) {

            if (!instance) {
                return;
            }

            instance.minimized =
                true;

            instance.element
                .classList
                .add(
                    "minimized"
                );

            instance.element
                .style.display =
                "none";


            this.saveState(
                instance.appId,
                {
                    x:
                        parseFloat(
                            instance
                                .element
                                .style
                                .left
                        ) || 0,

                    y:
                        parseFloat(
                            instance
                                .element
                                .style
                                .top
                        ) || 0,

                    width:
                        instance
                            .element
                            .offsetWidth,

                    height:
                        instance
                            .element
                            .offsetHeight

                },
                {
                    minimized:
                        true,

                    maximized:
                        instance.maximized
                }
            );


            HD.emit(
                "window:minimized",
                {
                    appId:
                        instance.appId
                }
            );

        };


    /* =========================================================
       APPLY MAXIMIZED
       ========================================================= */

    HD.windowManager.applyMaximized =
        function (instance) {

            if (!instance) {
                return;
            }

            instance.element
                .classList
                .add(
                    "maximized"
                );

            instance.element.style.left =
                "0px";

            instance.element.style.top =
                "0px";

            instance.element.style.width =
                "100%";

            instance.element.style.height =
                "100%";

        };


    /* =========================================================
       TOGGLE MAXIMIZE
       ========================================================= */

    HD.windowManager.toggleMaximize =
        function (instance) {

            if (!instance) {
                return;
            }


            if (
                instance.maximized
            ) {

                instance.maximized =
                    false;

                instance.element
                    .classList
                    .remove(
                        "maximized"
                    );


                if (
                    instance.previous
                ) {

                    const p =
                        instance.previous;

                    instance.element.style.left =
                        p.x + "px";

                    instance.element.style.top =
                        p.y + "px";

                    instance.element.style.width =
                        p.width + "px";

                    instance.element.style.height =
                        p.height + "px";

                }

            }
            else {

                instance.previous = {

                    x:
                        parseFloat(
                            instance.element.style.left
                        ) || 0,

                    y:
                        parseFloat(
                            instance.element.style.top
                        ) || 0,

                    width:
                        instance.element.offsetWidth,

                    height:
                        instance.element.offsetHeight

                };


                instance.maximized =
                    true;

                this.applyMaximized(
                    instance
                );

            }


            const position = {

                x:
                    parseFloat(
                        instance.element.style.left
                    ) || 0,

                y:
                    parseFloat(
                        instance.element.style.top
                    ) || 0,

                width:
                    instance.element.offsetWidth,

                height:
                    instance.element.offsetHeight

            };


            this.saveState(
                instance.appId,
                position,
                {
                    minimized:
                        false,

                    maximized:
                        instance.maximized
                }
            );


            this.focus(
                instance.element
            );


            HD.emit(
                "window:maximized",
                {
                    appId:
                        instance.appId,

                    maximized:
                        instance.maximized
                }
            );

        };


    /* =========================================================
       CLOSE
       ========================================================= */

    HD.windowManager.close =
        function (instance) {

            if (!instance) {
                return;
            }


            const element =
                instance.element;


            const position = {

                x:
                    parseFloat(
                        element.style.left
                    ) || 0,

                y:
                    parseFloat(
                        element.style.top
                    ) || 0,

                width:
                    element.offsetWidth,

                height:
                    element.offsetHeight

            };


            this.saveState(
                instance.appId,
                position,
                {
                    minimized:
                        false,

                    maximized:
                        instance.maximized,

                    closed:
                        true
                }
            );


            if (
                typeof instance.destroy ===
                "function"
            ) {

                try {
                    instance.destroy();
                }
                catch (error) {
                    console.warn(
                        "HalDo App Destroy:",
                        error
                    );
                }

            }


            element.remove();

            instance.destroyed =
                true;

            this.windows.delete(
                instance.appId
            );


            HD.emit(
                "window:closed",
                {
                    appId:
                        instance.appId
                }
            );

        };


    /* =========================================================
       DRAGGING
       ========================================================= */

    HD.windowManager.enableDragging =
        function (
            instance,
            header
        ) {

            let dragging =
                false;

            let startX =
                0;

            let startY =
                0;

            let originX =
                0;

            let originY =
                0;


            header.addEventListener(
                "pointerdown",
                function (event) {

                    if (
                        event.target.closest(
                            ".haldo-window-controls"
                        )
                    ) {
                        return;
                    }

                    if (
                        instance.maximized
                    ) {
                        return;
                    }


                    dragging =
                        true;

                    startX =
                        event.clientX;

                    startY =
                        event.clientY;

                    originX =
                        parseFloat(
                            instance
                                .element
                                .style
                                .left
                        ) || 0;

                    originY =
                        parseFloat(
                            instance
                                .element
                                .style
                                .top
                        ) || 0;


                    header.setPointerCapture(
                        event.pointerId
                    );


                    this.focus(
                        instance.element
                    );

                }.bind(this)
            );


            header.addEventListener(
                "pointermove",
                function (event) {

                    if (!dragging) {
                        return;
                    }


                    const deltaX =
                        event.clientX -
                        startX;

                    const deltaY =
                        event.clientY -
                        startY;


                    const position =
                        this.clamp(
                            {

                                x:
                                    originX +
                                    deltaX,

                                y:
                                    originY +
                                    deltaY,

                                width:
                                    instance
                                        .element
                                        .offsetWidth,

                                height:
                                    instance
                                        .element
                                        .offsetHeight

                            }
                        );


                    instance.element.style.left =
                        position.x + "px";

                    instance.element.style.top =
                        position.y + "px";


                }.bind(this)
            );


            header.addEventListener(
                "pointerup",
                function () {

                    if (!dragging) {
                        return;
                    }

                    dragging =
                        false;

                    this.persistWindow(
                        instance
                    );

                }.bind(this)
            );


            header.addEventListener(
                "pointercancel",
                function () {

                    dragging =
                        false;

                    this.persistWindow(
                        instance
                    );

                }.bind(this)
            );

        };


    /* =========================================================
       RESIZING
       ========================================================= */

    HD.windowManager.enableResizing =
        function (
            instance,
            handle
        ) {

            let resizing =
                false;

            let startX =
                0;

            let startY =
                0;

            let startWidth =
                0;

            let startHeight =
                0;


            handle.addEventListener(
                "pointerdown",
                function (event) {

                    if (
                        instance.maximized
                    ) {
                        return;
                    }


                    resizing =
                        true;

                    startX =
                        event.clientX;

                    startY =
                        event.clientY;

                    startWidth =
                        instance
                            .element
                            .offsetWidth;

                    startHeight =
                        instance
                            .element
                            .offsetHeight;


                    handle.setPointerCapture(
                        event.pointerId
                    );


                    this.focus(
                        instance.element
                    );


                    event.preventDefault();

                }.bind(this)
            );


            handle.addEventListener(
                "pointermove",
                function (event) {

                    if (!resizing) {
                        return;
                    }


                    const minimumWidth =
                        HD.config
                            ?.minimumWindowWidth
                        || 360;

                    const minimumHeight =
                        HD.config
                            ?.minimumWindowHeight
                        || 240;


                    const width =
                        Math.max(
                            minimumWidth,
                            startWidth +
                            (
                                event.clientX -
                                startX
                            )
                        );


                    const height =
                        Math.max(
                            minimumHeight,
                            startHeight +
                            (
                                event.clientY -
                                startY
                            )
                        );


                    instance.element.style.width =
                        Math.min(
                            width,
                            window.innerWidth
                        ) + "px";

                    instance.element.style.height =
                        Math.min(
                            height,
                            window.innerHeight
                        ) + "px";

                }.bind(this)
            );


            handle.addEventListener(
                "pointerup",
                function () {

                    if (!resizing) {
                        return;
                    }

                    resizing =
                        false;

                    this.persistWindow(
                        instance
                    );

                }.bind(this)
            );


            handle.addEventListener(
                "pointercancel",
                function () {

                    resizing =
                        false;

                    this.persistWindow(
                        instance
                    );

                }.bind(this)
            );

        };


    /* =========================================================
       PERSIST WINDOW
       ========================================================= */

    HD.windowManager.persistWindow =
        function (instance) {

            if (!instance) {
                return;
            }


            const element =
                instance.element;


            this.saveState(
                instance.appId,
                {

                    x:
                        parseFloat(
                            element.style.left
                        ) || 0,

                    y:
                        parseFloat(
                            element.style.top
                        ) || 0,

                    width:
                        element.offsetWidth,

                    height:
                        element.offsetHeight

                },
                {

                    minimized:
                        instance.minimized,

                    maximized:
                        instance.maximized,

                    closed:
                        false

                }
            );

        };


    /* =========================================================
       CLOSE ALL
       ========================================================= */

    HD.windowManager.closeAll =
        function () {

            Array.from(
                this.windows.values()
            )
            .forEach(
                instance => {

                    this.close(
                        instance
                    );

                }
            );

        };


    /* =========================================================
       RESTORE PREVIOUS WINDOWS
       ========================================================= */

    HD.windowManager.restorePersistent =
        function () {

            if (!HD.appRegistry) {
                return;
            }


            HD.appRegistry
                .all()
                .forEach(
                    manifest => {

                        const state =
                            HD.appState
                                .ensure(
                                    manifest.id
                                );


                        /*
                         * Apps werden nicht automatisch
                         * geöffnet, wenn sie vorher
                         * ausdrücklich geschlossen wurden.
                         *
                         * Der Zustand bleibt trotzdem
                         * dauerhaft gespeichert.
                         */

                        if (
                            state.wasOpen === true
                        ) {

                            this.open(
                                manifest.id
                            );

                        }

                    }
                );

        };


    /* =========================================================
       WINDOW RESPONSIVENESS
       ========================================================= */

    HD.windowManager.adaptToViewport =
        function () {

            this.windows.forEach(
                instance => {

                    if (
                        instance.maximized
                    ) {
                        return;
                    }


                    const position =
                        this.clamp(
                            {

                                x:
                                    parseFloat(
                                        instance
                                            .element
                                            .style
                                            .left
                                    ) || 0,

                                y:
                                    parseFloat(
                                        instance
                                            .element
                                            .style
                                            .top
                                    ) || 0,

                                width:
                                    instance
                                        .element
                                        .offsetWidth,

                                height:
                                    instance
                                        .element
                                        .offsetHeight

                            }
                        );


                    instance.element.style.left =
                        position.x + "px";

                    instance.element.style.top =
                        position.y + "px";

                    instance.element.style.width =
                        position.width + "px";

                    instance.element.style.height =
                        position.height + "px";

                }
            );

        };


    window.addEventListener(
        "resize",
        function () {

            HD.windowManager
                .adaptToViewport();

        }
    );


    /* =========================================================
       CONNECT TO APP RUNTIME
       ========================================================= */

    if (
        HD.appRuntime
    ) {

        HD.appRuntime.openWindow =
            function (
                appId
            ) {

                return HD.windowManager
                    .open(
                        appId
                    );

            };


        HD.appRuntime.closeWindow =
            function (
                appId
            ) {

                const instance =
                    HD.windowManager
                        .get(
                            appId
                        );

                if (!instance) {
                    return false;
                }

                HD.windowManager.close(
                    instance
                );

                return true;

            };

    }


    /* =========================================================
       CONNECT TO APP MANAGER
       ========================================================= */

    HD.appManager =
        HD.appManager ||
        {};


    HD.appManager.open =
        function (
            appId
        ) {

            const manifest =
                HD.appRegistry
                    ?.get(
                        appId
                    );

            if (!manifest) {

                HD.notify(
                    "App nicht gefunden: " +
                    appId
                );

                return null;
            }


            const state =
                HD.appState.ensure(
                    appId
                );


            state.wasOpen =
                true;

            state.closed =
                false;

            state.updatedAt =
                Date.now();


            HD.appState.save(
                appId,
                state
            );


            const instance =
                HD.windowManager
                    .open(
                        appId
                    );


            HD.emit(
                "app:opened",
                {
                    appId,
                    instance
                }
            );


            return instance;

        };


    HD.appManager.close =
        function (
            appId
        ) {

            const instance =
                HD.windowManager
                    .get(
                        appId
                    );

            if (!instance) {
                return false;
            }


            const state =
                HD.appState.ensure(
                    appId
                );

            state.wasOpen =
                false;

            state.closed =
                true;

            HD.appState.save(
                appId,
                state
            );


            HD.windowManager.close(
                instance
            );


            HD.emit(
                "app:closed",
                {
                    appId
                }
            );


            return true;

        };


    HD.appManager.minimize =
        function (
            appId
        ) {

            const instance =
                HD.windowManager
                    .get(
                        appId
                    );

            if (!instance) {
                return false;
            }

            HD.windowManager.minimize(
                instance
            );

            return true;

        };


    HD.appManager.maximize =
        function (
            appId
        ) {

            const instance =
                HD.windowManager
                    .get(
                        appId
                    );

            if (!instance) {
                return false;
            }

            HD.windowManager.toggleMaximize(
                instance
            );

            return true;

        };


    HD.appManager.restore =
        function (
            appId
        ) {

            return this.open(
                appId
            );

        };


    HD.appManager.closeAll =
        function () {

            HD.windowManager.closeAll();

        };


    /* =========================================================
       REGISTER WINDOW MANAGER
       ========================================================= */

    HD.runtime.register(
        "window-manager",
        HD.windowManager
    );


    HD.runtime.register(
        "app-manager",
        HD.appManager
    );


    /* =========================================================
       SYSTEM EVENT CONNECTIONS
       ========================================================= */

    HD.on(
        "app:open",
        function (event) {

            if (
                event &&
                event.app
            ) {

                const appId =
                    event.app.id;

                if (appId) {

                    HD.appManager.open(
                        appId
                    );

                }

            }

        }
    );


    HD.on(
        "window:closed",
        function (event) {

            if (
                !event ||
                !event.appId
            ) {
                return;
            }


            const state =
                HD.appState.ensure(
                    event.appId
                );


            state.wasOpen =
                false;

            state.closed =
                true;

            HD.appState.save(
                event.appId,
                state
            );

        }
    );


    /* =========================================================
       APP DESKTOP STATE
       ========================================================= */

    HD.desktopState =
        HD.desktopState || {

            initialized:
                true,

            activeApp:
                null,

            openApps:
                [],

            update:
                function () {

                    this.openApps =
                        Array.from(
                            HD.windowManager
                                .windows
                                .keys()
                        );

                    this.activeApp =
                        HD.windowManager
                            .activeWindow
                            ?.dataset
                            ?.appId ||
                        null;

                }

        };


    HD.on(
        "window:created",
        function () {

            HD.desktopState.update();

        }
    );


    HD.on(
        "window:closed",
        function () {

            HD.desktopState.update();

        }
    );


    HD.on(
        "window:focus",
        function () {

            HD.desktopState.update();

        }
    );


    /* =========================================================
       START WINDOW SYSTEM
       ========================================================= */

    HD.windowManager.initialized =
        true;


    HD.emit(
        "window-system:ready",
        {
            status:
                "online"
        }
    );


})();

            return {

                text:
                    "Hallo ❤️ Ich bin HalDo. Schön, dass du da bist. Was möchtest du machen?"

            };
        }

        if (
            lower.includes(
                "wie geht"
            )
        ) {

            return {

                text:
                    "Mir geht es gut. Ich bin online und bereit, dir zu helfen."

            };
        }

        if (
            lower.includes(
                "version"
            )
        ) {

            return {

                text:
                    "Du verwendest HalDo AI OS " +
                    HD.version +
                    "."

            };
        }

        return {

            text:
                "Ich habe deine Nachricht verstanden. Ich bin HalDo AI im HalDo AI OS 22. Für eine vollständige KI-Antwort kann später ein echtes KI-Modell über die AI-Engine angebunden werden."

        };
    };


/* ============================================================
   AI CHAT UI
   ============================================================ */

HD.ai.openChat =
    function() {

        if (
            HD.appManager &&
            typeof HD.appManager.open ===
                "function"
        ) {

            HD.appManager.open(
                "haldo-ai"
            );

        }

    };


/* ============================================================
   UNIVERSAL APP CAPABILITIES
   ============================================================ */

HD.appCapabilities = {

    window: true,

    move: true,

    resize: true,

    minimize: true,

    maximize: true,

    close: true,

    state: true,

    storage: true,

    persistence: true,

    restore: true,

    reopen: true,

    content: true,

    events: true

};


/* ============================================================
   APP INITIALIZATION
   ============================================================ */

HD.appRegistry
    ?.all()
    .forEach(
        manifest => {

            if (
                !HD.appRuntime
            ) {
                return;
            }

            if (
                !HD.appRuntime.get(
                    manifest.id
                )
            ) {

                HD.appRuntime.create(
                    manifest
                );

            }

        }
    );


/* ============================================================
   SYSTEM BOOT
   ============================================================ */

HD.boot =
    HD.boot ||
    {};

HD.boot.completed =
    true;

HD.state.system.booted =
    true;

HD.state.system.ready =
    true;

HD.started =
    true;

HD.ready =
    true;


/* ============================================================
   STATUS UI
   ============================================================ */

function haldoSetOnlineStatus() {

    const dot =
        document.getElementById(
            "system-status-dot"
        );

    const text =
        document.getElementById(
            "system-status-text"
        );

    if (!dot || !text) {
        return;
    }

    const online =
        navigator.onLine;

    dot.className =
        online
            ? "status-dot online"
            : "status-dot offline";

    text.textContent =
        online
            ? "START · ONLINE"
            : "START · OFFLINE";

}


haldoSetOnlineStatus();


window.addEventListener(
    "online",
    haldoSetOnlineStatus
);

window.addEventListener(
    "offline",
    haldoSetOnlineStatus
);


/* ============================================================
   SAVE SYSTEM SNAPSHOT
   ============================================================ */

function haldoAutoSnapshot() {

    try {

        HD.recovery
            .createSnapshot();

    }
    catch (
        error
    ) {

        console.warn(
            "HalDo Snapshot:",
            error
        );

    }

}


haldoAutoSnapshot();


/* ============================================================
   APP RESTORATION
   ============================================================ */

function haldoRestoreLastApps() {

    const windows =
        HD.storage.get(
            "windows",
            {}
        );

    Object.keys(
        windows
    )
    .forEach(
        appId => {

            const saved =
                windows[appId];

            if (
                !saved ||
                !saved.reopen
            ) {
                return;
            }

            /*
             * Apps werden nicht blind automatisch
             * geöffnet. Der gespeicherte Zustand
             * bleibt erhalten und kann vom Window
             * Manager wiederhergestellt werden.
             */

            HD.emit(
                "app:restore-available",
                {
                    appId,
                    state:
                        saved
                }
            );

        }
    );

}


haldoRestoreLastApps();


/* ============================================================
   SERVICE REGISTRATION
   ============================================================ */

HD.services?.register(
    "ai",
    HD.ai
);

HD.services?.register(
    "recovery",
    HD.recovery
);

HD.services?.register(
    "backup",
    HD.backup
);

HD.services?.register(
    "update",
    HD.update
);

HD.services?.register(
    "pwa",
    HD.pwa
);


/* ============================================================
   FINAL EVENTS
   ============================================================ */

HD.emit(
    "boot:complete",
    {
        version:
            HD.version,

        status:
            "online",

        ready:
            true
    }
);

HD.emit(
    "system:started",
    {
        version:
            HD.version
    }
);


/* ============================================================
   OPTIONAL PWA REGISTRATION
   ============================================================ */

if (
    document.readyState ===
    "complete"
) {

    HD.pwa.register();

}
else {

    window.addEventListener(
        "load",
        function() {

            HD.pwa.register();

        },
        {
            once: true
        }
    );

}


/* ============================================================
   FINAL GLOBAL API
   ============================================================ */

window.HalDo =
    HD;


/* ============================================================
   CONSOLE INFORMATION
   ============================================================ */

console.log(
    "%cHalDo AI OS 22",
    "font-size:24px;font-weight:bold;"
);

console.log(
    "HalDo AI OS 22 gestartet.",
    HD.version
);

console.log(
    "System:",
    HD.system.status
);

console.log(
    "Apps:",
    HD.appRegistry?.all().length || 0
);

console.log(
    "AI:",
    HD.ai.status
);

console.log(
    "Persistence:",
    HD.config?.persistence
);


/* ============================================================
   FINAL HTML DOCUMENT CLOSING
   ============================================================ */

</script>

</body>
</html>
