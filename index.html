   PART 3 / 8
   WINDOW + APP EXPERIENCE RUNTIME
   ================================================================ */

(function initHalDoPart3() {

    const HalDo =
        window.HalDo ||
        (window.HalDo = {});

    /* ============================================================
       DOM LAYERS
       ============================================================ */

    const appLayer =
        document.getElementById(
            "haldo-app-layer"
        ) ||
        createLayer(
            "haldo-app-layer"
        );

    const windowLayer =
        document.getElementById(
            "haldo-window-layer"
        ) ||
        createLayer(
            "haldo-window-layer"
        );

    const notificationCenter =
        document.getElementById(
            "haldo-notification-center"
        ) ||
        createLayer(
            "haldo-notification-center"
        );

    function createLayer(id) {

        const element =
            document.createElement("div");

        element.id = id;

        const os =
            document.getElementById(
                "haldo-os"
            ) ||
            document.body;

        os.appendChild(element);

        return element;
    }

    /* ============================================================
       APP RUNTIME
       ============================================================ */

    HalDo.runtime =
        HalDo.runtime ||
        {};

    HalDo.runtime.apps =
        HalDo.runtime.apps ||
        new Map();

    HalDo.runtime.windows =
        HalDo.runtime.windows ||
        new Map();

    /* ============================================================
       WINDOW SIZE SETTINGS
       ============================================================ */

    HalDo.windowSettings =
        HalDo.windowSettings ||
        {

            width:
                Number(
                    HalDo.storage?.get(
                        "window-width",
                        760
                    )
                ),

            height:
                Number(
                    HalDo.storage?.get(
                        "window-height",
                        560
                    )
                ),

            minWidth: 280,

            minHeight: 220,

            maxWidth: 1600,

            maxHeight: 1100

        };

    function clamp(
        value,
        minimum,
        maximum
    ) {

        return Math.max(
            minimum,
            Math.min(
                maximum,
                Number(value)
            )
        );

    }

    /* ============================================================
       APPLY GLOBAL WINDOW SIZE
       ============================================================ */

    function applyWindowSize() {

        document.documentElement
            .style
            .setProperty(
                "--haldo-window-width",
                `${HalDo.windowSettings.width}px`
            );

        document.documentElement
            .style
            .setProperty(
                "--haldo-window-height",
                `${HalDo.windowSettings.height}px`
            );

    }

    applyWindowSize();

    /* ============================================================
       WINDOW ID
       ============================================================ */

    function createWindowId(
        appId
    ) {

        if (
            HalDo.utils &&
            typeof HalDo.utils.id ===
                "function"
        ) {

            return HalDo.utils.id(
                `window-${appId}`
            );

        }

        return (
            `window-${appId}-` +
            Date.now().toString(36)
        );

    }

    /* ============================================================
       APP DEFINITION
       ============================================================ */

    function getApp(
        appId
    ) {

        if (
            HalDo.registry &&
            typeof HalDo.registry.get ===
                "function"
        ) {

            return HalDo.registry.get(
                appId
            );

        }

        return null;
    }

    /* ============================================================
       APP WINDOW CREATION
       ============================================================ */

    function createAppWindow(
        appId,
        options = {}
    ) {

        const app =
            getApp(appId);

        if (!app) {

            console.warn(
                "[HalDo Runtime] App not registered:",
                appId
            );

            return null;
        }

        const windowId =
            createWindowId(appId);

        const windowElement =
            document.createElement(
                "section"
            );

        windowElement.className =
            "haldo-app-window";

        windowElement.dataset.appId =
            appId;

        windowElement.dataset.windowId =
            windowId;

        const width =
            clamp(
                options.width ??
                HalDo.windowSettings.width,
                HalDo.windowSettings.minWidth,
                HalDo.windowSettings.maxWidth
            );

        const height =
            clamp(
                options.height ??
                HalDo.windowSettings.height,
                HalDo.windowSettings.minHeight,
                HalDo.windowSettings.maxHeight
            );

        windowElement.style.setProperty(
            "--haldo-window-width",
            `${width}px`
        );

        windowElement.style.setProperty(
            "--haldo-window-height",
            `${height}px`
        );

        windowElement.innerHTML = `

            <header
                class="haldo-window-header"
                data-window-drag-handle
            >

                <div
                    class="haldo-window-title-area"
                >

                    <div
                        class="haldo-window-icon"
                    >
                        ${app.icon || "◈"}
                    </div>

                    <div>

                        <div
                            class="haldo-window-title"
                        >
                            ${escapeHTML(
                                app.name ||
                                app.id
                            )}
                        </div>

                        <div
                            class="haldo-window-subtitle"
                        >
                            ${escapeHTML(
                                app.description ||
                                "HalDo AI OS Anwendung"
                            )}
                        </div>

                    </div>

                </div>

                <div
                    class="haldo-window-actions"
                >

                    <button
                        class="haldo-window-action"
                        type="button"
                        data-window-action="minimize"
                        aria-label="Minimieren"
                        title="Minimieren"
                    >
                        −
                    </button>

                    <button
                        class="haldo-window-action"
                        type="button"
                        data-window-action="maximize"
                        aria-label="Maximieren"
                        title="Maximieren"
                    >
                        □
                    </button>

                    <button
                        class="haldo-window-action close"
                        type="button"
                        data-window-action="close"
                        aria-label="Schließen"
                        title="Schließen"
                    >
                        ×
                    </button>

                </div>

            </header>

            <div
                class="haldo-window-content"
                data-window-content
            ></div>

            <footer
                class="haldo-window-footer"
            >

                <span>
                    HalDo AI OS 20
                </span>

                <span>
                    ${escapeHTML(
                        app.category ||
                        "application"
                    )}
                </span>

            </footer>

        `;

        windowLayer.appendChild(
            windowElement
        );

        HalDo.runtime.windows.set(
            windowId,
            {
                id: windowId,
                appId,
                element: windowElement,
                minimized: false,
                maximized: false,
                width,
                height
            }
        );

        if (
            HalDo.windowManager &&
            typeof HalDo.windowManager.register ===
                "function"
        ) {

            HalDo.windowManager.register(
                windowId,
                windowElement
            );

        }

        setupWindowActions(
            windowId,
            windowElement
        );

        setupWindowDragging(
            windowId,
            windowElement
        );

        setupWindowTouchBehavior(
            windowId,
            windowElement
        );

        focusWindow(
            windowId
        );

        return {
            id: windowId,
            element: windowElement
        };

    }

    /* ============================================================
       ESCAPE HTML
       ============================================================ */

    function escapeHTML(
        value
    ) {

        if (
            HalDo.utils &&
            typeof HalDo.utils.escape ===
                "function"
        ) {

            return HalDo.utils.escape(
                value
            );

        }

        return String(value)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );

    }

    /* ============================================================
       WINDOW ACTIONS
       ============================================================ */

    function setupWindowActions(
        windowId,
        element
    ) {

        element.addEventListener(
            "click",
            event => {

                const button =
                    event.target.closest(
                        "[data-window-action]"
                    );

                if (!button) {
                    return;
                }

                const action =
                    button.dataset
                        .windowAction;

                if (
                    action ===
                    "close"
                ) {

                    closeWindow(
                        windowId
                    );

                }

                else if (
                    action ===
                    "minimize"
                ) {

                    minimizeWindow(
                        windowId
                    );

                }

                else if (
                    action ===
                    "maximize"
                ) {

                    toggleMaximizeWindow(
                        windowId
                    );

                }

            }
        );

        element.addEventListener(
            "pointerdown",
            () => {

                focusWindow(
                    windowId
                );

            }
        );

    }

    /* ============================================================
       FOCUS WINDOW
       ============================================================ */

    function focusWindow(
        windowId
    ) {

        const runtimeWindow =
            HalDo.runtime.windows.get(
                windowId
            );

        if (!runtimeWindow) {
            return false;
        }

        if (
            HalDo.windowManager &&
            typeof HalDo.windowManager.focus ===
                "function"
        ) {

            HalDo.windowManager.focus(
                windowId
            );

        }
        else {

            HalDo.runtime.zIndex =
                (HalDo.runtime.zIndex || 300) +
                1;

            runtimeWindow.element.style
                .zIndex =
                String(
                    HalDo.runtime.zIndex
                );

        }

        HalDo.state.activeWindow =
            windowId;

        HalDo.state.activeApp =
            runtimeWindow.appId;

        HalDo.emit?.(
            "window:activated",
            {
                id: windowId,
                appId:
                    runtimeWindow.appId
            }
        );

        return true;
    }

    /* ============================================================
       MINIMIZE
       ============================================================ */

    function minimizeWindow(
        windowId
    ) {

        const runtimeWindow =
            HalDo.runtime.windows.get(
                windowId
            );

        if (!runtimeWindow) {
            return false;
        }

        runtimeWindow.minimized =
            !runtimeWindow.minimized;

        runtimeWindow.element.classList
            .toggle(
                "minimized",
                runtimeWindow.minimized
            );

        if (
            !runtimeWindow.minimized
        ) {

            focusWindow(
                windowId
            );

        }

        HalDo.emit?.(
            "window:minimized",
            {
                id: windowId,
                minimized:
                    runtimeWindow.minimized
            }
        );

        return true;
    }

    /* ============================================================
       MAXIMIZE
       ============================================================ */

    function toggleMaximizeWindow(
        windowId
    ) {

        const runtimeWindow =
            HalDo.runtime.windows.get(
                windowId
            );

        if (!runtimeWindow) {
            return false;
        }

        runtimeWindow.maximized =
            !runtimeWindow.maximized;

        runtimeWindow.element.classList
            .toggle(
                "maximized",
                runtimeWindow.maximized
            );

        if (
            runtimeWindow.maximized
        ) {

            runtimeWindow.element
                .dataset.previousWidth =
                String(
                    runtimeWindow.width
                );

            runtimeWindow.element
                .dataset.previousHeight =
                String(
                    runtimeWindow.height
                );

        }

        else {

            const previousWidth =
                Number(
                    runtimeWindow.element
                        .dataset
                        .previousWidth ||
                    runtimeWindow.width
                );

            const previousHeight =
                Number(
                    runtimeWindow.element
                        .dataset
                        .previousHeight ||
                    runtimeWindow.height
                );

            runtimeWindow.element.style
                .setProperty(
                    "--haldo-window-width",
                    `${previousWidth}px`
                );

            runtimeWindow.element.style
                .setProperty(
                    "--haldo-window-height",
                    `${previousHeight}px`
                );

        }

        focusWindow(
            windowId
        );

        HalDo.emit?.(
            "window:maximized",
            {
                id: windowId,
                maximized:
                    runtimeWindow.maximized
            }
        );

        return true;
    }

    /* ============================================================
       CLOSE
       ============================================================ */

    function closeWindow(
        windowId
    ) {

        const runtimeWindow =
            HalDo.runtime.windows.get(
                windowId
            );

        if (!runtimeWindow) {
            return false;
        }

        const appId =
            runtimeWindow.appId;

        runtimeWindow.element
            .style
            .opacity = "0";

        runtimeWindow.element
            .style
            .transform =
                "translate(-50%, -50%) scale(.96)";

        window.setTimeout(
            () => {

                runtimeWindow.element
                    .remove();

                HalDo.runtime.windows
                    .delete(
                        windowId
                    );

                if (
                    HalDo.windowManager
                ) {

                    HalDo.windowManager.windows
                        ?.delete?.(
                            windowId
                        );

                }

                if (
                    HalDo.state.activeWindow ===
                    windowId
                ) {

                    HalDo.state.activeWindow =
                        null;

                }

                if (
                    HalDo.state.activeApp ===
                    appId
                ) {

                    HalDo.state.activeApp =
                        null;

                }

                HalDo.emit?.(
                    "app:closed",
                    {
                        appId,
                        windowId
                    }
                );

            },
            160
        );

        return true;
    }

    /* ============================================================
       DRAGGING — MOUSE + POINTER
       ============================================================ */

    function setupWindowDragging(
        windowId,
        element
    ) {

        const handle =
            element.querySelector(
                "[data-window-drag-handle]"
            );

        if (!handle) {
            return;
        }

        let dragging = false;

        let startX = 0;
        let startY = 0;

        let startLeft = 0;
        let startTop = 0;

        handle.addEventListener(
            "pointerdown",
            event => {

                const runtimeWindow =
                    HalDo.runtime.windows.get(
                        windowId
                    );

                if (
                    !runtimeWindow ||
                    runtimeWindow.maximized
                ) {
                    return;
                }

                dragging = true;

                handle.setPointerCapture?.(
                    event.pointerId
                );

                const rect =
                    element.getBoundingClientRect();

                startX =
                    event.clientX;

                startY =
                    event.clientY;

                startLeft =
                    rect.left;

                startTop =
                    rect.top;

                element.dataset.dragging =
                    "true";

                event.preventDefault();

            }
        );

        handle.addEventListener(
            "pointermove",
            event => {

                if (!dragging) {
                    return;
                }

                const deltaX =
                    event.clientX -
                    startX;

                const deltaY =
                    event.clientY -
                    startY;

                let left =
                    startLeft +
                    deltaX;

                let top =
                    startTop +
                    deltaY;

                const width =
                    element.offsetWidth;

                const height =
                    element.offsetHeight;

                const margin = 8;

                left =
                    clamp(
                        left,
                        margin,
                        window.innerWidth -
                        width -
                        margin
                    );

                top =
                    clamp(
                        top,
                        margin + 65,
                        window.innerHeight -
                        height -
                        margin
                    );

                element.style.left =
                    `${left}px`;

                element.style.top =
                    `${top}px`;

                element.style.transform =
                    "none";

            }
        );

        const finishDragging =
            event => {

                if (!dragging) {
                    return;
                }

                dragging = false;

                element.dataset.dragging =
                    "false";

                try {

                    handle.releasePointerCapture?.(
                        event.pointerId
                    );

                } catch (_) {}

            };

        handle.addEventListener(
            "pointerup",
            finishDragging
        );

        handle.addEventListener(
            "pointercancel",
            finishDragging
        );

    }

    /* ============================================================
       TOUCH BEHAVIOR
       ============================================================ */

    function setupWindowTouchBehavior(
        windowId,
        element
    ) {

        element.addEventListener(
            "touchstart",
            () => {

                focusWindow(
                    windowId
                );

            },
            {
                passive: true
            }
        );

    }

    /* ============================================================
       PUBLIC WINDOW API
       ============================================================ */

    HalDo.runtime.openWindow =
        function (
            appId,
            options = {}
        ) {

            const app =
                getApp(appId);

            if (!app) {
                return null;
            }

            const existing =
                Array.from(
                    HalDo.runtime.windows
                        .values()
                )
                .find(
                    item =>
                        item.appId ===
                        appId &&
                        !item.minimized
                );

            if (
                existing &&
                options.singleInstance !== false
            ) {

                focusWindow(
                    existing.id
                );

                return existing;
            }

            const result =
                createAppWindow(
                    appId,
                    options
                );

            if (!result) {
                return null;
            }

            HalDo.emit?.(
                "app:window-opened",
                {
                    appId,
                    windowId:
                        result.id
                }
            );

            return result;

        };

    HalDo.runtime.closeWindow =
        closeWindow;

    HalDo.runtime.minimizeWindow =
        minimizeWindow;

    HalDo.runtime.maximizeWindow =
        toggleMaximizeWindow;

    HalDo.runtime.focusWindow =
        focusWindow;

    /* ============================================================
       APP SIZE API
       ============================================================ */

    HalDo.runtime.setDefaultWindowSize =
        function (
            width,
            height
        ) {

            width =
                clamp(
                    width,
                    HalDo.windowSettings.minWidth,
                    HalDo.windowSettings.maxWidth
                );

            height =
                clamp(
                    height,
                    HalDo.windowSettings.minHeight,
                    HalDo.windowSettings.maxHeight
                );

            HalDo.windowSettings.width =
                width;

            HalDo.windowSettings.height =
                height;

            HalDo.storage?.set(
                "window-width",
                width
            );

            HalDo.storage?.set(
                "window-height",
                height
            );

            applyWindowSize();

            HalDo.emit?.(
                "window:default-size-changed",
                {
                    width,
                    height
                }
            );

        };

    /* ============================================================
       NOTIFICATION API
       ============================================================ */

    HalDo.notify =
        function (
            title,
            message,
            options = {}
        ) {

            const notification =
                document.createElement(
                    "article"
                );

            notification.className =
                "haldo-notification";

            notification.innerHTML = `

                <div
                    class="haldo-notification-title"
                >
                    ${escapeHTML(
                        title ||
                        "HalDo"
                    )}
                </div>

                <div
                    class="haldo-notification-message"
                >
                    ${escapeHTML(
                        message ||
                        ""
                    )}
                </div>

            `;

            notificationCenter
                .prepend(
                    notification
                );

            const duration =
                Number(
                    options.duration ??
                    4200
                );

            if (
                duration > 0
            ) {

                window.setTimeout(
                    () => {

                        notification
                            .style
                            .opacity = "0";

                        notification
                            .style
                            .transform =
                                "translateY(-8px)";

                        window.setTimeout(
                            () =>
                                notification
                                    .remove(),
                            180
                        );

                    },
                    duration
                );

            }

            return notification;
        };

    /* ============================================================
       APP REGISTRATION HELPER
       ============================================================ */

    HalDo.runtime.registerApp =
        function (
            definition
        ) {

            if (
                !definition ||
                !definition.id
            ) {

                return false;
            }

            HalDo.runtime.apps.set(
                definition.id,
                definition
            );

            if (
                HalDo.registry &&
                !HalDo.registry.has(
                    definition.id
                )
            ) {

                HalDo.registry.register(
                    definition
                );

            }

            HalDo.emit?.(
                "runtime:app-registered",
                {
                    id:
                        definition.id
                }
            );

            return true;

        };

    /* ============================================================
       CONNECT APP MANAGER
       ============================================================ */

    if (
        HalDo.appManager
    ) {

        const originalOpen =
            HalDo.appManager.open;

        HalDo.appManager.open =
            async function (
                id,
                options = {}
            ) {

                const result =
                    await originalOpen?.call(
                        this,
                        id
                    );

                if (
                    result === false
                ) {

                    return false;
                }

                const app =
                    getApp(id);

                if (!app) {
                    return false;
                }

                const window =
                    HalDo.runtime.openWindow(
                        id,
                        options
                    );

                if (!window) {
                    return false;
                }

                return true;

            };

    }

    /* ============================================================
       KEYBOARD WINDOW CONTROLS
       ============================================================ */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                const activeId =
                    HalDo.state
                        .activeWindow;

                if (
                    activeId &&
                    HalDo.runtime.windows
                        .has(activeId)
                ) {

                    closeWindow(
                        activeId
                    );

                }

            }

            if (
                event.altKey &&
                event.key === "F4"
            ) {

                event.preventDefault();

                const activeId =
                    HalDo.state
                        .activeWindow;

                if (activeId) {

                    closeWindow(
                        activeId
                    );

                }

            }

        }
    );

    /* ============================================================
       RESIZE SAFETY
       ============================================================ */

    window.addEventListener(
        "resize",
        () => {

            HalDo.runtime.windows
                .forEach(
                    runtimeWindow => {

                        if (
                            runtimeWindow
                                .maximized
                        ) {
                            return;
                        }

                        const element =
                            runtimeWindow
                                .element;

                        const rect =
                            element
                                .getBoundingClientRect();

                        const maxLeft =
                            window.innerWidth -
                            rect.width -
                            8;

                        const maxTop =
                            window.innerHeight -
                            rect.height -
                            8;

                        if (
                            rect.left >
                            maxLeft
                        ) {

                            element.style.left =
                                `${Math.max(
                                    8,
                                    maxLeft
                                )}px`;

                            element.style.transform =
                                "none";
                        }

                        if (
                            rect.top >
                            maxTop
                        ) {

                            element.style.top =
                                `${Math.max(
                                    70,
                                    maxTop
                                )}px`;

                            element.style.transform =
                                "none";
                        }

                    }
                );

        }
    );

    /* ============================================================
       PART READY
       ============================================================ */

    HalDo.emit?.(
        "foundation:part3-ready",
        {
            version:
                HalDo.version ||
                "20.0.0",

            module:
                "window-runtime",

            status:
                "ready"
        }
    );

})();

</script>
<script>
"use strict";

/* ================================================================
   HALDO AI OS 20
   INDEX SHELL
   PART 4 / 8
   APP WINDOW ENGINE
   ================================================================ */

(function HalDoWindowEngine() {

    const HalDo = window.HalDo;

    if (!HalDo) {
        console.error("[HalDo] Foundation fehlt.");
        return;
    }

    /* ============================================================
       WINDOW CONFIGURATION
       ============================================================ */

    HalDo.windowConfig = {

        defaultWidth: 760,
        defaultHeight: 520,

        minWidth: 320,
        minHeight: 220,

        maxWidthRatio: 0.92,
        maxHeightRatio: 0.82,

        mobileWidthRatio: 0.94,
        mobileHeightRatio: 0.78,

        gap: 18,

        titleBarHeight: 52,

        resizable: true,
        draggable: true,

        rememberSize: true,
        rememberPosition: true

    };

    /* ============================================================
       WINDOW STATE
       ============================================================ */

    HalDo.windowState = {

        windows: new Map(),

        activeId: null,

        counter: 0,

        cascadeIndex: 0,

        dragging: null,

        resizing: null

    };

    /* ============================================================
       DOM HELPERS
       ============================================================ */

    function workspace() {

        return document.getElementById(
            "haldo-workspace"
        );

    }

    function isMobile() {

        return window.innerWidth <= 760;

    }

    function clamp(
        value,
        min,
        max
    ) {

        return Math.min(
            Math.max(value, min),
            max
        );

    }

    /* ============================================================
       WINDOW SIZE
       ============================================================ */

    function getDefaultSize() {

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;

        if (isMobile()) {

            return {

                width:
                    Math.max(
                        HalDo.windowConfig.minWidth,
                        Math.floor(
                            width *
                            HalDo.windowConfig.mobileWidthRatio
                        )
                    ),

                height:
                    Math.max(
                        HalDo.windowConfig.minHeight,
                        Math.floor(
                            height *
                            HalDo.windowConfig.mobileHeightRatio
                        )
                    )

            };

        }

        return {

            width:
                Math.min(
                    HalDo.windowConfig.defaultWidth,
                    Math.floor(
                        width *
                        HalDo.windowConfig.maxWidthRatio
                    )
                ),

            height:
                Math.min(
                    HalDo.windowConfig.defaultHeight,
                    Math.floor(
                        height *
                        HalDo.windowConfig.maxHeightRatio
                    )
                )

        };

    }

    /* ============================================================
       DEFAULT POSITION
       ============================================================ */

    function getDefaultPosition(
        width,
        height
    ) {

        const area =
            workspace();

        if (!area) {

            return {
                left: 30,
                top: 30
            };

        }

        const rect =
            area.getBoundingClientRect();

        const offset =
            (
                HalDo.windowState.cascadeIndex %
                6
            ) * 24;

        HalDo.windowState.cascadeIndex += 1;

        return {

            left:
                Math.max(
                    12,
                    (
                        rect.width -
                        width
                    ) / 2 +
                    offset -
                    60
                ),

            top:
                Math.max(
                    12,
                    (
                        rect.height -
                        height
                    ) / 2 +
                    offset -
                    30
                )

        };

    }

    /* ============================================================
       PERSISTED WINDOW SETTINGS
       ============================================================ */

    function getSavedWindow(
        appId
    ) {

        if (
            !HalDo.windowConfig.rememberSize &&
            !HalDo.windowConfig.rememberPosition
        ) {

            return null;

        }

        return HalDo.storage.get(
            "window." + appId,
            null
        );

    }

    function saveWindow(
        appId,
        windowElement
    ) {

        if (!windowElement) {
            return;
        }

        const saved =
            getSavedWindow(appId) ||
            {};

        const data = {

            width:
                HalDo.windowConfig.rememberSize
                    ? windowElement.offsetWidth
                    : saved.width,

            height:
                HalDo.windowConfig.rememberSize
                    ? windowElement.offsetHeight
                    : saved.height,

            left:
                HalDo.windowConfig.rememberPosition
                    ? parseFloat(
                        windowElement.style.left
                    )
                    : saved.left,

            top:
                HalDo.windowConfig.rememberPosition
                    ? parseFloat(
                        windowElement.style.top
                    )
                    : saved.top

        };

        HalDo.storage.set(
            "window." + appId,
            data
        );

    }

    /* ============================================================
       CREATE WINDOW
       ============================================================ */

    function createWindow(
        app,
        options = {}
    ) {

        const area =
            workspace();

        if (!area) {

            console.error(
                "[HalDo Window] Workspace fehlt."
            );

            return null;

        }

        const appId =
            String(app.id);

        const existing =
            HalDo.windowState.windows.get(
                appId
            );

        if (existing) {

            if (
                existing.classList.contains(
                    "minimized"
                )
            ) {

                existing.classList.remove(
                    "minimized"
                );

            }

            focusWindow(appId);

            return existing;

        }

        const size =
            getDefaultSize();

        const saved =
            getSavedWindow(appId);

        const width =
            clamp(
                Number(
                    saved?.width ||
                    options.width ||
                    size.width
                ),
                HalDo.windowConfig.minWidth,
                window.innerWidth
            );

        const height =
            clamp(
                Number(
                    saved?.height ||
                    options.height ||
                    size.height
                ),
                HalDo.windowConfig.minHeight,
                window.innerHeight
            );

        const position =
            getDefaultPosition(
                width,
                height
            );

        const left =
            Number.isFinite(
                Number(saved?.left)
            )
                ? Number(saved.left)
                : Number.isFinite(
                    Number(options.left)
                )
                    ? Number(options.left)
                    : position.left;

        const top =
            Number.isFinite(
                Number(saved?.top)
            )
                ? Number(saved.top)
                : Number.isFinite(
                    Number(options.top)
                )
                    ? Number(options.top)
                    : position.top;

        const windowId =
            "window-" +
            appId +
            "-" +
            (++HalDo.windowState.counter);

        const element =
            document.createElement(
                "section"
            );

        element.className =
            "haldo-app-window";

        element.dataset.appId =
            appId;

        element.dataset.windowId =
            windowId;

        element.setAttribute(
            "role",
            "dialog"
        );

        element.setAttribute(
            "aria-label",
            app.name
        );

        element.style.width =
            width + "px";

        element.style.height =
            height + "px";

        element.style.left =
            left + "px";

        element.style.top =
            top + "px";

        element.innerHTML = `

            <div
                class="haldo-window-titlebar"
                data-window-drag-handle
            >

                <div class="haldo-window-title">

                    <div
                        class="haldo-window-icon"
                        aria-hidden="true"
                    >
                        ${HalDo.utils.escape(
                            app.icon || "◈"
                        )}
                    </div>

                    <div
                        class="haldo-window-title-text"
                    >
                        ${HalDo.utils.escape(
                            app.name
                        )}
                    </div>

                </div>

                <div
                    class="haldo-window-controls"
                >

                    <button
                        type="button"
                        class="haldo-window-control"
                        data-window-action="minimize"
                        aria-label="Minimieren"
                        title="Minimieren"
                    >
                        −
                    </button>

                    <button
                        type="button"
                        class="haldo-window-control"
                        data-window-action="maximize"
                        aria-label="Maximieren"
                        title="Maximieren"
                    >
                        □
                    </button>

                    <button
                        type="button"
                        class="haldo-window-control close"
                        data-window-action="close"
                        aria-label="Schließen"
                        title="Schließen"
                    >
                        ×
                    </button>

                </div>

            </div>

            <div
                class="haldo-window-content"
                data-window-content
            ></div>

            <div
                class="haldo-window-resize-handle"
                aria-hidden="true"
            ></div>

        `;

        area.appendChild(
            element
        );

        HalDo.windowState.windows.set(
            appId,
            element
        );

        HalDo.windowManager.register(
            appId,
            element
        );

        bindWindowEvents(
            app,
            element
        );

        renderAppContent(
            app,
            element,
            options
        );

        focusWindow(
            appId
        );

        HalDo.emit(
            "window:created",
            {
                app,
                element,
                windowId
            }
        );

        return element;

    }

    /* ============================================================
       APP CONTENT ROUTER
       ============================================================ */

    function renderAppContent(
        app,
        element,
        options
    ) {

        const content =
            element.querySelector(
                "[data-window-content]"
            );

        if (!content) {
            return;
        }

        /*
         * Bereits registrierte App-Renderer
         */

        const renderer =
            HalDo.appRenderers &&
            HalDo.appRenderers.get(
                app.id
            );

        if (
            typeof renderer ===
            "function"
        ) {

            try {

                renderer(
                    content,
                    {
                        app,
                        window: element,
                        options,
                        HalDo
                    }
                );

                return;

            } catch (error) {

                console.error(
                    "[HalDo App Renderer]",
                    app.id,
                    error
                );

                renderAppError(
                    content,
                    app,
                    error
                );

                return;

            }

        }

        /*
         * Falls ein bestehendes App-Modul
         * eine open/render-Methode registriert hat.
         */

        if (
            app.module &&
            typeof app.module.render ===
            "function"
        ) {

            try {

                app.module.render(
                    content,
                    {
                        app,
                        window: element,
                        options,
                        HalDo
                    }
                );

                return;

            } catch (error) {

                console.error(
                    "[HalDo App Module]",
                    app.id,
                    error
                );

                renderAppError(
                    content,
                    app,
                    error
                );

                return;

            }

        }

        /*
         * Sichere Foundation-Oberfläche.
         * Die späteren App-Module können diesen
         * Renderer überschreiben.
         */

        content.innerHTML = `

            <div
                class="haldo-app-placeholder"
            >

                <div
                    class="haldo-app-placeholder-icon"
                    aria-hidden="true"
                >
                    ${HalDo.utils.escape(
                        app.icon || "◈"
                    )}
                </div>

                <h2>
                    ${HalDo.utils.escape(
                        app.name
                    )}
                </h2>

                <p>
                    ${
                        HalDo.utils.escape(
                            app.description ||
                            "Diese HalDo-App ist im System registriert und für die vollständige App-Runtime vorbereitet."
                        )
                    }
                </p>

            </div>

        `;

    }

    /* ============================================================
       ERROR VIEW
       ============================================================ */

    function renderAppError(
        content,
        app,
        error
    ) {

        content.innerHTML = `

            <div
                class="haldo-app-placeholder"
            >

                <div
                    class="haldo-app-placeholder-icon"
                    aria-hidden="true"
                >
                    ⚠
                </div>

                <h2>
                    ${HalDo.utils.escape(
                        app.name
                    )}
                </h2>

                <p>
                    Beim Starten dieser App ist
                    ein Fehler aufgetreten.
                </p>

                <p>
                    ${
                        HalDo.utils.escape(
                            error?.message ||
                            "Unbekannter Fehler"
                        )
                    }
                </p>

            </div>

        `;

    }

    /* ============================================================
       WINDOW EVENT BINDING
       ============================================================ */

    function bindWindowEvents(
        app,
        element
    ) {

        element.addEventListener(
            "pointerdown",
            () => {

                focusWindow(
                    app.id
                );

            }
        );

        const controls =
            element.querySelector(
                ".haldo-window-controls"
            );

        if (controls) {

            controls.addEventListener(
                "click",
                event => {

                    const button =
                        event.target.closest(
                            "[data-window-action]"
                        );

                    if (!button) {
                        return;
                    }

                    event.stopPropagation();

                    const action =
                        button.dataset.windowAction;

                    if (
                        action ===
                        "minimize"
                    ) {

                        minimizeWindow(
                            app.id
                        );

                    }

                    if (
                        action ===
                        "maximize"
                    ) {

                        toggleMaximize(
                            app.id
                        );

                    }

                    if (
                        action ===
                        "close"
                    ) {

                        closeWindow(
                            app.id
                        );

                    }

                }
            );

        }

        const handle =
            element.querySelector(
                "[data-window-drag-handle]"
            );

        if (
            handle &&
            HalDo.windowConfig.draggable
        ) {

            handle.addEventListener(
                "pointerdown",
                startDragging
            );

        }

        element.addEventListener(
            "dblclick",
            event => {

                if (
                    event.target.closest(
                        ".haldo-window-controls"
                    )
                ) {

                    return;

                }

                toggleMaximize(
                    app.id
                );

            }
        );

        element.addEventListener(
            "pointerup",
            () => {

                saveWindow(
                    app.id,
                    element
                );

            }
        );

        element.addEventListener(
            "mouseup",
            () => {

                saveWindow(
                    app.id,
                    element
                );

            }
        );

    }

    /* ============================================================
       FOCUS
       ============================================================ */

    function focusWindow(
        appId
    ) {

        const element =
            HalDo.windowState.windows.get(
                appId
            );

        if (!element) {
            return false;
        }

        HalDo.windowState.windows.forEach(
            other => {

                other.classList.remove(
                    "active"
                );

            }
        );

        HalDo.windowState.counter += 1;

        element.style.zIndex =
            String(
                300 +
                HalDo.windowState.counter
            );

        element.classList.add(
            "active"
        );

        HalDo.windowState.activeId =
            appId;

        HalDo.state.activeApp =
            appId;

        HalDo.state.activeWindow =
            element.dataset.windowId;

        HalDo.emit(
            "window:focused",
            {
                appId,
                element
            }
        );

        return true;

    }

    /* ============================================================
       MINIMIZE
       ============================================================ */

    function minimizeWindow(
        appId
    ) {

        const element =
            HalDo.windowState.windows.get(
                appId
            );

        if (!element) {
            return false;
        }

        saveWindow(
            appId,
            element
        );

        element.classList.add(
            "minimized"
        );

        HalDo.emit(
            "window:minimized",
            {
                appId,
                element
            }
        );

        return true;

    }

    /* ============================================================
       MAXIMIZE
       ============================================================ */

    function toggleMaximize(
        appId
    ) {

        const element =
            HalDo.windowState.windows.get(
                appId
            );

        if (!element) {
            return false;
        }

        const isMaximized =
            element.classList.contains(
                "maximized"
            );

        if (!isMaximized) {

            element.dataset.restoreWidth =
                element.offsetWidth;

            element.dataset.restoreHeight =
                element.offsetHeight;

            element.dataset.restoreLeft =
                element.style.left;

            element.dataset.restoreTop =
                element.style.top;

            element.classList.add(
                "maximized"
            );

        } else {

            element.classList.remove(
                "maximized"
            );

            if (
                element.dataset.restoreWidth
            ) {

                element.style.width =
                    element.dataset.restoreWidth +
                    "px";

            }

            if (
                element.dataset.restoreHeight
            ) {

                element.style.height =
                    element.dataset.restoreHeight +
                    "px";

            }

            if (
                element.dataset.restoreLeft
            ) {

                element.style.left =
                    element.dataset.restoreLeft;

            }

            if (
                element.dataset.restoreTop
            ) {

                element.style.top =
                    element.dataset.restoreTop;

            }

        }

        focusWindow(
            appId
        );

        saveWindow(
            appId,
            element
        );

        HalDo.emit(
            "window:maximize-toggle",
            {
                appId,
                maximized:
                    !isMaximized
            }
        );

        return true;

    }

    /* ============================================================
       CLOSE
       ============================================================ */

    function closeWindow(
        appId
    ) {

        const element =
            HalDo.windowState.windows.get(
                appId
            );

        if (!element) {
            return false;
        }

        saveWindow(
            appId,
            element
        );

        const app =
            HalDo.registry.get(
                appId
            );

        try {

            if (
                app &&
                app.module &&
                typeof app.module.destroy ===
                "function"
            ) {

                app.module.destroy(
                    {
                        window: element,
                        HalDo
                    }
                );

            }

        } catch (error) {

            console.error(
                "[HalDo App Destroy]",
                appId,
                error
            );

        }

        element.remove();

        HalDo.windowState.windows.delete(
            appId
        );

        HalDo.windowManager.windows.delete(
            appId
        );

        if (
            HalDo.windowState.activeId ===
            appId
        ) {

            HalDo.windowState.activeId =
                null;

            HalDo.state.activeApp =
                null;

            HalDo.state.activeWindow =
                null;

        }

        HalDo.emit(
            "window:closed",
            {
                appId
            }
        );

        return true;

    }

    /* ============================================================
       DRAGGING
       ============================================================ */

    function startDragging(
        event
    ) {

        if (
            event.button !== 0
        ) {

            return;

        }

        const element =
            event.currentTarget.closest(
                ".haldo-app-window"
            );

        if (!element) {
            return;
        }

        if (
            element.classList.contains(
                "maximized"
            )
        ) {

            return;

        }

        const appId =
            element.dataset.appId;

        focusWindow(
            appId
        );

        const rect =
            element.getBoundingClientRect();

        HalDo.windowState.dragging = {

            element,

            appId,

            pointerId:
                event.pointerId,

            offsetX:
                event.clientX -
                rect.left,

            offsetY:
                event.clientY -
                rect.top

        };

        try {

            event.currentTarget.setPointerCapture(
                event.pointerId
            );

        } catch (_) {}

        event.preventDefault();

    }

    document.addEventListener(
        "pointermove",
        event => {

            const drag =
                HalDo.windowState.dragging;

            if (!drag) {
                return;
            }

            if (
                event.pointerId !==
                drag.pointerId
            ) {

                return;

            }

            const element =
                drag.element;

            const area =
                workspace();

                    drag.offsetX,

                clamp(
                    event.clientY -
                    areaRect.top -
                    drag.offsetY,

                            10

                        Math.max(
                            HalDo.windowConfig.minHeight,
                            areaRect.height -
                            10
                        );

                        element.offsetWidth >
                        maxWidth

                            maxWidth + "px";

                    }

                    if (
                        element.offsetHeight >
                        maxHeight
                    ) {

                        element.style.height =
                            maxHeight + "px";

                    }

                    const maxLeft =
                        Math.max(
                            0,
                            areaRect.width -
                            element.offsetWidth
                        );

                    const maxTop =
                        Math.max(
                            0,
                            areaRect.height -
                            element.offsetHeight
                        );

                    const left =
                        clamp(
                            parseFloat(
                                element.style.left
                            ) || 0,
                            0,
                            maxLeft
                        );

                    const top =
                        clamp(
                            parseFloat(
                                element.style.top
                            ) || 0,
                            0,
                            maxTop
                        );

                    element.style.top =
                        top + "px";

                        element

        HalDo.appRenderers ||
        new Map();

    HalDo.unregisterAppRenderer =
        function (
            appId
        ) {

            return HalDo.appRenderers.delete(
                appId
            );

        };

    /* ============================================================
       PUBLIC WINDOW API
       ============================================================ */

    HalDo.windows = {

        open(
            appId,
            options = {}
        ) {

            const app =
                HalDo.registry.get(
                    appId
                );

            if (!app) {

                console.warn(
                    "[HalDo Windows] App nicht registriert:",
                    appId
                );

                return null;

            }

            return createWindow(
                app,
                options

        },

        close(
            appId

            return closeWindow(
                appId

        minimize(
            appId

            return minimizeWindow(
                appId

        },

        maximize(
            appId

            return toggleMaximize(
                appId
            );

        },

        focus(
            appId

            return focusWindow(
                appId

        },

        get(
            appId

            return HalDo.windowState.windows.get(
                appId

        all() {

        closeAll() {

    /* ============================================================

    const originalOpen =

    if (
        HalDo.appManager

            async function (

        "[HalDo Window Engine] Teil 4/8 bereit."

            {
