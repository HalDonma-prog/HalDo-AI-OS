/* =========================================================
   SUN INTERACTION
   ========================================================= */

HD8.world.setupSunInteraction =
    function() {

        const target =
            this.state.sunHitTarget;


        if (
            !target
        ) {

            return;

        }


        if (
            target.dataset
                .haldoBound ===
            "true"
        ) {

            return;

        }


        target.dataset
            .haldoBound =
            "true";


        target.addEventListener(
            "click",
            event => {

                event.preventDefault();


                event.stopPropagation();


                this.activateSun();

            }
        );


        target.addEventListener(
            "pointerdown",
            event => {

                event.stopPropagation();

            }
        );

    };


/* =========================================================
   ACTIVATE SUN
   ========================================================= */

HD8.world.activateSun =
    function() {

        if (
            this.state.sunActive
        ) {

            return;

        }


        this.state.sunActive =
            true;


        const layer =
            this.state.logoLayer;


        const ring =
            document.getElementById(
                "haldo-world-energy-ring"
            );


        this.prepareLogoLayer();


        if (
            ring
        ) {

            ring.classList.remove(
                "active"
            );


            void ring.offsetWidth;


            ring.classList.add(
                "active"
            );

        }


        if (
            layer
        ) {

            layer.classList.remove(
                "active"
            );


            layer.classList.remove(
                "haldo-world-sun-opening"
            );


            void layer.offsetWidth;


            layer.classList.add(
                "active"
            );


            layer.classList.add(
                "haldo-world-sun-opening"
            );

        }


        this.emit(
            "world:sun-clicked",
            {

                source:
                    "haldo-world",

                action:
                    "open-ai",

                time:
                    Date.now()

            }
        );


        this.emit(
            "haldo:sun-activated",
            {

                openAI:
                    true,

                logo:
                    true

            }
        );


        /*
         * Integration bridge:
         *
         * Later AI/Chat modules can listen to:
         *
         * haldo:sun-activated
         *
         * or:
         *
         * world:sun-clicked
         *
         * and open the existing HalDo AI Chat
         * application.
         */

        window.setTimeout(
            () => {

                this.emit(
                    "haldo:open-ai",
                    {

                        source:
                            "sun",

                        animation:
                            "logo-from-sun"

                    }
                );


                /*
                 * Existing AI systems may expose
                 * different APIs. We deliberately
                 * do not destroy or replace them.
                 */

                try {

                    if (
                        HD8.ai?.chat?.open
                    ) {

                        HD8.ai.chat.open();

                    }

                    else if (
                        HD8.chat?.open
                    ) {

                        HD8.chat.open();

                    }

                    else if (
                        HD8.apps?.open
                    ) {

                        HD8.apps.open(
                            "ai-chat"
                        );

                    }

                }

                catch(error) {

                    console.warn(
                        "[HalDo World] AI opening bridge failed:",
                        error
                    );

                }

            },
            850
        );


        window.setTimeout(
            () => {

                this.state.sunActive =
                    false;

                if (
                    layer
                ) {

                    layer.classList.remove(
                        "active"
                    );

                }

            },
            2400
        );

    };


/* =========================================================
   RENDER
   ========================================================= */

HD8.world.render =
    function(
        timestamp
    ) {

        if (
            !this.state.running
        ) {

            return;

        }


        const now =
            Date.now();


        const delta =
            this.state.lastFrame
                ? Math.min(
                    34,
                    now -
                    this.state.lastFrame
                )
                : 16.6667;


        this.state.lastFrame =
            now;


        this.state.time =
            now;


        const ctx =
            this.state.context;


        if (
            ctx
        ) {

            ctx.save();


            ctx.clearRect(
                0,
                0,
                this.state.width,
                this.state.height
            );


            this.drawSky(
                now
            );


            this.drawStars(
                now
            );


            this.drawPlanets(
                delta
            );


            this.drawSun(
                now
            );


            ctx.restore();

        }


        this.state.animationFrame =
            requestAnimationFrame(
                frameTime => {

                    this.render(
                        frameTime
                    );

                }
            );

    };


/* =========================================================
   START
   ========================================================= */

HD8.world.start =
    function() {

        if (
            this.state.running
        ) {

            return;

        }


        this.setupCanvas();


        this.createStars();


        this.createPlanets();


        this.state.running =
            true;


        this.state.lastFrame =
            Date.now();


        this.state.time =
            Date.now();


        this.render(
            performance.now()
        );


        this.emit(
            "world:started",
            {

                planets:
                    this.state.planets.length,

                stars:
                    this.state.stars.length

            }
        );

    };

   ========================================================= */

HD8.world.stop =
    function() {

        this.state.running =
            false;


        if (
            this.state.animationFrame
        ) {

            cancelAnimationFrame(
                this.state.animationFrame
            );

        }


        this.state.animationFrame =
            null;


        this.state.lastFrame =
            0;


        this.emit(
            "world:stopped"
        );

    };


/* =========================================================
   SET SETTINGS
   ========================================================= */

HD8.world.setSettings =
    function(
        settings = {}
    ) {

        Object.assign(
            this.state.settings,
            settings
        );


        this.state.settings.starCount =
            this.clamp(
                Number(
                    this.state.settings
                        .starCount
                ) ||
                365,
                this.constants.minimumStars,
                this.constants.maximumStars
            );


        /*
         * Never allow the visual world
         * to fall below twelve planets.
         */

        this.state.settings.planetCount =
            this.clamp(
                Number(
                    this.state.settings
                        .planetCount
                ) ||
                this.constants.minimumPlanets,
                this.constants.minimumPlanets,
                this.constants.maximumPlanets
            );


        this.state.settings.rotationSpeed =
            this.clamp(
                Number(
                    this.state.settings
                        .rotationSpeed
                ) ||
                1,
                .05,
                5
            );


        this.createStars();


        this.createPlanets();


        this.emit(
            "world:settings-changed",
            {

                ...this.state.settings

            }
        );


        return {
            ...this.state.settings
        };

    };

/* =========================================================
   STORAGE
   ========================================================= */
HD9.settings.storageKey =
    "haldo-os20-settings";
/* =========================================================
   LOAD
   ========================================================= */
HD9.settings.load =
    function() {
        let stored = null;
        try {
            const raw =
                localStorage.getItem(
                    this.storageKey
                );
            if (raw) {
                stored =
                    JSON.parse(
                        raw
                    );
            }
        }
        catch(error) {
            console.warn(
                "[HalDo] Settings could not be loaded:",
                error
            );
        }
        this.state.values = {
            ...this.defaults,
            ...(stored || {})
        };
        /*
         * HalDo World 2.0 minimum.
         * Die Welt soll niemals mit weniger
         * als 12 Planeten gestartet werden.
         */
        this.state.values.planetCount =
            Math.max(
                12,
                Number(
                    this.state.values
                        .planetCount
                ) || 12
            );
        return this.state.values;
    };
/* =========================================================
   SAVE
   ========================================================= */
HD9.settings.save =
    function() {
        try {
            localStorage.setItem(
                this.storageKey,
                JSON.stringify(
                    this.state.values
                )
            );
        }
        catch(error) {
            console.warn(
                "[HalDo] Settings could not be saved:",
                error
            );
        }
        HD9.emit(
            "settings:saved",
            this.state.values
        );
        return true;
    };
/* =========================================================
   GET
   ========================================================= */
HD9.settings.get =
    function(key) {
        if (!key) {
            return {
                ...this.state.values
            };
        }
        return this.state.values[key];
    };
/* =========================================================
   SET
   ========================================================= */
HD9.settings.set =
    function(
        key,
        value
    ) {
        if (!key) {
            return;
        }
        /*
         * Planetenzahl:
         * mindestens 12.
         */
        if (
            key === "planetCount"
        ) {
            value =
                Math.max(
                    12,
                    Math.min(
                        24,
                        Number(value) || 12
                    )
                );
        }
        if (
            key === "starCount"
        ) {
            value =
                Math.max(
                    20,
                    Math.min(
                        1000,
                        Number(value) || 365
                    )
                );
        }
        if (
            key === "rotationSpeed"
        ) {
            value =
                Math.max(
                    .1,
                    Math.min(
                        5,
                        Number(value) || 1
                    )
                );
        }
        this.state.values[key] =
            value;
        this.apply(
            key,
            value
        );
        this.save();
        HD9.emit(
            "settings:changed",
            {
                key,
                value,
                settings:
                    this.state.values
            }
        );
    };

    "individualRotation",
    "individualOrbit"
];
/* =========================================================
   APPLY SINGLE SETTING
   ========================================================= */
HD9.settings.apply =
    function(
        key,
        value
    ) {
        /*
         * WORLD
         */
        if (
            this.worldKeys.includes(
                key
            ) &&
            HD9.world?.setSettings
        ) {
            HD9.world.setSettings(
                {
                    [key]:
                        value
                }
            );
        }
        /*
         * REDUCED MOTION
         */
        if (
            key ===
            "reducedMotion"
        ) {
            document.documentElement
                .classList.toggle(
                    "haldo-reduced-motion",
                    Boolean(value)
                );
        }
        /*
         * ANIMATIONS
         */
        if (
            key ===
            "animations"
        ) {
            document.documentElement
                .classList.toggle(
                    "haldo-no-animations",
                    !Boolean(value)
                );
        }
        /*
         * COSMIC WORLD EVENT
         */
        if (
            this.worldKeys.includes(
                key
            )
        ) {
            HD9.emit(
                "world:configuration-changed",
                {
                    key,
                    value
                }
            );
        }
    };
/* =========================================================

    function() {

            sunRays:
                values.sunRays,
            glow:
                values.glow,
            starCount:
                values.starCount,
            planetCount:
                Math.max(
                    12,
                    values.planetCount
                ),
            rotationSpeed:
                values.rotationSpeed,
            skyMode:
                values.skyMode,
            cosmicColors:
                values.cosmicColors,
            livingStars:
                values.livingStars,
            livingPlanets:
                values.livingPlanets,
            planetGlow:
                values.planetGlow,
            moonEnabled:
                values.moonEnabled,
            planetPairs:
                values.planetPairs,
            individualRotation:
                values.individualRotation,
            individualOrbit:
                values.individualOrbit
        };
        if (
            HD9.world?.setSettings
        ) {
            HD9.world.setSettings(
                worldSettings
            );
        }
        document.documentElement
            .classList.toggle(

                )
            );
        document.documentElement
            .classList.toggle(
                "haldo-no-animations",
                !Boolean(
                    values.animations
                )
            );
        HD9.emit(
            "settings:all-applied",
            values
        );
    };

/* =========================================================
   DATA STATE
   ========================================================= */

HD10.apps.data.state =
    HD10.apps.data.state ||
    {
        initialized: false,
        collections: {},
        activeApp: null,
        activeRecord: null
    };


HD10.apps.data.storageKey =
    "haldo-os22-app-data";


/* =========================================================
   LOAD DATA
   ========================================================= */

HD10.apps.data.load =
    function() {

        try {

            const raw =
                localStorage.getItem(
                    this.storageKey
                );

            if (raw) {

                const parsed =
                    JSON.parse(raw);

                if (
                    parsed &&
                    typeof parsed === "object"
                ) {

                    this.state.collections =
                        parsed;

                }

            }

        }
        catch(error) {

            console.warn(
                "[HalDo] App data load failed:",
                error
            );

        }

        return this.state.collections;

    };


/* =========================================================
   SAVE DATA
   ========================================================= */

HD10.apps.data.save =
    function() {

        try {

            localStorage.setItem(
                this.storageKey,
                JSON.stringify(
                    this.state.collections
                )
            );

            HD10.emit(
                "apps:data:saved",
                this.state.collections
            );

            return true;

        }
        catch(error) {

            console.warn(
                "[HalDo] App data save failed:",
                error
            );

            return false;

        }

    };


/* =========================================================
   COLLECTION
   ========================================================= */

HD10.apps.data.ensureCollection =
    function(
        appId
    ) {

        if (
            !this.state.collections[
                appId
            ]
        ) {

            this.state.collections[
                appId
            ] = [];

        }

        return this.state.collections[
            appId
        ];

    };


/* =========================================================
   GET ALL
   ========================================================= */

HD10.apps.data.getAll =
    function(
        appId
    ) {

        return [
            ...this.ensureCollection(
                appId
            )
        ];

    };


/* =========================================================
   GET ONE
   ========================================================= */

HD10.apps.data.get =
    function(
        appId,
        id
    ) {

        return this
            .ensureCollection(
                appId
            )
            .find(
                record =>
                    String(
                        record.id
                    ) ===
                    String(
                        id
                    )
            ) ||
            null;

    };


/* =========================================================
   CREATE
   ========================================================= */

HD10.apps.data.add =
    function(
        appId,
        data = {}
    ) {

        const collection =
            this.ensureCollection(
                appId
            );

        const record =
            {

                id:
                    data.id ||
                    (
                        Date.now() +
                        "-" +
                        Math.random()
                            .toString(36)
                            .slice(2)
                    ),

                createdAt:
                    data.createdAt ||
                    new Date().toISOString(),

                updatedAt:
                    new Date().toISOString(),

                ...data

            };

        collection.push(
            record
        );

        this.save();

        HD10.emit(
            "apps:data:added",
            {
                appId,
                record
            }
        );

        return record;

    };


/* =========================================================
   UPDATE
   ========================================================= */

HD10.apps.data.update =
    function(
        appId,
        id,
        changes = {}
    ) {

        const collection =
            this.ensureCollection(
                appId
            );

        const index =
            collection.findIndex(
                record =>
                    String(
                        record.id
                    ) ===
                    String(
                        id
                    )
            );

        if (
            index < 0
        ) {

            return null;

        }

        collection[index] =
            {

                ...collection[index],

                ...changes,

                updatedAt:
                    new Date().toISOString()

            };

        this.save();

        HD10.emit(
            "apps:data:updated",
            {
                appId,
                record:
                    collection[index]
            }
        );

        return collection[index];

    };


/* =========================================================
   DELETE
   ========================================================= */

HD10.apps.data.remove =
    function(
        appId,
        id
    ) {

        const collection =
            this.ensureCollection(
                appId
            );

        const index =
            collection.findIndex(
                record =>
                    String(
                        record.id
                    ) ===
                    String(
                        id
                    )
            );

        if (
            index < 0
        ) {

            return false;

        }

        const removed =
            collection.splice(
                index,
                1
            )[0];

        this.save();

        HD10.emit(
            "apps:data:removed",
            {
                appId,
                record: removed
            }
        );

        return true;

    };

   CLEAR
   ========================================================= */

HD10.apps.data.clear =
    function(
        appId
    ) {

        this.state.collections[
            appId
        ] = [];

        this.save();

        HD10.emit(
            "apps:data:cleared",

                appId
            }
        );

        return true;

    };

HD10.apps.ui.create =
    function(
        appId,
        options = {}
    ) {

        this.injectStyles();

        const root =
            document.createElement(
                "div"
            );

        root.className =
            "haldo-universal-app";

        const toolbar =
            document.createElement(
                "div"
            );

        toolbar.className =
            "haldo-app-toolbar";

        const title =
            document.createElement(
                "strong"
            );

        title.textContent =
            options.title ||
            appId;

        toolbar.appendChild(
            title
        );

        const newButton =
            document.createElement(
                "button"
            );

        newButton.textContent =
            "＋ Neu";

        const saveButton =
            document.createElement(
                "button"
            );

        saveButton.textContent =
            "💾 Speichern";

        const deleteButton =
            document.createElement(
                "button"
            );

        deleteButton.textContent =
            "🗑 Löschen";

        toolbar.appendChild(
            newButton
        );

        toolbar.appendChild(
            saveButton
        );

        toolbar.appendChild(
            deleteButton
        );

        const body =
            document.createElement(
                "div"
            );

        body.className =
            "haldo-app-body";

        const sidebar =
            document.createElement(
                "aside"
            );

        sidebar.className =
            "haldo-app-sidebar";

        sidebar.innerHTML =
            `<div class="
                haldo-app-sidebar-title
            ">ANWENDUNG</div>`;

        const main =
            document.createElement(
                "main"
            );

        main.className =
            "haldo-app-main";

        const list =
            document.createElement(
                "div"
            );

        list.className =
            "haldo-app-list";

        const editor =
            document.createElement(
                "div"
            );

        editor.className =
            "haldo-app-editor";

        const titleInput =
            document.createElement(
                "input"
            );

        titleInput.placeholder =
            "Titel";

        const textInput =
            document.createElement(
                "textarea"
            );

        textInput.placeholder =
            "Inhalt";

        editor.appendChild(
            titleInput
        );

        editor.appendChild(
            textInput
        );

        main.appendChild(
            list
        );

        main.appendChild(
            editor
        );

        body.appendChild(
            sidebar
        );

        body.appendChild(
            main
        );

        root.appendChild(
            toolbar
        );

        root.appendChild(
            body
        );


        let selectedId =
            null;


        const render =
            function() {

                list.innerHTML =
                    "";

                const records =
                    HD10.apps.data
                        .getAll(
                            appId
                        );

                if (
                    !records.length
                ) {

                    list.innerHTML = `
                        <div class="
                            haldo-app-empty
                        ">
                            Noch keine Einträge.
                        </div>
                    `;

                    return;

                }

                records.forEach(
                    record => {

                        const item =
                            document.createElement(
                                "div"
                            );

                        item.className =
                            "haldo-app-record";

                        item.innerHTML = `

                            <div class="
                                haldo-app-record-title
                            ">
                                ${
                                    record.title ||
                                    "Ohne Titel"
                                }
                            </div>

                            <div class="
                                haldo-app-record-meta
                            ">
                                ${
                                    record.updatedAt ||
                                    ""
                                }
                            </div>

                        `;

                        item.addEventListener(
                            "click",
                            () => {

                                selectedId =
                                    record.id;

                                titleInput.value =
                                    record.title ||
                                    "";

                                textInput.value =
                                    record.content ||
                                    "";

                                render();

                            }
                        );

                        if (
                            String(
                                selectedId
                            ) ===
                            String(
                                record.id
                            )
                        ) {

                            item.classList.add(
                                "active"
                            );

                        }

                        list.appendChild(
                            item
                        );

                    }
                );

            };


        newButton.addEventListener(
            "click",
            () => {

                selectedId =
                    null;

                titleInput.value =
                    "";

                textInput.value =
                    "";

                titleInput.focus();

            }
        );


        saveButton.addEventListener(
            "click",
            () => {

                if (
                    selectedId
                ) {

                    HD10.apps.data.update(
                        appId,
                        selectedId,
                        {

                            title:
                                titleInput.value,

                            content:
                                textInput.value

                        }
                    );

                }
                else {

                    const record =
                        HD10.apps.data.add(
                            appId,
                            {

                                title:
                                    titleInput.value ||
                                    "Neuer Eintrag",

                                content:
                                    textInput.value

                            }
                        );

                    selectedId =
                        record.id;

                }

                render();

            }
        );


        deleteButton.addEventListener(
            "click",
            () => {

                if (
                    !selectedId
                ) {

                    return;

                }

                HD10.apps.data.remove(
                    appId,
                    selectedId
                );

                selectedId =
                    null;

                titleInput.value =
                    "";

                textInput.value =
                    "";

                render();

            }
        );


        const sidebarItem =
            document.createElement(
                "button"
            );

        sidebarItem.className =
            "haldo-app-sidebar-item active";

        sidebarItem.textContent =
            "📁 Alle Einträge";

        sidebar.appendChild(
            sidebarItem
        );

        render();

        return root;

    };

/* =========================================================
   ENSURE APP STATE
   ========================================================= */

HD12.apps.state.ensure =
function(
    appId,
    defaults = {}
) {

    if (
        !appId
    ) {

        return null;

    }

    if (
        !this.applications[
            appId
        ]
    ) {

        this.applications[
            appId
        ] =
        {

            id:
                appId,

            createdAt:
                new Date()
                    .toISOString(),

            updatedAt:
                new Date()
                    .toISOString(),

            data:
                {
                    ...defaults
                },

            metadata:
                {}

    return this.applications[
        appId
    ];

};


/* =========================================================
   GET STATE
   ========================================================= */

HD12.apps.state.get =
function(
    appId
) {

    const state =
        this.ensure(
            appId
        );

    if (
        !state
    ) {

        return null;

    }

    return state;

};


/* =========================================================
   GET VALUE
   ========================================================= */

HD12.apps.state.getValue =
function(
    appId,
    key,
    fallback = null
) {

    const state =
        this.ensure(
            appId
        );

    if (
        !state ||
        !state.data
    ) {

        return fallback;

    }

    return (
        Object.prototype
            .hasOwnProperty
            .call(
                state.data,
                key
            )
            ? state.data[key]
            : fallback
    );

};


/* =========================================================
   SET VALUE
   ========================================================= */

HD12.apps.state.setValue =
function(
    appId,
    key,
    value
) {

    const state =
        this.ensure(

        !state

        return false;

    state.data[
        key
    ] =
        value;

    state.updatedAt =
        new Date()
            .toISOString();

    this.emitChange(
        appId,
        key,
        value
    );

    return value;

};


/* =========================================================

   ========================================================= */

HD12.apps.state.merge =
function(

        this.ensure(
            appId

    {

        new Date()
            .toISOString();

    this.emitChange(
        appId,

function(

};


/* =========================================================

HD12.apps.state.pushHistory =
function(

    payload = null
) {

    const entry =
    {

    this.history.push(

    );

    if (
        this.history.length >
        this.maxHistory
    ) {

        this.history.splice(
            0,
            this.history.length -
            this.maxHistory
        );

HD12.apps.state.storageKey =

        const parsed =

) {

            command.appId,

        );

        this.emit(
            "apps:command:executed",
            {

                name,

                payload,

                result,

                appId:
                    command.appId ||

    );

};

function(

    const removed =

    this.emit(

   HALDO ROOT

HD13.apps.utilities.state ||
{

    initialized:
        false,

    lastSearch:
        "",

    searchResults:
        [],

    importedFiles:
        [],

    exports:

};

   SAFE EMIT
   ========================================================= */

HD13.apps.utilities.emit =
function(
    event,
    payload
) {

        if (
            typeof HD13.emit ===
            "function"
        ) {

            HD13.emit(
                event,
                payload
            );

        }

    }
    catch(error) {

        console.warn(
            "[HalDo] Utility event failed:",
            error
        );

    }

};


/* =========================================================
   UNIVERSAL SEARCH
   ========================================================= */

HD13.apps.utilities.search =
function(
    query,
    options = {}
) {

    const normalized =
        String(
            query ||
            ""
        )
        .trim()
        .toLowerCase();

    this.state.lastSearch =
        query || "";

    const results =
        [];

    if (
        !normalized
    ) {

        this.state.searchResults =
            [];

        this.emit(
            "apps:search:cleared"
        );

        return [];

    }


    /* -------------------------------------------------------
       SEARCH APP REGISTRY
       ------------------------------------------------------- */

    try {

        const apps =
            HD13.apps &&
            HD13.apps.bridge &&
            HD13.apps.bridge.registry &&
            typeof HD13.apps.bridge.registry.list ===
            "function"
                ? HD13.apps.bridge.registry.list()
                : [];

        if (
            Array.isArray(
                apps
            )
        ) {

            apps.forEach(
                app => {

                    if (
                        !app
                    ) {

                        return;

                    }

                    const haystack =
                        [

                            app.id,

                            app.name,

                            app.title,

                            app.description,

                            app.category

                        ]
                        .filter(
                            Boolean
                        )
                        .join(
                            " "
                        )
                        .toLowerCase();

                    if (
                        haystack.includes(
                            normalized
                        )
                    ) {

                        results.push(
                            {

                                type:
                                    "app",

                                id:
                                    app.id,

                                title:
                                    app.title ||
                                    app.name ||
                                    app.id,

                                description:
                                    app.description ||
                                    "",

                                score:
                                    haystack.indexOf(
                                        normalized
                                    )

                            }
                        );

                    }

                }
            );

        }

    }
    catch(error) {

        console.warn(
            "[HalDo] App search failed:",
            error
        );

    }


    /* -------------------------------------------------------
       SEARCH APP DATA
       ------------------------------------------------------- */

    if (
        options.data !==
        false
    ) {

        try {

            const collections =
                HD13.apps &&
                HD13.apps.data &&
                HD13.apps.data.state &&
                HD13.apps.data.state.collections
                    ? HD13.apps.data.state.collections
                    : {};

            Object.keys(
                collections
            )
            .forEach(
                appId => {

                    const records =
                        Array.isArray(
                            collections[
                                appId
                            ]
                        )
                            ? collections[
                                appId
                            ]
                            : [];

                    records.forEach(
                        record => {

                            if (
                                !record
                            ) {

                                return;

                            }

                            const haystack =
                                Object.values(
                                    record
                                )
                                .filter(
                                    value =>
                                        typeof value ===
                                        "string" ||
                                        typeof value ===
                                        "number"
                                )
                                .join(
                                    " "
                                )
                                .toLowerCase();

                            if (
                                haystack.includes(
                                    normalized
                                )
                            ) {

                                results.push(
                                    {

                                        type:
                                            "data",

                                        appId,

                                        id:
                                            record.id,

                                        title:
                                            record.title ||
                                            record.name ||
                                            "Eintrag",

                                        description:
                                            record.content ||
                                            record.description ||
                                            "",

                                        score:
                                            haystack.indexOf(
                                                normalized
                                            )

                                    }
                                );

                            }

                        }
                    );

                }
            );

        }
        catch(error) {

            console.warn(
                "[HalDo] Data search failed:",
                error
            );

        }

    }


    /* -------------------------------------------------------
       SORT RESULTS
       ------------------------------------------------------- */

    results.sort(
        (
            a,
            b
        ) =>
            (
                a.score || 0
            ) -
            (
                b.score || 0
            )
    );


    const limited =
        Number.isFinite(
            options.limit
        )
            ? results.slice(
                0,
                options.limit
            )
            : results.slice(
                0,
                100
            );


    this.state.searchResults =
        limited;


    this.emit(
        "apps:search:results",
        {

            query,

            results:
                limited

        }
    );


    return limited;

};

   SEARCH CLEAR
   ========================================================= */

HD13.apps.utilities.clearSearch =
function() {

};

HD13.apps.utilities.openSearchResult =
function(
    result

    if (
        !result

    }


    if (
        result.type ===
        "app"
    ) {

        try {

            if (
                HD13.apps &&
                typeof HD13.apps.open ===
                "function"
            ) {

                HD13.apps.open(
                    result.id
                );

                return true;

            }

        }
        catch(error) {

            console.warn(
                "[HalDo] Search app open failed:",
                error
            );

        }

    }


    if (
        result.type ===
        "data"
    ) {

        this.emit(
            "apps:search:data-open",
            result
        );

        return true;

    }

    return false;

};

   FILE SYSTEM HELPERS
   ========================================================= */

HD13.apps.utilities.files =
HD13.apps.utilities.files ||
{};


/* =========================================================
   FILE PICKER
   ========================================================= */

HD13.apps.utilities.files.pick =
function(
    options = {}
) {

    return new Promise(
        resolve => {

            const input =
                document.createElement(
                    "input"
                );

            input.type =
                "file";

            input.multiple =
                options.multiple !==
                false;

            if (
                options.accept
            ) {

                input.accept =
                    options.accept;

            }

            input.style.display =
                "none";

            document.body.appendChild(
                input
            );


            input.addEventListener(
                "change",
                async () => {

                    try {

                        const files =
                            Array.from(
                                input.files ||
                                []
                            );

                        this.stateFileEvent(
                            files
                        );

                        resolve(
                            files
                        );

                    }
                    catch(error) {

                        console.warn(
                            "[HalDo] File picker failed:",
                            error
                        );

                        resolve(
                            []
                        );

                    }
                    finally {

                        input.remove();

                    }

                },
                {
                    once:
                        true
                }
            );


            input.click();

        }
    );

};

   FILE EVENT
   ========================================================= */

HD13.apps.utilities.files.stateFileEvent =

                    type:

        );

/* =========================================================
   DOWNLOAD BLOB
   ========================================================= */

HD13.apps.utilities.files.download =
function(
    content,
    filename,
    type =
        "text/plain;charset=utf-8"
) {

    try {

        const blob =
            content instanceof Blob
                ? content
                : new Blob(
                    [
                        content
                    ],
                    {
                        type
                    }
                );

        const url =
            URL.createObjectURL(
                blob
            );

        const anchor =
            document.createElement(
                "a"
            );

        anchor.href =
            url;

        anchor.download =
            filename ||
            "haldo-export.txt";

        anchor.style.display =
            "none";

        document.body.appendChild(
            anchor
        );

        anchor.click();

        anchor.remove();

        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

        this.emit(
            "apps:file:downloaded",
            {

                filename:
                    anchor.download,

                type

            }
        );

        return true;

    }
    catch(error) {

        console.warn(
            "[HalDo] File download failed:",
            error
        );

        return false;

    }

};


/* =========================================================
   EXPORT JSON

HD13.apps.utilities.exportJSON =
function(

                null,
                2

        this.state.exports.push(
            {

                filename,

                type:
                    "json",

                time:

            }
        );

        this.emit(
            "apps:export:created",
            {

                filename,

                type:
                    "json"

            }
        );

        return this.files.download(
            json,
            filename,
            "application/json;charset=utf-8"
        );

    }
    catch(error) {

        console.warn(
            "[HalDo] JSON export failed:",
            error
        );

        return false;

    }

};

HD13.apps.utilities.exportText =

HD13.apps.utilities.exportAppData =

    if (
        !appId
    ) {

        [];

    try {

        if (

        ) {

            data =
                HD13.apps.data.getAll(
                    appId
                );

        }

    }
    catch(error) {

        console.warn(
            "[HalDo] App data export failed:",
            error
        );

    }

    return this.exportJSON(
        {

            version:
                "22.0.0",

            appId,

            exportedAt:
                new Date()
                    .toISOString(),

            records:
                data

        },
        filename ||
        (
            "haldo-" +

            "-export.json"
        )
    );

            new Date()

        appData:

            HD13.apps.data.state

                : {},

        appState:

                ? HD13.apps.state

                ? HD13.apps.notifications
                    .getAll()
                : []

    );

/* =========================================================
   IMPORT JSON INTO APP DATA
   ========================================================= */

HD13.apps.utilities.importAppData =
async function(
    appId,
    file,
    options = {}
) {

    if (
        !appId ||
        !file
    ) {

        return false;

    }

    const data =
        await this.files.readJSON(
            file
        );

    if (
        !data
    ) {

        return false;

    }


    let records =
        Array.isArray(
            data
        )
            ? data
            : (
                Array.isArray(
                    data.records
                )
                    ? data.records
                    : []
            );


    if (
        !records.length
    ) {

        return false;

    }


    let imported =
        0;


    if (
        HD13.apps.data &&
        typeof HD13.apps.data.add ===
        "function"
    ) {

        records.forEach(
            record => {

                if (
                    !record ||
                    typeof record !==
                    "object"
                ) {

                    return;

                }

                const copy =
                    {
                        ...record
                    };

                if (
                    options.newIds
                ) {

                    delete copy.id;

                }

                HD13.apps.data.add(
                    appId,
                    copy
                );

                imported++;

            }
        );

    }


    this.emit(
        "apps:import:completed",
        {

            appId,

            imported,

            filename:
                file.name ||
                ""

        }
    );


    return imported;

};


/* =========================================================
   IMPORT COMPLETE SYSTEM DATA
   ========================================================= */

HD13.apps.utilities.importSystemData =
async function(
    file
) {

    if (
        !file
    ) {

        return false;

    }

    const data =
        await this.files.readJSON(
            file
        );

    if (
        !data ||
        typeof data !==
        "object"
    ) {

        return false;

    }


    let restored =
        {

            appData:
                0,

            appState:
                false,

            notifications:
                0

        };


    /* -------------------------------------------------------
       APP DATA
       ------------------------------------------------------- */

    if (
        data.appData &&
        HD13.apps.data &&
        HD13.apps.data.state
    ) {

        const collections =
            data.appData;

        Object.keys(
            collections
        )
        .forEach(
            appId => {

                const records =
                    collections[
                        appId
                    ];

                if (
                    !Array.isArray(
                        records
                    )
                ) {

                    return;

                }

                HD13.apps.data.state
                    .collections[
                        appId
                    ] =
                    records;

                restored.appData +=
                    records.length;

            }
        );

        if (
            typeof HD13.apps.data.save ===
            "function"
        ) {

            HD13.apps.data.save();

        }

    }


    /* -------------------------------------------------------
       APP STATE
       ------------------------------------------------------- */

    if (
        data.appState &&
        HD13.apps.state
    ) {

        if (
            data.appState.applications
        ) {

            HD13.apps.state
                .applications =
                data.appState
                    .applications;

        }

        HD13.apps.state.activeApp =
            data.appState.activeApp ||
            null;

        HD13.apps.state.activeView =
            data.appState.activeView ||
            null;

        if (
            typeof HD13.apps.state.save ===
            "function"
        ) {

            HD13.apps.state.save();

        }

        restored.appState =
            true;

    }


    /* -------------------------------------------------------
       NOTIFICATIONS
       ------------------------------------------------------- */

    if (
        Array.isArray(
            data.notifications
        ) &&
        HD13.apps.notifications
    ) {

        HD13.apps.notifications.items =
            data.notifications;

        restored.notifications =
            data.notifications.length;

    }


    this.emit(
        "apps:system-imported",
        {

            restored,

            filename:
                file.name ||
                ""

        }
    );


    return restored;

};

        ),

/* =========================================================

if (

};

HD14.apps.appearance.styleId =

/* =========================================================
   APPLY ROOT VARIABLES
   ========================================================= */

HD14.apps.appearance.applyVariables =
function() {

    const root =
        document.documentElement;

    if (
        !root
    ) {

        return;

    }


    root.style.setProperty(
        "--haldo-app-scale",
        String(
            this.state.fontScale
        )
    );


    root.style.setProperty(
        "--haldo-app-font-size",
        "13px"
    );


    if (
        this.state.density ===
        "compact"
    ) {

        root.style.setProperty(
            "--haldo-app-gap",
            "6px"
        );

        root.style.setProperty(
            "--haldo-app-radius",
            "9px"
        );

    }
    else if (
        this.state.density ===
        "large"
    ) {

        root.style.setProperty(
            "--haldo-app-gap",
            "14px"
        );

        root.style.setProperty(
            "--haldo-app-radius",
            "15px"
        );

    }
    else {

        root.style.setProperty(
            "--haldo-app-gap",
            "10px"
        );

        root.style.setProperty(
            "--haldo-app-radius",
            "12px"
        );

    }

};


/* =========================================================
   APPLY APP CLASSES
   ========================================================= */

HD14.apps.appearance.applyTo =
function(
    root
) {

    if (
        !root ||
        !root.classList
    ) {

        return false;

    }


    root.classList.toggle(
        "haldo-app-compact",
        this.state.density ===
        "compact"
    );


    root.classList.toggle(
        "haldo-app-large",
        this.state.density ===
        "large"
    );


    root.classList.toggle(
        "haldo-app-high-contrast",
        !!this.state.highContrast
    );


    root.classList.toggle(
        "haldo-app-reduced-motion",
        !!this.state.reducedMotion
    );


    root.classList.toggle(
        "haldo-app-touch",
        window.matchMedia &&
        window.matchMedia(
            "(pointer: coarse)"
        ).matches
    );


    return true;

};


/* =========================================================
   APPLY TO DOCUMENT
   ========================================================= */

HD14.apps.appearance.apply =
function() {

    this.injectStyles();

    this.applyVariables();

    document.body &&
        document.body.classList.toggle(
            "haldo-app-high-contrast",
            !!this.state.highContrast
        );


    document.body &&
        document.body.classList.toggle(
            "haldo-app-reduced-motion",
            !!this.state.reducedMotion
        );


    this.emit(
        "apps:appearance:changed",
        {
            ...this.state
        }
    );

};


/* =========================================================
   THEME
   ========================================================= */

HD14.apps.appearance.setTheme =
function(
    theme
) {

    const allowed =
        [
            "cosmic",
            "dark",
            "midnight",
            "light",
            "glass"
        ];

    const selected =
        allowed.includes(
            theme
        )
            ? theme
            : "cosmic";

    this.state.theme =
        selected;

    document.documentElement
        .setAttribute(
            "data-haldo-theme",
            selected
        );

    this.apply();

    return selected;

};


HD14.apps.appearance.getTheme =
function() {

    return this.state.theme;

};


/* =========================================================
   ACCENT
   ========================================================= */

HD14.apps.appearance.setAccent =
function(
    accent
) {

    const allowed =
        [
            "cosmic",
            "blue",
            "violet",
            "cyan",
            "gold",
            "green",
            "red"
        ];

    this.state.accent =
        allowed.includes(
            accent
        )
            ? accent
            : "cosmic";

    document.documentElement
        .setAttribute(
            "data-haldo-accent",
            this.state.accent
        );

    this.apply();

    return this.state.accent;

};


/* =========================================================
   DENSITY
   ========================================================= */

HD14.apps.appearance.setDensity =
function(
    density
) {

    const allowed =
        [
            "compact",
            "comfortable",
            "large"
        ];

    this.state.density =
        allowed.includes(
            density
        )
            ? density
            : "comfortable";

    this.apply();

    return this.state.density;

};


/* =========================================================
   FONT SCALE
   ========================================================= */

HD14.apps.appearance.setFontScale =
function(
    scale
) {

    let value =
        Number(
            scale
        );

    if (
        !Number.isFinite(
            value
        )
    ) {

        value =
            1;

    }

    value =
        Math.max(
            .8,
            Math.min(
                1.6,
                value
            )
        );

    this.state.fontScale =
        value;

    this.apply();

    return value;

};


/* =========================================================
   FONT SCALE SHORTCUTS
   ========================================================= */

HD14.apps.appearance.increaseFont =
function() {

    return this.setFontScale(
        this.state.fontScale +
        .1
    );

};


HD14.apps.appearance.decreaseFont =
function() {

    return this.setFontScale(
        this.state.fontScale -
        .1
    );

};


HD14.apps.appearance.resetFont =
function() {

    return this.setFontScale(
        1
    );

};


/* =========================================================
   ACCESSIBILITY
   ========================================================= */

HD14.apps.appearance.setReducedMotion =
function(
    enabled
) {

    this.state.reducedMotion =
        !!enabled;

    this.apply();

    return this.state.reducedMotion;

};


HD14.apps.appearance.setHighContrast =
function(
    enabled
) {

    this.state.highContrast =
        !!enabled;

    this.apply();

    return this.state.highContrast;

};


HD14.apps.appearance.setCompactMode =
function(
    enabled
) {

    this.state.compactMode =
        !!enabled;

    this.state.density =
        enabled
            ? "compact"
            : "comfortable";

    this.apply();

    return this.state.compactMode;

};


/* =========================================================
   SYSTEM PREFERENCE DETECTION
   ========================================================= */

HD14.apps.appearance.detectSystemPreferences =
function() {

    try {

        if (
            window.matchMedia
        ) {

            const motion =
                window.matchMedia(
                    "(prefers-reduced-motion: reduce)"
                );

            if (
                motion.matches
            ) {

                this.state.reducedMotion =
                    true;

            }

        }

    }
    catch(error) {

        console.warn(
            "[HalDo] System preference detection failed:",
            error
        );

    }

};


/* =========================================================
   PERSISTENCE
   ========================================================= */

HD14.apps.appearance.save =
function() {

    try {

        localStorage.setItem(
            this.storageKey,
            JSON.stringify(
                this.state
            )
        );

        return true;

    }
    catch(error) {

        console.warn(
            "[HalDo] Appearance save failed:",
            error
        );

        return false;

    }

};


HD14.apps.appearance.load =
function() {

    try {

        const raw =
            localStorage.getItem(
                this.storageKey
            );

        if (
            !raw
        ) {

            return false;

        }

        const parsed =
            JSON.parse(
                raw
            );

        if (
            parsed &&
            typeof parsed ===
            "object"
        ) {

            this.state =
            {

                ...this.state,

                ...parsed

            };

            return true;

        }

    }
    catch(error) {

        console.warn(
            "[HalDo] Appearance load failed:",
            error
        );

    }

    return false;

};


/* =========================================================
   RESET
   ========================================================= */

HD14.apps.appearance.reset =
function() {

    this.state =
    {

        initialized:
            true,

        theme:
            "cosmic",

        accent:
            "cosmic",

        density:
            "comfortable",

        fontScale:
            1,

        reducedMotion:
            false,

        highContrast:
            false,

        compactMode:
            false,

        currentApp:
            null

    };

    this.apply();

    this.save();

    return true;

};


/* =========================================================
   APP REGISTRATION
   ========================================================= */

HD14.apps.appearance.bindApp =
function(
    appId,
    root
) {

    if (
        !root
    ) {

        return false;

    }

    this.state.currentApp =
        appId ||
        null;

    this.applyTo(
        root
    );

    return true;

};


/* =========================================================
   OBSERVE NEW APP DOM
   ========================================================= */

HD14.apps.appearance.observe =
function() {

    if (
        !window.MutationObserver ||
        !document.body
    ) {

        return;

    }

    if (
        this._observer
    ) {

        return;

    }

    this._observer =
        new MutationObserver(
            mutations => {

                mutations.forEach(
                    mutation => {

                        mutation.addedNodes
                            .forEach(
                                node => {

                                    if (
                                        !node ||
                                        node.nodeType !==
                                        1
                                    ) {

                                        return;

                                    }

                                    if (
                                        node.classList &&
                                        (
                                            node.classList
                                                .contains(
                                                    "haldo-universal-app"
                                                ) ||
                                            node.classList
                                                .contains(
                                                    "haldo-special-app"
                                                )
                                        )
                                    ) {

                                        this.applyTo(
                                            node
                                        );

                                    }

                                    if (
                                        node.querySelectorAll
                                    ) {

                                        node.querySelectorAll(
                                            ".haldo-universal-app, .haldo-special-app"
                                        )
                                        .forEach(
                                            appRoot => {

                                                this.applyTo(
                                                    appRoot
                                                );

                                            }
                                        );

                                    }

                                }
                            );

                    }
                );

            }
        );

    this._observer.observe(
        document.body,
        {
            childList:
                true,

            subtree:
                true
        }
    );

};


/* =========================================================
   COMMAND CONNECTION
   ========================================================= */

if (
    HD14.apps.commands &&
    typeof HD14.apps.commands.register ===
    "function"
) {

    HD14.apps.commands.register(
        "appearance.theme",
        function(
            payload
        ) {

            return HD14.apps.appearance
                .setTheme(
                    payload &&
                    payload.theme
                        ? payload.theme
                        : "cosmic"
                );

        },
        {

            description:
                "Ändert das HalDo-App-Theme."

        }
    );


    HD14.apps.commands.register(
        "appearance.font.increase",
        function() {

            return HD14.apps.appearance
                .increaseFont();

        },
        {

            description:
                "Vergrößert die App-Schrift."

        }
    );


    HD14.apps.commands.register(
        "appearance.font.decrease",
        function() {

            return HD14.apps.appearance
                .decreaseFont();

        },
        {

            description:
                "Verkleinert die App-Schrift."

        }
    );


    HD14.apps.commands.register(
        "appearance.accessibility",
        function(
            payload
        ) {

            if (
                payload &&
                typeof payload.reducedMotion ===
                "boolean"
            ) {

                HD14.apps.appearance
                    .setReducedMotion(
                        payload.reducedMotion
                    );

            }

            if (
                payload &&
                typeof payload.highContrast ===
                "boolean"
            ) {

                HD14.apps.appearance
                    .setHighContrast(
                        payload.highContrast
                    );

            }

            return {
                ...HD14.apps.appearance.state
            };

        },
        {

            description:
                "Steuert wichtige Bedienungshilfen."

        }
    );

}


/* =========================================================
   APP EVENT CONNECTION
   ========================================================= */

if (
    typeof HD14.on ===
    "function"
) {

    HD14.on(
        "app:opened",
        payload => {

            const appId =
                payload &&
                (
                    payload.id ||
                    payload.appId ||
                    null
                );

            HD14.apps.appearance
                .state.currentApp =
                appId;

        }
    );


    HD14.on(
        "app:closed",
        payload => {

            const appId =
                payload &&
                (
                    payload.id ||
                    payload.appId ||
                    null
                );

            if (
                HD14.apps.appearance
                    .state.currentApp ===
                appId
            ) {

                HD14.apps.appearance
                    .state.currentApp =
                    null;

            }

        }
    );

}


/* =========================================================
   AUTO SAVE ON CHANGE
   ========================================================= */

if (
    typeof HD14.on ===
    "function"
) {

    HD14.on(
        "apps:appearance:changed",
        () => {

            HD14.apps.appearance.save();

        }
    );

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

HD14.apps.appearance.load();

HD14.apps.appearance.detectSystemPreferences();

HD14.apps.appearance.injectStyles();

HD14.apps.appearance.apply();

HD14.apps.appearance.observe();

HD14.apps.appearance.state.initialized =
    true;


/* =========================================================
   READY EVENT
   ========================================================= */

HD14.apps.appearance.emit(
    "apps:appearance:ready",
    {

        version:
            "22.0.0",

        state:
            {
                ...HD14.apps.appearance.state
            }

    }
);


/* =========================================================
   GLOBAL READY MARKER
   ========================================================= */

HD14.apps.appearanceReady =
    true;


/* =========================================================
   END PART 14 / 16
   ========================================================= */

</script>

     ========================================================= -->

<script>

"use strict";


/* =========================================================
   HALDO ROOT
   ========================================================= */

const HD15 =
    window.HalDo =
    window.HalDo ||
    {};

HD15.apps =
    HD15.apps ||
    {};

HD15.apps.notifications =
HD15.apps.notifications ||
{};


/* =========================================================
   STATE
   ========================================================= */

HD15.apps.notifications.state =
HD15.apps.notifications.state ||
{

    initialized:
        false,

    items:
        [],

    activities:
        [],

    unread:
        0,

    maxItems:
        200,

    maxActivities:
        300,

    panelOpen:
        false

};


/* =========================================================
   STORAGE
   ========================================================= */

HD15.apps.notifications.storageKey =
    "haldo-os22-notifications";


HD15.apps.notifications.activityStorageKey =
    "haldo-os22-activities";


/* =========================================================
   SAFE EMIT
   ========================================================= */

HD15.apps.notifications.emit =
function(
    event,
    payload
) {

    try {

        if (
            typeof HD15.emit ===
            "function"
        ) {

            HD15.emit(
                event,
                payload
            );

        }

    }
    catch(error) {

        console.warn(
            "[HalDo] Notification event failed:",
            error
        );

    }

};


/* =========================================================
   ID GENERATOR
   ========================================================= */

HD15.apps.notifications.createId =
function(
    prefix =
        "notification"
) {

    return (
        prefix +
        "-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2, 10)
    );

};


/* =========================================================
   NORMALIZE NOTIFICATION
   ========================================================= */

HD15.apps.notifications.normalize =
function(
    input = {}
) {

    const type =
        [
            "info",
            "success",
            "warning",
            "error",
            "system",
            "ai"
        ]
        .includes(
            input.type
        )
            ? input.type
            : "info";


    return {

        id:
            input.id ||
            this.createId(),

        type,

        title:
            String(
                input.title ||
                "HalDo"
            ),

        message:
            String(
                input.message ||
                ""
            ),

        icon:
            input.icon ||
            (
                type === "success"
                    ? "✓"
                    : type === "warning"
                        ? "⚠"
                        : type === "error"
                            ? "!"
                            : type === "ai"
                                ? "✨"
                                : "ℹ"
            ),

        appId:
            input.appId ||
            null,

        action:
            input.action ||
            null,

        actionLabel:
            input.actionLabel ||
            null,

        createdAt:
            input.createdAt ||
            new Date()
                .toISOString(),

        read:
            !!input.read,

        persistent:
            !!input.persistent,

        data:
            input.data &&
            typeof input.data ===
            "object"
                ? input.data
                : {}

    };

};


/* =========================================================
   ADD NOTIFICATION
   ========================================================= */

HD15.apps.notifications.add =
function(
    input = {}
) {

    const item =
        this.normalize(
            input
        );


    this.state.items.unshift(
        item
    );


    if (
        !item.read
    ) {

        this.state.unread++;

    }


    this.trim();

    this.save();

    this.emit(
        "notification:added",
        item
    );


    this.emit(
        "apps:notifications:changed",
        this.getSnapshot()
    );


    return item;

};


/* =========================================================
   SHORTCUTS
   ========================================================= */

HD15.apps.notifications.info =
function(
    title,
    message,
    options = {}
) {

    return this.add(
        {

            ...options,

            title,

            message,

            type:
                "info"

        }
    );

};


HD15.apps.notifications.success =
function(
    title,
    message,
    options = {}
) {

    return this.add(
        {

            ...options,

            title,

            message,

            type:
                "success"

        }
    );

};


HD15.apps.notifications.warning =
function(
    title,
    message,
    options = {}
) {

    return this.add(
        {

            ...options,

            title,

            message,

            type:
                "warning"

        }
    );

};
