<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#02040b"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – intelligente, lebendige und modulare Betriebssystem-Oberfläche."
    >

    <meta
        name="application-name"
        content="HalDo AI OS"
    >

    <title>HalDo AI OS 20</title>

    <!-- =========================================================
         HALDO AI OS 20
         INDEX SHELL
         TEIL 1/8

         Diese Datei ist die zentrale UI-Shell.
         Die eigentlichen Systemmodule bleiben modular und werden
         über die vorhandene HalDo-Architektur verbunden.
    ========================================================== -->

    <style>
        /* =====================================================
           RESET
        ====================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #111b35 0%,
                    #070b18 32%,
                    #02040b 72%,
                    #000107 100%
                );

            color: #ffffff;

            user-select: none;
            -webkit-user-select: none;

            text-rendering: optimizeLegibility;

            isolation: isolate;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: 0;
            outline: none;
        }

        /* =====================================================
           ROOT
        ====================================================== */

        #haldo-os {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(45, 76, 150, 0.10),
                    transparent 58%
                );

            isolation: isolate;
        }

        /* =====================================================
           COSMIC WORLD
        ====================================================== */

        #cosmic-world {
            position: absolute;
            inset: 0;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(45, 73, 145, 0.15),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 18% 20%,
                    rgba(80, 90, 160, 0.06),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 82% 78%,
                    rgba(30, 70, 130, 0.07),
                    transparent 35%
                );

            z-index: 1;
        }

        #cosmic-world::before {
            content: "";

            position: absolute;
            inset: -20%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.85) 0 1px,
                    transparent 1.5px
                );

            background-size:
                83px 91px;

            opacity: 0.22;

            transform:
                translate3d(0, 0, 0);

            animation:
                starDrift 90s linear infinite;

            pointer-events: none;
        }

        #cosmic-world::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 25%,
                    rgba(0, 0, 0, 0.15) 58%,
                    rgba(0, 0, 0, 0.55) 100%
                );

            pointer-events: none;
        }

        @keyframes starDrift {
            from {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-35px, 22px, 0)
                    scale(1.015);
            }

            to {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }
        }

        /* =====================================================
           STAR FIELD
        ====================================================== */

        .star-field {
            position: absolute;
            inset: 0;

            pointer-events: none;

            overflow: hidden;
        }

        .star {
            position: absolute;

            width: var(--size, 2px);
            height: var(--size, 2px);

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.9);

            box-shadow:
                0 0 5px rgba(255, 255, 255, 0.45);

            opacity: var(--opacity, 0.5);

            animation:
                starPulse var(--duration, 4s)
                ease-in-out infinite;

            animation-delay:
                var(--delay, 0s);
        }

        @keyframes starPulse {
            0%,
            100% {
                opacity: var(--opacity, 0.45);
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.25);
            }
        }

        /* =====================================================
           COSMIC CENTER
        ====================================================== */

        #cosmic-center {
            position: absolute;

            left: 50%;
            top: 50%;

            width: min(72vw, 680px);
            height: min(72vw, 680px);

            transform:
                translate(-50%, -50%);

            pointer-events: none;
        }

        /* =====================================================
           ORBITS
        ====================================================== */

        .orbit {
            position: absolute;

            left: 50%;
            top: 50%;

            border:
                1px solid rgba(140, 180, 255, 0.11);

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            box-shadow:
                0 0 15px rgba(90, 130, 255, 0.025);
        }

        .orbit-1 {
            width: 28%;
            height: 28%;

            transform:
                translate(-50%, -50%)
                rotateX(68deg)
                rotateZ(-8deg);
        }

        .orbit-2 {
            width: 42%;
            height: 42%;

            transform:
                translate(-50%, -50%)
                rotateX(67deg)
                rotateZ(12deg);
        }

        .orbit-3 {
            width: 57%;
            height: 57%;

            transform:
                translate(-50%, -50%)
                rotateX(64deg)
                rotateZ(-17deg);
        }

        .orbit-4 {
            width: 72%;
            height: 72%;

            transform:
                translate(-50%, -50%)
                rotateX(61deg)
                rotateZ(21deg);
        }

        .orbit-5 {
            width: 87%;
            height: 87%;

            transform:
                translate(-50%, -50%)
                rotateX(58deg)
                rotateZ(-10deg);
        }

        /* =====================================================
           SUN
        ====================================================== */

        #haldo-sun {
            position: absolute;

            left: 50%;
            top: 50%;

            width: clamp(90px, 14vw, 160px);
            height: clamp(90px, 14vw, 160px);

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            cursor: pointer;

            pointer-events: auto;

            z-index: 20;

            background:
                radial-gradient(
                    circle at 36% 32%,
                    #fffdf0 0%,
                    #fff7bd 14%,
                    #ffd65c 34%,
                    #ffae2f 58%,
                    #ff751d 78%,
                    #ff4b16 100%
                );

            box-shadow:
                0 0 12px rgba(255, 225, 100, 0.95),
                0 0 30px rgba(255, 190, 50, 0.8),
                0 0 65px rgba(255, 155, 35, 0.6),
                0 0 110px rgba(255, 115, 20, 0.35),
                0 0 180px rgba(255, 90, 15, 0.18);

            animation:
                sunBreathing 4.5s ease-in-out infinite;
        }

        #haldo-sun::before {
            content: "";

            position: absolute;

            inset: -24%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 226, 112, 0.28) 0%,
                    rgba(255, 178, 45, 0.15) 34%,
                    rgba(255, 120, 20, 0.07) 55%,
                    transparent 74%
                );

            filter: blur(8px);

            animation:
                sunHalo 3.2s ease-in-out infinite;
        }

        #haldo-sun::after {
            content: "";

            position: absolute;

            inset: 8%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 32% 28%,
                    rgba(255, 255, 255, 0.7),
                    transparent 18%
                );

            opacity: 0.75;

            pointer-events: none;
        }

        #haldo-sun.active {
            animation:
                sunActivated 1.2s ease-out;
        }

        @keyframes sunBreathing {
            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(0.98);

                box-shadow:
                    0 0 12px rgba(255, 225, 100, 0.95),
                    0 0 30px rgba(255, 190, 50, 0.8),
                    0 0 65px rgba(255, 155, 35, 0.6),
                    0 0 110px rgba(255, 115, 20, 0.35),
                    0 0 180px rgba(255, 90, 15, 0.18);
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.035);

                box-shadow:
                    0 0 18px rgba(255, 240, 140, 1),
                    0 0 42px rgba(255, 205, 65, 0.95),
                    0 0 85px rgba(255, 165, 35, 0.72),
                    0 0 140px rgba(255, 115, 20, 0.45),
                    0 0 210px rgba(255, 90, 15, 0.22);
            }
        }

        @keyframes sunHalo {
            0%,
            100% {
                transform: scale(0.92);
                opacity: 0.72;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        @keyframes sunActivated {
            0% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            35% {
                transform:
                    translate(-50%, -50%)
                    scale(1.24);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        /* =====================================================
           HALDO LOGO
        ====================================================== */

        .sun-logo {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 46%;
            height: 46%;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: rgba(255, 255, 255, 0.96);

            font-size: clamp(18px, 3vw, 32px);
            font-weight: 800;

            letter-spacing: -0.04em;

            text-shadow:
                0 1px 5px rgba(110, 45, 0, 0.45),
                0 0 12px rgba(255, 255, 255, 0.55);

            pointer-events: none;
        }

        /* =====================================================
           PLANETS
        ====================================================== */

        .planet {
            position: absolute;

            left: 50%;
            top: 50%;

            border-radius: 50%;

            pointer-events: auto;

            cursor: pointer;

            z-index: 12;

            box-shadow:
                inset -8px -8px 15px rgba(0, 0, 0, 0.34),
                inset 4px 4px 9px rgba(255, 255, 255, 0.18),
                0 0 14px rgba(120, 170, 255, 0.16);

            transition:
                filter 180ms ease,
                box-shadow 180ms ease;
        }

        .planet:hover {
            filter: brightness(1.22);

            box-shadow:
                inset -8px -8px 15px rgba(0, 0, 0, 0.28),
                inset 4px 4px 9px rgba(255, 255, 255, 0.22),
                0 0 22px rgba(150, 195, 255, 0.34);
        }

        .planet-1 {
            width: 14px;
            height: 14px;

            background:
                radial-gradient(
                    circle at 32% 28%,
                    #fff2bb,
                    #d8a45a 35%,
                    #8b512a 75%,
                    #4c291c
                );

            animation:
                orbitPlanet1 14s linear infinite;
        }

        .planet-2 {
            width: 19px;
            height: 19px;

            background:
                radial-gradient(
                    circle at 34% 28%,
                    #fff1cf,
                    #e3a86d 28%,
                    #a45139 63%,
                    #4c2024
                );

            animation:
                orbitPlanet2 22s linear infinite;
        }

        .planet-3 {
            width: 26px;
            height: 26px;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #d8f4ff,
                    #5ba4ce 35%,
                    #28719d 63%,
                    #153e63 100%
                );

            animation:
                orbitPlanet3 32s linear infinite;
        }

        .planet-4 {
            width: 23px;
            height: 23px;

            background:
                radial-gradient(
                    circle at 30% 28%,
                    #ffe6b0,
                    #c68b4c 38%,
                    #88532c 67%,
                    #4d2d22
                );

            animation:
                orbitPlanet4 43s linear infinite;
        }

        .planet-5 {
            width: 37px;
            height: 37px;

            background:
                radial-gradient(
                    circle at 31% 27%,
                    #fff0ce,
                    #d9c08c 25%,
                    #9a774f 52%,
                    #59422f 100%
                );

            animation:
                orbitPlanet5 58s linear infinite;
        }

        .planet-5::before {
            content: "";

            position: absolute;

            width: 155%;
            height: 42%;

            left: -28%;
            top: 29%;

            border:
                2px solid rgba(214, 192, 142, 0.52);

            border-left-color:
                rgba(214, 192, 142, 0.2);

            border-right-color:
                rgba(214, 192, 142, 0.2);

            border-radius: 50%;

            transform:
                rotate(-13deg);
        }

        .planet-6 {
            width: 30px;
            height: 30px;

            background:
                radial-gradient(
                    circle at 30% 27%,
                    #d8ffff,
                    #72bfd2 34%,
                    #3d7f9b 62%,
                    #21455f 100%
                );

            animation:
                orbitPlanet6 74s linear infinite;
        }

        @keyframes orbitPlanet1 {
            from {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg)
                    translateX(14vw)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg)
                    translateX(14vw)
                    rotate(-360deg);
            }
        }

        @keyframes orbitPlanet2 {
            from {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg)
                    translateX(21vw)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg)
                    translateX(21vw)
                    rotate(-360deg);
            }
        }

        @keyframes orbitPlanet3 {
            from {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg)
                    translateX(28.5vw)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg)
                    translateX(28.5vw)
                    rotate(-360deg);
            }
        }

        @keyframes orbitPlanet4 {
            from {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg)
                    translateX(36vw)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg)
                    translateX(36vw)
                    rotate(-360deg);
            }
        }

        @keyframes orbitPlanet5 {
            from {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg)
                    translateX(43.5vw)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg)
                    translateX(43.5vw)
                    rotate(-360deg);
            }
        }

        @keyframes orbitPlanet6 {
            from {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg)
                    translateX(50vw)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg)
                    translateX(50vw)
                    rotate(-360deg);
            }
        }

        /* =====================================================
           TOP SYSTEM BAR
        ====================================================== */

        #top-bar {
            position: absolute;

            top:
                max(12px, env(safe-area-inset-top));

            left: 50%;

            transform:
                translateX(-50%);

            width:
                min(
                    calc(100% - 28px),
                    980px
                );

            min-height: 48px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                7px 10px;

            border:
                1px solid rgba(255, 255, 255, 0.09);

            border-radius: 18px;

            background:
                rgba(8, 12, 24, 0.52);

            backdrop-filter:
                blur(18px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(18px)
                saturate(125%);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.28);

            z-index: 100;
        }

        .system-brand {
            display: flex;
            align-items: center;
            gap: 9px;

            min-width: 0;
        }

        .brand-orb {
            width: 28px;
            height: 28px;

            flex: 0 0 auto;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #8dd8ff 28%,
                    #4776ff 62%,
                    #202e72
                );

            box-shadow:
                0 0 12px rgba(100, 160, 255, 0.65);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .brand-status {
            margin-top: 1px;

            font-size: 9px;

            color:
                rgba(255, 255, 255, 0.52);

            white-space: nowrap;
        }

        .system-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .system-button {
            width: 34px;
            height: 34px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 11px;

            background:
                rgba(255, 255, 255, 0.045);

            color: rgba(255, 255, 255, 0.86);

            cursor: pointer;

            transition:
                transform 150ms ease,
                background 150ms ease,
                border-color 150ms ease;
        }

        .system-button:hover {
            background:
                rgba(255, 255, 255, 0.09);

            border-color:
                rgba(255, 255, 255, 0.16);

            transform:
                translateY(-1px);
        }

        .system-button:active {
            transform:
                translateY(0)
                scale(0.96);
        }

        /* =====================================================
           COMPACT COMMAND MENU
        ====================================================== */

        #command-menu {
            position: absolute;

            left: 50%;
            bottom:
                max(16px, env(safe-area-inset-bottom));

            transform:
                translateX(-50%);

            width:
                min(
                    calc(100% - 28px),
                    640px
                );

            padding: 7px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            border:
                1px solid rgba(255, 255, 255, 0.10);

            border-radius: 19px;

            background:
                rgba(7, 10, 20, 0.66);

            backdrop-filter:
                blur(22px)
                saturate(135%);

            -webkit-backdrop-filter:
                blur(22px)
                saturate(135%);

            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.34);

            z-index: 200;
        }

        .command-button {
            position: relative;

            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid rgba(255, 255, 255, 0.06);

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.035);

            color:
                rgba(255, 255, 255, 0.88);

            cursor: pointer;

            transition:
                transform 150ms ease,
                background 150ms ease,
                box-shadow 150ms ease;
        }

        .command-button:hover {
            background:
                rgba(255, 255, 255, 0.09);

            transform:
                translateY(-2px);

            box-shadow:
                0 7px 20px rgba(0, 0, 0, 0.24);
        }

        .command-button:active {
            transform:
                translateY(0)
                scale(0.94);
        }

        .command-icon {
            font-size: 18px;
            line-height: 1;
        }

        .command-label {
            position: absolute;

            bottom:
                calc(100% + 9px);

            left: 50%;

            transform:
                translateX(-50%)
                translateY(4px);

            padding:
                5px 8px;

            border-radius: 8px;

            background:
                rgba(5, 8, 17, 0.92);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            color:
                rgba(255, 255, 255, 0.85);

            font-size: 9px;

            white-space: nowrap;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 140ms ease,
                transform 140ms ease;
        }

        .command-button:hover .command-label {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }

        /* =====================================================
           HALDO AI QUICK INDICATOR
        ====================================================== */

        #ai-presence {
            position: absolute;

            left: 50%;

            bottom:
                calc(
                    max(16px, env(safe-area-inset-bottom))
                    + 72px
                );

            transform:
                translateX(-50%);

            display: flex;
            align-items: center;
            gap: 7px;

            padding:
                6px 10px;

            border:
                1px solid rgba(255, 255, 255, 0.07);

            border-radius: 999px;

            background:
                rgba(5, 8, 17, 0.34);

            backdrop-filter:
                blur(12px);

            color:
                rgba(255, 255, 255, 0.55);

            font-size: 9px;

            z-index: 80;

            pointer-events: none;
        }

        .ai-presence-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                #7fffd4;

            box-shadow:
                0 0 8px rgba(127, 255, 212, 0.85);

            animation:
                aiPulse 2s ease-in-out infinite;
        }

        @keyframes aiPulse {
            0%,
            100% {
                opacity: 0.55;
                transform: scale(0.85);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        /* =====================================================
           WINDOW HOST
        ====================================================== */

        #window-host {
            position: absolute;

            inset: 0;

            z-index: 500;

            pointer-events: none;
        }

        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 680px) {

            #cosmic-center {
                width: 96vw;
                height: 96vw;
            }

            .orbit-1 {
                width: 28%;
                height: 28%;
            }

            .orbit-2 {
                width: 43%;
                height: 43%;
            }

            .orbit-3 {
                width: 58%;
                height: 58%;
            }

            .orbit-4 {
                width: 73%;
                height: 73%;
            }

            .orbit-5 {
                width: 88%;
                height: 88%;
            }

            .planet-1 {
                width: 10px;
                height: 10px;
            }

            .planet-2 {
                width: 14px;
                height: 14px;
            }

            .planet-3 {
                width: 20px;
                height: 20px;
            }

            .planet-4 {
                width: 18px;
                height: 18px;
            }

            .planet-5 {
                width: 28px;
                height: 28px;
            }

            .planet-6 {
                width: 23px;
                height: 23px;
            }

            #command-menu {
                width:
                    calc(100% - 20px);

                overflow-x: auto;

                justify-content: flex-start;

                scrollbar-width: none;
            }

            #command-menu::-webkit-scrollbar {
                display: none;
            }

            .command-button {
                flex: 0 0 auto;
            }

            #top-bar {
                width:
                    calc(100% - 20px);

                border-radius: 15px;
            }
        }

        @media (max-height: 620px) {

            #cosmic-center {
                transform:
                    translate(-50%, -52%)
                    scale(0.82);
            }

            #command-menu {

            function on(eventName, callback) {

                    typeof eventName !== "string" ||
                    typeof callback !== "function"
                ) {
                    return () => {};
                }

                if (!listeners.has(eventName)) {
                    listeners.set(
                        eventName,
                        new Set()
                    );
                }

                listeners
                    .get(eventName)
                    .add(callback);

                return () => {
                    listeners
                        .get(eventName)
                        ?.delete(callback);
                };

                    `haldo:${eventName}`,
                    {

                    listeners.get(eventName);

                    return;

    <!-- =========================================================
         WINDOW SYSTEM RUNTIME
    ========================================================== -->

    <script>
        (() => {
            "use strict";

            const OS =
                window.HalDo?.OS;

            if (!OS) {
                console.error(
                    "[HalDo] OS namespace fehlt."
                );

                return;
            }


            const $ =
                selector =>
                    document.querySelector(
                        selector
                    );


            const windowHost =
                $("#window-host");


            const template =
                $("#haldo-window-template");


            const windows =
                new Map();


            let zIndex =
                510;


            let activeWindowId =
                null;


            /* =================================================
               APP DEFINITIONS

               Diese Liste ist bewusst nur die Shell-Grundlage.
               Die tatsächlichen App-Module werden bevorzugt,
               sobald Registry/Runtime vorhanden sind.
            ================================================== */

            const shellApps = [

                {
                    id: "ai-chat",
                    name: "HalDo AI",
                    icon: "✦",
                    description:
                        "Intelligenter HalDo AI Chat"
                },

                {
                    id: "app-launcher",
                    name: "Apps",
                    icon: "⌘",
                    description:
                        "HalDo App-Zentrale"
                },

                {
                    id: "file-manager",
                    name: "Dateien",
                    icon: "□",
                    description:
                        "Dateien und Speicher"
                },

                {
                    id: "calendar",
                    name: "Kalender",
                    icon: "▣",
                    description:
                        "Termine und Kalender"
                },

                {
                    id: "ezidi-keyboard",
                    name: "Ezidi Tastatur",
                    icon: "⌨",
                    description:
                        "Mehrsprachige Tastatur"
                },

                {
                    id: "voice",
                    name: "Sprache",
                    icon: "◉",
                    description:
                        "Sprachsteuerung und Ausgabe"
                },

                {
                    id: "haldo-settings",
                    name: "Einstellungen",
                    icon: "⚙",
                    description:
                        "HalDo Systemeinstellungen"
                },

                {
                    id: "notifications",
                    name: "Benachrichtigungen",
                    icon: "♢",
                    description:
                        "Systemmeldungen"
                },

                {
                    id: "search",
                    name: "Suche",
                    icon: "⌕",
                    description:
                        "Systemweite Suche"
                },

                {
                    id: "browser",
                    name: "Browser",
                    icon: "◎",
                    description:
                        "Web und Internet"
                },

                {
                    id: "music",
                    name: "Musik",
                    icon: "♫",
                    description:
                        "Musik und Audio"
                },

                {
                    id: "gallery",
                    name: "Galerie",
                    icon: "▧",
                    description:
                        "Bilder und Medien"
                }

            ];


            /* =================================================
               APP REGISTRY BRIDGE
            ================================================== */

            function getExternalRegistry() {

                const candidates = [

                    window.HalDoAppRegistry,

                    window.HalDo?.AppRegistry,

                    window.AppRegistry

                ];

                return candidates.find(
                    registry =>
                        registry &&
                        typeof registry ===
                            "object"
                ) || null;
            }


            function getExternalApp(
                appId
            ) {

                const registry =
                    getExternalRegistry();

                if (!registry) {
                    return null;
                }


                try {

                    if (
                        typeof
                        registry.getApp
                        === "function"
                    ) {

                        return registry.getApp(
                            appId
                        );
                    }


                    if (
                        registry.apps &&
                        registry.apps[appId]
                    ) {

                        return registry.apps[
                            appId
                        ];
                    }

                } catch (error) {

                    console.warn(
                        "[HalDo Registry]",
                        error
                    );

                }

                return null;
            }


            function resolveApp(
                appId
            ) {

                const external =
                    getExternalApp(
                        appId
                    );

                if (external) {
                    return external;
                }


                return (
                    shellApps.find(
                        app =>
                            app.id === appId
                    ) ||
                    {
                        id: appId,
                        name: appId,
                        icon: "◈",
                        description:
                            "HalDo Anwendung"
                    }
                );
            }


            /* =================================================
               FOCUS
            ================================================== */

            function focusWindow(
                windowElement
            ) {

                if (!windowElement) {
                    return;
                }


                zIndex += 1;

                windowElement.style.zIndex =
                    String(zIndex);


                windows.forEach(
                    element => {

                        element.classList.remove(
                            "is-focused"
                        );

                    }
                );


                windowElement.classList.add(
                    "is-focused"
                );


                activeWindowId =
                    windowElement.dataset
                        .windowId ||
                    null;


                OS.events.emit(
                    "window:focused",
                    {
                        windowId:
                            activeWindowId,
                        appId:
                            windowElement.dataset
                                .appId
                    }
                );

            }


            /* =================================================
               WINDOW POSITION
            ================================================== */

            function centerWindow(
                element
            ) {

                if (!element) {
                    return;
                }


                element.style.left =
                    "50%";

                element.style.top =
                    "50%";

                element.style.transform =
                    "translate(-50%, -50%) scale(1)";

            }


            /* =================================================
               DRAG SYSTEM
            ================================================== */

            function makeDraggable(
                windowElement
            ) {

                const header =
                    windowElement.querySelector(
                        ".haldo-window-header"
                    );

                if (!header) {
                    return;
                }


                let dragging =
                    false;

                let startX = 0;
                let startY = 0;

                let startLeft = 0;
                let startTop = 0;


                const pointerDown =
                    event => {

                        if (
                            event.target.closest(
                                ".window-control"
                            )
                        ) {
                            return;
                        }


                        dragging = true;


                        const rect =
                            windowElement
                                .getBoundingClientRect();


                        startX =
                            event.clientX;

                        startY =
                            event.clientY;


                        startLeft =
                            rect.left;

                        startTop =
                            rect.top;


                        windowElement.style.left =
                            `${rect.left}px`;

                        windowElement.style.top =
                            `${rect.top}px`;

                        windowElement.style.transform =
                            "none";


                        focusWindow(
                            windowElement
                        );


                        try {
                            header.setPointerCapture(
                                event.pointerId
                            );
                        } catch (_) {}

                    };


                const pointerMove =
                    event => {

                        if (!dragging) {
                            return;
                        }


                        const dx =
                            event.clientX -
                            startX;

                        const dy =
                            event.clientY -
                            startY;


                        let nextLeft =
                            startLeft + dx;

                        let nextTop =
                            startTop + dy;


                        const rect =
                            windowElement
                                .getBoundingClientRect();


                        const margin = 8;


                        const maxLeft =
                            window.innerWidth -
                            rect.width -
                            margin;


                        const maxTop =
                            window.innerHeight -
                            rect.height -
                            margin;


                        nextLeft =
                            Math.max(
                                margin,
                                Math.min(
                                    nextLeft,
                                    maxLeft
                                )
                            );


                        nextTop =
                            Math.max(
                                margin,
                                Math.min(
                                    nextTop,
                                    maxTop
                                )
                            );


                        windowElement.style.left =
                            `${nextLeft}px`;

                        windowElement.style.top =
                            `${nextTop}px`;

                    };


                const pointerUp =
                    event => {

                        dragging = false;

                        try {
                            header.releasePointerCapture(
                                event.pointerId
                            );
                        } catch (_) {}

                    };


                header.addEventListener(
                    "pointerdown",
                    pointerDown
                );

                header.addEventListener(
                    "pointermove",
                    pointerMove
                );

                header.addEventListener(
                    "pointerup",
                    pointerUp
                );

                header.addEventListener(
                    "pointercancel",
                    pointerUp
                );

            }


            /* =================================================
               WINDOW ACTIONS
            ================================================== */

            function minimizeWindow(
                windowElement
            ) {

                windowElement.classList.add(
                    "is-minimized"
                );


                OS.events.emit(
                    "window:minimized",
                    {
                        windowId:
                            windowElement.dataset
                                .windowId
                    }
                );

            }


            function maximizeWindow(
                windowElement
            ) {

                windowElement.classList.toggle(
                    "is-maximized"
                );


                if (
                    windowElement.classList.contains(
                        "is-maximized"
                    )
                ) {

                    windowElement.style.left =
                        "50%";

                    windowElement.style.top =
                        "50%";

                    windowElement.style.transform =
                        "translate(-50%, -50%) scale(1)";

                } else {

                    centerWindow(
                        windowElement
                    );

                }


                focusWindow(
                    windowElement
                );


                OS.events.emit(
                    "window:maximized",
                    {
                        windowId:
                            windowElement.dataset
                                .windowId,
                        maximized:
                            windowElement.classList
                                .contains(
                                    "is-maximized"
                                )
                    }
                );

            }


            function closeWindow(
                windowElement
            ) {

                if (!windowElement) {
                    return;
                }


                const windowId =
                    windowElement.dataset
                        .windowId;


                const appId =
                    windowElement.dataset
                        .appId;


                windows.delete(
                    windowId
                );


                windowElement.classList.remove(
                    "is-open"
                );


                setTimeout(
                    () => {

                        windowElement.remove();

                    },
                    190
                );


                if (
                    activeWindowId ===
                    windowId
                ) {

                    activeWindowId =
                        null;

                }


                OS.events.emit(
                    "window:closed",
                    {
                        windowId,
                        appId
                    }
                );

            }


            /* =================================================
               WINDOW EVENT DELEGATION
            ================================================== */

            windowHost.addEventListener(
                "click",
                event => {

                    const control =
                        event.target.closest(
                            "[data-window-action]"
                        );


                    if (!control) {
                        return;
                    }


                    const windowElement =
                        control.closest(
                            ".haldo-window"
                        );


                    if (!windowElement) {
                        return;
                    }


                    const action =
                        control.dataset
                            .windowAction;


                    if (
                        action ===
                        "close"
                    ) {

                        closeWindow(
                            windowElement
                        );

                    }


                    if (
                        action ===
                        "minimize"
                    ) {

                        minimizeWindow(
                            windowElement
                        );

                    }


                    if (
                        action ===
                        "maximize"
                    ) {

                        maximizeWindow(
                            windowElement
                        );

                    }

                }
            );


            windowHost.addEventListener(
                "pointerdown",
                event => {

                    const windowElement =
                        event.target.closest(
                            ".haldo-window"
                        );


                    if (windowElement) {

                        focusWindow(
                            windowElement
                        );

                    }

                }
            );


            /* =================================================
               WINDOW CREATION
            ================================================== */

            function createWindow(
                appId,
                options = {}
            ) {

                const app =
                    resolveApp(
                        appId
                    );


                /*
                 * If the same application is already open,
                 * bring it to the front instead of creating
                 * duplicate windows.
                 */
                const existing =
                    Array.from(
                        windows.values()
                    ).find(
                        element =>
                            element.dataset
                                .appId ===
                            appId
                    );


                if (existing) {

                    existing.classList.remove(
                        "is-minimized"
                    );

                    focusWindow(
                        existing
                    );

                    return existing;

                }


                const fragment =
                    template.content
                        .cloneNode(true);


                const element =
                    fragment.querySelector(
                        ".haldo-window"
                    );


                if (!element) {
                    return null;
                }


                const windowId =
                    `window-${Date.now()}-${Math.random()
                        .toString(36)
                        .slice(2, 8)}`;


                element.dataset.windowId =
                    windowId;

                element.dataset.appId =
                    appId;


                const icon =
                    element.querySelector(
                        "[data-window-icon]"
                    );

                const title =
                    element.querySelector(
                        "[data-window-title]"
                    );

                const subtitle =
                    element.querySelector(
                        "[data-window-subtitle]"
                    );


                if (icon) {
                    icon.textContent =
                        options.icon ||
                        app.icon ||
                        "◈";
                }


                if (title) {
                    title.textContent =
                        options.title ||
                        app.name ||
                        appId;
                }


                if (subtitle) {
                    subtitle.textContent =
                        "HalDo AI OS";
                }


                windowHost.appendChild(
                    element
                );


                windows.set(
                    windowId,
                    element
                );


                const body =
                    element.querySelector(
                        "[data-window-body]"
                    );


                renderApp(
                    appId,
                    body,
                    app
                );


                makeDraggable(
                    element
                );


                if (
                    options.maximized
                ) {

                    element.classList.add(
                        "is-maximized"
                    );

                }


                requestAnimationFrame(
                    () => {

                        element.classList.add(
                            "is-open"
                        );

                        focusWindow(
                            element
                        );

                    }
                );


                OS.events.emit(
                    "window:created",
                    {
                        windowId,
                        appId
                    }
                );


                return element;
            }


            /* =================================================
               APP RENDERING
            ================================================== */

            function renderApp(
                appId,
                body,
                app
            ) {

                if (!body) {
                    return;
                }


                /*
                 * First preference:
                 * existing app runtime/module.
                 */

                try {

                    const runtime =
                        window.HalDoAppRuntime;


                    if (
                        runtime &&
                        typeof
                        runtime.renderApp
                        === "function"
                    ) {

                        const result =
                            runtime.renderApp(
                                appId,
                                body
                            );


                        if (
                            result !==
                            false
                        ) {

                            return;

                        }

                    }

                } catch (error) {

                    console.warn(
                        "[HalDo Runtime Render]",
                        error
                    );

                }


                /*
                 * Local shell applications.
                 */

                if (
                    appId ===
                    "app-launcher"
                ) {

                    renderLauncher(
                        body
                    );

                    return;
                }


                if (
                    appId ===
                    "ai-chat"
                ) {

                    renderAIChat(
                        body
                    );

                    return;
                }


                renderGenericApp(
                    body,
                    app
                );

            }


            /* =================================================
               APP LAUNCHER
            ================================================== */

            function renderLauncher(
                body
            ) {

                const fragment =
                    $("#app-launcher-template")
                        .content
                        .cloneNode(true);


                body.appendChild(
                    fragment
                );


                const grid =
                    body.querySelector(
                        "[data-app-grid]"
                    );


                const search =
                    body.querySelector(
                        "[data-app-search]"
                    );


                function draw(
                    filter = ""
                ) {

                    if (!grid) {
                        return;
                    }


                    grid.innerHTML = "";


                    const normalized =
                        filter
                            .trim()
                            .toLowerCase();


                    shellApps
                        .filter(
                            app => {

                                if (!normalized) {
                                    return true;
                                }


                                return (
                                    app.name
                                        .toLowerCase()
                                        .includes(
                                            normalized
                                        ) ||
                                    app.id
                                        .toLowerCase()
                                        .includes(
                                            normalized
                                        ) ||
                                    app.description
                                        .toLowerCase()
                                        .includes(
                                            normalized
                                        )
                                );

                            }
                        )
                        .forEach(
                            app => {

                                const card =
                                    document.createElement(
                                        "button"
                                    );


                                card.type =
                                    "button";


                                card.className =
                                    "app-card";


                                card.dataset.appId =
                                    app.id;


                                card.innerHTML = `
                                    <span class="app-card-icon">
                                        ${escapeHTML(app.icon)}
                                    </span>

                                    <span>
                                        <span class="app-card-name">
                                            ${escapeHTML(app.name)}
                                        </span>

                                        <span class="app-card-status">
                                            ${escapeHTML(app.description)}
                                        </span>
                                    </span>
                                `;


                                card.addEventListener(
                                    "click",
                                    () => {

                                        openApp(
                                            app.id
                                        );

                                    }
                                );


                                grid.appendChild(
                                    card
                                );

                            }
                        );

                }


                search?.addEventListener(
                    "input",
                    event => {

                        draw(
                            event.target.value
                        );

                    }
                );


                draw();

            }


            /* =================================================
               AI CHAT
            ================================================== */

            function renderAIChat(
                body
            ) {

                const fragment =
                    $("#ai-chat-template")
                        .content
                        .cloneNode(true);


                body.appendChild(
                    fragment
                );


                const messages =
                    body.querySelector(
                        "[data-ai-messages]"
                    );


                const input =
                    body.querySelector(
                        "[data-ai-input]"
                    );


                const send =
                    body.querySelector(
                        "[data-ai-send]"
                    );


                function addMessage(
                    text,
                    type
                ) {

                    if (!messages) {
                        return;
                    }


                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        `ai-message ${type}`;


                    element.textContent =
                        text;


                    messages.appendChild(
                        element
                    );


                    messages.scrollTop =
                        messages.scrollHeight;

                }


                function sendMessage() {

                    const text =
                        input?.value
                            ?.trim();


                    if (!text) {
                        return;
                    }


                    addMessage(
                        text,
                        "user"
                    );


                    input.value = "";


                    /*
                     * Send to the real HalDo AI runtime
                     * whenever it is available.
                     */

                    let handled =
                        false;


                    try {

                        const ai =
                            window.HalDoAI ||
                            window.HalDo?.AI;


                        if (
                            ai &&
                            typeof
                            ai.ask ===
                            "function"
                        ) {

                            handled = true;


                            Promise.resolve(
                                ai.ask(text)
                            )
                            .then(
                                response => {

                                    addMessage(
                                        typeof response ===
                                            "string"
                                            ? response
                                            : JSON.stringify(
                                                response
                                            ),
                                        "haldo"
                                    );

                                }
                            )
                            .catch(
                                error => {

                                    console.error(
                                        "[HalDo AI]",
                                        error
                                    );

                                    addMessage(
                                        "HalDo AI konnte die Anfrage gerade nicht verarbeiten.",
                                        "haldo"
                                    );

                                }
                            );

                        }

                    } catch (error) {

                        console.error(
                            "[HalDo AI Bridge]",
                            error
                        );

                    }


                    /*
                     * Emit the request even if the local AI
                     * engine is not currently loaded.
                     */
                    OS.events.emit(
                        "ai:message",
                        {
                            text
                        }
                    );


                    if (!handled) {

                        addMessage(
                            "Deine Nachricht wurde an das HalDo AI-System übergeben.",
                            "haldo"
                        );

                    }

                }


                send?.addEventListener(
                    "click",
                    sendMessage
                );


                input?.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                                "Enter" &&
                            !event.shiftKey
                        ) {

                            event.preventDefault();

                            sendMessage();

                        }

                    }
                );

            }


            /* =================================================
               GENERIC APP
            ================================================== */

            function renderGenericApp(
                body,
                app
            ) {

                const fragment =
                    $("#generic-app-template")
                        .content
                        .cloneNode(true);


                body.appendChild(
                    fragment
                );


                const title =
                    body.querySelector(
                        "[data-generic-title]"
                    );


                const description =
                    body.querySelector(
                        "[data-generic-description]"
                    );


                const content =
                    body.querySelector(
                        "[data-generic-content]"
                    );


                if (title) {
                    title.textContent =
                        app.name ||
                        app.id;
                }


                if (description) {
                    description.textContent =
                        app.description ||
                        "HalDo Anwendung";
                }


                if (content) {

                    content.innerHTML = `
                        <div
                            style="
                                padding:18px;
                                border:1px solid rgba(255,255,255,.07);
                                border-radius:13px;
                                background:rgba(255,255,255,.035);
                                color:rgba(255,255,255,.62);
                                font-size:11px;
                                line-height:1.6;
                            "
                        >
                            <strong
                                style="
                                    display:block;
                                    color:rgba(255,255,255,.9);
                                    margin-bottom:6px;
                                "
                            >
                                ${escapeHTML(app.name || app.id)}
                            </strong>

                            Diese Anwendung ist mit der
                            HalDo-OS-Shell verbunden.
                            Das vorhandene App-Modul wird
                            bevorzugt verwendet, sobald es
                            von Registry und Runtime bereitgestellt
                            wird.
                        </div>
                    `;

                }

            }


            /* =================================================
               ESCAPE
            ================================================== */

            function escapeHTML(
                value
            ) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.textContent =
                    String(value ?? "");


                return div.innerHTML;

            }


            /* =================================================
               PUBLIC OPEN API
            ================================================== */

            function openApp(
                appId,
                options = {}
            ) {

                if (
                    !appId ||
                    typeof appId !==
                        "string"
                ) {

                    return null;

                }


                /*
                 * First ask the real application runtime.
                 *
                 * It can handle applications that already have
                 * their own modules.
                 */

                try {

                    const runtime =
                        window.HalDoAppRuntime;


                    if (
                        runtime &&
                        typeof
                        runtime.openApp ===
                            "function"
                    ) {

                        const result =
                            runtime.openApp(
                                appId,
                                options
                            );


                        if (
                            result !==
                            false &&
                            result !==
                            undefined
                        ) {

                            return result;

                        }

                    }

                } catch (error) {

                    console.warn(
                        "[HalDo Runtime Open]",
                        error
                    );

                }


                /*
                 * Local fallback window.
                 */
                return createWindow(
                    appId,
                    options
                );

            }


            /* =================================================
               PUBLIC CLOSE API
            ================================================== */

            function closeApp(
                appId
            ) {

                const target =
                    Array.from(
                        windows.values()
                    ).find(
                        element =>
                            element.dataset
                                .appId ===
                            appId
                    );


                if (!target) {
                    return false;
                }


                closeWindow(
                    target
                );


                return true;

            }


            /* =================================================
               PUBLIC WINDOW API
            ================================================== */

            OS.windows = {

                open:
                    openApp,

                close:
                    closeApp,

                focus:
                    windowElement =>
                        focusWindow(
                            windowElement
                        ),

                list:
                    () =>
                        Array.from(
                            windows.values()
                        ).map(
                            element => ({
                                id:
                                    element.dataset
                                        .windowId,

                                appId:
                                    element.dataset
                                        .appId
                            })
                        )

            };


            OS.apps = {

                list:
                    () =>
                        shellApps.map(
                            app => ({
                                ...app
                            })
                        ),

                get:
                    appId =>
                        resolveApp(
                            appId
                        ),

                open:
                    openApp,

                close:
                    closeApp

            };


            /*
             * Compatibility bridges.
             * Existing modules can use these if they are present.
             */
            window.HalDoWindowManager =
                window.HalDoWindowManager ||
                OS.windows;


            window.HalDoAppShell =
                window.HalDoAppShell ||
                OS.apps;


            /* =================================================
               REQUEST-OPEN EVENT
            ================================================== */

            OS.events.on(
                "app:request-open",
                ({ appId, options }) => {

                    if (!appId) {
                        return;
                    }


                    openApp(
                        appId,
                        options || {}
                    );

                }
            );


            /* =================================================
               RUNTIME READY BRIDGE
            ================================================== */

            window.addEventListener(
                "haldo:runtime:ready",
                () => {

                    OS.status
                        ?.setSystemStatus(
                            "HalDo Runtime bereit"
                        );

                }
            );


            /* =================================================
               PUBLIC GLOBAL OPEN FUNCTION

               Nur als Kompatibilitätsbrücke.
            ================================================== */

            window.HalDoOpenApp =
                openApp;


            /* =================================================
               WINDOW SYSTEM READY
            ================================================== */

            OS.events.emit(
                "window-system:ready",
                {
                    windows:
                        windows.size
                }
            );

        })();
    </script>
