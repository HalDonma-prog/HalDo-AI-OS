<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="HalDo AI OS 24.6 – Cosmic Intelligent Operating System" />
    <title>HalDo AI OS 24.6</title>

    <!-- Three.js für Cosmic World -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================
           HALDO AI OS 24.6 – KOMPLETTES DESIGN
           ============================================ */

        :root {
            --primary: #6C3CE1;
            --primary-dark: #4A1FA6;
            --primary-light: #8B5CF6;
            --secondary: #00D4FF;
            --accent: #FF6B9D;
            --gold: #FFD700;
            --success: #00FF88;
            --warning: #FFB800;
            --danger: #FF3B30;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(20px);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --bg-primary: #0a0a1a;
            --taskbar-height: 56px;
            --font-primary: 'Inter', sans-serif;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-primary);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== BOOT SCREEN ===== */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #boot-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .boot-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .boot-logo {
            width: 120px;
            height: 120px;
            border-radius: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bootPulse 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
        }
        #boot-logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }
        @keyframes bootPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 100px rgba(108, 60, 225, 0.5);
            }
        }
        .boot-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .boot-subtitle {
            font-size: 13px;
            font-weight: 300;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: -6px;
        }
        .boot-ring {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--primary-light);
            border-right: 3px solid var(--secondary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .boot-status {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 1px;
            min-height: 24px;
        }
        .boot-progress {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }
        .boot-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .boot-version {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: var(--bg-primary);
        }
        #cosmic-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #cosmic-canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== DESKTOP ICONS ===== */
        #desktop-icons {
            position: fixed;
            top: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 80px);
            gap: 12px;
            z-index: 1;
            padding: 12px;
            max-width: 80%;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 90px;
            padding: 8px;
            border-radius: 16px;
            background: var(--glass-bg);
            border: 1px solid transparent;
            transition: all var(--transition-fast);
            cursor: pointer;
            text-align: center;
            gap: 4px;
            backdrop-filter: var(--glass-blur);
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--glass-border);
            transform: translateY(-3px);
            box-shadow: var(--glass-shadow);
        }
        .desktop-icon:active {
            transform: scale(0.95);
        }
        .desktop-icon .icon-img {
            font-size: 32px;
            line-height: 1;
        }
        .desktop-icon .icon-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            line-height: 1.2;
            max-width: 72px;
            word-wrap: break-word;
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--taskbar-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.4);
        }
        .taskbar-left,
        .taskbar-center,
        .taskbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #taskbar-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 8px;
            cursor: pointer;
            transition: transform var(--transition-fast);
        }
        #taskbar-logo:hover {
            transform: scale(1.1);
        }
        #taskbar-time {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }
        #taskbar-apps {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            padding: 0 8px;
        }
        .taskbar-app-btn {
            padding: 4px 12px;
            height: 34px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .taskbar-app-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--glass-border);
        }
        .taskbar-app-btn.active {
            background: rgba(108, 60, 225, 0.3);
            border-color: var(--primary);
            color: var(--text-primary);
        }
        .taskbar-right {
            gap: 12px;
            flex-shrink: 0;
        }
        .taskbar-right span {
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: all var(--transition-fast);
            line-height: 1;
        }
        .taskbar-right span:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        #taskbar-status {
            color: var(--success) !important;
            font-size: 10px !important;
        }

        /* ===== WINDOWS ===== */
        #window-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - var(--taskbar-height));
            z-index: 10;
            pointer-events: none;
        }
        .window {
            position: absolute;
            min-width: 400px;
            min-height: 300px;
            max-width: 92vw;
            max-height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
            pointer-events: all;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowOpen 0.25s ease;
        }
        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(16px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .window.minimized {
            transform: scale(0.8) translateY(40px);
            opacity: 0;
            pointer-events: none;
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - var(--taskbar-height)) !important;
            border-radius: 0;
            max-width: 100vw;
            max-height: 100vh;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--glass-border);
            cursor: grab;
            flex-shrink: 0;
            min-height: 44px;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .window-title img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        .window-controls {
            display: flex;
            gap: 6px;
        }
        .window-controls button {
            width: 14px;
            height: 14px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all var(--transition-fast);
            padding: 0;
            font-size: 8px;
            line-height: 14px;
            text-align: center;
            color: transparent;
        }
        .window-controls .btn-close {
            background: #FF5F57;
        }
        .window-controls .btn-close:hover {
            background: #FF3B30;
            transform: scale(1.15);
        }
        .window-controls .btn-minimize {
            background: #FFBD2E;
        }
        .window-controls .btn-minimize:hover {
            background: #FFA500;
            transform: scale(1.15);
        }
        .window-controls .btn-maximize {
            background: #28C840;
        }
        .window-controls .btn-maximize:hover {
            background: #00A020;
            transform: scale(1.15);
        }
        .window-body {
            flex: 1;
            padding: 16px;
            overflow: auto;
            color: var(--text-secondary);
        }

        /* ===== AI FLOATING BUTTON ===== */
        .floating-btn {
            position: fixed;
            bottom: 80px;
            right: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 30px rgba(108, 60, 225, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            transition: all var(--transition-normal);
            border: none;
            outline: none;
        }
        .floating-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 40px rgba(108, 60, 225, 0.7);
        }
        .floating-btn:active {
            transform: scale(0.95);
        }
        .floating-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            :root {
                --taskbar-height: 48px;
            }
            .boot-title {
                font-size: 22px;
            }
            .boot-logo {
                width: 80px;
                height: 80px;
            }
            #boot-logo-img {
                width: 50px;
                height: 50px;
            }
            .boot-progress {
                width: 200px;
            }
            #desktop-icons {
                grid-template-columns: repeat(auto-fill, 64px);
                gap: 8px;
                top: 12px;
                left: 12px;
                padding: 8px;
            }
            .desktop-icon {
                width: 64px;
                height: 72px;
                padding: 4px;
            }
            .desktop-icon .icon-img {
                font-size: 28px;
            }
            .desktop-icon .icon-label {
                font-size: 9px;
                max-width: 56px;
            }
            #taskbar {
                padding: 0 8px;
                height: var(--taskbar-height);
            }
            #taskbar-logo {
                width: 24px;
                height: 24px;
            }
            #taskbar-time {
                font-size: 11px;
            }
            .taskbar-app-btn {
                font-size: 10px;
                padding: 2px 8px;
                height: 28px;
            }
            .taskbar-right span {
                font-size: 12px;
            }
            .window {
                min-width: 85vw;
                min-height: 50vh;
                max-width: 95vw;
                max-height: 80vh;
            }
            .window-header {
                padding: 8px 12px;
                min-height: 36px;
            }
            .window-title {
                font-size: 12px;
            }
            .window-controls button {
                width: 12px;
                height: 12px;
                line-height: 12px;
                font-size: 7px;
            }
            .floating-btn {
                width: 48px;
                height: 48px;
                bottom: 64px;
                right: 16px;
            }
            .floating-logo {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== BOOT SCREEN ===== -->
    <div id="boot-screen">
        <div class="boot-container">
            <div class="boot-logo">
                <img src="assets/images/logo.png" alt="HalDo OS" id="boot-logo-img" />
            </div>
            <h1 class="boot-title">HalDo AI OS</h1>
            <p class="boot-subtitle">cosmic intelligent operating system</p>
            <div class="boot-loader">
                <div class="boot-ring"></div>
            </div>
            <p class="boot-status" id="boot-status">wird initialisiert…</p>
            <div class="boot-progress">
                <div class="boot-progress-bar" id="boot-progress-bar"></div>
            </div>
            <p class="boot-version">v24.6</p>
        </div>
    </div>

    <!-- ===== DESKTOP ===== -->
    <div id="desktop" style="display:none;">

        <!-- Cosmic World Canvas -->
        <div id="cosmic-canvas-container"></div>

        <!-- Desktop Icons -->
        <div id="desktop-icons"></div>

        <!-- Window Container -->
        <div id="window-container"></div>

        <div id="ai-floating-btn" class="floating-btn">

        <!-- Taskbar -->
        <div id="taskbar">
            <div class="taskbar-left">
                <img src="assets/images/logo.png" alt="HalDo" id="taskbar-logo" />
                <span id="taskbar-time">00:00</span>
            </div>
            <div class="taskbar-center">
                <div id="taskbar-apps"></div>
            </div>
            <div class="taskbar-right">
                <span id="taskbar-language">DE</span>
                <span id="taskbar-voice">👩 DE</span>
                <span id="taskbar-theme">🌙</span>
                <span id="taskbar-notifications">🔔</span>
                <span id="taskbar-status">●</span>
            </div>
        </div>

    </div>

    <!-- ============================================= -->
    <!-- JAVASCRIPT – DAS GANZE SYSTEM IN EINER DATEI -->
    <!-- ============================================= -->

    <script>
        // ============================================================
        //  1. STORAGE SYSTEM
        // ============================================================
        const Storage = {
            prefix: 'haldo_',
            get(key, fallback = null) {
                try {
                    const data = localStorage.getItem(this.prefix + key);
                    return data ? JSON.parse(data) : fallback;
                } catch { return fallback; }
            },
            set(key, value) {
                try {
                    localStorage.setItem(this.prefix + key, JSON.stringify(value));
                    return true;
                } catch { return false; }
            },
            remove(key) {
                localStorage.removeItem(this.prefix + key);
                return true;
            },
            clear() {
                Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
                return true;
            }
        };
        window.Storage = Storage;

        // ============================================================
        //  2. EVENT BUS
        // ============================================================
        class EventBus {
            constructor() {
                this.events = {};
                this.onceEvents = {};
                this.debug = false;
            }
            on(event, callback, context = null) {
                if (!this.events[event]) this.events[event] = [];
                this.events[event].push({ callback, context });
                return this;
            }
            once(event, callback, context = null) {
                if (!this.onceEvents[event]) this.onceEvents[event] = [];
                this.onceEvents[event].push({ callback, context });
                return this;
            }
            emit(event, data = null) {
                if (this.debug) console.log(`📤 Event: ${event}`, data);
                if (this.events[event]) {
                    this.events[event].forEach(sub => {
                        try { sub.callback.call(sub.context || null, data); } catch (e) { console.error(e); }
                    });
                }
                if (this.onceEvents[event]) {
                    const subs = this.onceEvents[event];
                    this.onceEvents[event] = [];
                    subs.forEach(sub => {
                        try { sub.callback.call(sub.context || null, data); } catch (e) { console.error(e); }
                    });
                }
                return this;
            }
            off(event, callback) {
                if (this.events[event]) {
                    this.events[event] = this.events[event].filter(s => s.callback !== callback);
                }
                return this;
            }
        }
        const eventBus = new EventBus();
        window.EventBus = eventBus;

        // ============================================================
        //  3. KERNEL
        // ============================================================
        const Kernel = {
            version: '24.6',
            name: 'HalDo AI OS',
            state: { initialized: false, uptime: 0 },
            init() {
                console.log(`🔧 ${this.name} ${this.version} – Kernel initialisiert`);
                this.state.initialized = true;
                this.state.uptime = Date.now();
                EventBus.emit('kernel:ready');
                return this;
            },
            getUptime() {
                return Math.floor((Date.now() - this.state.uptime) / 1000);
            },
            reboot() {
                location.reload();
            },
            shutdown() {
                if (window.close) window.close();
            }
        };
        window.Kernel = Kernel;

        // ============================================================
        //  4. BOOT SYSTEM
        // ============================================================
        const Boot = {
            status: 'idle',
            progress: 0,
            totalSteps: 6,
            currentStep: 0,
            statusEl: null,
            progressBar: null,

            init() {
                this.statusEl = document.getElementById('boot-status');
                this.progressBar = document.getElementById('boot-progress-bar');
                return this;
            },

            async start() {
                if (this.status === 'booting') return;
                this.status = 'booting';
                this.progress = 0;
                this.currentStep = 0;

                const steps = [
                    { label: 'Kernel wird geladen…', fn: () => Kernel.init() },
                    { label: 'Speicher wird initialisiert…', fn: () => Storage.set('boot_test', true) },
                    { label: 'Event-System wird gestartet…', fn: () => EventBus.emit('boot:step') },
                    { label: 'Cosmic World wird aufgebaut…', fn: () => CosmicWorld.init() },
                    { label: 'Apps werden geladen…', fn: () => AppManager.init() },
                    { label: 'System bereit! 🚀', fn: () => this.finish() }
                ];

                for (const step of steps) {
                    this.currentStep++;
                    this.updateStatus(step.label);
                    this.updateProgress((this.currentStep / this.totalSteps) * 100);
                    try {
                        await step.fn();
                    } catch (e) {
                        console.warn('⚠️ Schritt fehlgeschlagen:', e);
                    }
                    await this.sleep(200);
                }

                this.status = 'ready';
                this.hideBootScreen();
            },

            updateStatus(text) {
                if (this.statusEl) this.statusEl.textContent = text;
            },
            updateProgress(value) {
                this.progress = Math.min(value, 100);
                if (this.progressBar) this.progressBar.style.width = this.progress + '%';
            },
            hideBootScreen() {
                const screen = document.getElementById('boot-screen');
                screen.classList.add('hidden');
                setTimeout(() => screen.style.display = 'none', 800);
                document.getElementById('desktop').style.display = 'block';
                document.querySelector('.floating-btn').style.display = 'flex';
            },
            sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        };
        window.Boot = Boot;

        // ============================================================
        //  5. COSMIC WORLD (ULTIMATE)
        // ============================================================
        const CosmicWorld = {
            scene: null,
            camera: null,
            renderer: null,
            isReady: false,
            animationId: null,
            planetData: [],
            starField: null,
            clock: null,
            sunMesh: null,
            logoTexture: null,

            init() {
                console.log('🌌 Cosmic World ULTIMATE wird initialisiert...');

                let container = document.getElementById('cosmic-canvas-container');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'cosmic-canvas-container';
                    container.style.cssText =
                    'position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;cursor:pointer;';
                    document.body.prepend(container);
                }
                this.container = container;

                this.loadLogo();
                if (typeof THREE === 'undefined') {
                    console.warn('⚠️ Three.js nicht geladen – lade...');
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
                    script.onload = () => { this.setupScene();
                        this.animate();
                        this.isReady = true; };
                    document.head.appendChild(script);
                    return;
                }
                this.setupScene();
                this.animate();
                this.isReady = true;
                window.addEventListener('resize', () => this.onResize());
                this.container.addEventListener('click', (e) => this.onSunClick(e));
                console.log('✅ Cosmic World ready!');
                return this;
            },

            loadLogo() {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = 'assets/images/logo.png';
                img.onload = () => {
                    console.log('✅ Logo geladen!');
                    this.logoTexture = new THREE.Texture(img);
                    if (this.sunMesh) {
                        this.sunMesh.material.map = this.logoTexture;
                        this.sunMesh.material.needsUpdate = true;
                    }
                };
                img.onerror = () => console.warn('⚠️ Logo nicht gefunden');
            },

            setupScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0a1a);

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 20, 50);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                this.container.appendChild(this.renderer.domElement);

                this.setupLighting();
                this.createSun();
                this.createPlanets();
                this.createStars(365);
                this.createNebula();
                this.clock = new THREE.Clock();
            },

            setupLighting() {
                this.scene.add(new THREE.AmbientLight(0x222244, 0.6));
                const sunLight = new THREE.PointLight(0xffaa33, 3, 150);
                sunLight.position.set(0, 0, 0);
                this.scene.add(sunLight);
                const dirLight = new THREE.DirectionalLight(0x4466ff, 0.3);
                dirLight.position.set(10, 20, 10);
                this.scene.add(dirLight);
            },

            createSun() {
                const geo = new THREE.SphereGeometry(3.5, 64, 64);
                let mat;
                if (this.logoTexture) {
                    mat = new THREE.MeshStandardMaterial({
                        map: this.logoTexture,
                        emissive: 0xff6600,
                        emissiveIntensity: 0.3,
                        roughness: 0.2,
                        metalness: 0.0
                    });
                } else {
                    mat = new THREE.MeshStandardMaterial({
                        color: 0xff8800,
                        emissive: 0xff4400,
                        emissiveIntensity: 1.0,
                        roughness: 0.2,
                        metalness: 0.0
                    });
                }
                this.sunMesh = new THREE.Mesh(geo, mat);
                this.sunMesh.position.set(0, 0, 0);
                this.sunMesh.userData.isSun = true;
                this.scene.add(this.sunMesh);

                // Glow
                const glowGeo = new THREE.SphereGeometry(4.2, 32, 32);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0xff6600,
                    transparent: true,
                    opacity: 0.2,
                    blending: THREE.AdditiveBlending
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.set(0, 0, 0);
                this.scene.add(glow);
                this.sunGlow = glow;

                // Äußere Corona
                const outerGlowGeo = new THREE.SphereGeometry(5.5, 32, 32);
                const outerGlowMat = new THREE.MeshBasicMaterial({
                    color: 0xff4400,
                    transparent: true,
                    opacity: 0.08,
                    blending: THREE.AdditiveBlending
                });
                const outerGlow = new THREE.Mesh(outerGlowGeo, outerGlowMat);
                outerGlow.position.set(0, 0, 0);
                this.scene.add(outerGlow);
                this.outerGlow = outerGlow;
            },

            createPlanets() {
                const planets = [
                    { name: 'Merkur', size: 0.3, distance: 5.0, color: 0xaaaaaa, speed: 0.04, moons: 0,
                    type: 'second' },
                    { name: 'Venus', size: 0.5, distance: 7.0, color: 0xffcc88, speed: 0.025, moons: 0,
                    type: 'minute' },
                    { name: 'Erde', size: 0.55, distance: 9.5, color: 0x4488ff, speed: 0.018, moons: 1,
                    type: 'hour' },
                    { name: 'Mars', size: 0.45, distance: 12.0, color: 0xff4422, speed: 0.014, moons: 0 },
                    { name: 'Jupiter', size: 1.3, distance: 15.0, color: 0xddbb88, speed: 0.009, moons: 0 },
                    { name: 'Saturn', size: 1.1, distance: 18.5, color: 0xeeddbb, speed: 0.007, moons: 0 },
                    { name: 'Uranus', size: 0.8, distance: 22.0, color: 0x88ddff, speed: 0.005, moons: 0 },
                    { name: 'Neptun', size: 0.75, distance: 25.5, color: 0x3366ff, speed: 0.004, moons: 0 },
                    { name: 'Pluto', size: 0.2, distance: 29.0, color: 0xccbbaa, speed: 0.003, moons: 0 },
                    { name: 'HalDo-1', size: 0.4, distance: 33.0, color: 0x8B5CF6, speed: 0.0025, moons: 0 },
                    { name: 'HalDo-2', size: 0.35, distance: 37.0, color: 0x00D4FF, speed: 0.002, moons: 0 },
                    { name: 'HalDo-3', size: 0.3, distance: 41.0, color: 0xFF6B9D, speed: 0.0015, moons: 0 }
                ];

                this.planetData = [];
                planets.forEach((data, index) => {
                    const geo = new THREE.SphereGeometry(data.size, 32, 32);
                    const mat = new THREE.MeshStandardMaterial({
                        color: data.color,
                        roughness: 0.5,
                        metalness: 0.1,
                        emissive: data.color,
                        emissiveIntensity: 0.05
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    const angle = (index / planets.length) * Math.PI * 2 + Math.random() * 0.3;
                    mesh.position.x = Math.cos(angle) * data.distance;
                    mesh.position.z = Math.sin(angle) * data.distance;
                    mesh.userData = {
                        distance: data.distance,
                        speed: data.speed,
                        angle: angle,
                        name: data.name,
                        moons: data.moons,
                        type: data.type || 'normal'
                    };
                    this.scene.add(mesh);

                    // Umlaufbahn
                    const orbitPoints = [];
                    for (let i = 0; i <= 80; i++) {
                        const theta = (i / 80) * Math.PI * 2;
                        orbitPoints.push(new THREE.Vector3(
                            Math.cos(theta) * data.distance,
                            0,
                            Math.sin(theta) * data.distance
                        ));
                    }
                    const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
                    const orbitMat = new THREE.LineBasicMaterial({
                        color: data.color,
                        transparent: true,
                        opacity: 0.15
                    });
                    const orbit = new THREE.Line(orbitGeo, orbitMat);
                    this.scene.add(orbit);

                    // Erde + Mond
                    if (data.name === 'Erde') {
                        const moonGeo = new THREE.SphereGeometry(0.15, 16, 16);
                        const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9 });
                        const moon = new THREE.Mesh(moonGeo, moonMat);
                        moon.userData = { angle: 0, speed: 0.06, distance: 1.2 };
                        mesh.add(moon);
                        this.moon = moon;
                    }

                    this.planetData.push({
                        mesh,
                        distance: data.distance,
                        speed: data.speed,
                        angle: angle,
                        name: data.name,
                        type: data.type || 'normal'
                    });
                });
            },

            createStars(count = 365) {
                const geo = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const sizes = new Float32Array(count);

                for (let i = 0; i < count; i++) {
                    const radius = 40 + Math.random() * 180;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    positions[i * 3 + 2] = radius * Math.cos(phi);
                    const color = new THREE.Color().setHSL(0.55 + Math.random() * 0.25, 0.3, 0.6 + Math.random() * 0.4);
                    colors[i * 3] = color.r;
                    colors[i * 3 + 1] = color.g;
                    colors[i * 3 + 2] = color.b;
                    sizes[i] = 0.15 + Math.random() * 0.6;
                }

                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const mat = new THREE.PointsMaterial({
                    size: 0.35,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.95,
                    blending: THREE.AdditiveBlending
                });
                this.starField = new THREE.Points(geo, mat);
                this.scene.add(this.starField);
            },

            createNebula() {
                const count = 2000;
                const geo = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                for (let i = 0; i < count; i++) {
                    const radius = 20 + Math.random() * 80;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.3;
                    positions[i * 3 + 2] = radius * Math.cos(phi);
                    const hue = 0.65 + Math.random() * 0.25;
                    const color = new THREE.Color().setHSL(hue, 0.6, 0.15 + Math.random() * 0.25);
                    colors[i * 3] = color.r;
                    colors[i * 3 + 1] = color.g;
                    colors[i * 3 + 2] = color.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const mat = new THREE.PointsMaterial({
                    size: 0.8,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.1,
                    blending: THREE.AdditiveBlending
                });
                const nebula = new THREE.Points(geo, mat);
                this.scene.add(nebula);
                this.nebula = nebula;
            },

            animate() {
                this.animationId = requestAnimationFrame(() => this.animate());
                if (!this.scene || !this.camera || !this.renderer) return;
                const time = this.clock ? this.clock.getElapsedTime() : Date.now() * 0.001;

                // Sonne
                if (this.sunMesh) {
                    this.sunMesh.rotation.y += 0.002;
                    if (this.sunGlow) {
                        const pulse = 1 + Math.sin(time * 0.6) * 0.04;
                        this.sunGlow.scale.set(pulse, pulse, pulse);
                        this.sunGlow.material.opacity = 0.2 + Math.sin(time * 0.5) * 0.05;
                    }
                    if (this.outerGlow) {
                        const pulse2 = 1 + Math.sin(time * 0.3 + 1) * 0.06;
                        this.outerGlow.scale.set(pulse2, pulse2, pulse2);
                    }
                }

                // Planeten
                if (this.planetData) {
                    this.planetData.forEach(data => {
                        let speedFactor = 1;
                        if (data.type === 'second') speedFactor = 2.0;
                        else if (data.type === 'minute') speedFactor = 1.0;
                        else if (data.type === 'hour') speedFactor = 0.5;
                        data.angle += data.speed * speedFactor * 0.5;
                        data.mesh.position.x = Math.cos(data.angle) * data.distance;
                        data.mesh.position.z = Math.sin(data.angle) * data.distance;
                        data.mesh.rotation.y += 0.02;

                        if (data.name === 'Erde' && this.moon) {
                            const moonData = this.moon.userData;
                            moonData.angle += moonData.speed;
                            this.moon.position.x = Math.cos(moonData.angle) * moonData.distance;
                            this.moon.position.z = Math.sin(moonData.angle) * moonData.distance;
                        }
                    });
                }

                // Sterne funkeln
                if (this.starField) {
                    const sizes = this.starField.geometry.attributes.size;
                    if (sizes) {
                        for (let i = 0; i < sizes.count; i++) {
                            sizes.array[i] = 0.15 + (0.3 + Math.sin(time * (0.5 + i * 0.01)) * 0.3) * 0.5;
                        }
                        sizes.needsUpdate = true;
                    }
                }

                // Kamera
                if (this.camera) {
                    const camAngle = time * 0.015;
                    this.camera.position.x = Math.sin(camAngle) * 8;
                    this.camera.position.z = 48 + Math.sin(camAngle * 0.7) * 4;
                    this.camera.position.y = 18 + Math.sin(camAngle * 0.5) * 2;
                    this.camera.lookAt(0, 0, 0);
                }

                this.renderer.render(this.scene, this.camera);
            },

            onSunClick(event) {
                if (!this.scene || !this.camera) return;
                const rect = this.container.getBoundingClientRect();
                const x = (event.clientX - rect.left) / rect.width * 2 - 1;
                const y = -(event.clientY - rect.top) / rect.height * 2 + 1;
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2(x, y);
                raycaster.setFromCamera(mouse, this.camera);
                const intersects = raycaster.intersectObjects(this.scene.children, true);
                let hitSun = false;
                for (let hit of intersects) {
                    let obj = hit.object;
                    while (obj) {
                        if (obj.userData && obj.userData.isSun) { hitSun = true; break; }
                        obj = obj.parent;
                    }
                    if (hitSun) break;
                }
                if (hitSun) {
                    console.log('☀️ Sonne geklickt – öffne HalDo AI!');
                    AppManager.openApp('haldo-ai');
                }
            },

            onResize() {
                if (!this.camera || !this.renderer) return;
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        };
        window.CosmicWorld = CosmicWorld;

        // ============================================================
        //  6. APP MANAGER (mit allen Apps)
        // ============================================================
        const AppManager = {
            apps: [],
            installedApps: [],
            isReady: false,

            appDefinitions: [
                { id: 'settings', name: 'Einstellungen', icon: '⚙️', category: 'System' },
                { id: 'haldo-ai', name: 'HalDo AI', icon: '🤖', category: 'AI' },
                { id: 'ai-chat', name: 'AI Chat', icon: '💬', category: 'AI' },
                { id: 'notes', name: 'Notizen', icon: '📝', category: 'Tools' },
                { id: 'calculator', name: 'Taschenrechner', icon: '🧮', category: 'Tools' },
                { id: 'calendar', name: 'Kalender', icon: '📅', category: 'Tools' },
                { id: 'browser', name: 'Browser', icon: '🌐', category: 'Internet' },
                { id: 'weather', name: 'Wetter', icon: '🌦️', category: 'Internet' },
                { id: 'contacts', name: 'Kontakte', icon: '👥', category: 'Kommunikation' },
                { id: 'file-manager', name: 'Dateien', icon: '📂', category: 'System' },
                { id: 'gallery', name: 'Galerie', icon: '🖼️', category: 'Media' },
                { id: 'music', name: 'Musik', icon: '🎵', category: 'Media' },
                { id: 'video-player', name: 'Video', icon: '🎬', category: 'Media' },
                { id: 'camera', name: 'Kamera', icon: '📷', category: 'Tools' },
                { id: 'voice-center', name: 'Voice Center', icon: '🎤', category: 'System' },
                { id: 'themes', name: 'Themes', icon: '🎨', category: 'System' },
                { id: 'system-monitor', name: 'System Monitor', icon: '📊', category: 'System' },
                { id: 'terminal', name: 'Terminal', icon: '⌨️', category: 'System' },
                { id: 'app-center', name: 'App Center', icon: '📱', category: 'System' },
                { id: 'cosmic-world', name: 'Cosmic World', icon: '🌌', category: 'Cosmic' }
            ],

            init() {
                console.log('📱 App Manager wird initialisiert...');
                this.apps = this.appDefinitions;
                this.installedApps = Storage.get('installed_apps', []);
                if (this.installedApps.length === 0) {
                    this.installedApps = this.apps.map(a => a.id);
                    Storage.set('installed_apps', this.installedApps);
                }
                this.renderDesktopIcons();
                this.isReady = true;
                console.log(`✅ ${this.installedApps.length} Apps installiert`);
                return this;
            },

            openApp(appId) {
                const app = this.apps.find(a => a.id === appId);
                if (!app) return false;
                if (!this.installedApps.includes(appId)) {
                    alert('App nicht installiert');
                    return false;
                }

                // Spezialfall: Cosmic World
                if (appId === 'cosmic-world') {
                    if (CosmicWorld.isReady) {
                        alert('🌌 Cosmic World läuft bereits im Hintergrund!');
                    } else {
                        CosmicWorld.init();
                    }
                    return true;
                }

                // Spezialfall: Settings
                if (appId === 'settings') {
                    this.openSettingsWindow();
                    return true;
                }

                // Spezialfall: AI Chat
                if (appId === 'ai-chat' || appId === 'haldo-ai') {
                    this.openAIChatWindow();
                    return true;
                }

                // Allgemeine App
                this.openGenericWindow(app);
                return true;
            },

            openGenericWindow(app) {
                const content = this.getAppContent(app.id);
                const windowEl = this.createWindow(app.name, app.icon, content);
                document.getElementById('window-container').appendChild(windowEl);
                this.updateTaskbar();
            },

            createWindow(title, icon, content) {
                const win = document.createElement('div');
                win.className = 'window';
                win.style.cssText = 'left:80px;top:60px;width:500px;height:400px;z-index:100;';

                win.innerHTML = `
                    <div class="window-header">
                        <div class="window-title">
                            <span style="font-size:20px;">${icon}</span>
                            <span>${title}</span>
                        </div>
                        <div class="window-controls">
                            <button class="btn-minimize" onclick="this.closest('.window').classList.toggle('minimized')">−</button>
                            <button class="btn-maximize" onclick="this.closest('.window').classList.toggle('maximized')">⛶</button>
                            <button class="btn-close" onclick="this.closest('.window').remove(); AppManager.updateTaskbar();">✕</button>
                        </div>
                    </div>
                    <div class="window-body">${content}</div>
                `;
                return win;
            },

            getAppContent(appId) {
                const app = this.apps.find(a => a.id === appId);
                if (!app) return '<p>App nicht gefunden</p>';

                switch (appId) {
                    case 'notes':
                        return this.getNotesContent();
                    case 'calculator':
                        return this.getCalculatorContent();
                    case 'calendar':
                        return this.getCalendarContent();
                    case 'weather':
                        return this.getWeatherContent();
                    case 'contacts':
                        return this.getContactsContent();
                    default:
                        return `
                            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;">
                                <div style="font-size:64px;">${app.icon}</div>
                                <h2>${app.name}</h2>
                                <p style="color:var(--text-secondary);">Diese App ist bereit für HalDo OS 24.6</p>
                                <p style="color:var(--text-muted);font-size:12px;">Version 1.0 | ${app.category}</p>
                            </div>
                        `;
                }
            },

            getNotesContent() {
                const notes = Storage.get('notes', []);
                return `
                    <div style="display:flex;flex-direction:column;height:100%;">
                        <div style="display:flex;gap:8px;margin-bottom:12px;">
                            <input id="notes-input" type="text" placeholder="Neue Notiz..." style="flex:1;padding:8px 12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-primary);outline:none;">
                            <button onclick="AppManager.addNote()" style="padding:8px 16px;background:var(--primary);border:none;border-radius:8px;color:white;cursor:pointer;">+</button>
                        </div>
                        <div id="notes-list" style="flex:1;overflow-y:auto;">
                            ${notes.length === 0 ? '<p style="color:var(--text-muted);">Keine Notizen</p>' :
                            notes.map((n, i) => `
                                <div style="display:flex;justify-content:space-between;padding:8px 12px;background:var(--glass-bg);border-radius:8px;margin:4px 0;">
                                    <span>${n}</span>
                                    <button onclick="AppManager.deleteNote(${i})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;">✕</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            getCalculatorContent() {
                return `
                    <div style="max-width:280px;margin:0 auto;">
                        <div style="padding:12px;background:rgba(0,0,0,0.2);border-radius:8px;text-align:right;font-size:28px;font-weight:700;margin-bottom:12px;" id="calc-display">0</div>
                        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
                            ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(b => `
                                <button onclick="AppManager.calcInput('${b}')" style="padding:12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-primary);font-size:18px;cursor:pointer;">${b}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            getCalendarContent() {
                const now = new Date();
                const month = now.toLocaleString('de', { month: 'long' });
                const year = now.getFullYear();
                return `
                    <div style="text-align:center;">
                        <h2 style="margin-bottom:12px;">${month} ${year}</h2>
                        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">
                            ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div style="color:var(--text-muted);font-size:12px;">${d}</div>`).join('')}
                            ${Array.from({length:30}, (_,i) => `
                                <div style="padding:8px;border-radius:8px;${i+1===now.getDate()?'background:var(--primary);color:white;':'background:var(--glass-bg);'}">${i+1}</div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            getWeatherContent() {
                return `
                    <div style="text-align:center;padding:20px;">
                        <div style="font-size:64px;">☀️</div>
                        <div style="font-size:32px;font-weight:700;">22°C</div>
                        <p style="color:var(--text-secondary);">Sonnig • Berlin</p>
                        <div style="display:flex;justify-content:center;gap:24px;margin-top:16px;">
                            <div>💧 65%</div>
                            <div>💨 12 km/h</div>
                        </div>
                    </div>
                `;
            },

            getContactsContent() {
                return `
                    <div style="padding:16px;">
                        <input type="text" placeholder="Suchen..." style="width:100%;padding:8px 12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-primary);outline:none;margin-bottom:12px;">
                        <p style="color:var(--text-muted);text-align:center;">Keine Kontakte</p>
                    </div>
                `;
            },

            openSettingsWindow() {
                const categories = [
                    { id: 'display', label: '🖥️ Display' },
                    { id: 'ai', label: '🧠 AI & Memory' },
                    { id: 'language', label: '🌍 Sprache' },
                    { id: 'themes', label: '🎨 Themes' },
                    { id: 'system', label: '📊 System' }
                ];
                const content = `
                    <div style="display:flex;height:100%;">
                        <div style="width:150px;padding:8px;border-right:1px solid var(--glass-border);">
                            ${categories.map(c => `
                                <div onclick="AppManager.showSettings('${c.id}')" style="padding:8px 12px;margin:2px 0;border-radius:8px;cursor:pointer;color:var(--text-secondary);hover:background:var(--glass-bg);" data-cat="${c.id}">${c.label}</div>
                            `).join('')}
                        </div>
                        <div id="settings-content" style="flex:1;padding:16px;overflow-y:auto;">
                            <h2>Einstellungen</h2>
                            <p style="color:var(--text-secondary);">Wähle eine Kategorie</p>
                        </div>
                    </div>
                `;
                const win = this.createWindow('Einstellungen', '⚙️', content);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
                // AI & Memory Tab als Standard
                setTimeout(() => this.showSettings('ai'), 100);
            },

            showSettings(category) {
                const container = document.getElementById('settings-content');
                if (!container) return;

                // Aktive Kategorie hervorheben
                document.querySelectorAll('[data-cat]').forEach(el => {
                    el.style.background = el.dataset.cat === category ? 'var(--primary)' : 'transparent';
                    el.style.color = el.dataset.cat === category ? 'white' : 'var(--text-secondary)';
                });

                let content = '';
                switch (category) {
                    case 'display':
                        content = `
                            <h2>🖥️ Display</h2>
                            <div style="margin-top:12px;">
                                <label style="display:block;margin:8px 0;">Auflösung</label>
                                <select style="width:100%;padding:8px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-primary);">
                                    <option>Full HD (1920x1080)</option>
                                    <option>4K (3840x2160)</option>
                                    <option>8K (7680x4320)</option>
                                </select>
                            </div>
                        `;
                        break;
                    case 'ai':
                        const apiKey = Storage.get('groq_api_key', '');
                        content = `
                            <h2>🧠 AI & Memory</h2>
                            <div style="margin-top:12px;">
                                <label style="display:block;margin:8px 0;">🔑 Groq API Key</label>
                                <input type="password" id="ai-key-input" value="${apiKey}" placeholder="gsk_..." style="width:100%;padding:8px 12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-primary);outline:none;">
                                <button onclick="AppManager.saveAIKey()" style="margin-top:8px;padding:8px 16px;background:var(--primary);border:none;border-radius:8px;color:white;cursor:pointer;">Speichern</button>
                                <div style="margin-top:12px;padding:12px;background:var(--glass-bg);border-radius:8px;">
                                    <p style="color:var(--text-secondary);">🧠 Memory: ${Storage.get('ai_memory', []).length} Einträge</p>
                                    <button onclick="Storage.set('ai_memory', []);alert('Memory gelöscht!');" style="margin-top:8px;padding:4px 12px;background:var(--danger);border:none;border-radius:6px;color:white;cursor:pointer;">Löschen</button>
                                </div>
                            </div>
                        `;
                        break;
                    case 'language':
                        content = `
                            <h2>🌍 Sprache</h2>
                            <div style="margin-top:12px;">
                                <label style="display:block;margin:8px 0;">Systemsprache</label>
                                <select style="width:100%;padding:8px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:8px;color:var(--text-primary);">
                                    <option>🇩🇪 Deutsch</option>
                                    <option>🇬🇧 English</option>
                                    <option>🏴 Kurmancî</option>
                                    <option>🇹🇷 Türkçe</option>
                                </select>
                            </div>
                        `;
                        break;
                    case 'themes':
                        content = `
                            <h2>🎨 Themes</h2>
                            <div style="display:flex;gap:12px;margin-top:12px;">
                                <div onclick="document.documentElement.setAttribute('data-theme','dark')" style="padding:12px;background:var(--glass-bg);border-radius:12px;cursor:pointer;border:2px solid var(--glass-border);">🌙 Dark</div>
                                <div onclick="document.documentElement.setAttribute('data-theme','light')" style="padding:12px;background:var(--glass-bg);border-radius:12px;cursor:pointer;border:2px solid var(--glass-border);">☀️ Light</div>
                                <div onclick="document.documentElement.setAttribute('data-theme','cosmic')" style="padding:12px;background:var(--glass-bg);border-radius:12px;cursor:pointer;border:2px solid var(--glass-border);">🌌 Cosmic</div>
                            </div>
                        `;
                        break;
                    case 'system':
                        content = `
                            <h2>📊 System</h2>
                            <div style="margin-top:12px;">
                                <p><strong>Version:</strong> 24.6</p>
                                <p><strong>Uptime:</strong> ${Kernel.getUptime()}s</p>
                                <p><strong>Apps:</strong> ${this.installedApps.length}</p>
                                <button onclick="Kernel.reboot()" style="margin-top:12px;padding:8px 16px;background:var(--warning);border:none;border-radius:8px;color:white;cursor:pointer;">🔄 Neustart</button>
                            </div>
                        `;
                        break;
                }
                container.innerHTML = content;
            },

            saveAIKey() {
                const input = document.getElementById('ai-key-input');
                if (!input) return;
                const key = input.value.trim();
                if (key) {
                    Storage.set('groq_api_key', key);
                    alert('✅ API Key gespeichert!');
                } else {
                    alert('⚠️ Bitte einen gültigen Key eingeben.');
                }
            },

            openAIChatWindow() {
                const content = `
                    <div style="display:flex;flex-direction:column;height:100%;padding:0;">
                        <div id="ai-chat-messages" style="flex:1;overflow-y:auto;padding:12px;margin-bottom:8px;">
                            <div style="text-align:center;color:var(--text-muted);padding:20px;">
                                💙 Hallo! Ich bin HalDo, deine KI-Assistentin.
                            </div>
                        </div>
                        <div style="display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--glass-border);">
                            <input id="ai-chat-input" type="text" placeholder="Nachricht an HalDo..." style="flex:1;padding:10px 14px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;color:var(--text-primary);outline:none;font-size:14px;">
                            <button onclick="AppManager.sendAIMessage()" style="padding:10px 18px;background:var(--primary);border:none;border-radius:12px;color:white;cursor:pointer;">📤</button>
                            <button onclick="AppManager.toggleVoice()" style="padding:10px 14px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;color:var(--text-secondary);cursor:pointer;font-size:16px;">🎤</button>
                        </div>
                    </div>
                `;
                const win = this.createWindow('HalDo AI', '🤖', content);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            sendAIMessage() {
                const input = document.getElementById('ai-chat-input');
                const messages = document.getElementById('ai-chat-messages');
                if (!input || !messages || !input.value.trim()) return;

                const text = input.value.trim();
                input.value = '';

                // User-Nachricht
                const userMsg = document.createElement('div');
                userMsg.style.cssText =
                    'text-align:right;margin:6px 0;padding:10px 14px;background:var(--primary);border-radius:12px;color:white;max-width:85%;margin-left:auto;';
                userMsg.textContent = '🧑 ' + text;
                messages.appendChild(userMsg);

                // Lade-Indikator
                const loading = document.createElement('div');
                loading.style.cssText = 'text-align:left;margin:6px 0;padding:10px 14px;background:var(--glass-bg);border-radius:12px;color:var(--text-secondary);max-width:85%;';
                loading.textContent = '💭 HalDo denkt...';
                messages.appendChild(loading);
                messages.scrollTop = messages.scrollHeight;

                // API-Key prüfen
                const apiKey = Storage.get('groq_api_key', '');
                if (!apiKey) {
                    loading.textContent = '⚠️ Bitte trage deinen Groq API Key in den Settings ein!';
                    return;
                }

                // Anfrage an Groq
                fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'mixtral-8x7b-32768',
                            messages: [
                                { role: 'system', content: 'Du bist HalDo, eine freundliche KI-Assistentin.' },
                                { role: 'user', content: text }
                            ],
                            temperature: 0.7,
                            max_tokens: 500
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        loading.remove();
                        const reply = data.choices?.[0]?.message?.content || 'Keine Antwort';
                        const aiMsg = document.createElement('div');
                        aiMsg.style.cssText =
                            'text-align:left;margin:6px 0;padding:10px 14px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;color:var(--text-primary);max-width:85%;';
                        aiMsg.textContent = '💙 ' + reply;
                        messages.appendChild(aiMsg);
                        messages.scrollTop = messages.scrollHeight;

                        // Memory speichern
                        const memory = Storage.get('ai_memory', []);
                        memory.push({ user: text, assistant: reply, time: Date.now() });
                        if (memory.length > 50) memory.shift();
                        Storage.set('ai_memory', memory);
                    })
                    .catch(err => {
                        loading.textContent = '❌ Fehler: ' + err.message;
                    });
            },

            toggleVoice() {
                const btn = document.querySelector('#ai-chat-input + button + button');
                if (btn) {
                    btn.textContent = btn.textContent === '🎤' ? '⏹️' : '🎤';
                    btn.style.color = btn.textContent === '⏹️' ? 'var(--success)' : 'var(--text-secondary)';
                }
                // Speech Recognition (vereinfacht)
                if ('webkitSpeechRecognition' in window) {
                    const recognition = new webkitSpeechRecognition();
                    recognition.lang = 'de-DE';
                    recognition.onresult = (event) => {
                        const text = event.results[0][0].transcript;
                        const input = document.getElementById('ai-chat-input');
                        if (input) {
                            input.value = text;
                            AppManager.sendAIMessage();
                        }
                    };
                    recognition.start();
                } else {
                    alert('🎤 Speech Recognition wird von deinem Browser nicht unterstützt.');
                }
            },

            addNote() {
                const input = document.getElementById('notes-input');
                if (!input || !input.value.trim()) return;
                const notes = Storage.get('notes', []);
                notes.push(input.value.trim());
                Storage.set('notes', notes);
                input.value = '';
                // Refresh notes list
                const win = document.querySelector('.window .window-body');
                if (win) {
                    win.innerHTML = AppManager.getNotesContent();
                }
            },

            deleteNote(index) {
                const notes = Storage.get('notes', []);
                notes.splice(index, 1);
                Storage.set('notes', notes);
                const win = document.querySelector('.window .window-body');
                if (win) {
                    win.innerHTML = AppManager.getNotesContent();
                }
            },

            calcInput(value) {
                const display = document.getElementById('calc-display');
                if (!display) return;
                if (value === '=') {
                    try {
                        display.textContent = eval(display.textContent.replace('×', '*').replace('÷', '/'));
                    } catch { display.textContent = 'Error'; }
                } else if (value === 'C') {
                    display.textContent = '0';
                } else if (value === '⌫') {
                    display.textContent = display.textContent.length > 1 ? display.textContent.slice(0, -1) : '0';
                } else {
                    if (display.textContent === '0' && value !== '.') display.textContent = value;
                    else display.textContent += value;
                }
            },

            renderDesktopIcons() {
                const container = document.getElementById('desktop-icons');
                if (!container) return;
                const apps = this.apps.filter(a => this.installedApps.includes(a.id));
                container.innerHTML = apps.map(app => `
                    <div class="desktop-icon" onclick="AppManager.openApp('${app.id}')">
                        <div class="icon-img">${app.icon}</div>
                        <div class="icon-label">${app.name}</div>
                    </div>
                `).join('');
            },

            updateTaskbar() {
                const container = document.getElementById('taskbar-apps');
                if (!container) return;
                const windows = document.querySelectorAll('#window-container .window');
                container.innerHTML = '';
                windows.forEach(win => {
                    const title = win.querySelector('.window-title span:last-child')?.textContent || 'App';
                    const btn = document.createElement('button');
                    btn.className = 'taskbar-app-btn';
                    btn.textContent = title;
                    btn.onclick = () => {
                        win.classList.toggle('minimized');
                        this.updateTaskbar();
                    };
                    container.appendChild(btn);
                });
            }
        };
        window.AppManager = AppManager;

        // ============================================================
        //  7. UHR & TASKBAR
        // ============================================================
        function updateClock() {
            const el = document.getElementById('taskbar-time');
            if (el) {
                const now = new Date();
                el.textContent = now.toLocaleTimeString('de', { hour: '2-digit', minute: '2-digit' });
            }
        }

        // ============================================================
        //  8. MAIN – START
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 HalDo AI OS 24.6 startet...');

            // Boot initialisieren
            Boot.init();

            // Taskbar Klicks
            document.getElementById('taskbar-logo')?.addEventListener('click', () => {
                AppManager.openApp('app-center');
            });

            document.getElementById('taskbar-notifications')?.addEventListener('click', () => {
                alert('🔔 Keine neuen Benachrichtigungen');
            });

            document.getElementById('taskbar-status')?.addEventListener('click', () => {
                alert(`✅ System läuft\nVersion: 24.6\nUptime: ${Kernel.getUptime()}s`);
            });

            document.getElementById('taskbar-theme')?.addEventListener('click', () => {
                const themes = ['dark', 'light', 'cosmic'];
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                const next = themes[(themes.indexOf(current) + 1) % themes.length];
                document.documentElement.setAttribute('data-theme', next);
                document.getElementById('taskbar-theme').textContent = next === 'dark' ? '🌙' : next === 'light' ?
                    '☀️' : '🌌';
            });

            // AI Floating Button
            document.getElementById('ai-floating-btn')?.addEventListener('click', () => {
                AppManager.openApp('haldo-ai');
            });

            // Uhr starten
            updateClock();
            setInterval(updateClock, 10000);

            // Boot starten
            setTimeout(() => Boot.start(), 300);

            console.log('✅ HalDo AI OS 24.6 bereit! 💙❤️🚀');
        });

        // Globale Fehlerbehandlung
        window.onerror = (msg, url, line) => {
            console.error('❌ Globaler Fehler:', msg, url, line);
        };

        console.log('💙❤️🚀 HalDo AI OS 24.6 – Cosmic Intelligent Operating System');
    </script>

</body>
</html>
