<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
HalDo AI OS 18
</title>

<link
    rel="stylesheet"
    href="style.css"
>

<link
    rel="manifest"
    href="manifest.json"
>

<meta
    name="theme-color"
    content="#090D18"
>

</head>


<body>


<!-- =========================================
     STARTUP SCREEN
========================================= -->

<section
    id="startup-screen"
    class="screen"
>


    <img
        src="assets/logo/logo.svg"
        class="logo"
        alt="HalDo AI OS Logo"
    >


    <h1>
        HalDo AI OS 18
    </h1>


    <p id="system-status">
        🟡 HalDo AI OS startet...
    </p>


</section>




<!-- =========================================
     WELCOME SCREEN
========================================= -->

<section
    id="welcome-screen"
    class="screen hidden"
>


    <img
        src="assets/logo/logo.svg"
        class="logo"
        alt="HalDo AI OS Logo"
    >


    <h1>

        👋
        <span data-i18n="welcome">
            Willkommen bei HalDo AI OS
        </span>

        <br>

        18

    </h1>


    <p>
        Professional Ultimate Foundation
    </p>


    <p id="clock">
        Systemzeit wird geladen...
    </p>


    <button
        onclick="openMainMenu()"
    >

        🚀
        <span data-i18n="menu">
            Hauptmenü
        </span>

    </button>


</section>




<!-- =========================================
     MAIN MENU
========================================= -->

<section
    id="main-menu"
    class="hidden"
>


    <header class="header">


        <img
            src="assets/logo/logo.svg"
            class="logo small"
            alt="HalDo AI OS"
        >


        <h1>
            HalDo AI OS 18
        </h1>


        <p>
            Professional Ultimate Foundation
        </p>


        <!-- LANGUAGE SELECTOR -->

        <div class="language-selector">

            🌍

            <select
                id="main-language-select"
                aria-label="Sprache"
            >

            </select>

        </div>


    </header>




    <main class="menu-container">


        <h2>

            🚀

            <span data-i18n="menu">
                Hauptmenü
            </span>

        </h2>




        <div class="menu-grid">


            <!-- DASHBOARD -->

            <button
                onclick="openPage('dashboard.html')"
            >

                📊

                <span data-i18n="dashboard">
                    Dashboard
                </span>

            </button>




            <!-- AI CORE -->

            <button
                onclick="openPage('ai-core.html')"
            >

                🧠

                <span data-i18n="aiCore">
                    AI Core
                </span>

            </button>




            <!-- MODULES -->

            <button
                onclick="openPage('modules.html')"
            >

                🧩

                <span data-i18n="modules">
                    Module
                </span>

            </button>




            <!-- APPS -->

            <button
                onclick="openPage('apps.html')"
            >

                📱

                <span data-i18n="apps">
                    Apps
                </span>

            </button>




            <!-- SETTINGS -->

            <button
                onclick="openPage('settings.html')"
            >

                ⚙️

                <span data-i18n="settings">
                    Einstellungen
                </span>

            </button>




            <!-- SYSTEM STATUS -->

            <button
                onclick="openPage('status.html')"
            >

                📡

                <span data-i18n="status">
                    System Status
                </span>

            </button>




            <!-- HEALTH -->

            <button
                onclick="openPage('health.html')"
            >

                🏥

                <span data-i18n="health">
                    Health Center
                </span>

            </button>


        </div>


    </main>


</section>




<!-- =========================================
     CORE SYSTEM
========================================= -->

<script src="js/boot.js"></script>

<script src="js/kernel.js"></script>

<script src="js/system.js"></script>

<script src="js/module-manager.js"></script>

<script src="js/system-status.js"></script>

<script src="js/language-system.js"></script>

<script src="js/language-manager.js"></script>

<script src="js/startup.js"></script>




<!-- =========================================
     INDEX CONTROLLER
========================================= -->

<script>

(function () {

    "use strict";



    /* ======================================
       MAIN MENU
    ====================================== */


    window.openMainMenu = function () {


        const welcome =
            document.getElementById(
                "welcome-screen"
            );


        const menu =
            document.getElementById(
                "main-menu"
            );


        if (welcome) {

            welcome.style.display =
                "none";

        }


        if (menu) {

            menu.classList.remove(
                "hidden"
            );

        }


        initializeMainLanguage();

    };




    /* ======================================
       PAGE NAVIGATION
    ====================================== */


    window.openPage = function (page) {

        if (!page) {

            return;

        }


        window.location.href =
            page;

    };




    /* ======================================
       CLOCK
    ====================================== */


    function updateClock() {


        const clock =
            document.getElementById(
                "clock"
            );


        if (!clock) {

            return;

        }


        const now =
            new Date();


        clock.textContent =
            "🕒 " +
            now.toLocaleTimeString(
                "de-DE"
            );

    }




    setInterval(
        updateClock,
        1000
    );


    updateClock();




    /* ======================================
       LANGUAGE SELECTOR
    ====================================== */


    function initializeMainLanguage() {


        const select =
            document.getElementById(
                "main-language-select"
            );


        if (
            !select ||
            !window.HalDoLanguageSystem
        ) {

            return;

        }


        const languages =
            HalDoLanguageSystem
                .getLanguages();


        select.innerHTML =
            "";


        languages.forEach(
            function (language) {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    language.id;


                option.textContent =
                    language.native;


                select.appendChild(
                    option
                );

            }
        );


        select.value =
            HalDoLanguageSystem.current;




        select.onchange =
            function () {


                HalDoLanguageSystem
                    .setLanguage(
                        this.value
                    );


            };

    }




    /* ======================================
       LANGUAGE SYSTEM READY
    ====================================== */


    window.addEventListener(
        "DOMContentLoaded",
        function () {


            setTimeout(
                function () {


                    initializeMainLanguage();


                },
                300
            );


        }
    );

})();

</script>


</body>

</html>
