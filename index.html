        );

    };


/* =========================================================
   WELCOME
   ========================================================= */

HD12.ai.ensureWelcomeMessage =
    function(instance) {

        if (
            HD12.ai.chat.messages.length >
            0
        ) {

            return;

        }


        HD12.ai.addMessage(
            "assistant",
            "Hallo ❤️ Ich bin HalDo AI. " +
            "Du kannst mit mir schreiben, Fragen stellen, " +
            "Ideen entwickeln, lernen, planen und dich " +
            "unterhalten. Was möchtest du gemeinsam machen?"
        );


        HD12.ai.renderMessages(
            instance
        );

    };


/* =========================================================
   BIND
   ========================================================= */

HD12.ai.bindInterface =
    function(instance) {

        const element =
            instance.element;


        const input =
            element.querySelector(
                "[data-ai-input]"
            );


        const send =
            element.querySelector(
                "[data-ai-send]"
            );


        const voice =
            element.querySelector(
                "[data-ai-voice]"
            );


        const clear =
            element.querySelector(
                "[data-ai-clear]"
            );


        if (send) {

            send.addEventListener(
                "click",
                () => {

                    HD12.ai.send(
                        instance
                    );

                }
            );

        }


        if (input) {

            input.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();

                        HD12.ai.send(
                            instance
                        );

                    }

                }
            );


            input.addEventListener(
                "input",
                () => {

                    input.style.height =
                        "auto";


                    input.style.height =
                        Math.min(
                            input.scrollHeight,
                            140
                        ) +
                        "px";

                }
            );

        }


        if (voice) {

            voice.addEventListener(
                "click",
                () => {

                    HD12.ai.toggleVoiceInput(
                        instance
                    );

                }
            );

        }


        if (clear) {

            clear.addEventListener(
                "click",
                () => {

                    HD12.ai.clearConversation(
                        instance
                    );

                }
            );

        }

    };


/* =========================================================
   RENDER MESSAGES
   ========================================================= */

HD12.ai.renderMessages =
    function(instance) {

        const container =
            instance.element.querySelector(
                "[data-ai-messages]"
            );


        if (!container) {

            return;

        }


        container.innerHTML =
            HD12.ai.chat.messages
                .map(
                    message => `

                        <div
                            class="
                                haldo-ai-message
                                ${message.role}
                            "
                        >

                            ${HD12.ai.escape(
                                message.text
                            )}

                            <span
                                class="
                                    haldo-ai-message-time
                                "
                            >
                                ${new Date(
                                    message.timestamp
                                ).toLocaleTimeString(
                                    [],
                                    {
                                        hour:
                                            "2-digit",
                                        minute:
                                            "2-digit"
                                    }
                                )}
                            </span>

                        </div>

                    `
                )
                .join("");


        container.scrollTop =
            container.scrollHeight;

    };


/* =========================================================
   TYPING INDICATOR
   ========================================================= */

HD12.ai.showTyping =
    function(instance) {

        const container =
            instance.element.querySelector(
                "[data-ai-messages]"
            );


        if (!container) {

            return;

        }


        const typing =
            document.createElement(
                "div"
            );


        typing.className =
            "haldo-ai-message assistant";


        typing.dataset.typing =
            "true";


        typing.innerHTML = `

            <span
                class="haldo-ai-typing"
            >
                <span></span>
                <span></span>
                <span></span>
            </span>

        `;


        container.appendChild(
            typing
        );


        container.scrollTop =
            container.scrollHeight;

    };


/* =========================================================
   REMOVE TYPING
   ========================================================= */

HD12.ai.hideTyping =
    function(instance) {

        const typing =
            instance.element.querySelector(
                '[data-typing="true"]'
            );


        if (typing) {

            typing.remove();

        }

    };


/* =========================================================
   SEND
   ========================================================= */

HD12.ai.send =
    async function(instance) {

        const input =
            instance.element.querySelector(
                "[data-ai-input]"
            );


        if (!input) {

            return;

        }


        const text =
            input.value.trim();


        if (!text) {

            return;

        }


        input.value =
            "";


        input.style.height =
            "auto";


        HD12.ai.addMessage(
            "user",
            text
        );


        HD12.ai.renderMessages(
            instance
        );


        HD12.ai.setStatus(
            instance,
            "HalDo AI denkt nach …"
        );


        HD12.ai.showTyping(
            instance
        );


        try {

            const answer =
                await HD12.ai.generateAnswer(
                    text,
                    instance
                );


            HD12.ai.hideTyping(
                instance
            );


            HD12.ai.addMessage(
                "assistant",
                answer
            );


            HD12.ai.renderMessages(
                instance
            );


            HD12.ai.setStatus(
                instance,
                "Bereit für deine nächste Nachricht."
            );

        }

        catch (error) {

            console.error(
                "HalDo AI Antwortfehler:",
                error
            );


            HD12.ai.hideTyping(
                instance
            );


            const fallback =
                "Entschuldige ❤️, dabei ist gerade " +
                "ein interner Fehler aufgetreten. " +
                "Du kannst es bitte noch einmal versuchen.";


            HD12.ai.addMessage(
                "assistant",
                fallback
            );


            HD12.ai.renderMessages(
                instance
            );


            HD12.ai.setStatus(
                instance,
                "Bereit – Fehler wurde abgefangen."
            );

        }

    };


/* =========================================================
   GENERATE ANSWER
   ========================================================= */

HD12.ai.generateAnswer =
    async function(
        text,
        instance
    ) {

        /*
         * Bestehende echte HalDo-AI-Systeme
         * werden bevorzugt benutzt.
         */

        const candidates = [

            window.HalDoAI,

            HD12.aiCore,

            HD12.aiEngine,

            HD12.aiCoreService

        ];


        for (
            const service of candidates
        ) {

            if (!service) {

                continue;

            }


            try {

                if (
                    typeof service.respond ===
                    "function"
                ) {

                    const result =
                        await service.respond(
                            text,
                            {
                                context:
                                    instance.state,
                                history:
                                    HD12.ai.chat.messages
                            }
                        );


                    if (
                        result !== undefined &&
                        result !== null
                    ) {

                        return HD12.ai.normalizeAnswer(
                            result
                        );

                    }

                }


                if (
                    typeof service.chat ===
                    "function"
                ) {

                    const result =
                        await service.chat(
                            text,
                            {
                                history:
                                    HD12.ai.chat.messages
                            }
                        );


                    if (
                        result !== undefined &&
                        result !== null
                    ) {

                        return HD12.ai.normalizeAnswer(
                            result
                        );

                    }

                }


                if (
                    typeof service.ask ===
                    "function"
                ) {

                    const result =
                        await service.ask(
                            text
                        );


                    if (
                        result !== undefined &&
                        result !== null
                    ) {

                        return HD12.ai.normalizeAnswer(
                            result
                        );

                    }

                }

            }

            catch (error) {

                console.warn(
                    "HalDo AI Service nicht verfügbar:",
                    error
                );

            }

        }


        /*
         * Lokale intelligente Basisantworten.
         * Damit bleibt die Oberfläche auch ohne
         * externe AI-Verbindung benutzbar.
         */

        return HD12.ai.localResponse(
            text
        );

    };


/* =========================================================
   NORMALIZE
   ========================================================= */

HD12.ai.normalizeAnswer =
    function(result) {

        if (
            typeof result ===
            "string"
        ) {

            return result;

        }


        if (
            result &&
            typeof result.text ===
            "string"
        ) {

            return result.text;

        }


        if (
            result &&
            typeof result.answer ===
            "string"
        ) {

            return result.answer;

        }


        if (
            result &&
            typeof result.message ===
            "string"
        ) {

            return result.message;

        }


        try {

            return JSON.stringify(
                result,
                null,
                2
            );

        }

        catch {

            return String(
                result
            );

        }

    };


/* =========================================================
   LOCAL RESPONSE ENGINE
   ========================================================= */

HD12.ai.localResponse =
    function(text) {

        const value =
            String(text)
                .trim()
                .toLowerCase();


        if (
            /^(hallo|hi|hey|guten morgen|guten tag|guten abend)/
                .test(value)
        ) {

            return (
                "Hallo ❤️ Schön, dass du da bist. " +
                "Ich bin HalDo AI und höre dir zu. " +
                "Erzähl mir einfach, was du möchtest."
            );

        }


        if (
            value.includes("wer bist du") ||
            value.includes("was bist du")
        ) {

            return (
                "Ich bin HalDo AI – die zentrale " +
                "künstliche Intelligenz von HalDo AI OS. " +
                "Ich kann dich beim Schreiben, Lernen, " +
                "Planen, Übersetzen, Organisieren, " +
                "Programmieren und bei vielen weiteren " +
                "Aufgaben unterstützen."
            );

        }


        if (
            value.includes("danke")
        ) {

            return (
                "Sehr gerne ❤️. " +
                "Ich helfe dir jederzeit weiter."
            );

        }


        if (
            value.includes("zeit") ||
            value.includes("uhr")
        ) {

            return (
                "Nach deiner Gerätesystemzeit ist es jetzt " +
                new Date().toLocaleTimeString(
                    "de-DE"
                ) +
                "."
            );

        }


        if (
            value.includes("datum") ||
            value.includes("welcher tag")
        ) {

            return (
                "Heute ist " +
                new Date().toLocaleDateString(
                    "de-DE",
                    {
                        weekday:
                            "long",
                        year:
                            "numeric",
                        month:
                            "long",
                        day:
                            "numeric"
                    }
                ) +
                "."
            );

        }


        if (
            value.includes("hilfe") ||
            value === "help"
        ) {

            return (
                "Natürlich ❤️. Du kannst mich zum Beispiel " +
                "fragen, etwas schreiben lassen, Texte " +
                "überarbeiten, lernen, übersetzen, planen, " +
                "programmieren oder gemeinsam Ideen entwickeln."
            );

        }


        if (
            value.endsWith("?")
        ) {

            return (
                "Ich habe deine Frage verstanden. " +
                "Die vollständige Antwortlogik wird über " +
                "die verbundenen HalDo-AI-Dienste bereitgestellt. " +
                "In diesem lokalen Modus kann ich deine " +
                "Anfrage bereits erkennen und verarbeiten. " +
                "Wenn ein echter AI-Service verbunden ist, " +
                "wird dessen Antwort automatisch verwendet."
            );

        }


        return (
            "Ich habe dich verstanden ❤️. " +
            "Erzähl mir gerne mehr. Ich kann mit dir " +
            "weiterdenken, Texte formulieren, Ideen " +
            "entwickeln oder die passende HalDo-App " +
            "für deine Aufgabe öffnen."
        );

    };


/* =========================================================
   STATUS
   ========================================================= */

HD12.ai.setStatus =
    function(
        instance,
        text
    ) {

        const status =
            instance.element.querySelector(
                "[data-ai-status]"
            );


        if (status) {

            status.textContent =
                text;

        }

    };


/* =========================================================
   CLEAR CONVERSATION
   ========================================================= */

HD12.ai.clearConversation =
    function(instance) {

        HD12.ai.chat.messages =
            [];


        HD12.ai.save();


        HD12.ai.ensureWelcomeMessage(
            instance
        );


        HD12.ai.renderMessages(
            instance
        );


        HD12.ai.setStatus(
            instance,
            "Neuer Gesprächsbereich bereit."
        );

    };


/* =========================================================
   VOICE OUTPUT
   ========================================================= */

HD12.ai.speak =
    function(text) {

        if (
            !("speechSynthesis" in window)
        ) {

            return false;

        }


        try {

            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    String(text)
                );


            utterance.lang =
                document.documentElement.lang ||
                "de-DE";


            utterance.rate =
                0.96;


            utterance.pitch =
                1.02;


            HD12.ai.chat.speaking =
                true;


            utterance.onend =
                () => {

                    HD12.ai.chat.speaking =
                        false;

                };


            utterance.onerror =
                () => {

                    HD12.ai.chat.speaking =
                        false;

                };


            window.speechSynthesis.speak(
                utterance
            );


            return true;

        }

        catch {

            return false;

        }

    };


/* =========================================================
   VOICE INPUT
   ========================================================= */

HD12.ai.toggleVoiceInput =
    function(instance) {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            HD12.ai.setStatus(
                instance,
                "Spracherkennung wird von diesem Browser nicht unterstützt."
            );

            return;

        }


        if (
            HD12.ai.chat.listening
        ) {

            return;

        }


        const input =
            instance.element.querySelector(
                "[data-ai-input]"
            );


        const voiceButton =
            instance.element.querySelector(
                "[data-ai-voice]"
            );


        const recognition =
            new SpeechRecognition();


        recognition.lang =
            document.documentElement.lang ||
            "de-DE";


        recognition.continuous =
            false;


        recognition.interimResults =
            true;


        HD12.ai.chat.listening =
            true;


        if (voiceButton) {

            voiceButton.classList.add(
                "haldo-ai-listening"
            );

            voiceButton.textContent =
                "🔴 Zuhören …";

        }


        HD12.ai.setStatus(
            instance,
            "HalDo AI hört dir zu …"
        );


        recognition.onresult =
            event => {

                let transcript =
                    "";


                for (
                    let i =
                        event.resultIndex;
                    i <
                        event.results.length;
                    i++
                ) {

                    transcript +=
                        event.results[i][0].transcript;

                }


                if (
                    input
                ) {

                    input.value =
                        transcript;

                }

            };


        recognition.onerror =
            error => {

                console.warn(
                    "HalDo Voice:",
                    error
                );


                HD12.ai.setStatus(
                    instance,
                    "Spracherkennung konnte nicht gestartet werden."
                );

            };


        recognition.onend =
            () => {

                HD12.ai.chat.listening =
                    false;


                if (voiceButton) {

                    voiceButton.classList.remove(
                        "haldo-ai-listening"
                    );

                    voiceButton.textContent =
                        "🎙️ Sprechen";

                }


                HD12.ai.setStatus(
                    instance,
                    "Bereit für deine Nachricht."
                );

            };


        try {

            recognition.start();

        }

        catch (error) {

            HD12.ai.chat.listening =
                false;

            console.warn(
                error
            );

        }

    };


/* =========================================================
   OPEN HALDO AI
   ========================================================= */

HD12.openHalDoAI =
    function() {

        if (
            typeof HD12.openAppWindow !==
            "function"
        ) {

            return null;

        }


        const definition =
            HD12.findAppDefinition(
                "haldo-ai"
            );


        if (!definition) {

            return null;

        }


        const existing =
            HD12.AppWindowEngine.windows.get(
                "haldo-ai"
            );


        if (existing) {

            HD12.focusWindow(
                existing.element
            );


            HD12.ai.createInterface(
                existing
            );


            return existing;

        }


        const instance =
            HD12.openAppWindow(
                "haldo-ai"
            );


        if (instance) {

            HD12.ai.createInterface(
                instance
            );

        }


        return instance;

    };


/* =========================================================
   PATCH WINDOW RENDERER FOR HALDO AI
   ========================================================= */

HD12.ai.patchWindowRenderer =
    function() {

        if (
            HD12.ai.windowRendererPatched
        ) {

            return;

        }


        if (
            typeof HD12.renderAppContent !==
            "function"
        ) {

            return;

        }


        const originalRender =
            HD12.renderAppContent;


        HD12.renderAppContent =
            function(instance) {

                if (
                    instance &&
                    instance.definition &&
                    String(
                        instance.definition.id
                    ) ===
                    "haldo-ai"
                ) {

                    HD12.ai.createInterface(
                        instance
                    );

                    return;

                }


                return originalRender(
                    instance
                );

            };


        HD12.ai.windowRendererPatched =
            true;

    };


/* =========================================================
   INITIALIZATION
   ========================================================= */

HD12.ai.init =
    function() {

        if (
            HD12.ai.chat.initialized
        ) {

            return;

        }


        HD12.ai.load();


        HD12.ai.patchWindowRenderer();


        HD12.ai.chat.initialized =
            true;


        console.info(
            "HalDo AI Chat Interface bereit."
        );


        if (
            typeof HD12.emit ===
            "function"
        ) {

            HD12.emit(
                "ai-interface:ready"
            );

        }

    };


/* =========================================================
   START
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            HD12.ai.init();

        },
        {
            once: true
        }
    );

}

else {

    HD12.ai.init();

}

</script>

<script>
"use strict";

window.HalDo = window.HalDo || {};

const HD13 = window.HalDo;


/* =========================================================
   SYSTEM BRIDGE
   ========================================================= */

HD13.systemBridge =
    HD13.systemBridge ||
    {

        initialized: false,

        currentApp: null,

        history: [],

        services: new Map(),

        events: new Map()

    };


/* =========================================================
   EVENT BUS
   ========================================================= */

HD13.systemBridge.on =
    function(
        eventName,
        handler
    ) {

        if (
            typeof handler !==
            "function"
        ) {

            return () => {};

        }


        const name =
            String(eventName);


        if (
            !HD13.systemBridge.events.has(
                name
            )
        ) {

            HD13.systemBridge.events.set(
                name,
                new Set()
            );

        }


        const listeners =
            HD13.systemBridge.events.get(
                name
            );


        listeners.add(
            handler
        );


        return () => {

            listeners.delete(
                handler
            );

        };

    };


/* =========================================================
   EVENT EMIT
   ========================================================= */

HD13.systemBridge.emit =
    function(
        eventName,
        detail = {}
    ) {

        const name =
            String(eventName);


        const listeners =
            HD13.systemBridge.events.get(
                name
            );


        if (listeners) {

            listeners.forEach(
                handler => {

                    try {

                        handler(
                            detail
                        );

                    }

                    catch (error) {

                        console.error(
                            "HalDo Event Handler:",
                            error
                        );

                    }

                }
            );

        }


        try {

            window.dispatchEvent(
                new CustomEvent(
                    "haldo:" + name,
                    {
                        detail
                    }
                )
            );

        }

        catch {

            /* Browser ohne CustomEvent-Unterstützung */

        }


        return true;

    };


/* =========================================================
   SERVICE REGISTRATION
   ========================================================= */

HD13.systemBridge.registerService =
    function(
        name,
        service
    ) {

        if (!name || !service) {

            return false;

        }


        HD13.systemBridge.services.set(
            String(name),
            service
        );


        return true;

    };


/* =========================================================
   GET SERVICE
   ========================================================= */

HD13.systemBridge.getService =
    function(name) {

        return HD13.systemBridge.services.get(
            String(name)
        ) || null;

    };


/* =========================================================
   REGISTER EXISTING SYSTEM SERVICES
   ========================================================= */

HD13.systemBridge.connectExistingServices =
    function() {

        const services = {

            kernel:
                window.HalDoKernel ||
                window.HalDoOS?.kernel ||
                null,

            system:
                window.HalDoSystem ||
                window.HalDoOS?.system ||
                null,

            appManager:
                window.HalDoAppManager ||
                window.HalDoOS?.appManager ||
                null,

            router:
                window.HalDoRouter ||
                window.HalDoOS?.router ||
                null,

            runtime:
                window.HalDoRuntime ||
                window.HalDoOS?.runtime ||
                null,

            storage:
                window.HalDoStorage ||
                window.HalDoOS?.storage ||
                null,

            voice:
                window.HalDoVoice ||
                window.HalDoOS?.voice ||
                null,

            language:
                window.HalDoLanguage ||
                window.HalDoOS?.language ||
                null

        };


        Object.entries(
            services
        )
        .forEach(
            ([name, service]) => {

                if (service) {

                    HD13.systemBridge
                        .registerService(
                            name,
                            service
                        );

                }

            }
        );

    };


/* =========================================================
   APP OPEN
   ========================================================= */

HD13.systemBridge.openApp =
    function(
        appId,
        options = {}
    ) {

        const id =
            String(appId);


        HD13.systemBridge.currentApp =
            id;


        HD13.systemBridge.history.push(
            {
                appId: id,
                timestamp: Date.now()
            }
        );


        if (
            HD13.systemBridge.history.length >
            100
        ) {

            HD13.systemBridge.history =
                HD13.systemBridge.history.slice(
                    -100
                );

        }


        HD13.systemBridge.emit(
            "app:before-open",
            {
                appId: id,
                options
            }
        );


        let instance =
            null;


        /*
         * Vorhandenes Window-System
         */

        if (
            typeof HD13.openAppWindow ===
            "function"
        ) {

            instance =
                HD13.openAppWindow(
                    id,
                    options
                );

        }


        /*
         * Vorhandenen App Manager versuchen
         */

        const manager =
            HD13.systemBridge.getService(
                "appManager"
            );


        if (
            manager &&
            manager !==
            HD13
        ) {

            try {

                if (
                    typeof manager.openApp ===
                    "function"
                ) {

                    const result =
                        manager.openApp(
                            id,
                            options
                        );


                    if (
                        result &&
                        !instance
                    ) {

                        instance =
                            result;

                    }

                }

            }

            catch (error) {

                console.warn(
                    "App Manager openApp:",
                    error
                );

            }

        }


        HD13.systemBridge.emit(
            "app:opened",
            {
                appId: id,
                instance
            }
        );


        return instance;

    };


/* =========================================================
   APP CLOSE
   ========================================================= */

HD13.systemBridge.closeApp =
    function(appId) {

        const id =
            String(appId);


        let closed =
            false;


        if (
            typeof HD13.closeAppWindow ===
            "function"
        ) {

            closed =
                HD13.closeAppWindow(
                    id
                ) ||
                closed;

        }


        const manager =
            HD13.systemBridge.getService(
                "appManager"
            );


        if (
            manager &&
            typeof manager.closeApp ===
            "function"
        ) {

            try {

                manager.closeApp(
                    id
                );

                closed =
                    true;

            }

            catch (error) {

                console.warn(
                    "App Manager closeApp:",
                    error
                );

            }

        }


        HD13.systemBridge.emit(
            "app:closed",
            {
                appId: id
            }
        );


        return closed;

    };


/* =========================================================
   ROUTER BRIDGE
   ========================================================= */

HD13.systemBridge.navigate =
    function(
        route,
        options = {}
    ) {

        const path =
            String(route || "/");


        const router =
            HD13.systemBridge.getService(
                "router"
            );


        HD13.systemBridge.emit(
            "router:before-navigate",
            {
                route: path,
                options
            }
        );


        if (
            router
        ) {

            try {

                if (
                    typeof router.navigate ===
                    "function"
                ) {

                    const result =
                        router.navigate(
                            path,
                            options
                        );


                    HD13.systemBridge.emit(
                        "router:navigated",
                        {
                            route: path,
                            result
                        }
                    );


                    return result;

                }

            }

            catch (error) {

                console.warn(
                    "HalDo Router:",
                    error
                );

            }

        }


        /*
         * Fallback:
         * interne Route-URL.
         */

        try {

            history.pushState(
                {
                    haldoRoute:
                        path
                },
                "",
                "#" +
                path.replace(
                    /^#/,
                    ""
                )
            );

        }

        catch {

            /* kein History-Fallback möglich */

        }


        HD13.systemBridge.emit(
            "router:navigated",
            {
                route: path
            }
        );


        return path;

    };


/* =========================================================
   APP MESSAGE
   ========================================================= */

HD13.systemBridge.sendToApp =
    function(
        targetApp,
        type,
        data = {}
    ) {

        const message = {

            source:
                "haldo-os22",

            target:
                String(targetApp),

            type:
                String(type),

            data,

            timestamp:
                Date.now()

        };


        HD13.systemBridge.emit(
            "app:message",
            message
        );


        HD13.systemBridge.emit(
            "app:" +
            String(targetApp) +
            ":message",
            message
        );


        return message;

    };


/* =========================================================
   BROADCAST
   ========================================================= */

HD13.systemBridge.broadcast =
    function(
        type,
        data = {}
    ) {

        return HD13.systemBridge
            .sendToApp(
                "*",
                type,
                data
            );

    };


/* =========================================================
   GLOBAL APP API
   ========================================================= */

HD13.AppAPI =
    HD13.AppAPI ||
    {

        open:
            (...args) =>
                HD13.systemBridge.openApp(
                    ...args
                ),

        close:
            (...args) =>
                HD13.systemBridge.closeApp(
                    ...args
                ),

        navigate:
            (...args) =>
                HD13.systemBridge.navigate(
                    ...args
                ),

        send:
            (...args) =>
                HD13.systemBridge.sendToApp(
                    ...args
                ),

        broadcast:
            (...args) =>
                HD13.systemBridge.broadcast(
                    ...args
                ),

        on:
            (...args) =>
                HD13.systemBridge.on(
                    ...args
                )

    };


/* =========================================================
   WINDOW MESSAGE API
   ========================================================= */

HD13.systemBridge.bindWindowMessaging =
    function() {

        window.addEventListener(
            "message",
            event => {

                const data =
                    event.data;


                if (
                    !data ||
                    data.haldo !==
                    true
                ) {

                    return;

                }


                HD13.systemBridge.emit(
                    "window:message",
                    data
                );

            }
        );

    };


/* =========================================================
   GLOBAL KEYBOARD SHORTCUTS
   ========================================================= */

HD13.systemBridge.bindShortcuts =
    function() {

        document.addEventListener(
            "keydown",
            event => {

                /*
                 * ESC schließt das aktive
                 * App-Fenster mit einem einzigen
                 * Tastendruck.
                 */

                if (
                    event.key ===
                    "Escape"
                ) {

                    const active =
                        HD13.AppWindowEngine
                            ?.activeWindow;


                    if (
                        active &&
                        active.dataset &&
                        active.dataset.appId
                    ) {

                        HD13.systemBridge
                            .closeApp(
                                active.dataset.appId
                            );

                    }

                }


                /*
                 * Ctrl/Cmd + K:
                 * HalDo AI öffnen.
                 */

                if (
                    (
                        event.ctrlKey ||
                        event.metaKey
                    ) &&
                    event.key.toLowerCase() ===
                    "k"
                ) {

                    event.preventDefault();


                    if (
                        typeof HD13.openHalDoAI ===
                        "function"
                    ) {

                        HD13.openHalDoAI();

                    }

                }

            }
        );

    };


/* =========================================================
   APP STATE
   ========================================================= */

HD13.systemBridge.createAppState =
    function(
        appId,
        defaults = {}
    ) {

        const storage =
            typeof HD13.appStorage ===
            "function"
                ? HD13.appStorage(
                    appId
                )
                : null;


        const state =
            storage
                ? storage.read(
                    defaults
                )
                : {
                    ...defaults
                };


        return {

            data:
                state,

            get(key) {

                return this.data[
                    key
                ];

            },

            set(key, value) {

                this.data[
                    key
                ] =
                    value;

                return value;

            },

            save() {

                if (storage) {

                    return storage.write(
                        this.data
                    );

                }

                return false;

            },

            reset() {

                this.data =
                    {
                        ...defaults
                    };

                return this.save();

            }

        };

    };


/* =========================================================
   SYSTEM STATUS
   ========================================================= */

HD13.systemBridge.getSystemStatus =
    function() {

        const system =
            HD13.systemBridge.getService(
                "system"
            );


        const runtime =
            HD13.systemBridge.getService(
                "runtime"
            );


        return {

            online:
                navigator.onLine,

            language:
                document.documentElement.lang ||
                "de",

            windows:
                typeof HD13.getOpenWindowCount ===
                "function"
                    ? HD13.getOpenWindowCount()
                    : 0,

            currentApp:
                HD13.systemBridge.currentApp,

            systemReady:
                !!system,

            runtimeReady:
                !!runtime,

            timestamp:
                Date.now()

        };

    };


/* =========================================================
   APP SERVICE CONNECTOR
   ========================================================= */

HD13.systemBridge.connectAppServices =
    function(
        appId,
        instance
    ) {

        if (!instance) {

            return;

        }


        instance.services =
            instance.services ||
            {};


        instance.services.systemBridge =
            HD13.systemBridge;


        instance.services.appAPI =
            HD13.AppAPI;


        instance.services.system =
            HD13.systemBridge.getService(
                "system"
            );


        instance.services.runtime =
            HD13.systemBridge.getService(
                "runtime"
            );


        instance.services.storage =
            HD13.systemBridge.getService(
                "storage"
            );


        instance.services.voice =
            HD13.systemBridge.getService(
                "voice"
            );


        instance.services.language =
            HD13.systemBridge.getService(
                "language"
            );


        HD13.systemBridge.emit(
            "app:services-connected",
            {
                appId,
                instance,
                services:
                    instance.services
            }
        );


        return instance.services;

    };


/* =========================================================
   PATCH APP OPEN
   ========================================================= */

HD13.systemBridge.patchAppOpening =
    function() {

        if (
            HD13.systemBridge.openPatched
        ) {

            return;

        }


        if (
            typeof HD13.openAppWindow !==
            "function"
        ) {

            return;

        }


        const originalOpen =
            HD13.openAppWindow;


        HD13.openAppWindow =
            function(
                appId,
                options = {}
            ) {

                const instance =
                    originalOpen(
                        appId,
                        options
                    );


                if (instance) {

                    HD13.systemBridge
                        .connectAppServices(
                            appId,
                            instance
                        );

                }


                return instance;

            };


        HD13.systemBridge.openPatched =
            true;

    };


/* =========================================================
   PATCH AI CONTEXT
   ========================================================= */

HD13.systemBridge.connectAIContext =
    function() {

        HD13.systemBridge.on(
            "app:opened",
            detail => {

                if (
                    !detail ||
                    !detail.appId
                ) {

                    return;

                }


                const ai =
                    HD13.ai;


                if (
                    ai &&
                    ai.chat
                ) {

                    ai.chat.context =
                        {
                            currentApp:
                                detail.appId,

                            timestamp:
                                Date.now()
                        };

                }

            }
        );

    };


/* =========================================================
   NETWORK EVENTS
   ========================================================= */

HD13.systemBridge.bindNetwork =
    function() {

        window.addEventListener(
            "online",
            () => {

                HD13.systemBridge.emit(
                    "network:online"
                );

            }
        );


        window.addEventListener(
            "offline",
            () => {

                HD13.systemBridge.emit(
                    "network:offline"
                );

            }
        );

    };


/* =========================================================
   INITIALIZE
   ========================================================= */

HD13.systemBridge.init =
    function() {

        if (
            HD13.systemBridge.initialized
        ) {

            return;

        }


        HD13.systemBridge
            .connectExistingServices();


        HD13.systemBridge
            .bindWindowMessaging();


        HD13.systemBridge
            .bindShortcuts();


        HD13.systemBridge
            .bindNetwork();


        HD13.systemBridge
            .patchAppOpening();


        HD13.systemBridge
            .connectAIContext();


        HD13.systemBridge.initialized =
            true;


        console.info(
            "HalDo System Bridge bereit."
        );


        HD13.systemBridge.emit(
            "system-bridge:ready",
            HD13.systemBridge
                .getSystemStatus()
        );

    };


/* =========================================================
   START
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            HD13.systemBridge.init();

        },
        {
            once: true
        }
    );

}

else {

    HD13.systemBridge.init();

}

<script>
"use strict";

window.HalDo = window.HalDo || {};

const HD14 = window.HalDo;


/* =========================================================
   PERSISTENCE ENGINE
   ========================================================= */

HD14.persistence =
    HD14.persistence ||
    {

        initialized: false,

        prefix:
            "haldo-os22:",

        cache:
            new Map(),

        namespaces:
            new Set()

    };


/* =========================================================
   KEY BUILDER
   ========================================================= */

HD14.persistence.key =
    function(
        namespace,
        key
    ) {

        return (
            HD14.persistence.prefix +
            String(namespace) +
            ":" +
            String(key)
        );

    };


/* =========================================================
   REGISTER NAMESPACE
   ========================================================= */

HD14.persistence.register =
    function(namespace) {

        const name =
            String(namespace);


        HD14.persistence.namespaces.add(
            name
        );


        return name;

    };


/* =========================================================
   WRITE
   ========================================================= */

HD14.persistence.write =
    function(
        namespace,
        key,
        value
    ) {

        const storageKey =
            HD14.persistence.key(
                namespace,
                key
            );


        try {

            const serialized =
                JSON.stringify(
                    value
                );


            localStorage.setItem(
                storageKey,
                serialized
            );


            HD14.persistence.cache.set(
                storageKey,
                value
            );


            HD14.persistence.register(
                namespace
            );


            HD14.persistence.emit(
                "storage:write",
                {
                    namespace,
                    key,
                    value
                }
            );


            return true;

        }

        catch (error) {

            console.error(
                "HalDo Persistence write:",
                error
            );


            HD14.persistence.emit(
                "storage:error",
                {
                    operation:
                        "write",

                    namespace,
                    key,
                    error
                }
            );


            return false;

        }

    };


/* =========================================================
   READ
   ========================================================= */

HD14.persistence.read =
    function(
        namespace,
        key,
        fallback = null
    ) {

        const storageKey =
            HD14.persistence.key(
                namespace,
                key
            );


        if (
            HD14.persistence.cache.has(
                storageKey
            )
        ) {

            return HD14.persistence.cache.get(
                storageKey
            );

        }


        try {

            const raw =
                localStorage.getItem(
                    storageKey
                );


            if (
                raw === null
            ) {

                return fallback;

            }


            const value =
                JSON.parse(
                    raw
                );


            HD14.persistence.cache.set(
                storageKey,
                value
            );


            return value;

        }

        catch (error) {

            console.warn(
                "HalDo Persistence read:",
                error
            );


            return fallback;

        }

    };


/* =========================================================
   REMOVE
   ========================================================= */

HD14.persistence.remove =
    function(
        namespace,
        key
    ) {

        const storageKey =
            HD14.persistence.key(
                namespace,
                key
            );


        try {

            localStorage.removeItem(
                storageKey
            );


            HD14.persistence.cache.delete(
                storageKey
            );


            HD14.persistence.emit(
                "storage:remove",
                {
                    namespace,
                    key
                }
            );


            return true;

        }

        catch {

            return false;

        }

    };


/* =========================================================
   CLEAR NAMESPACE
   ========================================================= */

HD14.persistence.clearNamespace =
    function(namespace) {

        const prefix =
            HD14.persistence.prefix +
            String(namespace) +
            ":";


        try {

            const keys = [];


            for (
                let i = 0;
                i < localStorage.length;
                i++
            ) {

                const key =
                    localStorage.key(
                        i
                    );


                if (
                    key &&
                    key.startsWith(
                        prefix
                    )
                ) {

                    keys.push(
                        key
                    );

                }

            }


            keys.forEach(
                key => {

                    localStorage.removeItem(
                        key
                    );

                    HD14.persistence.cache.delete(
                        key
                    );

                }
            );


            return true;

        }

        catch (error) {

            console.warn(
                "HalDo namespace clear:",
                error
            );


            return false;

        }

    };


/* =========================================================
   EVENT BRIDGE
   ========================================================= */

HD14.persistence.emit =
    function(
        eventName,
        detail = {}
    ) {

        if (
            HD14.systemBridge &&
            typeof HD14.systemBridge.emit ===
            "function"
        ) {

            HD14.systemBridge.emit(
                eventName,
                detail
            );

        }

    };


/* =========================================================
   APP STORAGE FACTORY
   ========================================================= */

HD14.appStorage =
    function(appId) {

        const namespace =
            "app:" +
            String(appId);


        HD14.persistence.register(
            namespace
        );


        return {

            read(
                key,
                fallback = null
            ) {

                return HD14.persistence.read(
                    namespace,
                    key,
                    fallback
                );

            },

            write(
                key,
                value
            ) {

                return HD14.persistence.write(
                    namespace,
                    key,
                    value
                );

            },

            remove(
                key
            ) {

                return HD14.persistence.remove(
                    namespace,
                    key
                );

            },

            clear() {

                return HD14.persistence.clearNamespace(
                    namespace
                );

            }

        };

    };


/* =========================================================
   SYSTEM SETTINGS
   ========================================================= */

HD14.settings =
    HD14.settings ||
    {

        namespace:
            "system",

        defaults: {

            sound:
                true,

            welcomeSound:
                true,

            voice:
                true,

            notifications:
                true,

            animations:
                true,

            reducedMotion:
                false,

            theme:
                "space",

            language:
                "de",

            autoSave:
                true,

            startupAI:
                true,

            livingLogo:
                true,

            starAnimation:
                true,

            planetAnimation:
                true

        },

        data:
            null

    };


/* =========================================================
   LOAD SETTINGS
   ========================================================= */

HD14.settings.load =
    function() {

        const saved =
            HD14.persistence.read(
                HD14.settings.namespace,
                "preferences",
                {}
            );


        HD14.settings.data =
            {
                ...HD14.settings.defaults,
                ...(saved || {})
            };


        return HD14.settings.data;

    };


/* =========================================================
   GET SETTING
   ========================================================= */

HD14.settings.get =
    function(
        key,
        fallback
    ) {

        if (
            !HD14.settings.data
        ) {

            HD14.settings.load();

        }


        if (
            Object.prototype.hasOwnProperty.call(
                HD14.settings.data,
                key
            )
        ) {

            return HD14.settings.data[
                key
            ];

        }


        return (
            fallback !== undefined
                ? fallback
                : HD14.settings.defaults[
                    key
                ]
        );

    };


/* =========================================================
   SET SETTING
   ========================================================= */

HD14.settings.set =
    function(
        key,
        value
    ) {

        if (
            !HD14.settings.data
        ) {

            HD14.settings.load();

        }


        HD14.settings.data[
            key
        ] =
            value;


        HD14.persistence.write(
            HD14.settings.namespace,
            "preferences",
            HD14.settings.data
        );


        HD14.persistence.emit(
            "settings:changed",
            {
                key,
                value,
                settings:
                    HD14.settings.data
            }
        );


        return value;

    };


/* =========================================================
   UPDATE MULTIPLE SETTINGS
   ========================================================= */

HD14.settings.update =
    function(values = {}) {

        Object.entries(
            values
        )
        .forEach(
            ([key, value]) => {

                HD14.settings.data[
                    key
                ] =
                    value;

            }
        );


        HD14.persistence.write(
            HD14.settings.namespace,
            "preferences",
            HD14.settings.data
        );


        HD14.persistence.emit(
            "settings:updated",
            {
                values,
                settings:
                    HD14.settings.data
            }
        );


        return HD14.settings.data;

    };


/* =========================================================
   RESET SETTINGS
   ========================================================= */

HD14.settings.reset =
    function() {

        HD14.settings.data =
            {
                ...HD14.settings.defaults
            };


        HD14.persistence.write(
            HD14.settings.namespace,
            "preferences",
            HD14.settings.data
        );


        HD14.persistence.emit(
            "settings:reset",
            HD14.settings.data
        );


        return HD14.settings.data;

    };


/* =========================================================
   APP SETTINGS
   ========================================================= */

HD14.AppSettings =
    function(appId) {

        const storage =
            HD14.appStorage(
                appId
            );


        return {

            get(
                key,
                fallback = null
            ) {

                return storage.read(
                    "settings:" + key,
                    fallback
                );

            },

            set(
                key,
                value
            ) {

                const result =
                    storage.write(
                        "settings:" + key,
                        value
                    );


                HD14.persistence.emit(
                    "app:settings:changed",
                    {
                        appId,
                        key,
                        value
                    }
                );


                return result;

            },

            update(
                values = {}
            ) {

                Object.entries(
                    values
                )
                .forEach(
                    ([key, value]) => {

                        storage.write(
                            "settings:" + key,
                            value
                        );

                    }
                );


                return true;

            },

            clear() {

                return storage.clear();

            }

        };

    };


/* =========================================================
   NOTIFICATION SYSTEM
   ========================================================= */

HD14.notifications =
    HD14.notifications ||
    {

        initialized:
            false,

        items:
            [],

        max:
            100,

        container:
            null

/* =========================================================

HD14.notifications.ensureLayer =

        ) {

        }

        );

        );

/* =========================================================
   SHOW NOTIFICATION

HD14.notifications.show =
    function(
        title,
        message,
        options = {}
    ) {

        if (
            HD14.settings.get(
                "notifications",
                true
            ) === false
        ) {

            return null;

        }


        const layer =
            HD14.notifications.ensureLayer();


        const notification =
            document.createElement(
                "div"
            );


        notification.className =
            "haldo-notification";

            );

            >
                ${HD14.escape(

            <div

                )}
            </div>

        `;


        layer.appendChild(
            notification
        );


        const item = {

            id:
                "notification-" +
                Date.now(),

            title:
                title || "HalDo AI",

            message:
                message || "",

            timestamp:
                Date.now()

        };


        HD14.notifications.items.push(
            item
        );


        if (
            HD14.notifications.items.length >
            HD14.notifications.max
        ) {

            HD14.notifications.items =
                HD14.notifications.items.slice(
                    -HD14.notifications.max
                );

        }


        const close =
            () => {

                notification.remove();

            };


        notification
            .querySelector(
                ".haldo-notification-close"
            )
            ?.addEventListener(
                "click",
                close
            );


        if (
            duration > 0
        ) {

            setTimeout(
                close,
                duration
            );

        }


        if (
            HD14.systemBridge
        ) {

            HD14.systemBridge.emit(
                "notification:shown",
                item
            );

        }


        return item;

    };


/* =========================================================
   ESCAPE
   ========================================================= */

HD14.escape =
    function(value) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    };


/* =========================================================
   SYSTEM DIAGNOSTIC STATE
   ========================================================= */

HD14.systemState =
    HD14.systemState ||
    {

        booted:
            false,

        ready:
            false,

        errors:
            [],

        warnings:
            [],

        lastUpdate:
            Date.now()

    };


/* =========================================================
   ERROR REGISTRATION
   ========================================================= */

HD14.systemState.addError =
    function(
        error,
        source = "unknown"
    ) {

        const item = {

            source,

            message:
                error?.message ||
                String(error),

            timestamp:
                Date.now()

        };


        HD14.systemState.errors.push(
            item
        );


        if (
            HD14.systemState.errors.length >
            100
        ) {

            HD14.systemState.errors =
                HD14.systemState.errors.slice(
                    -100
                );

        }


        if (
            HD14.systemBridge
        ) {

            HD14.systemBridge.emit(
                "system:error",
                item
            );

        }


        return item;

    };


/* =========================================================
   WARNING
   ========================================================= */

HD14.systemState.addWarning =
    function(
        message,
        source = "system"
    ) {

        const item = {

            source,

            message:
                String(message),

            timestamp:
                Date.now()

        };


        HD14.systemState.warnings.push(
            item
        );


        if (
            HD14.systemState.warnings.length >
            100
        ) {

            HD14.systemState.warnings =
                HD14.systemState.warnings.slice(
                    -100
                );

        }


        return item;

    };


/* =========================================================
   APP DATA HELPERS
   ========================================================= */

HD14.createAppData =
    function(
        appId,
        defaults = {}
    ) {

        const storage =
            HD14.appStorage(
                appId
            );


        let data =
            storage.read(
                "data",
                null
            );


        if (
            !data ||
            typeof data !==
            "object"
        ) {

            data =
                {
                    ...defaults
                };


            storage.write(
                "data",
                data
            );

        }


        return {

            data,

            get(
                key,
                fallback = null
            ) {

                return Object.prototype
                    .hasOwnProperty.call(
                        this.data,
                        key
                    )
                    ? this.data[key]
                    : fallback;

            },

            set(
                key,
                value
            ) {

                this.data[key] =
                    value;


                if (
                    HD14.settings.get(
                        "autoSave",
                        true
                    )
                ) {

                    storage.write(
                        "data",
                        this.data
                    );

                }


                return value;

            },

            save() {

                return storage.write(
                    "data",
                    this.data
                );

            },

            clear() {

                this.data =
                    {
                        ...defaults
                    };


                return storage.write(
                    "data",
                    this.data
                );

            }

        };

    };


/* =========================================================
   INIT
   ========================================================= */

HD14.persistence.init =
    function() {

        if (
            HD14.persistence.initialized
        ) {

        }


        HD14.settings.load();

            {

            "HalDo Persistence + Settings bereit."
        );

    };


/* =========================================================
   START
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            HD14.persistence.init();

        },
        {
            once: true
        }
    );

}

else {

    HD14.persistence.init();

}
