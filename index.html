<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>HalDo OS 24 — Cosmic Intelligent Operating System</title>
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0a1a;
            --surface: rgba(16, 16, 40, 0.92);
            --text: #e0e0ff;
            --primary: #00d4ff;
            --secondary: #7b2ffc;
            --radius: 14px;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== BOOT ===== */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.5s ease;
            padding: 20px;
        }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #boot-logo {
            font-size: clamp(3.5rem, 14vw, 6rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseGlow 2s infinite alternate;
            filter: drop-shadow(0 0 40px rgba(0, 212, 255, 0.3));
        }
        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 80px rgba(123, 47, 252, 0.6));
                transform: scale(1.05);
            }
        }
        #boot-status {
            margin-top: 16px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COSMIC CANVAS ===== */
        #cosmic {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ===== DISPLAY ===== */
        #display {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* ===== TOPBAR ===== */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 20;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            min-height: 40px;
            flex-shrink: 0;
        }
        #topbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #topbar-left .haldo-icon {
            font-weight: 700;
            color: var(--primary);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #topbar-left .haldo-icon img {
            width: clamp(28px, 5vw, 36px);
            height: clamp(28px, 5vw, 36px);
            border-radius: 50%;
            border: 2px solid var(--primary);
        }
        #topbar-right {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .top-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== APP CONTAINER ===== */
        #app-container {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow: hidden;
            touch-action: none;
        }

        /* ===== WINDOW ===== */
        .window {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 200px;
            min-height: 150px;
            max-width: 98vw;
            max-height: 90vh;
            touch-action: none;
        }
        .window.active {
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.2);
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            cursor: grab;
            flex-shrink: 0;
            min-height: 36px;
            touch-action: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .window-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .win-btn {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.2s;
            touch-action: manipulation;
            min-width: 28px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .win-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        .win-btn.close:active {
            background: #ff4444;
            color: #fff;
        }
        .window-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }
        .window-body input,
        .window-body textarea,
        .window-body select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            margin-bottom: 8px;
            -webkit-appearance: none;
            appearance: none;
        }
        .window-body button {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
            min-height: 38px;
        }
        .window-body button:active {
            transform: scale(0.95);
        }
        .window-body .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }
        .window-body .app-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .window-body .app-item:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }
        .window-body .app-item .icon {
            font-size: 1.8rem;
        }
        .window-body .app-item .name {
            font-size: 0.65rem;
            margin-top: 4px;
            color: #8899bb;
        }

        /* ===== DOCK ===== */
        #dock {
            position: absolute;
            bottom: clamp(8px, 2vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: clamp(4px, 1vw, 8px);
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: nowrap;
            max-width: 98vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .dock-item {
            width: clamp(40px, 9vw, 48px);
            height: clamp(40px, 9vw, 48px);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 3.5vw, 1.4rem);
            cursor: pointer;
            border: none;
            color: #fff;
            touch-action: manipulation;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .dock-item:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        /* ===== NOTIFICATION ===== */
        #notification {
            position: fixed;
            top: clamp(50px, 10vh, 70px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 12px 24px;
            max-width: 90%;
            box-shadow: var(--shadow);
            font-size: clamp(0.8rem, 1.6vw, 0.9rem);
            display: none;
            border-left: 4px solid var(--primary);
        }
        #notification.show {
            display: block;
            animation: slideDown 0.4s ease;
        }
        #notification.success {
            border-left-color: #44ff88;
        }
        #notification.error {
            border-left-color: #ff4444;
        }
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ===== SCROLLBAR ===== */
        .window-body::-webkit-scrollbar {
            width: 4px;
        }
        .window-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .window-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        @media (max-width: 480px) {
            .window {
                border-radius: 12px;
                min-width: 160px;
                min-height: 120px;
            }
            .window-header {
                padding: 6px 10px;
                min-height: 32px;
            }
            .window-body {
                padding: 10px;
            }
            #topbar {
                padding: 4px 10px;
                min-height: 34px;
            }
            .win-btn {
                min-width: 24px;
                min-height: 24px;
                padding: 2px 6px;
            }
            .dock-item {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            #dock {
                padding: 6px 10px;
                gap: 4px;
            }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .window {
                max-height: 80vh;
            }
            #dock {
                bottom: 4px;
                padding: 4px 10px;
                gap: 4px;
            }
            .dock-item {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
                border-radius: 10px;
            }
            #topbar {
                min-height: 28px;
                padding: 2px 10px;
            }
            .window-header {
                min-height: 28px;
                padding: 4px 10px;
            }
            .window-body {
                padding: 8px;
            }
            .window-body button {
                min-height: 32px;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- BOOT -->
        <div id="boot">
            <div id="boot-logo">⟡ HalDo</div>
            <div class="boot-spinner"></div>
            <div id="boot-status">⟡ System wird initialisiert ...</div>
        </div>

        <!-- COSMIC CANVAS -->
        <canvas id="cosmic"></canvas>

        <!-- DISPLAY -->
        <div id="display">
            <!-- TOPBAR -->
            <div id="topbar">
                <div id="topbar-left">
                    <span class="haldo-icon" id="menu-system">⟡ HalDo</span>
                    <span id="clock-display">--:--</span>
                </div>
                <div id="topbar-right">
                    <button class="top-btn" id="btn-appworld">📱</button>
                    <button class="top-btn" id="btn-theme">🎨</button>
                    <button class="top-btn" id="btn-update">🔄</button>
                    <button class="top-btn" id="btn-about">ℹ️</button>
                </div>
            </div>

            <!-- APP CONTAINER -->
            <div id="app-container"></div>

            <!-- DOCK -->
            <div id="dock">
                <button class="dock-item" data-app="ai">🤖</button>
                <button class="dock-item" data-app="mail">✉️</button>
                <button class="dock-item" data-app="chat">💬</button>
                <button class="dock-item" data-app="contacts">👤</button>
                <button class="dock-item" data-app="files">📁</button>
                <button class="dock-item" data-app="settings">⚙️</button>
                <button class="dock-item" data-app="cosmic">🌌</button>
                <button class="dock-item" data-app="system">🖥️</button>
                <button class="dock-item" data-app="terminal">⌨️</button>
                <button class="dock-item" data-app="appworld">📱</button>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  HALDO OS 24 — COSMIC INTELLIGENT OPERATING SYSTEM
        //  ULTIMATE EDITION — ALLES IN EINER DATEI
        //  Version 24.0.0 — Build 2025.08.30
        // ================================================================

        (function() {
            'use strict';

            // ============================================================
            //  VERSION
            // ============================================================
            const VERSION = {
                os: '24.0.0',
                kernel: '5.3.0',
                api: '2.0',
                build: '2025.08.30'
            };

            // ============================================================
            //  STATE
            // ============================================================
            const state = {
                apps: {},
                windows: [],
                windowZIndex: 100,
                activeWindow: null,
                theme: 'cosmic',
                language: 'de',
                booted: false,
                contacts: [],
                mail: { inbox: [], sent: [], drafts: [], spam: [] },
                notes: JSON.parse(localStorage.getItem('haldo_notes') || '[]'),
                settings: {
                    theme: 'cosmic',
                    language: 'de',
                    voiceEnabled: false,
                    notifications: true,
                    autoUpdates: true,
                    backupInterval: 'daily',
                    mailSignature: 'Mit freundlichen Grüßen\nDein HalDo OS'
                },
                system: {
                    uptime: 0,
                    started: Date.now(),
                    lastUpdate: null,
                    version: VERSION.os,
                    kernel: VERSION.kernel
                },
                logs: [],
                backups: [],
                updates: [],
                aiMemory: []
            };

            // ============================================================
            //  DOM
            // ============================================================
            const $ = (id) => document.getElementById(id);
            const boot = $('boot');
            const bootStatus = $('boot-status');
            const cosmicCanvas = $('cosmic');
            const appContainer = $('app-container');
            const dock = $('dock');
            const notification = $('notification');
            const clockDisplay = $('clock-display');

            // ============================================================
            //  NOTIFICATION
            // ============================================================
            function notify(text, type = 'info') {
                notification.textContent = text;
                notification.className = 'notification show';
                if (type === 'success') notification.classList.add('success');
                if (type === 'error') notification.classList.add('error');
                clearTimeout(notification._timeout);
                notification._timeout = setTimeout(() => {
                    notification.classList.remove('show');
                }, 2800);
                log('NOTIFY: ' + text);
            }

            // ============================================================
            //  LOGGING
            // ============================================================
            function log(message) {
                const entry = { timestamp: new Date().toISOString(), message };
                state.logs.push(entry);
                if (state.logs.length > 1000) state.logs.shift();
                console.log('[HalDo]', message);
                try {
                    const logs = JSON.parse(localStorage.getItem('haldo_logs') || '[]');
                    logs.push(entry);
                    if (logs.length > 500) logs.shift();
                    localStorage.setItem('haldo_logs', JSON.stringify(logs));
                } catch (e) {}
            }

            // ============================================================
            //  STORAGE (IndexedDB + LocalStorage)
            // ============================================================
            const storage = {
                async init() {
                    return new Promise((resolve) => {
                        const req = indexedDB.open('HalDoOS', 1);
                        req.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('appData')) {
                                db.createObjectStore('appData', { keyPath: 'id' });
                            }
                            if (!db.objectStoreNames.contains('userData')) {
                                db.createObjectStore('userData', { keyPath: 'key' });
                            }
                            if (!db.objectStoreNames.contains('files')) {
                                db.createObjectStore('files', { keyPath: 'id' });
                            }
                        };
                        req.onsuccess = (e) => {
                            this.db = e.target.result;
                            log('Storage: IndexedDB initialisiert');
                            resolve();
                        };
                        req.onerror = (e) => {
                            log('Storage: IndexedDB Fehler - ' + e.target.error);
                            resolve();
                        };
                    });
                },

                async set(store, data) {
                    return new Promise((resolve) => {
                        const tx = this.db.transaction(store, 'readwrite');
                        const obj = tx.objectStore(store);
                        const req = obj.put(data);
                        req.onsuccess = () => resolve(true);
                        req.onerror = () => resolve(false);
                    });
                },

                async get(store, key) {
                    return new Promise((resolve) => {
                        const tx = this.db.transaction(store, 'readonly');
                        const obj = tx.objectStore(store);
                        const req = obj.get(key);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => resolve(null);
                    });
                },

                async getAll(store) {
                    return new Promise((resolve) => {
                        const tx = this.db.transaction(store, 'readonly');
                        const obj = tx.objectStore(store);
                        const req = obj.getAll();
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => resolve([]);
                    });
                },

                async delete(store, key) {
                    return new Promise((resolve) => {
                        const tx = this.db.transaction(store, 'readwrite');
                        const obj = tx.objectStore(store);
                        const req = obj.delete(key);
                        req.onsuccess = () => resolve(true);
                        req.onerror = () => resolve(false);
                    });
                }
            };

            // ============================================================
            //  EVENT BUS
            // ============================================================
            const events = {
                listeners: {},
                emit(event, data) {
                    log('EVENT: ' + event);
                    if (this.listeners[event]) {
                        this.listeners[event].forEach(fn => {
                            try { fn(data); } catch (e) { log('EVENT ERROR: ' + e.message); }
                        });
                    }
                },
                on(event, fn) {
                    if (!this.listeners[event]) this.listeners[event] = [];
                    this.listeners[event].push(fn);
                },
                off(event, fn) {
                    if (this.listeners[event]) {
                        this.listeners[event] = this.listeners[event].filter(f => f !== fn);
                    }
                }
            };

            // ============================================================
            //  KERNEL
            // ============================================================
            const kernel = {
                version: VERSION.kernel,
                started: Date.now(),

                async init() {
                    log('Kernel: Initialisiere ...');
                    bootStatus.textContent = '⟡ Kernel wird geladen ...';

                    await storage.init();
                    log('Kernel: Storage bereit');

                    await this.loadSettings();
                    log('Kernel: Settings geladen');

                    bootStatus.textContent = '⟡ System wird initialisiert ...';
                    await this.startServices();
                    log('Kernel: Services gestartet');

                    bootStatus.textContent = '⟡ HalDo OS 24 ist READY 🚀';
                    log('Kernel: System bereit');

                    setTimeout(() => {
                        boot.classList.add('hidden');
                        state.booted = true;
                        events.emit('system:ready');
                    }, 600);

                    return this;
                },

                async loadSettings() {
                    try {
                        const saved = localStorage.getItem('haldo_settings');
                        if (saved) {
                            const parsed = JSON.parse(saved);
                            Object.assign(state.settings, parsed);
                            Object.assign(state, { theme: parsed.theme, language: parsed.language });
                        }
                        const notes = localStorage.getItem('haldo_notes');
                        if (notes) state.notes = JSON.parse(notes);
                    } catch (e) { log('Kernel: Settings Fehler - ' + e.message); }
                },

                async startServices() {
                    if ('serviceWorker' in navigator) {
                        try {
                            const reg = await navigator.serviceWorker.register('/sw.js');
                            log('Kernel: Service Worker registriert');
                        } catch (e) { log('Kernel: SW Fehler - ' + e.message); }
                    }

                    window.addEventListener('online', () => {
                        events.emit('network:online');
                        log('Kernel: Online');
                    });
                    window.addEventListener('offline', () => {
                        events.emit('network:offline');
                        log('Kernel: Offline');
                    });

                    setInterval(() => {
                        state.system.uptime = Math.floor((Date.now() - state.system.started) / 1000);
                    }, 10000);
                },

                getUptime() {
                    const seconds = state.system.uptime;
                    const days = Math.floor(seconds / 86400);
                    const hours = Math.floor((seconds % 86400) / 3600);
                    const minutes = Math.floor((seconds % 3600) / 60);
                    const secs = seconds % 60;
                    return `${days}d ${hours}h ${minutes}m ${secs}s`;
                },

                async backup() {
                    log('Kernel: Backup wird erstellt ...');
                    try {
                        const data = {
                            timestamp: new Date().toISOString(),
                            version: VERSION.os,
                            settings: state.settings,
                            notes: state.notes,
                            contacts: state.contacts || [],
                            mail: state.mail || { inbox: [], sent: [] }
                        };
                        const backupId = 'backup_' + Date.now();
                        localStorage.setItem('haldo_backup_' + backupId, JSON.stringify(data));
                        state.backups.push({ id: backupId, timestamp: data.timestamp, size: JSON.stringify(data)
                                .length });
                        log('Kernel: Backup erstellt - ' + backupId);
                        notify('💾 Backup erstellt: ' + backupId, 'success');
                        return backupId;
                    } catch (e) {
                        log('Kernel: Backup Fehler - ' + e.message);
                        notify('❌ Backup fehlgeschlagen', 'error');
                        return null;
                    }
                },

                async restore(backupId) {
                    log('Kernel: Wiederherstellung von ' + backupId);
                    try {
                        const data = JSON.parse(localStorage.getItem('haldo_backup_' + backupId));
                        if (!data) { throw new Error('Backup nicht gefunden'); }
                        Object.assign(state.settings, data.settings);
                        localStorage.setItem('haldo_settings', JSON.stringify(state.settings));
                        if (data.notes) { state.notes = data.notes;
                            localStorage.setItem('haldo_notes', JSON.stringify(data.notes)); }
                        if (data.contacts) state.contacts = data.contacts;
                        if (data.mail) state.mail = data.mail;
                        log('Kernel: Wiederherstellung abgeschlossen');
                        notify('✅ Wiederherstellung von ' + backupId + ' erfolgreich', 'success');
                        return true;
                    } catch (e) {
                        log('Kernel: Restore Fehler - ' + e.message);
                        notify('❌ Wiederherstellung fehlgeschlagen', 'error');
                        return false;

                async update() {
                    log('Kernel: Update wird geprüft ...');
                    notify('🔄 Prüfe auf Updates ...');
                    await new Promise(r => setTimeout(r, 1500));
                    const hasUpdate = Math.random() > 0.3;

                        state.system.lastUpdate = new Date().toISOString();

                        notify('🔄 Update ' + version + ' verfügbar!', 'success');
                        events.emit('update:available', { version });
                        return { available: true, version };
                    } else {
                        notify('✅ Keine Updates verfügbar', 'success');
                        return { available: false };
                    }
                },

                async installUpdate() {
                    log('Kernel: Update wird installiert ...');
                    notify('📦 Update wird installiert ...', 'info');
                    await new Promise(r => setTimeout(r, 2000));
                    await this.backup();

                    state.system.lastUpdate = new Date().toISOString();
                    log('Kernel: Update installiert - Version 24.1.0');
                    notify('✅ Update 24.1.0 erfolgreich installiert!', 'success');
                    events.emit('update:installed', { version: '24.1.0' });
                    return true;

            // ============================================================

            let stars = [];

            let cosmicRunning = false;
            let cosmicCtx = null;
            let cosmicW = 0,
                cosmicH = 0;

            const PLANET_DATA = [
                { name: 'Merkur', radius: 8, color: '#aaaaaa', orbit: 80, speed: 0.03, role: 'second' },
                { name: 'Venus', radius: 12, color: '#ffaa44', orbit: 120, speed: 0.022, role: 'minute' },
                { name: 'Erde', radius: 14, color: '#4488ff', orbit: 170, speed: 0.015, role: 'hour' },
                { name: 'Mars', radius: 10, color: '#ff6644', orbit: 220, speed: 0.012 },
                { name: 'Jupiter', radius: 26, color: '#ddaa77', orbit: 280, speed: 0.008 },
                { name: 'Saturn', radius: 20, color: '#ddcc88', orbit: 350, speed: 0.006, ring: true },
                { name: 'Uranus', radius: 16, color: '#88ddff', orbit: 420, speed: 0.0045 },
                { name: 'Neptun', radius: 15, color: '#4466ff', orbit: 490, speed: 0.0035 },
                { name: 'Pluto', radius: 6, color: '#ccbb99', orbit: 560, speed: 0.0025 },
                { name: 'HalDo-1', radius: 11, color: '#ff88dd', orbit: 620, speed: 0.0018 },
                { name: 'HalDo-2', radius: 13, color: '#88ffaa', orbit: 680, speed: 0.0012 },

            ];

            function initCosmic() {
                const ctx = cosmicCanvas.getContext('2d');
                cosmicCtx = ctx;

                function resize() {
                    cosmicW = cosmicCanvas.width = window.innerWidth;
                    cosmicH = cosmicCanvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                // Sterne (3000)
                stars = [];
                for (let i = 0; i < 3000; i++) {
                    stars.push({
                        x: Math.random() * cosmicW,
                        y: Math.random() * cosmicH,
                        r: Math.random() * 2.5 + 0.3,
                        speed: Math.random() * 0.03 + 0.005,
                        brightness: Math.random() * 0.8 + 0.2,
                        phase: Math.random() * Math.PI * 2,
                        color: `hsl(${Math.random() * 60 + 200}, 80%, ${60 + Math.random() * 40}%)`
                    });
                }

                // Galaxien (10)
                galaxies = [];
                for (let g = 0; g < 10; g++) {
                    const gx = Math.random() * cosmicW;
                    const gy = Math.random() * cosmicH;
                    const gSize = 50 + Math.random() * 180;
                    const angle = Math.random() * Math.PI * 2;
                    const points = [];
                    for (let i = 0; i < 500; i++) {
                        const t = Math.random() * Math.PI * 4;
                        const r = Math.random() * gSize * 0.6;
                        const x = gx + Math.cos(t + angle) * r * (1 + t * 0.08);
                        const y = gy + Math.sin(t + angle) * r * (1 + t * 0.08);
                        points.push({
                            x,
                            y,
                            r: Math.random() * 2 + 0.5,
                            brightness: Math.random() * 0.5 + 0.2,
                            hue: 200 + Math.random() * 80
                        });
                    }
                    galaxies.push({
                        x: gx,
                        y: gy,
                        size: gSize,
                        angle: angle,
                        points: points,
                        rotationSpeed: (Math.random() - 0.5) * 0.002
                    });
                }

                // Sonne mit Logo
                const centerX = cosmicW / 2;
                const centerY = cosmicH / 2;
                sun = {
                    x: centerX,
                    y: centerY,
                    radius: 55,
                    glow: 250,
                    color: '#ffdd44',
                    pulseSpeed: 0.008,
                    pulsePhase: 0,
                    flares: 16
                };

                // Planeten (12)
                planets = [];
                PLANET_DATA.forEach((p) => {
                    planets.push({
                        name: p.name,
                        radius: p.radius,
                        color: p.color,
                        orbit: p.orbit,
                        speed: p.speed,
                        angle: Math.random() * Math.PI * 2,
                        centerX: centerX + (Math.random() - 0.5) * 40,
                        centerY: centerY + (Math.random() - 0.5) * 40,
                        glow: p.radius * 2.5,
                        ring: p.ring || false,
                        role: p.role || 'normal',
                        trail: []
                    });
                });

                earth = planets.find(p => p.name === 'Erde');

                // Mond
                moon = {
                    name: 'Mond',
                    radius: 6,
                    color: '#cccccc',
                    orbit: 30,
                    speed: 0.08,
                    angle: Math.random() * Math.PI * 2,
                    glow: 10,
                    x: 0,
                    y: 0
                };

                cosmicRunning = true;
                animateCosmic();
            }

            function animateCosmic() {
                if (!cosmicRunning || !cosmicCtx) return;
                const ctx = cosmicCtx;
                const w = cosmicW,
                    h = cosmicH;

                const now = new Date();
                const seconds = now.getSeconds();
                const minutes = now.getMinutes();
                const hours = now.getHours() % 12;

                // Hintergrund
                const bgGrad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.9);
                const time2 = Date.now() / 10000;
                const hue1 = 220 + 20 * Math.sin(time2);
                const hue2 = 240 + 30 * Math.sin(time2 * 0.7 + 1);
                bgGrad.addColorStop(0, `hsl(${hue1}, 70%, 12%)`);
                bgGrad.addColorStop(0.5, `hsl(${hue2}, 60%, 8%)`);
                bgGrad.addColorStop(1, '#000005');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                // Galaxien
                galaxies.forEach(g => {
                    g.angle += g.rotationSpeed;
                    g.points.forEach(p => {
                        const rotX = p.x - g.x;
                        const rotY = p.y - g.y;
                        const cosA = Math.cos(g.angle);
                        const sinA = Math.sin(g.angle);
                        const rx = g.x + rotX * cosA - rotY * sinA;
                        const ry = g.y + rotX * sinA + rotY * cosA;
                        ctx.fillStyle = `hsla(${p.hue}, 70%, 60%, ${p.brightness * 0.2})`;
                        ctx.beginPath();
                        ctx.arc(rx, ry, p.r, 0, Math.PI * 2);
                        ctx.fill();
                    });
                });

                // Planeten-Trails
                planets.forEach(p => {
                    if (p.trail) {
                        p.trail.forEach(t => {
                            ctx.fillStyle = `rgba(255,255,255,${t.life * 0.05})`;
                            ctx.beginPath();
                            ctx.arc(t.x, t.y, 1.5, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    }
                });

                // Sonne
                if (sun) {
                    sun.pulsePhase += sun.pulseSpeed;
                    const pulse = 1 + 0.06 * Math.sin(sun.pulsePhase);
                    const radius = sun.radius * pulse;

                    for (let i = 10; i > 0; i--) {
                        const grad = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.glow * i * 0.15);
                        const alpha = 0.06 / i;
                        grad.addColorStop(0, `rgba(255, 220, 68, ${alpha})`);
                        grad.addColorStop(1, 'rgba(255, 220, 68, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(sun.x, sun.y, sun.glow * i * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    const sunGrad = ctx.createRadialGradient(
                        sun.x - radius * 0.3, sun.y - radius * 0.3, 0,
                        sun.x, sun.y, radius
                    );
                    sunGrad.addColorStop(0, '#ffeeaa');
                    sunGrad.addColorStop(0.25, '#ffdd44');
                    sunGrad.addColorStop(0.5, '#ffaa00');
                    sunGrad.addColorStop(0.8, '#ff6600');
                    sunGrad.addColorStop(1, '#ff3300');
                    ctx.fillStyle = sunGrad;
                    ctx.shadowColor = '#ffdd44';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(sun.x, sun.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // HALDO LOGO IN DER SONNE
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = `bold ${radius * 0.5}px system-ui, sans-serif`;
                    ctx.shadowColor = 'rgba(255,255,255,0.5)';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('⟡', sun.x, sun.y - radius * 0.05);
                    ctx.shadowBlur = 0;
                    ctx.font = `${radius * 0.12}px system-ui, sans-serif`;
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fillText('HalDo', sun.x, sun.y + radius * 0.45);

                    // Sonnenstrahlen
                    for (let i = 0; i < sun.flares; i++) {
                        const angle = i * (Math.PI / (sun.flares / 2)) + sun.pulsePhase * 0.3;
                        const len = radius * (1.5 + 0.5 * Math.sin(sun.pulsePhase * 0.7 + i * 0.5));
                        ctx.strokeStyle = `rgba(255, 220, 68, ${0.05 + 0.04 * Math.sin(sun.pulsePhase + i)})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(sun.x + Math.cos(angle) * radius * 0.7, sun.y + Math.sin(angle) * radius * 0.7);
                        ctx.lineTo(sun.x + Math.cos(angle) * len, sun.y + Math.sin(angle) * len);
                        ctx.stroke();
                    }

                    // Sonnenflecken
                    for (let i = 0; i < 8; i++) {
                        const spotAngle = i * 1.1 + sun.pulsePhase * 0.4;
                        const spotR = radius * (0.2 + 0.15 * Math.sin(sun.pulsePhase * 0.6 + i));
                        const spotX = sun.x + Math.cos(spotAngle) * radius * 0.45;
                        const spotY = sun.y + Math.sin(spotAngle) * radius * 0.45;
                        ctx.fillStyle = `rgba(180, 80, 20, ${0.15 + 0.1 * Math.sin(sun.pulsePhase + i)})`;
                        ctx.beginPath();
                        ctx.arc(spotX, spotY, spotR, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Planeten
                planets.forEach(p => {
                    // Spezielle Rotation für Uhrzeit
                    if (p.role === 'second') {
                        p.angle = (seconds / 60) * Math.PI * 2;
                    } else if (p.role === 'minute') {
                        p.angle = (minutes / 60) * Math.PI * 2 + (seconds / 60) * (Math.PI * 2 / 60);
                    } else if (p.role === 'hour') {
                        p.angle = (hours / 12) * Math.PI * 2 + (minutes / 60) * (Math.PI * 2 / 12);
                    } else {
                        p.angle += p.speed;
                    }

                    // Trail
                    if (p.role === 'normal') {
                        const px = p.centerX + Math.cos(p.angle) * p.orbit;
                        const py = p.centerY + Math.sin(p.angle) * p.orbit;
                        if (!p.trail) p.trail = [];
                        p.trail.push({ x: px, y: py, life: 1 });
                        if (p.trail.length > 30) p.trail.shift();
                        p.trail.forEach(t => t.life *= 0.98);
                    }

                    const px = p.centerX + Math.cos(p.angle) * p.orbit;
                    const py = p.centerY + Math.sin(p.angle) * p.orbit;

                    // Orbit
                    ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 6]);
                    ctx.beginPath();
                    ctx.arc(p.centerX, p.centerY, p.orbit, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Glow
                    const glow = ctx.createRadialGradient(px, py, 0, px, py, p.glow);
                    glow.addColorStop(0, p.color + '30');
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(px, py, p.glow, 0, Math.PI * 2);
                    ctx.fill();

                    // Planet
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(px, py, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Saturn Ring
                    if (p.ring) {
                        ctx.strokeStyle = 'rgba(200, 180, 150, 0.3)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.ellipse(px, py, p.radius * 1.8, p.radius * 0.5, 0.3, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.strokeStyle = 'rgba(200, 180, 150, 0.15)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.ellipse(px, py, p.radius * 2.2, p.radius * 0.7, -0.2, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Name
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '8px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(p.name, px, py + p.radius + 4);

                    // Rolle
                    if (p.role === 'second') {
                        ctx.fillStyle = 'rgba(255,200,100,0.3)';
                        ctx.font = '6px sans-serif';
                        ctx.fillText('⏱ Sekunde', px, py + p.radius + 18);
                    } else if (p.role === 'minute') {
                        ctx.fillStyle = 'rgba(100,200,255,0.3)';
                        ctx.font = '6px sans-serif';
                        ctx.fillText('⏱ Minute', px, py + p.radius + 18);
                    } else if (p.role === 'hour') {
                        ctx.fillStyle = 'rgba(255,100,100,0.3)';
                        ctx.font = '6px sans-serif';
                        ctx.fillText('⏱ Stunde', px, py + p.radius + 18);
                    }
                });

                // Mond
                if (earth && moon) {
                    const ex = earth.centerX + Math.cos(earth.angle) * earth.orbit;
                    const ey = earth.centerY + Math.sin(earth.angle) * earth.orbit;
                    moon.angle += moon.speed;
                    moon.x = ex + Math.cos(moon.angle) * moon.orbit;
                    moon.y = ey + Math.sin(moon.angle) * moon.orbit;

                    const mGlow = ctx.createRadialGradient(moon.x, moon.y, 0, moon.x, moon.y, moon.glow);
                    mGlow.addColorStop(0, 'rgba(200,200,200,0.15)');
                    mGlow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = mGlow;
                    ctx.beginPath();
                    ctx.arc(moon.x, moon.y, moon.glow, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.shadowColor = '#cccccc';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#cccccc';
                    ctx.beginPath();
                    ctx.arc(moon.x, moon.y, moon.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(150,150,150,0.3)';
                    ctx.beginPath();
                    ctx.arc(moon.x - 2, moon.y - 2, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(moon.x + 3, moon.y + 1, 1, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '6px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText('🌙 Mond', moon.x, moon.y + moon.radius + 2);
                }

                // Sterne
                const time3 = Date.now() / 5000;
                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > cosmicH) { s.y = 0;
                        s.x = Math.random() * cosmicW; }
                    const bright = s.brightness * (0.6 + 0.4 * Math.sin(time3 * 2 + s.phase));
                    ctx.globalAlpha = bright;
                    ctx.fillStyle = s.color;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                // Uhrzeit Anzeige
                ctx.fillStyle = 'rgba(255,255,255,0.12)';
                ctx.font = '12px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                const timeStr =
                    `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
                ctx.fillText(`🕐 ${timeStr}`, 16, cosmicH - 70);

                // Legende
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.font = '8px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText('⏱ Sekunde · ⏱ Minute · ⏱ Stunde · 🌙 Mond', 16, cosmicH - 50);

                requestAnimationFrame(animateCosmic);
            }

                    'philosophie': '🤔 Philosophie ist die Liebe zur Weisheit. Von Sokrates bis Nietzsche — sie fragt nach dem Sinn des Lebens.',
                    'default': '💡 Ich habe verstanden. Ich kann dir bei Wissenschaft, Geschichte, Kultur, Technik und vielem mehr helfen.'

                function getResponse(text) {
                    const lower = text.toLowerCase();

                        if (lower.includes(key)) return val;

            // ============================================================
            //  WINDOW MANAGER

            function getSafePosition() {
                const vw = window.innerWidth,
                    vh = window.innerHeight;
                const w = Math.min(540, vw - 40);
                const h = Math.min(400, vh - 160);
                return { x: Math.max(10, (vw - w) / 2), y: Math.max(40, (vh - h) / 2 - 20), w, h };
            }

            function launchApp(id) {
                const app = state.apps[id];
                if (!app) { notify('❌ App "' + id + '" nicht gefunden', 'error'); return; }

                const existing = state.windows.find(w => w.appId === id);
                if (existing) { focusWindow(existing.id); return; }

                const pos = getSafePosition();
                const winId = 'win-' + Date.now();
                const win = {
                    id: winId,
                    appId: id,
                    title: app.title || id,
                    icon: app.icon || '📦',
                    x: pos.x + Math.random() * 30,
                    y: pos.y + Math.random() * 30,
                    width: pos.w,
                    height: pos.h,
                    zIndex: state.windowZIndex++,
                    element: null
                };

                state.windows.push(win);
                renderWindow(win);
                focusWindow(winId);
                if (app.render) { app.render(win.element.querySelector('.window-body'), win); }
                events.emit('app:launched', { id, window: win });
                notify('🔄 ' + (app.title || id) + ' geöffnet');
                return win;
            }

            function renderWindow(win) {
                const existing = document.getElementById(win.id);
                if (existing) existing.remove();

                const el = document.createElement('div');
                el.id = win.id;
                el.className = 'window';
                el.style.left = win.x + 'px';
                el.style.top = win.y + 'px';
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
                el.style.zIndex = win.zIndex;
                el.dataset.appId = win.appId;

                el.innerHTML = `
                    <div class="window-header">
                        <span class="window-title">${win.icon} ${win.title}</span>
                        <div class="window-controls">
                            <button class="win-btn" data-action="minimize">─</button>
                            <button class="win-btn" data-action="maximize">⧉</button>
                            <button class="win-btn close" data-action="close">✕</button>
                        </div>
                    </div>
                    <div class="window-body"></div>
                `;

                appContainer.appendChild(el);
                win.element = el;

                el.querySelectorAll('.win-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        if (action === 'close') closeWindow(win.id);
                        else if (action === 'minimize') minimizeWindow(win.id);
                        else if (action === 'maximize') maximizeWindow(win.id);
                    });
                });

                const header = el.querySelector('.window-header');
                let drag = false,
                    startX, startY, origX, origY, isTouch = false;

                function startDrag(cx, cy) {
                    if (header.querySelector('.win-btn') && document.activeElement?.tagName === 'BUTTON') return;
                    drag = true;
                    startX = cx;
                    startY = cy;
                    origX = win.x;
                    origY = win.y;
                    focusWindow(win.id);
                    el.style.cursor = 'grabbing';
                }

                function moveDrag(cx, cy) {
                    if (!drag) return;
                    const dx = cx - startX,
                        dy = cy - startY;
                    win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
                    win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
                    el.style.left = win.x + 'px';
                    el.style.top = win.y + 'px';
                }

                function endDrag() { if (drag) { drag = false;
                        el.style.cursor = ''; } }

                header.addEventListener('mousedown', e => { if (!e.target.closest('.win-btn')) startDrag(e.clientX, e
                        .clientY); });
                document.addEventListener('mousemove', e => { if (drag) moveDrag(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endDrag);

                header.addEventListener('touchstart', e => {
                    const t = e.touches[0];
                    if (!e.target.closest('.win-btn')) { isTouch = true;
                        startDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchmove', e => {
                    if (drag && isTouch) { const t = e.touches[0];
                        moveDrag(t.clientX, t.clientY); }
                }, { passive: true });
                document.addEventListener('touchend', () => { if (isTouch) { isTouch = false;
                        endDrag(); } }, { passive: true });

                const resizeHandle = document.createElement('div');
                resizeHandle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:24px;height:24px;cursor:se-resize;touch-action:none;';
                el.appendChild(resizeHandle);

                let resize = false,
                    startW, startH, startX2, startY2;

                function startResize(cx, cy) { resize = true;
                    startW = win.width;
                    startH = win.height;
                    startX2 = cx;
                    startY2 = cy; }

                function moveResize(cx, cy) {
                    if (!resize) return;
                    const dw = cx - startX2,
                        dh = cy - startY2;
                    win.width = Math.max(200, Math.min(window.innerWidth - win.x - 10, startW + dw));
                    win.height = Math.max(120, Math.min(window.innerHeight - win.y - 80, startH + dh));
                    el.style.width = win.width + 'px';
                    el.style.height = win.height + 'px';
                }

                function endResize() { resize = false; }

                resizeHandle.addEventListener('mousedown', e => { e.stopPropagation();
                    startResize(e.clientX, e.clientY); });
                document.addEventListener('mousemove', e => { if (resize) moveResize(e.clientX, e.clientY); });
                document.addEventListener('mouseup', endResize);

                resizeHandle.addEventListener('touchstart', e => { const t = e.touches[0];
                    e.stopPropagation();
                    startResize(t.clientX, t.clientY); }, { passive: true });
                document.addEventListener('touchmove', e => { if (resize) { const t = e.touches[0];
                        moveResize(t.clientX, t.clientY); } }, { passive: true });
                document.addEventListener('touchend', endResize, { passive: true });
            }

            function closeWindow(winId) {
                const idx = state.windows.findIndex(w => w.id === winId);
                if (idx === -1) return;
                const win = state.windows[idx];
                if (win.element) win.element.remove();
                state.windows.splice(idx, 1);
                if (state.activeWindow === winId) state.activeWindow = null;
                if (state.windows.length > 0) focusWindow(state.windows[state.windows.length - 1].id);
                events.emit('app:closed', { id: win.appId });
            }

            function focusWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (!win) return;
                state.activeWindow = winId;
                win.zIndex = state.windowZIndex++;
                if (win.element) {
                    win.element.style.zIndex = win.zIndex;
                    win.element.classList.add('active');
                    state.windows.forEach(w => { if (w.id !== winId && w.element) w.element.classList.remove('active'); });
                }
            }

            function minimizeWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (win && win.element) { win.element.style.display = 'none';
                    notify('⏬ ' + win.title + ' minimiert'); }
            }

            function maximizeWindow(winId) {
                const win = state.windows.find(w => w.id === winId);
                if (!win || !win.element) return;
                if (win.width === window.innerWidth - 20) {
                    win.width = win._prevWidth || 540;
                    win.height = win._prevHeight || 400;
                    win.x = win._prevX || 20;
                    win.y = win._prevY || 40;
                } else {
                    win._prevWidth = win.width;
                    win._prevHeight = win.height;
                    win._prevX = win.x;
                    win._prevY = win.y;
                    win.width = window.innerWidth - 20;
                    win.height = window.innerHeight - 100;
                    win.x = 10;
                    win.y = 30;
                }
                win.element.style.width = win.width + 'px';
                win.element.style.height = win.height + 'px';
                win.element.style.left = win.x + 'px';
                win.element.style.top = win.y + 'px';
            }

                            <div style="color:#44ff88;">$ HalDo OS ${state.system.version}</div>
                            <div style="color:#8899bb;">$ Kernel ${state.system.kernel}</div>
                            <div style="color:#8899bb;">$ ${navigator.platform}</div>
                            <div style="color:#44ff88;">$ ready ></div>
                        </div>
                        <div style="display:flex;gap:6px;margin-top:6px;">
                            <input type="text" id="term-input" placeholder="$ Befehl ..." style="flex:1;font-family:'Courier New',monospace;font-size:0.7rem;" />
                            <button id="term-exec" style="padding:6px 12px;">⏎</button>
                        </div>
                    `;
                    const output = body.querySelector('#term-output');
                    const input = body.querySelector('#term-input');

                    function exec(cmd) {
                        const line = document.createElement('div');
                        line.style.color = '#44ff88';
                        line.textContent = '$ ' + cmd;
                        output.appendChild(line);
                        let resp = '';
                        const parts = cmd.trim().split(' ');
                        const main = parts[0].toLowerCase();

                        if (main === 'help') resp =
                            'help, version, apps, theme, clear, echo, date, whoami, sysinfo, uptime, backup, restore, update, log, ezidi, planet, sun';
                        else if (main === 'version') resp = 'HalDo OS ' + state.system.version + ' (Kernel ' + state
                            .system.kernel + ')';
                        else if (main === 'apps') resp = '📱 ' + Object.keys(state.apps).length + ' Apps';
                        else if (main === 'theme') resp = '🎨 ' + state.settings.theme;
                        else if (main === 'clear') { output.innerHTML = ''; return; }
                        else if (main === 'echo') resp = parts.slice(1).join(' ') || '';
                        else if (main === 'date') resp = new Date().toLocaleString();
                        else if (main === 'whoami') resp = 'haldo@cosmic';
                        else if (main === 'uptime') resp = '⏱ ' + kernel.getUptime();
                        else if (main === 'sysinfo') resp =
                            `OS: HalDo OS ${state.system.version}\nKernel: ${state.system.kernel}\nPlatform: ${navigator.platform}\nRAM: ${navigator.deviceMemory||'?'} GB\nApps: ${Object.keys(state.apps).length}\nUptime: ${kernel.getUptime()}`;
                        else if (main === 'backup') { kernel.backup();
                            resp = '💾 Backup wird erstellt ...'; } else if (main === 'update') { kernel.update();
                            resp = '🔄 Update wird geprüft ...'; } else if (main === 'restore') {
                            if (parts.length > 1) { kernel.restore(parts[1]);
                                resp = '🔄 Wiederherstellung von ' + parts[1]; } else resp =
                                '❌ Bitte Backup-ID angeben: restore <id>'; } else if (main === 'log') resp =
                            '📋 ' + state.logs.slice(-5).map(l => l.message).join('\n');
                        else if (main === 'ezidi') resp =
                            '🟡 Êzîdî: Eine der ältesten monotheistischen Religionen. Sprache: Kurmanji.';
                        else if (main === 'planet') resp =
                            '🪐 12 Planeten: Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus, Neptun, Pluto, HalDo-1, HalDo-2, HalDo-3. Erde = Stunde, Venus = Minute, Merkur = Sekunde.';
                        else if (main === 'sun') resp =
                            '☀️ Die Sonne ist ein gelber Zwergstern. Sie enthält das HalDo-Logo. Klicke auf die Sonne für HalDo AI!';
                        else if (cmd === '') return;
                        else resp = '❌ Unbekannt: "' + cmd + '". Tipp: help';

                        const rl = document.createElement('div');
                        rl.style.color = '#8899bb';
                        rl.textContent = resp;
                        output.appendChild(rl);
                        output.scrollTop = output.scrollHeight;
                        log('Terminal: ' + cmd);
                    }

                    body.querySelector('#term-exec').addEventListener('click', () => { const v = input.value.trim(); if (v)
                            exec(v);
                        input.value = ''; });
                    input.addEventListener('keydown', e => { if (e.key === 'Enter') body.querySelector('#term-exec')

                    const images = ['🌅 Sonnenuntergang', '🌌 Milchstraße', '🪐 Saturn', '🌍 Erde', '🌙 Mond',

                    ];
                    body.innerHTML = `
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;">
                            ${images.map(img => `
                                <div class="app-item" onclick="HalDo.notify('🖼️ ${img}')">
                                    <div class="icon" style="font-size:2.5rem;">${img.split(' ')[0]}</div>
                                    <div class="name">${img}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div style="font-size:0.6rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:6px;margin-top:6px;">🖼️ ${images.length} Bilder</div>
                    `;
                }
            });

            // ===== BROWSER APP =====
            registerApp('browser', {
                title: 'Browser',
                icon: '🌐',
                render: (body) => {
                    body.innerHTML = `
                        <div style="display:flex;gap:6px;margin-bottom:8px;">
                            <input type="text" id="browser-url" placeholder="🔍 Suche oder URL ..." style="flex:1;" value="https://haldo.ai" />

                        </div>

                            <div style="font-size:2rem;">🌐</div>
                            <div style="margin-top:8px;">HalDo Browser — Demo</div>
                            <div style="font-size:0.65rem;margin-top:4px;">Gib eine URL ein oder suche</div>
                        </div>
                    `;
                    body.querySelector('#browser-go').addEventListener('click', () => {
                        const url = body.querySelector('#browser-url').value.trim();
                        if (url) notify('🌐 Öffne: ' + url);
                    });
                    body.querySelector('#browser-url').addEventListener('keydown', e => {
                        if (e.key === 'Enter') body.querySelector('#browser-go').click();
                    });
                }
            });

            // ===== APP WORLD =====
            registerApp('appworld', {
                title: 'App World 24',
                icon: '📱',
                render: (body) => {
                    const apps = Object.entries(state.apps).filter(([id]) => !['appworld', 'appworld24'].includes(id));
                    body.innerHTML = `
                        <h3 style="margin-bottom:8px;font-size:0.9rem;">📱 Alle ${apps.length} Apps</h3>
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;max-height:300px;overflow-y:auto;">
                            ${apps.map(([id, app]) => `
                                <div class="app-item" onclick="HalDo.launchApp('${id}')">
                                    <div class="icon">${app.icon}</div>
                                    <div class="name">${app.title}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div style="font-size:0.6rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:6px;margin-top:6px;display:flex;justify-content:space-between;">
                            <span>📱 ${apps.length} Apps</span>
                            <span>HalDo OS 24</span>

                    `;
                }
            });

            // ===== ALLE ANDEREN APPS (Platzhalter mit voller UI) =====
            const moreApps = [
                { id: 'calculator', title: 'Calculator', icon: '🧮' },
                { id: 'camera', title: 'Camera', icon: '📷' },
                { id: 'documents', title: 'Documents', icon: '📄' },
                { id: 'downloads', title: 'Downloads', icon: '⬇️' },
                { id: 'ezidikeyboard', title: 'Êzîdî Keyboard', icon: '⌨️' },
                { id: 'games', title: 'Games Center', icon: '🎮' },
                { id: 'help', title: 'Help Center', icon: '❓' },
                { id: 'imageeditor', title: 'Image Editor', icon: '🎨' },
                { id: 'internet', title: 'Internet Center', icon: '📶' },
                { id: 'journal', title: 'Journal / Diary', icon: '📖' },
                { id: 'language', title: 'Language Center', icon: '🌍' },
                { id: 'logs', title: 'System Logs', icon: '📋' },
                { id: 'maps', title: 'Maps', icon: '🗺️' },

                { id: 'photos', title: 'Photos', icon: '🖼️' },
                { id: 'privacy', title: 'Privacy Center', icon: '🔒' },
                { id: 'processmanager', title: 'Process Manager', icon: '⚡' },
                { id: 'quicksettings', title: 'Quick Settings', icon: '⚙️' },
                { id: 'qrscanner', title: 'QR Scanner', icon: '📱' },
                { id: 'recovery', title: 'Recovery Center', icon: '🔄' },
                { id: 'reminders', title: 'Reminders', icon: '⏰' },
                { id: 'security', title: 'Security Center', icon: '🛡️' },
                { id: 'systemmonitor', title: 'System Monitor', icon: '📊' },
                { id: 'storagemanager', title: 'Storage Manager', icon: '💽' },
                { id: 'screenshot', title: 'Screenshot', icon: '📸' },
                { id: 'search', title: 'Search', icon: '🔍' },
                { id: 'taskmanager', title: 'Task Manager', icon: '✅' },
                { id: 'theme', title: 'Theme Center', icon: '🎨' },
                { id: 'clock', title: 'Time / Clock', icon: '🕐' },
                { id: 'update', title: 'Update Center', icon: '🔄' },
                { id: 'usercenter', title: 'User Center', icon: '👤' },
                { id: 'video', title: 'Video Player', icon: '🎬' },
                { id: 'voice', title: 'Voice Center', icon: '🎤' },
                { id: 'voicerecorder', title: 'Voice Recorder', icon: '🎙️' },
                { id: 'weather', title: 'Weather', icon: '🌤️' },
                { id: 'websearch', title: 'Web Search', icon: '🔎' },
                { id: 'windows', title: 'Window Center', icon: '🪟' },

            moreApps.forEach(app => {
                registerApp(app.id, {
                    title: app.title,
                    icon: app.icon,
                    render: (body) => {
                        body.innerHTML = `
                            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;text-align:center;padding:16px;">
                                <div style="font-size:2.5rem;">${app.icon}</div>
                                <h3 style="font-size:0.9rem;">${app.title}</h3>
                                <p style="color:#8899bb;font-size:0.75rem;">Diese App ist bereit für HalDo OS 24.</p>
                                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                    <button onclick="HalDo.notify('▶️ ${app.title} wird geöffnet')" style="padding:6px 14px;font-size:0.75rem;">▶️ Öffnen</button>
                                    <button onclick="HalDo.notify('ℹ️ ${app.title} — Version 24.0')" style="padding:6px 14px;font-size:0.75rem;background:rgba(255,255,255,0.06);">ℹ️ Info</button>
                                </div>
                                <div style="font-size:0.55rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:6px;width:100%;">${app.id} · HalDo OS 24</div>
                            </div>
                        `;
                    }
                });
            });

            // ============================================================
            //  SYSTEM INIT
            // ============================================================

            function updateClock() {
                const now = new Date();
                clockDisplay.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            }

            async function init() {
                // System booten
                await kernel.init();

                // Cosmic World starten
                initCosmic();

                // AI Overlay für Sonnen-Klick
                createAIOverlay();

                // Clock
                updateClock();
                setInterval(updateClock, 10000);

                // Dock
                dock.querySelectorAll('.dock-item').forEach(btn => {
                    btn.addEventListener('click', () => { launchApp(btn.dataset.app); });
                });

                // Topbar
                document.getElementById('menu-system').addEventListener('click', () => {
                    notify('⚙️ System-Menü: AI · Mail · Chat · Kontakte · Dateien · Einstellungen · Cosmic · System · Terminal · App World');
                    launchApp('system');
                });
                document.getElementById('btn-appworld').addEventListener('click', () => launchApp('appworld'));
                document.getElementById('btn-theme').addEventListener('click', () => {
                    const themes = ['cosmic', 'dark', 'light'];
                    const current = state.settings.theme;
                    const next = themes[(themes.indexOf(current) + 1) % themes.length];
                    state.settings.theme = next;
                    localStorage.setItem('haldo_settings', JSON.stringify(state.settings));
                    notify('🎨 Theme: ' + next);
                });
                document.getElementById('btn-update').addEventListener('click', () => {
                    launchApp('appworld');
                    kernel.update();
                });
                document.getElementById('btn-about').addEventListener('click', () => {
                    notify('⟡ HalDo OS ' + state.system.version + '\n💙❤️🚀 Cosmic Intelligent OS\n' + Object.keys(
                        state.apps).length + ' Apps · Kernel ' + state.system.kernel);
                });

                // Events
                events.on('system:ready', () => {
                    log('System: Ready');
                    setTimeout(() => launchApp('ai'), 400);
                    setTimeout(() => launchApp('system'), 700);
                    setTimeout(() => notify('🌌 HalDo OS 24 ist bereit!', 'success'), 800);
                });

                // Auto-Backup (alle 24h)
                setInterval(() => {
                    if (state.settings.backupInterval === 'daily') {
                        kernel.backup();
                    }
                }, 86400000);

                // Global API
                window.HalDo = {
                    launchApp,
                    notify,
                    kernel,
                    storage,
                    events,
                    state,
                    VERSION,
                    getAIResponse,
                    get apps() { return state.apps; },
                    get windows() { return state.windows; }
                };

                console.log('⟡ HalDo OS ' + state.system.version + ' — Cosmic Intelligent OS');
                console.log('📱 ' + Object.keys(state.apps).length + ' Apps geladen');
                console.log('🌌 Cosmic World: Sonne, 12 Planeten, Mond, Erde, Galaxien');
                console.log('💡 Klicke auf die Sonne für HalDo AI');
                console.log('💡 HalDo.launchApp("appworld") für alle Apps');
                console.log('💡 HalDo.kernel.backup() für Backup');
                console.log('💡 HalDo.kernel.update() für Update');

                // Auto-Update prüfen
                if (state.settings.autoUpdates) {
                    setTimeout(() => kernel.update(), 5000);
                }
            }

            // Start
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
