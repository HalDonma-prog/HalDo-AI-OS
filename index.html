<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03040b">
<meta name="description" content="HalDo AI OS 20.3 — Cosmic AI Operating System">
<link rel="manifest" href="manifest.json">
<title>HalDo AI OS 20.3</title>

<style>
:root{
    --bg:#02030a;
    --glass:rgba(7,10,24,.72);
    --glass2:rgba(13,18,39,.84);
    --line:rgba(255,255,255,.11);
    --line-soft:rgba(255,255,255,.055);
    --text:#fff;
    --muted:rgba(255,255,255,.58);
    --gold:#ffe7a3;
    --blue:#91a8ff;
    --cyan:#9cecff;
    --violet:#c6a7ff;
    --green:#91e6bd;
    --danger:#ff8d9d;
    --shadow:rgba(0,0,0,.62);
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    -webkit-font-smoothing:antialiased;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================================================
   ROOT / COSMIC WORLD
   ========================================================= */

#haldo-root{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 47%,
            rgba(125,146,255,.13),
            transparent 20%
        ),
        radial-gradient(
            circle at 20% 75%,
            rgba(117,72,255,.08),
            transparent 27%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(71,196,255,.07),
            transparent 24%
        ),
        #02030a;
}

#space{
    position:absolute;
    inset:0;
    overflow:hidden;
    perspective:900px;
}

/* =========================================================
   STAR FIELD
   ========================================================= */

.star-layer{
    position:absolute;
    inset:-20%;
    pointer-events:none;
    background-repeat:repeat;
}

.stars-a{
    opacity:.92;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.7px),
        radial-gradient(circle,rgba(177,210,255,.7) 0 1px,transparent 1.7px);
    background-size:125px 125px,205px 205px;
    background-position:0 0,47px 83px;
    animation:starsA 95s linear infinite;
}

.stars-b{
    opacity:.55;
    transform:scale(1.15);
    background-image:
        radial-gradient(circle,rgba(255,244,204,.9) 0 1.2px,transparent 2px),
        radial-gradient(circle,rgba(173,184,255,.8) 0 1.3px,transparent 2px);
    background-size:250px 250px,340px 340px;
    background-position:72px 20px,160px 120px;
    animation:starsB 145s linear infinite reverse;
}

.stars-c{
    opacity:.3;
    transform:scale(1.3);
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 0 1.5px,transparent 2.4px);
    background-size:420px 420px;
    animation:starsC 210s linear infinite;
}

@keyframes starsA{
    from{transform:translate3d(0,0,0);}
    to{transform:translate3d(-140px,90px,0);}
}

@keyframes starsB{
    from{transform:translate3d(0,0,0) scale(1.15);}
    to{transform:translate3d(120px,-100px,0) scale(1.15);}
}

@keyframes starsC{
    from{transform:rotate(0deg) scale(1.3);}
    to{transform:rotate(360deg) scale(1.3);}
}

/* =========================================================
   NEBULA
   ========================================================= */

.nebula{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    filter:blur(35px);
    opacity:.22;
}

.nebula-one{
    width:38vw;
    height:18vw;
    left:-8vw;
    top:30vh;
    background:
        radial-gradient(
            ellipse,
            rgba(105,130,255,.65),
            transparent 70%
        );
    transform:rotate(-20deg);
    animation:nebulaFloat 14s ease-in-out infinite alternate;
}

.nebula-two{
    width:40vw;
    height:20vw;
    right:-10vw;
    bottom:13vh;
    background:
        radial-gradient(
            ellipse,
            rgba(190,106,255,.52),
            transparent 70%
        );
    transform:rotate(25deg);
    animation:nebulaFloat 18s ease-in-out infinite alternate-reverse;
}

@keyframes nebulaFloat{
    from{transform:translate3d(0,0,0) rotate(-20deg);}
    to{transform:translate3d(25px,-15px,0) rotate(-14deg);}
}

/* =========================================================
   CENTRAL SUN
   ========================================================= */

#cosmic-center{
    position:absolute;
    left:50%;
    top:50%;
    width:230px;
    height:230px;
    transform:translate(-50%,-50%);
    z-index:20;
}

.sun-corona{
    position:absolute;
    inset:-75px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,234,160,.28),
            rgba(255,207,91,.16) 27%,
            rgba(123,151,255,.11) 50%,
            transparent 72%
        );
    filter:blur(10px);
    animation:
        sunPulse 5s ease-in-out infinite,
        sunRotate 28s linear infinite;
}

.sun-corona-two{
    position:absolute;
    inset:-38px;
    border-radius:50%;
    border:
        1px solid rgba(255,227,153,.18);
    box-shadow:
        0 0 50px rgba(255,216,112,.16);
    animation:
        sunRotate 20s linear infinite reverse;
}

.sun{
    position:absolute;
    inset:23px;
    border-radius:50%;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 32% 27%,
            #fff 0%,
            #fff4ca 8%,
            #ffe08a 22%,
            #ffb93e 44%,
            #ef7c27 63%,
            #8b4a35 83%,
            #2a1730 100%
        );
    box-shadow:
        0 0 32px rgba(255,218,123,.85),
        0 0 75px rgba(255,187,69,.46),
        0 0 135px rgba(120,145,255,.24);
    animation:sunBreathe 4.8s ease-in-out infinite;
}

.sun::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255,255,255,.18) 0deg 7deg,
            transparent 7deg 20deg
        );
    mix-blend-mode:screen;
    animation:sunSurface 11s linear infinite;
}

@keyframes sunPulse{
    0%,100%{transform:scale(1);opacity:.8;}
    50%{transform:scale(1.08);opacity:1;}
}

@keyframes sunRotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes sunBreathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.035);}
}

@keyframes sunSurface{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

#haldo-logo{
    position:relative;
    z-index:2;
    width:105px;
    height:105px;
    object-fit:contain;
    border-radius:50%;
    filter:
        drop-shadow(0 0 12px rgba(255,255,255,.9))
        drop-shadow(0 0 25px rgba(255,225,148,.55));
    animation:
        logoFloat 3.8s ease-in-out infinite;
}

#haldo-logo-fallback{
    display:none;
    position:relative;
    z-index:2;
    font-size:58px;
    font-weight:950;
    color:white;
    text-shadow:
        0 0 15px white,
        0 0 35px #ffe49a;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-4px) scale(1.025);}
}

/* =========================================================
   ORBITS
   ========================================================= */

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    pointer-events:none;
    transform-style:preserve-3d;
}

.orbit-1{
    width:330px;
    height:330px;
    margin:-165px;
    border:1px solid rgba(171,194,255,.20);
    box-shadow:
        0 0 22px rgba(126,159,255,.08);
    animation:orbitSpin1 22s linear infinite;
}

.orbit-2{
    width:490px;
    height:490px;
    margin:-245px;
    border:1px solid rgba(255,220,141,.13);
    transform:rotateX(66deg);
    animation:orbitSpin2 31s linear infinite;
}

.orbit-3{
    width:660px;
    height:330px;
    margin:-165px -330px;
    border:1px solid rgba(150,175,255,.12);
    transform:rotateX(69deg) rotateZ(28deg);
    animation:orbitSpin3 39s linear infinite reverse;
}

.orbit-4{
    width:820px;
    height:820px;
    margin:-410px;
    border:1px dashed rgba(164,182,255,.07);
    transform:rotateX(72deg);
    animation:orbitSpin4 57s linear infinite;
}

@keyframes orbitSpin1{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes orbitSpin2{
    from{transform:rotateX(66deg) rotateZ(0deg);}
    to{transform:rotateX(66deg) rotateZ(360deg);}
}

@keyframes orbitSpin3{
    from{transform:rotateX(69deg) rotateZ(28deg) rotate(0deg);}
    to{transform:rotateX(69deg) rotateZ(28deg) rotate(-360deg);}
}

@keyframes orbitSpin4{
    from{transform:rotateX(72deg) rotateZ(0deg);}
    to{transform:rotateX(72deg) rotateZ(360deg);}
}

/* =========================================================
   PLANETS
   ========================================================= */

.planet{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    z-index:8;
    box-shadow:
        inset -15px -18px 28px rgba(0,0,0,.48),
        0 0 22px rgba(150,180,255,.2);
}

.planet::after{
    content:"";
    position:absolute;
    inset:-18%;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.16),
            transparent 68%
        );
    filter:blur(5px);
}

.planet-1{
    width:57px;
    height:57px;
    left:calc(50% + 125px);
    top:calc(50% - 175px);
    background:
        radial-gradient(
            circle at 31% 26%,
            #fff,
            #c8e4ff 13%,
            #6294d4 43%,
            #28396e 72%,
            #11162d
        );
    animation:planet1 22s linear infinite;
}

.planet-2{
    width:39px;
    height:39px;
    left:calc(50% - 245px);
    top:calc(50% + 105px);
    background:
        radial-gradient(
            circle at 30% 24%,
            #fff2c4,
            #d69b67 23%,
            #884b43 60%,
            #281c35
        );
    animation:planet2 31s linear infinite;
}

.planet-3{
    width:75px;
    height:75px;
    left:calc(50% + 280px);
    top:calc(50% + 110px);
    background:
        radial-gradient(
            circle at 29% 25%,
            #fff,
            #b9e4ed 15%,
            #4b92a6 43%,
            #19344e 72%,
            #0a1120
        );
    animation:planet3 39s linear infinite;
}

.planet-4{
    width:27px;
    height:27px;
    left:calc(50% - 360px);
    top:calc(50% - 110px);
    background:
        radial-gradient(
            circle at 30% 25%,
            #fff5dc,
            #c7a16d 35%,
            #593f3d
        );
    animation:planet4 57s linear infinite;
}

@keyframes planet1{
    0%{
        transform:rotate(0deg) translateX(0);
    }
    25%{
        transform:translate(75px,55px) rotate(90deg);
    }
    50%{
        transform:translate(0,120px) rotate(180deg);
    }
    75%{
        transform:translate(-80px,50px) rotate(270deg);
    }
    100%{
        transform:translate(0,0) rotate(360deg);
    }
}

@keyframes planet2{
    0%{
        transform:translate(0,0) rotate(0deg);
    }
    50%{
        transform:translate(170px,-85px) rotate(180deg);
    }
    100%{
        transform:translate(0,0) rotate(360deg);
    }
}

@keyframes planet3{
    0%{
        transform:translate(0,0) rotate(0deg);
    }
    50%{
        transform:translate(-210px,-120px) rotate(180deg);
    }
    100%{
        transform:translate(0,0) rotate(360deg);
    }
}

@keyframes planet4{
    0%{
        transform:translate(0,0) rotate(0deg);
    }
    50%{
        transform:translate(210px,160px) rotate(180deg);
    }
    100%{
        transform:translate(0,0) rotate(360deg);
    }
}

/* =========================================================
   TOP BAR
   ========================================================= */

#topbar{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:62px;
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    background:
        linear-gradient(
            180deg,
            rgba(2,4,12,.78),
            rgba(2,4,12,.35)
        );
    backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line-soft);
}

.top-left,
.top-right{
    display:flex;
    align-items:center;
    gap:9px;
}

.top-button{
    width:38px;
    height:38px;
    border:1px solid var(--line);
    border-radius:12px;
    color:white;
    background:rgba(255,255,255,.055);
    transition:.2s;
}

.top-button:hover{
    background:rgba(255,255,255,.12);
    transform:translateY(-1px);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    font-weight:850;
}

.brand-mark{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:11px;
    color:#fff;
    background:
        radial-gradient(
            circle,
            rgba(255,228,153,.7),
            rgba(130,145,255,.18)
        );
    box-shadow:
        0 0 18px rgba(255,220,135,.2);
}

.system-pill{
    padding:8px 12px;
    border:1px solid var(--line-soft);
    border-radius:12px;
    color:var(--muted);
    font-size:11px;
    background:rgba(255,255,255,.035);
}

/* =========================================================
   SIDE MENU
   ========================================================= */

#side-menu{
    position:absolute;
    left:14px;
    top:73px;
    bottom:92px;
    width:310px;
    z-index:6500;
    display:none;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:24px;
    background:rgba(5,8,20,.94);
    backdrop-filter:blur(32px);
    box-shadow:0 35px 110px var(--shadow);
}

#side-menu.open{
    display:flex;
}

.menu-head{
    padding:17px;
    border-bottom:1px solid var(--line-soft);
}

.menu-title{
    font-size:17px;
    font-weight:900;
}

.menu-subtitle{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
}

.menu-search{
    width:100%;
    height:41px;
    margin-top:13px;
    padding:0 12px;
    outline:none;
    border:1px solid var(--line);
    border-radius:12px;
    color:white;
    background:rgba(255,255,255,.045);
}

#menu-list{
    flex:1;
    overflow:auto;
    padding:9px;
}

.menu-category{
    margin:13px 9px 5px;
    color:rgba(255,255,255,.36);
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.12em;
}

.menu-item{
    width:100%;
    min-height:45px;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:3px;
    padding:7px 10px;
    border:0;
    border-radius:12px;
    color:white;
    text-align:left;
    background:transparent;
}

.menu-item:hover{
    background:rgba(255,255,255,.075);
}

.menu-icon{
    width:29px;
    text-align:center;
    font-size:18px;
}

.menu-name{
    flex:1;
    font-size:12px;
}

.menu-state{
    color:var(--green);
    font-size:9px;
}

/* =========================================================
   LAUNCHER
   ========================================================= */

#launcher{
    position:absolute;
    left:50%;
    top:75px;
    width:min(1100px,94vw);
    height:min(78vh,750px);
    transform:translateX(-50%);
    z-index:7000;
    display:none;
    flex-direction:column;
    padding:19px;
    border:1px solid var(--line);
    border-radius:27px;
    background:rgba(5,8,21,.96);
    backdrop-filter:blur(35px);
    box-shadow:0 45px 130px var(--shadow);
}

#launcher.open{
    display:flex;
}

.launcher-top{
    display:flex;
    gap:9px;
    margin-bottom:15px;
}

#launcher-search{
    flex:1;
    height:46px;
    padding:0 14px;
    outline:none;
    border:1px solid var(--line);
    border-radius:13px;
    color:white;
    background:rgba(255,255,255,.05);
}

.launcher-close{
    width:46px;
    border:0;
    border-radius:13px;
    color:white;
    background:rgba(255,255,255,.07);
}

#launcher-grid{
    flex:1;
    overflow:auto;
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(160px,1fr));
    gap:10px;
}

.app-card{
    min-height:126px;
    padding:15px;
    border:1px solid var(--line-soft);
    border-radius:17px;
    color:white;
    text-align:left;
    background:rgba(255,255,255,.035);
    transition:.18s;
}

.app-card:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.085);
    border-color:rgba(170,190,255,.22);
}

.app-card-icon{
    font-size:28px;
    margin-bottom:10px;
}

.app-card-name{
    font-weight:800;
    font-size:13px;
}

.app-card-category{
    margin-top:5px;
    color:var(--muted);
    font-size:9px;
}

/* =========================================================
   WINDOWS
   ========================================================= */

#windows{
    position:absolute;
    inset:62px 0 87px;
    z-index:3000;
    pointer-events:none;
}

.window{
    position:absolute;
    left:50%;
    top:50%;
    width:min(920px,91vw);
    height:min(680px,77vh);
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:24px;
    background:rgba(6,10,24,.95);
    backdrop-filter:blur(30px);
    box-shadow:0 45px 120px var(--shadow);
    pointer-events:auto;
}

.window-header{
    flex:0 0 54px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 11px 0 16px;
    border-bottom:1px solid var(--line-soft);
    background:rgba(255,255,255,.035);
}

.window-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:850;
}

.window-controls{
    display:flex;
    gap:6px;
}

.window-control{
    width:32px;
    height:32px;
    border:0;
    border-radius:9px;
    color:white;
    background:rgba(255,255,255,.055);
}

.window-control:hover{
    background:rgba(255,255,255,.12);
}

.window-body{
    flex:1;
    overflow:auto;
    padding:20px;
}

.app-hero{
    padding:22px;
    margin-bottom:12px;
    border:1px solid var(--line-soft);
    border-radius:19px;
    background:rgba(255,255,255,.035);
}

.app-hero-icon{
    font-size:40px;
}

.app-hero-title{
    margin-top:8px;
    font-size:26px;
    font-weight:950;
}

.app-hero-description{
    margin-top:6px;
    color:var(--muted);
    line-height:1.55;
}

.app-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(210px,1fr));
    gap:10px;
}

.app-section{
    padding:17px;
    border:1px solid var(--line-soft);
    border-radius:17px;
    background:rgba(255,255,255,.032);
}

.app-section h3{
    margin:0 0 8px;
    font-size:15px;
}

.muted{
    color:var(--muted);
    line-height:1.55;
    font-size:13px;
}

.action{
    min-height:40px;
    margin:5px 5px 0 0;
    padding:0 13px;
    border:1px solid var(--line);
    border-radius:11px;
    color:white;
    background:rgba(130,150,255,.13);
}

.action:hover{
    background:rgba(130,150,255,.23);
}

/* =========================================================
   AI CHAT
   ========================================================= */

.ai-chat{
    height:100%;
    display:flex;
    flex-direction:column;
}

.ai-messages{
    flex:1;
    overflow:auto;
    padding:5px;
}

.ai-message{
    max-width:82%;
    margin:8px 0;
    padding:12px 14px;
    border-radius:15px;
    line-height:1.5;
    font-size:13px;
}

.ai-message.ai{
    margin-right:auto;
    background:rgba(145,168,255,.10);
    border:1px solid rgba(145,168,255,.13);
}

.ai-message.user{
    margin-left:auto;
    background:rgba(255,255,255,.075);
    border:1px solid var(--line-soft);
}

.ai-input-row{
    display:flex;
    gap:8px;
    padding-top:10px;
    border-top:1px solid var(--line-soft);
}

.ai-input{
    flex:1;
    min-height:45px;
    max-height:130px;
    resize:none;
    padding:12px;
    outline:none;
    border:1px solid var(--line);
    border-radius:13px;
    color:white;
    background:rgba(255,255,255,.045);
}

.ai-send{
    width:55px;
    border:0;
    border-radius:13px;
    color:white;
    background:rgba(145,168,255,.20);
}

/* =========================================================
   DOCK
   ========================================================= */

#dock{
    position:absolute;
    left:50%;
    bottom:16px;
    transform:translateX(-50%);
    z-index:6000;
    display:flex;
    gap:7px;

    ["about","Über HalDo","ⓘ","System"]

];


HalDo.apps = new Map();


APP_DEFINITIONS.forEach(
    ([id,name,icon,category]) => {

        HalDo.apps.set(
            id,
            {
                id,
                name,
                icon,
                category,
                installed:true,
                enabled:true,
                state:"ready",
                module:null
            }
        );

    }
);


/* =========================================================
   REGISTRY
   ========================================================= */

HalDo.registry = {

    list(){
        return Array.from(
            HalDo.apps.values()
        );
    },

    get(id){
        return HalDo.apps.get(id) || null;
    },

    register(app){

        if(!app || !app.id){
            return false;
        }

        HalDo.apps.set(
            app.id,
            {
                installed:true,
                enabled:true,
                state:"ready",
                ...app
            }
        );

        renderApps();

        return true;
    }

};


/* =========================================================
   MODULE CONNECTION
   ========================================================= */

HalDo.connectAppModule = function(id,module){

    const app =
        HalDo.registry.get(id);

    if(!app){
        return false;
    }

    app.module = module;
    app.state = "connected";

    window.HalDoApps =
        window.HalDoApps || {};

    window.HalDoApps[id] =
        module;

    return true;
};


/* =========================================================
   WINDOW MANAGER
   ========================================================= */

HalDo.windowManager = {

    windows:new Map(),
    z:100,

    close(id){

        const win =
            this.windows.get(id);

        if(!win){
            return;
        }

        win.remove();
        this.windows.delete(id);

    },

    closeAll(){

        this.windows.forEach(
            w => w.remove()
        );

        this.windows.clear();

    }

};


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function esc(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   DESCRIPTIONS
   ========================================================= */

const descriptions = {

    "ai":
        "Die zentrale HalDo AI für Wissen, Unterhaltung, Gespräche, Systemhilfe und zukünftige AI-Dienste.",

    "ai-chat":
        "HalDo AI Chat — natürliche Unterhaltung und Fragen-Antworten innerhalb des HalDo-Systems.",

    "browser":
        "HalDo Browser — zentrale Browser-App für Webzugriff und spätere Browser-Dienste.",

    "app-store":

    "driving-school":

    "cosmic-world":

    "ezidi-keyboard":
        "HalDo Êzîdî Keyboard — eigenes Tastaturlayout und eigene Zeichen.",

    "settings":
        "Zentrale Einstellungen für HalDo AI OS.",

    "files":
        "HalDo Dateien — Dateiverwaltung und Verbindung zum Storage-System.",

    "software-update":
        "HalDo Software Update — Systemversionen und Update-Verwaltung.",

    "backup":
        "HalDo Backup — Sicherung von System- und App-Daten.",

    "diagnostics":
        "HalDo Diagnose — Systemprüfung, Fehler und Runtime-Zustand."

};


/* =========================================================
   OPEN APP
   ========================================================= */

HalDo.openApp = function(id){

    const app =
        HalDo.registry.get(id);

    if(!app){

        showToast(
            "App nicht gefunden."
        );

        return null;
    }


    if(
        app.module &&
        typeof app.module.open === "function"
    ){

        return app.module.open();

    }


    const existing =
        HalDo.windowManager.windows.get(id);

    if(existing){

        existing.style.display =
            "flex";

        existing.style.zIndex =
            ++HalDo.windowManager.z;

        return existing;

    }


    const win =
        document.createElement("article");

    win.className = "window";
    win.dataset.app = id;

    win.style.zIndex =
        ++HalDo.windowManager.z;


    if(id === "ai" || id === "ai-chat"){

        win.innerHTML =
            createAIWindow(app);

    }else{

        win.innerHTML =
            createGenericWindow(app);

    }


    document
        .getElementById("windows")
        .appendChild(win);


    HalDo.windowManager.windows.set(
        id,
        win
    );


    attachWindowEvents(
        win,
        id
    );


    if(id === "ai" || id === "ai-chat"){

        attachAIEvents(win);

    }


    showToast(
        app.name + " geöffnet"
    );


    HalDo.emit(
        "app:opened",
        {
            id,
            app
        }
    );


    return win;

};

/* =========================================================
   WINDOW EVENTS
   ========================================================= */

function attachWindowEvents(win,id){

    win.addEventListener(
        "mousedown",
        () => {

            win.style.zIndex =
                ++HalDo.windowManager.z;

        }
    );


    win.querySelector(
        "[data-close]"
    ).addEventListener(
        "click",
        () => {

            HalDo.windowManager.close(id);

        }
    );


    win.querySelector(
        "[data-minimize]"

        "click",

            win.style.display =

        }
    );

        win.querySelector(
            "[data-settings]"
        );

    if(settings){

        settings.addEventListener(
            "click",
            () => {

                    "settings"
                );

            }
        );

    }


    const refresh =
        win.querySelector(
            "[data-refresh]"
        );

    if(refresh){

        refresh.addEventListener(
            "click",
            () => {

                showToast(
                    "App-Runtime aktualisiert."
                );

            }
        );

    }

}


/* =========================================================
   LOCAL HALDO AI
   ========================================================= */

function localAIAnswer(text){

    const q =
        text
            .trim()
            .toLowerCase();


    if(!q){

        return "Schreib mir einfach etwas. ☀️";

    }


    if(
        q.includes("hallo") ||
        q.includes("hi") ||
        q.includes("hey")
    ){

        return(
            "Hallo! ❤️ Ich bin HalDo AI. "
            +
            "Schön, dass du da bist. "
            +
            "Worüber möchtest du sprechen?"
        );

    }


    if(
        q.includes("wer bist") ||
        q.includes("was bist")
    ){

        return(
            "Ich bin die HalDo-AI-Oberfläche innerhalb "
            +
            "des HalDo AI OS. Meine echte Wissens- und "
            +
            "Dialogfähigkeit wird über den HalDo AI-Core "
            +
            "angebunden."
        );

    }


    if(
        q.includes("haldo")
    ){

        return(
            "HalDo AI OS ist als eigenes Cosmic-Betriebssystem "
            +
            "mit Apps, AI, Sprache, Storage, Updates und "
            +
            "Cosmic World aufgebaut."
        );

    }


    if(
        q.includes("hilfe")
    ){

        return(
            "Du kannst mir Fragen stellen, über HalDo sprechen "
            +
            "oder eine Aufgabe formulieren. Für eine echte "
            +
            "freie Wissens-KI wird anschließend der AI-Core "
            +
            "mit einem Modell verbunden."
        );

    }


    return(
        "Ich habe deine Nachricht erhalten: „"
        +
        text
        +
        "“.\n\n"
        +
        "Die HalDo-AI-Runtime funktioniert bereits als "
        +
        "Gesprächsoberfläche. Die nächste Systemebene ist "
        +
        "die Verbindung mit dem echten HalDo AI-Core, damit "
        +
        "freie Wissensfragen und komplexe Gespräche möglich "
        +
        "werden."
    );

}


/* =========================================================
   AI EVENTS
   ========================================================= */

function attachAIEvents(win){

    const input =
        win.querySelector(
            "[data-ai-input]"
        );

    const messages =
        win.querySelector(
            "[data-ai-messages]"
        );

    const send =
        win.querySelector(
            "[data-ai-send]"
        );


    function sendMessage(){

        const text =
            input.value.trim();

        if(!text){
            return;
        }


        const user =
            document.createElement("div");

        user.className =
            "ai-message user";

        user.textContent =
            text;

        messages.appendChild(
            user
        );


        input.value = "";


        setTimeout(
            () => {

                const ai =
                    document.createElement("div");

                ai.className =
                    "ai-message ai";

                ai.textContent =
                    localAIAnswer(text);

                messages.appendChild(
                    ai
                );

                messages.scrollTop =
                    messages.scrollHeight;

            },
            180
        );

    }


    send.addEventListener(
        "click",
        sendMessage
    );


    input.addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
                &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendMessage();

            }

        }
    );

}


/* =========================================================
   MENU / LAUNCHER
   ========================================================= */

function renderApps(filter=""){

    const menu =
        document.getElementById(
            "menu-list"
        );

    const launcher =
        document.getElementById(
            "launcher-grid"
        );


    menu.innerHTML = "";
    launcher.innerHTML = "";


    const q =
        filter
            .trim()
            .toLowerCase();


    const apps =
        HalDo.registry
            .list()
            .filter(app => {

                if(!q){
                    return true;
                }

                return(
                    app.name.toLowerCase().includes(q)
                    ||
                    app.category.toLowerCase().includes(q)
                    ||
                    app.id.toLowerCase().includes(q)
                );

            });


    let currentCategory = "";


    apps.forEach(
        app => {

            if(
                app.category !==
                currentCategory
            ){

                currentCategory =
                    app.category;


                const category =
                    document.createElement(
                        "div"
                    );

                category.className =
                    "menu-category";

                category.textContent =
                    app.category;

                menu.appendChild(
                    category
                );

            }


            const item =
                document.createElement(
                    "button"
                );

            item.className =
                "menu-item";

            item.innerHTML = `

                <span class="menu-icon">
                    ${esc(app.icon)}
                </span>

                <span class="menu-name">
                    ${esc(app.name)}
                </span>

                <span class="menu-state">
                    ●
                </span>

            `;


            item.addEventListener(
                "click",
                () => {

                    HalDo.openApp(
                        app.id
                    );

                    closeSideMenu();

                }
            );


            menu.appendChild(
                item
            );


            const card =
                document.createElement(
                    "button"
                );

            card.className =
                "app-card";

            card.innerHTML = `

                <div class="app-card-icon">
                    ${esc(app.icon)}
                </div>

                <div class="app-card-name">
                    ${esc(app.name)}
                </div>

                <div class="app-card-category">
                    ${esc(app.category)}
                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    HalDo.openApp(
                        app.id
                    );

                    closeLauncher();

                }
            );


            launcher.appendChild(
                card
            );

        }
    );

}

function closeLauncher(){

function toggleMenu(){

        .classList.toggle("open");

}


function closeSideMenu(){

    document
        .getElementById("side-menu")
        .classList.remove("open");

}


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toast._timer
    );

    toast._timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}

/* =========================================================
   BOOT
   ========================================================= */

const bootSteps = [

    [10,"Cosmic Foundation wird geladen …","Foundation"],
    [22,"HalDo Runtime wird aktiviert …","Runtime"],
    [35,"App Registry wird verbunden …","App Registry"],
    [48,"Window Manager wird aktiviert …","Windows"],
    [60,"Cosmic World wird aufgebaut …","Cosmic"],
    [72,"HalDo AI wird verbunden …","AI"],
    [83,"Sprache und Êzîdî-System werden vorbereitet …","Language"],
    [92,"App Store und Systemdienste werden geladen …","Services"],
    [100,"HalDo AI OS ist bereit.","Ready"]

];


async function startHalDo(){

    const message =
        document.getElementById(
            "boot-message"
        );

    const progress =
        document.getElementById(
            "boot-progress"
        );

    const detail =
        document.getElementById(
            "boot-detail"
        );


    renderApps();


    for(
        const step
        of bootSteps
    ){

        progress.style.width =
            step[0] + "%";

        message.textContent =
            step[1];

        detail.textContent =
            step[2] +
            " · " +
            step[0] +
            "%";


        HalDo.emit(
            "boot:stage",
            {
                progress:step[0],
                stage:step[2]
            }
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    120
                )
        );

    }


    document
        .getElementById(
            "system-status"
        )
        .textContent =
            "HalDo AI OS · Bereit";


    document
        .getElementById(
            "boot"
        )
        .classList.add(
            "done"
        );


    HalDo.emit(
        "system:ready",
        {
            version:
                HalDo.version,
            apps:
                HalDo.registry.list().length
        }
    );


    showToast(
        "HalDo AI OS 20 ist bereit."
    );

}
