<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HalDo AI OS — Cosmic Intelligent OS</title>
    <link rel="manifest" href="data:application/json,{}" />
    <style>
        /* ===== GLOBAL RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --surface: rgba(20, 20, 50, 0.85);
            --text: #e0e0ff;
            --primary: #00d4ff;
            --secondary: #7b2ffc;
            --radius: 16px;
            --shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #root {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        /* ===== BOOT OVERLAY ===== */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            transition: opacity 1.5s ease;
        }
        #boot.hidden { opacity: 0; pointer-events: none; }
        #boot-logo {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { filter: drop-shadow(0 0 20px rgba(0,212,255,0.3)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 60px rgba(123,47,252,0.5)); transform: scale(1.05); }
        }
        #boot-status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #8899bb;
            letter-spacing: 3px;
        }
        .boot-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 30px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== COSMIC WORLD (Canvas) ===== */
        #cosmic {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== HALDO DISPLAY ===== */
        #display {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== TOP BAR ===== */
        #topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: rgba(10,10,30,0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 20;
            font-size: 0.85rem;
        }
        #topbar-left { display: flex; gap: 16px; align-items: center; }
        #topbar-left .haldo-icon { font-weight: 700; color: var(--primary); }
        #topbar-right { display: flex; gap: 12px; align-items: center; }
        .top-btn {
            background: none;
            border: none;
            color: #8899bb;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .top-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

        /* ===== APP CONTAINER (Fenster) ===== */
        #app-container {
            flex: 1;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        /* ===== WINDOW ===== */
        .window {
            position: absolute;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            min-width: 280px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.3s;
            resize: both;
        }
        .window.active {
            box-shadow: 0 8px 60px rgba(0,212,255,0.15);
            border-color: rgba(0,212,255,0.2);
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(0,0,0,0.3);
            cursor: grab;
            flex-shrink: 0;
        }
        .window-header:active { cursor: grabbing; }
        .window-title { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .window-controls { display: flex; gap: 8px; }
        .win-btn {
            background: none;
            border: none;
            color: #8899bb;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .win-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .win-btn.close:hover { background: #ff4444; color: #fff; }
        .window-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .window-body input, .window-body textarea, .window-body select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .window-body button {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .window-body button:hover { transform: scale(1.03); opacity: 0.9; }

        /* ===== DOCK ===== */
        #dock {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(10,10,30,0.7);
            backdrop-filter: blur(16px);
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .dock-item {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            color: #fff;
        }
        .dock-item:hover { background: rgba(255,255,255,0.15); transform: scale(1.08); }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 999;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius);
            padding: 14px 20px;
            max-width: 320px;
            box-shadow: var(--shadow);
            animation: slideIn 0.4s ease;
            border-left: 4px solid var(--primary);
        }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .notification.success { border-left-color: #44ff88; }
        .notification.error { border-left-color: #ff4444; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            #boot-logo { font-size: 3rem; }
            #dock { gap: 6px; padding: 8px 12px; }
            .dock-item { width: 40px; height: 40px; font-size: 1.2rem; }
            .window { min-width: 200px; min-height: 150px; }
            #topbar { font-size: 0.75rem; padding: 4px 12px; }
        }
    </style>
</head>
<body>

<div id="root">
    <!-- BOOT -->
    <div id="boot">
        <div id="boot-logo">⟡ HalDo</div>
        <div class="boot-spinner"></div>
        <div id="boot-status">⟡ Kernel initialisiert ...</div>
    </div>

    <!-- COSMIC WORLD (Canvas) -->
    <canvas id="cosmic"></canvas>

    <!-- DISPLAY -->
    <div id="display">
        <!-- TOPBAR -->
        <div id="topbar">
            <div id="topbar-left">
                <span class="haldo-icon">⟡ HalDo</span>
                <span id="clock-display">--:--</span>
            </div>
            <div id="topbar-right">
                <button class="top-btn" onclick="HalDo.notify('🌌 Cosmic World aktiviert')">🌌</button>
                <button class="top-btn" onclick="HalDo.toggleTheme()">🎨</button>
                <button class="top-btn" onclick="HalDo.showAbout()">ℹ️</button>
            </div>
        </div>

        <!-- APP CONTAINER -->
        <div id="app-container"></div>

        <!-- DOCK -->
        <div id="dock">
            <button class="dock-item" data-app="ai">🤖</button>
            <button class="dock-item" data-app="files">📁</button>
            <button class="dock-item" data-app="settings">⚙️</button>
            <button class="dock-item" data-app="cosmic">🌌</button>
            <button class="dock-item" data-app="notes">📝</button>
            <button class="dock-item" data-app="terminal">⌨️</button>
        </div>
    </div>
</div>

<script>
// ================================================================
//  HALDO AI OS — COMPLETE SYSTEM (ALL IN ONE)
//  Version 20.0.0 — Cosmic Intelligent Operating System
// ================================================================

const HalDo = (() => {
    // ===== PRIVATE STATE =====
    const state = {
        apps: {},
        windows: [],
        windowZIndex: 100,
        activeWindow: null,
        theme: 'cosmic',
        language: 'de',
        notifications: [],
        booted: false,
        aiMemory: [],
        conversations: [],
        settings: {
            theme: 'cosmic',
            language: 'de',
            voiceEnabled: false,
            notifications: true
        }
    };

    // ===== DOM REFS =====
    const $ = id => document.getElementById(id);
    const boot = $('boot');
    const bootStatus = $('boot-status');
    const cosmicCanvas = $('cosmic');
    const appContainer = $('app-container');
    const dock = $('dock');

    // ===== COSMIC WORLD (Canvas Animation) =====
    let stars = [];
    let particles = [];
    let cosmicRunning = false;

    function initCosmic() {
        const ctx = cosmicCanvas.getContext('2d');
        let w, h;

        function resize() {
            w = cosmicCanvas.width = window.innerWidth;
            h = cosmicCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Stars
        stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.3 + 0.1,
                brightness: Math.random() * 0.8 + 0.2
            });
        }

        // Particles (Nebula)
        particles = [];
        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                r: Math.random() * 40 + 20,
                alpha: Math.random() * 0.03 + 0.01,
                hue: Math.random() * 60 + 220
            });
        }

        cosmicRunning = true;
        animateCosmic(ctx, w, h);
    }

    function animateCosmic(ctx, w, h) {
        if (!cosmicRunning) return;
        ctx.clearRect(0, 0, w, h);

        // Nebula particles
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = w;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;
            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
            grad.addColorStop(0, `hsla(${p.hue}, 80%, 60%, ${p.alpha})`);
            grad.addColorStop(1, `hsla(${p.hue}, 80%, 40%, 0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        });

        // Stars
        stars.forEach(s => {
            s.y += s.speed;
            if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
            ctx.fillStyle = `rgba(255,255,255,${s.brightness * (0.7 + 0.3 * Math.sin(Date.now() / 2000 + s.x))})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
        });

        // Subtle glow effect
        const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
        grad.addColorStop(0, 'rgba(0,212,255,0.02)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        requestAnimationFrame(() => animateCosmic(ctx, w, h));
    }

    // ===== BOOT SEQUENCE =====
    function bootSequence() {
        const statuses = [
            '⟡ Kernel lädt ...',
            '⟡ System initialisiert ...',
            '⟡ Event Bus aktiviert ...',
            '⟡ App Registry wird aufgebaut ...',
            '⟡ Cosmic World startet ...',
            '⟡ Living AI wird geweckt ...',
            '⟡ HalDo AI OS ist READY 🚀'
        ];

        let i = 0;
        const interval = setInterval(() => {
            if (i < statuses.length) {
                bootStatus.textContent = statuses[i];
                i++;
            } else {
                clearInterval(interval);
                boot.classList.add('hidden');
                state.booted = true;
                HalDo.notify('🚀 HalDo AI OS erfolgreich gestartet!');
                // Starte Standard-Apps
                setTimeout(() => launchApp('ai'), 400);
                setTimeout(() => launchApp('cosmic'), 600);
            }
        }, 600);
    }

    // ===== APP SYSTEM =====
    function registerApp(id, config) {
        state.apps[id] = { ...config, id, instance: null };
    }

    function launchApp(id) {
        const app = state.apps[id];
        if (!app) {
            HalDo.notify(`❌ App "${id}" nicht gefunden`, 'error');
            return;
        }

        // Prüfe ob bereits offen
        const existing = state.windows.find(w => w.appId === id);
        if (existing) {
            focusWindow(existing.id);
            return;
        }

        const winId = 'win-' + Date.now();
        const win = {
            id: winId,
            appId: id,
            title: app.title || id,
            icon: app.icon || '📦',
            x: 80 + Math.random() * 120,
            y: 60 + Math.random() * 80,
            width: Math.min(540, window.innerWidth - 100),
            height: Math.min(400, window.innerHeight - 180),
            zIndex: state.windowZIndex++,
            element: null
        };

        state.windows.push(win);
        renderWindow(win);
        focusWindow(winId);

        // App-Content laden
        if (app.render) {
            const body = win.element.querySelector('.window-body');
            app.render(body, win);
        }

        HalDo.notify(`🔄 ${app.title || id} geöffnet`);
    }

    function renderWindow(win) {
        // Entferne alte Elemente
        const existing = document.getElementById(win.id);
        if (existing) existing.remove();

        const el = document.createElement('div');
        el.id = win.id;
        el.className = 'window';
        el.style.left = win.x + 'px';
        el.style.top = win.y + 'px';
        el.style.width = win.width + 'px';
        el.style.height = win.height + 'px';
        el.style.zIndex = win.zIndex;
        el.dataset.appId = win.appId;

        el.innerHTML = `
            <div class="window-header">
                <span class="window-title">${win.icon} ${win.title}</span>
                <div class="window-controls">
                    <button class="win-btn" data-action="minimize">─</button>
                    <button class="win-btn" data-action="maximize">⧉</button>
                    <button class="win-btn close" data-action="close">✕</button>
                </div>
            </div>
            <div class="window-body"></div>
        `;

        appContainer.appendChild(el);
        win.element = el;

        // Event-Listener für Fenster-Steuerung
        el.querySelectorAll('.win-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const action = btn.dataset.action;
                if (action === 'close') closeWindow(win.id);
                else if (action === 'minimize') minimizeWindow(win.id);
                else if (action === 'maximize') maximizeWindow(win.id);
            });
        });

        // Drag & Drop
        const header = el.querySelector('.window-header');
        let drag = false, startX, startY, origX, origY;
        header.addEventListener('mousedown', (e) => {
            if (e.target.closest('.win-btn')) return;
            drag = true;
            startX = e.clientX;
            startY = e.clientY;
            origX = win.x;
            origY = win.y;
            focusWindow(win.id);
            el.style.cursor = 'grabbing';
        });
        document.addEventListener('mousemove', (e) => {
            if (!drag) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            win.x = Math.max(0, Math.min(window.innerWidth - win.width, origX + dx));
            win.y = Math.max(0, Math.min(window.innerHeight - win.height - 60, origY + dy));
            el.style.left = win.x + 'px';
            el.style.top = win.y + 'px';
        });
        document.addEventListener('mouseup', () => {
            if (drag) { drag = false; el.style.cursor = ''; }
        });

        // Resize (einfach)
        const resizeHandle = document.createElement('div');
        resizeHandle.style.cssText = 'position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:se-resize;';
        el.appendChild(resizeHandle);
        let resize = false;
        resizeHandle.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            resize = true;
            const startW = win.width, startH = win.height, startX2 = e.clientX, startY2 = e.clientY;
            const onMove = (ev) => {
                if (!resize) return;
                const dw = ev.clientX - startX2, dh = ev.clientY - startY2;
                win.width = Math.max(280, startW + dw);
                win.height = Math.max(200, startH + dh);
                el.style.width = win.width + 'px';
                el.style.height = win.height + 'px';
            };
            const onUp = () => { resize = false; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });
    }

    function closeWindow(winId) {
        const idx = state.windows.findIndex(w => w.id === winId);
        if (idx === -1) return;
        const win = state.windows[idx];
        if (win.element) win.element.remove();
        state.windows.splice(idx, 1);
        if (state.activeWindow === winId) state.activeWindow = null;
        // Fokussiere letztes Fenster
        if (state.windows.length > 0) {
            focusWindow(state.windows[state.windows.length-1].id);
        }
    }

    function focusWindow(winId) {
        const win = state.windows.find(w => w.id === winId);
        if (!win) return;
        state.activeWindow = winId;
        win.zIndex = state.windowZIndex++;
        if (win.element) {
            win.element.style.zIndex = win.zIndex;
            win.element.classList.add('active');
            state.windows.forEach(w => {
                if (w.id !== winId && w.element) w.element.classList.remove('active');
            });
        }
    }

    function minimizeWindow(winId) {
        const win = state.windows.find(w => w.id === winId);
        if (win && win.element) {
            win.element.style.display = 'none';
            // Später: Miniaturansicht in Dock
        }
    }

    function maximizeWindow(winId) {
        const win = state.windows.find(w => w.id === winId);
        if (!win || !win.element) return;
        if (win.width === window.innerWidth - 20) {
            // Wiederherstellen
            win.width = win._prevWidth || 540;
            win.height = win._prevHeight || 400;
            win.x = win._prevX || 80;
            win.y = win._prevY || 60;
        } else {
            win._prevWidth = win.width;
            win._prevHeight = win.height;
            win._prevX = win.x;
            win._prevY = win.y;
            win.width = window.innerWidth - 20;
            win.height = window.innerHeight - 120;
            win.x = 10;
            win.y = 50;
        }
        win.element.style.width = win.width + 'px';
        win.element.style.height = win.height + 'px';
        win.element.style.left = win.x + 'px';
        win.element.style.top = win.y + 'px';
    }

    // ===== APP DEFINITIONS =====
    function defineApps() {
        // 1. AI Assistant
        registerApp('ai', {
            title: 'HalDo AI',
            icon: '🤖',
            render: (body) => {
                body.innerHTML = `
                    <div style="display:flex;flex-direction:column;height:100%;gap:10px;">
                        <div style="flex:1;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:10px;padding:12px;min-height:80px;" id="ai-chat">
                            <div style="color:#8899bb;text-align:center;">💬 HalDo AI — bereit für deine Fragen</div>
                        </div>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="ai-input" placeholder="Frage an HalDo ..." style="flex:1;" />
                            <button id="ai-send">Senden</button>
                            <button id="ai-voice" style="background:#4444ff;">🎤</button>
                        </div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            <button class="ai-quick" data-cmd="Öffne Einstellungen">⚙️ Einstellungen</button>
                            <button class="ai-quick" data-cmd="Zeige meine Dateien">📁 Dateien</button>
                            <button class="ai-quick" data-cmd="Wechsle zu Cosmic">🌌 Cosmic</button>
                            <button class="ai-quick" data-cmd="Hilfe">❓ Hilfe</button>
                        </div>
                    </div>
                `;
                const chat = body.querySelector('#ai-chat');
                const input = body.querySelector('#ai-input');
                const sendBtn = body.querySelector('#ai-send');

                function addMessage(role, text) {
                    const div = document.createElement('div');
                    div.style.cssText = `padding:6px 10px;margin:4px 0;border-radius:8px;max-width:85%;${role === 'user' ? 'background:rgba(0,212,255,0.15);align-self:flex-end;' : 'background:rgba(123,47,252,0.15);'}`;
                    div.textContent = (role === 'user' ? '👤 ' : '🤖 ') + text;
                    chat.appendChild(div);
                    chat.scrollTop = chat.scrollHeight;
                }

                function processCommand(cmd) {
                    addMessage('user', cmd);
                    const lower = cmd.toLowerCase();
                    let response = '';
                    if (lower.includes('einstellung') || lower.includes('settings')) {
                        response = '⚙️ Öffne Einstellungen ...';
                        setTimeout(() => launchApp('settings'), 300);
                    } else if (lower.includes('datei') || lower.includes('files')) {
                        response = '📁 Öffne Datei-Manager ...';
                        setTimeout(() => launchApp('files'), 300);
                    } else if (lower.includes('cosmic') || lower.includes('weltraum')) {
                        response = '🌌 Aktiviere Cosmic World ...';
                        setTimeout(() => launchApp('cosmic'), 300);
                    } else if (lower.includes('hilfe') || lower.includes('help')) {
                        response = '❓ Ich kann: Apps öffnen, Dateien verwalten, Theme wechseln, Fragen beantworten. Was möchtest du?';
                    } else if (lower.includes('hallo') || lower.includes('hi')) {
                        response = '👋 Hallo! Ich bin HalDo, dein intelligentes OS. Wie kann ich dir helfen?';
                    } else if (lower.includes('wetter')) {
                        response = '🌤️ Aktuell: 22°C, sonnig. (Demo-Daten)';
                    } else if (lower.includes('danke')) {
                        response = '❤️ Gern geschehen! Immer für dich da.';
                    } else if (lower.includes('theme') || lower.includes('design')) {
                        response = '🎨 Theme wird gewechselt ...';
                        setTimeout(() => toggleTheme(), 200);
                    } else {
                        response = `💡 Ich habe verstanden: "${cmd}". Leider habe ich dafür noch keine spezifische Aktion. Versuche: "Öffne Einstellungen", "Zeige meine Dateien" oder "Hilfe".`;
                    }
                    setTimeout(() => addMessage('assistant', response), 400);
                    // Memory speichern
                    state.aiMemory.push({ role: 'user', content: cmd });
                    state.aiMemory.push({ role: 'assistant', content: response });
                }

                sendBtn.addEventListener('click', () => {
                    const val = input.value.trim();
                    if (!val) return;
                    processCommand(val);
                    input.value = '';
                });
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });

                body.querySelectorAll('.ai-quick').forEach(btn => {
                    btn.addEventListener('click', () => {
                        processCommand(btn.dataset.cmd);
                    });
                });

                // Voice (Demo)
                body.querySelector('#ai-voice').addEventListener('click', () => {
                    if ('webkitSpeechRecognition' in window) {
                        const rec = new webkitSpeechRecognition();
                        rec.lang = 'de-DE';
                        rec.onresult = (e) => {
                            const text = e.results[0][0].transcript;
                            input.value = text;
                            sendBtn.click();
                        };
                        rec.start();
                        HalDo.notify('🎤 Höre zu ...');
                    } else {
                        HalDo.notify('❌ Speech Recognition nicht unterstützt', 'error');
                    }
                });
            }
        });

        // 2. File Manager
        registerApp('files', {
            title: 'Datei-Manager',
            icon: '📁',
            render: (body) => {
                const files = [
                    { name: 'Dokumente', type: 'folder', size: '-' },
                    { name: 'Bilder', type: 'folder', size: '-' },
                    { name: 'Musik', type: 'folder', size: '-' },
                    { name: 'Projekt_HalDo.pdf', type: 'pdf', size: '2.4 MB' },
                    { name: 'Systembericht.txt', type: 'txt', size: '128 KB' },
                    { name: 'Cosmic_Wallpaper.jpg', type: 'jpg', size: '4.1 MB' },
                ];
                body.innerHTML = `
                    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
                        <input type="text" placeholder="🔍 Suche ..." style="flex:1;min-width:120px;" id="file-search" />
                        <button id="file-new">➕ Neu</button>
                        <button id="file-upload">📤 Upload</button>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;" id="file-grid">
                        ${files.map(f => `
                            <div style="background:rgba(255,255,255,0.05);padding:12px;border-radius:10px;text-align:center;cursor:pointer;transition:0.2s;" 
                                 onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
                                <div style="font-size:2rem;">${f.type === 'folder' ? '📁' : '📄'}</div>
                                <div style="font-size:0.8rem;font-weight:500;margin-top:4px;">${f.name}</div>
                                <div style="font-size:0.7rem;color:#8899bb;">${f.size}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="margin-top:12px;font-size:0.8rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.05);padding-top:10px;">
                        📊 6 Elemente — Speicher: 12.4 GB frei von 32 GB                    </div>
                `;
                body.querySelector('#file-search').addEventListener('input', (e) => {
                    const q = e.target.value.toLowerCase();
                    const items = body.querySelectorAll('#file-grid > div');
                    items.forEach(el => {
                        const name = el.querySelector('div:nth-child(2)').textContent.toLowerCase();
                        el.style.display = name.includes(q) ? '' : 'none';
                    });
                });
                body.querySelector('#file-new').addEventListener('click', () => {
                    const name = prompt('📁 Neuer Ordnername:');
                    if (name) HalDo.notify(`📁 Ordner "${name}" erstellt`);
                });
                body.querySelector('#file-upload').addEventListener('click', () => {
                    HalDo.notify('📤 Upload-Dialog geöffnet (Demo)');
                });
            }
        });

        // 3. Settings
        registerApp('settings', {
            title: 'Einstellungen',
            icon: '⚙️',
            render: (body) => {
                body.innerHTML = `
                    <h3 style="margin-bottom:12px;">⚙️ System-Einstellungen</h3>
                    <div style="display:flex;flex-direction:column;gap:12px;">
                        <div><label>Theme</label>
                            <select id="settings-theme">
                                <option value="cosmic" ${state.settings.theme === 'cosmic' ? 'selected' : ''}>🌌 Cosmic</option>
                                <option value="dark" ${state.settings.theme === 'dark' ? 'selected' : ''}>🌙 Dark</option>
                                <option value="light" ${state.settings.theme === 'light' ? 'selected' : ''}>☀️ Light</option>
                            </select>
                        </div>
                        <div><label>Sprache</label>
                            <select id="settings-language">
                                <option value="de" ${state.settings.language === 'de' ? 'selected' : ''}>🇩🇪 Deutsch</option>
                                <option value="en" ${state.settings.language === 'en' ? 'selected' : ''}>🇬🇧 English</option>
                                <option value="ezidi" ${state.settings.language === 'ezidi' ? 'selected' : ''}>𒀭 Êzîdî</option>
                            </select>
                        </div>
                        <div><label><input type="checkbox" id="settings-voice" ${state.settings.voiceEnabled ? 'checked' : ''} /> Sprachsteuerung aktivieren</label></div>
                        <div><label><input type="checkbox" id="settings-notifications" ${state.settings.notifications ? 'checked' : ''} /> Benachrichtigungen</label></div>
                        <button id="settings-save" style="margin-top:10px;">💾 Einstellungen speichern</button>
                        <div style="font-size:0.8rem;color:#8899bb;margin-top:10px;border-top:1px solid rgba(255,255,255,0.05);padding-top:10px;">
                            HalDo AI OS v20.0.0 — Kernel 5.2.1
                        </div>
                    </div>
                `;
                body.querySelector('#settings-save').addEventListener('click', () => {
                    state.settings.theme = body.querySelector('#settings-theme').value;
                    state.settings.language = body.querySelector('#settings-language').value;
                    state.settings.voiceEnabled = body.querySelector('#settings-voice').checked;
                    state.settings.notifications = body.querySelector('#settings-notifications').checked;
                    applyTheme(state.settings.theme);
                    HalDo.notify('✅ Einstellungen gespeichert!');
                });
            }
        });

        // 4. Cosmic World
        registerApp('cosmic', {
            title: 'Cosmic World',
            icon: '🌌',
            render: (body) => {
                body.innerHTML = `
                    <div style="text-align:center;padding:20px;">
                        <div style="font-size:3rem;margin-bottom:10px;">🌌</div>
                        <h3 style="margin-bottom:8px;">Cosmic World aktiv</h3>
                        <p style="color:#8899bb;font-size:0.9rem;">Sterne, Nebel und Partikel tanzen für dich.</p>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;">
                            <button id="cosmic-stars">⭐ Sterne intensiv</button>
                            <button id="cosmic-nebula">🌫️ Nebel-Modus</button>
                            <button id="cosmic-rainbow">🌈 Regenbogen</button>
                            <button id="cosmic-reset">🔄 Zurücksetzen</button>
                        </div>
                        <div style="margin-top:16px;font-size:0.8rem;color:#8899bb;">
                            🌠 ${stars.length} Sterne · ${particles.length} Nebel-Partikel
                        </div>
                    </div>
                `;
                body.querySelector('#cosmic-stars').addEventListener('click', () => {
                    stars.forEach(s => s.brightness = 1.0);
                    HalDo.notify('⭐ Sterne leuchten heller');
                });
                body.querySelector('#cosmic-nebula').addEventListener('click', () => {
                    particles.forEach(p => p.alpha = 0.08);
                    HalDo.notify('🌫️ Nebel intensiviert');
                });
                body.querySelector('#cosmic-rainbow').addEventListener('click', () => {
                    particles.forEach((p, i) => p.hue = (i * 7) % 360);
                    HalDo.notify('🌈 Regenbogen-Modus aktiviert');
                });
                body.querySelector('#cosmic-reset').addEventListener('click', () => {
                    location.reload();
                });
            }
        });

        // 5. Notes
        registerApp('notes', {
            title: 'Notizen',
            icon: '📝',
            render: (body) => {
                let notes = JSON.parse(localStorage.getItem('haldo_notes') || '[]');
                body.innerHTML = `
                    <div style="display:flex;gap:8px;margin-bottom:12px;">
                        <input type="text" id="note-input" placeholder="📝 Neue Notiz ..." style="flex:1;" />
                        <button id="note-add">➕ Hinzufügen</button>
                    </div>
                    <div id="note-list" style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;">
                        ${notes.map((n, i) => `
                            <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);padding:8px 12px;border-radius:8px;">
                                <span>${n}</span>
                                <button class="note-del" data-idx="${i}" style="background:none;border:none;color:#ff6666;cursor:pointer;">✕</button>
                            </div>
                        `).join('')}
                    </div>
                `;
                const input = body.querySelector('#note-input');
                body.querySelector('#note-add').addEventListener('click', () => {
                    const val = input.value.trim();
                    if (!val) return;
                    notes.push(val);
                    localStorage.setItem('haldo_notes', JSON.stringify(notes));
                    input.value = '';
                    renderNoteList();
                });
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') body.querySelector('#note-add').click(); });

                function renderNoteList() {
                    const list = body.querySelector('#note-list');
                    list.innerHTML = notes.map((n, i) => `
                        <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);padding:8px 12px;border-radius:8px;">
                            <span>${n}</span>
                            <button class="note-del" data-idx="${i}" style="background:none;border:none;color:#ff6666;cursor:pointer;">✕</button>
                        </div>
                    `).join('');
                    list.querySelectorAll('.note-del').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.dataset.idx);
                            notes.splice(idx, 1);
                            localStorage.setItem('haldo_notes', JSON.stringify(notes));
                            renderNoteList();
                            HalDo.notify('🗑️ Notiz gelöscht');
                        });
                    });
                }
            }
        });

        // 6. Terminal (System Info)
        registerApp('terminal', {
            title: 'Terminal',
            icon: '⌨️',
            render: (body) => {
                body.innerHTML = `
                    <div style="background:#050510;border-radius:8px;padding:12px;font-family:'Courier New',monospace;font-size:0.8rem;min-height:120px;max-height:250px;overflow-y:auto;" id="terminal-output">
                        <div style="color:#44ff88;">$ HalDo AI OS v20.0.0</div>
                        <div style="color:#8899bb;">$ Kernel 5.2.1 | System: ${navigator.platform}</div>
                        <div style="color:#8899bb;">$ Speicher: ${Math.round(navigator.deviceMemory || 8)} GB RAM</div>
                        <div style="color:#44ff88;">$ ready ></div>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <input type="text" id="terminal-input" placeholder="$ Befehl eingeben ..." style="flex:1;font-family:'Courier New',monospace;" />
                        <button id="terminal-exec">⏎</button>
                    </div>
                `;
                const output = body.querySelector('#terminal-output');
                const input = body.querySelector('#terminal-input');

                function exec(cmd) {
                    const line = document.createElement('div');
                    line.style.color = '#44ff88';
                    line.textContent = `$ ${cmd}`;
                    output.appendChild(line);
                    let response = '';
                    if (cmd === 'help' || cmd === '?') {
                        response = 'Verfügbare Befehle: help, version, apps, theme, clear, echo <text>, date';
                    } else if (cmd === 'version' || cmd === 'ver') {
                        response = 'HalDo AI OS 20.0.0 (Cosmic) | Kernel 5.2.1';
                    } else if (cmd === 'apps') {
                        response = 'Installierte Apps: ' + Object.keys(state.apps).join(', ');
                    } else if (cmd === 'theme') {
                        response = `Aktuelles Theme: ${state.settings.theme}`;
                    } else if (cmd === 'clear' || cmd === 'cls') {
                        output.innerHTML = '';
                        return;
                    } else if (cmd.startsWith('echo ')) {
                        response = cmd.substring(5);
                    } else if (cmd === 'date') {
                        response = new Date().toLocaleString();
                    } else if (cmd === 'whoami') {
                        response = 'haldo@cosmic';
                    } else if (cmd === '') {
                        return;
                    } else {
                        response = `❌ Befehl nicht gefunden: "${cmd}". Tippe "help" für Hilfe.`;
                    }
                    const respLine = document.createElement('div');
                    respLine.style.color = '#8899bb';
                    respLine.textContent = response;
                    output.appendChild(respLine);
                    output.scrollTop = output.scrollHeight;
                }

                body.querySelector('#terminal-exec').addEventListener('click', () => {
                    const val = input.value.trim();
                    if (val) exec(val);
                    input.value = '';
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') body.querySelector('#terminal-exec').click();
                });
            }
        });
    }

    // ===== THEME SYSTEM =====
    function applyTheme(theme) {
        const root = document.documentElement;
        if (theme === 'cosmic') {
            root.style.setProperty('--bg', '#0a0a1a');
            root.style.setProperty('--text', '#e0e0ff');
            root.style.setProperty('--surface', 'rgba(20,20,50,0.85)');
        } else if (theme === 'dark') {
            root.style.setProperty('--bg', '#0a0a0a');
            root.style.setProperty('--text', '#ffffff');
            root.style.setProperty('--surface', 'rgba(30,30,40,0.9)');
        } else if (theme === 'light') {
            root.style.setProperty('--bg', '#f0f0ff');
            root.style.setProperty('--text', '#1a1a2e');
            root.style.setProperty('--surface', 'rgba(255,255,255,0.85)');
        }
        state.settings.theme = theme;
        localStorage.setItem('haldo_theme', theme);
    }

    function toggleTheme() {
        const themes = ['cosmic', 'dark', 'light'];
        const current = state.settings.theme;
        const next = themes[(themes.indexOf(current) + 1) % themes.length];
        applyTheme(next);
        HalDo.notify(`🎨 Theme gewechselt zu ${next}`);
    }

    // ===== NOTIFICATION SYSTEM =====
    function notify(message, type = 'info') {
        const el = document.createElement('div');
        el.className = `notification ${type}`;
        el.textContent = message;
        document.body.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(120%)'; setTimeout(() => el.remove(), 500); }, 3000);
    }

    // ===== ABOUT =====
    function showAbout() {
        notify('⟡ HalDo AI OS v20.0.0 — Cosmic Intelligent Operating System\n💙 Entwickelt mit ❤️ für dich.');
    }

    // ===== CLOCK =====
    function updateClock() {
        const el = document.getElementById('clock-display');
        if (el) el.textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }

    // ===== INIT =====
    function init() {
        // Theme laden
        const savedTheme = localStorage.getItem('haldo_theme') || 'cosmic';
        applyTheme(savedTheme);

        // Apps definieren
        defineApps();

        // Cosmic starten
        initCosmic();

        // Uhr
        updateClock();
        setInterval(updateClock, 10000);

        // Dock-Events
        dock.querySelectorAll('.dock-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const appId = btn.dataset.app;
                launchApp(appId);
            });
        });

        // Boot starten
        bootSequence();

        // Globale Befehle (für AI)
        window.HalDo = {
            notify,
            toggleTheme,
            showAbout,
            launchApp,
            state,
            get apps() { return state.apps; }
        };

        // Console-Welcome
        console.log('⟡ HalDo AI OS v20.0.0');
        console.log('🌌 Cosmic Intelligent Operating System');
        console.log('💡 Tipp: HalDo.notify("Hallo") oder HalDo.launchApp("ai")');
    }

    // ===== START =====
    document.addEventListener('DOMContentLoaded', init);
    return { notify, toggleTheme, showAbout, launchApp, state };
})();
</script>
</body>
</html>
