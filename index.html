<!-- ==================================================
     HALDO GLOBAL UI
     ================================================== -->

<script>

(function () {

    "use strict";


    /* ==============================================
       HAUPTMENÜ ÖFFNEN
       ============================================== */

    window.openMainMenu = function () {


        const startup =
            document.getElementById(
                "startup-screen"
            );


        const welcome =
            document.getElementById(
                "welcome-screen"
            );


        const mainMenu =
            document.getElementById(
                "main-menu"
            );


        if (startup) {

            startup.classList.add(
                "hidden"
            );

            startup.style.display =
                "none";

        }


        if (welcome) {

            welcome.classList.add(
                "hidden"
            );

            welcome.style.display =
                "none";

        }


        if (mainMenu) {

            mainMenu.classList.remove(
                "hidden"
            );

            mainMenu.style.display =
                "block";

        }


        if (
            window.HalDoLight &&
            typeof window.HalDoLight.idle ===
            "function"
        ) {

            window.HalDoLight.idle();

        }

    };



    /* ==============================================
       SEITE ÖFFNEN
       ============================================== */

    window.openPage = function (
        page
    ) {


        if (!page) {

            return;

        }


        window.location.href =
            page;

    };



    /* ==============================================
       SYSTEMUHR
       ============================================== */

    function updateClock() {


        const clock =
            document.getElementById(
                "clock"
            );


        if (!clock) {

            return;

        }


        clock.textContent =
            "Systemzeit: " +
            new Date().toLocaleTimeString(
                "de-DE"
            );

    }


    updateClock();


    window.setInterval(
        updateClock,
        1000
    );



    /* ==============================================
       SYSTEM STATUS
       ============================================== */

    window.setHalDoStatus =
        function (
            message
        ) {


            const status =
                document.getElementById(
                    "system-status"
                );


            if (
                status &&
                message
            ) {

                status.textContent =
                    message;

            }

        };



    /* ==============================================
       HALDO LIGHT SHORTCUTS
       ============================================== */

    window.HalDoUI = {


        idle:
            function () {

                if (
                    window.HalDoLight
                ) {

                    HalDoLight.idle();

                }

            },


        listening:
            function () {

                if (
                    window.HalDoLight
                ) {

                    HalDoLight.listening();

                }

            },


        thinking:
            function () {

                if (
                    window.HalDoLight
                ) {

                    HalDoLight.thinking();

                }

            },


        answering:
            function () {

                if (
                    window.HalDoLight
                ) {

                    HalDoLight.answering();

                }

            },


        speaking:
            function () {

                if (
                    window.HalDoLight
                ) {

                    HalDoLight.speaking();

                }

            }

    };


})();

</script>
