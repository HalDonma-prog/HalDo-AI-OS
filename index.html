        </div>

            class="haldo-spark spark-4"

<!-- =====================================================
     HALDO GLOBAL UI
     ===================================================== -->

<script>

(function () {

    "use strict";


    /* ==============================================
       HAUPTMENÜ ÖFFNEN
       ============================================== */

    window.openMainMenu = function () {

        const startup =
            document.getElementById(
                "startup-screen"
            );

        const welcome =
            document.getElementById(
                "welcome-screen"
            );

        const mainMenu =
            document.getElementById(
                "main-menu"
            );


        if (startup) {

            startup.classList.add(
                "hidden"
            );

            startup.style.display =
                "none";

        }


        if (welcome) {

            welcome.classList.add(
                "hidden"
            );

            welcome.style.display =
                "none";

        }


        if (mainMenu) {

            mainMenu.classList.remove(
                "hidden"
            );

            mainMenu.style.display =
                "block";

        }


        /* Lichtsystem wieder in
           normalen Bereitschaftszustand */

        if (
            window.HalDoLight &&
            typeof HalDoLight.idle ===
                "function"
        ) {

            HalDoLight.idle();

        }

    };



    /* ==============================================
       SEITE ÖFFNEN
       ============================================== */

    window.openPage = function (page) {

        if (!page) {

            return;

        }


        window.location.href =
            page;

    };



    /* ==============================================
       UHR
       ============================================== */

    function updateClock() {

        const clock =
            document.getElementById(
                "clock"
            );


        if (!clock) {

            return;

        }


        clock.textContent =
            "Systemzeit: " +
            new Date()
                .toLocaleTimeString(
                    "de-DE"
                );

    }


    updateClock();


    window.setInterval(
        updateClock,
        1000
    );


})();

</script>



<!-- =====================================================
     LOGO / LIGHT SYSTEM TEST
     ===================================================== -->

<script>

(function () {

    "use strict";


    function testHalDoLight() {

        if (
            !window.HalDoLight
        ) {

            return;

        }


        /*
         * Normaler Zustand:
         * Licht läuft dauerhaft weiter.
         */

        HalDoLight.idle();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            testHalDoLight,
            {
                once: true
            }
        );

    } else {

        testHalDoLight();

    }

})();

</script>


</body>

</html>
