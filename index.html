    /* =========================================================
       COSMIC INITIALIZE
       ========================================================= */

    HD.cosmic.init =
        function () {

            if (
                this.initialized
            ) {

                return true;

            }


            this.injectStyles();

            this.createStars();

            this.createPlanets();


            this.running =
                true;

            this.initialized =
                true;


            HD.emit(
                "cosmic:ready",
                {
                    stars:
                        this.stars.length,

                    planets:
                        this.planets.length
                }
            );


            return true;

        };


    /* =========================================================
       BOOT MANAGER
       ========================================================= */

    HD.boot =
        HD.boot ||
        {};


    HD.boot.steps =
        [];


    HD.boot.running =
        false;


    HD.boot.complete =
        false;


    HD.boot.addStep =
        function (
            name,
            handler
        ) {

            if (
                typeof handler !==
                "function"
            ) {

                return false;

            }


            this.steps.push(
                {
                    name,
                    handler
                }
            );


            return true;

        };


    HD.boot.run =
        async function () {

            if (
                this.complete
            ) {

                return true;

            }


            if (
                this.running
            ) {

                return false;

            }


            this.running =
                true;


            HD.system.setStatus(
                "booting"
            );


            for (
                const step
                of this.steps
            ) {

                try {

                    HD.emit(
                        "boot:step",
                        {
                            name:
                                step.name
                        }
                    );


                    await step.handler();

                }
                catch(error) {

                    HD.errors?.report(
                        error,
                        "boot:" +
                        step.name
                    );

                    HD.emit(
                        "boot:error",
                        {
                            name:
                                step.name,

                            error
                        }
                    );

                }

            }


            this.running =
                false;

            this.complete =
                true;

            HD.started =
                true;

            HD.booted =
                true;

            HD.ready =
                true;

            HD.initialized =
                true;


            HD.system.started =
                true;

            HD.system.ready =
                true;


            HD.system.setStatus(
                "online"
            );


            HD.emit(
                "system:ready",
                {
                    version:
                        HD.version
                }
            );


            return true;

        };


    /* =========================================================
       BOOT STEPS
       ========================================================= */

    HD.boot.addStep(
        "cosmic-world",
        async function () {

            HD.cosmic.init();

        }
    );


    HD.boot.addStep(
        "app-state",
        async function () {

            if (
                HD.appState &&
                typeof HD.appState.loadAll ===
                "function"
            ) {

                HD.appState.loadAll();

            }

        }
    );


    HD.boot.addStep(
        "pwa",
        async function () {

            if (
                HD.pwa &&
                typeof HD.pwa.register ===
                "function"
            ) {

                await HD.pwa.register();

            }

        }
    );


    HD.boot.addStep(
        "system-events",
        async function () {

            HD.emit(
                "system:boot-complete"
            );

        }
    );


    /* =========================================================
       MAIN MENU
       ========================================================= */

    const menuButton =
        document.getElementById(
            "haldo-main-menu-button"
        );


    if (menuButton) {

        menuButton.addEventListener(
            "click",
            function () {

                HD.emit(
                    "menu:toggle"
                );


                if (
                    HD.menu &&
                    typeof HD.menu.toggle ===
                    "function"
                ) {

                    HD.menu.toggle();

                }

            }
        );

    }


    /* =========================================================
       SUN → HALDO AI
       ========================================================= */

    const sun =
        document.getElementById(
            "haldo-sun"
        );


    if (sun) {

        sun.addEventListener(
            "click",
            function () {

                if (
                    typeof HD.openApp ===
                    "function"
                ) {

                    const aiApps =
                        [
                            "ai-chat",
                            "haldo-ai",
                            "ai"
                        ];


                    for (
                        const appId
                        of aiApps
                    ) {

                        if (
                            HD.appRegistry &&
                            HD.appRegistry.get &&
                            HD.appRegistry.get(
                                appId
                            )
                        ) {

                            HD.openApp(
                                appId
                            );

                            return;

                        }

                    }

                }


                HD.emit(
                    "ai:open"
                );

            }
        );

    }


    /* =========================================================
       KEYBOARD SHORTCUTS
       ========================================================= */

    document.addEventListener(
        "keydown",
        function (
            event
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                HD.emit(
                    "system:escape"
                );

            }


            if (
                (
                    event.ctrlKey ||
                    event.metaKey
                ) &&
                event.key.toLowerCase() ===
                "k"
            ) {

                event.preventDefault();

                HD.emit(
                    "menu:toggle"
                );

            }

        }
    );


    /* =========================================================
       GLOBAL UNHANDLED ERRORS
       ========================================================= */

    window.addEventListener(
        "error",
        function (
            event
        ) {

            if (
                HD.errors &&
                typeof HD.errors.report ===
                "function"
            ) {

                HD.errors.report(
                    event.error ||
                    event.message,
                    "window"
                );

            }

        }
    );


    window.addEventListener(
        "unhandledrejection",
        function (
            event
        ) {

            if (
                HD.errors &&
                typeof HD.errors.report ===
                "function"
            ) {

                HD.errors.report(
                    event.reason,
                    "promise"
                );

            }

        }
    );


    /* =========================================================
       FINAL START
       ========================================================= */

    const start =
        function () {

            if (
                HD.boot.complete
            ) {

                return;

            }


            HD.boot.run()
                .catch(
                    error => {

                        HD.errors?.report(
                            error,
                            "boot"
                        );

                    }
                );

        };


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            start,
            {
                once:
                    true
            }
        );

    }
    else {

        start();

    }


    /* =========================================================
       FINAL FOUNDATION MARKER
       ========================================================= */

    HD.emit(
        "index:final-part-loaded",
        {
            part:
                "16/16",

            version:
                HD.version,

            codename:
                HD.codename
        }
    );


})();
</script>
