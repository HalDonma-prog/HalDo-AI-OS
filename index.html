<script>
"use strict";

/* ============================================================
   APP REGISTRY
   ============================================================ */

HD.apps =
    HD.apps || {};

HD.appRegistry =
    HD.appRegistry || {};


/* ------------------------------------------------------------
   INTERNAL REGISTRY
   ------------------------------------------------------------ */

HD.appRegistry.items =
    HD.appRegistry.items ||
    new Map();

HD.appRegistry.categories =
    HD.appRegistry.categories ||
    new Map();


/* ------------------------------------------------------------
   NORMALIZE APP
   ------------------------------------------------------------ */

HD.appRegistry.normalize =
    function(
        definition
    ) {

        if (
            !definition ||
            typeof definition !==
            "object"
        ) {

            return null;

        }


        const id =
            String(
                definition.id ||
                ""
            )
            .trim();


        if (
            !HD.security.validateAppId(
                id
            )
        ) {

            return null;

        }


        return {

            id,

            name:
                String(
                    definition.name ||
                    id
                ),

            description:
                String(
                    definition.description ||
                    ""
                ),

            category:
                String(
                    definition.category ||
                    "System"
                ),

            icon:
                String(
                    definition.icon ||
                    "◈"
                ),

            color:
                definition.color ||
                "",

            version:
                String(
                    definition.version ||
                    "1.0.0"
                ),

            system:
                Boolean(
                    definition.system
                ),

            enabled:
                definition.enabled !==
                false,

            resizable:
                definition.resizable !==
                false,

            minimizable:
                definition.minimizable !==
                false,

            closable:
                definition.closable !==
                false,

            singleton:
                definition.singleton !==
                false,

            width:
                Number(
                    definition.width ||
                    620
                ),

            height:
                Number(
                    definition.height ||
                    460
                ),

            minWidth:
                Number(
                    definition.minWidth ||
                    320
                ),

            minHeight:
                Number(
                    definition.minHeight ||
                    240
                ),

            tags:
                Array.isArray(
                    definition.tags
                )
                    ? [
                        ...definition.tags
                    ]
                    : [],

            permissions:
                Array.isArray(
                    definition.permissions
                )
                    ? [
                        ...definition.permissions
                    ]
                    : [],

            settings:
                definition.settings &&
                typeof definition.settings ===
                "object"
                    ? {
                        ...definition.settings
                    }
                    : {},

            open:
                typeof definition.open ===
                "function"
                    ? definition.open
                    : null,

            close:
                typeof definition.close ===
                "function"
                    ? definition.close
                    : null,

            mount:
                typeof definition.mount ===
                "function"
                    ? definition.mount
                    : null,

            unmount:
                typeof definition.unmount ===
                "function"
                    ? definition.unmount
                    : null,

            render:
                typeof definition.render ===
                "function"
                    ? definition.render
                    : null,

            actions:
                definition.actions &&
                typeof definition.actions ===
                "object"
                    ? {
                        ...definition.actions
                    }
                    : {}

        };

    };


/* ============================================================
   REGISTER APP
   ============================================================ */

HD.appRegistry.register =
    function(
        definition
    ) {

        const app =
            this.normalize(
                definition
            );


        if (
            !app
        ) {

            HD.errors.report(
                new Error(
                    "Ungültige App-Definition."
                ),
                "appRegistry:register"
            );

            return false;

        }


        if (
            this.items.has(
                app.id
            )
        ) {

            /*
             * Vorhandene App wird nicht blind gelöscht.
             * Sie wird kontrolliert aktualisiert.
             */

            const previous =
                this.items.get(
                    app.id
                );


            this.items.set(
                app.id,
                {
                    ...previous,
                    ...app
                }
            );

        }

        else {

            this.items.set(
                app.id,
                app
            );

        }


        if (
            !this.categories.has(
                app.category
            )
        ) {

            this.categories.set(
                app.category,
                new Set()
            );

        }


        this.categories
            .get(
                app.category
            )
            .add(
                app.id
            );


        HD.emit(
            "app:registered",
            app
        );


        return true;

    };


/* ============================================================
   UNREGISTER
   ============================================================ */

HD.appRegistry.unregister =
    function(
        id
    ) {

        const app =
            this.items.get(
                id
            );


        if (
            !app
        ) {

            return false;

        }


        this.items.delete(
            id
        );


        const category =
            this.categories.get(
                app.category
            );


        if (
            category
        ) {

            category.delete(
                id
            );


            if (
                category.size ===
                0
            ) {

                this.categories.delete(
                    app.category
                );

            }

        }


        HD.emit(
            "app:unregistered",
            app
        );


        return true;

    };


/* ============================================================
   GET APP
   ============================================================ */

HD.appRegistry.get =
    function(
        id
    ) {

        return (
            this.items.get(
                id
            ) ||
            null
        );

    };


/* ============================================================
   GET ALL
   ============================================================ */

HD.appRegistry.getAll =
    function() {

        return [
            ...this.items.values()
        ];

    };


/* ============================================================
   CATEGORY
   ============================================================ */

HD.appRegistry.getCategory =
    function(
        category
    ) {

        const ids =
            this.categories.get(
                category
            );


        if (
            !ids
        ) {

            return [];

        }


        return [
            ...ids
        ]
        .map(
            id =>
                this.get(
                    id
                )
        )
        .filter(
            Boolean
        );

    };


/* ============================================================
   CATEGORIES
   ============================================================ */

HD.appRegistry.getCategories =
    function() {

        return [
            ...this.categories.keys()
        ];

    };


/* ============================================================
   SEARCH
   ============================================================ */

HD.appRegistry.search =
    function(
        query
    ) {

        const value =
            String(
                query ||
                ""
            )
            .trim()
            .toLowerCase();


        if (
            !value
        ) {

            return this.getAll();

        }


        return this.getAll()
            .filter(
                app => {

                    const haystack =
                        [
                            app.id,
                            app.name,
                            app.description,
                            app.category,
                            ...app.tags
                        ]
                        .join(
                            " "
                        )
                        .toLowerCase();


                    return haystack.includes(
                        value
                    );

                }
            );

    };


/* ============================================================
   APP MANAGER
   ============================================================ */

HD.appManager =
    HD.appManager || {};

HD.appManager.running =
    HD.appManager.running ||
    new Map();

HD.appManager.instances =
    HD.appManager.instances ||
    new Map();

HD.appManager.nextInstance =
    HD.appManager.nextInstance ||
    1;


/* ------------------------------------------------------------
   CREATE INSTANCE ID
   ------------------------------------------------------------ */

HD.appManager.createInstanceId =
    function(
        appId
    ) {

        return (
            String(appId) +
            "-" +
            this.nextInstance++
        );

    };


/* ------------------------------------------------------------
   CREATE APP CONTEXT
   ------------------------------------------------------------ */

HD.appManager.createContext =
    function(
        app,
        instanceId,
        options
    ) {

        return {

            app,

            id:
                instanceId,

            options:
                options || {},

            root:
                null,

            state:
                {},

            destroyed:
                false,

            setState:
                updates => {

                    if (
                        this.instances.has(
                            instanceId
                        )
                    ) {

                        const instance =
                            this.instances.get(
                                instanceId
                            );


                        instance.state =
                            {
                                ...instance.state,
                                ...(updates || {})
                            };


                        HD.emit(
                            "app:state",
                            {
                                app,
                                instance:
                                    instanceId,

                                state:
                                    instance.state
                            }
                        );

                    }

                },

            getState:
                () => {

                    const instance =
                        this.instances.get(
                            instanceId
                        );


                    return instance
                        ? {
                            ...instance.state
                        }
                        : {};

                },

            close:
                () =>
                    this.close(
                        instanceId
                    )

        };

    };


/* ============================================================
   OPEN APP
   ============================================================ */

HD.appManager.open =
    async function(
        appId,
        options = {}
    ) {

        const app =
            HD.appRegistry.get(
                appId
            );


        if (
            !app ||
            !app.enabled
        ) {

            HD.notifications.create(
                "App",
                "Die gewünschte App ist nicht verfügbar.",
                {
                    type:
                        "warning",

                    icon:
                        "⚠️"
                }
            );


            return null;

        }


        /* -----------------------------------------------------
           SINGLETON
           ----------------------------------------------------- */

        if (
            app.singleton
        ) {

            const existing =
                this.getRunning(
                    app.id
                );


            if (
                existing
            ) {

                HD.emit(
                    "app:focus",
                    existing
                );


                if (
                    HD.windowManager &&
                    HD.windowManager.focus
                ) {

                    HD.windowManager.focus(
                        existing.windowId
                    );

                }


                return existing;

            }

        }


        const instanceId =
            this.createInstanceId(
                app.id
            );


        const context =
            this.createContext(
                app,
                instanceId,
                options
            );


        const instance = {

            id:
                instanceId,

            appId:
                app.id,

            app,

            context,

            state:
                {},

            root:
                null,

            windowId:
                null,

            opened:
                Date.now(),

            active:
                true

        };


        context.state =
            instance.state;


        this.instances.set(
            instanceId,
            instance
        );


        this.running.set(
            instanceId,
            instance
        );


        try {

            /*
             * App-Window wird über das zentrale
             * Window-System erzeugt.
             */

            if (
                HD.windowManager &&
                typeof HD.windowManager.open ===
                "function"
            ) {

                const windowResult =
                    await HD.windowManager.open(
                        {
                            appId:
                                app.id,

                            instanceId,

                            title:
                                app.name,

                            icon:
                                app.icon,

                            width:
                                app.width,

                            height:
                                app.height,

                            minWidth:
                                app.minWidth,

                            minHeight:
                                app.minHeight,

                            resizable:
                                app.resizable,

                            minimizable:
                                app.minimizable,

                            closable:
                                app.closable
                        }
                    );


                if (
                    windowResult
                ) {

                    instance.windowId =
                        windowResult.id ||
                        windowResult.windowId ||
                        null;

                    instance.root =
                        windowResult.element ||
                        windowResult.root ||
                        null;

                    context.root =
                        instance.root;

                }

            }


            /* -------------------------------------------------
               APP MOUNT
               ------------------------------------------------- */

            if (
                app.mount
            ) {

                await app.mount(
                    context
                );

            }


            /* -------------------------------------------------
               APP RENDER
               ------------------------------------------------- */

            if (
                app.render
            ) {

                await app.render(
                    context
                );

            }


            /* -------------------------------------------------
               APP OPEN
               ------------------------------------------------- */

            if (
                app.open
            ) {

                await app.open(
                    context
                );

            }


            HD.emit(
                "app:opened",
                instance
            );


            return instance;

        }

        catch(error) {

            HD.errors.report(
                error,
                "appManager:open:" +
                app.id
            );


            await this.close(
                instanceId,
                {
                    silent:
                        true
                }
            );


            HD.notifications.create(
                app.name,
                "Die App konnte nicht geöffnet werden.",
                {
                    type:
                        "error",

                    icon:
                        app.icon
                }
            );


            return null;

        }

    };


/* ============================================================
   CLOSE APP
   ============================================================ */

HD.appManager.close =
    async function(
        instanceId,
        options = {}
    ) {

        const instance =
            this.instances.get(
                instanceId
            );


        if (
            !instance
        ) {

            return false;

        }


        try {

            const app =
                instance.app;


            if (
                app.close
            ) {

                await app.close(
                    instance.context
                );

            }


            if (
                app.unmount
            ) {

                await app.unmount(
                    instance.context
                );

            }


            if (
                instance.windowId &&
                HD.windowManager &&
                typeof HD.windowManager.close ===
                "function"
            ) {

                await HD.windowManager.close(
                    instance.windowId
                );

            }

        }

        catch(error) {

            HD.errors.report(
                error,
                "appManager:close"
            );

        }


        instance.active =
            false;

        instance.context.destroyed =
            true;


        this.running.delete(
            instanceId
        );

        this.instances.delete(
            instanceId
        );


        HD.emit(
            "app:closed",
            instance
        );


        return true;

    };


/* ============================================================
   CLOSE BY APP ID
   ============================================================ */

HD.appManager.closeByApp =
    async function(
        appId
    ) {

        const running =
            this.getRunning(
                appId
            );


        if (
            !running
        ) {

            return false;

        }


        return this.close(
            running.id
        );

    };


/* ============================================================
   GET RUNNING
   ============================================================ */

HD.appManager.getRunning =
    function(
        appId
    ) {

        for (
            const instance of
            this.running.values()
        ) {

            if (
                instance.appId ===
                appId
            ) {

                return instance;

            }

        }


        return null;

    };


/* ============================================================
   GET ALL RUNNING
   ============================================================ */

HD.appManager.getAllRunning =
    function() {

        return [
            ...this.running.values()
        ];

    };


/* ============================================================
   FOCUS
   ============================================================ */

HD.appManager.focus =
    function(
        instanceId
    ) {

        const instance =
            this.instances.get(
                instanceId
            );


        if (
            !instance
        ) {

            return false;

        }


        this.running.forEach(
            item => {

                item.active =
                    item.id ===
                    instanceId;

            }
        );


        if (
            instance.windowId &&
            HD.windowManager &&
            typeof HD.windowManager.focus ===
            "function"
        ) {

            HD.windowManager.focus(
                instance.windowId
            );

        }


        HD.emit(
            "app:focused",
            instance
        );


        return true;

    };


/* ============================================================
   MINIMIZE
   ============================================================ */

HD.appManager.minimize =
    function(
        instanceId
    ) {

        const instance =
            this.instances.get(
                instanceId
            );


        if (
            !instance
        ) {

            return false;

        }


        if (
            instance.windowId &&
            HD.windowManager &&
            typeof HD.windowManager.minimize ===
            "function"
        ) {

            HD.windowManager.minimize(
                instance.windowId
            );

        }


        HD.emit(
            "app:minimized",
            instance
        );


        return true;

    };


/* ============================================================
   MAXIMIZE
   ============================================================ */

HD.appManager.maximize =
    function(
        instanceId
    ) {

        const instance =
            this.instances.get(
                instanceId
            );


        if (
            !instance
        ) {

            return false;

        }


        if (
            instance.windowId &&
            HD.windowManager &&
            typeof HD.windowManager.maximize ===
            "function"
        ) {

            HD.windowManager.maximize(
                instance.windowId
            );

        }


        HD.emit(
            "app:maximized",
            instance
        );


        return true;

    };


/* ============================================================
   CLOSE ALL
   ============================================================ */

HD.appManager.closeAll =
    async function(
        options = {}
    ) {

        const instances =
            this.getAllRunning();


        for (
            const instance of
            instances
        ) {

            await this.close(
                instance.id,
                options
            );

        }


        return true;

    };


/* ============================================================
   APP ACTION
   ============================================================ */

HD.appManager.action =
    async function(
        instanceId,
        action,
        ...args
    ) {

        const instance =
            this.instances.get(
                instanceId
            );


        if (
            !instance
        ) {

            return null;

        }


        const handler =
            instance.app.actions[
                action
            ];


        if (
            typeof handler !==
            "function"
        ) {

            return null;

        }


        try {

            return await handler(
                instance.context,
                ...args
            );

        }

        catch(error) {

            HD.errors.report(
                error,
                "appManager:action:" +
                action
            );

            return null;

        }

    };


/* ============================================================
   APP OPEN EVENT
   ============================================================ */

HD.on(
    "window:close-request",
    async payload => {

        if (
            !payload
        ) {

            return;

        }


        const instance =
            payload.instanceId
                ? HD.appManager.instances.get(
                    payload.instanceId
                )
                : null;


        if (
            instance
        ) {

            await HD.appManager.close(
                instance.id
            );

        }

    }
);


/* ============================================================
   REGISTER
   ============================================================ */

HD.runtime.register(
    "app-registry",
    HD.appRegistry,
    {
        priority:
            260,

        required:
            true,

        service:
            true
    }
);


HD.runtime.register(
    "app-manager",
    HD.appManager,
    {
        priority:
            270,

        required:
            true,

        service:
            true
    }
);


/* ============================================================
   READY
   ============================================================ */

HD.emit(
    "app-system:ready",
    {
        apps:
            HD.appRegistry.getAll().length
    }
);

</script>

<script>
"use strict";

/* ============================================================
   HALDO WINDOW SYSTEM
   ============================================================ */

HD.windows =
    HD.windows || {};

HD.windows.items =
    HD.windows.items ||
    new Map();

HD.windows.zIndex =
    Number(
        HD.windows.zIndex ||
        1000
    );

HD.windows.nextId =
    Number(
        HD.windows.nextId ||
        1
    );


/* ============================================================
   WINDOW ELEMENT CREATION
   ============================================================ */

HD.windows.create =
    function(
        options = {}
    ) {

        const appId =
            String(
                options.appId ||
                "system"
            );

        const instanceId =
            String(
                options.instanceId ||
                ""
            );

        const id =
            "window-" +
            this.nextId++;


        const title =
            String(
                options.title ||
                appId
            );


        const icon =
            String(
                options.icon ||
                "◈"
            );


        const width =
            Math.max(
                Number(
                    options.width ||
                    620
                ),
                Number(
                    options.minWidth ||
                    320
                )
            );


        const height =
            Math.max(
                Number(
                    options.height ||
                    460
                ),
                Number(
                    options.minHeight ||
                    240
                )
            );


        const minWidth =
            Number(
                options.minWidth ||
                320
            );


        const minHeight =
            Number(
                options.minHeight ||
                240
            );


        const windowElement =
            document.createElement(
                "section"
            );


        windowElement.className =
            "haldo-app-window";


        windowElement.dataset.windowId =
            id;


        windowElement.dataset.appId =
            appId;


        windowElement.dataset.instanceId =
            instanceId;


        windowElement.style.width =
            width +
            "px";


        windowElement.style.height =
            height +
            "px";


        windowElement.style.minWidth =
            minWidth +
            "px";


        windowElement.style.minHeight =
            minHeight +
            "px";


        windowElement.style.zIndex =
            ++this.zIndex;


        windowElement.setAttribute(
            "role",
            "dialog"
        );


        windowElement.setAttribute(
            "aria-label",
            title
        );


        /* ----------------------------------------------------
           HEADER
           ---------------------------------------------------- */

        const header =
            document.createElement(
                "header"
            );


        header.className =
            "haldo-window-header";


        const titleArea =
            document.createElement(
                "div"
            );


        titleArea.className =
            "haldo-window-title-area";


        const iconElement =
            document.createElement(
                "span"
            );


        iconElement.className =
            "haldo-window-icon";


        iconElement.textContent =
            icon;


        const titleElement =
            document.createElement(
                "span"
            );


        titleElement.className =
            "haldo-window-title";


        titleElement.textContent =
            title;


        titleArea.append(
            iconElement,
            titleElement
        );


        /* ----------------------------------------------------
           CONTROLS
           ---------------------------------------------------- */

        const controls =
            document.createElement(
                "div"
            );


        controls.className =
            "haldo-window-controls";


        const minimizeButton =
            document.createElement(
                "button"
            );


        minimizeButton.type =
            "button";


        minimizeButton.className =
            "haldo-window-button minimize";


        minimizeButton.textContent =
            "−";


        minimizeButton.title =
            "Minimieren";


        const maximizeButton =
            document.createElement(
                "button"
            );


        maximizeButton.type =
            "button";


        maximizeButton.className =
            "haldo-window-button maximize";


        maximizeButton.textContent =
            "□";


        maximizeButton.title =
            "Maximieren";


        const closeButton =
            document.createElement(
                "button"
            );


        closeButton.type =
            "button";


        closeButton.className =
            "haldo-window-button close";


        closeButton.textContent =
            "×";


        closeButton.title =
            "Schließen";


        controls.append(
            minimizeButton,
            maximizeButton,
            closeButton
        );


        header.append(
            titleArea,
            controls
        );


        /* ----------------------------------------------------
           CONTENT
           ---------------------------------------------------- */

        const content =
            document.createElement(
                "div"
            );


        content.className =
            "haldo-window-content";


        content.style.minHeight =
            "0";


        content.style.overflow =
            "auto";


        /* ----------------------------------------------------
           RESIZE HANDLE
           ---------------------------------------------------- */

        const resizeHandle =
            document.createElement(
                "div"
            );


        resizeHandle.className =
            "haldo-window-resize";


        resizeHandle.setAttribute(
            "aria-hidden",
            "true"
        );


        windowElement.append(
            header,
            content,
            resizeHandle
        );


        /* ----------------------------------------------------
           RECORD
           ---------------------------------------------------- */

        const record = {

            id,

            appId,

            instanceId,

            element:
                windowElement,

            header,

            content,

            controls,

            resizeHandle,

            minimized:
                false,

            maximized:
                false,

            closed:
                false,

            previousRect:
                null,

            dragging:
                false,

            resizing:
                false

        };


        this.items.set(
            id,
            record
        );


        /* ----------------------------------------------------
           EVENTS
           ---------------------------------------------------- */

        minimizeButton.addEventListener(
            "click",
            event => {

                event.preventDefault();

                event.stopPropagation();

                this.minimize(
                    id
                );

            }
        );


        maximizeButton.addEventListener(
            "click",
            event => {

                event.preventDefault();

                event.stopPropagation();

                this.toggleMaximize(
                    id
                );

            }
        );


        /*
         * WICHTIG:
         * Ein Klick auf X schließt das Fenster sofort.
         * Kein mehrfaches Drücken erforderlich.
         */

        closeButton.addEventListener(
            "click",
            event => {

                event.preventDefault();

                event.stopPropagation();

                this.close(
                    id
                );

            }
        );


        windowElement.addEventListener(
            "pointerdown",
            () => {

                this.focus(
                    id
                );

            }
        );


        this.enableDragging(
            record
        );


        this.enableResizing(
            record
        );


        return record;

    };


/* ============================================================
   ADD WINDOW TO DESKTOP
   ============================================================ */

HD.windows.mount =
    function(
        record
    ) {

        if (
            !record ||
            !record.element
        ) {

            return false;

        }


        const desktop =
            document.querySelector(
                "#haldo-desktop"
            ) ||
            document.querySelector(
                ".haldo-desktop"
            ) ||
            document.body;


        desktop.appendChild(
            record.element
        );


        this.center(
            record.id
        );


        this.focus(
            record.id
        );


        return true;

    };


/* ============================================================
   CENTER
   ============================================================ */

HD.windows.center =
    function(
        id
    ) {

        const record =
            this.items.get(
                id
            );


        if (
            !record ||
            !record.element
        ) {

            return false;

        }


        if (
            record.maximized
        ) {

            return false;

        }


        const viewportWidth =
            window.innerWidth;


        const viewportHeight =
            window.innerHeight;


        const rect =
            record.element.getBoundingClientRect();


        const left =
            Math.max(
                10,
                (
                    viewportWidth -
                    rect.width
                ) / 2
            );


        const top =
            Math.max(
                10,
                (
                    viewportHeight -
                    rect.height
                ) / 2
            );


        record.element.style.left =
            left +
            "px";


        record.element.style.top =
            top +
            "px";


        record.element.style.transform =
            "none";


        return true;

    };


/* ============================================================
   FOCUS
   ============================================================ */

HD.windows.focus =
    function(
        id
    ) {

        const record =
            this.items.get(
                id
            );


        if (
            !record ||
            record.closed
        ) {

            return false;

        }


        record.element.style.zIndex =
            ++this.zIndex;


        this.items.forEach(
            item => {

                item.element.classList.toggle(
                    "active",
                    item.id === id
                );

            }
        );


        HD.emit(
            "window:focused",
            record
        );


        return true;

    };


/* ============================================================
   MINIMIZE
   ============================================================ */

HD.windows.minimize =
    function(
        id
    ) {

        const record =
            this.items.get(
                id
            );


        if (
            !record ||
            record.closed
        ) {

            return false;

        }


        record.minimized =
            true;


        record.element.classList.add(
            "minimized"
        );


        record.element.setAttribute(
            "aria-hidden",
            "true"
        );


        HD.emit(
            "window:minimized",
            record
        );


        return true;

    };


/* ============================================================
   RESTORE
   ============================================================ */

HD.windows.restore =
    function(
        id
    ) {

        const record =
            this.items.get(
                id
            );


        if (
            !record ||
            record.closed
        ) {

            return false;

        }


        record.minimized =
            false;


        record.element.classList.remove(
            "minimized"
        );


        record.element.removeAttribute(
            "aria-hidden"
        );


        this.focus(
            id
        );


        HD.emit(
            "window:restored",
            record
        );


        return true;

    };


/* ============================================================
   MAXIMIZE
   ============================================================ */

HD.windows.maximize =
    function(
        id
    ) {

        const record =
            this.items.get(
                id
            );


        if (
            !record ||
            record.closed
        ) {

            return false;

        }


        if (
            record.maximized
        ) {

            return this.restoreMaximized(
                id
            );

        }


        const rect =
            record.element.getBoundingClientRect();


        record.previousRect =
            {
                left:
                    rect.left,

                top:
                    rect.top,

                width:
                    rect.width,

                height:
                    rect.height
            };


        record.maximized =
            true;


        record.element.classList.add(
            "maximized"
        );


        record.element.style.left =
            "10px";


        record.element.style.top =
            "10px";


        record.element.style.width =
            "calc(100vw - 20px)";


        record.element.style.height =
            "calc(100vh - 20px)";


        this.focus(
            id
        );


        HD.emit(
            "window:maximized",
            record
        );


        return true;

    };


/* ============================================================
   RESTORE MAXIMIZED
   ============================================================ */

HD.windows.restoreMaximized =
    function(
        id
    ) {

        const record =
            this.items.get(
                id
            );


        if (
            !record
        ) {

            return false;

        }


        const previous =
            record.previousRect;


        record.maximized =
            false;


        record.element.classList.remove(
            "maximized"
        );


        if (
            previous
        ) {

            record.element.style.left =
                previous.left +
                "px";


            record.element.style.top =
                previous.top +
                "px";


            record.element.style.width =
                previous.width +
                "px";


            record.element.style.height =
                previous.height +
                "px";

        }

        else {

            record.element.style.width =
                "620px";

            record.element.style.height =
                "460px";

            this.center(
                id
            );

        }


        this.focus(
            id
        );


        HD.emit(
            "window:restored-maximized",
            record
        );


        return true;

    };


/* ============================================================
   TOGGLE MAXIMIZE
   ============================================================ */

HD.windows.toggleMaximize =
    function(
        id
    ) {

        const record =
            this.items.get(
                id
            );


        if (
            !record
        ) {

            return false;

        }


        return record.maximized
            ? this.restoreMaximized(
                id
            )
            : this.maximize(
                id
            );

    };


/* ============================================================
   CLOSE WINDOW
   ============================================================ */

HD.windows.close =
    function(
        id
    ) {

        const record =
            this.items.get(
                id
            );


        if (
            !record ||
            record.closed
        ) {

            return false;

        }


        /*
         * Direktes Schließen.
         * Kein zweiter Klick notwendig.
         */

        record.closed =
            true;


        record.element.classList.add(
            "closing"
        );


        setTimeout(
            () => {

                if (
                    record.element &&
                    record.element.parentNode
                ) {

                    record.element.parentNode
                        .removeChild(
                            record.element
                        );

                }

                this.items.delete(
                    id
                );

            },
            120
        );


        HD.emit(
            "window:closed",
            record
        );


        HD.emit(
            "window:close-request",
            {
                windowId:
                    id,

                appId:
                    record.appId,

                instanceId:
                    record.instanceId
            }
        );


        return true;

    };


/* ============================================================
   CONTENT
   ============================================================ */

HD.windows.setContent =
    function(
        id,
        content
    ) {

        const record =
            this.items.get(
                id
            );


        if (
            !record
        ) {

            return false;

        }


        record.content.innerHTML =
            "";


        if (
            content instanceof
            Node
        ) {

            record.content.append(
                content
            );

        }

        else {

            record.content.innerHTML =
                String(
                    content ??
                    ""
                );

        }


        return true;

    };


/* ============================================================
   DRAGGING
   ============================================================ */

HD.windows.enableDragging =
    function(
        record
    ) {

        const header =
            record.header;


        let pointerId =
            null;

        let startX =
            0;

        let startY =
            0;

        let startLeft =
            0;

        let startTop =
            0;


        header.addEventListener(
            "pointerdown",
            event => {

                if (
                    record.maximized
                ) {

                    return;

                }


                if (
                    event.target.closest(
                        "button"
                    )
                ) {

                    return;

                }


                pointerId =
                    event.pointerId;


                startX =
                    event.clientX;


                startY =
                    event.clientY;


                const rect =
                    record.element
                        .getBoundingClientRect();


                startLeft =
                    rect.left;


                startTop =
                    rect.top;


                record.dragging =
                    true;


                header.setPointerCapture(
                    pointerId
                );


                this.focus(
                    record.id
                );

            }
        );


        header.addEventListener(
            "pointermove",
            event => {

                if (
                    !record.dragging ||
                    event.pointerId !==
                    pointerId
                ) {

                    return;

                }


                const deltaX =
                    event.clientX -
                    startX;


                const deltaY =
                    event.clientY -
                    startY;


                const maxLeft =
                    Math.max(
                        0,
                        window.innerWidth -
                        record.element
                            .offsetWidth
                    );


                const maxTop =
                    Math.max(
                        0,
                        window.innerHeight -
                        record.element
                            .offsetHeight
                    );


                const left =
                    Math.min(
                        maxLeft,
                        Math.max(
                            0,
                            startLeft +
                            deltaX
                        )
                    );


                const top =
                    Math.min(
                        maxTop,
                        Math.max(
                            0,
                            startTop +
                            deltaY
                        )
                    );


                record.element.style.left =
                    left +
                    "px";


                record.element.style.top =
                    top +
                    "px";

            }
        );


        const stop =
            event => {

                if (
                    event.pointerId ===
                    pointerId
                ) {

                    record.dragging =
                        false;

                    pointerId =
                        null;

                }

            };


        header.addEventListener(
            "pointerup",
            stop
        );


        header.addEventListener(
            "pointercancel",
            stop
        );

    };


/* ============================================================
   RESIZING
   ============================================================ */

HD.windows.enableResizing =
    function(
        record
    ) {

        const handle =
            record.resizeHandle;


        let pointerId =
            null;

        let startX =
            0;

        let startY =
            0;

        let startWidth =
            0;

        let startHeight =
            0;


        handle.addEventListener(
            "pointerdown",
            event => {

                if (
                    record.maximized
                ) {

                    return;

                }


                pointerId =
                    event.pointerId;


                startX =
                    event.clientX;


                startY =
                    event.clientY;


                startWidth =
                    record.element
                        .offsetWidth;


                startHeight =
                    record.element
                        .offsetHeight;


                record.resizing =
                    true;


                handle.setPointerCapture(
                    pointerId
                );


                event.preventDefault();

            }
        );


        handle.addEventListener(
            "pointermove",
            event => {

                if (
                    !record.resizing ||
                    event.pointerId !==
                    pointerId
                ) {

                    return;

                }


                const minWidth =
                    Number(
                        parseInt(
                            record.element
                                .style
                                .minWidth
                        )
                    ) ||
                    320;


                const minHeight =
                    Number(
                        parseInt(
                            record.element
                                .style
                                .minHeight
                        )
                    ) ||
                    240;


                const width =
                    Math.max(
                        minWidth,
                        startWidth +
                        (
                            event.clientX -
                            startX
                        )
                    );


                const height =
                    Math.max(
                        minHeight,
                        startHeight +
                        (
                            event.clientY -
                            startY
                        )
                    );


                record.element.style.width =
                    Math.min(
                        width,
                        window.innerWidth -
                        20
                    ) +
                    "px";


                record.element.style.height =
                    Math.min(
                        height,
                        window.innerHeight -
                        20
                    ) +
                    "px";

            }
        );


        const stop =
            event => {

                if (
                    event.pointerId ===
                    pointerId
                ) {

                    record.resizing =
                        false;

                    pointerId =
                        null;

                }

            };


        handle.addEventListener(
            "pointerup",
            stop
        );


        handle.addEventListener(
            "pointercancel",
            stop
        );

    };


/* ============================================================
   RESPONSIVE WINDOWS
   ============================================================ */

HD.windows.responsive =
    function() {

        this.items.forEach(
            record => {

                if (
                    record.closed
                ) {

                    return;

                }


                if (
                    record.maximized
                ) {

                    record.element.style.left =
                        "10px";

                    record.element.style.top =
                        "10px";

                    return;

                }


                const viewportWidth =
                    window.innerWidth;


                const viewportHeight =
                    window.innerHeight;


                const maxWidth =
                    Math.max(
                        280,
                        viewportWidth -
                        20
                    );


                const maxHeight =
                    Math.max(
                        220,
                        viewportHeight -
                        20
                    );


                const currentWidth =
                    record.element
                        .offsetWidth;


                const currentHeight =
                    record.element
                        .offsetHeight;


                if (
                    currentWidth >
                    maxWidth
                ) {

                    record.element.style.width =
                        maxWidth +
                        "px";

                }


                if (
                    currentHeight >
                    maxHeight
                ) {

                    record.element.style.height =
                        maxHeight +
                        "px";

                }


                const rect =
                    record.element
                        .getBoundingClientRect();


                if (
                    rect.right >
                    viewportWidth
                ) {

                    record.element.style.left =
                        Math.max(
                            10,
                            viewportWidth -
                            record.element
                                .offsetWidth -
                            10
                        ) +
                        "px";

                }


                if (
                    rect.bottom >
                    viewportHeight
                ) {

                    record.element.style.top =
                        Math.max(
                            10,
                            viewportHeight -
                            record.element
                                .offsetHeight -
                            10
                        ) +
                        "px";

                }

            }
        );

    };


window.addEventListener(
    "resize",
    () => {

        HD.windows.responsive();

    }
);


/* ============================================================

HD.windowManager =

HD.windowManager.open =

HD.windowManager.maximize =

<script>
"use strict";

/* ============================================================
   ROUTER
   ============================================================ */

HD.router =
    HD.router || {};

HD.router.current =
    HD.router.current || null;

HD.router.history =
    HD.router.history || [];

HD.router.maxHistory =
    100;


/* ============================================================
   NAVIGATE
   ============================================================ */

HD.router.navigate =
    async function(
        route,
        options = {}
    ) {

        const target =
            String(
                route ||
                ""
            )
            .trim();


        if (
            !target
        ) {

            return false;

        }


        const previous =
            this.current;


        this.history.push(
            previous
        );


        if (
            this.history.length >
            this.maxHistory
        ) {

            this.history.shift();

        }


        this.current =
            target;


        HD.emit(
            "router:navigate",
            {
                from:
                    previous,

                to:
                    target,

                options
            }
        );


        return true;

    };


/* ============================================================
   BACK
   ============================================================ */

HD.router.back =
    async function() {

        if (
            this.history.length ===
            0
        ) {

            return false;

        }


        const previous =
            this.history.pop();


        const current =
            this.current;


        this.current =
            previous;


        HD.emit(
            "router:back",
            {
                from:
                    current,

                to:
                    previous
            }
        );


        return true;

    };


/* ============================================================
   OPEN APP ROUTE
   ============================================================ */

HD.router.openApp =
    async function(
        appId,
        options = {}
    ) {

        const id =
            String(
                appId ||
                ""
            )
            .trim();


        if (
            !id
        ) {

            return null;

        }


        const instance =
            await HD.appManager.open(
                id,
                options
            );


        if (
            !instance
        ) {

            return null;

        }


        await this.navigate(
            "app://" +
            id,
            {
                appId:
                    id,

                instanceId:
                    instance.id
            }
        );


        return instance;

    };


/* ============================================================
   CLOSE APP ROUTE
   ============================================================ */

HD.router.closeApp =
    async function(
        instanceId
    ) {

        if (
            !instanceId
        ) {

            return false;

        }


        const result =
            await HD.appManager.close(
                instanceId
            );


        if (
            result
        ) {

            await this.back();

        }


        return result;

    };


/* ============================================================
   APP LAUNCHER
   ============================================================ */

HD.launcher =
    HD.launcher || {};


HD.appLauncher =
    HD.appLauncher ||
    HD.launcher;


HD.launcher.initialized =
    false;

HD.launcher.container =
    null;

HD.launcher.menu =
    null;


/* ============================================================
   FIND DESKTOP
   ============================================================ */

HD.launcher.findContainer =
    function() {

        return (
            document.querySelector(
                "#haldo-app-launcher"
            ) ||
            document.querySelector(
                "#app-launcher"
            ) ||
            document.querySelector(
                ".haldo-app-launcher"
            ) ||
            null
        );

    };


/* ============================================================
   CREATE LAUNCHER
   ============================================================ */

HD.launcher.create =
    function() {

        if (
            this.container &&
            this.container.isConnected
        ) {

            return this.container;

        }


        let container =
            this.findContainer();


        if (
            !container
        ) {

            container =
                document.createElement(
                    "aside"
                );


            container.id =
                "haldo-app-launcher";


            container.className =
                "haldo-app-launcher";


            const desktop =
                document.querySelector(
                    "#haldo-desktop"
                ) ||
                document.querySelector(
                    ".haldo-desktop"
                ) ||
                document.body;


            desktop.appendChild(
                container
            );

        }


        this.container =
            container;


        this.render();


        return container;

    };


/* ============================================================
   RENDER APP MENU
   ============================================================ */

HD.launcher.render =
    function(
        query = ""
    ) {

        if (
            !this.container
        ) {

            this.create();

            return;

        }


        const apps =
            HD.appRegistry.search(
                query
            );


        this.container.innerHTML =
            "";


        const header =
            document.createElement(
                "div"
            );


        header.className =
            "haldo-launcher-header";


        const title =
            document.createElement(
                "div"
            );


        title.className =
            "haldo-launcher-title";


        title.textContent =
            "HalDo Apps";


        const count =
            document.createElement(
                "span"
            );


        count.className =
            "haldo-launcher-count";


        count.textContent =
            String(
                apps.length
            );


        title.append(
            count
        );


        const search =
            document.createElement(
                "input"
            );


        search.className =
            "haldo-launcher-search";


        search.type =
            "search";


        search.placeholder =
            "App suchen…";


        search.value =
            query;


        search.autocomplete =
            "off";


        search.addEventListener(
            "input",
            event => {

                this.render(
                    event.target.value
                );

            }
        );


        header.append(
            title,
            search
        );


        this.container.append(
            header
        );


        const groups =
            new Map();


        apps.forEach(
            app => {

                if (
                    !groups.has(
                        app.category
                    )
                ) {

                    groups.set(
                        app.category,
                        []
                    );

                }


                groups
                    .get(
                        app.category
                    )
                    .push(
                        app
                    );

            }
        );


        groups.forEach(
            (
                categoryApps,
                category
            ) => {

                const section =
                    document.createElement(
                        "section"
                    );


                section.className =
                    "haldo-launcher-section";


                const categoryTitle =
                    document.createElement(
                        "div"
                    );


                categoryTitle.className =
                    "haldo-launcher-category";


                categoryTitle.textContent =
                    category;


                section.append(
                    categoryTitle
                );


                const grid =
                    document.createElement(
                        "div"
                    );


                grid.className =
                    "haldo-launcher-grid";


                categoryApps.forEach(
                    app => {

                        const button =
                            this.createAppButton(
                                app
                            );


                        grid.append(
                            button
                        );

                    }
                );


                section.append(
                    grid
                );


                this.container.append(
                    section
                );

            }
        );


        return this.container;

    };


/* ============================================================
   CREATE APP BUTTON
   ============================================================ */

HD.launcher.createAppButton =
    function(
        app
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "haldo-launcher-app";


        button.dataset.appId =
            app.id;


        button.title =
            app.description ||
            app.name;


        const icon =
            document.createElement(
                "span"
            );


        icon.className =
            "haldo-launcher-app-icon";


        icon.textContent =
            app.icon;


        const name =
            document.createElement(
                "span"
            );


        name.className =
            "haldo-launcher-app-name";


        name.textContent =
            app.name;


        button.append(
            icon,
            name
        );


        button.addEventListener(
            "click",
            async event => {

                event.preventDefault();

                event.stopPropagation();


                await this.open(
                    app.id
                );

            }
        );


        return button;

    };


/* ============================================================
   OPEN APP
   ============================================================ */

HD.launcher.open =
    async function(
        appId,
        options = {}
    ) {

        const app =
            HD.appRegistry.get(
                appId
            );


        if (
            !app
        ) {

            HD.notifications.create(
                "HalDo Apps",
                "Diese App wurde nicht gefunden.",
                {
                    type:
                        "warning",

                    icon:
                        "⚠️"
                }
            );


            return null;

        }


        const instance =
            await HD.router.openApp(
                app.id,
                options
            );


        if (
            instance
        ) {

            HD.emit(
                "launcher:app-opened",
                instance
            );

        }


        return instance;

    };


/* ============================================================
   CLOSE LAUNCHER
   ============================================================ */

HD.launcher.close =
    function() {

        if (
            !this.container
        ) {

            return false;

        }


        this.container.classList.remove(
            "visible"
        );


        HD.emit(
            "launcher:closed"
        );


        return true;

    };


/* ============================================================
   TOGGLE LAUNCHER
   ============================================================ */

HD.launcher.toggle =
    function() {

        if (
            !this.container
        ) {

            this.create();

        }


        const visible =
            this.container.classList.toggle(
                "visible"
            );


        HD.emit(
            visible
                ? "launcher:opened"
                : "launcher:closed"
        );


        return visible;

    };


/* ============================================================
   GLOBAL MENU BUTTON
   ============================================================ */

HD.launcher.bindMenuButton =
    function() {

        const buttons =
            document.querySelectorAll(
                [
                    "[data-haldo-menu]",
                    "#haldo-menu-button",
                    ".haldo-menu-button"
                ]
                .join(",")
            );


        buttons.forEach(
            button => {

                if (
                    button.dataset.haldoLauncherBound ===
                    "true"
                ) {

                    return;

                }


                button.dataset.haldoLauncherBound =
                    "true";
