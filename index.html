                key,
                value
            ) {

                if (
                    bridge &&
                    typeof bridge.save ===
                    "function"
                ) {

                    return bridge.save(
                        app.id +
                        ":" +
                        key,
                        value
                    );

                }

                return null;

            },

            load(
                key,
                fallback
            ) {

                if (
                    bridge &&
                    typeof bridge.load ===
                    "function"
                ) {

                    return bridge.load(
                        app.id +
                        ":" +
                        key,
                        fallback
                    );

                }

                return fallback;

            },

            ai(
                message,
                context = {}
            ) {

                if (
                    bridge &&
                    typeof bridge.sendToAI ===
                    "function"
                ) {

                    return bridge.sendToAI(
                        message,
                        {
                            app,
                            instance,
                            ...context
                        }
                    );

                }

                return null;

            }

        };

    }


    /* =========================================================
       MOUNT APP
       ========================================================= */

    async function mount(
        appId,
        options = {}
    ) {

        const id =
            normalizeId(
                appId
            );


        if (
            !id
        ) {

            throw new Error(
                "App-ID fehlt."
            );

        }


        let app =
            resolveApp(
                id
            );


        if (
            !app &&
            bridge &&
            typeof bridge.registerApp ===
            "function" &&
            options.definition
        ) {

            app =
                bridge.registerApp(
                    {
                        ...options.definition,
                        id
                    }
                );

        }


        if (
            !app
        ) {

            throw new Error(
                "App nicht gefunden: " +
                id
            );

        }


        if (
            app.enabled ===
            false
        ) {

            throw new Error(
                "App ist deaktiviert: " +
                id
            );

        }


        const instanceId =
            createInstanceId(
                id
            );


        const instance = {

            id:
                instanceId,

            appId:
                id,

            app,

            state:
                "created",

            element:
                null,

            context:
                null,

            mountedAt:
                now(),

            updatedAt:
                now(),

            error:
                null

        };


        instance.context =
            createContext(
                app,
                instance
            );


        runtime.instances.set(
            instanceId,
            instance
        );


        runtime.states.set(
            instanceId,
            "created"
        );


        emit(
            "app:created",
            {
                instance
            }
        );


        try {

            if (
                typeof app.create ===
                "function"
            ) {

                instance.element =
                    await app.create(
                        instance.context,
                        options
                    );

            } else if (
                typeof app.render ===
                "function"
            ) {

                instance.element =
                    await app.render(
                        instance.context,
                        options
                    );

            }


            instance.state =
                "mounted";

            instance.updatedAt =
                now();


            runtime.states.set(
                instanceId,
                "mounted"
            );


            emit(
                "app:mounted",
                {
                    instance
                }
            );


            if (
                typeof app.mount ===
                "function"
            ) {

                await app.mount(
                    instance.context,
                    options
                );

            }


            return instance;

        } catch (error) {

            instance.state =
                "error";

            instance.error =
                error;

            runtime.states.set(
                instanceId,
                "error"
            );


            emit(
                "app:error",
                {
                    instance,
                    error
                }
            );


            console.error(
                "[HalDo Runtime] App-Mount fehlgeschlagen:",
                error
            );


            return instance;

        }

    }


    /* =========================================================
       UNMOUNT APP
       ========================================================= */

    async function unmount(
        instanceId
    ) {

        const instance =
            runtime.instances.get(
                instanceId
            );


        if (
            !instance
        ) {

            return false;

        }


        const app =
            instance.app;


        try {

            if (
                typeof app.unmount ===
                "function"
            ) {

                await app.unmount(
                    instance.context
                );

            }


            if (
                instance.element &&
                instance.element.parentNode
            ) {

                instance.element.parentNode.removeChild(
                    instance.element
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo Runtime] Unmount-Fehler:",
                error
            );

        }


        instance.state =
            "unmounted";


        runtime.states.set(
            instanceId,
            "unmounted"
        );


        runtime.instances.delete(
            instanceId
        );


        emit(
            "app:unmounted",
            {
                instance
            }
        );


        if (
            runtime.activeApp ===
            instanceId
        ) {

            runtime.activeApp =
                null;

        }


        return true;

    }


    /* =========================================================
       ACTIVATE APP
       ========================================================= */

    async function activate(
        instanceId
    ) {

        const instance =
            runtime.instances.get(
                instanceId
            );


        if (
            !instance
        ) {

            return false;

        }


        if (
            runtime.activeApp &&
            runtime.activeApp !==
            instanceId
        ) {

            await deactivate(
                runtime.activeApp
            );

        }


        const app =
            instance.app;


        try {

            if (
                typeof app.activate ===
                "function"
            ) {

                await app.activate(
                    instance.context
                );

            }


            instance.state =
                "active";

            instance.updatedAt =
                now();


            runtime.states.set(
                instanceId,
                "active"
            );


            runtime.activeApp =
                instanceId;


            emit(
                "app:activated",
                {
                    instance
                }
            );


            if (
                bridge &&
                typeof bridge.setAppState ===
                "function"
            ) {

                bridge.setAppState(
                    instance.appId,
                    "active",
                    {
                        instanceId
                    }
                );

            }


            return true;

        } catch (error) {

            instance.state =
                "error";

            instance.error =
                error;


            emit(
                "app:error",
                {
                    instance,
                    error
                }
            );


            return false;

        }

    }


    /* =========================================================
       DEACTIVATE APP
       ========================================================= */

    async function deactivate(
        instanceId
    ) {

        const instance =
            runtime.instances.get(
                instanceId
            );


        if (
            !instance
        ) {

            return false;

        }


        const app =
            instance.app;


        try {

            if (
                typeof app.deactivate ===
                "function"
            ) {

                await app.deactivate(
                    instance.context
                );

            }

        } catch (error) {

            console.warn(
                "[HalDo Runtime] Deaktivierung fehlgeschlagen:",
                error
            );

        }


        instance.state =
            "inactive";


        instance.updatedAt =
            now();


        runtime.states.set(
            instanceId,
            "inactive"
        );


        if (
            runtime.activeApp ===
            instanceId
        ) {

            runtime.activeApp =
                null;

        }


        emit(
            "app:deactivated",
            {
                instance
            }
        );


        return true;

    }


    /* =========================================================
       APP RESTART
       ========================================================= */

    async function restart(
        instanceId,
        options = {}
    ) {

        const instance =
            runtime.instances.get(
                instanceId
            );


        if (
            !instance
        ) {

            return null;

        }


        const appId =
            instance.appId;


        await unmount(
            instanceId
        );


        return mount(
            appId,
            options
        );

    }


    /* =========================================================
       APP INSTANCE ACCESS
       ========================================================= */

    function getInstance(
        instanceId
    ) {

        return (
            runtime.instances.get(
                instanceId
            ) ||
            null
        );

    }


    function getInstances(
        appId = null
    ) {

        const values =
            Array.from(
                runtime.instances.values()
            );


        if (
            !appId
        ) {

            return values;

        }


        const id =
            normalizeId(
                appId
            );


        return values.filter(
            instance =>
                instance.appId ===
                id
        );

    }


    function getActiveApp() {

        if (
            !runtime.activeApp
        ) {

            return null;

        }


        return getInstance(
            runtime.activeApp
        );

    }


    /* =========================================================
       PUBLIC API
       ========================================================= */

    runtime.on =
        on;

    runtime.emit =
        emit;

    runtime.mount =
        mount;

    runtime.unmount =
        unmount;

    runtime.activate =
        activate;

    runtime.deactivate =
        deactivate;

    runtime.restart =
        restart;

    runtime.getInstance =
        getInstance;

    runtime.getInstances =
        getInstances;

    runtime.getActiveApp =
        getActiveApp;


    /* =========================================================
       GLOBAL REGISTRATION
       ========================================================= */

    window.HalDoAppRuntime =
        runtime;


    if (
        !window.HalDoOS
    ) {

        window.HalDoOS =
            {};

    }


    window.HalDoOS.appRuntime =
        runtime;


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    function initialize() {

        if (
            runtime.initialized
        ) {

            return;

        }


        runtime.initialized =
            true;


        emit(
            "runtime:ready",
            {
                version:
                    VERSION,

                timestamp:
                    now()
            }
        );


        console.info(
            "%cHalDo AI OS 20%c App Runtime bereit",
            "color:#42e6ff;font-weight:800;",
            "color:#ffffff;"
        );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once:
                    true
            }
        );

    } else {

        initialize();

    }

})();

</script>
<script>
/* =========================================================
   HALDO AI OS 20
   PART 18 — SYSTEM DIAGNOSTICS & RUNTIME BRIDGE
   ========================================================= */

(function () {

    "use strict";

    const HALDO =
        window.HalDoOS =
            window.HalDoOS || {};

    const state = {
        started: false,
        lastCheck: 0,
        checks: {},
        errors: []
    };


    function now() {
        return Date.now();
    }


    function getKernel() {
        return (
            window.HalDoKernel ||
            HALDO.kernel ||
            null
        );
    }


    function getSystem() {
        return (
            window.HalDoSystem ||
            HALDO.system ||
            null
        );
    }


    function getAppManager() {
        return (
            window.HalDoAppManager ||
            HALDO.appManager ||
            null
        );
    }


    function getRouter() {
        return (
            window.HalDoAppRouter ||
            HALDO.appRouter ||
            HALDO.router ||
            null
        );
    }


    function getWindowManager() {
        return (
            window.HalDoWindowManager ||
            HALDO.windowManager ||
            null
        );
    }


    function getAI() {

        return (
            window.HalDoAI ||
            HALDO.ai ||
            window.HalDoAIEngine ||
            null
        );

    }


    function checkObject(
        name,
        object
    ) {

        const result = {

            name,
            available:
                !!object,

            type:
                object
                    ? typeof object
                    : "undefined",

            timestamp:
                now()

        };


        state.checks[name] =
            result;


        return result;

    }


    function runDiagnostics() {

        const results = {

            timestamp:
                now(),

            kernel:
                checkObject(
                    "kernel",
                    getKernel()
                ),

            system:
                checkObject(
                    "system",
                    getSystem()
                ),

            appManager:
                checkObject(
                    "appManager",
                    getAppManager()
                ),

            router:
                checkObject(
                    "router",
                    getRouter()
                ),

            windowManager:
                checkObject(
                    "windowManager",
                    getWindowManager()
                ),

            ai:
                checkObject(
                    "ai",
                    getAI()
                ),

            ui:
                checkObject(
                    "ui",
                    window.HalDoUI
                ),

            storage:
                checkObject(
                    "storage",
                    window.HalDoStorage ||
                    HALDO.storage
                )

        };


        state.lastCheck =
            results.timestamp;


        const failed =
            Object.values(results)
                .filter(
                    item =>
                        item &&
                        typeof item === "object" &&
                        item.available === false
                );


        results.ok =
            failed.length === 0;


        results.missing =
            failed.map(
                item =>
                    item.name
            );


        return results;

    }


    function emitDiagnosticEvent(
        results
    ) {

        const kernel =
            getKernel();


        if (
            kernel &&
            typeof kernel.emit ===
            "function"
        ) {

            try {

                kernel.emit(
                    "system:diagnostics",
                    results
                );

            } catch (error) {

                console.warn(
                    "[HalDo Diagnostics]",
                    error
                );

            }

        }


        if (
            typeof window.dispatchEvent ===
            "function"
        ) {

            window.dispatchEvent(
                new CustomEvent(
                    "haldo:diagnostics",
                    {
                        detail:
                            results
                    }
                )
            );

        }

    }


    function getStatus() {

        const diagnostics =
            runDiagnostics();


        return {

            version:
                "20.0.0",

            edition:
                "Professional Ultimate Foundation",

            ready:
                state.started,

            diagnostics,

            timestamp:
                now()

        };

    }


    function initialize() {

        if (
            state.started
        ) {

            return getStatus();

        }


        state.started =
            true;


        const diagnostics =
            runDiagnostics();


        emitDiagnosticEvent(
            diagnostics
        );


        console.info(
            "%cHalDo AI OS 20%c System-Diagnose bereit",
            "color:#42e6ff;font-weight:800;",
            "color:#ffffff;"
        );


        return getStatus();

    }


    HALDO.diagnostics = {

        initialize,

        run:
            runDiagnostics,

        getStatus,

        getState() {

            return {
                ...state,
                checks: {
                    ...state.checks
                }
            };

        }

    };


    window.HalDoDiagnostics =
        HALDO.diagnostics;


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once:
                    true
            }
        );

    } else {

        initialize();

    }


})();

<script>
/* =========================================================
   HALDO AI OS 20
   PART 19 — GLOBAL EVENT / MODULE BRIDGE
   ========================================================= */

(function () {

    "use strict";

    const HALDO =
        window.HalDoOS =
            window.HalDoOS || {};


    const state = {

        initialized:
            false,

        listeners:
            new Map(),

        events:
            [],

        maxHistory:
            250

    };


    function timestamp() {
        return Date.now();
    }


    function recordEvent(
        name,
        detail
    ) {

        state.events.push({

            name,

            detail,

            timestamp:
                timestamp()

        });


        if (
            state.events.length >
            state.maxHistory
        ) {

            state.events.shift();

        }

    }


    function emit(
        name,
        detail = {}
    ) {

        recordEvent(
            name,
            detail
        );


        const kernel =
            window.HalDoKernel ||
            HALDO.kernel;


        if (
            kernel &&
            typeof kernel.emit ===
            "function"
        ) {

            try {

                kernel.emit(
                    name,
                    detail
                );

            } catch (error) {

                console.warn(
                    "[HalDo Event Bridge]",
                    error
                );

            }

        }


        try {

            window.dispatchEvent(
                new CustomEvent(
                    name,
                    {
                        detail
                    }
                )
            );

        } catch (error) {

            console.warn(
                "[HalDo DOM Event]",
                error
            );

        }

    }


    function on(
        name,
        handler
    ) {

        if (
            typeof handler !==
            "function"
        ) {

            return () => {};

        }


        const wrapped =
            event => {

                try {

                    handler(
                        event?.detail ??
                        event
                    );

                } catch (error) {

                    console.error(
                        `[HalDo Event Handler] ${name}`,
                        error
                    );

                }

            };


        window.addEventListener(
            name,
            wrapped
        );


        if (
            !state.listeners.has(name)
        ) {

            state.listeners.set(
                name,
                new Set()
            );

        }


        state.listeners
            .get(name)
            .add(wrapped);


        return () => {

            off(
                name,
                wrapped
            );

        };

    }


    function off(
        name,
        handler
    ) {

        if (
            typeof handler !==
            "function"
        ) {

            return false;

        }


        window.removeEventListener(
            name,
            handler
        );


        const collection =
            state.listeners.get(name);


        if (collection) {

            collection.delete(
                handler
            );


            if (
                collection.size === 0
            ) {

                state.listeners.delete(
                    name
                );

            }

        }


        return true;

    }


    function once(
        name,
        handler
    ) {

        let unsubscribe =
            null;


        const wrapped =
            detail => {

                if (
                    unsubscribe
                ) {

                    unsubscribe();

                }


                handler(
                    detail
                );

            };


        unsubscribe =
            on(
                name,
                wrapped
            );


        return unsubscribe;

    }


    function clearHistory() {

        state.events.length =
            0;

    }


    function getHistory(
        limit = 50
    ) {

        const safeLimit =
            Math.max(
                1,
                Math.min(
                    Number(limit) || 50,
                    state.maxHistory
                )
            );


        return state.events
            .slice(
                -safeLimit
            )
            .map(
                event => ({
                    ...event
                })
            );

    }


    function connectModule(
        moduleName,
        module
    ) {

        if (
            !moduleName ||
            !module
        ) {

            return false;

        }


        HALDO.modules =
            HALDO.modules || {};


        HALDO.modules[
            moduleName
        ] =
            module;


        emit(
            "module:connected",
            {

                name:
                    moduleName,

                module,

                timestamp:
                    timestamp()

            }
        );


        return true;

    }


    function getModule(
        moduleName
    ) {

        if (
            !moduleName
        ) {

            return null;

        }


        return (
            HALDO.modules?.[
                moduleName
            ] ||
            null
        );

    }


    function disconnectModule(
        moduleName
    ) {

        if (
            !HALDO.modules ||
            !HALDO.modules[
                moduleName
            ]
        ) {

            return false;

        }


        delete HALDO.modules[
            moduleName
        ];


        emit(
            "module:disconnected",
            {

                name:
                    moduleName,

                timestamp:
                    timestamp()

            }
        );


        return true;

    }


    function initialize() {

        if (
            state.initialized
        ) {

            return;

        }


        state.initialized =
            true;


        HALDO.events = {

            emit,

            on,

            off,

            once,

            getHistory,

            clearHistory

        };


        HALDO.moduleBridge = {

            connect:
                connectModule,

            get:
                getModule,

            disconnect:
                disconnectModule

        };


        window.HalDoEvents =
            HALDO.events;


        window.HalDoModuleBridge =
            HALDO.moduleBridge;


        emit(
            "haldo:event-bridge:ready",
            {

                version:
                    "20.0.0",

                timestamp:
                    timestamp()

            }
        );


        console.info(
            "%cHalDo AI OS 20%c Event- und Modul-Bridge bereit",
            "color:#42e6ff;font-weight:800;",
            "color:#ffffff;"
        );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once:
                    true
            }
        );

    } else {

        initialize();

    }


})();

<script>
/* =========================================================
   HALDO AI OS 20
   PART 20 — PERSISTENT RUNTIME STATE & STORAGE BRIDGE
   ========================================================= */

(function () {

    "use strict";


    const HALDO =
        window.HalDoOS =
            window.HalDoOS || {};


    const state = {

        initialized:
            false,

        memory:
            {},

        storageAvailable:
            false,

        prefix:
            "haldo-os20:",

        version:
            "20.0.0"

    };


    /* =====================================================
       STORAGE DETECTION
       ===================================================== */

    function detectStorage() {

        try {

            const testKey =
                `${state.prefix}test`;

            window.localStorage.setItem(
                testKey,
                "1"
            );

            window.localStorage.removeItem(
                testKey
            );

            state.storageAvailable =
                true;

        } catch (error) {

            state.storageAvailable =
                false;

            console.warn(
                "[HalDo Storage Bridge]",
                "localStorage nicht verfügbar.",
                error
            );

        }


        return state.storageAvailable;

    }


    /* =====================================================
       SERIALIZATION
       ===================================================== */

    function serialize(
        value
    ) {

        try {

            return JSON.stringify(
                value
            );

        } catch (error) {

            console.warn(
                "[HalDo Storage]",
                "Serialisierung fehlgeschlagen.",
                error
            );

            return null;

        }

    }


    function deserialize(
        value
    ) {

        if (
            typeof value !==
            "string"
        ) {

            return value;

        }


        try {

            return JSON.parse(
                value
            );

        } catch {

            return value;

        }

    }


    /* =====================================================
       KEY MANAGEMENT
       ===================================================== */

    function makeKey(
        key
    ) {

        return (
            state.prefix +
            String(key)
        );

    }


    /* =====================================================
       MEMORY STORAGE
       ===================================================== */

    function memorySet(
        key,
        value
    ) {

        state.memory[
            String(key)
        ] =
            value;

        return true;

    }


    function memoryGet(
        key,
        fallback = null
    ) {

        const normalized =
            String(key);


        if (
            Object.prototype.hasOwnProperty.call(
                state.memory,
                normalized
            )
        ) {

            return state.memory[
                normalized
            ];

        }


        return fallback;

    }


    function memoryRemove(
        key
    ) {

        const normalized =
            String(key);


        if (
            Object.prototype.hasOwnProperty.call(
                state.memory,
                normalized
            )
        ) {

            delete state.memory[
                normalized
            ];

            return true;

        }


        return false;

    }


    /* =====================================================
       SET
       ===================================================== */

    function set(
        key,
        value,
        options = {}
    ) {

        const normalized =
            String(key);


        memorySet(
            normalized,
            value
        );


        if (
            !state.storageAvailable
        ) {

            return true;

        }


        const serialized =
            serialize(
                value
            );


        if (
            serialized === null
        ) {

            return false;

        }


        try {

            window.localStorage.setItem(
                makeKey(
                    normalized
                ),
                serialized
            );


            return true;

        } catch (error) {

            console.warn(
                "[HalDo Storage]",
                "Speichern fehlgeschlagen.",
                normalized,
                error
            );


            if (
                options.strict
            ) {

                return false;

            }


            return true;

        }

    }


    /* =====================================================
       GET
       ===================================================== */

    function get(
        key,
        fallback = null
    ) {

        const normalized =
            String(key);


        if (
            state.storageAvailable
        ) {

            try {

                const raw =
                    window.localStorage.getItem(
                        makeKey(
                            normalized
                        )
                    );


                if (
                    raw !== null
                ) {

                    const value =
                        deserialize(
                            raw
                        );


                    memorySet(
                        normalized,
                        value
                    );


                    return value;

                }

            } catch (error) {

                console.warn(
                    "[HalDo Storage]",
                    "Lesen fehlgeschlagen.",
                    normalized,
                    error
                );

            }

        }


        return memoryGet(
            normalized,
            fallback
        );

    }


    /* =====================================================
       REMOVE
       ===================================================== */

    function remove(
        key
    ) {

        const normalized =
            String(key);


        memoryRemove(
            normalized
        );


        if (
            !state.storageAvailable
        ) {

            return true;

        }


        try {

            window.localStorage.removeItem(
                makeKey(
                    normalized
                )
            );


            return true;

        } catch (error) {

            console.warn(
                "[HalDo Storage]",
                "Entfernen fehlgeschlagen.",
                normalized,
                error
            );


            return false;

        }

    }


    /* =====================================================
       EXISTS
       ===================================================== */

    function has(
        key
    ) {

        const normalized =
            String(key);


        if (
            state.storageAvailable
        ) {

            try {

                return (
                    window.localStorage.getItem(
                        makeKey(
                            normalized
                        )
                    ) !== null
                );

            } catch {

                // Memory fallback below.

            }

        }


        return Object.prototype.hasOwnProperty.call(
            state.memory,
            normalized
        );

    }


    /* =====================================================
       CLEAR HALDO STORAGE ONLY
       ===================================================== */

    function clear(
        options = {}
    ) {

        state.memory = {};


        if (
            !state.storageAvailable
        ) {

            return true;

        }


        try {

            const keys = [];


            for (
                let i = 0;
                i < window.localStorage.length;
                i++
            ) {

                const key =
                    window.localStorage.key(
                        i
                    );


                if (
                    key &&
                    key.startsWith(
                        state.prefix
                    )
                ) {

                    keys.push(
                        key
                    );

                }

            }


            keys.forEach(
                key => {

                    window.localStorage.removeItem(
                        key
                    );

                }
            );


            return true;

        } catch (error) {

            console.warn(
                "[HalDo Storage]",
                "Bereinigung fehlgeschlagen.",
                error
            );


            return !options.strict;

        }

    }


    /* =====================================================
       SNAPSHOT
       ===================================================== */

    function snapshot() {

        return {

            version:
                state.version,

            timestamp:
                Date.now(),

            storageAvailable:
                state.storageAvailable,

            memoryKeys:
                Object.keys(
                    state.memory
                )

        };

    }


    /* =====================================================
       INITIALIZATION
       ===================================================== */

    function initialize() {

        if (
            state.initialized
        ) {

            return HALDO.storageBridge;

        }


        detectStorage();


        state.initialized =
            true;


        HALDO.storageBridge = {

            set,

            get,

            remove,

            has,

            clear,

            snapshot,

            memorySet,

            memoryGet,

            memoryRemove

        };


        window.HalDoStorageBridge =
            HALDO.storageBridge;


        /*
         * Falls bereits ein vollständiges
         * HalDoStorage-Modul vorhanden ist,
         * wird dieses NICHT überschrieben.
         */

        if (
            !window.HalDoStorage
        ) {

            window.HalDoStorage =
                HALDO.storageBridge;

        }


        const kernel =
            window.HalDoKernel ||
            HALDO.kernel;


        if (
            kernel &&
            typeof kernel.emit ===
            "function"
        ) {

            try {

                kernel.emit(
                    "storage:bridge:ready",
                    snapshot()
                );

            } catch (error) {

                console.warn(
                    "[HalDo Storage Bridge]",
                    error
                );

            }

        }


        console.info(
            "%cHalDo AI OS 20%c Persistent Storage Bridge bereit",
            "color:#42e6ff;font-weight:800;",
            "color:#ffffff;"
        );


        return HALDO.storageBridge;

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once:
                    true
            }
        );

    } else {

        initialize();

    }


})();

<script>
/* =========================================================
   HALDO AI OS 20
   PART 21 — APP STATE & SESSION BRIDGE
   ========================================================= */

(function () {

    "use strict";


    const HALDO =
        window.HalDoOS =
            window.HalDoOS || {};


    const state = {

        initialized:
            false,

        activeApp:
            null,

        openApps:
            new Map(),

        sessions:
            new Map(),

        history:
            [],

        maxHistory:
            200

    };


    /* =====================================================
       HELPERS
       ===================================================== */

    function timestamp() {

        return Date.now();

    }


    function normalizeAppId(
        appId
    ) {

        return String(
            appId || ""
        )
            .trim()
            .toLowerCase();

    }


    function emit(
        eventName,
        detail = {}
    ) {

        const bridge =
            HALDO.events ||
            window.HalDoEvents;


        if (
            bridge &&
            typeof bridge.emit ===
            "function"
        ) {

            try {

                bridge.emit(
                    eventName,
                    detail
                );

                return true;

            } catch (error) {

                console.warn(
                    "[HalDo App State]",
                    error
                );

            }

        }


        try {

            window.dispatchEvent(
                new CustomEvent(
                    eventName,
                    {
                        detail
                    }
                )
            );


            return true;

        } catch {

            return false;

        }

    }


    function record(
        type,
        appId,
        detail = {}
    ) {

        state.history.push({

            type,

            appId,

            detail,

            timestamp:
                timestamp()

        });


        if (
            state.history.length >
            state.maxHistory
        ) {

            state.history.shift();

        }

    }


    /* =====================================================
       APP SESSION CREATION
       ===================================================== */

    function createSession(
        appId,
        metadata = {}
    ) {

        const id =
            normalizeAppId(
                appId
            );


        if (!id) {

            return null;

        }


        if (
            state.sessions.has(id)
        ) {

            return state.sessions.get(
                id
            );

        }


        const session = {

            id,

            appId:
                id,

            createdAt:
                timestamp(),

            updatedAt:
                timestamp(),

            active:
                false,

            minimized:
                false,

            maximized:
                false,

            data:
                {},

            metadata:
                {
                    ...metadata
                }

        };


        state.sessions.set(
            id,
            session
        );


        record(
            "session-created",
            id
        );


        emit(
            "app:session:created",
            {
                session
            }
        );


        return session;

    }


    /* =====================================================
       OPEN APP
       ===================================================== */

    function open(
        appId,
        metadata = {}
    ) {

        const id =
            normalizeAppId(
                appId
            );


        if (!id) {

            return null;

        }


        const session =
            createSession(
                id,
                metadata
            );


        session.active =
            true;

        session.minimized =
            false;

        session.updatedAt =
            timestamp();


        state.openApps.set(
            id,
            session
        );


        state.activeApp =
            id;


        record(
            "opened",
            id
        );


        emit(
            "app:opened",
            {
                appId:
                    id,

                session
            }
        );


        return session;

    }


    /* =====================================================
       CLOSE APP
       ===================================================== */

    function close(
        appId
    ) {

        const id =
            normalizeAppId(
                appId
            );


        if (!id) {

            return false;

        }


        const session =
            state.sessions.get(
                id
            );


        if (!session) {

            return false;

        }


        session.active =
            false;

        session.updatedAt =
            timestamp();


        state.openApps.delete(
            id
        );


        if (
            state.activeApp ===
            id
        ) {

            const remaining =
                Array.from(
                    state.openApps.keys()
                );


            state.activeApp =
                remaining.length
                    ? remaining[
                        remaining.length - 1
                    ]
                    : null;

        }


        record(
            "closed",
            id
        );


        emit(
            "app:closed",
            {
                appId:
                    id,

                session
            }
        );


        return true;

    }


    /* =====================================================
       ACTIVATE APP
       ===================================================== */

    function activate(
        appId
    ) {

        const id =
            normalizeAppId(
                appId
            );


        const session =
            state.sessions.get(
                id
            );


        if (!session) {

            return open(
                id
            );

        }


        session.active =
            true;

        session.minimized =
            false;

        session.updatedAt =
            timestamp();


        state.openApps.set(
            id,
            session
        );


        state.activeApp =
            id;


        record(
            "activated",
            id
        );


        emit(
            "app:activated",
            {
                appId:
                    id,

                session
            }
        );


        return session;

    }


    /* =====================================================
       MINIMIZE / MAXIMIZE
       ===================================================== */

    function minimize(
        appId
    ) {

        const id =
            normalizeAppId(
                appId
            );


        const session =
            state.sessions.get(
                id
            );


        if (!session) {

            return false;

        }


        session.minimized =
            true;

        session.active =
            false;

        session.updatedAt =
            timestamp();


        record(
            "minimized",
            id
        );


        emit(
            "app:minimized",
            {
                appId:
                    id,

                session
            }
        );


        return true;

    }


    function maximize(
        appId
    ) {

        const id =
            normalizeAppId(
                appId
            );


        const session =
            state.sessions.get(
                id
            );


        if (!session) {

            return false;

        }


        session.maximized =
            true;

        session.minimized =
            false;

        session.active =
            true;

        session.updatedAt =
            timestamp();


        state.activeApp =
            id;


        record(
            "maximized",
            id
        );


        emit(
            "app:maximized",
            {
                appId:
                    id,

                session
            }
        );


        return true;

    }


    /* =====================================================
       APP DATA
       ===================================================== */

    function setData(
        appId,
        key,
        value
    ) {

        const id =
            normalizeAppId(
                appId
            );


        const session =
            state.sessions.get(
                id
            ) ||
            createSession(
                id
            );


        if (!session) {

            return false;

        }


        session.data[
            String(key)
        ] =
            value;

        session.updatedAt =
            timestamp();


        emit(
            "app:data:changed",
            {

                appId:
                    id,

                key:
                    String(key),

                value

            }
        );


        return true;

    }


    function getData(
        appId,
        key,
        fallback = null
    ) {

        const id =
            normalizeAppId(
                appId
            );


        const session =
            state.sessions.get(
                id
            );


        if (
            !session
        ) {

            return fallback;

        }


        return Object.prototype.hasOwnProperty.call(
            session.data,
            String(key)
        )
            ? session.data[
                String(key)
            ]
            : fallback;

    }


    /* =====================================================
       QUERIES
       ===================================================== */

    function isOpen(
        appId
    ) {

        return state.openApps.has(
            normalizeAppId(
                appId
            )
        );

    }


    function isActive(
        appId
    ) {

        return (
            state.activeApp ===
            normalizeAppId(
                appId
            )
        );

    }


    function getSession(
        appId
    ) {

        return (
            state.sessions.get(
                normalizeAppId(
                    appId
                )
            ) ||
            null
        );

    }


    function getOpenApps() {

        return Array.from(
            state.openApps.values()
        );

    }


    function getHistory(
        limit = 50
    ) {

        const amount =
            Math.max(
                1,
                Math.min(
                    Number(limit) || 50,
                    state.maxHistory
                )
            );


        return state.history
            .slice(
                -amount
            );

    }


    /* =====================================================
       SNAPSHOT
       ===================================================== */

    function snapshot() {

        return {

            activeApp:
                state.activeApp,

            openApps:
                getOpenApps(),

            sessions:
                Array.from(
                    state.sessions.values()
                ),

            history:
                getHistory(
                    state.maxHistory
                ),

            timestamp:
                timestamp()

        };

    }


    /* =====================================================
       INITIALIZATION
       ===================================================== */

    function initialize() {

        if (
            state.initialized
        ) {

            return HALDO.appState;

        }


        state.initialized =
            true;


        HALDO.appState = {

            open,

            close,

            activate,

            minimize,

            maximize,

            createSession,

            getSession,

            setData,

            getData,

            isOpen,

            isActive,

            getOpenApps,

            getHistory,

            snapshot

        };


        window.HalDoAppState =
            HALDO.appState;


        emit(
            "app:state:ready",
            {

                version:
                    "20.0.0",

                timestamp:
                    timestamp()

            }
        );


        console.info(
            "%cHalDo AI OS 20%c App-State- und Session-System bereit",
            "color:#42e6ff;font-weight:800;",
            "color:#ffffff;"
        );


        return HALDO.appState;

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once:
                    true
            }
        );

    } else {

        initialize();

    }


})();
