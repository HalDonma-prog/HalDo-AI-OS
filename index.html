<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#02040a"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<title>HalDo AI OS 22</title>

<style>

/* ============================================================
   HALDO AI OS 22
   PART 1 / 16
   BASE DOCUMENT + GALAXY DISPLAY + LIVING SUN
   ============================================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02040a;
    color: #ffffff;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    min-width: 280px;
    min-height: 220px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

textarea,
input {
    user-select: text;
    -webkit-user-select: text;
}

/* ============================================================
   ROOT
   ============================================================ */

#haldo-os {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(255, 180, 35, 0.08),
            transparent 24%
        ),
        radial-gradient(
            circle at 50% 50%,
            #07101d 0%,
            #02040a 52%,
            #000106 100%
        );
}

/* ============================================================
   GALAXY BACKGROUND
   ============================================================ */

#haldo-galaxy {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at 50% 50%,
            rgba(20, 80, 150, 0.10),
            transparent 55%
        );
}

.haldo-star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow:
        0 0 5px rgba(255,255,255,0.9),
        0 0 12px rgba(150,210,255,0.4);
    opacity: 0.8;
    animation:
        haldo-star-twinkle
        var(--star-duration, 4s)
        ease-in-out
        infinite alternate;
}

.haldo-star.past {
    width: 3px;
    height: 3px;
    opacity: 1;
    box-shadow:
        0 0 7px rgba(255,255,255,1),
        0 0 15px rgba(255,210,100,0.7);
}

@keyframes haldo-star-twinkle {

    0% {
        opacity: 0.28;
        transform: scale(0.75);
    }

    100% {
        opacity: 1;
        transform: scale(1.35);
    }
}

/* ============================================================
   GALAXY NEBULA
   ============================================================ */

.haldo-nebula {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.18;
    pointer-events: none;
}

.haldo-nebula.one {
    width: 42vw;
    height: 22vw;
    left: 5%;
    top: 12%;
    background:
        radial-gradient(
            ellipse,
            rgba(70,120,255,0.65),
            transparent 70%
        );
    transform: rotate(-22deg);
}

.haldo-nebula.two {
    width: 36vw;
    height: 20vw;
    right: 4%;
    bottom: 10%;
    background:
        radial-gradient(
            ellipse,
            rgba(180,70,255,0.5),
            transparent 70%
        );
    transform: rotate(24deg);
}

.haldo-nebula.three {
    width: 30vw;
    height: 16vw;
    left: 35%;
    top: 5%;
    background:
        radial-gradient(
            ellipse,
            rgba(50,220,190,0.35),
            transparent 70%
        );
}

/* ============================================================
   MAIN DISPLAY
   ============================================================ */

#haldo-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
}

/* ============================================================
   SUN SYSTEM
   ============================================================ */

#haldo-solar-system {
    position: relative;
    width: min(76vmin, 820px);
    height: min(76vmin, 820px);
    display: flex;
    align-items: center;
    justify-content: center;
    transform:
        translateZ(0);
}

/* ============================================================
   SOLAR GLOW
   ============================================================ */

.haldo-sun-glow {
    position: absolute;
    width: 31%;
    height: 31%;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,220,1) 0%,
            rgba(255,220,100,0.95) 18%,
            rgba(255,170,35,0.6) 38%,
            rgba(255,120,0,0.18) 62%,
            transparent 76%
        );
    filter: blur(4px);
    animation:
        haldo-sun-breathe
        5s
        ease-in-out
        infinite;
    z-index: 4;
}

@keyframes haldo-sun-breathe {

    0%,
    100% {
        transform: scale(0.96);
        opacity: 0.86;
    }

    50% {
        transform: scale(1.07);
        opacity: 1;
    }
}

/* ============================================================
   SUN RAYS
   ============================================================ */

.haldo-sun-rays {
    position: absolute;
    width: 47%;
    height: 47%;
    border-radius: 50%;
    z-index: 2;
    animation:
        haldo-sun-rays-spin
        32s
        linear
        infinite;
}

.haldo-sun-rays::before,
.haldo-sun-rays::after {
    content: "";
    position: absolute;
    inset: -22%;
    border-radius: 50%;
    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255,220,110,0.0) 0deg,
            rgba(255,220,110,0.0) 7deg,
            rgba(255,220,110,0.30) 8deg,
            rgba(255,220,110,0.0) 12deg,
            rgba(255,220,110,0.0) 20deg
        );
    filter: blur(1px);
}

.haldo-sun-rays::after {
    inset: -30%;
    opacity: 0.35;
    transform: rotate(9deg);
}

@keyframes haldo-sun-rays-spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* ============================================================
   HALDO LIVING LOGO / SUN
   ============================================================ */

#haldo-living-logo {
    position: absolute;
    width: 25%;
    height: 25%;
    min-width: 105px;
    min-height: 105px;
    max-width: 220px;
    max-height: 220px;
    border-radius: 50%;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition:
        transform 0.35s ease,
        filter 0.35s ease;
    animation:
        haldo-living-breathe
        4.5s
        ease-in-out
        infinite;
}

#haldo-living-logo:hover {
    transform: scale(1.04);
    filter:
        brightness(1.12)
        drop-shadow(
            0 0 28px
            rgba(255,210,70,0.75)
        );
}

#haldo-living-logo:active {
    transform: scale(0.96);
}

#haldo-living-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    filter:
        drop-shadow(
            0 0 18px
            rgba(255,200,70,0.7)
        );
}

@keyframes haldo-living-breathe {

    0%,
    100% {
        transform:
            scale(0.97)
            translateY(0);
    }

    50% {
        transform:
            scale(1.025)
            translateY(-2px);
    }
}

/* ============================================================
   ORBITS
   ============================================================ */

.haldo-orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    border:
        1px solid
        rgba(255,255,255,0.13);
    transform:
        translate(-50%, -50%);
    pointer-events: none;
}

.haldo-orbit::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    box-shadow:
        0 0 12px
        rgba(130,190,255,0.12);
}

/* ============================================================
   PLANETS
   ============================================================ */

.haldo-planet {
    position: absolute;
    width: var(--planet-size, 14px);
    height: var(--planet-size, 14px);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    margin-left:
        calc(
            var(--planet-size, 14px) / -2
        );
    margin-top:
        calc(
            var(--planet-size, 14px) / -2
        );
    transform:
        rotate(var(--start-angle, 0deg))
        translateX(var(--orbit-radius, 100px))
        rotate(calc(var(--start-angle, 0deg) * -1));
    background:
        radial-gradient(
            circle at 30% 28%,
            rgba(255,255,255,0.95),
            var(--planet-color, #55aaff) 38%,
            rgba(0,0,0,0.6) 100%
        );
    box-shadow:
        0 0 8px
        var(--planet-glow, rgba(100,180,255,0.75)),
        0 0 18px
        var(--planet-glow, rgba(100,180,255,0.35));
    z-index: 7;
}

.haldo-planet::after {
    content: "";
    position: absolute;
    width: 150%;
    height: 42%;
    left: -25%;
    top: 29%;
    border:
        1px solid
        rgba(255,255,255,0.35);
    border-radius: 50%;
    transform: rotate(-20deg);
    opacity: var(--ring-opacity, 0);
}

.haldo-planet.hour {
    --planet-color: #55aaff;
    --planet-glow: rgba(85,170,255,0.8);
}

.haldo-planet.minute {
    --planet-color: #ff66c4;
    --planet-glow: rgba(255,102,196,0.8);
}

.haldo-planet.second {
    --planet-color: #72ff9a;
    --planet-glow: rgba(114,255,154,0.8);
}

.haldo-planet.earth {
    --planet-color: #3b8cff;
    --planet-glow: rgba(60,150,255,0.85);
}

.haldo-planet.moon {
    --planet-color: #d9e1e8;
    --planet-glow: rgba(220,235,255,0.65);
}

.haldo-planet.saturn {
    --planet-color: #e6b86a;
    --planet-glow: rgba(255,210,120,0.75);
    --ring-opacity: 0.85;
}

.haldo-planet.red {
    --planet-color: #ff5b48;
    --planet-glow: rgba(255,80,60,0.8);
}

.haldo-planet.blue {
    --planet-color: #4b7dff;
    --planet-glow: rgba(80,120,255,0.8);
}

.haldo-planet.green {
    --planet-color: #51e08c;
    --planet-glow: rgba(80,230,140,0.8);
}

.haldo-planet.purple {
    --planet-color: #a86dff;
    --planet-glow: rgba(170,100,255,0.8);
}

.haldo-planet.gold {
    --planet-color: #ffc94d;
    --planet-glow: rgba(255,205,70,0.85);
}

.haldo-planet.cyan {
    --planet-color: #39e7ef;
    --planet-glow: rgba(50,230,240,0.85);
}

/* ============================================================
   BOTTOM SYSTEM LABEL
   ============================================================ */

#haldo-system-label {
    position: absolute;
    left: 50%;
    bottom:
        max(
            18px,
            env(safe-area-inset-bottom)
        );
    transform:
        translateX(-50%);
    z-index: 30;
    text-align: center;
    pointer-events: none;
}

#haldo-system-title {
    font-size:
        clamp(
            16px,
            2.1vw,
            24px
        );
    font-weight: 700;
    letter-spacing: 0.08em;
    text-shadow:
        0 0 12px
        rgba(255,255,255,0.35);
}

#haldo-system-subtitle {
    margin-top: 5px;
    font-size:
        clamp(
            10px,
            1.2vw,
            14px
        );
    color:
        rgba(255,255,255,0.68);
}

/* ============================================================
   START OVERLAY
   ============================================================ */

#haldo-start-overlay {
    position: absolute;
    inset: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(10,25,50,0.08),
            rgba(0,2,8,0.78)
        );
    backdrop-filter:
        blur(3px);
    -webkit-backdrop-filter:
        blur(3px);
    transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
}

#haldo-start-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.haldo-start-card {
    width:
        min(
            440px,
            calc(100vw - 36px)
        );
    padding:
        28px 24px;
    border-radius: 24px;
    border:
        1px solid
        rgba(255,255,255,0.15);
    background:
        rgba(7,13,25,0.72);
    box-shadow:
        0 20px 80px
        rgba(0,0,0,0.5),
        inset 0 1px 0
        rgba(255,255,255,0.08);
    text-align: center;
}

.haldo-start-logo {
    width: 92px;
    height: 92px;
    margin: 0 auto 16px;
    object-fit: contain;
    filter:
        drop-shadow(
            0 0 20px
            rgba(255,210,80,0.7)
        );
}

.haldo-start-title {
    font-size:
        clamp(
            22px,
            5vw,
            34px
        );
    font-weight: 800;
}

.haldo-start-description {
    margin-top: 8px;
    color:
        rgba(255,255,255,0.7);
    line-height: 1.5;
}

#haldo-start-button {
    margin-top: 22px;
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 16px;
    color: #031007;
    background:
        linear-gradient(
            135deg,
            #75ff9d,
            #24e66a
        );
    font-weight: 800;
    letter-spacing: 0.04em;
    box-shadow:
        0 0 20px
        rgba(50,255,120,0.28);
    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

#haldo-start-button:hover {
    transform: translateY(-1px);
    box-shadow:
        0 0 30px
        rgba(50,255,120,0.5);
}

#haldo-start-button:active {
    transform: scale(0.98);
}

/* ============================================================
   TOP MENU
   ============================================================ */

#haldo-menu-button {
    position: absolute;
    top:
        max(
            14px,
            env(safe-area-inset-top)
        );
    right:
        max(
            14px,
            env(safe-area-inset-right)
        );
    z-index: 700;
    width: 48px;
    height: 48px;
    border-radius: 15px;
    border:
        1px solid
        rgba(255,255,255,0.14);
    color: #ffffff;
    background:
        rgba(8,14,27,0.68);
    backdrop-filter:
        blur(14px);
    -webkit-backdrop-filter:
        blur(14px);
    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.3);
    font-size: 24px;
}

#haldo-menu-button:active {
    transform: scale(0.94);
}

/* ============================================================
   MENU PANEL
   ============================================================ */

#haldo-menu-panel {
    position: absolute;
    top:
        max(
            70px,
            calc(
                env(safe-area-inset-top) + 58px
            )
        );
    right:
        max(
            12px,
            env(safe-area-inset-right)
        );
    width:
        min(
            380px,
            calc(100vw - 24px)
        );
    max-height:
        calc(
            100vh - 90px
        );
    overflow: hidden;
    z-index: 690;
    border-radius: 22px;
    border:
        1px solid
        rgba(255,255,255,0.14);
    background:
        rgba(5,10,20,0.88);
    backdrop-filter:
        blur(24px);
    -webkit-backdrop-filter:
        blur(24px);
    box-shadow:
        0 30px 90px
        rgba(0,0,0,0.55);
    opacity: 0;
    visibility: hidden;
    transform:
        translateY(-8px)
        scale(0.98);
    transform-origin: top right;
    transition:
        opacity 0.2s ease,
        visibility 0.2s ease,
        transform 0.2s ease;
}

#haldo-menu-panel.open {
    opacity: 1;
    visibility: visible;
    transform:
        translateY(0)
        scale(1);
}

#haldo-menu-header {
    padding: 18px;
    border-bottom:
        1px solid
        rgba(255,255,255,0.08);
}

#haldo-menu-title {
    font-size: 18px;
    font-weight: 800;
}

#haldo-menu-search {
    width: 100%;
    margin-top: 12px;
    min-height: 42px;
    padding:
        0 13px;
    border-radius: 13px;
    border:
        1px solid
        rgba(255,255,255,0.12);
    outline: none;
    color: #ffffff;
    background:
        rgba(255,255,255,0.06);
}

#haldo-menu-search:focus {
    border-color:
        rgba(100,180,255,0.5);
}

#haldo-menu-apps {
    padding: 12px;
    overflow-y: auto;
    max-height:
        calc(
            100vh - 190px
        );
    -webkit-overflow-scrolling: touch;
}

.haldo-menu-app {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    margin-bottom: 7px;
    border: 0;
    border-radius: 14px;
    color: #ffffff;
    background:
        rgba(255,255,255,0.045);
    text-align: left;
    transition:
        background 0.18s ease,
        transform 0.18s ease;
}

.haldo-menu-app:hover {
    background:
        rgba(255,255,255,0.09);
    transform:
        translateX(-2px);
}

.haldo-menu-app:active {
    transform:
        scale(0.98);
}

.haldo-menu-app-icon {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background:
        rgba(255,255,255,0.07);
    font-size: 20px;
    flex: 0 0 auto;
}

.haldo-menu-app-info {
    min-width: 0;
}

.haldo-menu-app-name {
    font-weight: 700;
}

.haldo-menu-app-category {
    margin-top: 2px;
    font-size: 11px;
    color:
        rgba(255,255,255,0.52);
}

/* ============================================================
   APP WINDOW HOST
   ============================================================ */

#haldo-window-host {
    position: absolute;
    inset: 0;
    z-index: 600;
    pointer-events: none;
}

/* ============================================================
   APP WINDOW
   ============================================================ */

.haldo-app-window {
    position: absolute;
    width:
        min(
            680px,
            calc(100vw - 40px)
        );
    height:
        min(
            540px,
            calc(100vh - 100px)
        );
    min-width: 280px;
    min-height: 220px;
    max-width:
        calc(
            100vw - 24px
        );
    max-height:
        calc(
            100vh - 70px
        );
    overflow: hidden;
    pointer-events: auto;
    border-radius: 20px;
    border:
        1px solid
        rgba(255,255,255,0.14);
    background:
        rgba(6,11,21,0.94);
    backdrop-filter:
        blur(22px);
    -webkit-backdrop-filter:
        blur(22px);
    box-shadow:
        0 30px 100px
        rgba(0,0,0,0.58),
        inset 0 1px 0
        rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
}

.haldo-app-window.haldo-window-maximized {
    left: 8px !important;
    top: 8px !important;
    width:
        calc(
            100vw - 16px
        ) !important;
    height:
        calc(
            100vh - 16px
        ) !important;
    max-width: none;
    max-height: none;
    border-radius: 16px;
}

.haldo-app-window.haldo-window-minimized
.haldo-window-body {
    display: none;
}

.haldo-window-header {
    min-height: 48px;
    padding:
        6px 8px 6px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom:
        1px solid
        rgba(255,255,255,0.08);
    cursor: grab;
    flex: 0 0 auto;
}

.haldo-window-header:active {
    cursor: grabbing;
}

.haldo-window-title {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
}

.haldo-window-icon {
    font-size: 19px;
}

.haldo-window-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-weight: 750;
}

.haldo-window-controls {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
}

.haldo-window-controls button {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 10px;
    color: #ffffff;
    background:
        rgba(255,255,255,0.06);
}

.haldo-window-controls button:hover {
    background:
        rgba(255,255,255,0.12);
}

.haldo-window-controls
.haldo-window-close:hover {
    background:
        rgba(255,75,75,0.28);
}

.haldo-window-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
}

.haldo-app-content {
    width: 100%;
    min-height: 100%;
}

/* ============================================================
   RESPONSIVE WINDOW
   ============================================================ */

@media (max-width: 600px) {

    #haldo-solar-system {
        width: 82vmin;
        height: 82vmin;
    }

    .haldo-app-window {
        width:
            calc(
                100vw - 20px
            );
        height:
            min(
                600px,
                calc(
                    100vh - 35px
                )
            );
        max-width:
            calc(
                100vw - 20px
            );
        max-height:
            calc(
                100vh - 25px
            );

                        ) {

                        }

                            !this.listeners.has(
                                event
                            )
                        ) {

                                event,
                                new Set()
                            );

                            );

                            callback
                        );

                            listeners.delete(
                                callback
                            );

                once:
                    function(

                        callback

                    function(

                        payload

                            this.listeners.get(
                                event
                            );

                            return;

                        }

                            ...listeners
                        ].forEach(
                            callback => {

                                try {

                                    callback(
                                        payload
                                    );

                                }

                                catch(error) {

                                    HD.errors.report(
                                        error,
                                        "event:" +
                                        event
                                    );

                    this.lifecycle =
                        "stopping";


                    for (
                        const record
                        of records
                    ) {

                        const component =
                            record.component;

                        try {

                            if (
                                component &&
                                typeof component.stop ===
                                "function"
                            ) {

                                await component.stop();

                            }

                        }

                        catch(error) {

                            HD.errors.report(
                                error,
                                "runtime:" +
                                record.name +
                                ":stop"
                            );

                        }

                        record.started =
                            false;

                    }


                    this.started =
                        false;

                    this.lifecycle =
                        "stopped";


                    HD.emit(
                        "runtime:stopped"
                    );

                    return true;

                }

    <script>
        "use strict";

        /*
         * ========================================================
         * STORAGE
         * ========================================================
         *
         * Falls storage.js später geladen wird, bleibt dieses
         * Fallback kompatibel.
         */

        HD.storage =
            HD.storage || {};

        HD.storage.prefix =
            HD.constants.storagePrefix;


        HD.storage.memory =
            HD.storage.memory ||
            new Map();


        HD.storage.serialize =
            function(
                value
            ) {

                try {

                    return JSON.stringify(
                        value
                    );

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "storage:serialize"
                    );

                    return null;

                }

            };


        HD.storage.deserialize =
            function(
                value,
                fallback = null
            ) {

                if (
                    value === null ||
                    value === undefined
                ) {

                    return fallback;

                }

                try {

                    return JSON.parse(
                        value
                    );

                }

                catch {

                    return value;

                }

            };


        HD.storage.key =
            function(
                key
            ) {

                return (
                    this.prefix +
                    String(key)
                );

            };


        HD.storage.set =
            function(
                key,
                value
            ) {

                const storageKey =
                    this.key(
                        key
                    );


                this.memory.set(
                    storageKey,
                    value
                );


                try {

                    const serialized =
                        this.serialize(
                            value
                        );

                    if (
                        serialized !==
                        null
                    ) {

                        localStorage.setItem(
                            storageKey,
                            serialized
                        );

                    }

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "storage:set"
                    );

                }


                HD.emit(
                    "storage:set",
                    {
                        key,
                        value
                    }
                );


                return value;

            };


        HD.storage.get =
            function(
                key,
                fallback = null
            ) {

                const storageKey =
                    this.key(
                        key
                    );


                try {

                    const stored =
                        localStorage.getItem(
                            storageKey
                        );

                    if (
                        stored !== null
                    ) {

                        const value =
                            this.deserialize(
                                stored,
                                fallback
                            );

                        this.memory.set(
                            storageKey,
                            value
                        );

                        return value;

                    }

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "storage:get"
                    );

                }


                if (
                    this.memory.has(
                        storageKey
                    )
                ) {

                    return this.memory.get(
                        storageKey
                    );

                }


                return fallback;

            };


        HD.storage.remove =
            function(
                key
            ) {

                const storageKey =
                    this.key(
                        key
                    );


                this.memory.delete(
                    storageKey
                );


                try {

                    localStorage.removeItem(
                        storageKey
                    );

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "storage:remove"
                    );

                }


                HD.emit(
                    "storage:remove",
                    {
                        key
                    }
                );

            };


        HD.storage.clear =
            function()
            {

                const prefix =
                    this.prefix;


                [
                    ...this.memory.keys()
                ]
                .forEach(
                    key => {

                        if (
                            String(key)
                                .startsWith(
                                    prefix
                                )
                        ) {

                            this.memory.delete(
                                key
                            );

                        }

                    }
                );


                try {

                    for (
                        let i =
                            localStorage.length -
                            1;

                        i >= 0;

                        i--
                    ) {

                        const key =
                            localStorage.key(
                                i
                            );

                        if (
                            key &&
                            key.startsWith(
                                prefix
                            )
                        ) {

                            localStorage.removeItem(
                                key
                            );

                        }

                    }

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "storage:clear"
                    );

                }


                HD.emit(
                    "storage:clear"
                );

            };


        /*
         * ========================================================
         * STORAGE RUNTIME CONNECTION
         * ========================================================
         */

        const storageRuntime =
            HD.runtime.getRecord(
                "storage"
            );


        if (
            storageRuntime
        ) {

            storageRuntime.component =
                HD.storage;

        }
        else {

            HD.runtime.register(
                "storage",
                HD.storage,
                {
                    priority:
                        40,

                    required:
                        false,

                    service:
                        true
                }
            );

        }


        HD.emit(
            "storage:foundation-ready"
        );

    </script>

    <script>
        "use strict";

        HD.persistence =
            HD.persistence || {};


        HD.persistence.enabled =
            HD.config.persistenceEnabled;


        HD.persistence.save =
            function(
                key,
                value
            ) {

                if (
                    !this.enabled
                ) {

                    return false;

                }

                try {

                    HD.storage.set(
                        "persistence:" + key,
                        value
                    );

                    HD.emit(
                        "persistence:saved",
                        {
                            key,
                            value
                        }
                    );

                    return true;

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "persistence:save"
                    );

                    return false;

                }

            };


        HD.persistence.load =
            function(
                key,
                fallback = null
            ) {

                if (
                    !this.enabled
                ) {

                    return fallback;

                }

                try {

                    return HD.storage.get(
                        "persistence:" + key,
                        fallback
                    );

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "persistence:load"
                    );

                    return fallback;

                }

            };


        HD.persistence.remove =
            function(
                key
            ) {

                HD.storage.remove(
                    "persistence:" + key
                );

            };


        HD.persistence.saveState =
            function()
            {

                return this.save(
                    "system-state",
                    HD.state
                );

            };


        HD.persistence.restoreState =
            function()
            {

                const state =
                    this.load(
                        "system-state",

                    );


                if (
                    state &&
                    typeof state ===
                    "object"
                ) {

                    HD.state = {

                    };

                HD.emit(
                    "persistence:restored",
                    {
                        state:

                    }

                return HD.state;

            };

            HD.persistence,
            {

                    50,

                required:
                    false,

                service:
                    true
            }
        );

            "persistence:foundation-ready"
        );

        HD.network.requests =

        HD.network.requestId =
            0;


        HD.network.isOnline =
            function() {

                return (
                    navigator.onLine === true
                );

            };


        HD.network.fetch =
            async function(
                url,
                options = {}
            ) {

                if (
                    typeof url !==
                    "string" ||
                    !url
                ) {

                    throw new Error(
                        "Network URL fehlt."
                    );

                }

                const id =
                    ++this.requestId;

                const controller =
                    new AbortController();

                this.requests.set(
                    id,
                    controller
                );


                try {

                    const response =
                        await fetch(
                            url,
                            {
                                ...options,
                                signal:
                                    controller.signal
                            }
                        );


                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            "HTTP " +
                            response.status
                        );

                    }


                    HD.emit(
                        "network:response",
                        {
                            id,
                            url,
                            status:
                                response.status
                        }
                    );


                    return response;

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "network:fetch"
                    );

                    throw error;

                }

                finally {

                    this.requests.delete(
                        id
                    );

                }

            };


        HD.network.cancel =
            function(
                id
            ) {

                const controller =
                    this.requests.get(
                        id
                    );

                if (
                    controller
                ) {

                    controller.abort();

                    this.requests.delete(
                        id
                    );

                    return true;

                }

                return false;

        HD.network.getJSON =
            async function(
                url,
                options = {}
            ) {

                    await this.fetch(
                        url,
                        {
                            ...options,

                                    "application/json",
                                ...(options.headers || {})
                            }
                        }
                    );

                return response.json();

        HD.network.postJSON =
            async function(
                url,
                data,
                options = {}
            ) {

                const response =
                    await this.fetch(
                        url,
                        {
                            method:
                                "POST",

                            ...options,

                            headers: {
                                "Content-Type":
                                    "application/json",

                                Accept:
                                    "application/json",

                                ...(options.headers || {})
                            },

                            body:
                                JSON.stringify(
                                    data
                                )

                        }
                    );

                return response.json();

        /* ========================================================
           SECURITY

        HD.security =

        HD.security.initialized =

        HD.security.sessionId =
            HD.security.sessionId ||
            (
                "HD-" +
                Date.now().toString(36) +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2, 10)
            );


        HD.security.sanitizeText =
            function(
                value
            ) {

                if (
                    value === null ||
                    value === undefined
                ) {

                    return "";

                }

                return String(
                    value
                )
                .replace(
                    /[<>]/g,
                    ""
                );

            };


        HD.security.escapeHTML =
            function(
                value
            ) {

                return String(
                    value ??
                    ""
                )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

            };


        HD.security.createToken =
            function(
                length = 32
            ) {

                const chars =
                    "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
                    "abcdefghijklmnopqrstuvwxyz" +
                    "0123456789";

                let token = "";

                for (
                    let i = 0;
                    i < length;
                    i++
                ) {

                    token +=
                        chars[
                            Math.floor(
                                Math.random() *
                                chars.length
                            )
                        ];

                }

                return token;

            };


        HD.security.hash =
            async function(
                value
            ) {

                const text =
                    String(
                        value ?? ""
                    );

                if (
                    window.crypto &&
                    window.crypto.subtle &&
                    window.TextEncoder
                ) {

                    const data =
                        new TextEncoder()
                            .encode(
                                text
                            );

                    const hash =
                        await crypto.subtle.digest(
                            "SHA-256",
                            data
                        );

                    return Array
                        .from(
                            new Uint8Array(
                                hash
                            )
                        )
                        .map(
                            byte =>
                                byte
                                    .toString(16)
                                    .padStart(
                                        2,
                                        "0"
                                    )
                        )
                        .join("");

                }

                /* Fallback für lokale/offline Nutzung */

                let hash = 0;

                for (
                    let i = 0;
                    i < text.length;
                    i++
                ) {

                    hash =
                        (
                            (
                                hash << 5
                            ) -
                            hash
                        ) +
                        text.charCodeAt(
                            i
                        );

                    hash |= 0;

                }

                return String(
                    hash >>> 0
                );

            };


        HD.security.validateAppId =
            function(

        HD.ui.create =

            ) {

                    document.createElement(
                        tag
                    );


                if (
                    options.id
                ) {

                    element.id =
                        options.id;

                }


                if (
                    options.className
                ) {

                    element.className =
                        options.className;

                }


                if (

                ) {

                }


                if (

                    undefined
                ) {

                    element.innerHTML =
                        options.html;

                if (
                    options.attributes
                ) {

                    Object.entries(
                        options.attributes
                    )

                                key,
                                value
                            ]
                        ) => {

        HD.ui.menu.openMenu =
            function() {

                const menu =
                    this.create();


                this.render();


                menu.classList.add(
                    "is-open"
                );


                HD.ui.menu.open =
                    true;


                HD.emit(
                    "menu:open"
                );

        HD.ui.menu.close =
            function() {

                const menu =
                    document.getElementById(
                        "haldo-app-menu"
                    );


                if (
                    menu
                ) {

                    menu.classList.remove(
                        "is-open"
                    );

                }


                HD.ui.menu.open =
                    false;


                HD.emit(
                    "menu:close"
                );

            };


        HD.ui.menu.toggle =
            function() {

                if (
                    this.open
                ) {

                    this.close();

                }
                else {

                    this.openMenu();

                }

            };


        HD.ui.menu.render =
            function(
                filter = ""
            ) {

                const menu =
                    this.create();


                const list =
                    menu.querySelector(
                        ".haldo-menu-list"
                    );


                if (
                    !list
                ) {

                    return;

                }


                const apps =
                    HD.apps &&
                    typeof HD.apps.getAll ===
                    "function"
                        ? HD.apps.getAll()
                        : [];


                const normalized =
                    String(
                        filter
                    )
                    .trim()
                    .toLowerCase();


                list.innerHTML = "";


                apps
                    .filter(
                        app => {

                            if (
                                !normalized
                            ) {

                                return true;

                            }


                            return (
                                String(
                                    app.name ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(
                                    normalized
                                ) ||

                                String(
                                    app.description ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(
                                    normalized
                                )

                            );

                        }
                    )
                    .forEach(
                        app => {

                            const button =
                                HD.ui.create(
                                    "button",
                                    {
                                        className:
                                            "haldo-app-menu-item"
                                    }
                                );


                            button.dataset.appId =
                                app.id;


                            button.innerHTML = `
                                <span
                                    class="haldo-app-icon"
                                >${HD.security.escapeHTML(
                                    app.icon || "◉"
                                )}</span>

                                <span
                                    class="haldo-app-info"
                                >
                                    <strong>
                                        ${HD.security.escapeHTML(
                                            app.name ||
                                            app.id
                                        )}
                                    </strong>

                                    <small>
                                        ${HD.security.escapeHTML(
                                            app.description ||
                                            "HalDo Anwendung"
                                        )}
                                    </small>
                                </span>
                            `;


                            button.addEventListener(
                                "click",
                                function() {

                                    HD.ui.menu.close();

                                    HD.apps.open(
                                        app.id
                                    );

                                }
                            );


                            list.appendChild(
                                button
                            );

                        }
                    );

            };


        HD.ui.menu.filter =
            function(
                value
            ) {

                this.render(
                    value
                );

            };


        /* ========================================================
           WINDOW SYSTEM
           ======================================================== */

        HD.ui.window =
            function(
                options = {}
            ) {

                const id =
                    options.id ||
                    (
                        "hd-window-" +
                        ++HD.ui.windowCounter
                    );


                const title =
                    options.title ||
                    "HalDo App";


                const width =
                    options.width ||
                    520;


                const height =
                    options.height ||
                    430;


                const windowElement =
                    HD.ui.create(
                        "section",
                        {
                            id,

                            className:
                                "haldo-window"
                        }
                    );


                windowElement.dataset.appId =
                    options.appId ||
                    "";


                windowElement.innerHTML = `
                    <header
                        class="haldo-window-header"
                    >
                        <div
                            class="haldo-window-title"
                        >
                            <span
                                class="haldo-window-icon"
                            >${HD.security.escapeHTML(
                                options.icon || "◉"
                            )}</span>

                            <strong>
                                ${HD.security.escapeHTML(
                                    title
                                )}
                            </strong>
                        </div>

                        <div
                            class="haldo-window-controls"
                        >
                            <button
                                type="button"
                                data-action="minimize"
                                aria-label="Minimieren"
                            >−</button>

                            <button
                                type="button"
                                data-action="maximize"
                                aria-label="Maximieren"
                            >□</button>

                            <button
                                type="button"
                                data-action="close"
                                aria-label="Schließen"
                            >×</button>
                        </div>
                    </header>

                    <div
                        class="haldo-window-body"
                    ></div>
                `;


                windowElement.style.width =
                    Math.min(
                        width,
                        Math.max(
                            300,
                            window.innerWidth -
                            32
                        )
                    ) + "px";


                windowElement.style.height =
                    Math.min(
                        height,
                        Math.max(
                            220,
                            window.innerHeight -
                            100
                        )
                    ) + "px";


                const desktop =
                    HD.ui.getDesktop();


                if (
                    desktop
                ) {

                    desktop.appendChild(
                        windowElement
                    );

                }
                else {

                    document.body.appendChild(
                        windowElement
                    );

                }


                const record = {

                    id,

                    appId:
                        options.appId ||
                        "",

                    element:
                        windowElement,

                    minimized:
                        false,

                    maximized:
                        false,

                    previous:
                        null

                };


                HD.ui.windows.set(
                    id,
                    record
                );


                /* ------------------------------------------------
                   ONE-CLICK CLOSE
                   ------------------------------------------------ */

                const closeButton =
                    windowElement.querySelector(
                        '[data-action="close"]'
                    );


                closeButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();

                        HD.ui.closeWindow(
                            id
                        );

                    }
                );


                const minimizeButton =
                    windowElement.querySelector(
                        '[data-action="minimize"]'
                    );


                minimizeButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();

                        HD.ui.minimizeWindow(
                            id
                        );

                    }
                );


                const maximizeButton =
                    windowElement.querySelector(
                        '[data-action="maximize"]'
                    );


                maximizeButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();

                        HD.ui.maximizeWindow(
                            id
                        );

                    }
                );


                windowElement.addEventListener(
                    "pointerdown",
                    function() {

                        HD.ui.focusWindow(
                            id
                        );

                    }
                );


                this.makeDraggable(
                    record
                );


                this.focusWindow(
                    id
                );


                return record;

            };


        HD.ui.getWindow =
            function(
                id
            ) {

                return this.windows.get(
                    id
                ) || null;

            };


        HD.ui.closeWindow =
            function(
                id
            ) {

                const record =
                    this.getWindow(
                        id
                    );


                if (
                    !record
                ) {

                    return false;

                }


                if (
                    record.element &&
                    record.element.parentNode
                ) {

                    record.element.parentNode
                        .removeChild(
                            record.element
                        );

                }


                this.windows.delete(
                    id
                );


                if (
                    this.activeWindow ===
                    id
                ) {

                    this.activeWindow =
                        null;

                }


                HD.emit(
                    "window:closed",
                    {
                        id,
                        appId:
                            record.appId
                    }
                );


                return true;

            };


        HD.ui.focusWindow =
            function(
                id
            ) {

                const record =
                    this.getWindow(
                        id
                    );


                if (
                    !record
                ) {

                    return false;

                }


                let highest =
                    100;


                this.windows.forEach(
                    item => {

                        highest =
                            Math.max(
                                highest,
                                Number(
                                    item.element
                                        .style
                                        .zIndex
                                ) || 100
                            );

                    }
                );


                record.element.style.zIndex =
                    String(
                        highest + 1
                    );


                this.activeWindow =
                    id;


                HD.emit(
                    "window:focused",
                    {
                        id,
                        appId:
                            record.appId
                    }
                );


                return true;

            };


        HD.ui.minimizeWindow =
            function(
                id
            ) {

                const record =
                    this.getWindow(
                        id
                    );


                if (
                    !record
                ) {

                    return false;

                }


                record.minimized =
                    !record.minimized;


                record.element.classList.toggle(
                    "is-minimized",
                    record.minimized
                );


                HD.emit(
                    "window:minimized",
                    {
                        id,
                        minimized:
                            record.minimized
                    }
                );


                return true;

            };


        HD.ui.maximizeWindow =
            function(
                id
            ) {

                const record =
                    this.getWindow(
                        id
                    );


                if (
                    !record
                ) {

                    return false;

                }


                if (
                    !record.maximized
                ) {

                    record.previous = {

                        width:
                            record.element
                                .style
                                .width,

                        height:
                            record.element
                                .style
                                .height,

                        left:
                            record.element
                                .style
                                .left,

                        top:
                            record.element
                                .style
                                .top

                    };


                    record.element.classList.add(
                        "is-maximized"
                    );


                    record.element.style.width =
                        "min(92vw, 1100px)";

                    record.element.style.height =
                        "min(86vh, 760px)";

                    record.element.style.left =
                        "50%";

                    record.element.style.top =
                        "50%";

                    record.element.style.transform =
                        "translate(-50%, -50%)";


                    record.maximized =
                        true;

                }
                else {

                    record.element.classList.remove(
                        "is-maximized"
                    );


                    if (
                        record.previous
                    ) {

                        record.element.style.width =
                            record.previous.width;

                        record.element.style.height =
                            record.previous.height;

                        record.element.style.left =
                            record.previous.left;

                        record.element.style.top =
                            record.previous.top;

                    }


                    record.element.style.transform =
                        "";


                    record.maximized =
                        false;

                }


                HD.emit(
                    "window:maximized",
                    {
                        id,
                        maximized:
                            record.maximized
                    }
                );


                this.focusWindow(
                    id
                );


                return true;

            };


        /* ========================================================
           DRAGGING
           ======================================================== */

        HD.ui.makeDraggable =
            function(
                record
            ) {

                const header =
                    record.element.querySelector(
                        ".haldo-window-header"
                    );


                if (
                    !header
                ) {

                    return;

                }


                let dragging =
                    false;

                let startX =
                    0;

                let startY =
                    0;

                let startLeft =
                    0;

                let startTop =
                    0;


                header.addEventListener(
                    "pointerdown",
                    function(event) {

                        if (
                            event.target.closest(
                                ".haldo-window-controls"
                            )
                        ) {

                            return;

                        }


                        if (
                            record.maximized
                        ) {

                            return;

                        }


                        dragging =
                            true;

                        header.setPointerCapture(
                            event.pointerId
                        );


                        const rect =
                            record.element
                                .getBoundingClientRect();


                        startX =
                            event.clientX;

                        startY =
                            event.clientY;

                        startLeft =
                            rect.left;

                        startTop =
                            rect.top;


                        record.element.style.left =
                            rect.left + "px";

                        record.element.style.top =
                            rect.top + "px";

                        record.element.style.transform =
                            "none";


                        event.preventDefault();

                    }
                );


                header.addEventListener(
                    "pointermove",
                    function(event) {

                        if (
                            !dragging
                        ) {

                            return;

                        }


                        const dx =
                            event.clientX -
                            startX;

                        const dy =
                            event.clientY -
                            startY;


                        record.element.style.left =
                            (
                                startLeft +
                                dx
                            ) + "px";


                        record.element.style.top =
                            (
                                startTop +
                                dy
                            ) + "px";


                    }
                );


                const stopDrag =
                    function(event) {

                        if (
                            !dragging
                        ) {

                            return;

                        }


                        dragging =
                            false;


                        try {

                            header.releasePointerCapture(
                                event.pointerId
                            );

                        }

                        catch {}

                        HD.ui.keepWindowInsideViewport(
                            record
                        );

                    };


                header.addEventListener(
                    "pointerup",
                    stopDrag
                );

                header.addEventListener(
                    "pointercancel",
                    stopDrag
                );

            };


        HD.ui.keepWindowInsideViewport =
            function(
                record
            ) {

                if (
                    !record ||
                    !record.element ||
                    record.maximized
                ) {

                    return;

                }


                const rect =
                    record.element
                        .getBoundingClientRect();


                const margin =
                    8;


                let left =
                    rect.left;

                let top =
                    rect.top;


                const maxLeft =
                    window.innerWidth -
                    rect.width -
                    margin;


                const maxTop =
                    window.innerHeight -
                    rect.height -
                    margin;


                left =
                    Math.max(
                        margin,
                        Math.min(
                            left,
                            Math.max(
                                margin,
                                maxLeft
                            )
                        )
                    );


                top =
                    Math.max(
                        margin,
                        Math.min(
                            top,
                            Math.max(
                                margin,
                                maxTop
                            )
                        )
                    );


                record.element.style.left =
                    left + "px";

                record.element.style.top =
                    top + "px";

                record.element.style.transform =
                    "none";

            };


        HD.ui.keepWindowsInsideViewport =
            function() {

                this.windows.forEach(
                    record => {

                        this.keepWindowInsideViewport(
                            record
                        );

                    }
                );

            };


        /* ========================================================
           UI FOUNDATION READY
           ======================================================== */

        HD.ui.initialized =
            true;


        HD.runtime.register(
            "ui",
            HD.ui,
            {
                priority:
                    100,

                required:
                    true,

                service:
                    true
            }
        );


        HD.emit(
            "ui:foundation-ready"
        );

    </script>
