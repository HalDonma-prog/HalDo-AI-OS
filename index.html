    async function loadScript(
        src
    ) {

        return new Promise(
            (
                resolve,
                reject
            ) => {

                /*
                 * Prevent duplicate loading.
                 */

                if (
                    document.querySelector(
                        'script[data-haldo-src="' +
                        src +
                        '"]'
                    )
                ) {

                    resolve();

                    return;

                }


                const script =
                    document.createElement(
                        "script"
                    );

                script.src =
                    src;

                script.defer =
                    true;

                script.dataset.haldoSrc =
                    src;


                script.onload =
                    () => {

                        resolve();

                    };


                script.onerror =
                    () => {

                        console.warn(
                            "[HalDo] Optional module could not be loaded:",
                            src
                        );

                        /*
                         * Do not stop the whole OS
                         * because one module is absent.
                         */

                        resolve();

                    };


                document.head.appendChild(
                    script
                );

            }
        );

    }


    async function bootHalDo() {

        HalDoBoot.setProgress(
            5,
            "HalDo AI wird initialisiert …"
        );


        /*
         * Device detection.
         */

        HalDoUI.setDevice();


        /*
         * Restore window size.
         */

        try {

            const saved =
                localStorage.getItem(
                    "haldo.window.size"
                );

            if (
                [
                    "small",
                    "normal",
                    "large"
                ].includes(
                    saved
                )
            ) {

                HalDoUI.windowSize =
                    saved;

            }

        } catch (_) {}


        HalDoBoot.setProgress(
            10,
            "Systemmodule werden geladen …"
        );


        for (
            let i = 0;
            i < scripts.length;
            i++
        ) {

            await loadScript(
                scripts[i]
            );


            const progress =
                10 +
                Math.round(
                    (
                        (i + 1) /
                        scripts.length
                    ) * 55
                );


            HalDoBoot.setProgress(
                progress,
                "Modul " +
                (i + 1) +
                " / " +
                scripts.length
            );

        }


        HalDoBoot.setProgress(
            70,
            "App-System wird verbunden …"
        );


        /*
         * Allow existing modules to finish
         * their own initialization.
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    250
                )
        );


        HalDoBoot.setProgress(
            78,
            "Apps werden registriert …"
        );


        HalDoAppUI.collectApps();

        HalDoAppUI.render();


        HalDoBoot.setProgress(
            86,
            "HalDo AI wird vorbereitet …"
        );


        /*
         * Voice list initialization.
         */

        if (
            "speechSynthesis"
            in window
        ) {

            try {

                window.speechSynthesis
                    .getVoices();

            } catch (_) {}

        }


        HalDoBoot.setProgress(
            92,
            "Oberfläche wird gestartet …"
        );


        updateClock();

        setInterval(
            updateClock,
            1000
        );


        /*
         * Resize.
         */

        window.addEventListener(
            "resize",
            () => {

                HalDoUI.setDevice();

            }
        );


        HalDoBoot.setProgress(
            97,
            "Fast fertig …"
        );


        /*
         * Give existing boot/runtime code
         * a chance to announce readiness.
         */

        try {

            if (
                window.HalDoSystem &&
                typeof
                    window.HalDoSystem.emit ===
                    "function"
            ) {

                window.HalDoSystem.emit(
                    "haldo:ui-ready"
                );

            }

        } catch (_) {}


        HalDoBoot.finish();

    }


    /* ============================================================
       UI EVENT CONNECTIONS
    ============================================================ */

    function bindUI() {

        const appsButton =
            document.getElementById(
                "haldo-dock-apps"
            );

        const homeButton =
            document.getElementById(
                "haldo-home-button"
            );

        const dockHome =
            document.getElementById(
                "haldo-dock-home"
            );

        const aiButton =
            document.getElementById(
                "haldo-dock-ai"
            );

        const keyboardButton =
            document.getElementById(
                "haldo-dock-keyboard"
            );

        const settingsButton =
            document.getElementById(
                "haldo-dock-settings"
            );

        const topSettings =
            document.getElementById(
                "haldo-settings-button"
            );


        if (appsButton) {

            appsButton.addEventListener(
                "click",
                () => {

                    HalDoAppUI.collectApps();

                    HalDoAppUI.render();

                    HalDoUI.toggleLauncher();

                }
            );

        }


        if (homeButton) {

            homeButton.addEventListener(
                "click",
                () => {

                    HalDoAppUI.openHome();

                }
            );

        }


        if (dockHome) {

            dockHome.addEventListener(
                "click",
                () => {

                    HalDoAppUI.openHome();

                }
            );

        }


        if (aiButton) {

            aiButton.addEventListener(
                "click",
                () => {

                    HalDoAppUI.openHalDoAI();

                }
            );

        }


        if (keyboardButton) {

            keyboardButton.addEventListener(
                "click",
                () => {

                    HalDoAppUI.openEzidiKeyboard();

                }
            );

        }


        if (settingsButton) {

            settingsButton.addEventListener(
                "click",
                () => {

                    HalDoAppUI.openSettings();

                }
            );

        }


        if (topSettings) {

            topSettings.addEventListener(
                "click",
                () => {

                    HalDoAppUI.openSettings();

                }
            );

        }


        const search =
            document.getElementById(
                "haldo-app-search"
            );


        if (search) {

            search.addEventListener(
                "input",
                () => {

                    HalDoAppUI.render(
                        search.value
                    );

                }
            );

        }


        /*
         * Escape closes launcher.
         */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    HalDoUI.toggleLauncher(
                        false
                    );

                }

            }
        );

    }


    /* ============================================================
       DOM READY
    ============================================================ */

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            bindUI();

            bootHalDo();

        }
    );


})();
</script>
