<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
    background:
    radial-gradient(circle at 50% 20%,rgba(90,110,255,.22),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(255,80,180,.12),transparent 30%),
    #050711;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
#haldo-root{position:fixed;inset:0;overflow:hidden}
#boot{
    position:absolute;inset:0;z-index:99999;
    display:flex;align-items:center;justify-content:center;
    background:#050711;
    transition:.5s;
}
#boot.hidden{opacity:0;pointer-events:none}
.boot{text-align:center;width:min(90vw,520px)}
.logo{
    width:100px;height:100px;margin:auto auto 24px;
    display:grid;place-items:center;border-radius:30px;
    background:radial-gradient(circle,#fff,#8d9cff 35%,transparent 70%);
    box-shadow:0 0 45px rgba(120,140,255,.5);
    animation:breathe 3s infinite;
}
.logo span{font-size:48px;font-weight:900}
@keyframes breathe{50%{transform:scale(1.06)}}
.boot h1{margin:0;font-size:34px}
.boot p{opacity:.5;margin:8px 0 30px}
#boot-message{min-height:22px}
.progress{
    height:5px;margin-top:15px;border-radius:99px;
    background:rgba(255,255,255,.08);overflow:hidden
}
#boot-bar{
    height:100%;width:0;
    background:linear-gradient(90deg,#7180ff,#fff,#7180ff);
    transition:.25s
}
#boot-detail{font-size:10px;opacity:.35;margin-top:10px}

#desktop{position:absolute;inset:0;display:none}
#desktop.active{display:block}

.wallpaper{
    position:absolute;inset:0;
    background:
    radial-gradient(circle at 50% 45%,rgba(100,120,255,.2),transparent 25%),
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.08),transparent 18%),
    radial-gradient(circle at 85% 70%,rgba(100,150,255,.08),transparent 22%);
}

#topbar{
    position:absolute;top:0;left:0;right:0;height:54px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;
    background:rgba(5,7,17,.65);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.08);
    z-index:1000;
}
.brand{font-weight:800}
.status{font-size:12px;opacity:.65}

#dock{
    position:absolute;left:50%;bottom:20px;
    transform:translateX(-50%);
    display:flex;gap:8px;padding:9px;
    border-radius:22px;
    background:rgba(10,12,25,.78);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,.1);
    z-index:1000;
}
.dock-button{
    width:48px;height:48px;border:0;border-radius:15px;
    color:#fff;background:rgba(255,255,255,.07);
    transition:.18s;
}
.dock-button:hover{transform:translateY(-4px);background:rgba(255,255,255,.15)}

#launcher{
    position:absolute;
    left:50%;top:70px;
    transform:translateX(-50%);
    width:min(94vw,1000px);
    height:min(78vh,720px);
    display:none;
    z-index:2000;
    padding:24px;
    border-radius:28px;
    background:rgba(10,12,25,.94);
    backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 100px rgba(0,0,0,.5);
}
#launcher.open{display:block}
.launcher-head{display:flex;gap:12px;margin-bottom:20px}
#app-search{
    flex:1;padding:14px 18px;border:0;outline:0;
    border-radius:15px;background:rgba(255,255,255,.08);color:#fff;
}
#close-launcher{
    width:48px;border:0;border-radius:15px;
    background:rgba(255,255,255,.08);color:#fff;
}
#app-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
    overflow:auto;
    height:calc(100% - 78px);
}
.app-card{
    min-height:120px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:20px;
    background:rgba(255,255,255,.045);
    color:#fff;
    text-align:left;
    padding:16px;
    transition:.18s;
}
.app-card:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.09);
}
.app-icon{font-size:30px;margin-bottom:10px}
.app-name{font-weight:700}
.app-category{font-size:10px;opacity:.45;margin-top:4px}

#windows{position:absolute;inset:54px 0 88px;z-index:500}

.window-title{font-weight:700}
.window-close{

    background:rgba(255,255,255,.08);color:#fff;

.window-body{flex:1;overflow:auto;padding:24px}

    background:rgba(255,255,255,.045);

.panel h3{margin:0 0 8px}

.action{

    background:rgba(15,17,30,.95);
    border:1px solid rgba(255,255,255,.1);

/* ============================================================

APP_DEFINITIONS.forEach(

                installed:true,

);


/* ============================================================
   REGISTRY API
   ============================================================ */

OS.appRegistry.get =
    function(id){

        return this.apps.get(id) || null;

    };


OS.appRegistry.list =
    function(){

        return Array.from(
            this.apps.values()
        );

    };


OS.appRegistry.register =
    function(app){

        if(
            !app ||
            !app.id
        ){
            return false;
        }

        this.apps.set(
            app.id,
            {
                ...app,
                installed:true,
                enabled:true,
                status:"registered"
            }
        );

        renderApps();

        return true;

    };


OS.appRegistry.unregister =
    function(id){

        return this.apps.delete(id);

    };


/* ============================================================
   WINDOW MANAGER
   ============================================================ */

OS.windowManager =
    OS.windowManager ||
    {};

OS.windowManager.windows =
    OS.windowManager.windows ||
    new Map();


let zIndex = 100;


/* ============================================================
   TOAST
   ============================================================ */

function toast(message){

    const element =
        document.getElementById(
            "toast"
        );

    if(!element){
        return;
    }

    element.textContent =
        message;

    element.classList.add(
        "show"
    );

    clearTimeout(
        element._timer
    );

    element._timer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* ============================================================
   OPEN APP
   ============================================================ */

function openApp(id){

    const app =
        OS.appRegistry.get(
            id
        );

    if(!app){

        toast(
            "App nicht registriert: " +
            id
        );

        return null;

    }


    /*
     * Falls ein echtes App-Modul vorhanden ist,
     * zuerst dieses verwenden.
     */

    const module =
        window.HalDoApps &&
        window.HalDoApps[id];


    if(
        module &&
        typeof module.open ===
        "function"
    ){

        return module.open();

    }


    /*
     * Systemfenster für registrierte Apps.
     *
     * Dadurch kann jede registrierte App bereits
     * geöffnet und verwaltet werden.
     */

    const existing =
        OS.windowManager.windows.get(
            id
        );


    if(existing){

        existing.style.zIndex =
            ++zIndex;

        return existing;

    }


    const windowElement =
        document.createElement(
            "article"
        );

    windowElement.className =
        "window";

    windowElement.dataset.appId =
        id;

    windowElement.style.zIndex =
        ++zIndex;


    windowElement.innerHTML = `

        <header class="window-header">

            <div class="window-title">
                ${escapeHTML(app.icon)}
                &nbsp;
                ${escapeHTML(app.name)}
            </div>

            <button
                class="window-close"
                type="button"
                aria-label="Fenster schließen"
            >×</button>

        </header>

        <div class="window-body">

            <div class="panel">

                <h3>
                    ${escapeHTML(app.name)}
                </h3>

                <div class="muted">
                    ${escapeHTML(app.description)}
                </div>

            </div>

            <div class="panel">

                <h3>
                    HalDo App Runtime
                </h3>

                <div class="muted">
                    App ID:
                    ${escapeHTML(app.id)}
                    <br>
                    Kategorie:
                    ${escapeHTML(app.category)}
                    <br>
                    Status:
                    ${escapeHTML(app.status)}
                </div>

            </div>

            <div class="panel">

                <h3>
                    Systemverbindung
                </h3>

                <div class="muted">
                    Kernel: verbunden<br>
                    Registry: registriert<br>
                    App Manager: verfügbar<br>
                    Window Manager: verfügbar
                </div>

            </div>

            <button
                class="action"
                data-system-action="refresh"
            >
                Aktualisieren
            </button>

            <button
                class="action"
                data-system-action="settings"
            >
                Einstellungen
            </button>

        </div>
    `;


    document
        .getElementById(
            "windows"
        )
        .appendChild(
            windowElement
        );


    const close =
        windowElement.querySelector(
            ".window-close"
        );


    close.addEventListener(
        "click",
        () => {

            windowElement.remove();

            OS.windowManager.windows.delete(
                id
            );

        }
    );


    windowElement.addEventListener(
        "mousedown",
        () => {

            windowElement.style.zIndex =
                ++zIndex;

        }
    );


    OS.windowManager.windows.set(
        id,
        windowElement
    );


    toast(
        app.name +
        " geöffnet"
    );


    return windowElement;

}


OS.appManager =
    OS.appManager ||
    {};


OS.appManager.open =
    openApp;


OS.appManager.launch =
    openApp;


OS.appManager.startApp =

/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* ============================================================
   APP GRID
   ============================================================ */

const grid =
    document.getElementById(
        "app-grid"
    );


function renderApps(
    filter=""
){

    if(!grid){
        return;
    }


    grid.innerHTML = "";


    const normalized =
        filter
            .trim()
            .toLowerCase();


    OS.appRegistry
        .list()
        .filter(
            app => {

                if(!normalized){
                    return true;
                }

                return (
                    app.name
                        .toLowerCase()
                        .includes(
                            normalized
                        )
                    ||
                    app.category
                        .toLowerCase()
                        .includes(
                            normalized
                        )
                    ||
                    app.id
                        .toLowerCase()
                        .includes(
                            normalized
                        )
                );

            }
        )
        .forEach(
            app => {

                const card =
                    document.createElement(
                        "button"
                    );

                card.className =
                    "app-card";

                card.type =
                    "button";

                card.innerHTML = `

                    <div class="app-icon">
                        ${escapeHTML(app.icon)}
                    </div>

                    <div class="app-name">
                        ${escapeHTML(app.name)}
                    </div>

                    <div class="app-category">
                        ${escapeHTML(app.category)}
                    </div>
                `;


                card.addEventListener(
                    "click",
                    () => {

                        openApp(
                            app.id
                        );

                    }
                );


                grid.appendChild(
                    card
                );

            }
        );

}


/* ============================================================
   LAUNCHER
   ============================================================ */

const launcher =
    document.getElementById(
        "launcher"
    );


function openLauncher(){

    launcher.classList.add(
        "open"
    );

}


function closeLauncher(){

    launcher.classList.remove(
        "open"
    );

}


document
    .querySelector(
        "[data-open-launcher]"
    )
    .addEventListener(
        "click",
        openLauncher
    );


document
    .getElementById(
        "close-launcher"
    )
    .addEventListener(
        "click",
        closeLauncher
    );


document
    .getElementById(
        "app-search"
    )
    .addEventListener(
        "input",
        event => {

            renderApps(
                event.target.value
            );

        }
    );


document
    .querySelectorAll(
        "[data-launch]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    openApp(
                        button.dataset.launch
                    );

                }
            );

        }
    );


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            closeLauncher();

        }


        if(
            event.key ===
            "F2"
        ){

            event.preventDefault();

            openLauncher();

        }

    }
);


/* ============================================================
   DESKTOP START
   ============================================================ */

function showDesktop(){

    document
        .getElementById(
            "desktop"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "boot"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "system-status"
        )
        .textContent =
            "HalDo AI OS · Bereit";

}


/* ============================================================
   BOOT UI
   ============================================================ */

function bootStage(
    event
){

    const data =
        event.detail ||
        {};


    const progress =
        Number(
            data.progress
        ) || 0;


    const bar =
        document.getElementById(
            "boot-bar"
        );


    const message =
        document.getElementById(
            "boot-message"
        );


    const detail =
        document.getElementById(
            "boot-detail"
        );


    if(bar){

        bar.style.width =
            `${progress}%`;

    }


    if(
        message &&
        data.message
    ){

        message.textContent =
            data.message;

    }


    if(detail){

        detail.textContent =
            `Stage: ${
                data.stage ||
                "system"
            } · ${progress}%`;

    }

}


window.addEventListener(
    "haldo:bootstrap:stage",
    bootStage
);


window.addEventListener(
    "haldo:boot:stage",
    bootStage
);


window.addEventListener(
    "haldo:bootstrap:ready",
    showDesktop
);


window.addEventListener(
    "haldo:boot:ready",
    showDesktop
);


/* ============================================================
   FALLBACK START
   ============================================================ */

async function startHalDo(){

    try{

        /*
         * Wenn der neue Bootstrap vorhanden ist,
         * darf ausschließlich dieser starten.
         */

        if(
            window.HalDo &&
            window.HalDo.bootstrap &&
            typeof
            window.HalDo.bootstrap.start ===
            "function"
        ){

            await
                window.HalDo.bootstrap.start();

        }else{

            /*
             * Fallback für eine Umgebung,
             * in der Bootstrap nicht geladen wurde.
             */

            showDesktop();

        }

    }catch(error){

        console.error(
            "[HalDo AI OS]",
            error
        );

        showDesktop();

    }

}


/* ============================================================
   INITIAL RENDER
   ============================================================ */

renderApps();


/* ============================================================
   START
   ============================================================ */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        startHalDo,
        {
            once:true
        }
    );

}else{

    startHalDo();

}


/* ============================================================
   SERVICE WORKER
   ============================================================ */

if(
    "serviceWorker" in
    navigator
){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "service-worker.js"
                )
                .then(
                    registration => {

                        console.info(
                            "[HalDo PWA] Service Worker:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    error => {

                        console.warn(
                            "[HalDo PWA]",
                            error
                        );

                    }
                );

        }
    );

}


/* ============================================================
   SYSTEM READY EVENT
   ============================================================ */

window.dispatchEvent(
    new CustomEvent(
        "haldo:index:ready",
        {
            detail:{
                version:
                    OS.version,

                apps:
                    OS.appRegistry.list().length
            }
        }
    )
);

</script>

</body>
</html>
