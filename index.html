    <script>
        "use strict";

        /* ========================================================
           APP REGISTRY
           ======================================================== */

        HD.apps =
            HD.apps || {};

        HD.apps.registry =
            HD.apps.registry ||
            new Map();

        HD.apps.instances =
            HD.apps.instances ||
            new Map();


        HD.apps.register =
            function(
                definition
            ) {

                if (
                    !definition ||
                    !definition.id
                ) {

                    throw new Error(
                        "Ungültige HalDo App-Definition."
                    );

                }


                if (
                    !HD.security.validateAppId(
                        definition.id
                    )
                ) {

                    throw new Error(
                        "Ungültige App-ID: " +
                        definition.id
                    );

                }


                const app = {

                    id:
                        definition.id,

                    name:
                        definition.name ||
                        definition.id,

                    icon:
                        definition.icon ||
                        "◉",

                    category:
                        definition.category ||
                        "System",

                    description:
                        definition.description ||
                        "",

                    version:
                        definition.version ||
                        "22.0.0",

                    ai:
                        definition.ai !== false,

                    voice:
                        definition.voice !== false,

                    navigation:
                        definition.navigation !== false,

                    storage:
                        definition.storage !== false,

                    settings:
                        definition.settings !== false,

                    create:
                        typeof definition.create ===
                        "function"
                            ? definition.create
                            : null,

                    open:
                        typeof definition.open ===
                        "function"
                            ? definition.open
                            : null,

                    close:
                        typeof definition.close ===
                        "function"
                            ? definition.close
                            : null,

                    state:
                        definition.state ||
                        {},

                    registeredAt:
                        Date.now()

                };


                this.registry.set(
                    app.id,
                    app
                );


                HD.emit(
                    "app:registered",
                    app
                );


                return app;

            };


        HD.apps.unregister =
            function(
                appId
            ) {

                const app =
                    this.registry.get(
                        appId
                    );


                if (
                    !app
                ) {

                    return false;

                }


                const instance =
                    this.instances.get(
                        appId
                    );


                if (
                    instance &&
                    typeof app.close ===
                    "function"
                ) {

                    try {

                        app.close(
                            instance
                        );

                    }

                    catch(error) {

                        HD.errors.report(
                            error,
                            "app:unregister"
                        );

                    }

                }


                this.instances.delete(
                    appId
                );

                this.registry.delete(
                    appId
                );


                HD.emit(
                    "app:unregistered",
                    {
                        appId
                    }
                );


                return true;

            };


        HD.apps.get =
            function(
                appId
            ) {

                return this.registry.get(
                    appId
                ) || null;

            };


        HD.apps.getAll =
            function() {

                return [
                    ...this.registry.values()
                ];

            };


        HD.apps.has =
            function(
                appId
            ) {

                return this.registry.has(
                    appId
                );

            };


        /* ========================================================
           APP INSTANCE
           ======================================================== */

        HD.apps.createInstance =
            function(
                app,
                options = {}
            ) {

                const instance = {

                    appId:
                        app.id,

                    state:
                        {
                            ...(app.state || {})
                        },

                    options:
                        {
                            ...options
                        },

                    windowId:
                        null,

                    createdAt:
                        Date.now(),

                    destroyed:
                        false

                };


                if (
                    typeof app.create ===
                    "function"
                ) {

                    try {

                        const result =
                            app.create(
                                instance,
                                options
                            );


                        if (
                            result &&
                            typeof result ===
                            "object"
                        ) {

                            Object.assign(
                                instance,
                                result
                            );

                        }

                    }

                    catch(error) {

                        HD.errors.report(
                            error,
                            "app:create:" +
                            app.id
                        );

                    }

                }


                return instance;

            };


        /* ========================================================
           APP OPEN
           ======================================================== */

        HD.apps.open =
            function(
                appId,
                options = {}
            ) {

                const app =
                    this.get(
                        appId
                    );


                if (
                    !app
                ) {

                    HD.emit(
                        "app:error",
                        {
                            appId,
                            error:
                                "App nicht gefunden."
                        }
                    );

                    return null;

                }


                let instance =
                    this.instances.get(
                        appId
                    );


                if (
                    instance &&
                    !instance.destroyed
                ) {

                    if (
                        instance.windowId
                    ) {

                        HD.ui.focusWindow(
                            instance.windowId
                        );

                    }


                    HD.emit(
                        "app:focus",
                        {
                            app,
                            instance
                        }
                    );


                    return instance;

                }


                instance =
                    this.createInstance(
                        app,
                        options
                    );


                this.instances.set(
                    appId,
                    instance
                );


                if (
                    typeof app.open ===
                    "function"
                ) {

                    try {

                        const result =
                            app.open(
                                instance,
                                options
                            );


                        if (
                            result &&
                            typeof result ===
                            "object"
                        ) {

                            Object.assign(
                                instance,
                                result
                            );

                        }

                    }

                    catch(error) {

                        HD.errors.report(
                            error,
                            "app:open:" +
                            app.id
                        );

                    }

                }


                HD.emit(
                    "app:opened",
                    {
                        app,
                        instance
                    }
                );


                return instance;

            };


        /* ========================================================
           APP CLOSE
           ======================================================== */

        HD.apps.close =
            function(
                appId
            ) {

                const app =
                    this.get(
                        appId
                    );


                const instance =
                    this.instances.get(
                        appId
                    );


                if (
                    !app ||
                    !instance
                ) {

                    return false;

                }


                if (
                    typeof app.close ===
                    "function"
                ) {

                    try {

                        app.close(
                            instance
                        );

                    }

                    catch(error) {

                        HD.errors.report(
                            error,
                            "app:close:" +
                            app.id
                        );

                    }

                }


                if (
                    instance.windowId
                ) {

                    HD.ui.closeWindow(
                        instance.windowId
                    );

                }


                instance.destroyed =
                    true;


                this.instances.delete(
                    appId
                );


                HD.emit(
                    "app:closed",
                    {
                        app,
                        instance
                    }
                );


                return true;

            };


        /* ========================================================
           APP WINDOW CREATOR
           ======================================================== */

        HD.apps.createWindow =
            function(
                app,
                instance,
                options = {}
            ) {

                const record =
                    HD.ui.window(
                        {
                            id:
                                options.id,

                            appId:
                                app.id,

                            title:
                                options.title ||
                                app.name,

                            icon:
                                options.icon ||
                                app.icon,

                            width:
                                options.width ||
                                520,

                            height:
                                options.height ||
                                430
                        }
                    );


                instance.windowId =
                    record.id;


                const body =
                    record.element.querySelector(
                        ".haldo-window-body"
                    );


                if (
                    body
                ) {

                    body.innerHTML =
                        "";

                }


                HD.emit(
                    "app:window-created",
                    {
                        app,
                        instance,
                        window:
                            record
                    }
                );


                return {
                    record,
                    body
                };

            };


        /* ========================================================
           ROUTER
           ======================================================== */

        HD.router =
            HD.router || {

                current:
                    null,

                history:
                    [],

                routes:
                    new Map()

            };


        HD.router.register =
            function(
                route,
                handler
            ) {

                if (
                    typeof route !==
                    "string" ||
                    typeof handler !==
                    "function"
                ) {

                    return false;

                }


                this.routes.set(
                    route,
                    handler
                );


                return true;

            };


        HD.router.navigate =
            function(
                route,
                params = {}
            ) {

                const handler =
                    this.routes.get(
                        route
                    );


                if (
                    typeof handler !==
                    "function"
                ) {

                    HD.emit(
                        "router:not-found",
                        {
                            route,
                            params
                        }
                    );

                    return false;

                }


                if (
                    this.current
                ) {

                    this.history.push(
                        this.current
                    );

                }


                this.current = {

                    route,

                    params,

                    timestamp:
                        Date.now()

                };


                try {

                    handler(
                        params,
                        this.current
                    );

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "router:" +
                        route
                    );

                    return false;

                }


                HD.emit(
                    "router:navigate",
                    this.current
                );


                return true;

            };


        HD.router.back =
            function() {

                const previous =
                    this.history.pop();


                if (
                    !previous
                ) {

                    return false;

                }


                const handler =
                    this.routes.get(
                        previous.route
                    );


                if (
                    typeof handler !==
                    "function"
                ) {

                    return false;

                }


                this.current =
                    previous;


                try {

                    handler(
                        previous.params,
                        previous
                    );

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "router:back"
                    );

                    return false;

                }


                HD.emit(
                    "router:back",
                    previous
                );


                return true;

            };


        HD.router.getCurrent =
            function() {

                return this.current;

            };


        /* ========================================================
           SYSTEM ROUTES
           ======================================================== */

        HD.router.register(
            "home",
            function() {

                HD.emit(
                    "router:home"
                );

            }
        );


        HD.router.register(
            "app",
            function(
                params
            ) {

                if (
                    params &&
                    params.appId
                ) {

                    HD.apps.open(
                        params.appId
                    );

                }

            }
        );


        /* ========================================================
           APP MANAGER COMPATIBILITY
           ======================================================== */

        HD.appManager =
            HD.appManager || {};


        HD.appManager.register =
            function(
                definition
            ) {

                return HD.apps.register(
                    definition
                );

            };


        HD.appManager.open =
            function(
                appId,
                options
            ) {

                return HD.apps.open(
                    appId,
                    options
                );

            };


        HD.appManager.close =
            function(
                appId
            ) {

                return HD.apps.close(
                    appId
                );

            };


        HD.appManager.get =
            function(
                appId
            ) {

                return HD.apps.get(
                    appId
                );

            };


        HD.appManager.getAll =
            function() {

                return HD.apps.getAll();

            };


        /* ========================================================
           APP SYSTEM REGISTRATION
           ======================================================== */

        HD.runtime.register(
            "app-system",
            HD.apps,
            {
                priority:
                    120,

                required:
                    true,

                service:
                    true
            }
        );


        HD.runtime.register(
            "router",
            HD.router,
            {
                priority:
                    130,

                required:
                    true,

                service:
                    true
            }
        );


        HD.runtime.register(
            "app-manager",
            HD.appManager,
            {
                priority:
                    140,

                required:
                    true,

                service:
                    true
            }
        );


        HD.emit(
            "app-system:ready",
            {
                apps:
                    HD.apps.getAll().length
            }
        );

    </script>

    <script>
        "use strict";

        /* ========================================================
           AI CORE
           ======================================================== */

        HD.ai =
            HD.ai || {};

        HD.ai.initialized =
            false;

        HD.ai.busy =
            false;

        HD.ai.conversation =
            [];

        HD.ai.maxHistory =
            100;

        HD.ai.session =
            HD.ai.session ||
            {
                id:
                    "ai-" +
                    Date.now().toString(36) +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2, 8),

                started:
                    Date.now()
            };


        /* ========================================================
           AI CONFIGURATION
           ======================================================== */

        HD.ai.config =
            HD.ai.config || {

                name:
                    "HalDo AI",

                version:
                    "22.0.0",

                language:
                    HD.settings.get(
                        "language",
                        "de-DE"
                    ),

                personality:
                    "freundlich",

                streaming:
                    false,

                localMode:
                    true,

                externalProvider:
                    null,

                externalEndpoint:
                    "",

                systemPrompt:
                    `
                    Du bist HalDo AI.

                    Du bist der zentrale intelligente Assistent
                    von HalDo AI OS 22.

                    Antworte freundlich, klar, hilfreich und
                    respektvoll.

                    Du kannst mit dem Benutzer über allgemeine
                    Themen sprechen, Fragen beantworten,
                    Texte schreiben, erklären, übersetzen,
                    zusammenfassen, planen, lernen helfen,
                    programmieren helfen und kreative Ideen
                    entwickeln.

                    Wenn eine Funktion des Gerätes oder des
                    Betriebssystems nicht wirklich verfügbar ist,
                    behaupte niemals, dass sie ausgeführt wurde.

                    Erkläre stattdessen ehrlich, was möglich ist
                    und was noch eine Verbindung oder Berechtigung
                    benötigt.

                    Der Benutzer kann Deutsch, Englisch,
                    Kurdisch, Êzîdî und weitere Sprachen verwenden.
                    Versuche die Sprache des Benutzers zu erkennen
                    und antworte möglichst in derselben Sprache.
                    `

            };


        /* ========================================================
           LANGUAGE DETECTION
           ======================================================== */

        HD.ai.detectLanguage =
            function(
                text
            ) {

                const value =
                    String(
                        text || ""
                    )
                    .toLowerCase()
                    .trim();


                if (
                    !value
                ) {

                    return (
                        HD.ai.config.language ||
                        "de-DE"
                    );

                }


                if (
                    /[əêîşç]/i.test(
                        value
                    )
                ) {

                    return "ku";

                }


                const german =
                    [
                        "der",
                        "die",
                        "das",
                        "und",
                        "ich",
                        "du",
                        "wie",
                        "was",
                        "warum",
                        "bitte",
                        "danke",
                        "kannst"
                    ];


                const english =
                    [
                        "the",
                        "and",
                        "you",
                        "what",
                        "why",
                        "how",
                        "please",
                        "thanks",
                        "can",
                        "could"
                    ];


                const germanScore =
                    german.reduce(
                        (
                            score,
                            word
                        ) => {

                            return score +
                                (
                                    value
                                        .split(
                                            /\s+/
                                        )
                                        .includes(
                                            word
                                        )
                                        ? 1
                                        : 0
                                );

                        },
                        0
                    );


                const englishScore =
                    english.reduce(
                        (
                            score,
                            word
                        ) => {

                            return score +
                                (
                                    value
                                        .split(
                                            /\s+/
                                        )
                                        .includes(
                                            word
                                        )
                                        ? 1
                                        : 0
                                );

                        },
                        0
                    );


                if (
                    englishScore >
                    germanScore
                ) {

                    return "en-US";

                }


                return "de-DE";

            };


        /* ========================================================
           MESSAGE NORMALIZATION
           ======================================================== */

        HD.ai.normalize =
            function(
                text
            ) {

                return String(
                    text ?? ""
                )
                .replace(
                    /\r\n/g,
                    "\n"
                )
                .replace(
                    /[ \t]+/g,
                    " "
                )
                .trim();

            };


        /* ========================================================
           MEMORY
           ======================================================== */

        HD.ai.memory =
            HD.ai.memory || {

                items:
                    [],

                maxItems:
                    200

            };


        HD.ai.memory.load =
            function() {

                const saved =
                    HD.persistence.load(
                        "ai-memory",
                        []
                    );


                if (
                    Array.isArray(
                        saved
                    )
                ) {

                    this.items =
                        saved.slice(
                            -this.maxItems
                        );

                }


                return this.items;

            };


        HD.ai.memory.save =
            function() {

                HD.persistence.save(
                    "ai-memory",
                    this.items.slice(
                        -this.maxItems
                    )
                );

            };


        HD.ai.memory.add =
            function(
                type,
                content,
                metadata = {}
            ) {

                const item = {

                    id:
                        "memory-" +
                        Date.now().toString(36) +
                        "-" +
                        Math.random()
                            .toString(36)
                            .slice(2, 7),

                    type:
                        type || "general",

                    content:
                        String(
                            content ?? ""
                        )
                        .slice(
                            0,
                            5000
                        ),

                    metadata:
                        {
                            ...metadata
                        },

                    created:
                        Date.now()

                };


                this.items.push(
                    item
                );


                if (
                    this.items.length >
                    this.maxItems
                ) {

                    this.items =
                        this.items.slice(
                            -this.maxItems
                        );

                }


                this.save();


                HD.emit(
                    "ai:memory-added",
                    item
                );


                return item;

            };


        HD.ai.memory.search =
            function(
                query,
                limit = 10
            ) {

                const q =
                    String(
                        query || ""
                    )
                    .toLowerCase()
                    .trim();


                if (
                    !q
                ) {

                    return [];

                }


                const words =
                    q.split(
                        /\s+/
                    )
                    .filter(
                        Boolean
                    );


                return this.items
                    .map(
                        item => {

                            const content =
                                String(
                                    item.content ||
                                    ""
                                )
                                .toLowerCase();


                            let score = 0;


                            words.forEach(
                                word => {

                                    if (
                                        content.includes(
                                            word
                                        )
                                    ) {

                                        score++;

                                    }

                                }
                            );


                            return {
                                item,
                                score
                            };

                        }
                    )
                    .filter(
                        result =>
                            result.score >
                            0
                    )
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            b.score -
                            a.score
                    )
                    .slice(
                        0,
                        limit
                    )
                    .map(
                        result =>
                            result.item
                    );

            };


        HD.ai.memory.clear =
            function() {

                this.items =
                    [];

                this.save();

                HD.emit(
                    "ai:memory-cleared"
                );

            };


        HD.ai.memory.load();


        /* ========================================================
           CONVERSATION
           ======================================================== */

        HD.ai.addMessage =
            function(
                role,
                content,
                metadata = {}
            ) {

                const message = {

                    id:
                        "msg-" +
                        Date.now().toString(36) +
                        "-" +
                        Math.random()
                            .toString(36)
                            .slice(2, 7),

                    role:
                        role,

                    content:
                        String(
                            content ?? ""
                        ),

                    language:
                        this.detectLanguage(
                            content
                        ),

                    timestamp:
                        Date.now(),

                    metadata:
                        {
                            ...metadata
                        }

                };


                this.conversation.push(
                    message
                );


                if (
                    this.conversation.length >
                    this.maxHistory
                ) {

                    this.conversation =
                        this.conversation.slice(
                            -this.maxHistory
                        );

                }


                HD.emit(
                    "ai:message",
                    message
                );


                return message;

            };


        HD.ai.clearConversation =
            function() {

                this.conversation =

                HD.persistence.remove(

                );


                HD.emit(

                );

            };


        HD.ai.saveConversation =

                HD.persistence.save(

                    this.conversation.slice(

                    )
                );

            };


        HD.ai.loadConversation =

                const saved =
                    HD.persistence.load(

                        []
                    );


                if (
                    Array.isArray(
                        saved
                    )
                ) {

                    this.conversation =

                        );

                }

            };


        HD.ai.loadConversation();


        /* ========================================================
           INTENT DETECTION
           ======================================================== */

        HD.ai.detectIntent =
            function(
                text
            ) {

                const value =
                    this.normalize(
                        text
                    )
                    .toLowerCase();


                if (
                    /^(hi|hallo|hey|hello|guten morgen|guten tag|guten abend|selam)/i
                        .test(
                            value
                        )
                ) {

                    return "greeting";

                }


                if (
                    /(wer bist du|was bist du|dein name|who are you)/i
                        .test(

                        )
                ) {

                    return "identity";

                }


                if (
                    /(danke|thanks|thank you)/i
                        .test(
                            value
                        )
                ) {

                    return "thanks";

                }


                if (
                    /(übersetz|translate|çevir|werger)/i
                        .test(
                            value
                        )
                ) {

                    return "translation";

                }


                if (
                    /(schreib|text|brief|email|nachricht|formuliere)/i
                        .test(
                            value
                        )
                ) {

                    return "writing";

                }


                if (
                    /(code|programm|javascript|html|css|python|entwickl)/i
                        .test(
                            value
                        )
                ) {

                    return "coding";

                }


                if (
                    /(musik|song|lied|beat|melodie)/i
                        .test(
                            value
                        )
                ) {

                    return "music";

                }


                if (
                    /(video|film|clip|schnitt)/i
                        .test(
                            value
                        )
                ) {

                    return "video";

                }


                if (
                    /(wetter|temperature|temperatur)/i
                        .test(
                            value
                        )
                ) {

                    return "weather";

                }


                if (
                    /(hilfe|help|was kannst du|funktionen)/i
                        .test(
                            value
                        )
                ) {

                    return "help";

                }

        /* ========================================================

        HD.ai.localResponse =
            function(
                text

                    this.normalize(
                        text
                    );

                    this.detectLanguage(

                    this.detectIntent(
                        value
                    );

        HD.ai.externalResponse =
            async function(
                text
            ) {

                const endpoint =
                    String(
                        this.config
                            .externalEndpoint ||
                        ""
                    )
                    .trim();


                if (
                    !endpoint
                ) {

                    return null;

                }


                try {

                    const response =
                        await HD.network.postJSON(
                            endpoint,
                            {
                                message:
                                    text,

                                conversation:
                                    this.conversation
                                        .slice(
                                            -20
                                        ),

                                system:
                                    this.config
                                        .systemPrompt,

                                language:
                                    this.detectLanguage(
                                        text
                                    ),

                                session:
                                    this.session.id
                            }
                        );


                    if (
                        response &&
                        typeof response ===
                        "object"
                    ) {

                        return (
                            response.text ||
                            response.message ||
                            response.answer ||
                            null
                        );

                    }


                    if (
                        typeof response ===
                        "string"
                    ) {

                        return response;

                    }


                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "ai:external"
                    );

                }


                return null;

            };


        /* ========================================================
           MAIN AI MESSAGE FUNCTION
           ======================================================== */

        HD.ai.ask =
            async function(
                text,
                options = {}
            ) {

                const input =
                    this.normalize(
                        text
                    );


                if (
                    !input
                ) {

                    return {
                        text:
                            "Schreib mir etwas – ich höre dir zu. 💙❤️",

                        type:
                            "assistant"
                    };

                }


                if (
                    this.busy
                ) {

                    return {
                        text:
                            "Einen kleinen Moment, ich bearbeite gerade noch deine vorherige Anfrage.",

                        type:
                            "assistant"
                    };

                }


                this.busy =
                    true;


                HD.emit(
                    "ai:thinking",
                    {
                        text:
                            input
                    }
                );


                const userMessage =
                    this.addMessage(
                        "user",
                        input
                    );


                try {

                    let answer =
                        null;


                    if (
                        options.external !==
                        false
                    ) {

                        answer =
                            await this.externalResponse(
                                input
                            );

                    }


                    if (
                        !answer
                    ) {

                        const local =
                            this.localResponse(
                                input
                            );

                        answer =
                            local.text;

                    }


                    const assistantMessage =
                        this.addMessage(
                            "assistant",
                            answer,
                            {
                                replyTo:
                                    userMessage.id
                            }
                        );


                    this.memory.add(
                        "conversation",
                        input,
                        {
                            role:
                                "user",

                            session:
                                this.session.id
                        }
                    );


                    this.saveConversation();


                    HD.emit(
                        "ai:response",
                        assistantMessage
                    );


                    return {
                        ...assistantMessage,

                        type:
                            "assistant"
                    };

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "ai:ask"
                    );


                    const fallback = {

                        text:
                            "Entschuldigung, bei meiner Antwort ist ein Fehler aufgetreten. Wir können es direkt noch einmal versuchen.",

                        type:
                            "assistant",

                        error:
                            true

                    };


                    this.addMessage(
                        "assistant",
                        fallback.text,
                        {
                            error:
                                true
                        }
                    );


                    return fallback;

                }

                finally {

                    this.busy =
                        false;


                    HD.emit(
                        "ai:ready"
                    );

                }

            };

        /* ========================================================
           AVAILABLE BROWSER VOICES
           ======================================================== */

        HD.voice.getVoices =
            function() {

                if (
                    !this.synthesis
                ) {

                    return [];

                }


                try {

                    return this.synthesis
                        .getVoices();

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "voice:getVoices"
                    );

                    return [];

                }

            };


        /* ========================================================
           FIND BEST VOICE
           ======================================================== */

        HD.voice.findVoice =
            function(
                language
            ) {

                const voices =
                    this.getVoices();


                if (
                    !voices.length
                ) {

                    return null;

                }


                const requested =
                    String(
                        language ||
                        this.config.language ||
                        "de-DE"
                    )
                    .toLowerCase();


                const base =
                    requested.split(
                        "-"
                    )[0];


                let voice =
                    voices.find(
                        item =>
                            String(
                                item.lang ||
                                ""
                            )
                            .toLowerCase() ===
                            requested
                    );


                if (
                    voice
                ) {

                    return voice;

                }


                voice =
                    voices.find(
                        item =>
                            String(
                                item.lang ||
                                ""
                            )
                            .toLowerCase()
                            .startsWith(
                                base
                            )
                    );


                if (
                    voice
                ) {

                    return voice;

                }


                if (
                    this.config.voiceName
                ) {

                    voice =
                        voices.find(
                            item =>
                                item.name ===
                                this.config.voiceName
                        );

                }


                return (
                    voice ||
                    voices[0] ||
                    null
                );

            };


        /* ========================================================
           SPEAK
           ======================================================== */

        HD.voice.speak =
            function(
                text,
                options = {}
            ) {

                const value =
                    String(
                        text ?? ""
                    )
                    .trim();


                if (
                    !value
                ) {

                    return false;

                }


                if (
                    !this.config.enabled ||
                    !this.config.speechEnabled
                ) {

                    return false;

                }


                if (
                    !this.synthesis
                ) {

                    HD.emit(
                        "voice:unavailable"
                    );

                    return false;

                }


                try {

                    this.stop();


                    const language =
                        options.language ||
                        HD.ai.detectLanguage(
                            value
                        ) ||
                        this.config.language;


                    const utterance =
                        new SpeechSynthesisUtterance(
                            value
                        );


                    utterance.lang =
                        language;


                    utterance.rate =
                        Number(
                            options.rate ??
                            this.config.rate
                        );


                    utterance.pitch =
                        Number(
                            options.pitch ??
                            this.config.pitch
                        );


                    utterance.volume =
                        Number(
                            options.volume ??
                            this.config.volume
                        );


                    const voice =
                        this.findVoice(
                            language
                        );


                    if (
                        voice
                    ) {

                        utterance.voice =
                            voice;

                    }


                    utterance.onstart =
                        () => {

                            this.speaking =
                                true;


                            HD.emit(
                                "voice:speaking",
                                {
                                    text:
                                        value,

                                    language
                                }
                            );

                        };


                    utterance.onend =
                        () => {

                            this.speaking =
                                false;


                            HD.emit(
                                "voice:ended"
                            );

                        };


                    utterance.onerror =
                        event => {

                            this.speaking =
                                false;


                            HD.errors.report(
                                event.error ||
                                new Error(
                                    "Sprachausgabe fehlgeschlagen."
                                ),
                                "voice:speak"
                            );


                            HD.emit(
                                "voice:error",
                                {
                                    error:
                                        event.error
                                }
                            );

                        };


                    this.synthesis.speak(
                        utterance
                    );


                    return true;

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "voice:speak"
                    );

                    return false;

                }

            };

        /* ========================================================
           SPEECH RECOGNITION
           ======================================================== */

        HD.voice.createRecognition =
            function() {

                const Recognition =
                    window.SpeechRecognition ||
                    window.webkitSpeechRecognition;


                if (
                    !Recognition
                ) {

                    HD.emit(
                        "voice:recognition-unavailable"
                    );

                    return null;

                }


                try {

                    const recognition =
                        new Recognition();


                    recognition.lang =
                        this.config.language;


                    recognition.continuous =
                        Boolean(
                            this.config.continuous
                        );


                    recognition.interimResults =
                        true;


                    recognition.maxAlternatives =
                        3;


                    recognition.onstart =
                        () => {

                            this.listening =
                                true;


                            HD.emit(
                                "voice:listening"
                            );

                        };


                    recognition.onresult =
                        event => {

                            let finalText =
                                "";

                            let interimText =
                                "";


                            for (
                                let i =
                                    event.resultIndex;

                                i <
                                event.results.length;

                                i++
                            ) {

                                const result =
                                    event.results[i];


                                const transcript =
                                    result[0]
                                        .transcript;


                                if (
                                    result.isFinal
                                ) {

                                    finalText +=
                                        transcript;

                                }

                                else {

                                    interimText +=
                                        transcript;

                                }

                            }


                            HD.emit(
                                "voice:transcript",
                                {
                                    final:
                                        finalText.trim(),

                                    interim:
                                        interimText.trim()
                                }
                            );


                            if (
                                finalText.trim()
                            ) {

                                HD.emit(
                                    "voice:final",
                                    {
                                        text:
                                            finalText
                                                .trim()
                                    }
                                );

                            }

                        };


                    recognition.onerror =
                        event => {

                            this.listening =
                                false;


                            HD.errors.report(
                                event.error ||
                                new Error(
                                    "Spracherkennung fehlgeschlagen."
                                ),
                                "voice:recognition"
                            );


                            HD.emit(
                                "voice:recognition-error",
                                {
                                    error:
                                        event.error
                                }
                            );

                        };


                    recognition.onend =
                        () => {

                            this.listening =
                                false;


                            HD.emit(
                                "voice:recognition-ended"
                            );

                        };


                    this.recognition =
                        recognition;


                    return recognition;

                }

                catch(error) {

                    HD.errors.report(
                        error,
                        "voice:createRecognition"

                    return null;

                }

        keys.forEach(

            const cleanKey =

<script>
"use strict";

/* ============================================================
   EVENTS / NOTIFICATION SYSTEM
   ============================================================ */

HD.notifications =
    HD.notifications || {};

HD.notifications.items =
    HD.notifications.items || [];

HD.notifications.maxItems =
    100;

HD.notifications.nextId =
    HD.notifications.nextId || 1;


/* ------------------------------------------------------------
   CREATE NOTIFICATION
   ------------------------------------------------------------ */

HD.notifications.create = function(
    title,
    message,
    options = {}
) {

    const notification = {

        id:
            "notification-" +
            Date.now() +
            "-" +
            this.nextId++,

        title:
            String(
                title ||
                "HalDo AI"
            ),

        message:
            String(
                message ||
                ""
            ),

        type:
            options.type ||
            "info",

        icon:
            options.icon ||
            "🔔",

        persistent:
            Boolean(
                options.persistent
            ),

        read:
            false,

        timestamp:
            Date.now(),

        action:
            typeof options.action ===
            "function"
                ? options.action
                : null

    };


    this.items.unshift(
        notification
    );


    if (
        this.items.length >
        this.maxItems
    ) {

        this.items =
            this.items.slice(
                0,
                this.maxItems
            );

    }


    HD.persistence.save(
        "notifications",
        this.items.map(
            item => ({
                ...item,
                action:
                    null
            })
        )
    );


    HD.emit(
        "notification:created",
        notification
    );


    return notification;

};


/* ------------------------------------------------------------
   MARK AS READ
   ------------------------------------------------------------ */

HD.notifications.markRead = function(
    id
) {

    const notification =
        this.items.find(
            item =>
                item.id === id
        );


    if (
        !notification
    ) {

        return false;

    }


    notification.read =
        true;


    HD.persistence.save(
        "notifications",
        this.items.map(
            item => ({
                ...item,
                action:
                    null
            })
        )
    );


    HD.emit(
        "notification:read",
        notification
    );


    return true;

};


/* ------------------------------------------------------------
   REMOVE
   ------------------------------------------------------------ */

HD.notifications.remove = function(
    id
) {

    const index =
        this.items.findIndex(
            item =>
                item.id === id
        );


    if (
        index === -1
    ) {

        return false;

    }


    const removed =
        this.items.splice(
            index,
            1
        )[0];


    HD.persistence.save(
        "notifications",
        this.items.map(
            item => ({
                ...item,
                action:
                    null
            })
        )
    );


    HD.emit(
        "notification:removed",
        removed
    );


    return true;

};


/* ------------------------------------------------------------
   CLEAR
   ------------------------------------------------------------ */

HD.notifications.clear = function() {

    this.items =

HD.security =

HD.security.escapeHTML =
    function(
        value

        const text =

HD.security.safeURL =
    function(
        value
    ) {

        try {

            const url =
                new URL(
                    String(
                        value ||
                        ""
                    ),
                    window.location.href
                );


            const allowed =
                [
                    "http:",
                    "https:",
                    "mailto:"
                ];


            if (
                !allowed.includes(
                    url.protocol
                )
            ) {

                return null;

            }


            return url.href;

        }

        catch(error) {

            return null;

        }

    };


/* ------------------------------------------------------------
   HASH
   ------------------------------------------------------------ */

HD.security.hash =
    async function(
        value
    ) {

        const text =
            String(
                value ??
                ""
            );


        if (
            window.crypto &&
            window.crypto.subtle
        ) {

            try {

                const data =
                    new TextEncoder()
                        .encode(
                            text
                        );


                const buffer =
                    await crypto.subtle.digest(
                        "SHA-256",
                        data
                    );


                return [
                    ...new Uint8Array(
                        buffer
                    )
                ]
                .map(
                    byte =>
                        byte
                            .toString(16)
                            .padStart(
                                2,
                                "0"
                            )
                )
                .join("");

            }

            catch(error) {

                HD.errors.report(
                    error,
                    "security:hash"
                );

            }

        }


        /* Fallback für Umgebungen ohne Web Crypto */

        let hash = 0;


        for (
            let i = 0;
            i < text.length;
            i++

            hash =
                (
                    (
                        hash << 5

                ) +
                text.charCodeAt(i);

            hash |= 0;

            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            return response;

        }

        finally {

            clearTimeout(
                timer
            );

        }

    };


/* ------------------------------------------------------------
   JSON GET
   ------------------------------------------------------------ */

HD.network.getJSON =
    async function(
        url,
        options = {}
    ) {

        const response =
            await this.fetch(
                url,
                {
                    ...options,
                    method:
                        "GET",

                    headers:
                        {
                            Accept:
                                "application/json",

                            ...(options.headers ||
                                {})
                        }
                }
            );


        return response.json();

    };

                            ...(options.headers ||

                        },

                        )
                }
            );

HD.network.getStatus =

<script>
"use strict";

/* ============================================================
   BLUETOOTH FOUNDATION
   ============================================================ */

HD.bluetooth =
    HD.bluetooth || {};

HD.bluetooth.initialized =
    false;

HD.bluetooth.connected =
    false;

HD.bluetooth.device =
    null;

HD.bluetooth.server =
    null;

HD.bluetooth.characteristics =
    new Map();

HD.bluetooth.config =
    HD.bluetooth.config || {

        enabled:
            true,

        autoReconnect:
            false,

        scanTimeout:
            10000

    };


/* ------------------------------------------------------------
   BROWSER SUPPORT
   ------------------------------------------------------------ */

HD.bluetooth.isSupported =
    function() {

        return Boolean(
            navigator.bluetooth &&
            typeof navigator.bluetooth
                .requestDevice ===
                "function"
        );

    };


/* ------------------------------------------------------------
   CONNECT
   ------------------------------------------------------------ */

HD.bluetooth.connect =
    async function(
        options = {}
    ) {

        if (
            !this.config.enabled
        ) {

            return null;

        }


        if (
            !this.isSupported()
        ) {

            HD.notifications.create(
                "Bluetooth",
                "Bluetooth wird von diesem Browser oder Gerät nicht unterstützt.",
                {
                    type:
                        "warning",

                    icon:
                        "🔵"
                }
            );

            HD.emit(
                "bluetooth:unsupported"
            );

            return null;

        }


        try {

            const filters =
                options.filters ||
                undefined;


            const optionalServices =
                options.optionalServices ||
                [];


            const requestOptions =
                filters
                    ? {
                        filters,
                        optionalServices
                    }
                    : {
                        acceptAllDevices:
                            true,

                        optionalServices
                    };


            const device =
                await navigator.bluetooth
                    .requestDevice(
                        requestOptions
                    );


            this.device =
                device;


            if (
                device.addEventListener
            ) {

                device.addEventListener(
                    "gattserverdisconnected",
                    () => {

                        this.connected =
                            false;

                        this.server =
                            null;

                        HD.emit(
                            "bluetooth:disconnected",
                            {
                                device:
                                    this.device
                            }
                        );

                    }
                );

            }


            if (
                device.gatt
            ) {

                this.server =
                    await device.gatt.connect();

                this.connected =
                    true;

            }


            HD.emit(
                "bluetooth:connected",
                {
                    device,
                    server:
                        this.server
                }
            );


            HD.notifications.create(
                "Bluetooth",
                (
                    "Verbunden mit " +
                    (
                        device.name ||
                        "Bluetooth-Gerät"
                    )
                ),
                {
                    type:
                        "success",

                    icon:
                        "🔵"
                }
            );


            return device;

        }

        catch(error) {

            if (
                error &&
                error.name ===
                "NotFoundError"
            ) {

                return null;

            }


            HD.errors.report(
                error,
                "bluetooth:connect"
            );


            HD.emit(
                "bluetooth:error",
                {
                    error
                }
            );


            return null;

        }

    };


/* ------------------------------------------------------------
   DISCONNECT
   ------------------------------------------------------------ */

HD.bluetooth.disconnect =
    function() {

        try {

            if (
                this.device &&
                this.device.gatt &&
                this.device.gatt.connected
            ) {

                this.device.gatt.disconnect();

            }

        }

        catch(error) {

            HD.errors.report(
                error,
                "bluetooth:disconnect"
            );

        }


        this.connected =
            false;

        this.server =
            null;

        this.characteristics.clear();


        HD.emit(
            "bluetooth:disconnected",
            {
                device:
                    this.device
            }
        );

    };


/* ------------------------------------------------------------
   SERVICES
   ------------------------------------------------------------ */

HD.bluetooth.getPrimaryService =
    async function(
        service
    ) {

        if (
            !this.server
        ) {

            return null;

        }


        try {

            return await this.server
                .getPrimaryService(
                    service
                );

        }

        catch(error) {

            HD.errors.report(
                error,
                "bluetooth:getPrimaryService"
            );

            return null;

        }

    };


/* ------------------------------------------------------------
   CHARACTERISTIC
   ------------------------------------------------------------ */

HD.bluetooth.getCharacteristic =
    async function(
        service,
        characteristic
    ) {

        const key =
            String(service) +
            ":" +
            String(characteristic);


        if (
            this.characteristics.has(
                key
            )
        ) {

            return this.characteristics.get(
                key
            );

        }


        const primary =
            await this.getPrimaryService(
                service
            );


        if (
            !primary
        ) {

            return null;

        }


        try {

            const result =
                await primary
                    .getCharacteristic(
                        characteristic
                    );


            this.characteristics.set(
                key,
                result
            );


            return result;

        }

        catch(error) {

            HD.errors.report(
                error,
                "bluetooth:getCharacteristic"
            );

            return null;

        }

    };


/* ------------------------------------------------------------
   WRITE
   ------------------------------------------------------------ */

HD.bluetooth.write =
    async function(
        service,
        characteristic,
        data
    ) {

        const item =
            await this.getCharacteristic(
                service,
                characteristic
            );


        if (
            !item
        ) {

            return false;

        }


        try {

            const bytes =
                data instanceof Uint8Array
                    ? data
                    : new TextEncoder()
                        .encode(
                            String(
                                data
                            )
                        );


            if (
                item.writeValueWithResponse
            ) {

                await item.writeValueWithResponse(
                    bytes
                );

            }

            else {

                await item.writeValue(
                    bytes
                );

            }


            HD.emit(
                "bluetooth:data-sent",
                {
                    service,
                    characteristic,
                    data:
                        bytes
                }
            );


            return true;

        }

        catch(error) {

            HD.errors.report(
                error,
                "bluetooth:write"
            );

            return false;

        }

    };


/* ------------------------------------------------------------
   READ
   ------------------------------------------------------------ */

HD.bluetooth.read =
    async function(
        service,
        characteristic
    ) {

        const item =
            await this.getCharacteristic(
                service,
                characteristic
            );


        if (
            !item ||
            typeof item.readValue !==
            "function"
        ) {

            return null;

        }


        try {

            const value =
                await item.readValue();


            HD.emit(
                "bluetooth:data-received",
                {
                    service,
                    characteristic,
                    data:
                        value
                }
            );


            return value;

        }

        catch(error) {

            HD.errors.report(
                error,
                "bluetooth:read"
            );

            return null;

        }

    };


/* ============================================================
   VEHICLE CONNECTIVITY
   ============================================================ */

HD.vehicle =
    HD.vehicle || {};

HD.vehicle.initialized =
    false;

HD.vehicle.connected =
    false;

HD.vehicle.type =
    "unknown";

HD.vehicle.connection =
    null;

HD.vehicle.state =
    {

        speed:
            0,

        rpm:
            0,

            null,

        battery:
            null,

        temperature:
            null,

        latitude:
            null,

        longitude:
            null,

        heading:
            null,

        ignition:
            false,

        doors:
            null

    };


/* ------------------------------------------------------------
   VEHICLE CAPABILITIES
   ------------------------------------------------------------ */

HD.vehicle.capabilities =
    {

        bluetooth:
            true,

        androidAuto:
            false,

        carPlay:
            false,

        obd:
            false,

        navigation:
            true,

        telemetry:
            true,

        media:
            true

    };


/* ------------------------------------------------------------
   CONNECT VEHICLE
   ------------------------------------------------------------ */

HD.vehicle.connect =
    async function(
        options = {}
    ) {

        this.type =
            options.type ||
            "bluetooth";


        if (
            this.type ===

        ) {

            const device =
                await HD.bluetooth.connect(

                );


            if (
                !device
            ) {

                return false;

            }


            this.connection =
                device;

            this.connected =
                true;


            HD.emit(
                "vehicle:connected",
                {
                    device,

                        this.type
                }
            );


            return true;

        }


        /*
         * Android Auto / CarPlay können aus einer normalen
         * Browser-Seite nicht künstlich simuliert werden.
         * Die Schnittstelle bleibt aber vorbereitet.
         */

        HD.emit(
            "vehicle:connection-required",
            {
                type:
                    this.type
            }
        );


        return false;

    };


/* ------------------------------------------------------------
   DISCONNECT VEHICLE
   ------------------------------------------------------------ */

HD.vehicle.disconnect =

        if (

        ) {

        }

/* ------------------------------------------------------------

HD.vehicle.updateState =

   GET STATE

HD.vehicle.getState =

        };

/* ============================================================
   DEVICE INFORMATION

HD.device =

                Array.isArray(
                    navigator.languages
                )
                    ? [
                        ...navigator.languages
                    ]
                    : [],

            platform:

            online:
                navigator.onLine,

            touch:
                "ontouchstart" in window ||
                navigator.maxTouchPoints >
                0,

            screen:
                {
                    width:
                        window.screen.width,

                    height:
                        window.screen.height,

                    pixelRatio:
                        window.devicePixelRatio ||
                        1
                },

            viewport:
                {
                    width:

                },

            connection:
                connection
                    ? {
                        type:
                            connection.type,

                        effectiveType:
                            connection.effectiveType,

                        downlink:
                            connection.downlink,

                        rtt:
                            connection.rtt,

                        saveData:
                            connection.saveData
                    }

    };


/* ============================================================
   DEVICE ORIENTATION / RESIZE
   ============================================================ */

HD.device.orientation =
