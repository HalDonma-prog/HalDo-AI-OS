<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#050817">
<meta name="application-name" content="HalDo AI OS 22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>HalDo AI OS 22</title>

<style>
/* ============================================================
   HALDO AI OS 22
   STABLE MASTER SHELL
   ============================================================ */

:root{
    --bg:#030611;
    --panel:rgba(8,16,35,.86);
    --panel2:rgba(13,25,50,.94);
    --line:rgba(255,255,255,.11);
    --text:#f4f8ff;
    --muted:rgba(240,245,255,.58);
    --accent:#7ec8ff;
    --accent2:#a78bfa;
    --good:#63f5aa;
    --danger:#ff7187;
    --shadow:0 30px 90px rgba(0,0,0,.5);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* ============================================================
   BOOT
   ============================================================ */

#boot{
    position:fixed;
    inset:0;
    z-index:999999;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 48%,
            rgba(255,205,80,.13),
            transparent 22%),
        radial-gradient(circle at 50% 50%,
            rgba(67,132,255,.14),
            transparent 48%),
        #02040d;
    transition:
        opacity .65s ease,
        visibility .65s ease;
}

#boot.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.boot-stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px),
        radial-gradient(circle,rgba(120,180,255,.55) 1px,transparent 1.5px);
    background-size:73px 83px,127px 113px;
    opacity:.38;
    animation:starsMove 35s linear infinite;
}

@keyframes starsMove{
    to{
        transform:translate3d(-80px,40px,0);
    }
}

.boot-center{
    position:relative;
    z-index:2;
    text-align:center;
}

.boot-logo{
    width:min(180px,42vw);
    height:min(180px,42vw);
    margin:auto;
    object-fit:contain;
    filter:
        drop-shadow(0 0 18px rgba(255,220,90,.65))
        drop-shadow(0 0 55px rgba(110,180,255,.35));
    animation:
        bootLogo 3.8s ease-in-out infinite,
        bootSpin 18s linear infinite;
}

@keyframes bootLogo{
    0%,100%{
        transform:scale(.96);
        filter:
            drop-shadow(0 0 14px rgba(255,220,90,.55))
            drop-shadow(0 0 42px rgba(110,180,255,.3));
    }
    50%{
        transform:scale(1.05);
        filter:
            drop-shadow(0 0 28px rgba(255,225,110,.95))
            drop-shadow(0 0 80px rgba(110,180,255,.55));
    }
}

@keyframes bootSpin{
    to{
        rotate:360deg;
    }
}

.boot-title{
    margin-top:22px;
    font-size:clamp(22px,5vw,38px);
    font-weight:800;
    letter-spacing:.08em;
}

.boot-status{
    margin-top:9px;
    color:var(--muted);
    font-size:14px;
}

.boot-progress{
    width:min(340px,70vw);
    height:4px;
    margin:22px auto 0;
    border-radius:99px;
    background:rgba(255,255,255,.08);
    overflow:hidden;
}

.boot-progress span{
    display:block;
    width:0;
    height:100%;
    border-radius:inherit;
    background:
        linear-gradient(90deg,
            #ffd86a,
            #86cfff,
            #b794ff);
    transition:width .3s ease;
}

/* ============================================================
   COSMIC WORLD
   ============================================================ */

#cosmic{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,
            rgba(255,190,50,.16),
            transparent 12%),
        radial-gradient(circle at 50% 50%,
            rgba(55,115,255,.1),
            transparent 48%),
        linear-gradient(180deg,#02040e,#050a1b 55%,#02040d);
}

.cosmic-stars{
    position:absolute;
    inset:-10%;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.95) 1px,transparent 1.7px),
        radial-gradient(circle,rgba(120,190,255,.7) 1px,transparent 1.7px);
    background-size:91px 103px,149px 137px;
    animation:
        starsDrift 55s linear infinite,
        starsPulse 5s ease-in-out infinite;
}

@keyframes starsDrift{
    to{
        transform:translate3d(-90px,55px,0);
    }
}

@keyframes starsPulse{
    0%,100%{opacity:.55}
    50%{opacity:.9}
}

.sun{
    position:absolute;
    left:50%;
    top:50%;
    width:clamp(110px,14vw,190px);
    height:clamp(110px,14vw,190px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,
            #fffbd2 0 7%,
            #ffe990 16%,
            #ffc94f 42%,
            #ff8c25 72%,
            rgba(255,102,20,.1) 100%);
    box-shadow:
        0 0 35px #ffd45c,
        0 0 90px rgba(255,170,50,.72),
        0 0 180px rgba(255,130,30,.38);
    animation:sunPulse 3.8s ease-in-out infinite;
}

.sun::before,
.sun::after{
    content:"";
    position:absolute;
    inset:-55%;
    border-radius:50%;
    background:
        conic-gradient(
            transparent 0 8%,
            rgba(255,216,90,.16) 10% 12%,
            transparent 14% 28%,
            rgba(255,220,120,.13) 30% 32%,
            transparent 34% 100%);
    animation:rayRotate 18s linear infinite;
}

.sun::after{
    inset:-80%;
    opacity:.5;
    animation-direction:reverse;
    animation-duration:27s;
}

@keyframes sunPulse{
    0%,100%{scale:.97}
    50%{scale:1.04}
}

@keyframes rayRotate{
    to{rotate:360deg}
}

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    border:1px solid rgba(150,190,255,.11);
    border-radius:50%;
    transform:translate(-50%,-50%);
    animation:orbitSpin linear infinite;
}

.orbit i{
    position:absolute;
    left:50%;
    top:-6px;
    width:12px;
    height:12px;
    margin-left:-6px;
    border-radius:50%;
    background:var(--planet,#7ec8ff);
    box-shadow:0 0 16px var(--planet,#7ec8ff);
}

.o1{width:19vw;height:19vw;min-width:145px;min-height:145px;animation-duration:8s}
.o2{width:29vw;height:29vw;min-width:215px;min-height:215px;animation-duration:13s}
.o3{width:40vw;height:40vw;min-width:300px;min-height:300px;animation-duration:19s}
.o4{width:52vw;height:52vw;min-width:390px;min-height:390px;animation-duration:27s}
.o5{width:66vw;height:66vw;min-width:490px;min-height:490px;animation-duration:36s}

@keyframes orbitSpin{
    to{rotate:360deg}
}

.planet-earth{--planet:#5fb7ff}
.planet-red{--planet:#ff766a}
.planet-blue{--planet:#8c9cff}
.planet-green{--planet:#6df0ad}
.planet-gold{--planet:#ffd66d}

/* ============================================================
   MAIN OS
   ============================================================ */

#os{
    position:relative;
    z-index:10;
    width:100%;
    height:100%;
    opacity:0;
    transition:opacity .7s ease;
}

#os.ready{
    opacity:1;
}

.topbar{
    position:fixed;
    left:12px;
    right:12px;
    top:12px;
    z-index:9000;
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 10px 8px 16px;
    border:1px solid var(--line);
    border-radius:20px;
    background:rgba(5,10,25,.66);
    backdrop-filter:blur(24px);
    box-shadow:0 15px 50px rgba(0,0,0,.28);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.brand-logo{
    width:38px;
    height:38px;
    border-radius:12px;
    object-fit:contain;
    filter:
        drop-shadow(0 0 12px rgba(255,220,100,.55));
}

.brand-name{
    font-size:14px;
    font-weight:800;
}

.brand-status{
    font-size:10px;
    color:var(--good);
    margin-top:2px;
}

.top-actions{
    display:flex;
    gap:7px;
}

.glass-button{
    min-width:40px;
    height:40px;
    border:1px solid var(--line);
    border-radius:13px;
    background:rgba(255,255,255,.055);
    color:white;
}

.glass-button:hover{
    background:rgba(255,255,255,.12);
}

.menu-button{
    font-size:22px;
}

/* ============================================================
   MENU
   ============================================================ */

#menu{
    position:fixed;
    top:78px;
    right:12px;
    bottom:12px;
    z-index:8999;
    width:min(390px,calc(100vw - 24px));
    padding:16px;
    overflow:auto;
    border:1px solid var(--line);
    border-radius:24px;
    background:rgba(5,11,27,.94);
    backdrop-filter:blur(28px);
    box-shadow:var(--shadow);
    transform:translateX(calc(100% + 30px));
    opacity:0;
    pointer-events:none;
    transition:.28s ease;
}

#menu.open{
    transform:translateX(0);
    opacity:1;
    pointer-events:auto;
}

.menu-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.menu-header strong{
    font-size:18px;
}

.menu-close{
    width:38px;
    height:38px;
    border:0;
    border-radius:12px;
    background:rgba(255,255,255,.07);
    color:white;
    font-size:20px;
}

.menu-search{
    width:100%;
    height:42px;
    margin-bottom:12px;
    padding:0 13px;
    border:1px solid var(--line);
    border-radius:13px;
    outline:none;
    background:rgba(255,255,255,.055);
    color:white;
}

.menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.menu-app{
    min-height:62px;
    padding:9px;
    display:flex;
    align-items:center;
    gap:9px;
    text-align:left;
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    background:rgba(255,255,255,.045);
    color:white;
}

.menu-app:hover{
    background:rgba(120,190,255,.12);
    border-color:rgba(120,190,255,.3);
}

.menu-icon{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    flex:none;
    border-radius:10px;
    background:rgba(255,255,255,.08);
    font-size:18px;
}

.menu-name{
    font-size:12px;
    line-height:1.25;
}

/* ============================================================
   WINDOW LAYER
   ============================================================ */

#windows{
    position:fixed;
    inset:78px 10px 10px;
    z-index:1000;
    pointer-events:none;
}

.window{
    position:absolute;
    display:flex;
    flex-direction:column;
    min-width:320px;
    min-height:220px;
    width:720px;
    height:480px;
    max-width:calc(100vw - 20px);
    max-height:calc(100vh - 95px);
    overflow:hidden;
    pointer-events:auto;
    border:1px solid rgba(255,255,255,.13);
    border-radius:19px;
    background:
        linear-gradient(
            145deg,
            rgba(10,23,48,.97),
            rgba(3,9,22,.985)
        );
    box-shadow:var(--shadow);
    backdrop-filter:blur(25px);
}

.window.active{
    border-color:rgba(145,210,255,.35);
    box-shadow:
        0 35px 100px rgba(0,0,0,.55),
        0 0 60px rgba(100,170,255,.13);
}

.window-header{
    height:48px;
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7px 0 14px;
    user-select:none;
    background:rgba(255,255,255,.045);
    border-bottom:1px solid rgba(255,255,255,.08);
    cursor:grab;
}

.window-header:active{
    cursor:grabbing;
}

.window-title{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}

.window-title-icon{
    width:29px;
    height:29px;
    display:grid;
    place-items:center;
    border-radius:9px;
    background:rgba(255,255,255,.08);
}

.window-title-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:13px;
    font-weight:700;
}

.window-controls{
    display:flex;
    gap:3px;
}

.window-control{
    width:34px;
    height:34px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:rgba(255,255,255,.72);
    font-size:16px;
}

.window-control:hover{
    background:rgba(255,255,255,.1);
    color:white;
}

.window-control.close:hover{
    background:rgba(255,75,95,.28);
}

.window-body{
    flex:1;
    min-height:0;
    overflow:auto;
}

.window-resize{
    position:absolute;
    right:2px;
    bottom:2px;
    width:20px;
    height:20px;
    cursor:nwse-resize;
}

.window-resize::after{
    content:"";
    position:absolute;
    right:3px;
    bottom:3px;
    width:10px;
    height:10px;
    border-right:2px solid rgba(255,255,255,.5);
    border-bottom:2px solid rgba(255,255,255,.5);
}

/* ============================================================
   APP UI
   ============================================================ */

.app{
    min-height:100%;
    display:flex;
    flex-direction:column;
}

.app-toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 14px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.app-toolbar button{
    min-height:34px;
    padding:0 11px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(255,255,255,.05);
    color:white;
}

.app-content{
    flex:1;
    padding:18px;
}

.card{
    padding:15px;
    margin-bottom:10px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    background:rgba(255,255,255,.04);
}

.card h3{
    margin:0 0 7px;
    font-size:15px;
}

.card p{
    margin:0;
    color:var(--muted);
    line-height:1.55;
    font-size:13px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--good);
    font-size:11px;
}

.status::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:currentColor;
    box-shadow:0 0 10px currentColor;
}

/* ============================================================
   HALDO AI
   ============================================================ */

.ai-app{
    height:100%;
    display:flex;
    flex-direction:column;
}

.ai-messages{
    flex:1;
    overflow:auto;
    padding:18px;
}

.message{
    max-width:82%;
    margin-bottom:10px;
    padding:11px 13px;
    border-radius:15px;
    line-height:1.5;
    font-size:13px;
}

.message.ai{
    background:rgba(120,185,255,.09);
    border:1px solid rgba(120,185,255,.12);
}

.message.user{
    margin-left:auto;
    background:rgba(160,125,255,.14);
    border:1px solid rgba(170,140,255,.18);
}

.ai-input{
    display:flex;
    gap:8px;
    padding:11px;
    border-top:1px solid rgba(255,255,255,.07);
}

.ai-input textarea{
    flex:1;
    min-height:44px;
    max-height:130px;
    resize:none;
    padding:11px;
    border:1px solid var(--line);
    border-radius:13px;
    outline:none;
    background:rgba(255,255,255,.045);
    color:white;
}

.ai-send{
    width:48px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#6cbcff,#9a82ff);
    color:white;
    font-size:18px;
}

/* ============================================================
   SETTINGS
   ============================================================ */

.setting{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:13px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.setting:last-child{
    border-bottom:0;
}

.setting span{
    color:var(--muted);
    font-size:12px;
}

.toggle{
    width:45px;
    height:25px;
    border:0;
    border-radius:99px;
    background:#333b4d;
    position:relative;
}

.toggle::after{
    content:"";
    position:absolute;
    width:19px;
    height:19px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:white;
    transition:.2s;
}

.toggle.on{
    background:#65caff;
}

.toggle.on::after{
    transform:translateX(20px);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media(max-width:700px){

    .topbar{
        left:8px;
        right:8px;
        top:8px;
        height:54px;
    }

    .brand-name{
        font-size:12px;
    }

    .brand-status{
        font-size:9px;
    }

    #menu{
        top:70px;
        right:8px;
        bottom:8px;
        width:calc(100vw - 16px);
    }

    .menu-grid{
        grid-template-columns:1fr 1fr;
    }

    #windows{
        inset:70px 7px 7px;
    }

    .window{
        left:0 !important;
        top:0 !important;
        width:100% !important;
        height:100% !important;
        max-width:none;
        max-height:none;
        min-width:0;
        min-height:0;
        border-radius:17px;
    }

    .window-resize{
        display:none;
    }

    .window-control{
        width:38px;
        height:36px;
    }

    .ai-messages{
        padding:13px;
    }
}
</style>
</head>

<body>

<!-- ============================================================
     BOOT SCREEN
     ============================================================ -->

<div id="boot">
    <div class="boot-stars"></div>

    <div class="boot-center">

        <img
            id="bootLogo"
            class="boot-logo"
            src="assets/logo/logo.png"
            alt="HalDo"
            onerror="this.style.display='none'"
        >

        <div class="boot-title">
            HalDo AI OS 22
        </div>

        <div
            id="bootStatus"
            class="boot-status"
        >
            HalDo AI wird gestartet …
        </div>

        <div class="boot-progress">
            <span id="bootProgress"></span>
        </div>

    </div>
</div>


<!-- ============================================================
     COSMIC WORLD
     ============================================================ -->

<div id="cosmic">

    <div class="cosmic-stars"></div>

    <div class="sun"></div>

    <div class="orbit o1">
        <i class="planet-earth"></i>
    </div>

    <div class="orbit o2">
        <i class="planet-red"></i>
    </div>

    <div class="orbit o3">
        <i class="planet-blue"></i>
    </div>

    <div class="orbit o4">
        <i class="planet-green"></i>
    </div>

    <div class="orbit o5">
        <i class="planet-gold"></i>
    </div>

</div>


<!-- ============================================================
     OPERATING SYSTEM
     ============================================================ -->

<div id="os">

    <header class="topbar">

        <div class="brand">

            <img
                class="brand-logo"
                src="assets/logo/logo.png"
                alt="HalDo"
                onerror="this.style.display='none'"
            >

            <div>
                <div class="brand-name">
                    HalDo AI OS 22
                </div>

                <div
                    id="systemStatus"
                    class="brand-status"
                >
                    ● START · ONLINE
                </div>
            </div>

        </div>

        <div class="top-actions">

            <button
                id="aiTopButton"
                class="glass-button"
                type="button"
                title="HalDo AI"
            >
                ✦
            </button>

            <button
                id="menuButton"
                class="glass-button menu-button"
                type="button"
                title="Menü"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- ========================================================
         APPLICATION MENU
         ======================================================== -->

    <aside id="menu">

        <div class="menu-header">

            <strong>
                HalDo Apps
            </strong>

            <button
                id="menuClose"
                class="menu-close"
                type="button"
            >
                ×
            </button>

        </div>

        <input
            id="appSearch"
            class="menu-search"
            type="search"
            placeholder="App suchen …"
            autocomplete="off"
        >

        <div
            id="menuGrid"
            class="menu-grid"
        ></div>

    </aside>


    <!-- ========================================================
         WINDOWS
         ======================================================== -->

    <main id="windows"></main>

</div>


<script>
"use strict";

/* ================================================================
   HALDO AI OS 22
   SAFE MASTER RUNTIME
   ================================================================ */

(function(){

    const HD =
        window.HalDo =
        window.HalDo || {};

    HD.name =
        "HalDo AI OS";

    HD.product =
        "HalDo AI OS 22";

    HD.version =
        "22.0.0";

    HD.codename =
        "Cosmic World";


    /* ============================================================
       SAFE EVENTS
       ============================================================ */

    HD.events =
        HD.events || {};

    HD.events.listeners =
        HD.events.listeners || {};

    HD.on =
        function(
            name,
            callback
        ){

            if(
                typeof callback !==
                "function"
            ){

                return function(){};

            }

            if(
                !HD.events.listeners[name]
            ){

                HD.events.listeners[name] =
                    new Set();

            }

            HD.events.listeners[name]
                .add(callback);

            return function(){

                HD.events.listeners[name]
                    ?.delete(callback);

            };

        };

            try{

                    ?.forEach(
                        callback => {

                            try{

                            }
                            catch(error){

                                console.error(
                                    "[HalDo Event]",
                                    name,
                                    error
                                );

                            }

                        }
                    );

            }
            catch(error){

                console.error(
                    "[HalDo Events]",
                    error
                );

            }

            try{

                window.dispatchEvent(
                    new CustomEvent(
                        "haldo:" + name,
                        {
                            detail:data
                        }
                    )
                );

            }
            catch(_){}

        };

                        return fallback;

                    }

                    return JSON.parse(raw);

                catch(error){

                    console.warn(
                        "[HalDo Storage]",

                    );

                }

            },

            set(

                    );

                }
                catch(error){

                    );

                }

            },

            remove(

            /* DRAG */

            let dragging =
                false;

            let dx =

                        ) + "px";

                    win.style.top =

                        ) + "px";

            );


            header.addEventListener(

                        );

            let resizing =
                false;

            let startY =
                0;

                0;

            let startH =
                0;

                    resizing =

                    const rect =
                        win.getBoundingClientRect();

                    startX =

                    startY =
                        event.clientY;

                    startW =
                        rect.width;

                    startH =
                        rect.height;

                    try{

                        resize.setPointerCapture(
                            event.pointerId
                        );

                    }
                    catch(_){}

                }
            );


            resize.addEventListener(
                "pointermove",
                event => {

                    if(!resizing){

                        return;

                    }

                    win.style.width =
                        Math.max(
                            320,
                            startW +
                            event.clientX -
                            startX
                        ) + "px";

                    win.style.height =
                        Math.max(
                            220,
                            startH +
                            event.clientY -
                            startY
                        ) + "px";

                }
            );


            resize.addEventListener(
                "pointerup",
                event => {

                    resizing =
                        false;

                    try{

                        resize.releasePointerCapture(
                            event.pointerId
                        );

                    }
                    catch(_){}

                    this.save(
                        app.id,
                        win
                    );

                }
            );

            };

            record.element.style.zIndex =
                String(

            this.windows.forEach(
                item => {

                    item.element
                        .classList
                        .remove(
                            "active"
                        );

                }
            );

            record.element
                .classList
                .add(
                    "active"
                );

        },


        close(
            appId
        ){

            const record =
                this.windows.get(
                    appId
                );

            if(!record){

                return false;

            }

            this.save(
                appId,
                record.element
            );

            record.element.remove();

            this.windows.delete(
                appId
            );

            HD.emit(
                "app:closed",
                {
                    appId
                }
            );

            return true;

        },


        save(
            appId,
            element
        ){

            const state =
                HD.appState.get(
                    appId
                );

            const rect =
                element.getBoundingClientRect();

            state.x =
                rect.left;

            state.y =
                rect.top;

            state.width =
                rect.width;

            state.height =
                rect.height;

            HD.appState.save(
                appId,
                state
            );

        }

    };

    function boot(){

        const status =
            document.getElementById(
                "bootStatus"
            );

        const progress =
            document.getElementById(
                "bootProgress"
            );

        const bootScreen =
            document.getElementById(
                "boot"
            );

        const os =
            document.getElementById(
                "os"
            );


        const steps = [

            [15,"HalDo AI wird gestartet …"],
            [30,"Cosmic World wird aktiviert …"],
            [45,"AI Core wird verbunden …"],
            [60,"App-System wird geladen …"],
            [72,"Window-System wird aktiviert …"],
            [84,"Storage und Persistence werden verbunden …"],
            [94,"HalDo Apps werden bereitgestellt …"],
            [100,"HalDo AI OS 22 ist bereit."]

        ];


        let index =
            0;


        function next(){

            if(
                index >=
                steps.length
            ){

                HD.started =
                    true;

                HD.ready =
                    true;

                HD.booted =
                    true;

                HD.emit(
                    "boot:complete",
                    {
                        version:
                            HD.version
                    }
                );


                os.classList.add(
                    "ready"
                );


                setTimeout(
                    () => {

                        bootScreen
                            .classList
                            .add(
                                "hidden"
                            );

                    },
                    350
                );


                return;

            }


            progress.style.width =
                steps[index][0] +
                "%";

            status.textContent =
                steps[index][1];

            index++;

            setTimeout(
                next,
                180
            );

        }


        next();

    }

        }
    );


    /* ============================================================
       INITIAL START
       ============================================================ */

    if(
        document.readyState ===
        "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            boot,
            {
                once:true
            }
        );

    }
    else{

        boot();

    }


    /* ============================================================
       OPTIONAL EXISTING MODULE CONNECTION
       ============================================================ */

    /*
     * Die vorhandenen Projektmodule werden bewusst
     * nicht blind dupliziert.
     *
     * Wenn sie vorhanden sind, werden sie nach dem
     * stabilen Shell-Start eingebunden.
     *
     * Ein Fehler eines einzelnen Moduls darf den
     * Start des Betriebssystems nicht verhindern.
     */

    const optionalModules = [

        "js/kernel.js",
        "js/system.js",
        "js/storage.js",
        "js/storage-manager.js",
        "js/language-system.js",
        "js/language-manager.js",
        "js/ezidi-keyboard.js",
        "js/voice.js",
        "js/ai-core.js",
        "js/ai-chat.js",
        "js/ai-language.js",
        "js/ai-memory.js",
        "js/app-registry.js",
        "js/app-manager.js",
        "js/app-router.js",
        "js/window-manager.js",
        "js/module-manager.js",
        "js/system-loader.js"
    ];


    function loadOptional(
        src
    ){

        return new Promise(
            resolve => {

                const script =
                    document.createElement(
                        "script"
                    );

                script.src =
                    src;

                script.async =
                    false;

                script.onload =
                    () => resolve(true);

                script.onerror =
                    () => {

                        console.warn(
                            "[HalDo] Optionales Modul nicht geladen:",
                            src
                        );

                        resolve(false);

                    };

                document.head.appendChild(
                    script
                );

            }
        );

    }


    window.addEventListener(
        "haldo:boot:complete",
        async () => {

            for(
                const src of
                optionalModules
            ){

                try{

                    await loadOptional(
                        src
                    );

                }
                catch(error){

                    console.warn(
                        "[HalDo Module]",
                        src,
                        error
                    );

                }

            }

            HD.emit(
                "modules:connected"
            );

        },
        {
            once:true
        }
    );


    /* ============================================================
       APP CONTENT FACTORY
       ============================================================ */

    function buildApp(
        app
    ){

        if(
            app.id ===
            "haldo-ai"
        ){

            return buildAI();

        }


        if(
            app.id ===
            "settings"
        ){

            return buildSettings();

        }


        if(
            app.id ===
            "app-store"
        ){

            return buildStore();

        }


        return buildGeneric(
            app
        );

    }


    function buildAI(){

        return `
            <div class="ai-app">

                <div
                    id="aiMessages"
                    class="ai-messages"
                >
                    <div class="message ai">
                        Hallo ❤️ Ich bin HalDo AI.
                        Ich bin bereit, mit dir zu schreiben,
                        zu sprechen, zu erklären, zu planen
                        und gemeinsam Aufgaben zu bearbeiten.
                    </div>
                </div>

                <div class="ai-input">

                    <textarea
                        id="aiInput"
                        placeholder="Schreib mit HalDo AI …"
                    ></textarea>

                    <button
                        id="aiSend"
                        class="ai-send"
                        type="button"
                    >
                        ➤
                    </button>

                </div>

            </div>
        `;

    }


    function buildSettings(){

        return `
            <div class="app">
                <div class="app-toolbar">
                    <button data-setting="sound">
                        🔊 Startton
                    </button>

                    <button data-setting="cosmic">
                        ☀️ Cosmic World
                    </button>

                    <button data-setting="animations">
                        ✨ Animationen
                    </button>
                </div>

                <div class="app-content">

                    <div class="card">
                        <h3>HalDo AI OS 22</h3>
                        <p>
                            Zentrale Systemeinstellungen,
                            Erscheinungsbild, Startverhalten,
                            Ton, Animationen und Persistence.
                        </p>
                    </div>

                    ${settingHTML(
                        "sound",
                        "Startton"
                    )}

                    ${settingHTML(
                        "voice",
                        "Voice / Sprache"
                    )}

                    ${settingHTML(
                        "animations",
                        "Animationen"
                    )}

                    ${settingHTML(
                        "cosmic",
                        "Lebendige Cosmic World"
                    )}

                </div>
            </div>
        `;

    }


    function settingHTML(
        key,
        title
    ){

        const value =
            !!HD.config[
                key +
                (
                    key ===
                    "sound"
                        ? "Enabled"
                        : "Enabled"
                )
            ];

        return `
            <div class="setting">

                <div>
                    <strong>
                        ${escapeHTML(title)}
                    </strong>

                    <br>

                    <span>
                        Diese Einstellung wird
                        lokal gespeichert.
                    </span>
                </div>

                <button
                    class="toggle ${value ? "on" : ""}"
                    data-toggle="${key}"
                    type="button"
                ></button>

            </div>
        `;

    }


    function buildStore(){

        return `
            <div class="app">

                <div class="app-toolbar">
                    <button type="button">
                        🛍️ App Store
                    </button>

                    <button type="button">
                        🔄 Aktualisieren
                    </button>
                </div>

                <div class="app-content">

                    <div class="card">
                        <h3>
                            HalDo App Store
                        </h3>

                        <p>
                            Die zentrale App-Plattform
                            von HalDo AI OS 22.
                            Installierte und zukünftige
                            Apps werden hier verwaltet.
                        </p>
                    </div>

                    ${HD.apps.catalog.map(
                        app => `
                            <div class="card">

                                <h3>
                                    ${escapeHTML(app.icon)}
                                    ${escapeHTML(app.name)}
                                </h3>

                                <p>
                                    Kategorie:
                                    ${escapeHTML(app.category)}
                                </p>

                                <br>

                                <button
                                    class="store-open"
                                    data-app="${escapeHTML(app.id)}"
                                    type="button"
                                >
                                    Öffnen
                                </button>

                            </div>
                        `
                    ).join("")}

                </div>

            </div>
        `;

    }


    function buildGeneric(
        app
    ){

        return `
            <div class="app">

                <div class="app-toolbar">

                    <button type="button">
                        ${escapeHTML(app.icon)}
                        ${escapeHTML(app.name)}
                    </button>

                    <button
                        type="button"
                        data-generic-action="new"
                    >
                        ＋ Neu
                    </button>

                    <button
                        type="button"
                        data-generic-action="save"
                    >
                        💾 Speichern
                    </button>

                    <button
                        type="button"
                        data-generic-action="settings"
                    >
                        ⚙ Einstellungen
                    </button>

                </div>

                <div class="app-content">

                    <div class="card">

                        <h3>
                            ${escapeHTML(app.icon)}
                            ${escapeHTML(app.name)}
                        </h3>

                        <p>
                            HalDo AI OS 22 Anwendung ·
                            Kategorie:
                            ${escapeHTML(app.category)}
                        </p>

                        <br>

                        <span class="status">
                            APP ONLINE
                        </span>

                    </div>

                    <div class="card">

                        <h3>
                            Arbeitsbereich
                        </h3>

                        <p>
                            Diese Anwendung ist mit
                            App Manager, Window System,
                            Router, Runtime, Events und
                            Storage verbunden.
                        </p>

                    </div>

                    <div class="card">

                        <h3>
                            HalDo AI Unterstützung
                        </h3>

                        <p>
                            HalDo AI kann diese Anwendung
                            bei geeigneten Aufgaben unterstützen.
                        </p>

                        <br>

                        <button
                            type="button"
                            data-ai-open="true"
                        >
                            ✦ HalDo AI öffnen
                        </button>

                    </div>

                </div>

            </div>
        `;

    }


    /* ============================================================
       WINDOW CONTENT EVENTS
       ============================================================ */

    document.addEventListener(
        "click",
        event => {

            const aiOpen =
                event.target.closest(
                    "[data-ai-open]"
                );

            if(aiOpen){

                HD.appManager.open(
                    "haldo-ai"
                );

                return;

            }


            const storeOpen =
                event.target.closest(
                    ".store-open"
                );

            if(storeOpen){

                HD.appManager.open(
                    storeOpen.dataset.app
                );

                return;

            }


            const toggle =
                event.target.closest(
                    "[data-toggle]"
                );

            if(toggle){

                const key =
                    toggle.dataset.toggle;

                let value =
                    !toggle.classList
                        .contains(
                            "on"
                        );

                toggle.classList.toggle(
                    "on",
                    value
                );

                HD.config[
                    key +
                    "Enabled"
                ] =
                    value;

                HD.storage.set(
                    "setting." + key,
                    value
                );

                return;

            }


            if(
                event.target.id ===
                "aiSend"
            ){

                sendAI();

                return;

            }

        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if(
                event.key ===
                "Enter" &&
                !event.shiftKey &&
                event.target.id ===
                "aiInput"
            ){

                event.preventDefault();

                sendAI();

            }

        }
    );


    function sendAI(){

        const input =
            document.getElementById(
                "aiInput"
            );

        const messages =
            document.getElementById(
                "aiMessages"
            );

        if(
            !input ||
            !messages
        ){

            return;

        }

        const text =
            input.value.trim();

        if(!text){

            return;

        }

        const user =
            document.createElement(
                "div"
            );

        user.className =
            "message user";

        user.textContent =
            text;

        messages.appendChild(
            user
        );

        input.value =
            "";

        const response =
            document.createElement(
                "div"
            );

        response.className =
            "message ai";

        response.textContent =
            HD.ai.answer(
                text
            );

        messages.appendChild(
            response
        );

        messages.scrollTop =
            messages.scrollHeight;

        HD.ai.conversation.push(
            {
                role:"user",
                content:text
            },
            {
                role:"assistant",
                content:response.textContent
            }
        );

        HD.storage.set(
            "ai.conversation",
            HD.ai.conversation
        );

    }


    /* ============================================================
       HELPERS
       ============================================================ */

    function controlButton(
        text,
        title
    ){

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "window-control";

        button.type =
            "button";

        button.textContent =
            text;

        button.title =
            title;

        return button;

    }


    function escapeHTML(
        value
    ){

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* ============================================================
       GLOBAL COMPATIBILITY
       ============================================================ */

    HD.windowManager.initialize =
        function(){

            return true;

        };

    HD.windowManager.initialize();

    HD.windows =
        HD.windowManager;

    HD.appRegistry =
        HD.apps.registry;

    HD.ready =
        false;


})();
</script>

</body>
</html>
