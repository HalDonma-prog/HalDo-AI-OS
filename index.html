<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
HalDo AI OS 18
</title>


<link rel="stylesheet"
href="style.css">


<link rel="manifest"
href="manifest.json">


<meta name="theme-color"
content="#090D18">


</head>


<body>


<!-- =========================
BOOT SCREEN
========================= -->


<section id="startup-screen"
class="boot-screen">



<img

id="system-logo"

src="assets/logo/logo.svg"

class="logo"

alt="HalDo AI OS Logo">



<h1>
HalDo AI OS 18
</h1>



<p id="status">

🟡 System startet...

</p>



<p id="startup-message">

Boot wird vorbereitet...

</p>



</section>






<!-- =========================
WELCOME SCREEN
========================= -->


<section id="welcome-screen"

class="boot-screen hidden">



<img

src="assets/logo/logo.svg"

class="logo"

alt="HalDo AI OS Logo">



<h1>

👋 Willkommen bei

<br>

HalDo AI OS 18

</h1>



<h3>

Professional Ultimate Foundation

</h3>



<p id="system-time">

Systemzeit

</p>



<p>

🟢 System bereit

</p>



<button onclick="openDesktop()">

🚀 Hauptmenü öffnen

</button>



</section>








<!-- =========================
DESKTOP / MAIN MENU
========================= -->


<section id="desktop"

class="hidden">





<header class="header">


<img

src="assets/logo/logo.svg"

class="logo"

alt="HalDo AI OS Logo">



<h1>

HalDo AI OS 18

</h1>



<p>

Professional Ultimate Foundation

</p>



<p id="desktop-time">

</p>


</header>








<main class="main-menu">



<h2>

🚀 Hauptmenü

</h2>





<div class="menu-grid">



<button onclick="openPage('dashboard.html')">

📊 Dashboard

</button>



<button onclick="openPage('ai-core.html')">

🤖 AI Core

</button>



<button onclick="openPage('modules.html')">

🧩 Module

</button>



<button onclick="openPage('apps.html')">

📱 Apps

</button>



<button onclick="openPage('settings.html')">

⚙️ Einstellungen

</button>



<button onclick="openPage('status.html')">

📡 System Status

</button>



</div>


</main>



</section>









<script src="js/boot.js"></script>

<script src="js/startup.js"></script>





<script>


function openDesktop(){


document.getElementById(
"welcome-screen"
).classList.add(
"hidden"
);



document.getElementById(
"desktop"
).classList.remove(
"hidden"
);



}





function openPage(page){


window.location.href =
page;


}






function updateTime(){


let now =
new Date();



let time =
now.toLocaleTimeString(
"de-DE"
);



let system =
document.getElementById(
"system-time"
);



let desktop =
document.getElementById(
"desktop-time"
);



if(system){

system.innerHTML =
"🕒 " + time;

}



if(desktop){

desktop.innerHTML =
"🕒 " + time;

}



}



setInterval(
updateTime,
1000
);



updateTime();



</script>





</body>

</html>
