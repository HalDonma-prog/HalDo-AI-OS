<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#081b3d"
    >

    <meta
        name="application-name"
        content="HalDo AI OS"
    >

    <meta
        name="description"
        content="HalDo AI OS – ein lebendiges, intelligentes Cosmic Operating System."
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        href="./assets/logo/logo.png"
    >

    <link
        rel="apple-touch-icon"
        href="./assets/logo/logo.png"
    >

    <!-- Vorhandenes HalDo Logo-System -->
    <link
        rel="stylesheet"
        href="./css/haldo-logo-engine.css"
    >

    <style>

        /* =========================================================
           HALDO AI OS 20
           INDEX / COSMIC OS SHELL
           ========================================================= */

        :root {
            --haldo-blue: #58b9ff;
            --haldo-cyan: #62f4ff;
            --haldo-purple: #9d72ff;
            --haldo-pink: #e77cff;
            --haldo-gold: #ffd86b;
            --haldo-orange: #ff9b43;

            --space-0: #020817;
            --space-1: #061633;
            --space-2: #0a2250;

            --glass:
                rgba(8, 27, 61, 0.62);

            --glass-strong:
                rgba(6, 20, 48, 0.88);

            --border:
                rgba(150, 220, 255, 0.18);

            --text:
                #ffffff;

            --muted:
                rgba(255, 255, 255, 0.62);
        }


        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            background:
                var(--space-0);

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                system-ui,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        body {
            min-height: 100dvh;
        }


        button,
        input,
        textarea,
        select {
            font: inherit;
        }


        button {
            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================================
           ROOT
           ========================================================= */

        #haldo-os {
            position: fixed;
            inset: 0;

            overflow: hidden;

            isolation: isolate;

            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    rgba(255, 185, 65, 0.12) 0%,
                    rgba(91, 124, 255, 0.10) 17%,
                    rgba(52, 66, 160, 0.12) 33%,
                    rgba(12, 28, 72, 0.35) 58%,
                    #020817 100%
                );
        }


        /* =========================================================
           COSMIC WORLD
           ========================================================= */

        #haldo-cosmic-world {
            position: absolute;
            inset: 0;

            z-index: 1;

            overflow: hidden;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at 18% 18%,
                    rgba(65, 143, 255, 0.16),
                    transparent 31%
                ),
                radial-gradient(
                    ellipse at 82% 23%,
                    rgba(159, 81, 255, 0.15),
                    transparent 30%
                ),
                radial-gradient(
                    ellipse at 76% 78%,
                    rgba(49, 215, 220, 0.10),
                    transparent 29%
                ),
                radial-gradient(
                    ellipse at 24% 78%,
                    rgba(255, 91, 157, 0.08),
                    transparent 29%
                );
        }


        /* =========================================================
           NEBULA
           ========================================================= */

        .haldo-nebula {
            position: absolute;
            inset: -18%;

            opacity: 0.75;

            filter: blur(30px);

            background:
                radial-gradient(
                    ellipse at 25% 40%,
                    rgba(42, 115, 255, 0.17),
                    transparent 28%
                ),
                radial-gradient(
                    ellipse at 70% 30%,
                    rgba(160, 76, 255, 0.16),
                    transparent 27%
                ),
                radial-gradient(
                    ellipse at 55% 75%,
                    rgba(20, 210, 216, 0.11),
                    transparent 29%
                );

            animation:
                haldo-nebula-drift
                42s
                ease-in-out
                infinite alternate;
        }


        /* =========================================================
           STAR FIELD
           ========================================================= */

        .haldo-stars,
        .haldo-stars-small,
        .haldo-stars-large {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }


        .haldo-stars {
            opacity: 0.85;

            background-image:
                radial-gradient(
                    circle at 5% 10%,
                    rgba(255,255,255,.95) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 17% 28%,
                    rgba(105,205,255,.85) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 28% 9%,
                    rgba(255,225,146,.9) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 42% 25%,
                    rgba(208,186,255,.9) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 56% 11%,
                    rgba(255,255,255,.95) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 69% 34%,
                    rgba(117,220,255,.85) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 82% 13%,
                    rgba(255,218,151,.9) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 93% 39%,
                    rgba(210,190,255,.9) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 11% 67%,
                    rgba(160,225,255,.9) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 31% 84%,
                    rgba(255,255,255,.9) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 58% 91%,
                    rgba(255,217,144,.9) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 86% 78%,
                    rgba(133,215,255,.9) 0 1px,
                    transparent 2px
                );

            background-size:
                210px 210px,
                270px 270px,
                320px 320px,
                250px 250px,
                360px 360px,
                300px 300px,
                390px 390px,
                280px 280px,
                330px 330px,
                240px 240px,
                410px 410px,
                350px 350px;

            animation:
                haldo-star-drift
                70s
                linear
                infinite;
        }


        .haldo-stars-small {
            opacity: 0.65;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.8) 0 0.7px,
                    transparent 1.6px
                );

            background-size:
                82px 82px;

            animation:
                haldo-star-drift-small
                95s
                linear
                infinite;
        }


        .haldo-stars-large {
            opacity: 0.9;

            background:
                radial-gradient(
                    circle at 13% 53%,
                    rgba(255,255,255,.95) 0 2px,
                    transparent 4px
                ),
                radial-gradient(
                    circle at 74% 17%,
                    rgba(115,215,255,.95) 0 2px,
                    transparent 5px
                ),
                radial-gradient(
                    circle at 86% 64%,
                    rgba(255,216,136,.95) 0 2px,
                    transparent 5px
                ),
                radial-gradient(
                    circle at 38% 31%,
                    rgba(203,180,255,.95) 0 2px,
                    transparent 5px
                ),
                radial-gradient(
                    circle at 57% 82%,
                    rgba(111,239,255,.9) 0 2px,
                    transparent 5px
                );

            animation:
                haldo-star-pulse
                5s
                ease-in-out
                infinite alternate;
        }


        /* =========================================================
           COSMIC SUN
           ========================================================= */

        #haldo-sun-system {
            position: absolute;

            left: 50%;
            top: 50%;

            width:
                min(76vw, 680px);

            height:
                min(76vw, 680px);

            transform:
                translate(-50%, -50%);

            z-index: 4;
        }


        #haldo-sun-glow {
            position: absolute;

            left: 50%;
            top: 50%;

            width:
                clamp(180px, 26vw, 320px);

            height:
                clamp(180px, 26vw, 320px);

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 243, 172, .55) 0%,
                    rgba(255, 205, 88, .33) 22%,
                    rgba(255, 139, 42, .20) 42%,
                    rgba(255, 78, 37, .09) 60%,
                    transparent 74%
                );

            filter:
                blur(8px);

            animation:
                haldo-sun-glow
                7s
                ease-in-out
                infinite;
        }


        #haldo-sun {
            position: absolute;

            left: 50%;
            top: 50%;

            width:
                clamp(82px, 12vw, 165px);

            height:
                clamp(82px, 12vw, 165px);

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 36% 30%,
                    #ffffff 0%,
                    #fffbe0 9%,
                    #ffe99a 20%,
                    #ffc64e 38%,
                    #ff8e2e 57%,
                    #ff5428 73%,
                    #e83528 100%
                );

            box-shadow:
                0 0 18px rgba(255,250,207,.95),
                0 0 40px rgba(255,220,103,.95),
                0 0 75px rgba(255,165,49,.82),
                0 0 125px rgba(255,112,42,.58),
                0 0 190px rgba(255,77,44,.35);

            animation:
                haldo-sun-breathe
                7s
                ease-in-out
                infinite;
        }


        #haldo-sun::before {
            content: "";

            position: absolute;

            inset: -75%;

            border-radius: 50%;

            background:
                conic-gradient(
                    from 0deg,
                    transparent 0deg,
                    rgba(255,218,100,.13) 15deg,
                    transparent 35deg,
                    rgba(255,170,65,.13) 65deg,
                    transparent 95deg,
                    rgba(255,238,140,.14) 125deg,
                    transparent 160deg,
                    rgba(255,180,70,.12) 205deg,
                    transparent 250deg,
                    rgba(255,225,120,.14) 290deg,
                    transparent 330deg,
                    rgba(255,185,70,.12) 350deg,
                    transparent 360deg
                );

            filter:
                blur(7px);

            animation:
                haldo-solar-rays
                28s
                linear
                infinite;
        }


        #haldo-sun::after {
            content: "";

            position: absolute;

            inset: -48%;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,225,125,.22);

            box-shadow:
                0 0 30px
                rgba(255,200,90,.22);

            animation:
                haldo-solar-ring
                17s
                linear
                infinite reverse;
        }


        /* =========================================================
           ORBITS
           ========================================================= */

        .haldo-orbit {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border:
                1px solid
                rgba(117, 200, 255, .18);

            border-radius: 50%;

            box-shadow:
                0 0 20px
                rgba(76,160,255,.08);

            opacity: .9;
        }


        .haldo-orbit::after {
            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            left: 50%;
            top: -3px;

            border-radius: 50%;

            background:
                var(--haldo-cyan);

            box-shadow:
                0 0 10px
                rgba(98,244,255,.95);
        }


        .orbit-a {
            width: 180px;
            height: 92px;

            transform:
                translate(-50%, -50%)
                rotate(-17deg);
        }


        .orbit-b {
            width: 285px;
            height: 140px;

            transform:
                translate(-50%, -50%)
                rotate(31deg);
        }


        .orbit-c {
            width: 405px;
            height: 205px;

            transform:
                translate(-50%, -50%)
                rotate(-39deg);
        }


        .orbit-d {
            width: 540px;
            height: 275px;

            transform:
                translate(-50%, -50%)
                rotate(17deg);
        }


        .orbit-e {
            width: 690px;
            height: 350px;

            transform:
                translate(-50%, -50%)
                rotate(-27deg);

            opacity: .5;
        }


        /* =========================================================
           PLANETS
           ========================================================= */

        .haldo-planet {
            position: absolute;

            border-radius: 50%;

            box-shadow:
                inset -14px -14px 22px
                    rgba(0,0,0,.48),
                inset 7px 7px 13px
                    rgba(255,255,255,.18),
                0 0 16px
                    rgba(120,200,255,.25);
        }


        .planet-one {
            width: 18px;
            height: 18px;

            left: 50%;
            top: 50%;

            margin-left: -9px;
            margin-top: -9px;

            background:
                radial-gradient(
                    circle at 30% 28%,
                    #f4ffff,
                    #8eafff 30%,
                    #40369b 68%,
                    #17162e
                );

            animation:
                haldo-planet-one
                13s
                linear
                infinite;
        }


        .planet-two {
            width: 27px;
            height: 27px;

            left: 50%;
            top: 50%;

            margin-left: -13px;
            margin-top: -13px;

            background:
                radial-gradient(
                    circle at 32% 28%,
                    #fff4d8,
                    #e2a065 32%,
                    #88462c 67%,
                    #25130f
                );

            animation:
                haldo-planet-two
                21s
                linear
                infinite reverse;
        }


        .planet-three {
            width: 36px;
            height: 36px;

            left: 50%;
            top: 50%;

            margin-left: -18px;
            margin-top: -18px;

            background:
                radial-gradient(
                    circle at 31% 25%,
                    #d7fff8,
                    #4bcdb6 35%,
                    #176d7d 68%,
                    #071a27
                );

            animation:
                haldo-planet-three
                29s
                linear
                infinite;
        }


        .planet-four {
            width: 45px;
            height: 45px;

            left: 50%;
            top: 50%;

            margin-left: -22px;
            margin-top: -22px;

            background:
                radial-gradient(
                    circle at 31% 26%,
                    #fff4ce,
                    #bd79ff 32%,
                    #5a287f 68%,
                    #190b2b
                );

            animation:
                haldo-planet-four
                39s
                linear
                infinite reverse;
        }


        .planet-five {
            width: 58px;
            height: 58px;

            left: 50%;
            top: 50%;

            margin-left: -29px;
            margin-top: -29px;

            background:
                radial-gradient(
                    circle at 32% 26%,
                    #e2f2ff,
                    #5b8de0 32%,
                    #24427d 67%,
                    #09152c
                );

            animation:
                haldo-planet-five
                53s
                linear
                infinite;
        }


        /* =========================================================
           TOP SYSTEM BAR
           ========================================================= */

        #haldo-topbar {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            min-height: 64px;

            padding:
                env(safe-area-inset-top)
                18px
                12px
                18px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            z-index: 100;

            background:
                linear-gradient(
                    to bottom,
                    rgba(3,13,34,.76),
                    rgba(3,13,34,.28),
                    transparent
                );

            backdrop-filter:
                blur(8px);
        }


        #haldo-brand {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        #haldo-brand-logo {
            width: 42px;
            height: 42px;

            object-fit: contain;

            border-radius: 50%;

            filter:
                drop-shadow(
                    0 0 14px
                    rgba(104,205,255,.75)
                );
        }


        #haldo-brand-name {
            font-size: 15px;
            font-weight: 800;

            letter-spacing: .02em;
        }


        #haldo-brand-version {
            margin-top: 2px;

            font-size: 9px;

            color:
                var(--muted);
        }


        #haldo-system-status {
            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 10px;

            color:
                rgba(255,255,255,.65);
        }


        #haldo-status-light {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                #61f2b0;

            box-shadow:
                0 0 12px
                rgba(97,242,176,.95);
        }


        /* =========================================================
           DESKTOP LAYER
           ========================================================= */

        #haldo-desktop {
            position: absolute;
            inset: 0;

            z-index: 20;

            pointer-events: none;
        }


        #haldo-desktop > * {
            pointer-events: auto;
        }


        /* =========================================================
           CENTER HALDO LOGO
           ========================================================= */

        #haldo-center {
            position: absolute;

            left: 50%;
            top: 50%;

            width:
                clamp(150px, 24vw, 230px);

            height:
                clamp(150px, 24vw, 230px);

            transform:
                translate(-50%, -50%);

            border: 0;

            padding: 0;

            background:
                transparent;

            z-index: 30;

            cursor: pointer;
        }


        #haldo-center-orbit {
            position: absolute;

            inset: 0;

            border:
                1px solid
                rgba(125,218,255,.24);

            border-radius: 50%;

            box-shadow:
                0 0 30px
                rgba(90,170,255,.14);

            animation:
                haldo-logo-orbit
                18s
                linear
                infinite;
        }


        #haldo-center-orbit::after {
            content: "";

            position: absolute;

            left: 7%;
            top: 50%;

            width: 7px;
            height: 7px;

            transform:
                translateY(-50%);

            border-radius: 50%;

            background:
                #b9f5ff;

            box-shadow:
                0 0 16px
                #73eaff;
        }


        #haldo-center-logo {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 58%;
            height: 58%;

            transform:
                translate(-50%, -50%);

            object-fit: contain;

            border-radius: 50%;

            filter:
                drop-shadow(
                    0 0 15px
                    rgba(120,215,255,.8)
                );

            transition:
                transform .45s ease,
                filter .45s ease;
        }


        #haldo-center:hover
        #haldo-center-logo,
        #haldo-center.active
        #haldo-center-logo {

            transform:
                translate(-50%, -50%)
                scale(1.08);

            filter:
                drop-shadow(
                    0 0 30px
                    rgba(255,220,110,1)
                );
        }


        /* =========================================================
           COSMIC MENU
           ========================================================= */

        #haldo-menu {
            position: absolute;

            left: 50%;
            top: 50%;

            width:
                min(94vw, 850px);

            max-height:
                min(76vh, 650px);

            transform:
                translate(-50%, -50%)
                scale(.92);

            opacity: 0;

            visibility: hidden;

            overflow: auto;

            padding: 22px;

            border:
                1px solid
                rgba(130,215,255,.20);

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(8,28,67,.91),
                    rgba(36,18,78,.88),
                    rgba(8,34,67,.91)
                );

            backdrop-filter:
                blur(30px);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.62),
                0 0 80px
                rgba(78,157,255,.12);

            z-index: 500;

            transition:
                opacity .35s ease,
                transform .35s ease,
                visibility .35s ease;
        }


        #haldo-menu.open {
            opacity: 1;

            visibility: visible;

            transform:
                translate(-50%, -50%)
                scale(1);
        }


        #haldo-menu-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }


        #haldo-menu-title {
            font-size: 23px;
            font-weight: 850;
        }


        #haldo-menu-subtitle {
            margin-top: 4px;

            font-size: 10px;

            color:
                var(--muted);
        }


        #haldo-menu-close {
            width: 42px;
            height: 42px;

            border:
                1px solid
                rgba(150,220,255,.16);

            border-radius: 14px;

            color: white;

            background:
                rgba(255,255,255,.07);

            cursor: pointer;
        }


        /* =========================================================
           APP GRID
           ========================================================= */

        #haldo-app-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(118px, 1fr)
                );

            gap: 11px;
        }


        .haldo-app-button {
            position: relative;

            min-height: 116px;

            padding: 14px;

            border:
                1px solid
                rgba(140,215,255,.13);

            border-radius: 20px;

            overflow: hidden;

            color: white;

            text-align: left;

            background:
                linear-gradient(
                    145deg,
                    rgba(69,153,255,.12),
                    rgba(139,70,255,.09)
                );

            cursor: pointer;

            transition:
                transform .22s ease,
                border-color .22s ease,
                background .22s ease,
                box-shadow .22s ease;
        }


        .haldo-app-button::before {
            content: "";

            position: absolute;

            width: 90px;
            height: 90px;

            right: -30px;
            top: -35px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(95,215,255,.16),
                    transparent 70%
                );
        }


        .haldo-app-button:hover,
        .haldo-app-button:focus-visible {
            transform:
                translateY(-3px);

            border-color:
                rgba(130,220,255,.38);

            background:
                linear-gradient(
                    145deg,
                    rgba(65,160,255,.22),
                    rgba(151,72,255,.17)
                );

            box-shadow:
                0 12px 35px
                rgba(20,70,150,.25);

            outline: none;
        }


        .haldo-app-icon {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 43px;
            height: 43px;

            margin-bottom: 12px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(85,195,255,.24),
                    rgba(151,85,255,.22)
                );

            border:
                1px solid
                rgba(180,230,255,.16);

            box-shadow:
                0 0 20px
                rgba(86,174,255,.12);

            font-size: 20px;
        }


        .haldo-app-name {
            position: relative;

            font-size: 12px;
            font-weight: 750;
        }


        .haldo-app-category {
            position: relative;

            margin-top: 4px;

            font-size: 9px;

            color:
                rgba(255,255,255,.50);
        }


        /* =========================================================
           WINDOW LAYER
           ========================================================= */

        #haldo-window-layer {
            position: absolute;
            inset: 0;

            z-index: 450;

            pointer-events: none;
        }


        .haldo-window {
            position: absolute;

            left: 50%;
            top: 50%;

            width:
                min(850px, 92vw);

<script>

(function () {

    "use strict";


    const OS =
        window.HalDoOS;


    const $ =
        selector =>
        document.querySelector(selector);


    const emit =
        (name, detail = {}) => {

            window.dispatchEvent(
                new CustomEvent(
                    name,
                    {
                        detail
                    }
                )
            );

        };


    /* =========================================================
       STATUS
       ========================================================= */

    function setStatus(message) {

        const status =
            $("#haldo-status-text");

        const bootStatus =
            $("#haldo-boot-status");

        if (status) {
            status.textContent =
                message;
        }

        if (bootStatus) {
            bootStatus.textContent =
                message;
        }

    }


    OS.setStatus =
        setStatus;


    /* =========================================================
       TOAST
       ========================================================= */

    function toast(message) {

        const layer =
            $("#haldo-toast-layer");

        if (!layer) {
            return;
        }


        const item =
            document.createElement("div");

        item.className =
            "haldo-toast";

        item.textContent =
            String(message);


        layer.appendChild(item);


        window.setTimeout(
            () => {

                item.remove();

            },
            3500
        );

    OS.toast =

    /* =========================================================
       BUILD MENU
       ========================================================= */

    function buildAppMenu() {

        const grid =
            $("#haldo-app-grid");

        if (!grid) {
            return;
        }


        grid.innerHTML =
            "";


        for (
            const app
            of APP_CATALOG
        ) {

            const button =
                document.createElement("button");


            button.type =
                "button";

            button.className =
                "haldo-app-button";

            button.dataset.haldoApp =
                app.id;

            button.setAttribute(
                "role",
                "gridcell"
            );

            button.innerHTML = `

                <span
                    class="haldo-app-icon"
                    aria-hidden="true"
                >
                    ${app.icon}
                </span>

                <span
                    class="haldo-app-name"
                >
                    ${app.name}
                </span>

                <span
                    class="haldo-app-category"
                >
                    ${app.category}
                </span>

            `;


            button.addEventListener(
                "click",
                () => {

                    openApp(
                        app.id
                    );

                }
            );


            grid.appendChild(
                button
            );

        }

    }


    /* =========================================================
       OPEN / CLOSE MENU
       ========================================================= */

    function openMenu() {

        buildAppMenu();


        const menu =
            $("#haldo-menu");

        const logo =
            $("#haldo-center");

        if (!menu) {
            return;
        }


        menu.classList.add(
            "open"
        );

        menu.setAttribute(
            "aria-hidden",
            "false"
        );


        if (logo) {

            logo.classList.add(
                "active"
            );

            logo.setAttribute(
                "aria-expanded",
                "true"
            );

        }


        emit(
            "haldo:menu-open"
        );

    }


    function closeMenu() {

        const menu =
            $("#haldo-menu");

        const logo =
            $("#haldo-center");


        if (menu) {

            menu.classList.remove(
                "open"
            );

            menu.setAttribute(
                "aria-hidden",
                "true"
            );

        }


        if (logo) {

            logo.classList.remove(
                "active"
            );

            logo.setAttribute(
                "aria-expanded",
                "false"
            );

        }


        emit(
            "haldo:menu-close"
        );

    }


    function toggleMenu() {

        const menu =
            $("#haldo-menu");

        if (
            menu &&
            menu.classList.contains(
                "open"
            )
        ) {

            closeMenu();

        } else {

            openMenu();

        }

    }


    /* =========================================================
       APP OPEN BRIDGE
       ========================================================= */

    async function openApp(appId) {

        const app =
            APP_CATALOG.find(
                item =>
                    item.id === appId
            );


        if (!app) {

            toast(
                "HalDo: App nicht gefunden."
            );

            return;

        }


        closeMenu();


        OS.runtime.activeApp =
            appId;


        emit(
            "haldo:app-open-request",
            {
                appId,
                app
            }
        );


        /*
         * Bereits vorhandener App Manager
         */

        try {

            if (
                window.HalDoAppManager &&
                typeof
                window.HalDoAppManager.open
                === "function"
            ) {

                await
                    window.HalDoAppManager.open(
                        appId
                    );

                return;

            }

        } catch (error) {

            console.error(
                "[HalDo] App Manager",
                error
            );

        }


        /*
         * Bereits vorhandener Router
         */

        try {

            if (
                window.HalDoAppRouter &&
                typeof
                window.HalDoAppRouter.open
                === "function"
            ) {

                await
                    window.HalDoAppRouter.open(
                        appId
                    );

                return;

            }

        } catch (error) {

            console.error(
                "[HalDo] App Router",
                error
            );

        }


        /*
         * Event-basierte Runtime.
         *
         * Die konkrete App wird später
         * von der jeweiligen Runtime geöffnet.
         */

        toast(
            `${app.name} wird geladen …`
        );

    }


    OS.openApp =
        openApp;

    /* =========================================================
       SERVICE WORKER
       ========================================================= */

    async function registerServiceWorker() {

        if (
            !("serviceWorker" in navigator)
        ) {

            return null;

        }


        try {

            const registration =
                await navigator
                    .serviceWorker
                    .register(
                        "./service-worker.js"
                    );


            OS.serviceWorker =
                registration;


            emit(
                "haldo:service-worker-ready",
                {
                    registration
                }
            );


            return registration;

        } catch (error) {

            console.error(
                "[HalDo] Service Worker konnte nicht registriert werden.",
                error
            );


            emit(
                "haldo:service-worker-error",
                {
                    error
                }
            );


            return null;

        }

    }


    /* =========================================================
       BOOT
       ========================================================= */

    async function bootShell() {

        setStatus(
            "Cosmic World wird gestartet …"
        );


        await delay(
            300
        );


        setStatus(
            "HalDo System Core wird geladen …"
        );


        await delay(
            300
        );


        setStatus(
            "App-System wird vorbereitet …"
        );


        buildAppMenu();


        await delay(
            250
        );


        setStatus(
            "AI- und Sprachsystem werden vorbereitet …"
        );


        await delay(
            250
        );


        setStatus(
            "PWA-System wird vorbereitet …"
        );


        await registerServiceWorker();


        await delay(
            250
        );


        OS.runtime.booted =
            true;

        OS.runtime.ready =
            true;


        document
            .documentElement
            .setAttribute(
                "data-haldo-ready",
                "true"
            );


        $("#haldo-os")
            ?.setAttribute(
                "data-haldo-state",
                "ready"
            );


        setStatus(
            "HalDo AI OS bereit"
        );


        emit(
            "haldo:ready",
            {
                version:
                    OS.config.version
            }
        );


        await delay(
            450
        );


        $("#haldo-boot")
            ?.classList.add(
                "hidden"
            );

    }


    function delay(ms) {

        return new Promise(
            resolve =>
                window.setTimeout(
                    resolve,
                    ms
                )
        );

    }


    /* =========================================================
       EXTERNAL SYSTEM READY EVENTS
       ========================================================= */

    window.addEventListener(

    window.addEventListener(

            const name =
                event.detail?.name ||
                "App";


            toast(
                `${name} ist bereit.`
            );

        }
    );


    /* =========================================================
       START
       ========================================================= */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            bootShell,
            {
                once: true
            }
        );

    } else {

        bootShell();

    }

})();
