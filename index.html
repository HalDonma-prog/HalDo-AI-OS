<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>HalDo AI OS 23.1.6 — Das ultimative Wissen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #05080f;
            --surface: rgba(8, 12, 28, 0.92);
            --border: rgba(255, 255, 255, 0.04);
            --text: #e8edf5;
            --gold: #ffd54b;
            --gold-dark: #ff9f1c;
            --radius: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
        }

        #haldo-os {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 30% 20%, rgba(20, 50, 120, 0.10), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(60, 30, 140, 0.06), transparent 50%),
                var(--bg);
            padding: 6px;
            gap: 4px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex-shrink: 0;
            backdrop-filter: blur(16px);
            height: 34px;
        }

        .top-bar .logo {
            font-size: 13px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .top-bar .time {
            font-size: 10px;
            opacity: 0.5;
            font-family: monospace;
        }

        .top-bar .status {
            font-size: 8px;
            opacity: 0.4;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-bar .status .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .content {
            flex: 1;
            display: flex;
            gap: 4px;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar {
            width: 140px;
            flex-shrink: 0;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 3px;
            overflow-y: auto;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .sidebar .app-btn {
            padding: 3px 6px;
            border-radius: 4px;
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            text-align: left;
            font-size: 9px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
            width: 100%;
            line-height: 1.2;
        }

        .sidebar .app-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
        }

        .sidebar .app-btn.active {
            background: rgba(255, 200, 80, 0.06);
            border-color: rgba(255, 200, 80, 0.10);
            color: var(--gold);
        }

        .sidebar .app-btn .icon {
            font-size: 11px;
            width: 14px;
            text-align: center;
            flex-shrink: 0;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            backdrop-filter: blur(16px);
            min-width: 0;
        }

        .app-header {
            padding: 4px 10px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 11px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 28px;
        }

        .app-header .actions {
            display: flex;
            gap: 2px;
        }

        .app-header .actions button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, 0.4);
            padding: 1px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 8px;
            transition: all 0.2s;
        }

        .app-header .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        ::-webkit-scrollbar {
            width: 2px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }

        .btn-primary {
            padding: 3px 10px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0a0e1a;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 9px;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(255, 200, 80, 0.15);
        }

        .btn-secondary {
            padding: 2px 7px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 8px;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-danger {
            padding: 2px 7px;
            border-radius: 3px;
            background: rgba(255, 80, 80, 0.10);
            color: #ff6b6b;
            border: 1px solid rgba(255, 80, 80, 0.12);
            cursor: pointer;
            font-size: 8px;
            transition: background 0.2s;
        }

        .btn-danger:hover {
            background: rgba(255, 80, 80, 0.18);
        }

        input,
        textarea,
        select {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: #fff;
            padding: 3px 5px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 9px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(255, 200, 80, 0.20);
        }

        textarea {
            resize: vertical;
            min-height: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px 7px;
            margin-bottom: 3px;
            transition: background 0.2s;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .card .card-title {
            font-weight: 600;
            font-size: 10px;
        }

        .card .card-meta {
            font-size: 8px;
            opacity: 0.35;
            margin-top: 1px;
        }

        .card .card-actions {
            margin-top: 3px;
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }

        .flex-row {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            align-items: center;
        }

        .flex-row>* {
            flex: 1;
            min-width: 40px;
        }

        .flex-row .btn-primary,
        .flex-row .btn-secondary,
        .flex-row .btn-danger {
            flex: 0 0 auto;
        }

        /* =========================================================
        COSMIC WORLD
        ========================================================= */
        .cosmic-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 350px;
            overflow: hidden;
            border-radius: 4px;
            background: radial-gradient(circle at 50% 50%, rgba(10, 20, 50, 0.6), #05080f);
        }

        .cosmic-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .cosmic-star {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            animation: starTwinkle var(--speed, 3s) ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.7);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .cosmic-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100px;
            height: 100px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 40px rgba(255, 220, 70, 0.9), 0 0 80px rgba(255, 165, 40, 0.6), 0 0 150px rgba(255, 100, 20, 0.3), 0 0 300px rgba(255, 80, 0, 0.1);
            animation: sunPulse 3s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes sunPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.98);
                box-shadow: 0 0 40px rgba(255, 220, 70, 0.9), 0 0 80px rgba(255, 165, 40, 0.6);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.04);
                box-shadow: 0 0 60px rgba(255, 220, 70, 1), 0 0 120px rgba(255, 165, 40, 0.8), 0 0 200px rgba(255, 100, 20, 0.4);
            }
        }

        .cosmic-sun .logo-in-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 50%;
            height: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: #0a0e1a;
            text-shadow: 0 0 20px rgba(255, 200, 80, 0.5);
            animation: logoPulse 3s ease-in-out infinite;
            border: 2px solid rgba(255, 200, 80, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 20px rgba(255, 200, 80, 0.15);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.06);
                box-shadow: 0 0 40px rgba(255, 200, 80, 0.35);
            }
        }

        .cosmic-sun .logo-in-sun img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            border-radius: 50%;
        }

        .cosmic-planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 5;
        }

        .cosmic-planet:hover {
            transform: scale(1.2) !important;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2) !important;
            z-index: 20;
        }

        .cosmic-planet .planet-label {
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6px;
            opacity: 0.35;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.6);
            padding: 1px 4px;
            border-radius: 2px;
            pointer-events: none;
            color: #fff;
        }

        .cosmic-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .living-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
            width: 80px;
            height: 80px;
        }

        .living-logo .logo-aura {
            position: absolute;
            inset: -30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.12), rgba(255, 200, 80, 0.03) 40%, transparent 70%);
            animation: auraPulse 3s ease-in-out infinite;
        }

        @keyframes auraPulse {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.6;
            }
        }

        .living-logo .logo-mouth {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 22%;
            height: 4%;
            border-radius: 50%;
            background: rgba(255, 200, 150, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.08s ease;
        }

        .living-logo.speaking .logo-mouth {
            animation: mouthSpeak 0.25s ease-in-out infinite alternate;
        }

        @keyframes mouthSpeak {
            0% {
                height: 3%;
                transform: translateX(-50%) scaleY(0.6);
            }
            100% {
                height: 10%;
                transform: translateX(-50%) scaleY(1.2);
            }
        }

        .living-logo .logo-eyes {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 38%;
            height: 9%;
            display: flex;
            justify-content: space-between;
        }

        .living-logo .logo-eyes .eye {
            width: 28%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .living-logo .logo-eyes .eye::after {
            content: '';
            position: absolute;
            width: 35%;
            height: 35%;
            border-radius: 50%;
            background: rgba(255, 220, 100, 0.3);
            top: 30%;
            left: 30%;
            transition: all 0.3s ease;
        }

        .living-logo.listening .logo-eyes .eye::after {
            animation: eyeListen 1.2s ease-in-out infinite;
        }

        @keyframes eyeListen {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
            }
        }

        .living-logo.thinking .logo-eyes .eye::after {
            animation: eyeThink 1.8s ease-in-out infinite;
        }

        @keyframes eyeThink {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(3px, -2px);
            }
        }

        .living-logo.idle .logo-eyes .eye::after {
            animation: eyeIdle 3.5s ease-in-out infinite;
        }

        @keyframes eyeIdle {
            0%,
            100% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(-1px, -1px);
            }
            75% {
                transform: translate(1px, 1px);
            }
        }

        .living-logo .logo-hands {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .living-logo .logo-hands .hand {
            position: absolute;
            width: 10%;
            height: 10%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.10), rgba(255, 200, 100, 0.03) 50%, transparent 70%);
            animation: handMove 4.5s ease-in-out infinite;
        }

        .living-logo .logo-hands .hand-left {
            left: -6%;
            top: 30%;
            animation-delay: 0s;
        }

        .living-logo .logo-hands .hand-right {
            right: -6%;
            top: 30%;
            animation-delay: 2.2s;
        }

        @keyframes handMove {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(0, -3px) scale(1.06);
            }
        }

        .living-logo .logo-glow {
            position: absolute;
            inset: -8%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.05), transparent 60%);
            animation: glowPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.06);
            }
        }

        .cosmic-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .cosmic-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 200, 80, 0.2);
            animation: particleFloat var(--duration, 5s) ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0.1;
            }
            50% {
                transform: translate(var(--dx, 15px), var(--dy, -15px)) scale(1);
                opacity: 0.6;
            }
        }

        /* Responsive */
        @media (max-width: 700px) {
            .sidebar {
                width: 38px;
                padding: 2px;
            }
            .sidebar .app-btn span:not(.icon) {
                display: none;
            }
            .sidebar .app-btn {
                justify-content: center;
                padding: 4px;
            }
            #haldo-os {
                padding: 3px;
                gap: 3px;
            }
            .app-body {
                padding: 3px;
            }
            .top-bar .status {
                display: none;
            }
            .cosmic-sun {
                width: 70px;
                height: 70px;
            }
            .living-logo {
                width: 56px;
                height: 56px;
            }
            .cosmic-planet .planet-label {
                font-size: 5px;
                bottom: -12px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 30px;
            }
            .sidebar .app-btn .icon {
                font-size: 9px;
                width: 12px;
            }
            .top-bar .logo {
                font-size: 10px;
            }
            .app-header {
                font-size: 9px;
                padding: 2px 6px;
            }
            .app-body {
                padding: 2px;
            }
            .card {
                padding: 3px 5px;
            }
            .cosmic-sun {
                width: 55px;
                height: 55px;
            }
            .living-logo {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body>

    <div id="haldo-os">
        <div class="top-bar">
            <div class="logo">✦ HalDo AI OS 23.1.6</div>
            <div class="status">
                <span class="dot"></span>
                <span id="status-text">Bereit</span>
            </div>
            <div class="time" id="top-time">--:--:--</div>
        </div>
        <div class="content">
            <nav class="sidebar" id="sidebar"></nav>
            <div class="main-area">
                <div class="app-header" id="app-header">
                    <span id="app-title">🌌 Cosmic World</span>
                    <div class="actions" id="app-actions"></div>
                </div>
                <div class="app-body" id="app-body"></div>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        // =========================================================
        // VERSION
        // =========================================================
        const HALDO_VERSION = "23.1.6";
        const HALDO_BUILD = "ULTIMATE-KNOWLEDGE";
        const HALDO_RELEASE = "2026-08-28";

        // =========================================================
        // STORAGE
        // =========================================================
        const Storage = {
            prefix: 'haldo_',
            get(key, def = null) {
                try {
                    const val = localStorage.getItem(this.prefix + key);
                    if (val === null) return def;
                    try { return JSON.parse(val); } catch (e) { return val; }
                } catch (e) { return def; }
            },
            set(key, val) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(val)); return true; } catch (e) { return false; }
            },
            remove(key) {
                try { localStorage.removeItem(this.prefix + key); return true; } catch (e) { return false; }
            },
            getAll() {
                const res = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try { res[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k)); } catch (e) { res[
                                k.replace(this.prefix, '')] = localStorage.getItem(k); }
                    });
                } catch (e) {}
                return res;
            },
            clear() {
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
                    return true;
                } catch (e) { return false; }
            }
        };

        // =========================================================
        // TIME
        // =========================================================
        function updateTime() {
            const el = document.getElementById('top-time');
            if (el) el.textContent = new Date().toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        // =========================================================
        // SPEAK
        // =========================================================
        function speak(text) {
            if (!window.speechSynthesis) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 0.85;
                utterance.pitch = 1.0;
                utterance.volume = 0.85;
                window.speechSynthesis.speak(utterance);
            } catch (e) {}
        }

        function setStatus(text) {
            const el = document.getElementById('status-text');
            if (el) el.textContent = text;
        }
        setStatus('System startet...');

        // =========================================================
        // 100+ APP LIST
        // =========================================================
        const APP_LIST = [
            { id: 'cosmic', icon: '🌌', name: 'Cosmic World' },
            { id: 'home', icon: '🏠', name: 'Home' },
            { id: 'ai', icon: '🤖', name: 'HalDo AI' },
            { id: 'ai-book', icon: '📖', name: 'AI Wissen' },
            { id: 'ai-memory', icon: '🧠', name: 'AI Memory' },
            { id: 'ai-commands', icon: '🛠️', name: 'AI Commands' },
            { id: 'app-center', icon: '📦', name: 'App Center' },
            { id: 'app-manager', icon: '🗂️', name: 'App Manager' },
            { id: 'backup', icon: '💾', name: 'Backup' },
            { id: 'backup-migration', icon: '🔄', name: 'Backup Migration' },
            { id: 'battery', icon: '📊', name: 'Battery' },
            { id: 'calculator', icon: '🧮', name: 'Calculator' },
            { id: 'calendar', icon: '📅', name: 'Calendar' },
            { id: 'chat', icon: '💬', name: 'Chat' },
            { id: 'display', icon: '🖥️', name: 'Display Center' },

                if (!q) return results;

                    }

                return results;

                                📖 Guten Tag. Ich bin HalDo AI, Ihr intelligentes Wissensbuch von A bis Z. Fragen Sie mich zu jedem Thema – Wissenschaft, Philosophie, Technologie, Kultur oder Natur.
                            </div>
                        </div>

                            <button onclick="AppRouter.voiceInput()" class="btn-secondary">🎙️</button>

            sendAIMessage() {
                const input = document.getElementById('ai-input');
                const messages = document.getElementById('ai-chat-messages');
                const thinking = document.getElementById('ai-thinking');
                if (!input || !messages) return;
                const text = input.value.trim();
                if (!text) return;

                const userDiv = document.createElement('div');
                userDiv.style.cssText =
                    'padding:3px 6px;background:rgba(255,255,255,0.04);border-radius:3px;margin-bottom:2px;text-align:right;border:1px solid rgba(255,255,255,0.02);font-size:9px;';
                userDiv.textContent = '👤 ' + text;
                messages.appendChild(userDiv);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
                thinking.style.display = 'block';
                this.setLogoState('thinking');

                setTimeout(() => {
                    thinking.style.display = 'none';
                    const response = HalDoAI.ask(text);
                    const aiDiv = document.createElement('div');
                    aiDiv.style.cssText =
                        'padding:3px 6px;background:rgba(255,200,80,0.04);border-radius:3px;margin-bottom:2px;border:1px solid rgba(255,200,80,0.04);font-size:9px;';
                    aiDiv.textContent = '📖 ' + response;
                    messages.appendChild(aiDiv);
                    messages.scrollTop = messages.scrollHeight;
                    this.setLogoState('speaking');
                    speak(response.substring(0, 100) + '...');
                    setTimeout(() => this.setLogoState('idle'), 1000);
                }, 400);
            },

            voiceInput() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) { alert('Spracherkennung nicht unterstützt.'); return; }
                const rec = new Recognition();
                rec.lang = 'de-DE';
                rec.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const input = document.getElementById('ai-input');
                    if (input) input.value = text;
                    this.sendAIMessage();
                };
                rec.start();
                this.setLogoState('listening');
                speak('Ich höre zu.');
                setTimeout(() => this.setLogoState('idle'), 5000);
            },

                        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px;">
                            ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(b =>
                                `<button onclick="AppRouter.calcPress('${b}')" style="padding:6px;border-radius:3px;background:${['C','±','%','÷','×','−','+','='].includes(b)?'rgba(255,200,80,0.10)':'rgba(255,255,255,0.02)'};color:#fff;border:1px solid rgba(255,255,255,0.03);cursor:pointer;font-size:10px;">${b}</button>`
                            ).join('')}
                        </div>
                    </div>
                `;
            },

            calcPress(val) {
                const display = document.getElementById('calc-display');
                if (!display) return;
                if (!this._calcExpr) this._calcExpr = '';
                if (val === 'C') { this._calcExpr = '';
                    display.textContent = '0'; return; }
                if (val === '⌫') { this._calcExpr = this._calcExpr.slice(0, -1);
                    display.textContent = this._calcExpr || '0'; return; }
                if (val === '=') {
                    try {
                        const result = Function('"use strict"; return (' + this._calcExpr.replace('×', '*').replace('÷', '/')
                            .replace('−', '-') + ')')();
                        display.textContent = result;
                        this._calcExpr = String(result);
                    } catch (e) { display.textContent = 'Fehler';
                        this._calcExpr = ''; }
                    return;
                }
                this._calcExpr += val;
                display.textContent = this._calcExpr;
            },

            // =========================================================
            // TIMER
            // =========================================================
            renderTimer() {
                return `
                    <div style="text-align:center;padding:8px;">
                        <div style="font-size:28px;font-family:monospace;font-weight:700;" id="timer-display">00:30</div>
                        <div style="display:flex;gap:3px;justify-content:center;margin-top:4px;">
                            <button onclick="AppRouter.timerStart()" class="btn-primary">▶</button>
                            <button onclick="AppRouter.timerStop()" class="btn-secondary">⏹</button>
                            <button onclick="AppRouter.timerReset()" class="btn-secondary">🔄</button>
                        </div>
                        <div style="margin-top:3px;">
                            <input id="timer-input" type="number" value="30" style="width:50px;display:inline-block;" min="1" max="3600">
                            <span style="font-size:8px;opacity:0.5;">s</span>
                        </div>
                    </div>
                `;
            },

            timerStart() {
                const input = document.getElementById('timer-input');
                const display = document.getElementById('timer-display');
                if (!display) return;
                if (this._timerInterval) return;
                let seconds = parseInt(input?.value) || 30;
                if (seconds < 1) seconds = 1;
                if (seconds > 3600) seconds = 3600;
                this._timerSeconds = seconds;
                this._timerInterval = setInterval(() => {
                    if (this._timerSeconds <= 0) {
                        clearInterval(this._timerInterval);
                        this._timerInterval = null;
                        speak('Timer abgelaufen!');
                        display.textContent = '00:00';
                        return;
                    }
                    this._timerSeconds--;
                    const mins = Math.floor(this._timerSeconds / 60);
                    const secs = this._timerSeconds % 60;
                    display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                }, 1000);
            },

            timerStop() {
                if (this._timerInterval) { clearInterval(this._timerInterval);
                    this._timerInterval = null; }
            },

            timerReset() {
                this.timerStop();
                const display = document.getElementById('timer-display');
                if (display) display.textContent = '00:30';
            },

            translateText() {
                const text = document.getElementById('trans-text');
                const result = document.getElementById('trans-result');
                if (!text || !result) return;
                const input = text.value.trim();
                if (!input) { result.textContent = '⚠️ Bitte Text eingeben.'; return; }
                const to = document.getElementById('trans-to')?.value || 'en';
                const dict = {
                    'en': { 'Hallo': 'Hello', 'Danke': 'Thank you', 'Guten Tag': 'Good day' },
                    'de': { 'Hello': 'Hallo', 'Thank you': 'Danke', 'Good day': 'Guten Tag' },
                    'ku': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' },
                    'esq': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' }
                };
                const d = dict[to] || {};
                let translated = input;
                for (const [key, val] of Object.entries(d)) {
                    if (input.toLowerCase().includes(key.toLowerCase())) {
                        translated = translated.replace(new RegExp(key, 'gi'), val);
                    }
                }
                result.textContent = `🌍 ${translated}`;
            },

                if (!cmd) return;
                let result = '';
                switch (cmd) {
                    case 'status':
                        result = `✅ Version ${HALDO_VERSION} · ${APP_LIST.length} Apps`;
                        break;
                    case 'apps':
                        result = `📱 ${APP_LIST.length} Apps: ${APP_LIST.map(a => a.name).join(', ')}`;

                    case 'help':
                        result = 'Befehle: status, apps, backup, update, help, book, clear';
                        break;
                    case 'clear':
                        output.innerHTML = '';
                        input.value = '';
                        return;
                    default:
                        if (cmd.startsWith('book suche ')) {
                            const query = cmd.replace('book suche ', '');
                            const found = HalDoAI.search(query);
                            result = found.length > 0 ?
                                `📖 Gefunden: ${found.map(f => f.topic).join(', ')}` :
                                '📖 Keine Themen gefunden.';
                        } else {

        const WarningSystem = {
            warnings: [],
            tones: { blitzer: { freq: 1400, pattern: 'short' }, baustelle: { freq: 800, pattern: 'long' },
                sperrung: { freq: 600, pattern: 'double' }, gefahr: { freq: 400, pattern: 'triple' } },
            load() { this.warnings = Storage.get('warnings', []); return this; },
            save() { Storage.set('warnings', this.warnings); return this; },
            add(type, title, description, location = 'Unbekannt') {
                const types = { blitzer: { icon: '📸', label: 'Blitzer' }, baustelle: { icon: '🚧', label: 'Baustelle' },
                    sperrung: { icon: '🚫', label: 'Sperrung' }, gefahr: { icon: '⚠️', label: 'Gefahr' } };
                const t = types[type] || types['gefahr'];
                const warning = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), type, icon: t.icon,
                    label: t.label, title, description, location, timestamp: new Date().toISOString(),
                active: true };
                this.warnings.unshift(warning);
                this.save();
                this.playTone(type);
                speak(`Achtung! ${title} in ${location}. ${description}`);
                AppRouter.renderWarnings();
                return warning;
            },
            playTone(type) {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    const tone = this.tones[type] || this.tones['gefahr'];
                    osc.frequency.value = tone.freq;
                    osc.type = 'square';
                    gain.gain.value = 0.06;
                    osc.start();
                    if (tone.pattern === 'short') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 100); } else if (tone.pattern === 'long') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 300); } else if (tone.pattern === 'double') { setTimeout(() => { osc.stop(); },
                            100);
                        setTimeout(() => {
                            const ctx2 = new(window.AudioContext || window.webkitAudioContext)();
                            const o2 = ctx2.createOscillator();
                            const g2 = ctx2.createGain();
                            o2.connect(g2);
                            g2.connect(ctx2.destination);
                            o2.frequency.value = tone.freq;
                            o2.type = 'square';
                            g2.gain.value = 0.06;
                            o2.start();
                            setTimeout(() => { o2.stop();
                                ctx2.close(); }, 100);
                        }, 180);
                    } else if (tone.pattern === 'triple') {
                        for (let i = 0; i < 3; i++) {
                            setTimeout(() => {
                                const ctx3 = new(window.AudioContext || window.webkitAudioContext)();
                                const o3 = ctx3.createOscillator();
                                const g3 = ctx3.createGain();
                                o3.connect(g3);
                                g3.connect(ctx3.destination);
                                o3.frequency.value = tone.freq + i * 150;
                                o3.type = 'square';
                                g3.gain.value = 0.05;
                                o3.start();
                                setTimeout(() => { o3.stop();
                                    ctx3.close(); }, 80);
                            }, i * 150);
                        }
                    }
                } catch (e) {}
            },
            dismiss(id) { const w = this.warnings.find(w => w.id === id); if (w) w.active = false;
                this.save();
                AppRouter.renderWarnings(); },
            clearAll() { this.warnings.forEach(w => w.active = false);
                this.save();
                AppRouter.renderWarnings(); },
            getActive() { return this.warnings.filter(w => w.active); },
            render() {
                const container = document.getElementById('warnings-container');
                if (!container) return;
                const active = this.getActive();
                if (active.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:8px;">✅ Keine aktiven Warnungen</div>`;
                    return; }
                container.innerHTML = active.map(w =>
                    `<div class="warning-card ${w.type}" style="padding:4px 8px;border-radius:3px;margin-bottom:3px;display:flex;align-items:center;gap:4px;border-left:2px solid ${w.type === 'blitzer' ? '#ffd93d' : w.type === 'baustelle' ? '#ffa94d' : w.type === 'sperrung' ? '#ff6b6b' : '#ff0000'};background:rgba(255,80,80,0.04);font-size:8px;">
                        <span style="font-size:12px;">${w.icon}</span>
                        <div style="flex:1;"><strong>${w.title}</strong> ${w.description} · 📍 ${w.location}</div>
                        <span style="opacity:0.3;">${new Date(w.timestamp).toLocaleTimeString()}</span>
                        <button onclick="WarningSystem.dismiss('${w.id}')" style="background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:10px;">✕</button>

        // =========================================================
        // TASKS SYSTEM
        // =========================================================
        const TaskSystem = {
            tasks: [],
            load() { this.tasks = Storage.get('tasks', []); return this; },
            save() { Storage.set('tasks', this.tasks); return this; },
            add() {
                const title = document.getElementById('task-title');
                const date = document.getElementById('task-date');
                if (!title) return;
                const task = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Aufgabe', date: date?.value || new Date().toISOString().split('T')[0], done: false,
                    createdAt: new Date().toISOString() };
                this.tasks.push(task);
                this.save();
                title.value = '';
                AppRouter.renderTasks();
                speak('Aufgabe hinzugefügt.');
            },
            toggle(id) { const task = this.tasks.find(t => t.id === id); if (task) { task.done = !task.done;
                    this.save();
                    AppRouter.renderTasks(); } },
            delete(id) { this.tasks = this.tasks.filter(t => t.id !== id);
                this.save();
                AppRouter.renderTasks(); },
            render() {
                const container = document.getElementById('tasks-container');
                if (!container) return;
                if (this.tasks.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:12px;font-size:8px;">✅ Keine Aufgaben</div>`;
                    return; }
                container.innerHTML = this.tasks.map(t =>
                    `<div class="card" style="padding:3px 5px;font-size:8px;${t.done ? 'opacity:0.5;' : ''}">
                        <div class="card-title">${t.done ? '✅' : '⬜'} ${t.title}</div>
                        <div class="card-meta">📅 ${new Date(t.date + 'T00:00:00').toLocaleDateString('de-DE')}</div>
                        <div class="card-actions">
                            <button onclick="TaskSystem.toggle('${t.id}')" class="btn-secondary">${t.done ? '↩️' : '✅'}</button>
                            <button onclick="TaskSystem.delete('${t.id}')" class="btn-danger">🗑️</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        TaskSystem.load();

        // =========================================================
        // BOOT
        // =========================================================
        window._startTime = Date.now();

        function boot() {
            console.log(`🌌 HalDo AI OS ${HALDO_VERSION} ${HALDO_BUILD}`);
            console.log(`📱 ${APP_LIST.length} Apps`);
            console.log(`📖 Wissensbuch: ${Object.keys(HalDoAI.knowledge).length} Themen`);

            AppRouter.init();

            // Demo Warnungen
            setTimeout(() => {
                WarningSystem.add('baustelle', 'Baustelle A1', 'Fahrbahnverengung, 60 km/h', 'A1, km 45');
            }, 2000);
            setTimeout(() => {
                WarningSystem.add('blitzer', 'Blitzer A100', '80 km/h erlaubt', 'A100, Höhe Köln');
            }, 5000);

            setTimeout(() => {
                setStatus('System bereit');
                speak('HalDo AI OS 23.1.6. Das Wissensbuch von A bis Z ist bereit.');
            }, 1200);

            console.log('✅ System bereit');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>

</body>
</html>
