<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#02040a"
    >

    <meta
        name="application-name"
        content="HalDo AI OS 18"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS 18"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="description"
        content="HalDo AI OS 18 Professional Ultimate Foundation"
    >

    <title>HalDo AI OS 18</title>


    <!-- =====================================================
         HALDO ASSETS
         ===================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="logo.png"
    >

    <link
        rel="apple-touch-icon"
        href="logo.png"
    >

    <link
        rel="stylesheet"
        href="haldo-logo-engine.css"
    >


    <!-- =====================================================
         HALDO OS 18 SHELL STYLE
         ===================================================== -->

    <style>

        :root {

            --haldo-bg:
                #02040a;

            --haldo-bg-2:
                #050914;

            --haldo-panel:
                rgba(8, 13, 24, .82);

            --haldo-panel-strong:
                rgba(7, 12, 22, .95);

            --haldo-text:
                #f6f8ff;

            --haldo-muted:
                rgba(246, 248, 255, .58);

            --haldo-blue:
                #4aa8ff;

            --haldo-cyan:
                #42e6ff;

            --haldo-violet:
                #9b7aff;

            --haldo-green:
                #49e995;

            --haldo-yellow:
                #ffd85a;

            --haldo-red:
                #ff6378;

            --haldo-border:
                rgba(255, 255, 255, .10);

            --haldo-border-strong:
                rgba(255, 255, 255, .18);

            --haldo-sidebar:
                76px;

            --haldo-radius:
                22px;

            --haldo-shadow:
                0 25px 90px rgba(0, 0, 0, .55);

            --haldo-font:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }


        /* =====================================================
           GLOBAL
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background:
                var(--haldo-bg);

            color:
                var(--haldo-text);

            font-family:
                var(--haldo-font);

            -webkit-font-smoothing:
                antialiased;

            text-rendering:
                optimizeLegibility;
        }


        body {

            position: relative;

            min-width: 280px;
        }


        button,
        input,
        textarea,
        select {

            font:
                inherit;
        }


        button {

            cursor:
                pointer;

            border:
                0;

            outline:
                none;
        }


        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {

            outline:
                2px solid rgba(66, 230, 255, .55);

            outline-offset:
                2px;
        }


        img {

            display:
                block;

            max-width:
                100%;
        }


        [hidden] {

            display:
                none !important;
        }


        /* =====================================================
           ROOT SHELL
           ===================================================== */

        #haldo-os {

            position:
                fixed;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            isolation:
                isolate;

            background:

                radial-gradient(
                    circle at 55% 48%,
                    rgba(60, 210, 255, .10),
                    transparent 22%
                ),

                radial-gradient(
                    circle at 50% 50%,
                    rgba(90, 90, 255, .05),
                    transparent 42%
                ),

                #02040a;
        }


        /* =====================================================
           SPACE BACKGROUND
           ===================================================== */

        .haldo-space {

            position:
                absolute;

            inset:
                0;

            z-index:
                0;

            overflow:
                hidden;

            background:

                radial-gradient(
                    ellipse at center,
                    #0a1425 0%,
                    #030712 45%,
                    #010207 100%
                );
        }


        .haldo-space::before {

            content:
                "";

            position:
                absolute;

            inset:
                -20%;

            background:

                radial-gradient(
                    circle at 25% 30%,
                    rgba(70, 120, 255, .10),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 80% 65%,
                    rgba(0, 220, 255, .07),
                    transparent 25%
                );

            animation:
                haldoSpaceBreathing 14s ease-in-out infinite;
        }


        @keyframes haldoSpaceBreathing {

            0%,
            100% {

                transform:
                    scale(1);

                opacity:
                    .65;
            }

            50% {

                transform:
                    scale(1.08);

                opacity:
                    1;
            }
        }


        /* =====================================================
           STARS
           ===================================================== */

        .stars,
        .stars::before,
        .stars::after {

            position:
                absolute;

            inset:
                0;

            content:
                "";

            pointer-events:
                none;
        }


        .stars {

            opacity:
                .65;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,255,255,.90) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle,
                    rgba(120,220,255,.65) 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle,
                    rgba(255,255,255,.55) 0 1px,
                    transparent 1.5px
                );

            background-size:

                83px 91px,
                137px 121px,
                191px 173px;

            background-position:

                5px 11px,
                40px 70px,
                100px 30px;

            animation:
                haldoStarDrift 35s linear infinite;
        }


        .stars::before {

            opacity:
                .35;

            background-image:

                radial-gradient(
                    circle,
                    #fff 0 1px,
                    transparent 1.5px
                );

            background-size:
                229px 211px;

            animation:
                haldoStarDriftReverse 55s linear infinite;
        }


        @keyframes haldoStarDrift {

            from {

                transform:
                    translate3d(0, 0, 0);
            }

            to {

                transform:
                    translate3d(-60px, 40px, 0);
            }
        }


        @keyframes haldoStarDriftReverse {

            from {

                transform:
                    translate3d(0, 0, 0);
            }

            to {

                transform:
                    translate3d(50px, -30px, 0);
            }
        }


        /* =====================================================
           BOOT SCREEN
           ===================================================== */

        #haldo-boot-screen {

            position:
                fixed;

            inset:
                0;

            z-index:
                100000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:

                radial-gradient(
                    circle,
                    #0a1524,
                    #02040a 60%,
                    #000
                );

            transition:

                opacity .8s ease,
                visibility .8s ease;
        }


        #haldo-boot-screen.finished {

            opacity:
                0;

            visibility:
                hidden;

            pointer-events:
                none;
        }


        .boot-center {

            width:
                min(90vw, 500px);

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            text-align:
                center;
        }


        .boot-logo {

            width:
                155px;

            height:
                155px;

            border-radius:
                50%;

            object-fit:
                cover;

            box-shadow:

                0 0 20px rgba(70,220,255,.35),
                0 0 70px rgba(70,220,255,.18);

            animation:
                haldoBootPulse 2.8s ease-in-out infinite;
        }


        @keyframes haldoBootPulse {

            0%,
            100% {

                transform:
                    scale(1);

                filter:
                    brightness(1);
            }

            50% {

                transform:
                    scale(1.035);

                filter:
                    brightness(1.25);
            }
        }


        .boot-title {

            margin:
                25px 0 6px;

            font-size:
                34px;

            font-weight:
                800;

            letter-spacing:
                .03em;
        }


        .boot-version {

            color:
                var(--haldo-muted);

            font-size:
                12px;
        }


        #bootStatus {

            min-height:
                24px;

            margin-top:
                22px;

            color:
                var(--haldo-cyan);

            font-size:
                13px;
        }


        .boot-progress {

            width:
                min(400px, 80vw);

            height:
                4px;

            margin-top:
                10px;

            overflow:
                hidden;

            border-radius:
                999px;

            background:
                rgba(255,255,255,.08);
        }


        #progressBar {

            width:
                0%;

            height:
                100%;

            background:

                linear-gradient(
                    90deg,
                    var(--haldo-blue),
                    var(--haldo-cyan),
                    var(--haldo-violet)
                );

            box-shadow:
                0 0 18px rgba(66,230,255,.6);

            transition:
                width .3s ease;
        }


        /* =====================================================
           MAIN APPLICATION SHELL
           ===================================================== */

        #mainApp {

            position:
                absolute;

            inset:
                0;

            z-index:
                10;

            opacity:
                0;

            visibility:
                hidden;

            transition:

                opacity .6s ease,
                visibility .6s ease;
        }


        #mainApp.ready {

            opacity:
                1;

            visibility:
                visible;
        }


        /* =====================================================
           SIDEBAR
           ===================================================== */

        #haldo-sidebar {

            position:
                absolute;

            top:
                0;

            left:
                0;

            bottom:
                0;

            z-index:
                9000;

            width:
                var(--haldo-sidebar);

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            padding:
                14px 9px;

            padding-bottom:
                calc(
                    14px +
                    env(safe-area-inset-bottom)
                );

            background:

                linear-gradient(
                    180deg,
                    rgba(7,12,23,.92),
                    rgba(3,6,12,.88)
                );

            border-right:
                1px solid var(--haldo-border);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);
        }


        .sidebar-logo-button {

            width:
                52px;

            height:
                52px;

            padding:
                4px;

            border-radius:
                17px;

            background:
                rgba(255,255,255,.05);

            border:
                1px solid var(--haldo-border);

            box-shadow:
                0 0 25px rgba(66,230,255,.10);

            transition:

                transform .2s ease,
                box-shadow .2s ease;
        }


        .sidebar-logo-button:hover {

            transform:
                scale(1.06);

            box-shadow:
                0 0 30px rgba(66,230,255,.30);
        }


        .sidebar-logo-button img {

            width:
                100%;

            height:
                100%;

            border-radius:
                13px;

            object-fit:
                cover;
        }


        .sidebar-divider {

            width:
                38px;

            height:
                1px;

            margin:
                15px 0;

            background:
                var(--haldo-border);
        }


        .sidebar-buttons {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            gap:
                9px;

            flex:
                1;

            width:
                100%;
        }


        .sidebar-button {

            position:
                relative;

            width:
                50px;

            height:
                50px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                16px;

            color:
                var(--haldo-text);

            background:
                rgba(255,255,255,.035);

            border:
                1px solid transparent;

            font-size:
                19px;

            transition:

                background .18s ease,
                transform .18s ease,
                border-color .18s ease;
        }


        .sidebar-button:hover,
        .sidebar-button.active {

            background:
                rgba(66,230,255,.11);

            border-color:
                rgba(66,230,255,.24);

            transform:
                translateY(-2px);
        }


        .sidebar-button.active::before {

            content:
                "";

            position:
                absolute;

            left:
                -10px;

            width:
                3px;

            height:
                22px;

            border-radius:
                99px;

            background:

                linear-gradient(
                    180deg,
                    var(--haldo-cyan),
                    var(--haldo-blue)
                );

            box-shadow:
                0 0 12px var(--haldo-cyan);
        }


        .sidebar-bottom {

            display:
                flex;

            flex-direction:
                column;

            gap:
                9px;
        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        #haldo-topbar {

            position:
                absolute;

            top:
                0;

            left:
                var(--haldo-sidebar);

            right:
                0;

            z-index:
                5000;

            height:
                66px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                10px 16px;

            background:

                linear-gradient(
                    180deg,
                    rgba(3,6,13,.78),
                    rgba(3,6,13,.20)
                );

            pointer-events:
                none;
        }


        .top-left,
        .top-right {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            pointer-events:
                auto;
        }


        .system-pill {

            display:
                flex;

            align-items:
                center;

            gap:
                7px;

            padding:
                8px 12px;

            border:
                1px solid var(--haldo-border);

            border-radius:
                999px;

            background:
                rgba(7,12,22,.68);

            backdrop-filter:
                blur(20px);
        }


        .status-dot {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--haldo-green);

            box-shadow:
                0 0 12px var(--haldo-green);
        }


        .top-button {

            width:
                42px;

            height:
                42px;

            border-radius:
                14px;

            color:
                var(--haldo-text);

            background:
                rgba(255,255,255,.05);

            border:
                1px solid var(--haldo-border);

            transition:
                .18s ease;
        }


        .top-button:hover {

            background:
                rgba(66,230,255,.10);

            transform:
                translateY(-1px);
        }

    </style>

</head>


<body>

<div id="haldo-os">


    <!-- =====================================================
         HALDO SPACE
         ===================================================== -->

    <div
        class="haldo-space"
        aria-hidden="true"
    >

        <div class="stars"></div>

    </div>


    <!-- =====================================================
         HALDO BOOT
         ===================================================== -->

    <section
        id="haldo-boot-screen"
        aria-label="HalDo AI OS Start"
    >

        <div class="boot-center">

            <img
                src="logo.png"
                class="boot-logo"
                alt="HalDo AI OS"
            >

            <h1 class="boot-title">
                HalDo AI OS
            </h1>

            <div class="boot-version">
                Version 18.0.0 · Professional Ultimate Foundation
            </div>

            <div id="bootStatus">
                HalDo AI OS wird initialisiert ...
            </div>

            <div
                class="boot-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
            >

                <div id="progressBar"></div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         MAIN HALDO SHELL
         ===================================================== -->

    <main id="mainApp">


        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside
            id="haldo-sidebar"
            aria-label="HalDo Navigation"
        >

            <button
                id="haldo-home-button"
                class="sidebar-logo-button"
                type="button"
                title="HalDo Hauptmenü"
                aria-label="HalDo Hauptmenü"
            >

                <img
                    src="logo.png"
                    alt="HalDo"
                >

            </button>


            <div class="sidebar-divider"></div>


            <nav
                class="sidebar-buttons"
                aria-label="HalDo Bereiche"
            >

                <button
                    id="sidebar-ai"
                    class="sidebar-button active"
                    type="button"
                    title="HalDo AI"
                    aria-label="HalDo AI"
                    data-haldo-action="ai"
                >
                    ✦
                </button>


                <button
                    id="sidebar-apps"
                    class="sidebar-button"
                    type="button"
                    title="Apps"
                    aria-label="Apps"
                    data-haldo-action="apps"
                >
                    ▦
                </button>


                <button
                    id="sidebar-system"
                    class="sidebar-button"
                    type="button"
                    title="System"
                    aria-label="System"
                    data-haldo-action="system"
                >
                    ◉
                </button>


                <button
                    id="sidebar-files"
                    class="sidebar-button"
                    type="button"
                    title="Dateien"
                    aria-label="Dateien"
                    data-haldo-app="files"
                >
                    ▤
                </button>


                <button
                    id="sidebar-browser"
                    class="sidebar-button"
                    type="button"
                    title="Browser"
                    aria-label="Browser"
                    data-haldo-app="browser"
                >
                    ◎
                </button>


                <button
                    id="sidebar-notes"
                    class="sidebar-button"
                    type="button"
                    title="Notizen"
                    aria-label="Notizen"
                    data-haldo-app="notes"
                >
                    ✎
                </button>

            </nav>


            <div class="sidebar-bottom">

                <button
                    id="sidebar-settings"
                    class="sidebar-button"
                    type="button"
                    title="Einstellungen"
                    aria-label="Einstellungen"
                    data-haldo-app="settings"
                >
                    ⚙
                </button>

            </div>

        </aside>


        <!-- =================================================
             TOP SYSTEM BAR
             ================================================= -->

        <header id="haldo-topbar">

            <div class="top-left">

                <div
                    class="system-pill"
                    aria-label="HalDo Systemstatus"
                >

                    <span
                        class="status-dot"
                        aria-hidden="true"
                    ></span>

                    <span>
                        HalDo AI OS 18
                    </span>

                </div>

            </div>


            <div class="top-right">

                <button
                    id="top-ai"
                    class="top-button"
                    type="button"
                    title="HalDo AI"
                    aria-label="HalDo AI"
                >
                    AI
                </button>


                <button
                    id="top-system"
                    class="top-button"
                    type="button"
                    title="Systemstatus"
                    aria-label="Systemstatus"
                >
                    ◉
                </button>


                <button
                    id="top-settings"
                    class="top-button"
                    type="button"
                    title="Einstellungen"
                    aria-label="Einstellungen"
                >
                    ⚙
                </button>

            </div>

        </header>


        <!-- =================================================
             APP MENU
             ================================================= -->

        <section
            id="haldo-app-menu"
            aria-label="HalDo Apps"
            aria-hidden="true"
        >

            <div class="menu-header">

                <div>

                    <div class="menu-title">
                        HalDo Apps
                    </div>

                    <div class="menu-subtitle">
                        Anwendungen und Systemmodule
                    </div>

                </div>


                <button
                    id="menu-close"
                    class="menu-close"
                    type="button"
                    aria-label="App-Menü schließen"
                >
                    ×
                </button>

            </div>


            <div
                id="haldo-app-list"
                class="app-list"
                role="list"
            ></div>

        </section>
