<!DOCTYPE html>
<html lang="de" dir="ltr">

<head>

    <!-- ======================================================
         HALDO AI OS 20
         ZENTRALE SYSTEM-SHELL
         ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050817"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – installierbares, intelligentes und erweiterbares AI-Betriebssystem."
    >

    <meta
        name="application-name"
        content="HalDo AI OS"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="format-detection"
        content="telephone=no"
    >

    <!-- ======================================================
         PWA
         ====================================================== -->

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <!-- ======================================================
         HALDO ICON / LOGO
         ====================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="./assets/logo/logo.png"
    >

    <link
        rel="apple-touch-icon"
        href="./assets/logo/logo.png"
    >

    <!-- ======================================================
         STYLES
         ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/haldo-logo-engine.css"
    >

    <style>

        /* ==================================================
           RESET
           ================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            background:
                #02030a;

            color:
                #ffffff;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }


        body {
            min-height: 100dvh;
            position: relative;
        }


        button,
        input,
        textarea,
        select {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        /* ==================================================
           SYSTEM ROOT
           ================================================== */

        #haldo-os {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(47, 75, 150, .18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 20% 20%,
                    rgba(90, 140, 255, .08),
                    transparent 30%
                ),
                #02030a;
        }


        /* ==================================================
           COSMIC BACKGROUND
           ================================================== */

        #cosmic-world {
            position: absolute;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }


        #cosmic-stars {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(255,255,255,.85) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 25% 70%,
                    rgba(150,210,255,.8) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 80% 30%,
                    rgba(255,220,170,.8) 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 60% 80%,
                    rgba(190,170,255,.8) 0 1px,
                    transparent 2px
                );

            opacity: .85;

            animation:
                haldo-star-drift
                45s
                linear
                infinite;
        }


        #cosmic-sky {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(20,35,85,.25),
                    transparent 55%
                );

            pointer-events: none;
        }


        /* ==================================================
           COSMIC SUN
           ================================================== */

        #haldo-sun {
            position: absolute;

            width: clamp(
                100px,
                18vw,
                230px
            );

            height: clamp(
                100px,
                18vw,
                230px
            );

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #ffffff 0%,
                    #fff5b5 10%,
                    #ffd35a 27%,
                    #ff9e24 45%,
                    #ff5e24 65%,
                    rgba(255,70,20,.1) 74%,
                    transparent 76%
                );

            box-shadow:
                0 0 20px rgba(255,230,130,.95),
                0 0 60px rgba(255,180,60,.85),
                0 0 130px rgba(255,100,30,.45),
                0 0 230px rgba(255,80,30,.25);

            z-index: 2;

            animation:
                haldo-sun-pulse
                8s
                ease-in-out
                infinite;
        }


        /* ==================================================
           ORBITS
           ================================================== */

        .haldo-orbit {
            position: absolute;

            left: 50%;
            top: 50%;

            border:
                1px solid
                rgba(120,170,255,.16);

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;
        }


        .orbit-1 {
            width: 22vw;
            height: 9vw;

            min-width: 170px;
            min-height: 90px;

            transform:
                translate(-50%, -50%)
                rotate(-18deg);
        }


        .orbit-2 {
            width: 35vw;
            height: 16vw;

            min-width: 260px;
            min-height: 130px;

            transform:
                translate(-50%, -50%)
                rotate(28deg);
        }


        .orbit-3 {
            width: 50vw;
            height: 24vw;

            min-width: 350px;
            min-height: 180px;

            transform:
                translate(-50%, -50%)
                rotate(-38deg);
        }


        .orbit-4 {
            width: 70vw;
            height: 36vw;

            min-width: 480px;
            min-height: 250px;

            transform:
                translate(-50%, -50%)
                rotate(15deg);
        }


        /* ==================================================
           PLANETS
           ================================================== */

        .haldo-planet {
            position: absolute;

            border-radius: 50%;

            box-shadow:
                inset -12px -10px 18px rgba(0,0,0,.5),
                0 0 15px rgba(120,180,255,.35);

            z-index: 3;
        }


        .planet-1 {
            width: 17px;
            height: 17px;

            left: 24%;
            top: 43%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #f4f5ff,
                    #8494ff 35%,
                    #302a8f 70%,
                    #11102d
                );

            animation:
                haldo-planet-float-1
                13s
                linear
                infinite;
        }


        .planet-2 {
            width: 27px;
            height: 27px;

            right: 20%;
            top: 37%;

            background:
                radial-gradient(
                    circle at 35% 25%,
                    #ffe8c7,
                    #d99053 40%,
                    #7e3d27 72%,
                    #24120f
                );

            animation:
                haldo-planet-float-2
                21s
                linear
                infinite;
        }


        .planet-3 {
            width: 36px;
            height: 36px;

            left: 30%;
            bottom: 22%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #c9fff5,
                    #3dbaa9 35%,
                    #14657c 68%,
                    #061b2a
                );

            animation:
                haldo-planet-float-3
                29s
                linear
                infinite;
        }


        .planet-4 {
            width: 47px;
            height: 47px;

            right: 27%;
            bottom: 18%;

            background:
                radial-gradient(
                    circle at 32% 25%,
                    #fff0bb,
                    #b76dff 34%,
                    #5a237d 68%,
                    #170d2b
                );

            animation:
                haldo-planet-float-4
                37s
                linear
                infinite;
        }


        /* ==================================================
           TOP BAR
           ================================================== */

        #haldo-topbar {
            position: absolute;

            left: 0;
            right: 0;
            top: 0;

            min-height: 64px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                env(safe-area-inset-top)
                18px
                12px
                18px;

            z-index: 100;

            background:
                linear-gradient(
                    to bottom,
                    rgba(2,3,10,.85),
                    rgba(2,3,10,.25),
                    transparent
                );

            backdrop-filter:
                blur(8px);
        }


        .haldo-brand {
            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }


        .haldo-brand-logo {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            object-fit: cover;

            box-shadow:
                0 0 18px
                rgba(120,190,255,.65);
        }


        .haldo-brand-title {
            font-size: 16px;

            font-weight: 700;

            letter-spacing: .04em;

            white-space: nowrap;
        }


        .haldo-brand-version {
            font-size: 10px;

            opacity: .55;
        }


        .haldo-system-status {
            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 11px;

            opacity: .75;
        }


        .status-light {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                #56e39f;

            box-shadow:
                0 0 10px
                rgba(86,227,159,.8);
        }


        /* ==================================================
           MAIN DESKTOP
           ================================================== */

        #haldo-desktop {
            position: absolute;

            inset: 0;

            z-index: 10;

            pointer-events: none;
        }


        #haldo-desktop > * {
            pointer-events: auto;
        }


        /* ==================================================
           LOGO CENTER
           ================================================== */

        #haldo-center-logo {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: min(
                180px,
                32vw
            );

            height: min(
                180px,
                32vw
            );

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 20;

            pointer-events: auto;
        }


        #haldo-center-logo img {
            width: 58%;
            height: 58%;

            object-fit: contain;

            border-radius: 50%;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(130,200,255,.9)
                );

            transition:
                transform .8s ease,
                filter .8s ease;
        }


        #haldo-center-logo.active img {
            transform:
                scale(1.12);

            filter:
                drop-shadow(
                    0 0 30px
                    rgba(255,220,130,1)
                );
        }


        /* ==================================================
           APP DOCK
           ================================================== */

        #haldo-dock {
            position: absolute;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%);

            width:
                min(
                    calc(100% - 30px),
                    820px
                );

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 10px;

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 24px;

            background:
                rgba(7,10,25,.55);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 15px 50px
                rgba(0,0,0,.4);

            overflow-x: auto;

            z-index: 200;
        }


        .dock-button {
            flex:
                0 0 auto;

            min-width: 54px;
            height: 54px;

            border: 0;

            border-radius: 17px;

            color: #fff;

            background:
                rgba(255,255,255,.07);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            transition:
                transform .2s ease,
                background .2s ease;
        }


        .dock-button:hover,
        .dock-button:focus-visible {
            transform:
                translateY(-4px);

            background:
                rgba(255,255,255,.14);

            outline: none;
        }


        .dock-icon {
            font-size: 19px;
        }


        .dock-label {
            font-size: 8px;

            opacity: .75;
        }


        /* ==================================================
           APP LAUNCHER
           ================================================== */

        #haldo-launcher {
            position: absolute;

            inset: 0;

            z-index: 500;

            display: none;

            padding:
                80px
                20px
                110px;

            overflow-y: auto;

            background:
                rgba(2,3,10,.76);

            backdrop-filter:
                blur(25px);
        }


        #haldo-launcher.open {
            display: block;
        }


        .launcher-header {
            max-width: 1200px;

            margin:
                0 auto
                25px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;
        }


        .launcher-title {
            font-size: 28px;

            font-weight: 800;
        }


        .launcher-subtitle {
            margin-top: 4px;

            opacity: .6;

            font-size: 12px;
        }


        .launcher-close {
            border: 0;

            width: 44px;
            height: 44px;

            border-radius: 14px;

            color: #fff;

            background:
                rgba(255,255,255,.08);
        }


        #haldo-app-grid {
            max-width: 1200px;

            margin:
                0 auto;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(125px, 1fr)
                );

            gap: 12px;
        }


        .app-tile {
            min-height: 125px;

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius: 22px;

            padding: 15px;

            color: #fff;

            background:
                rgba(255,255,255,.055);

            text-align: left;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;
        }


        .app-tile:hover,
        .app-tile:focus-visible {
            transform:
                translateY(-4px);

            background:
                rgba(255,255,255,.11);

            border-color:
                rgba(130,190,255,.35);

            outline: none;
        }


        .app-tile-icon {
            font-size: 28px;

            margin-bottom: 13px;
        }


        .app-tile-name {
            font-weight: 700;

            font-size: 14px;
        }


        .app-tile-category {
            margin-top: 5px;

            font-size: 10px;

            opacity: .5;
        }


        /* ==================================================
           WINDOW MANAGER HOST
           ================================================== */

        #haldo-window-layer {
            position: absolute;

            inset: 0;

            z-index: 400;

            pointer-events: none;
        }


        .haldo-window {
            position: absolute;

            min-width: 280px;
            min-height: 180px;

            max-width: 95vw;
            max-height: 85vh;

            overflow: hidden;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 20px;

            background:
                rgba(7,10,25,.92);

            backdrop-filter:
                blur(24px);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.55);

            pointer-events: auto;
        }


        .haldo-window-header {
            height: 48px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 12px 0 16px;

            background:
                rgba(255,255,255,.04);
        }


        .haldo-window-title {
            font-size: 13px;

            font-weight: 700;
        }


        .haldo-window-controls {
            display: flex;

            gap: 5px;
        }


        .window-control {
            width: 28px;
            height: 28px;

            border: 0;

            border-radius: 9px;

            color: #fff;

            background:
                rgba(255,255,255,.07);
        }


        .haldo-window-content {
            height:
                calc(
                    100% - 48px
                );

            overflow: auto;
        }


        /* ==================================================
           UNIVERSAL PANEL
           ================================================== */

        #haldo-panel {
            position: absolute;

            top: 74px;
            right: 16px;

            width:
                min(
                    360px,
                    calc(100vw - 32px)
                );

            max-height:
                calc(
                    100vh - 100px
                );

            overflow: auto;

            display: none;

            padding: 18px;

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 22px;

            background:
                rgba(7,10,25,.88);

            backdrop-filter:
                blur(22px);

            z-index: 600;
        }


        #haldo-panel.open {
            display: block;
        }


        /* ==================================================
           BOOT / LOADING
           ================================================== */

        #haldo-boot {
            position: fixed;

            inset: 0;

            z-index: 5000;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #02030a;

            transition:
                opacity .8s ease,
                visibility .8s ease;
        }


        #haldo-boot.hidden {
            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        .boot-content {
            text-align: center;
        }


        .boot-logo {
            width: 120px;
            height: 120px;

            object-fit: contain;

            border-radius: 50%;

            filter:
                drop-shadow(
                    0 0 30px
                    rgba(130,200,255,.8)
                );

            animation:
                haldo-boot-logo
                2s
                ease-in-out
                infinite;
        }


        .boot-title {
            margin-top: 22px;

            font-size: 22px;

            font-weight: 800;

            letter-spacing: .06em;
        }


        .boot-status {
            margin-top: 8px;

            font-size: 11px;

            opacity: .55;
        }


        .boot-loader {
            width: 180px;

            height: 3px;

            margin:
                18px auto 0;

            overflow: hidden;

            border-radius: 20px;

            background:
                rgba(255,255,255,.08);
        }


        .boot-loader::after {
            content: "";

            display: block;

            width: 45%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #9bd7ff,
                    transparent
                );

            animation:
                haldo-loader
                1.2s
                linear
                infinite;
        }


        /* ==================================================
           INSTALL / UPDATE PANEL
           ================================================== */

        #haldo-install-center {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width:
                min(
                    420px,
                    calc(100vw - 32px)
                );

            display: none;

            padding: 25px;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 26px;

            background:
                rgba(7,10,25,.94);

            backdrop-filter:
                blur(30px);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.6);

            z-index: 3000;
        }


        #haldo-install-center.open {
            display: block;
        }


        .install-title {
            font-size: 22px;

            font-weight: 800;
        }


        .install-text {
            margin-top: 10px;

            font-size: 13px;

            line-height: 1.6;

            opacity: .7;
        }


        .install-actions {
            display: flex;

            gap: 8px;

            margin-top: 20px;
        }


        .haldo-button {
            border: 0;

            border-radius: 13px;

            padding:
                11px
                15px;

            color: #fff;

            background:
                rgba(255,255,255,.09);
        }


        .haldo-button.primary {
            background:
                linear-gradient(
                    135deg,
                    #426dff,
                    #7b4dff
                );
        }


        /* ==================================================
           TOAST
           ================================================== */

        #haldo-toast-layer {
            position: fixed;

            left: 50%;
            bottom: 100px;

            transform:
                translateX(-50%);

            z-index: 7000;

            display: flex;

            flex-direction: column;

            gap: 8px;

            width:
                min(
                    420px,
                    calc(100vw - 30px)
                );

            pointer-events: none;
        }


        .haldo-toast {
            padding:
                12px
                15px;

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 15px;

            background:
                rgba(7,10,25,.9);

            backdrop-filter:
                blur(15px);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.35);

            font-size: 12px;

            animation:
                haldo-toast-in
                .3s
                ease;
        }


        /* ==================================================
           ACCESSIBILITY
           ================================================== */

        .sr-only {
            position: absolute;

            width: 1px;
            height: 1px;

            padding: 0;
            margin: -1px;

            overflow: hidden;

            clip: rect(
                0,
                0,
                0,
                0
            );

            white-space: nowrap;

            border: 0;
        }


        /* ==================================================
           ANIMATIONS
           ================================================== */

        @keyframes haldo-star-drift {

            from {
                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-10px,8px,0)
                    scale(1.02);
            }

            to {
                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

        }


        @keyframes haldo-sun-pulse {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.035);
            }

        }


        @keyframes haldo-planet-float-1 {

            from {
                transform:
                    rotate(0deg)
                    translateX(70px)
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg)
                    translateX(70px)
                    rotate(-360deg);
            }

        }


        @keyframes haldo-planet-float-2 {

            from {
                transform:
                    rotate(0deg)
                    translateX(110px)
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(-360deg)
                    translateX(110px)
                    rotate(360deg);
            }

        }


        @keyframes haldo-planet-float-3 {

            from {
                transform:
                    rotate(0deg)
                    translateX(150px)
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg)
                    translateX(150px)
                    rotate(-360deg);
            }

        }


        @keyframes haldo-planet-float-4 {

            from {
                transform:
                    rotate(0deg)
                    translateX(200px)
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(-360deg)
                    translateX(200px)
                    rotate(360deg);
            }

        }


        @keyframes haldo-boot-logo {

            0%,
            100% {
                transform:
                    scale(1);
            }

            50% {
                transform:
                    scale(1.08);
            }

        }


        @keyframes haldo-loader {

            from {
                transform:
                    translateX(-130%);
            }

            to {
                transform:
                    translateX(330%);
            }

        }


        @keyframes haldo-toast-in {

            from {
                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);

<script>

(function () {

    "use strict";


    const OS =
        window.HalDoOS;


    const $ =
        function (selector) {

            return document.querySelector(
                selector
            );

        };


    const $$ =
        function (selector) {

            return Array.from(
                document.querySelectorAll(
                    selector
                )
            );

        };


    /* ======================================================
       TOAST
       ====================================================== */

    function toast(
        message
    ) {

        const layer =
            $("#haldo-toast-layer");


        if (!layer) {
            return;
        }


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "haldo-toast";


        item.textContent =
            message;


        layer.appendChild(
            item
        );


        window.setTimeout(
            function () {

                item.remove();

            },
            3500
        );

    }


    OS.toast =
        toast;


    /* ======================================================
       STATUS
       ====================================================== */

    function setStatus(
        message
    ) {

        const status =
            $("#haldo-status-text");


        const bootStatus =
            $("#boot-status");


        if (status) {

            status.textContent =
                message;

        }


        if (bootStatus) {

            bootStatus.textContent =
                message;

        }

    }


    OS.setStatus =
        setStatus;


    /* ======================================================
       APP GRID
       ====================================================== */

    function buildAppGrid() {

        const grid =
            $("#haldo-app-grid");


        if (!grid) {
            return;
        }


        grid.innerHTML =
            "";


        OS.appDefinitions
            .forEach(
                function (
                    app
                ) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "app-tile";


                    button.dataset.app =
                        app.id;


                    button.innerHTML = `

                        <div class="app-tile-icon">
                            ${app.icon}
                        </div>

                        <div class="app-tile-name">
                            ${app.name}
                        </div>

                        <div class="app-tile-category">
                            ${app.category}
                        </div>

                    `;


                    button.addEventListener(
                        "click",
                        function () {

                            openApp(
                                app.id
                            );

                        }
                    );


                    grid.appendChild(
                        button
                    );

                }
            );

    }


    /* ======================================================
       LAUNCHER
       ====================================================== */

    function openLauncher() {

        const launcher =
            $("#haldo-launcher");


        if (!launcher) {
            return;
        }


        launcher.classList.add(
            "open"
        );


        buildAppGrid();

    }


    function closeLauncher() {

        const launcher =
            $("#haldo-launcher");


        if (!launcher) {
            return;
        }


        launcher.classList.remove(
            "open"
        );

    }


    /* ======================================================
       APP OPEN ROUTER
       ====================================================== */

    function openApp(
        appId
    ) {

        closeLauncher();


        OS.runtime.activeApp =
            appId;


        if (
            !OS.runtime.openedApps
                .includes(appId)
        ) {

            OS.runtime.openedApps
                .push(appId);

        }


        /*
         * Bestehenden App Router bevorzugen.
         */

        try {

            if (
                OS.appRouter &&
                typeof OS.appRouter
                    .open ===
                "function"
            ) {

                OS.appRouter.open(
                    appId
                );

                return;

            }

        } catch (error) {

            console.warn(
                "[HalDo] App Router:",
                error
            );

        }


        try {

            if (
                window.HalDoAppRouter &&
                typeof window
                    .HalDoAppRouter
                    .open ===
                "function"
            ) {

                window
                    .HalDoAppRouter
                    .open(
                        appId
                    );

                return;

            }

        } catch (error) {

            console.warn(
                "[HalDo] Global App Router:",
                error
            );

        }


        /*
         * Falls die konkrete App noch
         * nicht angeschlossen ist,
         * zeigen wir keinen falschen
         * „funktioniert“-Status.
         */

        toast(
            "HalDo App „" +
            appId +
            "“ ist registriert und wartet auf ihr vollständiges App-Modul."
        );


        try {

            window.dispatchEvent(
                new CustomEvent(
                    "haldo:app-open-request",
                    {
                        detail: {
                            appId:
                                appId
                        }
                    }
                )
            );

        } catch (error) {

            /* Ignore */

        }

    }


    OS.openApp =
        openApp;


    /* ======================================================
       LAUNCHER BUTTONS
       ====================================================== */

    $$(
        "[data-action='launcher']"
    )
    .forEach(
        function (
            button
        ) {

            button.addEventListener(
                "click",
                openLauncher
            );

        }
    );


    $(
        "#launcher-close"
    )?.addEventListener(
        "click",
        closeLauncher
    );


    $(
        "#haldo-center-logo"
    )?.addEventListener(
        "click",
        function () {

            const logo =
                $("#haldo-center-logo");


            logo.classList.add(
                "active"
            );


            window.setTimeout(
                function () {

                    logo.classList.remove(
                        "active"
                    );

                },
                900
            );


            openApp(
                "ai-chat"
            );

        }
    );


    /* ======================================================
       DOCK APPS
       ====================================================== */

    $$(
        "[data-app]"
    )
    .forEach(
        function (
            button
        ) {

            button.addEventListener(
                "click",
                function () {

                    openApp(
                        button.dataset.app
                    );

                }
            );

        }
    );


    /* ======================================================
       KEYBOARD
       ====================================================== */

    document.addEventListener(
        "keydown",
        function (
            event
        ) {

            if (
                event.key ===
                "Escape"
            ) {

                closeLauncher();

            }


            if (
                event.key ===
                "Meta" &&
                event.key.toLowerCase() ===
                "a"
            ) {

                openLauncher();

            }

        }
    );


    /* ======================================================
       PWA
       ====================================================== */

    window.addEventListener(
        "pwa:install-available",
        function () {

            const panel =
                $("#haldo-install-center");


            if (panel) {

                panel.classList.add(
                    "open"
                );

            }


            setStatus(
                "HalDo kann installiert werden"
            );

        }
    );


    $(
        "#haldo-install-button"
    )?.addEventListener(
        "click",
        async function () {

            if (
                window.HalDoPWAInstaller
            ) {

                const result =
                    await window
                        .HalDoPWAInstaller
                        .install();


                if (
                    result &&
                    result.success
                ) {

                    toast(
                        "HalDo AI OS wurde zur Installation freigegeben."
                    );

                }

            }

        }
    );


    $(
        "#haldo-install-close"
    )?.addEventListener(
        "click",
        function () {

            $(
                "#haldo-install-center"
            )
            ?.classList.remove(
                "open"
            );

        }
    );


    /* ======================================================
       SERVICE WORKER
       ====================================================== */

    async function registerServiceWorker() {

        if (
            !(
                "serviceWorker"
                in navigator
            )
        ) {

            setStatus(
                "Service Worker nicht verfügbar"
            );

            return;

        }


        try {

            const registration =
                await navigator
                    .serviceWorker
                    .register(
                        "./service-worker.js"
                    );


            console.log(
                "[HalDo] Service Worker:",
                registration
            );


            setStatus(
                "HalDo System bereit"
            );


            registration.addEventListener(
                "updatefound",
                function () {

                    const worker =
                        registration.installing;


                    if (!worker) {
                        return;
                    }


                    worker.addEventListener(
                        "statechange",
                        function () {

                            if (
                                worker.state ===
                                "installed" &&
                                navigator
                                    .serviceWorker
                                    .controller
                            ) {

                                toast(
                                    "Ein HalDo AI OS Update ist verfügbar."
                                );


                                window.dispatchEvent(
                                    new CustomEvent(
                                        "haldo:update-available"
                                    )
                                );

                            }

                        }
                    );

                }
            );


        } catch (error) {

            console.error(
                "[HalDo] Service Worker Fehler:",
                error
            );


            setStatus(
                "System läuft – Offline-Modus eingeschränkt"
            );

        }

    }


    /* ======================================================
       BOOT
       ====================================================== */

    async function bootShell() {

        setStatus(
            "HalDo Core wird geladen …"
        );


        await new Promise(
            function (
                resolve
            ) {

                window.setTimeout(
                    resolve,
                    350
                );

            }
        );


        setStatus(
            "Apps werden vorbereitet …"
        );


        buildAppGrid();


        await registerServiceWorker();


        await new Promise(
            function (
                resolve
            ) {

                window.setTimeout(
                    resolve,
                    350
                );

            }
        );


        OS.runtime.booted =
            true;


        OS.runtime.ready =
            true;


        document
            .documentElement
            .setAttribute(
                "data-haldo-ready",
                "true"
            );


        $(
            "#haldo-os"
        )
        ?.setAttribute(
            "data-haldo-state",
            "ready"
        );


        setStatus(
            "HalDo AI OS bereit"
        );


        $(
            "#haldo-boot"
        )
        ?.classList.add(
            "hidden"
        );


        window.dispatchEvent(
            new CustomEvent(
                "haldo:ready",
                {
                    detail:
                        OS.runtime
                }
            )
        );


        console.log(
            "🚀 HalDo AI OS 20 bereit.",
            OS
        );

    }


    /* ======================================================
       START
       ====================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            bootShell,
            {
                once: true
            }
        );

    } else {

        bootShell();

    }

})();

</script>


</body>
</html>
