<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050814"
>

<meta
    name="description"
    content="HalDo AI OS 20 – Living Cosmic Operating System"
>

<title>HalDo AI OS 20</title>

<style>

:root {
    --bg: #02040b;
    --bg2: #07101f;
    --panel: rgba(12, 21, 40, .82);
    --panel2: rgba(19, 31, 54, .72);
    --border: rgba(255,255,255,.12);

    --text: #f5f8ff;
    --muted: #9caac5;

    --cyan: #5ee7ff;
    --blue: #4c8dff;
    --violet: #a47cff;
    --pink: #ff6bd6;
    --gold: #ffd76a;
    --green: #61e6a4;
    --red: #ff667f;

    --shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 50px rgba(76,141,255,.08);

    --radius: 22px;

    --topbar-height: 58px;
    --dock-height: 76px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    color: inherit;
}

/* =========================================================
   COSMIC BACKGROUND
========================================================= */

#haldo-os {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(58,91,180,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 20% 20%,
            rgba(126,68,255,.08),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(0,210,255,.07),
            transparent 30%
        ),
        #02040b;
}

#space {
    position: absolute;
    inset: 0;
    overflow: hidden;
    perspective: 1000px;
}

.space-nebula {
    position: absolute;
    width: 80vw;
    height: 80vw;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .12;
    pointer-events: none;
    animation: nebulaFloat 18s ease-in-out infinite alternate;
}

.nebula-a {
    left: -20vw;
    top: 5vh;
    background: #4c6fff;
}

.nebula-b {
    right: -20vw;
    bottom: -10vh;
    background: #bd55ff;
    animation-delay: -6s;
}

.nebula-c {
    left: 25vw;
    top: -35vh;
    background: #00dfff;
    animation-delay: -11s;
}

@keyframes nebulaFloat {
    from {
        transform: translate3d(-20px, -10px, 0) scale(1);
    }
    to {
        transform: translate3d(30px, 20px, 0) scale(1.08);
    }
}

/* =========================================================
   STARS
========================================================= */

.star-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: white;
    opacity: var(--opacity);
    box-shadow:
        0 0 7px rgba(255,255,255,.75);
    animation:
        starPulse var(--duration) ease-in-out infinite alternate;
}

@keyframes starPulse {
    from {
        opacity: calc(var(--opacity) * .35);
        transform: scale(.7);
    }

    to {
        opacity: var(--opacity);
        transform: scale(1.4);
    }
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar {
    position: absolute;
    z-index: 5000;
    top: 0;
    left: 0;
    right: 0;

    height: var(--topbar-height);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        0 18px;

    background:
        linear-gradient(
            to bottom,
            rgba(2,4,11,.82),
            rgba(2,4,11,.32)
        );

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.brand-logo {
    width: 34px;
    height: 34px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background:
        radial-gradient(
            circle,
            #fff 0 7%,
            #72eaff 15%,
            #4388ff 45%,
            transparent 70%
        );

    box-shadow:
        0 0 15px rgba(94,231,255,.65),
        0 0 35px rgba(76,141,255,.35);

    animation: logoBreath 3s ease-in-out infinite;
}

@keyframes logoBreath {
    0%,100% {
        transform: scale(1);
        filter: brightness(1);
    }

    50% {
        transform: scale(1.08);
        filter: brightness(1.35);
    }
}

.brand-name {
    font-weight: 800;
    letter-spacing: .5px;
}

.brand-version {
    font-size: 11px;
    color: var(--muted);
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.icon-button {
    width: 38px;
    height: 38px;

    border: 1px solid transparent;
    border-radius: 12px;

    background: rgba(255,255,255,.06);

    display: grid;
    place-items: center;

    cursor: pointer;

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
}

.icon-button:hover {
    background: rgba(255,255,255,.12);
    border-color: var(--border);
    transform: translateY(-1px);
}

.icon-button:active {
    transform: scale(.94);
}

/* =========================================================
   COSMIC SYSTEM
========================================================= */

.cosmic-system {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(82vw, 900px);
    height: min(82vw, 900px);

    transform:
        translate(-50%, -50%)
        rotateX(63deg);

    transform-style: preserve-3d;

    transition: transform .8s ease;
}

.orbit {
    position: absolute;

    left: 50%;
    top: 50%;

    border: 1px solid rgba(154,187,255,.15);

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    transform-style: preserve-3d;

    pointer-events: none;
}

.orbit-1 {
    width: 24%;
    height: 24%;
}

.orbit-2 {
    width: 38%;
    height: 38%;
}

.orbit-3 {
    width: 54%;
    height: 54%;
}

.orbit-4 {
    width: 70%;
    height: 70%;
}

.orbit-5 {
    width: 88%;
    height: 88%;
}

.orbit-6 {
    width: 104%;
    height: 104%;
}

.sun {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 115px;
    height: 115px;

    transform:
        translate(-50%, -50%)
        rotateX(-63deg);

    border-radius: 50%;

    cursor: pointer;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff 0%,
            #fff9bd 10%,
            #ffd86c 27%,
            #ffae38 50%,
            #ff722e 72%,
            #ff4c2c 100%
        );

    box-shadow:
        0 0 20px #fff1a8,
        0 0 45px rgba(255,213,89,.95),
        0 0 90px rgba(255,155,50,.75),
        0 0 160px rgba(255,103,30,.5);

    animation:
        sunPulse 3.5s ease-in-out infinite,
        sunRotate 16s linear infinite;
    
    z-index: 100;
}

.sun::before,
.sun::after {
    content: "";

    position: absolute;
    inset: -25px;

    border-radius: 50%;

    border:
        2px solid rgba(255,214,100,.35);

    filter: blur(2px);

    animation:
        sunCorona 5s ease-in-out infinite;
}

.sun::after {
    inset: -48px;
    border-color:
        rgba(255,158,56,.15);

    animation-delay: -2.5s;
}

@keyframes sunPulse {
    0%,100% {
        transform:
            translate(-50%, -50%)
            rotateX(-63deg)
            scale(1);
    }

    50% {
        transform:
            translate(-50%, -50%)
            rotateX(-63deg)
            scale(1.09);
    }
}

@keyframes sunRotate {
    from {
        filter: hue-rotate(0deg);
    }

    to {
        filter: hue-rotate(12deg);
    }
}

@keyframes sunCorona {
    0%,100% {
        transform: scale(.92);
        opacity: .4;
    }

    50% {
        transform: scale(1.12);
        opacity: 1;
    }
}

.planet {
    position: absolute;

    width: var(--size);
    height: var(--size);

    border-radius: 50%;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        rotateX(-63deg)
        translateX(var(--distance));

    cursor: pointer;

    box-shadow:
        inset -10px -8px 15px rgba(0,0,0,.45),
        0 0 14px var(--glow);

    animation:
        planetOrbit var(--speed) linear infinite;

    animation-delay: var(--delay);

    z-index: 50;
}

@keyframes planetOrbit {
    from {
        transform:
            translate(-50%, -50%)
            rotateX(-63deg)
            rotateZ(0deg)
            translateX(var(--distance));
    }

    to {
        transform:
            translate(-50%, -50%)
            rotateX(-63deg)
            rotateZ(360deg)
            translateX(var(--distance));
    }
}

.planet::after {
    content: "";

    position: absolute;
    inset: -4px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.08);

    pointer-events: none;
}

.planet.mercury {
    --size: 18px;
    --distance: 110px;
    --speed: 8s;
    --delay: -2s;
    --glow: rgba(180,180,180,.3);

    background:
        radial-gradient(circle at 35% 30%, #dedede, #777, #272727);
}

.planet.venus {
    --size: 28px;
    --distance: 155px;
    --speed: 12s;
    --delay: -4s;
    --glow: rgba(255,183,90,.5);

    background:
        radial-gradient(circle at 35% 25%, #fff0ae, #d19a52, #774425);
}

.planet.earth {
    --size: 34px;
    --distance: 205px;
    --speed: 16s;
    --delay: -8s;
    --glow: rgba(70,170,255,.7);

    background:
        radial-gradient(
            circle at 35% 30%,
            #76e7ff 0%,
            #1c77c8 42%,
            #154b96 60%,
            #09244e 100%
        );
}

.planet.mars {
    --size: 27px;
    --distance: 255px;
    --speed: 20s;
    --delay: -11s;
    --glow: rgba(255,90,60,.5);

    background:
        radial-gradient(circle at 30% 30%, #ffb18d, #c84d35, #61251f);
}

.planet.jupiter {
    --size: 68px;
    --distance: 330px;
    --speed: 27s;
    --delay: -17s;
    --glow: rgba(255,190,130,.4);

    background:
        repeating-linear-gradient(
            0deg,
            #b47c58 0 9px,
            #e4c49e 9px 17px,
            #8d573d 17px 23px,
            #d7a477 23px 32px
        );
}

.planet.saturn {
    --size: 55px;
    --distance: 410px;
    --speed: 34s;
    --delay: -22s;
    --glow: rgba(230,200,150,.4);

    background:
        radial-gradient(
            circle at 35% 30%,
            #f4ddb1,
            #b79058,
            #695031
        );
}

.planet.saturn::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 100px;
    height: 25px;

    border:
        4px solid rgba(220,195,145,.65);

    border-radius: 50%;

    transform:
        translate(-50%, -50%)
        rotate(-12deg);
}

.planet.uranus {
    --size: 38px;
    --distance: 475px;
    --speed: 42s;
    --delay: -27s;
    --glow: rgba(112,232,255,.5);

    background:
        radial-gradient(circle at 35% 30%, #b8ffff, #55bfc8, #286b78);
}

.planet.neptune {
    --size: 38px;
    --distance: 535px;
    --speed: 49s;
    --delay: -32s;
    --glow: rgba(65,120,255,.6);

    background:
        radial-gradient(circle at 35% 30%, #769dff, #314dc2, #111c62);
}

.moon {
    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            #fff,
            #bfc8d6,
            #5b6370
        );

    box-shadow:
        0 0 8px rgba(255,255,255,.55);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        translateX(31px);

    animation:
        moonOrbit 4s linear infinite;

    pointer-events: none;
}

@keyframes moonOrbit {
    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg)
            translateX(31px);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg)
            translateX(31px);
    }
}

/* =========================================================
   MAIN UI
========================================================= */

#desktop {
    position: absolute;
    inset: var(--topbar-height) 0 var(--dock-height) 0;
    z-index: 1000;
    pointer-events: none;
}

#desktop > * {
    pointer-events: auto;
}

.desktop-message {
    position: absolute;

    left: 22px;
    bottom: 22px;

    padding: 9px 13px;

    border-radius: 14px;

    background: rgba(3,8,18,.55);

    border: 1px solid rgba(255,255,255,.08);

    backdrop-filter: blur(12px);

    color: var(--muted);

    font-size: 12px;
}

/* =========================================================
   DOCK
========================================================= */

#dock {
    position: absolute;

    z-index: 5000;

    left: 50%;
    bottom: 13px;

    transform: translateX(-50%);

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 8px 11px;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 22px;

    background:
        rgba(6,12,25,.72);

    backdrop-filter: blur(25px);

    box-shadow:
        0 15px 50px rgba(0,0,0,.4);
}

.dock-item {
    width: 48px;
    height: 48px;

    border: 0;
    border-radius: 15px;

    background:
        rgba(255,255,255,.07);

    cursor: pointer;

    display: grid;
    place-items: center;

    font-size: 22px;

    transition:
        transform .18s ease,
        background .18s ease;
}

.dock-item:hover {
    transform:
        translateY(-7px)
        scale(1.08);

    background:
        rgba(255,255,255,.14);
}

.dock-item.active {
    box-shadow:
        0 0 0 1px rgba(94,231,255,.35),
        0 0 22px rgba(94,231,255,.16);
}

/* =========================================================
   APP LAUNCHER
========================================================= */

#launcher {
    position: absolute;

    z-index: 6000;

    left: 50%;
    top: 50%;

    width: min(920px, calc(100vw - 28px));
    height: min(700px, calc(100vh - 110px));

    transform:
        translate(-50%, -50%)
        scale(.96);

    opacity: 0;
    pointer-events: none;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(12,22,42,.95),
            rgba(5,10,22,.95)
        );

    backdrop-filter: blur(30px);

    box-shadow:
        0 40px 120px rgba(0,0,0,.65);

    transition:
        opacity .22s ease,
        transform .22s ease;

    overflow: hidden;
}

#launcher.open {
    opacity: 1;
    pointer-events: auto;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.launcher-head {
    height: 86px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 0 24px;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.launcher-title {
    font-size: 22px;
    font-weight: 800;
}

.launcher-subtitle {
    margin-top: 3px;

    color: var(--muted);

    font-size: 12px;
}

.launcher-search {
    margin: 18px 22px 10px;

    width: calc(100% - 44px);

    padding: 13px 16px;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 15px;

    outline: none;

    background:
        rgba(255,255,255,.055);

    color: white;
}

.launcher-search:focus {
    border-color:
        rgba(94,231,255,.5);

    box-shadow:
        0 0 0 3px rgba(94,231,255,.08);
}

.app-grid {
    height: calc(100% - 150px);

    padding: 12px 22px 25px;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(125px, 1fr));

    gap: 11px;

    overflow-y: auto;
}

.app-card {
    min-height: 110px;

    padding: 14px;

    border:
        1px solid rgba(255,255,255,.07);

    border-radius: 18px;

    background:
        rgba(255,255,255,.035);

    cursor: pointer;

    text-align: left;

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
}

.app-card:hover {
    transform: translateY(-3px);

    background:
        rgba(255,255,255,.085);

    border-color:
        rgba(94,231,255,.25);
}

.app-icon {
    font-size: 29px;

    margin-bottom: 9px;
}

.app-name {
    font-size: 13px;
    font-weight: 700;
}

.app-description {
    margin-top: 4px;

    font-size: 10px;

    color: var(--muted);
}

/* =========================================================
   WINDOWS
========================================================= */

#window-layer {
    position: absolute;
    inset: 0;

    z-index: 7000;

    pointer-events: none;
}

.haldo-window {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(820px, calc(100vw - 30px));
    height: min(600px, calc(100vh - 130px));

    transform:
        translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    overflow: hidden;

    border:
        1px solid rgba(255,255,255,.13);

    border-radius: 22px;

    background:
        rgba(6,13,27,.94);

    box-shadow:
        0 40px 120px rgba(0,0,0,.65);

    backdrop-filter: blur(25px);

    pointer-events: auto;
}

.haldo-window.maximized {
    width: calc(100vw - 22px);
    height: calc(100vh - 88px);
}

.window-head {
    height: 52px;

    flex: 0 0 52px;

    display: flex;
    align-items: center;

    padding: 0 12px 0 17px;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.025);

    cursor: move;
}

.window-title {
    display: flex;
    align-items: center;

    gap: 9px;

    font-size: 13px;
    font-weight: 800;
}

.window-actions {
    margin-left: auto;

    display: flex;
    gap: 5px;
}

.window-action {
    width: 30px;
    height: 30px;

    border: 0;
    border-radius: 9px;

    background: rgba(255,255,255,.05);

    cursor: pointer;
}

.window-action:hover {
    background: rgba(255,255,255,.12);
}

.window-content {
    flex: 1;

    min-height: 0;

    overflow: auto;

    padding: 20px;
}

/* =========================================================
   GENERIC APP UI
========================================================= */

.app-layout {
    min-height: 100%;

    display: flex;
    flex-direction: column;

    gap: 18px;
}

.app-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.haldo-button {
    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 12px;

    padding: 10px 14px;

    background:
        rgba(255,255,255,.055);

    color: white;

    cursor: pointer;

    transition:
        background .18s ease,
        transform .18s ease;
}

.haldo-button:hover {
    background:
        rgba(255,255,255,.11);

    transform: translateY(-1px);
}

.haldo-button.primary {
    background:
        linear-gradient(
            135deg,
            rgba(76,141,255,.35),
            rgba(164,124,255,.3)
        );

    border-color:
        rgba(110,170,255,.3);
}

.haldo-input,
.haldo-textarea,
.haldo-select {
    width: 100%;

    padding: 12px 14px;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 12px;

    background:
        rgba(0,0,0,.2);

    color: white;

    outline: none;
}

.haldo-textarea {
    min-height: 150px;
    resize: vertical;
}

.haldo-input:focus,
.haldo-textarea:focus,
.haldo-select:focus {
    border-color:
        rgba(94,231,255,.45);
}

.app-card-large {
    padding: 18px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 18px;

    background:
        rgba(255,255,255,.035);
}

.app-card-large h2,
.app-card-large h3 {
    margin-top: 0;
}

.muted {
    color: var(--muted);
}

.stat-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));

    gap: 10px;
}

.stat {
    padding: 15px;

    border-radius: 16px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.06);
}

.stat-label {
    color: var(--muted);
    font-size: 11px;
}

.stat-value {
    margin-top: 5px;

    font-size: 22px;
    font-weight: 800;
}

/* =========================================================
   TOAST
========================================================= */

#toast-layer {
    position: fixed;

    right: 18px;
    bottom: 100px;

    z-index: 10000;

    display: flex;
    flex-direction: column;

    gap: 8px;
}

.toast {
    min-width: 250px;

    padding: 13px 15px;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 15px;

    background:
        rgba(8,16,31,.92);

    backdrop-filter: blur(18px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.4);

    animation:
        toastIn .25s ease;
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateX(20px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* =========================================================
   BOOT

    z-index: 20000;

        visibility .8s ease;
}

    opacity: 0;
    visibility: hidden;
}

}

.boot-logo {
    width: 105px;
    height: 105px;

    margin: auto;

    border-radius: 50%;

            circle,
            #fff,
            #72eaff 18%,
            #477dff 45%,
            transparent 72%

        0 0 35px #5ee7ff,

        logoBreath 2.4s infinite;

    font-weight: 900;
}

.boot-text {
    margin-top: 7px;

    color: var(--muted);

    font-size: 12px;
}

    width: 250px;
    height: 3px;

    margin: 24px auto 0;

    overflow: hidden;

    border-radius: 10px;

    background:
        rgba(255,255,255,.08);
}

    height: 100%;
    width: 0;

    background:
        linear-gradient(
            90deg,
            #4c8dff,
            #5ee7ff,
            #a47cff

    animation:

<script>

/* =========================================================
   HALDO AI OS 20
   CENTRAL INDEX RUNTIME
========================================================= */

(function () {

    "use strict";

    const HalDo = {

        version: "20.0.0",

        state: {

            booted: false,

            launcherOpen: false,

            windows: [],

            activeWindow: null,

            appSearch: "",

            language:
                localStorage.getItem(
                    "haldo.language"
                ) || "de",

            cosmicMotion:
                localStorage.getItem(
                    "haldo.cosmicMotion"
                ) !== "false",

            sound:
                localStorage.getItem(
                    "haldo.sound"
                ) !== "false",

            volume:
                Number(
                    localStorage.getItem(
                        "haldo.volume"
                    ) || 0.35
                )

        },

        events: {},

        apps: new Map(),

        modules: {},

        /* =================================================
           EVENT SYSTEM
        ================================================= */

        on(event, handler) {

            if (!this.events[event]) {
                this.events[event] = [];
            }

            this.events[event].push(handler);

            return () => {

                this.events[event] =
                    this.events[event]
                        .filter(
                            fn => fn !== handler
                        );

            };

        },

        emit(event, detail = {}) {

            const handlers =
                this.events[event] || [];

            handlers.forEach(
                handler => {

                    try {
                        handler(detail);
                    } catch (error) {

                        console.error(
                            "[HalDo Event]",
                            event,
                            error
                        );

                    }

                }
            );

            window.dispatchEvent(
                new CustomEvent(
                    "haldo:" + event,
                    {
                        detail
                    }
                )
            );

        },

        /* =================================================
           STORAGE
        ================================================= */

        storage: {

            get(key, fallback = null) {

                try {

                    const value =
                        localStorage.getItem(
                            "haldo." + key
                        );

                    return value === null
                        ? fallback
                        : JSON.parse(value);

                } catch {

                    return fallback;

                }

            },

            set(key, value) {

                try {

                    localStorage.setItem(
                        "haldo." + key,
                        JSON.stringify(value)
                    );

                    HalDo.emit(
                        "storage:set",
                        {
                            key,
                            value
                        }
                    );

                    return true;

                } catch {

                    return false;

                }

            },

            remove(key) {

                localStorage.removeItem(
                    "haldo." + key
                );

                HalDo.emit(
                    "storage:remove",
                    {
                        key
                    }
                );

            }

        },

        /* =================================================
           TOAST
        ================================================= */

        toast(message) {

            const layer =
                document.getElementById(
                    "toast-layer"
                );

            const toast =
                document.createElement(
                    "div"
                );

            toast.className = "toast";

            toast.textContent = message;

            layer.appendChild(toast);

            setTimeout(() => {

                toast.style.opacity = "0";

                toast.style.transform =
                    "translateX(20px)";

                setTimeout(
                    () => toast.remove(),
                    250
                );

            }, 3000);

        },

        /* =================================================
           APP REGISTRATION
        ================================================= */

        registerApp(app) {

            if (
                !app ||
                !app.id ||
                !app.name
            ) {
                return false;
            }

            this.apps.set(
                app.id,
                {
                    icon: "◈",
                    description: "",
                    category: "System",
                    version: "1.0",
                    ...app
                }
            );

            return true;

        },

        /* =================================================
           APP OPEN
        ================================================= */

        openApp(id) {

            const app =
                this.apps.get(id);

            if (!app) {

                this.toast(
                    "App nicht verfügbar: " + id
                );

                return;

            }

            this.closeLauncher();

            this.emit(
                "app:beforeOpen",
                {
                    app
                }
            );

            const existing =
                this.state.windows
                    .find(
                        w =>
                            w.appId === id &&
                            w.element
                    );

            if (existing) {

                this.focusWindow(
                    existing.id
                );

                return;

            }

            this.createWindow(app);

        },

        /* =================================================
           WINDOW SYSTEM
        ================================================= */

        createWindow(app) {

            const id =
                "window-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2);

            const windowElement =
                document.createElement(
                    "section"
                );

            windowElement.className =
                "haldo-window";

            windowElement.dataset.windowId =
                id;

            windowElement.dataset.appId =
                app.id;

            windowElement.innerHTML = `

                <div class="window-head">

                    <div class="window-title">

                        <span>
                            ${app.icon || "◈"}
                        </span>

                        <span>
                            ${this.escape(
                                app.name
                            )}
                        </span>

                    </div>

                    <div class="window-actions">

                        <button
                            class="window-action"
                            data-window-action="minimize"
                            title="Minimieren"
                        >
                            —
                        </button>

                        <button
                            class="window-action"
                            data-window-action="maximize"
                            title="Maximieren"
                        >
                            □
                        </button>

                        <button
                            class="window-action"
                            data-window-action="close"
                            title="Schließen"
                        >
                            ×
                        </button>

                    </div>

                </div>

                <div class="window-content"></div>

            `;

            const content =
                windowElement.querySelector(
                    ".window-content"
                );

            const instance = {

                id,

                appId: app.id,

                app,

                element:
                    windowElement,

                content,

                minimized: false,

                maximized: false

            };

            this.state.windows.push(
                instance
            );

            document
                .getElementById(
                    "window-layer"
                )
                .appendChild(
                    windowElement
                );

            this.focusWindow(id);

            this.attachWindowEvents(
                instance
            );

            try {

                if (
                    typeof app.open ===
                    "function"
                ) {

                    app.open(
                        content,
                        instance,
                        this
                    );

                } else {

                    this.renderDefaultApp(
                        app,
                        content
                    );

                }

            } catch (error) {

                console.error(
                    error
                );

                this.renderError(
                    content,
                    error
                );

            }

            this.emit(
                "app:opened",
                {
                    app,
                    instance
                }
            );

            return instance;

        },

        focusWindow(id) {

            const instance =
                this.state.windows
                    .find(
                        w => w.id === id
                    );

            if (!instance) {
                return;
            }

            this.state.windows
                .forEach(
                    w =>
                        w.element.style.zIndex =
                            "7000"
                );

            instance.element.style.zIndex =
                String(
                    7000 +
                    this.state.windows.length
                );

            instance.element.style.display =
                "flex";

            instance.minimized =
                false;

            this.state.activeWindow =
                id;

            this.emit(
                "window:focused",
                {
                    instance
                }
            );

        },

        closeWindow(id) {

            const index =
                this.state.windows
                    .findIndex(
                        w => w.id === id
                    );

            if (index === -1) {
                return;
            }

            const instance =
                this.state.windows[index];

            try {

                if (
                    typeof instance.app.close ===
                    "function"
                ) {

                    instance.app.close(
                        instance.content,
                        instance,
                        this
                    );

                }

            } catch (error) {

                console.error(error);

            }

            instance.element.remove();

            this.state.windows.splice(
                index,
                1
            );

            this.state.activeWindow =
                null;

            this.emit(
                "window:closed",
                {
                    instance
                }
            );

        },

        attachWindowEvents(instance) {

            const element =
                instance.element;

            element.addEventListener(
                "mousedown",
                () =>
                    this.focusWindow(
                        instance.id
                    )
            );

            element
                .querySelectorAll(
                    "[data-window-action]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            event => {

                                event.stopPropagation();

                                const action =
                                    button.dataset
                                        .windowAction;

                                if (
                                    action ===
                                    "close"
                                ) {

                                    this.closeWindow(
                                        instance.id
                                    );

                                }

                                if (
                                    action ===
                                    "maximize"
                                ) {

                                    instance.maximized =
                                        !instance.maximized;

                                    element.classList.toggle(
                                        "maximized",
                                        instance.maximized
                                    );

                                }

                                if (
                                    action ===
                                    "minimize"
                                ) {

                                    instance.minimized =
                                        true;

                                    element.style.display =
                                        "none";

                                }

                            }
                        );

                    }
                );

        },

        /* =================================================
           DEFAULT APP
        ================================================= */

        renderDefaultApp(
            app,
            container
        ) {

            container.innerHTML = `

                <div class="app-layout">

                    <div class="app-card-large">

                        <h2>
                            ${this.escape(
                                app.icon
                            )}
                            ${this.escape(
                                app.name
                            )}
                        </h2>

                        <p class="muted">
                            ${this.escape(
                                app.description ||
                                "HalDo System App"
                            )}
                        </p>

                    </div>

                    <div class="stat-grid">

                        <div class="stat">

                            <div class="stat-label">
                                Status
                            </div>

                            <div class="stat-value">
                                Aktiv
                            </div>

                        </div>

                        <div class="stat">

                            <div class="stat-label">
                                Version
                            </div>

                            <div class="stat-value">
                                ${this.escape(
                                    app.version ||
                                    "1.0"
                                )}
                            </div>

                        </div>

                    </div>

                    <div class="app-card-large">

                        <h3>
                            HalDo Verbindung
                        </h3>

                        <p class="muted">
                            Diese App ist mit dem
                            zentralen HalDo Runtime-System
                            verbunden.
                        </p>

                        <button
                            class="haldo-button primary"
                            data-test-app
                        >
                            Funktion testen
                        </button>

                    </div>

                </div>

            `;

            const button =
                container.querySelector(
                    "[data-test-app]"
                );

            if (button) {

                button.onclick = () => {

                    this.toast(
                        app.name +
                        " ist mit der HalDo Runtime verbunden."
                    );

                    this.emit(
                        "app:test",
                        {
                            app
                        }
                    );

                };

            }

        },

        renderError(
            container,
            error
        ) {

            container.innerHTML = `

                <div class="app-card-large">

                    <h2>
                        ⚠️ App-Fehler
                    </h2>

                    <p>
                        Beim Starten der App ist
                        ein Fehler aufgetreten.
                    </p>

                    <pre style="
                        white-space:pre-wrap;
                        color:#ff9aaa;
                    ">${this.escape(
                        String(error)
                    )}</pre>

                </div>

            `;

        },

        /* =================================================
           LAUNCHER
        ================================================= */

        openLauncher() {

            const launcher =
                document.getElementById(
                    "launcher"
                );

            launcher.classList.add(
                "open"
            );

            launcher.setAttribute(
                "aria-hidden",
                "false"
            );

            this.state.launcherOpen =
                true;

            document
                .getElementById(
                    "app-search"
                )
                .focus();

            this.renderAppGrid();

        },

        closeLauncher() {

            const launcher =
                document.getElementById(
                    "launcher"
                );

            launcher.classList.remove(
                "open"
            );

            launcher.setAttribute(
                "aria-hidden",
                "true"
            );

            this.state.launcherOpen =
                false;

        },

        toggleLauncher() {

            if (
                this.state.launcherOpen
            ) {

                this.closeLauncher();

            } else {

                this.openLauncher();

            }

        },

        renderAppGrid() {

            const grid =
                document.getElementById(
                    "app-grid"
                );

            const search =
                this.state.appSearch
                    .toLowerCase()
                    .trim();

            grid.innerHTML = "";

            [...this.apps.values()]
                .filter(
                    app => {

                        if (!search) {
                            return true;
                        }

                        return (
                            app.name
                                .toLowerCase()
                                .includes(search) ||
                            app.id
                                .toLowerCase()
                                .includes(search) ||
                            (
                                app.description ||
                                ""
                            )
                                .toLowerCase()
                                .includes(search)
                        );

                    }
                )
                .forEach(
                    app => {

                        const card =
                            document.createElement(
                                "button"
                            );

                        card.className =
                            "app-card";

                        card.innerHTML = `

                            <div class="app-icon">
                                ${this.escape(
                                    app.icon
                                )}
                            </div>

                            <div class="app-name">
                                ${this.escape(
                                    app.name
                                )}
                            </div>

                            <div class="app-description">
                                ${this.escape(
                                    app.description ||
                                    ""
                                )}
                            </div>

                        `;

                        card.onclick =
                            () =>
                                this.openApp(
                                    app.id
                                );

                        grid.appendChild(
                            card
                        );

                    }
                );

        },

        /* =================================================
           BUILT-IN APPS
        ================================================= */

        registerBuiltInApps() {

            this.registerApp({

                id: "ai-chat",

                name: "HalDo AI",

                icon: "🧠",

                category: "AI",

                description:
                    "Zentrale HalDo AI",

                open:
                    this.appsAI

            this.registerApp({

                icon: "📁",

                description:
                    "Dateien und Speicher",

                    this.appsFiles

            });

            this.registerApp({

                icon: "📅",

                category: "Produktivität",

                description:
                    "Termine und Kalender",

                open:
                    this.appsCalendar

            this.registerApp({

                id: "notes",

                name: "Notizen",

                icon: "📝",

                category: "Produktivität",

                description:
                    "Notizen erstellen und speichern",

                open:

            });

            this.registerApp({

                category: "Medien",

                    "HalDo Music",

            this.registerApp({

            this.registerApp({

            this.registerApp({

                description:

                open:

            this.registerApp({

        ================================================= */

        appsAI(
            container,
            instance,
            os
        ) {

            const key =
                "ai.history";

            let history =
                os.storage.get(
                    key,
                    []
                );

            container.innerHTML = `

                <div
                    class="app-layout"
                    style="height:100%"
                >

                    <div
                        class="app-card-large"
                        style="
                            flex:1;
                            overflow:auto;
                        "
                        id="ai-messages"
                    ></div>

                    <div
                        style="
                            display:flex;
                            gap:8px;
                        "
                    >

                        <input
                            id="ai-input"
                            class="haldo-input"
                            placeholder="Sprich mit HalDo AI..."
                        >

                        <button
                            id="ai-send"
                            class="haldo-button primary"
                        >
                            Senden
                        </button>

                    </div>

                </div>

            `;

            const messages =
                container.querySelector(
                    "#ai-messages"
                );

            const input =
                container.querySelector(
                    "#ai-input"
                );

            const send =
                container.querySelector(
                    "#ai-send"
                );

            function render() {

                messages.innerHTML = "";

                history.forEach(
                    item => {

                        const row =
                            document.createElement(
                                "div"
                            );

                        row.style.marginBottom =
                            "12px";

                        row.innerHTML = `

                            <div
                                style="
                                    font-size:11px;
                                    color:#9caac5;
                                "
                            >
                                ${item.role ===
                                "user"
                                    ? "Du"
                                    : "HalDo AI"}
                            </div>

                            <div
                                style="
                                    margin-top:4px;
                                "
                            >
                                ${os.escape(
                                    item.text
                                )}
                            </div>

                        `;

                        messages.appendChild(
                            row
                        );

                    }
                );

                messages.scrollTop =
                    messages.scrollHeight;

            }

            function sendMessage() {

                const text =
                    input.value.trim();

                if (!text) {
                    return;
                }

                history.push({

                    role: "user",

                    text

                });

                let answer =
                    "Ich bin HalDo AI. " +
                    "Deine Nachricht wurde " +
                    "im HalDo AI-System empfangen.";

                const lower =
                    text.toLowerCase();

                if (
                    lower.includes(
                        "hallo"
                    ) ||
                    lower.includes(
                        "hi"
                    )
                ) {

                    answer =
                        "Hallo Bruder ❤️💙🚀 " +
                        "HalDo AI ist bereit.";

                } else if (
                    lower.includes(
                        "zeit"
                    )
                ) {

                    answer =
                        "Es ist jetzt " +
                        new Date()
                            .toLocaleTimeString(
                                "de-DE"
                            ) +
                        ".";

                } else if (
                    lower.includes(
                        "system"
                    )
                ) {

                    answer =
                        "HalDo AI OS 20 läuft. " +
                        "Die zentrale Runtime ist aktiv.";

                }

                history.push({

                    role: "assistant",

                    text: answer

                });

                os.storage.set(
                    key,
                    history
                );

                input.value = "";

                render();

                os.emit(
                    "ai:message",
                    {
                        text
                    }
                );

            }

            send.onclick =
                sendMessage;

            input.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        sendMessage();

                    }

                }
            );

            render();

        },

        appsFiles(

            const files =

            container.innerHTML = `

                <div class="app-layout">

                        id="file-list"
                    ></div>

                </div>

            `;

            const list =
                container.querySelector(
                    "#file-list"
                );

            function render() {

                list.innerHTML =
                    files.length
                        ? ""
                        : "<p class='muted'>Noch keine Dateien.</p>";

                files.forEach(
                    (file,index) => {

                        const row =
                            document.createElement(
                                "div"
                            );

                        row.style.padding =
                            "12px 0";

                        row.style.borderBottom =
                            "1px solid rgba(255,255,255,.06)";

                        row.innerHTML = `

                            📄
                            <strong>
                                ${os.escape(
                                    file.name
                                )}
                            </strong>

                            <button
                                class="haldo-button"
                                style="float:right"
                                data-index="${index}"
                            >
                                Löschen
                            </button>

                        `;

                        row.querySelector(
                            "button"
                        ).onclick = () => {

                            files.splice(
                                index,
                                1
                            );

                            os.storage.set(
                                "files",
                                files
                            );

                            render();

                        };

                        list.appendChild(
                            row
                        );

                    }
                );

            }

            container.querySelector(
                "#new-file"
            ).onclick = () => {

                const name =
                    prompt(
                        "Dateiname:"
                    );

                if (!name) {
                    return;
                }

                files.push({
                    name,
                    created:
                        new Date()
                            .toISOString()
                });

                os.storage.set(
                    "files",
                    files
                );

                render();

            };

            render();

        },

                                        display.value
                                    )();

                            } catch {

                                display.value =
                                    "Fehler";

                            }

                            value;

                const recognition =
                    new Recognition();

                recognition.lang =
                    "de-DE";

                recognition.start();

                recognition.onresult =
                    event => {

                        result.textContent =
                            event.results[0][0]
                                .transcript;

                    };

            };

        },

        appsModules(container) {

            container.innerHTML = `

                <div class="app-card-large">

                    <h2>🧩 Module</h2>

                    <p class="muted">
                        ${Object.keys(
                            HalDo.modules
                        ).length}
                        bekannte Module.
                    </p>

                </div>

            `;

        },

        appsShell(container) {

            container.innerHTML = `

                <div class="app-card-large">

                    <h2>⌨️ HalDo Shell</h2>

                    <input
                        class="haldo-input"
                        placeholder="HalDo Befehl..."
                        id="shell-command"
                    >

                    <br><br>

                    <button
                        class="haldo-button primary"
                        id="shell-run"
                    >
                        Ausführen
                    </button>

                    <pre
                        id="shell-output"
                        style="
                            margin-top:15px;
                            white-space:pre-wrap;
                        "
                    ></pre>

                </div>

            `;

            const input =
                container.querySelector(
                    "#shell-command"
                );

            const output =
                container.querySelector(
                    "#shell-output"
                );

            container.querySelector(
                "#shell-run"
            ).onclick = () => {

                const command =
                    input.value.trim();

                if (
                    command ===
                    "apps"
                ) {

                    output.textContent =
                        [...HalDo.apps.keys()]
                            .join("\n");

                } else if (
                    command ===
                    "status"
                ) {

                    output.textContent =
                        "HalDo Runtime: ACTIVE";

                } else {

                    output.textContent =
                        "Befehl nicht erkannt.";

                }

            };

        },

        appsManager(container) {

            container.innerHTML = `

                <div class="app-card-large">

                    <h2>📦 App Manager</h2>

                    <p>
                        ${this.apps.size}
                        Apps registriert.
                    </p>

                </div>

            `;

        },

        appsCosmic(container) {

            container.innerHTML = `

                <div class="app-layout">

                    <div class="app-card-large">

                        <h2>
                            🌌 HalDo Cosmic World
                        </h2>

                        <p class="muted">
                            Die Oberfläche ist keine
                            statische Tapete. Sie ist Teil
                            der HalDo Runtime.
                        </p>

                        <button
                            class="haldo-button primary"
                            id="pause-cosmic"
                        >
                            Animation umschalten
                        </button>

                    </div>

                </div>

            `;

            container.querySelector(
                "#pause-cosmic"
            ).onclick = () => {

                HalDo.state.cosmicMotion =
                    !HalDo.state.cosmicMotion;

                HalDo.applyCosmicMotion();

            };

        },

        /* =================================================
           ESCAPE
        ================================================= */

        escape(value) {

            return String(value)
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        },

        /* =================================================
           COSMIC MOTION
        ================================================= */

        applyCosmicMotion() {

            const system =
                document.querySelector(
                    ".cosmic-system"
                );

            if (!system) {
                return;
            }

            system.style.animationPlayState =
                this.state.cosmicMotion
                    ? "running"
                    : "paused";

            document
                .querySelectorAll(
                    ".planet,.moon,.sun,.star"
                )
                .forEach(
                    element => {

                        element.style.animationPlayState =
                            this.state.cosmicMotion
                                ? "running"
                                : "paused";

                    }
                );

        },

        /* =================================================
           COSMIC SOUND
        ================================================= */

        playWelcomeSound() {

            if (!this.state.sound) {
                return;
            }

            try {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (!AudioContext) {
                    return;
                }

                const ctx =
                    new AudioContext();

                const now =
                    ctx.currentTime;

                const notes = [
                    523.25,
                    659.25,
                    783.99,
                    1046.50
                ];

                notes.forEach(
                    (frequency,index) => {

                        const oscillator =
                            ctx.createOscillator();

                        const gain =
                            ctx.createGain();

                        oscillator.type =
                            "sine";

                        oscillator.frequency.value =
                            frequency;

                        gain.gain.setValueAtTime(
                            0,
                            now +
                            index * .12
                        );

                        gain.gain.linearRampToValueAtTime(
                            this.state.volume *
                            .08,
                            now +
                            index * .12 +
                            .04
                        );

                        gain.gain.exponentialRampToValueAtTime(
                            .0001,
                            now +
                            index * .12 +
                            .65
                        );

                        oscillator.connect(
                            gain
                        );

                        gain.connect(
                            ctx.destination
                        );

                        oscillator.start(
                            now +
                            index * .12
                        );

                        oscillator.stop(
                            now +
                            index * .12 +
                            .7
                        );

                    }
                );

                setTimeout(
                    () => ctx.close(),
                    1800
                );

            } catch (
                error
            ) {

                console.warn(
                    "Cosmic Sound:",
                    error
                );

            }

        },

        /* =================================================
           STAR GENERATOR
        ================================================= */

        createStars() {

            const field =
                document.getElementById(
                    "star-field"
                );

            field.innerHTML = "";

            const count =
                window.innerWidth <
                700
                    ? 120
                    : 240;

            for (
                let i = 0;
                i < count;
                i++
            ) {

                const star =
                    document.createElement(
                        "span"
                    );

                star.className =
                    "star";

                star.style.left =
                    Math.random() *
                    100 +
                    "%";

                star.style.top =
                    Math.random() *
                    100 +
                    "%";

                star.style.setProperty(
                    "--size",
                    (
                        Math.random() *
                        2.2 +
                        0.5
                    ) +
                    "px"
                );

                star.style.setProperty(
                    "--opacity",
                    (
                        Math.random() *
                        .7 +
                        .2
                    )
                );

                star.style.setProperty(
                    "--duration",
                    (
                        Math.random() *
                        5 +
                        2
                    ) +
                    "s"
                );

                star.style.animationDelay =
                    "-" +
                    (
                        Math.random() *
                        5
                    ) +
                    "s";

                field.appendChild(
                    star
                );

            }

        },

        /* =================================================
           PLANET EVENTS
        ================================================= */

        setupCosmicEvents() {

            const sun =
                document.getElementById(
                    "sun"
                );

            sun.addEventListener(
                "click",
                () => {

                    this.openApp(
                        "ai-chat"
                    );

                    this.toast(
                        "☀️ HalDo AI erwacht."
                    );

                    this.playWelcomeSound();

                }
            );

            document
                .querySelectorAll(
                    ".planet"
                )
                .forEach(
                    planet => {

                        planet.addEventListener(
                            "click",
                            event => {

                                event.stopPropagation();

                                const name =
                                    planet.dataset
                                        .planet;

                                this.toast(
                                    "🪐 " +
                                    name
                                );

                                this.emit(
                                    "cosmic:planet",
                                    {
                                        planet:
                                            name
                                    }
                                );

                            }
                        );

                    }
                );

        },

        /* =================================================
           UI EVENTS
        ================================================= */

        setupUI() {

            document
                .getElementById(
                    "brand-logo"
                )
                .onclick = () =>
                    this.openApp(
                        "cosmic-world"
                    );

            document
                .getElementById(
                    "ai-button"
                )
                .onclick = () =>
                    this.openApp(
                        "ai-chat"
                    );

            document
                .getElementById(
                    "settings-button"
                )
                .onclick = () =>
                    this.openApp(
                        "settings"
                    );

            document
                .getElementById(
                    "notification-button"
                )
                .onclick = () =>
                    this.openApp(
                        "notifications"
                    );

            document
                .getElementById(
                    "search-button"
                )
                .onclick = () =>
                    this.openLauncher();

            document
                .getElementById(
                    "app-search"
                )
                .addEventListener(
                    "input",
                    event => {

                        this.state.appSearch =
                            event.target.value;

                        this.renderAppGrid();

                    }
                );

            document
                .querySelectorAll(
                    "[data-action='launcher']"
                )
                .forEach(
                    button => {

                        button.onclick =
                            () =>
                                this.toggleLauncher();

                    }
                );

            document
                .querySelectorAll(
                    "[data-app]"
                )
                .forEach(
                    button => {

                        button.onclick =
                            () =>
                                this.openApp(
                                    button.dataset
                                        .app
                                );

                    }
                );

            document.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Escape"
                    ) {

                        if (
                            this.state
                                .launcherOpen
                        ) {

                            this.closeLauncher();

                        }

                    }

                    if (
                        event.metaKey &&
                        event.key ===
                        " "
                    ) {

                        event.preventDefault();

                        this.toggleLauncher();

                    }

                }
            );

        },

        /* =================================================
           EXTERNAL MODULE LOADING
        ================================================= */

        async loadExternalModules() {

            const modules = [

                "js/kernel.js",
                "js/system.js",
                "js/storage.js",
                "js/storage-manager.js",
                "js/haldo-app-events.js",
                "js/haldo-v20-service-bridge.js",
                "js/haldo-v20-integration.js",
                "js/app-registry.js",
                "js/haldo-v20-app-runtime.js",
                "js/app-manager.js",
                "js/app-router.js",
                "js/window-manager.js",
                "js/ai-core.js",
                "js/ai-engine.js",
                "js/ai-chat.js",
                "js/ai-memory.js",
                "js/ai-language.js",
                "js/ai-speech.js",
                "js/ai-voice.js",
                "js/language-manager.js",
                "js/language-system.js",
                "js/voice.js",
                "js/system-status.js"

            ];

            for (
                const src of modules
            ) {

                try {

                    await this.loadScript(
                        src
                    );

                    this.modules[src] =
                        true;

                } catch {

                    this.modules[src] =
                        false;

                }

            }

        },

        loadScript(src) {

            return new Promise(
                (
                    resolve,
                    reject
                ) => {

                    if (
                        document.querySelector(
                            `script[data-haldo-src="${src}"]`
                        )
                    ) {

                        resolve();

                        return;

                    }

                    const script =
                        document.createElement(
                            "script"
                        );

                    script.src =
                        src;

                    script.async =
                        false;

                    script.dataset
                        .haldoSrc =
                        src;

                    script.onload =
                        resolve;

                    script.onerror =
                        () =>
                            reject(
                                new Error(
                                    "Module konnte nicht geladen werden: " +
                                    src
                                )
                            );

                    document.body.appendChild(
                        script
                    );

                }
            );

        },

        /* =================================================
           BOOT
        ================================================= */

        async boot() {

            this.createStars();

            this.registerBuiltInApps();

            this.setupUI();

            this.setupCosmicEvents();

            this.applyCosmicMotion();

            await this.loadExternalModules();

            this.state.booted =
                true;

            this.emit(
                "system:ready",
                {
                    version:
                        this.version
                }
            );

            setTimeout(
                () => {

                    document
                        .getElementById(
                            "boot-screen"
                        )
                        .classList.add(
                            "hide"
                        );

                },
                1200
            );

            setTimeout(
                () => {

                    this.toast(
                        "🌌 HalDo AI OS 20 ist bereit."
                    );

                },
                1700
            );

        }

    };

    /* =====================================================
       GLOBAL HALDO API
    ===================================================== */

    window.HalDoOS =
        HalDo;

    window.HalDo =
        HalDo;

    /* =====================================================
       START
    ===================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            () =>
                HalDo.boot()
        );

    } else {

        HalDo.boot();

    }

})();

</script>
