<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
    <meta name="theme-color" content="#0a0a1a" />
    <title>HalDo AI OS 24.6.0 Ultimate</title>

    <!-- Three.js für Cosmic World -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           HALDO AI OS 24.6.0 – ULTIMATE DESIGN
           ============================================================ */

        :root {
            --primary: #6C3CE1;
            --primary-dark: #4A1FA6;
            --primary-light: #8B5CF6;
            --secondary: #00D4FF;
            --accent: #FF6B9D;
            --gold: #FFD700;
            --success: #00FF88;
            --warning: #FFB800;
            --danger: #FF3B30;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(20px);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.35);
            --bg-primary: #0a0a1a;
            --taskbar-height: 48px;
            --menu-top-height: 40px;
            --font-primary: 'Inter', sans-serif;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-primary);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== BOOT SCREEN ===== */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #boot-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .boot-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }
        #boot-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .boot-logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .boot-logo-ring {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(108, 60, 225, 0.15);
            animation: ringSpin 8s linear infinite;
        }
        .boot-logo-ring::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            width: 6px;
            height: 6px;
            background: var(--primary-light);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary-light);
        }
        @keyframes ringSpin {
            to {
                transform: rotate(360deg);
            }
        }
        .boot-logo {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bootPulse 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
            z-index: 2;
            position: relative;
        }
        #boot-logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }
        @keyframes bootPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 100px rgba(108, 60, 225, 0.6);
            }
        }
        .boot-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.12), transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes glowPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
        .boot-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            z-index: 2;
        }
        .boot-subtitle {
            font-size: 10px;
            font-weight: 300;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: -2px;
            z-index: 2;
        }
        .boot-status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 2px 0;
            z-index: 2;
        }
        .boot-ring {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-top: 2px solid var(--primary-light);
            border-right: 2px solid var(--secondary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .boot-status {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 1px;
            min-height: 20px;
        }
        .boot-progress {
            width: 240px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            z-index: 2;
        }
        .boot-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .boot-version {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            z-index: 2;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: var(--bg-primary);
            display: none;
        }
        #cosmic-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #cosmic-canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== LIVING AI AVATAR ===== */
        #living-ai-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            z-index: 10;
            pointer-events: none;
            border-radius: 50%;
            overflow: hidden;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.15), transparent 70%);
            display: none;
        }

        /* ===== TOP MENU ===== */
        #top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--menu-top-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            z-index: 90;
            gap: 2px;
        }
        .menu-left {
            display: flex;
            align-items: center;
            gap: 2px;
            overflow-x: auto;
            flex: 1;
            padding: 2px 0;
            -webkit-overflow-scrolling: touch;
        }
        .menu-left::-webkit-scrollbar {
            height: 0;
        }
        .menu-logo {
            width: 26px;
            height: 26px;
            object-fit: contain;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .menu-item {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
            flex-shrink: 0;
            border: none;
            background: transparent;
            font-family: var(--font-primary);
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        .menu-item.active {
            background: var(--primary);
            color: white;
        }
        .menu-right {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .menu-right .menu-item {
            font-size: 9px;
            padding: 2px 6px;
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--taskbar-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            z-index: 100;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.25);
            gap: 2px;
        }
        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        #taskbar-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 6px;
            cursor: pointer;
            transition: transform var(--transition-fast);
        }
        #taskbar-logo:hover {
            transform: scale(1.05);
        }
        #taskbar-time {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 50px;
        }
        .taskbar-center {
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 1;
            overflow-x: auto;
            padding: 0 4px;
            -webkit-overflow-scrolling: touch;
        }
        .taskbar-center::-webkit-scrollbar {
            height: 0;
        }
        .taskbar-app-btn {
            padding: 2px 6px;
            height: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-radius: 5px;
            color: var(--text-secondary);
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .taskbar-app-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--glass-border);
        }
        .taskbar-app-btn.active {
            background: rgba(108, 60, 225, 0.2);
            border-color: var(--primary);
            color: var(--text-primary);
        }
        .taskbar-right {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .taskbar-right .tb-icon {
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 5px;
            transition: all var(--transition-fast);
            line-height: 1;
            background: none;
            border: none;
            font-family: var(--font-primary);
        }
        .taskbar-right .tb-icon:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        #taskbar-status {
            color: var(--success) !important;
            font-size: 8px !important;
        }

        /* ===== WINDOWS ===== */
        #window-container {
            position: fixed;
            top: var(--menu-top-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--menu-top-height) - var(--taskbar-height));
            z-index: 10;
            pointer-events: none;
            padding: 6px;
        }
        .window {
            position: absolute;
            min-width: 240px;
            min-height: 160px;
            max-width: 94vw;
            max-height: 88vh;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            pointer-events: all;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowOpen 0.18s ease;
        }
        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .window.minimized {
            transform: scale(0.8) translateY(30px);
            opacity: 0;
            pointer-events: none;
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
            max-width: 100vw;
            max-height: 100vh;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid var(--glass-border);
            cursor: grab;
            flex-shrink: 0;
            min-height: 28px;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .window-title .icon {
            font-size: 14px;
        }
        .window-controls {
            display: flex;
            gap: 4px;
        }
        .window-controls button {
            width: 10px;
            height: 10px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all var(--transition-fast);
            padding: 0;
            font-size: 6px;
            line-height: 10px;
            text-align: center;
            color: transparent;
        }
        .window-controls .btn-close {
            background: #FF5F57;
        }
        .window-controls .btn-close:hover {
            background: #FF3B30;
            transform: scale(1.1);
        }
        .window-controls .btn-minimize {
            background: #FFBD2E;
        }
        .window-controls .btn-minimize:hover {
            background: #FFA500;
            transform: scale(1.1);
        }
        .window-controls .btn-maximize {
            background: #28C840;
        }
        .window-controls .btn-maximize:hover {
            background: #00A020;
            transform: scale(1.1);
        }
        .window-body {
            flex: 1;
            padding: 8px;
            overflow: auto;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.4;
        }
        .window-body h2 {
            color: var(--text-primary);
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        /* ===== DESKTOP ICONS ===== */
        #desktop-icons {
            position: fixed;
            top: calc(var(--menu-top-height) + 8px);
            left: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 60px);
            gap: 6px;
            z-index: 1;
            padding: 4px;
            max-width: 80%;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 68px;
            padding: 4px;
            border-radius: 10px;
            background: var(--glass-bg);
            border: 1px solid transparent;
            transition: all var(--transition-fast);
            cursor: pointer;
            text-align: center;
            gap: 2px;
            backdrop-filter: var(--glass-blur);
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
            transform: translateY(-2px);
            box-shadow: var(--glass-shadow);
        }
        .desktop-icon:active {
            transform: scale(0.94);
        }
        .desktop-icon .icon-img {
            font-size: 22px;
            line-height: 1;
        }
        .desktop-icon .icon-label {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 500;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            line-height: 1.2;
            max-width: 54px;
            word-wrap: break-word;
        }

        /* ===== AI FLOATING BUTTON ===== */
        .floating-btn {
            position: fixed;
            bottom: 64px;
            right: 12px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 30px rgba(108, 60, 225, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            transition: all var(--transition-normal);
            border: none;
            outline: none;
        }
        .floating-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 40px rgba(108, 60, 225, 0.5);
        }
        .floating-btn:active {
            transform: scale(0.94);
        }
        .floating-logo {
            width: 22px;
            height: 22px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        /* ===== FORM ELEMENTS ===== */
        .haldo-input {
            width: 100%;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-primary);
            font-size: 11px;
            outline: none;
            transition: all var(--transition-fast);
        }
        .haldo-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
        }
        .haldo-input::placeholder {
            color: var(--text-muted);
        }
        .haldo-btn {
            padding: 4px 12px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: white;
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .haldo-btn:hover {
            background: var(--primary-light);
            transform: scale(1.02);
        }
        .haldo-btn:active {
            transform: scale(0.96);
        }
        .haldo-btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
        }
        .haldo-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            :root {
                --taskbar-height: 40px;
                --menu-top-height: 34px;
            }
            .boot-title {
                font-size: 20px;
            }
            .boot-logo {
                width: 60px;
                height: 60px;
            }
            #boot-logo-img {
                width: 38px;
                height: 38px;
            }
            .boot-progress {
                width: 180px;
            }
            #top-menu {
                padding: 0 4px;
                height: var(--menu-top-height);
            }
            .menu-logo {
                width: 20px;
                height: 20px;
            }
            .menu-item {
                font-size: 9px;
                padding: 2px 6px;
            }
            .menu-right .menu-item {
                font-size: 8px;
                padding: 2px 4px;
            }
            #taskbar {
                padding: 0 4px;
                height: var(--taskbar-height);
            }
            #taskbar-logo {
                width: 20px;
                height: 20px;
            }
            #taskbar-time {
                font-size: 10px;
                min-width: 40px;
            }
            .taskbar-app-btn {
                font-size: 8px;
                padding: 2px 5px;
                height: 20px;
            }
            .taskbar-right .tb-icon {
                font-size: 11px;
                padding: 2px 3px;
            }
            #window-container {
                padding: 4px;
                top: var(--menu-top-height);
                height: calc(100% - var(--menu-top-height) - var(--taskbar-height));
            }
            .window {
                min-width: 75vw;
                min-height: 30vh;
                max-width: 96vw;
                max-height: 85vh;
            }
            .window-header {
                padding: 3px 6px;
                min-height: 24px;
            }
            .window-title {
                font-size: 10px;
            }
            .window-title .icon {
                font-size: 12px;
            }
            .window-controls button {
                width: 8px;
                height: 8px;
                line-height: 8px;
                font-size: 5px;
            }
            .window-body {
                padding: 6px;
                font-size: 11px;
            }
            .floating-btn {
                width: 34px;
                height: 34px;
                bottom: 52px;
                right: 8px;
            }
            .floating-logo {
                width: 18px;
                height: 18px;
            }
            .haldo-input {
                font-size: 10px;
                padding: 4px 6px;
            }
            .haldo-btn {
                font-size: 10px;
                padding: 3px 8px;
            }
            #desktop-icons {
                grid-template-columns: repeat(auto-fill, 48px);
                gap: 4px;
                top: calc(var(--menu-top-height) + 6px);
                left: 6px;
                padding: 3px;
            }
            .desktop-icon {
                width: 48px;
                height: 54px;
                padding: 3px;
            }
            .desktop-icon .icon-img {
                font-size: 18px;
            }
            .desktop-icon .icon-label {
                font-size: 8px;
                max-width: 42px;
            }
        }

        @media (max-width: 480px) {
            .window {
                min-width: 90vw;
                min-height: 40vh;
            }
            .window-body {
                padding: 4px;
                font-size: 10px;
            }
            .menu-item {
                font-size: 8px;
                padding: 2px 4px;
            }
            .boot-title {
                font-size: 16px;
            }
            .boot-subtitle {
                font-size: 8px;
                letter-spacing: 2px;

    <script>
        // ============================================================
        //  ⚡⚡⚡ HIER DEINEN GROQ API KEY EINFÜGEN (gsk_...)
        //  ⚡⚡⚡ ODER LEER LASSEN – DANN NUTZT HALDO EINEN LOKALEN FALLBACK
        // ============================================================
        const HALDO_API_KEY = 'gsk_DEIN_NEUEN_KEY_HIER'; // ← HIER DEINEN KEY EINFÜGEN ODER LEER LASSEN!

        // ============================================================
        //  STORAGE
        // ============================================================
        const Storage = {
            prefix: 'haldo_',
            get(key, fallback = null) {
                try { const d = localStorage.getItem(this.prefix + key); return d ? JSON.parse(d) : fallback; } catch {
                    return fallback; }
            },
            set(key, value) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); return true; } catch { return false; }
            },
            remove(key) { localStorage.removeItem(this.prefix + key); return true; },
            clear() {
                Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
                return true;
            },
            getAll() {
                const result = {};
                Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                    const key = k.replace(this.prefix, '');
                    try { result[key] = JSON.parse(localStorage.getItem(k)); } catch { result[key] = localStorage
                            .getItem(k); }
                });
                return result;
            }
        };
        window.Storage = Storage;

        // ============================================================
        //  EVENT BUS
        // ============================================================
        class EventBus {
            constructor() { this.events = {};
                this.onceEvents = {};
                this.debug = false; }
            on(event, callback, context = null) {
                if (!this.events[event]) this.events[event] = [];
                this.events[event].push({ callback, context });
                return this;
            }
            once(event, callback, context = null) {
                if (!this.onceEvents[event]) this.onceEvents[event] = [];
                this.onceEvents[event].push({ callback, context });
                return this;
            }
            emit(event, data = null) {
                if (this.debug) console.log(`📤 Event: ${event}`, data);
                if (this.events[event]) {
                    this.events[event].forEach(sub => {
                        try { sub.callback.call(sub.context || null, data); } catch (e) { console.error(e); }
                    });
                }
                if (this.onceEvents[event]) {
                    const subs = this.onceEvents[event];
                    this.onceEvents[event] = [];
                    subs.forEach(sub => {
                        try { sub.callback.call(sub.context || null, data); } catch (e) { console.error(e); }
                    });
                }
                return this;
            }
            off(event, callback) {
                if (this.events[event]) {
                    this.events[event] = this.events[event].filter(s => s.callback !== callback);
                }
                return this;
            }
        }
        const eventBus = new EventBus();
        window.EventBus = eventBus;

        // ============================================================
        //  KERNEL
        // ============================================================
        const Kernel = {
            version: '24.6.0',
            name: 'HalDo AI OS',
            state: { initialized: false, uptime: 0 },
            init() {
                console.log(`🔧 ${this.name} ${this.version} – Kernel initialisiert`);
                this.state.initialized = true;
                this.state.uptime = Date.now();
                EventBus.emit('kernel:ready');
                return this;
            },
            getUptime() { return Math.floor((Date.now() - this.state.uptime) / 1000); },
            reboot() { location.reload(); },
            shutdown() { if (window.close) window.close(); }
        };
        window.Kernel = Kernel;

        // ============================================================
        //  BOOT
        // ============================================================
        const Boot = {
            status: 'idle',
            progress: 0,
            statusEl: null,
            progressBar: null,
            starsContainer: null,

            init() {
                this.statusEl = document.getElementById('boot-status');
                this.progressBar = document.getElementById('boot-progress-bar');
                this.starsContainer = document.getElementById('boot-stars');
                this.createStars();
                return this;
            },

            createStars() {
                if (!this.starsContainer) return;
                const count = 60;
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    const size = Math.random() * 2.5 + 0.5;
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const delay = Math.random() * 3;
                    const duration = 2 + Math.random() * 3;
                    star.style.cssText = `
                        position:absolute;
                        width:${size}px;
                        height:${size}px;
                        background:white;
                        border-radius:50%;
                        left:${x}%;
                        top:${y}%;
                        opacity:0;
                        animation: starFade ${duration}s ease-in-out ${delay}s infinite;
                        box-shadow: 0 0 ${size*2}px rgba(255,255,255,0.2);
                    `;
                    this.starsContainer.appendChild(star);
                }
                if (!document.getElementById('star-keyframes')) {
                    const style = document.createElement('style');
                    style.id = 'star-keyframes';
                    style.textContent = `
                        @keyframes starFade {
                            0%, 100% { opacity: 0; transform: scale(0.5); }
                            50% { opacity: 1; transform: scale(1); }
                        }
                    `;
                    document.head.appendChild(style);
                }
            },

            async start() {
                if (this.status === 'booting') return;
                this.status = 'booting';
                this.progress = 0;

                const steps = [
                    { label: 'Initializing Cosmic Core...', fn: () => Kernel.init() },
                    { label: 'Loading Storage...', fn: () => Storage.set('boot_test', true) },
                    { label: 'Loading AI Engine...', fn: () => AICore.init() },
                    { label: 'Loading Applications...', fn: () => AppManager.init() },
                    { label: 'Loading Cosmic World...', fn: () => CosmicWorld.init() },
                    { label: 'System Ready 🚀', fn: () => this.finish() }
                ];

                for (const step of steps) {
                    this.updateStatus(step.label);
                    this.updateProgress((steps.indexOf(step) + 1) / steps.length * 100);
                    try { await step.fn(); } catch (e) { console.warn('⚠️ Schritt fehlgeschlagen:', e); }
                    await this.sleep(150);
                }
                this.status = 'ready';
                this.hideBootScreen();
            },

            updateStatus(text) { if (this.statusEl) this.statusEl.textContent = text; },
            updateProgress(value) { this.progress = Math.min(value, 100); if (this.progressBar) this.progressBar.style
                    .width = this.progress + '%'; },

            hideBootScreen() {
                const screen = document.getElementById('boot-screen');
                screen.classList.add('hidden');
                setTimeout(() => { screen.style.display = 'none'; }, 600);
                document.getElementById('desktop').style.display = 'block';
                document.querySelector('.floating-btn').style.display = 'flex';
                // Living AI Avatar anzeigen
                const avatarContainer = document.getElementById('living-ai-container');
                if (avatarContainer) {
                    avatarContainer.style.display = 'block';
                    setTimeout(() => {
                        if (typeof LivingAI !== 'undefined') {
                            LivingAI.init('living-ai-container');
                        }
                    }, 500);
                }
                this.setupUI();
                EventBus.emit('system:ready');
            },

            setupUI() {
                // Top-Menu
                document.querySelectorAll('.menu-item[data-menu]').forEach(el => {
                    el.addEventListener('click', function() {
                        document.querySelectorAll('.menu-item[data-menu]').forEach(e => e.classList.remove(
                            'active'));
                        this.classList.add('active');
                        AppManager.openCategory(this.dataset.menu);
                    });
                });

                // Theme
                document.getElementById('menu-theme')?.addEventListener('click', () => {
                    const themes = ['dark', 'light', 'cosmic', 'aurora', 'midnight'];
                    const current = document.documentElement.getAttribute('data-theme') || 'dark';
                    const next = themes[(themes.indexOf(current) + 1) % themes.length];
                    document.documentElement.setAttribute('data-theme', next);
                    const icons = { dark: '🌙', light: '☀️', cosmic: '🌌', aurora: '🌠', midnight: '🌃' };
                    document.getElementById('menu-theme').textContent = icons[next] || '🌙';
                    Storage.set('theme', next);
                });

                // Voice
                document.getElementById('menu-voice')?.addEventListener('click', () => {
                    const voices = ['👩', '👨', '🧑', '👧', '👦'];
                    const current = document.getElementById('menu-voice').textContent;
                    const idx = voices.indexOf(current);
                    const next = voices[(idx + 1) % voices.length];
                    document.getElementById('menu-voice').textContent = next;
                    Storage.set('voice_gender', next);
                    EventBus.emit('voice:changed', { voice: next });
                });

                // Language
                document.getElementById('menu-lang')?.addEventListener('click', () => {
                    const langs = ['DE', 'EN', 'KU', 'EZ', 'TR', 'AR', 'FR', 'ES', 'RU', 'FA', 'IT', 'PT'];
                    const current = document.getElementById('menu-lang').textContent;
                    const idx = langs.indexOf(current);
                    const next = langs[(idx + 1) % langs.length];
                    document.getElementById('menu-lang').textContent = next;
                    Storage.set('language', next);
                    EventBus.emit('language:changed', { lang: next });
                });

                // Status
                document.getElementById('menu-status')?.addEventListener('click', () => {
                    AppManager.openApp('system-monitor');
                });

                // Taskbar
                document.getElementById('taskbar-logo')?.addEventListener('click', () => AppManager.openApp(
                    'app-center'));
                document.getElementById('tb-notifications')?.addEventListener('click', () => {
                    const nots = Storage.get('notifications', []);
                    if (nots.length === 0) alert('🔔 Keine neuen Benachrichtigungen');
                    else alert('🔔 Benachrichtigungen:\n' + nots.map((n, i) => `${i+1}. ${n}`).join('\n'));
                });
                document.getElementById('tb-status')?.addEventListener('click', () => {
                    alert(
                        `✅ HalDo AI OS ${Kernel.version}\nUptime: ${Kernel.getUptime()}s\nApps: ${AppManager.installedApps.length}\nSpeicher: ${localStorage.length} Einträge`
                        );
                });

                // AI Floating Button
                document.getElementById('ai-floating-btn')?.addEventListener('click', () => AppManager.openApp(
                    'haldo-ai'));

                // Clock
                updateClock();
                setInterval(updateClock, 1000);

                // Load saved settings
                const savedTheme = Storage.get('theme', 'dark');
                document.documentElement.setAttribute('data-theme', savedTheme);
                const themeIcons = { dark: '🌙', light: '☀️', cosmic: '🌌', aurora: '🌠', midnight: '🌃' };
                document.getElementById('menu-theme').textContent = themeIcons[savedTheme] || '🌙';

                const savedVoice = Storage.get('voice_gender', '👩');
                document.getElementById('menu-voice').textContent = savedVoice;

                const savedLang = Storage.get('language', 'DE');
                document.getElementById('menu-lang').textContent = savedLang;
            },

            sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        };
        window.Boot = Boot;

        // ============================================================
        //  COSMIC WORLD (3D)
        // ============================================================
        const CosmicWorld = {
            scene: null,
            camera: null,
            renderer: null,
            isReady: false,
            animationId: null,
            planetData: [],

            clock: null,
            sunMesh: null,
            logoTexture: null,
            container: null,

            planetInfo: {
                'Merkur': { name: 'Merkur', diameter: '4.879 km', distance: '57,9 Mio. km', moons: 0,
                    fact: 'Kleinster Planet' },
                'Venus': { name: 'Venus', diameter: '12.104 km', distance: '108,2 Mio. km', moons: 0,
                    fact: 'Heißester Planet' },
                'Erde': { name: 'Erde', diameter: '12.756 km', distance: '149,6 Mio. km', moons: 1,
                    fact: 'Unser Zuhause' },
                'Mars': { name: 'Mars', diameter: '6.792 km', distance: '227,9 Mio. km', moons: 2,
                    fact: 'Der rote Planet' },
                'Jupiter': { name: 'Jupiter', diameter: '142.984 km', distance: '778,6 Mio. km', moons: 95,
                    fact: 'Größter Planet' },
                'Saturn': { name: 'Saturn', diameter: '120.536 km', distance: '1,43 Mrd. km', moons: 146,
                    fact: 'Herr der Ringe' },
                'Uranus': { name: 'Uranus', diameter: '51.118 km', distance: '2,87 Mrd. km', moons: 27,

                'Neptun': { name: 'Neptun', diameter: '49.528 km', distance: '4,50 Mrd. km', moons: 16,

                'Pluto': { name: 'Pluto', diameter: '2.377 km', distance: '5,91 Mrd. km', moons: 5,

                    if (this.sunMesh) {
                        this.sunMesh.material.map = this.logoTexture;

            createSun() {

                    { name: 'Eris', size: 0.18, distance: 34.2, color: 0x6699cc, speed: 0.0015 }
                ];

                this.planetData = [];
                planets.forEach((data, idx) => {

                    const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.5,
                        metalness: 0.1, emissive: data.color, emissiveIntensity: 0.02 });
                    const mesh = new THREE.Mesh(geo, mat);
                    const angle = (idx / planets.length) * Math.PI * 2 + Math.random() * 0.2;
                    mesh.position.x = Math.cos(angle) * data.distance;
                    mesh.position.z = Math.sin(angle) * data.distance;
                    mesh.userData = { distance: data.distance, speed: data.speed, angle: angle, name: data.name,
                        hasMoon: data.hasMoon || false };
                    this.scene.add(mesh);

                    const pts = [];
                    for (let i = 0; i <= 80; i++) {
                        const t = (i / 80) * Math.PI * 2;
                        pts.push(new THREE.Vector3(Math.cos(t) * data.distance, 0, Math.sin(t) * data.distance));
                    }
                    const orbit = new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints(pts),
                        new THREE.LineBasicMaterial({ color: data.color, transparent: true, opacity: 0.08 })
                    );
                    this.scene.add(orbit);

            createStars(count = 300) {

                    const r = 35 + Math.random() * 160,
                        t = Math.random() * Math.PI * 2,
                        p = Math.acos(2 * Math.random() - 1);
                    pos[i * 3] = r * Math.sin(p) * Math.cos(t);
                    pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
                    pos[i * 3 + 2] = r * Math.cos(p);
                    const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.25, 0.3, 0.6 + Math.random() * 0.4);
                    col[i * 3] = c.r;
                    col[i * 3 + 1] = c.g;
                    col[i * 3 + 2] = c.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                this.starField = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.2, vertexColors: true,

                    const r = 18 + Math.random() * 60,
                        t = Math.random() * Math.PI * 2,
                        p = Math.acos(2 * Math.random() - 1);
                    pos[i * 3] = r * Math.sin(p) * Math.cos(t);
                    pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t) * 0.3;
                    pos[i * 3 + 2] = r * Math.cos(p);
                    const c = new THREE.Color().setHSL(0.65 + Math.random() * 0.25, 0.4, 0.1 + Math.random() * 0.15);
                    col[i * 3] = c.r;
                    col[i * 3 + 1] = c.g;
                    col[i * 3 + 2] = c.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                this.nebula = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.5, vertexColors: true,
                    transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending }));
                this.scene.add(this.nebula);

            animate() {

                const time = this.clock ? this.clock.getElapsedTime() : Date.now() * 0.001;

                if (this.sunMesh) {
                    this.sunMesh.rotation.y += 0.002;
                    if (this.sunGlow) {
                        const p = 1 + Math.sin(time * 0.6) * 0.04;
                        this.sunGlow.scale.set(p, p, p);
                        this.sunGlow.material.opacity = 0.2 + Math.sin(time * 0.5) * 0.04;
                    }
                    if (this.outerGlow) {

                        this.outerGlow.scale.set(p2, p2, p2);

                grad.addColorStop(0.7, 'rgba(10, 10, 30, 0.3)');
                grad.addColorStop(1, 'rgba(5, 5, 15, 0.9)');
                ctx.fillStyle = grad;

                ctx.fill();

            async chat(messages, options = {}) {
                if (this.isProcessing) {
                    console.warn('⚠️ AI bereits am Verarbeiten');
                    return null;
                }

                // Lokaler Fallback, wenn kein Key da ist
                if (this.useLocalFallback) {
                    return this.localChat(messages);
                }

                this.isProcessing = true;
                EventBus.emit('ai:processing', true);

                try {
                    const fullMessages = [
                        { role: 'system', content: this.systemPrompt || 'Du bist HalDo, eine hilfsbereite KI.' },
                        ...messages
                    ];

                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiKey}`
                        },
                        body: JSON.stringify({
                            model: options.model || this.model,
                            messages: fullMessages,
                            temperature: options.temperature || this.temperature,
                            max_tokens: options.maxTokens || 2000,
                            stream: false
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error?.message || `API-Fehler (${response.status})`);
                    }

                    const data = await response.json();
                    const content = data.choices[0]?.message?.content || 'Entschuldigung, ich habe keine Antwort.';

                    // Memory speichern
                    const memory = Storage.get('ai_memory', []);
                    memory.push({ user: messages[messages.length - 1]?.content || '', assistant: content,
                        time: Date.now() });
                    if (memory.length > 50) memory.shift();
                    Storage.set('ai_memory', memory);

                    this.isProcessing = false;
                    EventBus.emit('ai:processing', false);
                    EventBus.emit('ai:response', { content, messages });

                    return content;

                } catch (error) {
                    console.error('❌ AI Fehler:', error);
                    this.isProcessing = false;
                    EventBus.emit('ai:processing', false);
                    EventBus.emit('ai:error', { error: error.message });
                    // Bei API-Fehler auf Fallback umschalten
                    this.useLocalFallback = true;
                    return this.localChat(messages);
                }
            },

            localChat(messages) {
                const userText = messages[messages.length - 1]?.content?.toLowerCase() || '';
                let reply = this.localKnowledge['default'];

                for (const [key, value] of Object.entries(this.localKnowledge)) {
                    if (userText.includes(key)) {
                        reply = value;
                        break;
                    }
                }

                // Intelligente Fallback-Generierung
                if (reply === this.localKnowledge['default']) {
                    // Versuche, das Thema zu erkennen
                    const topics = ['philosophie', 'geschichte', 'kunst', 'literatur', 'programmierung', 'physik', 'chemie',
                        'biologie', 'mathematik', 'religion', 'ethik', 'medizin', 'psychologie', 'politik', 'wirtschaft'
                    ];
                    let found = false;
                    for (const topic of topics) {
                        if (userText.includes(topic)) {
                            reply =
                                `Ah, du fragst nach ${topic}! Das ist ein faszinierendes Gebiet. Leider habe ich ohne Groq-API nur begrenztes Wissen. Bitte trage deinen API-Key in den Einstellungen ein, damit ich dir eine vollständige und tiefgehende Antwort geben kann. 💙`;
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        reply =
                            `Interessante Frage! Ich würde dir gerne eine detaillierte Antwort geben, aber dafür benötige ich die Groq-API. Bitte trage deinen Key in den Einstellungen (⚙️ → AI & Memory) ein. Bis dahin stehe ich dir mit meinem lokalen Wissen zur Verfügung. Was möchtest du wissen?`;
                    }
                }

                // Memory speichern
                const memory = Storage.get('ai_memory', []);
                memory.push({ user: messages[messages.length - 1]?.content || '', assistant: reply, time: Date.now() });
                if (memory.length > 50) memory.shift();
                Storage.set('ai_memory', memory);

                EventBus.emit('ai:response', { content: reply, messages });
                return reply;
            },

            createWindow(title, icon, content, width = 420, height = 340) {
                const win = document.createElement('div');
                win.className = 'window';
                const w = Math.min(width, window.innerWidth - 40);
                const h = Math.min(height, window.innerHeight - 100);
                win.style.cssText =
                    `left:${20+Math.random()*20}px;top:${15+Math.random()*20}px;width:${w}px;height:${h}px;z-index:${Date.now()%1000+100};`;

                win.innerHTML = `
                    <div class="window-header">
                        <div class="window-title"><span class="icon">${icon}</span><span>${title}</span></div>
                        <div class="window-controls">
                            <button class="btn-minimize" onclick="this.closest('.window').classList.toggle('minimized')">−</button>
                            <button class="btn-maximize" onclick="this.closest('.window').classList.toggle('maximized')">⛶</button>
                            <button class="btn-close" onclick="this.closest('.window').remove(); AppManager.updateTaskbar();">✕</button>
                        </div>
                    </div>
                    <div class="window-body">${content}</div>
                `;

                // Drag
                const header = win.querySelector('.window-header');
                let drag = false,
                    sx, sy, ox, oy;
                header.addEventListener('mousedown', (e) => {
                    if (win.classList.contains('maximized')) return;
                    drag = true;
                    const r = win.getBoundingClientRect();
                    sx = e.clientX;
                    sy = e.clientY;
                    ox = r.left;
                    oy = r.top;
                    win.style.cursor = 'grabbing';
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    win.style.left = (ox + e.clientX - sx) + 'px';
                    win.style.top = (oy + e.clientY - sy) + 'px';
                });
                document.addEventListener('mouseup', () => { if (drag) { drag = false;
                        win.style.cursor = ''; } });

                // Resize
                const resizeHandle = document.createElement('div');
                resizeHandle.style.cssText =
                    'position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;z-index:1000;';
                win.appendChild(resizeHandle);
                let rs = false,
                    rsx, rsy, rsw, rsh;
                resizeHandle.addEventListener('mousedown', (e) => {
                    if (win.classList.contains('maximized')) return;
                    rs = true;
                    rsx = e.clientX;
                    rsy = e.clientY;
                    rsw = win.offsetWidth;
                    rsh = win.offsetHeight;
                    e.preventDefault();
                    e.stopPropagation();
                });
                document.addEventListener('mousemove', (e) => {
                    if (!rs) return;
                    win.style.width = Math.max(200, rsw + e.clientX - rsx) + 'px';
                    win.style.height = Math.max(140, rsh + e.clientY - rsy) + 'px';
                });
                document.addEventListener('mouseup', () => { rs = false; });

                return win;
            },

            getTerminalUI() {
                return `
                    <div style="display:flex;flex-direction:column;height:100%;">
                        <div id="terminal-output" style="flex:1;background:rgba(0,0,0,0.3);border-radius:5px;padding:8px;font-family:monospace;font-size:11px;overflow-y:auto;min-height:80px;color:#00ff88;white-space:pre-wrap;">
                            > HalDo OS Terminal v${Kernel.version}\n> ⚡ Bereit für Befehle
                        </div>
                        <div style="display:flex;gap:4px;margin-top:4px;">
                            <span style="color:var(--text-secondary);font-size:11px;">$</span>
                            <input id="terminal-input" class="haldo-input" placeholder="Befehl..." style="flex:1;font-size:11px;" onkeydown="if(event.key==='Enter')AppManager.runCommand()">
                            <button onclick="AppManager.runCommand()" class="haldo-btn" style="font-size:10px;padding:2px 8px;">⏎</button>

            runCommand() {
                const input = document.getElementById('terminal-input');
                const output = document.getElementById('terminal-output');
                if (!input || !output) return;
                const cmd = input.value.trim();
                if (!cmd) return;
                output.textContent += `\n$ ${cmd}`;
                input.value = '';

                const responses = {
                    help: 'help, version, apps, clear, echo, date, uptime, reboot, shutdown, ai <frage>',
                    version: `HalDo AI OS ${Kernel.version}`,
                    apps: `Apps: ${AppManager.installedApps.length} installiert`,
                    clear: '> Terminal gelöscht',
                    date: new Date().toLocaleString(),
                    uptime: `${Kernel.getUptime()}s`,
                    reboot: 'System wird neu gestartet...',
                    shutdown: 'System wird heruntergefahren...',
                    echo: (args) => args.join(' ')
                };

                const parts = cmd.split(' ');
                const command = parts[0].toLowerCase();
                if (command === 'clear') {
                    output.textContent = '> Terminal gelöscht';
                } else if (command === 'echo') {
                    output.textContent += `\n> ${parts.slice(1).join(' ')}`;
                } else if (command === 'reboot') {
                    output.textContent += '\n> Neustart...';
                    setTimeout(() => Kernel.reboot(), 1000);
                } else if (command === 'shutdown') {
                    output.textContent += '\n> Herunterfahren...';
                    setTimeout(() => Kernel.shutdown(), 1000);
                } else if (command === 'ai') {
                    const question = parts.slice(1).join(' ');
                    if (!question) { output.textContent += '\n> Bitte Frage: ai <frage>'; return; }
                    output.textContent += '\n> 🤖 Frage wird gesendet...';
                    AICore.simpleChat(question).then(reply => {
                        output.textContent += `\n> 💙 ${reply}`;
                        output.scrollTop = output.scrollHeight;
                    });
                } else if (responses[command]) {
                    const result = typeof responses[command] === 'function' ? responses[command](parts.slice(1)) :
                        responses[command];
                    output.textContent += `\n> ${result}`;
                } else {
                    output.textContent += `\n> Unbekannt: ${cmd}`;
                }
                output.scrollTop = output.scrollHeight;
            },

                `;

            browserNavigate() {
                const input = document.getElementById('browser-url');
                const frame = document.getElementById('browser-frame');
                if (!input || !frame) return;
                let url = input.value.trim();
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                try { frame.src = url; } catch { frame.src = 'about:blank'; }
            },

            browserBack() {
                const frame = document.getElementById('browser-frame');
                if (frame && frame.contentWindow) {
                    try { frame.contentWindow.history.back(); } catch {}
                }
            },

            browserForward() {
                const frame = document.getElementById('browser-frame');
                if (frame && frame.contentWindow) {
                    try { frame.contentWindow.history.forward(); } catch {}
                }
            },

            executeAICommand() {
                const input = document.getElementById('command-input');
                if (!input || !input.value.trim()) return;
                const cmd = input.value.trim().toLowerCase();
                input.value = '';

                if (cmd.includes('notizen') || cmd.includes('notes')) {
                    AppManager.openApp('notes');
                } else if (cmd.includes('kalender') || cmd.includes('calendar')) {
                    AppManager.openApp('calendar');
                } else if (cmd.includes('haldo ai') || cmd.includes('ai chat')) {
                    AppManager.openApp('haldo-ai');
                } else if (cmd.includes('systemstatus') || cmd.includes('monitor')) {
                    AppManager.openApp('system-monitor');
                } else if (cmd.includes('einstellungen') || cmd.includes('settings')) {
                    AppManager.openApp('settings');
                } else {
                    alert(`🤖 HalDo: "${cmd}" – Befehl erkannt. Versuche: "Öffne Notizen", "Öffne Kalender", "Öffne HalDo AI"`);

            importAllData(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        Object.keys(data).forEach(key => Storage.set(key, data[key]));
                        alert('✅ Backup wiederhergestellt!');
                        location.reload();
                    } catch (err) {
                        alert('❌ Fehler: ' + err.message);
                    }
                };
                reader.readAsText(file);
            },

                const messages = document.getElementById('ai-chat-messages');
                if (!input || !messages || !input.value.trim()) return;

                const text = input.value.trim();
                input.value = '';

                const userMsg = document.createElement('div');
                userMsg.style.cssText =
                    'text-align:right;margin:3px 0;padding:5px 10px;background:var(--primary);border-radius:6px;color:white;max-width:85%;margin-left:auto;font-size:11px;';
                userMsg.textContent = '🧑 ' + text;
                messages.appendChild(userMsg);

                const loading = document.createElement('div');
                loading.style.cssText =
                    'text-align:left;margin:3px 0;padding:5px 10px;background:var(--glass-bg);border-radius:6px;color:var(--text-secondary);max-width:85%;font-size:11px;';
                loading.textContent = '💭 HalDo denkt...';
                messages.appendChild(loading);
                messages.scrollTop = messages.scrollHeight;

                if (typeof LivingAI !== 'undefined') {
                    LivingAI.setEmotion('thinking');
                }

                AICore.simpleChat(text).then(reply => {
                    loading.remove();
                    const aiMsg = document.createElement('div');
                    aiMsg.style.cssText =
                        'text-align:left;margin:3px 0;padding:5px 10px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:6px;color:var(--text-primary);max-width:85%;font-size:11px;';
                    aiMsg.textContent = '💙 ' + reply;
                    messages.appendChild(aiMsg);
                    messages.scrollTop = messages.scrollHeight;

                    if (typeof LivingAI !== 'undefined') {
                        LivingAI.speak(reply);
                        LivingAI.setEmotion('happy');
                    }

                    if ('speechSynthesis' in window) {
                        const utter = new SpeechSynthesisUtterance(reply);
                        utter.lang = 'de-DE';
                        window.speechSynthesis.speak(utter);
                    }
                });
            },

            toggleVoiceInput() {
                const btn = document.getElementById('ai-voice-btn');
                if (!btn) return;
                if ('webkitSpeechRecognition' in window) {
                    const rec = new webkitSpeechRecognition();
                    rec.lang = 'de-DE';
                    rec.onstart = () => { btn.textContent = '⏹️';
                        btn.style.color = 'var(--success)'; };
                    rec.onend = () => { btn.textContent = '🎤';
                        btn.style.color = ''; };
                    rec.onresult = (e) => {
                        const text = e.results[0][0].transcript;
                        const input = document.getElementById('ai-chat-input');
                        if (input) { input.value = text;
                            AppManager.sendAIMessage(); }
                    };
                    rec.start();
                } else {
                    alert('🎤 Speech Recognition nicht unterstützt.');
                }
            },

            // ===== KATEGORIEN =====
            openCategory(category) {
                const apps = this.apps.filter(a => a.category === category);
                if (apps.length === 0) { alert(`📱 Keine Apps in "${category}"`); return; }
                const content = `
                    <div>
                        <h2 style="color:var(--text-primary);font-size:13px;">📱 ${category.charAt(0).toUpperCase()+category.slice(1)}</h2>
                        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px;margin-top:4px;">
                            ${apps.map(app => `
                                <div onclick="AppManager.openApp('${app.id}')" style="padding:6px;background:var(--glass-bg);border-radius:4px;text-align:center;border:1px solid var(--glass-border);cursor:pointer;font-size:9px;">
                                    <div style="font-size:20px;">${app.icon}</div>
                                    <div style="color:var(--text-secondary);">${app.name}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                const win = this.createWindow(category, '📱', content, 380, 320);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            // ===== INSTALLATION =====
            installApp(appId) {
                if (this.installedApps.includes(appId)) return false;
                this.installedApps.push(appId);
                Storage.set('installed_apps', this.installedApps);
                this.renderDesktopIcons();
                return true;
            },

            installAll() {
                this.apps.forEach(a => {
                    if (!this.installedApps.includes(a.id)) {
                        this.installedApps.push(a.id);
                    }
                });
                Storage.set('installed_apps', this.installedApps);
                this.renderDesktopIcons();
                alert(`✅ ${this.installedApps.length} Apps installiert!`);
            },

            renderDesktopIcons() {
                const container = document.getElementById('desktop-icons');
                if (!container) return;
                const apps = this.apps.filter(a => this.installedApps.includes(a.id));
                container.innerHTML = apps.slice(0, 20).map(app => `
                    <div class="desktop-icon" onclick="AppManager.openApp('${app.id}')" title="${app.desc || app.name}">
                        <div class="icon-img">${app.icon}</div>
                        <div class="icon-label">${app.name}</div>
                    </div>
                `).join('');
            },

            updateTaskbar() {
                const container = document.getElementById('taskbar-apps');
                if (!container) return;
                const windows = document.querySelectorAll('#window-container .window');
                container.innerHTML = '';
                windows.forEach(win => {
                    const title = win.querySelector('.window-title span:last-child')?.textContent || 'App';
                    const btn = document.createElement('button');
                    btn.className = 'taskbar-app-btn';
                    btn.textContent = title;
                    btn.onclick = () => {
                        win.classList.toggle('minimized');
                        this.updateTaskbar();
                    };
                    container.appendChild(btn);
                });
            }
        };
        window.AppManager = AppManager;

        // ============================================================
        //  UHR
        // ============================================================
        function updateClock() {
            const el = document.getElementById('taskbar-time');
            if (el) {
                const now = new Date();
                el.textContent = now.toLocaleTimeString('de', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
        }

        // ============================================================
        //  MAIN START
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 HalDo AI OS 24.6.0 Ultimate startet...');
            Boot.init();
            setTimeout(() => Boot.start(), 400);
        });

        // ============================================================
        //  SERVICE WORKER
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(() => console.log('✅ Service Worker registriert!'))
                    .catch(() => console.log('⚠️ Service Worker Fehler'));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            window.deferredPrompt = e;
            console.log('📱 PWA Installation möglich');
        });

        // ============================================================
        //  OFFLINE-ERKENNUNG
        // ============================================================
        window.addEventListener('online', () => {
            const status = document.getElementById('taskbar-status');
            if (status) { status.textContent = '●';
                status.style.color = 'var(--success)'; }
            const nots = Storage.get('notifications', []);
            nots.push('🌐 Online – Verbindung wiederhergestellt');
            if (nots.length > 20) nots.shift();
            Storage.set('notifications', nots);
        });

        window.addEventListener('offline', () => {
            const status = document.getElementById('taskbar-status');
            if (status) { status.textContent = '📴';
                status.style.color = 'var(--warning)'; }
            const nots = Storage.get('notifications', []);
            nots.push('📴 Offline – Einige Funktionen eingeschränkt');
            if (nots.length > 20) nots.shift();
            Storage.set('notifications', nots);
        });

        // ============================================================
        //  GLOBALE FEHLERBEHANDLUNG
        // ============================================================
        window.onerror = (msg, url, line) => {
            console.error('❌ Fehler:', msg, url, line);
            const logs = Storage.get('logs', []);
            logs.push({ level: 'error', message: `${msg} (${url}:${line})`, time: Date.now() });
            if (logs.length > 100) logs.shift();
            Storage.set('logs', logs);
        };

        console.log('💙❤️🚀 HalDo AI OS 24.6.0 Ultimate – Cosmic Intelligent Operating System');
        console.log('📱 Alle Apps sind bereit!');
        console.log('👤 Living AI Avatar ist aktiv!');
        console.log('🧠 AI Core ULTIMATE geladen – ' + (AICore.hasValidKey() ? 'Groq API aktiv.' : 'Fallback-Modus aktiv.'));
        console.log('🔑 Trag deinen Groq-Key in den Einstellungen (⚙️ → AI & Memory) ein für volle KI-Kraft.');
    </script>

</body>
</html>
