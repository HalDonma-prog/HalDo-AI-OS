                    '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);">' +
                    '<span style="font-size:0.65rem;color:#8899bb;">🌐 Sprache</span>' +
                    '<select id="settings-language" style="padding:4px 8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:4px;color:#fff;font-size:0.65rem;">' +
                    '<option value="de">🇩🇪 Deutsch</option>' +
                    '<option value="en">🇬🇧 English</option>' +
                    '<option value="ku">🇰🇲 Kurmancî</option>' +
                    '<option value="ezidi">𒀭 Êzîdî</option></select></div>' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);">' +
                    '<span style="font-size:0.65rem;color:#8899bb;">🎤 Sprachsteuerung</span>' +
                    '<input type="checkbox" id="settings-voice" checked style="accent-color:#00d4ff;width:16px;height:16px;cursor:pointer;" /></div>' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);">' +
                    '<span style="font-size:0.65rem;color:#8899bb;">🎨 Theme</span>' +
                    '<select id="settings-theme" style="padding:4px 8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:4px;color:#fff;font-size:0.65rem;">' +
                    '<option value="dark">🌙 Dark</option>' +
                    '<option value="light">☀️ Light</option></select></div>' +
                    '<button id="settings-save" class="btn-primary" style="margin-top:4px;">💾 Speichern</button>' +
                    '<div style="font-size:0.45rem;color:#8899bb;border-top:1px solid rgba(255,255,255,0.04);padding-top:6px;margin-top:2px;">HalDo OS ' +
                    CONFIG.version + ' · Build ' + CONFIG.build + ' · ' + Object.keys(state.apps).length +
                    ' Apps</div></div>';

                var saveBtn = body.querySelector('#settings-save');

                function loadSettingsUI() {
                    try {
                        var saved = JSON.parse(localStorage.getItem('haldo_settings'));
                        if (saved) {
                            var lang = body.querySelector('#settings-language');
                            var voice = body.querySelector('#settings-voice');
                            var theme = body.querySelector('#settings-theme');
                            if (lang) lang.value = saved.language || 'de';
                            if (voice) voice.checked = saved.voiceEnabled !== false;
                            if (theme) theme.value = saved.theme || 'dark';
                        }
                    } catch (e) {}
                }

                loadSettingsUI();

                saveBtn.addEventListener('click', function() {
                    var lang = body.querySelector('#settings-language').value;
                    var voice = body.querySelector('#settings-voice').checked;
                    var theme = body.querySelector('#settings-theme').value;

                    state.settings.language = lang;
                    state.settings.voiceEnabled = voice;
                    state.settings.theme = theme;
                    CONFIG.language = lang;

                    try {
                        localStorage.setItem('haldo_settings', JSON.stringify(state.settings));
                    } catch (e) {}

                    if (theme === 'light') {
                        document.documentElement.style.setProperty('--bg-primary', '#f0f2f8');
                        document.documentElement.style.setProperty('--bg-secondary', '#e8ecf4');
                        document.documentElement.style.setProperty('--bg-window', 'rgba(240,242,248,0.94)');
                        document.documentElement.style.setProperty('--text-primary', '#1a1a2e');
                        document.documentElement.style.setProperty('--text-secondary', '#556688');
                        document.documentElement.style.setProperty('--border-color', 'rgba(0,0,0,0.06)');
                    } else {
                        document.documentElement.style.setProperty('--bg-primary', '#0a0a1a');
                        document.documentElement.style.setProperty('--bg-secondary', '#12122a');
                        document.documentElement.style.setProperty('--bg-window', 'rgba(16,16,40,0.94)');
                        document.documentElement.style.setProperty('--text-primary', '#e8eef5');
                        document.documentElement.style.setProperty('--text-secondary', '#8899bb');
                        document.documentElement.style.setProperty('--border-color', 'rgba(255,255,255,0.06)');
                    }

                    Notify.success('✅ Einstellungen gespeichert!');
                    loadSettingsUI();
                });
            }
        });

        // ----- 12. Update Center -----
        registerApp('update', {
            title: 'Update Center',
            icon: '🔄',
            category: 'system',
            description: 'System-Updates',
            render: function(body) {
                body.innerHTML =
                    '<div style="display:flex;flex-direction:column;gap:8px;padding:8px;">' +
                    '<h3 style="font-size:0.8rem;">🔄 Update Center</h3>' +
                    '<div style="background:rgba(255,255,255,0.03);padding:8px;border-radius:6px;">' +
                    '<div style="font-size:0.65rem;color:#8899bb;">Aktuelle Version</div>' +
                    '<div style="font-size:0.8rem;font-weight:600;">HalDo OS ' + CONFIG.version + '</div>' +
                    '<div style="font-size:0.55rem;color:#556688;">Build ' + CONFIG.build + '</div></div>' +
                    '<div style="background:rgba(255,255,255,0.03);padding:8px;border-radius:6px;">' +
                    '<div style="font-size:0.65rem;color:#8899bb;">Status</div>' +
                    '<div style="font-size:0.7rem;color:#44ff88;">✅ System ist aktuell</div></div>' +
                    '<button onclick="Notify.info(\'🔍 Suche nach Updates...\')" class="btn-primary">🔍 Nach Updates suchen</button>' +
                    '<div style="font-size:0.4rem;color:#556688;border-top:1px solid rgba(255,255,255,0.04);padding-top:6px;">Zuletzt geprüft: ' +
                    new Date().toLocaleString('de-DE') + '</div></div>';
            }
        });

        // ============================================================
        //  SYSTEM INIT
        // ============================================================

        function updateClock() {
            var now = new Date();
            DOM.clock.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            state.system.uptime = Math.floor((now() - state.system.started) / 1000);
        }

        function initDock() {
            var items = DOM.dock.querySelectorAll('.dock-item');
            for (var i = 0; i < items.length; i++) {
                (function(btn) {
                    btn.addEventListener('click', function() {
                        var app = btn.dataset.app;
                        if (app) launchApp(app);
                    });
                })(items[i]);
            }
        }

        function initMenus() {
            var menuMap = {
                'menu-apps': 'appworld',
                'menu-ai': 'ai',
                'menu-fahrschule': 'fahrschule',
                'menu-system': 'settings',
                'menu-update': 'update'
            };
            for (var id in menuMap) {
                var el = document.getElementById(id);
                if (el) {
                    (function(appId) {
                        el.addEventListener('click', function() { launchApp(appId); });
                    })(menuMap[id]);
                }
            }

            document.getElementById('menu-help').addEventListener('click', function() {
                Notify.info(
                    '❓ **HalDo Hilfe**\n\n📱 Apps:\n• "Öffne Fahrschule" 🚗\n• "Öffne Notizen" 📝\n• "Öffne E-Mail" 📧\n\n⌨️ Shortcuts:\n• Cmd+K → AI\n• Escape → Fenster schließen\n\n☀️ Klicke auf die Sonne!'
                    );
            });
        }

        function bootSequence() {
            var steps = [
                { text: '⟡ Kernel v' + CONFIG.kernel + ' wird geladen ...', progress: 8 },
                { text: '⟡ System initialisiert ...', progress: 20 },
                { text: '⟡ Cosmic World startet ...', progress: 35 },
                { text: '⟡ HalDo AI wird aktiviert ...', progress: 50 },
                { text: '⟡ ' + Object.keys(state.apps).length + ' Apps geladen ...', progress: 68 },
                { text: '⟡ Living AI wird gestartet ...', progress: 80 },
                { text: '⟡ System-Update wird geprüft ...', progress: 90 },
                { text: '⟡ HalDo OS ' + CONFIG.version + ' ist READY 🚀', progress: 100 }
            ];

            var i = 0;
            DOM.bootStatus.textContent = steps[0].text;
            DOM.bootProgress.style.width = '2%';
            DOM.bootProgressText.textContent = '2%';

            var interval = setInterval(function() {
                i++;
                if (i < steps.length) {
                    DOM.bootStatus.textContent = steps[i].text;
                    DOM.bootProgress.style.width = steps[i].progress + '%';
                    DOM.bootProgressText.textContent = steps[i].progress + '%';
                } else {
                    clearInterval(interval);
                    setTimeout(function() {
                        DOM.boot.classList.add('hidden');
                        state.isBooted = true;
                        state.isReady = true;
                        Notify.success('🚀 HalDo OS ' + CONFIG.version + ' gestartet!');
                        if (state.settings.autoStartAI !== false) {
                            setTimeout(function() { launchApp('ai'); }, 500);
                        }
                        setTimeout(function() { launchApp('cosmic'); }, 900);
                        setTimeout(function() { launchApp('avatar'); }, 1200);
                        console.log('✅ HalDo OS ' + CONFIG.version + ' — ULTIMATE EDITION');
                        console.log('📱 ' + Object.keys(state.apps).length + ' Apps geladen');
                        console.log('👤 Living AI aktiviert');
                    }, 400);
                }
            }, 350);
        }

        function loadSettings() {
            try {
                var saved = JSON.parse(localStorage.getItem('haldo_settings'));
                if (saved) {
                    for (var key in saved) {
                        if (state.settings.hasOwnProperty(key)) {
                            state.settings[key] = saved[key];
                        }
                    }
                    CONFIG.language = state.settings.language || 'de';
                }
            } catch (e) {}
        }

        function loadData() {
            try {
                var notes = localStorage.getItem('haldo_notes');
                if (notes) state.notes = JSON.parse(notes);
                var contacts = localStorage.getItem('haldo_contacts');
                if (contacts) state.contacts = JSON.parse(contacts);
                var tasks = localStorage.getItem('haldo_tasks');
                if (tasks) state.tasks = JSON.parse(tasks);
                var emails = localStorage.getItem('haldo_emails');
                if (emails) state.emails = JSON.parse(emails);
                var conv = localStorage.getItem('haldo_conversations');
                if (conv) {
                    var parsed = JSON.parse(conv);
                    if (Array.isArray(parsed)) AI.conversationHistory = parsed;
                }
            } catch (e) { console.log('[Storage] Fehler', e); }
        }

        // ============================================================
        //  GLOBAL EXPOSURE
        // ============================================================
        window.HalDo = {
            CONFIG: CONFIG,
            state: state,
            AI: AI,
            Voice: Voice,
            Notify: Notify,
            launchApp: launchApp,
            closeWindow: closeWindow,
            minimizeWindow: minimizeWindow,
            maximizeWindow: maximizeWindow,
            WindowManager: WindowManager,
            get apps() { return state.apps; },
            get windows() { return state.windows; },
            version: CONFIG.version,
            booted: function() { return state.isBooted; },
            resetData: function() {
                if (confirm('Alle Daten löschen?')) {
                    localStorage.clear();
                    location.reload();
                }
            },
            updateAvatar: function(status) {
                state.avatar.status = status;
                var el = document.getElementById('avatar-status');
                if (el) {
                    var texts = { 'idle': '● Bereit', 'listening': '🎤 Hört zu...', 'thinking': '🧠 Denkt...',
                        'speaking': '🗣️ Spricht...' };
                    el.textContent = texts[status] || '● Bereit';
                    el.className = 'avatar-status ' + status;
                }
                var eyes = document.querySelectorAll('.eye');
                eyes.forEach(function(eye) { eye.className = 'eye ' + status; });
                var mouth = document.querySelector('.mouth');
                if (mouth) mouth.className = 'mouth' + (status === 'speaking' ? ' speaking' : '');
            }
        };

        window.notify = Notify.show;

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                launchApp('ai');
            }
            if (e.key === 'Escape' && state.activeWindow) {
                closeWindow(state.activeWindow);
            }
        });

        // ============================================================
        //  MAIN INIT
        // ============================================================

        function init() {
            console.log('⟡ HalDo OS ' + CONFIG.version + ' — ULTIMATE EDITION');
            console.log('📱 ' + Object.keys(state.apps).length + ' Apps registriert');
            console.log('👤 Living AI integriert');

            loadSettings();
            loadData();

            Voice.init();
            initCosmic();
            updateClock();
            setInterval(updateClock, 10000);
            initDock();
            initMenus();

            document.getElementById('btn-about').addEventListener('click', function() {
                Notify.show(
                    '⟡ **HalDo OS ' + CONFIG.version + '**\n' +
                    '💙❤️🚀 ' + Object.keys(state.apps).length + ' Apps\n' +
                    '✅ Groq AI verbunden\n' +
                    '👤 Living AI aktiv\n' +
                    '🚗 Fahrschule integriert\n' +
                    '📝 Notizen & Tasks lokal\n' +
                    '📧 E-Mail System\n' +
                    '🔧 Build: ' + CONFIG.build + '\n' +
                    '⏱️ Uptime: ' + Math.floor((now() - state.system.started) / 1000) + 's',
                    'info'
                );
            });

            bootSequence();
            console.log('✅ System bereit!');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
