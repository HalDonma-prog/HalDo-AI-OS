<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050816"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="HalDo AI OS"
>

<meta
    name="description"
    content="HalDo AI OS — Cosmic AI Operating System"
>

<title>
    HalDo AI OS
</title>

<style>

* {
    box-sizing:
        border-box;
}

html,
body {

    width:
        100%;

    height:
        100%;

    margin:
        0;

    padding:
        0;

    overflow:
        hidden;

    background:
        #02030a;

    color:
        #ffffff;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    -webkit-font-smoothing:
        antialiased;

    text-rendering:
        optimizeLegibility;
}

button,
input,
textarea,
select {

    font:
        inherit;
}

button {

    border:
        0;

    outline:
        none;

    cursor:
        pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {

    outline:
        2px solid
        rgba(255,255,255,.75);

    outline-offset:
        3px;
}

/* =========================================================
   MASTER DISPLAY
   ========================================================= */

#haldo-os {

    position:
        fixed;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(35,73,150,.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 20% 20%,
            rgba(70,110,255,.08),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(150,70,255,.07),
            transparent 32%
        ),

        #02030a;
}

/* =========================================================
   COSMIC BACKGROUND
   ========================================================= */

.haldo-cosmic-world {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;

    isolation:
        isolate;

    background:

        radial-gradient(
            circle at center,
            rgba(15,30,75,.28),
            transparent 42%
        );
}

/* =========================================================
   DEEP SPACE
   ========================================================= */

.haldo-space {

    position:
        absolute;

    inset:
        0;

    pointer-events:
        none;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.025),
            transparent 52%
        );
}

/* =========================================================
   STARS
   ========================================================= */

.haldo-stars {

    position:
        absolute;

    inset:
        0;

    pointer-events:
        none;

    overflow:
        hidden;
}

.haldo-star {

    position:
        absolute;

    display:
        block;

    width:
        2px;

    height:
        2px;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.95);

    box-shadow:
        0 0 5px
        rgba(255,255,255,.9);

    animation:
        haldo-star-twinkle
        4s
        ease-in-out
        infinite;
}

@keyframes haldo-star-twinkle {

    0%,
    100% {

        opacity:
            .25;

        transform:
            scale(.75);
    }

    50% {

        opacity:
            1;

        transform:
            scale(1.5);
    }
}

/* =========================================================
   COSMIC CENTER
   ========================================================= */

.haldo-cosmic-center {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        min(
            88vw,
            900px
        );

    height:
        min(
            88vw,
            900px
        );

    transform:
        translate(
            -50%,
            -50%
        );

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    pointer-events:
        none;
}

/* =========================================================
   ORBIT SYSTEM
   ========================================================= */

.haldo-orbit-system {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        100%;

    height:
        100%;

    transform:
        translate(
            -50%,
            -50%
        );

    pointer-events:
        none;
}

.haldo-orbit {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    border:
        1px solid
        rgba(120,175,255,.15);

    border-radius:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

    box-shadow:
        0 0 12px
        rgba(70,150,255,.05);

    animation:
        haldo-orbit-pulse
        7s
        ease-in-out
        infinite;
}

@keyframes haldo-orbit-pulse {

    0%,
    100% {

        opacity:
            .45;
    }

    50% {

        opacity:
            .85;
    }
}

/* =========================================================
   ORBIT GLOW
   ========================================================= */

.haldo-orbit::before {

    content:
        "";

    position:
        absolute;

    inset:
        -2px;

    border:
        1px solid
        rgba(120,190,255,.08);

    border-radius:
        50%;

    filter:
        blur(2px);
}

/* =========================================================
   PLANET
   ========================================================= */

.haldo-planet {

    position:
        absolute;

    left:
        50%;

    top:
        -7px;

    width:
        14px;

    height:
        14px;

    margin:
        0;

    border-radius:
        50%;

    transform:
        translateX(
            -50%
        );

    pointer-events:
        auto;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffff,
            #8fc8ff 28%,
            #3263bd 62%,
            #0d1c43 100%
        );

    box-shadow:
        0 0 10px
        rgba(80,170,255,.8);

    animation:
        haldo-planet-glow
        3s
        ease-in-out
        infinite;
}

@keyframes haldo-planet-glow {

    0%,
    100% {

        box-shadow:
            0 0 8px
            rgba(80,170,255,.55);
    }

    50% {

        box-shadow:
            0 0 18px
            rgba(120,200,255,.95);
    }
}

/* =========================================================
   EARTH
   ========================================================= */

.haldo-planet-earth {

    background:

        radial-gradient(
            circle at 35% 30%,
            #dff8ff,
            #4ca9ff 20%,
            #1267bd 48%,
            #06325e 70%,
            #020a18 100%
        );

    box-shadow:
        0 0 14px
        rgba(50,160,255,.95);
}

/* =========================================================
   MOON
   ========================================================= */

.haldo-moon-orbit {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        34px;

    height:
        34px;

    transform:
        translate(
            -50%,
            -50%
        );

    border:
        1px dashed
        rgba(255,255,255,.12);

    border-radius:
        50%;

    animation:
        haldo-moon-orbit
        4s
        linear
        infinite;
}

.haldo-moon {

    position:
        absolute;

    left:
        50%;

    top:
        -3px;

    width:
        6px;

    height:
        6px;

    transform:
        translateX(
            -50%
        );

    border-radius:
        50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ffffff,
            #aeb8c7 55%,
            #525a68 100%
        );

    box-shadow:
        0 0 7px
        rgba(255,255,255,.7);
}

@keyframes haldo-moon-orbit {

    from {

        transform:
            translate(
                -50%,
                -50%
            )
            rotate(
                0deg
            );
    }

    to {

        transform:
            translate(
                -50%,
                -50%
            )
            rotate(
                360deg
            );
    }
}

/* =========================================================
   SUN
   ========================================================= */

.haldo-sun-container {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        clamp(
            190px,
            24vw,
            310px
        );

    height:
        clamp(
            190px,
            24vw,
            310px
        );

    transform:
        translate(
            -50%,
            -50%
        );

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    z-index:
        20;

    pointer-events:
        auto;
}

/* =========================================================
   SOLAR AURA
   ========================================================= */

.haldo-solar-aura {

    position:
        absolute;

    inset:
        -25%;

    border-radius:
        50%;

    background:

        radial-gradient(
            circle,
            rgba(255,240,130,.28),
            rgba(255,174,35,.13) 38%,
            rgba(255,100,30,.05) 58%,
            transparent 72%
        );

    filter:
        blur(18px);

    animation:
        haldo-solar-breathe
        5s
        ease-in-out
        infinite;

    pointer-events:
        none;
}

@keyframes haldo-solar-breathe {

    0%,
    100% {

        transform:
            scale(.94);

        opacity:
            .72;
    }

    50% {

        transform:
            scale(1.08);

        opacity:
            1;
    }
}

/* =========================================================
   SOLAR RAYS
   ========================================================= */

.haldo-solar-rays {

    position:
        absolute;

    inset:
        -42%;

    border-radius:
        50%;

    background:

        repeating-conic-gradient(
            from 0deg,
            rgba(255,246,180,.0) 0deg,
            rgba(255,246,180,.0) .75deg,
            rgba(255,224,94,.72) 1deg,
            rgba(255,160,35,.12) 2deg,
            rgba(255,246,180,.0) 3deg,
            rgba(255,246,180,.0) 5deg
        );

    filter:
        blur(1px);

    animation:
        haldo-solar-rays
        26s
        linear
        infinite;

    pointer-events:
        none;
}

@keyframes haldo-solar-rays {

    from {

        transform:
            rotate(
                0deg
            );
    }

    to {

        transform:
            rotate(
                360deg
            );
    }
}

/* =========================================================
   SUN BUTTON
   ========================================================= */

.haldo-sun-button {

    position:
        relative;

    width:
        100%;

    height:
        100%;

    border-radius:
        50%;

    background:
        transparent;

    z-index:
        5;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    pointer-events:
        auto;
}

/* =========================================================
   SUN CORE
   ========================================================= */

.haldo-sun-core {

    position:
        absolute;

    width:
        66%;

    height:
        66%;

    border-radius:
        50%;

    background:

        radial-gradient(
            circle at 38% 32%,
            #fffde2 0%,
            #fff7a0 14%,
            #ffd54b 35%,
            #ff9f1c 62%,
            #e85b16 84%,
            #7b1c0d 100%
        );

    box-shadow:

        0 0 25px
        rgba(255,220,70,.95),

        0 0 70px
        rgba(255,165,40,.72),

        0 0 130px
        rgba(255,100,20,.38);

    animation:
        haldo-sun-breathe
        4s
        ease-in-out
        infinite;
}

@keyframes haldo-sun-breathe {

    0%,
    100% {

        transform:
            scale(.98);
    }

    50% {

        transform:
            scale(1.035);
    }
}

/* =========================================================
   HALDO AI AVATAR
   ========================================================= */

.haldo-avatar {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        56%;

    height:
        56%;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index:
        30;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    pointer-events:
        auto;

    border-radius:
        50%;
}

/* =========================================================
   AVATAR AURA
   ========================================================= */

.haldo-avatar-aura {

    position:
        absolute;

    inset:
        -16%;

    border-radius:
        50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.24),
            rgba(255,220,100,.16) 35%,
            rgba(100,190,255,.09) 55%,
            transparent 75%
        );

    filter:
        blur(9px);

    animation:
        haldo-avatar-aura
        4s
        ease-in-out
        infinite;
}

@keyframes haldo-avatar-aura {

    0%,
    100% {

        opacity:
            .65;

        transform:
            scale(.95);
    }

    50% {

        opacity:
            1;

        transform:
            scale(1.08);
    }
}

/* =========================================================
   USER LOGO
   ========================================================= */

.haldo-avatar-logo {

    position:
        relative;

    z-index:
        4;

    width:
        76%;

    height:
        76%;

    object-fit:
        contain;

    object-position:
        center;

    user-select:
        none;

    -webkit-user-drag:
        none;

    filter:

        drop-shadow(
            0 0 8px
            rgba(255,255,255,.85)
        )

        drop-shadow(
            0 0 22px
            rgba(255,205,70,.72)
        );

    animation:
        haldo-avatar-float
        4.8s
        ease-in-out
        infinite;
}

@keyframes haldo-avatar-float {

    0%,
    100% {

        transform:
            translateY(
                0
            )
            scale(
                1
            );
    }

    50% {

        transform:
            translateY(
                -5px
            )
            scale(
                1.025
            );
    }
}

/* =========================================================
   AVATAR STATES
   ========================================================= */

.haldo-avatar[data-state="listening"]
.haldo-avatar-logo {

    animation:
        haldo-avatar-listening
        1.8s
        ease-in-out
        infinite;
}

.haldo-avatar[data-state="thinking"]
.haldo-avatar-logo {

    animation:
        haldo-avatar-thinking
        2.4s
        ease-in-out
        infinite;
}

.haldo-avatar[data-state="speaking"]
.haldo-avatar-logo {

    animation:
        haldo-avatar-speaking
        .42s
        ease-in-out
        infinite;
}

.haldo-avatar[data-state="happy"]
.haldo-avatar-logo {

    animation:
        haldo-avatar-happy
        1.2s
        ease-in-out
        infinite;
}

.haldo-avatar[data-state="app-selecting"]
.haldo-avatar-logo {

    animation:
        haldo-avatar-selecting
        1.4s
        ease-in-out
        infinite;
}

.haldo-avatar[data-state="app-opening"]
.haldo-avatar-logo {

    animation:
        haldo-avatar-opening
        1s
        ease-out
        infinite;
}

@keyframes haldo-avatar-listening {

    0%,
    100% {

        transform:
            scale(1);
    }

    50% {

        transform:
            scale(1.07);
    }
}

@keyframes haldo-avatar-thinking {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {

        transform:
            translateY(-4px)
            rotate(2deg);
    }
}

@keyframes haldo-avatar-speaking {

    0%,
    100% {

        transform:
            scaleY(1);
    }

    50% {

        transform:
            scaleY(1.035);
    }
}

@keyframes haldo-avatar-happy {

    0%,
    100% {

        transform:
            scale(1)
            rotate(0deg);
    }

    50% {

        transform:
            scale(1.08)
            rotate(-2deg);
    }
}

@keyframes haldo-avatar-selecting {

    0%,
    100% {

        transform:
            translateX(0);
    }

    50% {

        transform:
            translateX(7px);
    }
}

@keyframes haldo-avatar-opening {

    0% {

        transform:
            scale(.92);

        opacity:
            .7;
    }

    50% {

        transform:
            scale(1.08);

        opacity:
            1;
    }

    100% {

        transform:
            scale(1);
    }
}

/* =========================================================
   RESPONSIVE DISPLAY
   ========================================================= */

@media (
    max-width:
    700px
) {

    .haldo-cosmic-center {

        width:
            96vw;

        height:
            96vw;
    }

    .haldo-orbit-system {

        transform:
            translate(
                -50%,
                -50%
            )
            scale(.72);
    }

    .haldo-sun-container {

        width:
            190px;

        height:
            190px;
    }

}

@media (
    min-width:
    701px
) and (
    max-width:
    1200px
) {

    .haldo-orbit-system {

        transform:
            translate(
                -50%,
                -50%
            )
            scale(.88);
    }
}

@media (
    min-width:
    1600px
) {

    .haldo-cosmic-center {

        width:
            980px;

        height:
            980px;
    }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (
    prefers-reduced-motion:
    reduce
) {

    *,
    *::before,
    *::after {

        animation-duration:
            .001ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;
    }
}

</style>

</head>

<body>

<div
    id="haldo-os"
    data-haldo-os="true"
>

    <main
        class="haldo-cosmic-world"
        data-haldo-cosmic
        aria-label="HalDo AI OS Cosmic World"
    >

        <div
            class="haldo-space"
            aria-hidden="true"
        ></div>

        <div
            class="haldo-stars"
            aria-hidden="true"
        ></div>

        <section
            class="haldo-cosmic-center"
            aria-label="HalDo Cosmic Center"
        >

            <div
                class="haldo-orbit-system"
                aria-hidden="true"
            >

                <div
                    class="haldo-orbit"
                    style="
                        width: 190px;
                        height: 190px;
                    "
                >
                    <button
                        class="haldo-planet"
                        type="button"
                        aria-label="Planet"
                    ></button>
                </div>

                <div
                    class="haldo-orbit"
                    style="
                        width: 270px;
                        height: 270px;
                    "
                >
                    <button
                        class="haldo-planet"
                        type="button"
                        aria-label="Planet"
                    ></button>
                </div>

                <div
                    class="haldo-orbit"
                    style="
                        width: 350px;
                        height: 350px;
                    "
                >
                    <button
                        class="haldo-planet haldo-planet-earth"
                        type="button"
                        aria-label="Erde"
                    >
                        <span
                            class="haldo-moon-orbit"
                        >
                            <span
                                class="haldo-moon"
                            ></span>
                        </span>
                    </button>
                </div>

            </div>

            <div
                class="haldo-sun-container"
            >

                <div
                    class="haldo-solar-aura"
                    aria-hidden="true"
                ></div>

                <div
                    class="haldo-solar-rays"
                    aria-hidden="true"
                ></div>

                <button
                    class="haldo-sun-button"
                    id="haldo-sun-button"
                    type="button"
                    aria-label="HalDo AI öffnen"
                >

                    <span
                        class="haldo-sun-core"
                    ></span>

                    <span
                        class="haldo-avatar"
                        id="haldo-avatar"
                        data-state="idle"
                    >

                        <span
                            class="haldo-avatar-aura"
                        ></span>

                        <img
                            class="haldo-avatar-logo"
                            src="assets/logo/logo.png"
                            alt="HalDo AI"
                        >

                    </span>

                </button>

            </div>

        </section>

    </main>

</div>

<script>

"use strict";

/* =========================================================
   HALDO MASTER FOUNDATION
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.OS =
    window.HalDo.OS ||
    {};

window.HalDo.OS.version =
    "22.0.0";

window.HalDo.OS.build =
    "COSMIC-MASTER";

window.HalDo.state =
    window.HalDo.state ||
    {

        booted:
            false,

        avatar:
            "idle",

        language:
            "de",

        activeApp:
            null,

        activeWindow:
            null,

        ai:
            {

                listening:
                    false,

                thinking:
                    false,

                speaking:
                    false

            }

    };

/* =========================================================
   EVENT BUS
   ========================================================= */

window.HalDo.events =
    window.HalDo.events ||
    new EventTarget();

window.HalDo.emit =
    function (
        name,
        detail = {}
    ) {

        window.HalDo.events.dispatchEvent(
            new CustomEvent(
                name,
                {
                    detail
                }
            )
        );

    };

window.HalDo.on =
    function (
        name,
        callback
    ) {

        if (
            typeof callback !==
            "function"
        ) {
            return;
        }

        window.HalDo.events.addEventListener(
            name,
            callback
        );

    };

/* =========================================================
   AVATAR CONTROLLER
   ========================================================= */

window.HalDo.Avatar =
{

    element:
        null,

    init()
    {

        this.element =
            document.getElementById(
                "haldo-avatar"
            );

        if (
            !this.element
        ) {
            return;
        }

        this.setState(
            "idle"
        );

    },

    setState(
        state
    )
    {

        if (
            !this.element
        ) {
            return;
        }

        this.element.dataset.state =
            state;

        window.HalDo.state.avatar =
            state;

        window.HalDo.emit(
            "avatar:state",
            {
                state
            }
        );

    },

    idle()
    {
        this.setState(
            "idle"
        );
    },

    listening()
    {
        this.setState(
            "listening"
        );
    },

    thinking()
    {
        this.setState(
            "thinking"
        );
    },

    speaking()
    {
        this.setState(
            "speaking"
        );
    },

    happy()
    {
        this.setState(
            "happy"
        );
    },

    selectingApp()
    {
        this.setState(
            "app-selecting"
        );

<script>

/* =========================================================

    {};

    window.HalDo.Windows ||
    {

        windows:
            new Map(),

        counter:
            0,

        active:
            null,

        create(
            options = {}
        )
        {

            const id =
                options.id ||
                (
                    "haldo-window-" +
                    (++this.counter)
                );

            const windowElement =
                document.createElement(
                    "section"
                );

            windowElement.className =
                "haldo-window";

            if (
                options.className
            ) {

                windowElement.classList.add(
                    options.className
                );

            windowElement.dataset.windowId =

                );

            header.className =

                document.createElement(

                );

            logo.className =

            logo.alt =

            const subtitle =

                    "div"
                );

            titleArea.appendChild(
                subtitle
            );

            const controls =
                document.createElement(
                    "div"

            controls.className =
                "haldo-window-controls";

            const minimize =
                this.createControl(
                    "−",
                    "Minimieren",
                    () =>
                        this.minimize(
                            id
                        )
                );

            const maximize =
                this.createControl(
                    "□",
                    "Maximieren",
                    () =>
                        this.maximize(
                            id
                        )
                );

            const close =
                this.createControl(
                    "×",
                    "Schließen",
                    () =>
                        this.close(
                            id
                        ),
                    true
                );

            controls.appendChild(
                minimize
            );

            controls.appendChild(
                maximize
            );

            controls.appendChild(
                close
            );

            header.appendChild(
                logo
            );

            header.appendChild(
                titleArea
            );

            header.appendChild(
                controls
            );

            const body =
                document.createElement(
                    "div"
                );

            body.className =
                "haldo-window-body";

            windowElement.appendChild(
                header
            );

            windowElement.appendChild(
                body

            const layer =
                document.getElementById(
                    "haldo-window-layer"

            if (

            }

            layer.appendChild(

                    minimized:

                id;

                "window:created",
                record

        },

        createControl(
            text,
            label,
            handler,
            close = false
        )
        {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "haldo-window-control";

                    "close"

                text;

            id

        {

            return this.windows.get(
                id

        },

        focus(
            id

        {

            const record =
                this.get(
                    id
                );

            if (
                !record ||
                record.closed
            ) {
                return;
            }

            this.active =
                id;

            window.HalDo.state.activeWindow =
                id;

            window.HalDo.emit(
                "window:focus",
                record
            );
        },

        minimize(
            id
        )
        {

            const record =
                this.get(
                    id
                );

            if (
                !record ||
                record.closed
            ) {
                return;
            }

            record.minimized =
                !record.minimized;

            record.element.style.display =
                record.minimized
                    ? "none"
                    : "";

            window.HalDo.emit(
                "window:minimized",
                record
            );
        },

        maximize(
            id
        )
        {

            const record =
                this.get(
                    id
                );

            if (
                !record ||
                record.closed
            ) {
                return;
            }

            record.maximized =
                !record.maximized;

            record.element.classList.toggle(
                "is-maximized",
                record.maximized
            );

            if (
                record.maximized
            ) {

                record.element.style.width =
                    "100%";

                record.element.style.height =
                    "100%";

                record.element.style.maxWidth =
                    "none";

                record.element.style.maxHeight =
                    "none";

            else {

                record.element.style.width =
                    "";

                record.element.style.height =
                    "";

                record.element.style.maxWidth =
                    "";

                record.element.style.maxHeight =
                    "";

                "window:maximized",
                record

    addMessage(

        const message =

        if (

            const avatar =

            avatar.className =
                "haldo-message-avatar";

            avatar.src =

        const bubble =

            "haldo-message-bubble";

        bubble.textContent =

            bubble
        );

        this.messagesElement.appendChild(

        this.messagesElement.scrollTop =

    addAIMessage(
        text
    )
    {

        this.messages.push(
            {

                role:
                    "assistant",

                content:
                    text

        this.addMessage(
            text,
            "ai"
        );

    addUserMessage(
        text
    )
    {

        this.messages.push(

        this.addMessage(

    async send(
        text
    )
    {

        const message =
            String(
                text ||
                ""
            ).trim();

        if (
            !message
        ) {
            return;
        }

        if (
            this.input
        ) {

            this.input.value =
                "";

            this.input.style.height =
                "auto";
        }

        this.addUserMessage(
            message
        );

        this.setStatus(
            "HalDo AI denkt …"
        );

        window.HalDo.Avatar.thinking();

        const thinking =
            document.createElement(
                "div"
            );

        thinking.className =
            "haldo-message ai";

        const avatar =
            document.createElement(
                "img"
            );

        avatar.className =
            "haldo-message-avatar";

        avatar.src =
            "assets/logo/logo.png";

        avatar.alt =
            "HalDo AI";

        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "haldo-message-bubble";

        const dots =
            document.createElement(
                "span"
            );

        dots.className =
            "haldo-thinking";

        dots.innerHTML =
            "<span></span><span></span><span></span>";

        bubble.appendChild(

        );

        thinking.appendChild(

        thinking.appendChild(

        );

        this.messagesElement.scrollTop =

        let response;

        try {

            response =

                );

        catch (

        ) {

            console.error(
                "[HalDo AI]",
                error
            );

            response =

        }

        thinking.remove();

        this.addAIMessage(
            response
        );

        this.setStatus(
            "HalDo AI ist bereit"
        );

        window.HalDo.Avatar.speaking();

        window.HalDo.emit(

                input:

    async requestAI(
        message
    )
    {

        /*
         * Zentrale Bridge.
         *
         * Wenn ein echter AI-Core vorhanden ist,
         * wird er automatisch bevorzugt.
         */

        if (
            window.HalDo.AICore &&
            typeof
            window.HalDo.AICore.respond ===
            "function"
        ) {

            const result =
                await
                window.HalDo.AICore.respond(
                    {

                        message,

                        conversation:
                            this.messages

                    }
                );

            if (
                typeof result ===
                "string"
            ) {

                return result;
            }

            if (
                result &&
                typeof result.text ===
                "string"
            ) {

                return result.text;
            }
        }

        if (
            window.HalDo.AI &&
            typeof
            window.HalDo.AI.respond ===
            "function"
        ) {

            const result =
                await
                window.HalDo.AI.respond(
                    message,
                    this.messages
                );

            if (
                typeof result ===
                "string"
            ) {

                return result;
            }

            if (
                result &&
                typeof result.text ===
                "string"
            ) {

                return result.text;
            }
        }

        return this.localResponse(
            message
        );

    localResponse(
        message
    )
    {

        const text =
            message.toLowerCase();

        if (
            text.includes(
                "hallo"
            ) ||
            text.includes(
                "hi "
            ) ||
            text ===
            "hi"
        ) {

            return "Hallo! Schön, dass du da bist. Ich bin HalDo AI und bereit, mit dir zu sprechen, Fragen zu beantworten oder dir bei deinem System zu helfen.";
        }

        if (
            text.includes(
                "was kannst du"
            )
        ) {

            return "Ich kann dich beim Arbeiten mit HalDo AI OS unterstützen, Fragen beantworten, Texte erstellen, Informationen erklären und später direkt mit deinen Apps, Fenstern, Dateien, Sprache und Systemeinstellungen zusammenarbeiten.";
        }

        if (
            text.includes(
                "apps"
            ) ||
            text.includes(
                "app"
            )
        ) {

            return "Ich kann dich durch das App-System führen. Die zentrale App-Architektur wird mit Registry, Runtime, Manager, Router und Window Manager verbunden, damit Apps tatsächlich geöffnet und gesteuert werden können.";
        }

        if (
            text.includes(
                "systemstatus"
            ) ||
            text.includes(
                "system status"
            )
        ) {

            return "HalDo AI OS läuft in der aktuellen Master-Oberfläche. Die zentrale Systemarchitektur ist für die Verbindung von AI, Apps, Fenstern, Speicher und weiteren Diensten vorbereitet.";
        }

        return "Ich habe deine Nachricht verstanden. Mein zentraler AI-Core wird diese Antwortschicht später mit echter intelligenter Verarbeitung, Memory, Sprache, Kontext und deinen HalDo-Systemdiensten verbinden.";
    },

    setStatus(
        text
    )
    {

        if (
            this.statusElement
        ) {

            this.statusElement.textContent =
                text;
        }
    },

    toggleVoice()
    {

        if (
            !(
                "webkitSpeechRecognition" in
                window
            ) &&
            !(
                "SpeechRecognition" in
                window
            )
        ) {

            this.setStatus(
                "Spracheingabe wird von diesem Gerät/Browser nicht unterstützt."
            );

            return;
        }

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        const recognition =
            new Recognition();

        recognition.lang =
            window.HalDo.state.language ===
            "de"
                ? "de-DE"
                : window.HalDo.state.language;

        recognition.interimResults =
            false;

        recognition.continuous =
            false;

        if (
            this.voiceButton
        ) {

            this.voiceButton.classList.add(
                "is-active"
            );
        }

        this.setStatus(
            "HalDo AI hört zu …"
        );

        window.HalDo.Avatar.listening();

        recognition.onresult =
            event => {

                const transcript =
                    event.results[0][0].transcript;

                if (
                    this.input
                ) {

                    this.input.value =
                        transcript;
                }

                this.send(
                    transcript
                );
            };

        recognition.onerror =
            error => {

                console.error(
                    "[HalDo Voice]",
                    error
                );

                this.setStatus(
                    "Spracheingabe konnte nicht verarbeitet werden."
                );

                window.HalDo.Avatar.idle();
            };

        recognition.onend =
            () => {

                    this.voiceButton

                    window.HalDo.state.avatar ===
                    "listening"

    speak(
        text
    )
    {

        if (
            !(
                "speechSynthesis" in
                window
            )
        ) {
            return;
        }

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                text
            );

        utterance.lang =
            window.HalDo.state.language ===
            "de"
                ? "de-DE"
                : window.HalDo.state.language;

        utterance.rate =
            .98;

        utterance.pitch =
            1.02;

        utterance.volume =
            .85;

        utterance.onstart =
            () => {

                window.HalDo.Avatar.speaking();

                window.HalDo.emit(
                    "ai:speaking"
                );
            };

        utterance.onend =
            () => {

                window.HalDo.Avatar.idle();

                window.HalDo.emit(
                    "ai:idle"
                );
            };

        window.speechSynthesis.speak(
            utterance
        );
    }

};

   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            const active =
                window.HalDo.Windows.active;

            if (
                active
            ) {

                window.HalDo.Windows.close(
                    active
                );
            }

        if (
            (
                event.ctrlKey ||
                event.metaKey
            ) &&
            event.key.toLowerCase() ===
            "k"
        ) {

            event.preventDefault();

            window.HalDo.openAIChat();
        }

    }

<script>

"use strict";

/* =========================================================
   COSMIC WORLD ENGINE
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.Cosmic =
{

    stage:
        null,

    system:
        null,

    sun:
        null,

    stars:
        null,

    initialized:
        false,

    init()
    {

        if (
            this.initialized
        ) {
            return;
        }

        this.stage =
            document.getElementById(
                "haldo-cosmic-stage"
            );

        this.system =
            document.getElementById(
                "haldo-cosmic-system"
            );

        this.sun =
            document.getElementById(
                "haldo-sun-core"
            );

        this.stars =
            document.getElementById(
                "haldo-stars"
            );

        if (
            !this.stage ||
            !this.system ||
            !this.sun
        ) {
            return;
        }

        this.createStars();

        this.createRays();

        this.bindSun();

        this.bindPlanets();

        this.initialized =
            true;

        window.HalDo.emit(
            "cosmic:ready",
            {
                system:
                    this.system
            }
        );
    },

    createStars()
    {

        if (
            !this.stars
        ) {
            return;
        }

        const fragment =
            document.createDocumentFragment();

        const count =
            Math.min(
                180,
                Math.max(
                    70,
                    Math.floor(
                        window.innerWidth *
                        window.innerHeight /
                        12000
                    )
                )
            );

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const star =
                document.createElement(
                    "span"
                );

            star.className =
                "haldo-star";

            star.style.left =
                Math.random() *
                100 +
                "%";

            star.style.top =
                Math.random() *
                100 +
                "%";

            star.style.setProperty(
                "--star-size",
                (
                    Math.random() *
                    2.4 +
                    0.6
                ) +
                "px"
            );

            star.style.setProperty(
                "--star-opacity",
                (
                    Math.random() *
                    .65 +
                    .2
                )
            );

            star.style.setProperty(
                "--star-duration",
                (
                    Math.random() *
                    4 +
                    2
                ) +
                "s"
            );

            star.style.setProperty(
                "--star-delay",
                (
                    Math.random() *
                    5
                ) +
                "s"
            );

            fragment.appendChild(
                star
            );
        }

        this.stars.replaceChildren(
            fragment
        );
    },

    createRays()
    {

        const rays =
            document.getElementById(
                "haldo-sun-rays"
            );

        if (
            !rays
        ) {
            return;
        }

        const fragment =
            document.createDocumentFragment();

        const total =
            365;

        for (
            let i = 0;
            i < total;
            i++
        ) {

            const ray =
                document.createElement(
                    "span"
                );

            ray.className =
                "haldo-sun-ray";

            ray.style.setProperty(
                "--ray-angle",
                (
                    i *
                    (
                        360 /
                        total
                    )
                ) +
                "deg"
            );

            ray.style.setProperty(
                "--ray-scale",
                (
                    .76 +
                    Math.random() *
                    .48
                )
            );

            ray.style.setProperty(
                "--ray-opacity",
                (
                    .18 +
                    Math.random() *
                    .42
                )
            );

            fragment.appendChild(
                ray
            );
        }

        rays.replaceChildren(
            fragment
        );
    },

    bindSun()
    {

        this.sun.addEventListener(
            "click",
            event => {

                event.preventDefault();

                event.stopPropagation();

                this.sun.classList.add(
                    "is-active"
                );

                window.HalDo.Avatar
                    .react(
                        "sun-click"
                    );

                window.HalDo.openAIChat();

                setTimeout(
                    () => {

                        this.sun.classList.remove(
                            "is-active"
                        );

                    },
                    500
                );

            }
        );
    },

    bindPlanets()
    {

        const planets =
            this.system.querySelectorAll(
                ".haldo-planet[data-planet]"
            );

        planets.forEach(
            planet => {

                planet.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        const name =
                            planet.dataset.planet;

                        window.HalDo.emit(
                            "planet:selected",
                            {
                                planet:
                                    name
                            }
                        );

                    }
                );

            }
        );
    },

    resize()
    {

        if (
            !this.system
        ) {
            return;
        }

        const width =
            window.innerWidth;

        if (
            width <=
            430
        ) {

            this.system.style.setProperty(
                "--cosmic-scale",
                ".88"
            );

        }

        else if (
            width <=
            700
        ) {

            this.system.style.setProperty(
                "--cosmic-scale",
                ".94"
            );

        }

        else {

            this.system.style.setProperty(
                "--cosmic-scale",
                "1"
            );
        }
    }

};

/* =========================================================
   RESPONSIVE RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        window.HalDo.Cosmic.resize();

    },
    {
        passive:
            true
    }
);

/* =========================================================
   START COSMIC WORLD
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            window.HalDo.Cosmic.init();

            window.HalDo.Cosmic.resize();

        },
        {
            once:
                true
        }
    );

}

else {

    window.HalDo.Cosmic.init();

    window.HalDo.Cosmic.resize();
}

</script>

<script>

"use strict";

/* =========================================================
   HALDO AI AVATAR ENGINE
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.Avatar =
{

    layer:
        null,

    element:
        null,

    logo:
        null,

    state:
        "idle",

    initialized:
        false,

    init()
    {

        if (
            this.initialized
        ) {
            return;
        }

        this.layer =
            document.getElementById(
                "haldo-ai-avatar-layer"
            );

        this.element =
            document.getElementById(
                "haldo-ai-avatar"
            );

        this.logo =
            document.getElementById(
                "haldo-ai-avatar-logo"
            );

        if (
            !this.element ||
            !this.logo
        ) {
            return;
        }

        this.initialized =
            true;

        this.listen();

        this.setState(
            "idle"
        );

        window.HalDo.emit(
            "avatar:ready",
            {
                avatar:
                    this.element
            }
        );
    },

    listen()
    {

        if (
            typeof window.HalDo.on !==
            "function"
        ) {
            return;
        }

        window.HalDo.on(
            "ai:listening",
            () => {

                this.setState(
                    "listening"
                );

            }
        );

        window.HalDo.on(
            "ai:thinking",
            () => {

                this.setState(
                    "thinking"
                );

            }
        );

        window.HalDo.on(
            "ai:speaking",
            () => {

                this.setState(
                    "speaking"
                );

            }
        );

        window.HalDo.on(
            "ai:idle",
            () => {

                this.setState(
                    "idle"
                );

            }
        );

        window.HalDo.on(
            "app:selecting",
            () => {

                this.setState(
                    "app-selecting"
                );

            }
        );

        window.HalDo.on(
            "app:opening",
            () => {

                this.setState(
                    "app-opening"
                );

            }
        );

        window.HalDo.on(
            "ai:happy",
            () => {

                this.setState(
                    "happy"
                );

            }
        );
    },

    setState(
        state
    )
    {

        if (
            !this.element
        ) {
            return;
        }

        const classes = [
            "is-visible",
            "greeting",
            "listening",
            "thinking",
            "speaking",
            "happy",
            "app-selecting",
            "app-opening",
            "point-left",
            "point-right"
        ];

        classes.forEach(
            className => {

                this.element.classList.remove(
                    className
                );

            }
        );

        this.state =
            state;

        this.element.classList.add(
            "is-visible"
        );

        if (
            state &&
            state !==
            "idle"
        ) {

            this.element.classList.add(
                state
            );
        }
    },

    react(
        action
    )
    {

        if (
            !this.element
        ) {
            return;
        }

        switch (
            action
        ) {

            case "sun-click":

                this.setState(
                    "happy"
                );

                this.showFor(
                    2600
                );

                break;

            case "greeting":

                this.setState(
                    "greeting"
                );

                this.showFor(
                    3000
                );

                break;

            case "point-left":

                this.setState(
                    "point-left"
                );

                break;

            case "point-right":

                this.setState(
                    "point-right"
                );

                break;

            case "app":

                this.setState(
                    "app-opening"
                );

                this.showFor(
                    1800
                );

                break;

            default:

                this.setState(
                    "idle"
                );
        }
    },

    showFor(
        milliseconds
    )
    {

        this.element.classList.add(
            "is-visible"
        );

        window.clearTimeout(
            this._hideTimer
        );

        this._hideTimer =
            window.setTimeout(
                () => {

                    if (
                        this.state ===
                        "idle"
                    ) {
                        return;
                    }

                    this.setState(
                        "idle"
                    );

                },
                milliseconds
            );
    }
};


/* =========================================================
   INITIALIZATION
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            window.HalDo.Avatar.init();

        },
        {
            once:
                true
        }
    );

}

else {

    window.HalDo.Avatar.init();

}

</script>

<script>

"use strict";

/* =========================================================
   UNIVERSAL WINDOW MANAGER
   ========================================================= */

window.HalDo =
    window.HalDo ||
    {};

window.HalDo.Windows =
{

    layer:
        null,

    windows:
        new Map(),

    zIndex:
        210,

    counter:
        0,

    initialized:
        false,

    init()
    {

        if (
            this.initialized
        ) {
            return;
        }

        this.layer =
            document.getElementById(
                "haldo-window-layer"
            );

        if (
            !this.layer
        ) {
            return;
        }

        this.initialized =
            true;

        this.emitReady();
    },

    emitReady()
    {

        if (
            typeof window.HalDo.emit ===
            "function"
        ) {

            window.HalDo.emit(
                "windows:ready",
                {
                    manager:
                        this
                }
            );
        }
    },

    create(
        options = {}
    )
    {

        if (
            !this.layer
        ) {
            this.init();
        }

        const id =
            options.id ||
            (
                "haldo-window-" +
                (
                    ++this.counter
                )
            );

        if (
            this.windows.has(id)
        ) {

            const existing =
                this.windows.get(id);

            this.focus(
                existing
            );

            return existing;
        }

        const windowElement =
            document.createElement(
                "section"
            );

        windowElement.className =
            "haldo-window";

        windowElement.dataset.windowId =
            id;

        windowElement.innerHTML = `

            <header
                class="haldo-window-titlebar"
            >

                <img
                    class="haldo-window-icon"
                    src="${
                        options.icon ||
                        "assets/logo/logo.png"
                    }"
                    alt=""
                >

                <div
                    class="haldo-window-title"
                >
                    ${
                        this.escape(
                            options.title ||
                            "HalDo App"
                        )
                    }
                </div>

                <div
                    class="haldo-window-controls"
                >

                    <button
                        type="button"
                        class="haldo-window-control minimize"
                        aria-label="Minimieren"
                    >
                        −
                    </button>

                    <button
                        type="button"
                        class="haldo-window-control maximize"
                        aria-label="Maximieren"
                    >
                        □
                    </button>

                    <button
                        type="button"
                        class="haldo-window-control close"
                        aria-label="Schließen"
                    >
                        ×
                    </button>

                </div>

            </header>

            <div
                class="haldo-window-body"
            ></div>
        `;

        const body =
            windowElement.querySelector(
                ".haldo-window-body"
            );

        if (
            typeof options.content ===
            "string"
        ) {

            body.innerHTML =
                options.content;

        }

        else if (
            options.content instanceof
            HTMLElement
        ) {

            body.appendChild(
                options.content
            );

        }

        else {

            body.innerHTML =
                `
                <div
                    class="haldo-app-content"
                >
                    <h1
                        class="haldo-app-heading"
                    >
                        ${
                            this.escape(
                                options.title ||
                                "HalDo App"
                            )
                        }
                    </h1>

                    <p
                        class="haldo-app-description"
                    >
                        HalDo AI App
                    </p>
                </div>
                `;
        }

        this.layer.appendChild(
            windowElement
        );

        const record =
        {
            id:
                id,

            element:
                windowElement,

            body:
                body,

            options:
                options,

            minimized:
                false,

            maximized:
                false
        };

        this.windows.set(
            id,
            record
        );

        this.bind(
            record
        );

        this.position(
            record
        );

        this.open(
            record
        );

        return record;
    },

    bind(
        record
    )
    {

        const element =
            record.element;

        const titlebar =
            element.querySelector(
                ".haldo-window-titlebar"
            );

        const minimize =
            element.querySelector(
                ".minimize"
            );

        const maximize =
            element.querySelector(
                ".maximize"
            );

        const close =
            element.querySelector(
                ".close"
            );

        minimize.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                this.minimize(
                    record
                );
            }
        );

        maximize.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                this.toggleMaximize(
                    record
                );
            }
        );

        close.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                this.close(
                    record
                );
            }
        );

        element.addEventListener(
            "pointerdown",
            () => {

                this.focus(
                    record
                );

            }
        );

        this.makeDraggable(
            record,
            titlebar
        );
    },

    open(
        record
    )
    {

        if (
            !record
        ) {
            return;
        }

        record.element.classList.remove(
            "is-closing"
        );

        requestAnimationFrame(
            () => {

                record.element.classList.add(
                    "is-open"
                );

            }
        );

        this.focus(
            record
        );

        if (
            typeof window.HalDo.emit ===
            "function"
        ) {

            window.HalDo.emit(
                "window:opened",
                record
            );
        }
    },

    close(
        record
    )
    {

        if (
            !record
        ) {
            return;
        }

        record.element.classList.add(
            "is-closing"
        );

        record.element.classList.remove(
            "is-open"
        );

        setTimeout(
            () => {

                record.element.remove();

                this.windows.delete(
                    record.id
                );

                if (
                    typeof window.HalDo.emit ===
                    "function"
                ) {

                    window.HalDo.emit(
                        "window:closed",
                        {
                            id:
                                record.id
                        }
                    );
                }

            },
            280
        );
    },

    minimize(
        record
    )
    {

        if (
            !record
        ) {
            return;
        }

        record.minimized =
            !record.minimized;

        record.element.classList.toggle(
            "is-minimized",
            record.minimized
        );

        if (
            record.minimized
        ) {

            this.focus(
                record
            );
        }
    },

    toggleMaximize(
        record
    )
    {

        if (
            !record
        ) {
            return;
        }

        record.maximized =
            !record.maximized;

        record.element.classList.toggle(
            "is-maximized",
            record.maximized
        );

        if (
            record.maximized
        ) {

            record.element.classList.remove(
                "is-minimized"
            );

            record.minimized =
                false;
        }

        this.focus(
            record
        );
    },

    focus(
        record
    )
    {

        if (
            !record ||
            !record.element
        ) {
            return;
        }

        this.zIndex++;

        record.element.style.zIndex =
            String(
                this.zIndex
            );
    },

    position(
        record
    )
    {

        if (
            !record ||
            record.maximized
        ) {
            return;
        }

        const offset =
            (
                this.windows.size -
                1
            ) *
            18;

        record.element.style.left =
            `calc(50% + ${offset}px)`;

        record.element.style.top =
            `calc(50% + ${offset}px)`;
    },

    makeDraggable(
        record,
        titlebar
    )
    {

        if (
            !titlebar
        ) {
            return;
        }

        let dragging =
            false;

        let startX =
            0;

        let startY =
            0;

        let startLeft =
            0;

        let startTop =
            0;

        titlebar.addEventListener(
            "pointerdown",
            event => {

                if (
                    record.maximized
                ) {
                    return;
                }

                if (
                    event.target.closest(
                        ".haldo-window-controls"
                    )
                ) {
                    return;
                }

                dragging =
                    true;

                titlebar.setPointerCapture(
                    event.pointerId
                );

                const rect =
                    record.element.getBoundingClientRect();

                startX =
                    event.clientX;

                startY =
                    event.clientY;

                startLeft =
                    rect.left;

                startTop =
                    rect.top;

                record.element.style.transform =
                    "none";

                record.element.style.left =
                    startLeft +
                    "px";

                record.element.style.top =
                    startTop +
                    "px";
            }
        );

        titlebar.addEventListener(
            "pointermove",
            event => {

                if (
                    !dragging
                ) {
                    return;
                }

                const x =
                    startLeft +
                    (
                        event.clientX -
                        startX
                    );

                const y =
                    startTop +
                    (
                        event.clientY -
                        startY
                    );

                record.element.style.left =
                    x +
                    "px";

                record.element.style.top =
                    y +
                    "px";
            }
        );

        titlebar.addEventListener(
            "pointerup",
            event => {

                dragging =
                    false;

                try {

                    titlebar.releasePointerCapture(
                        event.pointerId
                    );

                }

                catch (
                    error
                ) {}
            }
        );
    },

    get(
        id
    )
    {

        return this.windows.get(
            id
        ) ||
        null;
    },

    closeAll()
    {

        [
            ...this.windows.values()
        ]
        .forEach(
            record => {

                this.close(
                    record
                );
            }
        );
    },

    escape(
        value
    )
    {

        return String(
            value
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
    }
};

window.HalDo.openAIChat =
function()
{

    if (
        window.HalDo.Windows
    ) {

        const existing =
            window.HalDo.Windows.get(
                "haldo-ai-chat"
            );

        if (
            existing
        ) {

            window.HalDo.Windows.open(
                existing
            );

            return existing;
        }
    }

    const content = `

        <div
            class="haldo-chat-window"
        >

            <div
                class="haldo-chat-messages"
                id="haldo-chat-messages"
            >

                <div
                    class="haldo-chat-message ai"
                >

                    <div
                        class="haldo-chat-bubble"
                    >
                        Hallo. Ich bin HalDo AI.
                        Wie kann ich dir helfen?
                    </div>

                </div>

            </div>

            <div
                class="haldo-chat-inputbar"
            >

                <textarea
                    class="haldo-chat-input"
                    id="haldo-chat-input"
                    placeholder="Schreibe HalDo AI..."
                    rows="1"
                ></textarea>

                <button
                    type="button"
                    class="haldo-chat-send"
                    id="haldo-chat-send"
                    aria-label="Senden"
                >
                    ➤
                </button>

            </div>

        </div>
    `;

    const record =
        window.HalDo.openWindow(
        {
            id:
                "haldo-ai-chat",

            title:
                "HalDo AI",

            icon:
                "assets/logo/logo.png",

            content:
                content
        }
    );

    setTimeout(
        () => {

            window.HalDo.bindChatWindow(
                record
            );

        },
        0
    );

    return record;
};


/* =========================================================
   CHAT CONNECTION
   ========================================================= */

window.HalDo.bindChatWindow =
function(
    record
)
{

    if (
        !record
    ) {
        return;
    }

    const input =
        record.body.querySelector(
            "#haldo-chat-input"
        );

    const send =
        record.body.querySelector(
            "#haldo-chat-send"
        );

    const messages =
        record.body.querySelector(
            "#haldo-chat-messages"
        );

    if (
        !input ||
        !send ||
        !messages
    ) {
        return;
    }

    const addMessage =
    (
        text,
        type
    ) => {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "haldo-chat-message " +
            type;

        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "haldo-chat-bubble";

        bubble.textContent =
            text;

        row.appendChild(
            bubble
        );

        messages.appendChild(
            row
        );

        messages.scrollTop =
            messages.scrollHeight;
    };

    const sendMessage =
    () => {

        const text =
            input.value.trim();

        if (
            !text
        ) {
            return;
        }

        addMessage(
            text,
            "user"
        );

        input.value =
            "";

        window.HalDo.Avatar?.setState(
            "thinking"
        );

        /*
         * Wenn das vorhandene AI-Core-System
         * eine Chat-Funktion anbietet,
         * wird sie hier bevorzugt verwendet.
         */

        let handled =
            false;

        try {

            if (
                window.HalDo.AI &&
                typeof window.HalDo.AI.chat ===
                "function"
            ) {

                handled =
                    true;

                Promise.resolve(
                    window.HalDo.AI.chat(
                        text
                    )
                )
                .then(
                    response => {

                        const answer =
                            typeof response ===
                            "string"
                                ? response
                                : (
                                    response?.text ||
                                    response?.answer ||
                                    "Ich bin bereit."
                                );

                        addMessage(
                            answer,
                            "ai"
                        );

                        window.HalDo.Avatar?.setState(
                            "speaking"
                        );

                    }
                )
                .catch(
                    error => {

                        console.error(
                            "[HalDo AI Chat]",
                            error
                        );

                        addMessage(
                            "Ich konnte die Anfrage gerade nicht verarbeiten.",
                            "ai"
                        );

                        window.HalDo.Avatar?.setState(
                            "idle"
                        );
                    }
                );
            }

        }

        catch (
            error
        ) {

            console.error(
                "[HalDo AI Chat]",
                error
            );
        }

        if (
            !handled
        ) {

            setTimeout(
                () => {

                    addMessage(
                        "HalDo AI ist bereit. Die Verbindung zum zentralen AI-Core wird mit der vorhandenen Systemarchitektur verwendet.",
                        "ai"
                    );

                    window.HalDo.Avatar?.setState(
                        "idle"
                    );

                },
                450
            );
        }
    };

    send.addEventListener(
        "click",
        sendMessage
    );

    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );
};


/* =========================================================

if (

    "loading"
) {

        },

            once:
                true
        }
    );

}

else {

    window.HalDo.Windows.init();

}
