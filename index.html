<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
    <meta name="theme-color" content="#0a0a1a" />
    <title>HalDo AI OS 24.6.0 Ultimate</title>
    <!-- Three.js für Cosmic World -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0a0a1a;
            color: #fff;
            user-select: none;
        }
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --secondary: #00D4FF;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(20px);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.35);
            --taskbar-height: 48px;
            --menu-top-height: 40px;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== BOOT ===== */
        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
            flex-direction: column;
            gap: 15px;
        }
        #boot-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .boot-logo {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(108, 60, 225, 0.3);
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 100px rgba(108, 60, 225, 0.6);
            }
        }
        .boot-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .boot-status {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .boot-progress {
            width: 240px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .boot-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }

        /* ===== DESKTOP ===== */
        #desktop {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #0a0a1a;
        }
        #cosmic-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        #cosmic-canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #living-ai-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            z-index: 10;
            pointer-events: none;
            border-radius: 50%;
            overflow: hidden;
            background: radial-gradient(circle, rgba(108, 60, 225, 0.15), transparent 70%);
            display: none;
        }

        /* ===== TOP MENU ===== */
        #top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--menu-top-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            z-index: 90;
        }
        .menu-left {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            flex: 1;
        }
        .menu-left::-webkit-scrollbar {
            height: 0;
        }
        .menu-item {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: transparent;
            white-space: nowrap;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .menu-item.active {
            background: var(--primary);
            color: #fff;
        }
        .menu-right {
            display: flex;
            gap: 4px;
        }
        .menu-right .menu-item {
            font-size: 9px;
            padding: 2px 6px;
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--taskbar-height);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 6px;
            z-index: 100;
            gap: 6px;
        }
        #taskbar-logo {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            object-fit: contain;
        }
        #taskbar-time {
            font-size: 11px;
            color: var(--text-secondary);
            min-width: 50px;
        }
        .taskbar-center {
            flex: 1;
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }
        .taskbar-center::-webkit-scrollbar {
            height: 0;
        }
        .taskbar-app-btn {
            padding: 2px 8px;
            height: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-radius: 5px;
            color: var(--text-secondary);
            font-size: 9px;
            cursor: pointer;
            white-space: nowrap;
        }
        .taskbar-app-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--glass-border);
        }
        .taskbar-right {
            display: flex;
            gap: 4px;
        }
        .taskbar-right .tb-icon {
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 4px;
        }
        .taskbar-right .tb-icon:hover {
            color: #fff;
        }

        /* ===== WINDOWS ===== */
        #window-container {
            position: fixed;
            top: var(--menu-top-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--menu-top-height) - var(--taskbar-height));
            z-index: 10;
            pointer-events: none;
            padding: 6px;
        }
        .window {
            position: absolute;
            min-width: 240px;
            min-height: 160px;
            max-width: 94vw;
            max-height: 88vh;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            box-shadow: var(--glass-shadow);
            pointer-events: all;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: windowOpen 0.18s ease;
        }
        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .window.minimized {
            transform: scale(0.8) translateY(30px);
            opacity: 0;
            pointer-events: none;
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid var(--glass-border);
            cursor: grab;
            min-height: 28px;
            flex-shrink: 0;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-title {
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .window-controls {
            display: flex;
            gap: 4px;
        }
        .window-controls button {
            width: 10px;
            height: 10px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 6px;
            line-height: 10px;
            text-align: center;
            color: transparent;
        }
        .window-controls .btn-close {
            background: #FF5F57;
        }
        .window-controls .btn-minimize {
            background: #FFBD2E;
        }
        .window-controls .btn-maximize {
            background: #28C840;
        }
        .window-body {
            flex: 1;
            padding: 8px;
            overflow: auto;
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-secondary);
        }
        .window-body h2 {
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 6px;
        }

        /* ===== DESKTOP ICONS ===== */
        #desktop-icons {
            position: fixed;
            top: calc(var(--menu-top-height) + 8px);
            left: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 60px);
            gap: 6px;
            z-index: 1;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 68px;
            padding: 4px;
            border-radius: 10px;
            background: var(--glass-bg);
            border: 1px solid transparent;
            cursor: pointer;
            text-align: center;
            gap: 2px;
            backdrop-filter: var(--glass-blur);
            transition: 0.15s;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
            transform: translateY(-2px);
        }
        .desktop-icon .icon-img {
            font-size: 22px;
        }
        .desktop-icon .icon-label {
            font-size: 9px;
            color: var(--text-secondary);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
            max-width: 54px;
            word-wrap: break-word;
        }

        /* ===== AI FLOATING BUTTON ===== */
        #ai-floating-btn {
            position: fixed;
            bottom: 64px;
            right: 12px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 30px rgba(108, 60, 225, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            border: none;
        }
        #ai-floating-btn:hover {
            transform: scale(1.05);
        }
        #ai-floating-btn img {
            width: 22px;
            height: 22px;
            filter: brightness(0) invert(1);
            object-fit: contain;
        }

        /* ===== FORM ===== */
        .haldo-input {
            width: 100%;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            font-size: 11px;
            outline: none;
        }
        .haldo-input:focus {
            border-color: var(--primary);
        }
        .haldo-btn {
            padding: 4px 12px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }
        .haldo-btn:hover {
            background: var(--primary-light);
        }
        .haldo-btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            :root {
                --taskbar-height: 40px;
                --menu-top-height: 34px;
            }
            .menu-item {
                font-size: 9px;
                padding: 2px 6px;
            }
            .boot-title {
                font-size: 20px;
            }
            .window {
                min-width: 75vw;
                min-height: 30vh;
            }
            .desktop-icon {
                width: 48px;
                height: 54px;
            }
            .desktop-icon .icon-img {
                font-size: 18px;
            }
            .desktop-icon .icon-label {
                font-size: 8px;
            }
        }
        @media (max-width: 480px) {
            .window {
                min-width: 90vw;
                min-height: 40vh;
            }
        }
    </style>
</head>

<body>

    <!-- ===== BOOT SCREEN ===== -->
    <div id="boot-screen">
        <div class="boot-logo">☀</div>
        <div class="boot-title">HalDo AI OS</div>
        <div class="boot-status" id="boot-status">Initializing Cosmic Core...</div>
        <div class="boot-progress"><div class="boot-progress-bar" id="boot-progress"></div></div>
    </div>

    <!-- ===== DESKTOP ===== -->
    <div id="desktop">
        <div id="cosmic-canvas-container">
            <div id="living-ai-container"></div>
        </div>
        <div id="desktop-icons"></div>
        <div id="window-container"></div>

        <!-- TOP MENU -->
        <div id="top-menu">
            <div class="menu-left" id="menu-left">
                <button class="menu-item active" data-menu="apps">📱 Apps</button>
                <button class="menu-item" data-menu="system">⚙️ System</button>
                <button class="menu-item" data-menu="tools">🔧 Tools</button>
                <button class="menu-item" data-menu="media">🎬 Medien</button>
                <button class="menu-item" data-menu="settings">⚙️ Einstellungen</button>
            </div>
            <div class="menu-right">
                <button class="menu-item" id="menu-theme">🌙</button>
                <button class="menu-item" id="menu-voice">👩</button>
                <button class="menu-item" id="menu-lang">DE</button>
                <button class="menu-item" id="menu-status">●</button>
            </div>
        </div>

        <!-- TASKBAR -->
        <div id="taskbar">
            <div class="taskbar-left">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%236C3CE1'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E☀%3C/text%3E%3C/svg%3E" id="taskbar-logo" alt="logo" />
                <span id="taskbar-time">00:00:00</span>
            </div>
            <div class="taskbar-center" id="taskbar-apps"></div>
            <div class="taskbar-right">
                <button class="tb-icon" id="tb-notifications">🔔</button>
                <button class="tb-icon" id="tb-status">●</button>
            </div>
        </div>

        <!-- AI BUTTON -->
        <button id="ai-floating-btn"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%236C3CE1'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E☀%3C/text%3E%3C/svg%3E" alt="AI" /></button>
    </div>

    <script>
        // ============================================================
        //  STORAGE (localStorage)
        // ============================================================
        const Storage = {
            prefix: 'haldo_',
            get(key, fallback = null) {
                try {
                    const d = localStorage.getItem(this.prefix + key);
                    return d ? JSON.parse(d) : fallback;
                } catch { return fallback; }
            },
            set(key, value) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); return true; } catch { return false; }
            },
            remove(key) { localStorage.removeItem(this.prefix + key); },
            clear() {
                Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
            }
        };
        window.Storage = Storage;

        // ============================================================
        //  EVENT BUS
        // ============================================================
        class EventBus {
            constructor() { this.events = {}; }
            on(event, fn) { if (!this.events[event]) this.events[event] = [];
                this.events[event].push(fn); }
            emit(event, data) { if (this.events[event]) this.events[event].forEach(fn => fn(data)); }
        }
        const bus = new EventBus();

        // ============================================================
        //  KERNEL
        // ============================================================
        const Kernel = {
            version: '24.6.0',
            name: 'HalDo AI OS',
            uptime: 0,
            init() {
                this.uptime = Date.now();
                console.log(`🔧 ${this.name} ${this.version} gestartet`);
                return this;
            },
            getUptime() { return Math.floor((Date.now() - this.uptime) / 1000); }
        };

        // ============================================================
        //  BOOT
        // ============================================================
        const Boot = {
            statusEl: document.getElementById('boot-status'),
            progressBar: document.getElementById('boot-progress'),
            async start() {
                const steps = [
                    'Cosmic Core initializing...',
                    'Loading Storage...',
                    'Loading AI Engine...',
                    'Loading Applications...',
                    'Loading Cosmic World...',
                    'System Ready 🚀'
                ];
                for (let i = 0; i < steps.length; i++) {
                    this.statusEl.textContent = steps[i];
                    this.progressBar.style.width = ((i + 1) / steps.length * 100) + '%';
                    await new Promise(r => setTimeout(r, 300));
                    if (i === 2) AICore.init();
                    if (i === 3) AppManager.init();
                    if (i === 4) CosmicWorld.init();
                }
                document.getElementById('boot-screen').classList.add('hidden');
                document.getElementById('desktop').style.display = 'block';
                document.getElementById('ai-floating-btn').style.display = 'flex';
                document.getElementById('living-ai-container').style.display = 'block';
                setTimeout(() => LivingAI.init('living-ai-container'), 300);
                this.setupUI();
                bus.emit('system:ready');
            },
            setupUI() {
                // Menu
                document.querySelectorAll('.menu-item[data-menu]').forEach(el => {
                    el.addEventListener('click', function() {
                        document.querySelectorAll('.menu-item[data-menu]').forEach(e => e.classList.remove(
                        'active'));
                        this.classList.add('active');
                        AppManager.openCategory(this.dataset.menu);
                    });
                });
                // Theme
                document.getElementById('menu-theme').addEventListener('click', () => {
                    const themes = ['dark', 'light', 'cosmic', 'aurora', 'midnight'];
                    const current = document.documentElement.getAttribute('data-theme') || 'dark';
                    const next = themes[(themes.indexOf(current) + 1) % themes.length];
                    document.documentElement.setAttribute('data-theme', next);
                    const icons = { dark: '🌙', light: '☀️', cosmic: '🌌', aurora: '🌠', midnight: '🌃' };
                    document.getElementById('menu-theme').textContent = icons[next] || '🌙';
                    Storage.set('theme', next);
                });
                // Voice
                document.getElementById('menu-voice').addEventListener('click', () => {
                    const voices = ['👩', '👨', '🧑', '👧', '👦'];
                    const current = document.getElementById('menu-voice').textContent;
                    const idx = voices.indexOf(current);
                    const next = voices[(idx + 1) % voices.length];
                    document.getElementById('menu-voice').textContent = next;
                    Storage.set('voice_gender', next);
                });
                // Language
                document.getElementById('menu-lang').addEventListener('click', () => {
                    const langs = ['DE', 'EN', 'KU', 'EZ', 'TR', 'AR', 'FR', 'ES', 'RU', 'FA', 'IT', 'PT'];
                    const current = document.getElementById('menu-lang').textContent;
                    const idx = langs.indexOf(current);
                    const next = langs[(idx + 1) % langs.length];
                    document.getElementById('menu-lang').textContent = next;
                    Storage.set('language', next);
                });
                // Status
                document.getElementById('menu-status').addEventListener('click', () => AppManager.openApp('system-monitor'));
                // Taskbar logo
                document.getElementById('taskbar-logo').addEventListener('click', () => AppManager.openApp('app-center'));
                // Notifications
                document.getElementById('tb-notifications').addEventListener('click', () => {
                    const nots = Storage.get('notifications', []);
                    alert(nots.length ? '🔔 Benachrichtigungen:\n' + nots.join('\n') : '🔔 Keine Benachrichtigungen');
                });
                document.getElementById('tb-status').addEventListener('click', () => alert(
                    `✅ ${Kernel.name} ${Kernel.version}\nUptime: ${Kernel.getUptime()}s\nApps: ${AppManager.apps.length}`));
                // AI Button
                document.getElementById('ai-floating-btn').addEventListener('click', () => AppManager.openApp('haldo-ai'));
                // Clock
                setInterval(() => {
                    const el = document.getElementById('taskbar-time');
                    if (el) el.textContent = new Date().toLocaleTimeString('de', { hour: '2-digit', minute: '2-digit',
                        second: '2-digit' });
                }, 1000);
                // Load saved settings
                const savedTheme = Storage.get('theme', 'dark');
                document.documentElement.setAttribute('data-theme', savedTheme);
                const themeIcons = { dark: '🌙', light: '☀️', cosmic: '🌌', aurora: '🌠', midnight: '🌃' };
                document.getElementById('menu-theme').textContent = themeIcons[savedTheme] || '🌙';
                document.getElementById('menu-voice').textContent = Storage.get('voice_gender', '👩');
                document.getElementById('menu-lang').textContent = Storage.get('language', 'DE');
            }
        };

        // ============================================================
        //  COSMIC WORLD (3D)
        // ============================================================
        const CosmicWorld = {
            isReady: false,
            init() {
                console.log('🌌 Cosmic World init');
                const container = document.getElementById('cosmic-canvas-container');
                if (!container) return;
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a0a1a);
                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 16, 40);
                camera.lookAt(0, 0, 0);
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                // Licht
                const light = new THREE.PointLight(0xffaa33, 2, 150);
                light.position.set(0, 0, 0);
                scene.add(light);
                scene.add(new THREE.AmbientLight(0x222244, 0.5));

                // Sonne
                const sunGeo = new THREE.SphereGeometry(2.8, 64, 64);
                const sunMat = new THREE.MeshStandardMaterial({ color: 0xff8800, emissive: 0xff4400, emissiveIntensity: 1 });
                const sun = new THREE.Mesh(sunGeo, sunMat);
                sun.position.set(0, 0, 0);
                scene.add(sun);

                // Glow
                const glow = new THREE.Mesh(
                    new THREE.SphereGeometry(3.4, 32, 32),
                    new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.2, blending: THREE
                            .AdditiveBlending })
                );
                scene.add(glow);

                // Planeten
                const planets = [
                    { name: 'Merkur', size: 0.22, dist: 4.0, color: 0xaaaaaa, speed: 0.04 },
                    { name: 'Venus', size: 0.38, dist: 5.8, color: 0xffcc88, speed: 0.025 },
                    { name: 'Erde', size: 0.42, dist: 7.6, color: 0x4488ff, speed: 0.018 },
                    { name: 'Mars', size: 0.34, dist: 9.4, color: 0xff4422, speed: 0.014 },
                    { name: 'Jupiter', size: 1.0, dist: 12.0, color: 0xddbb88, speed: 0.009 },
                    { name: 'Saturn', size: 0.85, dist: 15.0, color: 0xeeddbb, speed: 0.007 },
                    { name: 'Uranus', size: 0.6, dist: 18.2, color: 0x88ddff, speed: 0.005 },
                    { name: 'Neptun', size: 0.55, dist: 21.4, color: 0x3366ff, speed: 0.004 },
                    { name: 'Pluto', size: 0.15, dist: 24.6, color: 0xccbbaa, speed: 0.003 },
                    { name: 'Ceres', size: 0.12, dist: 27.0, color: 0xaa8866, speed: 0.0025 },
                    { name: 'Haumea', size: 0.16, dist: 29.4, color: 0x88ccaa, speed: 0.002 },
                    { name: 'Makemake', size: 0.14, dist: 31.8, color: 0xcc8866, speed: 0.0018 },
                    { name: 'Eris', size: 0.18, dist: 34.2, color: 0x6699cc, speed: 0.0015 }
                ];
                const planetMeshes = [];
                planets.forEach((p, i) => {
                    const geo = new THREE.SphereGeometry(p.size, 32, 32);
                    const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.5, metalness: 0.1 });
                    const mesh = new THREE.Mesh(geo, mat);
                    const angle = (i / planets.length) * Math.PI * 2;
                    mesh.position.x = Math.cos(angle) * p.dist;
                    mesh.position.z = Math.sin(angle) * p.dist;
                    mesh.userData = { dist: p.dist, speed: p.speed, angle: angle };
                    scene.add(mesh);
                    planetMeshes.push(mesh);

                    // Orbit
                    const pts = [];
                    for (let j = 0; j <= 60; j++) {
                        const t = (j / 60) * Math.PI * 2;
                        pts.push(new THREE.Vector3(Math.cos(t) * p.dist, 0, Math.sin(t) * p.dist));
                    }
                    const orbit = new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints(pts),
                        new THREE.LineBasicMaterial({ color: p.color, transparent: true, opacity: 0.08 })
                    );
                    scene.add(orbit);
                });

                // Sterne
                const starCount = 500;
                const starPos = new Float32Array(starCount * 3);
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * 400;
                }
                const starGeo = new THREE.BufferGeometry();
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 });
                const stars = new THREE.Points(starGeo, starMat);
                scene.add(stars);

                let time = 0;

                function animate() {
                    requestAnimationFrame(animate);
                    time += 0.005;
                    sun.rotation.y += 0.002;
                    const p = 1 + Math.sin(time * 0.5) * 0.04;
                    glow.scale.set(p, p, p);
                    planetMeshes.forEach(m => {
                        const data = m.userData;
                        data.angle += data.speed * 0.3;
                        m.position.x = Math.cos(data.angle) * data.dist;
                        m.position.z = Math.sin(data.angle) * data.dist;
                        m.rotation.y += 0.01;
                    });
                    const a = time * 0.01;
                    camera.position.x = Math.sin(a) * 6;
                    camera.position.z = 38 + Math.sin(a * 0.7) * 3;
                    camera.position.y = 14 + Math.sin(a * 0.5) * 1.5;
                    camera.lookAt(0, 0, 0);
                    renderer.render(scene, camera);
                }
                animate();
                this.isReady = true;
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }
        };

        const LivingAI = {
            width: 300,
            height: 350,
            container: null,
            canvas: null,
            ctx: null,
            emotion: 'idle',
            isSpeaking: false,
            isThinking: false,
            breath: 0,
            blinkTimer: 0,
            eyeState: 'open',

            init(containerId) {
                this.container = document.getElementById(containerId);
                if (!this.container) return;
                this.canvas = document.createElement('canvas');
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.canvas.style.cssText =
                    'width:100%;height:100%;border-radius:50%;mix-blend-mode:screen;pointer-events:none;';
                this.container.appendChild(this.canvas);
                this.ctx = this.canvas.getContext('2d');
                this.animate();
                bus.on('ai:processing', (p) => { this.isThinking = p;
                    this.emotion = p ? 'thinking' : 'idle'; });
                bus.on('ai:response', (data) => {
                    if (data && data.content) {
                        this.speak(data.content);
                        this.emotion = 'happy';
                        setTimeout(() => { if (!this.isSpeaking && !this.isThinking) this.emotion = 'idle'; }, 2000);
                    }
                });
                bus.on('system:ready', () => { this.emotion = 'idle'; });
            },

            animate() {
                requestAnimationFrame(() => this.animate());
                this.breath += 0.02;
                this.blinkTimer += 0.01;
                if (this.blinkTimer > 3 + Math.random() * 2) {
                    this.eyeState = 'closed';
                    setTimeout(() => { this.eyeState = 'open';
                        this.blinkTimer = 0; }, 150);
                }
                this.draw();
            },

            draw() {
                const ctx = this.ctx,
                    w = this.width,
                    h = this.height;
                ctx.clearRect(0, 0, w, h);
                const cx = w / 2,
                    cy = h / 2 - 10;
                // Hintergrund
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 180);
                grad.addColorStop(0, 'rgba(108,60,225,0.2)');
                grad.addColorStop(0.6, 'rgba(0,212,255,0.05)');
                grad.addColorStop(1, 'rgba(10,10,30,0.9)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Körper
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.fillStyle = '#2a1a3a';
                ctx.beginPath();
                ctx.ellipse(cx, h * 0.75, 60, 40, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3a2a1a';
                ctx.fillRect(cx - 15, h * 0.55, 30, 40);
                ctx.shadowBlur = 0;

                // Kopf
                const headX = cx + Math.sin(this.breath * 0.5) * 2;
                const headY = h * 0.45 + Math.sin(this.breath * 0.3) * 1.5;
                const headR = 70;
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(headX, headY, headR, 0, Math.PI * 2);
                ctx.fillStyle = '#e8c9a0';
                ctx.fill();
                ctx.shadowBlur = 0;

                // Wangen
                if (this.emotion === 'happy') {
                    ctx.globalAlpha = 0.2;
                    ctx.fillStyle = '#ff6b8a';
                    ctx.beginPath();
                    ctx.arc(headX - 45, headY + 15, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(headX + 45, headY + 15, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                // Augen
                const eyeY = headY - 10,
                    spacing = 28,
                    eyeR = 14;
                const isClosed = this.eyeState === 'closed';
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(0,0,0,0.1)';
                for (let side of [-1, 1]) {
                    const ex = headX + side * spacing;
                    ctx.beginPath();
                    ctx.ellipse(ex, eyeY, eyeR, isClosed ? 2 : eyeR, 0, 0, Math.PI * 2);
                    ctx.fill();
                    if (!isClosed) {
                        ctx.fillStyle = '#2a1a0a';
                        ctx.beginPath();
                        ctx.arc(ex + 3, eyeY + 1, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.beginPath();
                        ctx.arc(ex + 5, eyeY - 4, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.shadowBlur = 0;

                // Augenbrauen
                ctx.strokeStyle = '#3a2a1a';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                for (let side of [-1, 1]) {
                    const bx = headX + side * spacing;
                    ctx.beginPath();
                    ctx.moveTo(bx - 12, eyeY - 22);
                    ctx.quadraticCurveTo(bx, eyeY - 28, bx + 12, eyeY - 22);
                    ctx.stroke();
                }

                // Nase
                ctx.strokeStyle = '#c4a080';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(headX, headY + 6);
                ctx.quadraticCurveTo(headX + 8, headY + 16, headX, headY + 22);
                ctx.quadraticCurveTo(headX - 8, headY + 16, headX, headY + 6);
                ctx.stroke();
                ctx.fillStyle = '#c4a080';
                ctx.beginPath();
                ctx.arc(headX - 6, headY + 14, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(headX + 6, headY + 14, 3, 0, Math.PI * 2);
                ctx.fill();

                // Mund
                const mouthX = headX,
                    mouthY = headY + 42;
                if (this.isSpeaking) {
                    const breath = Math.sin(this.breath * 2) * 0.3 + 0.5;
                    ctx.fillStyle = '#aa3355';
                    ctx.beginPath();
                    ctx.ellipse(mouthX, mouthY + 4, 16 * (0.6 + breath * 0.4), 6 * (0.4 + breath * 0.6), 0, 0, Math.PI *
                    2);
                    ctx.fill();
                } else if (this.emotion === 'happy') {
                    ctx.strokeStyle = '#cc4466';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(mouthX, mouthY - 2, 16, 0.1, Math.PI - 0.1);
                    ctx.stroke();
                    ctx.fillStyle = '#cc4466';
                    ctx.beginPath();
                    ctx.arc(mouthX, mouthY + 8, 12, 0, Math.PI);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#cc4466';
                    ctx.beginPath();
                    ctx.ellipse(mouthX, mouthY + 2, 14, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Status
                const status = this.isSpeaking ? '🔊' : this.isThinking ? '🧠' : '●';
                ctx.fillStyle = this.isSpeaking ? '#00ff88' : this.isThinking ? '#6666ff' : '#00ff88';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(status, w - 10, 18);
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.font = '10px Inter, sans-serif';
                ctx.textAlign = 'center';
                const label = this.isSpeaking ? '🗣️ Sprechend' : this.isThinking ? '🧠 Denkend' : '💙 Bereit';
                ctx.fillText(label, cx, h - 8);
            },

            speak(text) {
                this.isSpeaking = true;
                this.emotion = 'speaking';
                setTimeout(() => {
                    this.isSpeaking = false;
                    if (!this.isThinking) this.emotion = 'idle';
                }, Math.min(text.length * 30, 3000));
            }
        };

        // ============================================================
        //  AI CORE (mit lokalem Fallback)
        // ============================================================
        const AICore = {
            apiKey: Storage.get('groq_api_key', ''),
            useLocalFallback: true,
            isProcessing: false,

            init() {
                this.apiKey = Storage.get('groq_api_key', '');
                this.useLocalFallback = !this.apiKey || !this.apiKey.startsWith('gsk_');
                console.log('🧠 AI Core init. Fallback:', this.useLocalFallback);
                return this;
            },

            setApiKey(key) {
                this.apiKey = key;
                Storage.set('groq_api_key', key);
                this.useLocalFallback = !key || !key.startsWith('gsk_');
                console.log('🔑 API Key gesetzt. Fallback:', this.useLocalFallback);
            },

            hasValidKey() {
                return this.apiKey && this.apiKey.startsWith('gsk_') && this.apiKey.length > 20;
            },

            // Hauptmethode
            async chat(messages) {
                if (this.isProcessing) return '⏳ Ich bin gerade beschäftigt...';
                this.isProcessing = true;
                bus.emit('ai:processing', true);

                try {
                    // Falls kein Key oder Fallback aktiv -> lokale Antwort
                    if (this.useLocalFallback) {
                        const reply = this.localReply(messages);
                        this.isProcessing = false;
                        bus.emit('ai:processing', false);
                        bus.emit('ai:response', { content: reply });
                        return reply;
                    }

                    // Echte API
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'mixtral-8x7b-32768',
                            messages: [
                                { role: 'system',
                                    content: 'Du bist HalDo, eine hilfsbereite KI. Antworte freundlich und informativ.' },
                                ...messages
                            ],
                            temperature: 0.7,
                            max_tokens: 500
                        })
                    });
                    if (!response.ok) throw new Error('API-Fehler');
                    const data = await response.json();
                    const content = data.choices[0]?.message?.content || 'Entschuldigung, keine Antwort.';
                    // Memory
                    const memory = Storage.get('ai_memory', []);
                    memory.push({ user: messages[messages.length - 1]?.content || '', assistant: content,
                        time: Date.now() });
                    if (memory.length > 50) memory.shift();
                    Storage.set('ai_memory', memory);
                    this.isProcessing = false;
                    bus.emit('ai:processing', false);
                    bus.emit('ai:response', { content });
                    return content;
                } catch (e) {
                    console.error('❌ AI Fehler:', e);
                    this.isProcessing = false;
                    bus.emit('ai:processing', false);
                    // Fallback bei Fehler
                    const fallback = this.localReply(messages);
                    bus.emit('ai:response', { content: fallback });
                    return fallback;
                }
            },

            // Lokale Antwort (intelligent)
            localReply(messages) {
                const userText = messages[messages.length - 1]?.content?.toLowerCase() || '';
                if (userText.includes('hallo') || userText.includes('hi') || userText.includes('hey')) {
                    return 'Hallo Bruder! 💙❤️ Wie kann ich dir helfen?';
                }
                if (userText.includes('wer bist du')) {
                    return 'Ich bin HalDo, deine persönliche KI-Assistentin. Ich stehe dir mit Rat und Tat zur Seite!';
                }
                if (userText.includes('wie geht es dir')) {
                    return 'Mir geht es großartig, danke der Nachfrage! Ich bin bereit für deine Fragen.';
                }
                if (userText.includes('was kannst du')) {
                    return 'Ich kann fast alles: Philosophie, Programmierung, Medizin, Übersetzungen, Witze, kreatives Schreiben und vieles mehr. Frag mich einfach!';
                }
                if (userText.includes('hilfe') || userText.includes('help')) {
                    return 'Ich helfe dir gerne! Sag mir, was du brauchst – z.B. "öffne Notizen" oder "erzähl mir einen Witz".';
                }
                if (userText.includes('danke')) {
                    return 'Gerne, Bruder! Jederzeit wieder. 💙';
                }
                if (userText.includes('öffne notizen')) {
                    AppManager.openApp('notes');
                    return 'Ich öffne die Notizen-App für dich.';
                }
                if (userText.includes('öffne kalender')) {
                    AppManager.openApp('calendar');
                    return 'Ich öffne den Kalender.';
                }
                if (userText.includes('öffne musik')) {
                    AppManager.openApp('music');
                    return 'Ich öffne den Musikplayer.';
                }
                if (userText.includes('öffne einstellungen')) {
                    AppManager.openApp('settings');
                    return 'Ich öffne die Einstellungen.';
                }
                if (userText.includes('systemstatus') || userText.includes('status')) {
                    return `System läuft stabil. Uptime: ${Kernel.getUptime()}s, ${AppManager.apps.length} Apps installiert.`;
                }
                if (userText.includes('witz')) {
                    const jokes = [
                        'Warum können Programmierer nicht unterscheiden zwischen Weihnachten und Halloween? Weil 31. Okt == 25. Dez. (oct == dec) – ein Klassiker!',
                        'Treffen sich zwei Jäger. Beide tot. – Ok, der war flach.',
                        'Was sagt der eine Byte zum anderen? „Hast du ein Bit für mich?“'
                    ];
                    return jokes[Math.floor(Math.random() * jokes.length)];
                }
                // Allgemeines Wissen
                const topics = ['philosophie', 'geschichte', 'kunst', 'literatur', 'programmierung', 'physik', 'chemie',
                    'biologie', 'mathematik', 'religion', 'ethik', 'medizin', 'psychologie', 'politik'
                ];
                for (const topic of topics) {
                    if (userText.includes(topic)) {
                        return `Ah, du fragst nach ${topic}! Das ist ein spannendes Thema. Leider habe ich ohne Groq-API nur begrenztes Wissen. Bitte trage deinen API-Key in den Einstellungen (⚙️ → AI & Memory) ein, damit ich dir eine vollständige, tiefgehende Antwort geben kann. Bis dahin: Was möchtest du sonst noch wissen? 💙`;
                    }

                return `Interessante Frage! Ich würde dir gerne eine detaillierte Antwort geben, aber dafür benötige ich die Groq-API. Bitte trage deinen Key in den Einstellungen (⚙️ → AI & Memory) ein. Sobald du das gemacht hast, kann ich dir alles beantworten – von Philosophie bis Quantenphysik. Was kann ich sonst für dich tun?`;
            },

                return this.chat([{ role: 'user', content: message }]);
            }

                            <button class="btn-maximize">⛶</button>
                            <button class="btn-close">✕</button>
                        </div>
                    </div>
                    <div class="window-body">${content}</div>
                `;
                // Controls
                win.querySelector('.btn-close').onclick = () => { win.remove();
                    this.updateTaskbar(); };
                win.querySelector('.btn-minimize').onclick = () => win.classList.toggle('minimized');
                win.querySelector('.btn-maximize').onclick = () => win.classList.toggle('maximized');
                // Drag
                const header = win.querySelector('.window-header');
                let drag = false,
                    ox, oy, sx, sy;
                header.addEventListener('mousedown', (e) => {
                    if (win.classList.contains('maximized')) return;
                    drag = true;
                    const rect = win.getBoundingClientRect();
                    ox = rect.left;
                    oy = rect.top;
                    sx = e.clientX;
                    sy = e.clientY;
                    win.style.cursor = 'grabbing';
                });
                document.addEventListener('mousemove', (e) => {
                    if (!drag) return;
                    win.style.left = (ox + e.clientX - sx) + 'px';
                    win.style.top = (oy + e.clientY - sy) + 'px';
                });
                document.addEventListener('mouseup', () => { drag = false;
                    win.style.cursor = ''; });
                // Resize
                const resize = document.createElement('div');
                resize.style.cssText =
                    'position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;z-index:1000;';
                win.appendChild(resize);
                let rs = false,
                    rsx, rsy, rsw, rsh;
                resize.addEventListener('mousedown', (e) => {
                    if (win.classList.contains('maximized')) return;
                    rs = true;
                    rsx = e.clientX;
                    rsy = e.clientY;
                    rsw = win.offsetWidth;
                    rsh = win.offsetHeight;
                    e.preventDefault();
                });
                document.addEventListener('mousemove', (e) => {
                    if (!rs) return;
                    win.style.width = Math.max(200, rsw + e.clientX - rsx) + 'px';
                    win.style.height = Math.max(140, rsh + e.clientY - rsy) + 'px';
                });
                document.addEventListener('mouseup', () => { rs = false; });
                return win;
            },

            calcInput(v) {

                            'Error'; }
                } else if (v === 'C') d.textContent = '0';

                }

            runCommand() {
                const input = document.getElementById('terminal-input');

                if (!input || !output) return;
                const cmd = input.value.trim();
                if (!cmd) return;
                output.textContent += `\n$ ${cmd}`;
                input.value = '';
                const parts = cmd.split(' ');
                const command = parts[0].toLowerCase();
                switch (command) {
                    case 'help':
                        output.textContent += '\n> help, version, apps, clear, echo, date, uptime, ai <frage>';
                        break;
                    case 'version':
                        output.textContent += `\n> HalDo AI OS ${Kernel.version}`;
                        break;
                    case 'apps':
                        output.textContent += `\n> Apps: ${this.apps.length} installiert`;
                        break;
                    case 'clear':
                        output.textContent = '> Terminal gelöscht';
                        break;
                    case 'echo':
                        output.textContent += `\n> ${parts.slice(1).join(' ')}`;
                        break;
                    case 'date':
                        output.textContent += `\n> ${new Date().toLocaleString()}`;
                        break;
                    case 'uptime':
                        output.textContent += `\n> ${Kernel.getUptime()}s`;
                        break;
                    case 'ai':
                        const question = parts.slice(1).join(' ');
                        if (!question) { output.textContent += '\n> Bitte Frage: ai <frage>'; break; }
                        output.textContent += '\n> 🤖 Frage wird gesendet...';
                        AICore.simpleChat(question).then(reply => {
                            output.textContent += `\n> 💙 ${reply}`;
                            output.scrollTop = output.scrollHeight;
                        });
                        break;
                    default:
                        output.textContent += `\n> Unbekannt: ${cmd}`;
                }
                output.scrollTop = output.scrollHeight;
            },

                if (!input || !messagesDiv || !input.value.trim()) return;
                const text = input.value.trim();
                input.value = '';

                // User-Nachricht
                const userMsg = document.createElement('div');
                userMsg.style.cssText =
                    'text-align:right;margin:3px 0;padding:5px 10px;background:var(--primary);border-radius:6px;color:#fff;max-width:85%;margin-left:auto;font-size:11px;';
                userMsg.textContent = '🧑 ' + text;
                messagesDiv.appendChild(userMsg);

                // Ladeindikator
                const loading = document.createElement('div');
                loading.style.cssText =
                    'text-align:left;margin:3px 0;padding:5px 10px;background:rgba(255,255,255,0.03);border-radius:6px;color:var(--text-secondary);max-width:85%;font-size:11px;';
                loading.textContent = '💭 HalDo denkt...';
                messagesDiv.appendChild(loading);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                // AI antworten lassen
                AICore.simpleChat(text).then(reply => {
                    loading.remove();
                    const aiMsg = document.createElement('div');
                    aiMsg.style.cssText =
                        'text-align:left;margin:3px 0;padding:5px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:6px;color:var(--text-primary);max-width:85%;font-size:11px;';
                    aiMsg.textContent = '💙 ' + reply;
                    messagesDiv.appendChild(aiMsg);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    // Sprachausgabe
                    if ('speechSynthesis' in window) {
                        const utter = new SpeechSynthesisUtterance(reply);
                        utter.lang = 'de-DE';
                        window.speechSynthesis.speak(utter);
                    }
                });
            },

            voiceInput() {
                if (!('webkitSpeechRecognition' in window)) { alert('🎤 Speech Recognition nicht unterstützt.'); return; }
                const rec = new webkitSpeechRecognition();
                rec.lang = 'de-DE';
                rec.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const input = document.getElementById('ai-chat-input');
                    if (input) { input.value = text;
                        this.sendAIMessage(); }
                };
                rec.start();
            },

            // ===== EINSTELLUNGEN =====
            openSettings(app) {
                const categories = [
                    { id: 'general', label: 'Allgemein' },
                    { id: 'ai', label: 'AI & Memory' },
                    { id: 'themes', label: 'Themes' },
                    { id: 'system', label: 'System' }
                ];
                const content = `
                    <div style="display:flex;height:100%;">
                        <div style="width:80px;padding:4px;border-right:1px solid var(--glass-border);flex-shrink:0;overflow-y:auto;">
                            ${categories.map(c=>`<div onclick="AppManager.showSettings('${c.id}')" data-cat="${c.id}" style="padding:4px 6px;border-radius:4px;cursor:pointer;font-size:10px;color:var(--text-secondary);">${c.label}</div>`).join('')}
                        </div>
                        <div id="settings-content" style="flex:1;padding:8px;overflow-y:auto;">
                            <h2>Einstellungen</h2>
                            <p style="color:var(--text-muted);">Wähle eine Kategorie</p>
                        </div>
                    </div>
                `;
                const win = this.createWindow(app.name, app.icon, content, 460, 380);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
                setTimeout(() => this.showSettings('general'), 100);
            },

            showSettings(category) {
                const container = document.getElementById('settings-content');
                if (!container) return;
                document.querySelectorAll('[data-cat]').forEach(el => {
                    el.style.background = el.dataset.cat === category ? 'var(--primary)' : 'transparent';
                    el.style.color = el.dataset.cat === category ? '#fff' : 'var(--text-secondary)';
                });
                let html = '';
                switch (category) {
                    case 'general':
                        html = `
                            <h2>⚙️ Allgemein</h2>
                            <p>Systemname: HalDo AI OS ${Kernel.version}</p>
                            <p>Zeitzone: Europe/Berlin</p>
                        `;
                        break;
                    case 'ai':
                        const key = Storage.get('groq_api_key', '');
                        html = `
                            <h2>🧠 AI & Memory</h2>
                            <div style="margin-top:8px;">
                                <label>🔑 Groq API Key</label>
                                <input id="ai-key-input" class="haldo-input" type="password" value="${key}" placeholder="gsk_..." style="margin-top:4px;">
                                <button onclick="AppManager.saveAIKey()" class="haldo-btn" style="margin-top:4px;">Speichern</button>
                                <p style="font-size:10px;color:${AICore.hasValidKey()?'var(--success)':'var(--warning)'};margin-top:4px;">${AICore.hasValidKey() ? '✅ Groq-API aktiv' : '⚠️ Fallback-Modus'}</p>
                                <p style="font-size:10px;color:var(--text-muted);">Memory: ${Storage.get('ai_memory',[]).length} Einträge</p>
                                <button onclick="Storage.set('ai_memory',[]);alert('Memory gelöscht!');" class="haldo-btn haldo-btn-secondary" style="margin-top:4px;">🧹 Memory löschen</button>
                            </div>
                        `;
                        break;
                    case 'themes':
                        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
                        html = `
                            <h2>🎨 Themes</h2>
                            <div style="display:flex;flex-wrap:wrap;gap:4px;">
                                ${['dark','light','cosmic','aurora','midnight'].map(t=>`
                                    <div onclick="document.documentElement.setAttribute('data-theme','${t}');const icons={dark:'🌙',light:'☀️',cosmic:'🌌',aurora:'🌠',midnight:'🌃'};document.getElementById('menu-theme').textContent=icons['${t}'];Storage.set('theme','${t}');" style="padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;cursor:pointer;border:2px solid ${currentTheme===t?'var(--primary)':'transparent'};">
                                        ${t==='dark'?'🌙':t==='light'?'☀️':t==='cosmic'?'🌌':t==='aurora'?'🌠':'🌃'} ${t.charAt(0).toUpperCase()+t.slice(1)}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        break;
                    case 'system':
                        html = `
                            <h2>📊 System</h2>
                            <p>Version: ${Kernel.version}</p>
                            <p>Uptime: ${Kernel.getUptime()}s</p>
                            <p>Apps: ${this.apps.length}</p>
                            <button onclick="Kernel.reboot()" class="haldo-btn haldo-btn-secondary" style="margin-top:4px;">🔄 Neustart</button>
                            <button onclick="Storage.clear();alert('Cache geleert!');" class="haldo-btn haldo-btn-secondary" style="margin-top:4px;">🗑️ Cache leeren</button>
                        `;
                        break;
                }
                container.innerHTML = html;
            },

            saveAIKey() {
                const input = document.getElementById('ai-key-input');
                if (!input) return;
                const key = input.value.trim();
                if (key) {
                    AICore.setApiKey(key);
                    alert('✅ API Key gespeichert! ' + (AICore.hasValidKey() ? 'Groq-API aktiv.' : 'Key ungültig, Fallback bleibt.'));
                } else {
                    AICore.setApiKey('');
                    alert('⚠️ Key entfernt, Fallback aktiv.');
                }
                // Seite neu laden, um UI zu aktualisieren
                this.showSettings('ai');
            },

            // ===== KATEGORIEN =====
            openCategory(category) {
                const apps = this.apps.filter(a => a.category === category);
                if (!apps.length) { alert(`Keine Apps in "${category}"`); return; }
                const content = `
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                        ${apps.map(app => `<div onclick="AppManager.openApp('${app.id}')" style="padding:6px 12px;background:rgba(255,255,255,0.03);border-radius:6px;border:1px solid var(--glass-border);cursor:pointer;">${app.icon} ${app.name}</div>`).join('')}
                    </div>
                `;
                const win = this.createWindow(category.toUpperCase(), '📂', content, 400, 300);
                document.getElementById('window-container').appendChild(win);
                this.updateTaskbar();
            },

            // ===== TASKBAR =====
            updateTaskbar() {
                const container = document.getElementById('taskbar-apps');
                if (!container) return;
                const windows = document.querySelectorAll('#window-container .window');
                container.innerHTML = '';
                windows.forEach(win => {
                    const title = win.querySelector('.window-title')?.textContent?.trim() || 'App';
                    const btn = document.createElement('button');
                    btn.className = 'taskbar-app-btn';
                    btn.textContent = title;
                    btn.onclick = () => {
                        win.classList.toggle('minimized');
                        this.updateTaskbar();
                    };
                    container.appendChild(btn);
                });
            },

            // ===== DESKTOP ICONS =====
            renderDesktopIcons() {
                const container = document.getElementById('desktop-icons');
                if (!container) return;
                const apps = this.apps.filter(a => this.installedApps.includes(a.id));
                container.innerHTML = apps.slice(0, 16).map(app => `
                    <div class="desktop-icon" onclick="AppManager.openApp('${app.id}')">
                        <div class="icon-img">${app.icon}</div>
                        <div class="icon-label">${app.name}</div>
                    </div>
                `).join('');
            }
        };

        // ============================================================
        //  START
        // ============================================================
        window.onload = function() {
            Kernel.init();
            Boot.start();
        };

        // Globale Fehlerbehandlung
        window.onerror = function(msg, url, line) {
            console.error('❌ Fehler:', msg, url, line);
            const logs = Storage.get('logs', []);
            logs.push({ level: 'error', message: `${msg} (${url}:${line})`, time: Date.now() });
            if (logs.length > 100) logs.shift();
            Storage.set('logs', logs);
        };

        console.log('💙❤️🚀 HalDo AI OS 24.6.0 Ultimate geladen!');
        console.log('🔑 API-Key in den Einstellungen (⚙️ → AI & Memory) eintragen für volle KI-Kraft.');
    </script>

</body>
</html>
