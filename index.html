<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050b18"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 — Professional AI Operating System"
    >

    <meta
        name="application-name"
        content="HalDo AI OS 20"
    >

    <title>HalDo AI OS 20</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <style>
        :root {
            --haldo-bg: #050b18;
            --haldo-bg-deep: #020611;
            --haldo-surface: rgba(12, 24, 46, 0.88);
            --haldo-surface-soft: rgba(255, 255, 255, 0.045);

            --haldo-border: rgba(125, 222, 255, 0.16);
            --haldo-border-strong: rgba(125, 222, 255, 0.28);

            --haldo-text: #f4f9ff;
            --haldo-text-soft: #b9c9dc;
            --haldo-text-muted: #71849d;

            --haldo-accent: #69ddff;
            --haldo-accent-2: #9074ff;

            --haldo-danger: #ff647c;
            --haldo-success: #62e6a7;

            --haldo-topbar-height: 64px;
            --haldo-dock-width: 72px;
            --haldo-taskbar-height: 48px;

            --haldo-radius: 18px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(80, 160, 255, 0.10),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(144, 116, 255, 0.09),
                    transparent 38%
                ),
                var(--haldo-bg-deep);

            color: var(--haldo-text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: 0;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--haldo-accent);
            outline-offset: 2px;
        }

        /* ========================================================
           ROOT
           ======================================================== */

        #haldo-os {
            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            isolation: isolate;
        }

        /* ========================================================
           BACKGROUND
           ======================================================== */

        #haldo-background {
            position: absolute;
            inset: 0;

            z-index: 0;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    #071329 0%,
                    #030916 48%,
                    #02050e 100%
                );
        }

        #haldo-background::before {
            content: "";

            position: absolute;
            inset: -20%;

            background:
                radial-gradient(
                    circle at 25% 30%,
                    rgba(105, 221, 255, 0.10),
                    transparent 26%
                ),
                radial-gradient(
                    circle at 75% 65%,
                    rgba(144, 116, 255, 0.10),
                    transparent 28%
                );

            animation:
                haldo-background-pulse
                12s
                ease-in-out
                infinite;
        }

        #haldo-background::after {
            content: "";

            position: absolute;
            inset: 0;

            opacity: 0.18;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;
        }

        @keyframes haldo-background-pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.75;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        /* ========================================================
           BOOT / INTRO
           ======================================================== */

        #haldo-boot {
            position: absolute;
            inset: 0;

            z-index: 10000;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(26, 57, 100, 0.34),
                    rgba(2, 6, 17, 0.98) 68%
                );

            transition:
                opacity 500ms ease,
                visibility 500ms ease;
        }

        #haldo-boot.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .haldo-boot-content {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 18px;

            text-align: center;
        }

        #haldo-boot-logo {
            width: 130px;
            height: 130px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(105, 221, 255, 0.40)
                );

            animation:
                haldo-logo-intro
                1.8s
                ease-in-out
                infinite;
        }

        .haldo-boot-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .haldo-boot-subtitle {
            color: var(--haldo-text-soft);
            font-size: 13px;
        }

        #haldo-boot-status {
            min-height: 18px;

            color: var(--haldo-accent);

            font-size: 11px;
        }

        @keyframes haldo-logo-intro {
            0% {
                transform:
                    rotate(0deg)
                    scale(0.92);

                opacity: 0.72;
            }

            50% {
                transform:
                    rotate(180deg)
                    scale(1.05);

                opacity: 1;
            }

            100% {
                transform:
                    rotate(360deg)
                    scale(0.92);

                opacity: 0.72;
            }
        }

        /* ========================================================
           TOPBAR
           ======================================================== */

        #haldo-topbar {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: var(--haldo-topbar-height);

            z-index: 700;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 16px 0 18px;

            border-bottom:
                1px solid var(--haldo-border);

            background:
                rgba(3, 9, 21, 0.72);

            backdrop-filter:
                blur(24px);
        }

        .haldo-brand {
            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }

        .haldo-brand-logo {
            width: 38px;
            height: 38px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(105, 221, 255, 0.28)
                );
        }

        .haldo-brand-text {
            min-width: 0;
        }

        .haldo-brand-name {
            font-size: 14px;
            font-weight: 800;
        }

        .haldo-brand-version {
            margin-top: 2px;

            color: var(--haldo-text-muted);

            font-size: 9px;
        }

        .haldo-topbar-actions {
            display: flex;

            align-items: center;

            gap: 7px;
        }

        .haldo-topbar-button {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border:
                1px solid var(--haldo-border);

            border-radius: 11px;

            background:
                rgba(255,255,255,0.035);

            color: var(--haldo-text-soft);

            cursor: pointer;

            transition: 160ms ease;
        }

        .haldo-topbar-button:hover {
            color: white;

            background:
                rgba(105,221,255,0.10);

            border-color:
                var(--haldo-border-strong);
        }

        /* ========================================================
           WORKSPACE
           ======================================================== */

        #haldo-workspace {
            position: absolute;

            top: var(--haldo-topbar-height);
            left: var(--haldo-dock-width);

            right: 0;
            bottom: var(--haldo-taskbar-height);

            z-index: 10;

            overflow: hidden;
        }

        /* ========================================================
           DOCK
           ======================================================== */

        #haldo-dock {
            position: absolute;

            top: calc(
                var(--haldo-topbar-height) + 10px
            );

            left: 10px;

            bottom: 10px;

            width: 52px;

            z-index: 600;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            padding: 9px 5px;

            border:
                1px solid var(--haldo-border);

            border-radius: 18px;

            background:
                rgba(3, 11, 25, 0.70);

            backdrop-filter:
                blur(24px);
        }

        .haldo-dock-spacer {
            flex: 1;
        }

        .haldo-dock-button {
            width: 40px;
            height: 40px;

            flex: 0 0 auto;

            display: grid;
            place-items: center;

            border:
                1px solid transparent;

            border-radius: 11px;

            background:
                rgba(255,255,255,0.035);

            color: var(--haldo-text-soft);

            cursor: pointer;

            transition: 160ms ease;
        }

        .haldo-dock-button:hover {
            background:
                rgba(105,221,255,0.10);

            border-color:
                var(--haldo-border);

            color: white;

            transform:
                translateY(-1px);
        }

        .haldo-dock-button.active {
            background:
                linear-gradient(
                    135deg,
                    rgba(105,221,255,0.18),
                    rgba(144,116,255,0.18)
                );

            border-color:
                var(--haldo-border-strong);
        }

        /* ========================================================
           DESKTOP WELCOME
           ======================================================== */

        #haldo-desktop {
            position: absolute;
            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            pointer-events: none;
        }

        .haldo-welcome {
            max-width: 560px;

            padding: 34px;

            text-align: center;

            opacity: 0.92;
        }

        .haldo-welcome-logo {
            width: 88px;
            height: 88px;

            object-fit: contain;

            margin-bottom: 18px;
        }

        .haldo-welcome h1 {
            margin: 0;

            font-size: 30px;
            font-weight: 850;
        }

        .haldo-welcome p {
            margin:
                10px 0 0;

            color:
                var(--haldo-text-soft);

            line-height: 1.7;

            font-size: 13px;
        }

        /* ========================================================
           STATUS
           ======================================================== */

        #haldo-status {
            position: absolute;

            right: 14px;
            bottom: 58px;

            z-index: 650;

            min-width: 180px;

            padding:
                8px 12px;

            border:
                1px solid var(--haldo-border);

            border-radius: 11px;

            background:
                rgba(3,11,25,0.72);

            backdrop-filter:
                blur(18px);

            color:
                var(--haldo-text-muted);

            font-size: 10px;

            pointer-events: none;
        }

        /* ========================================================
           TASKBAR
           ======================================================== */

        #haldo-taskbar {
            position: absolute;

            left: calc(
                var(--haldo-dock-width) + 10px
            );

            right: 10px;
            bottom: 8px;

            height: 38px;

            z-index: 500;

            display: flex;

            align-items: center;

            gap: 6px;

            pointer-events: none;
        }

        /* ========================================================
           NOSCRIPT
           ======================================================== */

        #haldo-noscript {
            position: fixed;
            inset: 0;

            z-index: 20000;

            display: grid;
            place-items: center;

            padding: 30px;

            background: #020611;

            color: white;

            text-align: center;
        }

        /* ========================================================
           MOBILE
           ======================================================== */

        @media (max-width: 600px) {

            :root {
                --haldo-topbar-height: 58px;
                --haldo-dock-width: 62px;
                --haldo-taskbar-height: 45px;
            }

            #haldo-topbar {
                padding-left: 10px;
                padding-right: 10px;
            }

            .haldo-brand-name {
                font-size: 12px;
            }

            .haldo-brand-version {
                display: none;
            }

            .haldo-topbar-button {
                width: 34px;
                height: 34px;
            }

            #haldo-dock {
                top: 68px;
                left: 7px;
                bottom: 52px;

                width: 48px;

                border-radius: 15px;
            }

            .haldo-dock-button {
                width: 36px;
                height: 36px;
            }

            #haldo-status {
                right: 8px;
                bottom: 51px;

                min-width: 140px;
            }

            .haldo-welcome {
                padding: 20px;
            }

            .haldo-welcome h1 {
                font-size: 23px;
            }

            .haldo-welcome p {
                font-size: 12px;
            }
        }
    </style>
</head>

    <!-- =========================================================
         HALDO CORE LOADER
         ========================================================= -->

    <script>
        "use strict";

        /*
         * Diese minimale Bootstrap-Schicht erzeugt NICHT
         * die App Runtime.
         *
         * Die Runtime und alle Systeme werden anschließend
         * über ihre eigenen Dateien geladen.
         */

        window.HalDo =
            window.HalDo ||
            {};

        window.HalDo.version =
            "20.0.0";

        window.HalDo.build =
            "Professional Ultimate Foundation";

        window.HalDo.bootTime =
            Date.now();

        window.HalDo.state =
            window.HalDo.state ||
            {
                booted: false,
                ready: false,
                activeApp: null,
                online:
                    navigator.onLine
            };

        window.HalDo.config =
            window.HalDo.config ||
            {};

        window.HalDo.utils =
            window.HalDo.utils ||
            {};

        window.HalDo.utils.escape =
            window.HalDo.utils.escape ||
            function escape(value) {

                const div =
                    document.createElement("div");

                div.textContent =
                    String(
                        value ?? ""
                    );

                return div.innerHTML;
            };

        window.HalDo.status =
            function status(message) {

                const element =
                    document.getElementById(
                        "haldo-status"
                    );

                if (element) {
                    element.textContent =
                        String(message);
                }
            };

        window.HalDo.bootStatus =
            function bootStatus(message) {

                const element =
                    document.getElementById(
                        "haldo-boot-status"
                    );

                if (element) {
                    element.textContent =
                        String(message);
                }
            };

        window.HalDo.hideBoot =
            function hideBoot() {

                const boot =
                    document.getElementById(
                        "haldo-boot"
                    );

                if (!boot) {
                    return;
                }

                boot.classList.add(
                    "hidden"
                );
            };

        window.addEventListener(
            "online",
            () => {

                window.HalDo.state.online =
                    true;

                window.HalDo.status(
                    "Online"
                );

            }
        );

        window.addEventListener(
            "offline",
            () => {

                window.HalDo.state.online =
                    false;

                window.HalDo.status(
                    "Offline"
                );

            }
        );

        /*
         * Service Worker:
         * nur registrieren, wenn die Datei vorhanden
         * und der Browser dies unterstützt.
         */

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register(
                            "service-worker.js"
                        )
                        .then(
                            registration => {

                                window.HalDo.serviceWorker =
                                    registration;

                            }
                        )
                        .catch(
                            error => {

                                console.warn(
                                    "[HalDo] Service Worker konnte nicht registriert werden:",
                                    error
                                );

                            }
                        );

                },
                {
                    once: true
                }
            );

        }
    </script>

    <script>
        "use strict";

        /*
         * Letzte UI-Verbindungen der Shell.
         *
         * Diese Handler greifen absichtlich nur auf die
         * zentrale HalDo API zu. Die eigentliche App-Logik
         * gehört in Runtime / Manager / Apps.
         */

        document
            .getElementById("haldo-home-button")
            ?.addEventListener(
                "click",
                () => {

                    if (
                        window.HalDo?.runtime?.openApp
                    ) {

                        window.HalDo.runtime.openApp(
                            "home"
                        );

                    }

                }
            );

        document
            .getElementById("haldo-ai-dock-button")
            ?.addEventListener(
                "click",
                () => {

                    if (
                        window.HalDo?.runtime?.openApp
                    ) {

                        window.HalDo.runtime.openApp(
                            "ai"
                        );

                    }

                }
            );

        document
            .getElementById("haldo-files-button")
            ?.addEventListener(
                "click",
                () => {

                    if (
                        window.HalDo?.runtime?.openApp
                    ) {

                        window.HalDo.runtime.openApp(
                            "files"
                        );

                    }

                }
            );

        document
            .getElementById("haldo-notes-button")
            ?.addEventListener(
                "click",
                () => {

                    if (
                        window.HalDo?.runtime?.openApp
                    ) {

                        window.HalDo.runtime.openApp(
                            "notes"
                        );

                    }

                }
            );

        document
            .getElementById("haldo-apps-button")
            ?.addEventListener(
                "click",
                () => {

                    if (
                        window.HalDo?.runtime?.toggleAppMenu
                    ) {

                        window.HalDo.runtime.toggleAppMenu(
                            true
                        );

                    }

                }
            );

        window.addEventListener(
            "haldo:ready",
            () => {

                window.HalDo.state.ready =
                    true;

                window.HalDo.state.booted =
                    true;

                window.HalDo.status(
                    "HalDo AI OS 20 ist bereit"
                );

                window.HalDo.bootStatus(
                    "HalDo AI ist bereit"
                );

                setTimeout(
                    () => {

                        window.HalDo.hideBoot();

                    },
                    700
                );

            }
        );

        /*
         * Fallback für Systeme, deren vorhandener Bootloader
         * das ready-Event noch nicht emittiert.
         *
         * Dieser Fallback verändert keine Runtime-Funktion.
         */

        window.addEventListener(
            "load",
            () => {

                setTimeout(
                    () => {

                        if (
                            !window.HalDo.state.ready
                        ) {

                            window.HalDo.status(
                                "HalDo Core geladen"
                            );

                            window.HalDo.bootStatus(
                                "System wird verbunden …"
                            );

                        }

                    },
                    1200
                );

            },
            {
                once: true
            }
        );
    </script>

</body>
</html>
