<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
HalDo AI OS v10.1
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =====================================
     HALDO HEADER
===================================== -->


<header class="haldo-header">


<div class="haldo-logo">

<div class="logo-circle">
🤖
</div>


<div>

<h1>
HalDo AI
</h1>


<p>
AI Operating System
</p>


</div>


</div>



<div class="system-status">

<span>
🟢 Online
</span>

</div>


</header>









<!-- =====================================
     MAIN LAYOUT
===================================== -->


<div class="os-layout">









<!-- =====================================
     LEFT NAVIGATION
===================================== -->


<aside class="left-sidebar">


<nav class="main-navigation">


<h3>
🚀 Hauptmenü
</h3>



<button class="nav-button active"
data-page="homePage">

🏠 Start

</button>



<button class="nav-button"
data-page="chatPage">

🤖 AI Chat

</button>



<button class="nav-button"
data-page="filesPage">

📁 Dateien

</button>



<button class="nav-button"
data-page="writingPage">

📝 Schreiben

</button>



<button class="nav-button"
data-page="settingsPage">

⚙️ Einstellungen

</button>



</nav>









<div class="sidebar-bottom">


<button class="nav-button">

🌙 Dark Mode

</button>


<button class="nav-button">

❓ Hilfe

</button>


</div>


</aside>









<!-- =====================================
     MAIN CONTENT
===================================== -->


<main class="main-content">









<!-- =====================================
     HOME PAGE
===================================== -->


<section id="homePage"
class="page active">


<div class="welcome-box">


<h2>

Willkommen bei HalDo AI

</h2>


<p>

Dein persönliches AI Betriebssystem.

</p>


<div class="welcome-actions">


<button class="primary-button">

🚀 Start AI

</button>



<button class="primary-button">

💬 Chat öffnen

</button>


</div>


</div>



</section>









<!-- =====================================
     CHAT PAGE PLACEHOLDER
===================================== -->


<section id="chatPage"
class="page">


<h2>
🤖 HalDo AI Chat
</h2>



<div class="chat-container">


</div>



<div class="chat-input-area">


<input

id="chatInput"

placeholder="Nachricht an HalDo..."

>


<button id="sendMessage">

Senden

</button>


</div>


</section>









</main>


</div>









<script src="script.js"></script>


</body>

</html>
