    /* =========================================================
       WINDOW LAYER
    ========================================================== */

    let windowLayer =
        document.querySelector(
            "#haldo-window-layer"
        );


    if (!windowLayer) {

        windowLayer =
            document.createElement(
                "div"
            );

        windowLayer.id =
            "haldo-window-layer";

        windowLayer.className =
            "haldo-window-layer";


        /*
         * Versuche den eigentlichen
         * OS-Display-Container zu finden.
         */

        const display =
            document.querySelector(
                "#haldo-display"
            ) ||
            document.querySelector(
                ".haldo-display"
            ) ||
            document.querySelector(
                "#haldo-desktop"
            ) ||
            document.querySelector(
                ".haldo-desktop"
            );


        if (display) {

            display.appendChild(
                windowLayer
            );

        } else {

            document.body.appendChild(
                windowLayer
            );

        }

    }


    /* =========================================================
       APP HTML RENDERER
    ========================================================== */

    async function renderApp(
        record
    ) {

        const app =
            record.app;


        const body =
            record.body;


        body.innerHTML = `

            <div
                class="haldo-window-loading"
            >
                ${escapeHTML(
                    app.name
                )} wird geöffnet …
            </div>

        `;


        try {

            /*
             * 1. Bereits registrierter
             *    App Renderer
             */

            const renderer =
                window.HalDoAppRenderers
                    ?.[
                        app.id
                    ];


            if (
                typeof renderer ===
                "function"
            ) {

                const result =
                    await renderer(
                        {
                            app,
                            window:
                                record.element,
                            body,
                            OS
                        }
                    );


                if (
                    typeof result ===
                    "string"
                ) {

                    body.innerHTML =
                        result;

                }


                return;

            }


            /*
             * 2. App-eigene render()-Funktion
             */

            if (
                typeof app.render ===
                "function"
            ) {

                const result =
                    await app.render(
                        {
                            app,
                            window:
                                record.element,
                            body,
                            OS
                        }
                    );


                if (
                    typeof result ===
                    "string"
                ) {

                    body.innerHTML =
                        result;

                }


                return;

            }


            /*
             * 3. Vorhandener HTML-Inhalt
             */

            if (
                typeof app.html ===
                "string"
            ) {

                body.innerHTML =
                    app.html;

                return;

            }


            /*
             * 4. Vorhandene URL /
             *    HTML-App
             */

            if (
                typeof app.url ===
                "string" &&
                app.url
            ) {

                const iframe =
                    document.createElement(
                        "iframe"
                    );


                iframe.src =
                    app.url;


                iframe.style.cssText =
                    `
                        width:100%;
                        height:100%;
                        border:0;
                        display:block;
                    `;


                iframe.setAttribute(
                    "loading",
                    "lazy"
                );


                body.innerHTML =
                    "";


                body.appendChild(
                    iframe
                );


                return;

            }


            /*
             * 5. Professioneller Fallback
             *
             * Die App ist registriert,
             * aber besitzt noch keinen
             * Renderer.
             */

            body.innerHTML = `

                <div
                    class="haldo-app-page"
                >

                    <div
                        class="haldo-app-toolbar"
                    >

                        <button
                            class="haldo-button primary"
                            data-action="start"
                        >
                            ${escapeHTML(
                                app.icon || "◆"
                            )}
                            Starten
                        </button>

                        <button
                            class="haldo-button"
                            data-action="info"
                        >
                            Informationen
                        </button>

                    </div>


                    <div
                        class="haldo-app-content"
                    >

                        <h2
                            style="
                                margin:0 0 8px;
                                color:#fff;
                                font-size:18px;
                            "
                        >
                            ${escapeHTML(
                                app.name
                            )}
                        </h2>


                        <p
                            style="
                                margin:0;
                                color:
                                  rgba(
                                    255,
                                    255,
                                    255,
                                    .48
                                  );
                                font-size:11px;
                                line-height:1.6;
                            "
                        >
                            ${escapeHTML(
                                app.description ||
                                "HalDo System App"
                            )}
                        </p>

                    </div>

                </div>

            `;

        }


        catch (error) {

            console.error(
                "[HalDo] App Renderer Error:",
                error
            );


            body.innerHTML = `

                <div
                    class="haldo-window-error"
                >

                    <strong>
                        App konnte nicht geladen werden
                    </strong>

                    ${escapeHTML(
                        error.message ||
                        "Unbekannter Fehler."
                    )}

                </div>

            `;

        }


        /*
         * App Event Delegation
         */

        body.addEventListener(
            "click",
            event => {

                const action =
                    event.target.closest(
                        "[data-action]"
                    );


                if (!action) {
                    return;
                }


                const actionName =
                    action.dataset.action;


                OS.events.emit(
                    "app:action",
                    {
                        appId:
                            app.id,

                        action:
                            actionName,

                        element:
                            action
                    }
                );

            }
        );

    }


    /* =========================================================
       CREATE WINDOW
    ========================================================== */

    async function openWindow(
        appId,
        options = {}
    ) {

        const app =
            getApp(
                appId
            );


        if (!app) {

            console.warn(
                "[HalDo] App nicht registriert:",
                appId
            );

            return null;

        }


        /*
         * Bereits geöffnet?
         */

        const existing =
            windows.get(
                appId
            );


        if (existing) {

            if (
                existing.minimized
            ) {

                restoreWindow(
                    existing
                );

            }


            focusWindow(
                existing
            );


            return existing;

        }


        windowSequence++;


        const record = {

            id:
                `window-${windowSequence}`,

            appId,

            app,

            element:null,

            body:null,

            minimized:false,

            maximized:false,

            closed:false,

            previousBounds:null

        };


        const element =
            document.createElement(
                "section"
            );


        element.className =
            "haldo-os-window";


        element.dataset.appId =
            app.id;


        element.dataset.windowId =
            record.id;


        element.style.zIndex =
            ++highestZIndex;


        const icon =
            app.icon ||
            "◆";


        const title =
            options.title ||
            app.name ||
            app.id;


        element.innerHTML = `

            <header
                class="haldo-window-header"
            >

                <div
                    class="haldo-window-icon"
                >
                    ${escapeHTML(
                        icon
                    )}
                </div>


                <div
                    class="haldo-window-title"
                >
                    ${escapeHTML(
                        title
                    )}
                </div>


                <div
                    class="haldo-window-controls"
                >

                    <button
                        type="button"
                        class="haldo-window-control"
                        data-window-minimize
                        title="Minimieren"
                    >
                        −
                    </button>


                    <button
                        type="button"
                        class="haldo-window-control"
                        data-window-maximize
                        title="Maximieren"
                    >
                        □
                    </button>


                    <button
                        type="button"
                        class="haldo-window-control close"
                        data-window-close
                        title="Schließen"
                    >
                        ×
                    </button>

                </div>

            </header>


            <main
                class="haldo-window-body"
            ></main>


            <div
                class="haldo-window-status"
            >
                HALDO
            </div>


            <div
                class="haldo-window-resizer"
                data-window-resize
            ></div>

        `;


        windowLayer.appendChild(
            element
        );


        record.element =
            element;


        record.body =
            element.querySelector(
                ".haldo-window-body"
            );


        windows.set(
            app.id,
            record
        );


        positionWindow(
            record,
            options
        );


        bindWindow(
            record
        );


        focusWindow(
            record
        );


        await renderApp(
            record
        );


        OS.events.emit(
            "window:opened",
            {
                appId:
                    app.id,

                windowId:
                    record.id
            }
        );


        return record;

    }


    /* =========================================================
       WINDOW POSITION
    ========================================================== */

    function positionWindow(
        record,
        options = {}
    ) {

        const width =
            clamp(
                options.width ||
                DEFAULT_WIDTH,

                MIN_WIDTH,

                Math.max(
                    MIN_WIDTH,
                    windowLayer.clientWidth -
                    20
                )
            );


        const height =
            clamp(
                options.height ||
                DEFAULT_HEIGHT,

                MIN_HEIGHT,

                Math.max(
                    MIN_HEIGHT,
                    windowLayer.clientHeight -
                    20
                )
            );


        record.element.style.width =
            `${width}px`;


        record.element.style.height =
            `${height}px`;


        const layerWidth =
            windowLayer.clientWidth ||
            window.innerWidth;


        const layerHeight =
            windowLayer.clientHeight ||
            window.innerHeight;


        const left =
            options.left ??
            Math.max(
                10,
                (
                    layerWidth -
                    width
                ) / 2
            );


        const top =
            options.top ??
            Math.max(
                10,
                (
                    layerHeight -
                    height
                ) / 2
            );


        record.element.style.left =
            `${clamp(
                left,
                5,
                Math.max(
                    5,
                    layerWidth -
                    width -
                    5
                )
            )}px`;


        record.element.style.top =
            `${clamp(
                top,
                5,
                Math.max(
                    5,
                    layerHeight -
                    height -
                    5
                )
            )}px`;

    }


    /* =========================================================
       FOCUS
    ========================================================== */

    function focusWindow(
        record
    ) {

        if (!record) {
            return;
        }


        highestZIndex++;


        record.element.style.zIndex =
            highestZIndex;


        document
            .querySelectorAll(
                ".haldo-os-window.is-active"
            )
            .forEach(
                element => {

                    element.classList.remove(
                        "is-active"
                    );

                }
            );


        record.element.classList.add(
            "is-active"
        );


        activeWindowId =
            record.id;


        OS.events.emit(
            "window:focused",
            {
                appId:
                    record.appId,

                windowId:
                    record.id
            }
        );

    }


    /* =========================================================
       MINIMIZE
    ========================================================== */

    function minimizeWindow(
        record
    ) {

        if (!record) {
            return;
        }


        record.minimized =
            true;


        record.element.classList.add(
            "is-minimized"
        );


        if (
            activeWindowId ===
            record.id
        ) {

            activeWindowId =
                null;

        }


        OS.events.emit(
            "window:minimized",
            {
                appId:
                    record.appId,

                windowId:
                    record.id
            }
        );

    }


    /* =========================================================
       RESTORE
    ========================================================== */

    function restoreWindow(
        record
    ) {

        if (!record) {
            return;
        }


        record.minimized =
            false;


        record.element.classList.remove(
            "is-minimized"
        );


        focusWindow(
            record
        );


        OS.events.emit(
            "window:restored",
            {
                appId:
                    record.appId,

                windowId:
                    record.id
            }
        );

    }


    /* =========================================================
       MAXIMIZE
    ========================================================== */

    function maximizeWindow(
        record
    ) {

        if (!record) {
            return;
        }


        if (
            record.maximized
        ) {

            restoreBounds(
                record
            );

            record.maximized =
                false;

            record.element.classList.remove(
                "is-maximized"
            );

        } else {

            record.previousBounds = {

                left:
                    record.element.offsetLeft,

                top:
                    record.element.offsetTop,

                width:
                    record.element.offsetWidth,

                height:
                    record.element.offsetHeight

            };


            record.maximized =
                true;


            record.element.classList.add(
                "is-maximized"
            );

        }


        focusWindow(
            record
        );


        OS.events.emit(
            "window:maximized",
            {
                appId:
                    record.appId,

                windowId:
                    record.id,

                maximized:
                    record.maximized
            }
        );

    }


    /* =========================================================
       RESTORE BOUNDS
    ========================================================== */

    function restoreBounds(
        record
    ) {

        if (
            !record.previousBounds
        ) {
            return;
        }


        const bounds =
            record.previousBounds;


        record.element.style.left =
            `${bounds.left}px`;


        record.element.style.top =
            `${bounds.top}px`;


        record.element.style.width =
            `${bounds.width}px`;


        record.element.style.height =
            `${bounds.height}px`;

    }


    /* =========================================================
       CLOSE
    ========================================================== */

    function closeWindow(
        record
    ) {

        if (!record) {
            return;
        }


        record.closed =
            true;


        record.element.remove();


        windows.delete(
            record.appId
        );


        if (
            activeWindowId ===
            record.id
        ) {

            activeWindowId =
                null;

        }


        OS.events.emit(
            "window:closed",
            {
                appId:
                    record.appId,

                windowId:
                    record.id
            }
        );

    }


    /* =========================================================
       DRAGGING
    ========================================================== */

    function enableDragging(
        record
    ) {

        const header =
            record.element.querySelector(
                ".haldo-window-header"
            );


        let dragging =
            false;


        let startX =
            0;


        let startY =
            0;


        let startLeft =
            0;


        let startTop =
            0;


        header.addEventListener(
            "pointerdown",
            event => {

                if (
                    event.target.closest(
                        ".haldo-window-controls"
                    )
                ) {

                    return;

                }


                if (
                    record.maximized
                ) {

                    return;

                }


                dragging =
                    true;


                focusWindow(
                    record
                );


                startX =
                    event.clientX;


                startY =
                    event.clientY;


                startLeft =
                    record.element.offsetLeft;


                startTop =
                    record.element.offsetTop;


                header.setPointerCapture(
                    event.pointerId
                );

            }
        );


        header.addEventListener(
            "pointermove",
            event => {

                if (!dragging) {
                    return;
                }


                const dx =
                    event.clientX -
                    startX;


                const dy =
                    event.clientY -
                    startY;


                const width =
                    record.element.offsetWidth;


                const height =
                    record.element.offsetHeight;


                const maxLeft =
                    Math.max(
                        5,
                        windowLayer.clientWidth -
                        width -
                        5
                    );


                const maxTop =
                    Math.max(
                        5,
                        windowLayer.clientHeight -
                        height -
                        5
                    );


                record.element.style.left =
                    `${clamp(
                        startLeft + dx,
                        5,
                        maxLeft
                    )}px`;


                record.element.style.top =
                    `${clamp(
                        startTop + dy,
                        5,
                        maxTop
                    )}px`;

            }
        );


        header.addEventListener(
            "pointerup",
            event => {

                dragging =
                    false;


                try {

                    header.releasePointerCapture(
                        event.pointerId
                    );

                } catch {}

            }
        );

    }


    /* =========================================================
       RESIZING
    ========================================================== */

    function enableResizing(
        record
    ) {

        const resizer =
            record.element.querySelector(
                "[data-window-resize]"
            );


        let resizing =
            false;


        let startX =
            0;


        let startY =
            0;


        let startWidth =
            0;


        let startHeight =
            0;


        resizer.addEventListener(
            "pointerdown",
            event => {

                if (
                    record.maximized
                ) {

                    return;

                }


                resizing =
                    true;


                focusWindow(
                    record
                );


                startX =
                    event.clientX;


                startY =
                    event.clientY;


                startWidth =
                    record.element.offsetWidth;


                startHeight =
                    record.element.offsetHeight;


                resizer.setPointerCapture(
                    event.pointerId
                );


                event.preventDefault();

            }
        );


        resizer.addEventListener(
            "pointermove",
            event => {

                if (!resizing) {
                    return;
                }


                const dx =
                    event.clientX -
                    startX;


                const dy =
                    event.clientY -
                    startY;


                const maxWidth =
                    Math.max(
                        MIN_WIDTH,
                        windowLayer.clientWidth -
                        record.element.offsetLeft -
                        5
                    );


                const maxHeight =
                    Math.max(
                        MIN_HEIGHT,
                        windowLayer.clientHeight -
                        record.element.offsetTop -
                        5
                    );


                record.element.style.width =
                    `${clamp(
                        startWidth + dx,
                        MIN_WIDTH,
                        maxWidth
                    )}px`;


                record.element.style.height =
                    `${clamp(
                        startHeight + dy,
                        MIN_HEIGHT,
                        maxHeight
                    )}px`;

            }
        );


        resizer.addEventListener(
            "pointerup",
            event => {

                resizing =
                    false;


                try {

                    resizer.releasePointerCapture(
                        event.pointerId
                    );

                } catch {}

            }
        );

    }


    /* =========================================================
       WINDOW EVENTS
    ========================================================== */

    function bindWindow(
        record
    ) {

        const element =
            record.element;


        element.addEventListener(
            "pointerdown",
            () => {

                focusWindow(
                    record
                );

            }
        );


        const minimize =
            element.querySelector(
                "[data-window-minimize]"
            );


        const maximize =
            element.querySelector(
                "[data-window-maximize]"
            );


        const close =
            element.querySelector(
                "[data-window-close]"
            );


        minimize?.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                minimizeWindow(
                    record
                );

            }
        );


        maximize?.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                maximizeWindow(
                    record
                );

            }
        );


        close?.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                closeWindow(
                    record
                );

            }
        );


        enableDragging(
            record
        );


        enableResizing(
            record
        );

    }


    /* =========================================================
       RESPONSIVE WINDOW CORRECTION
    ========================================================== */

    function constrainAllWindows() {

        windows.forEach(
            record => {

                if (
                    record.maximized ||
                    record.minimized
                ) {

                    return;

                }


                const width =
                    record.element.offsetWidth;


                const height =
                    record.element.offsetHeight;


                const maxLeft =
                    Math.max(
                        5,
                        windowLayer.clientWidth -
                        width -
                        5
                    );


                const maxTop =
                    Math.max(
                        5,
                        windowLayer.clientHeight -
                        height -
                        5
                    );


                record.element.style.left =
                    `${clamp(
                        record.element.offsetLeft,
                        5,
                        maxLeft
                    )}px`;


                record.element.style.top =
                    `${clamp(
                        record.element.offsetTop,
                        5,
                        maxTop
                    )}px`;

            }
        );

    }


    window.addEventListener(
        "resize",
        constrainAllWindows
    );


    /* =========================================================
       PUBLIC WINDOW MANAGER
    ========================================================== */

    const WindowManager = {

        open:
            openWindow,

        close:
            appId => {

                const record =
                    windows.get(
                        appId
                    );

                if (record) {

                    closeWindow(
                        record
                    );

                }

            },

        minimize:
            appId => {

                const record =
                    windows.get(
                        appId
                    );

                if (record) {

                    minimizeWindow(
                        record
                    );

                }

            },

        restore:
            appId => {

                const record =
                    windows.get(
                        appId
                    );

                if (record) {

                    restoreWindow(
                        record
                    );

                }

            },

        maximize:
            appId => {

                const record =
                    windows.get(
                        appId
                    );

                if (record) {

                    maximizeWindow(
                        record
                    );

                }

            },

        focus:
            appId => {

                const record =
                    windows.get(
                        appId
                    );

                if (record) {

                    focusWindow(
                        record
                    );

                }

            },

        get:
            appId =>
                windows.get(
                    appId
                ),

        list:
            () =>
                [
                    ...windows.values()
                ],

        closeAll:
            () => {

                [
                    ...windows.values()
                ]
                .forEach(
                    record =>
                        closeWindow(
                            record
                        )
                );

            }

    };


    /* =========================================================
       GLOBAL BRIDGE
    ========================================================== */

    window.HalDoWindowManager =
        WindowManager;


    window.WindowManager =
        window.WindowManager ||
        WindowManager;


    if (
        OS
    ) {

        OS.windowManager =
            WindowManager;

    }


    /* =========================================================
       RUNTIME CONNECTION
    ========================================================== */

    if (
        window.HalDoAppRuntime
    ) {

        window.HalDoAppRuntime.openWindow =
            openWindow;

        window.HalDoAppRuntime.closeWindow =
            appId =>
                WindowManager.close(
                    appId
                );

    }


    /* =========================================================
       EVENT BUS CONNECTION
    ========================================================== */

    OS.events.on(
        "app:open",
        payload => {

            if (
                payload?.appId
            ) {

                openWindow(
                    payload.appId,
                    payload
                );

            }

        }
    );


    OS.events.on(
        "window:open",
        payload => {

            if (
                payload?.appId
            ) {

                openWindow(
                    payload.appId,
                    payload
                );

            }

        }
    );


    OS.events.on(
        "window:close",
        payload => {

            if (
                payload?.appId
            ) {

                WindowManager.close(
                    payload.appId
                );

            }

        }
    );


    OS.events.on(
        "window:minimize",
        payload => {

            if (
                payload?.appId
            ) {

                WindowManager.minimize(
                    payload.appId
                );

            }

        }
    );


    OS.events.on(
        "window:maximize",
        payload => {

            if (
                payload?.appId
            ) {

                WindowManager.maximize(
                    payload.appId
                );

            }

        }
    );


    /* =========================================================
       OPEN APP API
    ========================================================== */

    window.HalDoOpenApp =
        openWindow;


    window.HalDoOpenWindow =
        openWindow;


    /* =========================================================
       INITIAL READY EVENT
    ========================================================== */

    OS.events.emit(
        "window-system:ready",
        {
            manager:
                WindowManager
        }
    );


    console.log(
        "[HalDo] Window System verbunden."
    );


})();
</script>

<script>
(() => {

    /* =========================================================
       OS CONNECTION

    const OS =

    if (!OS) {

        );

    }


    /* =========================================================
       AI STATE
    ========================================================== */

    const AI = {

        name:
            "HalDo AI",

        version:

        language:

                "haldo20:language"
            ) || "de",

        listening:

    };


    /* =========================================================
       LANGUAGE DATA

    const LANGUAGE = {

        de: {

            code:

                "Deutsch",

                "Saved.",

            opened:
                "I am opening the app for you.",

                "The app has been closed."

        },


        ku: {

                "ku",

            name:
                "Kurdî",

            hello:
                "Silav! Ez HalDo AI me. Ez dikarim çi ji bo te bikim?",

            ready:
                "Ez amade me.",

            unknown:
                "Ez te fêm kirim, lê ez hewceyê agahiyên zêdetir im.",

            saved:
                "Tomar kir.",

            opened:
                "Ez sepanê ji bo te vedikim.",

            closed:
                "Sepan hate girtin."

        },


        ez: {

            code:
                "ku",

            name:
                "Êzidî",

            hello:
                "Silav! Ez HalDo AI me. Tu çawa yî? Ez dikarim ji bo te çi bikim?",

            ready:
                "Ez amade me.",

            unknown:
                "Ez te fêm dikim, lê ez hewceyê agahiyên zêdetir im.",

            saved:
                "Hat tomarkirin.",

            opened:
                "Ez sepanê ji bo te vedikim.",

            closed:
                "Sepan hat girtin."

        }

    };


    /* =========================================================
       LANGUAGE API
    ========================================================== */

    function getLanguage() {

        return (
            LANGUAGE[
                AI.language
            ] ||
            LANGUAGE.de
        );

    }


    function setLanguage(
        language
    ) {

        if (
            !LANGUAGE[
                language
            ]
        ) {

            return false;

        }


        AI.language =
            language;


        localStorage.setItem(
            "haldo20:language",
            language
        );


        OS.events.emit(
            "language:changed",
            {
                language
            }
        );


        return true;

    }


    window.HalDoLanguage =
        {

            get:
                () =>
                    AI.language,

            set:
                setLanguage,

            all:
                LANGUAGE

        };


    /* =========================================================
       MEMORY
    ========================================================== */

    function saveMemory(
        key,
        value
    ) {

        const entry = {

            key:
                String(key),

            value:
                String(value),

            timestamp:
                Date.now()

        };


        AI.memory =
            AI.memory.filter(
                item =>
                    item.key !==
                    entry.key
            );


        AI.memory.unshift(
            entry
        );


        AI.memory =
            AI.memory.slice(
                0,
                100
            );


        localStorage.setItem(
            "haldo20:ai-memory",
            JSON.stringify(
                AI.memory
            )
        );


        OS.events.emit(
            "ai:memory-saved",
            entry
        );


        return entry;

    }


    function getMemory(
        key
    ) {

        const entry =
            AI.memory.find(
                item =>
                    item.key ===
                    String(key)
            );


        return entry
            ? entry.value
            : null;

    }


    function clearMemory() {

        AI.memory =
            [];


        localStorage.removeItem(
            "haldo20:ai-memory"
        );


        OS.events.emit(
            "ai:memory-cleared"
        );

    }


    window.HalDoAIMemory = {

        save:
            saveMemory,

        get:
            getMemory,

        all:
            () =>
                [
                    ...AI.memory
                ],

        clear:
            clearMemory

    };


    /* =========================================================
       CONVERSATION MEMORY
    ========================================================== */

    function addConversation(
        role,
        content
    ) {

        const item = {

            role,
            content:
                String(content),

            timestamp:
                Date.now()

        };


        AI.conversation.push(
            item
        );


        AI.conversation =
            AI.conversation.slice(
                -100
            );


        if (
            AI.settings.autoSave
        ) {

            localStorage.setItem(
                "haldo20:conversation",
                JSON.stringify(
                    AI.conversation
                )
            );

        }


        OS.events.emit(
            "ai:conversation",
            item
        );


        return item;

    }


    function getConversation() {

        return [
            ...AI.conversation
        ];

    }


    function clearConversation() {

        AI.conversation =
            [];


        localStorage.removeItem(
            "haldo20:conversation"
        );

    }


    /* =========================================================
       TEXT NORMALIZATION
    ========================================================== */

    function normalize(
        text
    ) {

        return String(
            text || ""
        )
        .trim()
        .toLowerCase()
        .normalize(
            "NFD"
        )
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

    }


    /* =========================================================
       COMMAND DETECTION
    ========================================================== */

    function detectCommand(
        input
    ) {

        const text =
            normalize(
                input
            );


        if (
            /^(hallo|hi|hey|servus|moin)\b/
                .test(text)
        ) {

            return {
                type:
                    "greeting"
            };

        }


        if (
            /(danke|vielen dank)/.test(
                text
            )
        ) {

            return {
                type:
                    "thanks"
            };

        }


        if (
            /(hilfe|help|was kannst du)/.test(
                text
            )
        ) {

            return {
                type:
                    "help"
            };

        }


        if (
            /(zeit|uhrzeit)/.test(
                text
            )
        ) {

            return {
                type:
                    "time"
            };

        }


        if (
            /(datum|welcher tag|heute)/.test(
                text
            )
        ) {

            return {
                type:
                    "date"
            };

        }


        if (
            /(apps|app menu|application menu|menue|menu)/.test(
                text
            )
        ) {

            return {
                type:
                    "apps"
            };

        }


        if (
            /(einstellungen|settings|setting)/.test(
                text
            )
        ) {

            return {
                type:
                    "settings"
            };

        }


        if (
            /(kalender|calendar)/.test(
                text
            )
        ) {

            return {
                type:
                    "open-app",

                appId:
                    "calendar"

            };

        }


        if (
            /(notizen|note|notiz)/.test(
                text
            )
        ) {

            return {
                type:
                    "open-app",

                appId:
                    "notes"

            };

        }


        if (
            /(dateien|dateimanager|files|file manager)/.test(
                text
            )
        ) {

            return {
                type:
                    "open-app",

                appId:
                    "file-manager"

            };

        }


        if (
            /(taschenrechner|rechner|calculator)/.test(
                text
            )
        ) {

            return {
                type:
                    "open-app",

                appId:
                    "calculator"

            };

        }


        if (
            /(musik|music)/.test(
                text
            )
        ) {

            return {
                type:
                    "open-app",

                appId:
                    "music"

            };

        }


        if (
            /(browser|internet|web)/.test(
                text
            )
        ) {

            return {
                type:
                    "open-app",

                appId:
                    "browser"

            };

        }


        if (
            /(sprache|sprachmodus|voice)/.test(
                text
            )
        ) {

            return {
                type:
                    "voice"

            };

        }


        if (
            /(ezidi|êzidî|ezidisch)/.test(
                text
            )
        ) {

            return {
                type:
                    "language",

                language:
                    "ez"

            };

        }


        if (
            /(deutsch|german)/.test(
                text
            )
        ) {

            return {
                type:
                    "language",

                language:
                    "de"

            };

        }


        if (
            /(englisch|english)/.test(
                text
            )
        ) {

            return {
                type:
                    "language",

                language:
                    "en"

            };

        }


        if (
            /(kurdisch|kurdî|kurdish)/.test(
                text
            )
        ) {

            return {
                type:
                    "language",

                language:
                    "ku"

            };

        }


        if (
            /(vergiss|loesche|lösche).*memory/.test(
                text
            )
        ) {

            return {
                type:
                    "clear-memory"

            };

        }


        return {
            type:
                "conversation"
        };

    }


    /* =========================================================
       LOCAL AI RESPONSE ENGINE
    ========================================================== */

    async function generateResponse(
        input
    ) {

        const original =
            String(
                input || ""
            ).trim();


        if (!original) {

            return getLanguage()
                .ready;

        }


        addConversation(
            "user",
            original
        );


        const command =
            detectCommand(
                original
            );


        let response;


        switch (
            command.type
        ) {


            case "greeting":

                response =
                    getLanguage()
                        .hello;

                break;


            case "thanks":

                response =
                    AI.language === "de"
                        ? "Sehr gerne. Ich bin für dich da."
                        : getLanguage()
                            .ready;

                break;


            case "help":

                response =
                    AI.language === "de"

                        ? [
                            "Ich kann dir im HalDo AI OS helfen.",
                            "",
                            "• Apps öffnen",
                            "• Einstellungen aufrufen",
                            "• Sprache wechseln",
                            "• Spracheingabe verwenden",
                            "• Informationen speichern",
                            "• Gespräche fortsetzen",
                            "• Systemfunktionen steuern",
                            "",
                            "Du kannst zum Beispiel sagen:",
                            "„Öffne den Kalender“ oder „Sprich Êzidî mit mir“."
                          ].join(
                            "\n"
                          )

                        : getLanguage()
                            .ready;

                break;


            case "time":

                response =
                    AI.language === "de"

                        ? `Es ist ${new Date()
                            .toLocaleTimeString(
                                "de-DE",
                                {
                                    hour:
                                        "2-digit",

                                    minute:
                                        "2-digit"
                                }
                            )} Uhr.`

                        : getLanguage()
                            .ready;

                break;


            case "date":

                response =
                    AI.language === "de"

                        ? `Heute ist ${new Date()
                            .toLocaleDateString(
                                "de-DE",
                                {
                                    weekday:
                                        "long",

                                    day:
                                        "numeric",

                                    month:
                                        "long",

                                    year:
                                        "numeric"
                                }
                            )}.`

                        : getLanguage()
                            .ready;

                break;


            case "apps":

                OS.events.emit(
                    "launcher:open"
                );


                response =
                    getLanguage()
                        .opened;

                break;


            case "settings":

                if (
                    typeof
                    window.HalDoOpenApp ===
                    "function"
                ) {

                    window.HalDoOpenApp(
                        "settings"
                    );

                } else {

                    OS.events.emit(
                        "app:open",
                        {
                            appId:
                                "settings"
                        }
                    );

                }


                response =
                    getLanguage()
                        .opened;

                break;


            case "open-app":

                if (
                    typeof
                    window.HalDoOpenApp ===
                    "function"
                ) {

                    window.HalDoOpenApp(
                        command.appId
                    );

                } else {

                    OS.events.emit(
                        "app:open",
                        {
                            appId:
                                command.appId
                        }
                    );

                }


                response =
                    getLanguage()
                        .opened;

                break;


            case "language":

                setLanguage(
                    command.language
                );


                response =
                    AI.language === "ez"

                        ? LANGUAGE.ez.hello

                        : `Sprache geändert: ${
                            getLanguage()
                                .name
                        }.`;

                break;


            case "voice":

                startListening();

                response =
                    AI.language === "de"

                        ? "Ich höre dir zu."

                        : getLanguage()
                            .ready;

                break;


            case "clear-memory":

                clearMemory();

                clearConversation();


                response =
                    AI.language === "de"

                        ? "Meine lokale HalDo-Erinnerung wurde gelöscht."

                        : getLanguage()
                            .saved;

                break;


            case "conversation":

                response =
                    conversationalResponse(
                        original
                    );

                break;


            default:

                response =
                    getLanguage()
                        .unknown;

        }


        addConversation(
            "assistant",
            response
        );


        OS.events.emit(
            "ai:response",
            {
                input:
                    original,

                response,

                command
            }
        );


        return response;

    }


    /* =========================================================
       CONVERSATIONAL RESPONSE
    ========================================================== */

    function conversationalResponse(
        input
    ) {

        const text =
            normalize(
                input
            );


        /*
         * Fragen
         */

        if (
            text.includes(
                "wie geht es dir"
            )
        ) {

            return AI.language === "de"

                ? "Danke der Nachfrage. Ich bin aktiv und bereit, mit dir weiterzuarbeiten."

                : getLanguage()
                    .ready;

        }


        if (
            text.includes(
                "wer bist du"
            ) ||
            text.includes(
                "was bist du"
            )
        ) {

            return AI.language === "de"

                ? "Ich bin HalDo AI, die zentrale KI-Schnittstelle des HalDo AI OS. Ich kann mit dem System, seinen Apps, Speicherfunktionen und Sprachfunktionen zusammenarbeiten."

                : getLanguage()
                    .hello;

        }


        if (
            text.includes(
                "was machst du"
            )
        ) {

            return AI.language === "de"

                ? "Ich überwache deine Anfrage, verstehe den Kontext und kann passende HalDo-Systemfunktionen oder Apps aufrufen."

                : getLanguage()
                    .ready;

        }


        /*
         * Erinnerung
         */

        const rememberMatch =
            input.match(
                /(?:merke dir|merk dir|erinnere dich an|remember)\s+(.+)/i
            );


        if (
            rememberMatch
        ) {

            const value =
                rememberMatch[1]
                    .trim();


            saveMemory(
                `memory-${Date.now()}`,
                value
            );


            return AI.language === "de"

                ? `Ich habe mir „${value}“ lokal gemerkt.`

                : getLanguage()
                    .saved;

        }


        /*
         * Lokale Berechnung
         */

        const math =
            input.match(
                /^\s*([0-9+\-*/().,%\s]+)\s*$/
            );


        if (
            math
        ) {

            try {

                const expression =
                    math[1]
                        .replace(
                            /%/g,
                            "/100"
                        );


                /*
                 * Nur einfache mathematische
                 * Zeichen werden zugelassen.
                 */

                if (
                    /^[0-9+\-*/().\s]+$/
                        .test(
                            expression
                        )
                ) {

                    const result =
                        Function(
                            `"use strict"; return (${expression})`
                        )();


                    if (
                        Number.isFinite(
                            result
                        )
                    ) {

                        return String(
                            result
                        );

                    }

                }

            } catch {}

        }


        /*
         * Lokaler Kontext
         */

        const memories =
            AI.memory
                .slice(
                    0,
                    5
                );


        if (
            memories.length
        ) {

            const keywords =
                memories
                    .map(
                        item =>
                            item.value
                    )
                    .join(
                        " "
                    )
                    .slice(
                        0,
                        300
                    );


            if (
                text.includes(
                    "erinnerst"
                ) ||
                text.includes(
                    "erinnerung"
                )
            ) {

                return AI.language === "de"

                    ? `Ich habe lokale Erinnerungen gespeichert. Zum Beispiel: ${keywords}`

                    : getLanguage()
                        .ready;

            }

        }


        /*
         * Allgemeiner Dialog
         */

        if (
            input.endsWith(
                "?"
            )
        ) {

            return AI.language === "de"

                ? "Das ist eine interessante Frage. Im aktuellen lokalen HalDo-Kern kann ich sie anhand meiner verfügbaren Systemdaten und Regeln bearbeiten. Für aktuelles Wissen oder komplexe externe Informationen braucht HalDo AI zusätzlich eine angebundene KI-/Internet-Schnittstelle."

                : getLanguage()
                    .unknown;

        }


        return AI.language === "de"

            ? `Ich habe dich verstanden: „${input}“. Ich bin bereit, darauf weiter aufzubauen.`

            : getLanguage()
                .unknown;

    }


    /* =========================================================
       PUBLIC AI API
    ========================================================== */

    const HalDoAI = {

        state:
            AI,

        ask:
            generateResponse,

        respond:
            generateResponse,

        remember:
            saveMemory,

        recall:
            getMemory,

        clearMemory,

        conversation:
            getConversation,

        clearConversation,

        setLanguage,

        getLanguage,

        detectCommand

    };


    window.HalDoAI =
        HalDoAI;


    window.HalDoAIEngine =
        HalDoAI;


    /* =========================================================
       SPEECH SYNTHESIS
    ========================================================== */

    function speak(
        text
    ) {

        if (
            !AI.settings.voice
        ) {

            return false;

        }


        if (
            !("speechSynthesis" in window)
        ) {

            return false;

        }


        const content =
            String(
                text || ""
            );


        if (!content) {

            return false;

        }


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                content
            );


        utterance.lang =
            getLanguage()
                .code;


        utterance.rate =
            0.96;


        utterance.pitch =
            1.0;


        utterance.volume =
            1.0;


        utterance.onstart =
            () => {

                AI.speaking =
                    true;

                OS.events.emit(
                    "ai:speaking",
                    {
                        speaking:
                            true
                    }
                );

            };


        utterance.onend =
            () => {

                AI.speaking =
                    false;

                OS.events.emit(
                    "ai:speaking",
                    {
                        speaking:
                            false
                    }
                );

            };


        utterance.onerror =
            () => {

                AI.speaking =
                    false;

            };


        window.speechSynthesis
            .speak(
                utterance
            );


        return true;

    }


    function stopSpeaking() {

        if (
            "speechSynthesis" in window
        ) {

            window.speechSynthesis.cancel();

        }


        AI.speaking =
            false;

    }


    window.HalDoSpeak =
        speak;


    window.HalDoStopSpeaking =
        stopSpeaking;


    /* =========================================================
       SPEECH RECOGNITION
    ========================================================== */

    let recognition =
        null;


    function createRecognition() {

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!Recognition) {

            return null;

        }


        const instance =
            new Recognition();


        instance.continuous =
            false;


        instance.interimResults =
            true;


        instance.lang =
            getLanguage()
                .code;


        instance.onstart =
            () => {

                AI.listening =
                    true;


                OS.events.emit(
                    "ai:listening",
                    {
                        listening:
                            true
                    }
                );

            };


        instance.onend =
            () => {

                AI.listening =
                    false;


                OS.events.emit(
                    "ai:listening",
                    {
                        listening:
                            false
                    }
                );

            };


        instance.onerror =
            event => {

                AI.listening =
                    false;


                OS.events.emit(
                    "ai:speech-error",
                    {
                        error:
                            event.error
                    }
                );

            };


        instance.onresult =
            async event => {

                let finalText =
                    "";


                for (
                    let i =
                        event.resultIndex;

                    i <
                        event.results.length;

                    i++
                ) {

                    finalText +=
                        event.results[i][0]
                            .transcript;

                }


                OS.events.emit(
                    "ai:speech-result",
                    {
                        text:
                            finalText
                    }
                );


                if (
                    event.results[
                        event.results.length - 1
                    ].isFinal
                ) {

                    const response =
                        await generateResponse(
                            finalText
                        );


                    speak(
                        response
                    );

                }

            };


        return instance;

    }


    function startListening() {

        if (
            AI.listening
        ) {

            return true;

        }


        recognition =
            createRecognition();


        if (!recognition) {

            OS.events.emit(
                "ai:speech-unavailable"
            );


            return false;

        }


        recognition.lang =
            getLanguage()
                .code;


        try {

            recognition.start();

            return true;

        } catch {

            return false;

        }

    }


    function stopListening() {

        if (
            recognition
        ) {

            try {

                recognition.stop();

            } catch {}

        }


        AI.listening =
            false;

    }


    window.HalDoStartListening =
        startListening;


    window.HalDoStopListening =
        stopListening;


    window.HalDoSpeech = {

        start:
            startListening,

        stop:
            stopListening,

        speak,

        stopSpeaking

    };

       EZIDI / LANGUAGE KEYBOARD
    ========================================================== */

    const EZIDI_LAYOUT = [

        "q",

        "ş"

    ];


    const EZIDI_EXTRA = [

        "ê",
        "î",
        "û",
        "ş",
        "ç",
        "Ê",
        "Î",
        "Û"

    ];


    function insertKeyboardCharacter(
        character
    ) {

        const active =
            document.activeElement;


        if (
            active &&
            (
                active.tagName ===
                    "INPUT" ||
                active.tagName ===
                    "TEXTAREA"
            )
        ) {

            const start =
                active.selectionStart ??
                active.value.length;


            const end =
                active.selectionEnd ??
                active.value.length;


            active.value =
                active.value.slice(
                    0,
                    start
                ) +
                character +
                active.value.slice(
                    end
                );


            active.selectionStart =
                active.selectionEnd =
                    start +
                    character.length;


            active.dispatchEvent(
                new Event(
                    "input",
                    {
                        bubbles:
                            true
                    }
                )
            );


            return true;

        }


        return false;

    }


    window.HalDoEzidiKeyboard = {

        layout:
            EZIDI_LAYOUT,

        extra:
            EZIDI_EXTRA,

        insert:
            insertKeyboardCharacter

    };


    /* =========================================================
       APP COMMUNICATION
    ========================================================== */

    function sendToApp(
        appId,
        event,
        data = {}
    ) {

        OS.events.emit(
            `app:${appId}:${event}`,
            {
                appId,

                event,

                data
            }
        );


        OS.events.emit(
            "app:message",
            {
                target:
                    appId,

                event,

                data
            }
        );

    }


    window.HalDoAppMessage = {

        send:
            sendToApp

    };

       AI EVENT COMMANDS
    ========================================================== */

        "ai:ask",
        async payload => {

            if (
                !payload?.text
            ) {

                );


            if (
                payload.speak
            ) {

                );

            }

        }
    );


    OS.events.on(
        "ai:speak",
        payload => {

            speak(
                payload?.text ||
                ""
            );

        }
    );


    OS.events.on(
        "ai:stop-speaking",
        stopSpeaking
    );


    OS.events.on(
        "ai:start-listening",

    );

    );

        "language:set",
        payload => {

                payload?.language
            ) {

                    payload.language
                );

            }

        }
    );


    /* =========================================================
       GLOBAL COMMAND API
    ========================================================== */

    window.HalDoCommand = async (
        command
    ) => {

        const result =
            await generateResponse(

            );

        "ai:ready",

            version:
                AI.version,

            language:
                AI.language,

            memory:
                AI.memory.length
        }
    );

        "[HalDo AI] AI / Sprache / Memory / Ezidi verbunden."
    );
