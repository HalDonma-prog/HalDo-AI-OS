    <!-- =========================================================
         PRE-BOOT ERROR PROTECTION
         ========================================================= -->

    <script>

        window.HalDoBootErrors = [];

        window.addEventListener(
            "error",
            function (event) {

                window.HalDoBootErrors.push({

                    type: "error",

                    message:
                        event.message || "Unknown error",

                    source:
                        event.filename || null,

                    line:
                        event.lineno || null,

                    column:
                        event.colno || null

                });

            }
        );

        window.addEventListener(
            "unhandledrejection",
            function (event) {

                window.HalDoBootErrors.push({

                    type:
                        "unhandledrejection",

                    message:
                        event.reason
                            ? String(event.reason)
                            : "Unknown rejection"

                });

            }
        );

    </script>

         CENTRAL V20 SHELL BRIDGE
         ========================================================= -->

    <script>

        (function (window, document) {

            "use strict";


            const HalDoV20Shell = {

                version: "20.0.0",

                initialized: false,

                ready: false,


                init() {

                    if (this.initialized) {
                        return;
                    }

                    this.initialized = true;


                    this.bindNavigation();

                    this.bindAppTiles();

                    this.bindMenu();

                    this.bindAI();

                    this.bindSystemEvents();

                    this.applyAccessibility();

                    this.updateStatus();


                    if (
                        window.HalDoAppEvents
                    ) {

                        window.HalDoAppEvents.emit(
                            "shell:ready",
                            {
                                version:
                                    this.version
                            },
                            {
                                source:
                                    "haldo-v20-shell"
                            }
                        );

                    }


                    window.HalDoOS =
                        window.HalDoOS || {};

                    window.HalDoOS.shell =
                        this;


                    this.ready = true;

                },


                bindNavigation() {

                    const items =
                        document.querySelectorAll(
                            "[data-route]"
                        );


                    items.forEach(
                        item => {

                            item.addEventListener(
                                "click",
                                () => {

                                    const route =
                                        item.dataset.route;

                                    this.navigate(
                                        route
                                    );

                                }
                            );

                        }
                    );

                },


                bindAppTiles() {

                    const tiles =
                        document.querySelectorAll(
                            "[data-app-id]"
                        );


                    tiles.forEach(
                        tile => {

                            tile.addEventListener(
                                "click",
                                () => {

                                    const appId =
                                        tile.dataset.appId;

                                    this.openApp(
                                        appId
                                    );

                                }
                            );

                        }
                    );

                },


                bindMenu() {

                    const button =
                        document.getElementById(
                            "haldo-menu-button"
                        );

                    const sidebar =
                        document.getElementById(
                            "haldo-sidebar"
                        );


                    if (
                        !button ||
                        !sidebar
                    ) {
                        return;
                    }


                    button.addEventListener(
                        "click",
                        () => {

                            const open =
                                sidebar.getAttribute(
                                    "aria-hidden"
                                ) === "false";


                            sidebar.setAttribute(
                                "aria-hidden",
                                String(!open)
                            );


                            button.setAttribute(
                                "aria-expanded",
                                String(!open)
                            );


                            document.body.classList.toggle(
                                "haldo-menu-open",
                                !open
                            );

                        }
                    );

                },


                bindAI() {

                    const form =
                        document.getElementById(
                            "haldo-ai-form"
                        );

                    const input =
                        document.getElementById(
                            "haldo-ai-input"
                        );


                    if (
                        !form ||
                        !input
                    ) {
                        return;
                    }


                    form.addEventListener(
                        "submit",
                        event => {

                            event.preventDefault();

                            const text =
                                input.value.trim();

                            if (!text) {
                                return;
                            }


                            this.sendAIMessage(
                                text
                            );

                            input.value = "";

                        }
                    );

                },


                sendAIMessage(message) {

                    if (
                        window.HalDoAppEvents
                    ) {

                        window.HalDoAppEvents.emit(
                            "ai:user-message",
                            {
                                message
                            },
                            {
                                source:
                                    "haldo-shell"
                            }
                        );

                    }


                    if (
                        window.HalDoAI &&
                        typeof
                        window.HalDoAI.chat ===
                        "function"
                    ) {

                        window.HalDoAI.chat(
                            message
                        );

                    }

                },


                navigate(route) {

                    if (
                        window.HalDoAppRouter &&
                        typeof
                        window.HalDoAppRouter.navigate ===
                        "function"
                    ) {

                        window.HalDoAppRouter.navigate(
                            route
                        );

                        return;
                    }


                    if (
                        window.HalDoRouter &&
                        typeof
                        window.HalDoRouter.navigate ===
                        "function"
                    ) {

                        window.HalDoRouter.navigate(
                            route
                        );

                        return;
                    }


                    if (
                        window.HalDoAppEvents
                    ) {

                        window.HalDoAppEvents.emit(
                            "navigation:request",
                            {
                                route
                            },
                            {
                                source:
                                    "haldo-shell"
                            }
                        );

                    }

                },


                openApp(appId) {

                    if (!appId) {
                        return;
                    }


                    if (
                        window.HalDoAppManager &&
                        typeof
                        window.HalDoAppManager.open ===
                        "function"
                    ) {

                        window.HalDoAppManager.open(
                            appId
                        );

                        return;
                    }


                    if (
                        window.HalDoAppManager &&
                        typeof
                        window.HalDoAppManager.launch ===
                        "function"
                    ) {

                        window.HalDoAppManager.launch(
                            appId
                        );

                        return;
                    }


                    if (
                        window.HalDoAppEvents
                    ) {

                        window.HalDoAppEvents.emit(
                            "app:open-request",
                            {
                                appId
                            },
                            {
                                source:
                                    "haldo-shell"
                            }
                        );

                    }

                },


                bindSystemEvents() {

                    window.addEventListener(
                        "haldo:system:ready",
                        () => {

                            this.setStatus(
                                "System bereit"
                            );

                        }
                    );


                    window.addEventListener(
                        "haldo:app-events-ready",
                        () => {

                            this.setStatus(
                                "Kommunikation bereit"
                            );

                        }
                    );


                    window.addEventListener(
                        "haldo:cosmic:ready",
                        () => {

                            this.setCosmicStatus(
                                "Active"
                            );

                        }
                    );


                    window.addEventListener(
                        "online",
                        () => {

                            this.setStatus(
                                "Online"
                            );

                        }
                    );


                    window.addEventListener(
                        "offline",
                        () => {

                            this.setStatus(
                                "Offline"
                            );

                        }
                    );

                },


                updateStatus() {

                    const system =
                        document.getElementById(
                            "haldo-status-system"
                        );

                    if (system) {

                        system.textContent =
                            "HalDo AI OS 20";

                    }

                },


                setStatus(text) {

                    const element =
                        document.getElementById(
                            "haldo-status-system"
                        );

                    if (element) {
                        element.textContent =
                            text;
                    }

                },


                setCosmicStatus(text) {

                    const element =
                        document.getElementById(
                            "haldo-status-cosmic"
                        );

                    if (element) {

                        element.textContent =
                            "Cosmic: " + text;

                    }

                },


                applyAccessibility() {

                    if (
                        window.HalDoConfig &&
                        window.HalDoConfig
                            .accessibility
                            .reducedMotion
                    ) {

                        document.documentElement
                            .classList
                            .add(
                                "haldo-reduced-motion"
                            );

                    }

                }

            };


            window.HalDoV20Shell =
                HalDoV20Shell;


            function startShell() {

                HalDoV20Shell.init();

            }


            if (
                document.readyState ===
                "loading"
            ) {

                document.addEventListener(
                    "DOMContentLoaded",
                    startShell,
                    {
                        once: true
                    }
                );

            } else {

                startShell();

            }

        })(window, document);

    </script>

    <script>

        (function (window, document) {

            "use strict";


            function finalizeBoot() {

                document.body.dataset.state =
                    "ready";


                window.HalDoOS =
                    window.HalDoOS || {};


                window.HalDoOS.ready =
                    true;


                window.dispatchEvent(
                    new CustomEvent(
                        "haldo:os-ready",
                        {
                            detail: {
                                version:
                                    "20.0.0"
                            }
                        }
                    )
                );


                if (
                    window.HalDoAppEvents
                ) {

                    window.HalDoAppEvents.emit(
                        "system:os-ready",
                        {
                            version:
                                "20.0.0"
                        },
