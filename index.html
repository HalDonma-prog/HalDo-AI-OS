    <!-- =====================================================
         STARTUP-STYLES
         -----------------------------------------------------
         Diese kleinen Grundstyles sorgen dafür, dass das
         System auch während des Ladens ordentlich aussieht.
         ===================================================== -->

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #050814;
        }

        body {
            overflow-x: hidden;
        }

        .haldo-loading-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(35, 70, 150, 0.22),
                    transparent 45%
                ),
                #050814;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        .haldo-loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .haldo-loading-content {
            width: min(90vw, 420px);
            text-align: center;
        }

        .haldo-logo-stage {
            position: relative;

            width: 230px;
            height: 230px;

            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
         * Das echte Logo bleibt vollkommen still.
         * Nur Licht und Orbital-Effekt bewegen sich.
         */

        .haldo-logo-image {
            position: relative;
            z-index: 5;

            width: 145px;
            height: 145px;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(90, 170, 255, 0.65)
                )
                drop-shadow(
                    0 0 30px
                    rgba(80, 110, 255, 0.38)
                );
        }

        /*
         * Leuchtender Halo hinter dem Logo.
         */

        .haldo-logo-glow {
            position: absolute;

            width: 165px;
            height: 165px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(90, 180, 255, 0.34) 0%,
                    rgba(90, 110, 255, 0.15) 35%,
                    transparent 70%
                );

            filter: blur(7px);

            animation:
                haldoGlowPulse
                2.8s
                ease-in-out
                infinite;
        }

        /*
         * Lichtbahn.
         * Sie dreht sich um das Logo,
         * NICHT das Logo selbst.
         */

        .haldo-orbit {
            position: absolute;

            width: 205px;
            height: 205px;

            border-radius: 50%;

            border:
                1px solid
                rgba(110, 190, 255, 0.16);

            transform: rotateX(64deg);

            animation:
                haldoOrbit
                3.8s
                linear
                infinite;
        }

        .haldo-orbit::before {
            content: "";

            position: absolute;

            width: 28px;
            height: 28px;

            top: -13px;
            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #ffffff 0%,
                    #aee7ff 22%,
                    #6ab8ff 48%,
                    transparent 72%
                );

            box-shadow:
                0 0 8px #ffffff,
                0 0 18px #8ed8ff,
                0 0 35px rgba(75, 150, 255, 0.8);

            filter: blur(0.2px);
        }

        .haldo-orbit::after {
            content: "";

            position: absolute;
            inset: 0;

            border-radius: 50%;

            background:
                linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(100, 190, 255, 0.05) 40%,
                    rgba(100, 200, 255, 0.34) 50%,
                    rgba(100, 190, 255, 0.05) 60%,
                    transparent 100%
                );

            filter: blur(4px);
        }

        /*
         * Zweite Lichtbahn.
         */

        .haldo-orbit-secondary {
            position: absolute;

            width: 185px;
            height: 185px;

            border-radius: 50%;

            border:
                1px solid
                rgba(180, 110, 255, 0.10);

            transform:
                rotateX(64deg)
                rotateZ(55deg);

            animation:
                haldoOrbitReverse
                5.5s
                linear
                infinite;
        }

        /*
         * Kleine Lichtpunkte.
         */

        .haldo-energy-point {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 0 8px #ffffff,
                0 0 18px rgba(100, 190, 255, 0.9);

            animation:
                haldoEnergy
                2s
                ease-in-out
                infinite;
        }

        .haldo-energy-point.one {
            top: 20px;
            left: 42px;
        }

        .haldo-energy-point.two {
            right: 30px;
            top: 72px;

            animation-delay: 0.7s;
        }

        .haldo-energy-point.three {
            bottom: 26px;
            left: 72px;

            animation-delay: 1.2s;
        }

        .haldo-loading-title {
            margin: 0;

            color: #ffffff;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .haldo-loading-status {
            margin: 10px 0 0;

            color:
                rgba(210, 225, 255, 0.78);

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            font-size: 14px;
        }

        .haldo-loading-progress {
            width: 180px;
            height: 3px;

            margin:
                20px auto 0;

            overflow: hidden;

            border-radius: 999px;

            background:
                rgba(255, 255, 255, 0.08);
        }

        .haldo-loading-progress::after {
            content: "";

            display: block;

            width: 45%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #6bc8ff,
                    #ffffff,
                    #8a7cff
                );

            animation:
                haldoProgress
                1.5s
                ease-in-out
                infinite;
        }

        /*
         * System-Hauptbereich
         */

        .haldo-system-shell {
            position: relative;

            min-height: 100vh;

            width: 100%;

            opacity: 0;

            transition:
                opacity 0.8s ease;
        }

        .haldo-system-shell.ready {
            opacity: 1;
        }

        /*
         * Hauptkopf.
         */

        .haldo-system-header {
            position: relative;

            width: 100%;

            box-sizing: border-box;

            padding:
                18px
                20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            background:
                rgba(5, 8, 20, 0.72);

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.06);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);
        }

        .haldo-system-brand {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .haldo-system-brand img {
            width: 46px;
            height: 46px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(90, 170, 255, 0.55)
                );
        }

        .haldo-system-brand h1 {
            margin: 0;

            color: #ffffff;

            font-size: 18px;
            line-height: 1.2;
        }

        .haldo-system-brand p {
            margin: 3px 0 0;

            color:
                rgba(205, 220, 255, 0.58);

            font-size: 12px;
        }

        /*
         * Status-Anzeige.
         */

        .haldo-system-status {
            display: flex;

            align-items: center;

            gap: 8px;

            color:
                rgba(220, 235, 255, 0.72);

            font-size: 12px;
        }

        .haldo-status-light {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #7cff9b;

            box-shadow:
                0 0 8px
                rgba(124, 255, 155, 0.85);
        }

        /*
         * Launcher-Bereich.
         */

        #haldo-launcher {
            width: 100%;

            box-sizing: border-box;

            padding:
                20px;
        }

        /*
         * Falls index.css noch nicht vorhanden ist,
         * bleibt der Launcher trotzdem grundsätzlich
         * sichtbar.
         */

        .haldo-launcher {
            color: #ffffff;
        }

        .haldo-launcher-header {
            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;
        }

        .haldo-launcher-brand {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .haldo-launcher-logo {
            width: 54px;
            height: 54px;

            object-fit: contain;
        }

        .haldo-launcher-brand h1 {
            margin: 0;

            font-size: 25px;
        }

        .haldo-launcher-brand p {
            margin: 3px 0 0;

            opacity: 0.6;
        }

        .haldo-launcher-search {
            flex:
                1 1 280px;

            max-width: 430px;
        }

        .haldo-app-search-input {
            width: 100%;

            box-sizing: border-box;

            padding:
                13px
                16px;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 14px;

            outline: none;

            background:
                rgba(255, 255, 255, 0.055);

            color: #ffffff;

            font-size: 15px;
        }

        .haldo-app-search-input:focus {
            border-color:
                rgba(100, 190, 255, 0.55);

            box-shadow:
                0 0 0 3px
                rgba(70, 150, 255, 0.08);
        }

        .haldo-launcher-categories {
            display: flex;

            gap: 8px;

            overflow-x: auto;

            padding:
                4px 0 14px;
        }

        .haldo-category-button {
            flex: 0 0 auto;

            border: 0;

            padding:
                9px
                15px;

            border-radius: 999px;

            background:
                rgba(255, 255, 255, 0.06);

            color:
                rgba(230, 238, 255, 0.72);

            cursor: pointer;
        }

        .haldo-category-button.active {
            background:
                rgba(90, 170, 255, 0.20);

            color: #ffffff;
        }

        .haldo-launcher-section {
            margin:
                0 0 28px;
        }

        .haldo-launcher-section-title {
            margin:
                0 0 13px;

            font-size: 18px;
        }

        .haldo-app-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(130px, 1fr)
                );

            gap: 12px;
        }

        .haldo-app-card {
            position: relative;

            min-width: 0;
        }

        .haldo-app-launch {
            width: 100%;

            min-height: 130px;

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            border-radius: 18px;

            padding: 15px 10px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 10px;

            background:
                rgba(255, 255, 255, 0.045);

            color: #ffffff;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .haldo-app-launch:hover {
            transform:
                translateY(-3px);

            background:
                rgba(90, 170, 255, 0.10);

            border-color:
                rgba(100, 190, 255, 0.25);
        }

        .haldo-app-launch:active {
            transform:
                scale(0.97);
        }

        .haldo-app-icon-wrapper {
            width: 58px;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .haldo-app-icon {
            width: 52px;
            height: 52px;

            object-fit: contain;
        }

        .haldo-app-icon-fallback {
            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    rgba(90, 170, 255, 0.30),
                    rgba(130, 90, 255, 0.25)
                );

            border:
                1px solid
                rgba(120, 190, 255, 0.25);

            font-size: 21px;
            font-weight: 700;
        }

        .haldo-app-name {
            max-width: 100%;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 13px;
        }

        .haldo-app-favorite {
            position: absolute;

            top: 7px;
            right: 7px;

            width: 28px;
            height: 28px;

            border: 0;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.25);

            color:
                rgba(255, 255, 255, 0.85);

            cursor: pointer;
        }

        .haldo-launcher-empty {
            padding:
                60px
                20px;

            text-align: center;

            color:
                rgba(225, 235, 255, 0.70);
        }

        .haldo-empty-symbol {
            font-size: 40px;

            opacity: 0.35;
        }

        .haldo-visually-hidden {
            position: absolute;

            width: 1px;
            height: 1px;

            padding: 0;
            margin: -1px;

            overflow: hidden;

            clip: rect(
                0,
                0,
                0,
                0
            );

            white-space: nowrap;

            border: 0;
        }


        /* =====================================================
           ANIMATIONEN
           ===================================================== */

        @keyframes haldoGlowPulse {

            0%,
            100% {
                transform: scale(0.92);
                opacity: 0.55;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        @keyframes haldoOrbit {

            from {
                transform:
                    rotateX(64deg)
                    rotateZ(0deg);
            }

            to {
                transform:
                    rotateX(64deg)
                    rotateZ(360deg);
            }
        }

        @keyframes haldoOrbitReverse {

            from {
                transform:
                    rotateX(64deg)
                    rotateZ(360deg);
            }

            to {
                transform:
                    rotateX(64deg)
                    rotateZ(0deg);
            }
        }

        @keyframes haldoEnergy {

            0%,
            100% {
                opacity: 0.25;
                transform: scale(0.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        @keyframes haldoProgress {

            0% {
                transform:
                    translateX(-120%);
            }

            100% {
                transform:
                    translateX(420%);
            }
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (
            max-width: 600px
        ) {

            .haldo-system-header {
                padding:
                    13px
                    15px;
            }

            .haldo-system-status {
                display: none;
            }

            #haldo-launcher {
                padding:
                    15px;
            }

            .haldo-launcher-brand h1 {
                font-size: 21px;
            }

            .haldo-app-grid {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

                gap: 8px;
            }

            .haldo-app-launch {
                min-height: 112px;

                padding:
                    10px 6px;

                border-radius: 15px;
            }

            .haldo-app-icon-wrapper,
            .haldo-app-icon {
                width: 46px;
                height: 46px;
            }

            .haldo-app-name {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         STARTUP / LOGO INTRO
         ===================================================== -->

    <div
        id="haldo-loading-screen"
        class="haldo-loading-screen"
        aria-live="polite"
    >

        <div class="haldo-loading-content">

            <div
                class="haldo-logo-stage"

            >

                <div
                    class="haldo-logo-glow"

                ></div>


                <!-- Erste Lichtbahn -->

                <div
                    class="haldo-orbit"
                    aria-hidden="true"
                ></div>


                <!-- Zweite Lichtbahn -->

                <div
                    class="haldo-orbit-secondary"
                    aria-hidden="true"
                ></div>


                <!-- Energiepunkte -->

                <span
                    class="haldo-energy-point one"
                    aria-hidden="true"
                ></span>

                <span
                    class="haldo-energy-point two"
                    aria-hidden="true"
                ></span>

                <span
                    class="haldo-energy-point three"
                    aria-hidden="true"
                ></span>


                <!-- =================================================
                     WICHTIG:
                     DAS LOGO SELBST DREHT SICH NICHT.
                     ================================================= -->

                <img
                    src="assets/logo/logo.png"
                    class="haldo-logo-image"
                    alt="HalDo AI Logo"
                    draggable="false"
                >

            </div>


            <h1
                class="haldo-loading-title"
                id="haldo-loading-title"
            >
                HalDo AI
            </h1>


            <p
                class="haldo-loading-status"
                id="haldo-loading-status"
            >
                HalDo AI OS 18 wird gestartet...
            </p>


            <div
                class="haldo-loading-progress"
                aria-hidden="true"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         HAUPT-SYSTEM
         ===================================================== -->

    <div
        id="haldo-system-shell"
        class="haldo-system-shell"
    >

        <!-- =================================================
             SYSTEM HEADER
             ================================================= -->

        <header
            class="haldo-system-header"
        >

            <div
                class="haldo-system-brand"
            >

                <img
                    src="assets/logo/logo.png"
                    alt="HalDo AI"
                    draggable="false"
                >

                <div>

                    <h1>
                        HalDo AI OS 18
                    </h1>

                    <p>
                        Professional Ultimate Foundation
                    </p>

                </div>

            </div>


            <div
                class="haldo-system-status"
                id="haldo-system-status"
            >

                <span
                    class="haldo-status-light"
                    id="haldo-status-light"
                ></span>

                <span
                    id="haldo-status-text"
                >
                    System wird gestartet
                </span>

            </div>

        </header>


        <!-- =================================================
             APP LAUNCHER

             Der Launcher wird durch launcher.js
             automatisch mit den Apps aus apps.json
             gefüllt.
             ================================================= -->

        <main
            id="haldo-launcher"
            class="haldo-launcher"
            data-haldo-launcher="true"
        >

            <div
                class="haldo-launcher-content"
            >

                <p>
                    Apps werden geladen...
                </p>

            </div>

        </main>

    </div>


    <!-- =====================================================
         SYSTEM STARTUP
         ===================================================== -->

    <script>

        (function () {

            "use strict";


            const loadingScreen =
                document.getElementById(
                    "haldo-loading-screen"
                );

            const systemShell =
                document.getElementById(
                    "haldo-system-shell"
                );

            const loadingStatus =
                document.getElementById(
                    "haldo-loading-status"
                );

            const statusText =
                document.getElementById(
                    "haldo-status-text"
                );


            /*
             * Statusfunktion
             */

            window.HalDoStartup = {

                setStatus: function (message) {

                    if (loadingStatus) {

                        loadingStatus.textContent =
                            message;

                    }

                    if (statusText) {

                        statusText.textContent =
                            message;

                    }

                },

                showSystem: function () {

                    if (loadingScreen) {

                        loadingScreen.classList.add(
                            "hidden"
                        );

                    }

                    if (systemShell) {

                        systemShell.classList.add(
                            "ready"
                        );

                    }

                }

            };


            /*
             * Startmeldungen.
             */

            window.HalDoStartup.setStatus(
                "HalDo AI Kern wird vorbereitet..."
            );


            /*
             * Kurzer visueller Start,
             * damit das Logo sichtbar präsentiert
             * werden kann.
             */

            window.setTimeout(
                function () {

                    window.HalDoStartup.setStatus(
                        "HalDo AI Module werden geladen..."
                    );

                },
                650
            );


            window.setTimeout(
                function () {

                    window.HalDoStartup.setStatus(
                        "HalDo AI Apps werden vorbereitet..."
                    );

                },
                1200
            );


            /*
             * Sicherheits-Fallback:
             *
             * Falls ein Modul einen Fehler hat,
             * bleibt die Seite nicht komplett schwarz.
             */

            window.setTimeout(
                function () {

                    if (
                        !systemShell.classList.contains(
                            "ready"
                        )
                    ) {

                        window.HalDoStartup.setStatus(
                            "HalDo AI OS 18 ist bereit."
                        );

                        window.HalDoStartup.showSystem();

                    }

                },
                5000
            );

        })();

    </script>


    <!-- =====================================================
         HALDO SYSTEM MODULE
         ===================================================== -->

    <!-- 1. Kernel -->

    <script
        src="js/kernel.js"
        defer
    ></script>


    <!-- 2. App Manager -->

    <script
        src="js/app-manager.js"
        defer
    ></script>


    <!-- 3. Launcher -->

    <script
        src="js/launcher.js"
        defer
    ></script>


    <!-- =====================================================
         VERBINDUNGS-BRIDGE

         Diese kleine Schicht verbindet die drei Module
         und sorgt dafür, dass der Startbildschirm erst
         verschwindet, wenn der App Manager bereit ist.
         ===================================================== -->

    <script>

        (function () {

            "use strict";


            function connect() {

                /*
                 * App Manager noch nicht geladen?
                 */

                if (
                    !window.HalDoAppManager
                ) {

                    window.setTimeout(
                        connect,
                        100
                    );

                    return;
                }


                /*
                 * App Manager ist vorhanden.
                 */

                if (
                    window.HalDoStartup
                ) {

                    window.HalDoStartup.setStatus(
                        "HalDo AI App-System ist bereit."
                    );

                }


                /*
                 * Auf Launcher warten.
                 */

                const waitForLauncher =
                    function () {

                        if (
                            window.HalDoLauncher &&
                            window.HalDoLauncher.getState &&
                            window.HalDoLauncher
                                .getState()
                                .ready
                        ) {

                            if (
                                window.HalDoStartup
                            ) {

                                window.HalDoStartup.setStatus(
                                    "HalDo AI OS 18 ist bereit."
                                );

                                window.HalDoStartup.showSystem();

                            }

                            return;
                        }

                        window.setTimeout(
                            waitForLauncher,
                            100
                        );

                    };


                waitForLauncher();

            }


            /*
             * DOM ready
             */

            if (
                document.readyState ===
                "loading"
            ) {

                document.addEventListener(
                    "DOMContentLoaded",
                    connect,
                    {
                        once: true
                    }
                );

            } else {

                connect();

            }

        })();

    </script>


</body>

</html>
