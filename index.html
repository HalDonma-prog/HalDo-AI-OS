/* =========================================================
   REQUEST AI
   ========================================================= */

HD6.aiChat.request =
    async function(
        chatId,
        text,
        context = {}
    ) {

        const input =
            String(
                text ||
                ""
            )
            .trim();


        if (!input) {

            return "";

        }


        const state =
            this.getState(
                chatId
            );


        state.processing =
            true;

        state.error =
            null;


        this.addMessage(
            chatId,
            "user",
            input
        );


        HD6.emit(
            "ai-chat:processing",
            {
                chatId:
                    chatId,

                processing:
                    true
            }
        );


        let response =
            null;


        try {

            /*
             * Bevorzugte AI-Schnittstellen.
             * Es wird nichts erfunden:
             * Nur tatsächlich vorhandene Methoden
             * werden angesprochen.
             */

            if (
                HD6.ai &&
                typeof HD6.ai.respond ===
                    "function"
            ) {

                response =
                    await HD6.ai.respond(
                        input,
                        {
                            chatId:
                                chatId,

                            context:
                                context,

                            history:
                                state.messages
                        }
                    );

            }


            if (
                response == null &&
                HD6.aiCore &&
                typeof HD6.aiCore.respond ===
                    "function"
            ) {

                response =
                    await HD6.aiCore.respond(
                        input,
                        {
                            chatId:
                                chatId,

                            context:
                                context,

                            history:
                                state.messages
                        }
                    );

            }


            if (
                response == null &&
                HD6.aiEngine &&
                typeof HD6.aiEngine.respond ===
                    "function"
            ) {

                response =
                    await HD6.aiEngine.respond(
                        input,
                        {
                            chatId:
                                chatId,

                            context:
                                context,

                            history:
                                state.messages
                        }
                    );

            }


            if (
                response == null
            ) {

                response =
                    this.localResponse(
                        input
                    );

            }


            if (
                typeof response ===
                    "object"
            ) {

                response =
                    response.text ||
                    response.message ||
                    response.content ||
                    JSON.stringify(
                        response
                    );

            }


            response =
                String(
                    response ||
                    ""
                );

        }

        catch (error) {

            console.error(
                "HalDo AI:",
                error
            );


            state.error =
                error;


            response =
                "Entschuldigung, bei der Verarbeitung " +
                "ist gerade ein Fehler aufgetreten. " +
                "Die lokale HalDo-AI-Funktion bleibt verfügbar.";

        }


        this.addMessage(
            chatId,
            "assistant",
            response
        );


        state.lastResponse =
            response;

        state.processing =
            false;


        this.save(
            chatId
        );


        HD6.emit(
            "ai-chat:response",
            {
                chatId:
                    chatId,

                response:
                    response
            }
        );


        HD6.emit(
            "ai-chat:processing",
            {
                chatId:
                    chatId,

                processing:
                    false
            }
        );


        return response;

    };


/* =========================================================
   CREATE CHAT APP
   ========================================================= */

HD6.aiChat.createApp =
    function(
        container,
        options = {}
    ) {

        if (
            !container
        ) {

            return null;

        }


        const chatId =
            options.chatId ||
            "main";


        const state =
            this.load(
                chatId
            );


        container.innerHTML =
            "";


        const app =
            document.createElement(
                "div"
            );


        app.className =
            "haldo-ai-chat-app";


        app.innerHTML = `

            <div class="haldo-ai-chat-header">

                <div class="haldo-ai-avatar">

                    <img
                        src="assets/logo/logo.png"
                        alt="HalDo AI"
                        onerror="this.style.display='none'"
                    >

                    <span class="haldo-ai-avatar-fallback">
                        H
                    </span>

                </div>

                <div class="haldo-ai-chat-title">

                    <strong>
                        HalDo AI
                    </strong>

                    <span>
                        Intelligent Conversation
                    </span>

                </div>

                <div class="haldo-ai-chat-actions">

                    <button
                        type="button"
                        data-chat-action="voice"
                        title="Vorlesen"
                    >
                        🔊
                    </button>

                    <button
                        type="button"
                        data-chat-action="clear"
                        title="Chat löschen"
                    >
                        🗑️
                    </button>

                </div>

            </div>


            <div
                class="haldo-ai-chat-messages"
                data-chat-messages
            ></div>


            <div
                class="haldo-ai-chat-status"
                data-chat-status
            >
                <span></span>
                <span data-chat-status-text>
                    Bereit
                </span>
            </div>


            <form
                class="haldo-ai-chat-composer"
                data-chat-form
            >

                <textarea
                    data-chat-input
                    rows="2"
                    maxlength="12000"
                    placeholder="Schreibe HalDo AI etwas …"
                    autocomplete="off"
                ></textarea>

                <button
                    type="submit"
                    class="haldo-ai-send-button"
                    data-chat-send
                >
                    Senden
                </button>

            </form>

        `;


        container.appendChild(
            app
        );


        const messages =
            app.querySelector(
                "[data-chat-messages]"
            );


        const input =
            app.querySelector(
                "[data-chat-input]"
            );


        const form =
            app.querySelector(
                "[data-chat-form]"
            );


        const statusText =
            app.querySelector(
                "[data-chat-status-text]"
            );


        const status =
            app.querySelector(
                ".haldo-ai-chat-status"
            );


        const render =
            () => {

                messages.innerHTML =
                    "";


                if (
                    !state.messages.length
                ) {

                    const welcome =
                        document.createElement(
                            "div"
                        );


                    welcome.className =
                        "haldo-ai-welcome";


                    welcome.innerHTML = `

                        <div class="welcome-logo">
                            <img
                                src="assets/logo/logo.png"
                                alt="HalDo AI"
                                onerror="this.style.display='none'"
                            >
                            <span>H</span>
                        </div>

                        <h3>
                            Willkommen bei HalDo AI ❤️
                        </h3>

                        <p>
                            Schreib mir einfach.
                            Wir können uns unterhalten,
                            Fragen beantworten, Texte schreiben,
                            lernen, planen und gemeinsam arbeiten.
                        </p>

                    `;


                    messages.appendChild(
                        welcome
                    );

                    return;

                }


                state.messages.forEach(
                    message => {

                        const row =
                            document.createElement(
                                "div"
                            );


                        row.className =
                            "haldo-ai-message-row " +
                            (
                                message.role ===
                                "user"
                                    ? "user"
                                    : "assistant"
                            );


                        const bubble =
                            document.createElement(
                                "div"
                            );


                        bubble.className =
                            "haldo-ai-message-bubble";


                        bubble.textContent =
                            message.content;


                        row.appendChild(
                            bubble
                        );


                        messages.appendChild(
                            row
                        );

                    }
                );


                messages.scrollTop =
                    messages.scrollHeight;

            };


        const setStatus =
            (
                active,
                text
            ) => {

                status.classList.toggle(
                    "active",
                    active
                );


                statusText.textContent =
                    text ||
                    (
                        active
                            ? "HalDo AI denkt …"
                            : "Bereit"
                    );

            };


        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const text =
                    input.value.trim();


                if (
                    !text ||
                    state.processing
                ) {

                    return;

                }


                input.value =
                    "";


                render();


                setStatus(
                    true,
                    "HalDo AI verarbeitet …"
                );


                try {

                    await this.request(
                        chatId,
                        text,
                        {
                            source:
                                "HalDo AI Chat"
                        }
                    );

                }

                finally {

                    render();

                    setStatus(
                        false,
                        "Bereit"
                    );

                    input.focus();

                }

            }
        );


        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    form.requestSubmit();

                }

            }
        );


        app.querySelector(
            '[data-chat-action="clear"]'
        )
        .addEventListener(
            "click",
            () => {

                this.clear(
                    chatId
                );

                render();

                input.focus();

            }
        );


        app.querySelector(
            '[data-chat-action="voice"]'
        )
        .addEventListener(
            "click",
            async () => {

                const last =
                    [...state.messages]
                        .reverse()
                        .find(
                            message =>
                                message.role ===
                                "assistant"
                        );


                if (
                    !last
                ) {

                    return;

                }


                state.speaking =
                    true;


                setStatus(
                    true,
                    "HalDo AI spricht …"
                );


                try {

                    await this.speak(
                        last.content
                    );

                }

                finally {

                    state.speaking =
                        false;


                    setStatus(
                        false,
                        "Bereit"
                    );

                }

            }
        );


        this.instances.set(
            chatId,
            state
        );


        render();


        input.focus();


        HD6.emit(
            "ai-chat:ready",
            {
                chatId:
                    chatId,

                container:
                    container
            }
        );


        return {

            app:
                app,

            state:
                state,

            send:
                text =>
                    this.request(
                        chatId,
                        text
                    ),

            clear:
                () =>
                    this.clear(
                        chatId
                    ),

            speak:
                text =>
                    this.speak(
                        text
                    )

        };

    };


/* =========================================================
   CONNECT AI CHAT TO APP UI
   ========================================================= */

HD6.aiChat.mountIntoApp =
    function(
        app,
        content
    ) {

        if (
            !content
        ) {

            return null;

        }


        return this.createApp(
            content,
            {
                chatId:
                    app?.id ||
                    "haldo-ai"
            }
        );

    };


/* =========================================================
   REGISTER SERVICE
   ========================================================= */

if (
    HD6.runtime &&
    typeof HD6.runtime.register ===
        "function"
) {

    HD6.runtime.register(
        "ai-chat",
        HD6.aiChat
    );

}


if (
    HD6.services &&
    typeof HD6.services.register ===
        "function"
) {

    HD6.services.register(
        "ai-chat",
        HD6.aiChat
    );

}


/* =========================================================
   AI APP REGISTRATION
   ========================================================= */

if (
    HD6.appRegistry &&
    typeof HD6.appRegistry.register ===
        "function"
) {

    try {

        HD6.appRegistry.register(
            {
                id:
                    "haldo-ai",

                name:
                    "HalDo AI",

                manifest:
                    {
                        icon:
                            "☀️",

                        description:
                            "Lebendige zentrale HalDo AI für intelligente Unterhaltung, Schreiben, Antworten und Hilfe.",

                        category:
                            "AI",

                        capabilities:
                            [
                                "chat",
                                "conversation",
                                "writing",
                                "answers",
                                "voice",
                                "memory",
                                "language"
                            ]
                    },

                open:
                    function(
                        context
                    ) {

                        return HD6.aiChat
                            .mountIntoApp(
                                context?.app ||
                                {
                                    id:
                                        "haldo-ai"
                                },

                                context?.content ||
                                context?.container
                            );

                    }

            }
        );

    }

    catch (error) {

        console.warn(
            "HalDo AI Registrierung:",
            error
        );

    }

}

<script>
"use strict";

window.HalDo = window.HalDo || {};

const HD7 = window.HalDo;


/* =========================================================
   APP SYSTEM
   ========================================================= */

HD7.apps =
    HD7.apps ||
    {};

HD7.apps.registry =
    HD7.apps.registry ||
    new Map();

HD7.apps.running =
    HD7.apps.running ||
    new Map();


/* =========================================================
   REGISTER APP
   ========================================================= */

HD7.apps.register =
    function(app) {

        if (!app || !app.id) {
            return false;
        }

        const normalized = {

            id:
                String(app.id),

            name:
                app.name ||
                app.id,

            icon:
                app.icon ||
                "●",

            category:
                app.category ||
                "System",

            description:
                app.description ||
                "",

            version:
                app.version ||
                "22.0.0",

            state:
                app.state ||
                {},

            open:
                typeof app.open === "function"
                    ? app.open
                    : null,

            close:
                typeof app.close === "function"
                    ? app.close
                    : null,

            render:
                typeof app.render === "function"
                    ? app.render
                    : null,

            settings:
                app.settings ||
                {},

            capabilities:
                Array.isArray(app.capabilities)
                    ? app.capabilities
                    : []

        };


        this.registry.set(
            normalized.id,
            normalized
        );


        HD7.emit?.(
            "app:registered",
            normalized
        );


        return normalized;
    };


/* =========================================================
   GET APP
   ========================================================= */

HD7.apps.get =
    function(id) {

        return this.registry.get(
            String(id)
        ) || null;

    };


/* =========================================================
   LIST APPS
   ========================================================= */

HD7.apps.list =
    function() {

        return Array.from(
            this.registry.values()
        );

    };


/* =========================================================
   WINDOW SYSTEM
   ========================================================= */

HD7.windows =
    HD7.windows ||
    {};

HD7.windows.instances =
    HD7.windows.instances ||
    new Map();


HD7.windows.zIndex =
    Number(
        HD7.windows.zIndex ||
        100
    );


/* =========================================================
   WINDOW SIZE
   ========================================================= */

HD7.windows.calculateSize =
    function() {

        const width =
            window.innerWidth ||
            1024;

        const height =
            window.innerHeight ||
            768;


        let w =
            Math.min(
                720,
                Math.max(
                    300,
                    width * .72
                )
            );


        let h =
            Math.min(
                560,
                Math.max(
                    300,
                    height * .68
                )
            );


        if (width < 600) {

            w =
                Math.min(
                    width - 24,
                    500
                );

            h =
                Math.min(
                    height - 110,
                    620
                );

        }


        return {
            width:
                Math.max(
                    280,
                    w
                ),

            height:
                Math.max(
                    260,
                    h
                )
        };

    };


/* =========================================================
   WINDOW HOST
   ========================================================= */

HD7.windows.getHost =
    function() {

        let host =
            document.querySelector(
                "#haldo-window-host"
            );


        if (host) {
            return host;
        }


        host =
            document.createElement(
                "div"
            );


        host.id =
            "haldo-window-host";


        document.body.appendChild(
            host
        );


        return host;

    };


/* =========================================================
   OPEN WINDOW
   ========================================================= */

HD7.windows.open =
    function(
        app,
        options = {}
    ) {

        if (!app) {
            return null;
        }


        const appId =
            typeof app === "string"
                ? app
                : app.id;


        const definition =
            this.apps?.get?.(
                appId
            ) ||
            HD7.apps.get(
                appId
            );


        if (!definition) {

            console.warn(
                "HalDo App nicht gefunden:",
                appId
            );

            return null;

        }


        const existing =
            this.instances.get(
                appId
            );


        if (
            existing &&
            existing.element
        ) {

            existing.element.classList.remove(
                "haldo-window-hidden"
            );

            this.focus(
                existing
            );

            return existing;

        }


        const size =
            this.calculateSize();


        const windowId =
            "window-" +
            appId +
            "-" +
            Date.now();


        const win =
            document.createElement(
                "section"
            );


        win.className =
            "haldo-window";


        win.dataset.windowId =
            windowId;


        win.dataset.appId =
            appId;


        win.style.width =
            `${size.width}px`;


        win.style.height =
            `${size.height}px`;


        win.style.zIndex =
            ++this.zIndex;


        const offset =
            this.instances.size % 5;


        win.style.left =
            `calc(50% + ${offset * 14}px)`;


        win.style.top =
            `calc(50% + ${offset * 12}px)`;


        win.innerHTML = `

            <div class="haldo-window-bar">

                <div class="haldo-window-title">

                    <span class="haldo-window-icon">
                        ${definition.icon}
                    </span>

                    <span>
                        ${this.escape(
                            definition.name
                        )}
                    </span>

                </div>


                <div class="haldo-window-controls">

                    <button
                        type="button"
                        data-window-minimize
                        title="Minimieren"
                    >
                        −
                    </button>

                    <button
                        type="button"
                        data-window-maximize
                        title="Maximieren"
                    >
                        □
                    </button>

                    <button
                        type="button"
                        data-window-close
                        title="Schließen"
                    >
                        ×
                    </button>

                </div>

            </div>


            <div class="haldo-window-body">

                <div class="haldo-app-toolbar">

                    <div class="haldo-app-heading">

                        <strong>
                            ${this.escape(
                                definition.name
                            )}
                        </strong>

                        <small>
                            ${this.escape(
                                definition.description
                            )}
                        </small>

                    </div>

                </div>


                <div
                    class="haldo-app-content"
                    data-app-content
                ></div>

            </div>

        `;


        const host =
            this.getHost();


        host.appendChild(
            win
        );


        const instance = {

            id:
                windowId,

            appId:
                appId,

            element:
                win,

            definition:
                definition,

            minimized:
                false,

            maximized:
                false,

            previous:
                {
                    width:
                        `${size.width}px`,

                    height:
                        `${size.height}px`,

                    left:
                        win.style.left,

                    top:
                        win.style.top
                }

        };


        this.instances.set(
            appId,
            instance
        );


        this.attachControls(
            instance
        );


        this.renderApp(
            instance
        );


        this.focus(
            instance
        );


        HD7.emit?.(
            "window:opened",
            instance
        );


        HD7.emit?.(
            "app:opened",
            {
                appId:
                    appId,

                window:
                    instance
            }
        );


        return instance;

    };


/* =========================================================
   RENDER APP
   ========================================================= */

HD7.windows.renderApp =
    function(
        instance
    ) {

        if (!instance) {
            return;
        }


        const content =
            instance.element.querySelector(
                "[data-app-content]"
            );


        if (!content) {
            return;
        }


        content.innerHTML =
            "";


        if (
            typeof instance.definition.render ===
            "function"
        ) {

            try {

                instance.definition.render(
                    content,
                    instance
                );

                return;

            }

            catch (error) {

                console.error(
                    "HalDo App Render Error:",
                    instance.appId,
                    error
                );


                this.showError(
                    content,
                    error
                );

                return;

            }

        }


        if (
            typeof instance.definition.open ===
            "function"
        ) {

            try {

                instance.definition.open(
                    {
                        content:
                            content,

                        window:
                            instance,

                        app:
                            instance.definition
                    }
                );

                return;

            }

            catch (error) {

                console.error(
                    "HalDo App Open Error:",
                    instance.appId,
                    error
                );


                this.showError(
                    content,
                    error
                );

                return;

            }

        }


        this.renderGenericApp(
            content,
            instance.definition
        );

    };


/* =========================================================
   GENERIC APP FOUNDATION
   ========================================================= */

HD7.windows.renderGenericApp =
    function(
        content,
        definition
    ) {

        content.innerHTML = `

            <div class="haldo-generic-app">

                <div class="haldo-generic-icon">
                    ${definition.icon}
                </div>

                <h2>
                    ${this.escape(
                        definition.name
                    )}
                </h2>

                <p>
                    ${this.escape(
                        definition.description ||
                        "HalDo AI OS 22 Anwendung"
                    )}
                </p>

                <div class="haldo-generic-actions">

                    <button
                        type="button"
                        data-generic-action="start"
                    >
                        Öffnen
                    </button>

                    <button
                        type="button"
                        data-generic-action="settings"
                    >
                        Einstellungen
                    </button>

                </div>

                <div
                    class="haldo-generic-status"
                    data-generic-status
                >
                    Bereit

                </div>

            </div>

        `;


        const start =
            content.querySelector(
                '[data-generic-action="start"]'
            );


        const settings =
            content.querySelector(
                '[data-generic-action="settings"]'
            );


        const status =
            content.querySelector(
                "[data-generic-status]"
            );


        start?.addEventListener(
            "click",
            () => {

                status.textContent =
                    definition.name +
                    " ist geöffnet.";

                HD7.emit?.(
                    "app:action",
                    {
                        appId:
                            definition.id,

                        action:
                            "start"
                    }
                );

            }
        );


        settings?.addEventListener(
            "click",
            () => {

                status.textContent =
                    "App-Einstellungen geöffnet.";

                HD7.emit?.(
                    "app:settings",
                    {
                        appId:
                            definition.id
                    }
                );

            }
        );

    };


/* =========================================================
   WINDOW CONTROLS
   ========================================================= */

HD7.windows.attachControls =
    function(
        instance
    ) {

        const element =
            instance.element;


        element.addEventListener(
            "pointerdown",
            () => {

                this.focus(
                    instance
                );

            },
            {
                passive:
                    true
            }
        );


        element.querySelector(
            "[data-window-close]"
        )
        ?.addEventListener(
            "click",
            event => {

                event.preventDefault();

                event.stopPropagation();

                this.close(
                    instance.appId
                );

            }
        );


        element.querySelector(
            "[data-window-minimize]"
        )
        ?.addEventListener(
            "click",
            event => {

                event.preventDefault();

                event.stopPropagation();

                this.minimize(
                    instance
                );

            }
        );


        element.querySelector(
            "[data-window-maximize]"
        )
        ?.addEventListener(
            "click",
            event => {

                event.preventDefault();

                event.stopPropagation();

                this.toggleMaximize(
                    instance
                );

            }
        );


        this.makeDraggable(
            instance
        );

        this.makeResizable(
            instance
        );

    };


/* =========================================================
   CLOSE
   ========================================================= */

HD7.windows.close =
    function(
        appId
    ) {

        const instance =
            typeof appId === "object"
                ? appId
                : this.instances.get(
                    appId
                );


        if (!instance) {
            return false;
        }


        try {

            if (
                typeof instance.definition.close ===
                "function"
            ) {

                instance.definition.close(
                    instance
                );

            }

        }

        catch (error) {

            console.warn(
                "HalDo App Close Error:",
                error
            );

        }


        instance.element.remove();


        this.instances.delete(
            instance.appId
        );


        HD7.emit?.(
            "window:closed",
            instance
        );


        HD7.emit?.(
            "app:closed",
            {
                appId:
                    instance.appId
            }
        );


        return true;

    };


/* =========================================================
   MINIMIZE
   ========================================================= */

HD7.windows.minimize =
    function(
        instance
    ) {

        if (!instance) {
            return;
        }


        instance.minimized =
            true;


        instance.element.classList.add(
            "haldo-window-minimized"
        );


        HD7.emit?.(
            "window:minimized",
            instance
        );

    };


/* =========================================================
   RESTORE
   ========================================================= */

HD7.windows.restore =
    function(
        instance
    ) {

        if (!instance) {
            return;
        }


        instance.minimized =
            false;


        instance.element.classList.remove(
            "haldo-window-minimized"
        );


        this.focus(
            instance
        );


        HD7.emit?.(
            "window:restored",
            instance
        );

    };


/* =========================================================
   MAXIMIZE
   ========================================================= */

HD7.windows.toggleMaximize =
    function(
        instance
    ) {

        if (!instance) {
            return;
        }


        if (
            instance.maximized
        ) {

            instance.element.style.width =
                instance.previous.width;

            instance.element.style.height =
                instance.previous.height;

            instance.element.style.left =
                instance.previous.left;

            instance.element.style.top =
                instance.previous.top;


            instance.maximized =
                false;

            return;

        }


        instance.previous = {

            width:
                instance.element.style.width,

            height:
                instance.element.style.height,

            left:
                instance.element.style.left,

            top:
                instance.element.style.top

        };


        instance.element.style.width =
            "min(92vw, 1000px)";


        instance.element.style.height =
            "min(84vh, 760px)";


        instance.element.style.left =
            "50%";


        instance.element.style.top =
            "50%";


        instance.maximized =
            true;


        this.focus(
            instance
        );

    };


/* =========================================================
   FOCUS
   ========================================================= */

HD7.windows.focus =
    function(
        instance
    ) {

        if (!instance) {
            return;
        }


        instance.element.style.zIndex =
            ++this.zIndex;


        HD7.emit?.(
            "window:focus",
            instance
        );

    };


/* =========================================================
   DRAGGING
   ========================================================= */

HD7.windows.makeDraggable =
    function(
        instance
    ) {

        const element =
            instance.element;


        const bar =
            element.querySelector(
                ".haldo-window-bar"
            );


        if (!bar) {
            return;
        }


        let dragging =
            false;

        let startX =
            0;

        let startY =
            0;

        let startLeft =
            0;

        let startTop =
            0;


        bar.addEventListener(
            "pointerdown",
            event => {

                if (
                    event.target.closest(
                        ".haldo-window-controls"
                    )
                ) {

                    return;

                }


                if (
                    instance.maximized
                ) {

                    return;

                }


                dragging =
                    true;


                this.focus(
                    instance
                );


                const rect =
                    element.getBoundingClientRect();


                startX =
                    event.clientX;

                startY =
                    event.clientY;

                startLeft =
                    rect.left;

                startTop =
                    rect.top;


                element.setPointerCapture(
                    event.pointerId
                );


                event.preventDefault();

            }
        );


        bar.addEventListener(
            "pointermove",
            event => {

                if (!dragging) {
                    return;
                }


                const dx =
                    event.clientX -
                    startX;


                const dy =
                    event.clientY -
                    startY;


                let left =
                    startLeft +
                    dx;


                let top =
                    startTop +
                    dy;


                const margin =
                    8;


                left =
                    Math.max(
                        margin,
                        Math.min(
                            left,
                            window.innerWidth -
                            element.offsetWidth -
                            margin
                        )
                    );


                top =
                    Math.max(
                        margin,
                        Math.min(
                            top,
                            window.innerHeight -
                            60 -
                            margin
                        )
                    );


                element.style.left =
                    `${left}px`;


                element.style.top =
                    `${top}px`;

            }
        );


        bar.addEventListener(
            "pointerup",
            event => {

                dragging =
                    false;


                try {

                    element.releasePointerCapture(
                        event.pointerId
                    );

                }

                catch (_) {}

            }
        );

    };


/* =========================================================
   RESIZING
   ========================================================= */

HD7.windows.makeResizable =
    function(
        instance
    ) {

        const element =
            instance.element;


        const grip =
            document.createElement(
                "div"
            );


        grip.className =
            "haldo-window-resize-grip";


        element.appendChild(
            grip
        );


        let resizing =
            false;

        let startX =
            0;

        let startY =
            0;

        let startWidth =
            0;

        let startHeight =
            0;


        grip.addEventListener(
            "pointerdown",
            event => {

                if (
                    instance.maximized
                ) {

                    return;

                }


                resizing =
                    true;


                startX =
                    event.clientX;

                startY =
                    event.clientY;

                startWidth =
                    element.offsetWidth;

                startHeight =
                    element.offsetHeight;


                element.setPointerCapture(
                    event.pointerId
                );


                event.preventDefault();

            }
        );


        grip.addEventListener(
            "pointermove",
            event => {

                if (!resizing) {
                    return;
                }


                const width =
                    Math.max(
                        280,
                        Math.min(
                            startWidth +
                            (
                                event.clientX -
                                startX
                            ),
                            window.innerWidth -
                            20
                        )
                    );


                const height =
                    Math.max(
                        260,
                        Math.min(
                            startHeight +
                            (
                                event.clientY -
                                startY
                            ),
                            window.innerHeight -
                            80
                        )
                    );


                element.style.width =
                    `${width}px`;


                element.style.height =
                    `${height}px`;

            }
        );


        grip.addEventListener(
            "pointerup",
            event => {

                resizing =
                    false;


                try {

                    element.releasePointerCapture(
                        event.pointerId
                    );

                }

                catch (_) {}

            }
        );

    };


/* =========================================================
   ERROR DISPLAY
   ========================================================= */

HD7.windows.showError =
    function(
        content,
        error
    ) {

        content.innerHTML = `

            <div class="haldo-app-error">

                <div>
                    ⚠️
                </div>

                <h3>
                    App konnte nicht geöffnet werden
                </h3>

                <p>
                    ${this.escape(
                        error?.message ||
                        "Unbekannter Fehler"
                    )}
                </p>

                <button
                    type="button"
                    data-error-retry
                >
                    Erneut versuchen
                </button>

            </div>

        `;


        content.querySelector(
            "[data-error-retry]"
        )
        ?.addEventListener(
            "click",
            () => {

                const windowElement =
                    content.closest(
                        ".haldo-window"
                    );


                const appId =
                    windowElement?.dataset.appId;


                const instance =
                    this.instances.get(
                        appId
                    );


                if (instance) {

                    this.renderApp(
                        instance
                    );

                }

            }
        );

    };


/* =========================================================
   ESCAPE HTML
   ========================================================= */

HD7.windows.escape =
    function(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    };


/* =========================================================
   GLOBAL ESCAPE ALIAS
   ========================================================= */

HD7.escape =
    HD7.escape ||
    HD7.windows.escape.bind(
        HD7.windows
    );


/* =========================================================
   BRIDGE TO APP MANAGER
   ========================================================= */

if (
    HD7.appManager
) {

    if (
        typeof HD7.appManager.register ===
        "function"
    ) {

        HD7.apps.list()
            .forEach(
                app => {

                    try {

                        HD7.appManager.register(
                            app
                        );

                    }

                    catch (_) {}

                }
            );

    }

}


/* =========================================================
   BRIDGE TO ROUTER
   ========================================================= */

if (
    HD7.router
) {

    if (
        typeof HD7.router.on ===
        "function"
    ) {

        HD7.router.on(
            "app",
            route => {

                if (
                    route &&
                    route.app
                ) {

                    HD7.windows.open(
                        route.app
                    );

                }

            }
        );

    }

}


/* =========================================================
   RESPONSIVE WINDOW UPDATE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        HD7.windows.instances
            .forEach(
                instance => {

                    if (
                        instance.maximized
                    ) {
                        return;
                    }


                    const rect =
                        instance.element
                            .getBoundingClientRect();


                    const maxLeft =
                        window.innerWidth -
                        instance.element.offsetWidth -
                        8;


                    const maxTop =
                        window.innerHeight -
                        instance.element.offsetHeight -
                        55;


                    if (
                        rect.left >
                        maxLeft
                    ) {

                        instance.element.style.left =
                            `${Math.max(
                                8,
                                maxLeft
                            )}px`;

                    }


                    if (
                        rect.top >
                        maxTop
                    ) {

                        instance.element.style.top =
                            `${Math.max(
                                8,
                                maxTop
                            )}px`;

                    }

                }
            );

    },
    {
        passive:
            true
    }
);

<script>
"use strict";

window.HalDo = window.HalDo || {};

const HD8 = window.HalDo;


/* =========================================================
   SHARED APP STATE
   ========================================================= */

HD8.appState =
    HD8.appState ||
    new Map();


HD8.getAppState =
    function(appId) {

        const id =
            String(appId);


        if (
            !HD8.appState.has(id)
        ) {

            HD8.appState.set(
                id,
                {

                    appId:
                        id,

                    initialized:
                        false,

                    activeView:
                        "home",

                    history:
                        [],

                    data:
                        {},

                    settings:
                        {},

                    errors:
                        [],

                    lastAction:
                        null,

                    updatedAt:
                        Date.now()

                }
            );

        }


        return HD8.appState.get(id);

    };


/* =========================================================
   UPDATE APP STATE
   ========================================================= */

HD8.updateAppState =
    function(
        appId,
        patch
    ) {

        const state =
            HD8.getAppState(
                appId
            );


        Object.assign(
            state,
            patch || {}
        );


        state.updatedAt =
            Date.now();


        HD8.emit?.(
            "app:state",
            state
        );


        return state;

    };


/* =========================================================
   APP PERSISTENCE
   ========================================================= */

HD8.appPersistence =
    {

        prefix:
            "haldo-os22-app-",

        save(
            appId,
            state
        ) {

            try {

                localStorage.setItem(
                    this.prefix +
                    String(appId),
                    JSON.stringify(
                        state
                    )
                );

                return true;

            }

            catch (error) {

                console.warn(
                    "HalDo App Storage Fehler:",
                    error
                );

                return false;

            }

        },


        load(
            appId
        ) {

            try {

                const raw =
                    localStorage.getItem(
                        this.prefix +
                        String(appId)
                    );


                if (!raw) {
                    return null;
                }


                return JSON.parse(
                    raw
                );

            }

            catch (error) {

                console.warn(
                    "HalDo App Load Fehler:",
                    error
                );

                return null;

            }

        },


        remove(
            appId
        ) {

            try {

                localStorage.removeItem(
                    this.prefix +
                    String(appId)
                );

                return true;

            }

            catch (_) {

                return false;

            }

        }

    };


/* =========================================================
   APP BASE CLASS
   ========================================================= */

HD8.App =
    class {

        constructor(
            definition
        ) {

            this.definition =
                definition || {};

            this.id =
                String(
                    this.definition.id ||
                    "app"
                );

            this.name =
                this.definition.name ||
                this.id;

            this.icon =
                this.definition.icon ||
                "●";

            this.category =
                this.definition.category ||
                "System";

            this.capabilities =
                Array.isArray(
                    this.definition.capabilities
                )
                    ? this.definition.capabilities
                    : [];


            this.state =
                HD8.getAppState(
                    this.id
                );


            this.container =
                null;


            this.window =
                null;


            this.events =
                new Map();


            this.initialized =
                false;

        }


        /* =================================================
           INIT
           ================================================= */

        init(
            container,
            windowInstance
        ) {

            this.container =
                container;

            this.window =
                windowInstance;


            const saved =
                HD8.appPersistence.load(
                    this.id
                );


            if (saved) {

                Object.assign(
                    this.state,
                    saved
                );

            }


            this.state.initialized =
                true;


            this.initialized =
                true;


            this.emit(
                "init",
                this.state
            );


            return this;

        }


        /* =================================================
           SAVE
           ================================================= */

        save() {

            return HD8.appPersistence.save(
                this.id,
                this.state
            );

        }


        /* =================================================
           SET DATA
           ================================================= */

        setData(
            key,
            value
        ) {

            this.state.data[key] =
                value;


            this.state.updatedAt =
                Date.now();


            this.save();


            this.emit(
                "data",
                {
                    key,
                    value
                }
            );


            return value;

        }


        /* =================================================
           GET DATA
           ================================================= */

        getData(
            key,
            fallback = null
        ) {

            if (
                Object.prototype.hasOwnProperty.call(
                    this.state.data,
                    key
                )
            ) {

                return this.state.data[key];

            }


            return fallback;

        }


        /* =================================================
           SET SETTING
           ================================================= */

        setSetting(
            key,
            value
        ) {

            this.state.settings[key] =
                value;


            this.save();


            this.emit(
                "setting",
                {
                    key,
                    value
                }
            );


            return value;

        }


        /* =================================================
           GET SETTING
           ================================================= */

        getSetting(
            key,
            fallback = null
        ) {

            if (
                Object.prototype.hasOwnProperty.call(
                    this.state.settings,
                    key
                )
            ) {

                return this.state.settings[key];

            }


            return fallback;

        }


        /* =================================================
           VIEW
           ================================================= */

        setView(
            view
        ) {

            const next =
                String(
                    view ||
                    "home"
                );


            this.state.history.push(
                this.state.activeView
            );


            this.state.activeView =
                next;


            this.save();


            this.emit(
                "view",
                next
            );


            return next;

        }


        /* =================================================
           BACK
           ================================================= */

        back() {

            const previous =
                this.state.history.pop();


            if (
                previous
            ) {

                this.state.activeView =
                    previous;

                this.save();

                this.emit(
                    "view",
                    previous
                );

            }


            return this.state.activeView;

        }


        /* =================================================
           ACTION
           ================================================= */

        action(
            name,
            payload = {}
        ) {

            this.state.lastAction =
                {
                    name,
                    payload,
                    timestamp:
                        Date.now()
                };


            this.emit(
                "action",
                this.state.lastAction
            );


            HD8.emit?.(
                "app:action",
                {
                    appId:
                        this.id,

                    name,

                    payload
                }
            );


            return true;

        }


        /* =================================================
           EVENT ON
           ================================================= */

        on(
            event,
            callback
        ) {

            if (
                typeof callback !==
                "function"
            ) {

                return () => {};

            }


            if (
                !this.events.has(
                    event
                )
            ) {

                this.events.set(
                    event,
                    new Set()
                );

            }


            const listeners =
                this.events.get(
                    event
                );


            listeners.add(
                callback
            );


            return () => {

                listeners.delete(
                    callback
                );

            };

        }


        /* =================================================
           EVENT EMIT
           ================================================= */

        emit(
            event,
            payload
        ) {

            const listeners =
                this.events.get(
                    event
                );


            if (!listeners) {
                return;
            }


            listeners.forEach(
                callback => {

                    try {

                        callback(
                            payload
                        );

                    }

                    catch (error) {

                        console.error(
                            "HalDo App Event Fehler:",
                            error
                        );

                    }

                }
            );

        }


        /* =================================================
           ERROR
           ================================================= */

        error(
            error
        ) {

            const entry =
                {

                    message:
                        error?.message ||
                        String(error),

                    timestamp:
                        Date.now()

                };


            this.state.errors.push(
                entry
            );


            if (
                this.state.errors.length >
                30
            ) {

                this.state.errors.shift();

            }


            this.save();


            this.emit(
                "error",
                entry
            );


            HD8.emit?.(
                "app:error",
                {
                    appId:
                        this.id,

                    error:
                        entry
                }
            );

        }


        /* =================================================
           RENDER
           ================================================= */

        render() {

            if (!this.container) {
                return;
            }


            this.container.innerHTML = `

                <div class="hd-app-page">

                    <div class="hd-app-hero">

                        <div class="hd-app-icon">
                            ${this.icon}
                        </div>

                        <div>

                            <h2>
                                ${HD8.html(
                                    this.name
                                )}
                            </h2>

                            <p>
                                ${HD8.html(
                                    this.definition.description ||
                                    "HalDo AI OS 22 App"
                                )}
                            </p>

                        </div>

                    </div>


                    <nav class="hd-app-nav">

                        <button
                            type="button"
                            data-view="home"
                        >
                            Übersicht
                        </button>

                        <button
                            type="button"
                            data-view="tools"
                        >
                            Funktionen
                        </button>

                        <button
                            type="button"
                            data-view="settings"
                        >
                            Einstellungen
                        </button>

                    </nav>


                    <main
                        class="hd-app-view"
                        data-app-view
                    ></main>

                </div>

            `;


            this.container
                .querySelectorAll(
                    "[data-view]"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                this.setView(
                                    button.dataset.view
                                );

                                this.renderView();

                            }
                        );

                    }
                );


            this.renderView();

        }


        /* =================================================
           VIEW RENDERER
           ================================================= */

        renderView() {

            const view =
                this.container?.querySelector(
                    "[data-app-view]"
                );


            if (!view) {
                return;
            }


            const active =
                this.state.activeView;


            if (
                active ===
                "settings"
            ) {

                this.renderSettings(
                    view
                );

                return;

            }


            if (
                active ===
                "tools"
            ) {

                this.renderTools(
                    view
                );

                return;

            }


            this.renderHome(
                view
            );

        }


        /* =================================================
           HOME
           ================================================= */

        renderHome(
            view
        ) {

            view.innerHTML = `

                <section
                    class="hd-app-card"
                >

                    <h3>
                        ${HD8.html(
                            this.name
                        )}
                    </h3>

                    <p>
                        Diese App ist mit dem
                        gemeinsamen HalDo AI OS 22
                        Fundament verbunden.
                    </p>

                    <div
                        class="hd-app-actions"
                    >

                        <button
                            type="button"

                            type="button"
                            data-action="ai"

                        </button>

                    <div
                        class="hd-app-status"
                        data-status
                    >
                        Bereit
                    </div>

                </section>

            `;


            view.querySelector(
                '[data-action="start"]'
            )
            ?.addEventListener(
                "click",
                () => {

                    this.action(
                        "start"
                    );


                    const status =
                        view.querySelector(
                            "[data-status]"
                        );


                    if (status) {

                        status.textContent =
                            `${this.name} ist aktiv.`;

                    }

                }
            );


            view.querySelector(
                '[data-action="ai"]'
            )
            ?.addEventListener(
                "click",
                () => {

                    this.action(
                        "ai"
                    );


                    HD8.openAI?.();

                }
            );

        }


        /* =================================================
           TOOLS
           ================================================= */

        renderTools(
            view
        ) {

            view.innerHTML = `

                <section
                    class="hd-app-card"
                >

                    <h3>
                        Funktionen
                    </h3>

                    <div
                        class="hd-function-grid"
                    >

                        ${
                            this.capabilities
                            .map(
                                capability => `

                                    <button
                                        type="button"
                                        data-capability="${HD8.html(
                                            capability
                                        )}"
                                    >
                                        ${HD8.html(
                                            capability
                                        )}
                                    </button>

                                `
                            )
                            .join("")
                        }

                    </div>

                    <div
                        class="hd-app-status"
                        data-status
                    >
                        Bereit
                    </div>

                </section>

            `;


            view.querySelectorAll(
                "[data-capability]"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const capability =
                                button.dataset.capability;


                            this.action(
                                capability
                            );


                            const status =
                                view.querySelector(
                                    "[data-status]"
                                );


                            if (status) {

                                status.textContent =
                                    capability +
                                    " geöffnet.";

                            }

                        }
                    );

                }
            );

        }


        /* =================================================
           SETTINGS
           ================================================= */

        renderSettings(
            view
        ) {

            const notifications =
                this.getSetting(
                    "notifications",
                    true
                );


            const voice =
                this.getSetting(
                    "voice",
                    true
                );


            const ai =
                this.getSetting(
                    "ai",
                    true
                );


            view.innerHTML = `

                <section
                    class="hd-app-card"
                >

                    <h3>
                        App-Einstellungen
                    </h3>


                    <label
                        class="hd-setting-row"
                    >

                        <span>
                            Benachrichtigungen
                        </span>

                        <input
                            type="checkbox"
                            data-setting="notifications"
                            ${
                                notifications
                                    ? "checked"
                                    : ""
                            }
                        >

                    </label>


                    <label
                        class="hd-setting-row"
                    >

                        <span>
                            Voice
                        </span>

                        <input
                            type="checkbox"
                            data-setting="voice"
                            ${
                                voice
                                    ? "checked"
                                    : ""
                            }
                        >

                    </label>


                    <label
                        class="hd-setting-row"
                    >

                        <span>
                            AI-Anbindung
                        </span>

                        <input
                            type="checkbox"
                            data-setting="ai"
                            ${
                                ai
                                    ? "checked"
                                    : ""
                            }
                        >

                    </label>


                    <button
                        type="button"
                        data-reset-settings
                    >
                        Einstellungen zurücksetzen
                    </button>

                </section>

            `;


            view.querySelectorAll(
                "[data-setting]"
            )
            .forEach(
                input => {

                    input.addEventListener(
                        "change",
                        () => {

                            this.setSetting(
                                input.dataset.setting,
                                input.checked
                            );

                        }
                    );

                }
            );


            view.querySelector(
                "[data-reset-settings]"
            )
            ?.addEventListener(
                "click",
                () => {

                    this.state.settings =
                        {};

                    this.save();

                    this.renderView();

                }
            );

        }


        /* =================================================
           DESTROY
           ================================================= */

        destroy() {

            this.save();

            this.events.clear();

            this.container =
                null;

            this.window =
                null;

        }

    };


/* =========================================================
   HTML ESCAPE
   ========================================================= */

HD8.html =
    function(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    };


/* =========================================================
   APP FACTORY
   ========================================================= */

HD8.createApp =
    function(
        definition
    ) {

        const app =
            new HD8.App(
                definition
            );


        HD8.apps?.register?.({

            ...definition,

            render:
                function(
                    container,
                    windowInstance
                ) {

                    app.init(
                        container,
                        windowInstance
                    );


                    app.render();

                },

            close:
                function() {

                    app.destroy();

                }

        });


        return app;

    };


/* =========================================================
   OPEN AI BRIDGE
   ========================================================= */

HD8.openAI =
    function() {

        const aiApp =
            HD8.apps?.get?.(
                "haldo-ai"
            );


        if (
            aiApp &&
            HD8.windows?.open
        ) {

            HD8.windows.open(
                aiApp
            );

            return true;

        }


        HD8.emit?.(
            "ai:open"
        );


        return false;

    };


/* =========================================================
   GLOBAL APP EVENT BRIDGE
   ========================================================= */

HD8.onAppAction =
    function(
        callback
    ) {

        if (
            typeof callback !==
            "function"
        ) {

            return () => {};

        }


        if (
            typeof HD8.on ===
            "function"
        ) {

            return HD8.on(
                "app:action",
                callback
            );

        }


        return () => {};

    };

   APP FOUNDATION CSS
