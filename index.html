<!-- =====================================
     SETTINGS SYSTEM
     HALDO AI OS v9.1
     INDEX PART 2
     ===================================== -->


<section 
id="settings"
class="window">


<div class="window-header">


<button 
class="back-button"
onclick="goHome()">

⬅

</button>


<h2>

⚙️ Einstellungen

</h2>


</div>






<div class="settings-layout">



<!-- SETTINGS MENU -->


<div class="settings-menu">



<button onclick="openSettingsPage('general')">

🌍 Allgemein

</button>



<button onclick="openSettingsPage('aiVoice')">

🤖 AI Stimme

</button>



<button onclick="openSettingsPage('design')">

🎨 Hintergrund

</button>



<button onclick="openSettingsPage('control')">

🖥️ Bedienung

</button>



<button onclick="openSettingsPage('security')">

🔐 Sicherheit

</button>



<button onclick="openSettingsPage('help')">

❓ Hilfe

</button>



<button onclick="openSettingsPage('info')">

ℹ️ Information

</button>



</div>







<!-- SETTINGS CONTENT -->


<div 
id="settingsContent"
class="settings-content">



<div id="general">


<h3>

🌍 Allgemein

</h3>


<p>

Sprache, Benutzer und Systemoptionen

</p>



<label>

Benutzername

</label>


<input
id="username"
placeholder="Name">


<button onclick="saveUser()">

💾 Speichern

</button>



</div>









<div id="aiVoice"
style="display:none;">


<h3>

🤖 AI Stimme

</h3>



<label>

AI Stimme

</label>


<select id="voiceEnabled">


<option>

Ein

</option>


<option>

Aus

</option>


</select>





<label>

Stimme

</label>


<select id="voiceType">


<option>

Neutral

</option>


<option>

Männlich

</option>


<option>

Weiblich

</option>


</select>





<label>

Geschwindigkeit

</label>


<input
type="range"
id="voiceSpeed"
min="0.5"
max="2"
step="0.1"
value="1">


</div>









<div id="design"
style="display:none;">


<h3>

🎨 Hintergrund

</h3>


<button>

🌌 HalDo Standard

</button>


<button>

🌃 Sterne

</button>


<button>

🖼️ Eigenes Bild

</button>



</div>









<div id="control"
style="display:none;">


<h3>

🖥️ Bedienung

</h3>


<p>

Maus, Touch und Tastatur Einstellungen

</p>



</div>









<div id="security"
style="display:none;">


<h3>

🔐 Sicherheit

</h3>


<button onclick="lockSystem()">

🔒 Sperren

</button>


<button onclick="clearAIMemory()">

🧠 AI Speicher löschen

</button>



</div>



</div>



</div>



</section>
