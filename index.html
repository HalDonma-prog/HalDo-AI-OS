<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HalDo AI OS — 100 Apps Professional</title>

    <!-- =========================================================
    STYLES
    ========================================================= -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0e1a;
            --surface: rgba(16, 22, 42, 0.92);
            --border: rgba(255, 255, 255, 0.05);
            --text: #e8edf5;
            --gold: #ffd54b;
            --gold-dark: #ff9f1c;
            --radius: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
        }

        #haldo-os {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 30% 20%, rgba(30, 60, 140, 0.12), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(80, 40, 160, 0.08), transparent 50%),
                var(--bg);
            padding: 8px;
            gap: 6px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 12px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex-shrink: 0;
            backdrop-filter: blur(16px);
            height: 38px;
        }

        .top-bar .logo {
            font-size: 14px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .top-bar .time {
            font-size: 11px;
            opacity: 0.5;
            font-family: monospace;
        }

        .top-bar .status {
            font-size: 9px;
            opacity: 0.4;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .top-bar .status .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* Content */
        .content {
            flex: 1;
            display: flex;
            gap: 6px;
            min-height: 0;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 160px;
            flex-shrink: 0;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 4px;
            overflow-y: auto;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .sidebar .app-btn {
            padding: 4px 8px;
            border-radius: 5px;
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            text-align: left;
            font-size: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            width: 100%;
            line-height: 1.2;
        }

        .sidebar .app-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .sidebar .app-btn.active {
            background: rgba(255, 200, 80, 0.08);
            border-color: rgba(255, 200, 80, 0.12);
            color: var(--gold);
        }

        .sidebar .app-btn .icon {
            font-size: 12px;
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar .app-btn .badge {
            margin-left: auto;
            font-size: 7px;
            background: rgba(255, 80, 80, 0.2);
            color: #ff6b6b;
            padding: 1px 4px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* Main Area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            backdrop-filter: blur(16px);
            min-width: 0;
        }

        .app-header {
            padding: 5px 12px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 30px;
        }

        .app-header .actions {
            display: flex;
            gap: 3px;
        }

        .app-header .actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 9px;
            transition: all 0.2s;
        }

        .app-header .actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Buttons */
        .btn-primary {
            padding: 4px 12px;
            border-radius: 5px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0a0e1a;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 10px;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(255, 200, 80, 0.2);
        }

        .btn-secondary {
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 9px;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(255, 80, 80, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 80, 80, 0.15);
            cursor: pointer;
            font-size: 9px;
            transition: background 0.2s;
        }

        .btn-danger:hover {
            background: rgba(255, 80, 80, 0.2);
        }

        /* Inputs */
        input,
        textarea,
        select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: #fff;
            padding: 4px 6px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 10px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(255, 200, 80, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 28px;
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 8px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .card .card-title {
            font-weight: 600;
            font-size: 11px;
        }

        .card .card-meta {
            font-size: 9px;
            opacity: 0.35;
            margin-top: 1px;
        }

        .card .card-actions {
            margin-top: 4px;
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }

        /* Warning Cards */
        .warning-card {
            padding: 6px 10px;
            border-radius: 5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-left: 3px solid #ff6b6b;
            background: rgba(255, 80, 80, 0.05);
            animation: warnIn 0.3s ease-out;
            font-size: 11px;
        }

        .warning-card.baustelle {
            border-left-color: #ffa94d;
            background: rgba(255, 169, 77, 0.05);
        }
        .warning-card.sperrung {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
        }
        .warning-card.gefahr {
            border-left-color: #ff0000;
            background: rgba(255, 0, 0, 0.06);
        }
        .warning-card.blitzer {
            border-left-color: #ffd93d;
            background: rgba(255, 217, 61, 0.05);
        }

        @keyframes warnIn {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .warning-card .w-icon {
            font-size: 16px;
        }
        .warning-card .w-info {
            flex: 1;
        }
        .warning-card .w-info .w-title {
            font-weight: 700;
            font-size: 11px;
        }
        .warning-card .w-info .w-desc {
            font-size: 9px;
            opacity: 0.5;
            margin-top: 1px;
        }
        .warning-card .w-time {
            font-size: 8px;
            opacity: 0.25;
        }

        /* Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
        }

        .flex-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        .flex-row>* {
            flex: 1;
            min-width: 50px;
        }

        .flex-row .btn-primary,
        .flex-row .btn-secondary,
        .flex-row .btn-danger {
            flex: 0 0 auto;
        }

        /* Chat */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 5px;
            margin-bottom: 6px;
            max-height: 300px;
            min-height: 100px;
        }

        .chat-messages>div {
            padding: 6px 10px;
            border-radius: 5px;
            margin-bottom: 3px;
            font-size: 11px;
        }

        .chat-messages .user {
            background: rgba(255, 255, 255, 0.06);
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .chat-messages .ai {
            background: rgba(255, 200, 80, 0.06);
            border: 1px solid rgba(255, 200, 80, 0.06);
        }

        .chat-messages .ai .typing {
            display: inline-block;
            animation: typingDots 1s infinite;
        }

        @keyframes typingDots {
            0% {
                content: '.';
            }
            33% {
                content: '..';
            }
            66% {
                content: '...';
            }
        }

        /* Question Items */
        .question-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 8px;
            margin-bottom: 6px;
        }

        .question-item .q-title {
            font-weight: 600;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .question-item .q-image {
            font-size: 28px;
            text-align: center;
            padding: 4px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .question-item .q-options label {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 4px;
            cursor: pointer;
            font-size: 10px;
        }

        .question-item .q-options label:hover {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
        }

        .question-item .q-options input[type="radio"],
        .question-item .q-options input[type="checkbox"] {
            width: 10px;
            height: 10px;
            accent-color: var(--gold);
            flex: 0 0 auto;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .sidebar {
                width: 44px;
                padding: 3px;
            }
            .sidebar .app-btn span:not(.icon) {
                display: none;
            }
            .sidebar .app-btn {
                justify-content: center;
                padding: 5px;
            }
            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr;
            }
            #haldo-os {
                padding: 4px;
                gap: 4px;
            }
            .app-body {
                padding: 4px;
            }
            .top-bar .status {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 36px;
            }
            .sidebar .app-btn .icon {
                font-size: 10px;
                width: 14px;
            }
            .top-bar .logo {
                font-size: 11px;
            }
            .app-header {
                font-size: 10px;
                padding: 3px 6px;
            }
            .app-body {
                padding: 3px;
            }
            .card {
                padding: 4px 6px;
            }
            .chat-messages {
                max-height: 150px;
                min-height: 60px;
            }
        }

        /* =========================================================
        COSMIC WORLD STYLES
        ========================================================= */
        .cosmic-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 400px;
            overflow: hidden;
            border-radius: 6px;
            background: radial-gradient(circle at 50% 50%, rgba(10, 20, 50, 0.8), #0a0e1a);
        }

        .cosmic-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fffde2 0%, #fff7a0 14%, #ffd54b 35%, #ff9f1c 62%, #e85b16 84%, #7b1c0d 100%);
            box-shadow: 0 0 40px rgba(255, 220, 70, 0.9), 0 0 80px rgba(255, 165, 40, 0.6), 0 0 150px rgba(255, 100, 20, 0.3);
            animation: sunPulse 4s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes sunPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(0.98);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.03);
            }
        }

        .cosmic-sun .logo-in-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 55%;
            height: 55%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
            color: #0a0e1a;
            text-shadow: 0 0 20px rgba(255, 200, 80, 0.5);
            animation: logoPulse 3s ease-in-out infinite;
            border: 2px solid rgba(255, 200, 80, 0.2);
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 20px rgba(255, 200, 80, 0.2);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                box-shadow: 0 0 40px rgba(255, 200, 80, 0.4);
            }
        }

        .cosmic-sun .logo-in-sun img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 50%;
        }

        .cosmic-planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 5;
        }

        .cosmic-planet:hover {
            transform: scale(1.15) !important;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3) !important;
            z-index: 20;
        }

        .cosmic-planet .planet-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            opacity: 0.5;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.5);
            padding: 1px 6px;
            border-radius: 4px;
            pointer-events: none;
        }

        .cosmic-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .cosmic-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .cosmic-star {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            animation: starTwinkle var(--speed, 4s) ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .cosmic-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .cosmic-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 200, 80, 0.3);
            animation: particleFloat var(--duration, 5s) ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0.2;
            }
            50% {
                transform: translate(var(--dx, 20px), var(--dy, -20px)) scale(1);
                opacity: 0.8;
            }
        }

        /* =========================================================
        LIVING LOGO STYLES
        ========================================================= */
        .living-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
        }

        .living-logo .logo-aura {
            position: absolute;
            inset: -30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.15), rgba(255, 200, 80, 0.05) 40%, transparent 70%);
            animation: auraPulse 3s ease-in-out infinite;
        }

        @keyframes auraPulse {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .living-logo .logo-mouth {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 25%;
            height: 6%;
            border-radius: 50%;
            background: rgba(255, 200, 150, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.1s ease;
        }

        .living-logo.speaking .logo-mouth {
            animation: mouthSpeak 0.3s ease-in-out infinite alternate;
        }

        @keyframes mouthSpeak {
            0% {
                height: 4%;
                transform: translateX(-50%) scaleY(0.7);
            }
            100% {
                height: 12%;
                transform: translateX(-50%) scaleY(1.2);
            }
        }

        .living-logo .logo-eyes {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 10%;
            display: flex;
            justify-content: space-between;
        }

        .living-logo .logo-eyes .eye {
            width: 30%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .living-logo .logo-eyes .eye::after {
            content: '';
            position: absolute;
            width: 35%;
            height: 35%;
            border-radius: 50%;
            background: rgba(255, 220, 100, 0.4);
            top: 30%;
            left: 30%;
            transition: all 0.3s ease;
        }

        .living-logo.listening .logo-eyes .eye::after {
            animation: eyeListen 1.2s ease-in-out infinite;
        }

        @keyframes eyeListen {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.4);
            }
        }

        .living-logo.thinking .logo-eyes .eye::after {
            animation: eyeThink 1.8s ease-in-out infinite;
        }

        @keyframes eyeThink {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(3px, -2px);
            }
        }

        .living-logo.idle .logo-eyes .eye::after {
            animation: eyeIdle 3s ease-in-out infinite;
        }

        @keyframes eyeIdle {
            0%,
            100% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(-1px, -1px);
            }
            75% {
                transform: translate(1px, 1px);
            }
        }

        .living-logo .logo-hands {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .living-logo .logo-hands .hand {
            position: absolute;
            width: 12%;
            height: 12%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.15), rgba(255, 200, 100, 0.05) 50%, transparent 70%);
            animation: handMove 4s ease-in-out infinite;
        }

        .living-logo .logo-hands .hand-left {
            left: -8%;
            top: 30%;
            animation-delay: 0s;
        }

        .living-logo .logo-hands .hand-right {
            right: -8%;
            top: 30%;
            animation-delay: 2s;
        }

        @keyframes handMove {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(0, -4px) scale(1.08);
            }
        }

        .living-logo .logo-glow {
            position: absolute;
            inset: -10%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.08), transparent 60%);
            animation: glowPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.08);
            }
        }
    </style>
</head>
<body>

    <div id="haldo-os">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo">✦ HalDo AI OS</div>
            <div class="status">
                <span class="dot"></span>
                <span id="status-text">Bereit</span>
            </div>
            <div class="time" id="top-time">--:--:--</div>

        const Storage = {
            prefix: 'haldo_',
            get(key, def = null) {
                try {
                    const val = localStorage.getItem(this.prefix + key);
                    if (val === null) return def;
                    try { return JSON.parse(val); } catch (e) { return val; }
                } catch (e) { return def; }
            },
            set(key, val) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(val)); return true; } catch (e) { return false; }
            },
            remove(key) {
                try { localStorage.removeItem(this.prefix + key); return true; } catch (e) { return false; }
            },
            getAll() {
                const res = {};
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => {
                        try { res[k.replace(this.prefix, '')] = JSON.parse(localStorage.getItem(k)); } catch (e) { res[
                                k.replace(this.prefix, '')] = localStorage.getItem(k); }
                    });
                } catch (e) {}
                return res;
            },
            clear() {
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(this.prefix)).forEach(k => localStorage.removeItem(k));
                    return true;
                } catch (e) { return false; }
            }

                        <div class="flex-row">
                            <textarea id="ai-input" rows="1" placeholder="Frage an HalDo AI..." style="flex:1;min-height:32px;"></textarea>
                            <button onclick="AppRouter.sendAIMessage()" class="btn-primary">Senden</button>
                            <button onclick="AppRouter.voiceInput()" class="btn-secondary">🎙️</button>
                        </div>
                        <div id="ai-thinking" style="display:none;font-size:9px;opacity:0.5;margin-top:3px;">🤔 HalDo AI denkt...</div>
                    </div>
                `;
            },

            sendAIMessage() {
                const input = document.getElementById('ai-input');
                const messages = document.getElementById('ai-chat-messages');
                const thinking = document.getElementById('ai-thinking');
                if (!input || !messages) return;
                const text = input.value.trim();
                if (!text) return;

                const userDiv = document.createElement('div');
                userDiv.className = 'user';
                userDiv.textContent = '👤 ' + text;
                messages.appendChild(userDiv);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
                thinking.style.display = 'block';
                this.setLogoState('thinking');

                setTimeout(() => {
                    thinking.style.display = 'none';
                    const response = HalDoAI.ask(text);
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'ai';
                    aiDiv.textContent = '🤖 ' + response;
                    messages.appendChild(aiDiv);
                    messages.scrollTop = messages.scrollHeight;
                    this.setLogoState('speaking');
                    speak(response);
                    setTimeout(() => this.setLogoState('idle'), 1000);
                }, 600);
            },

            voiceInput() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) { alert('Spracherkennung nicht unterstützt.'); return; }
                const rec = new Recognition();
                rec.lang = 'de-DE';
                rec.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const input = document.getElementById('ai-input');
                    if (input) input.value = text;
                    this.sendAIMessage();
                };
                rec.start();
                this.setLogoState('listening');
                speak('Ich höre zu.');
                setTimeout(() => this.setLogoState('idle'), 5000);
            },

                        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;">
                            ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(b =>
                                `<button onclick="AppRouter.calcPress('${b}')" style="padding:8px;border-radius:3px;background:${['C','±','%','÷','×','−','+','='].includes(b)?'rgba(255,200,80,0.12)':'rgba(255,255,255,0.04)'};color:#fff;border:1px solid rgba(255,255,255,0.04);cursor:pointer;font-size:12px;">${b}</button>`
                            ).join('')}

            calcPress(val) {
                const display = document.getElementById('calc-display');
                if (!display) return;
                if (!this._calcExpr) this._calcExpr = '';
                if (val === 'C') { this._calcExpr = '';
                    display.textContent = '0'; return; }
                if (val === '⌫') { this._calcExpr = this._calcExpr.slice(0, -1);
                    display.textContent = this._calcExpr || '0'; return; }
                if (val === '=') {
                    try {
                        const result = Function('"use strict"; return (' + this._calcExpr.replace('×', '*').replace('÷', '/')
                            .replace('−', '-') + ')')();
                        display.textContent = result;
                        this._calcExpr = String(result);
                    } catch (e) { display.textContent = 'Fehler';
                        this._calcExpr = ''; }
                    return;
                }
                this._calcExpr += val;
                display.textContent = this._calcExpr;
            },

            renderTimer() {
                return `
                    <div style="text-align:center;padding:12px;">
                        <div style="font-size:36px;font-family:monospace;font-weight:700;" id="timer-display">00:30</div>
                        <div style="display:flex;gap:4px;justify-content:center;margin-top:6px;">
                            <button onclick="AppRouter.timerStart()" class="btn-primary">▶ Start</button>
                            <button onclick="AppRouter.timerStop()" class="btn-secondary">⏹ Stop</button>
                            <button onclick="AppRouter.timerReset()" class="btn-secondary">🔄 Reset</button>
                        </div>
                        <div style="margin-top:4px;">
                            <input id="timer-input" type="number" value="30" style="width:60px;display:inline-block;" min="1" max="3600">
                            <span style="font-size:9px;opacity:0.5;">Sekunden</span>
                        </div>
                    </div>
                `;
            },

            timerStart() {
                const input = document.getElementById('timer-input');
                const display = document.getElementById('timer-display');
                if (!display) return;
                if (this._timerInterval) return;
                let seconds = parseInt(input?.value) || 30;
                if (seconds < 1) seconds = 1;
                if (seconds > 3600) seconds = 3600;
                this._timerSeconds = seconds;
                this._timerInterval = setInterval(() => {
                    if (this._timerSeconds <= 0) {
                        clearInterval(this._timerInterval);
                        this._timerInterval = null;
                        speak('Timer abgelaufen!');
                        display.textContent = '00:00';
                        return;
                    }
                    this._timerSeconds--;
                    const mins = Math.floor(this._timerSeconds / 60);
                    const secs = this._timerSeconds % 60;
                    display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                }, 1000);
            },

            timerStop() {
                if (this._timerInterval) { clearInterval(this._timerInterval);
                    this._timerInterval = null; }
            },

            timerReset() {
                this.timerStop();
                const display = document.getElementById('timer-display');
                if (display) display.textContent = '00:30';
            },

                const backups = Storage.get('backups', []);

                    if (backups.length === 0) { speak('Keine Backups.'); return; }
                    index = backups.length - 1;

                const backup = backups[index];
                if (!backup) { speak('Backup nicht gefunden.'); return; }
                if (confirm(`Backup vom ${new Date(backup.createdAt).toLocaleString()} wiederherstellen?`)) {
                    Object.entries(backup.data).forEach(([key, val]) => Storage.set(key, val));
                    speak('Backup wiederhergestellt.');
                    setTimeout(() => location.reload(), 1000);
                }
            },

                const backups = Storage.get('backups', []);

            },

            translateText() {
                const text = document.getElementById('trans-text');
                const result = document.getElementById('trans-result');
                if (!text || !result) return;
                const input = text.value.trim();
                if (!input) { result.textContent = '⚠️ Bitte Text eingeben.'; return; }
                const to = document.getElementById('trans-to')?.value || 'en';
                const dict = {
                    'en': { 'Hallo': 'Hello', 'Danke': 'Thank you', 'Guten Tag': 'Good day' },
                    'de': { 'Hello': 'Hallo', 'Thank you': 'Danke', 'Good day': 'Guten Tag' },

                    'esq': { 'Hallo': 'Silav', 'Danke': 'Spas', 'Guten Tag': 'Rojbaş' }
                };
                const d = dict[to] || {};
                let translated = input;
                for (const [key, val] of Object.entries(d)) {
                    if (input.toLowerCase().includes(key.toLowerCase())) {
                        translated = translated.replace(new RegExp(key, 'gi'), val);
                    }
                }
                result.textContent = `🌍 ${translated}`;

            // =========================================================
            // INIT APP
            // =========================================================
            initApp(appId) {
                if (appId === 'warnings') WarningSystem.render();
                if (appId === 'notes') NoteSystem.render();
                if (appId === 'calendar') CalendarSystem.render();
                if (appId === 'contacts') ContactSystem.render();
                if (appId === 'files') FileSystem.render();
                if (appId === 'tasks') TaskSystem.render();
                if (appId === 'backup') this.renderBackup();
                if (appId === 'updates') this.checkUpdates();
                if (appId === 'cosmic') this.setLogoState('idle');
            }
        };

        // =========================================================
        // WARNUNGEN SYSTEM
        // =========================================================
        const WarningSystem = {
            warnings: [],
            tones: { blitzer: { freq: 1400, pattern: 'short' }, baustelle: { freq: 800, pattern: 'long' },
                sperrung: { freq: 600, pattern: 'double' }, gefahr: { freq: 400, pattern: 'triple' } },
            load() { this.warnings = Storage.get('warnings', []); return this; },
            save() { Storage.set('warnings', this.warnings); return this; },
            add(type, title, description, location = 'Unbekannt') {
                const types = { blitzer: { icon: '📸', label: 'Blitzer' }, baustelle: { icon: '🚧', label: 'Baustelle' },
                    sperrung: { icon: '🚫', label: 'Sperrung' }, gefahr: { icon: '⚠️', label: 'Gefahr' } };
                const t = types[type] || types['gefahr'];
                const warning = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), type, icon: t.icon,
                    label: t.label, title, description, location, timestamp: new Date().toISOString(),
                active: true };
                this.warnings.unshift(warning);
                this.save();
                this.playTone(type);
                speak(`Achtung! ${title} in ${location}. ${description}`);
                AppRouter.renderWarnings();
                return warning;
            },
            playTone(type) {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    const tone = this.tones[type] || this.tones['gefahr'];
                    osc.frequency.value = tone.freq;
                    osc.type = 'square';
                    gain.gain.value = 0.08;
                    osc.start();
                    if (tone.pattern === 'short') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 120); } else if (tone.pattern === 'long') { setTimeout(() => { osc.stop();
                            ctx.close(); }, 350); } else if (tone.pattern === 'double') { setTimeout(() => { osc.stop(); },
                            120);
                        setTimeout(() => {
                            const ctx2 = new(window.AudioContext || window.webkitAudioContext)();
                            const o2 = ctx2.createOscillator();
                            const g2 = ctx2.createGain();
                            o2.connect(g2);
                            g2.connect(ctx2.destination);
                            o2.frequency.value = tone.freq;
                            o2.type = 'square';
                            g2.gain.value = 0.08;
                            o2.start();
                            setTimeout(() => { o2.stop();
                                ctx2.close(); }, 120);
                        }, 200);
                    } else if (tone.pattern === 'triple') {
                        for (let i = 0; i < 3; i++) {
                            setTimeout(() => {
                                const ctx3 = new(window.AudioContext || window.webkitAudioContext)();
                                const o3 = ctx3.createOscillator();
                                const g3 = ctx3.createGain();
                                o3.connect(g3);
                                g3.connect(ctx3.destination);
                                o3.frequency.value = tone.freq + i * 150;
                                o3.type = 'square';
                                g3.gain.value = 0.06;
                                o3.start();
                                setTimeout(() => { o3.stop();
                                    ctx3.close(); }, 100);
                            }, i * 150);
                        }
                    }
                } catch (e) {}
            },
            dismiss(id) { const w = this.warnings.find(w => w.id === id); if (w) w.active = false;
                this.save();
                AppRouter.renderWarnings(); },
            clearAll() { this.warnings.forEach(w => w.active = false);
                this.save();
                AppRouter.renderWarnings(); },
            getActive() { return this.warnings.filter(w => w.active); },
            render() {
                const container = document.getElementById('warnings-container');
                if (!container) return;
                const active = this.getActive();
                if (active.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:16px;font-size:10px;">✅ Keine aktiven Warnungen</div>`;
                    return; }
                container.innerHTML = active.map(w =>
                    `<div class="warning-card ${w.type}">
                        <span class="w-icon">${w.icon}</span>
                        <div class="w-info">
                            <div class="w-title">${w.title}</div>
                            <div class="w-desc">${w.description} · 📍 ${w.location}</div>
                        </div>
                        <span class="w-time">${new Date(w.timestamp).toLocaleTimeString()}</span>
                        <button onclick="WarningSystem.dismiss('${w.id}')" style="background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:12px;">✕</button>
                    </div>`
                ).join('');
            }
        };
        WarningSystem.load();

        // =========================================================
        // NOTIZEN SYSTEM
        // =========================================================
        const NoteSystem = {
            notes: [],
            load() { this.notes = Storage.get('notes', []); return this; },
            save() { Storage.set('notes', this.notes); return this; },
            create() {
                const title = document.getElementById('note-title');
                const content = document.getElementById('note-content');
                if (!title || !content) return;
                const note = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Ohne Titel', content: content.value || '', createdAt: new Date().toISOString() };
                this.notes.unshift(note);
                this.save();
                title.value = '';
                content.value = '';
                AppRouter.renderNotes();
                speak('Notiz gespeichert.');
            },
            delete(id) { this.notes = this.notes.filter(n => n.id !== id);
                this.save();
                AppRouter.renderNotes(); },
            render() {
                const container = document.getElementById('notes-container');
                if (!container) return;
                if (this.notes.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:16px;font-size:10px;">📝 Keine Notizen</div>`;
                    return; }
                container.innerHTML = this.notes.map(n =>
                    `<div class="card">
                        <div class="card-title">${n.title}</div>
                        <div class="card-meta">${new Date(n.createdAt).toLocaleDateString()} · ${n.content.length} Zeichen</div>
                        <div style="font-size:10px;opacity:0.6;max-height:30px;overflow:hidden;">${n.content || '(leer)'}</div>
                        <div class="card-actions">
                            <button onclick="NoteSystem.delete('${n.id}')" class="btn-danger">🗑️ Löschen</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        NoteSystem.load();

        // =========================================================
        // KALENDER SYSTEM
        // =========================================================
        const CalendarSystem = {
            events: [],
            load() { this.events = Storage.get('events', []); return this; },
            save() { Storage.set('events', this.events); return this; },
            add() {
                const title = document.getElementById('event-title');
                const date = document.getElementById('event-date');
                const desc = document.getElementById('event-desc');
                if (!title || !date) return;
                const event = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Termin', date: date.value || new Date().toISOString().split('T')[0], description: desc?.value ||
                        '', createdAt: new Date().toISOString() };
                this.events.push(event);
                this.save();
                title.value = '';
                if (desc) desc.value = '';
                AppRouter.renderCalendar();
                speak('Termin hinzugefügt.');
            },
            delete(id) { this.events = this.events.filter(e => e.id !== id);
                this.save();
                AppRouter.renderCalendar(); },
            render() {
                const container = document.getElementById('calendar-container');
                if (!container) return;
                const sorted = [...this.events].sort((a, b) => a.date.localeCompare(b.date));
                if (sorted.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:16px;font-size:10px;">📅 Keine Termine</div>`;
                    return; }
                container.innerHTML = sorted.map(e =>
                    `<div class="card">
                        <div class="card-title">${e.title}</div>
                        <div class="card-meta">📅 ${new Date(e.date + 'T00:00:00').toLocaleDateString('de-DE')}</div>
                        ${e.description ? `<div style="font-size:9px;opacity:0.5;">${e.description}</div>` : ''}
                        <div class="card-actions">
                            <button onclick="CalendarSystem.delete('${e.id}')" class="btn-danger">🗑️ Löschen</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        CalendarSystem.load();

        // =========================================================
        // KONTAKTE SYSTEM
        // =========================================================
        const ContactSystem = {
            contacts: [],
            load() { this.contacts = Storage.get('contacts', []); return this; },
            save() { Storage.set('contacts', this.contacts); return this; },
            add() {
                const name = document.getElementById('contact-name');
                const phone = document.getElementById('contact-phone');
                const email = document.getElementById('contact-email');
                if (!name || !phone) return;
                const contact = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: name.value ||
                        'Unbekannt', phone: phone.value || '', email: email?.value || '', createdAt: new Date()
                        .toISOString() };
                this.contacts.push(contact);
                this.save();
                name.value = '';
                phone.value = '';
                if (email) email.value = '';
                AppRouter.renderContacts();
                speak('Kontakt hinzugefügt.');
            },
            delete(id) { this.contacts = this.contacts.filter(c => c.id !== id);
                this.save();
                AppRouter.renderContacts(); },
            render() {
                const container = document.getElementById('contacts-container');
                if (!container) return;
                if (this.contacts.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:16px;font-size:10px;">👤 Keine Kontakte</div>`;
                    return; }
                container.innerHTML = this.contacts.map(c =>
                    `<div class="card">
                        <div class="card-title">${c.name}</div>
                        <div class="card-meta">📞 ${c.phone} ${c.email ? '· ✉️ ' + c.email : ''}</div>
                        <div class="card-actions">
                            <button onclick="ContactSystem.delete('${c.id}')" class="btn-danger">🗑️ Löschen</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        ContactSystem.load();

        // =========================================================
        // FILES SYSTEM
        // =========================================================
        const FileSystem = {
            files: [],
            load() { this.files = Storage.get('files', []); return this; },
            save() { Storage.set('files', this.files); return this; },
            create() {
                const name = document.getElementById('file-name');
                const content = document.getElementById('file-content');
                if (!name) return;
                const file = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: name.value ||
                        'Unbenannt', content: content?.value || '', size: Math.floor((content?.value?.length || 0) /
                        1024 * 10) / 10 + ' KB', createdAt: new Date().toISOString() };
                this.files.unshift(file);
                this.save();
                name.value = '';
                if (content) content.value = '';
                AppRouter.renderFiles();
                speak('Datei erstellt.');
            },
            delete(id) { this.files = this.files.filter(f => f.id !== id);
                this.save();
                AppRouter.renderFiles(); },
            render() {
                const container = document.getElementById('files-container');
                if (!container) return;
                if (this.files.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:16px;font-size:10px;">📁 Keine Dateien</div>`;
                    return; }
                container.innerHTML = this.files.map(f =>
                    `<div class="card">
                        <div class="card-title">${f.name}</div>
                        <div class="card-meta">${f.size} · ${new Date(f.createdAt).toLocaleDateString()}</div>
                        <div style="font-size:10px;opacity:0.5;max-height:30px;overflow:hidden;">${f.content || '(leer)'}</div>
                        <div class="card-actions">
                            <button onclick="FileSystem.delete('${f.id}')" class="btn-danger">🗑️ Löschen</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        FileSystem.load();

        // =========================================================
        // TASKS SYSTEM
        // =========================================================
        const TaskSystem = {
            tasks: [],
            load() { this.tasks = Storage.get('tasks', []); return this; },
            save() { Storage.set('tasks', this.tasks); return this; },
            add() {
                const title = document.getElementById('task-title');
                const date = document.getElementById('task-date');
                if (!title) return;
                const task = { id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), title: title.value ||
                        'Aufgabe', date: date?.value || new Date().toISOString().split('T')[0], done: false,
                    createdAt: new Date().toISOString() };
                this.tasks.push(task);
                this.save();
                title.value = '';
                AppRouter.renderTasks();
                speak('Aufgabe hinzugefügt.');
            },
            toggle(id) { const task = this.tasks.find(t => t.id === id); if (task) { task.done = !task.done;
                    this.save();
                    AppRouter.renderTasks(); } },
            delete(id) { this.tasks = this.tasks.filter(t => t.id !== id);
                this.save();
                AppRouter.renderTasks(); },
            render() {
                const container = document.getElementById('tasks-container');
                if (!container) return;
                if (this.tasks.length === 0) { container.innerHTML =
                        `<div style="text-align:center;opacity:0.3;padding:16px;font-size:10px;">✅ Keine Aufgaben</div>`;
                    return; }
                container.innerHTML = this.tasks.map(t =>
                    `<div class="card" style="${t.done ? 'opacity:0.5;' : ''}">
                        <div class="card-title">${t.done ? '✅' : '⬜'} ${t.title}</div>
                        <div class="card-meta">📅 ${new Date(t.date + 'T00:00:00').toLocaleDateString('de-DE')}</div>
                        <div class="card-actions">
                            <button onclick="TaskSystem.toggle('${t.id}')" class="btn-secondary">${t.done ? '↩️ Rückgängig' : '✅ Erledigt'}</button>
                            <button onclick="TaskSystem.delete('${t.id}')" class="btn-danger">🗑️ Löschen</button>
                        </div>
                    </div>`
                ).join('');
            }
        };
        TaskSystem.load();

        // =========================================================
        // HALDO AI
        // =========================================================
        const HalDoAI = {
            knowledge: {
                'wer bist du': 'Ich bin HalDo AI, ein professionelles KI-System für Dokumente, Analysen, Verkehrswarnungen und allgemeine Anfragen.',
                'was kannst du': 'Ich kann Verkehrswarnungen verwalten, Dokumente analysieren, Fragen beantworten und komplexe Informationen verarbeiten.',
                'hilfe': 'Ich unterstütze bei: Dokumentenanalyse, Verkehrswarnungen, Fragebögen und allgemeinen Aufgaben.',
                'dokument': 'Ich kann Dokumente analysieren, zusammenfassen und korrigieren.',
                'verkehr': 'Ich verwalte Verkehrswarnungen mit automatischen Ansagen und unterschiedlichen Tönen.',
                'fragebogen': 'Ich erstelle Fragebögen mit Bildern, Videos und verschiedenen Fragetypen.',
                'brief': 'Ich kann professionelle Briefe verfassen und korrigieren.'
            },
            ask(text) {
                const lower = text.toLowerCase().trim();
                if (!lower) return 'Bitte geben Sie eine Frage ein.';
                for (const [key, value] of Object.entries(this.knowledge)) {
                    if (lower.includes(key)) return value;
                }
                if (lower.includes('hallo') || lower.includes('hi') || lower.includes('hey')) {
                    return 'Guten Tag. Wie kann ich Sie unterstützen?';
                }
                if (lower.includes('danke')) return 'Gern geschehen.';
                if (lower.includes('tschüss') || lower.includes('bye')) return 'Auf Wiedersehen.';
                const responses = ['Ich habe Ihre Anfrage verarbeitet. Bitte spezifizieren Sie.',
                    'Verstanden. Bitte geben Sie mehr Details.',
                    'Diese Anfrage erfordert weitere Informationen.',
                    'Ich kann Ihnen helfen. Bitte konkretisieren Sie.'
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }
        };

        // =========================================================
        // BOOT
        // =========================================================
        window._startTime = Date.now();

        function boot() {
            console.log(`🌌 HalDo AI OS v${HALDO_VERSION} ${HALDO_BUILD}`);
            console.log(`📱 ${APP_LIST.length} Apps`);

            // Stars generieren
            const container = document.getElementById('cosmic-stars');
            if (container) {
                for (let i = 0; i < 80; i++) {
                    const star = document.createElement('span');
                    star.className = 'cosmic-star';
                    const size = Math.random() * 2 + 0.5;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.setProperty('--speed', (2 + Math.random() * 4) + 's');
                    container.appendChild(star);
                }
            }

            // Particles
            const pContainer = document.getElementById('cosmic-particles');
            if (pContainer) {
                for (let i = 0; i < 20; i++) {
                    const p = document.createElement('span');
                    p.className = 'cosmic-particle';
                    const size = Math.random() * 4 + 2;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = Math.random() * 100 + '%';
                    p.style.setProperty('--duration', (3 + Math.random() * 4) + 's');
                    p.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
                    p.style.setProperty('--dy', (Math.random() * 40 - 20) + 'px');
                    pContainer.appendChild(p);
                }
            }

            AppRouter.init();

            setTimeout(() => {
                WarningSystem.add('baustelle', 'Baustelle A1', 'Fahrbahnverengung, 60 km/h', 'A1, km 45');
            }, 2000);
            setTimeout(() => {
                WarningSystem.add('blitzer', 'Blitzer A100', '80 km/h erlaubt', 'A100, Höhe Köln');
            }, 5000);
            setTimeout(() => {
                setStatus('System bereit');
                speak('HalDo AI OS erfolgreich gestartet. 100 Apps verfügbar.');
            }, 1000);

            console.log('✅ System bereit');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>
