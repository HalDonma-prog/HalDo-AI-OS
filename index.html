<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050711"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="HalDo AI OS"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 — Professional Ultimate Foundation"
    >

    <title>HalDo AI OS 20</title>


    <!-- =====================================================
         PWA
         ===================================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- =====================================================
         HALDO GLOBAL RESET
         ===================================================== -->

    <style>

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        html {
            background: #050711;
            color-scheme: dark;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(110,130,255,.18),
                    transparent 42%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(255,100,180,.08),
                    transparent 35%
                ),
                #050711;

            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
        }


        /* =================================================
           APPLICATION ROOT
           ================================================= */

        #haldo-root {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        /* =================================================
           BOOT SCREEN
           ================================================= */

        #haldo-boot {
            position: fixed;
            inset: 0;
            z-index: 999999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(100,120,255,.18),
                    transparent 32%
                ),
                #050711;

            opacity: 1;

            transition:
                opacity .65s ease,
                visibility .65s ease;
        }

        #haldo-boot.is-finished {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        .boot-content {
            width:
                min(
                    92vw,
                    520px
                );

            text-align: center;
        }


        /* =================================================
           HALDO LOGO
           ================================================= */

        .boot-logo {
            width: 108px;
            height: 108px;

            margin:
                0 auto 25px;

            display: grid;
            place-items: center;

            border-radius: 32px;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.95),
                    rgba(125,145,255,.55) 40%,
                    rgba(70,80,180,.22) 70%,
                    transparent 100%
                );

            box-shadow:
                0 0 35px
                rgba(110,140,255,.38);

            animation:
                haldo-breathe
                3.5s ease-in-out infinite;
        }

        .boot-logo-text {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -.08em;

            text-shadow:
                0 0 25px
                rgba(255,255,255,.55);
        }


        @keyframes haldo-breathe {

            0%,
            100% {
                transform: scale(1);
                opacity: .88;
            }

            50% {
                transform: scale(1.055);
                opacity: 1;
            }

        }


        /* =================================================
           BOOT TITLE
           ================================================= */

        .boot-title {
            margin: 0;

            font-size:
                clamp(
                    24px,
                    5vw,
                    38px
                );

            font-weight: 800;

            letter-spacing:
                -.035em;
        }


        .boot-subtitle {
            margin:
                8px 0 0;

            font-size: 13px;

            opacity: .5;
        }


        /* =================================================
           BOOT MESSAGE
           ================================================= */

        #haldo-boot-message {
            margin-top: 32px;

            min-height: 22px;

            font-size: 14px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    .76
                );
        }


        /* =================================================
           BOOT PROGRESS
           ================================================= */

        .boot-progress-track {
            width: 100%;
            height: 4px;

            margin-top: 14px;

            overflow: hidden;

            border-radius: 999px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .08
                );
        }


        #haldo-boot-progress {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #7c8cff,
                    #d8ddff,
                    #8d9aff
                );

            box-shadow:
                0 0 15px
                rgba(
                    130,
                    150,
                    255,
                    .65
                );

            transition:
                width .25s ease;
        }


        #haldo-boot-detail {
            margin-top: 11px;

            min-height: 17px;

            font-size: 10px;

            opacity: .32;
        }


        /* =================================================
           DESKTOP HOST
           ================================================= */

        #haldo-desktop-host {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        /* =================================================
           ERROR PANEL
           ================================================= */

        #haldo-error {
            position: fixed;

            left: 50%;
            bottom: 22px;

            z-index: 1000000;

            width:
                min(
                    92vw,
                    600px
                );

            transform:
                translateX(-50%);

            padding: 15px 17px;

            display: none;

            border:
                1px solid
                rgba(
                    255,
                    100,
                    100,
                    .25
                );

            border-radius: 16px;

            background:
                rgba(
                    35,
                    10,
                    18,
                    .94
                );

            box-shadow:
                0 15px 50px
                rgba(
                    0,
                    0,
                    0,
                    .4
                );
        }

        #haldo-error.visible {
            display: block;
        }

        #haldo-error-title {
            font-weight: 700;
            font-size: 13px;
        }

        #haldo-error-message {
            margin-top: 5px;
            font-size: 11px;
            opacity: .7;
            line-height: 1.5;
        }


        /* =================================================
           ACCESSIBILITY
           ================================================= */

        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {
                animation-duration:
                    .001ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .001ms !important;
            }

        }

    </style>

</head>


<body>

    <!-- =====================================================
         ROOT
         ===================================================== -->

    <div
        id="haldo-root"
        data-haldo-root
    >


        <!-- ================================================
             DESKTOP / DASHBOARD HOST
             ================================================ -->

        <main
            id="haldo-desktop-host"
            data-haldo-desktop-host
            aria-live="polite"
        ></main>


        <!-- ================================================
             BOOT SCREEN
             ================================================ -->

        <section
            id="haldo-boot"
            data-haldo-boot
            aria-label="HalDo AI OS Start"
        >

            <div
                class="boot-content"
            >

                <div
                    class="boot-logo"
                    aria-hidden="true"
                >

                    <span
                        class="boot-logo-text"
                    >
                        H
                    </span>

                </div>


                <h1
                    class="boot-title"
                >
                    HalDo AI OS 20
                </h1>


                <p
                    class="boot-subtitle"
                >
                    Professional Ultimate Foundation
                </p>


                <div
                    id="haldo-boot-message"
                    data-boot-message
                >
                    HalDo AI OS wird vorbereitet …
                </div>


                <div
                    class="boot-progress-track"
                >

                    <div
                        id="haldo-boot-progress"
                        data-boot-progress
                    ></div>

                </div>


                <div
                    id="haldo-boot-detail"
                    data-boot-detail
                >
                    Stage: foundation · 0%
                </div>

            </div>

        </section>


        <!-- ================================================
             ERROR
             ================================================ -->

        <section
            id="haldo-error"
            role="alert"
        >

            <div
                id="haldo-error-title"
            >
                HalDo AI OS Startfehler
            </div>

            <div
                id="haldo-error-message"
            ></div>

        </section>

    </div>


    <!-- =====================================================
         HALDO CORE
         =====================================================

         WICHTIG:
         kernel.js bleibt die vorhandene Kernel-Grundlage.
         ===================================================== -->

    <script
        src="js/kernel.js"
    ></script>


    <!-- =====================================================
         HALDO BOOTSTRAP
         ===================================================== -->

    <script
        src="js/haldo-bootstrap.js"
    ></script>


    <!-- =====================================================
         INDEX BOOT BRIDGE
         ===================================================== -->

    <script>

        (function () {

            "use strict";


            /*
             * =================================================
             * HALDO INDEX BRIDGE
             * =================================================
             *
             * Diese Bridge verbindet die Boot-Oberfläche
             * mit dem vorhandenen Bootstrap.
             *
             * Sie erstellt keinen zweiten Kernel.
             * =================================================
             */


            const boot =
                document.querySelector(
                    "[data-haldo-boot]"
                );


            const progress =
                document.querySelector(
                    "[data-boot-progress]"
                );


            const message =
                document.querySelector(
                    "[data-boot-message]"
                );


            const detail =
                document.querySelector(
                    "[data-boot-detail]"
                );


            const errorPanel =
                document.querySelector(
                    "#haldo-error"
                );


            const errorMessage =
                document.querySelector(
                    "#haldo-error-message"
                );


            function update(
                data
            ) {

                if (!data) {
                    return;
                }


                if (
                    progress
                ) {

                    const value =
                        Number(
                            data.progress
                        ) || 0;

                    progress.style.width =
                        `${Math.max(
                            0,
                            Math.min(
                                100,
                                value
                            )
                        )}%`;

                }


                if (
                    message &&
                    data.message
                ) {

                    message.textContent =
                        data.message;

                }


                if (
                    detail
                ) {

                    detail.textContent =
                        `Stage: ${
                            data.stage ||
                            "unknown"
                        } · ${
                            Number(
                                data.progress
                            ) || 0
                        }%`;

                }

            }


            function ready() {

                update({

                    stage:
                        "ready",

                    progress:
                        100,

                    message:
                        "HalDo AI OS ist bereit."

                });


                if (
                    boot
                ) {

                    boot.classList.add(
                        "is-finished"
                    );

                }

            }


            function failed(
                event
            ) {

                const data =
                    event?.detail ||
                    {};


                const error =
                    data.error;


                if (
                    errorPanel
                ) {

                    errorPanel.classList.add(
                        "visible"
                    );

                }


                if (
                    errorMessage
                ) {

                    errorMessage.textContent =
                        error?.message ||
                        "Unbekannter Startfehler.";

                }

            }


            /*
             * Bootstrap Events
             */

            window.addEventListener(
                "haldo:bootstrap:stage",
                event => {

                    update(
                        event.detail
                    );

                }
            );


            window.addEventListener(
                "haldo:boot:stage",
                event => {

                    update(
                        event.detail
                    );

                }
            );


            window.addEventListener(
                "haldo:bootstrap:ready",
                ready
            );


            window.addEventListener(
                "haldo:boot:ready",
                ready
            );


            window.addEventListener(
                "haldo:boot:failed",
                failed
            );


            /*
             * Falls der Bootstrap bereits fertig ist,
             * bevor die Bridge ihre Listener registriert.
             */

            window.setTimeout(
                function () {

                    try {

                        if (
                            window.HalDo &&
                            window.HalDo.boot &&
                            window.HalDo.boot.finished
                        ) {

                            ready();

                        }

                    } catch (error) {

                        console.warn(
                            "[HalDo Index]",
                            error
                        );

                    }

                },
                100
            );


            /*
             * Online / Offline
             */

            window.addEventListener(
                "online",
                function () {

                    document.documentElement
                        .dataset.network =
                        "online";

                }
            );


            window.addEventListener(
                "offline",
                function () {

                    document.documentElement
                        .dataset.network =
                        "offline";

                }
            );


            /*
             * Globaler Fehlerfänger.
             *
             * Wir zeigen den Fehler an,
             * verhindern aber nicht,
             * dass die restliche Anwendung
             * weiterarbeiten kann.
             */

            window.addEventListener(
                "error",
                function (event) {

                    if (
                        !event.error
                    ) {
                        return;
                    }

                    console.error(
                        "[HalDo OS]",
                        event.error
                    );

                }
            );


            window.addEventListener(
                "unhandledrejection",
                function (event) {

                    console.error(
                        "[HalDo OS] Unhandled Promise:",
                        event.reason
                    );

                }
            );

        })();

    </script>


    <!-- =====================================================
         SERVICE WORKER REGISTRATION
         ===================================================== -->

    <script>

        (function () {

            "use strict";


            if (
                "serviceWorker" in
                navigator
            ) {

                window.addEventListener(
                    "load",
                    function () {

                        navigator.serviceWorker
                            .register(
                                "service-worker.js"
                            )
                            .then(
                                registration => {

                                    console.info(
                                        "[HalDo PWA] Service Worker registriert.",
                                        registration.scope
                                    );

                                }
                            )
                            .catch(
                                error => {

                                    console.warn(
                                        "[HalDo PWA] Service Worker konnte nicht registriert werden:",
                                        error
                                    );

                                }
                            );

                    }
                );

            }

        })();

    </script>

</body>

</html>
