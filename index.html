                    );


            const templates = {

                files:
                    $("#file-manager-template"),

                calendar:
                    $("#calendar-template"),

                keyboard:
                    $("#ezidi-keyboard-template"),

                voice:
                    $("#voice-template"),

                search:
                    $("#search-template"),

                notifications:
                    $("#notifications-template"),

                music:
                    $("#music-template"),

                settings:
                    $("#settings-template")

            };


            /* =================================================
               STORAGE
            ================================================== */

            const storage = {

                get(
                    key,
                    fallback
                ) {

                    try {

                        const raw =
                            localStorage.getItem(
                                `haldo20:${key}`
                            );


                        return raw === null
                            ? fallback
                            : JSON.parse(raw);

                    } catch (_) {

                        return fallback;

                    }

                },


                set(
                    key,
                    value
                ) {

                    try {

                        localStorage.setItem(
                            `haldo20:${key}`,
                            JSON.stringify(
                                value
                            )
                        );

                    } catch (_) {}

                }

            };


            /* =================================================
               GENERIC TEMPLATE RENDER
            ================================================== */

            function useTemplate(
                body,
                template
            ) {

                if (
                    !body ||
                    !template
                ) {

                    return false;

                }


                body.appendChild(
                    template.content
                        .cloneNode(true)
                );


                return true;

            }


            /* =================================================
               FILE MANAGER
            ================================================== */

            function renderFiles(
                body
            ) {

                if (
                    !useTemplate(
                        body,
                        templates.files
                    )
                ) {

                    return;

                }


                const list =
                    body.querySelector(
                        "[data-file-list]"
                    );


                let files =
                    storage.get(
                        "files",
                        []
                    );


                if (
                    !Array.isArray(files)
                ) {

                    files = [];

                }


                function draw() {

                    list.innerHTML = "";


                    if (!files.length) {

                        list.innerHTML = `
                            <div class="haldo-empty">
                                Noch keine Dateien vorhanden.
                            </div>
                        `;

                        return;

                    }


                    files.forEach(
                        file => {

                            const item =
                                document.createElement(
                                    "div"
                                );


                            item.className =
                                "file-item";


                            item.innerHTML = `
                                <div class="file-icon">
                                    ${file.type === "folder" ? "▱" : "□"}
                                </div>

                                <div class="haldo-row-main">

                                    <div class="haldo-row-title">
                                        ${escapeHTML(file.name)}
                                    </div>

                                    <div class="haldo-row-description">
                                        ${escapeHTML(file.type || "Datei")}
                                    </div>

                                </div>
                            `;


                            list.appendChild(
                                item
                            );

                        }
                    );

                }


                body.querySelector(
                    "[data-file-new]"
                )?.addEventListener(
                    "click",
                    () => {

                        const name =
                            window.prompt(
                                "Name der neuen Datei:"
                            );


                        if (
                            !name ||
                            !name.trim()
                        ) {

                            return;

                        }


                        files.push({
                            id:
                                crypto.randomUUID
                                    ? crypto.randomUUID()
                                    : String(
                                        Date.now()
                                    ),

                            name:
                                name.trim(),

                            type:
                                "Datei",

                            created:
                                Date.now()

                        });


                        storage.set(
                            "files",
                            files
                        );


                        draw();

                    }
                );


                body.querySelector(
                    "[data-file-refresh]"
                )?.addEventListener(
                    "click",
                    draw
                );


                draw();

            }


            /* =================================================
               CALENDAR
            ================================================== */

            function renderCalendar(
                body
            ) {

                if (
                    !useTemplate(
                        body,
                        templates.calendar
                    )
                ) {

                    return;

                }


                const grid =
                    body.querySelector(
                        "[data-calendar-grid]"
                    );


                const label =
                    body.querySelector(
                        "[data-calendar-month]"
                    );


                const events =
                    storage.get(
                        "calendar-events",
                        []
                    );


                const state = {

                    date:
                        new Date()

                };


                function draw() {

                    const year =
                        state.date.getFullYear();


                    const month =
                        state.date.getMonth();


                    const first =
                        new Date(
                            year,
                            month,
                            1
                        );


                    const last =
                        new Date(
                            year,
                            month + 1,
                            0
                        );


                    const monthName =
                        state.date.toLocaleDateString(
                            "de-DE",
                            {
                                month: "long",
                                year: "numeric"
                            }
                        );


                    label.textContent =
                        monthName;


                    grid.innerHTML = "";


                    [
                        "Mo",
                        "Di",
                        "Mi",
                        "Do",
                        "Fr",
                        "Sa",
                        "So"
                    ].forEach(
                        day => {

                            const element =
                                document.createElement(
                                    "div"
                                );


                            element.className =
                                "calendar-day-name";


                            element.textContent =
                                day;


                            grid.appendChild(
                                element
                            );

                        }
                    );


                    let startDay =
                        first.getDay();


                    startDay =
                        startDay === 0
                            ? 6
                            : startDay - 1;


                    for (
                        let i = 0;
                        i < startDay;
                        i++
                    ) {

                        const empty =
                            document.createElement(
                                "div"
                            );


                        empty.className =
                            "calendar-day empty";


                        grid.appendChild(
                            empty
                        );

                    }


                    const today =
                        new Date();


                    for (
                        let day = 1;
                        day <= last.getDate();
                        day++
                    ) {

                        const element =
                            document.createElement(
                                "button"
                            );


                        element.type =
                            "button";


                        element.className =
                            "calendar-day";


                        element.textContent =
                            day;


                        if (
                            day ===
                                today.getDate() &&
                            month ===
                                today.getMonth() &&
                            year ===
                                today.getFullYear()
                        ) {

                            element.classList.add(
                                "today"
                            );

                        }


                        element.addEventListener(
                            "click",
                            () => {

                                const title =
                                    window.prompt(
                                        `Termin für ${day}.${month + 1}.${year}:`
                                    );


                                if (
                                    !title ||
                                    !title.trim()
                                ) {

                                    return;

                                }


                                events.push({
                                    date:
                                        `${year}-${String(
                                            month + 1
                                        ).padStart(
                                            2,
                                            "0"
                                        )}-${String(
                                            day
                                        ).padStart(
                                            2,
                                            "0"
                                        )}`,

                                    title:
                                        title.trim()

                                });


                                storage.set(
                                    "calendar-events",
                                    events
                                );

                                draw();

                            }
                        );


                        grid.appendChild(
                            element
                        );

                    }

                }


                body.querySelector(
                    "[data-calendar-prev]"
                )?.addEventListener(
                    "click",
                    () => {

                        state.date.setMonth(
                            state.date.getMonth() - 1
                        );

                        draw();

                    }
                );


                body.querySelector(
                    "[data-calendar-next]"
                )?.addEventListener(
                    "click",
                    () => {

                        state.date.setMonth(
                            state.date.getMonth() + 1
                        );

                        draw();

                    }
                );


                body.querySelector(
                    "[data-calendar-add]"
                )?.addEventListener(
                    "click",
                    () => {

                        const title =
                            body.querySelector(
                                "[data-calendar-title]"
                            );


                        if (
                            !title ||
                            !title.value.trim()
                        ) {

                            return;

                        }


                        const now =
                            new Date();


                        events.push({
                            date:
                                now.toISOString()
                                    .slice(
                                        0,
                                        10
                                    ),

                            title:
                                title.value.trim()

                        });


                        storage.set(
                            "calendar-events",
                            events
                        );


                        title.value = "";

                        draw();

                    }
                );


                draw();

            }


            /* =================================================
               EZIDI KEYBOARD
            ================================================== */

            function renderKeyboard(
                body
            ) {

                if (
                    !useTemplate(
                        body,
                        templates.keyboard
                    )
                ) {

                    return;

                }


                const display =
                    body.querySelector(
                        "[data-keyboard-display]"
                    );


                const grid =
                    body.querySelector(
                        "[data-keyboard-grid]"
                    );


                /*
                 * Sorani/Kurmanji-compatible
                 * Latin + Arabic-script keyboard
                 * foundation.
                 */

                const keys = [
                    "a",
                    "b",
                    "c",
                    "ç",
                    "d",
                    "e",
                    "ê",
                    "f",
                    "g",
                    "h",
                    "i",
                    "î",
                    "j",
                    "k",
                    "l",
                    "m",
                    "n",
                    "o",
                    "p",
                    "q",
                    "r",
                    "s",
                    "ş",
                    "t",
                    "u",
                    "û",
                    "v",
                    "w",
                    "x",
                    "y",
                    "z",

                    "ە",
                    "ا",
                    "ب",
                    "پ",
                    "ت",
                    "ج",
                    "چ",
                    "ح",
                    "خ",
                    "د",
                    "ر",
                    "ڕ",
                    "ز",
                    "ژ",
                    "س",
                    "ش",
                    "ع",
                    "غ",
                    "ف",
                    "ڤ",
                    "ق",
                    "ک",
                    "گ",
                    "ل",
                    "م",
                    "ن",
                    "ه",
                    "ۆ",
                    "ی",
                    "ێ"
                ];


                let value = "";


                function update() {

                    display.textContent =
                        value ||
                        "Schreibe mit HalDo …";

                }


                keys.forEach(
                    key => {

                        const button =
                            document.createElement(
                                "button"
                            );


                        button.type =
                            "button";


                        button.className =
                            "keyboard-key";


                        button.textContent =
                            key;


                        button.addEventListener(
                            "click",
                            () => {

                                value +=
                                    key;

                                update();

                            }
                        );


                        grid.appendChild(
                            button
                        );

                    }
                );


                body.querySelector(
                    "[data-keyboard-space]"
                )?.addEventListener(
                    "click",
                    () => {

                        value += " ";

                        update();

                    }
                );


                body.querySelector(
                    "[data-keyboard-backspace]"
                )?.addEventListener(
                    "click",
                    () => {

                        value =
                            value.slice(
                                0,
                                -1
                            );

                        update();

                    }
                );


                body.querySelector(
                    "[data-keyboard-copy]"
                )?.addEventListener(
                    "click",
                    async () => {

                        if (
                            !value
                        ) {

                            return;

                        }


                        try {

                            await navigator.clipboard
                                .writeText(
                                    value
                                );

                        } catch (_) {

                            window.prompt(
                                "Text kopieren:",
                                value
                            );

                        }

                    }
                );


                update();

            }


            /* =================================================
               VOICE
            ================================================== */

            function renderVoice(
                body
            ) {

                if (
                    !useTemplate(
                        body,
                        templates.voice
                    )
                ) {

                    return;

                }


                const orb =
                    body.querySelector(
                        "[data-voice-toggle]"
                    );


                const status =
                    body.querySelector(
                        "[data-voice-status]"
                    );


                const language =
                    body.querySelector(
                        "[data-voice-language]"
                    );


                let recognition =
                    null;


                let listening =
                    false;


                const Recognition =
                    window.SpeechRecognition ||
                    window.webkitSpeechRecognition;


                if (Recognition) {

                    recognition =
                        new Recognition();


                    recognition.continuous =
                        false;


                    recognition.interimResults =
                        true;


                    recognition.lang =
                        language.value;


                    recognition.onstart =
                        () => {

                            listening =
                                true;

                            orb.classList.add(
                                "listening"
                            );

                            status.textContent =
                                "Ich höre …";

                        };


                    recognition.onend =
                        () => {

                            listening =
                                false;

                            orb.classList.remove(
                                "listening"
                            );

                            status.textContent =
                                "Bereit";

                        };


                    recognition.onerror =
                        () => {

                            listening =
                                false;

                            orb.classList.remove(
                                "listening"
                            );

                            status.textContent =
                                "Spracherkennung nicht verfügbar.";

                        };


                    recognition.onresult =
                        event => {

                            let text = "";


                            for (
                                let i =
                                    event.resultIndex;
                                i <
                                    event.results.length;
                                i++
                            ) {

                                text +=
                                    event.results[
                                        i
                                    ][0]
                                        .transcript;

                            }


                            if (
                                text.trim()
                            ) {

                                OS.events.emit(
                                    "ai:voice-input",
                                    {
                                        text:
                                            text.trim()
                                    }
                                );

                            }

                        };

                } else {

                    status.textContent =
                        "Browser unterstützt keine Spracherkennung.";

                }


                language.addEventListener(
                    "change",
                    () => {

                        if (recognition) {

                            recognition.lang =
                                language.value;

                        }

                    }
                );


                orb.addEventListener(
                    "click",
                    () => {

                        if (!recognition) {
                            return;
                        }


                        if (listening) {

                            recognition.stop();

                        } else {

                            recognition.start();

                        }

                    }
                );

            }


            /* =================================================
               SEARCH
            ================================================== */

            function renderSearch(
                body
            ) {

                if (
                    !useTemplate(
                        body,
                        templates.search
                    )
                ) {

                    return;

                }


                const input =
                    body.querySelector(
                        "[data-system-search]"
                    );


                const results =
                    body.querySelector(
                        "[data-search-results]"
                    );


                function draw(
                    query = ""
                ) {

                    results.innerHTML = "";


                    const q =
                        query
                            .trim()
                            .toLowerCase();


                    if (!q) {

                        results.innerHTML = `
                            <div class="haldo-empty">
                                Suche nach einer HalDo App.
                            </div>
                        `;

                        return;

                    }


                    shellApps
                        .filter(
                            app =>
                                app.name
                                    .toLowerCase()
                                    .includes(q) ||
                                app.id
                                    .toLowerCase()
                                    .includes(q) ||
                                app.description
                                    .toLowerCase()
                                    .includes(q)
                        )
                        .forEach(
                            app => {

                                const result =
                                    document.createElement(
                                        "button"
                                    );


                                result.type =
                                    "button";


                                result.className =
                                    "search-result";


                                result.innerHTML = `
                                    <div class="haldo-row-title">
                                        ${escapeHTML(app.icon)}
                                        &nbsp;
                                        ${escapeHTML(app.name)}
                                    </div>

                                    <div class="haldo-row-description">
                                        ${escapeHTML(app.description)}
                                    </div>
                                `;


                                result.addEventListener(
                                    "click",
                                    () => {

                                        window.HalDoOpenApp(
                                            app.id
                                        );

                                    }
                                );


                                results.appendChild(
                                    result
                                );

                            }
                        );


                    if (!results.children.length) {

                        results.innerHTML = `
                            <div class="haldo-empty">
                                Keine App gefunden.
                            </div>
                        `;

                    }

                }


                input.addEventListener(
                    "input",
                    event =>
                        draw(
                            event.target.value
                        )
                );


                draw();

            }


            /* =================================================
               NOTIFICATIONS
            ================================================== */

            function renderNotifications(
                body
            ) {

                if (
                    !useTemplate(
                        body,
                        templates.notifications
                    )
                ) {

                    return;

                }


                const list =
                    body.querySelector(
                        "[data-notification-list]"
                    );


                const notifications =
                    storage.get(
                        "notifications",
                        [
                            {
                                title:
                                    "HalDo AI OS",
                                text:
                                    "Systemoberfläche erfolgreich geladen."
                            }
                        ]
                    );


                function draw() {

                    list.innerHTML = "";


                    if (
                        !notifications.length
                    ) {

                        list.innerHTML = `
                            <div class="haldo-empty">
                                Keine Benachrichtigungen.
                            </div>
                        `;

                        return;

                    }


                    notifications
                        .slice()
                        .reverse()
                        .forEach(
                            item => {

                                const element =
                                    document.createElement(
                                        "div"
                                    );


                                element.className =
                                    "notification";


                                element.innerHTML = `
                                    <div class="notification-title">
                                        ${escapeHTML(item.title)}
                                    </div>

                                    <div class="notification-text">
                                        ${escapeHTML(item.text)}
                                    </div>
                                `;


                                list.appendChild(
                                    element
                                );

                            }
                        );

                }


                draw();

            }


            /* =================================================
               MUSIC
            ================================================== */

            function renderMusic(
                body
            ) {

                if (
                    !useTemplate(
                        body,
                        templates.music
                    )
                ) {

                    return;

                }


                const toggle =
                    body.querySelector(
                        "[data-music-toggle]"
                    );


                let playing =
                    false;


                toggle?.addEventListener(
                    "click",
                    () => {

                        playing =
                            !playing;


                        toggle.textContent =
                            playing
                                ? "Ⅱ"
                                : "▶";


                        OS.events.emit(
                            "media:playback",
                            {
                                playing
                            }
                        );

                    }
                );

            }


            /* =================================================
               SETTINGS
            ================================================== */

            function renderSettings(
                body
            ) {

                if (
                    !useTemplate(
                        body,
                        templates.settings
                    )
                ) {

                    return;

                }


                body.querySelectorAll(
                    "[data-setting]"
                ).forEach(
                    toggle => {

                        const key =
                            toggle.dataset
                                .setting;


                        const saved =
                            storage.get(
                                `setting:${key}`,
                                true
                            );


                        toggle.classList.toggle(
                            "active",
                            Boolean(saved)
                        );


                        toggle.addEventListener(
                            "click",
                            () => {

                                const value =
                                    !toggle.classList
                                        .contains(
                                            "active"
                                        );


                                toggle.classList.toggle(
                                    "active",
                                    value
                                );


                                storage.set(
                                    `setting:${key}`,
                                    value
                                );


                                OS.events.emit(
                                    "settings:changed",
                                    {
                                        key,
                                        value
                                    }
                                );

                            }
                        );

                    }
                );


                const language =
                    body.querySelector(
                        "[data-setting-language]"
                    );


                language.value =
                    storage.get(
                        "language",
                        "de"
                    );


                language.addEventListener(
                    "change",
                    () => {

                        storage.set(
                            "language",
                            language.value
                        );


                        OS.events.emit(
                            "language:changed",
                            {
                                language:
                                    language.value
                            }
                        );

                    }
                );

            }


            /* =================================================
               ESCAPE HELPER
            ================================================== */

            function escapeHTML(
                value
            ) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.textContent =
                    String(
                        value ?? ""
                    );


                return div.innerHTML;

            }


            /* =================================================
               EXTEND RUNTIME RENDERER

               Der Window-Layer aus Teil 2 bleibt erhalten.
               Wir erweitern ihn lediglich um echte lokale
               System-Apps.
            ================================================== */

            const previousRuntime =
                window.HalDoAppRuntime;


            /*
             * Wir ersetzen NICHT den vorhandenen Runtime-Code.
             * Nur falls die Runtime eine eigene renderApp()
             * besitzt, werden unsere System-Apps davor erkannt.
             */
            if (
                previousRuntime &&
                typeof
                previousRuntime.renderApp ===
                    "function"
            ) {

                const previousRender =
                    previousRuntime.renderApp
                        .bind(
                            previousRuntime
                        );


                previousRuntime.renderApp =
                    function(
                        appId,
                        body
                    ) {

                        const local =
                            {

                                "file-manager":
                                    renderFiles,

                                "calendar":
                                    renderCalendar,

                                "ezidi-keyboard":
                                    renderKeyboard,

                                "voice":
                                    renderVoice,

                                "search":
                                    renderSearch,

                                "notifications":
                                    renderNotifications,

                                "music":
                                    renderMusic,

                                "gallery":
                                    renderGenericLocalGallery,

                                "haldo-settings":
                                    renderSettings,

                                "settings":
                                    renderSettings

                            };


                        if (
                            local[appId]
                        ) {

                            local[appId](
                                body
                            );

                            return true;

                        }


                        return previousRender(
                            appId,
                            body
                        );

                    };

            }


            /* =================================================
               LOCAL GALLERY
            ================================================== */

            function renderGenericLocalGallery(
                body
            ) {

                body.innerHTML = `
                    <div class="haldo-app-shell">

                        <h2 class="app-section-title">
                            Galerie
                        </h2>

                        <p class="app-section-description">
                            Deine Bilder und Medien.
                        </p>

                        <div class="haldo-panel">

                            <div class="haldo-empty">
                                Noch keine Medien importiert.
                            </div>

                        </div>

                    </div>
                `;

            }


            /* =================================================
               AI EVENT BRIDGE
            ================================================== */

            OS.events.on(
                "ai:voice-input",
                payload => {

                    if (
                        !payload ||
                        !payload.text
                    ) {

                        return;

                    }


                    /*
                     * Voice → AI.
                     */

                    OS.events.emit(
                        "ai:message",
                        {
                            text:
                                payload.text,
                            source:
                                "voice"
                        }
                    );


                    /*
                     * Öffnet HalDo AI automatisch,
                     * wenn Spracheingabe erfolgt.
                     */

                    window.HalDoOpenApp(
                        "ai-chat"
                    );

                }
            );


            /* =================================================
               SYSTEM SEARCH SHORTCUT
            ================================================== */

            window.addEventListener(
                "keydown",
                event => {

                    if (
                        (event.metaKey ||
                            event.ctrlKey) &&
                        event.key.toLowerCase() ===
                            "k"
                    ) {

                        event.preventDefault();

                        window.HalDoOpenApp(
                            "search"
                        );

                    }

                }
            );


            /* =================================================
               INITIAL NOTIFICATION
            ================================================== */

            const currentNotifications =
                storage.get(
                    "notifications",
                    []
                );


            if (
                !currentNotifications.length
            ) {

                storage.set(
                    "notifications",
                    [
                        {
                            title:
                                "Willkommen bei HalDo AI OS 20",
                            text:
                                "Die gemeinsame App-Shell, Fensterverwaltung und System-App-Grundlage sind aktiv."
                        }
                    ]
                );

            }


            /* =================================================
               SYSTEM READY
            ================================================== */

            OS.events.emit(
                "system-apps:ready",
                {
                    apps: [
                        "file-manager",
                        "calendar",
                        "ezidi-keyboard",
                        "voice",
                        "search",
                        "notifications",
                        "music",
                        "haldo-settings"
                    ]
                }
            );

        })();
    </script>

                        app.id,
                        app.category,
                        app.description,
                        ...(app.capabilities || [])
                    ]
                    .join(" ")
                    .toLowerCase()
            })
        );


    /* =========================================================
       PUBLIC APP CATALOG
    ========================================================== */

    window.HalDoAppCatalog =
        catalog;


    /*
     * Auch ältere Bestandteile dürfen den Katalog verwenden.
     */

    window.HalDoApps =
        catalog;


    /* =========================================================
       APP LOOKUP
    ========================================================== */

    window.HalDoGetApp =
        function(appId) {

            return catalog.find(
                app =>
                    app.id === appId
            ) || null;

        };


    /* =========================================================
       APP SEARCH
    ========================================================== */

    window.HalDoSearchApps =
        function(query = "") {

            const q =
                String(query)
                    .trim()
                    .toLowerCase();


            if (!q) {

                return [
                    ...catalog
                ];

            }


            return catalog.filter(
                app =>
                    app.keywords
                        .includes(q)
            );

        };


    /* =========================================================
       CATEGORY LOOKUP
    ========================================================== */

    window.HalDoGetAppCategories =
        function() {

            return [
                ...new Set(
                    catalog.map(
                        app =>
                            app.category
                    )
                )
            ];

        };


    window.HalDoGetAppsByCategory =
        function(category) {

            return catalog.filter(
                app =>
                    app.category ===
                    category
            );

        };


    /* =========================================================
       APP CAPABILITY CHECK
    ========================================================== */

    window.HalDoAppCan =
        function(
            appId,
            capability
        ) {

            const app =
                window.HalDoGetApp(
                    appId
                );


            if (!app) {
                return false;
            }


            return (
                app.capabilities ||
                []
            ).includes(
                capability
            );

        };


    /* =========================================================
       APP LAUNCH BRIDGE
    ========================================================== */

    window.HalDoLaunch =
        function(
            appId,
            options = {}
        ) {

            const app =
                window.HalDoGetApp(
                    appId
                );


            if (!app) {

                console.warn(
                    "[HalDo] App nicht gefunden:",
                    appId
                );

                return false;

            }


            /*
             * Zentrale Navigation.
             */

            if (
                typeof
                window.HalDoOpenApp ===
                "function"
            ) {

                window.HalDoOpenApp(
                    app.id,
                    options
                );

                return true;

            }


            /*
             * Runtime fallback.
             */

            if (
                window.HalDoAppRuntime &&
                typeof
                window.HalDoAppRuntime.open ===
                "function"
            ) {

                window.HalDoAppRuntime.open(
                    app.id,
                    options
                );

                return true;

            }


            /*
             * Event fallback.
             */

            OS.events.emit(
                "app:open",
                {
                    appId:
                        app.id,

                    options
                }
            );


            return true;

        };


    /* =========================================================
       APP REGISTRATION BRIDGE
    ========================================================== */

    function registerWithExistingRegistry() {

        const registry =
            window.HalDoAppRegistry ||
            window.AppRegistry ||
            OS.appRegistry;


        if (!registry) {

            return;

        }


        catalog.forEach(
            app => {

                try {

                    if (
                        typeof
                        registry.register ===
                        "function"
                    ) {

                        registry.register(
                            app
                        );

                    }

                } catch (error) {

                    console.warn(
                        "[HalDo] Registry:",
                        app.id,
                        error
                    );

                }

            }
        );

    }


    registerWithExistingRegistry();

        return element.innerHTML;

    }

    /* =========================================================

    ========================================================== */

    function renderAIChat(
        body
    ) {

        body.innerHTML = `

            ${appHeader(
                "✦",
                "HalDo AI",
                "Deine zentrale intelligente HalDo Assistenz."
            )}

            <div class="haldo-panel">

                <div
                    id="haldo-ai-conversation"
                    style="
                        min-height:180px;
                        max-height:310px;
                        overflow:auto;
                        display:flex;

                        gap:8px;
                    "
                >

                    <div
                        class="notification"
                    >

                            HalDo AI
                        </div>

                        <div class="notification-text">
                            Hallo. Ich bin HalDo AI.
                            Wie kann ich dir helfen?
                        </div>

                    </div>

                </div>

            </div>

            <div
                style="
                    display:flex;
                    gap:7px;
                "
            >

                <input
                    class="haldo-input"
                    id="haldo-ai-input"
                    placeholder="Schreibe an HalDo AI …"
                >

                <button
                    class="haldo-button primary"
                    id="haldo-ai-send"
                    type="button"
                >
                    Senden
                </button>

            </div>

            ${appFooter()}

        `;


        const input =
            body.querySelector(
                "#haldo-ai-input"
            );


        const send =
            body.querySelector(
                "#haldo-ai-send"
            );


        const conversation =
            body.querySelector(
                "#haldo-ai-conversation"
            );


        function addMessage(
            sender,
            text
        ) {

            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "notification";


            message.innerHTML = `

                <div class="notification-title">
                    ${escapeAppHTML(sender)}
                </div>

                <div class="notification-text">
                    ${escapeAppHTML(text)}
                </div>

            `;


            conversation.appendChild(
                message
            );


            conversation.scrollTop =
                conversation.scrollHeight;

        }


        function answer(
            text
        ) {

            const value =
                text
                    .trim()
                    .toLowerCase();


            if (!value) {

                return "Schreibe mir einfach deine Frage.";

            }


            if (
                value.includes("hallo") ||
                value.includes("hi") ||
                value.includes("hey")
            ) {

                return "Hallo Bruder ❤️💙🚀 Ich bin HalDo AI. Was möchtest du gemeinsam machen?";

            }


            if (
                value.includes("wer bist du")
            ) {

                return "Ich bin HalDo AI, die zentrale intelligente Assistenz innerhalb von HalDo AI OS.";

            }


            if (
                value.includes("zeit")
            ) {

                return (
                    "Die aktuelle lokale Zeit ist " +
                    new Date()
                        .toLocaleTimeString(
                            "de-DE"
                        ) +
                    "."
                );

            }


            if (
                value.includes("datum")
            ) {

                return (
                    "Heute ist " +
                    new Date()
                        .toLocaleDateString(
                            "de-DE"
                        ) +
                    "."
                );

            }


            if (
                value.includes("app")
            ) {

                return (
                    "HalDo AI OS verfügt über eine gemeinsame App-Landschaft. Öffne das App-Menü, um die verfügbaren Anwendungen zu sehen."
                );

            }


            return (
                "Ich habe deine Nachricht verstanden: „" +
                text +
                "“. Meine lokale HalDo Runtime kann diese Unterhaltung verarbeiten. Für externe oder komplexe Wissensfragen wird später die echte AI-Service-Verbindung verwendet."
            );

        }


        function sendMessage() {

            const text =
                input.value.trim();


            if (!text) {
                return;
            }


            addMessage(
                "Du",
                text
            );

        document.head.appendChild(

        );

    }


    /* =========================================================
       CATEGORY LIST
    ========================================================== */

    function renderCategories() {

        const container =
            $(
                "#haldo-app-categories"
            );


        if (!container) {
            return;
        }


        const categories = [
            "Alle",
            ...(
                window
                    .HalDoGetAppCategories
                    ? window.HalDoGetAppCategories()
                    : []
            )
        ];


        container.innerHTML = "";


        categories.forEach(
            category => {

                const button =
                    createElement(
                        "button",
                        "haldo-category-button"
                    );


                button.type =
                    "button";


                button.textContent =
                    category;


                if (
                    category ===
                    state.activeCategory
                ) {

                    button.classList.add(
                        "active"
                    );

                }


                button.addEventListener(
                    "click",
                    () => {

                        state.activeCategory =
                            category;

                        renderCategories();

                        renderApps();

                    }
                );


                container.appendChild(
                    button
                );

            }
        );

    }


    /* =========================================================
       FILTER APPS
    ========================================================== */

    function getVisibleApps() {

        let apps =
            state.apps;


        if (
            state.activeCategory !==
            "Alle"
        ) {

            apps =
                apps.filter(
                    app =>
                        app.category ===
                        state.activeCategory
                );

        }


        const query =
            state.searchQuery
                .trim()
                .toLowerCase();


        if (query) {

            apps =
                apps.filter(
                    app =>
                        app.keywords
                            ?.includes(
                                query
                            ) ||
                        app.name
                            .toLowerCase()
                            .includes(
                                query
                            )
                );

        }


        return apps;

    }


    /* =========================================================
       RENDER APP GRID
    ========================================================== */

    function renderApps() {

        const grid =
            $(
                "#haldo-app-grid"
            );


        if (!grid) {
            return;
        }


        const apps =
            getVisibleApps();


        grid.innerHTML = "";


        if (!apps.length) {

            grid.innerHTML = `

                <div
                    class="haldo-app-empty"
                >
                    Keine App gefunden.
                </div>

            `;

            return;

        }


        apps.forEach(
            app => {

                const card =
                    createElement(
                        "button",
                        "haldo-app-card"
                    );


                card.type =
                    "button";


                card.title =
                    app.description;


                card.innerHTML = `

                    <span
                        class="haldo-app-icon"
                    >
                        ${escapeHTML(
                            app.icon
                        )}
                    </span>

                    <span
                        class="haldo-app-name"
                    >
                        ${escapeHTML(
                            app.name
                        )}
                    </span>

                    <span
                        class="haldo-app-category"
                    >
                        ${escapeHTML(
                            app.category
                        )}
                    </span>

                `;


                card.addEventListener(
                    "click",
                    () => {

                        launchApp(
                            app.id
                        );

                    }
                );


                grid.appendChild(
                    card
                );

            }
        );

    }


    /* =========================================================
       RECENT APPS
    ========================================================== */

    function renderRecentApps() {

        const container =
            $(
                "#haldo-recent-apps"
            );


        if (!container) {
            return;
        }


        const recent =
            state.recentApps
                .map(
                    id =>
                        window.HalDoGetApp
                            ? window.HalDoGetApp(id)
                            : null
                )
                .filter(Boolean)
                .slice(0,5);


        if (!recent.length) {

            container.innerHTML =
                "";

            return;

        }


        container.innerHTML = `

            <div
                class="haldo-recent-title"
            >
                Zuletzt geöffnet
            </div>

            <div
                class="haldo-recent-list"
            ></div>

        `;


        const list =
            container.querySelector(
                ".haldo-recent-list"
            );


        recent.forEach(
            app => {

                const item =
                    createElement(
                        "button",
                        "haldo-recent-item"
                    );


                item.type =
                    "button";


                item.innerHTML = `

                    <span>
                        ${escapeHTML(
                            app.icon
                        )}
                    </span>

                    <span>
                        ${escapeHTML(
                            app.name
                        )}
                    </span>

                `;


                item.addEventListener(
                    "click",
                    () => {

                        launchApp(
                            app.id
                        );

                    }
                );


                list.appendChild(
                    item
                );

            }
        );

    }


    /* =========================================================
       RECENT STORAGE
    ========================================================== */

    function rememberApp(
        appId
    ) {

        state.recentApps =
            [
                appId,
                ...state.recentApps
                    .filter(
                        id =>
                            id !== appId
                    )
            ]
            .slice(0,8);


        localStorage.setItem(
            "haldo20:recent-apps",
            JSON.stringify(
                state.recentApps
            )
        );


        renderRecentApps();

    }


    /* =========================================================
       WINDOW MANAGER BRIDGE
    ========================================================== */

    function launchThroughWindowManager(
        app
    ) {

        const wm =
            window.HalDoWindowManager ||
            window.WindowManager ||
            OS.windowManager;


        if (
            wm &&
            typeof wm.open ===
                "function"
        ) {

            try {

                wm.open(
                    app.id,
                    {
                        title:
                            app.name,

                        icon:
                            app.icon,

                        app
                    }
                );

                return true;

            } catch (error) {

                console.warn(
                    "[HalDo] Window Manager:",
                    error
                );

            }

        }


        return false;

    }


    /* =========================================================
       MAIN APP LAUNCH
    ========================================================== */

    function launchApp(
        appId
    ) {

        const app =
            window.HalDoGetApp
                ? window.HalDoGetApp(
                    appId
                )
                : state.apps.find(
                    item =>
                        item.id ===
                        appId
                );


        if (!app) {

            console.warn(
                "[HalDo] App nicht gefunden:",
                appId
            );

            return;

        }


        rememberApp(
            app.id
        );


        closeLauncher();


        /*
         * Erst vorhandenen Window Manager
         * verwenden.
         */

        if (
            launchThroughWindowManager(
                app
            )
        ) {

            emitLaunchEvent(
                app
            );

            return;

        }


        /*
         * Danach zentrale HalDo Runtime.
         */

        if (
            window.HalDoAppRuntime &&
            typeof
            window.HalDoAppRuntime.open ===
                "function"
        ) {

            try {

                window.HalDoAppRuntime.open(
                    app.id
                );

                emitLaunchEvent(
                    app
                );

                return;

            } catch (error) {

                console.warn(
                    "[HalDo] Runtime:",
                    error
                );

            }

        }


        /*
         * Danach vorhandene globale
         * HalDoOpenApp-Funktion.
         */

        if (
            typeof
            window.HalDoOpenApp ===
                "function"
        ) {

            window.HalDoOpenApp(
                app.id
            );

            emitLaunchEvent(
                app
            );

            return;

        }


        /*
         * Letzter sicherer Event-Bus
         * Fallback.
         */

        OS.events.emit(
            "app:open",
            {
                appId:
                    app.id,

                app
            }
        );


        emitLaunchEvent(
            app
        );

    }


    /* =========================================================
       APP LAUNCH EVENT
    ========================================================== */

    function emitLaunchEvent(
        app
    ) {

        OS.events.emit(
            "app:launched",
            {
                id:
                    app.id,

                name:
                    app.name,

                category:
                    app.category
            }
        );

    }


    /* =========================================================
       PUBLIC LAUNCH API
    ========================================================== */

    window.HalDoOpenApp =
        window.HalDoOpenApp ||
        launchApp;


    window.HalDoLaunchApp =
        launchApp;


    window.HalDoAppLauncher = {

        open:
            openLauncher,

        close:
            closeLauncher,

        toggle:
            toggleLauncher,

        launch:
            launchApp,

        refresh:
            () => {

                state.apps =
                    window.HalDoAppCatalog ||
                    state.apps;

                renderCategories();

                renderRecentApps();

                renderApps();

            }

    };


    /* =========================================================
       OPEN
    ========================================================== */

    function openLauncher() {

        state.launcherOpen =
            true;


        launcher.classList.add(
            "is-open"
        );


        launcher.setAttribute(
            "aria-hidden",
            "false"
        );


        renderCategories();

        renderRecentApps();

        renderApps();


        const search =
            $(
                "#haldo-app-search"
            );


        if (search) {

            search.focus();

        }


        OS.events.emit(
            "launcher:opened"
        );

    }


    /* =========================================================
       CLOSE
    ========================================================== */

    function closeLauncher() {

        state.launcherOpen =
            false;


        launcher.classList.remove(
            "is-open"
        );


        launcher.setAttribute(
            "aria-hidden",
            "true"
        );


        OS.events.emit(
            "launcher:closed"
        );

    }


    /* =========================================================
       TOGGLE
    ========================================================== */

    function toggleLauncher() {

        if (
            state.launcherOpen
        ) {

            closeLauncher();

        } else {

            openLauncher();

        }

    }


    /* =========================================================
       SEARCH
    ========================================================== */

    const search =
        $(
            "#haldo-app-search"
        );


    if (search) {

        search.addEventListener(
            "input",
            event => {

                state.searchQuery =
                    event.target.value;

                renderApps();

            }
        );

    }


    /* =========================================================
       CLOSE EVENTS
    ========================================================== */

    const closeButton =
        $(
            "#haldo-launcher-close"
        );


    if (closeButton) {

        closeButton.addEventListener(
            "click",
            closeLauncher
        );

    }


    launcher
        .querySelectorAll(
            "[data-launcher-close]"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    closeLauncher
                );

            }
        );


    /* =========================================================
       KEYBOARD
    ========================================================== */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape" &&
                state.launcherOpen
            ) {

                closeLauncher();

                return;

            }


            /*
             * Cmd/Ctrl + K
             * öffnet den App Launcher.
             */

            if (
                (
                    event.ctrlKey ||
                    event.metaKey
                ) &&
                event.key
                    .toLowerCase() ===
                    "k"
            ) {

                event.preventDefault();

                toggleLauncher();

            }

        }
    );


    /* =========================================================
       CONNECT EXISTING APP BUTTONS
    ========================================================== */

    function connectExistingButtons() {

        document
            .querySelectorAll(
                "[data-app-id]"
            )
            .forEach(
                button => {

                    if (
                        button.dataset
                            .haldoConnected ===
                        "true"
                    ) {

                        return;

                    }


                    button.dataset
                        .haldoConnected =
                        "true";


                    button.addEventListener(
                        "click",
                        () => {

                            launchApp(
                                button.dataset
                                    .appId
                            );

                        }
                    );

                }
            );

    }


    connectExistingButtons();


    /* =========================================================
       OBSERVE NEW APP BUTTONS
    ========================================================== */

    const observer =
        new MutationObserver(
            () => {

                connectExistingButtons();

            }
        );


    observer.observe(
        document.body,
        {
            childList:
                true,

            subtree:
                true
        }
    );


    /* =========================================================
       GLOBAL APP MENU SHORTCUT
    ========================================================== */

    document.addEventListener(
        "click",
        event => {

            const trigger =
                event.target.closest(
                    "[data-open-apps]"
                );


            if (
                trigger
            ) {

                event.preventDefault();

                openLauncher();

            }

        }
    );


    /* =========================================================
       EVENT BUS CONNECTION
    ========================================================== */

    OS.events.on(
        "app:request-open",
        payload => {

            if (
                payload &&
                payload.appId
            ) {

                launchApp(
                    payload.appId
                );

            }

        }
    );


    OS.events.on(
        "launcher:toggle",
        toggleLauncher
    );


    OS.events.on(
        "launcher:open",
        openLauncher
    );


    OS.events.on(
        "launcher:close",
        closeLauncher
    );


    /* =========================================================
       INITIALIZE
    ========================================================== */

    state.apps =
        window.HalDoAppCatalog ||
        [];


    /*
     * Der Launcher wird erst bei Bedarf
     * vollständig geöffnet.
     */

    renderCategories();

    renderRecentApps();

    renderApps();


    console.log(
        "[HalDo] App Launcher verbunden."
    );

})();
</script>
