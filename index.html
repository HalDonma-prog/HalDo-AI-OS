<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="HalDo AI OS 20">
<meta name="description" content="HalDo AI OS 20">

<title>HalDo AI OS 20</title>

<link rel="icon" href="assets/logo/logo.png">
<link rel="apple-touch-icon" href="assets/logo/logo.png">

<!-- ============================================================
     HALDO AI OS 20
     MASTER INDEX
     ============================================================ -->

<style>
:root {
    --bg:#03050d;
    --panel:rgba(8,14,30,.82);
    --panel2:rgba(14,23,48,.92);
    --border:rgba(255,255,255,.12);
    --text:#f5f7ff;
    --muted:#aab4d0;
    --accent:#7ddcff;
    --accent2:#b69cff;
    --gold:#ffd76a;
    --danger:#ff6d8a;
    --success:#73e6a8;
    --shadow:0 20px 80px rgba(0,0,0,.45);
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body {
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
textarea,
select {
    font:inherit;
}

button {
    color:inherit;
}

#haldo-os {
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    isolation:isolate;
    background:
        radial-gradient(circle at 50% 18%,rgba(82,120,255,.16),transparent 28%),
        radial-gradient(circle at 20% 80%,rgba(99,78,255,.12),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(0,215,255,.10),transparent 30%),
        #03050d;
}

/* ============================================================
   COSMIC WORLD
   ============================================================ */

#cosmic-world {
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:1;
    pointer-events:none;
}

.cosmic-sky {
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 15%,rgba(135,180,255,.20),transparent 35%),
        linear-gradient(180deg,#02030a 0%,#060b1d 48%,#02040c 100%);
}

.stars {
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px),
        radial-gradient(circle,rgba(150,210,255,.75) 0 1px,transparent 1.5px),
        radial-gradient(circle,rgba(255,235,180,.7) 0 1px,transparent 1.5px);
    background-size:97px 113px,157px 173px,211px 197px;
    background-position:10px 20px,60px 80px,120px 40px;
    opacity:.72;
    animation:starDrift 80s linear infinite;
}

.stars::after {
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 15% 25%,rgba(255,255,255,.9) 0 1px,transparent 3px),
        radial-gradient(circle at 72% 18%,rgba(160,220,255,.9) 0 1px,transparent 3px),
        radial-gradient(circle at 84% 70%,rgba(255,240,180,.9) 0 1px,transparent 3px),
        radial-gradient(circle at 35% 75%,rgba(255,255,255,.85) 0 1px,transparent 3px);
    animation:twinkle 3.8s ease-in-out infinite alternate;
}

@keyframes starDrift {
    from {transform:translate3d(0,0,0)}
    to {transform:translate3d(-100px,80px,0)}
}

@keyframes twinkle {
    from {opacity:.35}
    to {opacity:1}
}

/* ============================================================
   SUN
   ============================================================ */

#haldo-sun {
    position:absolute;
    left:50%;
    top:19%;
    width:120px;
    height:120px;
    margin:-60px 0 0 -60px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    pointer-events:auto;
    background:
        radial-gradient(circle at 38% 35%,
            #fffdf0 0 8%,
            #fff1a4 20%,
            #ffd35c 48%,
            #ff9d35 70%,
            rgba(255,120,20,.25) 100%);
    box-shadow:
        0 0 30px #ffd76a,
        0 0 70px rgba(255,191,66,.8),
        0 0 130px rgba(255,140,20,.55),
        0 0 210px rgba(255,180,50,.25);
    animation:sunPulse 4s ease-in-out infinite;
}

#haldo-sun::before,
#haldo-sun::after {
    content:"";
    position:absolute;
    inset:-30px;
    border-radius:50%;
    border:1px solid rgba(255,220,120,.22);
    animation:sunCorona 5s linear infinite;
}

#haldo-sun::after {
    inset:-55px;
    border-color:rgba(255,190,80,.12);
    animation-duration:8s;
}

@keyframes sunPulse {
    0%,100% {
        transform:scale(1);
    }
    50% {
        transform:scale(1.06);
    }
}

@keyframes sunCorona {
    to {
        transform:rotate(360deg) scale(1.08);
    }
}

/* ============================================================
   ORBITS / PLANETS
   ============================================================ */

.orbit {
    position:absolute;
    left:50%;
    top:19%;
    border:1px solid rgba(130,200,255,.13);
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.orbit-1 {width:210px;height:100px;}
.orbit-2 {width:290px;height:140px;}
.orbit-3 {width:380px;height:185px;}
.orbit-4 {width:490px;height:235px;}
.orbit-5 {width:620px;height:300px;}
.orbit-6 {width:760px;height:370px;}
.orbit-7 {width:920px;height:445px;}
.orbit-8 {width:1080px;height:520px;}

.planet {
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    margin:-9px;
    border-radius:50%;
    box-shadow:0 0 20px rgba(255,255,255,.35);
}

.planet-1 {background:#aeb7c8;}
.planet-2 {background:#d9b47b;}
.planet-3 {
    width:24px;
    height:24px;
    margin:-12px;
    background:
        radial-gradient(circle at 35% 30%,#72c7ff,#2177d0 50%,#174e91);
    box-shadow:0 0 30px rgba(80,180,255,.8);
}
.planet-4 {background:#b55b42;}
.planet-5 {width:32px;height:32px;margin:-16px;background:#d49a58;}
.planet-6 {width:30px;height:30px;margin:-15px;background:#d9bd8c;}
.planet-7 {background:#80d9df;}
.planet-8 {background:#477fd7;}

.planet-layer {
    position:absolute;
    inset:0;
    pointer-events:none;
}

.planet-layer .planet {
    animation:planetFloat 7s ease-in-out infinite;
}

@keyframes planetFloat {
    0%,100% {transform:translateY(0)}
    50% {transform:translateY(-5px)}
}

/* ============================================================
   LOGO
   ============================================================ */

#haldo-logo {
    position:absolute;
    left:24px;
    top:24px;
    width:64px;
    height:64px;
    z-index:20;
    object-fit:contain;
    filter:
        drop-shadow(0 0 12px rgba(125,220,255,.75))
        drop-shadow(0 0 30px rgba(120,120,255,.35));
    animation:logoGlow 4s ease-in-out infinite;
    cursor:pointer;
    pointer-events:auto;
}

@keyframes logoGlow {
    0%,100% {
        transform:scale(1);
        filter:drop-shadow(0 0 12px rgba(125,220,255,.75));
    }
    50% {
        transform:scale(1.035);
        filter:
            drop-shadow(0 0 20px rgba(125,220,255,.95))
            drop-shadow(0 0 38px rgba(150,120,255,.5));
    }
}

/* ============================================================
   DESKTOP
   ============================================================ */

#desktop {
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#desktop-title {
    position:absolute;
    left:50%;
    top:44%;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
}

#desktop-title h1 {
    margin:0;
    font-size:clamp(30px,5vw,64px);
    letter-spacing:.08em;
    font-weight:700;
    text-shadow:
        0 0 20px rgba(125,220,255,.45),
        0 0 60px rgba(130,100,255,.25);
}

#desktop-title p {
    margin:12px 0 0;
    color:var(--muted);
    font-size:14px;
    letter-spacing:.18em;
}

/* ============================================================
   WINDOW SYSTEM
   ============================================================ */

#window-layer {
    position:absolute;
    inset:0;
    z-index:100;
    pointer-events:none;
}

.haldo-window {
    position:absolute;
    left:50%;
    top:50%;
    width:min(900px,calc(100% - 32px));
    height:min(680px,calc(100% - 120px));
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:22px;
    background:linear-gradient(
        180deg,
        rgba(12,20,42,.96),
        rgba(5,9,21,.96)
    );
    box-shadow:
        0 30px 100px rgba(0,0,0,.6),
        0 0 80px rgba(90,130,255,.10);
    backdrop-filter:blur(30px);
    pointer-events:auto;
}

.window-header {
    min-height:58px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 14px 0 20px;
    border-bottom:1px solid var(--border);
}

.window-title {
    flex:1;
    font-weight:700;
}

.window-close,
.window-minimize {
    width:34px;
    height:34px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.07);
    cursor:pointer;
}

.window-close:hover {
    background:rgba(255,90,120,.25);
}

.window-body {
    flex:1;
    min-height:0;
    overflow:auto;
    padding:20px;
}

/* ============================================================
   COMMON APP UI
   ============================================================ */

.app-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
}

.app-card {
    min-height:130px;
    padding:18px;
    border:1px solid var(--border);
    border-radius:18px;
    background:rgba(255,255,255,.045);
    cursor:pointer;
    transition:.2s ease;
}

.app-card:hover {
    transform:translateY(-2px);
    background:rgba(255,255,255,.08);
    border-color:rgba(125,220,255,.3);
}

.app-icon {
    font-size:30px;
    margin-bottom:12px;
}

.app-name {
    font-weight:700;
}

.app-description {
    margin-top:6px;
    color:var(--muted);
    font-size:12px;
}

/* ============================================================
   DOCK
   ============================================================ */

#dock {
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:300;
    display:flex;
    gap:8px;
    padding:9px;
    border:1px solid var(--border);
    border-radius:20px;
    background:rgba(4,8,20,.75);
    backdrop-filter:blur(24px);
    box-shadow:var(--shadow);
    pointer-events:auto;
}

.dock-button {
    width:48px;
    height:48px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.06);
    cursor:pointer;
    font-size:21px;
    transition:.18s ease;
}

.dock-button:hover {
    transform:translateY(-4px);
    background:rgba(125,220,255,.14);
}

/* ============================================================
   LAUNCHER
   ============================================================ */

#launcher {
    position:absolute;
    left:50%;
    bottom:86px;
    width:min(900px,calc(100% - 28px));
    max-height:min(600px,calc(100% - 120px));
    transform:translate(-50%,20px);
    z-index:400;
    opacity:0;
    visibility:hidden;
    transition:.2s ease;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:24px;
    background:rgba(4,8,20,.94);
    backdrop-filter:blur(30px);
    box-shadow:var(--shadow);
    pointer-events:none;
}

#launcher.open {
    opacity:1;
    visibility:visible;
    transform:translate(-50%,0);
    pointer-events:auto;
}

.launcher-header {
    padding:18px;
    border-bottom:1px solid var(--border);
}

#app-search {
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:14px;
    outline:0;
    color:var(--text);
    background:rgba(255,255,255,.06);
}

#app-search:focus {
    border-color:rgba(125,220,255,.5);
}

#app-list {
    max-height:480px;
    overflow:auto;
    padding:16px;
}

/* ============================================================
   AI WINDOW
   ============================================================ */

.ai-layout {
    height:100%;
    display:flex;
    flex-direction:column;
}

#ai-messages {
    flex:1;
    overflow:auto;
    padding:8px;
}

.ai-message {
    max-width:82%;
    margin:8px 0;
    padding:12px 14px;
    border-radius:15px;
    line-height:1.5;
}

.ai-user {
    margin-left:auto;
    background:rgba(125,220,255,.14);
    border:1px solid rgba(125,220,255,.18);
}

.ai-assistant {
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);
}

.ai-input-row {
    display:flex;
    gap:8px;
    padding-top:12px;
}

#ai-input {
    flex:1;
    min-height:48px;
    max-height:150px;
    resize:vertical;
    padding:13px;
    border:1px solid var(--border);
    border-radius:14px;
    outline:0;
    color:var(--text);
    background:rgba(255,255,255,.05);
}

.primary-button {
    min-width:48px;
    padding:0 18px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#6fdcff,#9f83ff);
    color:#07101d;
    font-weight:800;
    cursor:pointer;
}

/* ============================================================
   STATUS
   ============================================================ */

#system-status {
    position:absolute;
    right:20px;
    top:20px;
    z-index:250;
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    background:rgba(4,8,20,.65);
    backdrop-filter:blur(20px);
    color:var(--muted);
    font-size:12px;
    pointer-events:auto;
}

.status-dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 12px var(--success);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media(max-width:700px) {
    #haldo-sun {
        width:90px;
        height:90px;
        margin:-45px 0 0 -45px;
    }

    .orbit-6,
    .orbit-7,
    .orbit-8 {
        display:none;
    }

    #desktop-title {
        top:40%;
    }

    #dock {
        bottom:10px;
    }

    .dock-button {
        width:43px;
        height:43px;
    }

    .haldo-window {
        width:calc(100% - 16px);
        height:calc(100% - 90px);
        border-radius:18px;
    }
}
</style>
</head>

<body>

<div id="haldo-os">

            <div class="planet planet-6"></div>

    <!-- ========================================================

    <img

</div>

<!-- ============================================================
     HALDO GLOBAL BOOTSTRAP
     ============================================================ -->

<script>
"use strict";

window.HalDo = window.HalDo || {};

const HD = window.HalDo;

HD.version = "20.0.0";
HD.name = "HalDo AI OS";
HD.ready = false;

HD.config = HD.config || {
    version: "20.0.0",
    environment: "production",
    storageNamespace: "haldo-ai-os-20"
};

HD.events = HD.events || {
    bus: new EventTarget(),

    emit(name, detail = {}) {
        this.bus.dispatchEvent(
            new CustomEvent(name, { detail })
        );
    },

    on(name, handler) {
        this.bus.addEventListener(name, handler);
        return () => this.bus.removeEventListener(name, handler);
    }
};

/* ============================================================
   STORAGE
   ============================================================ */

HD.storage = HD.storage || {

    prefix: "haldo-ai-os-20:",

    get(key, fallback = null) {
        try {
            const value = localStorage.getItem(this.prefix + key);
            return value === null ? fallback : JSON.parse(value);
        } catch {
            return fallback;
        }
    },

    set(key, value) {
        try {
            localStorage.setItem(
                this.prefix + key,
                JSON.stringify(value)
            );

            HD.events.emit("storage:changed", {
                key,
                value
            });

            return true;
        } catch {
            return false;
        }
    },

    remove(key) {
        try {
            localStorage.removeItem(this.prefix + key);
            HD.events.emit("storage:removed", { key });
            return true;
        } catch {
            return false;
        }
    },

    clearNamespace() {
        const keys = [];

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);

            if (key && key.startsWith(this.prefix)) {
                keys.push(key);
            }
        }

        keys.forEach(key => localStorage.removeItem(key));

        HD.events.emit("storage:cleared");
    }
};

/* ============================================================
   STATE
   ============================================================ */

HD.state = HD.state || {
    activeApp: null,
    activeWindow: null,
    launcherOpen: false,
    booted: false,
    online: navigator.onLine
};

/* ============================================================
   SERVICE MANAGER
   ============================================================ */

HD.services = HD.services || new Map();

HD.serviceManager = HD.serviceManager || {

    register(name, service) {
        HD.services.set(name, service);
        HD.events.emit("service:registered", { name });
        return service;
    },

    get(name) {
        return HD.services.get(name);
    },

    has(name) {
        return HD.services.has(name);
    },

    remove(name) {
        HD.services.delete(name);
    }
};

/* ============================================================
   APP CONTRACT
   ============================================================ */

HD.appContract = HD.appContract || {

    validate(app) {
        return Boolean(
            app &&
            typeof app.id === "string" &&
            typeof app.name === "string"
        );
    }
};

/* ============================================================
   COMPLETE APP MASTER LIST
   ============================================================ */

HD.masterAppManifest = {

    version: "20.0.0",

    apps: [

        {
            id:"haldo-ai",
            name:"HalDo AI",
            icon:"✦",
            category:"AI",
            description:"HalDo AI Chat, Memory, Commands, Voice und Speech",
            builtIn:true
        },

        {
            id:"launcher",
            name:"App Launcher",
            icon:"◈",
            category:"System",
            description:"Zentrale App-Navigation",
            builtIn:true
        },

        {
            id:"files",
            name:"Dateien",
            icon:"◫",
            category:"Produktivität",
            description:"Dateien und Speicherverwaltung"
        },

        {
            id:"notes",
            name:"Notizen",
            icon:"📝",
            category:"Produktivität",
            description:"Notizen erstellen und speichern"
        },

        {
            id:"tasks",
            name:"Aufgaben",
            icon:"✓",
            category:"Produktivität",
            description:"Aufgabenverwaltung"
        },

        {
            id:"calendar",
            name:"Kalender",
            icon:"▣",
            category:"Produktivität",
            description:"Termine und Kalender"
        },

        {
            id:"contacts",
            name:"Kontakte",
            icon:"♙",
            category:"Kommunikation",
            description:"Kontakte verwalten"
        },

        {
            id:"messages",
            name:"Nachrichten",
            icon:"◇",
            category:"Kommunikation",
            description:"Nachrichten"
        },

        {
            id:"mail",

HD.appRegistry = HD.appRegistry || {

    apps:new Map(),

    register(app) {

        if (!HD.appContract.validate(app)) {
            return false;
        }

        this.apps.set(app.id, app);

        HD.events.emit("app:registered", { app });

        return true;
    },

    get(id) {
        return this.apps.get(id);
    },

    has(id) {
        return this.apps.has(id);
    },

    list() {
        return Array.from(this.apps.values());
    }
};

   REGISTER ALL APPS
   ============================================================ */

HD.masterAppManifest.apps.forEach(app => {

    HD.appRegistry.register(app);

});

/* ============================================================
   WINDOW MANAGER
   ============================================================ */

HD.windowManager = HD.windowManager || {

    windows:new Map(),

    open(id, title, renderer) {

        const existing = this.windows.get(id);

        if (existing) {

            existing.style.display = "flex";

            HD.state.activeWindow = id;

            return existing;
        }

        const win = document.createElement("section");

        win.className = "haldo-window";

        win.dataset.windowId = id;

        win.innerHTML = `
            <header class="window-header">

                <div class="window-title">
                    ${this.escape(title)}
                </div>

                <button
                    class="window-minimize"
                    type="button"
                    aria-label="Minimieren">
                    −
                </button>

                <button
                    class="window-close"
                    type="button"
                    aria-label="Schließen">
                    ×
                </button>

            </header>

            <div class="window-body"></div>
        `;

        const body = win.querySelector(".window-body");

        if (typeof renderer === "function") {
            renderer(body, win);
        }

        win.querySelector(".window-close")
            .addEventListener("click",() => this.close(id));

        win.querySelector(".window-minimize")
            .addEventListener("click",() => {
                win.style.display =
                    win.style.display === "none"
                        ? "flex"
                        : "none";
            });

        document
            .getElementById("window-layer")
            .appendChild(win);

        this.windows.set(id,win);

        HD.state.activeWindow = id;

        HD.events.emit("window:opened",{id});

        return win;
    },

    close(id) {

        const win = this.windows.get(id);

        if (!win) {
            return;
        }

        win.remove();

        this.windows.delete(id);

        if (HD.state.activeWindow === id) {
            HD.state.activeWindow = null;
        }

        HD.events.emit("window:closed",{id});
    },

    escape(value) {

        return String(value)
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");
    }
};

   ============================================================ */

HD.ai = HD.ai || {

    history:HD.storage.get("ai.history",[]),

    respond(input) {

        const text = String(input).trim();

        if (!text) {
            return;
        }

        const lower = text.toLowerCase();

        if (
            lower.includes("öffne") ||
            lower.includes("open")
        ) {

            for (const app of HD.appRegistry.list()) {

                if (
                    lower.includes(app.name.toLowerCase()) ||
                    lower.includes(app.id.toLowerCase())
                ) {

                    setTimeout(
                        () => HD.appManager.open(app.id),
                        100
                    );

                    return `Ich öffne ${app.name}.`;
                }
            }
        }

        if (
            lower.includes("update") ||
            lower.includes("aktual")
        ) {

            setTimeout(
                () => HD.appManager.open("updates"),
                100
            );

            return "Ich öffne das Software-Update-System.";
        }

        if (
            lower.includes("einstellung")
        ) {

            setTimeout(
                () => HD.appManager.open("settings"),
                100
            );

            return "Ich öffne die Einstellungen.";
        }

        return `
            Ich bin HalDo AI OS 20.
            Ich habe deine Eingabe verstanden und kann
            mit den registrierten System-Apps arbeiten.
        `;
    }
};

HD.appRenderers["haldo-ai"] = (body) => {

    body.innerHTML = `
        <div class="ai-layout">

            <div id="ai-messages"></div>

            <div class="ai-input-row">

                <textarea
                    id="ai-input"
                    placeholder="Sprich mit HalDo AI …">
                </textarea>

                <button
                    id="ai-send"
                    class="primary-button"
                    type="button">
                    Senden
                </button>

            </div>

        </div>
    `;

    const messages =
        body.querySelector("#ai-messages");

    const input =
        body.querySelector("#ai-input");

    const send =
        body.querySelector("#ai-send");

    const addMessage = (text,type) => {

        const div =
            document.createElement("div");

        div.className =
            `ai-message ai-${type}`;

        div.textContent = text;

        messages.appendChild(div);

        messages.scrollTop =
            messages.scrollHeight;
    };

    const submit = () => {

        const text =
            input.value.trim();

        if (!text) {
            return;
        }

        addMessage(text,"user");

        HD.ai.history.push({
            role:"user",
            content:text,
            time:Date.now()
        });

        const answer =
            HD.ai.respond(text);

        addMessage(answer,"assistant");

        HD.ai.history.push({
            role:"assistant",
            content:answer,
            time:Date.now()
        });

        HD.storage.set(
            "ai.history",
            HD.ai.history.slice(-100)
        );

        input.value = "";
        input.focus();
    };

    send.addEventListener("click",submit);

    input.addEventListener("keydown",event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            submit();
        }
    });

    addMessage(
        "Willkommen bei HalDo AI. Wie kann ich dir helfen?",
        "assistant"
    );
};

HD.updateSystem = {

    version:HD.version,

    status:"ready",

    history:
        HD.storage.get(
            "updates.history",
            []
        ),

    check() {

        this.status = "checked";

        HD.events.emit(
            "update:checked",
            {
                version:this.version
            }
        );

        return {
            available:false,
            version:this.version
        };
    },

    backupBeforeUpdate() {

        const snapshot = {

            version:HD.version,

            data:{},

            timestamp:Date.now()

        };

        for (
            let i=0;
            i<localStorage.length;
            i++
        ) {

            const key =
                localStorage.key(i);

            if (
                key &&
                key.startsWith(
                    HD.storage.prefix
                )
            ) {

                snapshot.data[key] =
                    localStorage.getItem(key);
            }
        }

        HD.storage.set(
            "backup.latest",
            snapshot
        );

        return snapshot;
    },

    rollback() {

        const backup =
            HD.storage.get(
                "backup.latest",
                null
            );

        if (!backup) {
            return false;
        }

        Object.entries(
            backup.data
        ).forEach(([key,value]) => {

            localStorage.setItem(
                key,
                value
            );

        });

        HD.events.emit(
            "update:rollback",
            backup
        );

        return true;
    }
};

HD.launcher = {

    open() {

        const launcher =
            document.getElementById("launcher");

        launcher.classList.add("open");

        HD.state.launcherOpen = true;

        this.render();

        document
            .getElementById("app-search")
            .focus();
    },

    close() {

        document
            .getElementById("launcher")
            .classList.remove("open");

        HD.state.launcherOpen = false;
    },

    toggle() {

        HD.state.launcherOpen
            ? this.close()
            : this.open();
    },

    render(filter="") {

        const list =
            document.getElementById("app-list");

        const query =
            String(filter).toLowerCase();

        const apps =
            HD.appRegistry
                .list()
                .filter(app =>
                    !query ||
                    app.name
                        .toLowerCase()
                        .includes(query) ||
                    app.id
                        .toLowerCase()
                        .includes(query) ||
                    app.category
                        .toLowerCase()
                        .includes(query)
                );

        list.innerHTML =
            `<div class="app-grid">
                ${
                    apps.map(app => `
                        <article
                            class="app-card"
                            data-launch-app="${HD.windowManager.escape(app.id)}">

                            <div class="app-icon">
                                ${app.icon || "◈"}
                            </div>

                            <div class="app-name">
                                ${HD.windowManager.escape(app.name)}
                            </div>

                            <div class="app-description">
                                ${HD.windowManager.escape(
                                    app.description || ""
                                )}
                            </div>

                        </article>
                    `).join("")
                }
            </div>`;

        list
            .querySelectorAll("[data-launch-app]")
            .forEach(card => {

                card.addEventListener("click",() => {

                    HD.appManager.open(
                        card.dataset.launchApp
                    );

                    this.close();
                });

            });
    }
};

        .textContent =
            "HalDo online";

    HD.events.emit("system:online");
});

window.addEventListener("offline",() => {

    HD.state.online = false;

    document
        .getElementById("status-text")
        .textContent =
            "Offline-Modus";

    HD.events.emit("system:offline");
});

/* ============================================================
   EXTERNAL V20 MODULE LOADER
   ============================================================ */

HD.v20Loader = {

    scripts: [

        "js/kernel.js",
        "js/system.js",

        "js/service-manager.js",
        "js/haldo-v20-service-bridge.js",

        "js/app-contract.js",
        "js/app-foundation.js",

        "js/app-registry.js",
        "js/haldo-v20-app-registry.js",

        "js/app-runtime.js",
        "js/haldo-v20-app-runtime.js",

        "js/app-manager.js",
        "js/app-router.js",
        "js/window-manager.js",

        "js/haldo-v20-app-manifest.js",
        "js/haldo-v20-bridge.js",
        "js/haldo-v20-integration.js"

    ],

    load() {

        /*
         * Die vorhandene HTML-Shell bleibt funktionsfähig,
         * während die externen V20-Schichten zusätzlich
         * eingebunden werden.
         *
         * Bereits vorhandene globale Module werden nicht
         * blind überschrieben.
         */

        const unique =
            [...new Set(this.scripts)];

        unique.forEach(src => {

            if (
                document.querySelector(
                    `script[src="${src}"]`
                )
            ) {
                return;
            }

            const script =
                document.createElement("script");

            script.src = src;
            script.defer = true;

            script.onerror = () => {

                console.warn(
                    "HalDo V20 Modul konnte nicht geladen werden:",
                    src
                );

            };

            document.head.appendChild(script);

        });
    }
};

/* ============================================================
   SERVICE WORKER
   ============================================================ */

HD.pwa = {

    async register() {

        if (!("serviceWorker" in navigator)) {
            return false;
        }

        try {

            await navigator.serviceWorker.register(
                "service-worker.js",
                {
                    scope:"./"
                }
            );

            HD.events.emit(
                "pwa:registered"
            );

            return true;

        } catch(error) {

            console.warn(
                "HalDo PWA Service Worker:",
                error
            );

            return false;
        }
    }
};

/* ============================================================
   BOOT
   ============================================================ */

async function haldoBoot() {

    const status =
        document.getElementById(
            "status-text"
        );

    status.textContent =
        "HalDo Core wird gestartet …";

    HD.events.emit("boot:start");

    /*
     * Bestehende V20-Schichten laden.
     */
    HD.v20Loader.load();

    status.textContent =
        "HalDo Runtime wird gestartet …";

    /*
     * Grundlegende Services registrieren.
     */

    HD.serviceManager.register(
        "storage",
        HD.storage
    );

    HD.serviceManager.register(
        "events",
        HD.events
    );

    HD.serviceManager.register(
        "appRegistry",
        HD.appRegistry
    );

    HD.serviceManager.register(
        "appManager",
        HD.appManager
    );

    HD.serviceManager.register(
        "windowManager",
        HD.windowManager
    );

    HD.serviceManager.register(
        "updateSystem",
        HD.updateSystem
    );

    HD.serviceManager.register(
        "ai",
        HD.ai
    );

    /*
     * PWA registrieren.
     */

    HD.pwa.register();

    /*
     * Cosmic-Einstellung anwenden.
     */

    if (
        HD.storage.get(
            "settings.cosmic",
            true
        ) === false
    ) {

        document
            .getElementById(
                "cosmic-world"
            )
            .style.display = "none";
    }

    HD.state.booted = true;
    HD.ready = true;

    status.textContent =
        HD.state.online
            ? "HalDo AI OS 20 bereit"
            : "HalDo AI OS 20 – Offline";

    HD.events.emit(
        "boot:complete",
        {
            version:HD.version,
            apps:HD.appRegistry.list().length
        }
    );

    /*
     * Kurzer System-Willkommensgruß.
     */

    setTimeout(() => {

        if (
            !HD.storage.get(
                "welcome.seen",
                false
            )
        ) {

            HD.storage.set(
                "welcome.seen",
                true
            );

        }

    },1200);
}

if (
    document.readyState === "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        haldoBoot,
        {once:true}
    );

} else {

    haldoBoot();

}
</script>
