<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050816"
    >

    <meta
        name="description"
        content="HalDo AI OS 20 – Cosmic AI Operating System"
    >

    <title>HalDo AI OS 20</title>

    <!-- =====================================================
         HALDO CORE STYLES
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/haldo-logo-engine.css"
    >

    <link
        rel="stylesheet"
        href="css/haldo-cosmic-world.css"
    >

    <link
        rel="stylesheet"
        href="css/haldo-desktop.css"
    >

    <link
        rel="stylesheet"
        href="css/haldo-app-shell.css"
    >

    <!-- =====================================================
         FALLBACK CORE STYLE
         ===================================================== -->

    <style>

        :root {
            --haldo-bg:
                #02040c;

            --haldo-panel:
                rgba(7, 12, 28, 0.88);

            --haldo-panel-soft:
                rgba(15, 22, 45, 0.72);

            --haldo-border:
                rgba(150, 190, 255, 0.20);

            --haldo-text:
                #ffffff;

            --haldo-muted:
                rgba(255,255,255,0.68);

            --haldo-glow:
                rgba(120, 190, 255, 0.35);

            --haldo-sidebar-width:
                300px;

            --haldo-radius:
                22px;

            --haldo-transition:
                220ms ease;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--haldo-bg);
            color: var(--haldo-text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }


        button,
        input,
        textarea,
        select {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        #haldo-os {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(40, 90, 180, 0.13),
                    transparent 45%
                ),
                #02040c;
        }


        /* =================================================
           COSMIC WORLD
           ================================================= */

        #cosmic-world {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 1;
        }


        #cosmic-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }


        .cosmic-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }


        .cosmic-star {
            position: absolute;
            border-radius: 50%;
            background: white;
            box-shadow:
                0 0 5px rgba(255,255,255,.9),
                0 0 14px rgba(180,220,255,.55);
            animation:
                haldo-star-twinkle
                var(--duration, 3s)
                ease-in-out
                infinite alternate;
        }


        @keyframes haldo-star-twinkle {

            from {
                opacity: .20;
                transform: scale(.70);
            }

            to {
                opacity: 1;
                transform: scale(1.35);
            }
        }


        .cosmic-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 190px;
            height: 190px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    #fffbd4 0%,
                    #fff2a0 18%,
                    #ffd15c 38%,
                    #ff9b30 65%,
                    rgba(255,130,30,.15) 82%,
                    transparent 100%
                );
            box-shadow:
                0 0 35px rgba(255,220,100,.95),
                0 0 90px rgba(255,175,50,.72),
                0 0 180px rgba(255,140,30,.38);
            animation:
                haldo-sun-pulse 4s ease-in-out infinite alternate;
            pointer-events: none;
        }


        @keyframes haldo-sun-pulse {

            from {
                transform:
                    translate(-50%, -50%)
                    scale(.96);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    scale(1.05);
            }
        }


        .cosmic-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            border:
                1px solid rgba(180,220,255,.12);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }


        .cosmic-planet {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            pointer-events: none;
            box-shadow:
                0 0 12px rgba(255,255,255,.25);
        }


        .planet-earth {
            width: 62px;
            height: 62px;
            background:
                radial-gradient(
                    circle at 35% 30%,
                    #8feaff,
                    #2587d9 38%,
                    #0c386f 72%,
                    #04142c 100%
                );
            box-shadow:
                0 0 18px rgba(70,180,255,.75),
                0 0 45px rgba(40,130,255,.38);
        }


        .planet-moon {
            width: 27px;
            height: 27px;
            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fff,
                    #b8becb 45%,
                    #5f6672 100%
                );
        }


        /* =================================================
           SIDEBAR
           ================================================= */

        #haldo-sidebar {
            position: absolute;
            top: 18px;
            bottom: 18px;
            left: 18px;
            width: var(--haldo-sidebar-width);
            z-index: 1000;

            display: flex;
            flex-direction: column;

            padding: 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(10,18,40,.94),
                    rgba(4,8,20,.90)
                );

            border:
                1px solid var(--haldo-border);

            border-radius:
                28px;

            box-shadow:
                0 20px 70px rgba(0,0,0,.45),
                inset 0 0 35px rgba(120,180,255,.035);

            backdrop-filter:
                blur(24px);

            overflow: hidden;
        }


        #haldo-sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 6px 18px;
        }


        #haldo-logo-button {
            width: 58px;
            height: 58px;
            padding: 0;
            border: 0;
            background: transparent;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }


        #haldo-logo-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter:
                drop-shadow(
                    0 0 14px
                    rgba(100,190,255,.65)
                );
        }


        #haldo-brand {
            min-width: 0;
        }


        #haldo-brand-title {
            font-size: 17px;
            font-weight: 750;
            letter-spacing: .03em;
        }


        #haldo-brand-subtitle {
            margin-top: 3px;
            font-size: 11px;
            color: var(--haldo-muted);
        }


        #haldo-menu-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 3px;
        }


        #haldo-menu-scroll::-webkit-scrollbar {
            width: 4px;
        }


        #haldo-menu-scroll::-webkit-scrollbar-thumb {
            background:
                rgba(160,200,255,.18);
            border-radius: 20px;
        }


        .haldo-menu-section {
            margin-bottom: 18px;
        }


        .haldo-menu-label {
            margin:
                0 10px 7px;

            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .14em;
            color:
                rgba(210,225,255,.40);
        }


        .haldo-menu-button {
            width: 100%;
            min-height: 48px;

            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 5px;
            padding: 9px 11px;

            border: 1px solid transparent;
            border-radius: 15px;

            background: transparent;
            color: white;

            text-align: left;

            transition:
                transform var(--haldo-transition),
                background var(--haldo-transition),
                border-color var(--haldo-transition),
                box-shadow var(--haldo-transition);
        }


        .haldo-menu-button:hover {
            transform: translateX(3px);
            background:
                rgba(110,170,255,.09);
            border-color:
                rgba(150,200,255,.14);
        }


        .haldo-menu-button.active {
            background:
                linear-gradient(
                    90deg,
                    rgba(80,150,255,.19),
                    rgba(80,150,255,.05)
                );

            border-color:
                rgba(140,200,255,.22);

            box-shadow:
                0 0 22px
                rgba(80,150,255,.10);
        }


        .haldo-menu-icon {
            width: 30px;
            height: 30px;

            display: grid;
            place-items: center;

            flex-shrink: 0;

            border-radius: 10px;

            background:
                rgba(255,255,255,.06);

            font-size: 15px;
        }


        .haldo-menu-text {
            min-width: 0;
            flex: 1;
        }


        .haldo-menu-title {
            font-size: 13px;
            font-weight: 650;
        }


        .haldo-menu-description {
            margin-top: 2px;
            font-size: 10px;
            color: var(--haldo-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        #haldo-sidebar-footer {
            padding-top: 12px;
            border-top:
                1px solid rgba(255,255,255,.07);
        }


        #haldo-system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px;
            font-size: 10px;
            color: var(--haldo-muted);
        }


        #haldo-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #55ff9a;
            box-shadow:
                0 0 10px rgba(85,255,154,.8);
        }


        /* =================================================
           DESKTOP CONTENT
           ================================================= */

        #haldo-desktop {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }


        #haldo-topbar {
            position: absolute;
            top: 18px;
            left:
                calc(
                    var(--haldo-sidebar-width)
                    + 38px
                );
            right: 18px;

            height: 58px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            background:
                rgba(5,10,25,.48);

            border:
                1px solid rgba(160,200,255,.10);

            border-radius: 18px;

            backdrop-filter:
                blur(18px);

            pointer-events: auto;
        }


        #haldo-current-page {
            font-size: 14px;
            font-weight: 650;
        }


        #haldo-topbar-actions {
            display: flex;
            gap: 7px;
        }


        .haldo-top-button {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 12px;
            background: rgba(255,255,255,.05);
            color: white;
        }


        /* =================================================
           APP WINDOW AREA
           ================================================= */

        #haldo-window-layer {
            position: absolute;
            top: 90px;
            left:
                calc(
                    var(--haldo-sidebar-width)
                    + 38px
                );
            right: 18px;
            bottom: 18px;

            pointer-events: none;
        }


        .haldo-window {
            position: absolute;

            min-width: 360px;
            min-height: 260px;

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    180deg,
                    rgba(11,18,40,.96),
                    rgba(4,8,20,.96)
                );

            border:
                1px solid rgba(160,205,255,.18);

            border-radius: 22px;

            box-shadow:
                0 30px 90px rgba(0,0,0,.48),
                0 0 40px rgba(70,140,255,.08);

            backdrop-filter:
                blur(24px);

            overflow: hidden;

            pointer-events: auto;
        }


        .haldo-window.hidden {
            display: none;
        }


        .haldo-window-header {
            min-height: 50px;

            display: flex;
            align-items: center;

            padding: 0 12px 0 16px;

            border-bottom:
                1px solid rgba(255,255,255,.07);
        }


        .haldo-window-title {
            flex: 1;
            font-size: 13px;
            font-weight: 700;
        }


        .haldo-window-actions {
            display: flex;
            gap: 5px;
        }


        .haldo-window-action {
            width: 32px;
            height: 32px;

            border:
                1px solid rgba(255,255,255,.08);

            border-radius: 9px;

            background:
                rgba(255,255,255,.05);

            color: white;
        }


        .haldo-window-body {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }


        /* =================================================
           HALDO AI
           ================================================= */

        #haldo-ai-window {
            left: 5%;
            top: 5%;
            width: 90%;
            height: 88%;
        }


        #haldo-ai-shell {
            height: 100%;
            display: flex;
            flex-direction: column;
        }


        #haldo-ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }


        .haldo-ai-message {
            max-width: 820px;
            margin-bottom: 14px;
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.55;
            font-size: 14px;
        }


        .haldo-ai-message.ai {
            background:
                rgba(80,145,255,.09);
            border:
                1px solid rgba(110,180,255,.10);
        }


        .haldo-ai-message.user {
            margin-left: auto;
            background:
                rgba(255,255,255,.07);
            border:
                1px solid rgba(255,255,255,.08);
        }


        #haldo-ai-composer {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top:
                1px solid rgba(255,255,255,.07);
        }


        #haldo-ai-input {
            flex: 1;
            min-height: 46px;
            max-height: 150px;
            resize: vertical;

            padding: 12px 14px;

            border:
                1px solid rgba(160,205,255,.14);

            border-radius: 14px;

            outline: none;

            background:
                rgba(0,0,0,.22);

            color: white;
        }


        .haldo-ai-send {
            min-width: 52px;
            border: 0;
            border-radius: 14px;
            background:
                linear-gradient(
                    135deg,
                    rgba(90,170,255,.85),
                    rgba(110,110,255,.75)
                );
            color: white;
        }


        /* =================================================
           APP LAUNCHER
           ================================================= */

        #haldo-app-launcher {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(170px, 1fr)
                );
            gap: 12px;
            padding: 18px;
        }


        .haldo-app-card {
            min-height: 125px;

            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-end;

            padding: 15px;

            border:
                1px solid rgba(160,205,255,.12);

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(50,80,140,.14),
                    rgba(255,255,255,.025)
                );

            color: white;

            text-align: left;

            transition:
                transform var(--haldo-transition),
                border-color var(--haldo-transition),
                background var(--haldo-transition);
        }


        .haldo-app-card:hover {
            transform: translateY(-3px);
            border-color:
                rgba(150,210,255,.28);
            background:
                rgba(90,150,255,.10);
        }


        .haldo-app-card-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            margin-bottom: auto;

            border-radius: 13px;

            background:
                rgba(255,255,255,.07);

            font-size: 20px;
        }


        .haldo-app-card-title {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 700;
        }


        .haldo-app-card-category {
            margin-top: 3px;
            font-size: 10px;
            color: var(--haldo-muted);
        }


        /* =================================================
           BOOT / LOADING
           ================================================= */

        #haldo-boot {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: grid;
            place-items: center;

            background:
                radial-gradient(
                    circle,
                    #101c40,
                    #02040c 70%
                );

            transition:
                opacity 600ms ease,
                visibility 600ms ease;
        }


        #haldo-boot.hidden {
            opacity: 0;
            visibility: hidden;
        }


        #haldo-boot-content {
            text-align: center;
        }


        #haldo-boot-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 28px
                    rgba(100,190,255,.75)
                );

            animation:
                haldo-boot-spin
                3s
                ease-in-out
                infinite;
        }


        @keyframes haldo-boot-spin {

            0% {
                transform: scale(.85)
                           rotate(0deg);
            }

            50% {
                transform: scale(1)
                           rotate(180deg);
            }

            100% {
                transform: scale(.85)
                           rotate(360deg);
            }
        }


        #haldo-boot-text {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: .08em;
            color: rgba(255,255,255,.78);
        }


        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 800px) {

            :root {
                --haldo-sidebar-width: 250px;
            }

            #haldo-sidebar {
                left: 10px;
                top: 10px;
                bottom: 10px;
            }

            #haldo-topbar {
                left:
                    calc(
                        var(--haldo-sidebar-width)
                        + 20px
                    );
                top: 10px;
            }

            #haldo-window-layer {
                left:
                    calc(
                        var(--haldo-sidebar-width)
                        + 20px
                    );
                top: 80px;
                right: 10px;
                bottom: 10px;
            }

            .haldo-window {
                min-width: 280px;
            }
        }

    </style>
</head>


<body>

<div id="haldo-os">

    <!-- =====================================================
         COSMIC WORLD
         ===================================================== -->

    <section
        id="cosmic-world"
        aria-label="HalDo Cosmic World"
    >

        <canvas
            id="cosmic-canvas"
            aria-hidden="true"
        ></canvas>

        <div
            class="cosmic-stars"
            id="cosmic-stars"
        ></div>

        <div
            class="cosmic-sun"
            id="cosmic-sun"
            aria-hidden="true"
        ></div>

        <div
            class="cosmic-orbit"
            style="
                width:360px;
                height:360px;
            "
        ></div>

        <div
            class="cosmic-orbit"
            style="
                width:560px;
                height:560px;
            "
        ></div>

        <div
            class="cosmic-orbit"
            style="
                width:790px;
                height:790px;
            "
        ></div>

        <div
            class="cosmic-planet planet-earth"
            id="planet-earth"
            aria-hidden="true"
        ></div>

        <div
            class="cosmic-planet planet-moon"
            id="planet-moon"
            aria-hidden="true"
        ></div>

    </section>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside id="haldo-sidebar">

        <header id="haldo-sidebar-header">

            <button
                id="haldo-logo-button"
                type="button"
                aria-label="HalDo Startseite"
                data-action="home"
            >
                <img
                    src="assets/logo/logo.png"
                    alt="HalDo"
                >
            </button>

            <div id="haldo-brand">

                <div id="haldo-brand-title">
                    HalDo AI OS 20
                </div>

                <div id="haldo-brand-subtitle">
                    Cosmic Intelligence
                </div>

            </div>

        </header>


        <div id="haldo-menu-scroll">

            <!-- CORE -->

            <section class="haldo-menu-section">

                <div class="haldo-menu-label">
                    HalDo
                </div>

                <button
                    class="haldo-menu-button active"
                    type="button"
                    data-action="home"
                >
                    <span class="haldo-menu-icon">⌂</span>

                    <span class="haldo-menu-text">
                        <span class="haldo-menu-title">
                            Home
                        </span>
                        <span class="haldo-menu-description">
                            Cosmic Desktop
                        </span>
                    </span>
                </button>


                <button
                    class="haldo-menu-button"
                    type="button"
                    data-action="ai"
                >
                    <span class="haldo-menu-icon">✦</span>

                    <span class="haldo-menu-text">
                        <span class="haldo-menu-title">
                            HalDo AI
                        </span>
                        <span class="haldo-menu-description">
                            Dein intelligenter Begleiter
                        </span>
                    </span>
                </button>


                <button
                    class="haldo-menu-button"
                    type="button"
                    data-action="apps"
                >
                    <span class="haldo-menu-icon">▦</span>

                    <span class="haldo-menu-text">
                        <span class="haldo-menu-title">
                            Alle Apps
                        </span>
                        <span class="haldo-menu-description">
                            Gesamte App-Landschaft
                        </span>
                    </span>
                </button>

            </section>


            <!-- SYSTEM -->

            <section class="haldo-menu-section">

                <div class="haldo-menu-label">
                    System
                </div>


                <button
                    class="haldo-menu-button"
                    type="button"
                    data-app-id="files"
                >
                    <span class="haldo-menu-icon">▣</span>
                    <span class="haldo-menu-text">
                        <span class="haldo-menu-title">
                            Dateien
                        </span>
                        <span class="haldo-menu-description">
                            Dateien und Speicher
                        </span>
                    </span>
                </button>


                <button
                    class="haldo-menu-button"
                    type="button"
                    data-app-id="settings"
                >
                    <span class="haldo-menu-icon">⚙</span>
                    <span class="haldo-menu-text">
                        <span class="haldo-menu-title">
                            Einstellungen
                        </span>
                        <span class="haldo-menu-description">
                            HalDo konfigurieren
                        </span>
                    </span>
                </button>


                <button
                    class="haldo-menu-button"
                    type="button"
                    data-app-id="system"
                >
                    <span class="haldo-menu-icon">◈</span>
                    <span class="haldo-menu-text">
                        <span class="haldo-menu-title">
                            System
                        </span>
                        <span class="haldo-menu-description">
                            Systemstatus und Diagnose
                        </span>
                    </span>
                </button>

            </section>


            <!-- CREATIVE -->

            <section class="haldo-menu-section">

                <div class="haldo-menu-label">
                    Medien
                </div>


                <button
                    class="haldo-menu-button"
                    type="button"
                    data-app-id="gallery"
                >
                    <span class="haldo-menu-icon">▧</span>
                    <span class="haldo-menu-text">
                        <span class="haldo-menu-title">
                            Galerie
                        </span>
                        <span class="haldo-menu-description">
                            Bilder und Medien
                        </span>
                    </span>
                </button>


                <button

<script>

"use strict";

(function (window, document) {

    const HalDoOS =
        window.HalDoOS ||
        (window.HalDoOS = {});


    const state = {

        currentPage:
            "home",

        openWindows:
            new Map(),

        zIndex:
            100,

        initialized:
            false

    };


    function normalizeId(value) {

        return String(value || "")
            .trim()
            .toLowerCase()
            .replace(
                /[^a-z0-9äöüßîêç_-]+/gi,
                "-"
            )
            .replace(
                /-+/g,
                "-"
            )
            .replace(
                /^-|-$/g,
                ""
            );

    }


    function getAppManager() {

        return (
            window.HalDoAppManager ||
            HalDoOS.appManager ||
            null
        );

    }


    function getAI() {

        return (
            window.HalDoAI ||
            HalDoOS.ai ||
            window.HalDoAICore ||
            HalDoOS.aiCore ||
            null
        );

    }


    function getWindowManager() {

        return (
            window.HalDoWindowManager ||
            HalDoOS.windowManager ||
            null
        );

    }


    function setStatus(
        text,
        ready = false
    ) {

        const element =
            document.getElementById(
                "haldo-status-text"
            );

        if (element) {
            element.textContent = text;
        }

        const dot =
            document.getElementById(
                "haldo-status-dot"
            );

        if (dot) {

            dot.style.background =
                ready
                    ? "#55ff9a"
                    : "#ffd35a";

            dot.style.boxShadow =
                ready
                    ? "0 0 10px rgba(85,255,154,.8)"
                    : "0 0 10px rgba(255,211,90,.8)";
        }

    }


    function setPageTitle(title) {

        const element =
            document.getElementById(
                "haldo-current-page"
            );

        if (element) {
            element.textContent =
                title;
        }

    }


    function updateActiveMenu(
        action,
        appId
    ) {

        document
            .querySelectorAll(
                ".haldo-menu-button"
            )
            .forEach(button => {

                const isAction =
                    button.dataset.action ===
                    action;

                const isApp =
                    normalizeId(
                        button.dataset.appId
                    ) ===
                    normalizeId(appId);

                button.classList.toggle(
                    "active",
                    isAction || isApp
                );

            });

    }


    function bringToFront(element) {

        if (!element) {
            return;
        }

        state.zIndex += 1;

        element.style.zIndex =
            String(state.zIndex);

    }


    function showWindow(
        id
    ) {

        const element =
            document.getElementById(id);

        if (!element) {
            return null;
        }

        element.classList.remove(
            "hidden"
        );

        bringToFront(element);

        state.openWindows.set(
            id,
            element
        );

        return element;
    }


    function hideWindow(
        id
    ) {

        const element =
            document.getElementById(id);

        if (!element) {
            return false;
        }

        element.classList.add(
            "hidden"
        );

        state.openWindows.delete(id);

        return true;
    }


    function openHome() {

        state.currentPage =
            "home";

        setPageTitle(
            "Cosmic Home"
        );

        updateActiveMenu(
            "home"
        );

        /*
         * Home bedeutet Desktop.
         * Vorhandene App-Fenster bleiben
         * erhalten, werden aber nicht
         * zwangsweise zerstört.
         */

        return true;
    }


    function openAI() {

        state.currentPage =
            "ai";

        setPageTitle(
            "HalDo AI"
        );

        updateActiveMenu(
            "ai"
        );

        showWindow(
            "haldo-ai-window"
        );

        return true;
    }


    function openApps() {

        state.currentPage =
            "apps";

        setPageTitle(
            "Alle HalDo Apps"
        );

        updateActiveMenu(
            "apps"
        );

        renderApps();

        showWindow(
            "haldo-apps-window"
        );

        return true;
    }


    async function openApp(
        appId,
        options = {}
    ) {

        const id =
            normalizeId(appId);

        if (!id) {
            return null;
        }

        /*
         * Zentrale App-Manager-Verbindung.
         */

        const manager =
            getAppManager();

        if (
            manager &&
            typeof manager.open ===
            "function"
        ) {

            try {

                const result =
                    await manager.open(
                        id,
                        options
                    );

                /*
                 * Falls der App Manager
                 * die App tatsächlich kennt,
                 * benutzen wir sein Ergebnis.
                 */

                if (result) {

                    setPageTitle(
                        result.app?.title ||
                        result.app?.name ||
                        id
                    );

                    updateActiveMenu(
                        null,
                        id
                    );

                    return result;
                }

            } catch (error) {

                console.error(
                    "[HalDo Shell] App Manager Open Error",
                    error
                );
            }
        }

        /*
         * Falls die Runtime-App noch keinen
         * eigenen Window-Adapter besitzt,
         * erzeugen wir einen App-Container.
         * Die eigentliche App-Logik bleibt
         * außerhalb der Shell.
         */

        return createFallbackAppWindow(
            id
        );

    }


    function createFallbackAppWindow(
        appId
    ) {

        const id =
            normalizeId(appId);

        const container =
            document.getElementById(
                "haldo-dynamic-windows"
            );

        if (!container) {
            return null;
        }

        const existing =
            document.querySelector(
                '[data-dynamic-app="' +
                id +
                '"]'
            );

        if (existing) {

            existing.classList.remove(
                "hidden"
            );

            bringToFront(existing);

            return {
                appId: id,
                window: existing
            };
        }


        const app =
            getAppManager()?.get?.(id) ||
            null;


        const title =
            app?.title ||
            app?.name ||
            id;


        const icon =
            app?.icon ||
            "◈";


        const window =
            document.createElement(
                "article"
            );

        window.className =
            "haldo-window";

        window.dataset.dynamicApp =
            id;

        window.style.left =
            "8%";

        window.style.top =
            "7%";

        window.style.width =
            "82%";

        window.style.height =
            "80%";

        window.innerHTML = `

            <header class="haldo-window-header">

                <div class="haldo-window-title">
                    ${icon} ${escapeHTML(title)}
                </div>

                <div class="haldo-window-actions">

                    <button
                        class="haldo-window-action"
                        type="button"
                        data-window-action="minimize"
                    >
                        −
                    </button>

                    <button
                        class="haldo-window-action"
                        type="button"
                        data-window-action="close"
                    >
                        ×
                    </button>

                </div>

            </header>

            <div
                class="haldo-window-body"
                data-app-root="${escapeHTML(id)}"
            >

                <div
                    style="
                        padding:24px;
                        color:rgba(255,255,255,.72);
                    "
                >

                    <h2
                        style="
                            margin-top:0;
                            color:white;
                        "
                    >
                        ${escapeHTML(title)}
                    </h2>

                    <p>
                        Die Runtime-Oberfläche dieser
                        App wird hier von ihrem eigenen
                        App-Modul geladen.
                    </p>

                </div>

            </div>
        `;


        container.appendChild(
            window
        );


        window
            .querySelector(
                '[data-window-action="close"]'
            )
            ?.addEventListener(
                "click",
                () => {

                    window.classList.add(
                        "hidden"
                    );

                }
            );


        window
            .querySelector(
                '[data-window-action="minimize"]'
            )
            ?.addEventListener(
                "click",
                () => {

                    window.classList.add(
                        "hidden"
                    );

                }
            );


        bringToFront(
            window
        );


        state.openWindows.set(
            id,
            window
        );


        /*
         * App-spezifisches Mount-System.
         */

        const event =
            new CustomEvent(
                "haldo:app-mount",
                {
                    detail: {
                        appId: id,
                        root:
                            window.querySelector(
                                "[data-app-root]"
                            ),
                        window,
                        app
                    }
                }
            );


        window.dispatchEvent(
            event
        );


        document.dispatchEvent(
            event
        );


        return {
            appId: id,
            window
        };

    }


    function escapeHTML(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    function renderApps() {

        const launcher =
            document.getElementById(
                "haldo-app-launcher"
            );

        const dynamicMenu =
            document.getElementById(
                "haldo-dynamic-menu"
            );

        if (!launcher) {
            return;
        }


        const manager =
            getAppManager();

        let apps = [];


        if (
            manager &&
            typeof manager.getAll ===
            "function"
        ) {

            try {
                apps =
                    manager.getAll() || [];
            } catch (_) {
                apps = [];
            }

        }


        launcher.innerHTML = "";


        if (dynamicMenu) {
            dynamicMenu.innerHTML = "";
        }


        if (!apps.length) {

            launcher.innerHTML = `

                <div
                    style="
                        grid-column:1/-1;
                        padding:30px;
                        color:rgba(255,255,255,.65);
                    "
                >
                    HalDo lädt die registrierten
                    Anwendungen …
                </div>

            `;

            return;
        }


        apps.forEach(app => {

            if (!app || !app.id) {
                return;
            }


            const id =
                normalizeId(app.id);


            const title =
                app.title ||
                app.name ||
                id;


            const icon =
                app.icon ||
                "◈";


            const category =
                app.category ||
                "App";


            const card =
                document.createElement(
                    "button"
                );

            card.type =
                "button";

            card.className =
                "haldo-app-card";

            card.dataset.appId =
                id;


            card.innerHTML = `

                <span
                    class="haldo-app-card-icon"
                >
                    ${escapeHTML(icon)}
                </span>

                <span
                    class="haldo-app-card-title"
                >
                    ${escapeHTML(title)}
                </span>

                <span
                    class="haldo-app-card-category"
                >
                    ${escapeHTML(category)}
                </span>

            `;


            card.addEventListener(
                "click",
                () => {

                    openApp(
                        id
                    );

                }
            );


            launcher.appendChild(
                card
            );


            if (dynamicMenu) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "haldo-menu-button";

                button.dataset.appId =
                    id;


                button.innerHTML = `

                    <span
                        class="haldo-menu-icon"
                    >
                        ${escapeHTML(icon)}
                    </span>

                    <span
                        class="haldo-menu-text"
                    >

                        <span
                            class="haldo-menu-title"
                        >
                            ${escapeHTML(title)}
                        </span>

                        <span
                            class="haldo-menu-description"
                        >
                            ${escapeHTML(category)}
                        </span>

                    </span>

                `;


                button.addEventListener(
                    "click",
                    () => {

                        openApp(
                            id
                        );

                    }
                );


                dynamicMenu.appendChild(
                    button
                );

            }

        });

    }


    /* =====================================================
       MENU EVENTS
       ===================================================== */

    document
        .addEventListener(
            "click",
            event => {

                const actionButton =
                    event.target.closest(
                        "[data-action]"
                    );

                if (actionButton) {

                    const action =
                        actionButton.dataset.action;

                    if (action === "home") {
                        openHome();
                    }

                    if (action === "ai") {
                        openAI();
                    }

                    if (action === "apps") {
                        openApps();
                    }

                    return;
                }


                const appButton =
                    event.target.closest(
                        "[data-app-id]"
                    );

                if (appButton) {

                    openApp(
                        appButton.dataset.appId
                    );

                }

            }
        );


    /* =====================================================
       WINDOW EVENTS
       ===================================================== */

    document
        .addEventListener(
            "click",
            event => {

                const action =
                    event.target.closest(
                        "[data-window-action]"
                    );

                if (!action) {
                    return;
                }


                const windowId =
                    action.dataset.windowId ||
                    action
                        .closest(
                            ".haldo-window"
                        )
                        ?.id;


                const windowElement =
                    windowId
                        ? document.getElementById(
                            windowId
                        )
                        : action.closest(
                            ".haldo-window"
                        );


                if (!windowElement) {
                    return;
                }


                const type =
                    action.dataset.windowAction;


                if (type === "close") {

                    windowElement.classList.add(
                        "hidden"
                    );

                    return;
                }


                if (type === "minimize") {

                    windowElement.classList.add(
                        "hidden"
                    );

                    return;
                }

            }
        );


    /* =====================================================
       HALDO AI UI
       ===================================================== */

    async function handleAIMessage(
        text
    ) {

        const input =
            document.getElementById(
                "haldo-ai-input"
            );

        const messages =
            document.getElementById(
                "haldo-ai-messages"
            );


        const value =
            String(text || "")
                .trim();


        if (!value) {
            return;
        }


        appendAIMessage(
            value,
            "user"
        );


        if (input) {
            input.value = "";
        }


        const ai =
            getAI();


        /*
         * Bestehende HalDo-AI-Runtime
         * verwenden, wenn vorhanden.
         */

        if (ai) {

            const methods = [

                "chat",
                "ask",
                "respond",
                "process",
                "sendMessage"

            ];


            for (
                const method
                of methods
            ) {

                if (
                    typeof ai[method] ===
                    "function"
                ) {

                    try {

                        const result =
                            await Promise.resolve(
                                ai[method](
                                    value
                                )
                            );


                        const response =
                            typeof result ===
                            "string"

                                ? result

                                : (
                                    result?.text ||
                                    result?.response ||
                                    result?.message ||
                                    ""
                                );


                        if (response) {

                            appendAIMessage(
                                response,
                                "ai"
                            );

                            return;

                        }

                    } catch (error) {

                        console.error(
                            "[HalDo AI]",
                            error
                        );

                    }

                }

            }

        }


        /*
         * Kein AI-Provider geladen:
         * verständliche Systemmeldung
         * statt Fake-Antwort.
         */

        appendAIMessage(
            "HalDo AI ist mit der Oberfläche verbunden, aber der eigentliche AI-Service ist noch nicht verfügbar.",
            "ai"
        );

    }


    function appendAIMessage(
        text,
        type
    ) {

        const messages =
            document.getElementById(
                "haldo-ai-messages"
            );

        if (!messages) {
            return;
        }


        const message =
            document.createElement(
                "div"
            );


        message.className =
            "haldo-ai-message " +
            (
                type === "user"
                    ? "user"
                    : "ai"
            );


        message.textContent =
            String(text);


        messages.appendChild(
            message
        );


        messages.scrollTop =
            messages.scrollHeight;

    }


    document
        .getElementById(
            "haldo-ai-composer"
        )
        ?.addEventListener(
            "submit",
            event => {

                event.preventDefault();

                const input =
                    document.getElementById(
                        "haldo-ai-input"
                    );

                handleAIMessage(
                    input?.value || ""
                );

            }
        );


    /* =====================================================
       COSMIC STARS
       ===================================================== */

    function createStars() {

        const container =
            document.getElementById(
                "cosmic-stars"
            );

        if (!container) {
            return;
        }


        container.innerHTML = "";


        const count =
            Math.min(
                220,
                Math.max(
                    90,
                    Math.floor(
                        window.innerWidth *
                        window.innerHeight /
                        7000
                    )
                )
            );


        for (
            let i = 0;
            i < count;
            i++
        ) {

            const star =
                document.createElement(
                    "span"
                );


            star.className =
                "cosmic-star";


            const size =
                Math.random() *
                3.5 +
                .7;


            star.style.width =
                size + "px";

            star.style.height =
                size + "px";

            star.style.left =
                Math.random() * 100 +
                "%";

            star.style.top =
                Math.random() * 100 +
                "%";


            star.style.setProperty(
                "--duration",
                (
                    1.5 +
                    Math.random() * 5
                ) +
                "s"
            );


            star.style.animationDelay =
                (
                    Math.random() * 5
                ) +
                "s";


            container.appendChild(
                star
            );

        }

    }


    /* =====================================================
       SIMPLE COSMIC MOTION
       ===================================================== */

    function startCosmicMotion() {

        const earth =
            document.getElementById(
                "planet-earth"
            );

        const moon =
            document.getElementById(
                "planet-moon"
            );


        let time =
            0;


        function frame() {

            time += .003;


            if (earth) {

                const radius =
                    180;

                const x =
                    Math.cos(time) *
                    radius;

                const y =
                    Math.sin(time) *
                    radius *
                    .58;


                earth.style.transform =
                    `
                    translate(
                        ${x - 50}px,
                        ${y - 50}px
                    )
                    `;

            }


            if (moon) {

                const radius =
                    55;

                const moonTime =
                    time * 3.8;

                const x =
                    Math.cos(moonTime) *
                    radius;

                const y =
                    Math.sin(moonTime) *
                    radius *
                    .65;


                moon.style.transform =
                    `
                    translate(
                        ${x - 14}px,
                        ${y - 14}px
                    )
                    `;

            }


            requestAnimationFrame(
                frame
            );

        }


        requestAnimationFrame(
            frame
        );

    }


    /* =====================================================
       SYSTEM CONNECTION
       ===================================================== */

    function connectSystem() {

        const manager =
            getAppManager();


        if (
            manager &&
            typeof manager.on ===
            "function"
        ) {

            manager.on(
                "ready",
                () => {

                    setStatus(
                        "HalDo System bereit",
                        true
                    );

                    renderApps();

                }
            );


            manager.on(
                "registered",
                () => {

                    renderApps();

                }
            );


            manager.on(
                "registry-synchronized",
                () => {

                    renderApps();

                }
            );


            manager.on(
                "app-opened",
                payload => {

                    if (
                        payload?.app?.id
                    ) {

                        setPageTitle(
                            payload.app.title ||
                            payload.app.name ||
                            payload.app.id
                        );

                    }

                }
            );

        }

    }


    /* =====================================================
       BOOT
       ===================================================== */

    async function initializeShell() {

        if (state.initialized) {
            return;
        }


        state.initialized =
            true;


        setStatus(
            "HalDo System wird verbunden …"
        );


        createStars();

        startCosmicMotion();

        connectSystem();


        /*
         * Apps nach kurzer Verzögerung
         * erneut aus Registry lesen,
         * da die Kernel-/Registry-
         * Initialisierung asynchron sein kann.
         */

        renderApps();


        setTimeout(
            renderApps,
            500
        );


        setTimeout(
            renderApps,
            1500
        );


        setTimeout(
            () => {

                const boot =
                    document.getElementById(
                        "haldo-boot"
                    );

                if (boot) {
                    boot.classList.add(
                        "hidden"
                    );
                }

                setStatus(
                    "HalDo System bereit",
                    true
                );

            },
            1800
        );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeShell,
            {
                once: true
            }
        );

    } else {

        initializeShell();

    }


    /* =====================================================
       PUBLIC SHELL API
       ===================================================== */

    const shell = {

        version:
            "20.1.0",

        openHome,

        openAI,

        openApps,

        openApp,

        renderApps,

        showWindow,

        hideWindow,

        getState() {

            return {

                currentPage:
                    state.currentPage,

                openWindows:
                    Array.from(
                        state.openWindows.keys()
                    )

            };

        }

    };


    window.HalDoShell =
        shell;

    HalDoOS.shell =
        shell;


})(window, document);

</script>
