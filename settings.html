<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
HalDo AI OS - Einstellungen
</title>


<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/responsive.css">


</head>


<body>


<div class="os-container">


<header class="system-header">


<img
src="assets/logo.png"
alt="HalDo AI Logo"
class="logo"
>


<h1>
⚙️ Einstellungen
</h1>


<p>
HalDo AI OS Professional 16.0
</p>


</header>




<main id="app">


<section class="settings-panel">


<h2>
System Einstellungen
</h2>





<div
id="current-theme"
class="card"
>

🌙 Theme: dark

</div>





<div
id="current-language"
class="card"
>

🌍 Sprache: de

</div>






<div class="settings-actions">



<button onclick="changeTheme()">

🌙 Theme ändern

</button>




<button onclick="changeLanguage()">

🌍 Sprache ändern

</button>



</div>






<button onclick="goHome()">

⬅️ Zurück

</button>



</section>


</main>



<footer>

HalDo AI OS Professional 16.0

</footer>



</div>





<!-- Core -->

<script src="core/config.js"></script>
<script src="core/logger.js"></script>
<script src="core/events.js"></script>
<script src="core/storage.js"></script>
<script src="core/kernel.js"></script>
<script src="core/router.js"></script>
<script src="core/system.js"></script>


<!-- Application -->

<script src="js/navigation.js"></script>
<script src="js/modules.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>




<script>


function changeTheme(){


HalDoSettings.saveTheme(

"dark"

);


alert(

"Theme gespeichert"

);


}





function changeLanguage(){


HalDoSettings.saveLanguage(

"de"

);


alert(

"Sprache gespeichert"

);


}



</script>


</body>

</html>
