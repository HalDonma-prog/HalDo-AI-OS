<!--
============================================================
 HALDO AI OS 18
 LOGO INTRO COMPONENT
 Professional Ultimate Foundation
============================================================

 Datei:
 components/logo-intro.html

 Zweck:
 - HalDo AI Start-Intro
 - echtes HalDo Logo
 - leuchtende Energie-Umlaufbahn
 - Sonnen-/Planeten-Glow
 - Partikel
 - AI-Begrüßung
 - Sprachstatus
 - Vorbereitung für Mund-/Sprechbewegung

 WICHTIG:
 Das Logo selbst wird NICHT gedreht.
 Nur die Licht-/Energieelemente bewegen sich.
============================================================
-->


<section
    id="haldo-logo-intro"
    class="haldo-logo-intro"
    data-haldo-logo-intro
    aria-label="HalDo AI Startanimation"
>


    <!-- ====================================================
         HINTERGRUND-ENERGIE
         ==================================================== -->

    <div
        class="haldo-intro-background-energy"
        aria-hidden="true"
    ></div>


    <!-- ====================================================
         LOGO CONTAINER
         ==================================================== -->

    <div
        class="haldo-logo-container"
        data-haldo-logo-container
    >


        <!-- ================================================
             LOGO STAGE
             ================================================ -->

        <div
            class="haldo-logo-stage"
            data-haldo-logo-stage
        >


            <!-- ============================================
                 SONNEN-GLOW
                 ============================================ -->

            <div
                class="haldo-logo-glow"
                data-haldo-logo-glow
                aria-hidden="true"
            ></div>


            <!-- ============================================
                 LICHT-/PLANETEN-ORBIT
                 ============================================ -->

            <div
                class="haldo-logo-orbit"
                data-haldo-logo-orbit
                aria-hidden="true"
            ></div>


            <!-- ============================================
                 PARTIKEL
                 ============================================ -->

            <div
                class="haldo-logo-particles"
                data-haldo-logo-particles
                aria-hidden="true"
            ></div>


            <!-- ============================================
                 ECHTES HALDO LOGO
                 ============================================ -->

            <img
                src="assets/logo/logo.png"
                alt="HalDo AI"
                class="haldo-logo-image"
                data-haldo-logo-image
                draggable="false"
            >


            <!-- ============================================
                 SPEECH / MUND LAYER
                 ============================================

                 Diese Ebene liegt über dem Logo und kann
                 später mit echter Sprachlautstärke gesteuert
                 werden.

                 Das Bild selbst wird nicht verändert.
                 ============================================ -->

            <div
                class="haldo-logo-speech-layer"
                data-haldo-logo-speech
                aria-hidden="true"
            ></div>


        </div>


    </div>


    <!-- ====================================================
         BEGRÜSSUNGSBEREICH
         ==================================================== -->

    <div
        class="haldo-intro-welcome"
        data-haldo-intro-welcome
    >


        <!-- =================================================
             HALDO NAME
             ================================================= -->

        <div
            class="haldo-intro-brand"
        >

            <span
                class="haldo-intro-brand-name"
            >
                HalDo AI
            </span>

        </div>


        <!-- =================================================
             BEGRÜSSUNG
             ================================================= -->

        <h1
            class="haldo-intro-title"
            data-haldo-intro-title
        >
            Willkommen bei HalDo AI
        </h1>


        <!-- =================================================
             UNTERTITEL
             ================================================= -->

        <p
            class="haldo-intro-subtitle"
            data-haldo-intro-subtitle
        >
            HalDo AI OS 18
        </p>


        <!-- =================================================
             SPRACHSTATUS
             ================================================= -->

        <div
            class="haldo-intro-speech-status"
            data-haldo-speech-status
            aria-live="polite"
        >


            <span
                class="haldo-speech-indicator"
                data-haldo-speech-indicator
                aria-hidden="true"
            ></span>


            <span
                class="haldo-speech-status-text"
                data-haldo-speech-status-text
            >
                HalDo AI wird gestartet…
            </span>


        </div>


    </div>


    <!-- ====================================================
         START / ÜBERSPRINGEN
         ==================================================== -->

    <div
        class="haldo-intro-controls"
    >


        <button
            type="button"
            class="haldo-intro-skip"
            data-haldo-intro-skip
        >
            Überspringen
        </button>


    </div>


    <!-- ====================================================
         STATUS
         ==================================================== -->

    <div
        class="haldo-intro-system-status"
        data-haldo-intro-system-status
        aria-live="polite"
    >

        <span
            class="haldo-intro-status-dot"
            data-haldo-intro-status-dot
            aria-hidden="true"
        ></span>

        <span
            data-haldo-intro-status-text
        >
            System wird geladen…
        </span>

    </div>


</section>
