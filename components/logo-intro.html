<!-- ================================================================
     HALDO AI OS 24 – LOGO INTRO COMPONENT
     Version: 24.6.0
     Build: 2026-08-31
     ================================================================ -->

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HalDo OS – Logo Intro</title>
    <style>
        /* ==============================================================
           LOGO INTRO – KOMPLETTES CSS
           ============================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-intro: #0a0a1a;
            --accent-1: #00d4ff;
            --accent-2: #7b2ffc;
            --text-primary: #e8eef5;
            --text-secondary: #8899bb;
            --shadow-glow: 0 0 60px rgba(0, 212, 255, 0.3);
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-intro);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== INTRO CONTAINER ===== */
        #intro-container {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: var(--bg-intro);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #intro-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ===== LOGO CONTAINER ===== */
        .logo-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* ===== LOGO BILD ===== */
        .logo-intro-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            animation: logoPulse 2.8s ease-in-out infinite;
            filter: drop-shadow(0 0 50px rgba(0, 212, 255, 0.3));
            z-index: 2;
            position: relative;
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.2));
            }
            50% {
                transform: scale(1.06);
                filter: drop-shadow(0 0 80px rgba(123, 47, 252, 0.5));
            }
        }

        /* ===== LOGO RINGE ===== */
        .logo-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, 0.06);
            animation: ringSpin linear infinite;
            pointer-events: none;
        }
        .logo-ring:nth-child(1) {
            inset: -10px;
            border-color: rgba(0, 212, 255, 0.08);
            animation-duration: 10s;
        }
        .logo-ring:nth-child(2) {
            inset: -25px;
            border-color: rgba(123, 47, 252, 0.06);
            animation-duration: 14s;
            animation-direction: reverse;
        }
        .logo-ring:nth-child(3) {
            inset: -40px;
            border-color: rgba(255, 255, 255, 0.03);
            animation-duration: 18s;
        }
        .logo-ring:nth-child(4) {
            inset: -55px;
            border-color: rgba(0, 212, 255, 0.04);
            animation-duration: 22s;
            animation-direction: reverse;
        }

        @keyframes ringSpin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== TITEL ===== */
        .intro-title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 4px;
            animation: titleFade 1.2s ease-out forwards;
            opacity: 0;
        }

        @keyframes titleFade {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== SUBTITLE ===== */
        .intro-subtitle {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0.5;
            animation: subtitleFade 1.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes subtitleFade {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 0.5;
                transform: translateY(0);
            }
        }

        /* ===== LOADER ===== */
        .intro-loader {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid var(--accent-1);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 14px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== STATUS TEXT ===== */
        .intro-status {
            font-size: 0.7rem;
            color: var(--text-secondary);
            animation: pulse 1.4s ease-in-out infinite;
            min-height: 20px;
            text-align: center;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        /* ===== PROGRESS BAR ===== */
        .intro-progress {
            width: 280px;
            height: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 3px;
            margin-top: 14px;
            overflow: hidden;
            position: relative;
        }
        .intro-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .intro-progress-text {
            font-size: 0.45rem;
            color: var(--text-secondary);
            margin-top: 6px;
            letter-spacing: 2px;
            opacity: 0.4;
        }

        /* ===== VERSION ===== */
        .intro-version {
            position: fixed;
            bottom: 20px;
            right: 24px;
            font-size: 0.45rem;
            color: var(--text-secondary);
            opacity: 0.2;
            letter-spacing: 1px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .logo-wrapper {
                width: 120px;
                height: 120px;
            }
            .intro-title {
                font-size: 2rem;
            }
            .intro-subtitle {
                font-size: 0.55rem;
                letter-spacing: 5px;
            }
            .intro-progress {
                width: 200px;
            }
            .logo-ring:nth-child(3) {
                inset: -30px;
            }
            .logo-ring:nth-child(4) {
                inset: -42px;
            }
        }

        @media (max-width: 380px) {
            .logo-wrapper {
                width: 90px;
                height: 90px;
            }
            .intro-title {
                font-size: 1.6rem;
            }
            .intro-subtitle {
                font-size: 0.5rem;
                letter-spacing: 4px;
            }
            .intro-progress {
                width: 160px;
            }
            .logo-ring:nth-child(3) {
                inset: -22px;
            }
            .logo-ring:nth-child(4) {
                inset: -32px;
            }
        }

        /* ===== SAFARI FIXES ===== */
        @supports (-webkit-touch-callout: none) {
            .logo-intro-img {
                -webkit-user-select: none;
            }
        }

        /* ===== PARTICLE EFFECT (optional) ===== */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent);
            pointer-events: none;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ===== INTRO CONTAINER ===== -->
    <div id="intro-container">

        <!-- ===== LOGO ===== -->
        <div class="logo-wrapper" id="logo-wrapper">
            <!-- Ringe -->
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>

            <!-- Logo Bild -->
            <img src="../assets/images/logo.png" alt="HalDo Logo" class="logo-intro-img" id="logo-intro-img"
            onerror="this.style.display='none'; document.getElementById('logo-fallback-intro').style.display='flex';" />

            <!-- Logo Fallback (⟡ Symbol) -->
            <div id="logo-fallback-intro" style="display:none;font-size:4.5rem;font-weight:900;background:linear-gradient(135deg,#00d4ff,#7b2ffc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:4px;z-index:2;position:relative;">
                ⟡
            </div>
        </div>

        <!-- ===== TITEL ===== -->
        <div class="intro-title">HalDo OS</div>
        <div class="intro-subtitle">Cosmic Intelligent Operating System</div>

        <!-- ===== LOADER ===== -->
        <div class="intro-loader"></div>

        <!-- ===== STATUS ===== -->
        <div class="intro-status" id="intro-status">⟡ System wird gestartet ...</div>

        <!-- ===== PROGRESS ===== -->
        <div class="intro-progress">
            <div class="intro-progress-bar" id="intro-progress-bar"></div>
        </div>
        <div class="intro-progress-text" id="intro-progress-text">0%</div>

        <!-- ===== VERSION ===== -->
        <div class="intro-version">HalDo OS v24.6.0</div>
    </div>

    <!-- ================================================================
    JAVASCRIPT – LOGO INTRO
    ================================================================ -->
    <script>
        'use strict';

        // ================================================================
        //  LOGO INTRO – KOMPLETTE LOGIK
        // ================================================================

        (function() {
            'use strict';

            // ============================================================
            //  KONFIGURATION
            // ============================================================
            var CONFIG = {
                version: '24.6.0',
                build: '2026.08.31',
                steps: [
                    { text: '⟡ Kernel wird geladen ...', progress: 8 },
                    { text: '⟡ System initialisiert ...', progress: 20 },
                    { text: '⟡ Cosmic World startet ...', progress: 35 },
                    { text: '⟡ HalDo AI wird aktiviert ...', progress: 50 },
                    { text: '⟡ Apps werden geladen ...', progress: 68 },
                    { text: '⟡ Living AI wird gestartet ...', progress: 80 },
                    { text: '⟡ System-Update wird geprüft ...', progress: 90 },
                    { text: '⟡ HalDo OS ist READY 🚀', progress: 100 }
                ],
                stepDuration: 380,
                particleCount: 12
            };

            // ============================================================
            //  DOM-REFERENZEN
            // ============================================================
            var DOM = {
                container: document.getElementById('intro-container'),
                status: document.getElementById('intro-status'),
                progressBar: document.getElementById('intro-progress-bar'),
                progressText: document.getElementById('intro-progress-text'),
                logoWrapper: document.getElementById('logo-wrapper')
            };

            // ============================================================
            //  HELPER
            // ============================================================
            function log(msg) {
                console.log('[Logo-Intro]', msg);
            }

            // ============================================================
            //  PARTICLES (Cosmic Effekt)
            // ============================================================
            function createParticles() {
                var wrapper = DOM.logoWrapper;
                for (var i = 0; i < CONFIG.particleCount; i++) {
                    var particle = document.createElement('div');
                    particle.className = 'particle';
                    var size = Math.random() * 6 + 2;
                    var angle = Math.random() * Math.PI * 2;
                    var distance = Math.random() * 80 + 30;
                    var tx = Math.cos(angle) * distance;
                    var ty = Math.sin(angle) * distance;
                    var duration = Math.random() * 3 + 2;
                    particle.style.cssText =
                        'width:' + size + 'px;height:' + size + 'px;' +
                        'top:50%;left:50%;' +
                        '--tx:' + tx + 'px;--ty:' + ty + 'px;' +
                        'animation-duration:' + duration + 's;' +
                        'animation-delay:' + (Math.random() * 2) + 's;' +
                        'background:radial-gradient(circle,rgba(0,212,255,' + (Math.random() * 0.15 + 0.05) +
                        '),transparent);';
                    wrapper.appendChild(particle);
                }
                log('✨ ' + CONFIG.particleCount + ' Partikel erstellt');
            }

            // ============================================================
            //  BOOT SEQUENCE
            // ============================================================
            function bootSequence() {
                var i = 0;
                DOM.status.textContent = CONFIG.steps[0].text;
                DOM.progressBar.style.width = '2%';
                DOM.progressText.textContent = '2%';

                var interval = setInterval(function() {
                    i++;
                    if (i < CONFIG.steps.length) {
                        DOM.status.textContent = CONFIG.steps[i].text;
                        DOM.progressBar.style.width = CONFIG.steps[i].progress + '%';
                        DOM.progressText.textContent = CONFIG.steps[i].progress + '%';
                        log('Fortschritt: ' + CONFIG.steps[i].progress + '%');
                    } else {
                        clearInterval(interval);
                        log('✅ Boot abgeschlossen');
                        setTimeout(function() {
                            DOM.container.classList.add('hidden');
                            log('🚀 Intro beendet – Übergang zum Hauptsystem');
                            // Event für Hauptsystem auslösen
                            var event = new CustomEvent('introComplete');
                            document.dispatchEvent(event);
                        }, 600);
                    }
                }, CONFIG.stepDuration);
            }

            // ============================================================
            //  INIT
            // ============================================================
            function init() {
                log('🚀 Logo-Intro gestartet (v' + CONFIG.version + ')');
                createParticles();
                // Kurze Verzögerung für Animation
                setTimeout(function() {
                    bootSequence();
                }, 400);
            }

            // Start wenn DOM bereit
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // ============================================================
            //  GLOBALE EXPOSURE (für Hauptsystem)
            // ============================================================
            window.HalDoIntro = {
                CONFIG: CONFIG,
                boot: bootSequence,
                setStatus: function(text, progress) {
                    DOM.status.textContent = text;
                    if (progress !== undefined) {
                        DOM.progressBar.style.width = progress + '%';
                        DOM.progressText.textContent = progress + '%';
                    }
                },
                hide: function() {
                    DOM.container.classList.add('hidden');
                }
            };

        })();
    </script>

</body>
</html>
