<svg width="512" height="512" viewBox="0 0 512 512"
xmlns="http://www.w3.org/2000/svg">

<defs>

    <radialGradient id="coreGlow">
        <stop offset="0%" stop-color="#00E5FF"/>
        <stop offset="45%" stop-color="#4DA6FF"/>
        <stop offset="100%" stop-color="#8B5CFF"/>
    </radialGradient>


    <filter id="glow">
        <feGaussianBlur stdDeviation="12"
        result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>


<!-- äußerer Lichtkreis -->

<circle
cx="256"
cy="256"
r="220"
fill="none"
stroke="#00E5FF"
stroke-width="8"
opacity="0.8"
filter="url(#glow)"
/>


<!-- Hauptkreis -->

<circle
cx="256"
cy="256"
r="180"
fill="url(#coreGlow)"
filter="url(#glow)"
/>


<!-- HalDo Symbol Platzhalter -->

<text
x="256"
y="280"
text-anchor="middle"
font-size="120"
font-family="Arial"
font-weight="bold"
fill="white">

H

</text>


</svg>