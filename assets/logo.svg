<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

<defs>

<radialGradient id="bg">

<stop offset="0%" stop-color="#ffffff"/>

<stop offset="35%" stop-color="#00e5ff"/>

<stop offset="70%" stop-color="#0066ff"/>

<stop offset="100%" stop-color="#00152e"/>

</radialGradient>


<filter id="glow">

<feGaussianBlur stdDeviation="12" result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>


</defs>



<circle

cx="250"

cy="250"

r="180"

fill="url(#bg)"

filter="url(#glow)"/>




<circle

cx="250"

cy="250"

r="150"

fill="none"

stroke="#ffffff"

stroke-width="6"

opacity="0.8"/>




<text

x="250"

y="320"

text-anchor="middle"

font-family="Arial"

font-size="230"

font-weight="bold"

fill="white"

filter="url(#glow)">

H

</text>



</svg>