name: HalDo AI OS Check

on:
  push:
    branches:
      - main

jobs:
  website-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prüfe index.html
        run: |
          if [ ! -f index.html ]; then
            echo "❌ index.html fehlt"
            exit 1
          fi
          echo "✅ index.html gefunden"

      - name: Fertig
        run: echo "🟢 HalDo AI OS ist bereit"