# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno then run `deno lint` and `deno test`.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      - name: Run linter (JSON output)
        run: |
          # produce machine-readable lint output but don't let this step abort the workflow
          deno lint --json | tee deno-lint.json || true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deno-lint-report
          path: deno-lint.json

      - name: Fail if lint problems
        run: |
          # Count JSON diagnostics and fail the job if any problems were found
          python3 - <<'PY'
import json, sys
try:
    data = json.load(open('deno-lint.json'))
except Exception as e:
    print('Could not parse deno-lint.json:', e)
    # If the file can't be parsed, preserve original behavior and fail
    sys.exit(1)
problems = len(data) if isinstance(data, list) else 0
if problems > 0:
    print(f'Found {problems} lint problem(s) — see deno-lint.json artifact for details')
    sys.exit(1)
print('No lint problems')
PY

      - name: Run tests
        run: deno test -A
